name: Runtime optimization review
on:
  push:
    branches: [perf/audit-export-continuations]
    paths: [.github/workflows/runtime-optimization-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/skillmind-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-review-source
          path: ${{ runner.temp }}/skillmind-source.zip
          retention-days: 1
