name: Multi-resource routing review
on:
  push:
    branches: [feat/multi-resource-routing]
    paths:
      - .github/prepare_multi_resource.py
      - .github/publish_multi_resource.py
      - .github/fix_multi_resource.py
      - .github/workflows/multi-resource-review.yml
permissions:
  contents: read
env:
  SKILLMIND_ENVIRONMENT: test
  SKILLMIND_DATABASE_URL: postgresql+asyncpg://skillmind:skillmind@127.0.0.1:1/skillmind_test
  SKILLMIND_REDIS_URL: redis://127.0.0.1:1/15
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            scope: tests/api
          - group: skills
            scope: tests/skills tests/core tests/contracts
          - group: runtime
            scope: tests/agent tests/worker tests/runs tests/effects tests/artifacts tests/integrations
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: SKM/backend
        run: python -m pip install -q -r dev-requirements.lock && python -m pip install -q --no-deps -e .
      - name: Prepare exact reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/prepare_multi_resource.py
      - name: Preserve prepared source for review
        if: matrix.group == 'runtime'
        run: |
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root / 'prepared-source.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for path in json.loads((root / 'multi-paths.json').read_text()):
                  out.write(path, path)
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.group == 'runtime'
        with:
          name: multi-prepared-source
          path: ${{ runner.temp }}/prepared-source.zip
          retention-days: 7
      - name: Verify same-type resources and native SDK routing
        working-directory: SKM/backend
        run: >-
          python -m pytest tests/agent/test_resource_tool_routing.py
          tests/agent/test_mcp_context.py
          tests/agent/test_codex_native.py::test_native_same_capability_routes_two_resources_in_one_turn
          --junitxml="$RUNNER_TEMP/focused.xml"
      - name: Check all application types
        if: matrix.group == 'runtime'
        working-directory: SKM/backend
        run: python -m mypy --no-incremental src/skillmind
      - name: Related backend regression
        working-directory: SKM/backend
        run: python -m pytest ${{ matrix.scope }} --junitxml="$RUNNER_TEMP/results.xml"
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-regression-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/source-fingerprint.json
            ${{ runner.temp }}/focused.xml
            ${{ runner.temp }}/results.xml
          retention-days: 7
  finalize:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: SKM/backend
        run: python -m pip install -q -r dev-requirements.lock && python -m pip install -q --no-deps -e .
      - name: Reproduce tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/prepare_multi_resource.py
      - uses: actions/download-artifact@v4
        with:
          pattern: multi-regression-*
          path: ${{ runner.temp }}/groups
      - name: Verify contracts and documentation
        working-directory: SKM
        run: |
          python -m pip install -q -r scripts/docs-requirements.txt
          python scripts/validate_contracts.py
          python scripts/build_docs.py
          python scripts/build_docs.py --check
      - name: Publish verified application code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/publish_multi_resource.py
