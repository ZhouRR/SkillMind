name: Inline effect review
on:
  push:
    branches: [perf/inline-approved-effects]
    paths:
      - .github/prepare_inline.py
      - .github/publish_inline.py
      - .github/repair_inline.py
      - .github/finish_inline.py
      - .github/workflows/inline-effect-review.yml
permissions:
  contents: read
env:
  SKILLMIND_ENVIRONMENT: test
  SKILLMIND_DATABASE_URL: postgresql+asyncpg://skillmind:skillmind@127.0.0.1:1/skillmind_test
  SKILLMIND_REDIS_URL: redis://127.0.0.1:1/15
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            scope: tests/api
          - group: skills
            scope: tests/skills tests/core tests/contracts
          - group: runtime
            scope: tests/agent tests/worker tests/runs tests/effects tests/artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: SKM/backend
        run: python -m pip install -q -r dev-requirements.lock && python -m pip install -q --no-deps -e .
      - name: Prepare exact reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/prepare_inline.py
      - name: Preserve prepared source for review
        if: matrix.group == 'runtime'
        run: |
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'prepared-source.zip','w',zipfile.ZIP_DEFLATED) as out:
              for path in json.loads((root/'inline-paths.json').read_text()):
                  out.write(path,path)
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.group == 'runtime'
        with:
          name: inline-prepared-source
          path: ${{ runner.temp }}/prepared-source.zip
          retention-days: 7
      - name: Verify compact requests and inline lifecycle
        working-directory: SKM/backend
        run: >-
          python -m pytest tests/effects/test_compact_proposal.py
          tests/worker/test_inline_effects.py tests/runs/test_inline_effect_lane.py
          tests/agent/test_codex_native.py::test_native_inline_effect_returns_receipt_without_interrupting_turn
          tests/agent/test_task_brief.py::test_old_report_prompt_remains_byte_identical
          --junitxml="$RUNNER_TEMP/focused.xml"
      - name: Check all application types
        if: matrix.group == 'runtime'
        working-directory: SKM/backend
        run: python -m mypy --no-incremental src/skillmind
      - name: Check migration graph and generate SQL without a database connection
        if: matrix.group == 'runtime'
        working-directory: SKM/backend
        run: |
          python -m alembic heads
          python -m alembic upgrade 0055_run_deletion_audit:0056_inline_effect_owner --sql > "$RUNNER_TEMP/inline-migration.sql"
      - name: Related backend regression
        working-directory: SKM/backend
        run: python -m pytest ${{ matrix.scope }} --junitxml="$RUNNER_TEMP/results.xml"
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inline-regression-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/source-fingerprint.json
            ${{ runner.temp }}/focused.xml
            ${{ runner.temp }}/results.xml
            ${{ runner.temp }}/inline-migration.sql
          retention-days: 7
  finalize:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: SKM/backend
        run: python -m pip install -q -r dev-requirements.lock && python -m pip install -q --no-deps -e .
      - name: Reproduce tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/prepare_inline.py
      - uses: actions/download-artifact@v4
        with:
          pattern: inline-regression-*
          path: ${{ runner.temp }}/groups
      - name: Verify contracts and documentation
        working-directory: SKM
        run: |
          python -m pip install -q -r scripts/docs-requirements.txt
          python scripts/validate_contracts.py
          python scripts/build_docs.py
          python scripts/build_docs.py --check
      - name: Publish verified application code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/publish_inline.py
