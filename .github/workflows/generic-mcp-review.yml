name: Generic MCP execution review
on:
  push:
    branches: [perf/generic-mcp-execution]
permissions:
  contents: read
concurrency:
  group: generic-mcp-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SKILLMIND_ENVIRONMENT: test
      SKILLMIND_DATABASE_URL: postgresql+asyncpg://skillmind:skillmind@127.0.0.1:1/skillmind_test
      SKILLMIND_REDIS_URL: redis://127.0.0.1:1/15
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Apply reviewed changes to isolated checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/generic_mcp_patch.py
          python .github/generic_mcp_finish.py
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          sha = '5e093eef7720440102df91a2c6ec7e224046c403'
          request = urllib.request.Request('https://api.github.com/repos/ZhouRR/SkillMind/git/blobs/' + sha, headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'User-Agent':'skillmind-reviewed-mcp-patch'})
          with urllib.request.urlopen(request, timeout=60) as response:
              content=base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()==sha
          exec(compile(content, 'reviewed_tuple_patch', 'exec'))
          PY
      - name: Install pinned application dependencies
        working-directory: SKM/backend
        run: python -m pip install -q -e '.[dev]'
      - name: Check changed Python source
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = [p for p in json.loads((Path(os.environ['RUNNER_TEMP'])/'generic-mcp-paths.json').read_text()) if p.endswith('.py')]
          subprocess.run(['python','-m','ruff','check','--config','SKM/backend/pyproject.toml','--no-cache','--select','I','--fix',*paths],check=True)
          subprocess.run(['python','-m','ruff','format','--config','SKM/backend/pyproject.toml','--no-cache',*paths],check=True)
          subprocess.run(['python','-m','ruff','check','--config','SKM/backend/pyproject.toml','--no-cache',*paths],check=True)
          PY
      - name: Run focused MCP and event regression tests
        working-directory: SKM/backend
        run: python -m pytest tests/agent/test_mcp_hot_path.py tests/runs/test_realtime_buffer.py tests/runs/test_mcp_run_approval.py tests/runs/test_run_start_approval.py tests/agent/test_mcp_generic.py tests/agent/test_mcp_tools.py tests/agent/test_mcp_tools_provider.py tests/agent/test_mcp_readback.py --import-mode=importlib -p no:cacheprovider -o addopts= -q --tb=short -rs
      - name: Check backend types
        working-directory: SKM/backend
        run: python -m mypy --no-incremental src/skillmind
      - name: Check frontend contracts and regression tests
        working-directory: SKM/web
        run: |
          npx -y pnpm@11.7.0 install --frozen-lockfile
          npx -y pnpm@11.7.0 typecheck
          npx -y pnpm@11.7.0 test
      - name: Regenerate API and documentation and validate contracts
        working-directory: SKM
        run: |
          python -m pip install -q -r scripts/docs-requirements.txt
          python scripts/export_openapi.py
          python scripts/validate_contracts.py
          python scripts/build_docs.py
          python scripts/build_docs.py --check
      - name: Run interpreter, agent, worker, run, effects and API suites
        working-directory: SKM/backend
        run: python -m pytest tests/skills tests/agent tests/worker tests/runs tests/effects tests/core tests/contracts tests/api --import-mode=importlib -p no:cacheprovider -o addopts= -q --tb=short -rs
      - name: Prepare validated tree without updating branch or creating PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/generic_mcp_patch.py --publish
