name: Verify and finalize generic MCP changes
on:
  push:
    branches: [perf/generic-mcp-execution]
permissions:
  contents: read
concurrency:
  group: generic-mcp-review-${{ github.ref }}
  cancel-in-progress: true
env:
  SKILLMIND_ENVIRONMENT: test
  SKILLMIND_DATABASE_URL: postgresql+asyncpg://skillmind:skillmind@127.0.0.1:1/skillmind_test
  SKILLMIND_REDIS_URL: redis://127.0.0.1:1/15
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: skills
            targets: tests/skills tests/core tests/contracts
          - group: execution
            targets: tests/agent tests/worker tests/runs tests/effects
          - group: api
            targets: tests/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged pinned dependencies
        working-directory: SKM/backend
        run: python -m pip install -q -e '.[dev]'
      - name: Prepare identical reviewed source and tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/generic_mcp_ci.py
      - name: Run regression group without production services
        working-directory: SKM/backend
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set +e
          python -m pytest $TARGETS --import-mode=importlib -p no:cacheprovider -o addopts= -q --tb=short -ra --junitxml="$RUNNER_TEMP/results.xml" > "$RUNNER_TEMP/pytest.log" 2>&1
          result=$?
          tail -90 "$RUNNER_TEMP/pytest.log"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-regression-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/results.xml
            ${{ runner.temp }}/source-fingerprint.json
          retention-days: 7
  finalize:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install unchanged pinned dependencies
        working-directory: SKM/backend
        run: python -m pip install -q -e '.[dev]'
      - name: Reproduce reviewed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/generic_mcp_ci.py
      - uses: actions/download-artifact@v4
        with:
          pattern: mcp-regression-*
          path: ${{ runner.temp }}/verified-groups
      - name: Verify test results and exact source identity across all groups
        run: |
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          expected=json.loads((root/'source-fingerprint.json').read_text())
          groups=list((root/'verified-groups').iterdir())
          assert len(groups)==3
          counts={'tests':0,'failures':0,'errors':0,'skipped':0}
          for group in groups:
              assert json.loads((group/'source-fingerprint.json').read_text())==expected, group.name
              xml=ET.parse(group/'results.xml').getroot()
              suites=[xml] if xml.tag=='testsuite' else list(xml.findall('testsuite'))
              for suite in suites:
                  for field in counts:
                      counts[field]+=int(suite.attrib.get(field,0))
          assert counts['failures']==counts['errors']==0
          counts['passed']=counts['tests']-counts['skipped']
          print('VERIFIED_BACKEND_RESULTS='+json.dumps(counts,sort_keys=True))
          PY
      - name: Check all backend application types
        working-directory: SKM/backend
        run: python -m mypy --no-incremental src/skillmind
      - name: Check frontend type and regression contracts
        working-directory: SKM/web
        run: |
          npx -y pnpm@11.7.0 install --frozen-lockfile
          npx -y pnpm@11.7.0 typecheck
          npx -y pnpm@11.7.0 test > "$RUNNER_TEMP/web-tests.log" 2>&1 || { tail -100 "$RUNNER_TEMP/web-tests.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/web-tests.log"
      - name: Regenerate API and docs and validate contracts
        working-directory: SKM
        run: |
          python -m pip install -q -r scripts/docs-requirements.txt
          python scripts/export_openapi.py
          python scripts/validate_contracts.py
          python scripts/build_docs.py
          python scripts/build_docs.py --check
      - name: Commit verified tree and fast-forward only the requested branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          """成功した同一 source のみ提交し、main・実モデル・業務環境は変更しない。"""
          import json, os, re, subprocess, sys, urllib.request
          repo='ZhouRR/SkillMind'
          branch='perf/generic-mcp-execution'
          base='24485544e697e2612793c55fe5266fee071b1f86'
          parent=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          def api(path, data=None, method=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,
                  data=None if data is None else json.dumps(data,ensure_ascii=False).encode(),
                  method=method, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                      'Accept':'application/vnd.github+json','Content-Type':'application/json',
                      'User-Agent':'skillmind-tested-mcp-commit'})
              with urllib.request.urlopen(request,timeout=60) as response:
                  return json.load(response)
          assert api('git/ref/heads/'+branch)['object']['sha']==parent
          assert api('git/ref/heads/main')['object']['sha']==base
          completed=subprocess.run([sys.executable,'.github/generic_mcp_patch.py','--publish'],
                                   check=True,capture_output=True,text=True)
          print(completed.stdout)
          match=re.search(r'^PREPARED_TREE=([0-9a-f]{40})$',completed.stdout,re.MULTILINE)
          assert match is not None
          tree=match[1]
          message='perf(mcp): reuse generic contracts, decouple live events and honor explicit Run consent\n\nVerified by parallel backend regressions on identical source fingerprints, frontend tests, mypy, changed-file Ruff, contracts, OpenAPI and documentation. Preserve original authorization, approval audit, read-back, cancellation and UNKNOWN handling. Remove temporary preparation files. No production model, FlaUI desktop or business execution.'
          commit=api('git/commits',{'tree':tree,'parents':[parent],'message':message})
          assert api('git/ref/heads/'+branch)['object']['sha']==parent
          result=api('git/refs/heads/'+branch,{'sha':commit['sha'],'force':False},method='PATCH')
          assert result['object']['sha']==commit['sha']
          print('FINAL_COMMIT='+commit['sha'])
          print('VALIDATED_TREE='+tree)
          print('No force push, merge or deployment was performed.')
          PY