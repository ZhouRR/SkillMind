name: MCP regression failure details
on:
  push:
    branches: [perf/generic-mcp-execution]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read only completed regression failure summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          """過去の完了済み log の末尾だけを表示し、コードや実環境を実行しない。"""
          import os
          import urllib.request
          from urllib.parse import urlparse
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  assert urlparse(newurl).scheme == 'https'
                  new = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if new is not None:
                      new.remove_header('Authorization')
                  return new
          request = urllib.request.Request(
              'https://api.github.com/repos/ZhouRR/SkillMind/actions/jobs/105459246398/logs',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'User-Agent': 'skillmind-regression-summary'},
          )
          with urllib.request.build_opener(SafeRedirect()).open(request, timeout=60) as response:
              data = response.read(8_000_001)
          assert len(data) <= 8_000_000
          text = data.decode('utf-8-sig')
          for line in text.splitlines()[-170:]:
              print(line)
          PY