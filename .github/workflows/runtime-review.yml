name: Runtime review verification
on:
  push:
    branches: [refactor/runtime-stability-cleanup]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked application and test dependencies
        working-directory: SKM/backend
        run: python -m pip install -e '.[dev]'
      - name: Run runtime, interpreter and read-path regressions without external services
        working-directory: SKM/backend
        env:
          SKILLMIND_ENVIRONMENT: test
          SKILLMIND_DATABASE_URL: postgresql+asyncpg://skillmind:skillmind@127.0.0.1:1/skillmind_test
          SKILLMIND_REDIS_URL: redis://127.0.0.1:1/15
        run: python -m pytest tests/skills tests/agent tests/worker tests/runs tests/core tests/contracts -p no:cacheprovider -o addopts= -q --tb=short
      - name: Contract and documentation checks
        if: always()
        working-directory: SKM
        run: |
          python -m pip install -r scripts/docs-requirements.txt
          python scripts/validate_contracts.py
          python scripts/build_docs.py --check
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install and verify existing frontend
        working-directory: SKM/web
        run: |
          npx -y pnpm@11.7.0 install --frozen-lockfile
          npx -y pnpm@11.7.0 typecheck
          npx -y pnpm@11.7.0 test
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Review module and document sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for root, pattern in [('docs', '*.md'), ('SKM/backend/src/skillmind/skills', '*.py')]:
              values = [(len(p.read_text().splitlines()), str(p)) for p in Path(root).rglob(pattern)]
              for count, name in sorted(values, reverse=True):
                  print(count, name)
          PY
