name: Runtime review verification
on:
  push:
    branches: [refactor/runtime-stability-cleanup]
permissions:
  contents: read
concurrency:
  group: runtime-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SKILLMIND_ENVIRONMENT: test
      SKILLMIND_DATABASE_URL: postgresql+asyncpg://skillmind:skillmind@127.0.0.1:1/skillmind_test
      SKILLMIND_REDIS_URL: redis://127.0.0.1:1/15
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only reviewed changes to isolated checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/runtime_review_patch.py
      - name: Install pinned application and development dependencies
        working-directory: SKM/backend
        run: python -m pip install -q -e '.[dev]'
      - name: Normalize imports and verify touched Python
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = [p for p in json.loads((Path(os.environ['RUNNER_TEMP']) / 'runtime-review-paths.json').read_text()) if p.endswith('.py')]
          subprocess.run(['python', '-m', 'ruff', 'check', '--config', 'SKM/backend/pyproject.toml', '--no-cache', '--select', 'I', '--fix', *paths], check=True)
          subprocess.run(['python', '-m', 'ruff', 'format', '--config', 'SKM/backend/pyproject.toml', '--no-cache', *paths], check=True)
          subprocess.run(['python', '-m', 'ruff', 'check', '--config', 'SKM/backend/pyproject.toml', '--no-cache', *paths], check=True)
          PY
      - name: Run new regression tests first
        working-directory: SKM/backend
        run: python -m pytest tests/core/test_pubsub.py tests/skills/test_source_projection.py tests/agent/test_continuation_lists.py tests/agent/test_database_observation_selection.py -p no:cacheprovider -o addopts= -q --tb=short
      - name: Run existing interpreter and execution regressions
        working-directory: SKM/backend
        run: python -m pytest tests/skills tests/agent tests/worker tests/runs tests/core tests/contracts -p no:cacheprovider -o addopts= -q --tb=short
      - name: Check application types
        working-directory: SKM/backend
        run: python -m mypy --no-incremental src/skillmind
      - name: Validate contracts and regenerate consolidated documentation
        working-directory: SKM
        run: |
          python -m pip install -q -r scripts/docs-requirements.txt
          python scripts/validate_contracts.py
          python scripts/build_docs.py
          python scripts/build_docs.py --check
      - name: Prepare exact validated Git tree without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --stat
          python .github/runtime_review_patch.py --publish
