ず、通常の vitest に含まれない。runner を実環境 URL に向けない。初回だけ \u003ccode>PJM/web/\u003c/code> で browser 依存を導入し、専用 terminal で Vite を起動する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r tests/browser/requirements.txt\npython3 -m playwright install chromium\nnode_modules/.bin/vite --host 127.0.0.1 --port 5189 --strictPort\n\u003c/code>\u003c/pre>\n\u003cp>別 terminal の同じ directory で目的の runner を選ぶ：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 tests/browser/check_login.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/login.html\npython3 tests/browser/check_accounts.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/accounts.html\npython3 tests/browser/check_projects.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/projects.html\npython3 tests/browser/check_project_members.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/projects.html\npython3 tests/browser/check_project_management.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/projects.html\npython3 tests/browser/check_run_submission.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/run-submission.html\npython3 tests/browser/check_interaction_responses.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/run-submission.html\nPYTHONDONTWRITEBYTECODE=1 PYTHONPATH=../backend/src \\\n  python3 tests/browser/check_document_sources.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/run-submission.html\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>runner\u003c/th>\n\u003cth>検証する範囲と限界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>login\u003c/td>\n\u003ctd>実 LoginPage の二重 submit、拒否・abort・遅延応答、三語/keyboard/窄屏。実 session、HTTPS、多 tab は別\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>accounts\u003c/td>\n\u003ctd>実 AccountsPage と App の本人安全、ADMIN 管理、検索/ページング、原版比較・未知・遅延応答・会話切替。実 DB の競争、Redis、HTTPS は別\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>projects\u003c/td>\n\u003ctd>実 App の失効/空/重複 Project link、精確詳細 gate、原対象の再読取・遅延応答・帰還、帰档履歴、三語/狭幅導航。API は全 mock、実 membership/削除競争・HTTPS は別\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>project_members\u003c/td>\n\u003ctd>実 App の ADMIN 成員管理、関係/アカウント状態の区別、候補検索/page、原対象確認・未知結果の照合・遅延・切替。全 API は mock、実加入/禁用競争・監査 transaction は別\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>project_management\u003c/td>\n\u003ctd>実 App の作成/編集/帰档/復元/削除、原版比較・未知照合・初回選択・対象/会話切替、三語/keyboard/狭幅。API は全 mock、実 DB の CAS/rollback、0034 と HTTPS は別\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>run_submission\u003c/td>\n\u003ctd>実 Workspace の応答喪失、同 key/body 確認、明示的新規、actor/Project 切替・refresh。実 transaction/唯一制約は別\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>interaction_responses\u003c/td>\n\u003ctd>実 Workspace の普通答復、原要求確認、競合/期限、同 tick/30 秒/旧応答、会話/対象切替、詳細/SSE/表示 tab 更新と三語。API は全 mock、実答復/過期 transaction・撤権競争と model 停止は別\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>document_sources\u003c/td>\n\u003ctd>即時/調度入力、清単、CSRF と凍結表示。Backend 依存と純 parser は使うが、実 blob、物化、調度編集/時区/認領 crash は別\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>初回導入は download を伴う。外部依存は PYTHONPATH、browser は PLAYWRIGHT_BROWSERS_PATH で指定でき、document_sources では Backend src と両方を含める。\u003ccode>--output\u003c/code> は明示した新しい工作区外 directory に screenshot を保存する。port が使用中なら奪わず別 port と URL を使い、終了時は自分の Vite だけを停止する。\u003c/p>\n\u003ch2 id=\"変更に応じた検証\">変更に応じた検証\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>実行位置とコマンド\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Backend\u003c/td>\n\u003ctd>\u003ccode>PJM/backend/\u003c/code>：\u003ccode>python3 -m ruff check .\u003c/code>、\u003ccode>python3 -m mypy src\u003c/code>、上記副作用確認後の pytest\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web\u003c/td>\n\u003ctd>\u003ccode>PJM/web/\u003c/code>：\u003ccode>node_modules/.bin/tsc -b --pretty false\u003c/code>、\u003ccode>node_modules/.bin/vitest run\u003c/code>、\u003ccode>node_modules/.bin/vite build\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>契約\u003c/td>\n\u003ctd>\u003ccode>PJM/\u003c/code>：\u003ccode>python3 scripts/validate_contracts.py\u003c/code>。快照一致性は\u003ca href=\"#docs/development/contract-workflow.md::%E9%81%87%E5%88%B0%E6%9C%AA%E6%8E%A5%E9%BD%90%E7%9A%84%E4%BA%A4%E4%BB%98%E9%93%BE\">契約 workflow\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compose / 配備\u003c/td>\n\u003ctd>\u003ccode>PJM/\u003c/code>：\u003ccode>python3 scripts/validate_compose.py\u003c/code>、\u003ccode>python3 -m unittest discover -s scripts/tests -v\u003c/code>。Docker 利用可・対象確認済みなら \u003ccode>make config\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SDK offline\u003c/td>\n\u003ctd>\u003ccode>PJM/\u003c/code>：\u003ccode>PYTHONPATH=backend/src python3 scripts/probe_claude_agent_sdk.py\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文書\u003c/td>\n\u003ctd>\u003ccode>PJM/\u003c/code>：\u003ca href=\"#docs/development/documentation.md::\">文書維持\u003c/a>の build/check・回帰\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>通常の config 出力には Secret が含まれ得る。配備工具 test は合成環境 file、tar と fake 子 process で source・引数・拒否・失敗後に進まないことを検証する。実 DB skip、mock と実環境、静的検査と配備を区別する。Docker / Make / PowerShell がない場合、それぞれ実注入・段階起動/復旧、Make 展開、Windows export の未検証を報告する。\u003c/p>\n\u003ch2 id=\"skill-interpreter-の検証\">Skill Interpreter の検証\u003c/h2>\n\u003cp>Backend 依存導入後、\u003ccode>PJM/\u003c/code> で model 不使用の fixture runner：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">projectmind-skill-interpret-fixture \\\n  skills/examples/repository-review \\\n  contracts/examples/skill-interpreter-response.v1.json\n\u003c/code>\u003c/pre>\n\u003cp>本番解釈は source/system Skill/Schema/catalog/model/parameter が同一なら再利用し、別候補だけ明示的に force_regenerate する。構造化出力を原則必須とし、\u003ccode>PROJECTMIND_SKILL_INTERPRETER_ACCEPT_PROMPT_JSON=true\u003c/code> も同じ Schema/identity/修復検査を省略しない。\u003c/p>\n\u003cp>以下は実 model API と課金を伴う。承認済み環境、入力と model 設定を確認してから実行する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/measure_skill_interpretations.py \\\n  skills/examples/repository-review --repeats 3 --timeout-seconds 900\n\u003c/code>\u003c/pre>\n\u003cp>構造有効率と意味 signature を測り、その後に人手で規則保真・証拠・修正量を評価する。fixture や過去の timeout を現在の業務品質の証明にしない。\u003c/p>\n\u003ch2 id=\"作業後の一時物\">作業後の一時物\u003c/h2>\n\u003cp>今回生成した cache、\u003cstrong>pycache\u003c/strong>、web/dist、node_modules/.tmp、egg-info だけを対象確認後に片付ける。既存成果物と node_modules 本体は残す。\u003c/p>\n", "sections": [{"title": "ローカル開発と検証", "level": "h1", "anchor": "ローカル開発と検証", "text": "# ローカル開発と検証\n\n全体の入口は [PJM README](../../PJM/README.md)。以下はコード root `PJM/` 起点で、各節に実行 directory を明示する。"}, {"title": "前提と設定", "level": "h2", "anchor": "前提と設定", "text": "## 前提と設定\n\nPython 3.12、Node.js 26 / pnpm 11.7.0 を用意する。venv は作らず Backend 依存を user site に置き、lockfile を手編集しない。導入だけでは DB/Redis/object storage は起動しない。\n\n`.env.example` は production 雛形。HTTP localhost は `PROJECTMIND_ENVIRONMENT=development`、許可 Origin、専用接続先、書込可能な Run workspace を設定する。通常 Backend の `.env` は実行 directory 基準なので、`backend/` から親の file が自動で読まれると仮定せず、設定 file または process environment を明示する。Compose は [compose.py の共通設定入口](../operations/deployment.md#环境文件与配置边界)で ENV_FILE を同一 source に固定する。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\n`PJM/backend/` で依存を入れる。migration は確認済み開発 DB を変更する操作なので、対象と権限を確認してから進む。\n\n```bash\npython3 -m pip install --user -e \".[dev]\"\nalembic upgrade head\npython3 -m uvicorn projectmind.api.main:app --reload --port 8000\n```\n\nhealth は `http://localhost:8000/internal/health/live` と `/internal/health/ready`（外部 service も検査）。Worker は [Backend 入口](../../PJM/README.md#backend)、一括起動は[Quickstart](../operations/quickstart.md)を参照する。"}, {"title": "実 PostgreSQL の前提", "level": "h3", "anchor": "実-postgresql-の前提", "text": "### 実 PostgreSQL の前提\n\n全 pytest には[実 DB fixture](../../PJM/backend/tests/db/test_real_database_invariants.py)が含まれる。`PROJECTMIND_DATABASE_URL` の server 上で scratch DB を作り、全 migration 後に DROP DATABASE WITH (FORCE) を行う。実会話・予算 test も再利用する。\n\n承認済み隔離 server/account、作成・強制削除権限を確認する。URL の DB 名変更だけでは隔離にならない。文書確認のために実行せず、接続不能の skip は未実施、認証/権限/migration の失敗は失敗のまま報告する。\n\n許可された DB がない場合は局部 test、または `PJM/backend/` で現在の実 DB module を除外する：\n\n```bash\nPYTHONDONTWRITEBYTECODE=1 python3 -m pytest -p no:cacheprovider -o addopts= \\\n  --ignore=tests/db/test_real_database_invariants.py \\\n  --ignore=tests/db/test_real_auth_sessions.py \\\n  --ignore=tests/db/test_real_budget_ledger.py\n```\n\nこれは無副作用の保証ではない。新しい fixture 利用先を追加したら除外対象を同期し、一時 Redis 等の process は別に確認する。"}, {"title": "隔离 Redis 登录防护验证", "level": "h3", "anchor": "隔离-redis-登录防护验证", "text": "### 隔离 Redis 登录防护验证\n\n信頼できる入手元と checksum を確認した Redis 8.2 系 executable が必要。fixture は TCP/永続化を無効にした自分専用 process と短い path の Unix socket を使い、終了時も自分の process だけを止める。既存 Redis の URL、system service や DB 消去は使わない。\n\n`PJM/backend/` で placeholder を確認済み絶対 path に置き換える：\n\n```bash\nPYTHONDONTWRITEBYTECODE=1 \\\n  PROJECTMIND_TEST_REDIS_SERVER=/absolute/path/to/redis-server \\\n  python3 -m pytest -p no:cacheprovider -o addopts= \\\n  tests/auth/test_real_login_protection.py tests/auth/test_real_login_http.py\n```\n\n未指定なら PATH を検索し、見つからなければ skip、不正な明示 path は fail。実 Lua/TTL と ASGI→AuthService→Redis を検証するが Session 保存は fake、一部時刻は操作する。実 PostgreSQL、長時間待機、複数 API process、HTTPS proxy と Redis 切替は別の[受入条件](../design/login-protection.md#开发接续与验收)。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n`PJM/web/` で実行する：\n\n```bash\nCI=true npx -y pnpm@11.7.0 install --frozen-lockfile\nnpx -y pnpm@11.7.0 dev\n```\n\n既定 URL は `http://localhost:5173/projectmind/`、API proxy は `http://127.0.0.1:8000`。context path は Web/API で合わせ、cookie は同じ browser Origin で使う。"}, {"title": "ブラウザ回帰", "level": "h3", "anchor": "ブラウザ回帰", "text": "### ブラウザ回帰\n\n全 API を mock する専用 harness。実 credential、Backend、DB、model は使わず、通常の vitest に含まれない。runner を実環境 URL に向けない。初回だけ `PJM/web/` で browser 依存を導入し、専用 terminal で Vite を起動する：\n\n```bash\npython3 -m pip install --user -r tests/browser/requirements.txt\npython3 -m playwright install chromium\nnode_modules/.bin/vite --host 127.0.0.1 --port 5189 --strictPort\n```\n\n別 terminal の同じ directory で目的の runner を選ぶ：\n\n```bash\npython3 tests/browser/check_login.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/login.html\npython3 tests/browser/check_accounts.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/accounts.html\npython3 tests/browser/check_projects.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/projects.html\npython3 tests/browser/check_project_members.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/projects.html\npython3 tests/browser/check_project_management.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/projects.html\npython3 tests/browser/check_run_submission.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/run-submission.html\npython3 tests/browser/check_interaction_responses.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/run-submission.html\nPYTHONDONTWRITEBYTECODE=1 PYTHONPATH=../backend/src \\\n  python3 tests/browser/check_document_sources.py \\\n  --url http://127.0.0.1:5189/projectmind/tests/browser/run-submission.html\n```\n\n| runner | 検証する範囲と限界 |\n| --- | --- |\n| login | 実 LoginPage の二重 submit、拒否・abort・遅延応答、三語/keyboard/窄屏。実 session、HTTPS、多 tab は別 |\n| accounts | 実 AccountsPage と App の本人安全、ADMIN 管理、検索/ページング、原版比較・未知・遅延応答・会話切替。実 DB の競争、Redis、HTTPS は別 |\n| projects | 実 App の失効/空/重複 Project link、精確詳細 gate、原対象の再読取・遅延応答・帰還、帰档履歴、三語/狭幅導航。API は全 mock、実 membership/削除競争・HTTPS は別 |\n| project_members | 実 App の ADMIN 成員管理、関係/アカウント状態の区別、候補検索/page、原対象確認・未知結果の照合・遅延・切替。全 API は mock、実加入/禁用競争・監査 transaction は別 |\n| project_management | 実 App の作成/編集/帰档/復元/削除、原版比較・未知照合・初回選択・対象/会話切替、三語/keyboard/狭幅。API は全 mock、実 DB の CAS/rollback、0034 と HTTPS は別 |\n| run_submission | 実 Workspace の応答喪失、同 key/body 確認、明示的新規、actor/Project 切替・refresh。実 transaction/唯一制約は別 |\n| interaction_responses | 実 Workspace の普通答復、原要求確認、競合/期限、同 tick/30 秒/旧応答、会話/対象切替、詳細/SSE/表示 tab 更新と三語。API は全 mock、実答復/過期 transaction・撤権競争と model 停止は別 |\n| document_sources | 即時/調度入力、清単、CSRF と凍結表示。Backend 依存と純 parser は使うが、実 blob、物化、調度編集/時区/認領 crash は別 |\n\n初回導入は download を伴う。外部依存は PYTHONPATH、browser は PLAYWRIGHT_BROWSERS_PATH で指定でき、document_sources では Backend src と両方を含める。`--output` は明示した新しい工作区外 directory に screenshot を保存する。port が使用中なら奪わず別 port と URL を使い、終了時は自分の Vite だけを停止する。"}, {"title": "変更に応じた検証", "level": "h2", "anchor": "変更に応じた検証", "text": "## 変更に応じた検証\n\n| 対象 | 実行位置とコマンド |\n| --- | --- |\n| Backend | `PJM/backend/`：`python3 -m ruff check .`、`python3 -m mypy src`、上記副作用確認後の pytest |\n| Web | `PJM/web/`：`node_modules/.bin/tsc -b --pretty false`、`node_modules/.bin/vitest run`、`node_modules/.bin/vite build` |\n| 契約 | `PJM/`：`python3 scripts/validate_contracts.py`。快照一致性は[契約 workflow](contract-workflow.md#遇到未接齐的交付链) |\n| Compose / 配備 | `PJM/`：`python3 scripts/validate_compose.py`、`python3 -m unittest discover -s scripts/tests -v`。Docker 利用可・対象確認済みなら `make config` |\n| SDK offline | `PJM/`：`PYTHONPATH=backend/src python3 scripts/probe_claude_agent_sdk.py` |\n| 文書 | `PJM/`：[文書維持](documentation.md)の build/check・回帰 |\n\n通常の config 出力には Secret が含まれ得る。配備工具 test は合成環境 file、tar と fake 子 process で source・引数・拒否・失敗後に進まないことを検証する。実 DB skip、mock と実環境、静的検査と配備を区別する。Docker / Make / PowerShell がない場合、それぞれ実注入・段階起動/復旧、Make 展開、Windows export の未検証を報告する。"}, {"title": "Skill Interpreter の検証", "level": "h2", "anchor": "skill-interpreter-の検証", "text": "## Skill Interpreter の検証\n\nBackend 依存導入後、`PJM/` で model 不使用の fixture runner：\n\n```bash\nprojectmind-skill-interpret-fixture \\\n  skills/examples/repository-review \\\n  contracts/examples/skill-interpreter-response.v1.json\n```\n\n本番解釈は source/system Skill/Schema/catalog/model/parameter が同一なら再利用し、別候補だけ明示的に force_regenerate する。構造化出力を原則必須とし、`PROJECTMIND_SKILL_INTERPRETER_ACCEPT_PROMPT_JSON=true` も同じ Schema/identity/修復検査を省略しない。\n\n以下は実 model API と課金を伴う。承認済み環境、入力と model 設定を確認してから実行する：\n\n```bash\npython3 scripts/measure_skill_interpretations.py \\\n  skills/examples/repository-review --repeats 3 --timeout-seconds 900\n```\n\n構造有効率と意味 signature を測り、その後に人手で規則保真・証拠・修正量を評価する。fixture や過去の timeout を現在の業務品質の証明にしない。"}, {"title": "作業後の一時物", "level": "h2", "anchor": "作業後の一時物", "text": "## 作業後の一時物\n\n今回生成した cache、__pycache__、web/dist、node_modules/.tmp、egg-info だけを対象確認後に片付ける。既存成果物と node_modules 本体は残す。"}], "toc": [{"title": "前提と設定", "anchor": "前提と設定", "level": "h2"}, {"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "実 PostgreSQL の前提", "anchor": "実-postgresql-の前提", "level": "h3"}, {"title": "隔离 Redis 登录防护验证", "anchor": "隔离-redis-登录防护验证", "level": "h3"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "ブラウザ回帰", "anchor": "ブラウザ回帰", "level": "h3"}, {"title": "変更に応じた検証", "anchor": "変更に応じた検証", "level": "h2"}, {"title": "Skill Interpreter の検証", "anchor": "skill-interpreter-の検証", "level": "h2"}, {"title": "作業後の一時物", "anchor": "作業後の一時物", "level": "h2"}], "source": "development/local-development.md", "checksum": "d82049ffd79ae847228d2d15bc6cdea1a0e32d60b0b45ae69b6c98d488a996e3"}, {"id": "docs/development/change-guide.md", "title": "从设计到代码的变更指南", "group": "development", "html": "\u003ch1 id=\"从设计到代码的变更指南\">从设计到代码的变更指南\u003c/h1>\n\u003cp>先读 \u003ca href=\"#PJM/AGENTS.md::\">AGENTS\u003c/a>，按下表选择领域；实现入口集中在\u003ca href=\"#PJM/README.md::\">代码根 README\u003c/a>，状态只在\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>维护。完整设计分工见\u003ca href=\"#docs/design/README.md::\">设计索引\u003c/a>。\u003c/p>\n\u003ch2 id=\"先确定改的是哪条链路\">先确定改的是哪条链路\u003c/h2>\n\u003ch3 id=\"运行与数据\">运行与数据\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变更\u003c/th>\n\u003cth>设计与首要核对点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>上传、下载、目录、清理\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/document-lifecycle.md::\">文档生命周期\u003c/a>：跨存储提交、配额、引用、未知结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>来源、scope、输入准备\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>：选择、冻结、物化、可信缓存及真实读取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>创建与重复提交\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/run-creation.md::\">Run 创建\u003c/a>：原 actor、内容、幂等键与新执行的区别\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>状态、等待与恢复\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>：Segment/Attempt、DB、事件和 Web\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>普通答复、过期\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/user-interactions.md::\">用户交互\u003c/a>：答案、期限与原请求确认，不与批准混用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结果与评价\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/results-evaluation.md::\">结果设计\u003c/a>：引用核验、不可变原值与评价的独立提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>timeout、取消、预算\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a> / \u003ca href=\"#docs/design/run-budgets.md::\">预算\u003c/a>：提交权、真实停止、计量与主子共享\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部写入、调度\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a> / \u003ca href=\"#docs/design/task-scheduling.md::\">调度\u003c/a>：原身份、认领、阶段回执与恢复\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"skill-与界面\">Skill 与界面\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变更\u003c/th>\n\u003cth>设计与首要核对点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>解释、发布、项目启停\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/skill-contract.md::\">Skill 契约\u003c/a> / \u003ca href=\"#docs/design/skill-interpretation.md::\">解释器\u003c/a>：来源身份、候选、发布与就绪\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面、任务流程\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a> / \u003ca href=\"#docs/design/task-flow.md::\">Task Flow\u003c/a>：client、投影、三语与实际用户流程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成界面、子分析\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/generated-modules.md::\">生成模块\u003c/a> / \u003ca href=\"#docs/design/subagents.md::\">子分析\u003c/a>：完整身份、安全门禁与共享预算，不能以局部静态检查授权执行\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"身份与交付\">身份与交付\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变更\u003c/th>\n\u003cth>设计与首要核对点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>登录、会话、账户\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/login-protection.md::\">登录防护\u003c/a> / \u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a> / \u003ca href=\"#docs/design/user-lifecycle.md::\">用户生命周期\u003c/a>：API、页面、并发和真实环境分层验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目、成员、归档、删除\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/project-lifecycle.md::\">项目生命周期\u003c/a>：系统角色、引用、归档竞争与删除范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部凭据\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/secret-storage.md::\">Secret\u003c/a>：密文、keyring、轮换与旧备份恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配置、迁移、发布\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/deployment.md::\">发布手册\u003c/a>：Settings/.env.example、Compose/Make、所有写入者与失败停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>备份、恢复、保留\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复手册\u003c/a>：DB/blob/workspace/KEK、权限与不可回滚的外部事实\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"开工前必须回答的六个问题\">开工前必须回答的六个问题\u003c/h2>\n\u003col>\n\u003cli>场景、当前问题、目标和非目标是什么？\u003c/li>\n\u003cli>规则由哪个设计与现有 service/validator 负责？\u003c/li>\n\u003cli>创建、准备、读取、答复分别在何时冻结事实和复查授权？\u003c/li>\n\u003cli>哪些公开字段、持久格式、checksum 与消费者受影响？\u003c/li>\n\u003cli>拒绝、重发、并发、取消、部分成功与恢复怎样处理？\u003c/li>\n\u003cli>哪些可观察结果证明完成，哪些需要独立的真实环境？\u003c/li>\n\u003c/ol>\n\u003cp>已有实现先接续，不重造组件；发现未完成接线时按\u003ca href=\"#docs/development/contract-workflow.md::%E9%81%87%E5%88%B0%E6%9C%AA%E6%8E%A5%E9%BD%90%E7%9A%84%E4%BA%A4%E4%BB%98%E9%93%BE\">契约 workflow\u003c/a>标明所在层，保留用户已有改动。字段、配置、事件、DB 和工具改动套用\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">实现细则的同步点\u003c/a>。\u003c/p>\n\u003ch2 id=\"留下一条可接手的开发任务\">留下一条可接手的开发任务\u003c/h2>\n\u003cp>任务写清“场景 → 目标/非目标 → 设计 → 已有基础与缺口 → 同步范围 → 验收”。例如创建响应丢失：继续复用原内容/键确认同一 Run；覆盖 abort、重复点击、编辑、账号切换和刷新，不新增 lifecycle 或保存敏感输入来回避问题。\u003c/p>\n\u003cp>设计修改还应说明历史数据如何读取、哪些版本可以共存。新增概念不必然需要新表；只变内部实现不必然新增公开字段。新增 Tool capability 则必须同步版本化契约、Provider、registry、权限、就绪度与测试。\u003c/p>\n\u003ch2 id=\"验证与记录\">验证与记录\u003c/h2>\n\u003cp>按\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">本地验证表\u003c/a>执行相关检查。区分文档、静态契约、mock 回归、真实事务、浏览器、部署与模型；失败、skip 和未执行如实报告。相同表名、checksum、row_version 或一次绿色测试都不证明完整交付。\u003c/p>\n\u003cp>完成后更新规则正本和计划中的当前缺口，不再追加历史文档或在设计中堆积轮次日志；链接与浏览版按\u003ca href=\"#docs/development/documentation.md::\">文档维护\u003c/a>同步。\u003c/p>\n", "sections": [{"title": "从设计到代码的变更指南", "level": "h1", "anchor": "从设计到代码的变更指南", "text": "# 从设计到代码的变更指南\n\n先读 [AGENTS](../../PJM/AGENTS.md)，按下表选择领域；实现入口集中在[代码根 README](../../PJM/README.md)，状态只在[计划](../planning/roadmap.md)维护。完整设计分工见[设计索引](../design/README.md)。"}, {"title": "先确定改的是哪条链路", "level": "h2", "anchor": "先确定改的是哪条链路", "text": "## 先确定改的是哪条链路"}, {"title": "运行与数据", "level": "h3", "anchor": "运行与数据", "text": "### 运行与数据\n\n| 变更 | 设计与首要核对点 |\n| --- | --- |\n| 上传、下载、目录、清理 | [文档生命周期](../design/document-lifecycle.md)：跨存储提交、配额、引用、未知结果 |\n| 来源、scope、输入准备 | [资源快照](../design/resource-snapshots.md)：选择、冻结、物化、可信缓存及真实读取 |\n| 创建与重复提交 | [Run 创建](../design/run-creation.md)：原 actor、内容、幂等键与新执行的区别 |\n| 状态、等待与恢复 | [Runtime](../design/agent-runtime.md)：Segment/Attempt、DB、事件和 Web |\n| 普通答复、过期 | [用户交互](../design/user-interactions.md)：答案、期限与原请求确认，不与批准混用 |\n| 结果与评价 | [结果设计](../design/results-evaluation.md)：引用核验、不可变原值与评价的独立提交 |\n| timeout、取消、预算 | [执行监督](../design/run-supervision.md) / [预算](../design/run-budgets.md)：提交权、真实停止、计量与主子共享 |\n| 外部写入、调度 | [受控写入](../design/repository-effects.md) / [调度](../design/task-scheduling.md)：原身份、认领、阶段回执与恢复 |"}, {"title": "Skill 与界面", "level": "h3", "anchor": "skill-与界面", "text": "### Skill 与界面\n\n| 变更 | 设计与首要核对点 |\n| --- | --- |\n| 解释、发布、项目启停 | [Skill 契约](../design/skill-contract.md) / [解释器](../design/skill-interpretation.md)：来源身份、候选、发布与就绪 |\n| 页面、任务流程 | [Workspace](../design/workspace.md) / [Task Flow](../design/task-flow.md)：client、投影、三语与实际用户流程 |\n| 生成界面、子分析 | [生成模块](../design/generated-modules.md) / [子分析](../design/subagents.md)：完整身份、安全门禁与共享预算，不能以局部静态检查授权执行 |"}, {"title": "身份与交付", "level": "h3", "anchor": "身份与交付", "text": "### 身份与交付\n\n| 变更 | 设计与首要核对点 |\n| --- | --- |\n| 登录、会话、账户 | [登录防护](../design/login-protection.md) / [认证](../design/authentication.md) / [用户生命周期](../design/user-lifecycle.md)：API、页面、并发和真实环境分层验证 |\n| 项目、成员、归档、删除 | [项目生命周期](../design/project-lifecycle.md)：系统角色、引用、归档竞争与删除范围 |\n| 外部凭据 | [Secret](../design/secret-storage.md)：密文、keyring、轮换与旧备份恢复 |\n| 配置、迁移、发布 | [发布手册](../operations/deployment.md)：Settings/.env.example、Compose/Make、所有写入者与失败停止 |\n| 备份、恢复、保留 | [恢复手册](../operations/backup-recovery.md)：DB/blob/workspace/KEK、权限与不可回滚的外部事实 |"}, {"title": "开工前必须回答的六个问题", "level": "h2", "anchor": "开工前必须回答的六个问题", "text": "## 开工前必须回答的六个问题\n\n1. 场景、当前问题、目标和非目标是什么？\n2. 规则由哪个设计与现有 service/validator 负责？\n3. 创建、准备、读取、答复分别在何时冻结事实和复查授权？\n4. 哪些公开字段、持久格式、checksum 与消费者受影响？\n5. 拒绝、重发、并发、取消、部分成功与恢复怎样处理？\n6. 哪些可观察结果证明完成，哪些需要独立的真实环境？\n\n已有实现先接续，不重造组件；发现未完成接线时按[契约 workflow](contract-workflow.md#遇到未接齐的交付链)标明所在层，保留用户已有改动。字段、配置、事件、DB 和工具改动套用[实现细则的同步点](coding-rules.md#同步点)。"}, {"title": "留下一条可接手的开发任务", "level": "h2", "anchor": "留下一条可接手的开发任务", "text": "## 留下一条可接手的开发任务\n\n任务写清“场景 → 目标/非目标 → 设计 → 已有基础与缺口 → 同步范围 → 验收”。例如创建响应丢失：继续复用原内容/键确认同一 Run；覆盖 abort、重复点击、编辑、账号切换和刷新，不新增 lifecycle 或保存敏感输入来回避问题。\n\n设计修改还应说明历史数据如何读取、哪些版本可以共存。新增概念不必然需要新表；只变内部实现不必然新增公开字段。新增 Tool capability 则必须同步版本化契约、Provider、registry、权限、就绪度与测试。"}, {"title": "验证与记录", "level": "h2", "anchor": "验证与记录", "text": "## 验证与记录\n\n按[本地验证表](local-development.md#変更に応じた検証)执行相关检查。区分文档、静态契约、mock 回归、真实事务、浏览器、部署与模型；失败、skip 和未执行如实报告。相同表名、checksum、row_version 或一次绿色测试都不证明完整交付。\n\n完成后更新规则正本和计划中的当前缺口，不再追加历史文档或在设计中堆积轮次日志；链接与浏览版按[文档维护](documentation.md)同步。"}], "toc": [{"title": "先确定改的是哪条链路", "anchor": "先确定改的是哪条链路", "level": "h2"}, {"title": "运行与数据", "anchor": "运行与数据", "level": "h3"}, {"title": "Skill 与界面", "anchor": "skill-与界面", "level": "h3"}, {"title": "身份与交付", "anchor": "身份与交付", "level": "h3"}, {"title": "开工前必须回答的六个问题", "anchor": "开工前必须回答的六个问题", "level": "h2"}, {"title": "留下一条可接手的开发任务", "anchor": "留下一条可接手的开发任务", "level": "h2"}, {"title": "验证与记录", "anchor": "验证与记录", "level": "h2"}], "source": "development/change-guide.md", "checksum": "dec198cc6558917c59be3f489ae799a5671c4991f7a46a2dfa19b1d1f0aeee2b"}, {"id": "docs/development/coding-rules.md", "title": "按改动类型查阅的实现细则", "group": "development", "html": "\u003ch1 id=\"按改动类型查阅的实现细则\">按改动类型查阅的实现细则\u003c/h1>\n\u003cp>本页由 \u003ca href=\"#PJM/AGENTS.md::\">AGENTS.md\u003c/a>强制引用，只需阅读本次改动涉及的章节。它保留实现级约束，不重复领域设计、运行命令或当前进度；设计入口见\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>。\u003c/p>\n\u003cp>下文 Backend 路径以 \u003ccode>PJM/backend/src/projectmind/\u003c/code> 为基准，Web 路径以 \u003ccode>PJM/web/\u003c/code> 为基准。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>route 只负责认证和入出参，业务判断在 domain/service，查询、锁和持久化在 repository；不得在 route 或 ARQ job 中嵌入业务判断。公开 route 只在 \u003ccode>api/routes/\u003c/code> 的资源模块单层实现，不增加未认证的并行实现或转发 wrapper。\u003c/p>\n\u003cp>必须复用下列单一实现；新增语义在原入口扩展，不复制一份分支：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>处理\u003c/th>\n\u003cth>唯一入口与限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>JSON 与 SHA-256\u003c/td>\n\u003ctd>\u003ccode>core/hashing.py\u003c/code> 的 \u003ccode>canonical_json\u003c/code> / \u003ccode>sha256_hex\u003c/code>；\u003ccode>skills/importer.py\u003c/code>、\u003ccode>agent/fixture_providers.py\u003c/code> 已持久化的历史 hash 格式不得顺手改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>敏感字段\u003c/td>\n\u003ctd>\u003ccode>core/redaction.py\u003c/code> 的 \u003ccode>find_sensitive_key\u003c/code>，Evidence 与 Tool response 共用词表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lease token\u003c/td>\n\u003ctd>\u003ccode>runs/domain.py\u003c/code> 的 \u003ccode>lease_token_hash\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RunEvent / Outbox\u003c/td>\n\u003ctd>\u003ccode>RunRepository\u003c/code> 的 \u003ccode>_snapshot_event\u003c/code>、\u003ccode>_event_outbox\u003c/code>、\u003ccode>_dispatch_outbox\u003c/code> 与 \u003ccode>_next_sequence\u003c/code>，定义在 \u003ccode>runs/repository_base.py\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>认证/授权 Problem\u003c/td>\n\u003ctd>\u003ccode>api/auth_dependencies.py\u003c/code> 的共享 factory；Run 使用 \u003ccode>api/routes/runs.py\u003c/code> 的 \u003ccode>run_not_found_problem\u003c/code> / \u003ccode>authorized_run\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>凍结 binding 与 Secret\u003c/td>\n\u003ctd>\u003ccode>agent/run_binding.py\u003c/code> 的 \u003ccode>load_bound_run_resource\u003c/code> / \u003ccode>resolve_binding_secret\u003c/code>，执行前核对 checksum、Integration 状态、provider、revision、capability\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部 repository\u003c/td>\n\u003ctd>\u003ccode>agent/repository_client.py\u003c/code> / \u003ccode>agent/repository_source.py\u003c/code>，物化、read Provider 和 write effect 均走此处，不另写 subprocess 或凭据解析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可 apply 的 effect\u003c/td>\n\u003ctd>\u003ccode>effects/catalog.py\u003c/code> 的 \u003ccode>EFFECT_CAPABILITIES\u003c/code>，创建、校验、执行与审批重新校验使用同一表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Binary 转文字\u003c/td>\n\u003ctd>\u003ccode>agent/binary_text.py\u003c/code> 的 \u003ccode>render_text\u003c/code>，新增格式不在各 Provider 单独转换\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ccode>documents/__init__.py\u003c/code> 只导出 domain 类型；service/repository/source 显式从各模块导入，避免 DB model → Run domain → 文档规则形成循环 import。\u003c/p>\n\u003cp>\u003ccode>repository.write/v1\u003c/code> 的 \u003ccode>preauthorizable=False\u003c/code> 不得放宽。Integration 的 \u003ccode>write_mode\u003c/code> 决定目标：\u003ccode>direct\u003c/code> 仅默认 branch 的 fast-forward，\u003ccode>branch\u003c/code> 仅新建 \u003ccode>projectmind/\u003c/code> 预留命名空间 branch；均不可 force、覆盖既有 branch 或直接写任意 branch。完整协议见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。\u003c/p>\n\u003ch2 id=\"run-lifecycle\">Run lifecycle\u003c/h2>\n\u003cp>修改 Run、Worker、Session、调度或子 Agent 时，先读 \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>、\u003ca href=\"#docs/design/run-supervision.md::\">监督与停止\u003c/a>及本次涉及的领域设计，再核对以下实现约束。\u003c/p>\n\u003cul>\n\u003cli>状态转换只经 \u003ccode>plan_run_transition\u003c/code> / \u003ccode>ALLOWED_RUN_TRANSITIONS\u003c/code>。row lock 固定 Run → Segment → Attempt；旧 migration 前路径维持 Run → Attempt，不反转 \u003ccode>_lock_claimed_execution\u003c/code> 的取锁顺序。\u003c/li>\n\u003cli>用户答复/批准追加 Segment，worker retry/recovery 在同 Segment 追加 Attempt；等待期间不持有 worker lease 或 active wall timeout。原请求重发、新运行和 Attempt 恢复分别遵守\u003ca href=\"#docs/design/run-creation.md::\">创建协议\u003c/a>，不得省略 actor/Project/精确版校验。\u003c/li>\n\u003cli>终态的 \u003ccode>RUN_SNAPSHOT\u003c/code> 是该 Run 最后一个 event；sequence 在 Run 内严格单调，\u003ccode>TEXT_DELTA\u003c/code> 消耗 sequence 但不持久化，缺号正常。遵守 \u003ccode>contracts/events/run-event/v1.schema.json\u003c/code>，不改成子层级编号。\u003c/li>\n\u003cli>任何重新 dispatch 都经过 claim 的 \u003ccode>PROJECTMIND_RUN_MAX_ATTEMPTS\u003c/code> 上限；耗尽时以 \u003ccode>retry_exhausted\u003c/code> 关闭为 FAILED。\u003c/li>\n\u003cli>Executor 强制 \u003ccode>wall_timeout_seconds\u003c/code> deadline，只中断 event 等待，不中断终态 transaction；ARQ \u003ccode>job_timeout\u003c/code> 保持更长，不能替代执行 deadline。\u003c/li>\n\u003cli>PRIMARY Session 顺序执行，不允许同时多个 ACTIVE。仅设计许可的只读 \u003ccode>SUBAGENT\u003c/code> / \u003ccode>BRANCH\u003c/code> 可并行；resume/fork/replace 审计 parent 与 checkpoint checksum。\u003c/li>\n\u003cli>子能力只经 \u003ccode>resolve_subagent_capabilities\u003c/code>：禁止集合与按名称判断 write 双重拦截，禁止请求显式拒绝，不静默删减。\u003ccode>split_budget\u003c/code> 整除分配，不逐 branch 重发总预算；子 Session 不写 RunEvent，归入主 Session 的一个 ToolCall + Evidence。\u003c/li>\n\u003cli>预算内部账本不等于实际执行已受约束；主子调用、预约、消费与未知量必须满足 \u003ca href=\"#docs/design/run-budgets.md::%E4%B8%8A%E7%BA%BF%E9%97%A8%E7%A6%81%E4%B8%8E%E6%8E%A5%E7%BA%BF%E9%A1%BA%E5%BA%8F\">Run 预算上线门禁\u003c/a>。\u003c/li>\n\u003cli>资源只在凍结 scope 内物化为只读 \u003ccode>input/\u003c/code>；超限失败、不截断，不可读文件记 \u003ccode>skipped\u003c/code>，凍结 ID/hash 不符则失败。准备和缓存遵守\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>。\u003c/li>\n\u003cli>TaskSchedule 必须调用 \u003ccode>RunService.create_task_run\u003c/code>，不另建调度专用创建路径；精确 SkillVersion/输入/资源失效时停止为 ERROR，不自动换来源。不追赶停机期间全部发火；当前迟发差距与恢复规则以\u003ca href=\"#docs/design/task-scheduling.md::\">调度设计\u003c/a>为准。\u003c/li>\n\u003cli>terminal Result 至少满足通用 OutcomeEnvelope；task-specific output Schema 可选，不得仅因未声明它就报 \u003ccode>structured_output_missing\u003c/code>。Result 与人工 Evaluation 的边界见\u003ca href=\"#docs/design/results-evaluation.md::\">结果设计\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cul>\n\u003cli>资源 API client 放 \u003ccode>src/api/\u003c/code>，画面只从 \u003ccode>index.ts\u003c/code> barrel 导入；HTTP 和 Problem 转换只经 \u003ccode>api/http.ts\u003c/code> 的 \u003ccode>requestApiJson\u003c/code> / \u003ccode>requestApiEmpty\u003c/code>，mutation 传 \u003ccode>csrfToken\u003c/code> 与 \u003ccode>X-CSRF-Token\u003c/code>。响应在 client 边界校验，纯逻辑放 \u003ccode>src/lib/\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>TasksPage\u003c/code> 选择要运行的任务，\u003ccode>WorkspacePage\u003c/code> 管理当前 Run；任务中心不再实现一套 SSE/取消/终态 lifecycle。即刻和定时运行共用 \u003ccode>lib/taskDraft.ts\u003c/code> / \u003ccode>components/TaskLaunchFields.tsx\u003c/code>。\u003c/li>\n\u003cli>服务端返回的确定性 ID 不在前端重算，例如 \u003ccode>task_id\u003c/code> 只由 \u003ccode>runs/domain.py\u003c/code> 的 \u003ccode>derive_task_id\u003c/code> 定义。列表过滤在服务端进行，不能过滤第一页后冒充全量结果。\u003c/li>\n\u003cli>三语文案在 \u003ccode>src/lib/i18n/{zh,ja,en}.ts\u003c/code>，同时更新 \u003ccode>messages.ts\u003c/code> 的 \u003ccode>UiMessages\u003c/code> / \u003ccode>MESSAGES\u003c/code>；画面经 \u003ccode>useMessages()\u003c/code> 读取，不硬编码用户文案。\u003c/li>\n\u003cli>生成 FrontendModule 不继承通常 Web application 权限。bundle CSP 与 iframe 隔离必须有回归，M3 之后先完成威胁模型；公开业务 module 与生成模块分开，见\u003ca href=\"#docs/design/generated-modules.md::\">生成界面\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"同步点\">同步点\u003c/h2>\n\u003cp>仅更新本次实际受影响的项；不因设计出现新对象就机械增加 table 或公开字段。涉及公开协议时同时遵守\u003ca href=\"#docs/development/contract-workflow.md::\">契约变更与联调\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>改动\u003c/th>\n\u003cth>必须同步\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Settings\u003c/td>\n\u003ctd>\u003ccode>core/settings.py\u003c/code> 的 Field 范围 → \u003ccode>.env.example\u003c/code> → API lifespan / Worker startup 的注入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AgentEventType\u003c/td>\n\u003ctd>\u003ccode>agent/domain.py\u003c/code> → \u003ccode>agent/engine.py\u003c/code> mapper → Web \u003ccode>RUN_EVENT_NAMES\u003c/code> → RunEvent Schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blueprint / Brief / OutcomeEnvelope\u003c/td>\n\u003ctd>通用 contract → DTO/validator/projector → frozen checksum → Worker → Web validator/view → example/test；不加入业务专属 field\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Segment / Interaction / Proposal\u003c/td>\n\u003ctd>transition → DB/migration/repository → event/outbox/SSE → 授权/幂等 → Web → recovery/Compose 回归\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tool capability\u003c/td>\n\u003ctd>versioned request/response/error Schema → Provider → \u003ccode>agent/context_builder.py\u003c/code> registry → permission snapshot \u003ccode>allowed_capabilities\u003c/code> → 回归\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公开 endpoint\u003c/td>\n\u003ctd>资源 route 与 actor alias → response field allowlist / \u003ccode>ProblemException\u003c/code> → Schema/example/OpenAPI → Web client validator/barrel → 前后端回归\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DB model\u003c/td>\n\u003ctd>\u003ccode>db/models.py\u003c/code> → Alembic migration → repository DTO/projection → 回归；无 relationship 的 FK 父子同 transaction 新增时，父行后显式 \u003ccode>flush()\u003c/code>，不依赖 mapper INSERT 顺序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema / example\u003c/td>\n\u003ctd>同时注册 \u003ccode>scripts/validate_contracts.py\u003c/code> 与 \u003ccode>backend/tests/contracts/test_contracts.py\u003c/code> 两份 example 表，保持 Problem 契约兼容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenAPI\u003c/td>\n\u003ctd>endpoint 改动后运行 \u003ccode>scripts/export_openapi.py\u003c/code> 并保留 snapshot 一致性回归；只读审查不重导出掩盖缺口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构化 log\u003c/td>\n\u003ctd>在 \u003ccode>core/logging.py\u003c/code> 的 \u003ccode>_CONTEXT_FIELDS\u003c/code> allowlist 注册，否则字段会被丢弃\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>system Interpreter Skill\u003c/td>\n\u003ctd>SKILL.md/references 变更同步 SemVer、content hash、request/response example identity、prompt checksum 与测试；由 model 执行的规则须有 prompt 内容回归\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>测试置于 \u003ccode>tests/\u003c/code> 并镜像模块职责。API contract test 按资源分文件，共用 \u003ccode>tests/api/fakes.py\u003c/code> 和 \u003ccode>tests/api/conftest.py\u003c/code>，不复制认证 fixture。真实 DB 与 fake SQL 的证明范围分开，运行前读\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">验证与副作用\u003c/a>。\u003c/p>\n\u003ch2 id=\"ingress\">Ingress\u003c/h2>\n\u003cul>\n\u003cli>复用已存在的共享 Traefik；不新增 Traefik service、静态配置、证书 resolver、dashboard 或 Docker socket mount。\u003c/li>\n\u003cli>ProjectMind container 不发布 host port；只有 \u003ccode>web\u003c/code> / \u003ccode>api\u003c/code> 进入外部 edge network，PostgreSQL、Redis、MinIO、Worker、Sandbox 只进内部网络。\u003c/li>\n\u003cli>外部 URL 都在 \u003ccode>PROJECTMIND_CONTEXT_PATH\u003c/code> 下，\u003ccode>{contextPath}/api\u003c/code> 归 API，其余归 Web。Traefik 去掉 context path，内部 FastAPI route 保持 \u003ccode>/api\u003c/code>、Web 静态 route 保持 \u003ccode>/\u003c/code>。\u003c/li>\n\u003cli>设置来源与停写、迁移、放行遵守\u003ca href=\"#docs/operations/deployment.md::\">发布与迁移\u003c/a>；功能开关不能冒充全局停止证明。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "按改动类型查阅的实现细则", "level": "h1", "anchor": "按改动类型查阅的实现细则", "text": "# 按改动类型查阅的实现细则\n\n本页由 [AGENTS.md](../../PJM/AGENTS.md)强制引用，只需阅读本次改动涉及的章节。它保留实现级约束，不重复领域设计、运行命令或当前进度；设计入口见[变更指南](change-guide.md)。\n\n下文 Backend 路径以 `PJM/backend/src/projectmind/` 为基准，Web 路径以 `PJM/web/` 为基准。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\nroute 只负责认证和入出参，业务判断在 domain/service，查询、锁和持久化在 repository；不得在 route 或 ARQ job 中嵌入业务判断。公开 route 只在 `api/routes/` 的资源模块单层实现，不增加未认证的并行实现或转发 wrapper。\n\n必须复用下列单一实现；新增语义在原入口扩展，不复制一份分支：\n\n| 处理 | 唯一入口与限制 |\n| --- | --- |\n| JSON 与 SHA-256 | `core/hashing.py` 的 `canonical_json` / `sha256_hex`；`skills/importer.py`、`agent/fixture_providers.py` 已持久化的历史 hash 格式不得顺手改变 |\n| 敏感字段 | `core/redaction.py` 的 `find_sensitive_key`，Evidence 与 Tool response 共用词表 |\n| Lease token | `runs/domain.py` 的 `lease_token_hash` |\n| RunEvent / Outbox | `RunRepository` 的 `_snapshot_event`、`_event_outbox`、`_dispatch_outbox` 与 `_next_sequence`，定义在 `runs/repository_base.py` |\n| 认证/授权 Problem | `api/auth_dependencies.py` 的共享 factory；Run 使用 `api/routes/runs.py` 的 `run_not_found_problem` / `authorized_run` |\n| 凍结 binding 与 Secret | `agent/run_binding.py` 的 `load_bound_run_resource` / `resolve_binding_secret`，执行前核对 checksum、Integration 状态、provider、revision、capability |\n| 外部 repository | `agent/repository_client.py` / `agent/repository_source.py`，物化、read Provider 和 write effect 均走此处，不另写 subprocess 或凭据解析 |\n| 可 apply 的 effect | `effects/catalog.py` 的 `EFFECT_CAPABILITIES`，创建、校验、执行与审批重新校验使用同一表 |\n| Binary 转文字 | `agent/binary_text.py` 的 `render_text`，新增格式不在各 Provider 单独转换 |\n\n`documents/__init__.py` 只导出 domain 类型；service/repository/source 显式从各模块导入，避免 DB model → Run domain → 文档规则形成循环 import。\n\n`repository.write/v1` 的 `preauthorizable=False` 不得放宽。Integration 的 `write_mode` 决定目标：`direct` 仅默认 branch 的 fast-forward，`branch` 仅新建 `projectmind/` 预留命名空间 branch；均不可 force、覆盖既有 branch 或直接写任意 branch。完整协议见[受控写入](../design/repository-effects.md)。"}, {"title": "Run lifecycle", "level": "h2", "anchor": "run-lifecycle", "text": "## Run lifecycle\n\n修改 Run、Worker、Session、调度或子 Agent 时，先读 [Runtime](../design/agent-runtime.md)、[监督与停止](../design/run-supervision.md)及本次涉及的领域设计，再核对以下实现约束。\n\n- 状态转换只经 `plan_run_transition` / `ALLOWED_RUN_TRANSITIONS`。row lock 固定 Run → Segment → Attempt；旧 migration 前路径维持 Run → Attempt，不反转 `_lock_claimed_execution` 的取锁顺序。\n- 用户答复/批准追加 Segment，worker retry/recovery 在同 Segment 追加 Attempt；等待期间不持有 worker lease 或 active wall timeout。原请求重发、新运行和 Attempt 恢复分别遵守[创建协议](../design/run-creation.md)，不得省略 actor/Project/精确版校验。\n- 终态的 `RUN_SNAPSHOT` 是该 Run 最后一个 event；sequence 在 Run 内严格单调，`TEXT_DELTA` 消耗 sequence 但不持久化，缺号正常。遵守 `contracts/events/run-event/v1.schema.json`，不改成子层级编号。\n- 任何重新 dispatch 都经过 claim 的 `PROJECTMIND_RUN_MAX_ATTEMPTS` 上限；耗尽时以 `retry_exhausted` 关闭为 FAILED。\n- Executor 强制 `wall_timeout_seconds` deadline，只中断 event 等待，不中断终态 transaction；ARQ `job_timeout` 保持更长，不能替代执行 deadline。\n- PRIMARY Session 顺序执行，不允许同时多个 ACTIVE。仅设计许可的只读 `SUBAGENT` / `BRANCH` 可并行；resume/fork/replace 审计 parent 与 checkpoint checksum。\n- 子能力只经 `resolve_subagent_capabilities`：禁止集合与按名称判断 write 双重拦截，禁止请求显式拒绝，不静默删减。`split_budget` 整除分配，不逐 branch 重发总预算；子 Session 不写 RunEvent，归入主 Session 的一个 ToolCall + Evidence。\n- 预算内部账本不等于实际执行已受约束；主子调用、预约、消费与未知量必须满足 [Run 预算上线门禁](../design/run-budgets.md#上线门禁与接线顺序)。\n- 资源只在凍结 scope 内物化为只读 `input/`；超限失败、不截断，不可读文件记 `skipped`，凍结 ID/hash 不符则失败。准备和缓存遵守[资源快照](../design/resource-snapshots.md)。\n- TaskSchedule 必须调用 `RunService.create_task_run`，不另建调度专用创建路径；精确 SkillVersion/输入/资源失效时停止为 ERROR，不自动换来源。不追赶停机期间全部发火；当前迟发差距与恢复规则以[调度设计](../design/task-scheduling.md)为准。\n- terminal Result 至少满足通用 OutcomeEnvelope；task-specific output Schema 可选，不得仅因未声明它就报 `structured_output_missing`。Result 与人工 Evaluation 的边界见[结果设计](../design/results-evaluation.md)。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n- 资源 API client 放 `src/api/`，画面只从 `index.ts` barrel 导入；HTTP 和 Problem 转换只经 `api/http.ts` 的 `requestApiJson` / `requestApiEmpty`，mutation 传 `csrfToken` 与 `X-CSRF-Token`。响应在 client 边界校验，纯逻辑放 `src/lib/`。\n- `TasksPage` 选择要运行的任务，`WorkspacePage` 管理当前 Run；任务中心不再实现一套 SSE/取消/终态 lifecycle。即刻和定时运行共用 `lib/taskDraft.ts` / `components/TaskLaunchFields.tsx`。\n- 服务端返回的确定性 ID 不在前端重算，例如 `task_id` 只由 `runs/domain.py` 的 `derive_task_id` 定义。列表过滤在服务端进行，不能过滤第一页后冒充全量结果。\n- 三语文案在 `src/lib/i18n/{zh,ja,en}.ts`，同时更新 `messages.ts` 的 `UiMessages` / `MESSAGES`；画面经 `useMessages()` 读取，不硬编码用户文案。\n- 生成 FrontendModule 不继承通常 Web application 权限。bundle CSP 与 iframe 隔离必须有回归，M3 之后先完成威胁模型；公开业务 module 与生成模块分开，见[生成界面](../design/generated-modules.md)。"}, {"title": "同步点", "level": "h2", "anchor": "同步点", "text": "## 同步点\n\n仅更新本次实际受影响的项；不因设计出现新对象就机械增加 table 或公开字段。涉及公开协议时同时遵守[契约变更与联调](contract-workflow.md)。\n\n| 改动 | 必须同步 |\n| --- | --- |\n| Settings | `core/settings.py` 的 Field 范围 → `.env.example` → API lifespan / Worker startup 的注入 |\n| AgentEventType | `agent/domain.py` → `agent/engine.py` mapper → Web `RUN_EVENT_NAMES` → RunEvent Schema |\n| Blueprint / Brief / OutcomeEnvelope | 通用 contract → DTO/validator/projector → frozen checksum → Worker → Web validator/view → example/test；不加入业务专属 field |\n| Segment / Interaction / Proposal | transition → DB/migration/repository → event/outbox/SSE → 授权/幂等 → Web → recovery/Compose 回归 |\n| Tool capability | versioned request/response/error Schema → Provider → `agent/context_builder.py` registry → permission snapshot `allowed_capabilities` → 回归 |\n| 公开 endpoint | 资源 route 与 actor alias → response field allowlist / `ProblemException` → Schema/example/OpenAPI → Web client validator/barrel → 前后端回归 |\n| DB model | `db/models.py` → Alembic migration → repository DTO/projection → 回归；无 relationship 的 FK 父子同 transaction 新增时，父行后显式 `flush()`，不依赖 mapper INSERT 顺序 |\n| Schema / example | 同时注册 `scripts/validate_contracts.py` 与 `backend/tests/contracts/test_contracts.py` 两份 example 表，保持 Problem 契约兼容 |\n| OpenAPI | endpoint 改动后运行 `scripts/export_openapi.py` 并保留 snapshot 一致性回归；只读审查不重导出掩盖缺口 |\n| 结构化 log | 在 `core/logging.py` 的 `_CONTEXT_FIELDS` allowlist 注册，否则字段会被丢弃 |\n| system Interpreter Skill | SKILL.md/references 变更同步 SemVer、content hash、request/response example identity、prompt checksum 与测试；由 model 执行的规则须有 prompt 内容回归 |\n\n测试置于 `tests/` 并镜像模块职责。API contract test 按资源分文件，共用 `tests/api/fakes.py` 和 `tests/api/conftest.py`，不复制认证 fixture。真实 DB 与 fake SQL 的证明范围分开，运行前读[验证与副作用](local-development.md#変更に応じた検証)。"}, {"title": "Ingress", "level": "h2", "anchor": "ingress", "text": "## Ingress\n\n- 复用已存在的共享 Traefik；不新增 Traefik service、静态配置、证书 resolver、dashboard 或 Docker socket mount。\n- ProjectMind container 不发布 host port；只有 `web` / `api` 进入外部 edge network，PostgreSQL、Redis、MinIO、Worker、Sandbox 只进内部网络。\n- 外部 URL 都在 `PROJECTMIND_CONTEXT_PATH` 下，`{contextPath}/api` 归 API，其余归 Web。Traefik 去掉 context path，内部 FastAPI route 保持 `/api`、Web 静态 route 保持 `/`。\n- 设置来源与停写、迁移、放行遵守[发布与迁移](../operations/deployment.md)；功能开关不能冒充全局停止证明。"}], "toc": [{"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "Run lifecycle", "anchor": "run-lifecycle", "level": "h2"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "同步点", "anchor": "同步点", "level": "h2"}, {"title": "Ingress", "anchor": "ingress", "level": "h2"}], "source": "development/coding-rules.md", "checksum": "f26d2c59a75686e34e4960766be86ce66368346c017cc0e2727f0f4bdc8c8f81"}, {"id": "docs/development/contract-workflow.md", "title": "公开契约变更与联调", "group": "development", "html": "\u003ch1 id=\"公开契约变更与联调\">公开契约变更与联调\u003c/h1>\n\u003cp>本页负责跨层交付；字段规则在\u003ca href=\"#docs/design/README.md::\">领域设计\u003c/a>，实现状态在\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>，命令环境在\u003ca href=\"#docs/development/local-development.md::\">本地开发\u003c/a>。\u003c/p>\n\u003ch2 id=\"先看整条交付链\">先看整条交付链\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">领域规则/授权/兼容 → Schema/example → Backend 生产\n  → Web/Worker 消费 → 契约与流程验证 → 版本匹配及发布\n\u003c/code>\u003c/pre>\n\u003cp>按影响修改，不机械改全部层。新增 required、删除字段、收窄 enum、改变空值或 HTTP 拒绝语义都可能破坏兼容，即使 URL 与 v1 文件名未变。\u003c/p>\n\u003ch2 id=\"三种数据不要混成一份\">三种数据不要混成一份\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层\u003c/th>\n\u003cth>责任与边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>持久快照\u003c/td>\n\u003ctd>保存当时事实、格式版与校验值；不为新页面重写旧 Run/hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公开响应\u003c/td>\n\u003ctd>授权后白名单投影；不直接返回内部 JSON 列，也不修改原值来完成脱敏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面状态\u003c/td>\n\u003ctd>validator 后生成视图；不补造历史资源、不自行推导身份、不把缺字段视为成功\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"开工时列出消费者和同步先后\">开工时列出消费者和同步先后\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>检查面\u003c/th>\n\u003cth>实际入口与检查内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>形状与 HTTP\u003c/td>\n\u003ctd>\u003ca href=\"#PJM/README.md::contracts\">Contracts\u003c/a>、\u003ca href=\"../PJM/backend/src/projectmind/api/routes\">routes\u003c/a>：required/nullable/enum、额外字段、status、header、缓存与 Problem\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>授权与业务\u003c/td>\n\u003ctd>service/projection、\u003ca href=\"../PJM/backend/src/projectmind/api/auth_dependencies.py\">actor dependencies\u003c/a>：归属、hash、幂等与历史格式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持久与执行\u003c/td>\n\u003ctd>DB/repository/Worker：新旧格式、迁移必要性与读写顺序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web 与旁路\u003c/td>\n\u003ctd>api validator/barrel、组件、三语、Schedule、CLI、fixture 与 mock browser：正常/缺失/拒绝/历史分支\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>派生契约\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/contracts/openapi/projectmind-api.v1.json\">OpenAPI\u003c/a>：由当前 app 生成，禁止手补快照\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>新 example 同步 \u003ca href=\"../PJM/scripts/validate_contracts.py\">validator 注册\u003c/a>与 \u003ca href=\"../PJM/backend/tests/contracts/test_contracts.py\">Backend 契约测试\u003c/a>。JSON Schema 不验证授权、内容 hash 或数据库竞争。具体强制同步见\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">实现细则\u003c/a>。\u003c/p>\n\u003cp>例如登录 429/503 复用 Problem JSON，但要求 HTTP client 保留 Retry-After、页面区分拒绝原因；仅验 Schema 会遗漏 header。OpenAPI 一致性也只证明快照等于声明，还需检查声明是否覆盖实际 body、media type 和 header。\u003c/p>\n\u003ch2 id=\"遇到未接齐的交付链\">遇到未接齐的交付链\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>接续动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>DTO/model 有，route 未调用\u003c/td>\n\u003ctd>找装配和用例，不把字段当公开 API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>route/Schema 有，OpenAPI 缺操作\u003c/td>\n\u003ctd>核对语义后运行 exporter，不重造 API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API 齐，client/page 缺失\u003c/td>\n\u003ctd>先接 validator/barrel，再验实际用户流程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>example 通过而一致性失败\u003c/td>\n\u003ctd>分开报告，不能以静态合法代替交付一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>单模块通过但合跑收集失败\u003c/td>\n\u003ctd>保留失败，修复 fixture/import 后重跑相同组合；未收集不算通过\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>只读检查需 Backend 开发依赖，不启动 lifespan、不连 DB、不回写 OpenAPI。在 \u003ccode>PJM/\u003c/code> 执行 \u003ccode>python3 scripts/validate_contracts.py\u003c/code>；在 \u003ccode>PJM/backend/\u003c/code> 执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pytest -p no:cacheprovider -o addopts= -q \\\n  tests/contracts/test_contracts.py::test_exported_openapi_is_current\n\u003c/code>\u003c/pre>\n\u003cp>文档整理遇到失败只说明断点；获准改 API 时才在 \u003ccode>PJM/\u003c/code> 运行 \u003ccode>python3 scripts/export_openapi.py\u003c/code>，同时完成消费者和测试同步。不要关闭校验或修改 example 空值来掩盖断链。\u003c/p>\n\u003ch2 id=\"历史数据兼容不等于前后端版本兼容\">历史数据兼容不等于前后端版本兼容\u003c/h2>\n\u003cul>\n\u003cli>新 API 读取旧 Run：缺快照返回明确历史状态，保留结果，不从今天的资源补齐。\u003c/li>\n\u003cli>新 Web 读取旧 API：只接受已定义的兼容形状，否则报版本/契约错误；必需字段不能默认空数组。\u003c/li>\n\u003cli>旧 Web 读取新响应：核对额外字段与 enum 的 validator；不假定 JSON 天然兼容。\u003c/li>\n\u003cli>API/Worker 与回退：确认 schema、队列、非终态快照与安全规则可读；不能删审计或降级校验换取回退。\u003c/li>\n\u003c/ul>\n\u003cp>即使同批发布，也要考虑旧浏览器、未退出 Worker 和在途请求。损坏的可选展示可以按领域规则降级，身份、授权和必需协议错误不能降级为成功。\u003c/p>\n\u003ch2 id=\"示例run-的冻结文档读取投影\">示例：Run 的冻结文档读取投影\u003c/h2>\n\u003cp>按\u003ca href=\"#docs/design/resource-snapshots.md::%E5%85%AC%E5%BC%80%E9%80%89%E6%8B%A9%E4%B8%8E%E8%AF%BB%E5%8F%96%E6%8A%95%E5%BD%B1%E7%9A%84%E5%AE%9E%E6%96%BD%E5%A5%91%E7%BA%A6\">资源投影\u003c/a>核对：即时/调度显式选择 → 创建固定成员 → detail 白名单完整投影 / history 摘要 → Web 三态解析与三语。FROZEN 有清单，LEGACY_UNAVAILABLE/INVALID 无成员；不公开内部 binding，也不让当前目录改变旧 Run。\u003c/p>\n\u003cp>这些状态说明清单可信程度，不证明 blob 可读、物化完成或 Run 成功。验收覆盖跨 Project/slot/hash 拒绝、新上传不入旧清单、历史分支及 route/Schema/example/OpenAPI/Web fixture 一致。\u003c/p>\n\u003ch2 id=\"怎样记录验证结论\">怎样记录验证结论\u003c/h2>\n\u003cp>分别报告文档、契约、Backend/Web、真实事务、用户流程和部署/Provider/模型的范围；mock、skip、失败和未执行明确标注。真实 DB、部署或外部写入需授权的隔离目标。当前断点只写计划，规则回到设计，不再追加历史日志或借用旧测试数字。\u003c/p>\n", "sections": [{"title": "公开契约变更与联调", "level": "h1", "anchor": "公开契约变更与联调", "text": "# 公开契约变更与联调\n\n本页负责跨层交付；字段规则在[领域设计](../design/README.md)，实现状态在[计划](../planning/roadmap.md)，命令环境在[本地开发](local-development.md)。"}, {"title": "先看整条交付链", "level": "h2", "anchor": "先看整条交付链", "text": "## 先看整条交付链\n\n```text\n领域规则/授权/兼容 → Schema/example → Backend 生产\n  → Web/Worker 消费 → 契约与流程验证 → 版本匹配及发布\n```\n\n按影响修改，不机械改全部层。新增 required、删除字段、收窄 enum、改变空值或 HTTP 拒绝语义都可能破坏兼容，即使 URL 与 v1 文件名未变。"}, {"title": "三种数据不要混成一份", "level": "h2", "anchor": "三种数据不要混成一份", "text": "## 三种数据不要混成一份\n\n| 层 | 责任与边界 |\n| --- | --- |\n| 持久快照 | 保存当时事实、格式版与校验值；不为新页面重写旧 Run/hash |\n| 公开响应 | 授权后白名单投影；不直接返回内部 JSON 列，也不修改原值来完成脱敏 |\n| 页面状态 | validator 后生成视图；不补造历史资源、不自行推导身份、不把缺字段视为成功 |"}, {"title": "开工时列出消费者和同步先后", "level": "h2", "anchor": "开工时列出消费者和同步先后", "text": "## 开工时列出消费者和同步先后\n\n| 检查面 | 实际入口与检查内容 |\n| --- | --- |\n| 形状与 HTTP | [Contracts](../../PJM/README.md#contracts)、[routes](../../PJM/backend/src/projectmind/api/routes/)：required/nullable/enum、额外字段、status、header、缓存与 Problem |\n| 授权与业务 | service/projection、[actor dependencies](../../PJM/backend/src/projectmind/api/auth_dependencies.py)：归属、hash、幂等与历史格式 |\n| 持久与执行 | DB/repository/Worker：新旧格式、迁移必要性与读写顺序 |\n| Web 与旁路 | api validator/barrel、组件、三语、Schedule、CLI、fixture 与 mock browser：正常/缺失/拒绝/历史分支 |\n| 派生契约 | [OpenAPI](../../PJM/contracts/openapi/projectmind-api.v1.json)：由当前 app 生成，禁止手补快照 |\n\n新 example 同步 [validator 注册](../../PJM/scripts/validate_contracts.py)与 [Backend 契约测试](../../PJM/backend/tests/contracts/test_contracts.py)。JSON Schema 不验证授权、内容 hash 或数据库竞争。具体强制同步见[实现细则](coding-rules.md#同步点)。\n\n例如登录 429/503 复用 Problem JSON，但要求 HTTP client 保留 Retry-After、页面区分拒绝原因；仅验 Schema 会遗漏 header。OpenAPI 一致性也只证明快照等于声明，还需检查声明是否覆盖实际 body、media type 和 header。"}, {"title": "遇到未接齐的交付链", "level": "h2", "anchor": "遇到未接齐的交付链", "text": "## 遇到未接齐的交付链\n\n| 现象 | 接续动作 |\n| --- | --- |\n| DTO/model 有，route 未调用 | 找装配和用例，不把字段当公开 API |\n| route/Schema 有，OpenAPI 缺操作 | 核对语义后运行 exporter，不重造 API |\n| API 齐，client/page 缺失 | 先接 validator/barrel，再验实际用户流程 |\n| example 通过而一致性失败 | 分开报告，不能以静态合法代替交付一致 |\n| 单模块通过但合跑收集失败 | 保留失败，修复 fixture/import 后重跑相同组合；未收集不算通过 |\n\n只读检查需 Backend 开发依赖，不启动 lifespan、不连 DB、不回写 OpenAPI。在 `PJM/` 执行 `python3 scripts/validate_contracts.py`；在 `PJM/backend/` 执行：\n\n```bash\npython3 -m pytest -p no:cacheprovider -o addopts= -q \\\n  tests/contracts/test_contracts.py::test_exported_openapi_is_current\n```\n\n文档整理遇到失败只说明断点；获准改 API 时才在 `PJM/` 运行 `python3 scripts/export_openapi.py`，同时完成消费者和测试同步。不要关闭校验或修改 example 空值来掩盖断链。"}, {"title": "历史数据兼容不等于前后端版本兼容", "level": "h2", "anchor": "历史数据兼容不等于前后端版本兼容", "text": "## 历史数据兼容不等于前后端版本兼容\n\n- 新 API 读取旧 Run：缺快照返回明确历史状态，保留结果，不从今天的资源补齐。\n- 新 Web 读取旧 API：只接受已定义的兼容形状，否则报版本/契约错误；必需字段不能默认空数组。\n- 旧 Web 读取新响应：核对额外字段与 enum 的 validator；不假定 JSON 天然兼容。\n- API/Worker 与回退：确认 schema、队列、非终态快照与安全规则可读；不能删审计或降级校验换取回退。\n\n即使同批发布，也要考虑旧浏览器、未退出 Worker 和在途请求。损坏的可选展示可以按领域规则降级，身份、授权和必需协议错误不能降级为成功。"}, {"title": "示例：Run 的冻结文档读取投影", "level": "h2", "anchor": "示例run-的冻结文档读取投影", "text": "## 示例：Run 的冻结文档读取投影\n\n按[资源投影](../design/resource-snapshots.md#公开选择与读取投影的实施契约)核对：即时/调度显式选择 → 创建固定成员 → detail 白名单完整投影 / history 摘要 → Web 三态解析与三语。FROZEN 有清单，LEGACY_UNAVAILABLE/INVALID 无成员；不公开内部 binding，也不让当前目录改变旧 Run。\n\n这些状态说明清单可信程度，不证明 blob 可读、物化完成或 Run 成功。验收覆盖跨 Project/slot/hash 拒绝、新上传不入旧清单、历史分支及 route/Schema/example/OpenAPI/Web fixture 一致。"}, {"title": "怎样记录验证结论", "level": "h2", "anchor": "怎样记录验证结论", "text": "## 怎样记录验证结论\n\n分别报告文档、契约、Backend/Web、真实事务、用户流程和部署/Provider/模型的范围；mock、skip、失败和未执行明确标注。真实 DB、部署或外部写入需授权的隔离目标。当前断点只写计划，规则回到设计，不再追加历史日志或借用旧测试数字。"}], "toc": [{"title": "先看整条交付链", "anchor": "先看整条交付链", "level": "h2"}, {"title": "三种数据不要混成一份", "anchor": "三种数据不要混成一份", "level": "h2"}, {"title": "开工时列出消费者和同步先后", "anchor": "开工时列出消费者和同步先后", "level": "h2"}, {"title": "遇到未接齐的交付链", "anchor": "遇到未接齐的交付链", "level": "h2"}, {"title": "历史数据兼容不等于前后端版本兼容", "anchor": "历史数据兼容不等于前后端版本兼容", "level": "h2"}, {"title": "示例：Run 的冻结文档读取投影", "anchor": "示例run-的冻结文档读取投影", "level": "h2"}, {"title": "怎样记录验证结论", "anchor": "怎样记录验证结论", "level": "h2"}], "source": "development/contract-workflow.md", "checksum": "7afc07e8c952ffc4132000c271bf6223e38f507a94b3cc5896c4758cdc3ce8af"}, {"id": "docs/development/api-usage.md", "title": "API 利用ガイド", "group": "development", "html": "\u003ch1 id=\"api-利用ガイド\">API 利用ガイド\u003c/h1>\n\u003cp>公開形状は \u003ca href=\"#PJM/README.md::contracts\">Contracts\u003c/a> と配備先の \u003ccode>/api/docs\u003c/code>、状態は\u003ca href=\"#docs/planning/roadmap.md::\">計画\u003c/a>を参照する。保存 OpenAPI と工作副本の不一致は\u003ca href=\"#docs/development/contract-workflow.md::%E9%81%87%E5%88%B0%E6%9C%AA%E6%8E%A5%E9%BD%90%E7%9A%84%E4%BA%A4%E4%BB%98%E9%93%BE\">契約確認\u003c/a>で切り分ける。以下の path は context path 配下の \u003ccode>/api/v1\u003c/code> 起点。\u003c/p>\n\u003ch2 id=\"認証してから呼び出す\">認証してから呼び出す\u003c/h2>\n\u003cp>全業務 API と SSE は認証必須。password、Cookie、CSRF を command 行、shell history、URL、共有 log に置かず、保護された client 入力を使う。session token は Web storage に保存しない。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>順序\u003c/th>\n\u003cth>API と必要な情報\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ccode>GET /auth/login-context\u003c/code> で context cookie と login CSRF を取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>\u003ccode>POST /auth/login\u003c/code> に上記 cookie、Origin、CSRF と \u003ca href=\"../PJM/contracts/auth/v1/login-request.schema.json\">login request\u003c/a> を送信\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>業務 API に session cookie、unsafe request にはさらに Origin と業務用 \u003ccode>X-CSRF-Token\u003c/code> を送信\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>login-context / login は両方とも来源配額を消費する。429 は Retry-After を確認して止め、503 を password 誤りと扱わない。再試行は利用者が新 challenge から明示的に行い、自動 password 再送・challenge polling・來源切替で制限を回避しない。送信後の通信失敗は結果不明で、abort は session 作成を取り消さない。\u003c/p>\n\u003cp>v2 の \u003ccode>GET /auth/session\u003c/code> は同一 session に同じ CSRF を返すが、idle を更新し得る。別 login、期限、role/失効が変われば旧値は使えない。403 や通信失敗を理由に業務 mutation を自動再送しない。\u003ca href=\"#docs/operations/runbook.md::%E8%AE%A4%E8%AF%81%E6%95%85%E9%9A%9C%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">認証分診\u003c/a>と\u003ca href=\"#docs/operations/deployment.md::%E4%BC%9A%E8%AF%9D%E5%8D%8F%E8%AE%AE%E5%88%87%E6%8D%A2%E6%A3%80%E6%9F%A5\">会話切替\u003c/a>を参照する。\u003c/p>\n\u003cp>Project preference/UI language は\u003ca href=\"#docs/design/user-lifecycle.md::\">アカウント管理\u003c/a>とは別資源。管理 API/Schema/client は存在するが、OpenAPI・ページ接線と全体検証の状態は計画で確認し、配備済みと仮定しない。無効・権限外の明示 Project を別 Project へ暗黙に切り替えてはならない。\u003c/p>\n\u003ch2 id=\"task-を選び一回の-run-を作る\">Task を選び、一回の Run を作る\u003c/h2>\n\u003col>\n\u003cli>\u003ccode>GET /projects/{id}/tasks\u003c/code> から精確 SkillVersion/task_key、入力 Schema と resource candidate を取得する。\u003c/li>\n\u003cli>\u003ccode>POST /projects/{id}/task-runs\u003c/code> に\u003ca href=\"../PJM/contracts/runs/task-create/v1/request.schema.json\">作成契約\u003c/a>の入力と、新規要求用の Idempotency-Key を送る。\u003ccode>input:{} / sources:{}\u003c/code> は常に合法な既定値ではない。\u003c/li>\n\u003cli>返された Run ID で \u003ccode>GET /projects/{id}/runs/{run_id}/detail\u003c/code> と SSE を取得する。作成成功は実行成功ではない。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"再送継続権限の規則\">再送・継続・権限の規則\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>保持する規則\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>作成の再送\u003c/td>\n\u003ctd>同じ actor、原内容と key で確認する。同一要求は 200 / Idempotent-Replay、同 key の別意図は 409。新しい実行だけ別 key にする\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>結果不明\u003c/td>\n\u003ctd>timeout は取消ではない。原要求を保全し、自動で新 key を発行しない。Web のページ内確認は refresh/離頁/actor・Project 切替を越えて保持されない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>授権\u003c/td>\n\u003ctd>不存在と越権は同じ 404。Skill/Integration 管理は ADMIN、通常業務は Project の ACTIVE member（組織内 ADMIN は bypass）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取消\u003c/td>\n\u003ctd>\u003ccode>POST /runs/{run_id}/cancel\u003c/code> の REQUESTED/CANCELLED と後続状態を確認する。SUCCEEDED/FAILED が先なら 409。HTTP 成功や CANCELLED は process 退出の証明ではない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SSE\u003c/td>\n\u003ctd>\u003ccode>GET /runs/{run_id}/events\u003c/code> は Last-Event-ID / after から持続 event を再開する。一時 TEXT_DELTA は event ID を進めない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部批准\u003c/td>\n\u003ctd>Proposal の version/checksum/key が必要。Run 起動者か system ADMIN が判断し、Secret locator/config/credential は公開しない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>原要求確認は現在の認証・Project 授権を満たしたうえで行う。公開停止や資源変更後の確認と、新規作成時の資源検証は別であり、後者を緩めない。未知の旧形式は拒否する。詳細は\u003ca href=\"#docs/design/run-creation.md::\">Run 作成\u003c/a>。\u003c/p>\n\u003ch2 id=\"待機中の回答と結果評価\">待機中の回答と結果評価\u003c/h2>\n\u003cp>普通の CLARIFICATION / CHOICE / REVIEW は \u003ccode>POST /projects/{id}/runs/{run_id}/interactions/{interaction_id}/responses\u003c/code> に、表示中の interaction version と\u003ca href=\"../PJM/contracts/runs/interaction-response/v1/request.schema.json\">回答契約\u003c/a>、原回答の key を送る。\u003c/p>\n\u003cp>初回は 201、同じ内容/版/key の重放は 200。返却する現在の Run status は必ずしも QUEUED ではない。409 は競合、410 は期限切れだが、後者は過期 continuation の commit 後にも返る。通信失敗・410 を rollback と解釈せず、原 actor/内容を保って確認する。現在の回答 Web に完全な原要求確認はないため、detail と保存済み回答を先に読む。\u003c/p>\n\u003cp>Proposal decision と Evaluation は別 endpoint。Evaluation は追加式で原 Result を変更せず、pointer は \u003ccode>detail.result.data\u003c/code> の根を指す。回答と同じ幂等契約はなく、履歴の同文・時刻から原要求成功を断定して自動再送しない。詳しくは\u003ca href=\"#docs/design/user-interactions.md::\">普通答复\u003c/a>と\u003ca href=\"#docs/design/results-evaluation.md::\">结果与评价\u003c/a>。\u003c/p>\n\u003ch2 id=\"文書を選び元の範囲を確認する\">文書を選び、元の範囲を確認する\u003c/h2>\n\u003cp>候補から単一文書、2 件以上の集合、明示的な全集を選ぶ。任意 slot を使わない場合は省略し、候補先頭を同意の代用にしない。必須未選択、失効 ID、空/上限超過の全集は拒否される。token と上限の正本は\u003ca href=\"#docs/design/resource-snapshots.md::%E5%85%AC%E5%BC%80%E9%80%89%E6%8B%A9%E4%B8%8E%E8%AF%BB%E5%8F%96%E6%8A%95%E5%BD%B1%E7%9A%84%E5%AE%9E%E6%96%BD%E5%A5%91%E7%BA%A6\">資源設計\u003c/a>。\u003c/p>\n\u003cp>detail の \u003ccode>document_snapshots\u003c/code> は作成時の清単で、FROZEN のみ検証済みメンバーを含む。LEGACY_UNAVAILABLE / INVALID は snapshot:null。history の \u003ccode>selected_sources\u003c/code> は摘要だけである。どれも現在の blob 可読性や実行成功を保証しない。\u003c/p>\n\u003cp>現行 Web は清単 field を必須として検証する。旧 Run の明示的な歴史状態と、旧 API が field を返せない契約エラーを混ぜず、空集合への fallback をしない。片側更新・回退は\u003ca href=\"#docs/development/contract-workflow.md::%E5%8E%86%E5%8F%B2%E6%95%B0%E6%8D%AE%E5%85%BC%E5%AE%B9%E4%B8%8D%E7%AD%89%E4%BA%8E%E5%89%8D%E5%90%8E%E7%AB%AF%E7%89%88%E6%9C%AC%E5%85%BC%E5%AE%B9\">版互換\u003c/a>を確認する。\u003c/p>\n", "sections": [{"title": "API 利用ガイド", "level": "h1", "anchor": "api-利用ガイド", "text": "# API 利用ガイド\n\n公開形状は [Contracts](../../PJM/README.md#contracts) と配備先の `/api/docs`、状態は[計画](../planning/roadmap.md)を参照する。保存 OpenAPI と工作副本の不一致は[契約確認](contract-workflow.md#遇到未接齐的交付链)で切り分ける。以下の path は context path 配下の `/api/v1` 起点。"}, {"title": "認証してから呼び出す", "level": "h2", "anchor": "認証してから呼び出す", "text": "## 認証してから呼び出す\n\n全業務 API と SSE は認証必須。password、Cookie、CSRF を command 行、shell history、URL、共有 log に置かず、保護された client 入力を使う。session token は Web storage に保存しない。\n\n| 順序 | API と必要な情報 |\n| --- | --- |\n| 1 | `GET /auth/login-context` で context cookie と login CSRF を取得 |\n| 2 | `POST /auth/login` に上記 cookie、Origin、CSRF と [login request](../../PJM/contracts/auth/v1/login-request.schema.json) を送信 |\n| 3 | 業務 API に session cookie、unsafe request にはさらに Origin と業務用 `X-CSRF-Token` を送信 |\n\nlogin-context / login は両方とも来源配額を消費する。429 は Retry-After を確認して止め、503 を password 誤りと扱わない。再試行は利用者が新 challenge から明示的に行い、自動 password 再送・challenge polling・來源切替で制限を回避しない。送信後の通信失敗は結果不明で、abort は session 作成を取り消さない。\n\nv2 の `GET /auth/session` は同一 session に同じ CSRF を返すが、idle を更新し得る。別 login、期限、role/失効が変われば旧値は使えない。403 や通信失敗を理由に業務 mutation を自動再送しない。[認証分診](../operations/runbook.md#认证故障的只读分诊)と[会話切替](../operations/deployment.md#会话协议切换检查)を参照する。\n\nProject preference/UI language は[アカウント管理](../design/user-lifecycle.md)とは別資源。管理 API/Schema/client は存在するが、OpenAPI・ページ接線と全体検証の状態は計画で確認し、配備済みと仮定しない。無効・権限外の明示 Project を別 Project へ暗黙に切り替えてはならない。"}, {"title": "Task を選び、一回の Run を作る", "level": "h2", "anchor": "task-を選び一回の-run-を作る", "text": "## Task を選び、一回の Run を作る\n\n1. `GET /projects/{id}/tasks` から精確 SkillVersion/task_key、入力 Schema と resource candidate を取得する。\n2. `POST /projects/{id}/task-runs` に[作成契約](../../PJM/contracts/runs/task-create/v1/request.schema.json)の入力と、新規要求用の Idempotency-Key を送る。`input:{} / sources:{}` は常に合法な既定値ではない。\n3. 返された Run ID で `GET /projects/{id}/runs/{run_id}/detail` と SSE を取得する。作成成功は実行成功ではない。"}, {"title": "再送・継続・権限の規則", "level": "h2", "anchor": "再送継続権限の規則", "text": "## 再送・継続・権限の規則\n\n| 操作 | 保持する規則 |\n| --- | --- |\n| 作成の再送 | 同じ actor、原内容と key で確認する。同一要求は 200 / Idempotent-Replay、同 key の別意図は 409。新しい実行だけ別 key にする |\n| 結果不明 | timeout は取消ではない。原要求を保全し、自動で新 key を発行しない。Web のページ内確認は refresh/離頁/actor・Project 切替を越えて保持されない |\n| 授権 | 不存在と越権は同じ 404。Skill/Integration 管理は ADMIN、通常業務は Project の ACTIVE member（組織内 ADMIN は bypass） |\n| 取消 | `POST /runs/{run_id}/cancel` の REQUESTED/CANCELLED と後続状態を確認する。SUCCEEDED/FAILED が先なら 409。HTTP 成功や CANCELLED は process 退出の証明ではない |\n| SSE | `GET /runs/{run_id}/events` は Last-Event-ID / after から持続 event を再開する。一時 TEXT_DELTA は event ID を進めない |\n| 外部批准 | Proposal の version/checksum/key が必要。Run 起動者か system ADMIN が判断し、Secret locator/config/credential は公開しない |\n\n原要求確認は現在の認証・Project 授権を満たしたうえで行う。公開停止や資源変更後の確認と、新規作成時の資源検証は別であり、後者を緩めない。未知の旧形式は拒否する。詳細は[Run 作成](../design/run-creation.md)。"}, {"title": "待機中の回答と結果評価", "level": "h2", "anchor": "待機中の回答と結果評価", "text": "## 待機中の回答と結果評価\n\n普通の CLARIFICATION / CHOICE / REVIEW は `POST /projects/{id}/runs/{run_id}/interactions/{interaction_id}/responses` に、表示中の interaction version と[回答契約](../../PJM/contracts/runs/interaction-response/v1/request.schema.json)、原回答の key を送る。\n\n初回は 201、同じ内容/版/key の重放は 200。返却する現在の Run status は必ずしも QUEUED ではない。409 は競合、410 は期限切れだが、後者は過期 continuation の commit 後にも返る。通信失敗・410 を rollback と解釈せず、原 actor/内容を保って確認する。現在の回答 Web に完全な原要求確認はないため、detail と保存済み回答を先に読む。\n\nProposal decision と Evaluation は別 endpoint。Evaluation は追加式で原 Result を変更せず、pointer は `detail.result.data` の根を指す。回答と同じ幂等契約はなく、履歴の同文・時刻から原要求成功を断定して自動再送しない。詳しくは[普通答复](../design/user-interactions.md)と[结果与评价](../design/results-evaluation.md)。"}, {"title": "文書を選び、元の範囲を確認する", "level": "h2", "anchor": "文書を選び元の範囲を確認する", "text": "## 文書を選び、元の範囲を確認する\n\n候補から単一文書、2 件以上の集合、明示的な全集を選ぶ。任意 slot を使わない場合は省略し、候補先頭を同意の代用にしない。必須未選択、失効 ID、空/上限超過の全集は拒否される。token と上限の正本は[資源設計](../design/resource-snapshots.md#公开选择与读取投影的实施契约)。\n\ndetail の `document_snapshots` は作成時の清単で、FROZEN のみ検証済みメンバーを含む。LEGACY_UNAVAILABLE / INVALID は snapshot:null。history の `selected_sources` は摘要だけである。どれも現在の blob 可読性や実行成功を保証しない。\n\n現行 Web は清単 field を必須として検証する。旧 Run の明示的な歴史状態と、旧 API が field を返せない契約エラーを混ぜず、空集合への fallback をしない。片側更新・回退は[版互換](contract-workflow.md#历史数据兼容不等于前后端版本兼容)を確認する。"}], "toc": [{"title": "認証してから呼び出す", "anchor": "認証してから呼び出す", "level": "h2"}, {"title": "Task を選び、一回の Run を作る", "anchor": "task-を選び一回の-run-を作る", "level": "h2"}, {"title": "再送・継続・権限の規則", "anchor": "再送継続権限の規則", "level": "h2"}, {"title": "待機中の回答と結果評価", "anchor": "待機中の回答と結果評価", "level": "h2"}, {"title": "文書を選び、元の範囲を確認する", "anchor": "文書を選び元の範囲を確認する", "level": "h2"}], "source": "development/api-usage.md", "checksum": "14a1611b436b65f3de0bb82a10de892adcb203ca26f825bdac2f84ba315018b2"}, {"id": "docs/development/documentation.md", "title": "文档维护约定", "group": "development", "html": "\u003ch1 id=\"文档维护约定\">文档维护约定\u003c/h1>\n\u003cp>文档只保留当前开发与运行需要的信息。规则写在唯一负责的页面，进度写在计划；不再累积整理流水账或特定业务项目的说明。\u003c/p>\n\u003ch2 id=\"正本与派生内容\">正本与派生内容\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>产品、术语、整体结构\u003c/td>\n\u003ctd>overview/\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>规则、失败恢复、兼容与验收\u003c/td>\n\u003ctd>design/\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前缺口与优先顺序\u003c/td>\n\u003ctd>planning/roadmap.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>开发、契约与验证步骤\u003c/td>\n\u003ctd>development/\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>起动、发布、恢复、排障\u003c/td>\n\u003ctd>operations/\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代码导航 / 必需约束\u003c/td>\n\u003ctd>PJM/README.md / PJM/AGENTS.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按改动类型查阅的细则\u003c/td>\n\u003ctd>development/coding-rules.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>离线浏览版\u003c/td>\n\u003ctd>docs/index.html，由 Markdown 生成\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>浏览版只读取 docs Markdown、工作区/代码根 README 与 AGENTS。Backend 短 README 只供打包，不重复进入导航。\n不扫描 .env、配置、凭据、Gold、任意源码或 Skill 的 SKILL.md/references；执行资产另走版本/hash/fixture 同步。\u003c/p>\n\u003ch2 id=\"写一份设计\">写一份设计\u003c/h2>\n\u003cp>用最少章节说明：用途与非目标 → 责任/数据 → 关键流程与失败 → 现有缺口 → 实施入口与验收。\n每页只保留必要场景、短表或流程图；字段全集链接契约，命令链接操作指南，不重复长篇接线说明。\u003c/p>\n\u003cul>\n\u003cli>明确“设计要求、已有局部实现、已验证行为”，未接入 API/Schema/页面不能写成操作步骤。\u003c/li>\n\u003cli>并发与恢复须说明判定/提交边界、原请求身份和结果未知；不因存在锁、版本号或 204 就推导完整保证。\u003c/li>\n\u003cli>不弱化权限、冻结、批准、不可变结果和恢复规则；安全限制与所限制的能力放在一起。\u003c/li>\n\u003cli>README/AGENTS 使用日文，设计正文使用中文，代码标识不翻译。每页一个 H1，层级不跳号。\u003c/li>\n\u003cli>标题写稳定主题，不为旧目录保留空章节。移动/合并时同步现行链接；旧代码文档编号由\u003ca href=\"#docs/README.md::%E6%97%A7%E7%95%AA%E5%8F%B7%E3%81%AE%E5%AF%BE%E5%BF%9C\">对应表\u003c/a>解释。\u003c/li>\n\u003cli>默认不建模块 README；必要包说明保持极短，导航集中到代码根 README。\u003c/li>\n\u003cli>删掉重复提示和过时测试数字；mock、真实 DB、模型、业务浏览器与部署的验证范围在交付时分别说明。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"一次整理的更新顺序\">一次整理的更新顺序\u003c/h2>\n\u003col>\n\u003cli>核对目标页面和相关源码/契约，明确本次是否修改实现。\u003c/li>\n\u003cli>修改规则正本，再同步相邻入口与当前缺口，不在每页复制进度。\u003c/li>\n\u003cli>检查全部文档的本地链接、章节、示例和浏览版目录，保留本次之外的工作。\u003c/li>\n\u003cli>build/check、文档工具回归与相关契约检查后，做桌面/窄屏实际浏览。\u003c/li>\n\u003cli>报告变更、实际验证和未覆盖风险；只有功能状态变化才更新计划。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"生成和验证浏览版\">生成和验证浏览版\u003c/h2>\n\u003cp>在 \u003ccode>PJM/\u003c/code> 执行，依赖已有时不重复安装：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r scripts/docs-requirements.txt\npython3 scripts/build_docs.py\npython3 scripts/build_docs.py --check\npython3 -m unittest discover -s scripts/tests -v\n\u003c/code>\u003c/pre>\n\u003cp>build 检查标题、代码块、本地链接/锚点及 ViewSpec JSON，并覆盖生成 index.html；\u003ccode>--check\u003c/code> 只检查一致性。\n正文只改 Markdown，交互/样式改 docs-viewer.html，不手改生成正文。\n\u003ccode>source_paths()\u003c/code> 控制收录范围，\u003ccode>FIRST_PAGES\u003c/code> 控制阅读顺序；新增文档不扩展到源码或 Skill。\u003c/p>\n\u003cp>用 Backend Ruff 时显式指定 \u003ccode>--config backend/pyproject.toml\u003c/code> 和 \u003ccode>--no-cache\u003c/code>。\n复用外置依赖时用 PYTHONPATH，Python 检查设置 PYTHONDONTWRITEBYTECODE=1；不创建 venv，也不清理用户已有文件。\u003c/p>\n\u003ch3 id=\"可重复执行的浏览器检查\">可重复执行的浏览器检查\u003c/h3>\n\u003cp>\u003ca href=\"../PJM/scripts/check_docs_browser.py\">检查脚本\u003c/a>直接打开生成的 file 页面，阻断并报告 HTTP(S)，不启动应用或执行正文命令。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r web/tests/browser/requirements.txt\npython3 -m playwright install chromium\nPYTHONDONTWRITEBYTECODE=1 python3 scripts/check_docs_browser.py\n\u003c/code>\u003c/pre>\n\u003cp>依赖和浏览器可分别通过 PYTHONPATH / PLAYWRIGHT_BROWSERS_PATH 复用外部目录。首次安装需要下载，检查本身离线。\n\u003ccode>--output \u0026lt;明确的外部目录\u0026gt;\u003c/code> 才保存截图，会覆盖固定名称，宜使用新的临时目录。\u003c/p>\n\u003cp>检查覆盖全部页面、章节布局/焦点/原生刷新、代码到设计的实际点击、搜索、前进/后退、键盘和打印。\n字体用 16/24px，屏宽用 320/390/768/1440px；原生刷新先检查，不先调用 showPage 修补位置。\n旧模块 README 书签只映射到代码根对应章；删除的资料不再进入目录或搜索。\u003c/p>\n\u003ch3 id=\"人工浏览检查\">人工浏览检查\u003c/h3>\n\u003cp>抽看修改入口、长表和关键流程：完整标题须位于固定顶部栏下方，按钮标签不碎成竖排，整页不横向溢出。\n复杂表和图可局部滚动并有提示；不能隐藏限制列或缩小全页字号来“通过”。搜索文字不得变成可执行 HTML。\n新增页/标题/路径须检查真实点击与刷新，viewer 导航/样式变更须执行全量浏览器回归。\u003c/p>\n\u003cp>\u003ca href=\"overview/business-structure.html\">业务结构图\u003c/a>和\u003ca href=\"overview/technical-architecture.html\">技术结构图\u003c/a>仅作整体关系摘要。\n文档检查不证明业务实现、真实数据库、模型或部署完成；本轮未跑的检查不能借用旧结果。\u003c/p>\n", "sections": [{"title": "文档维护约定", "level": "h1", "anchor": "文档维护约定", "text": "# 文档维护约定\n\n文档只保留当前开发与运行需要的信息。规则写在唯一负责的页面，进度写在计划；不再累积整理流水账或特定业务项目的说明。"}, {"title": "正本与派生内容", "level": "h2", "anchor": "正本与派生内容", "text": "## 正本与派生内容\n\n| 内容 | 位置 |\n| --- | --- |\n| 产品、术语、整体结构 | overview/ |\n| 规则、失败恢复、兼容与验收 | design/ |\n| 当前缺口与优先顺序 | planning/roadmap.md |\n| 开发、契约与验证步骤 | development/ |\n| 起动、发布、恢复、排障 | operations/ |\n| 代码导航 / 必需约束 | PJM/README.md / PJM/AGENTS.md |\n| 按改动类型查阅的细则 | development/coding-rules.md |\n| 离线浏览版 | docs/index.html，由 Markdown 生成 |\n\n浏览版只读取 docs Markdown、工作区/代码根 README 与 AGENTS。Backend 短 README 只供打包，不重复进入导航。\n不扫描 .env、配置、凭据、Gold、任意源码或 Skill 的 SKILL.md/references；执行资产另走版本/hash/fixture 同步。"}, {"title": "写一份设计", "level": "h2", "anchor": "写一份设计", "text": "## 写一份设计\n\n用最少章节说明：用途与非目标 → 责任/数据 → 关键流程与失败 → 现有缺口 → 实施入口与验收。\n每页只保留必要场景、短表或流程图；字段全集链接契约，命令链接操作指南，不重复长篇接线说明。\n\n- 明确“设计要求、已有局部实现、已验证行为”，未接入 API/Schema/页面不能写成操作步骤。\n- 并发与恢复须说明判定/提交边界、原请求身份和结果未知；不因存在锁、版本号或 204 就推导完整保证。\n- 不弱化权限、冻结、批准、不可变结果和恢复规则；安全限制与所限制的能力放在一起。\n- README/AGENTS 使用日文，设计正文使用中文，代码标识不翻译。每页一个 H1，层级不跳号。\n- 标题写稳定主题，不为旧目录保留空章节。移动/合并时同步现行链接；旧代码文档编号由[对应表](../README.md#旧番号の対応)解释。\n- 默认不建模块 README；必要包说明保持极短，导航集中到代码根 README。\n- 删掉重复提示和过时测试数字；mock、真实 DB、模型、业务浏览器与部署的验证范围在交付时分别说明。"}, {"title": "一次整理的更新顺序", "level": "h2", "anchor": "一次整理的更新顺序", "text": "## 一次整理的更新顺序\n\n1. 核对目标页面和相关源码/契约，明确本次是否修改实现。\n2. 修改规则正本，再同步相邻入口与当前缺口，不在每页复制进度。\n3. 检查全部文档的本地链接、章节、示例和浏览版目录，保留本次之外的工作。\n4. build/check、文档工具回归与相关契约检查后，做桌面/窄屏实际浏览。\n5. 报告变更、实际验证和未覆盖风险；只有功能状态变化才更新计划。"}, {"title": "生成和验证浏览版", "level": "h2", "anchor": "生成和验证浏览版", "text": "## 生成和验证浏览版\n\n在 `PJM/` 执行，依赖已有时不重复安装：\n\n```bash\npython3 -m pip install --user -r scripts/docs-requirements.txt\npython3 scripts/build_docs.py\npython3 scripts/build_docs.py --check\npython3 -m unittest discover -s scripts/tests -v\n```\n\nbuild 检查标题、代码块、本地链接/锚点及 ViewSpec JSON，并覆盖生成 index.html；`--check` 只检查一致性。\n正文只改 Markdown，交互/样式改 docs-viewer.html，不手改生成正文。\n`source_paths()` 控制收录范围，`FIRST_PAGES` 控制阅读顺序；新增文档不扩展到源码或 Skill。\n\n用 Backend Ruff 时显式指定 `--config backend/pyproject.toml` 和 `--no-cache`。\n复用外置依赖时用 PYTHONPATH，Python 检查设置 PYTHONDONTWRITEBYTECODE=1；不创建 venv，也不清理用户已有文件。"}, {"title": "可重复执行的浏览器检查", "level": "h3", "anchor": "可重复执行的浏览器检查", "text": "### 可重复执行的浏览器检查\n\n[检查脚本](../../PJM/scripts/check_docs_browser.py)直接打开生成的 file 页面，阻断并报告 HTTP(S)，不启动应用或执行正文命令。\n\n```bash\npython3 -m pip install --user -r web/tests/browser/requirements.txt\npython3 -m playwright install chromium\nPYTHONDONTWRITEBYTECODE=1 python3 scripts/check_docs_browser.py\n```\n\n依赖和浏览器可分别通过 PYTHONPATH / PLAYWRIGHT_BROWSERS_PATH 复用外部目录。首次安装需要下载，检查本身离线。\n`--output \u003c明确的外部目录>` 才保存截图，会覆盖固定名称，宜使用新的临时目录。\n\n检查覆盖全部页面、章节布局/焦点/原生刷新、代码到设计的实际点击、搜索、前进/后退、键盘和打印。\n字体用 16/24px，屏宽用 320/390/768/1440px；原生刷新先检查，不先调用 showPage 修补位置。\n旧模块 README 书签只映射到代码根对应章；删除的资料不再进入目录或搜索。"}, {"title": "人工浏览检查", "level": "h3", "anchor": "人工浏览检查", "text": "### 人工浏览检查\n\n抽看修改入口、长表和关键流程：完整标题须位于固定顶部栏下方，按钮标签不碎成竖排，整页不横向溢出。\n复杂表和图可局部滚动并有提示；不能隐藏限制列或缩小全页字号来“通过”。搜索文字不得变成可执行 HTML。\n新增页/标题/路径须检查真实点击与刷新，viewer 导航/样式变更须执行全量浏览器回归。\n\n[业务结构图](../overview/business-structure.html)和[技术结构图](../overview/technical-architecture.html)仅作整体关系摘要。\n文档检查不证明业务实现、真实数据库、模型或部署完成；本轮未跑的检查不能借用旧结果。"}], "toc": [{"title": "正本与派生内容", "anchor": "正本与派生内容", "level": "h2"}, {"title": "写一份设计", "anchor": "写一份设计", "level": "h2"}, {"title": "一次整理的更新顺序", "anchor": "一次整理的更新顺序", "level": "h2"}, {"title": "生成和验证浏览版", "anchor": "生成和验证浏览版", "level": "h2"}, {"title": "可重复执行的浏览器检查", "anchor": "可重复执行的浏览器检查", "level": "h3"}, {"title": "人工浏览检查", "anchor": "人工浏览检查", "level": "h3"}], "source": "development/documentation.md", "checksum": "d424cc2e412ab97be22a63bd7a92693109a29dbf5f169ec537180dc0e297e126"}, {"id": "docs/operations/quickstart.md", "title": "起動と初期管理者", "group": "operations", "html": "\u003ch1 id=\"起動と初期管理者\">起動と初期管理者\u003c/h1>\n\u003cp>初回起動の手順。既存環境の更新は\u003ca href=\"#docs/operations/deployment.md::\">公開・移行\u003c/a>、データ復元は\u003ca href=\"#docs/operations/backup-recovery.md::\">backup・復元\u003c/a>、故障時は \u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a>へ進む。コマンドは \u003ccode>PJM/\u003c/code> で実行する。\u003c/p>\n\u003ch2 id=\"compose-の前提\">Compose の前提\u003c/h2>\n\u003cp>Linux、Python 3.12（標準 library のみ）、Docker Engine / Compose v2、共有 Traefik と external edge network が必要。Compose は config JSON / up --wait を備えた版を対象環境で検証する。ProjectMind は Traefik を配備せず、host port を公開しない。\u003c/p>\n\u003cp>\u003ccode>.env\u003c/code> が無い初回だけ実行し、既存設定を上書きしない。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">umask 077\ncp .env.example .env\n\u003c/code>\u003c/pre>\n\u003cp>host/context path、Traefik network/entryPoint、DB/storage password、model 設定を対象環境に合わせる。production は HTTPS を使う。\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">共通設定入口\u003c/a>が ENV_FILE を補間と Backend の同一 source に固定する。既定以外の project は shell の COMPOSE_PROJECT_NAME または明示 option で選び、ファイル内の同名値に依存しない。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make config\nmake build\n\u003c/code>\u003c/pre>\n\u003cp>各段階の失敗時は停止する。config は展開した Secret を表示しない。移送済みの検証済み image を使う場合だけ build を省き、\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E5%89%8D%E7%BD%AE%E4%B8%8E%E6%89%A7%E8%A1%8C\">配備清単\u003c/a>の daemon/project/image ID・archive と確認変数を設定して deploy-load を行う。新規環境も既存の同名 project がないこと、入口閉鎖と必要な復元手段を確認する。\u003c/p>\n\u003cp>以下は対象の基盤 service と bucket を作成する操作。承認済み環境で一つずつ実行し、失敗時は進まない：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- up -d --no-build --no-deps --pull never --wait postgres redis object-storage\npython3 scripts/compose.py -- up --no-build --no-deps --pull never --exit-code-from object-storage-init object-storage-init\n\u003c/code>\u003c/pre>\n\u003cp>同じ配備清単と確認変数で \u003ccode>make deploy-migrate\u003c/code> → \u003ccode>make deploy-api\u003c/code> を個別実行する。make run も API/Web の検査付き起動で、Worker は起動しない。初期 ADMIN と権限を確認した後に\u003ca href=\"#docs/operations/deployment.md::%E5%90%AF%E5%8A%A8%E4%B8%8E%E6%94%BE%E8%A1%8C\">背景放行\u003c/a>を別途承認する。preflight は DB migration/Redis の基線で、業務実行の保証ではない。\u003c/p>\n\u003cp>新 Run/Effect の配送は既定で無効。業務実行には \u003ccode>PROJECTMIND_WORKER_DISPATCH_ENABLED=true\u003c/code> が必要だが、false は既存 job・Schedule・recovery を止める\u003ca href=\"#docs/operations/deployment.md::%E4%B8%80%E4%B8%AA%E4%BE%8B%E5%AD%90%E5%85%B3%E9%97%AD-dispatch-%E5%90%8E%E4%BB%8D%E6%9C%89%E5%B7%A5%E4%BD%9C\">保守 mode ではない\u003c/a>。\u003c/p>\n\u003ch2 id=\"最初の-admin-を作成する\">最初の ADMIN を作成する\u003c/h2>\n\u003cp>migration 成功後、既存データを消さない CLI を一度実行する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- exec api python -m projectmind.ops.bootstrap_admin\n\u003c/code>\u003c/pre>\n\u003cp>email、display name、password を対話入力する。migration が作成した Organization を使い、最初の ADMIN と CREATED 安全イベントを追加する。DISABLED を含め ADMIN が既にいれば拒否する。匿名 bootstrap API、既存管理者の password 再設定・復元機能ではない。\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>make bootstrap-admin\u003c/code> は全データ再初期化であり、通常の管理者作成には使わない。\u003c/strong> PostgreSQL、Redis、object storage、Run workspace の volume を削除する。全消去を明示的に選び、対象と復元手段を確認した場合だけ使用する。\u003c/p>\n\u003ch2 id=\"最初の業務実行\">最初の業務実行\u003c/h2>\n\u003col>\n\u003cli>ADMIN でログインし、Project とメンバーを用意する。\u003c/li>\n\u003cli>Skill を導入・解釈・確認・公開し、Project で精確 SkillVersion を有効化する。\u003c/li>\n\u003cli>必要な Integration、SecretReference、binding と文書を用意する。\u003c/li>\n\u003cli>Task Center で就緒度と入力を確認し、Workspace で実行する。\u003c/li>\n\u003cli>待機、結果、Evidence と Evaluation を確認する。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"image-移送と更新\">Image 移送と更新\u003c/h2>\n\u003cp>Windows PowerShell の \u003ccode>PJM/\u003c/code> で \u003ccode>./scripts/export-images.ps1\u003c/code> を実行する。Python 3.12 が必要で、必要なら -PythonCommand に executable を指定する。既定出力は \u003ccode>images/projectmind-images.tar\u003c/code>。script は既存 image を保存するだけで build/pull せず、存在しない第三者 image を除外することがある。archive と実 image ID/checksum を受控清単に記録する。context path を変える場合は Web も再 build する。\u003c/p>\n\u003cp>転送後は\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E5%89%8D%E7%BD%AE%E4%B8%8E%E6%89%A7%E8%A1%8C\">公開・移行\u003c/a>へ進む。make deploy は help のみで、load/migrate/api/worker を個別に進める。旧 image は削除せず、各段階の失敗時に自動復旧・後続起動をしない。\u003c/p>\n\u003ch2 id=\"操作の区別\">操作の区別\u003c/h2>\n\u003cp>\u003ccode>make\u003c/code> は状態表示、\u003ccode>make stop\u003c/code> は container を保持して停止、\u003ccode>make down\u003c/code> は container/network を削除して永続 volume を保持する。起動・更新・全初期化は上記の異なる操作であり、相互の代用にしない。\u003c/p>\n", "sections": [{"title": "起動と初期管理者", "level": "h1", "anchor": "起動と初期管理者", "text": "# 起動と初期管理者\n\n初回起動の手順。既存環境の更新は[公開・移行](deployment.md)、データ復元は[backup・復元](backup-recovery.md)、故障時は [Runbook](runbook.md)へ進む。コマンドは `PJM/` で実行する。"}, {"title": "Compose の前提", "level": "h2", "anchor": "compose-の前提", "text": "## Compose の前提\n\nLinux、Python 3.12（標準 library のみ）、Docker Engine / Compose v2、共有 Traefik と external edge network が必要。Compose は config JSON / up --wait を備えた版を対象環境で検証する。ProjectMind は Traefik を配備せず、host port を公開しない。\n\n`.env` が無い初回だけ実行し、既存設定を上書きしない。\n\n```bash\numask 077\ncp .env.example .env\n```\n\nhost/context path、Traefik network/entryPoint、DB/storage password、model 設定を対象環境に合わせる。production は HTTPS を使う。[共通設定入口](deployment.md#环境文件与配置边界)が ENV_FILE を補間と Backend の同一 source に固定する。既定以外の project は shell の COMPOSE_PROJECT_NAME または明示 option で選び、ファイル内の同名値に依存しない。\n\n```bash\nmake config\nmake build\n```\n\n各段階の失敗時は停止する。config は展開した Secret を表示しない。移送済みの検証済み image を使う場合だけ build を省き、[配備清単](deployment.md#迁移前置与执行)の daemon/project/image ID・archive と確認変数を設定して deploy-load を行う。新規環境も既存の同名 project がないこと、入口閉鎖と必要な復元手段を確認する。\n\n以下は対象の基盤 service と bucket を作成する操作。承認済み環境で一つずつ実行し、失敗時は進まない：\n\n```bash\npython3 scripts/compose.py -- up -d --no-build --no-deps --pull never --wait postgres redis object-storage\npython3 scripts/compose.py -- up --no-build --no-deps --pull never --exit-code-from object-storage-init object-storage-init\n```\n\n同じ配備清単と確認変数で `make deploy-migrate` → `make deploy-api` を個別実行する。make run も API/Web の検査付き起動で、Worker は起動しない。初期 ADMIN と権限を確認した後に[背景放行](deployment.md#启动与放行)を別途承認する。preflight は DB migration/Redis の基線で、業務実行の保証ではない。\n\n新 Run/Effect の配送は既定で無効。業務実行には `PROJECTMIND_WORKER_DISPATCH_ENABLED=true` が必要だが、false は既存 job・Schedule・recovery を止める[保守 mode ではない](deployment.md#一个例子关闭-dispatch-后仍有工作)。"}, {"title": "最初の ADMIN を作成する", "level": "h2", "anchor": "最初の-admin-を作成する", "text": "## 最初の ADMIN を作成する\n\nmigration 成功後、既存データを消さない CLI を一度実行する。\n\n```bash\npython3 scripts/compose.py -- exec api python -m projectmind.ops.bootstrap_admin\n```\n\nemail、display name、password を対話入力する。migration が作成した Organization を使い、最初の ADMIN と CREATED 安全イベントを追加する。DISABLED を含め ADMIN が既にいれば拒否する。匿名 bootstrap API、既存管理者の password 再設定・復元機能ではない。\n\n**`make bootstrap-admin` は全データ再初期化であり、通常の管理者作成には使わない。** PostgreSQL、Redis、object storage、Run workspace の volume を削除する。全消去を明示的に選び、対象と復元手段を確認した場合だけ使用する。"}, {"title": "最初の業務実行", "level": "h2", "anchor": "最初の業務実行", "text": "## 最初の業務実行\n\n1. ADMIN でログインし、Project とメンバーを用意する。\n2. Skill を導入・解釈・確認・公開し、Project で精確 SkillVersion を有効化する。\n3. 必要な Integration、SecretReference、binding と文書を用意する。\n4. Task Center で就緒度と入力を確認し、Workspace で実行する。\n5. 待機、結果、Evidence と Eval
