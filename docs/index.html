3c/a> / \u003ca href=\"#docs/operations/deployment.md::\">配備\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>障害・遅延を調べる\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a> / \u003ca href=\"#docs/operations/backup-recovery.md::\">復元\u003c/a> / \u003ca href=\"#docs/operations/run-performance.md::\">性能観測\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>進捗・文書を更新する\u003c/td>\n\u003ctd>\u003ca href=\"#docs/planning/roadmap.md::\">Roadmap\u003c/a> / \u003ca href=\"#docs/development/documentation.md::\">文書維持\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"文書とコードの役割\">文書とコードの役割\u003c/h2>\n\u003cp>ガイドには操作手順、判断基準、維持すべき境界を置く。詳細な型・フィールド・状態遷移は \u003ca href=\"#SKM/README.md::contracts\">Contracts\u003c/a> と実装・回帰テストを参照する。業務 Skill の \u003ccode>SKILL.md\u003c/code>・参照資料・Schema は実行入力であり、文書整理の対象に含めない。\u003c/p>\n", "sections": [{"title": "Skillmind 文書ガイド", "level": "h1", "anchor": "skillmind-文書ガイド", "text": "# Skillmind 文書ガイド\n\n[ブラウザで読む](index.html) · [コードの入口](../SKM/README.md) · [現在の進捗](planning/roadmap.md#現在の実行状態)\n\n利用・開発・運用に必要なガイドの入口。現在の実装範囲と配備待ちの検証事項は Roadmap で分けて確認する。"}, {"title": "目的から探す", "level": "h2", "anchor": "目的から探す", "text": "## 目的から探す\n\n| 目的 | 入口 |\n| --- | --- |\n| 製品を使う | [利用の流れと画面](overview/product.md) |\n| 全体を理解する | [システム構成と用語](overview/architecture.md) |\n| 変更する | [変更ガイド](development/change-guide.md) / [維持する実行境界](development/runtime-guide.md) / [実装細則](development/coding-rules.md) |\n| 画面を整える | [UI ガイド](design/workspace.md#視覚規約) |\n| 開発・連携する | [ローカル開発](development/local-development.md) / [API 利用](development/api-usage.md) / [契約変更](development/contract-workflow.md) |\n| 起動・更新する | [Quickstart](operations/quickstart.md) / [配備](operations/deployment.md) |\n| 障害・遅延を調べる | [Runbook](operations/runbook.md) / [復元](operations/backup-recovery.md) / [性能観測](operations/run-performance.md) |\n| 進捗・文書を更新する | [Roadmap](planning/roadmap.md) / [文書維持](development/documentation.md) |"}, {"title": "文書とコードの役割", "level": "h2", "anchor": "文書とコードの役割", "text": "## 文書とコードの役割\n\nガイドには操作手順、判断基準、維持すべき境界を置く。詳細な型・フィールド・状態遷移は [Contracts](../SKM/README.md#contracts) と実装・回帰テストを参照する。業務 Skill の `SKILL.md`・参照資料・Schema は実行入力であり、文書整理の対象に含めない。"}], "toc": [{"title": "目的から探す", "anchor": "目的から探す", "level": "h2"}, {"title": "文書とコードの役割", "anchor": "文書とコードの役割", "level": "h2"}], "source": "README.md", "checksum": "b8d80b531525cb11f20962e5e0940962aeeb94abadbb86823f1100badf4580d1"}, {"id": "docs/overview/product.md", "title": "利用ガイド", "group": "overview", "html": "\u003ch1 id=\"利用ガイド\">利用ガイド\u003c/h1>\n\u003cp>Skillmind は Skill 原文を実行根拠とし、入力選択・資源接続・タスク実行・外部変更・結果監査をプロジェクト単位で管理する。現在の利用可能範囲と検証待ち事項は \u003ca href=\"#docs/planning/roadmap.md::%E7%8F%BE%E5%9C%A8%E3%81%AE%E5%AE%9F%E8%A1%8C%E7%8A%B6%E6%85%8B\">Roadmap\u003c/a> を参照する。\u003c/p>\n\u003ch2 id=\"skill-から結果まで\">Skill から結果まで\u003c/h2>\n\u003col>\n\u003cli>組織スキル庫で Skill を取り込み、解析されたタスク・必須入力・資源宣言を確認して公開する。\u003c/li>\n\u003cli>プロジェクトで該当バージョンを有効化し、「資源と接続」で資格情報とアクセス範囲を設定する。\u003c/li>\n\u003cli>タスクと文書範囲を選び、事前確認（プリフライト）を経て起動する。反復実行はタスクカードから定期実行を設定する。\u003c/li>\n\u003cli>ワークスペースで進行中タスクと待機中項目を確認し、質問への回答や変更提案の承認を行う。\u003c/li>\n\u003cli>「完了とレポート」でタスクごとの最新終態サマリを確認し、実行履歴の詳細で結果・添付・証拠・評価を閲覧する。\u003c/li>\n\u003c/ol>\n\u003cp>公開・プロジェクト有効化・資源準備は個別に検査される。モデルの推測を入力とみなしたり文書範囲を自動拡張したりしない。新規 Skill は最小限の入力/資源宣言と凍結原文で実行される。\u003c/p>\n\u003ch2 id=\"画面の役割\">画面の役割\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>画面\u003c/th>\n\u003cth>主な用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>概要\u003c/td>\n\u003ctd>待機項目、最近の実行、プロジェクト入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>組織スキル庫\u003c/td>\n\u003ctd>名称・識別子・版・状態による絞込、取込・解釈・公開・有効化・版整理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>タスク\u003c/td>\n\u003ctd>名称・識別子・定期実行状態での検索、タスク起動とスケジュール設定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ワークスペース\u003c/td>\n\u003ctd>待機中・進行中・タスク別の最新レポート\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>実行履歴\u003c/td>\n\u003ctd>ページング閲覧、所要時間、単回詳細、ごみ箱管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>プロジェクト文書\u003c/td>\n\u003ctd>アップロード、フォルダ選択、改名、移動、プレビュー、ダウンロード、ごみ箱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資源と接続\u003c/td>\n\u003ctd>資格情報、許可範囲、PostgreSQL・文書庫・Git・MCP 接続\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>プロジェクトとアカウント\u003c/td>\n\u003ctd>メンバー、アーカイブ、アカウント安全、管理者管理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>ADMIN は組織スキル・プロジェクト・資源を管理し、一般ユーザーは許可されたプロジェクトで操作する。外部連携用の API Key は \u003ca href=\"#docs/development/api-usage.md::\">API ガイド\u003c/a> を参照する。解析完了後に下書き未作成のまま同一タブを更新・遷移した場合は、再解析せず元要求の結果を復元できる。\u003c/p>\n\u003ch2 id=\"自動承認と結果の見方\">自動承認と結果の見方\u003c/h2>\n\u003cp>起動時の自動承認は当該実行に対する明示的同意であり、DB・文書・Git・MCP の同意範囲をサーバー側で個別に検証する（権限・競合・回読検査は省略しない）。チェックを外した場合は都度承認となる。\u003c/p>\n\u003cp>プラットフォームの実行完了（\u003ccode>SUCCEEDED\u003c/code>）、結果の完全性、業務上の \u003ccode>PASS\u003c/code>/\u003ccode>FAIL\u003c/code> は別の事実である。レポートはモデルが提示した結論と引用を表示し、自動で合格を推測しない。\u003c/p>\n\u003ch2 id=\"旧データの整理\">旧データの整理\u003c/h2>\n\u003cp>実行履歴と文書はごみ箱への移動・復元・完全削除に対応する（削除前にプレビューで関連成果と参照ブロックを確認する；原入力と共有参照は保護され、外部 DB や Git 記録は削除されない）。削除監査がプロジェクトに紐付くため、履歴一覧が空でも物理削除できない場合はアーカイブを維持するか、アーカイブ済みプロジェクトの完全削除を使う。\u003c/p>\n\u003cp>構成は\u003ca href=\"#docs/overview/architecture.md::\">アーキテクチャと用語\u003c/a>、障害対応は \u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a> を参照する。\u003c/p>\n", "sections": [{"title": "利用ガイド", "level": "h1", "anchor": "利用ガイド", "text": "# 利用ガイド\n\nSkillmind は Skill 原文を実行根拠とし、入力選択・資源接続・タスク実行・外部変更・結果監査をプロジェクト単位で管理する。現在の利用可能範囲と検証待ち事項は [Roadmap](../planning/roadmap.md#現在の実行状態) を参照する。"}, {"title": "Skill から結果まで", "level": "h2", "anchor": "skill-から結果まで", "text": "## Skill から結果まで\n\n1. 組織スキル庫で Skill を取り込み、解析されたタスク・必須入力・資源宣言を確認して公開する。\n2. プロジェクトで該当バージョンを有効化し、「資源と接続」で資格情報とアクセス範囲を設定する。\n3. タスクと文書範囲を選び、事前確認（プリフライト）を経て起動する。反復実行はタスクカードから定期実行を設定する。\n4. ワークスペースで進行中タスクと待機中項目を確認し、質問への回答や変更提案の承認を行う。\n5. 「完了とレポート」でタスクごとの最新終態サマリを確認し、実行履歴の詳細で結果・添付・証拠・評価を閲覧する。\n\n公開・プロジェクト有効化・資源準備は個別に検査される。モデルの推測を入力とみなしたり文書範囲を自動拡張したりしない。新規 Skill は最小限の入力/資源宣言と凍結原文で実行される。"}, {"title": "画面の役割", "level": "h2", "anchor": "画面の役割", "text": "## 画面の役割\n\n| 画面 | 主な用途 |\n| --- | --- |\n| 概要 | 待機項目、最近の実行、プロジェクト入口 |\n| 組織スキル庫 | 名称・識別子・版・状態による絞込、取込・解釈・公開・有効化・版整理 |\n| タスク | 名称・識別子・定期実行状態での検索、タスク起動とスケジュール設定 |\n| ワークスペース | 待機中・進行中・タスク別の最新レポート |\n| 実行履歴 | ページング閲覧、所要時間、単回詳細、ごみ箱管理 |\n| プロジェクト文書 | アップロード、フォルダ選択、改名、移動、プレビュー、ダウンロード、ごみ箱 |\n| 資源と接続 | 資格情報、許可範囲、PostgreSQL・文書庫・Git・MCP 接続 |\n| プロジェクトとアカウント | メンバー、アーカイブ、アカウント安全、管理者管理 |\n\nADMIN は組織スキル・プロジェクト・資源を管理し、一般ユーザーは許可されたプロジェクトで操作する。外部連携用の API Key は [API ガイド](../development/api-usage.md) を参照する。解析完了後に下書き未作成のまま同一タブを更新・遷移した場合は、再解析せず元要求の結果を復元できる。"}, {"title": "自動承認と結果の見方", "level": "h2", "anchor": "自動承認と結果の見方", "text": "## 自動承認と結果の見方\n\n起動時の自動承認は当該実行に対する明示的同意であり、DB・文書・Git・MCP の同意範囲をサーバー側で個別に検証する（権限・競合・回読検査は省略しない）。チェックを外した場合は都度承認となる。\n\nプラットフォームの実行完了（`SUCCEEDED`）、結果の完全性、業務上の `PASS`/`FAIL` は別の事実である。レポートはモデルが提示した結論と引用を表示し、自動で合格を推測しない。"}, {"title": "旧データの整理", "level": "h2", "anchor": "旧データの整理", "text": "## 旧データの整理\n\n実行履歴と文書はごみ箱への移動・復元・完全削除に対応する（削除前にプレビューで関連成果と参照ブロックを確認する；原入力と共有参照は保護され、外部 DB や Git 記録は削除されない）。削除監査がプロジェクトに紐付くため、履歴一覧が空でも物理削除できない場合はアーカイブを維持するか、アーカイブ済みプロジェクトの完全削除を使う。\n\n構成は[アーキテクチャと用語](architecture.md)、障害対応は [Runbook](../operations/runbook.md) を参照する。"}], "toc": [{"title": "Skill から結果まで", "anchor": "skill-から結果まで", "level": "h2"}, {"title": "画面の役割", "anchor": "画面の役割", "level": "h2"}, {"title": "自動承認と結果の見方", "anchor": "自動承認と結果の見方", "level": "h2"}, {"title": "旧データの整理", "anchor": "旧データの整理", "level": "h2"}], "source": "overview/product.md", "checksum": "e517d857cf0fa7dd8440de3ca3f4f42f1661cf7d0de4da13a9ccf57a918255cf"}, {"id": "docs/overview/architecture.md", "title": "システム構成と用語", "group": "overview", "html": "\u003ch1 id=\"システム構成と用語\">システム構成と用語\u003c/h1>\n\u003cp>Backend はモジュラーモノリスであり、API・業務 Worker・保守 Worker が同一 Python package を共有して個別プロセスで動作する。業務層は \u003ccode>AgentEngine\u003c/code> 抽象に依存し、SDK アダプタが Codex/Claude との通信を担う。\u003c/p>\n\u003ch2 id=\"実行経路\">実行経路\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Web / API 呼出元 → Traefik → FastAPI → ドメインサービス → PostgreSQL\n                                           ↓ Outbox\n                                 Redis キューと通知\n                                   ↓          ↓\n                              業務 Worker  保守 Worker\n                                   ↓\n                            AgentEngine → モデル\n                                   ↓\n                          Tool Gateway / Provider\n                                   ↓\n                         束縛・認可された外部資源\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Skill\u003c/strong>：原文取込 → 最小実行宣言 → 審査・公開 → Project 有効化 → タスク登録（旧 Blueprint は原版互換を維持）。\u003c/li>\n\u003cli>\u003cstrong>Run\u003c/strong>：バージョン・入力・権限上限を凍結 → キュー投入 → 読取専用入力の物化 → 実行 → 回答/承認待ち、または結果提出。\u003c/li>\n\u003cli>\u003cstrong>外部変更\u003c/strong>：観測（observe） → 提案（propose） → 人工または適用可能な自動承認 → 実行（apply） → 回読と回執保存。\u003c/li>\n\u003c/ul>\n\u003cp>PostgreSQL が業務と監査の正本であり、Redis はキュー・短期ロック・通知・ログイン防護を担う。文書 blob と Run workspace は別ストレージであり同一トランザクションではない。復元は\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E5%BE%A9%E5%85%83%E7%82%B9%E3%81%AE%E5%86%85%E5%AE%B9\">一致復元点\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"主要用語\">主要用語\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>意味\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Organization / Project\u003c/td>\n\u003ctd>組織資産とプロジェクトのアクセス境界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillVersion / Task\u003c/td>\n\u003ctd>不変の公開バージョンと、そのバージョンが提供するタスク入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integration / ResourceBinding\u003c/td>\n\u003ctd>外部接続と実行時に許可された資源範囲（資格情報はモデルに渡さない）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run / Segment / Attempt\u003c/td>\n\u003ctd>1 回の業務要求、分析/継続フェーズ、同一フェーズ内の技術的試行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Brief / Snapshot\u003c/td>\n\u003ctd>凍結された実行指示と入力事実（現在設定で過去値を埋め戻さない）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Interaction / Proposal\u003c/td>\n\u003ctd>通常の質問と外部変更提案（回答プロトコルが異なる）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Effect / Receipt\u003c/td>\n\u003ctd>実際の外部変更と原操作の回執（回執は外部の現在状態を保証しない）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence / Artifact\u003c/td>\n\u003ctd>追跡可能な観測証拠と保存済み成果物ファイル\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Result / Evaluation\u003c/td>\n\u003ctd>不変の実行結果と追記式の人工評価・修正\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>コード配置は\u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>、詳細スキーマは \u003ca href=\"#SKM/README.md::contracts\">Contracts\u003c/a>、実行制約は\u003ca href=\"#docs/development/runtime-guide.md::\">実行境界\u003c/a>、配備構成は\u003ca href=\"#docs/operations/deployment.md::\">配備手順\u003c/a>を参照する。\u003c/p>\n", "sections": [{"title": "システム構成と用語", "level": "h1", "anchor": "システム構成と用語", "text": "# システム構成と用語\n\nBackend はモジュラーモノリスであり、API・業務 Worker・保守 Worker が同一 Python package を共有して個別プロセスで動作する。業務層は `AgentEngine` 抽象に依存し、SDK アダプタが Codex/Claude との通信を担う。"}, {"title": "実行経路", "level": "h2", "anchor": "実行経路", "text": "## 実行経路\n\n```text\nWeb / API 呼出元 → Traefik → FastAPI → ドメインサービス → PostgreSQL\n                                           ↓ Outbox\n                                 Redis キューと通知\n                                   ↓          ↓\n                              業務 Worker  保守 Worker\n                                   ↓\n                            AgentEngine → モデル\n                                   ↓\n                          Tool Gateway / Provider\n                                   ↓\n                         束縛・認可された外部資源\n```\n\n- **Skill**：原文取込 → 最小実行宣言 → 審査・公開 → Project 有効化 → タスク登録（旧 Blueprint は原版互換を維持）。\n- **Run**：バージョン・入力・権限上限を凍結 → キュー投入 → 読取専用入力の物化 → 実行 → 回答/承認待ち、または結果提出。\n- **外部変更**：観測（observe） → 提案（propose） → 人工または適用可能な自動承認 → 実行（apply） → 回読と回執保存。\n\nPostgreSQL が業務と監査の正本であり、Redis はキュー・短期ロック・通知・ログイン防護を担う。文書 blob と Run workspace は別ストレージであり同一トランザクションではない。復元は[一致復元点](../operations/backup-recovery.md#一致復元点の内容)を参照する。"}, {"title": "主要用語", "level": "h2", "anchor": "主要用語", "text": "## 主要用語\n\n| 名称 | 意味 |\n| --- | --- |\n| Organization / Project | 組織資産とプロジェクトのアクセス境界 |\n| SkillVersion / Task | 不変の公開バージョンと、そのバージョンが提供するタスク入口 |\n| Integration / ResourceBinding | 外部接続と実行時に許可された資源範囲（資格情報はモデルに渡さない） |\n| Run / Segment / Attempt | 1 回の業務要求、分析/継続フェーズ、同一フェーズ内の技術的試行 |\n| Brief / Snapshot | 凍結された実行指示と入力事実（現在設定で過去値を埋め戻さない） |\n| Interaction / Proposal | 通常の質問と外部変更提案（回答プロトコルが異なる） |\n| Effect / Receipt | 実際の外部変更と原操作の回執（回執は外部の現在状態を保証しない） |\n| Evidence / Artifact | 追跡可能な観測証拠と保存済み成果物ファイル |\n| Result / Evaluation | 不変の実行結果と追記式の人工評価・修正 |\n\nコード配置は[変更ガイド](../development/change-guide.md)、詳細スキーマは [Contracts](../../SKM/README.md#contracts)、実行制約は[実行境界](../development/runtime-guide.md)、配備構成は[配備手順](../operations/deployment.md)を参照する。"}], "toc": [{"title": "実行経路", "anchor": "実行経路", "level": "h2"}, {"title": "主要用語", "anchor": "主要用語", "level": "h2"}], "source": "overview/architecture.md", "checksum": "645e3019a2b342c489556fb2bfae9a3359013509764ffe0bd03077bdf4854dd5"}, {"id": "docs/planning/roadmap.md", "title": "Skillmind 現在の進捗と改善方針", "group": "planning", "html": "\u003ch1 id=\"skillmind-現在の進捗と改善方針\">Skillmind 現在の進捗と改善方針\u003c/h1>\n\u003cp>本ページは現在の能力、再確認待ち事項、改善の優先順位を管理する。開発の入口は\u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>、実行制約は\u003ca href=\"#docs/development/runtime-guide.md::\">実行境界\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"現在の実行状態\">現在の実行状態\u003c/h2>\n\u003cp>コード評価基準：2026-10-16（配備済み画面とローカル実装済み能力を区別して記載）。\u003cstrong>主要業務フローは実装済みであり、実業務実行と配備画面での受入確認を経ている。今後は実利用の結果に基づいて改善し、旧詳細設計リストに沿った進行は行わない。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>実装済み\u003c/strong>はコードと対応検証が存在すること、\u003cstrong>再確認待ち\u003c/strong>は目標環境や特定シナリオでの未確認、\u003cstrong>必要時評価\u003c/strong>は実需要が生じた時点で判断することを示す。未採用の拡張機能を分母にした進捗率は用いない。\u003c/p>\n\u003ch2 id=\"実装済みの主要能力\">実装済みの主要能力\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>範囲\u003c/th>\n\u003cth>現在の利用可能能力\u003c/th>\n\u003cth>検証境界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Skill → タスク\u003c/td>\n\u003ctd>取込・解析・公開・Project 有効化。複数 Skill フォルダから対象を選択し共有 Schema/参照を原 byte で固定。最小の入力/資源宣言と凍結原文で実行し、汎用 Tool は常備、操作許可は選択資源から固定。同一タスクで回答・継続\u003c/td>\n\u003ctd>独立 Skill の取込〜実行・報告は実環境で確認済み。複数 Skill 選択と資源/Tool 分離は実装済み・配備後再確認待ち。解釈品質はユースケースごとに検証\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RV\u003c/td>\n\u003ctd>Excel → Markdown 変換・保存 → レビュー → PostgreSQL/文書庫記録（FAIL 時のみレビュー報告書を保存）\u003c/td>\n\u003ctd>実業務経路を通過済み。原 byte への RV 付記追加、変換ファイル直渡と分割読取、静的書式解析（\u003ccode>excel-styles/v3\u003c/code>）、未完了記録の収束は配備後再確認待ち\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>デスクトップ試験\u003c/td>\n\u003ctd>RV 通過済み Markdown を直接用い、実行前に手順索引・元の期待値・環境を固定。MCP で起動・観測・段階操作し記録と結果を保存\u003c/td>\n\u003ctd>既定 UI 手順の完走と結果保存を実環境で確認済み。\u003ccode>COMPLETED\u003c/code> は実行完了であり業務上の \u003ccode>PASS\u003c/code> ではない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資源と外部書込\u003c/td>\n\u003ctd>文書パス読書き、Git 編集ディレクトリとコミット提案、MCP 原生引数ファイル、PostgreSQL 原生 SQL、汎用 HTTP API（基底 URL 一覧と単発要求/応答交付）。資源ルーティング・権限・承認・回読検査を維持\u003c/td>\n\u003ctd>旧 DB/文書/MCP 経路は実利用あり。原生クライアントと設定移行は隔離回帰済み・配備後再確認待ち。PostgreSQL は既存アカウント権限を利用し、事前/事後照会は Agent が選択。外部回執表不要の単発 DML と rollback 診断は配備後再確認待ち\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文書と実行履歴\u003c/td>\n\u003ctd>フォルダ管理、改名/移動、一括整理、検索・ソート、同名ファイルの既定上書き更新。20 MB 画像/テキスト preview、Worker 分割 Markdown と静的 Mermaid preview。履歴と文書の回収・復元・完全削除・最小監査\u003c/td>\n\u003ctd>文書整理、preview/download、検索展開、空フォルダ検索は配備確認済み。分割 Markdown/Mermaid、Agent パス読書き、同名更新の旧版保持と競合復旧は配備後再確認待ち\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ワークスペースとレポート\u003c/td>\n\u003ctd>待機中・進行中・タスク別の最新サマリ。詳細に結果・証拠・監査・評価・添付・所要時間を集約\u003c/td>\n\u003ctd>主要画面、タブ、ダイアログ、バッジ整列、狭幅・双テーマは配備確認済み。履歴タスク名、版グループ化、添付折畳、三語表示改善は実装済み\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>基盤管理\u003c/td>\n\u003ctd>ログイン/メンバー/Project、アーカイブ済み Project の完全削除、組織 API Key、接続資格情報、タスク検索と定期実行（毎日/毎週/cron、既定で自動承認し発火時の同意を固定）\u003c/td>\n\u003ctd>Project 管理、API Key 作成/呼出/失効は実測済み。アーカイブ Project 完全削除、定期実行設定と自動承認権限回帰は実装済み・配備後再確認待ち\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>実行効率と診断\u003c/td>\n\u003ctd>SQLSTATE 分類、テーブル構造再利用、凍結 Skill ファイル直渡、大ページ/JSON Pointer 精密読取、大回執のファイル交付、モデル業務結果とプラットフォーム監査組立の分離、サマリ整形、監査エクスポート、保守キュー分離、所要時間観測\u003c/td>\n\u003ctd>回帰と実所要時間の改善を確認済み。短参照による結果組立、大ページ、回執ファイル交付、JSON 精密読取は隔離回帰済み、実業務での効果は同条件で配備後再確認待ち\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>デスクトップ実行と後続判定は凍結 Markdown・手順索引・元の期待値に基づき、受控 MCP 原 byte ダウンロード、モデル画像交付、Project 全文書庫読取、アップロード ID/hash 直読を接続済み。単回完走は無人安定性や欠陥検出率を保証しない。\u003c/p>\n\u003ch2 id=\"継続確認事項\">継続確認事項\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事項\u003c/th>\n\u003cth>現在の扱い\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>業務結果の信頼性\u003c/td>\n\u003ctd>固定入力・明確な範囲・独立した期待値で RV、実操作、結果保存、最終判定を照合し、漏れ・人工介入・未検証範囲を残す\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>異常と復旧\u003c/td>\n\u003ctd>取消、権限剥奪、再起動、競合、結果不明時は原操作と実配備環境で検証し、新規 Run 作成や書込再送で代替しない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>証拠の完全性\u003c/td>\n\u003ctd>Runner が返すパスは入庫済み証拠を意味しない。許可された能力で実ファイル取得と保存を確認し、未取得分は不足として明記する\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>データ整理と復元\u003c/td>\n\u003ctd>参照保護と最小監査を維持。オブジェクト削除の永続リトライ/クォータ精算、インスタンス間復旧、Secret/データ復元は実配備で検証\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>継続的な性能\u003c/td>\n\u003ctd>初回操作、人工介入、待機/再開、モデル出力、収束時間を比較。同一 job 内の自動承認後 Codex プロセス再利用、読取専用短ツール列、既定 OFF の単発 Effect 直接回執を実装済み（外部書込の一括列は未接続）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>共有予算の完全閉ループと確実な遠隔停止は未完。編集可能 Flow、生成 UI、子 Agent、高度オーケストレーション等は必要時評価とし、境界は\u003ca href=\"#docs/development/runtime-guide.md::%E5%BE%8C%E7%BD%AE%E8%83%BD%E5%8A%9B\">後置能力\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"今後の進め方\">今後の進め方\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>利用結果から課題を選ぶ\u003c/strong>：再現手順と元 Run/画面を記録し、誤結果・データリスク・ブロッカーを最優先し、次に所要時間・反復操作・可読性を扱う。\u003c/li>\n\u003cli>\u003cstrong>特定後に最小修正する\u003c/strong>：Skill・モデル・プラットフォーム・外部サービス・画面を切り分け、\u003ca href=\"#docs/operations/run-performance.md::\">性能観測\u003c/a>に基づき必要な保存・承認・回読・検証を省略せず修正する。\u003c/li>\n\u003cli>\u003cstrong>回帰・配備・効果確認\u003c/strong>：変更リスクに応じて検証し、凍結規則の変更で過去 Run を上書きしない。安定した規則変更のみガイドへ反映する。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"交付判断\">交付判断\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>業務利用可能\u003c/strong>：合意範囲を完了し、結論・証拠・記録・未実行項目を追跡可能で、実行完了と業務判定を分けて表示できる。\u003c/li>\n\u003cli>\u003cstrong>境界の非退行\u003c/strong>：権限、凍結入力、承認、べき等性、参照保護、結果不明時の扱いが維持されている。\u003c/li>\n\u003cli>\u003cstrong>実配備可能\u003c/strong>：関連回帰が通過し、目標環境で操作でき、残る制限と再確認待ちシナリオが明記されている。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "Skillmind 現在の進捗と改善方針", "level": "h1", "anchor": "skillmind-現在の進捗と改善方針", "text": "# Skillmind 現在の進捗と改善方針\n\n本ページは現在の能力、再確認待ち事項、改善の優先順位を管理する。開発の入口は[変更ガイド](../development/change-guide.md)、実行制約は[実行境界](../development/runtime-guide.md)を参照する。"}, {"title": "現在の実行状態", "level": "h2", "anchor": "現在の実行状態", "text": "## 現在の実行状態\n\nコード評価基準：2026-10-16（配備済み画面とローカル実装済み能力を区別して記載）。**主要業務フローは実装済みであり、実業務実行と配備画面での受入確認を経ている。今後は実利用の結果に基づいて改善し、旧詳細設計リストに沿った進行は行わない。**\n\n**実装済み**はコードと対応検証が存在すること、**再確認待ち**は目標環境や特定シナリオでの未確認、**必要時評価**は実需要が生じた時点で判断することを示す。未採用の拡張機能を分母にした進捗率は用いない。"}, {"title": "実装済みの主要能力", "level": "h2", "anchor": "実装済みの主要能力", "text": "## 実装済みの主要能力\n\n| 範囲 | 現在の利用可能能力 | 検証境界 |\n| --- | --- | --- |\n| Skill → タスク | 取込・解析・公開・Project 有効化。複数 Skill フォルダから対象を選択し共有 Schema/参照を原 byte で固定。最小の入力/資源宣言と凍結原文で実行し、汎用 Tool は常備、操作許可は選択資源から固定。同一タスクで回答・継続 | 独立 Skill の取込〜実行・報告は実環境で確認済み。複数 Skill 選択と資源/Tool 分離は実装済み・配備後再確認待ち。解釈品質はユースケースごとに検証 |\n| RV | Excel → Markdown 変換・保存 → レビュー → PostgreSQL/文書庫記録（FAIL 時のみレビュー報告書を保存） | 実業務経路を通過済み。原 byte への RV 付記追加、変換ファイル直渡と分割読取、静的書式解析（`excel-styles/v3`）、未完了記録の収束は配備後再確認待ち |\n| デスクトップ試験 | RV 通過済み Markdown を直接用い、実行前に手順索引・元の期待値・環境を固定。MCP で起動・観測・段階操作し記録と結果を保存 | 既定 UI 手順の完走と結果保存を実環境で確認済み。`COMPLETED` は実行完了であり業務上の `PASS` ではない |\n| 資源と外部書込 | 文書パス読書き、Git 編集ディレクトリとコミット提案、MCP 原生引数ファイル、PostgreSQL 原生 SQL、汎用 HTTP API（基底 URL 一覧と単発要求/応答交付）。資源ルーティング・権限・承認・回読検査を維持 | 旧 DB/文書/MCP 経路は実利用あり。原生クライアントと設定移行は隔離回帰済み・配備後再確認待ち。PostgreSQL は既存アカウント権限を利用し、事前/事後照会は Agent が選択。外部回執表不要の単発 DML と rollback 診断は配備後再確認待ち |\n| 文書と実行履歴 | フォルダ管理、改名/移動、一括整理、検索・ソート、同名ファイルの既定上書き更新。20 MB 画像/テキスト preview、Worker 分割 Markdown と静的 Mermaid preview。履歴と文書の回収・復元・完全削除・最小監査 | 文書整理、preview/download、検索展開、空フォルダ検索は配備確認済み。分割 Markdown/Mermaid、Agent パス読書き、同名更新の旧版保持と競合復旧は配備後再確認待ち |\n| ワークスペースとレポート | 待機中・進行中・タスク別の最新サマリ。詳細に結果・証拠・監査・評価・添付・所要時間を集約 | 主要画面、タブ、ダイアログ、バッジ整列、狭幅・双テーマは配備確認済み。履歴タスク名、版グループ化、添付折畳、三語表示改善は実装済み |\n| 基盤管理 | ログイン/メンバー/Project、アーカイブ済み Project の完全削除、組織 API Key、接続資格情報、タスク検索と定期実行（毎日/毎週/cron、既定で自動承認し発火時の同意を固定） | Project 管理、API Key 作成/呼出/失効は実測済み。アーカイブ Project 完全削除、定期実行設定と自動承認権限回帰は実装済み・配備後再確認待ち |\n| 実行効率と診断 | SQLSTATE 分類、テーブル構造再利用、凍結 Skill ファイル直渡、大ページ/JSON Pointer 精密読取、大回執のファイル交付、モデル業務結果とプラットフォーム監査組立の分離、サマリ整形、監査エクスポート、保守キュー分離、所要時間観測 | 回帰と実所要時間の改善を確認済み。短参照による結果組立、大ページ、回執ファイル交付、JSON 精密読取は隔離回帰済み、実業務での効果は同条件で配備後再確認待ち |\n\nデスクトップ実行と後続判定は凍結 Markdown・手順索引・元の期待値に基づき、受控 MCP 原 byte ダウンロード、モデル画像交付、Project 全文書庫読取、アップロード ID/hash 直読を接続済み。単回完走は無人安定性や欠陥検出率を保証しない。"}, {"title": "継続確認事項", "level": "h2", "anchor": "継続確認事項", "text": "## 継続確認事項\n\n| 事項 | 現在の扱い |\n| --- | --- |\n| 業務結果の信頼性 | 固定入力・明確な範囲・独立した期待値で RV、実操作、結果保存、最終判定を照合し、漏れ・人工介入・未検証範囲を残す |\n| 異常と復旧 | 取消、権限剥奪、再起動、競合、結果不明時は原操作と実配備環境で検証し、新規 Run 作成や書込再送で代替しない |\n| 証拠の完全性 | Runner が返すパスは入庫済み証拠を意味しない。許可された能力で実ファイル取得と保存を確認し、未取得分は不足として明記する |\n| データ整理と復元 | 参照保護と最小監査を維持。オブジェクト削除の永続リトライ/クォータ精算、インスタンス間復旧、Secret/データ復元は実配備で検証 |\n| 継続的な性能 | 初回操作、人工介入、待機/再開、モデル出力、収束時間を比較。同一 job 内の自動承認後 Codex プロセス再利用、読取専用短ツール列、既定 OFF の単発 Effect 直接回執を実装済み（外部書込の一括列は未接続） |\n\n共有予算の完全閉ループと確実な遠隔停止は未完。編集可能 Flow、生成 UI、子 Agent、高度オーケストレーション等は必要時評価とし、境界は[後置能力](../development/runtime-guide.md#後置能力)を参照する。"}, {"title": "今後の進め方", "level": "h2", "anchor": "今後の進め方", "text": "## 今後の進め方\n\n1. **利用結果から課題を選ぶ**：再現手順と元 Run/画面を記録し、誤結果・データリスク・ブロッカーを最優先し、次に所要時間・反復操作・可読性を扱う。\n2. **特定後に最小修正する**：Skill・モデル・プラットフォーム・外部サービス・画面を切り分け、[性能観測](../operations/run-performance.md)に基づき必要な保存・承認・回読・検証を省略せず修正する。\n3. **回帰・配備・効果確認**：変更リスクに応じて検証し、凍結規則の変更で過去 Run を上書きしない。安定した規則変更のみガイドへ反映する。"}, {"title": "交付判断", "level": "h2", "anchor": "交付判断", "text": "## 交付判断\n\n- **業務利用可能**：合意範囲を完了し、結論・証拠・記録・未実行項目を追跡可能で、実行完了と業務判定を分けて表示できる。\n- **境界の非退行**：権限、凍結入力、承認、べき等性、参照保護、結果不明時の扱いが維持されている。\n- **実配備可能**：関連回帰が通過し、目標環境で操作でき、残る制限と再確認待ちシナリオが明記されている。"}], "toc": [{"title": "現在の実行状態", "anchor": "現在の実行状態", "level": "h2"}, {"title": "実装済みの主要能力", "anchor": "実装済みの主要能力", "level": "h2"}, {"title": "継続確認事項", "anchor": "継続確認事項", "level": "h2"}, {"title": "今後の進め方", "anchor": "今後の進め方", "level": "h2"}, {"title": "交付判断", "anchor": "交付判断", "level": "h2"}], "source": "planning/roadmap.md", "checksum": "ddf6b6c57c8d8420373984877158024bdc1b82f8bcf564100823681f4aa3e9dd"}, {"id": "docs/design/workspace.md", "title": "UI 開発ガイド", "group": "design", "html": "\u003ch1 id=\"ui-開発ガイド\">UI 開発ガイド\u003c/h1>\n\u003cp>ワークスペースはタスク起動・待機処理・最新サマリを担い、実行履歴は単回 Run の完全な記録を担う。実装は \u003ca href=\"../SKM/web/src\">web/src\u003c/a>、送信と復旧境界は\u003ca href=\"#docs/development/runtime-guide.md::\">実行・データ保守ガイド\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"視覚規約\">視覚規約\u003c/h2>\n\u003cp>新規画面も既存ワークベンチの余白・整列・情報階層を踏襲し、別系統の視覚ルールを作らない。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>テーマと基本スタイル\u003c/strong>：暖灰の夜間・クリーム色の昼間テーマと暖色アクセントを再利用し、\u003ca href=\"../SKM/web/src/styles/base.css\">共有スタイル\u003c/a>・\u003ca href=\"../SKM/web/src/styles/reading.css\">読書レイアウト\u003c/a>・\u003ca href=\"../SKM/web/src/components/routeIcons.tsx\">線画アイコン\u003c/a>に従う。三語はメッセージカタログで統一し、テーマ切替でフォームを再構築しない。PC 1440×900 を基準に 1366×768・1920×1080・390px 狭幅に対応する。\u003c/li>\n\u003cli>\u003cstrong>操作階層と一覧\u003c/strong>：各領域の主操作は 1 つに絞り、改名・移動・無効化・削除などの管理操作は常駐の \u003ccode>⋯\u003c/code> メニューに収める（hover 依存にしない）。一覧見出しはタスク名を表示し、履歴の実行名は元の束縛バージョンから読み取る（ID・版・ハッシュは技術詳細へ置く）。長文は折り返し、文字縮小や横溢れを起こさない。フォルダのチェックボックスは現在の絞込範囲のみを選択し、選択時のみ一括操作バーを表示する。\u003c/li>\n\u003cli>\u003cstrong>レイアウトとコンテナ\u003c/strong>：画面間移動はサイドバー、同一画面内の切替はタブ（待機中・進行中・レポートは同幅）を使う。短い補足は折りたたみ、資源・証拠・評価はドロワー、削除/回収確認はコンパクトなダイアログ（対象名・パス/ID・影響を明示し、対象一覧のみ有界スクロール）を使い、ダイアログを入れ子にしない。アカウント（本人・API Key・組織ユーザー）はタブ、Project 作成/編集はドロワーを使い、実行・定期実行の送信ボタンはフォームの固定フッターに置く。\u003c/li>\n\u003cli>\u003cstrong>Select と Autocomplete\u003c/strong>：単一選択は共有 \u003ccode>Select\u003c/code>（Base UI Select）で統一し、ブラウザ固有の \u003ccode>appearance: base-select\u003c/code> に頼らず境界・影・選択色・チェックマーク枠（未選択行も幅を固定）を描画する。長文選択肢は折り返してスクロールし、popup が Escape を処理した際は親ダイアログを閉じない。文書アップロード先は Base UI Autocomplete を用いた \u003ccode>DocumentFolderInput\u003c/code> とし、ルート・既存階層候補・新規自由入力パスを保持する。\u003c/li>\n\u003cli>\u003cstrong>コントロール密度と余白\u003c/strong>：言語・状態・評価点・真偽値・スケジュール等の短い候補は \u003ccode>compact\u003c/code> 密度とし、フィールド幅を制限して隣接入力と高さを揃える（資源・文書・パス等の長い項目には適用しない）。有界スクロールの候補一覧・メニューは左右対称のスクロールバー余白を確保し、短いメニューや非スクロールのダイアログには空の余白を予約しない。Checkbox/Radio にテキスト入力の幅・最小高・padding を継承させない。\u003c/li>\n\u003cli>\u003cstrong>フォーカスと下書き保持\u003c/strong>：hover は中立色、選択は淡い強調色とチェックマーク、キーボード焦点は枠線で区別し、ポインタ操作へ戻った際に焦点枠を残さない。タブは現在項目のみを Tab 順序に置き（矢印/Home/End 対応）、タブ切替・ドロワー閉鎖・背景再読込で入力下書きや現在フォーカス、未確認要求を破棄しない。\u003c/li>\n\u003cli>\u003cstrong>入力と実行表示\u003c/strong>：自由記述は全幅の複数行入力とし、対話は元の全文と改行を保持する。Workspace 起動後は起動・画面移動と現在 Run の更新・取消を別の操作群にし、狭幅でも短いボタンを揃える。実行中は発生済みイベント・接続状態・実所要時間を表示し、根拠のない進捗率を作らない。エラーは失敗箇所・原因・次の操作を明示する。\u003c/li>\n\u003cli>\u003cstrong>実行詳細の階層\u003c/strong>：タスク名を主見出しにし、状態・作成時刻・所要時間・Run 識別を同じヘッダーへ集約する。タブ下線・進捗行・本文枠の間に一定の余白を設け、要約内へ外枠を重ねない。実行中の最新観測は短い開閉行に置き、直近イベントと payload は展開して読む。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"ナビゲーションとタスク\">ナビゲーションとタスク\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/web/src/lib/routing.ts\">共通ルーティング\u003c/a>で正確な Project/Run/Task を扱う。概要・ワークスペース・レポート・スケジュール・履歴からの実行リンクはすべて実行履歴詳細を開き、サイドバーも実行履歴を選択状態にする。Project 切替時は旧 Run/Task をクリアし、Project 削除確認後は再選択へ案内する（応答不明時は照合用に元対象を保持する）。\u003c/p>\n\u003cp>アーカイブ済み Project の完全削除は、終了済み実行（ごみ箱含む）・Project 文書（原入力含む）・定期実行・設定を一括削除し、組織 Skill・外部業務データ・独立監査を保持する。ファイル清掃は DB コミット後に行い、失敗時は記録と未清掃件数を表示する。\u003c/p>\n\u003cp>タスク一覧は名称・識別子・定期実行状態で検索でき、カード内にスケジュール状態と設定入口（毎日・毎週・高度な cron、時刻プレビューと保存検証を共有）を持つ。起動フォームとスケジュールは \u003ca href=\"../SKM/web/src/components/TaskLaunchFields.tsx\">TaskLaunchFields\u003c/a> と \u003ccode>taskDraft\u003c/code> を共用し、ディレクトリ選択時は配下の利用可能文書を一括選択する。\u003c/p>\n\u003ch2 id=\"レポートとプレビュー\">レポートとプレビュー\u003c/h2>\n\u003cp>「完了とレポート」はタスクごとに最新終態実行のサマリ・状態・所要時間・詳細入口を表示する（最新が失敗・取消のとき過去の成功レポートへ巻き戻さない）。添付・証拠・評価・技術記録は実行詳細に集約し、長い添付一覧は結果参照分を優先表示して残りを折りたたみ可能にする。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>安全と形式の境界\u003c/strong>：テンプレートは業務結論・制限・引用を保持し、\u003ccode>SUCCEEDED\u003c/code> から業務 \u003ccode>PASS\u003c/code> を推測しない。JSON は数値精度・重複キー・元のダウンロード byte を保って整形表示し、HTML preview は sanitizer と無スクリプト sandbox を通し外部資源と遷移を禁止する。\u003c/li>\n\u003cli>\u003cstrong>20 MB 共通プレビュー\u003c/strong>：文書庫の PNG/JPEG/GIF は認証付き endpoint から byte を取得し MIME・署名を検証して表示する（閉鎖・対象切替で Blob URL を破棄）。SVG と未対応形式はダウンロードを維持する。画像・テキスト文書の preview 上限は実 byte で 20 MB（20,000,000 byte）とし、Run 添付も同じ preview 部品を使う（添付の公開・保存契約自体は 1 MiB のまま維持）。\u003c/li>\n\u003cli>\u003cstrong>Worker 分割 Markdown プレビュー\u003c/strong>：文書管理・レポート・抜粋はキャンセル可能な Worker で分割解析し、表を行境界で分割して表頭を再掲し、現在ページの DOM のみ描画する。部分表の抜粋は同一 Run/path/hash の原読取記録で確認できた表頭と完全行のみを表示投影へ補う（原 Evidence は不変）。巨大ブロック・大 HTML・解析失敗・タイムアウトは理由付きの原文ページへ降格し、元ファイルのダウンロードを維持する。\u003c/li>\n\u003cli>\u003cstrong>静的 Mermaid フローチャート\u003c/strong>：明示的な \u003ccode>mermaid\u003c/code> コードブロックの基本 \u003ccode>flowchart\u003c/code>/\u003ccode>graph\u003c/code> は、現在ページに図がある時のみ遅延読込して静的フローチャートとして描画する（通常本文の \u003ccode>A→B→C\u003c/code> から図を推測しない）：\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-mermaid\">flowchart LR\n  A[開始] --\u0026gt; B{確認}\n  B --\u0026gt;|成功| C[完了]\n\u003c/code>\u003c/pre>\n\u003cp>配色は親テーマに追随し、SVG は狭幅へ縮小して有界領域でスクロールする。基本ノード・矢印・短いラベルのみ再構成し、\u003ccode>click\u003c/code>・URL・HTML・画像・設定指令・\u003ccode>style\u003c/code> は実行しない。出力 SVG も sanitizer と無スクリプト sandbox/CSP を通し、未対応構文や予算超過時は理由と元のコードを表示する。\u003c/p>\n\u003ch2 id=\"管理操作と非同期状態\">管理操作と非同期状態\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>要求のべき等性と下書き分離\u003c/strong>：文書/フォルダ管理、ごみ箱、アカウント操作は元の主体・二重送信防止・版競合・結果不明時の照合を共有する。通信失敗はロールバックを意味しないため別 key で自動再送せず、閉鎖・対象切替・アンマウント後の遅延応答は無視する。\u003c/li>\n\u003cli>\u003cstrong>入力検証と読込状態\u003c/strong>：JSON 入力は編集中の不正文字列も下書き保持し、構文/型エラー解消まで送信を止める。Skill の解析・保存・解釈は確認済み原文 snapshot に紐付け、原文変更後は再解析を案内する（下書き未作成の解析完了結果はリロード復元に対応し、モデルを再呼出しない）。\u003c/li>\n\u003cli>\u003cstrong>一覧と集計の事実性\u003c/strong>：候補・Project 有効化・モジュール・タスク・資源カタログは \u003ccode>loading\u003c/code>/\u003ccode>error\u003c/code>/\u003ccode>ready-empty\u003c/code> を区別し、読取失敗を「未設定」と表示しない。絞込・ページング・件数はサーバー事実を使い、1 ページ目のローカル絞込を全量と偽らない。フォルダ検索は一致パスを展開し空フォルダも検索可能とする。Skill 版はスキル単位で折りたたみ、メンバー候補の参加済み/無効ユーザーは現在ページ内で折りたたむ。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"検証入口\">検証入口\u003c/h2>\n\u003cp>\u003ca href=\"#docs/development/local-development.md::%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E5%9B%9E%E5%B8%B0\">ブラウザ回帰\u003c/a>を実行し、共通レイアウト変更時は双テーマ・三語・PC/狭幅で空状態・多件・長名称・キーボード・失敗・遅延応答を確認する。\n\u003ca href=\"../SKM/web/tests/browser/check_visual_style.py\">全体外観検査\u003c/a>と\u003ca href=\"../SKM/web/tests/browser/check_reading.py\">読書検査\u003c/a>は mock を使用するため、実配備のフォント・権限・ネットワーク・永続化は別途検証する。\u003c/p>\n", "sections": [{"title": "UI 開発ガイド", "level": "h1", "anchor": "ui-開発ガイド", "text": "# UI 開発ガイド\n\nワークスペースはタスク起動・待機処理・最新サマリを担い、実行履歴は単回 Run の完全な記録を担う。実装は [web/src](../../SKM/web/src/)、送信と復旧境界は[実行・データ保守ガイド](../development/runtime-guide.md)を参照する。"}, {"title": "視覚規約", "level": "h2", "anchor": "視覚規約", "text": "## 視覚規約\n\n新規画面も既存ワークベンチの余白・整列・情報階層を踏襲し、別系統の視覚ルールを作らない。\n\n- **テーマと基本スタイル**：暖灰の夜間・クリーム色の昼間テーマと暖色アクセントを再利用し、[共有スタイル](../../SKM/web/src/styles/base.css)・[読書レイアウト](../../SKM/web/src/styles/reading.css)・[線画アイコン](../../SKM/web/src/components/routeIcons.tsx)に従う。三語はメッセージカタログで統一し、テーマ切替でフォームを再構築しない。PC 1440×900 を基準に 1366×768・1920×1080・390px 狭幅に対応する。\n- **操作階層と一覧**：各領域の主操作は 1 つに絞り、改名・移動・無効化・削除などの管理操作は常駐の `⋯` メニューに収める（hover 依存にしない）。一覧見出しはタスク名を表示し、履歴の実行名は元の束縛バージョンから読み取る（ID・版・ハッシュは技術詳細へ置く）。長文は折り返し、文字縮小や横溢れを起こさない。フォルダのチェックボックスは現在の絞込範囲のみを選択し、選択時のみ一括操作バーを表示する。\n- **レイアウトとコンテナ**：画面間移動はサイドバー、同一画面内の切替はタブ（待機中・進行中・レポートは同幅）を使う。短い補足は折りたたみ、資源・証拠・評価はドロワー、削除/回収確認はコンパクトなダイアログ（対象名・パス/ID・影響を明示し、対象一覧のみ有界スクロール）を使い、ダイアログを入れ子にしない。アカウント（本人・API Key・組織ユーザー）はタブ、Project 作成/編集はドロワーを使い、実行・定期実行の送信ボタンはフォームの固定フッターに置く。\n- **Select と Autocomplete**：単一選択は共有 `Select`（Base UI Select）で統一し、ブラウザ固有の `appearance: base-select` に頼らず境界・影・選択色・チェックマーク枠（未選択行も幅を固定）を描画する。長文選択肢は折り返してスクロールし、popup が Escape を処理した際は親ダイアログを閉じない。文書アップロード先は Base UI Autocomplete を用いた `DocumentFolderInput` とし、ルート・既存階層候補・新規自由入力パスを保持する。\n- **コントロール密度と余白**：言語・状態・評価点・真偽値・スケジュール等の短い候補は `compact` 密度とし、フィールド幅を制限して隣接入力と高さを揃える（資源・文書・パス等の長い項目には適用しない）。有界スクロールの候補一覧・メニューは左右対称のスクロールバー余白を確保し、短いメニューや非スクロールのダイアログには空の余白を予約しない。Checkbox/Radio にテキスト入力の幅・最小高・padding を継承させない。\n- **フォーカスと下書き保持**：hover は中立色、選択は淡い強調色とチェックマーク、キーボード焦点は枠線で区別し、ポインタ操作へ戻った際に焦点枠を残さない。タブは現在項目のみを Tab 順序に置き（矢印/Home/End 対応）、タブ切替・ドロワー閉鎖・背景再読込で入力下書きや現在フォーカス、未確認要求を破棄しない。\n- **入力と実行表示**：自由記述は全幅の複数行入力とし、対話は元の全文と改行を保持する。Workspace 起動後は起動・画面移動と現在 Run の更新・取消を別の操作群にし、狭幅でも短いボタンを揃える。実行中は発生済みイベント・接続状態・実所要時間を表示し、根拠のない進捗率を作らない。エラーは失敗箇所・原因・次の操作を明示する。\n- **実行詳細の階層**：タスク名を主見出しにし、状態・作成時刻・所要時間・Run 識別を同じヘッダーへ集約する。タブ下線・進捗行・本文枠の間に一定の余白を設け、要約内へ外枠を重ねない。実行中の最新観測は短い開閉行に置き、直近イベントと payload は展開して読む。"}, {"title": "ナビゲーションとタスク", "level": "h2", "anchor": "ナビゲーションとタスク", "text": "## ナビゲーションとタスク\n\n[共通ルーティング](../../SKM/web/src/lib/routing.ts)で正確な Project/Run/Task を扱う。概要・ワークスペース・レポート・スケジュール・履歴からの実行リンクはすべて実行履歴詳細を開き、サイドバーも実行履歴を選択状態にする。Project 切替時は旧 Run/Task をクリアし、Project 削除確認後は再選択へ案内する（応答不明時は照合用に元対象を保持する）。\n\nアーカイブ済み Project の完全削除は、終了済み実行（ごみ箱含む）・Project 文書（原入力含む）・定期実行・設定を一括削除し、組織 Skill・外部業務データ・独立監査を保持する。ファイル清掃は DB コミット後に行い、失敗時は記録と未清掃件数を表示する。\n\nタスク一覧は名称・識別子・定期実行状態で検索でき、カード内にスケジュール状態と設定入口（毎日・毎週・高度な cron、時刻プレビューと保存検証を共有）を持つ。起動フォームとスケジュールは [TaskLaunchFields](../../SKM/web/src/components/TaskLaunchFields.tsx) と `taskDraft` を共用し、ディレクトリ選択時は配下の利用可能文書を一括選択する。"}, {"title": "レポートとプレビュー", "level": "h2", "anchor": "レポートとプレビュー", "text": "## レポートとプレビュー\n\n「完了とレポート」はタスクごとに最新終態実行のサマリ・状態・所要時間・詳細入口を表示する（最新が失敗・取消のとき過去の成功レポートへ巻き戻さない）。添付・証拠・評価・技術記録は実行詳細に集約し、長い添付一覧は結果参照分を優先表示して残りを折りたたみ可能にする。\n\n- **安全と形式の境界**：テンプレートは業務結論・制限・引用を保持し、`SUCCEEDED` から業務 `PASS` を推測しない。JSON は数値精度・重複キー・元のダウンロード byte を保って整形表示し、HTML preview は sanitizer と無スクリプト sandbox を通し外部資源と遷移を禁止する。\n- **20 MB 共通プレビュー**：文書庫の PNG/JPEG/GIF は認証付き endpoint から byte を取得し MIME・署名を検証して表示する（閉鎖・対象切替で Blob URL を破棄）。SVG と未対応形式はダウンロードを維持する。画像・テキスト文書の preview 上限は実 byte で 20 MB（20,000,000 byte）とし、Run 添付も同じ preview 部品を使う（添付の公開・保存契約自体は 1 MiB のまま維持）。\n- **Worker 分割 Markdown プレビュー**：文書管理・レポート・抜粋はキャンセル可能な Worker で分割解析し、表を行境界で分割して表頭を再掲し、現在ページの DOM のみ描画する。部分表の抜粋は同一 Run/path/hash の原読取記録で確認できた表頭と完全行のみを表示投影へ補う（原 Evidence は不変）。巨大ブロック・大 HTML・解析失敗・タイムアウトは理由付きの原文ページへ降格し、元ファイルのダウンロードを維持する。\n- **静的 Mermaid フローチャート**：明示的な `mermaid` コードブロックの基本 `flowchart`/`graph` は、現在ページに図がある時のみ遅延読込して静的フローチャートとして描画する（通常本文の `A→B→C` から図を推測しない）：\n\n```mermaid\nflowchart LR\n  A[開始] --> B{確認}\n  B -->|成功| C[完了]\n```\n\n配色は親テーマに追随し、SVG は狭幅へ縮小して有界領域でスクロールする。基本ノード・矢印・短いラベルのみ再構成し、`click`・URL・HTML・画像・設定指令・`style` は実行しない。出力 SVG も sanitizer と無スクリプト sandbox/CSP を通し、未対応構文や予算超過時は理由と元のコードを表示する。"}, {"title": "管理操作と非同期状態", "level": "h2", "anchor": "管理操作と非同期状態", "text": "## 管理操作と非同期状態\n\n- **要求のべき等性と下書き分離**：文書/フォルダ管理、ごみ箱、アカウント操作は元の主体・二重送信防止・版競合・結果不明時の照合を共有する。通信失敗はロールバックを意味しないため別 key で自動再送せず、閉鎖・対象切替・アンマウント後の遅延応答は無視する。\n- **入力検証と読込状態**：JSON 入力は編集中の不正文字列も下書き保持し、構文/型エラー解消まで送信を止める。Skill の解析・保存・解釈は確認済み原文 snapshot に紐付け、原文変更後は再解析を案内する（下書き未作成の解析完了結果はリロード復元に対応し、モデルを再呼出しない）。\n- **一覧と集計の事実性**：候補・Project 有効化・モジュール・タスク・資源カタログは `loading`/`error`/`ready-empty` を区別し、読取失敗を「未設定」と表示しない。絞込・ページング・件数はサーバー事実を使い、1 ページ目のローカル絞込を全量と偽らない。フォルダ検索は一致パスを展開し空フォルダも検索可能とする。Skill 版はスキル単位で折りたたみ、メンバー候補の参加済み/無効ユーザーは現在ページ内で折りたたむ。"}, {"title": "検証入口", "level": "h2", "anchor": "検証入口", "text": "## 検証入口\n\n[ブラウザ回帰](../development/local-development.md#ブラウザ回帰)を実行し、共通レイアウト変更時は双テーマ・三語・PC/狭幅で空状態・多件・長名称・キーボード・失敗・遅延応答を確認する。\n[全体外観検査](../../SKM/web/tests/browser/check_visual_style.py)と[読書検査](../../SKM/web/tests/browser/check_reading.py)は mock を使用するため、実配備のフォント・権限・ネットワーク・永続化は別途検証する。"}], "toc": [{"title": "視覚規約", "anchor": "視覚規約", "level": "h2"}, {"title": "ナビゲーションとタスク", "anchor": "ナビゲーションとタスク", "level": "h2"}, {"title": "レポートとプレビュー", "anchor": "レポートとプレビュー", "level": "h2"}, {"title": "管理操作と非同期状態", "anchor": "管理操作と非同期状態", "level": "h2"}, {"title": "検証入口", "anchor": "検証入口", "level": "h2"}], "source": "design/workspace.md", "checksum": "fe352c1303a10a93fd40fbf0e48c6df6219526e3ce7ac5b7e1e834edee2b9c2e"}, {"id": "docs/development/local-development.md", "title": "ローカル開発と検証", "group": "development", "html": "\u003ch1 id=\"ローカル開発と検証\">ローカル開発と検証\u003c/h1>\n\u003cp>全体の入口は \u003ca href=\"#SKM/README.md::\">SKM README\u003c/a>。検証は今回の変更に必要な範囲を選び、mock と実環境の証拠を区別する。\u003c/p>\n\u003ch2 id=\"前提と設定\">前提と設定\u003c/h2>\n\u003cp>Python 3.12、Node.js 26 / pnpm 11.7.0 を使用する。lockfile は手編集せず、Python 検証には \u003ccode>PYTHONDONTWRITEBYTECODE=1\u003c/code> を付ける。\u003ccode>.env.example\u003c/code> は production 雛形であり、localhost では development・許可 Origin・専用接続先・書込可能な Run workspace を設定する。Compose は\u003ca href=\"#docs/operations/deployment.md::%E7%92%B0%E5%A2%83%E3%83%95%E3%82%A1%E3%82%A4%E3%83%AB%E3%81%A8%E8%A8%AD%E5%AE%9A%E5%A2%83%E7%95%8C\">設定入口\u003c/a>の \u003ccode>ENV_FILE\u003c/code> を使う。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>\u003ccode>SKM/backend/\u003c/code> で実行する（migration は対象 DB を変更するため開発用接続を確認し、API と各 Worker は別 terminal で起動する）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -e \u0026quot;.[dev]\u0026quot;\nalembic upgrade head\npython3 -m uvicorn skillmind.api.main:app --reload --port 8000\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">arq skillmind.worker.settings.WorkerSettings\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">arq skillmind.worker.settings.MaintenanceWorkerSettings\n\u003c/code>\u003c/pre>\n\u003cp>health は \u003ccode>http://localhost:8000/internal/health/live\u003c/code> と \u003ccode>/internal/health/ready\u003c/code>。Compose 起動は\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>を使う。\u003c/p>\n\u003ch3 id=\"実-postgresql-の前提\">実 PostgreSQL の前提\u003c/h3>\n\u003cp>全 pytest は\u003ca href=\"../SKM/backend/tests/db/test_real_database_invariants.py\">実 DB fixture\u003c/a>を含み、\u003ccode>SKILLMIND_DATABASE_URL\u003c/code> の \u003cstrong>server 上で scratch DB を作成し migration 後に \u003ccode>DROP DATABASE WITH (FORCE)\u003c/code>\u003c/strong> を行う（DB 名変更だけでは隔離にならない）。実 DB を使わない場合は対象 test を指定するか、既知の実 DB module を除外する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">PYTHONDONTWRITEBYTECODE=1 python3 -m pytest --import-mode=importlib -p no:cacheprovider -o addopts= \\\n  --ignore=tests/db/test_real_database_invariants.py \\\n  --ignore=tests/db/test_real_auth_sessions.py \\\n  --ignore=tests/db/test_real_api_keys.py \\\n  --ignore=tests/db/test_real_budget_ledger.py\n\u003c/code>\u003c/pre>\n\u003cp>接続不能による skip は未実施、認証/権限/migration エラーは失敗として報告する。\u003c/p>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cp>\u003ccode>SKM/web/\u003c/code> で実行する（既定 URL は \u003ccode>http://localhost:5173/skillmind/\u003c/code>、API proxy は \u003ccode>http://127.0.0.1:8000\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">CI=true npx -y pnpm@11.7.0 install --frozen-lockfile\nnpx -y pnpm@11.7.0 dev\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"ブラウザ回帰\">ブラウザ回帰\u003c/h3>\n\u003cp>専用 harness は実 Component + mock API を使う（配備先 URL に向けない）。\u003ccode>SKM/web/\u003c/code> で初回依存導入後、専用 Vite を起動して別 terminal から runner を実行する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r tests/browser/requirements.txt\npython3 -m playwright install chromium\nnode_modules/.bin/vite --host 127.0.0.1 --port 5189 --strictPort\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">python3 tests/browser/check_projects.py \\\n  --url http://127.0.0.1:5189/skillmind/tests/browser/projects.html\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>主な runner（check_*.py）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>全体の見た目・部品\u003c/td>\n\u003ctd>visual_style、ui_review、reading、dropdown（dropdown.html）、short_controls（short-controls.html）、popup_spacing（popup-spacing.html）、action_menu、delete_confirmations\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Project・アカウント\u003c/td>\n\u003ctd>projects、project_members、project_management、login、accounts、api_keys\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>提出・待機・履歴\u003c/td>\n\u003ctd>run_submission、run_titles、task_flow、execution_presentation、workspace_execution、event_stream_batching、interaction_responses、proposal_decisions、run_history、history_actions、reconciliation、evaluation_submissions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>レポート・証拠\u003c/td>\n\u003ctd>report_reading、workspace_reports、result_references、artifacts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文書・directory\u003c/td>\n\u003ctd>document_library、document_sources、document_organization、document_preview、document_image_preview、document_upload、document_upload_receipts、document_upload_closures、document_update、document_batches、document_folder_input\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接続・Skill・調度\u003c/td>\n\u003ctd>resource_connections、resource_navigation、resource_editing、resource_request_lifecycle、database_writes、mcp_tools、release_features、interpretation_requests、skill_request_lifecycle、skill_library_delete、task_launch_identity、task_schedules、schedule_times\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>全 runner は \u003ca href=\"../SKM/web/tests/browser\">tests/browser\u003c/a> にあり、主に \u003ccode>projects.html\u003c/code>（提出系は \u003ccode>run-submission.html\u003c/code>）と \u003ccode>--output\u003c/code> を使う。\n共通の架空 API は \u003ccode>account_fixture.py\u003c/code> / \u003ccode>document_fixture.py\u003c/code>、描画待機・翻訳取得・機密入力の非公開検査は \u003ccode>browser_helpers.py\u003c/code> を使い、検証ケースの module から再 export しない。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Dropdown / Autocomplete / 寸法\u003c/strong>：\u003ccode>check_dropdown.py\u003c/code>（\u003ccode>dropdown.html\u003c/code>）、\u003ccode>check_document_folder_input.py\u003c/code>、\u003ccode>check_popup_spacing.py\u003c/code>（\u003ccode>popup-spacing.html\u003c/code>）、\u003ccode>check_short_controls.py\u003c/code>（\u003ccode>short-controls.html\u003c/code>）は \u003ccode>--browser all\u003c/code>（Chromium/Firefox/WebKit）で三語・双テーマ・PC/狭幅/短画面を検証し、\u003ccode>results.json\u003c/code> に実測矩形を保存する。OS native picker/datalist への fallback や jsdom 単体結果を見た目の証明と扱わない。\u003c/li>\n\u003cli>\u003cstrong>削除確認\u003c/strong>：\u003ccode>check_delete_confirmations.py\u003c/code> は長い文書/Run と複数成果を全面 mock し、原対象・後果・scroll・取消だけを確認する。\u003c/li>\n\u003cli>\u003cstrong>環境管理\u003c/strong>：外置依存は \u003ccode>PYTHONPATH\u003c/code>、browser は \u003ccode>PLAYWRIGHT_BROWSERS_PATH\u003c/code> を指定する。使用中 port を奪わず、終了時は自分の Vite だけを止める。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"変更に応じた検証\">変更に応じた検証\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>実行位置と選択基準\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Backend\u003c/td>\n\u003ctd>SKM/backend/：対象 Ruff/pytest。型変更は \u003ccode>python3 -m mypy src\u003c/code>、広範囲変更は関連 module に拡大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web\u003c/td>\n\u003ctd>SKM/web/：\u003ccode>node_modules/.bin/tsc -b --pretty false\u003c/code> と対象 Vitest。共有 UI 変更は双テーマ・三語・PC/狭幅の browser 回帰。bundle/依存変更は \u003ccode>node_modules/.bin/vite build\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>契約\u003c/td>\n\u003ctd>SKM/：\u003ccode>python3 scripts/validate_contracts.py\u003c/code> と \u003ca href=\"#docs/development/contract-workflow.md::%E6%9C%AA%E6%8E%A5%E7%B6%9A%E3%81%AE%E4%BA%A4%E4%BB%98%E7%B5%8C%E8%B7%AF%E3%81%A8%E6%A4%9C%E6%9F%BB\">OpenAPI 一致性\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compose / 工具\u003c/td>\n\u003ctd>SKM/：\u003ccode>python3 scripts/validate_compose.py\u003c/code>、対象 unittest。横断変更は \u003ccode>python3 -m unittest discover -s scripts/tests -v\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文書\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/documentation.md::\">文書 build/check と閲覧検証\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>全体回帰は広範囲変更やリリース候補で行う。実 Docker/Make/PowerShell がない場合は該当する起動・更新が未検証と明記する。\u003c/p>\n\u003ch2 id=\"必要な場合の隔離-probe\">必要な場合の隔離 probe\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/scripts\">スクリプト\u003c/a>の \u003ccode>--help\u003c/code> と先頭説明で前提・引数を確認してから実行する。既存の接続先や \u003ccode>.env\u003c/code> を試験環境の代用にしない。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>入口と検証範囲\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>PostgreSQL read/write\u003c/td>\n\u003ctd>probe_postgres_read.py / probe_postgres_write.py（外置 PGlite メモリ DB）、および tests/browser/probe_rv_reviewer_database.py\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Worker Queue\u003c/td>\n\u003ctd>probe_worker_queues.py：専用の空 Redis Unix socket。保守中の業務 dispatch/続行を確認\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ログイン防護\u003c/td>\n\u003ctd>tests/auth/test_real_login_protection.py と test_real_login_http.py：専用 Redis process（\u003ccode>SKILLMIND_TEST_REDIS_SERVER\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SDK / CLI\u003c/td>\n\u003ctd>probe_claude_agent_sdk.py / probe_claude_metering.py と Adapter test：offline / loopback 合成 API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原 SDK 提案続行\u003c/td>\n\u003ctd>tests/agent/test_proposal_resume_native.py：\u003ccode>SKILLMIND_NATIVE_CLI_TESTS=1\u003c/code> で固定 CLI と合成応答を検証\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Skill 解釈の合成検証は \u003ccode>SKM/\u003c/code> で次を使う（実モデル品質は \u003ccode>scripts/measure_skill_interpretations.py\u003c/code> 等で合意環境にて別途評価）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">skillmind-skill-interpret-fixture \\\n  backend/tests/fixtures/skills/repository-review \\\n  contracts/examples/skill-interpreter-response.v1.json\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"作業後\">作業後\u003c/h2>\n\u003cp>今回作った cache、build、一時 probe の process と file だけを片付け、既存成果物と依存 directory は保持する。検証範囲、skip/未実施、配備への反映有無を報告する。\u003c/p>\n", "sections": [{"title": "ローカル開発と検証", "level": "h1", "anchor": "ローカル開発と検証", "text": "# ローカル開発と検証\n\n全体の入口は [SKM README](../../SKM/README.md)。検証は今回の変更に必要な範囲を選び、mock と実環境の証拠を区別する。"}, {"title": "前提と設定", "level": "h2", "anchor": "前提と設定", "text": "## 前提と設定\n\nPython 3.12、Node.js 26 / pnpm 11.7.0 を使用する。lockfile は手編集せず、Python 検証には `PYTHONDONTWRITEBYTECODE=1` を付ける。`.env.example` は production 雛形であり、localhost では development・許可 Origin・専用接続先・書込可能な Run workspace を設定する。Compose は[設定入口](../operations/deployment.md#環境ファイルと設定境界)の `ENV_FILE` を使う。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\n`SKM/backend/` で実行する（migration は対象 DB を変更するため開発用接続を確認し、API と各 Worker は別 terminal で起動する）：\n\n```bash\npython3 -m pip install --user -e \".[dev]\"\nalembic upgrade head\npython3 -m uvicorn skillmind.api.main:app --reload --port 8000\n```\n\n```bash\narq skillmind.worker.settings.WorkerSettings\n```\n\n```bash\narq skillmind.worker.settings.MaintenanceWorkerSettings\n```\n\nhealth は `http://localhost:8000/internal/health/live` と `/internal/health/ready`。Compose 起動は[Quickstart](../operations/quickstart.md)を使う。"}, {"title": "実 PostgreSQL の前提", "level": "h3", "anchor": "実-postgresql-の前提", "text": "### 実 PostgreSQL の前提\n\n全 pytest は[実 DB fixture](../../SKM/backend/tests/db/test_real_database_invariants.py)を含み、`SKILLMIND_DATABASE_URL` の **server 上で scratch DB を作成し migration 後に `DROP DATABASE WITH (FORCE)`** を行う（DB 名変更だけでは隔離にならない）。実 DB を使わない場合は対象 test を指定するか、既知の実 DB module を除外する：\n\n```bash\nPYTHONDONTWRITEBYTECODE=1 python3 -m pytest --import-mode=importlib -p no:cacheprovider -o addopts= \\\n  --ignore=tests/db/test_real_database_invariants.py \\\n  --ignore=tests/db/test_real_auth_sessions.py \\\n  --ignore=tests/db/test_real_api_keys.py \\\n  --ignore=tests/db/test_real_budget_ledger.py\n```\n\n接続不能による skip は未実施、認証/権限/migration エラーは失敗として報告する。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n`SKM/web/` で実行する（既定 URL は `http://localhost:5173/skillmind/`、API proxy は `http://127.0.0.1:8000`）：\n\n```bash\nCI=true npx -y pnpm@11.7.0 install --frozen-lockfile\nnpx -y pnpm@11.7.0 dev\n```"}, {"title": "ブラウザ回帰", "level": "h3", "anchor": "ブラウザ回帰", "text": "### ブラウザ回帰\n\n専用 harness は実 Component + mock API を使う（配備先 URL に向けない）。`SKM/web/` で初回依存導入後、専用 Vite を起動して別 terminal から runner を実行する：\n\n```bash\npython3 -m pip install --user -r tests/browser/requirements.txt\npython3 -m playwright install chromium\nnode_modules/.bin/vite --host 127.0.0.1 --port 5189 --strictPort\n```\n\n```bash\npython3 tests/browser/check_projects.py \\\n  --url http://127.0.0.1:5189/skillmind/tests/browser/projects.html\n```\n\n| 対象 | 主な runner（check_*.py） |\n| --- | --- |\n| 全体の見た目・部品 | visual_style、ui_review、reading、dropdown（dropdown.html）、short_controls（short-controls.html）、popup_spacing（popup-spacing.html）、action_menu、delete_confirmations |\n| Project・アカウント | projects、project_members、project_management、login、accounts、api_keys |\n| 提出・待機・履歴 | run_submission、run_titles、task_flow、execution_presentation、workspace_execution、event_stream_batching、interaction_responses、proposal_decisions、run_history、history_actions、reconciliation、evaluation_submissions |\n| レポート・証拠 | report_reading、workspace_reports、result_references、artifacts |\n| 文書・directory | document_library、document_sources、document_organization、document_preview、document_image_preview、document_upload、document_upload_receipts、document_upload_closures、document_update、document_batches、document_folder_input |\n| 接続・Skill・調度 | resource_connections、resource_navigation、resource_editing、resource_request_lifecycle、database_writes、mcp_tools、release_features、interpretation_requests、skill_request_lifecycle、skill_library_delete、task_launch_identity、task_schedules、schedule_times |\n\n全 runner は [tests/browser](../../SKM/web/tests/browser/) にあり、主に `projects.html`（提出系は `run-submission.html`）と `--output` を使う。\n共通の架空 API は `account_fixture.py` / `document_fixture.py`、描画待機・翻訳取得・機密入力の非公開検査は `browser_helpers.py` を使い、検証ケースの module から再 export しない。\n\n- **Dropdown / Autocomplete / 寸法**：`check_dropdown.py`（`dropdown.html`）、`check_document_folder_input.py`、`check_popup_spacing.py`（`popup-spacing.html`）、`check_short_controls.py`（`short-controls.html`）は `--browser all`（Chromium/Firefox/WebKit）で三語・双テーマ・PC/狭幅/短画面を検証し、`results.json` に実測矩形を保存する。OS native picker/datalist への fallback や jsdom 単体結果を見た目の証明と扱わない。\n- **削除確認**：`check_delete_confirmations.py` は長い文書/Run と複数成果を全面 mock し、原対象・後果・scroll・取消だけを確認する。\n- **環境管理**：外置依存は `PYTHONPATH`、browser は `PLAYWRIGHT_BROWSERS_PATH` を指定する。使用中 port を奪わず、終了時は自分の Vite だけを止める。"}, {"title": "変更に応じた検証", "level": "h2", "anchor": "変更に応じた検証", "text": "## 変更に応じた検証\n\n| 対象 | 実行位置と選択基準 |\n| --- | --- |\n| Backend | SKM/backend/：対象 Ruff/pytest。型変更は `python3 -m mypy src`、広範囲変更は関連 module に拡大 |\n| Web | SKM/web/：`node_modules/.bin/tsc -b --pretty false` と対象 Vitest。共有 UI 変更は双テーマ・三語・PC/狭幅の browser 回帰。bundle/依存変更は `node_modules/.bin/vite build` |\n| 契約 | SKM/：`python3 scripts/validate_contracts.py` と [OpenAPI 一致性](contract-workflow.md#未接続の交付経路と検査) |\n| Compose / 工具 | SKM/：`python3 scripts/validate_compose.py`、対象 unittest。横断変更は `python3 -m unittest discover -s scripts/tests -v` |\n| 文書 | [文書 build/check と閲覧検証](documentation.md) |\n\n\n全体回帰は広範囲変更やリリース候補で行う。実 Docker/Make/PowerShell がない場合は該当する起動・更新が未検証と明記する。"}, {"title": "必要な場合の隔離 probe", "level": "h2", "anchor": "必要な場合の隔離-probe", "text": "## 必要な場合の隔離 probe\n\n[スクリプト](../../SKM/scripts/)の `--help` と先頭説明で前提・引数を確認してから実行する。既存の接続先や `.env` を試験環境の代用にしない。\n\n| 対象 | 入口と検証範囲 |\n| --- | --- |\n| PostgreSQL read/write | probe_postgres_read.py / probe_postgres_write.py（外置 PGlite メモリ DB）、および tests/browser/probe_rv_reviewer_database.py |\n| Worker Queue | probe_worker_queues.py：専用の空 Redis Unix socket。保守中の業務 dispatch/続行を確認 |\n| ログイン防護 | tests/auth/test_real_login_protection.py と test_real_login_http.py：専用 Redis process（`SKILLMIND_TEST_REDIS_SERVER`） |\n| SDK / CLI | probe_claude_agent_sdk.py / probe_claude_metering.py と Adapter test：offline / loopback 合成 API |\n| 原 SDK 提案続行 | tests/agent/test_proposal_resume_native.py：`SKILLMIND_NATIVE_CLI_TESTS=1` で固定 CLI と合成応答を検証 |\n\nSkill 解釈の合成検証は `SKM/` で次を使う（実モデル品質は `scripts/measure_skill_interpretations.py` 等で合意環境にて別途評価）：\n\n```bash\nskillmind-skill-interpret-fixture \\\n  backend/tests/fixtures/skills/repository-review \\\n  contracts/examples/skill-interpreter-response.v1.json\n```"}, {"title": "作業後", "level": "h2", "anchor": "作業後", "text": "## 作業後\n\n今回作った cache、build、一時 probe の process と file だけを片付け、既存成果物と依存 directory は保持する。検証範囲、skip/未実施、配備への反映有無を報告する。"}], "toc": [{"title": "前提と設定", "anchor": "前提と設定", "level": "h2"}, {"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "実 PostgreSQL の前提", "anchor": "実-postgresql-の前提", "level": "h3"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "ブラウザ回帰", "anchor": "ブラウザ回帰", "level": "h3"}, {"title": "変更に応じた検証", "anchor": "変更に応じた検証", "level": "h2"}, {"title": "必要な場合の隔離 probe", "anchor": "必要な場合の隔離-probe", "level": "h2"}, {"title": "作業後", "anchor": "作業後", "level": "h2"}], "source": "development/local-development.md", "checksum": "28d4e7b6e1358961898bc320fb0665586e3bec13dacd2bcbc1bbbe66c7d5f2b4"}, {"id": "docs/development/change-guide.md", "title": "コード変更ガイド", "group": "development", "html": "\u003ch1 id=\"コード変更ガイド\">コード変更ガイド\u003c/h1>\n\u003cp>作業前に \u003ca href=\"#AGENTS.md::\">AGENTS\u003c/a> と\u003ca href=\"#docs/planning/roadmap.md::%E7%8F%BE%E5%9C%A8%E3%81%AE%E5%AE%9F%E8%A1%8C%E7%8A%B6%E6%85%8B\">現在の状態\u003c/a>を読み、利用シナリオ・課題・完了基準を明確にしてから下表で対象コードを特定する。維持すべき境界は\u003ca href=\"#docs/development/runtime-guide.md::\">実行・データ保守ガイド\u003c/a>、詳細な型はソースと Contracts を参照する。\u003c/p>\n\u003ch2 id=\"課題別のコード入口\">課題別のコード入口\u003c/h2>\n\u003cp>Backend パスは \u003ccode>SKM/backend/src/skillmind/\u003c/code> 基準。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>シナリオ\u003c/th>\n\u003cth>主な入口\u003c/th>\n\u003cth>確認重点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ログイン・アカウント・Project 権限\u003c/td>\n\u003ctd>auth/、projects/、api/auth_dependencies.py\u003c/td>\n\u003ctd>元の主体、権限剥奪、CSRF/API Key、資源隔離\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill 取込と公開\u003c/td>\n\u003ctd>skills/service.py、skills/source_loader.py、skills/source_storage.py、agent/interpreter*\u003c/td>\n\u003ctd>プレビュー/保存/再構築でパッケージ解析と byte 保存を共有。認可とトランザクションは Service に置き、原文 hash と公開検証を維持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>タスク・スケジュール・入力\u003c/td>\n\u003ctd>runs/、schedules/、agent/context_builder.py\u003c/td>\n\u003ctd>正確なタスク、元要求のべき等性、凍結選択と物化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>実行・待機・復旧\u003c/td>\n\u003ctd>agent/、runs/、worker/settings.py（job・lifecycle）、worker/runtime_wiring.py（実行依存の組立）\u003c/td>\n\u003ctd>Segment/Attempt、lease、イベント、取消、結果不明時の扱い\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>実行履歴・詳細\u003c/td>\n\u003ctd>runs/query_repository.py\u003c/td>\n\u003ctd>Project 範囲、ページング、元 Run の投影。状態更新は runs/repository.py に置く\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DB・Git・MCP 書込\u003c/td>\n\u003ctd>effects/、agent/\u003cem>_provider.py、agent/\u003c/em>_source.py\u003c/td>\n\u003ctd>束縛、承認、競合、原操作の回執と回読。提案の証拠照合は effects/proposal_evidence.py、公開投影は effects/projections.py\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文書・フォルダ・ごみ箱\u003c/td>\n\u003ctd>documents/、storage/、runs/\u003c/td>\n\u003ctd>原入力、共有参照、復元と完全削除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>結果と評価\u003c/td>\n\u003ctd>agent/result_validation.py、evaluations/\u003c/td>\n\u003ctd>元結果の不変性、参照検証、追記評価\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>画面と対話\u003c/td>\n\u003ctd>web/src/pages、components、hooks、api、lib\u003c/td>\n\u003ctd>画面構成・要求ライフサイクル・純粋変換の分離、\u003ca href=\"#docs/design/workspace.md::\">UI ガイド\u003c/a>、要求と応答の検証\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>設定・移行・復元\u003c/td>\n\u003ctd>core/settings.py、backend/migrations、compose.yml\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/deployment.md::\">配備\u003c/a>と\u003ca href=\"#docs/operations/backup-recovery.md::\">復元\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"変更規模の抑制\">変更規模の抑制\u003c/h2>\n\u003cp>局所的なスタイル・文言・エラー診断は既存コンポーネントとサービスをそのまま使い、新たなフローを作らない。権限・永続化・公開プロトコルに関わる場合は凍結点、消費者、失敗/復旧、版互換を確認し、\u003ca href=\"#docs/development/contract-workflow.md::\">契約変更手順\u003c/a>に従って同期する。\u003c/p>\n\u003cp>性能改善のために業務書込・承認・回読・結果検証を省略しない。実行速度の課題はまず\u003ca href=\"#docs/operations/run-performance.md::\">性能観測\u003c/a>で計測根拠を確認する。\u003c/p>\n\u003ch2 id=\"検証と交付\">検証と交付\u003c/h2>\n\u003cp>\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%9C%9F%E7%82%B9\">同期点\u003c/a>と\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">変更に応じた検証\u003c/a>から回帰テストを選ぶ。単体通過・実 DB/ブラウザ/モデル検証・配備済み状態を区別し、失敗・skip・未実施を明記する。恒久規則は該当ガイド、機能状態は Roadmap を更新し、文書生成は\u003ca href=\"#docs/development/documentation.md::\">文書維持\u003c/a>に従う。\u003c/p>\n", "sections": [{"title": "コード変更ガイド", "level": "h1", "anchor": "コード変更ガイド", "text": "# コード変更ガイド\n\n作業前に [AGENTS](../../AGENTS.md) と[現在の状態](../planning/roadmap.md#現在の実行状態)を読み、利用シナリオ・課題・完了基準を明確にしてから下表で対象コードを特定する。維持すべき境界は[実行・データ保守ガイド](runtime-guide.md)、詳細な型はソースと Contracts を参照する。"}, {"title": "課題別のコード入口", "level": "h2", "anchor": "課題別のコード入口", "text": "## 課題別のコード入口\n\nBackend パスは `SKM/backend/src/skillmind/` 基準。\n\n| シナリオ | 主な入口 | 確認重点 |\n| --- | --- | --- |\n| ログイン・アカウント・Project 権限 | auth/、projects/、api/auth_dependencies.py | 元の主体、権限剥奪、CSRF/API Key、資源隔離 |\n| Skill 取込と公開 | skills/service.py、skills/source_loader.py、skills/source_storage.py、agent/interpreter* | プレビュー/保存/再構築でパッケージ解析と byte 保存を共有。認可とトランザクションは Service に置き、原文 hash と公開検証を維持 |\n| タスク・スケジュール・入力 | runs/、schedules/、agent/context_builder.py | 正確なタスク、元要求のべき等性、凍結選択と物化 |\n| 実行・待機・復旧 | agent/、runs/、worker/settings.py（job・lifecycle）、worker/runtime_wiring.py（実行依存の組立） | Segment/Attempt、lease、イベント、取消、結果不明時の扱い |\n| 実行履歴・詳細 | runs/query_repository.py | Project 範囲、ページング、元 Run の投影。状態更新は runs/repository.py に置く |\n| DB・Git・MCP 書込 | effects/、agent/*_provider.py、agent/*_source.py | 束縛、承認、競合、原操作の回執と回読。提案の証拠照合は effects/proposal_evidence.py、公開投影は effects/projections.py |\n| 文書・フォルダ・ごみ箱 | documents/、storage/、runs/ | 原入力、共有参照、復元と完全削除 |\n| 結果と評価 | agent/result_validation.py、evaluations/ | 元結果の不変性、参照検証、追記評価 |\n| 画面と対話 | web/src/pages、components、hooks、api、lib | 画面構成・要求ライフサイクル・純粋変換の分離、[UI ガイド](../design/workspace.md)、要求と応答の検証 |\n| 設定・移行・復元 | core/settings.py、backend/migrations、compose.yml | [配備](../operations/deployment.md)と[復元](../operations/backup-recovery.md) |"}, {"title": "変更規模の抑制", "level": "h2", "anchor": "変更規模の抑制", "text": "## 変更規模の抑制\n\n局所的なスタイル・文言・エラー診断は既存コンポーネントとサービスをそのまま使い、新たなフローを作らない。権限・永続化・公開プロトコルに関わる場合は凍結点、消費者、失敗/復旧、版互換を確認し、[契約変更手順](contract-workflow.md)に従って同期する。\n\n性能改善のために業務書込・承認・回読・結果検証を省略しない。実行速度の課題はまず[性能観測](../operations/run-performance.md)で計測根拠を確認する。"}, {"title": "検証と交付", "level": "h2", "anchor": "検証と交付", "text": "## 検証と交付\n\n[同期点](coding-rules.md#同期点)と[変更に応じた検証](local-development.md#変更に応じた検証)から回帰テストを選ぶ。単体通過・実 DB/ブラウザ/モデル検証・配備済み状態を区別し、失敗・skip・未実施を明記する。恒久規則は該当ガイド、機能状態は Roadmap を更新し、文書生成は[文書維持](documentation.md)に従う。"}], "toc": [{"title": "課題別のコード入口", "anchor": "課題別のコード入口", "level": "h2"}, {"title": "変更規模の抑制", "anchor": "変更規模の抑制", "level": "h2"}, {"title": "検証と交付", "anchor": "検証と交付", "level": "h2"}], "source": "development/change-guide.md", "checksum": "f38af7ae84165aa7e3dfc4e2e982eb0c3d38f06e2e8166fa1da40c9d74486128"}, {"id": "docs/development/runtime-guide.md", "title": "実行・データ保守ガイド", "group": "development", "html": "\u003ch1 id=\"実行データ保守ガイド\">実行・データ保守ガイド\u003c/h1>\n\u003cp>本ページは既存経路を保守する上で守るべき境界を定義する。詳細な項目・状態・実装はコードと \u003ca href=\"../SKM/contracts\">contracts\u003c/a> を正とし、能力の進捗は \u003ca href=\"#docs/planning/roadmap.md::\">Roadmap\u003c/a> を参照。\u003c/p>\n\u003ch2 id=\"認証と認可\">認証と認可\u003c/h2>\n\u003cul>\n\u003cli>入口は \u003ca href=\"../SKM/backend/src/skillmind/api/auth_dependencies.py\">actor dependency\u003c/a> を共用する。Cookie による変更要求は Origin/CSRF も検証し、明示 API Key header は原 Key を検証して重複・混用・無効時は即拒否する（Cookie へ fallback しない）。越権と不存在は同じ 404 を返し、アーカイブ済み Project は認可された読取のみを許可する。\u003c/li>\n\u003cli>API Key は作成者が属する Organization の ADMIN 資源権限を付与し（Key 単位の scope なし）、作成者が有効な ADMIN であり続ける必要がある。Key によって Project 状態・凍結権限・配備スイッチ・承認を迂回することはできない。\u003c/li>\n\u003cli>認証と業務コミットは別トランザクションとする。永続書込は \u003ca href=\"../SKM/backend/src/skillmind/users/access.py\">UserAccess\u003c/a> を通し、ロック待機後およびコミット前に現在の資格・メンバー・Project 状態を再検証する。バックグラウンド実行は永続化された起票者・承認・原 claim を再検証し、ブラウザセッションを偽装しない。\u003c/li>\n\u003cli>Run は権限上限を凍結し、後続の権限追加を旧 Run へ遡及させない一方、権限剥奪は即座に効力を持つ。資格停止・業務取消・ローカル接続切断は個別に扱い、リモートプロセスの終了を決めつけない。\u003c/li>\n\u003cli>Secret は \u003ca href=\"../SKM/backend/src/skillmind/integrations/secrets.py\">resolver\u003c/a> 経由でのみ制御下 Provider に渡し、Brief・ログ・Evidence・ワークスペースへ入れない。\u003ccode>ENVIRONMENT\u003c/code>/\u003ccode>FILE\u003c/code> は参照を保存し、\u003ccode>MANAGED\u003c/code> は Project と参照に束縛した\u003ca href=\"../SKM/backend/src/skillmind/core/secret_crypto.py\">暗号化実装\u003c/a>を使う（鍵欠落・改ざん・解決失敗はすべて拒否）。ローテーションと復元は \u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a> と\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E5%BE%A9%E5%85%83%E7%82%B9%E3%81%AE%E5%86%85%E5%AE%B9\">一致復元点\u003c/a>に従う。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"skill-と凍結原文\">Skill と凍結原文\u003c/h2>\n\u003cul>\n\u003cli>Skill は Organization 資産であり、公開後に Project が特定版を明示有効化する。\u003ca href=\"../SKM/backend/src/skillmind/skills/service.py\">SkillService\u003c/a> に従い取込・公開・有効化・参照検査を行い、公開済み内容の上書きや既存参照がある版の削除を行わない。\u003c/li>\n\u003cli>取込ディレクトリに複数の \u003ccode>SKILL.md\u003c/code> がある場合は画面（または API \u003ccode>/skill-imports/upload\u003c/code> の \u003ccode>entry_path\u003c/code>、CLI \u003ccode>--entry\u003c/code>）で解析対象を選択する。アップロードルート内の共有 Schema・参照のみを辿り、選択された Skill と依存ファイルを元パス・バイト列・ハッシュのまま保存する（ルート外参照や他 Skill の暗黙解析は行わない）。\u003c/li>\n\u003cli>新規取込は \u003ccode>skill-candidate/v3\u003c/code> の入力と資源選択のみを解析し、\u003ccode>skill-execution/v2\u003c/code> の単一実行タスクとして固定する。凍結原文一式を Brief に渡して Agent が実行する（入口は \u003ca href=\"../SKM/backend/src/skillmind/skills/direct_candidate.py\">direct_candidate\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/skills/execution.py\">execution\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/agent/task_brief.py\">task_brief\u003c/a>）。\u003ccode>documents\u003c/code> はテスト入力を凍結し、\u003ccode>resource\u003c/code> は接続/文書ライブラリを選択する（それ自体は読み書き権限ではない）。汎用ファイル・画像・変換・Schema ツールは常備され、外部ツールと操作は選択資源の全 scope/capability と配備上限で Run に固定する（Task 層でのツール allowlist や資源範囲の再縮小は行わない）。旧 Blueprint は原値を保持し、逆算や自動昇格を行わない。\u003c/li>\n\u003cli>\u003cstrong>四層分離と自然言語・Schema 駆動\u003c/strong>：①\u003cstrong>業務知識庫\u003c/strong>には対象システムの純粋な業務規則・画面・権限・データ関係・仕様書表記のみを置き、Skill 名・Agent・MCP 制約・工程指示を混在させない。②\u003cstrong>業務 Skill（\u003ccode>SKILL.md\u003c/code>）\u003cstrong>は特定プロジェクト・プラットフォーム内部 Tool ID・特定 MCP 実装と結合しない汎用手順として自然言語で記述し（知識索引からの段階的選択読取、環境資源の自律確立、大判一括読取、受控書込の \u003ccode>read_back\u003c/code> による原呼出し回執の記録確認と実状態に応じた続行判断、終了前の必須収尾と終端更新）、核心の入出力・引渡し構造は参照 JSON Schema で定義する。③\u003c/strong>外部 MCP / Runner\u003c/strong> は自身の Tool Schema・設定・構造化エラーで能力と制約を公開する。④\u003cstrong>プラットフォーム\u003c/strong>は汎用資源アクセスと安全境界を提供し、個別プロジェクトの専用表構造や業務分岐を内包しない。仕様や Skill の更新時は現在の正引き規則で直接記述し、廃止した旧方式への防御的禁止文や単発障害の個別パッチを積み重ねない。\u003c/li>\n\u003cli>出所・スクリプト・モデル提案は権限ではない。ツールは \u003ca href=\"../SKM/backend/src/skillmind/agent/tool_catalog.py\">catalog\u003c/a> で契約と Provider を配線し、\u003ca href=\"../SKM/backend/src/skillmind/agent/context_builder.py\">ContextBuilder\u003c/a> と \u003ca href=\"../SKM/backend/src/skillmind/agent/tool_policy.py\">ToolExecutionPolicy\u003c/a> で凍結束縛・スイッチ・権限を検証する。SDK builtin は拒否し、Shell/ネットワーク/ファイルは Gateway を迂回せず、実行スクリプトは公開 checksum を照合する。\u003c/li>\n\u003cli>非同期解釈は元要求・ソース hash・モデル設定・呼出事実を保持し（タイムアウトや結果不明時に ID を変えて再実行しない）、変更時は \u003ca href=\"../SKM/backend/src/skillmind/skills/request_service.py\">request_service\u003c/a> を確認する。Codex モデル情報は固定 CLI で検出し、選択モデルや思考強度が未取得の場合は専用ログインとプロキシで公式検出を実行し、失敗時は推測や自動縮退を行わず明示エラーとする。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"入力と文書\">入力と文書\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>スナップショットとワークスペース\u003c/strong>：Run は特定版・資源選択・文書 ID/hash・束縛を凍結する。実体化と再利用は \u003ca href=\"../SKM/backend/src/skillmind/agent/workspace_materializer.py\">workspace_materializer\u003c/a> と \u003ca href=\"../SKM/backend/src/skillmind/runs/input_snapshot.py\">input_snapshot\u003c/a> で原回執と入力ツリーを検証し、\u003ccode>input/\u003c/code> は読取専用、書込は \u003ccode>workspace/\u003c/code>・\u003ccode>output/\u003c/code> に限定する。能力の可用性は \u003ca href=\"../SKM/backend/src/skillmind/worker/settings.py\">Worker 配線\u003c/a> と凍結束縛に従う。\u003c/li>\n\u003cli>\u003cstrong>ツールエラー分類\u003c/strong>：引数不正は \u003ccode>invalid_request\u003c/code>（項目と制約・未実行である旨を示し、修正後の再送を許可）、越権は \u003ccode>scope_denied\u003c/code>、戻り値違反や未分類失敗は \u003ccode>unavailable\u003c/code> を返し、結果不明の外部操作は自動再送しない。\u003c/li>\n\u003cli>\u003cstrong>アップロード・同名更新・削除\u003c/strong>：アップロードは \u003ca href=\"../SKM/backend/src/skillmind/documents/service.py\">DocumentService\u003c/a> で原 actor/Project・冪等キー・内容回執を束縛する。画面でのファイル/フォルダ投入は同ディレクトリ同名ファイルを既定で上書き更新し（「ファイルを更新」メニューと同経路）、新版に新 ID を採番して旧版をごみ箱へ移し、原バイト・凍結参照・回執を保持する（クォータ対象も継続）。改名・移動は表示パスのみを変更し文書 ID を維持する。完全削除はごみ箱移動後に生成実行の終了と未決参照がないことを確認して行う（\u003ca href=\"../SKM/backend/src/skillmind/documents/reference_repository.py\">参照クエリ\u003c/a> は Run・Schedule・occurrence を網羅）。削除は同一トランザクションでオブジェクト清掃を登録した後に非同期で blob を消し、実行履歴の清掃は \u003ca href=\"../SKM/backend/src/skillmind/runs/history_purge.py\">history_purge\u003c/a> に従い共有成果物と最小削除監査を保持する。\u003c/li>\n\u003cli>\u003cstrong>Excel 変換（\u003ccode>excel-styles/v3\u003c/code>）\u003c/strong>：\u003ccode>.xlsx\u003c/code> 変換は元の行列・静的塗潰し色・全体/部分取消線を保持する。割当済みセル書式（無色・取消線解除を含む）を優先し、未割当セルは行→列→既定の順でフォールバックする。同一書式は連続範囲に統合し、結合セルは左上書式を参照して本文を重複出力しない。RGB/theme/indexed/tint の原値と解決結果を保持し（index 64/65 は \u003ccode>SYSTEM_FOREGROUND\u003c/code>/\u003ccode>SYSTEM_BACKGROUND\u003c/code>、範囲外や未知色は \u003ccode>UNRESOLVED\u003c/code>）、実在する表/範囲にのみ未評価の条件付き書式や表スタイルを注記し、旧 \u003ccode>.xls\u003c/code> は値のみ・スタイル未検査と明記する。スタイル profile は Evidence に記録し、Markdown 本文には重複出力しない。\u003c/li>\n\u003cli>\u003cstrong>文書読み書きと分割変換\u003c/strong>：\u003ccode>document.read/v1\u003c/code> は \u003ccode>response_mode=file\u003c/code> で本 Run ローカルファイルへの交付を優先する。新規 Run は現在 Project の文書ライブラリ全体の読取権限を持ち（都度現在ユーザーと Project 権限を再確認）、アップロード回執 ID/hash による直接読取に対応する。\u003ccode>document.convert_to_markdown/v1\u003c/code> も \u003ccode>response_mode=file\u003c/code> と \u003ccode>publish_artifact=true\u003c/code> を優先し、\u003ccode>workspace.read/v1\u003c/code> は \u003ccode>offset\u003c/code>・\u003ccode>max_chars\u003c/code>（既定 64,000、上限 200,000）・\u003ccode>expected_hash\u003c/code> による分割読取に対応し、ローカル欠落時は \u003ccode>artifact.materialize/v1\u003c/code> で検証済み原バイトから復元する。\u003c/li>\n\u003cli>\u003cstrong>ワークスペース編集とディレクトリ提案\u003c/strong>：\u003ccode>workspace.edit/v1\u003c/code> は原ハッシュに基づくコピー・追記・一意文字列置換・出力公開に対応し、\u003ccode>document.files/v1\u003c/code> は認可文書ライブラリ内のディレクトリ列挙と保存・改名・移動・空ディレクトリ作成/削除・ごみ箱移動/復元提案を準備する（実書込は共有 Effect と元版競合検証を通す）。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"資源ファイルと原生クライアント\">資源ファイルと原生クライアント\u003c/h2>\n\u003cp>ネットワークアクセスは Worker 内の共有クライアントが実行し、束縛・権限・回執を検証して資格情報をモデルに露出しない。要求は \u003ccode>request_file\u003c/code> + \u003ccode>expected_hash\u003c/code> に対応し、応答は \u003ccode>workspace/resources/\u003c/code> に保存する。\u003ccode>change.propose\u003c/code> は JSON ファイル提出とその内容ハッシュ束縛に対応する。8 KiB を超える確認済み Effect 回執はファイル参照として交付し（短い回執や保存失敗時は原値を返却）、同一回執は継続・復旧でも同一投影を保つ。\u003c/p>\n\u003cp>MCP・repository の応答を JSON ファイルで交付する場合も原観測の Evidence を使い、保存先・ファイルハッシュ・サイズをその metadata に保持する。ファイル交付だけを理由に別の Evidence は作成しない。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Git\u003c/strong>：\u003ccode>repository.workspace/v1\u003c/code> で認可 UTF-8 ファイルを編集可能ディレクトリに配置し、\u003ccode>prepare_commit\u003c/code> でローカルファイルハッシュから提案を準備し、コミット時も branch・パス・原 revision・read-back を検証する。\u003c/li>\n\u003cli>\u003cstrong>MCP\u003c/strong>：検出・凍結された原生パラメータ Schema を使い、読取はファイル入出力に対応し、書込は Effect・承認・原操作 ID を通す。\u003c/li>\n\u003cli>\u003cstrong>PostgreSQL\u003c/strong>：\u003ccode>database.query/v1\u003c/code> と \u003ccode>database.execute/v1\u003c/code> を使い、テーブル/列権限は DB アカウントに委ねる。単一 SELECT と承認後の INSERT/UPDATE/DELETE・JOIN/CTE・\u003ccode>$1\u003c/code> パラメータに対応する。原 DML を一度実行し、commit 確認後の命令状態と影響行数を返す。業務上の事前確認・前後スナップショット・結果照会は Agent が選び、外部回執表は不要。未送信または rollback 確認済みのエラーは修正可能な診断を返し、commit 応答喪失は結果不明のまま再送しない。\u003c/li>\n\u003cli>\u003cstrong>HTTP API\u003c/strong>：接続にはルート URL 一覧と認証 Secret のみを登録し、パス・メソッド・引数は登録された origin とルート配下で Skill/Agent が指定する。GET/HEAD 読取と承認後の POST/PUT/PATCH/DELETE に対応し、事前 GET や read-back は強制しない。原ステータスコード・許可ヘッダ・完全バイト列ファイルをそのまま Agent に渡す（自動リダイレクト禁止、タイムアウトや結果不明時の自動再送禁止）。\u003c/li>\n\u003cli>\u003cstrong>設定移行\u003c/strong>：\u003ccode>0059_native_resource_clients\u003c/code> で旧書込接続を SELECT/INSERT/UPDATE/DELETE へ、Redmine を HTTP へ変換し、\u003ccode>0062_http_resource_roots\u003c/code> で基底 URL をルート一覧へ統合して旧既定束縛を無効化する（旧 Run スナップショットは書き換えない）。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"画像と精密読取\">画像と精密読取\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>mcp.download/v1\u003c/code> は同一 Run・同一束縛の成功した MCP 読取 Evidence と原応答 JSON Pointer からダウンロード URL を解決し、同一 origin へのみ資格情報付き GET を送り（リダイレクト・別接続参照は禁止）、権限検証後に完全バイト列とハッシュを保存する。\u003c/li>\n\u003cli>\u003ccode>workspace.read/v1\u003c/code> の JSON モードは \u003ccode>pointers\u003c/code>（RFC 6901）と \u003ccode>expected_hash\u003c/code> で項目を精密読取する（欠落は \u003ccode>exists: false\u003c/code>、配列は既定 20 件/ページ・上限 200 件、元ファイル上限 16 MiB・結果上限 64 KiB、超過時は切り詰めず拒否）。\u003c/li>\n\u003cli>\u003ccode>workspace.image/v1\u003c/code> は Run 内パス・原ハッシュ・PNG/JPEG/WebP 実体（上限 8 MiB・2,500 万画素・単一フレーム）を検証してエンジンへ画像を渡し、SDK builtin \u003ccode>view_image\u003c/code> は禁止する。スクリーンショットとウィンドウ状態は Skill が照合し、クリックは確認済み MCP セレクタを使用する。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"実行と復旧\">実行と復旧\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/overview/architecture.md::\">システム構成と用語\u003c/a>に従い Run・Segment・Attempt を区別する（入口は \u003ca href=\"../SKM/backend/src/skillmind/worker/settings.py\">worker/settings\u003c/a> と \u003ca href=\"../SKM/backend/src/skillmind/worker/executor.py\">executor\u003c/a>）。同一段階の復旧は新 Attempt を作成し、原スナップショット・権限上限・Result は変更しない。\u003c/li>\n\u003cli>送信前に主体・冪等キー・入力・資源選択・承認同意を凍結し、\u003ca href=\"../SKM/backend/src/skillmind/runs/creation_request.py\">creation_request\u003c/a>・\u003ca href=\"../SKM/backend/src/skillmind/runs/creation_replay.py\">creation_replay\u003c/a>・Web \u003ca href=\"../SKM/web/src/lib/runSubmission.ts\">runSubmission\u003c/a> を共用する。通信断やタイムアウト時はまず原回執を確認し、再送は原キーと原内容を維持して遅延応答を隔離する。\u003c/li>\n\u003cli>取消はまず意図を永続化し、\u003ca href=\"../SKM/backend/src/skillmind/runs/repository.py\">RunRepository\u003c/a> がロック内で lease・取消・終端状態を検証し、ツール呼出は \u003ca href=\"../SKM/backend/src/skillmind/agent/evidence.py\">evidence\u003c/a> で実行権を再確認する。モデルセッション復旧は \u003ca href=\"../SKM/backend/src/skillmind/agent/session_store.py\">session_store\u003c/a> の原記録を読み、根拠欠落時は停止する。\u003c/li>\n\u003cli>定期実行（\u003ca href=\"../SKM/backend/src/skillmind/schedules/service.py\">schedules/service\u003c/a>）は既定で自動承認を有効にし、汎用・Git・MCP の同意を発火時の原 occurrence 要求に固定した上で、実行時に作成者の現在の Project・資源権限を再検証する。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"外部効果\">外部効果\u003c/h2>\n\u003cul>\n\u003cli>外部書込は observe → propose → approve → apply に従う。モデル向け説明は各 Effect request Schema の \u003ccode>description\u003c/code> から供給し、文書と Git は提案準備ツールを優先利用する。\u003c/li>\n\u003cli>承認は特定 Proposal の version/checksum・Provider・操作・scope に束縛し、\u003ca href=\"../SKM/backend/src/skillmind/effects/service.py\">EffectService\u003c/a> が業務ロック外でリモート I/O を実行する。自動承認は原 Run 開始時に記録された同意または既存の事前認可に限定する（\u003ccode>repository.write/v1\u003c/code> は Project 事前認可と force を禁止）。\u003c/li>\n\u003cli>実効能力は \u003ca href=\"../SKM/backend/src/skillmind/effects/release.py\">ExecutionFeatures\u003c/a> と \u003ca href=\"../SKM/backend/src/skillmind/effects/wiring.py\">Provider registry\u003c/a> のスイッチ双方で制限する。MCP 提案は同一 Run/接続/束縛のツールカタログ証拠を自動関連付けして checksum に含める。\u003c/li>\n\u003cli>MCP の回読は原呼出しの確定した回執を確認し、業務成功・全件完了とは分離する。状態条件は工具契約に示された失敗を含む終端集合と、呼出し終了・続行可能と明示された部分完了を使う。Agent は回執を評価し、続行が必要なら同じ原 ID・対象集合を使う別の受控提案を行う。進行中・結果不明を完了扱いせず、承認済み条件も実行後に緩和しない。送信前検証は出力 Schema と比較値の整合を確認し、enum から終端性を推測しない。応答受信の診断事実は後続の読取専用 attempt に引き継ぐ。\u003c/li>\n\u003cli>書込結果が不明な場合は主フローを停止して原 Effect を保持し、\u003ca href=\"../SKM/backend/src/skillmind/effects/reconciliation_service.py\">reconciliation_service\u003c/a> で読取照合を行う。MCP の read-back 再試行（\u003ca href=\"../SKM/backend/src/skillmind/effects/mcp_provider.py\">mcp_provider\u003c/a>）は変更操作を決して再送しない。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"結果と評価\">結果と評価\u003c/h2>\n\u003cul>\n\u003cli>技術的終端状態・結果の完全性・業務 PASS/FAIL は分けて表現する。\u003ca href=\"../SKM/backend/src/skillmind/agent/result_validation.py\">ResultValidator\u003c/a> が凍結 Schema・参照帰属・添付バイト・保存済み Effect 事実を検証する。\u003c/li>\n\u003cli>新規 Run は\u003ca href=\"../SKM/contracts/outcomes/model/v1.schema.json\">モデル結果契約\u003c/a>を task snapshot に固定する。モデルは業務内容とツールの \u003ccode>result_references\u003c/code> にある短参照だけを返し、\u003ca href=\"../SKM/backend/src/skillmind/agent/model_result.py\">組立処理\u003c/a>が原 Evidence/Artifact ID、提案一覧、保存済み操作状態と回執から従来の OutcomeEnvelope を構成する。発見事項の根拠はモデルが選択し、全証拠を一括で根拠にしない。短参照は原 ID から安定生成し、欠落・衝突・別種を拒否する。主実行と続行で同じ参照を使い、子は自身の Session の観測だけを解決する。組立後も全提案の未完了、帰属、原回執と Artifact 実体の検証を省略せず、保存形式・業務ファイル・外部操作は変更しない。\u003c/li>\n\u003cli>Result/Evidence/Artifact は不変とし、人手修正は \u003ca href=\"../SKM/backend/src/skillmind/evaluations/service.py\">Evaluation\u003c/a> を追記して原結果を上書きしない。\u003c/li>\n\u003cli>\u003ccode>audit.export/v1\u003c/code>（\u003ca href=\"../SKM/backend/src/skillmind/agent/audit_export.py\">audit_export\u003c/a>）は保存済み事実のみを出力し、\u003ccode>artifact.append/v1\u003c/code> は原バイト検証後に短文を追記して新 Artifact 参照を公開する（元の監査参照は不変）。表示規則は \u003ca href=\"#docs/design/workspace.md::%E3%83%AC%E3%83%9D%E3%83%BC%E3%83%88%E3%81%A8%E3%83%97%E3%83%AC%E3%83%93%E3%83%A5%E3%83%BC\">UI ガイド\u003c/a>を参照。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"後置能力\">後置能力\u003c/h2>\n\u003cp>未接続または要否判断待ちの能力は日常タスクの前提としない。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>範囲\u003c/th>\n\u003cth>現在の保守境界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Run 共通予算\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/worker/primary_budget.py\">primary_budget\u003c/a> は本番 coordinator 未接続。Codex 起動前にドル上限を拒否し、将来接続時は親子共有・課金前確保・費用不明時の返還なしを守る\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子 Agent\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/agent/subagent_provider.py\">Provider\u003c/a> は部分実装。権限は \u003ca href=\"../SKM/backend/src/skillmind/agent/subagent.py\">resolve_subagent_capabilities\u003c/a> で絞り込み、書込・対話・再帰 dispatch を禁止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成 UI\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/contracts/runtime-manifest/v1alpha1.schema.json\">Manifest\u003c/a> は \u003ccode>frontend_module\u003c/code> を引き続き禁止。将来開放時は CSP \u003ccode>sandbox allow-scripts\u003c/code> と iframe の \u003ccode>allow-same-origin\u003c/code> 禁止を検証する\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部書込シーケンス\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/tests/worker/test_receipt_sequence_experiment.py\">局所実験\u003c/a> は本番未接続。同一 job の SDK 再利用と読取専用短列では一括外部書込を行わない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>その他拡張\u003c/td>\n\u003ctd>Task Flow は読取専用プレビュー。完全オーケストレーション・SVN 書込・PR 自動作成・広範な Shell/network は実需要に応じて評価\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"限定ツール列とウォーム継続\">限定ツール列とウォーム継続\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>agent/tool_sequence.py\u003c/code> は元の \u003ccode>ToolGateway\u003c/code> を通じて \u003ccode>sequence_safe\u003c/code> と明示されたローカル/読取専用サブツール 1〜5 個（原 Run の凍結集合内）を順次実行し、取消伝播に対応し外部書込と制御ツールを禁止する。\u003c/li>\n\u003cli>\u003ccode>agent/warm_codex.py\u003c/code> は同一 Worker job の原 Run 内でのみ Codex プロセスを再利用し（Run 間で権限やセッションを共有しない）、原 Run ロック内で隣接 Segment・原 Effect・自動承認を検証して新 Attempt を作成する。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"自動承認操作の直接回執\">自動承認操作の直接回執\u003c/h2>\n\u003cp>\u003ccode>SKILLMIND_INLINE_EFFECTS_ENABLED\u003c/code> は既定で無効（migration \u003ccode>0056_inline_effect_owner\u003c/code> に依存し、Codex かつ Attempt 残り時間が十分な自動承認操作にのみ適用。Claude や他条件は従来の延期経路を通る）。\u003ccode>change.propose/v1\u003c/code> は原 SDK 呼出 ID から冪等キーを生成して既定管理項目を補完し、有効時は原 Attempt を \u003ccode>RUNNING\u003c/code> のまま \u003ccode>ApprovedEffectExecutor\u003c/code> で claim・コミットして原回執を当該ツール結果として直接返す。失敗・取消・応答不明時は即座に当該 turn を停止して従来の Effect 待機/照合フローへ戻し、重複する書込操作を決して新規作成しない。\u003c/p>\n\u003ch2 id=\"同一タスクの同種複数資源\">同一タスクの同種複数資源\u003c/h2>\n\u003cp>Run は Skill の資源スロットに従い同種の複数接続を束縛できる。\u003ccode>database.*\u003c/code>・\u003ccode>mcp.*\u003c/code>・\u003ccode>repository.read\u003c/code>・\u003ccode>issue.read\u003c/code>・\u003ccode>tool.sequence\u003c/code> のサブ呼出および \u003ccode>change.propose\u003c/code> は最上位の \u003ccode>resource_key\u003c/code> で凍結済みスロットを選択する（複数束縛時は必須、単一束縛時は省略可。URL/ID の直接指定やテーブル名からの推測は不可）。SDK は能力ごとに 1 つのツール定義のみを公開して選択可能な key を列挙し、内部では \u003ccode>(capability, resource_key)\u003c/code> ごとに独立して認可・ルーティング・監査を行い、最上位 selector を除いた業務引数を Provider に渡す。\u003c/p>\n", "sections": [{"title": "実行・データ保守ガイド", "level": "h1", "anchor": "実行データ保守ガイド", "text": "# 実行・データ保守ガイド\n\n本ページは既存経路を保守する上で守るべき境界を定義する。詳細な項目・状態・実装はコードと [contracts](../../SKM/contracts/) を正とし、能力の進捗は [Roadmap](../planning/roadmap.md) を参照。"}, {"title": "認証と認可", "level": "h2", "anchor": "認証と認可", "text": "## 認証と認可\n\n- 入口は [actor dependency](../../SKM/backend/src/skillmind/api/auth_dependencies.py) を共用する。Cookie による変更要求は Origin/CSRF も検証し、明示 API Key header は原 Key を検証して重複・混用・無効時は即拒否する（Cookie へ fallback しない）。越権と不存在は同じ 404 を返し、アーカイブ済み Project は認可された読取のみを許可する。\n- API Key は作成者が属する Organization の ADMIN 資源権限を付与し（Key 単位の scope なし）、作成者が有効な ADMIN であり続ける必要がある。Key によって Project 状態・凍結権限・配備スイッチ・承認を迂回することはできない。\n- 認証と業務コミットは別トランザクションとする。永続書込は [UserAccess](../../SKM/backend/src/skillmind/users/access.py) を通し、ロック待機後およびコミット前に現在の資格・メンバー・Project 状態を再検証する。バックグラウンド実行は永続化された起票者・承認・原 claim を再検証し、ブラウザセッションを偽装しない。\n- Run は権限上限を凍結し、後続の権限追加を旧 Run へ遡及させない一方、権限剥奪は即座に効力を持つ。資格停止・業務取消・ローカル接続切断は個別に扱い、リモートプロセスの終了を決めつけない。\n- Secret は [resolver](../../SKM/backend/src/skillmind/integrations/secrets.py) 経由でのみ制御下 Provider に渡し、Brief・ログ・Evidence・ワークスペースへ入れない。`ENVIRONMENT`/`FILE` は参照を保存し、`MANAGED` は Project と参照に束縛した[暗号化実装](../../SKM/backend/src/skillmind/core/secret_crypto.py)を使う（鍵欠落・改ざん・解決失敗はすべて拒否）。ローテーションと復元は [Runbook](../operations/runbook.md) と[一致復元点](../operations/backup-recovery.md#一致復元点の内容)に従う。"}, {"title": "Skill と凍結原文", "level": "h2", "anchor": "skill-と凍結原文", "text": "## Skill と凍結原文\n\n- Skill は Organization 資産であり、公開後に Project が特定版を明示有効化する。[SkillService](../../SKM/backend/src/skillmind/skills/service.py) に従い取込・公開・有効化・参照検査を行い、公開済み内容の上書きや既存参照がある版の削除を行わない。\n- 取込ディレクトリに複数の `SKILL.md` がある場合は画面（または API `/skill-imports/upload` の `entry_path`、CLI `--entry`）で解析対象を選択する。アップロードルート内の共有 Schema・参照のみを辿り、選択された Skill と依存ファイルを元パス・バイト列・ハッシュのまま保存する（ルート外参照や他 Skill の暗黙解析は行わない）。\n- 新規取込は `skill-candidate/v3` の入力と資源選択のみを解析し、`skill-execution/v2` の単一実行タスクとして固定する。凍結原文一式を Brief に渡して Agent が実行する（入口は [direct_candidate](../../SKM/backend/src/skillmind/skills/direct_candidate.py)、[execution](../../SKM/backend/src/skillmind/skills/execution.py)、[task_brief](../../SKM/backend/src/skillmind/agent/task_brief.py)）。`documents` はテスト入力を凍結し、`resource` は接続/文書ライブラリを選択する（それ自体は読み書き権限ではない）。汎用ファイル・画像・変換・Schema ツールは常備され、外部ツールと操作は選択資源の全 scope/capability と配備上限で Run に固定する（Task 層でのツール allowlist や資源範囲の再縮小は行わない）。旧 Blueprint は原値を保持し、逆算や自動昇格を行わない。\n- **四層分離と自然言語・Schema 駆動**：①**業務知識庫**には対象システムの純粋な業務規則・画面・権限・データ関係・仕様書表記のみを置き、Skill 名・Agent・MCP 制約・工程指示を混在させない。②**業務 Skill（`SKILL.md`）**は特定プロジェクト・プラットフォーム内部 Tool ID・特定 MCP 実装と結合しない汎用手順として自然言語で記述し（知識索引からの段階的選択読取、環境資源の自律確立、大判一括読取、受控書込の `read_back` による原呼出し回執の記録確認と実状態に応じた続行判断、終了前の必須収尾と終端更新）、核心の入出力・引渡し構造は参照 JSON Schema で定義する。③**外部 MCP / Runner** は自身の Tool Schema・設定・構造化エラーで能力と制約を公開する。④**プラットフォーム**は汎用資源アクセスと安全境界を提供し、個別プロジェクトの専用表構造や業務分岐を内包しない。仕様や Skill の更新時は現在の正引き規則で直接記述し、廃止した旧方式への防御的禁止文や単発障害の個別パッチを積み重ねない。\n- 出所・スクリプト・モデル提案は権限ではない。ツールは [catalog](../../SKM/backend/src/skillmind/agent/tool_catalog.py) で契約と Provider を配線し、[ContextBuilder](../../SKM/backend/src/skillmind/agent/context_builder.py) と [ToolExecutionPolicy](../../SKM/backend/src/skillmind/agent/tool_policy.py) で凍結束縛・スイッチ・権限を検証する。SDK builtin は拒否し、Shell/ネットワーク/ファイルは Gateway を迂回せず、実行スクリプトは公開 checksum を照合する。\n- 非同期解釈は元要求・ソース hash・モデル設定・呼出事実を保持し（タイムアウトや結果不明時に ID を変えて再実行しない）、変更時は [request_service](../../SKM/backend/src/skillmind/skills/request_service.py) を確認する。Codex モデル情報は固定 CLI で検出し、選択モデルや思考強度が未取得の場合は専用ログインとプロキシで公式検出を実行し、失敗時は推測や自動縮退を行わず明示エラーとする。"}, {"title": "入力と文書", "level": "h2", "anchor": "入力と文書", "text": "## 入力と文書\n\n- **スナップショットとワークスペース**：Run は特定版・資源選択・文書 ID/hash・束縛を凍結する。実体化と再利用は [workspace_materializer](../../SKM/backend/src/skillmind/agent/workspace_materializer.py) と [input_snapshot](../../SKM/backend/src/skillmind/runs/input_snapshot.py) で原回執と入力ツリーを検証し、`input/` は読取専用、書込は `workspace/`・`output/` に限定する。能力の可用性は [Worker 配線](../../SKM/backend/src/skillmind/worker/settings.py) と凍結束縛に従う。\n- **ツールエラー分類**：引数不正は `invalid_request`（項目と制約・未実行である旨を示し、修正後の再送を許可）、越権は `scope_denied`、戻り値違反や未分類失敗は `unavailable` を返し、結果不明の外部操作は自動再送しない。\n- **アップロード・同名更新・削除**：アップロードは [DocumentService](../../SKM/backend/src/skillmind/documents/service.py) で原 actor/Project・冪等キー・内容回執を束縛する。画面でのファイル/フォルダ投入は同ディレクトリ同名ファイルを既定で上書き更新し（「ファイルを更新」メニューと同経路）、新版に新 ID を採番して旧版をごみ箱へ移し、原バイト・凍結参照・回執を保持する（クォータ対象も継続）。改名・移動は表示パスのみを変更し文書 ID を維持する。完全削除はごみ箱移動後に生成実行の終了と未決参照がないことを確認して行う（[参照クエリ](../../SKM/backend/src/skillmind/documents/reference_repository.py) は Run・Schedule・occurrence を網羅）。削除は同一トランザクションでオブジェクト清掃を登録した後に非同期で blob を消し、実行履歴の清掃は [history_purge](../../SKM/backend/src/skillmind/runs/history_purge.py) に従い共有成果物と最小削除監査を保持する。\n- **Excel 変換（`excel-styles/v3`）**：`.xlsx` 変換は元の行列・静的塗潰し色・全体/部分取消線を保持する。割当済みセル書式（無色・取消線解除を含む）を優先し、未割当セルは行→列→既定の順でフォールバックする。同一書式は連続範囲に統合し、結合セルは左上書式を参照して本文を重複出力しない。RGB/theme/indexed/tint の原値と解決結果を保持し（index 64/65 は `SYSTEM_FOREGROUND`/`SYSTEM_BACKGROUND`、範囲外や未知色は `UNRESOLVED`）、実在する表/範囲にのみ未評価の条件付き書式や表スタイルを注記し、旧 `.xls` は値のみ・スタイル未検査と明記する。スタイル profile は Evidence に記録し、Markdown 本文には重複出力しない。\n- **文書読み書きと分割変換**：`document.read/v1` は `response_mode=file` で本 Run ローカルファイルへの交付を優先する。新規 Run は現在 Project の文書ライブラリ全体の読取権限を持ち（都度現在ユーザ
