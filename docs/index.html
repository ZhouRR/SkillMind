=\"backend\">Backend\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind\">backend/src/projectmind\u003c/a> は API と Worker の共有 package。\nroute は認証・入出力、service は業務調整、repository は永続化、AgentEngine/Provider は実行境界を担当する。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>コード入口\u003c/th>\n\u003cth>対応する設計\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/api\">api\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/auth\">auth\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/users\">users\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/authentication.md::\">認証\u003c/a> / \u003ca href=\"#docs/design/login-protection.md::\">ログイン防護\u003c/a> / \u003ca href=\"#docs/design/user-lifecycle.md::\">ユーザー\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/projects\">projects\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/documents\">documents\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/storage\">storage\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/project-lifecycle.md::\">Project\u003c/a> / \u003ca href=\"#docs/design/document-lifecycle.md::\">文書資産\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/skills\">skills\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/compositions\">compositions\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/skill-contract.md::\">Skill 契約\u003c/a> / \u003ca href=\"#docs/design/skill-interpretation.md::\">解釈\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/runs\">runs\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/worker\">worker\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/run-creation.md::\">Run 作成\u003c/a> / \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a> / \u003ca href=\"#docs/design/run-supervision.md::\">停止\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/agent\">agent\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/integrations\">integrations\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/resource-snapshots.md::\">資源快照\u003c/a> / \u003ca href=\"#docs/design/secret-storage.md::\">Secret\u003c/a> / \u003ca href=\"#docs/design/run-budgets.md::\">予算\u003c/a> / \u003ca href=\"#docs/design/subagents.md::\">子分析\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/evaluations\">evaluations\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/effects\">effects\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/schedules\">schedules\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/user-interactions.md::\">回答\u003c/a> / \u003ca href=\"#docs/design/results-evaluation.md::\">結果と評価\u003c/a> / \u003ca href=\"#docs/design/repository-effects.md::\">外部変更\u003c/a> / \u003ca href=\"#docs/design/task-scheduling.md::\">調度\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/modules\">modules\u003c/a>・\u003ca href=\"../PJM/backend/src/projectmind/db\">db\u003c/a>・\u003ca href=\"../PJM/backend/migrations\">migrations\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/generated-modules.md::\">生成表示\u003c/a> / \u003ca href=\"#docs/design/domain-model.md::\">データモデル\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"#docs/development/local-development.md::backend\">環境構築\u003c/a>後、\u003ccode>PJM/backend/\u003c/code> でそれぞれ別 process として起動する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m uvicorn projectmind.api.main:app --reload --port 8000\narq projectmind.worker.settings.WorkerSettings\n\u003c/code>\u003c/pre>\n\u003cp>検証は Ruff・Mypy・\u003ca href=\"../PJM/backend/tests\">tests\u003c/a> の Pytest。\u003ca href=\"#docs/development/local-development.md::%E5%AE%9F-postgresql-%E3%81%AE%E5%89%8D%E6%8F%90\">実 PostgreSQL の前提\u003c/a>を先に読む。\n全件実行には専用 DB の作成・強制削除を伴う test があり、skip は成功ではない。\n\u003ca href=\"../PJM/backend/src/projectmind/ops\">ops\u003c/a> の preflight は DB head/Redis の確認のみ。smoke は Run/Evaluation を作り、rotation は暗号文を更新する。\u003c/p>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/web/src\">web/src\u003c/a> は React + TypeScript の画面。Task Center は実行対象の選択、Workspace は一つの Run の観察を担当する。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>コード入口\u003c/th>\n\u003cth>責務・設計\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/web/src/pages\">pages\u003c/a>・\u003ca href=\"../PJM/web/src/components\">components\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a> / \u003ca href=\"#docs/design/project-lifecycle.md::\">Project\u003c/a> / \u003ca href=\"#docs/design/document-lifecycle.md::\">文書管理\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/web/src/api\">api\u003c/a>\u003c/td>\n\u003ctd>資源別 client と validator。画面は index.ts、HTTP は http.ts を経由する\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/web/src/lib\">lib\u003c/a>・\u003ca href=\"../PJM/web/src/hooks\">hooks\u003c/a>\u003c/td>\n\u003ctd>routing・SSE・入力草稿 / 非同期処理と cleanup。即時実行と調度は taskDraft / TaskLaunchFields を共有する\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/web/src/lib/i18n\">i18n\u003c/a>・\u003ca href=\"../PJM/web/src/styles\">styles\u003c/a>・\u003ca href=\"../PJM/web/src/assets\">assets\u003c/a>\u003c/td>\n\u003ctd>zh/ja/en、responsive layout、自己保持 font\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>起動は \u003ccode>PJM/web/\u003c/code> で \u003ccode>npx -y pnpm@11.7.0 dev\u003c/code>。依存導入・proxy と typecheck/Vitest/build は\u003ca href=\"#docs/development/local-development.md::web\">開発手順\u003c/a>へ。\n実 component の応答喪失・切替・三語・keyboard・狭幅は同手順の browser 回帰で確認し、mock と実 Server の検証を分ける。\n\u003ca href=\"#docs/design/user-lifecycle.md::\">アカウントと安全\u003c/a>は平台の \u003ccode>#/accounts\u003c/code>。Project 未所属でも本人安全を操作でき、ADMIN は組織ユーザーを管理する。\n\u003ca href=\"#docs/design/project-lifecycle.md::%E6%88%90%E5%91%98%E7%AE%A1%E7%90%86%E9%A1%B5%E9%9D%A2\">Project の成員管理\u003c/a>は \u003ccode>#/projects\u003c/code> の ADMIN 用 tab。会話・対象の隔離と未知結果の門禁はアカウント画面と共通 request hook を使う。\n\u003ca href=\"#docs/design/generated-modules.md::\">生成 Host\u003c/a>、\u003ca href=\"#docs/design/task-flow.md::\">Task Flow\u003c/a>等の未接続部分は設計と計画から確認する。\n\u003ca href=\"#docs/development/change-guide.md::\">変更別の入口\u003c/a>から対象の設計・API・回帰へ進む。\u003c/p>\n\u003ch2 id=\"contracts\">Contracts\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/contracts\">contracts\u003c/a> は versioned JSON Schema・example・OpenAPI の置場。権限・凍結・再送の意味は設計に置く。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>配置\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/contracts/runs\">runs\u003c/a> / \u003ca href=\"../PJM/contracts/users/v1\">users\u003c/a> / \u003ca href=\"../PJM/contracts/projects\">projects\u003c/a> / \u003ca href=\"../PJM/contracts/events\">events\u003c/a> / \u003ca href=\"../PJM/contracts/errors\">errors\u003c/a>\u003c/td>\n\u003ctd>公開 API・RunEvent・Problem の Schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/contracts/tools\">tools\u003c/a>\u003c/td>\n\u003ctd>versioned Tool capability の request / response / error\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>agent-task-brief / capability-blueprint / runtime-manifest / outcomes / view-spec\u003c/td>\n\u003ctd>業務固有 field を持たない共有契約\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/contracts/examples\">examples\u003c/a>・\u003ca href=\"../PJM/contracts/fixtures\">fixtures\u003c/a>\u003c/td>\n\u003ctd>代表値 / offline 回帰入力。実 account や自動 seed ではない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/contracts/openapi/projectmind-api.v1.json\">OpenAPI snapshot\u003c/a>\u003c/td>\n\u003ctd>FastAPI から生成する公開面。手編集しない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>変更時は\u003ca href=\"#docs/development/contract-workflow.md::\">契約変更手順\u003c/a>に従い、DTO・Web validator・テスト・互換性を同期する。\nexample は scripts/validate_contracts.py と backend/tests/contracts/test_contracts.py の両表へ登録する。\nSchema 通過は Runtime の実装・公開済み・実環境の受入を保証しない。未接続の公開面も計画で確認する。\n\u003ca href=\"#docs/development/change-guide.md::\">変更別の入口\u003c/a>で、今回影響する消費側を選ぶ。\u003c/p>\n\u003ch2 id=\"scripts\">Scripts\u003c/h2>\n\u003cp>以下は \u003ccode>PJM/\u003c/code> で実行する。文書の依存・生成元・browser 検証は\u003ca href=\"#docs/development/documentation.md::\">文書管理\u003c/a>へ。\n公開面を調べる場合は\u003ca href=\"#docs/development/contract-workflow.md::\">契約変更手順\u003c/a>から読取確認と生成操作を区別する。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>コマンド / 入口\u003c/th>\n\u003cth>用途と副作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>python3 scripts/validate_contracts.py\u003c/code>\u003c/td>\n\u003ctd>Schema / example の読取検査\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>python3 scripts/validate_compose.py\u003c/code>\u003c/td>\n\u003ctd>Compose 構造の読取検査。実起動ではない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/scripts/compose.py\">compose.py\u003c/a> / \u003ca href=\"../PJM/scripts/deploy.py\">deploy.py\u003c/a>\u003c/td>\n\u003ctd>同一設定源 / identity を固定した分段配備。対象と承認は\u003ca href=\"#docs/operations/deployment.md::\">配備手順\u003c/a>を参照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PYTHONPATH=backend/src python3 scripts/probe_claude_agent_sdk.py\u003c/code>\u003c/td>\n\u003ctd>offline SDK 契約確認。実モデルを呼ばない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>python3 scripts/build_docs.py --check\u003c/code>\u003c/td>\n\u003ctd>文書リンクと生成物の一致を検査\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>python3 scripts/build_docs.py\u003c/code>\u003c/td>\n\u003ctd>Markdown と docs-viewer.html から docs/index.html を上書き生成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>python3 -m unittest discover -s scripts/tests -v\u003c/code>\u003c/td>\n\u003ctd>文書・配備工具の一時 fixture / fake command 回帰。実 Docker は使わない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>python3 scripts/check_docs_browser.py\u003c/code>\u003c/td>\n\u003ctd>offline Chromium 検査。--output 指定時だけ screenshot を上書き保存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>python3 scripts/export_openapi.py\u003c/code>\u003c/td>\n\u003ctd>公開 API 変更時に snapshot を上書き。読むだけなら実行しない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/scripts/measure_skill_interpretations.py\">measure_skill_interpretations.py\u003c/a>\u003c/td>\n\u003ctd>実モデル呼出し・課金を伴う品質測定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/scripts/export-images.ps1\">export-images.ps1\u003c/a>\u003c/td>\n\u003ctd>既存 local image の export。\u003ca href=\"#PJM/README.md::images\">Images\u003c/a> の注意を参照\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"skills\">Skills\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/skills\">skills\u003c/a> は実行に影響する source package。各 package の SKILL.md を入口とし、文書整理では移動・書換えない。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Package\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>pjm-project-dev\u003c/td>\n\u003ctd>本プロジェクトの開発 workflow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>projectmind-skill-interpreter\u003c/td>\n\u003ctd>versioned system Skill。入力 source を実行せず候補契約を生成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>examples\u003c/td>\n\u003ctd>repository、情報不足、危険 Tool/credential の回帰入力\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>package の配置は import・公開・Project 有効化ではない。source script の存在も実行許可を与えない。\n\u003ca href=\"#docs/design/skill-contract.md::\">公開規則\u003c/a>に従い、実 credential や評価用の正解データを package に含めない。\u003c/p>\n\u003ch2 id=\"images\">Images\u003c/h2>\n\u003cp>\u003ccode>images/projectmind-images.tar\u003c/code> は配備 image の生成物であり、DB・blob・workspace・KEK の backup ではない。\n操作は\u003ca href=\"#docs/operations/quickstart.md::image-%E7%A7%BB%E9%80%81%E3%81%A8%E6%9B%B4%E6%96%B0\">image 移送\u003c/a>、復旧は\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E6%81%A2%E5%A4%8D%E7%82%B9%E5%8C%85%E5%90%AB%E4%BB%80%E4%B9%88\">同一復元点\u003c/a>を確認する。\u003c/p>\n\u003cul>\n\u003cli>export は build/pull しない。application image 不足は失敗、第三者 image 不足は警告して除外される。\u003c/li>\n\u003cli>実 image ID と必要 image を確認し、送受信の checksum を比較する。checksum だけでは配布元の真正性は証明できない。\u003c/li>\n\u003cli>既存 tar は既定で上書きしない。ArchiveName で版を分け、-Force で唯一の回退用 archive を失わない。\u003c/li>\n\u003cli>export は一時 tar が成功してから公開し、失敗時は旧成品を保持する。deploy-load も旧 image を削除せず、途中失敗時に自動復旧・後続起動しない。\u003c/li>\n\u003cli>DB の復元を外部 write の取消と扱わない。Secret や archive を文書ブラウザへ埋め込まない。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "ProjectMind", "level": "h1", "anchor": "projectmind", "text": "# ProjectMind\n\nSkill を Project のタスクとして実行し、根拠・結果・人工評価・外部変更の承認を記録する AI Agent プラットフォーム。\nこの README はコードと操作の入口。設計本文は `../docs/`、変更規約は [AGENTS.md](AGENTS.md) に集約する。\n\n[文書ブラウザ](../docs/index.html) · [文書ガイド](../docs/README.md) · [現在の計画](../docs/planning/roadmap.md#当前执行状态)"}, {"title": "はじめに", "level": "h2", "anchor": "はじめに", "text": "## はじめに\n\n| 目的 | 読む場所 |\n| --- | --- |\n| 全体を理解する | [製品概要](../docs/overview/product.md) / [システム構成](../docs/overview/architecture.md) |\n| 開発を始める | [環境構築・検証](../docs/development/local-development.md) / [変更ガイド](../docs/development/change-guide.md) |\n| 起動・更新・復旧する | [初回起動](../docs/operations/quickstart.md) / [公開・移行](../docs/operations/deployment.md) / [復元](../docs/operations/backup-recovery.md) |\n| API を扱う | [利用ガイド](../docs/development/api-usage.md) / [契約変更](../docs/development/contract-workflow.md) |\n| 設計・障害を調べる | [設計の責任分担](../docs/design/README.md) / [Runbook](../docs/operations/runbook.md#按问题找入口) |\n\nコードは [Backend](#backend)・[Web](#web)・[Contracts](#contracts)・[Scripts](#scripts)・[Skills](#skills)・[Images](#images) に分ける。\n実装の不足と検証範囲は上記の計画を正本とする。"}, {"title": "実行前の注意", "level": "h2", "anchor": "実行前の注意", "text": "## 実行前の注意\n\n- Python 3.12、Node.js 26 / pnpm 11.7.0 を使う。DB・Redis・object storage と接続設定は別途必要。\n- Compose は既存の共有 Traefik を使い、host port を公開しない。`make run` は配備検査後に API/Web だけを起動する。\n- dispatch=false は既存 job・cron を止めない。[保守時の停止範囲](../docs/operations/deployment.md#一个例子关闭-dispatch-后仍有工作)を確認する。\n- 通常の初期 ADMIN 作成は `python -m projectmind.ops.bootstrap_admin`。`make bootstrap-admin` は全 volume を消す。\n- [共通設定入口](../docs/operations/deployment.md#环境文件与配置边界)で ENV_FILE と Compose project を明示する。配備は load/migrate/api/worker の独立段階で、宿主にも Python 3.12 が必要。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\n[backend/src/projectmind](backend/src/projectmind/) は API と Worker の共有 package。\nroute は認証・入出力、service は業務調整、repository は永続化、AgentEngine/Provider は実行境界を担当する。\n\n| コード入口 | 対応する設計 |\n| --- | --- |\n| [api](backend/src/projectmind/api/)・[auth](backend/src/projectmind/auth/)・[users](backend/src/projectmind/users/) | [認証](../docs/design/authentication.md) / [ログイン防護](../docs/design/login-protection.md) / [ユーザー](../docs/design/user-lifecycle.md) |\n| [projects](backend/src/projectmind/projects/)・[documents](backend/src/projectmind/documents/)・[storage](backend/src/projectmind/storage/) | [Project](../docs/design/project-lifecycle.md) / [文書資産](../docs/design/document-lifecycle.md) |\n| [skills](backend/src/projectmind/skills/)・[compositions](backend/src/projectmind/compositions/) | [Skill 契約](../docs/design/skill-contract.md) / [解釈](../docs/design/skill-interpretation.md) |\n| [runs](backend/src/projectmind/runs/)・[worker](backend/src/projectmind/worker/) | [Run 作成](../docs/design/run-creation.md) / [Runtime](../docs/design/agent-runtime.md) / [停止](../docs/design/run-supervision.md) |\n| [agent](backend/src/projectmind/agent/)・[integrations](backend/src/projectmind/integrations/) | [資源快照](../docs/design/resource-snapshots.md) / [Secret](../docs/design/secret-storage.md) / [予算](../docs/design/run-budgets.md) / [子分析](../docs/design/subagents.md) |\n| [evaluations](backend/src/projectmind/evaluations/)・[effects](backend/src/projectmind/effects/)・[schedules](backend/src/projectmind/schedules/) | [回答](../docs/design/user-interactions.md) / [結果と評価](../docs/design/results-evaluation.md) / [外部変更](../docs/design/repository-effects.md) / [調度](../docs/design/task-scheduling.md) |\n| [modules](backend/src/projectmind/modules/)・[db](backend/src/projectmind/db/)・[migrations](backend/migrations/) | [生成表示](../docs/design/generated-modules.md) / [データモデル](../docs/design/domain-model.md) |\n\n[環境構築](../docs/development/local-development.md#backend)後、`PJM/backend/` でそれぞれ別 process として起動する。\n\n```bash\npython3 -m uvicorn projectmind.api.main:app --reload --port 8000\narq projectmind.worker.settings.WorkerSettings\n```\n\n検証は Ruff・Mypy・[tests](backend/tests/) の Pytest。[実 PostgreSQL の前提](../docs/development/local-development.md#実-postgresql-の前提)を先に読む。\n全件実行には専用 DB の作成・強制削除を伴う test があり、skip は成功ではない。\n[ops](backend/src/projectmind/ops/) の preflight は DB head/Redis の確認のみ。smoke は Run/Evaluation を作り、rotation は暗号文を更新する。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n[web/src](web/src/) は React + TypeScript の画面。Task Center は実行対象の選択、Workspace は一つの Run の観察を担当する。\n\n| コード入口 | 責務・設計 |\n| --- | --- |\n| [pages](web/src/pages/)・[components](web/src/components/) | [Workspace](../docs/design/workspace.md) / [Project](../docs/design/project-lifecycle.md) / [文書管理](../docs/design/document-lifecycle.md) |\n| [api](web/src/api/) | 資源別 client と validator。画面は index.ts、HTTP は http.ts を経由する |\n| [lib](web/src/lib/)・[hooks](web/src/hooks/) | routing・SSE・入力草稿 / 非同期処理と cleanup。即時実行と調度は taskDraft / TaskLaunchFields を共有する |\n| [i18n](web/src/lib/i18n/)・[styles](web/src/styles/)・[assets](web/src/assets/) | zh/ja/en、responsive layout、自己保持 font |\n\n起動は `PJM/web/` で `npx -y pnpm@11.7.0 dev`。依存導入・proxy と typecheck/Vitest/build は[開発手順](../docs/development/local-development.md#web)へ。\n実 component の応答喪失・切替・三語・keyboard・狭幅は同手順の browser 回帰で確認し、mock と実 Server の検証を分ける。\n[アカウントと安全](../docs/design/user-lifecycle.md)は平台の `#/accounts`。Project 未所属でも本人安全を操作でき、ADMIN は組織ユーザーを管理する。\n[Project の成員管理](../docs/design/project-lifecycle.md#成员管理页面)は `#/projects` の ADMIN 用 tab。会話・対象の隔離と未知結果の門禁はアカウント画面と共通 request hook を使う。\n[生成 Host](../docs/design/generated-modules.md)、[Task Flow](../docs/design/task-flow.md)等の未接続部分は設計と計画から確認する。\n[変更別の入口](../docs/development/change-guide.md)から対象の設計・API・回帰へ進む。"}, {"title": "Contracts", "level": "h2", "anchor": "contracts", "text": "## Contracts\n\n[contracts](contracts/) は versioned JSON Schema・example・OpenAPI の置場。権限・凍結・再送の意味は設計に置く。\n\n| 配置 | 内容 |\n| --- | --- |\n| [runs](contracts/runs/) / [users](contracts/users/v1/) / [projects](contracts/projects/) / [events](contracts/events/) / [errors](contracts/errors/) | 公開 API・RunEvent・Problem の Schema |\n| [tools](contracts/tools/) | versioned Tool capability の request / response / error |\n| agent-task-brief / capability-blueprint / runtime-manifest / outcomes / view-spec | 業務固有 field を持たない共有契約 |\n| [examples](contracts/examples/)・[fixtures](contracts/fixtures/) | 代表値 / offline 回帰入力。実 account や自動 seed ではない |\n| [OpenAPI snapshot](contracts/openapi/projectmind-api.v1.json) | FastAPI から生成する公開面。手編集しない |\n\n変更時は[契約変更手順](../docs/development/contract-workflow.md)に従い、DTO・Web validator・テスト・互換性を同期する。\nexample は scripts/validate_contracts.py と backend/tests/contracts/test_contracts.py の両表へ登録する。\nSchema 通過は Runtime の実装・公開済み・実環境の受入を保証しない。未接続の公開面も計画で確認する。\n[変更別の入口](../docs/development/change-guide.md)で、今回影響する消費側を選ぶ。"}, {"title": "Scripts", "level": "h2", "anchor": "scripts", "text": "## Scripts\n\n以下は `PJM/` で実行する。文書の依存・生成元・browser 検証は[文書管理](../docs/development/documentation.md)へ。\n公開面を調べる場合は[契約変更手順](../docs/development/contract-workflow.md)から読取確認と生成操作を区別する。\n\n| コマンド / 入口 | 用途と副作用 |\n| --- | --- |\n| `python3 scripts/validate_contracts.py` | Schema / example の読取検査 |\n| `python3 scripts/validate_compose.py` | Compose 構造の読取検査。実起動ではない |\n| [compose.py](scripts/compose.py) / [deploy.py](scripts/deploy.py) | 同一設定源 / identity を固定した分段配備。対象と承認は[配備手順](../docs/operations/deployment.md)を参照 |\n| `PYTHONPATH=backend/src python3 scripts/probe_claude_agent_sdk.py` | offline SDK 契約確認。実モデルを呼ばない |\n| `python3 scripts/build_docs.py --check` | 文書リンクと生成物の一致を検査 |\n| `python3 scripts/build_docs.py` | Markdown と docs-viewer.html から docs/index.html を上書き生成 |\n| `python3 -m unittest discover -s scripts/tests -v` | 文書・配備工具の一時 fixture / fake command 回帰。実 Docker は使わない |\n| `python3 scripts/check_docs_browser.py` | offline Chromium 検査。--output 指定時だけ screenshot を上書き保存 |\n| `python3 scripts/export_openapi.py` | 公開 API 変更時に snapshot を上書き。読むだけなら実行しない |\n| [measure_skill_interpretations.py](scripts/measure_skill_interpretations.py) | 実モデル呼出し・課金を伴う品質測定 |\n| [export-images.ps1](scripts/export-images.ps1) | 既存 local image の export。[Images](#images) の注意を参照 |"}, {"title": "Skills", "level": "h2", "anchor": "skills", "text": "## Skills\n\n[skills](skills/) は実行に影響する source package。各 package の SKILL.md を入口とし、文書整理では移動・書換えない。\n\n| Package | 用途 |\n| --- | --- |\n| pjm-project-dev | 本プロジェクトの開発 workflow |\n| projectmind-skill-interpreter | versioned system Skill。入力 source を実行せず候補契約を生成 |\n| examples | repository、情報不足、危険 Tool/credential の回帰入力 |\n\npackage の配置は import・公開・Project 有効化ではない。source script の存在も実行許可を与えない。\n[公開規則](../docs/design/skill-contract.md)に従い、実 credential や評価用の正解データを package に含めない。"}, {"title": "Images", "level": "h2", "anchor": "images", "text": "## Images\n\n`images/projectmind-images.tar` は配備 image の生成物であり、DB・blob・workspace・KEK の backup ではない。\n操作は[image 移送](../docs/operations/quickstart.md#image-移送と更新)、復旧は[同一復元点](../docs/operations/backup-recovery.md#一致恢复点包含什么)を確認する。\n\n- export は build/pull しない。application image 不足は失敗、第三者 image 不足は警告して除外される。\n- 実 image ID と必要 image を確認し、送受信の checksum を比較する。checksum だけでは配布元の真正性は証明できない。\n- 既存 tar は既定で上書きしない。ArchiveName で版を分け、-Force で唯一の回退用 archive を失わない。\n- export は一時 tar が成功してから公開し、失敗時は旧成品を保持する。deploy-load も旧 image を削除せず、途中失敗時に自動復旧・後続起動しない。\n- DB の復元を外部 write の取消と扱わない。Secret や archive を文書ブラウザへ埋め込まない。"}], "toc": [{"title": "はじめに", "anchor": "はじめに", "level": "h2"}, {"title": "実行前の注意", "anchor": "実行前の注意", "level": "h2"}, {"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "Contracts", "anchor": "contracts", "level": "h2"}, {"title": "Scripts", "anchor": "scripts", "level": "h2"}, {"title": "Skills", "anchor": "skills", "level": "h2"}, {"title": "Images", "anchor": "images", "level": "h2"}], "source": "../PJM/README.md", "checksum": "20a600bc5997b7700f90d7001357ae1cfe9fc9d98fc19d394c06f1c69b061953"}, {"id": "README.md", "title": "ProjectMind ワークスペース", "group": "code", "html": "\u003ch1 id=\"projectmind-ワークスペース\">ProjectMind ワークスペース\u003c/h1>\n\u003cp>ProjectMind は、Skill を解釈してプロジェクトのタスクとして実行し、結果・根拠・承認を記録する AI Agent プラットフォームである。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"index.html\">文書をブラウザで読む\u003c/a>：オフライン閲覧、全文検索、章ナビゲーション。\u003c/li>\n\u003cli>\u003ca href=\"#docs/README.md::\">文書ガイド\u003c/a>：目的別の読み順と設計の正本。\u003c/li>\n\u003cli>\u003ca href=\"#PJM/README.md::\">開発・起動案内\u003c/a>：正式コードの入口。\u003c/li>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::\">現在の計画\u003c/a>：実装済み範囲、未検証項目、次の作業。\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-text\">projectmind/\n├── docs/    製品・設計・開発・運用・現在の計画\n└── PJM/     Backend、Web、契約、Skill package、配備設定\n\u003c/code>\u003c/pre>\n\u003cp>設計本文は主に中国語、README と開発規約は日本語で記述する。API field・Schema key・コード識別子は原表記を維持する。\u003c/p>\n", "sections": [{"title": "ProjectMind ワークスペース", "level": "h1", "anchor": "projectmind-ワークスペース", "text": "# ProjectMind ワークスペース\n\nProjectMind は、Skill を解釈してプロジェクトのタスクとして実行し、結果・根拠・承認を記録する AI Agent プラットフォームである。\n\n- [文書をブラウザで読む](docs/index.html)：オフライン閲覧、全文検索、章ナビゲーション。\n- [文書ガイド](docs/README.md)：目的別の読み順と設計の正本。\n- [開発・起動案内](PJM/README.md)：正式コードの入口。\n- [現在の計画](docs/planning/roadmap.md)：実装済み範囲、未検証項目、次の作業。\n\n```text\nprojectmind/\n├── docs/    製品・設計・開発・運用・現在の計画\n└── PJM/     Backend、Web、契約、Skill package、配備設定\n```\n\n設計本文は主に中国語、README と開発規約は日本語で記述する。API field・Schema key・コード識別子は原表記を維持する。"}], "toc": [], "source": "../README.md", "checksum": "7c4624a1017a591432e10b00700e2035c28a0b56f6005c5a7fbb557c481882f2"}], "aliases": {"PJM/backend/README.md": {"page": "PJM/README.md", "anchor": "backend"}, "PJM/web/README.md": {"page": "PJM/README.md", "anchor": "web"}, "PJM/contracts/README.md": {"page": "PJM/README.md", "anchor": "contracts"}, "PJM/scripts/README.md": {"page": "PJM/README.md", "anchor": "scripts"}, "PJM/skills/README.md": {"page": "PJM/README.md", "anchor": "skills"}, "PJM/images/README.md": {"page": "PJM/README.md", "anchor": "images"}}}</script>
  <script>
    'use strict';
    const data = JSON.parse(document.getElementById('docs-data').textContent);
    const pages = new Map(data.pages.map(page => [page.id, page]));
    const main = document.getElementById('main');
    const search = document.getElementById('search');
    const menuButton = document.getElementById('menu-button');
    const topbar = document.querySelector('.topbar');
    let currentId = '';

    /** 文書と章を browser history に保存する。 */
    function pageHref(page, anchor = '') {
      return '#' + encodeURI(page.id) + '::' + encodeURIComponent(anchor);
    }

    /** 信頼していない検索語を HTML として挿入しない。 */
    function linkFor(page, title = page.title, anchor = '') {
      const link = document.createElement('a');
      link.href = pageHref(page, anchor);
      link.textContent = title;
      if (page.id === currentId && !anchor) link.setAttribute('aria-current', 'page');
      return link;
    }

    /** 検索語を escape 済み HTML に再解釈せず、text node と mark だけで強調する。 */
    function searchExcerpt(section, query) {
      const excerpt = document.createElement('small');
      const position = section.text.toLocaleLowerCase().indexOf(query);
      const start = Math.max(0, position - 32);
      const end = Math.min(section.text.length, Math.max(0, position) + query.length + 80);
      const snippet = section.text.slice(start, end).replace(/\s+/g, ' ');
      const match = snippet.toLocaleLowerCase().indexOf(query);
      if (start) excerpt.append('…');
      if (match < 0) {
        excerpt.append(snippet);
      } else {
        const mark = document.createElement('mark');
        mark.textContent = snippet.slice(match, match + query.length);
        excerpt.append(snippet.slice(0, match), mark, snippet.slice(match + query.length));
      }
      if (end < section.text.length) excerpt.append('…');
      return excerpt;
    }

    /** 通常時は分類ナビ、検索時は本文を含む候補を表示する。 */
    function renderNavigation() {
      const navigation = document.getElementById('navigation');
      navigation.replaceChildren();
      const query = search.value.trim().toLocaleLowerCase();
      if (query) {
        const found = data.pages.flatMap(page => {
          const sections = page.sections.filter(section => section.text.toLocaleLowerCase().includes(query));
          const id = page.id.toLocaleLowerCase();
          const title = page.title.toLocaleLowerCase();
          // file 名を探すとき、他文書の相互参照より対象文書を先に案内する。
          const rank = id === query || id.split('/').at(-1) === query ? 0
            : title.includes(query) ? 1 : id.includes(query) ? 2 : 3;
          return rank < 3 || sections.length ? [{page, sections, rank}] : [];
        }).sort((left, right) => left.rank - right.rank);
        document.getElementById('search-status').textContent = found.length + ' 篇匹配文档';
        for (const {page, sections} of found) {
          const row = document.createElement('div');
          row.className = 'search-hit';
          row.append(linkFor(page, page.title, sections[0]?.anchor || ''));
          const location = document.createElement('small');
          location.textContent = data.groups[page.group] + ' · ' + page.id;
          row.append(location);
          for (const section of sections.slice(0, 3)) {
            const result = document.createElement('div');
            result.className = 'search-section';
            result.append(linkFor(page, section.title, section.anchor), searchExcerpt(section, query));
            row.append(result);
          }
          if (sections.length > 3) {
            const more = document.createElement('small');
            more.textContent = '本页另有 ' + (sections.length - 3) + ' 个匹配章节，可用浏览器查找继续定位。';
            row.append(more);
          }
          navigation.append(row);
        }
        return;
      }
      document.getElementById('search-status').textContent = '';
      for (const [group, title] of Object.entries(data.groups)) {
        const children = data.pages.filter(page => page.group === group);
        if (!children.length) continue;
        const section = document.createElement('details');
        section.open = true;
        const heading = document.createElement('summary');
        heading.textContent = title;
        section.append(heading);
        for (const page of children) section.append(linkFor(page));
        navigation.append(section);
      }
    }

    /** 表が本当に溢れた場合だけ keyboard 操作とスクロール案内を表示する。 */
    function updateScrollableTables() {
      for (const [index, region] of [...main.querySelectorAll('.table-scroll')].entries()) {
        const table = region.querySelector('table');
        const overflow = table.getBoundingClientRect().width > region.clientWidth + 1;
        const hint = region.previousElementSibling;
        hint.hidden = !overflow;
        region.tabIndex = overflow ? 0 : -1;
        if (overflow) {
          region.setAttribute('role', 'region');
          region.setAttribute('aria-label', '表格 ' + (index + 1) + '，可横向滚动');
          region.setAttribute('aria-describedby', hint.id);
        } else {
          region.removeAttribute('role');
          region.removeAttribute('aria-label');
          region.removeAttribute('aria-describedby');
        }
      }
    }

    /** 改行や文字拡大後も固定 header が章の見出しと menu を覆わないようにする。 */
    function updateScrollOffset() {
      const sticky = getComputedStyle(topbar).position === 'sticky';
      const height = sticky ? Math.ceil(topbar.getBoundingClientRect().height) : 0;
      document.documentElement.style.setProperty('--docs-header-height', height + 'px');
      document.documentElement.style.setProperty('--docs-scroll-offset', (sticky ? height + 16 : 32) + 'px');
    }

    /** 直接リンク・戻る・進むを同じ経路で扱う。 */
    function showPage() {
      if (location.hash === '#main') { main.focus(); return; }
      let id, anchor;
      try { [id, anchor = ''] = location.hash.slice(1).split('::').map(decodeURIComponent); }
      catch { id = ''; anchor = ''; }
      id ||= 'docs/README.md';
      // 統合前の module README の bookmark は、本文を残さず対応する中心章へ案内する。
      if (Object.hasOwn(data.aliases, id)) {
        ({page: id, anchor} = data.aliases[id]);
        history.replaceState(null, '', pageHref(pages.get(id), anchor));
      }
      const page = pages.get(id);
      currentId = id;
      const toc = document.getElementById('toc-links');
      toc.replaceChildren();
      if (!page) {
        main.replaceChildren();
        const title = document.createElement('h1');
        title.textContent = '文档不存在';
        main.append(title, linkFor(pages.get('docs/README.md'), '返回文档导航'));
        document.getElementById('category').textContent = 'PROJECTMIND / 未找到';
        document.getElementById('source-link').hidden = true;
        document.title = '文档不存在 · ProjectMind';
        document.body.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        renderNavigation();
        main.focus();
        return;
      }
      document.title = page.title + ' · ProjectMind';
      document.getElementById('category').textContent = 'PROJECTMIND / ' + data.groups[page.group];
      const source = document.getElementById('source-link');
      source.hidden = false;
      source.href = page.source;
      // 本文は build 時に raw HTML 無効の parser で生成済み。検索語や URL は混ぜない。
      main.innerHTML = page.html;
      const inlineToc = document.createElement('details');
      inlineToc.className = 'inline-toc';
      const inlineSummary = document.createElement('summary');
      inlineSummary.textContent = '本页内容';
      const inlineLinks = document.createElement('nav');
      inlineLinks.setAttribute('aria-label', '本页章节');
      inlineToc.append(inlineSummary, inlineLinks);
      for (const heading of page.toc) {
        const link = linkFor(page, heading.title, heading.anchor);
        if (heading.level === 'h3') link.className = 'sub';
        inlineLinks.append(link.cloneNode(true));
        toc.append(link);
      }
      if (page.toc.length) main.querySelector('h1').after(inlineToc);
      for (const [index, region] of [...main.querySelectorAll('.table-scroll')].entries()) {
        const hint = document.createElement('p');
        hint.className = 'scroll-hint';
        hint.id = 'docs-table-hint-' + index;
        hint.hidden = true;
        hint.textContent = '表格可横向滚动；聚焦表格后可用方向键查看。';
        region.before(hint);
      }
      const footer = document.createElement('footer');
      footer.className = 'page-footer';
      footer.textContent = page.id + ' · 从 Markdown 生成；修改源文件后重新构建。';
      main.append(footer);
      document.body.classList.remove('menu-open');
      menuButton.setAttribute('aria-expanded', 'false');
      renderNavigation();
      requestAnimationFrame(() => {
        updateScrollOffset();
        updateScrollableTables();
        const target = anchor ? main.querySelector('#' + CSS.escape(anchor)) : null;
        if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
        const focusTarget = target || main;
        focusTarget.setAttribute('tabindex', '-1');
        focusTarget.focus({preventScroll:true});
      });
    }

    search.addEventListener('input', renderNavigation);
    window.addEventListener('hashchange', showPage);
    document.addEventListener('click', event => {
      // 同じ章への再クリックでは hashchange が発生しない。検索や目次から再び焦点を戻す。
      const link = event.target instanceof Element ? event.target.closest('a') : null;
      if (link?.getAttribute('href') === location.hash && location.hash.includes('::') &&
          event.button === 0 && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey) {
        event.preventDefault();
        showPage();
      }
    });
    window.addEventListener('resize', () => requestAnimationFrame(() => {
      updateScrollOffset();
      updateScrollableTables();
    }));
    new ResizeObserver(updateScrollOffset).observe(topbar);
    document.getElementById('print-button').addEventListener('click', () => window.print());
    menuButton.addEventListener('click', () => {
      const open = document.body.classList.toggle('menu-open');
      menuButton.setAttribute('aria-expanded', String(open));
      if (open) search.focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && document.body.classList.contains('menu-open')) {
        document.body.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.focus();
      }
    });
    showPage();
  </script>
</body>
</html>
