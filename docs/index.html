 重复相加。暖续行保留原 Segment/Attempt 和每步心跳，仅减少进程启动；不把一次复用写成少一次模型决策。"}], "toc": [{"title": "固定日志事件", "anchor": "固定日志事件", "level": "h2"}, {"title": "按瓶颈行动", "anchor": "按瓶颈行动", "level": "h2"}, {"title": "验证与解释", "anchor": "验证与解释", "level": "h2"}, {"title": "连续处理的边界", "anchor": "连续处理的边界", "level": "h2"}], "source": "operations/run-performance.md", "checksum": "2c3a1dc9b764ddc95f2e42749637aa5a385c5159c8e73fa61f448bbfb57752e8"}, {"id": "README.md", "title": "Skillmind ワークスペース", "group": "code", "html": "\u003ch1 id=\"skillmind-ワークスペース\">Skillmind ワークスペース\u003c/h1>\n\u003cp>Skill 原文をプロジェクトのタスクとして実行し、結果・根拠・外部変更を記録する AI Agent プラットフォーム。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"index.html\">文書ブラウザ\u003c/a>：オフライン閲覧・検索。\u003c/li>\n\u003cli>\u003ca href=\"#docs/README.md::\">利用・保守ガイド\u003c/a>：使用、開発、配備と障害対応。\u003c/li>\n\u003cli>\u003ca href=\"#SKM/README.md::\">開発案内\u003c/a>：コード入口、環境構築と検証。\u003c/li>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::\">現在の進捗\u003c/a>：実装・検証状況と実利用に基づく改善方針。\u003c/li>\n\u003c/ul>\n\u003cp>正式コードは \u003ccode>SKM/\u003c/code>、ガイドは \u003ccode>docs/\u003c/code> に置く。詳細な契約・処理はコードとテストを参照する。\u003c/p>\n", "sections": [{"title": "Skillmind ワークスペース", "level": "h1", "anchor": "skillmind-ワークスペース", "text": "# Skillmind ワークスペース\n\nSkill 原文をプロジェクトのタスクとして実行し、結果・根拠・外部変更を記録する AI Agent プラットフォーム。\n\n- [文書ブラウザ](docs/index.html)：オフライン閲覧・検索。\n- [利用・保守ガイド](docs/README.md)：使用、開発、配備と障害対応。\n- [開発案内](SKM/README.md)：コード入口、環境構築と検証。\n- [現在の進捗](docs/planning/roadmap.md)：実装・検証状況と実利用に基づく改善方針。\n\n正式コードは `SKM/`、ガイドは `docs/` に置く。詳細な契約・処理はコードとテストを参照する。"}], "toc": [], "source": "../README.md", "checksum": "7e0c228a0756e0c11ffab77f76736fa018bb994178397c2604ddb625325e1c83"}, {"id": "SKM/AGENTS.md", "title": "Skillmind エージェント開発規約", "group": "code", "html": "\u003ch1 id=\"skillmind-エージェント開発規約\">Skillmind エージェント開発規約\u003c/h1>\n\u003cp>本規約は Skillmind 全体に適用する。コード・起動は \u003ca href=\"#SKM/README.md::\">README\u003c/a>、利用・保守は \u003ca href=\"#docs/README.md::\">docs\u003c/a>、詳細な形状と処理は契約・実装・テストを参照し、ここに複製しない。\u003c/p>\n\u003ch2 id=\"作業前に読むもの\">作業前に読むもの\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">現在の計画\u003c/a>で実装範囲と不足を確認する。規約や test の存在を実装済みの証拠にしない。\u003c/li>\n\u003cli>\u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>から対象コードと保守境界を読む。ガイドと実装の矛盾は影響を確認して整合させる。\u003c/li>\n\u003cli>\u003ca href=\"#docs/development/coding-rules.md::\">実装細則\u003c/a>の該当章を遵守する。文書のみなら\u003ca href=\"#docs/development/documentation.md::\">文書維持\u003c/a>を読み、実装細則の一律再読は不要。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"変更してはいけない境界\">変更してはいけない境界\u003c/h2>\n\u003cul>\n\u003cli>API/Worker は共有 package のモジュラーモノリス。Business は AgentEngine 抽象に依存し、SDK 型や route/job に業務規則を漏らさない。\u003c/li>\n\u003cli>認証は共有 actor dependency、cookie の unsafe request は Origin/CSRF。明示 API key header は原 key を検証し、cookie へ fallback しない。越権と不存在は同じ 404。hash・認可・event/outbox 等は\u003ca href=\"#docs/development/coding-rules.md::backend\">単一実装\u003c/a>を使う。\u003c/li>\n\u003cli>PostgreSQL は正本、Redis は Queue・短期 Lock・通知。Run snapshot/権限上限/Result は不変。人工修正は Evaluation、答復/批准は新 Segment、同 Segment 復旧は新 Attempt。\u003c/li>\n\u003cli>Skill は Organization 資産 + Project 明示有効化。新規 Skill は入力/資源の最小宣言と凍結原文で実行する。旧 Blueprint は原値を保持し、Manifest から逆算せず、業務専用 Schema/seed/renderer を共通規則へ戻さない。\u003c/li>\n\u003cli>guidance・script・model 提案は権限ではない。未知の業務能力と登録済み versioned Tool を区別し、実行 Script は公開 checksum に一致させる。SDK builtin は DENIED_BUILTIN_TOOLS で fail closed、cwd は隔離ではない。凍結 input/ は読取専用、write は workspace/・output/ のみ。\u003c/li>\n\u003cli>外部 write は observe → propose → apply。\u003ca href=\"#docs/development/runtime-guide.md::%E5%A4%96%E9%83%A8%E6%95%88%E6%9E%9C\">受控写入\u003c/a>の承認、Provider、scope、競合・idempotency・read-back を省略しない。repository.write/v1 は Project 事前許可不可・force 禁止。Git/MCP はそれぞれ原 Run 開始時の明示同意による自動承認を許可する。\u003c/li>\n\u003cli>生成 UI・並行子 Agent・Shell/network の拡張は\u003ca href=\"#docs/development/runtime-guide.md::%E5%90%8E%E7%BD%AE%E8%83%BD%E5%8A%9B\">後置範囲\u003c/a>を確認し、影響する権限・隔離・予算を実装と回帰で検証する。局部実装を全面許可にしない。生成 bundle は CSP sandbox allow-scripts、iframe に allow-same-origin を付けない。子能力は resolve_subagent_capabilities と Run 共通予算を通す。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"言語とコード\">言語とコード\u003c/h2>\n\u003cp>会話は中国語、AGENTS/README・docstring/JSDoc/コメントは日本語。識別子と公開契約は既存表記を維持する。\n関数・型・Component・fixture・migration には責務、複雑な分岐・安全/transaction/復旧には理由を記し、古いコメントも同期する。単純処理の逐語説明は不要。\nPython の future annotations、TypeScript strict を維持し、any で契約を回避しない。広い例外捕捉は理由のある境界層に限定する。Effect は cleanup、遅延応答は unmount/対象切替後に反映しない。三語は共有 catalog を使う。\u003c/p>\n\u003ch2 id=\"検証と変更規律\">検証と変更規律\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">同期点\u003c/a>と\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">変更別検証\u003c/a>を適用する。動作変更には対応回帰を追加し、未実行・skip・失敗と残る risk を報告する。\u003c/li>\n\u003cli>文書は規則を更新し、進捗ログを増やさない。生成 HTML は直接編集せず、SKILL.md/references は整理対象外。\u003c/li>\n\u003cli>ユーザーの既存変更・成果物を保全する。lockfile を手編集せず、Credential・内部 URL・Ticket 本文・Gold・Secret を fixture/log に置かない。\u003c/li>\n\u003cli>Git 書込・履歴変更・破壊的操作は明示依頼が必要。実 DB・モデル・外部 write の検証は対象と副作用を事前確認する。\u003c/li>\n\u003cli>完了時はガイド/契約との整合と今回の検証を報告し、mock と実環境の証拠を区別する。計画は機能状態が変わった時だけ更新する。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "Skillmind エージェント開発規約", "level": "h1", "anchor": "skillmind-エージェント開発規約", "text": "# Skillmind エージェント開発規約\n\n本規約は Skillmind 全体に適用する。コード・起動は [README](README.md)、利用・保守は [docs](../docs/README.md)、詳細な形状と処理は契約・実装・テストを参照し、ここに複製しない。"}, {"title": "作業前に読むもの", "level": "h2", "anchor": "作業前に読むもの", "text": "## 作業前に読むもの\n\n1. [現在の計画](../docs/planning/roadmap.md#当前执行状态)で実装範囲と不足を確認する。規約や test の存在を実装済みの証拠にしない。\n2. [変更ガイド](../docs/development/change-guide.md)から対象コードと保守境界を読む。ガイドと実装の矛盾は影響を確認して整合させる。\n3. [実装細則](../docs/development/coding-rules.md)の該当章を遵守する。文書のみなら[文書維持](../docs/development/documentation.md)を読み、実装細則の一律再読は不要。"}, {"title": "変更してはいけない境界", "level": "h2", "anchor": "変更してはいけない境界", "text": "## 変更してはいけない境界\n\n- API/Worker は共有 package のモジュラーモノリス。Business は AgentEngine 抽象に依存し、SDK 型や route/job に業務規則を漏らさない。\n- 認証は共有 actor dependency、cookie の unsafe request は Origin/CSRF。明示 API key header は原 key を検証し、cookie へ fallback しない。越権と不存在は同じ 404。hash・認可・event/outbox 等は[単一実装](../docs/development/coding-rules.md#backend)を使う。\n- PostgreSQL は正本、Redis は Queue・短期 Lock・通知。Run snapshot/権限上限/Result は不変。人工修正は Evaluation、答復/批准は新 Segment、同 Segment 復旧は新 Attempt。\n- Skill は Organization 資産 + Project 明示有効化。新規 Skill は入力/資源の最小宣言と凍結原文で実行する。旧 Blueprint は原値を保持し、Manifest から逆算せず、業務専用 Schema/seed/renderer を共通規則へ戻さない。\n- guidance・script・model 提案は権限ではない。未知の業務能力と登録済み versioned Tool を区別し、実行 Script は公開 checksum に一致させる。SDK builtin は DENIED_BUILTIN_TOOLS で fail closed、cwd は隔離ではない。凍結 input/ は読取専用、write は workspace/・output/ のみ。\n- 外部 write は observe → propose → apply。[受控写入](../docs/development/runtime-guide.md#外部效果)の承認、Provider、scope、競合・idempotency・read-back を省略しない。repository.write/v1 は Project 事前許可不可・force 禁止。Git/MCP はそれぞれ原 Run 開始時の明示同意による自動承認を許可する。\n- 生成 UI・並行子 Agent・Shell/network の拡張は[後置範囲](../docs/development/runtime-guide.md#后置能力)を確認し、影響する権限・隔離・予算を実装と回帰で検証する。局部実装を全面許可にしない。生成 bundle は CSP sandbox allow-scripts、iframe に allow-same-origin を付けない。子能力は resolve_subagent_capabilities と Run 共通予算を通す。"}, {"title": "言語とコード", "level": "h2", "anchor": "言語とコード", "text": "## 言語とコード\n\n会話は中国語、AGENTS/README・docstring/JSDoc/コメントは日本語。識別子と公開契約は既存表記を維持する。\n関数・型・Component・fixture・migration には責務、複雑な分岐・安全/transaction/復旧には理由を記し、古いコメントも同期する。単純処理の逐語説明は不要。\nPython の future annotations、TypeScript strict を維持し、any で契約を回避しない。広い例外捕捉は理由のある境界層に限定する。Effect は cleanup、遅延応答は unmount/対象切替後に反映しない。三語は共有 catalog を使う。"}, {"title": "検証と変更規律", "level": "h2", "anchor": "検証と変更規律", "text": "## 検証と変更規律\n\n- [同期点](../docs/development/coding-rules.md#同步点)と[変更別検証](../docs/development/local-development.md#変更に応じた検証)を適用する。動作変更には対応回帰を追加し、未実行・skip・失敗と残る risk を報告する。\n- 文書は規則を更新し、進捗ログを増やさない。生成 HTML は直接編集せず、SKILL.md/references は整理対象外。\n- ユーザーの既存変更・成果物を保全する。lockfile を手編集せず、Credential・内部 URL・Ticket 本文・Gold・Secret を fixture/log に置かない。\n- Git 書込・履歴変更・破壊的操作は明示依頼が必要。実 DB・モデル・外部 write の検証は対象と副作用を事前確認する。\n- 完了時はガイド/契約との整合と今回の検証を報告し、mock と実環境の証拠を区別する。計画は機能状態が変わった時だけ更新する。"}], "toc": [{"title": "作業前に読むもの", "anchor": "作業前に読むもの", "level": "h2"}, {"title": "変更してはいけない境界", "anchor": "変更してはいけない境界", "level": "h2"}, {"title": "言語とコード", "anchor": "言語とコード", "level": "h2"}, {"title": "検証と変更規律", "anchor": "検証と変更規律", "level": "h2"}], "source": "../SKM/AGENTS.md", "checksum": "c2e3abaf1ac3fc406be1ed6ee2d3e85bc1da34b8c3ebcc7fe1c098509a170252"}, {"id": "SKM/README.md", "title": "Skillmind", "group": "code", "html": "\u003ch1 id=\"skillmind\">Skillmind\u003c/h1>\n\u003cp>Skill 原文をタスクとして実行し、入力、資源、結果、根拠、人工評価と外部変更を管理する AI Agent プラットフォーム。\u003c/p>\n\u003cp>\u003ca href=\"#docs/README.md::\">文書ガイド\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">現在の進捗\u003c/a> · \u003ca href=\"#SKM/AGENTS.md::\">開発規約\u003c/a>\u003c/p>\n\u003ch2 id=\"はじめに\">はじめに\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目的\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>開発と検証\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/local-development.md::\">ローカル開発\u003c/a> / \u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>起動と更新\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a> / \u003ca href=\"#docs/operations/deployment.md::\">配備手順\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API と運用\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/api-usage.md::\">API 利用\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a> / \u003ca href=\"#docs/operations/backup-recovery.md::\">復元\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>ソース開発は Python 3.12、Node.js 26 / pnpm 11.7.0。配備先は \u003ccode>images.tar\u003c/code>・\u003ccode>compose.yml\u003c/code>・\u003ccode>.env\u003c/code>・\u003ccode>Makefile\u003c/code> を使い、Docker Compose + make で API/Web と業務・保守 Worker を起動する。宿主の Python/Node は不要。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind\">backend/src/skillmind\u003c/a> は API と Worker の共有 package。route は認証と入出力、service は業務処理、repository は永続化、AgentEngine/Provider は実行境界を担当する。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>auth/\u003c/code>、\u003ccode>projects/\u003c/code>、\u003ccode>documents/\u003c/code>、\u003ccode>skills/\u003c/code>：アカウント、資源・文書管理、Skill 取込と公開。\u003c/li>\n\u003cli>\u003ccode>runs/\u003c/code>、\u003ccode>agent/\u003c/code>、\u003ccode>worker/\u003c/code>、\u003ccode>schedules/\u003c/code>：実行、続行、監督、定期実行。\u003c/li>\n\u003cli>\u003ccode>effects/\u003c/code>、\u003ccode>evaluations/\u003c/code>、\u003ccode>integrations/\u003c/code>、\u003ccode>storage/\u003c/code>：受控変更、評価、接続と保存。\u003c/li>\n\u003cli>\u003ca href=\"../SKM/backend/src/skillmind/db\">db\u003c/a> と \u003ca href=\"../SKM/backend/migrations\">migrations\u003c/a>：永続形式と移行。\u003c/li>\n\u003c/ul>\n\u003cp>変更時は\u003ca href=\"#docs/development/runtime-guide.md::\">維持する実行境界\u003c/a>を確認する。\u003ca href=\"#docs/development/local-development.md::backend\">Backend 手順\u003c/a>と\u003ca href=\"#docs/development/local-development.md::%E5%AE%9F-postgresql-%E3%81%AE%E5%89%8D%E6%8F%90\">実 DB テストの前提\u003c/a>に従って検証する。\u003c/p>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/web/src\">web/src\u003c/a> は React + TypeScript。pages/components は画面、api は共有 HTTP client、lib/hooks は純粋処理と非同期制御。\nタスク一覧で実行と定期実行を管理し、Workspace で待機・進行・最新レポートを確認する。全履歴と結果の詳細は実行履歴へ遷移する。\n\u003ca href=\"#docs/design/workspace.md::%E8%A7%86%E8%A7%89%E8%A7%84%E8%8C%83\">UI ガイド\u003c/a>と\u003ca href=\"#docs/development/local-development.md::%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E5%9B%9E%E5%B8%B0\">ブラウザ回帰\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"contracts\">Contracts\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/contracts\">contracts\u003c/a> に versioned JSON Schema、example、Tool capability、\u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a> を置く。\u003ca href=\"../SKM/contracts/users/v1\">アカウント契約\u003c/a>などの詳細形状はこちらを参照する。\n\u003ca href=\"#docs/development/contract-workflow.md::\">契約変更手順\u003c/a>に従い Backend/Web/Worker とテストを同期する。OpenAPI は生成物であり手編集しない。\u003c/p>\n\u003ch2 id=\"scripts\">Scripts\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/scripts\">scripts\u003c/a> は契約・Compose 検査、文書/OpenAPI 生成、image export と隔離 probe の入口。配備先へのコピーは不要。\n\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">検証の選び方\u003c/a>と\u003ca href=\"#docs/development/documentation.md::\">文書管理\u003c/a>に実行方法を集約する。\u003c/p>\n\u003ch2 id=\"skills\">Skills\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/skills\">skills\u003c/a> は system Interpreter と開発 workflow。業務 Skill は実際の内容を取り込み、\u003ca href=\"#docs/development/runtime-guide.md::skill-%E4%B8%8E%E5%86%BB%E7%BB%93%E5%8E%9F%E6%96%87\">原文の凍結と公開\u003c/a>に従う。\nSkill package 内の説明・Schema・script は実行入力であり文書整理の対象外。配置済み file や model 提案は実行権限を意味しない。\u003c/p>\n\u003ch2 id=\"images\">Images\u003c/h2>\n\u003cp>\u003ccode>images/images.tar\u003c/code> は image の移送用で、DB/blob/workspace/暗号鍵の backup ではない。\n更新は\u003ca href=\"#docs/operations/quickstart.md::image-%E7%A7%BB%E9%80%81%E3%81%A8%E6%9B%B4%E6%96%B0\">image 移送と更新\u003c/a>、障害からの復元は\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E6%81%A2%E5%A4%8D%E7%82%B9%E5%8C%85%E5%90%AB%E4%BB%80%E4%B9%88\">一致恢复点\u003c/a>を参照する。\u003c/p>\n", "sections": [{"title": "Skillmind", "level": "h1", "anchor": "skillmind", "text": "# Skillmind\n\nSkill 原文をタスクとして実行し、入力、資源、結果、根拠、人工評価と外部変更を管理する AI Agent プラットフォーム。\n\n[文書ガイド](../docs/README.md) · [現在の進捗](../docs/planning/roadmap.md#当前执行状态) · [開発規約](AGENTS.md)"}, {"title": "はじめに", "level": "h2", "anchor": "はじめに", "text": "## はじめに\n\n| 目的 | 入口 |\n| --- | --- |\n| 開発と検証 | [ローカル開発](../docs/development/local-development.md) / [変更ガイド](../docs/development/change-guide.md) |\n| 起動と更新 | [Quickstart](../docs/operations/quickstart.md) / [配備手順](../docs/operations/deployment.md) |\n| API と運用 | [API 利用](../docs/development/api-usage.md) / [Runbook](../docs/operations/runbook.md) / [復元](../docs/operations/backup-recovery.md) |\n\nソース開発は Python 3.12、Node.js 26 / pnpm 11.7.0。配備先は `images.tar`・`compose.yml`・`.env`・`Makefile` を使い、Docker Compose + make で API/Web と業務・保守 Worker を起動する。宿主の Python/Node は不要。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\n[backend/src/skillmind](backend/src/skillmind/) は API と Worker の共有 package。route は認証と入出力、service は業務処理、repository は永続化、AgentEngine/Provider は実行境界を担当する。\n\n- `auth/`、`projects/`、`documents/`、`skills/`：アカウント、資源・文書管理、Skill 取込と公開。\n- `runs/`、`agent/`、`worker/`、`schedules/`：実行、続行、監督、定期実行。\n- `effects/`、`evaluations/`、`integrations/`、`storage/`：受控変更、評価、接続と保存。\n- [db](backend/src/skillmind/db/) と [migrations](backend/migrations/)：永続形式と移行。\n\n変更時は[維持する実行境界](../docs/development/runtime-guide.md)を確認する。[Backend 手順](../docs/development/local-development.md#backend)と[実 DB テストの前提](../docs/development/local-development.md#実-postgresql-の前提)に従って検証する。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n[web/src](web/src/) は React + TypeScript。pages/components は画面、api は共有 HTTP client、lib/hooks は純粋処理と非同期制御。\nタスク一覧で実行と定期実行を管理し、Workspace で待機・進行・最新レポートを確認する。全履歴と結果の詳細は実行履歴へ遷移する。\n[UI ガイド](../docs/design/workspace.md#视觉规范)と[ブラウザ回帰](../docs/development/local-development.md#ブラウザ回帰)を参照する。"}, {"title": "Contracts", "level": "h2", "anchor": "contracts", "text": "## Contracts\n\n[contracts](contracts/) に versioned JSON Schema、example、Tool capability、[OpenAPI](contracts/openapi/skillmind-api.v1.json) を置く。[アカウント契約](contracts/users/v1/)などの詳細形状はこちらを参照する。\n[契約変更手順](../docs/development/contract-workflow.md)に従い Backend/Web/Worker とテストを同期する。OpenAPI は生成物であり手編集しない。"}, {"title": "Scripts", "level": "h2", "anchor": "scripts", "text": "## Scripts\n\n[scripts](scripts/) は契約・Compose 検査、文書/OpenAPI 生成、image export と隔離 probe の入口。配備先へのコピーは不要。\n[検証の選び方](../docs/development/local-development.md#変更に応じた検証)と[文書管理](../docs/development/documentation.md)に実行方法を集約する。"}, {"title": "Skills", "level": "h2", "anchor": "skills", "text": "## Skills\n\n[skills](skills/) は system Interpreter と開発 workflow。業務 Skill は実際の内容を取り込み、[原文の凍結と公開](../docs/development/runtime-guide.md#skill-与冻结原文)に従う。\nSkill package 内の説明・Schema・script は実行入力であり文書整理の対象外。配置済み file や model 提案は実行権限を意味しない。"}, {"title": "Images", "level": "h2", "anchor": "images", "text": "## Images\n\n`images/images.tar` は image の移送用で、DB/blob/workspace/暗号鍵の backup ではない。\n更新は[image 移送と更新](../docs/operations/quickstart.md#image-移送と更新)、障害からの復元は[一致恢复点](../docs/operations/backup-recovery.md#一致恢复点包含什么)を参照する。"}], "toc": [{"title": "はじめに", "anchor": "はじめに", "level": "h2"}, {"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "Contracts", "anchor": "contracts", "level": "h2"}, {"title": "Scripts", "anchor": "scripts", "level": "h2"}, {"title": "Skills", "anchor": "skills", "level": "h2"}, {"title": "Images", "anchor": "images", "level": "h2"}], "source": "../SKM/README.md", "checksum": "351a97c412a348c6a36e18252342981cf7b02259468636744cbd10350e6e4b45"}], "aliases": {"SKM/backend/README.md": {"page": "SKM/README.md", "anchor": "backend"}, "SKM/web/README.md": {"page": "SKM/README.md", "anchor": "web"}, "SKM/contracts/README.md": {"page": "SKM/README.md", "anchor": "contracts"}, "SKM/scripts/README.md": {"page": "SKM/README.md", "anchor": "scripts"}, "SKM/skills/README.md": {"page": "SKM/README.md", "anchor": "skills"}, "SKM/images/README.md": {"page": "SKM/README.md", "anchor": "images"}}}</script>
  <script>
    'use strict';
    const data = JSON.parse(document.getElementById('docs-data').textContent);
    const pages = new Map(data.pages.map(page => [page.id, page]));
    const main = document.getElementById('main');
    const search = document.getElementById('search');
    const menuButton = document.getElementById('menu-button');
    const topbar = document.querySelector('.topbar');
    let currentId = '';

    /** 文書と章を browser history に保存する。 */
    function pageHref(page, anchor = '') {
      return '#' + encodeURI(page.id) + '::' + encodeURIComponent(anchor);
    }

    /** 信頼していない検索語を HTML として挿入しない。 */
    function linkFor(page, title = page.title, anchor = '') {
      const link = document.createElement('a');
      link.href = pageHref(page, anchor);
      link.textContent = title;
      if (page.id === currentId && !anchor) link.setAttribute('aria-current', 'page');
      return link;
    }

    /** 検索語を escape 済み HTML に再解釈せず、text node と mark だけで強調する。 */
    function searchExcerpt(section, query) {
      const excerpt = document.createElement('small');
      const position = section.text.toLocaleLowerCase().indexOf(query);
      const start = Math.max(0, position - 32);
      const end = Math.min(section.text.length, Math.max(0, position) + query.length + 80);
      const snippet = section.text.slice(start, end).replace(/\s+/g, ' ');
      const match = snippet.toLocaleLowerCase().indexOf(query);
      if (start) excerpt.append('…');
      if (match < 0) {
        excerpt.append(snippet);
      } else {
        const mark = document.createElement('mark');
        mark.textContent = snippet.slice(match, match + query.length);
        excerpt.append(snippet.slice(0, match), mark, snippet.slice(match + query.length));
      }
      if (end < section.text.length) excerpt.append('…');
      return excerpt;
    }

    /** 通常時は分類ナビ、検索時は本文を含む候補を表示する。 */
    function renderNavigation() {
      const navigation = document.getElementById('navigation');
      navigation.replaceChildren();
      const query = search.value.trim().toLocaleLowerCase();
      if (query) {
        const found = data.pages.flatMap(page => {
          const sections = page.sections.filter(section => section.text.toLocaleLowerCase().includes(query));
          const id = page.id.toLocaleLowerCase();
          const title = page.title.toLocaleLowerCase();
          // file 名を探すとき、他文書の相互参照より対象文書を先に案内する。
          const rank = id === query || id.split('/').at(-1) === query ? 0
            : title.includes(query) ? 1 : id.includes(query) ? 2 : 3;
          return rank < 3 || sections.length ? [{page, sections, rank}] : [];
        }).sort((left, right) => left.rank - right.rank);
        document.getElementById('search-status').textContent = found.length + ' 篇匹配文档';
        for (const {page, sections} of found) {
          const row = document.createElement('div');
          row.className = 'search-hit';
          row.append(linkFor(page, page.title, sections[0]?.anchor || ''));
          const location = document.createElement('small');
          location.textContent = data.groups[page.group] + ' · ' + page.id;
          row.append(location);
          for (const section of sections.slice(0, 3)) {
            const result = document.createElement('div');
            result.className = 'search-section';
            result.append(linkFor(page, section.title, section.anchor), searchExcerpt(section, query));
            row.append(result);
          }
          if (sections.length > 3) {
            const more = document.createElement('small');
            more.textContent = '本页另有 ' + (sections.length - 3) + ' 个匹配章节，可用浏览器查找继续定位。';
            row.append(more);
          }
          navigation.append(row);
        }
        return;
      }
      document.getElementById('search-status').textContent = '';
      for (const [group, title] of Object.entries(data.groups)) {
        const children = data.pages.filter(page => page.group === group);
        if (!children.length) continue;
        const section = document.createElement('details');
        section.open = true;
        const heading = document.createElement('summary');
        heading.textContent = title;
        section.append(heading);
        for (const page of children) section.append(linkFor(page));
        navigation.append(section);
      }
    }

    /** 表が本当に溢れた場合だけ keyboard 操作とスクロール案内を表示する。 */
    function updateScrollableTables() {
      for (const [index, region] of [...main.querySelectorAll('.table-scroll')].entries()) {
        const table = region.querySelector('table');
        const overflow = table.getBoundingClientRect().width > region.clientWidth + 1;
        const hint = region.previousElementSibling;
        hint.hidden = !overflow;
        region.tabIndex = overflow ? 0 : -1;
        if (overflow) {
          region.setAttribute('role', 'region');
          region.setAttribute('aria-label', '表格 ' + (index + 1) + '，可横向滚动');
          region.setAttribute('aria-describedby', hint.id);
        } else {
          region.removeAttribute('role');
          region.removeAttribute('aria-label');
          region.removeAttribute('aria-describedby');
        }
      }
    }

    /** 改行や文字拡大後も固定 header が章の見出しと menu を覆わないようにする。 */
    function updateScrollOffset() {
      const sticky = getComputedStyle(topbar).position === 'sticky';
      const height = sticky ? Math.ceil(topbar.getBoundingClientRect().height) : 0;
      document.documentElement.style.setProperty('--docs-header-height', height + 'px');
      document.documentElement.style.setProperty('--docs-scroll-offset', (sticky ? height + 16 : 32) + 'px');
    }

    /** 直接リンク・戻る・進むを同じ経路で扱う。 */
    function showPage() {
      if (location.hash === '#main') { main.focus(); return; }
      let id, anchor;
      try { [id, anchor = ''] = location.hash.slice(1).split('::').map(decodeURIComponent); }
      catch { id = ''; anchor = ''; }
      id ||= 'docs/README.md';
      // 統合前の module README の bookmark は、本文を残さず対応する中心章へ案内する。
      if (Object.hasOwn(data.aliases, id)) {
        ({page: id, anchor} = data.aliases[id]);
        history.replaceState(null, '', pageHref(pages.get(id), anchor));
      }
      const page = pages.get(id);
      currentId = id;
      const toc = document.getElementById('toc-links');
      toc.replaceChildren();
      if (!page) {
        main.replaceChildren();
        const title = document.createElement('h1');
        title.textContent = '文档不存在';
        main.append(title, linkFor(pages.get('docs/README.md'), '返回文档导航'));
        document.getElementById('category').textContent = 'SKILLMIND / 未找到';
        document.getElementById('source-link').hidden = true;
        document.title = '文档不存在 · Skillmind';
        document.body.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        renderNavigation();
        main.focus();
        return;
      }
      document.title = page.title + ' · Skillmind';
      document.getElementById('category').textContent = 'SKILLMIND / ' + data.groups[page.group];
      const source = document.getElementById('source-link');
      source.hidden = false;
      source.href = page.source;
      // 本文は build 時に raw HTML 無効の parser で生成済み。検索語や URL は混ぜない。
      main.innerHTML = page.html;
      const inlineToc = document.createElement('details');
      inlineToc.className = 'inline-toc';
      const inlineSummary = document.createElement('summary');
      inlineSummary.textContent = '本页内容';
      const inlineLinks = document.createElement('nav');
      inlineLinks.setAttribute('aria-label', '本页章节');
      inlineToc.append(inlineSummary, inlineLinks);
      for (const heading of page.toc) {
        const link = linkFor(page, heading.title, heading.anchor);
        if (heading.level === 'h3') link.className = 'sub';
        inlineLinks.append(link.cloneNode(true));
        toc.append(link);
      }
      if (page.toc.length) main.querySelector('h1').after(inlineToc);
      for (const [index, region] of [...main.querySelectorAll('.table-scroll')].entries()) {
        const hint = document.createElement('p');
        hint.className = 'scroll-hint';
        hint.id = 'docs-table-hint-' + index;
        hint.hidden = true;
        hint.textContent = '表格可横向滚动；聚焦表格后可用方向键查看。';
        region.before(hint);
      }
      const footer = document.createElement('footer');
      footer.className = 'page-footer';
      footer.textContent = page.id + ' · 从 Markdown 生成；修改源文件后重新构建。';
      main.append(footer);
      document.body.classList.remove('menu-open');
      menuButton.setAttribute('aria-expanded', 'false');
      renderNavigation();
      requestAnimationFrame(() => {
        updateScrollOffset();
        updateScrollableTables();
        const target = anchor ? main.querySelector('#' + CSS.escape(anchor)) : null;
        if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
        const focusTarget = target || main;
        focusTarget.setAttribute('tabindex', '-1');
        focusTarget.focus({preventScroll:true});
      });
    }

    search.addEventListener('input', renderNavigation);
    window.addEventListener('hashchange', showPage);
    document.addEventListener('click', event => {
      // 同じ章への再クリックでは hashchange が発生しない。検索や目次から再び焦点を戻す。
      const link = event.target instanceof Element ? event.target.closest('a') : null;
      if (link?.getAttribute('href') === location.hash && location.hash.includes('::') &&
          event.button === 0 && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey) {
        event.preventDefault();
        showPage();
      }
    });
    window.addEventListener('resize', () => requestAnimationFrame(() => {
      updateScrollOffset();
      updateScrollableTables();
    }));
    new ResizeObserver(updateScrollOffset).observe(topbar);
    document.getElementById('print-button').addEventListener('click', () => window.print());
    menuButton.addEventListener('click', () => {
      const open = document.body.classList.toggle('menu-open');
      menuButton.setAttribute('aria-expanded', String(open));
      if (open) search.focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && document.body.classList.contains('menu-open')) {
        document.body.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.focus();
      }
    });
    showPage();
  </script>
</body>
</html>
