-m pytest -p no:cacheprovider -o addopts= -q \\\n  tests/contracts/test_contracts.py::test_exported_openapi_is_current\n\u003c/code>\u003c/pre>\n\u003cp>文档整理只报告断点。获准改 API 后才在 \u003ccode>SKM/\u003c/code> 运行 \u003ccode>python3 scripts/export_openapi.py\u003c/code>，并同步消费者和测试；不关校验或改 example 掩盖失败。\u003c/p>\n\u003ch2 id=\"历史数据兼容不等于前后端版本兼容\">历史数据兼容不等于前后端版本兼容\u003c/h2>\n\u003cul>\n\u003cli>新 API 读旧 Run：返回明确历史状态，不从当前资源补快照。\u003c/li>\n\u003cli>新 Web 读旧 API：只接受规定的兼容形状，必需字段不默认空数组。\u003c/li>\n\u003cli>旧 Web 读新 API：核对额外字段/enum；同批发布仍有旧浏览器、Worker 和在途请求。\u003c/li>\n\u003cli>API/Worker 回退：确认 schema、队列和非终态可读，不删审计或降低校验。\u003c/li>\n\u003c/ul>\n\u003cp>可选展示损坏可按设计降级；身份、授权和必需协议错误不能降级为成功。\u003c/p>\n\u003ch2 id=\"示例run-的冻结文档读取投影\">示例：Run 的冻结文档读取投影\u003c/h2>\n\u003cp>\u003ca href=\"#docs/design/resource-snapshots.md::%E5%85%AC%E5%BC%80%E9%80%89%E6%8B%A9%E4%B8%8E%E8%AF%BB%E5%8F%96%E6%8A%95%E5%BD%B1%E7%9A%84%E5%AE%9E%E6%96%BD%E5%A5%91%E7%BA%A6\">资源投影\u003c/a>贯穿选择 → 创建冻结 → detail 完整投影/history 摘要 → Web 三态。\nFROZEN 有清单，LEGACY_UNAVAILABLE/INVALID 无成员。验证跨 Project/slot/hash 拒绝、旧清单不变和各层一致；清单可信不表示 blob 可读或执行成功。\u003c/p>\n\u003ch2 id=\"怎样记录验证结论\">怎样记录验证结论\u003c/h2>\n\u003cp>按本次范围报告文档、契约、Backend/Web、真实事务与部署/模型结果，明确 mock、失败、skip 和未执行。\n真实 DB/外部 write 只用获准的隔离目标；断点写计划，不追加历史日志或借用旧通过次数。\u003c/p>\n", "sections": [{"title": "公开契约变更与联调", "level": "h1", "anchor": "公开契约变更与联调", "text": "# 公开契约变更与联调\n\n字段语义见[领域设计](../design/README.md)，状态见[计划](../planning/roadmap.md)，命令环境见[本地开发](local-development.md)。"}, {"title": "先看整条交付链", "level": "h2", "anchor": "先看整条交付链", "text": "## 先看整条交付链\n\n```text\n领域规则/授权/兼容 → Schema/example → Backend\n  → Web/Worker → 契约与流程回归 → 版本匹配及发布\n```\n\n只改受影响层。新增 required、删字段、收窄 enum、改变空值或 HTTP 拒绝语义，即使 URL/v1 文件名不变也可能破坏兼容。"}, {"title": "三种数据不要混成一份", "level": "h2", "anchor": "三种数据不要混成一份", "text": "## 三种数据不要混成一份\n\n| 层 | 边界 |\n| --- | --- |\n| 持久快照 | 保存当时事实、格式版与 checksum，不为新页面重写旧 Run |\n| 公开响应 | 授权后白名单投影，不直接暴露内部 JSON 或修改原值来脱敏 |\n| 页面状态 | validator 后生成视图，不补造历史资源、身份或缺失字段 |"}, {"title": "开工时列出消费者和同步先后", "level": "h2", "anchor": "开工时列出消费者和同步先后", "text": "## 开工时列出消费者和同步先后\n\n按[同步表](coding-rules.md#同步点)核对：\n\n- Schema/DTO：required、nullable、enum、额外字段；route：status、media type、header、缓存和 Problem。\n- service/repository：授权、hash、幂等、持久兼容与迁移；Worker/CLI/Schedule：旁路消费者。\n- Web：validator/barrel、页面、三语、fixture 与 mock browser。\n- [OpenAPI](../../SKM/contracts/openapi/skillmind-api.v1.json)：由 app 生成，不能手补。\n\n新 example 同步 [validator](../../SKM/scripts/validate_contracts.py)与[契约测试](../../SKM/backend/tests/contracts/test_contracts.py)的注册表。\nSchema 不验证授权/并发，OpenAPI 一致性不证明声明覆盖真实响应；例如登录 429 还须检查 Retry-After 和页面处理。"}, {"title": "遇到未接齐的交付链", "level": "h2", "anchor": "遇到未接齐的交付链", "text": "## 遇到未接齐的交付链\n\n| 断点 | 接续动作 |\n| --- | --- |\n| DTO/model 有，route 未调用 | 接装配与用例，不把字段当 API |\n| route 有，OpenAPI 缺失 | 核对后生成，不重造 API |\n| API 有，页面缺失 | 接 validator/barrel，再验用户流程 |\n| example 通过，一致性失败 | 保留两项结论，查生产与声明差异 |\n| 单模块通过，合跑收集失败 | 修 fixture/import 后重跑同组合 |\n\n读检查不启动 lifespan、不连 DB、不回写。Backend 依赖就绪后，在 `SKM/` 执行 `python3 scripts/validate_contracts.py`；在 `SKM/backend/` 执行：\n\n```bash\npython3 -m pytest -p no:cacheprovider -o addopts= -q \\\n  tests/contracts/test_contracts.py::test_exported_openapi_is_current\n```\n\n文档整理只报告断点。获准改 API 后才在 `SKM/` 运行 `python3 scripts/export_openapi.py`，并同步消费者和测试；不关校验或改 example 掩盖失败。"}, {"title": "历史数据兼容不等于前后端版本兼容", "level": "h2", "anchor": "历史数据兼容不等于前后端版本兼容", "text": "## 历史数据兼容不等于前后端版本兼容\n\n- 新 API 读旧 Run：返回明确历史状态，不从当前资源补快照。\n- 新 Web 读旧 API：只接受规定的兼容形状，必需字段不默认空数组。\n- 旧 Web 读新 API：核对额外字段/enum；同批发布仍有旧浏览器、Worker 和在途请求。\n- API/Worker 回退：确认 schema、队列和非终态可读，不删审计或降低校验。\n\n可选展示损坏可按设计降级；身份、授权和必需协议错误不能降级为成功。"}, {"title": "示例：Run 的冻结文档读取投影", "level": "h2", "anchor": "示例run-的冻结文档读取投影", "text": "## 示例：Run 的冻结文档读取投影\n\n[资源投影](../design/resource-snapshots.md#公开选择与读取投影的实施契约)贯穿选择 → 创建冻结 → detail 完整投影/history 摘要 → Web 三态。\nFROZEN 有清单，LEGACY_UNAVAILABLE/INVALID 无成员。验证跨 Project/slot/hash 拒绝、旧清单不变和各层一致；清单可信不表示 blob 可读或执行成功。"}, {"title": "怎样记录验证结论", "level": "h2", "anchor": "怎样记录验证结论", "text": "## 怎样记录验证结论\n\n按本次范围报告文档、契约、Backend/Web、真实事务与部署/模型结果，明确 mock、失败、skip 和未执行。\n真实 DB/外部 write 只用获准的隔离目标；断点写计划，不追加历史日志或借用旧通过次数。"}], "toc": [{"title": "先看整条交付链", "anchor": "先看整条交付链", "level": "h2"}, {"title": "三种数据不要混成一份", "anchor": "三种数据不要混成一份", "level": "h2"}, {"title": "开工时列出消费者和同步先后", "anchor": "开工时列出消费者和同步先后", "level": "h2"}, {"title": "遇到未接齐的交付链", "anchor": "遇到未接齐的交付链", "level": "h2"}, {"title": "历史数据兼容不等于前后端版本兼容", "anchor": "历史数据兼容不等于前后端版本兼容", "level": "h2"}, {"title": "示例：Run 的冻结文档读取投影", "anchor": "示例run-的冻结文档读取投影", "level": "h2"}, {"title": "怎样记录验证结论", "anchor": "怎样记录验证结论", "level": "h2"}], "source": "development/contract-workflow.md", "checksum": "9f41789735ccabb6131263281623944807899580b494d4037477ceb153c95b6e"}, {"id": "docs/development/api-usage.md", "title": "API 利用ガイド", "group": "development", "html": "\u003ch1 id=\"api-利用ガイド\">API 利用ガイド\u003c/h1>\n\u003cp>形状は \u003ca href=\"#SKM/README.md::contracts\">Contracts\u003c/a> / 配備先の \u003ccode>/api/docs\u003c/code>、利用可能範囲は\u003ca href=\"#docs/planning/roadmap.md::\">計画\u003c/a>を参照する。\n以下は context path 配下の \u003ccode>/api/v1\u003c/code> 起点。保存 OpenAPI と実装の一致は\u003ca href=\"#docs/development/contract-workflow.md::%E9%81%87%E5%88%B0%E6%9C%AA%E6%8E%A5%E9%BD%90%E7%9A%84%E4%BA%A4%E4%BB%98%E9%93%BE\">契約確認\u003c/a>で調べる。\u003c/p>\n\u003ch2 id=\"認証してから呼び出す\">認証してから呼び出す\u003c/h2>\n\u003cp>password/Cookie/CSRF を command 行、history、URL、共有 log に置かず、session token を Web storage に保存しない。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>順序\u003c/th>\n\u003cth>API と必要な情報\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>GET /auth/login-context：context cookie と login CSRF を取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>POST /auth/login：cookie、Origin、CSRF と \u003ca href=\"../SKM/contracts/auth/v1/login-request.schema.json\">login request\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>業務 API/SSE：session cookie。unsafe request は Origin と業務用 X-CSRF-Token も送る\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>login-context/login は両方とも来源配額を消費する。429 は Retry-After に従って停止し、503 を password 誤りと扱わない。\n再試行は新 challenge から明示的に行う。自動 password 再送・polling・来源切替で制限を回避せず、通信失敗/abort を session 作成取消と扱わない。\u003c/p>\n\u003cp>v2 の GET /auth/session は同一 session に同じ CSRF を返すが idle を更新し得る。別 login・期限・role/失効後は旧値を使わず、403 や通信失敗で業務 mutation を自動再送しない。\u003ca href=\"#docs/operations/runbook.md::%E8%AE%A4%E8%AF%81%E6%95%85%E9%9A%9C%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">認証分診\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"task-を選び一回の-run-を作る\">Task を選び、一回の Run を作る\u003c/h2>\n\u003col>\n\u003cli>GET /projects/{id}/tasks で精確 SkillVersion/task_key、入力 Schema と resource candidate を取得。\u003c/li>\n\u003cli>POST /projects/{id}/task-runs に\u003ca href=\"../SKM/contracts/runs/task-create/v1/request.schema.json\">入力契約\u003c/a>と新規用 Idempotency-Key を送る。input/sources の空 object は常に合法ではない。\u003c/li>\n\u003cli>返された ID で GET /projects/{id}/runs/{run_id}/detail と SSE を読む。作成成功と実行成功は別。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"再送継続権限の規則\">再送・継続・権限の規則\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>規則\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>作成の確認\u003c/td>\n\u003ctd>同 actor・原内容/key を維持。同一要求は 200 / Idempotent-Replay、同 key の別意図は 409。新実行のみ別 key\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>結果不明\u003c/td>\n\u003ctd>timeout/abort は取消でない。自動で新 key を作らない。ページ内確認は離頁/refresh/actor・Project 切替を越えて残らない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>授権\u003c/td>\n\u003ctd>越権/不存在は同じ 404。Skill/Integration 管理は ADMIN、通常業務は ACTIVE Project member（組織内 ADMIN は bypass）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取消\u003c/td>\n\u003ctd>POST /runs/{run_id}/cancel 後も状態を確認。先に SUCCEEDED/FAILED なら 409。CANCELLED は process 退出の証明でない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SSE\u003c/td>\n\u003ctd>GET /runs/{run_id}/events は Last-Event-ID / after で持続 event を再開。一時 TEXT_DELTA は event ID を進めない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部批准\u003c/td>\n\u003ctd>Proposal の version/checksum/key を固定し、Run 起動者か ADMIN が判断。Secret locator/config/credential は公開しない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>原要求確認にも現在の認証/Project 授権が必要。公開停止後の確認と新規資源検証は別で、未知の旧形式は拒否する。\n無効・権限外の明示 Project を別 Project に自動変更しない。詳細は\u003ca href=\"#docs/design/run-creation.md::\">Run 作成\u003c/a>。\u003c/p>\n\u003ch2 id=\"待機中の回答と結果評価\">待機中の回答と結果評価\u003c/h2>\n\u003cp>普通答復と Proposal decision、Evaluation は別 endpoint。\u003c/p>\n\u003cul>\n\u003cli>CLARIFICATION/CHOICE/REVIEW：POST /projects/{id}/runs/{run_id}/interactions/{interaction_id}/responses に原 interaction version・\u003ca href=\"../SKM/contracts/runs/interaction-response/v1/request.schema.json\">回答\u003c/a>・Idempotency-Key を送る。初回 201、同内容/版/key の確認は 200。\u003c/li>\n\u003cli>答復の 409 は競合、410 は期限切れ。410 は過期 continuation の commit 後にも返るため rollback と見なさず、現在の Interaction/Run を再読する。通信失敗時の Web 確認は原 POST で、初回保存になり得る。\u003c/li>\n\u003cli>評価：POST /projects/{id}/runs/{run_id}/evaluation-submissions に submission_key・result_id と評価を送る（初回 201、原要求再送 200）。同 path の /{submission_key}?result_id=… を GET して読取専用確認する。404 は先行要求の未実行証明ではない。\u003c/li>\n\u003cli>旧 /evaluations POST に原要求確認はない。履歴の同文/時刻から成功を推定しない。評価は追加式で原 Result を変えず、修正 pointer は detail.result.data の根を指す。\u003c/li>\n\u003c/ul>\n\u003cp>返却された現在の Run status を QUEUED 固定と仮定しない。詳細は\u003ca href=\"#docs/design/user-interactions.md::\">普通答复\u003c/a>と\u003ca href=\"#docs/design/results-evaluation.md::\">結果・評価\u003c/a>。\u003c/p>\n\u003ch2 id=\"文書を選び元の範囲を確認する\">文書を選び、元の範囲を確認する\u003c/h2>\n\u003cp>単一、2 件以上の集合、明示的な全集から選ぶ。任意 slot 未使用は省略し、候補先頭を同意にしない。必須未選択、失効 ID、空/上限超過の全集は拒否される。\u003c/p>\n\u003cp>detail.document_snapshots は作成時の清単で、FROZEN のみメンバーを持つ。LEGACY_UNAVAILABLE/INVALID は snapshot:null、history.selected_sources は摘要のみ。いずれも現在の blob 可読性を保証しない。\u003c/p>\n\u003cp>token/上限は\u003ca href=\"#docs/design/resource-snapshots.md::%E5%85%AC%E5%BC%80%E9%80%89%E6%8B%A9%E4%B8%8E%E8%AF%BB%E5%8F%96%E6%8A%95%E5%BD%B1%E7%9A%84%E5%AE%9E%E6%96%BD%E5%A5%91%E7%BA%A6\">資源設計\u003c/a>が正本。旧 Run の明示的な歴史状態と旧 API の必需 field 欠落を混同せず、空集合に fallback しない。更新/回退時は\u003ca href=\"#docs/development/contract-workflow.md::%E5%8E%86%E5%8F%B2%E6%95%B0%E6%8D%AE%E5%85%BC%E5%AE%B9%E4%B8%8D%E7%AD%89%E4%BA%8E%E5%89%8D%E5%90%8E%E7%AB%AF%E7%89%88%E6%9C%AC%E5%85%BC%E5%AE%B9\">版互換\u003c/a>を確認する。\u003c/p>\n", "sections": [{"title": "API 利用ガイド", "level": "h1", "anchor": "api-利用ガイド", "text": "# API 利用ガイド\n\n形状は [Contracts](../../SKM/README.md#contracts) / 配備先の `/api/docs`、利用可能範囲は[計画](../planning/roadmap.md)を参照する。\n以下は context path 配下の `/api/v1` 起点。保存 OpenAPI と実装の一致は[契約確認](contract-workflow.md#遇到未接齐的交付链)で調べる。"}, {"title": "認証してから呼び出す", "level": "h2", "anchor": "認証してから呼び出す", "text": "## 認証してから呼び出す\n\npassword/Cookie/CSRF を command 行、history、URL、共有 log に置かず、session token を Web storage に保存しない。\n\n| 順序 | API と必要な情報 |\n| --- | --- |\n| 1 | GET /auth/login-context：context cookie と login CSRF を取得 |\n| 2 | POST /auth/login：cookie、Origin、CSRF と [login request](../../SKM/contracts/auth/v1/login-request.schema.json) |\n| 3 | 業務 API/SSE：session cookie。unsafe request は Origin と業務用 X-CSRF-Token も送る |\n\nlogin-context/login は両方とも来源配額を消費する。429 は Retry-After に従って停止し、503 を password 誤りと扱わない。\n再試行は新 challenge から明示的に行う。自動 password 再送・polling・来源切替で制限を回避せず、通信失敗/abort を session 作成取消と扱わない。\n\nv2 の GET /auth/session は同一 session に同じ CSRF を返すが idle を更新し得る。別 login・期限・role/失効後は旧値を使わず、403 や通信失敗で業務 mutation を自動再送しない。[認証分診](../operations/runbook.md#认证故障的只读分诊)を参照する。"}, {"title": "Task を選び、一回の Run を作る", "level": "h2", "anchor": "task-を選び一回の-run-を作る", "text": "## Task を選び、一回の Run を作る\n\n1. GET /projects/{id}/tasks で精確 SkillVersion/task_key、入力 Schema と resource candidate を取得。\n2. POST /projects/{id}/task-runs に[入力契約](../../SKM/contracts/runs/task-create/v1/request.schema.json)と新規用 Idempotency-Key を送る。input/sources の空 object は常に合法ではない。\n3. 返された ID で GET /projects/{id}/runs/{run_id}/detail と SSE を読む。作成成功と実行成功は別。"}, {"title": "再送・継続・権限の規則", "level": "h2", "anchor": "再送継続権限の規則", "text": "## 再送・継続・権限の規則\n\n| 操作 | 規則 |\n| --- | --- |\n| 作成の確認 | 同 actor・原内容/key を維持。同一要求は 200 / Idempotent-Replay、同 key の別意図は 409。新実行のみ別 key |\n| 結果不明 | timeout/abort は取消でない。自動で新 key を作らない。ページ内確認は離頁/refresh/actor・Project 切替を越えて残らない |\n| 授権 | 越権/不存在は同じ 404。Skill/Integration 管理は ADMIN、通常業務は ACTIVE Project member（組織内 ADMIN は bypass） |\n| 取消 | POST /runs/{run_id}/cancel 後も状態を確認。先に SUCCEEDED/FAILED なら 409。CANCELLED は process 退出の証明でない |\n| SSE | GET /runs/{run_id}/events は Last-Event-ID / after で持続 event を再開。一時 TEXT_DELTA は event ID を進めない |\n| 外部批准 | Proposal の version/checksum/key を固定し、Run 起動者か ADMIN が判断。Secret locator/config/credential は公開しない |\n\n原要求確認にも現在の認証/Project 授権が必要。公開停止後の確認と新規資源検証は別で、未知の旧形式は拒否する。\n無効・権限外の明示 Project を別 Project に自動変更しない。詳細は[Run 作成](../design/run-creation.md)。"}, {"title": "待機中の回答と結果評価", "level": "h2", "anchor": "待機中の回答と結果評価", "text": "## 待機中の回答と結果評価\n\n普通答復と Proposal decision、Evaluation は別 endpoint。\n\n- CLARIFICATION/CHOICE/REVIEW：POST /projects/{id}/runs/{run_id}/interactions/{interaction_id}/responses に原 interaction version・[回答](../../SKM/contracts/runs/interaction-response/v1/request.schema.json)・Idempotency-Key を送る。初回 201、同内容/版/key の確認は 200。\n- 答復の 409 は競合、410 は期限切れ。410 は過期 continuation の commit 後にも返るため rollback と見なさず、現在の Interaction/Run を再読する。通信失敗時の Web 確認は原 POST で、初回保存になり得る。\n- 評価：POST /projects/{id}/runs/{run_id}/evaluation-submissions に submission_key・result_id と評価を送る（初回 201、原要求再送 200）。同 path の /{submission_key}?result_id=… を GET して読取専用確認する。404 は先行要求の未実行証明ではない。\n- 旧 /evaluations POST に原要求確認はない。履歴の同文/時刻から成功を推定しない。評価は追加式で原 Result を変えず、修正 pointer は detail.result.data の根を指す。\n\n返却された現在の Run status を QUEUED 固定と仮定しない。詳細は[普通答复](../design/user-interactions.md)と[結果・評価](../design/results-evaluation.md)。"}, {"title": "文書を選び、元の範囲を確認する", "level": "h2", "anchor": "文書を選び元の範囲を確認する", "text": "## 文書を選び、元の範囲を確認する\n\n単一、2 件以上の集合、明示的な全集から選ぶ。任意 slot 未使用は省略し、候補先頭を同意にしない。必須未選択、失効 ID、空/上限超過の全集は拒否される。\n\ndetail.document_snapshots は作成時の清単で、FROZEN のみメンバーを持つ。LEGACY_UNAVAILABLE/INVALID は snapshot:null、history.selected_sources は摘要のみ。いずれも現在の blob 可読性を保証しない。\n\ntoken/上限は[資源設計](../design/resource-snapshots.md#公开选择与读取投影的实施契约)が正本。旧 Run の明示的な歴史状態と旧 API の必需 field 欠落を混同せず、空集合に fallback しない。更新/回退時は[版互換](contract-workflow.md#历史数据兼容不等于前后端版本兼容)を確認する。"}], "toc": [{"title": "認証してから呼び出す", "anchor": "認証してから呼び出す", "level": "h2"}, {"title": "Task を選び、一回の Run を作る", "anchor": "task-を選び一回の-run-を作る", "level": "h2"}, {"title": "再送・継続・権限の規則", "anchor": "再送継続権限の規則", "level": "h2"}, {"title": "待機中の回答と結果評価", "anchor": "待機中の回答と結果評価", "level": "h2"}, {"title": "文書を選び、元の範囲を確認する", "anchor": "文書を選び元の範囲を確認する", "level": "h2"}], "source": "development/api-usage.md", "checksum": "190932987397fdfefb689e6436dfc80163c64567c4dc63c020b7dc13c50efa58"}, {"id": "docs/development/documentation.md", "title": "文档维护约定", "group": "development", "html": "\u003ch1 id=\"文档维护约定\">文档维护约定\u003c/h1>\n\u003cp>文档只服务当前开发与运行：规则有唯一正本，进度只写计划，不新增历史整理页或特定业务项目的说明。\u003c/p>\n\u003ch2 id=\"正本与派生内容\">正本与派生内容\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>正本\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>产品、术语、结构\u003c/td>\n\u003ctd>overview/\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>领域规则、失败恢复、兼容、验收\u003c/td>\n\u003ctd>design/\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前基础、缺口、优先顺序\u003c/td>\n\u003ctd>planning/roadmap.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>开发与验证 / 部署与排障\u003c/td>\n\u003ctd>development/ / operations/\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代码导航 / 必须遵守的规则\u003c/td>\n\u003ctd>SKM/README.md / SKM/AGENTS.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按改动查阅的实现约束\u003c/td>\n\u003ctd>development/coding-rules.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>离线浏览版\u003c/td>\n\u003ctd>docs/index.html，由 Markdown 生成\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>浏览版只收录 docs Markdown、工作区/代码根 README 和 AGENTS。Backend 短 README 用于打包，不重复导航；默认不建模块 README。\n禁止扩大扫描到 .env、配置、凭据、Gold、源码或 Skill 的 SKILL.md/references。执行资产不随文档整理修改。\u003c/p>\n\u003ch2 id=\"写一份设计\">写一份设计\u003c/h2>\n\u003cp>按“用途/非目标 → 责任与数据 → 流程及失败 → 实施入口与验收”组织，复杂关系才用短表或图。\u003c/p>\n\u003cul>\n\u003cli>新内容优先替换原段，不追加“本轮完成”或迁移流水。设计保留限制及待接协议，完整进度集中计划。\u003c/li>\n\u003cli>一个规则只写一次；字段全集链接契约，命令链接操作指南。跨页引用优于复制长段。\u003c/li>\n\u003cli>明确设计要求、局部实现与已验证行为。不能删掉权限、冻结、批准、原请求、事务/结果未知和兼容条件来缩短文档。\u003c/li>\n\u003cli>README/AGENTS 用日文，设计正文用中文，标识符不翻译。每页一个 H1，标题层级不跳号。\u003c/li>\n\u003cli>标题保持稳定；合并/删除时同步现行链接，不留空章节。旧代码编号仅由\u003ca href=\"#docs/README.md::%E6%97%A7%E7%95%AA%E5%8F%B7%E3%81%AE%E5%AF%BE%E5%BF%9C\">对应表\u003c/a>解释。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"一次整理的更新顺序\">一次整理的更新顺序\u003c/h2>\n\u003cp>核对正本及相关代码/契约 → 精简正文和重复入口 → 检查链接/示例并生成浏览版 → 工具回归与实际浏览。\n保留无关改动，不重导出 OpenAPI 来掩盖差距；交付说明本次验证和未覆盖范围，不复制旧测试次数。\u003c/p>\n\u003ch2 id=\"生成和验证浏览版\">生成和验证浏览版\u003c/h2>\n\u003cp>在 \u003ccode>SKM/\u003c/code> 执行；已有依赖不重复安装：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r scripts/docs-requirements.txt\npython3 scripts/build_docs.py\npython3 scripts/build_docs.py --check\npython3 -m unittest discover -s scripts/tests -v\n\u003c/code>\u003c/pre>\n\u003cp>build 校验标题、代码块、本地链接/锚点及 ViewSpec JSON，并由 Markdown + docs-viewer.html 覆盖生成 index.html；\u003ccode>--check\u003c/code> 不回写。\n只改正文时不动模板。\u003ccode>source_paths()\u003c/code> / \u003ccode>FIRST_PAGES\u003c/code> 分别控制收录与阅读顺序。\u003c/p>\n\u003cp>外置依赖用 PYTHONPATH，检查用 PYTHONDONTWRITEBYTECODE=1，不建 venv、不清理用户已有文件。\n若检查 Python 工具，Ruff 显式使用 \u003ccode>--config backend/pyproject.toml --no-cache\u003c/code>。\u003c/p>\n\u003ch3 id=\"可重复执行的浏览器检查\">可重复执行的浏览器检查\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/scripts/check_docs_browser.py\">检查脚本\u003c/a>离线打开 file 页面，阻断并报告 HTTP(S)，不启动业务应用或执行正文命令。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r web/tests/browser/requirements.txt\npython3 -m playwright install chromium\nPYTHONDONTWRITEBYTECODE=1 python3 scripts/check_docs_browser.py\n\u003c/code>\u003c/pre>\n\u003cp>首次安装需下载；已有依赖/浏览器分别通过 PYTHONPATH / PLAYWRIGHT_BROWSERS_PATH 复用。\n\u003ccode>--output \u0026lt;新的外部目录\u0026gt;\u003c/code> 才保存截图，固定名称会覆盖。\u003c/p>\n\u003cp>覆盖页面、章节焦点/原生刷新、真实链接、搜索、前进后退、键盘、打印及旧模块书签。\n字体 16/24px，宽度 320/390/768/1440px；原生刷新先检查，不先修补位置。正文修改检查涉及的浏览路径，viewer/导航改动执行全量回归。\u003c/p>\n\u003ch3 id=\"人工浏览检查\">人工浏览检查\u003c/h3>\n\u003cp>抽看修改入口、长表和流程：标题完整露出固定栏下方，按钮不碎成竖排，整页不横向溢出。\n宽表/图可局部滚动并提示，不能隐藏限制列或缩小全页字号。搜索文字不得变成可执行 HTML。\u003c/p>\n\u003cp>文档检查不证明业务、真实 DB、模型或部署完成；相关验证见\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">本地开发\u003c/a>。\u003c/p>\n", "sections": [{"title": "文档维护约定", "level": "h1", "anchor": "文档维护约定", "text": "# 文档维护约定\n\n文档只服务当前开发与运行：规则有唯一正本，进度只写计划，不新增历史整理页或特定业务项目的说明。"}, {"title": "正本与派生内容", "level": "h2", "anchor": "正本与派生内容", "text": "## 正本与派生内容\n\n| 内容 | 正本 |\n| --- | --- |\n| 产品、术语、结构 | overview/ |\n| 领域规则、失败恢复、兼容、验收 | design/ |\n| 当前基础、缺口、优先顺序 | planning/roadmap.md |\n| 开发与验证 / 部署与排障 | development/ / operations/ |\n| 代码导航 / 必须遵守的规则 | SKM/README.md / SKM/AGENTS.md |\n| 按改动查阅的实现约束 | development/coding-rules.md |\n| 离线浏览版 | docs/index.html，由 Markdown 生成 |\n\n浏览版只收录 docs Markdown、工作区/代码根 README 和 AGENTS。Backend 短 README 用于打包，不重复导航；默认不建模块 README。\n禁止扩大扫描到 .env、配置、凭据、Gold、源码或 Skill 的 SKILL.md/references。执行资产不随文档整理修改。"}, {"title": "写一份设计", "level": "h2", "anchor": "写一份设计", "text": "## 写一份设计\n\n按“用途/非目标 → 责任与数据 → 流程及失败 → 实施入口与验收”组织，复杂关系才用短表或图。\n\n- 新内容优先替换原段，不追加“本轮完成”或迁移流水。设计保留限制及待接协议，完整进度集中计划。\n- 一个规则只写一次；字段全集链接契约，命令链接操作指南。跨页引用优于复制长段。\n- 明确设计要求、局部实现与已验证行为。不能删掉权限、冻结、批准、原请求、事务/结果未知和兼容条件来缩短文档。\n- README/AGENTS 用日文，设计正文用中文，标识符不翻译。每页一个 H1，标题层级不跳号。\n- 标题保持稳定；合并/删除时同步现行链接，不留空章节。旧代码编号仅由[对应表](../README.md#旧番号の対応)解释。"}, {"title": "一次整理的更新顺序", "level": "h2", "anchor": "一次整理的更新顺序", "text": "## 一次整理的更新顺序\n\n核对正本及相关代码/契约 → 精简正文和重复入口 → 检查链接/示例并生成浏览版 → 工具回归与实际浏览。\n保留无关改动，不重导出 OpenAPI 来掩盖差距；交付说明本次验证和未覆盖范围，不复制旧测试次数。"}, {"title": "生成和验证浏览版", "level": "h2", "anchor": "生成和验证浏览版", "text": "## 生成和验证浏览版\n\n在 `SKM/` 执行；已有依赖不重复安装：\n\n```bash\npython3 -m pip install --user -r scripts/docs-requirements.txt\npython3 scripts/build_docs.py\npython3 scripts/build_docs.py --check\npython3 -m unittest discover -s scripts/tests -v\n```\n\nbuild 校验标题、代码块、本地链接/锚点及 ViewSpec JSON，并由 Markdown + docs-viewer.html 覆盖生成 index.html；`--check` 不回写。\n只改正文时不动模板。`source_paths()` / `FIRST_PAGES` 分别控制收录与阅读顺序。\n\n外置依赖用 PYTHONPATH，检查用 PYTHONDONTWRITEBYTECODE=1，不建 venv、不清理用户已有文件。\n若检查 Python 工具，Ruff 显式使用 `--config backend/pyproject.toml --no-cache`。"}, {"title": "可重复执行的浏览器检查", "level": "h3", "anchor": "可重复执行的浏览器检查", "text": "### 可重复执行的浏览器检查\n\n[检查脚本](../../SKM/scripts/check_docs_browser.py)离线打开 file 页面，阻断并报告 HTTP(S)，不启动业务应用或执行正文命令。\n\n```bash\npython3 -m pip install --user -r web/tests/browser/requirements.txt\npython3 -m playwright install chromium\nPYTHONDONTWRITEBYTECODE=1 python3 scripts/check_docs_browser.py\n```\n\n首次安装需下载；已有依赖/浏览器分别通过 PYTHONPATH / PLAYWRIGHT_BROWSERS_PATH 复用。\n`--output \u003c新的外部目录>` 才保存截图，固定名称会覆盖。\n\n覆盖页面、章节焦点/原生刷新、真实链接、搜索、前进后退、键盘、打印及旧模块书签。\n字体 16/24px，宽度 320/390/768/1440px；原生刷新先检查，不先修补位置。正文修改检查涉及的浏览路径，viewer/导航改动执行全量回归。"}, {"title": "人工浏览检查", "level": "h3", "anchor": "人工浏览检查", "text": "### 人工浏览检查\n\n抽看修改入口、长表和流程：标题完整露出固定栏下方，按钮不碎成竖排，整页不横向溢出。\n宽表/图可局部滚动并提示，不能隐藏限制列或缩小全页字号。搜索文字不得变成可执行 HTML。\n\n文档检查不证明业务、真实 DB、模型或部署完成；相关验证见[本地开发](local-development.md#変更に応じた検証)。"}], "toc": [{"title": "正本与派生内容", "anchor": "正本与派生内容", "level": "h2"}, {"title": "写一份设计", "anchor": "写一份设计", "level": "h2"}, {"title": "一次整理的更新顺序", "anchor": "一次整理的更新顺序", "level": "h2"}, {"title": "生成和验证浏览版", "anchor": "生成和验证浏览版", "level": "h2"}, {"title": "可重复执行的浏览器检查", "anchor": "可重复执行的浏览器检查", "level": "h3"}, {"title": "人工浏览检查", "anchor": "人工浏览检查", "level": "h3"}], "source": "development/documentation.md", "checksum": "9aa94db7d4d9db0c323c47b5f493d3b7f4e5bca13640b9ce24f523043366ae5d"}, {"id": "docs/operations/quickstart.md", "title": "起動と初期管理者", "group": "operations", "html": "\u003ch1 id=\"起動と初期管理者\">起動と初期管理者\u003c/h1>\n\u003cp>初回起動の手順。更新は\u003ca href=\"#docs/operations/deployment.md::\">公開・移行\u003c/a>、復元は\u003ca href=\"#docs/operations/backup-recovery.md::\">backup\u003c/a>、故障は \u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a>へ。コマンドは対象環境の \u003ccode>SKM/\u003c/code> で実行する。\u003c/p>\n\u003ch2 id=\"compose-の前提\">Compose の前提\u003c/h2>\n\u003cp>Linux、Python 3.12 標準 library、Docker Engine / Compose v2、共有 Traefik と external edge network が必要。config JSON / up --wait 対応版を対象環境で検証する。Traefik の配備と host port 公開は行わない。\u003c/p>\n\u003cp>\u003ccode>.env\u003c/code> が無い初回だけ実行し、既存設定を上書きしない。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">umask 077\ncp .env.example .env\n\u003c/code>\u003c/pre>\n\u003cp>host/context path、Traefik、DB/storage password、model を設定し、production は HTTPS を使う。\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">共通入口\u003c/a>の ENV_FILE を使い、非既定 project は shell の COMPOSE_PROJECT_NAME または明示 option で選ぶ（ファイル内同名値は無効）。\u003c/p>\n\u003cp>新 storage 世代の UUID を \u003ccode>SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID\u003c/code> に設定し、API/Worker と復元清単で共有する。再作成時は新 UUID、未設定では文書 blob 操作を拒否する。旧文書は自動帰属されないため\u003ca href=\"#docs/design/document-lifecycle.md::%E5%AD%98%E5%82%A8%E5%BD%92%E5%B1%9E%E4%B8%8E%E9%85%8D%E7%BD%AE%E5%88%87%E6%8D%A2\">移行条件\u003c/a>を確認する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make config\nmake build\n\u003c/code>\u003c/pre>\n\u003cp>失敗時は停止する。config は Secret を表示しない。検証済み image を移送した場合だけ build を省き、\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E5%89%8D%E7%BD%AE%E4%B8%8E%E6%89%A7%E8%A1%8C\">配備清単\u003c/a>と確認変数を使って deploy-load を行う。新規環境も同名 project の不存在、入口閉鎖、復元手段を確認する。\u003c/p>\n\u003cp>承認済み環境で基盤 service と bucket を順に作成する。失敗時は進まない：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- up -d --no-build --no-deps --pull never --wait postgres redis object-storage\npython3 scripts/compose.py -- up --no-build --no-deps --pull never --exit-code-from object-storage-init object-storage-init\n\u003c/code>\u003c/pre>\n\u003cp>同じ清単/変数で \u003ccode>make deploy-migrate\u003c/code> → \u003ccode>make deploy-api\u003c/code> を個別実行する。make run も API/Web のみ。ADMIN/権限確認後に\u003ca href=\"#docs/operations/deployment.md::%E5%90%AF%E5%8A%A8%E4%B8%8E%E6%94%BE%E8%A1%8C\">背景放行\u003c/a>を別途承認する。preflight は DB/Redis の基線であり業務保証ではない。\u003c/p>\n\u003cp>新 Run/Effect 配送には \u003ccode>SKILLMIND_WORKER_DISPATCH_ENABLED=true\u003c/code> が必要。既定 false でも既存 job/Schedule/recovery は止まらず、\u003ca href=\"#docs/operations/deployment.md::%E4%B8%80%E4%B8%AA%E4%BE%8B%E5%AD%90%E5%85%B3%E9%97%AD-dispatch-%E5%90%8E%E4%BB%8D%E6%9C%89%E5%B7%A5%E4%BD%9C\">保守 mode ではない\u003c/a>。\u003c/p>\n\u003ch2 id=\"最初の-admin-を作成する\">最初の ADMIN を作成する\u003c/h2>\n\u003cp>migration 成功後、既存データを消さない CLI を一度実行する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- exec api python -m skillmind.ops.bootstrap_admin\n\u003c/code>\u003c/pre>\n\u003cp>email/display name/password を対話入力し、既定 Organization に ADMIN と CREATED 安全イベントを追加する。DISABLED を含め既存 ADMIN があれば拒否する。匿名 API や password 再設定/復元機能ではない。\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>make bootstrap-admin\u003c/code> は PostgreSQL・Redis・object storage・Run workspace の全 volume を削除する再初期化。通常の管理者作成には使わない。\u003c/strong> 全消去を明示的に選び、対象と復元手段を確認した場合だけ使用する。\u003c/p>\n\u003ch2 id=\"最初の業務実行\">最初の業務実行\u003c/h2>\n\u003col>\n\u003cli>ADMIN でログインし、Project とメンバーを用意する。\u003c/li>\n\u003cli>Skill を導入・解釈・確認・公開し、Project で精確 SkillVersion を有効化する。\u003c/li>\n\u003cli>必要な Integration、SecretReference、binding と文書を用意する。\u003c/li>\n\u003cli>Task Center で就緒度と入力を確認し、Workspace で実行する。\u003c/li>\n\u003cli>待機、結果、Evidence と Evaluation を確認する。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"image-移送と更新\">Image 移送と更新\u003c/h2>\n\u003cp>Windows PowerShell の \u003ccode>SKM/\u003c/code> で \u003ccode>./scripts/export-images.ps1\u003c/code>（Python 3.12、必要なら -PythonCommand）を実行する。既定出力は \u003ccode>images/skillmind-images.tar\u003c/code>。build/pull はせず、application image 不足は失敗、第三者 image 不足は警告して除外する。context path 変更時は Web を再 build する。\u003c/p>\n\u003cp>既存 tar は既定で上書きしない。-ArchiveName で版別に保存し、-Force は成功後に同名 tar を置換するため唯一の回退資産には使わない；失敗時は旧 tar を保持する。実 image ID と送受信双方の checksum を清単で照合するが、checksum は出所の真正性を証明しない。export 成功後に\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E5%89%8D%E7%BD%AE%E4%B8%8E%E6%89%A7%E8%A1%8C\">公開・移行\u003c/a>へ進み、旧 image を保持する。make deploy は help のみで、失敗後に自動続行しない。\u003c/p>\n\u003ch2 id=\"操作の区別\">操作の区別\u003c/h2>\n\u003cp>\u003ccode>make\u003c/code> は状態表示、\u003ccode>make stop\u003c/code> は container を保持して停止、\u003ccode>make down\u003c/code> は container/network を削除して永続 volume を保持する。起動・更新・全初期化の代用にはしない。\u003c/p>\n", "sections": [{"title": "起動と初期管理者", "level": "h1", "anchor": "起動と初期管理者", "text": "# 起動と初期管理者\n\n初回起動の手順。更新は[公開・移行](deployment.md)、復元は[backup](backup-recovery.md)、故障は [Runbook](runbook.md)へ。コマンドは対象環境の `SKM/` で実行する。"}, {"title": "Compose の前提", "level": "h2", "anchor": "compose-の前提", "text": "## Compose の前提\n\nLinux、Python 3.12 標準 library、Docker Engine / Compose v2、共有 Traefik と external edge network が必要。config JSON / up --wait 対応版を対象環境で検証する。Traefik の配備と host port 公開は行わない。\n\n`.env` が無い初回だけ実行し、既存設定を上書きしない。\n\n```bash\numask 077\ncp .env.example .env\n```\n\nhost/context path、Traefik、DB/storage password、model を設定し、production は HTTPS を使う。[共通入口](deployment.md#环境文件与配置边界)の ENV_FILE を使い、非既定 project は shell の COMPOSE_PROJECT_NAME または明示 option で選ぶ（ファイル内同名値は無効）。\n\n新 storage 世代の UUID を `SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID` に設定し、API/Worker と復元清単で共有する。再作成時は新 UUID、未設定では文書 blob 操作を拒否する。旧文書は自動帰属されないため[移行条件](../design/document-lifecycle.md#存储归属与配置切换)を確認する。\n\n```bash\nmake config\nmake build\n```\n\n失敗時は停止する。config は Secret を表示しない。検証済み image を移送した場合だけ build を省き、[配備清単](deployment.md#迁移前置与执行)と確認変数を使って deploy-load を行う。新規環境も同名 project の不存在、入口閉鎖、復元手段を確認する。\n\n承認済み環境で基盤 service と bucket を順に作成する。失敗時は進まない：\n\n```bash\npython3 scripts/compose.py -- up -d --no-build --no-deps --pull never --wait postgres redis object-storage\npython3 scripts/compose.py -- up --no-build --no-deps --pull never --exit-code-from object-storage-init object-storage-init\n```\n\n同じ清単/変数で `make deploy-migrate` → `make deploy-api` を個別実行する。make run も API/Web のみ。ADMIN/権限確認後に[背景放行](deployment.md#启动与放行)を別途承認する。preflight は DB/Redis の基線であり業務保証ではない。\n\n新 Run/Effect 配送には `SKILLMIND_WORKER_DISPATCH_ENABLED=true` が必要。既定 false でも既存 job/Schedule/recovery は止まらず、[保守 mode ではない](deployment.md#一个例子关闭-dispatch-后仍有工作)。"}, {"title": "最初の ADMIN を作成する", "level": "h2", "anchor": "最初の-admin-を作成する", "text": "## 最初の ADMIN を作成する\n\nmigration 成功後、既存データを消さない CLI を一度実行する。\n\n```bash\npython3 scripts/compose.py -- exec api python -m skillmind.ops.bootstrap_admin\n```\n\nemail/display name/password を対話入力し、既定 Organization に ADMIN と CREATED 安全イベントを追加する。DISABLED を含め既存 ADMIN があれば拒否する。匿名 API や password 再設定/復元機能ではない。\n\n**`make bootstrap-admin` は PostgreSQL・Redis・object storage・Run workspace の全 volume を削除する再初期化。通常の管理者作成には使わない。** 全消去を明示的に選び、対象と復元手段を確認した場合だけ使用する。"}, {"title": "最初の業務実行", "level": "h2", "anchor": "最初の業務実行", "text": "## 最初の業務実行\n\n1. ADMIN でログインし、Project とメンバーを用意する。\n2. Skill を導入・解釈・確認・公開し、Project で精確 SkillVersion を有効化する。\n3. 必要な Integration、SecretReference、binding と文書を用意する。\n4. Task Center で就緒度と入力を確認し、Workspace で実行する。\n5. 待機、結果、Evidence と Evaluation を確認する。"}, {"title": "Image 移送と更新", "level": "h2", "anchor": "image-移送と更新", "text": "## Image 移送と更新\n\nWindows PowerShell の `SKM/` で `./scripts/export-images.ps1`（Python 3.12、必要なら -PythonCommand）を実行する。既定出力は `images/skillmind-images.tar`。build/pull はせず、application image 不足は失敗、第三者 image 不足は警告して除外する。context path 変更時は Web を再 build する。\n\n既存 tar は既定で上書きしない。-ArchiveName で版別に保存し、-Force は成功後に同名 tar を置換するため唯一の回退資産には使わない；失敗時は旧 tar を保持する。実 image ID と送受信双方の checksum を清単で照合するが、checksum は出所の真正性を証明しない。export 成功後に[公開・移行](deployment.md#迁移前置与执行)へ進み、旧 image を保持する。make deploy は help のみで、失敗後に自動続行しない。"}, {"title": "操作の区別", "level": "h2", "anchor": "操作の区別", "text": "## 操作の区別\n\n`make` は状態表示、`make stop` は container を保持して停止、`make down` は container/network を削除して永続 volume を保持する。起動・更新・全初期化の代用にはしない。"}], "toc": [{"title": "Compose の前提", "anchor": "compose-の前提", "level": "h2"}, {"title": "最初の ADMIN を作成する", "anchor": "最初の-admin-を作成する", "level": "h2"}, {"title": "最初の業務実行", "anchor": "最初の業務実行", "level": "h2"}, {"title": "Image 移送と更新", "anchor": "image-移送と更新", "level": "h2"}, {"title": "操作の区別", "anchor": "操作の区別", "level": "h2"}], "source": "operations/quickstart.md", "checksum": "a614320bd7fb3c5621f94047a05312d135e6f9495a0f8eaf51ccd06c03f46214"}, {"id": "docs/operations/deployment.md", "title": "发布、迁移与分阶段放行", "group": "operations", "html": "\u003ch1 id=\"发布迁移与分阶段放行\">发布、迁移与分阶段放行\u003c/h1>\n\u003cp>已有环境的发布手册；首次准备见\u003ca href=\"#docs/operations/quickstart.md::\">启动\u003c/a>，数据替换见\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复\u003c/a>。命令在目标 \u003ccode>SKM/\u003c/code> 执行，先确认环境、维护窗口、版本与负责人；未知目标不试运行。\u003c/p>\n\u003cp>本工程按 Skillmind 全新命名部署，不保留旧产品标识或旧数据兼容层；既有 volume、数据库、队列和对象存储不会自动迁移。使用独立的新环境初始化，旧环境数据按其原版本保全。镜像只包含 system Interpreter Skill；合成测试素材仅保存在 \u003ccode>backend/tests\u003c/code>，业务 Skill 在部署后导入。\u003c/p>\n\u003ch2 id=\"先分清四种操作\">先分清四种操作\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>config / preflight\u003c/td>\n\u003ctd>配置解析 / DB migration 与 Redis PING，不证明业务就绪\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>build / export / load\u003c/td>\n\u003ctd>构建镜像 / 打包本地镜像 / 导入 archive，不是备份或应用验收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>migration\u003c/td>\n\u003ctd>改变 DB；失败后查实际 revision，不用 stamp 掩盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>启动 / 放行\u003c/td>\n\u003ctd>进程启动可能消费旧工作；后台恢复和普通业务开放分别批准\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"一个例子关闭-dispatch-后仍有工作\">一个例子：关闭 dispatch 后仍有工作\u003c/h2>\n\u003cp>已入 Redis 的 Effect 和即将到期的 Schedule，不会因 \u003ccode>SKILLMIND_WORKER_DISPATCH_ENABLED=false\u003c/code> 自动停止：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>入口\u003c/th>\n\u003cth>false 时的实际行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Outbox relay\u003c/td>\n\u003ctd>不选择新的 Run/Effect dispatch topic，lifecycle 通知仍可配送\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已入队 Run/Effect job\u003c/td>\n\u003ctd>仍可进入 claim/executor；不检查该开关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schedule / recovery cron\u003c/td>\n\u003ctd>仍可创建 Run、处理期限和恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill 解释/调整 job\u003c/td>\n\u003ctd>独立入口，仍可能调用模型\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>入口见 \u003ca href=\"../SKM/backend/src/skillmind/worker/settings.py\">WorkerSettings\u003c/a>。开关不是维护模式，不终止远端请求，环境修改也不即时重载。停写须关闭全部入口/触发、处理在途并确认所有 API/Worker 实例停止；远端未知则隔离，按\u003ca href=\"#docs/operations/runbook.md::incident-%E4%B8%8E-recovery\">原 Effect 对账\u003c/a>，不换键重做。\u003c/p>\n\u003ch2 id=\"环境文件与配置边界\">环境文件与配置边界\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/Makefile\">Makefile\u003c/a>和镜像导出共用 \u003ca href=\"../SKM/scripts/compose.py\">compose.py\u003c/a>，仅需宿主 Python 3.12 标准库；Windows 可指定 executable。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选择\u003c/th>\n\u003cth>唯一来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>环境文件\u003c/td>\n\u003ctd>显式 \u003ccode>--env-file\u003c/code> → shell \u003ccode>ENV_FILE\u003c/code> → \u003ccode>SKM/.env\u003c/code>，解析为同一绝对文件路径，供插值和 API/Worker/migrate 的 env_file 使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compose project\u003c/td>\n\u003ctd>显式 \u003ccode>--project-name\u003c/code> → shell \u003ccode>COMPOSE_PROJECT_NAME\u003c/code> → skillmind；\u003cstrong>文件内同名变量不选择目标\u003c/strong>，旧的非默认部署须显式指定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compose 文件 / 目录\u003c/td>\n\u003ctd>固定本套代码的 compose.yaml / SKM；拒绝旁路 file、project、profile 选择器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>应用镜像\u003c/td>\n\u003ctd>普通入口固定默认 tag；发布入口显式 pin Backend/Web 的完整 sha256 image ID，三 Backend service 共用同一 ID\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>例如 \u003ccode>python3 scripts/compose.py --env-file /controlled/config/app.env --project-name approved-project -- config --quiet\u003c/code>。相对路径以 \u003ccode>SKM/\u003c/code> 为准，缺失/空路径拒绝；不手设内部 SKM_COMPOSE_ENV_FILE 或绕过入口。\u003c/p>\n\u003cp>保留 Docker 优先级：shell 插值高于文件，service.environment 高于 env_file，不 source dotenv。切换 ENV_FILE 不改现有进程/容器/DB URL/外部资源，须另核目标；见\u003ca href=\"https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/\">插值规则\u003c/a>和 \u003ca href=\"https://docs.docker.com/reference/compose-file/services/#env_file\">env_file\u003c/a>。\u003c/p>\n\u003cp>日常用 \u003ccode>make config\u003c/code>（quiet）；完整 config、容器 env/inspect 可泄密，不进报告。发布工具只内部比较有效环境，不输出或保存值。\u003c/p>\n\u003cp>文档存储必配 SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID，由同世代 API/Worker 与恢复清单共享；未配置拒绝 blob 操作。UUID 与 endpoint/bucket 共同校验，新建存储换 UUID、凭据轮换不换身份。旧文档不自动绑定，按\u003ca href=\"#docs/design/document-lifecycle.md::%E5%AD%98%E5%82%A8%E5%BD%92%E5%B1%9E%E4%B8%8E%E9%85%8D%E7%BD%AE%E5%88%87%E6%8D%A2\">归属迁移\u003c/a>处理；health/preflight 或改配置不能替代。\u003c/p>\n\u003ch2 id=\"迁移前置与执行\">迁移前置与执行\u003c/h2>\n\u003cp>先在独立环境验收 API/Worker/migrate/Web 兼容组合，取得\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E6%81%A2%E5%A4%8D%E7%82%B9%E5%8C%85%E5%90%AB%E4%BB%80%E4%B9%88\">一致恢复点\u003c/a>，保留新旧 image ID/archive。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">恢复点 → 全实例停写/在途对账 → 加载镜像 → 查 revision/head\n  → 单独迁移 → API/Web 核对 → 批准恢复后台 → 验收 → 普通入口放行\n\u003c/code>\u003c/pre>\n\u003cp>各阶段独立批准，不凭上一阶段文件自动放行。从受控清单确认以下变量，不照抄示例身份：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变量\u003c/th>\n\u003cth>确认内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ENV_FILE / COMPOSE_PROJECT_NAME\u003c/td>\n\u003ctd>已批准的配置文件和目标项目，后续各命令保持一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DAEMON_ID\u003c/td>\n\u003ctd>目标 \u003ccode>docker info --format '{{.ID}}'\u003c/code>，同名项目不能跨 daemon 复用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BACKEND_IMAGE_ID / WEB_IMAGE_ID\u003c/td>\n\u003ctd>经验证的完整 \u003ccode>sha256:…\u003c/code> image ID，不是 tag、短 hash 或 registry manifest digest\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IMAGE_ARCHIVE / ARCHIVE_SHA256\u003c/td>\n\u003ctd>可信 Docker save tar 与已核实的完整文件 checksum；只读受控保存，不允许并发改写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MAINTENANCE_CONFIRMED=1\u003c/td>\n\u003ctd>恢复点、全部实例停写/在途对账、普通入口关闭、独占维护责任均已人工确认\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ccode>make deploy\u003c/code> 只显示帮助，无状态变化。确认后逐个执行，不拼成自动继续的命令链：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make deploy-load\nmake deploy-migrate\n\u003c/code>\u003c/pre>\n\u003cp>Make 要求 shell 显式导出清单变量，缺确认/身份即拒绝；等价参数见 \u003ccode>python3 scripts/deploy.py \u0026lt;phase\u0026gt; --help\u003c/code>。load 不删旧容器/镜像，先验 tar checksum 与两个必需 tag 的唯一 config digest，再从同一打开文件导入、按 ID 复查。archive 缺项不能用本地旧 tag 补，缺 manifest/含糊多平台映射拒绝。\u003c/p>\n\u003cp>migrate 前自行确认 PostgreSQL/Redis 健康、storage 运行和当前 bucket 初始化成功，发布不隐式启动基建。工具检查同 daemon/project 全部容器（含 orphan/one-off）并拒绝活动写入者；目标镜像的 \u003ccode>preflight --migration-plan\u003c/code> 须确认全部 revision、单 head 和合法前进路径，单独 upgrade 后再验 DB head/Redis。\u003c/p>\n\u003cp>只读排查 current/heads 也须用相同配置和已核实镜像。以下默认 tag 的实际 ID 必须与清单一致：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- run --rm -T --no-deps --pull never migrate alembic current\npython3 scripts/compose.py -- run --rm -T --no-deps --pull never migrate alembic heads\n\u003c/code>\u003c/pre>\n\u003cp>revision 越链、多 head 或检查失败即停，核对已提交 revision 后决定 forward fix/完整恢复。不改 alembic_version/stamp；此前 revision、非事务操作及外部事实不自动回滚。\u003c/p>\n\u003ch2 id=\"迁移与回退审查\">迁移与回退审查\u003c/h2>\n\u003cp>每次发布审查\u003ca href=\"../SKM/backend/migrations/versions\">实际 upgrade/downgrade\u003c/a>和消费者，不从下表推导可任意降级：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>revision\u003c/th>\n\u003cth>回退限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>0018–0021\u003c/td>\n\u003ctd>组织共享不能还原成单 Project；新结果包络、Segment/Interaction/Effect 不由旧 Worker 自动兼容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0022–0023\u003c/td>\n\u003ctd>降级可能丢用户偏好/密文材料；已有引用与旧 KEK 必须保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0025–0028\u003c/td>\n\u003ctd>调度/生成版本/索引/审计可能丢失。0027 在 DDL 前锁表，子 Session、无 SDK ID、BRANCH 或旧唯一键冲突均拒绝；仅旧 PRIMARY 可无损表示的数据可降级，不删审计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0029 输入回执\u003c/td>\n\u003ctd>任何回执行存在时拒绝降级，不仅 READY；不能删回执绕过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0030 预算账本\u003c/td>\n\u003ctd>三表任一有数据即拒绝降级，包括已结算记录；不为旧 Run 补造账户，无通用核对/退款 CLI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0031 会话 v2\u003c/td>\n\u003ctd>旧会话需重登，任何 v2 行（含撤销）阻止丢列；新旧 API 不混跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0032 用户生命周期\u003c/td>\n\u003ctd>初始化旧版本、不造事件；任何安全事件阻止降级，API/页面与真实 DB 分别验收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0033 成员审计\u003c/td>\n\u003ctd>不补旧事件；任何事件阻止降级/整项目删除。成员/账户/偏好/项目删除共用组织锁，旧 writer 不混跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0034 项目版本\u003c/td>\n\u003ctd>旧版 1 不代表历史次数；任一版本 \u0026gt;1 拒绝丢列。API/Web 成套切换，缺原版本为 422、不补版；回退前全停写/在途核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0035 调用绑定/观察\u003c/td>\n\u003ctd>旧预约不补调用历史；锁表后，任何非空绑定字段或观察记录拒绝降级，观察对原预约为 RESTRICT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0036 调度 occurrence\u003c/td>\n\u003ctd>旧行 protocol=0，不补历史；旧 writer 不混跑。RESTRICT 保留引用；锁表后任一 occurrence、protocol=1 或 configuration_version≠1 均拒绝降级，不删记录绕过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0037 文档存储归属\u003c/td>\n\u003ctd>旧行不绑定，新写保存完整身份；任一归属非空拒绝丢列。旧 API/Worker 不混跑，迁移不证明旧 blob 可读/可清理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0038 原上传意图\u003c/td>\n\u003ctd>PUT 前保存原请求/占用，发布/清理不删除；意图/关联阻止降级。POST 必填 Idempotency-Key，缺失 422；API/Web 成套切换、旧 writer 不混跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0039 文档清理记录\u003c/td>\n\u003ctd>删除前保存原对象/元信息/DELETE 身份，不造旧上传历史；任一记录阻止降级，文档/意图/清理阻止整项目删除；旧删除 writer 不混跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0040 附件字节\u003c/td>\n\u003ctd>新字段全空为未发布，不回填；任一非空拒绝降级。API/Web 理解 checks v2，Worker/Interpreter/Tool catalog 配套；保留 write/v1，不给旧 Skill/Run 升权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0041 评价原请求\u003c/td>\n\u003ctd>原键/hash 同事务保存，旧行空值；任一绑定非空拒绝丢列。API/新 Web 配套提交/确认/分页，旧接口无新增重放保证，不删评价绕回退\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0042 停止待发布\u003c/td>\n\u003ctd>关闭标记/独立审计同存，不改原回执/占用；任一存在拒绝降级。API/Web 配套；DB CHECK 拒绝旧 SQL 发布已关闭项，但不阻止旧 PUT 或替代停写/对账\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0043 预算启动所有权\u003c/td>\n\u003ctd>旧行不造 owner，新绑定存 token hash；任一 owner 痕迹拒绝丢列。旧调用方不混跑，hash/迁移不证明模型未启动、停止或计量完整\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>有表/旧页面可读不证明功能接齐或非终态可续行；预算另过\u003ca href=\"#docs/design/run-budgets.md::%E4%B8%8A%E7%BA%BF%E9%97%A8%E7%A6%81%E4%B8%8E%E6%8E%A5%E7%BA%BF%E9%A1%BA%E5%BA%8F\">混合 Worker 门禁\u003c/a>。兼容未知保持停写，按\u003ca href=\"#docs/operations/backup-recovery.md::%E5%BA%94%E7%94%A8%E7%89%88%E6%9C%AC%E5%9B%9E%E9%80%80\">回退\u003c/a>处理，不删审计/快照/未决占用凑条件。\u003c/p>\n\u003ch2 id=\"会话协议切换检查\">会话协议切换检查\u003c/h2>\n\u003col>\n\u003cli>核清全部入口/实例，保全未确认动作 ID/key、通知重登，排空并停旧 API。\u003c/li>\n\u003cli>隔离环境验旧行升级、新登录/失效和降级拒绝；head 正确后才开新 API。\u003c/li>\n\u003cli>同一 v2 参数下以真实 HTTPS 验多页/多实例 CSRF、失效和 no-store，不采集原凭据或探测真实用户密码。\u003c/li>\n\u003cli>失败关闭入口，选 forward fix/完整恢复，不改默认 version、删会话或直接回旧镜像。\u003c/li>\n\u003c/ol>\n\u003cp>旧备份可能复活撤销会话，须另核；字符串字段不证明旧 Web 兼容，重登与后台放行分别审核。正本见\u003ca href=\"#docs/design/authentication.md::%E4%BC%9A%E8%AF%9D%E5%87%AD%E6%8D%AE-v2-%E4%B8%8E%E5%88%87%E6%8D%A2%E8%A6%81%E6%B1%82\">认证\u003c/a>。\u003c/p>\n\u003ch2 id=\"启动与放行\">启动与放行\u003c/h2>\n\u003cp>保持 Worker 停止、普通入口关闭。迁移阶段成功后，使用同一清单与已确认的维护变量，只启动 API/Web：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make deploy-api\nmake\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>make run\u003c/code> 是 deploy-api 别名。工具固定 --no-build/--no-deps/--pull never，等 health 并复验 image ID/有效环境/preflight；基建/初始化缺失、配置不符或失败即停，不删保护参数。preflight 不验 blob/KEK/认证/模型/恢复，须另核权限、Run/结果/证据和输入；授权 GET 可更新 idle，不是备份所需完全停写。\u003c/p>\n\u003cp>核清旧队列和在途 Run/Effect/Schedule，另获准恢复本环境全部后台工作（MAINTENANCE_CONFIRMED 不含此授权），再执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make deploy-worker BACKGROUND_APPROVED=1\n\u003c/code>\u003c/pre>\n\u003cp>工具复查目标、API/Web 配置/镜像/health/preflight 后仅开 Worker；无独立业务 healthcheck，运行状态不证明旧工作已核清。先只开获准 \u003ca href=\"#docs/operations/runbook.md::%E9%80%9A%E5%B8%B8-smoke\">smoke\u003c/a>，通过后人工开放普通业务，失败隔离并保留事实。\u003c/p>\n\u003cp>smoke 会写入/计费，须隔离 DB、Redis/队列、存储、Worker、凭据；单独 Project 不隔离旧 job/cron，当前无“只消费测试 Project”模式，不得跳过后台许可。\u003c/p>\n\u003cp>任何阶段失败/超时/中断不自动续行、回滚或重发：镜像可能部分导入、迁移已提交、服务已启动。先核原事实；重调用不会自动把活动容器当作上次成功跳过。\u003c/p>\n\u003ch2 id=\"后续开发约束与验收\">后续开发约束与验收\u003c/h2>\n\u003cp>脚本不控制共享 Traefik、其他 daemon/进程或远端效果，不是跨实例锁/授权系统。独占维护时不得并发改配置、镜像、context 或启动其他 writer；确认变量只是声明，不证明全局停写。\u003c/p>\n\u003cp>\u003ca href=\"#docs/planning/roadmap.md::r11-%E8%BF%90%E7%BB%B4%E4%B8%8E%E5%B7%A5%E7%A8%8B%E5%B7%A5%E5%85%B7\">R11\u003c/a>保留全实例停写/清理及真实恢复缺口。脚本回归只验参数、身份拒绝与失败不续行；实际 Compose/PowerShell、迁移事务、health/HTTPS 和业务放行须获准环境验收。\u003c/p>\n", "sections": [{"title": "发布、迁移与分阶段放行", "level": "h1", "anchor": "发布迁移与分阶段放行", "text": "# 发布、迁移与分阶段放行\n\n已有环境的发布手册；首次准备见[启动](quickstart.md)，数据替换见[恢复](backup-recovery.md)。命令在目标 `SKM/` 执行，先确认环境、维护窗口、版本与负责人；未知目标不试运行。\n\n本工程按 Skillmind 全新命名部署，不保留旧产品标识或旧数据兼容层；既有 volume、数据库、队列和对象存储不会自动迁移。使用独立的新环境初始化，旧环境数据按其原版本保全。镜像只包含 system Interpreter Skill；合成测试素材仅保存在 `backend/tests`，业务 Skill 在部署后导入。"}, {"title": "先分清四种操作", "level": "h2", "anchor": "先分清四种操作", "text": "## 先分清四种操作\n\n| 操作 | 范围 |\n| --- | --- |\n| config / preflight | 配置解析 / DB migration 与 Redis PING，不证明业务就绪 |\n| build / export / load | 构建镜像 / 打包本地镜像 / 导入 archive，不是备份或应用验收 |\n| migration | 改变 DB；失败后查实际 revision，不用 stamp 掩盖 |\n| 启动 / 放行 | 进程启动可能消费旧工作；后台恢复和普通业务开放分别批准 |"}, {"title": "一个例子：关闭 dispatch 后仍有工作", "level": "h2", "anchor": "一个例子关闭-dispatch-后仍有工作", "text": "## 一个例子：关闭 dispatch 后仍有工作\n\n已入 Redis 的 Effect 和即将到期的 Schedule，不会因 `SKILLMIND_WORKER_DISPATCH_ENABLED=false` 自动停止：\n\n| 入口 | false 时的实际行为 |\n| --- | --- |\n| Outbox relay | 不选择新的 Run/Effect dispatch topic，lifecycle 通知仍可配送 |\n| 已入队 Run/Effect job | 仍可进入 claim/executor；不检查该开关 |\n| Schedule / recovery cron | 仍可创建 Run、处理期限和恢复 |\n| Skill 解释/调整 job | 独立入口，仍可能调用模型 |\n\n入口见 [WorkerSettings](../../SKM/backend/src/skillmind/worker/settings.py)。开关不是维护模式，不终止远端请求，环境修改也不即时重载。停写须关闭全部入口/触发、处理在途并确认所有 API/Worker 实例停止；远端未知则隔离，按[原 Effect 对账](runbook.md#incident-与-recovery)，不换键重做。"}, {"title": "环境文件与配置边界", "level": "h2", "anchor": "环境文件与配置边界", "text": "## 环境文件与配置边界\n\n[Makefile](../../SKM/Makefile)和镜像导出共用 [compose.py](../../SKM/scripts/compose.py)，仅需宿主 Python 3.12 标准库；Windows 可指定 executable。\n\n| 选择 | 唯一来源 |\n| --- | --- |\n| 环境文件 | 显式 `--env-file` → shell `ENV_FILE` → `SKM/.env`，解析为同一绝对文件路径，供插值和 API/Worker/migrate 的 env_file 使用 |\n| Compose project | 显式 `--project-name` → shell `COMPOSE_PROJECT_NAME` → skillmind；**文件内同名变量不选择目标**，旧的非默认部署须显式指定 |\n| Compose 文件 / 目录 | 固定本套代码的 compose.yaml / SKM；拒绝旁路 file、project、profile 选择器 |\n| 应用镜像 | 普通入口固定默认 tag；发布入口显式 pin Backend/Web 的完整 sha256 image ID，三 Backend service 共用同一 ID |\n\n例如 `python3 scripts/compose.py --env-file /controlled/config/app.env --project-name approved-project -- config --quiet`。相对路径以 `SKM/` 为准，缺失/空路径拒绝；不手设内部 SKM_COMPOSE_ENV_FILE 或绕过入口。\n\n保留 Docker 优先级：shell 插值高于文件，service.environment 高于 env_file，不 source dotenv。切换 ENV_FILE 不改现有进程/容器/DB URL/外部资源，须另核目标；见[插值规则](https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/)和 [env_file](https://docs.docker.com/reference/compose-file/services/#env_file)。\n\n日常用 `make config`（quiet）；完整 config、容器 env/inspect 可泄密，不进报告。发布工具只内部比较有效环境，不输出或保存值。\n\n文档存储必配 SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID，由同世代 API/Worker 与恢复清单共享；未配置拒绝 blob 操作。UUID 与 endpoint/bucket 共同校验，新建存储换 UUID、凭据轮换不换身份。旧文档不自动绑定，按[归属迁移](../design/document-lifecycle.md#存储归属与配置切换)处理；health/preflight 或改配置不能替代。"}, {"title": "迁移前置与执行", "level": "h2", "anchor": "迁移前置与执行", "text": "## 迁移前置与执行\n\n先在独立环境验收 API/Worker/migrate/Web 兼容组合，取得[一致恢复点](backup-recovery.md#一致恢复点包含什么)，保留新旧 image ID/archive。\n\n```text\n恢复点 → 全实例停写/在途对账 → 加载镜像 → 查 revision/head\n  → 单独迁移 → API/Web 核对 → 批准恢复后台 → 验收 → 普通入口放行\n```\n\n各阶段独立批准，不凭上一阶段文件自动放行。从受控清单确认以下变量，不照抄示例身份：\n\n| 变量 | 确认内容 |\n| --- | --- |\n| ENV_FILE / COMPOSE_PROJECT_NAME | 已批准的配置文件和目标项目，后续各命令保持一致 |\n| DAEMON_ID | 目标 `docker info --format '{{.ID}}'`，同名项目不能跨 daemon 复用 |\n| BACKEND_IMAGE_ID / WEB_IMAGE_ID | 经验证的完整 `sha256:…` image ID，不是 tag、短 hash 或 registry manifest digest |\n| IMAGE_ARCHIVE / ARCHIVE_SHA256 | 可信 Docker save tar 与已核实的完整文件 checksum；只读受控保存，不允许并发改写 |\n| MAINTENANCE_CONFIRMED=1 | 恢复点、全部实例停写/在途对账、普通入口关闭、独占维护责任均已人工确认 |\n\n`make deploy` 只显示帮助，无状态变化。确认后逐个执行，不拼成自动继续的命令链：\n\n```bash\nmake deploy-load\nmake deploy-migrate\n```\n\nMake 要求 shell 显式导出清单变量，缺确认/身份即拒绝；等价参数见 `python3 scripts/deploy.py \u003cphase> --help`。load 不删旧容器/镜像，先验 tar checksum 与两个必需 tag 的唯一 config digest，再从同一打开文件导入、按 ID 复查。archive 缺项不能用本地旧 tag 补，缺 manifest/含糊多平台映射拒绝。\n\nmigrate 前自行确认 PostgreSQL/Redis 健康、storage 运行和当前 bucket 初始化成功，发布不隐式启动基建。工具检查同 daemon/project 全部容器（含 orphan/one-off）并拒绝活动写入者；目标镜像的 `preflight --migration-plan` 须确认全部 revision、单 head 和合法前进路径，单独 upgrade 后再验 DB head/Redis。\n\n只读排查 current/heads 也须用相同配置和已核实镜像。以下默认 tag 的实际 ID 必须与清单一致：\n\n```bash\npython3 scripts/compose.py -- run --rm -T --no-deps --pull never migrate alembic current\npython3 scripts/compose.py -- run --rm -T --no-deps --pull never migrate alembic heads\n```\n\nrevision 越链、多 head 或检查失败即停，核对已提交 revision 后决定 forward fix/完整恢复。不改 alembic_version/stamp；此前 revision、非事务操作及外部事实不自动回滚。"}, {"title": "迁移与回退审查", "level": "h2", "anchor": "迁移与回退审查", "text": "## 迁移与回退审查\n\n每次发布审查[实际 upgrade/downgrade](../../SKM/backend/migrations/versions/)和消费者，不从下表推导可任意降级：\n\n| revision | 回退限制 |\n| --- | --- |\n| 0018–0021 | 组织共享不能还原成单 Project；新结果包络、Segment/Interaction/Effect 不由旧 Worker 自动兼容 |\n| 0022–0023 | 降级可能丢用户偏好/密文材料；已有引用与旧 KEK 必须保留 |\n| 0025–0028 | 调度/生成版本/索引/审计可能丢失。0027 在 DDL 前锁表，子 Session、无 SDK ID、BRANCH 或旧唯一键冲突均拒绝；仅旧 PRIMARY 可无损表示的数据可降级，不删审计 |\n| 0029 输入回执 | 任何回执行存在时拒绝降级，不仅 READY；不能删回执绕过 |\n| 0030 预算账本 | 三表任一有数据即拒绝降级，包括已结算记录；不为旧 Run 补造账户，无通用核对/退款 CLI |\n| 0031 会话 v2 | 旧会话需重登，任何 v2 行（含撤销）阻止丢列；新旧 API 不混跑 |\n| 0032 用户生命周期 | 初始化旧版本、不造事件；任何安全事件阻止降级，API/页面与真实 DB 分别验收 |\n| 0033 成员审计 | 不补旧事件；任何事件阻止降级/整项目删除。成员/账户/偏好/项目删除共用组织锁，旧 writer 不混跑 |\n| 0034 项目版本 | 旧版 1 不代表历史次数；任一版本 >1 拒绝丢列。API/Web 成套切换，缺原版本为 422、不补版；回退前全停写/在途核对 |\n| 0035 调用绑定/观察 | 旧预约不补调用历史；锁表后，任何非空绑定字段或观察记录拒绝降级，观察对原预约为 RESTRICT |\n| 0036 调度 occurrence | 旧行 protocol=0，不补历史；旧 writer 不混跑。RESTRICT 保留引用；锁表后任一 occurrence、protocol=1 或 configuration_version≠1 均拒绝降级，不删记录绕过 |\n| 0037 文档存储归属 | 旧行不绑定，新写保存完整身份；任一归属非空拒绝丢列。旧 API/Worker 不混跑，迁移不证明旧 blob 可读/可清理 |\n| 0038 原上传意图 | PUT 前保存原请求/占用，发布/清理不删除；意图/关联阻止降级。POST 必填 Idempotency-Key，缺失 422；API/Web 成套切换、旧 writer 不混跑 |\n| 0039 文档清理记录 | 删除前保存原对象/元信息/DELETE 身份，不造旧上传历史；任一记录阻止降级，文档/意图/清理阻止整项目删除；旧删除 writer 不混跑 |\n| 0040 附件字节 | 新字段全空为未发布，不回填；任一非空拒绝降级。API/Web 理解 checks v2，Worker/Interpreter/Tool catalog 配套；保留 write/v1，不给旧 Skill/Run 升权 |\n| 0041 评价原请求 | 原键/hash 同事务保存，旧行空值；任一绑定非空拒绝丢列。API/新 Web 配套提交/确认/分页，旧接口无新增重放保证，不删评价绕回退 |\n| 0042 停止待发布 | 关闭标记/独立审计同存，不改原回执/占用；任一存在拒绝降级。API/Web 配套；DB CHECK 拒绝旧 SQL 发布已关闭项，但不阻止旧 PUT 或替代停写/对账 |\n| 0043 预算启动所有权 | 旧行不造 owner，新绑定存 token hash；任一 owner 痕迹拒绝丢列。旧调用方不混跑，hash/迁移不证明模型未启动、停止或计量完整 |\n\n有表/旧页面可读不证明功能接齐或非终态可续行；预算另过[混合 Worker 门禁](../design/run-budgets.md#上线门禁与接线顺序)。兼容未知保持停写，按[回退](backup-recovery.md#应用版本回退)处理，不删审计/快照/未决占用凑条件。"}, {"title": "会话协议切换检查", "level": "h2", "anchor": "会话协议切换检查", "text": "## 会话协议切换检查\n\n1. 核清全部入口/实例，保全未确认动作 ID/key、通知重登，排空并停旧 API。\n2. 隔离环境验旧行升级、新登录/失效和降级拒绝；head 正确后才开新 API。\n3. 同一 v2 参数下以真实 HTTPS 验多页/多实例 CSRF、失效和 no-store，不采集原凭据或探测真实用户密码。\n4. 失败关闭入口，选 forward fix/完整恢复，不改默认 version、删会话或直接回旧镜像。\n\n旧备份可能复活撤销会话，须另核；字符串字段不证明旧 Web 兼容，重登与后台放行分别审核。正本见[认证](../design/authentication.md#会话凭据-v2-与切换要求)。"}, {"title": "启动与放行", "level": "h2", "anchor": "启动与放行", "text": "## 启动与放行\n\n保持 Worker 停止、普通入口关闭。迁移阶段成功后，使用同一清单与已确认的维护变量，只启动 API/Web：\n\n```bash\nmake deploy-api\nmake\n```\n\n`make run` 是 deploy-api 别名。工具固定 --no-build/--no-deps/--pull never，等 health 并复验 image ID/有效环境/preflight；基建/初始化缺失、配置不符或失败即停，不删保护参数。preflight 不验 blob/KEK/认证/模型/恢复，须另核权限、Run/结果/证据和输入；授权 GET 可更新 idle，不是备份所需完全停写。\n\n核清旧队列和在途 Run/Effect/Schedule，另获准恢复本环境全部后台工作（MAINTENANCE_CONFIRMED 不含此授权），再执行：\n\n```bash\nmake deploy-worker BACKGROUND_APPROVED=1\n```\n\n工具复查目标、API/Web 配置/镜像/health/preflight 后仅开 Worker；无独立业务 healthcheck，运行状态不证明旧工作已核清。先只开获准 [smoke](runbook.md#通常-smoke)，通过后人工开放普通业务，失败隔离并保留事实。\n\nsmoke 会写入/计费，须隔离 DB、Redis/队列、存储、Worker、凭据；单独 Project 不隔离旧 job/cron，当前无“只消费测试 Project”模式，不得跳过后台许可。\n\n任何阶段失败/超时/中断不自动续行、回滚或重发：镜像可能部分导入、迁移已提交、服务已启动。先核原事实；重调用不会自动把活动容器当作上次成功跳过。"}, {"title": "后续开发约束与验收", "level": "h2", "anchor": "后续开发约束与验收", "text": "## 后续开发约束与验收\n\n脚本不控制共享 Traefik、其他 daemon/进程或远端效果，不是跨实例锁/授权系统。独占维护时不得并发改配置、镜像、context 或启动其他 writer；确认变量只是声明，不证明全局停写。\n\n[R11](../planning/roadmap.md#r11-运维与工程工具)保留全实例停写/清理及真实恢复缺口。脚本回归只验参数、身份拒绝与失败不续行；实际 Compose/PowerShell、迁移事务、health/HTTPS 和业务放行须获准环境验收。"}], "toc": [{"title": "先分清四种操作", "anchor": "先分清四种操作", "level": "h2"}, {"title": "一个例子：关闭 dispatch 后仍有工作", "anchor": "一个例子关闭-dispatch-后仍有工作", "level": "h2"}, {"title": "环境文件与配置边界", "anchor": "环境文件与配置边界", "level": "h2"}, {"title": "迁移前置与执行", "anchor": "迁移前置与执行", "level": "h2"}, {"title": "迁移与回退审查", "anchor": "迁移与回退审查", "level": "h2"}, {"title": "会话协议切换检查", "anchor": "会话协议切换检查", "level": "h2"}, {"title": "启动与放行", "anchor": "启动与放行", "level": "h2"}, {"title": "后续开发约束与验收", "anchor": "后续开发约束与验收", "level": "h2"}], "source": "operations/deployment.md", "checksum": "2131134af5baf610c9f1206851940a6cd309a28a58b691b2563c9a44459a5988"}, {"id": "docs/operations/backup-recovery.md", "title": "备份、恢复与版本回退", "group": "operations", "html": "\u003ch1 id=\"备份恢复与版本回退\">备份、恢复与版本回退\u003c/h1>\n\u003cp>命令在目标 \u003ccode>SKM/\u003c/code> 执行，先确认环境、受控资产和维护窗口，材料不明即停。起动见\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>，发布见\u003ca href=\"#docs/operations/deployment.md::\">迁移手册\u003c/a>。\u003c/p>\n\u003ch2 id=\"配备前备份\">配备前备份\u003c/h2>\n\u003cp>先关新业务/触发、核清在途 Effect，未知按\u003ca href=\"#docs/operations/runbook.md::incident-%E4%B8%8E-recovery\">原身份对账\u003c/a>。全部 API/Worker 写入者停止后，在同一窗口取得恢复点；dispatch=false、停单实例或文件同时间戳不证明一致。\u003c/p>\n\u003ch3 id=\"一致恢复点包含什么\">一致恢复点包含什么\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>资产\u003c/th>\n\u003cth>必须保留的关联\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>DB dump\u003c/td>\n\u003ctd>数据库身份、migration revision、Run/快照/Outbox/批准/安全审计、上传意图/占用/清理要求、附件原字节/回执、评价原请求绑定与停写时点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>blob snapshot\u003c/td>\n\u003ctd>SkillSource、文档等原对象 key、字节/hash及 DB 引用；新文档的 namespace UUID/连接描述摘要与实际存储世代须一起保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 文件\u003c/td>\n\u003ctd>必要 workspace/transcript、输入副本、Session 恢复材料；缺文件不能标为可续行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>镜像与配置\u003c/td>\n\u003ctd>Backend/Web 与依赖 image ID、context path、配置版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>KEK\u003c/td>\n\u003ctd>所需旧版本的独立受控保管引用，不与 dump 放一起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部对账事实\u003c/td>\n\u003ctd>原 Proposal/Effect、目标 revision、apply/read-back 及恢复点后的变化\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>dump/blob/workspace 含敏感材料，须访问控制、不作公开附件。清单只留恢复点 ID、UTC 窗口、资产引用/校验值、操作者、结果/缺项；KEK 独立保管。负责人确定 RPO/RTO/保留期，当前无自动跨存储备份或时效保证。\u003c/p>\n\u003cp>以下关联不能只靠公开字段或旧 dump 重建：\u003c/p>\n\u003cul>\n\u003cli>Redis 不是 DB 正本；旧队列、Outbox 重投、调度在途另定恢复方案，不清未知 Redis 全库。\u003c/li>\n\u003cli>\u003ca href=\"#docs/design/results-evaluation.md::%E5%8F%AF%E4%BF%A1%E9%99%84%E4%BB%B6%E7%9A%84%E5%8F%91%E5%B8%83%E4%B8%8E%E8%AF%BB%E5%8F%96\">附件\u003c/a>：Evidence 私有原字节与 Tool/Run、size/hash 同恢复，不能用 output 文件替代；历史无绑定仍未发布。\u003c/li>\n\u003cli>评价：保留原 Result、用户和 submission_key/request_hash。恢复点后提交可能缺失，原键 GET 未见不证明从未提交，不换键/合并相似记录补历史。\u003c/li>\n\u003cli>预算：账户、预留、调用绑定、启动所有权 hash、观察/核对同恢复。hash 不重建原协调器 token，也不授新 Worker 启动权；旧 RESERVED/无绑定不证明后来未启动，未知不释放占用或换 invocation/owner 重跑。\u003c/li>\n\u003cli>\u003ca href=\"#docs/design/document-lifecycle.md::\">文档\u003c/a>：意图/原回执/占用、清理记录、关闭标记/审计同恢复；标记与审计须双向一致。旧恢复点可能漏掉后来关闭/迟到 PUT，核清前不发布、清理或结算，关闭不证明远端停止。原 key 查询不授权重放 PENDING，未来精确版本/清理凭证也纳入恢复点。\u003c/li>\n\u003c/ul>\n\u003cp>存储 UUID 不证明服务端身份。换 endpoint/bucket 或重建存储须核原资产并做受控归属迁移，当前无该工具；不复用 UUID、改摘要绕过，未绑定旧文档保留元数据并拒绝 blob 操作。目录总量不等于 bucket 占用，不能据列表删对象。\u003c/p>\n\u003ch3 id=\"取得并检查数据库备份\">取得并检查数据库备份\u003c/h3>\n\u003cp>以下仅备份 DB。两块在同一 shell 执行，mktemp/pg_dump 失败即停；新终端重新确认目录，不猜变量。密码不入命令行。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">umask 077\nSKM_BACKUP_DIR=\u0026quot;$(mktemp -d ./skillmind-backup-XXXXXXXX)\u0026quot; \u0026amp;\u0026amp;\npython3 scripts/compose.py -- exec -T postgres sh -ceu \\\n  'pg_dump --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; --format=custom' \\\n  \u0026gt; \u0026quot;${SKM_BACKUP_DIR:?Backup directory is required}/database.dump\u0026quot;\n\u003c/code>\u003c/pre>\n\u003cp>成功后查非空、archive 目录及 checksum；失败文件只作现场，不作有效备份。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${SKM_BACKUP_DIR:?Specify the directory created for this backup}\u0026quot;\n  test -s \u0026quot;$SKM_BACKUP_DIR/database.dump\u0026quot;\n  python3 scripts/compose.py -- exec -T postgres pg_restore --list \\\n    \u0026lt; \u0026quot;$SKM_BACKUP_DIR/database.dump\u0026quot; \u0026gt; \u0026quot;$SKM_BACKUP_DIR/database.toc\u0026quot;\n  docker image inspect skillmind/backend:0.1.0 skillmind/web:0.1.0 \\\n    --format '{{.RepoTags}} {{.Id}}' \u0026gt; \u0026quot;$SKM_BACKUP_DIR/images.txt\u0026quot;\n  cd \u0026quot;$SKM_BACKUP_DIR\u0026quot;\n  sha256sum database.dump \u0026gt; database.dump.sha256\n  sha256sum --check database.dump.sha256\n)\n\u003c/code>\u003c/pre>\n\u003cp>子 shell 遇错即停，TOC 受控保存；全部资产同清单转存。checksum 不证明来源或可恢复性；完整恢复点就绪前不删旧镜像/迁移，更不执行全 volume 删除的 \u003ccode>make bootstrap-admin\u003c/code>。\u003c/p>\n\u003ch2 id=\"数据库恢复\">数据库恢复\u003c/h2>\n\u003cp>\u003cstrong>以下会删除并替换数据库，丢失恢复点后的本地数据。\u003c/strong> 经负责人确认并保全当前现场后，先在隔离环境演练。\u003c/p>\n\u003cp>恢复旧 DB 不撤销远端变更，还可能复活撤销的 session/权限。恢复点后的撤权和 commit 均须独立对账；未核清保持隔离。没有通用权限修复/Effect 补账 CLI，不以 SQL、bootstrap 或新键补造结果。\u003c/p>\n\u003ch3 id=\"恢复前的停止条件\">恢复前的停止条件\u003c/h3>\n\u003cp>须同时确认：环境/project/DB/角色/镜像/revision；可信 dump/checksum/archive 及关联 blob/workspace/config/KEK；当前现场备份；全写入者停止；恢复点后安全/外部事实的原身份对账方案。\u003c/p>\n\u003cp>明确将完整备份目录设为 \u003ccode>SKM_RESTORE_DIR\u003c/code>，保留原文件名/相对路径，先只校验材料：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${SKM_RESTORE_DIR:?Specify the verified backup directory}\u0026quot;\n  test -s \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot;\n  python3 scripts/compose.py -- exec -T postgres pg_restore --list \\\n    \u0026lt; \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot; \u0026gt; /dev/null\n  cd \u0026quot;$SKM_RESTORE_DIR\u0026quot;\n  sha256sum --check database.dump.sha256\n)\n\u003c/code>\u003c/pre>\n\u003cp>成功后，在全局停写窗口停止本目录服务并核实 DB/角色：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- stop api worker migrate\npython3 scripts/compose.py -- exec -T postgres sh -ceu '\n  psql --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; --no-psqlrc \\\n    --set=ON_ERROR_STOP=1 --command=\u0026quot;SELECT current_database(), current_user\u0026quot;\n'\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"替换数据库\">替换数据库\u003c/h3>\n\u003cp>结果与批准目标完全相符才执行；示例用原应用角色，多 owner/自定义权限须另有已验证方案。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${SKM_RESTORE_DIR:?Specify the verified backup directory}\u0026quot;\n  test -s \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot;\n  python3 scripts/compose.py -- exec -T postgres sh -ceu '\n    dropdb --force --username=\u0026quot;$POSTGRES_USER\u0026quot; \u0026quot;$POSTGRES_DB\u0026quot;\n    createdb --username=\u0026quot;$POSTGRES_USER\u0026quot; --owner=\u0026quot;$POSTGRES_USER\u0026quot; \u0026quot;$POSTGRES_DB\u0026quot;\n  '\n  python3 scripts/compose.py -- exec -T postgres sh -ceu '\n    pg_restore --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; \\\n      --no-owner --single-transaction --exit-on-error\n  ' \u0026lt; \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot;\n)\n\u003c/code>\u003c/pre>\n\u003cp>单事务仅保护 pg_restore，不撤销 dropdb/createdb、blob 或外部效果；失败可能留空库，保持业务关闭。其他大库策略先演练，不删保护参数，见 \u003ca href=\"https://www.postgresql.org/docs/17/app-pgrestore.html\">pg_restore\u003c/a>。\u003c/p>\n\u003ch3 id=\"恢复后验证\">恢复后验证\u003c/h3>\n\u003cp>恢复 blob/workspace、兼容镜像/配置与旧 KEK，核 revision 后按\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E4%B8%8E%E5%9B%9E%E9%80%80%E5%AE%A1%E6%9F%A5\">迁移审查\u003c/a>决定前进；Worker 保持隔离，不用普通 up 绕检查。\u003c/p>\n\u003cp>分别验旧权限未复活、资产字节/引用一致、终态可读与非终态可续、队列/lease/Schedule/Effect 已对账。缺回执/输入/transcript 拒绝而非补签；记录耗时、损失、范围、残余问题和放行人。未知继续隔离，preflight 不替代验收，后台与普通入口\u003ca href=\"#docs/operations/deployment.md::%E5%90%AF%E5%8A%A8%E4%B8%8E%E6%94%BE%E8%A1%8C\">分阶段放行\u003c/a>。\u003c/p>\n\u003ch2 id=\"应用版本回退\">应用版本回退\u003c/h2>\n\u003cp>旧 API/Web/Worker 能理解当前 schema、数据、队列和非终态快照才可保留数据回镜像。未知不启动旧 Worker；无可信恢复点保全现场、选 forward fix，不试跑破坏性 downgrade。\u003c/p>\n\u003cp>按\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E5%89%8D%E7%BD%AE%E4%B8%8E%E6%89%A7%E8%A1%8C\">发布阶段\u003c/a>重验旧 archive/checksum/image ID、当前 schema/配置及 daemon/project。保留旧镜像不保证 archive、第三方镜像或恢复点齐全，同名 tag 不算方案；旧 migration-plan/head 不识别当前 DB 时保持隔离，评审 forward fix/完整恢复，不 stamp 或删审计。API/Web、后台、普通入口分别放行，无自动回滚。\u003c/p>\n", "sections": [{"title": "备份、恢复与版本回退", "level": "h1", "anchor": "备份恢复与版本回退", "text": "# 备份、恢复与版本回退\n\n命令在目标 `SKM/` 执行，先确认环境、受控资产和维护窗口，材料不明即停。起动见[Quickstart](quickstart.md)，发布见[迁移手册](deployment.md)。"}, {"title": "配备前备份", "level": "h2", "anchor": "配备前备份", "text": "## 配备前备份\n\n先关新业务/触发、核清在途 Effect，未知按[原身份对账](runbook.md#incident-与-recovery)。全部 API/Worker 写入者停止后，在同一窗口取得恢复点；dispatch=false、停单实例或文件同时间戳不证明一致。"}, {"title": "一致恢复点包含什么", "level": "h3", "anchor": "一致恢复点包含什么", "text": "### 一致恢复点包含什么\n\n| 资产 | 必须保留的关联 |\n| --- | --- |\n| DB dump | 数据库身份、migration revision、Run/快照/Outbox/批准/安全审计、上传意图/占用/清理要求、附件原字节/回执、评价原请求绑定与停写时点 |\n| blob snapshot | SkillSource、文档等原对象 key、字节/hash及 DB 引用；新文档的 namespace UUID/连接描述摘要与实际存储世代须一起保留 |\n| Run 文件 | 必要 workspace/transcript、输入副本、Session 恢复材料；缺文件不能标为可续行 |\n| 镜像与配置 | Backend/Web 与依赖 image ID、context path、配置版本 |\n| KEK | 所需旧版本的独立受控保管引用，不与 dump 放一起 |\n| 外部对账事实 | 原 Proposal/Effect、目标 revision、apply/read-back 及恢复点后的变化 |\n\ndump/blob/workspace 含敏感材料，须访问控制、不作公开附件。清单只留恢复点 ID、UTC 窗口、资产引用/校验值、操作者、结果/缺项；KEK 独立保管。负责人确定 RPO/RTO/保留期，当前无自动跨存储备份或时效保证。\n\n以下关联不能只靠公开字段或旧 dump 重建：\n\n- Redis 不是 DB 正本；旧队列、Outbox 重投、调度在途另定恢复方案，不清未知 Redis 全库。\n- [附件](../design/results-evaluation.md#可信附件的发布与读取)：Evidence 私有原字节与 Tool/Run、size/hash 同恢复，不能用 output 文件替代；历史无绑定仍未发布。\n- 评价：保留原 Result、用户和 submission_key/request_hash。恢复点后提交可能缺失，原键 GET 未见不证明从未提交，不换键/合并相似记录补历史。\n- 预算：账户、预留、调用绑定、启动所有权 hash、观察/核对同恢复。hash 不重建原协调器 token，也不授新 Worker 启动权；旧 RESERVED/无绑定不证明后来未启动，未知不释放占用或换 invocation/owner 重跑。\n- [文档](../design/document-lifecycle.md)：意图/原回执/占用、清理记录、关闭标记/审计同恢复；标记与审计须双向一致。旧恢复点可能漏掉后来关闭/迟到 PUT，核清前不发布、清理或结算，关闭不证明远端停止。原 key 查询不授权重放 PENDING，未来精确版本/清理凭证也纳入恢复点。\n\n存储 UUID 不证明服务端身份。换 endpoint/bucket 或重建存储须核原资产并做受控归属迁移，当前无该工具；不复用 UUID、改摘要绕过，未绑定旧文档保留元数据并拒绝 blob 操作。目录总量不等于 bucket 占用，不能据列表删对象。"}, {"title": "取得并检查数据库备份", "level": "h3", "anchor": "取得并检查数据库备份", "text": "### 取得并检查数据库备份\n\n以下仅备份 DB。两块在同一 shell 执行，mktemp/pg_dump 失败即停；新终端重新确认目录，不猜变量。密码不入命令行。\n\n```bash\numask 077\nSKM_BACKUP_DIR=\"$(mktemp -d ./skillmind-backup-XXXXXXXX)\" \u0026\u0026\npython3 scripts/compose.py -- exec -T postgres sh -ceu \\\n  'pg_dump --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" --format=custom' \\\n  > \"${SKM_BACKUP_DIR:?Backup directory is required}/database.dump\"\n```\n\n成功后查非空、archive 目录及 checksum；失败文件只作现场，不作有效备份。\n\n```bash\n(\n  set -eu\n  : \"${SKM_BACKUP_DIR:?Specify the directory created for this backup}\"\n  test -s \"$SKM_BACKUP_DIR/database.dump\"\n  python3 scripts/compose.py -- exec -T postgres pg_restore --list \\\n    \u003c \"$SKM_BACKUP_DIR/database.dump\" > \"$SKM_BACKUP_DIR/database.toc\"\n  docker image inspect skillmind/backend:0.1.0 skillmind/web:0.1.0 \\\n    --format '{{.RepoTags}} {{.Id}}' > \"$SKM_BACKUP_DIR/images.txt\"\n  cd \"$SKM_BACKUP_DIR\"\n  sha256sum database.dump > database.dump.sha256\n  sha256sum --check database.dump.sha256\n)\n```\n\n子 shell 遇错即停，TOC 受控保存；全部资产同清单转存。checksum 不证明来源或可恢复性；完整恢复点就绪前不删旧镜像/迁移，更不执行全 volume 删除的 `make bootstrap-admin`。"}, {"title": "数据库恢复", "level": "h2", "anchor": "数据库恢复", "text": "## 数据库恢复\n\n**以下会删除并替换数据库，丢失恢复点后的本地数据。** 经负责人确认并保全当前现场后，先在隔离环境演练。\n\n恢复旧 DB 不撤销远端变更，还可能复活撤销的 session/权限。恢复点后的撤权和 commit 均须独立对账；未核清保持隔离。没有通用权限修复/Effect 补账 CLI，不以 SQL、bootstrap 或新键补造结果。"}, {"title": "恢复前的停止条件", "level": "h3", "anchor": "恢复前的停止条件", "text": "### 恢复前的停止条件\n\n须同时确认：环境/project/DB/角色/镜像/revision；可信 dump/checksum/archive 及关联 blob/workspace/config/KEK；当前现场备份；全写入者停止；恢复点后安全/外部事实的原身份对账方案。\n\n明确将完整备份目录设为 `SKM_RESTORE_DIR`，保留原文件名/相对路径，先只校验材料：\n\n```bash\n(\n  set -eu\n  : \"${SKM_RESTORE_DIR:?Specify the verified backup directory}\"\n  test -s \"$SKM_RESTORE_DIR/database.dump\"\n  python3 scripts/compose.py -- exec -T postgres pg_restore --list \\\n    \u003c \"$SKM_RESTORE_DIR/database.dump\" > /dev/null\n  cd \"$SKM_RESTORE_DIR\"\n  sha256sum --check database.dump.sha256\n)\n```\n\n成功后，在全局停写窗口停止本目录服务并核实 DB/角色：\n\n```bash\npython3 scripts/compose.py -- stop api worker migrate\npython3 scripts/compose.py -- exec -T postgres sh -ceu '\n  psql --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" --no-psqlrc \\\n    --set=ON_ERROR_STOP=1 --command=\"SELECT current_database(), current_user\"\n'\n```"}, {"title": "替换数据库", "level": "h3", "anchor": "替换数据库", "text": "### 替换数据库\n\n结果与批准目标完全相符才执行；示例用原应用角色，多 owner/自定义权限须另有已验证方案。\n\n```bash\n(\n  set -eu\n  : \"${SKM_RESTORE_DIR:?Specify the verified backup directory}\"\n  test -s \"$SKM_RESTORE_DIR/database.dump\"\n  python3 scripts/compose.py -- exec -T postgres sh -ceu '\n    dropdb --force --username=\"$POSTGRES_USER\" \"$POSTGRES_DB\"\n    createdb --username=\"$POSTGRES_USER\" --owner=\"$POSTGRES_USER\" \"$POSTGRES_DB\"\n  '\n  python3 scripts/compose.py -- exec -T postgres sh -ceu '\n    pg_restore --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" \\\n      --no-owner --single-transaction --exit-on-error\n  ' \u003c \"$SKM_RESTORE_DIR/database.dump\"\n)\n```\n\n单事务仅保护 pg_restore，不撤销 dropdb/createdb、blob 或外部效果；失败可能留空库，保持业务关闭。其他大库策略先演练，不删保护参数，见 [pg_restore](https://www.postgresql.org/docs/17/app-pgrestore.html)。"}, {"title": "恢复后验证", "level": "h3", "anchor": "恢复后验证", "text": "### 恢复后验证\n\n恢复 blob/workspace、兼容镜像/配置与旧 KEK，核 revision 后按[迁移审查](deployment.md#迁移与回退审查)决定前进；Worker 保持隔离，不用普通 up 绕检查。\n\n分别验旧权限未复活、资产字节/引用一致、终态可读与非终态可续、队列/lease/Schedule/Effect 已对账。缺回执/输入/transcript 拒绝而非补签；记录耗时、损失、范围、残余问题和放行人。未知继续隔离，preflight 不替代验收，后台与普通入口[分阶段放行](deployment.md#启动与放行)。"}, {"title": "应用版本回退", "level": "h2", "anchor": "应用版本回退", "text": "## 应用版本回退\n\n旧 API/Web/Worker 能理解当前 schema、数据、队列和非终态快照才可保留数据回镜像。未知不启动旧 Worker；无可信恢复点保全现场、选 forward fix，不试跑破坏性 downgrade。\n\n按[发布阶段](deployment.md#迁移前置与执行)重验旧 archive/checksum/image ID、当前 schema/配置及 daemon/project。保留旧镜像不保证 archive、第三方镜像或恢复点齐全，同名 tag 不算方案；旧 migration-plan/head 不识别当前 DB 时保持隔离，评审 forward fix/完整恢复，不 stamp 或删审计。API/Web、后台、普通入口分别放行，无自动回滚。"}], "toc": [{"title": "配备前备份", "anchor": "配备前备份", "level": "h2"}, {"title": "一致恢复点包含什么", "anchor": "一致恢复点包含什么", "level": "h3"}, {"title": "取得并检查数据库备份", "anchor": "取得并检查数据库备份", "level": "h3"}, {"title": "数据库恢复", "anchor": "数据库恢复", "level": "h2"}, {"title": "恢复前的停止条件", "anchor": "恢复前的停止条件", "level": "h3"}, {"title": "替换数据库", "anchor": "替换数据库", "level": "h3"}, {"title": "恢复后验证", "anchor": "恢复后验证", "level": "h3"}, {"title": "应用版本回退", "anchor": "应用版本回退", "level": "h2"}], "source": "operations/backup-recovery.md", "checksum": "a53e0296e9002a7ab6459b07a01aa6e4ab6d3d6b100bfc7dafad884d909cf0d1"}, {"id": "docs/operations/runbook.md", "title": "Skillmind 运维与故障排查", "group": "operations", "html": "\u003ch1 id=\"skillmind-运维与故障排查\">Skillmind 运维与故障排查\u003c/h1>\n\u003cp>按症状分诊；起动、发布、恢复分别见\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>、\u003ca href=\"#docs/operations/deployment.md::\">发布\u003c/a>、\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复\u003c/a>。缺口见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>，设计不代表已有修复 CLI。\u003c/p>\n\u003ch2 id=\"按问题找入口\">按问题找入口\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>登录、CSRF、权限异常\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E8%AE%A4%E8%AF%81%E6%95%85%E9%9A%9C%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">认证\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::%E7%99%BB%E5%BD%95%E9%98%B2%E6%8A%A4%E7%9A%84%E6%8E%92%E6%9F%A5%E4%B8%8E%E6%81%A2%E5%A4%8D\">登录防护\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目消失、归档或删除异常\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E9%A1%B9%E7%9B%AE%E4%B8%8E%E5%BD%92%E6%A1%A3%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">项目\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上传部分成功、列表与附件不一致\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E6%96%87%E6%A1%A3%E4%BF%9D%E5%AD%98%E4%B8%8E%E5%88%A0%E9%99%A4%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">文档保存与删除\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 无会话、准备超时、不断接管\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E5%87%86%E5%A4%87%E6%95%85%E9%9A%9C%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">准备\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::%E8%B5%84%E6%BA%90%E5%BF%AB%E7%85%A7%E6%8E%92%E9%9A%9C\">冻结输入\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等待回答/批准、结果或评价可疑\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::waiting-%E7%8A%B6%E6%80%81\">WAITING\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%AF%84%E4%BB%B7%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">结果\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>调度漏跑或计数不符\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::schedule-%E4%B8%8E-recovery-%E7%9A%84%E7%9B%91%E8%A7%86\">Schedule\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部写入未知、PR 失败\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::incident-%E4%B8%8E-recovery\">Effect 对账\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>凭据无法解封或准备轮换\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::managed-secret-%E3%81%AE-kek-%E9%81%8B%E7%94%A8\">KEK\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验收或 Worker 故障注入\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E9%80%9A%E5%B8%B8-smoke\">smoke\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::worker-%E5%96%AA%E5%A4%B1%E3%81%A8%E6%8E%A5%E7%AE%A1\">接管\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"运用原则\">运用原则\u003c/h2>\n\u003cp>优先已有响应/脱敏日志/获准只读查询。PostgreSQL 是正本，不改状态、stamp、删审计或换键消错；未知保全原身份，不自动重放。启动/停机/模型/外部写入/恢复须另确认目标、副作用和授权；命令在目标 \u003ccode>SKM/\u003c/code> 经\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">统一入口\u003c/a>使用已确认 ENV_FILE/project，不切默认 context 误操作。\u003c/p>\n\u003cp>对外只留 UTC、image/revision、对象 ID、公开错误码和范围；不附 \u003ccode>.env\u003c/code>、Cookie/CSRF、密码/KEK、内部地址、正文或完整 workspace/HAR。\u003c/p>\n\u003ch2 id=\"认证故障的只读分诊\">认证故障的只读分诊\u003c/h2>\n\u003cp>记录原 path（无参数）、status/code/request_id 和版本，只查 header 存在性、cookie 属性和刷新顺序。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原响应\u003c/th>\n\u003cth>核对与停止条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>401 invalid_credentials\u003c/td>\n\u003ctd>确认环境，不探测账号存在性或重跑 bootstrap\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>400 current_password_rejected\u003c/td>\n\u003ctd>改密操作拒绝，不是登录失效；保留仍有效 session\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>401 authentication_required\u003c/td>\n\u003ctd>查 cookie、期限、用户/角色/失效及 API 协议；不公开内部原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 csrf_rejected\u003c/td>\n\u003ctd>查 Origin scheme/host/port、header 类型和是否换会话；不关闭 CSRF 或放宽 cookie\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 administrator_required / 404\u003c/td>\n\u003ctd>系统 ADMIN 与 ProjectMember 不同；404 也可能隐藏越权，不枚举或换账号探测\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 project_archived / 用户冲突\u003c/td>\n\u003ctd>按\u003ca href=\"#docs/design/project-lifecycle.md::\">项目\u003c/a>或\u003ca href=\"#docs/design/user-lifecycle.md::\">账户\u003c/a>规则核对，不擅自恢复项目、换版重发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>429 / 503\u003c/td>\n\u003ctd>转\u003ca href=\"#docs/operations/runbook.md::%E7%99%BB%E5%BD%95%E9%98%B2%E6%8A%A4%E7%9A%84%E6%8E%92%E6%9F%A5%E4%B8%8E%E6%81%A2%E5%A4%8D\">登录防护\u003c/a>，不当作密码错误\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422\u003c/td>\n\u003ctd>按契约修正缺失 header/结构/输入，不显示含密码的原值\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>GET 不轮换 v2 CSRF 但可更新 idle，login-context 占配额/建 challenge，均非纯只读探针。旧 API 混跑按\u003ca href=\"#docs/operations/deployment.md::%E4%BC%9A%E8%AF%9D%E5%8D%8F%E8%AE%AE%E5%88%87%E6%8D%A2%E6%A3%80%E6%9F%A5\">会话切换\u003c/a>处理；重登先保全未确认 ID/key，403 不证明未提交。无通用账户排障 CLI，不用 SQL/bootstrap 代替。\u003c/p>\n\u003ch2 id=\"登录防护的排查与恢复\">登录防护的排查与恢复\u003c/h2>\n\u003cp>429 记录 Retry-After 并停止快速重试，查共享出口/challenge/可信代理；正常登录通常消耗两次来源请求。不连续探测、轮询、换来源或删配额解锁，等待不保证成功。\u003c/p>\n\u003cp>503 区分 \u003ccode>login_protection_unavailable\u003c/code> 与代理错误，查指定 Redis 的权限、容量/驱逐、TTL/损坏和超时；PING 不证明 EVAL/SET/GETDEL 可用。\u003c/p>\n\u003cp>修配置/重启/切 Redis/主动登录须获批环境、专用账号和影响评审；不 FLUSHDB/删 key。修复后验来源不可伪造、正常登录、429 等待及 503 拒绝；不据此放行旧会话/Worker/Effect。\u003c/p>\n\u003cp>Web 的 1–300 秒只作静态提示；通信失败/离页按\u003ca href=\"#docs/design/login-protection.md::%E6%8F%90%E4%BA%A4%E7%A6%BB%E9%A1%B5%E4%B8%8E%E7%BB%93%E6%9E%9C%E6%9C%AA%E7%9F%A5\">提交未知\u003c/a>处理，未跳页不证明登录未成功。\u003c/p>\n\u003ch2 id=\"项目与归档的只读分诊\">项目与归档的只读分诊\u003c/h2>\n\u003cp>核对原 project_id/调用者/服务端状态；失效链接保留原目标，导航选中不代替详情授权。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>核对与停止条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>移出成员后仍可访问\u003c/td>\n\u003ctd>系统 ADMIN 不依赖 membership，成员移除不是账户降权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>归档后仍有 Run/Effect\u003c/td>\n\u003ctd>归档不是取消或全局停写，按原对象停止协议处理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无 Run 但 DELETE 失败\u003c/td>\n\u003ctd>TaskSchedule、成员审计、文档/上传意图/清理记录仍会阻止删除；原版本冲突须核对，不拆外键、删历史或循环 DELETE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>204 后仍有附件/备份\u003c/td>\n\u003ctd>只证明所列元数据删除，不证明字节清理；不递归删目录\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>修复边界见\u003ca href=\"#docs/design/project-lifecycle.md::\">项目生命周期\u003c/a>。\u003c/p>\n\u003ch2 id=\"文档保存与删除的只读分诊\">文档保存与删除的只读分诊\u003c/h2>\n\u003cp>保留原 Project/document ID、upload key、时点/code/版本；无文档 ID 用原 key 查，文件受控保全，正文/storage key 不入报告。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>核对与停止条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>同名 409\u003c/td>\n\u003ctd>当前目录/PENDING 占用在 PUT 前拒绝；旧 writer/孤立对象另查，不重复上传验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 document_upload_pending / document_upload_key_conflict\u003c/td>\n\u003ctd>原 key 待确认 / 绑定另一输入；人工 GET 原 key，不换键重传\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原 key GET PENDING / 404\u003c/td>\n\u003ctd>已预约未确认 / 当前未查到；均不证明旧 POST 不继续，不释放占用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原 key GET PUBLISHED，目录无文档\u003c/td>\n\u003ctd>原发布成立，元数据可能后来删除；按原 ID 核对，不补建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>413 document_upload_too_large\u003c/td>\n\u003ctd>实际文件/multipart 超限，本次未进存储；缩小请求，不伪报 Content-Length\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422 invalid_document_upload\u003c/td>\n\u003ctd>查单 file、可选 UTF-8 folder、重复字段/参数和完整结束边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422 invalid_document_upload_key\u003c/td>\n\u003ctd>须单个非 nil UUID header；核对 API/Web 版本，不换键重试未知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目录部分完成\u003c/td>\n\u003ctd>分开已发布/拒绝/未知/未发送；未知暂停后续，查原回执后人工继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DELETE 报错后 ID 消失\u003c/td>\n\u003ctd>可能已提交 metadata；404 不恢复清理，不循环删或删同路径新 ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除 409\u003c/td>\n\u003ctd>document_in_use 为原引用，document_references_unavailable 为历史无法核实；查 Run/调度/occurrence，不删审计、改 hash 或换 ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>204 后对象仍在\u003c/td>\n\u003ctd>不证明旧版本/在途 PUT/全部字节已清理，不清 Project 前缀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下载 409 document_content_missing / document_content_invalid\u003c/td>\n\u003ctd>原 blob 缺失 / 内容不符；按原 ID/hash 与恢复点核对，不改 hash/同名覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>503 document_storage_unavailable\u003c/td>\n\u003ctd>查 namespace/归属、存储可达性/权限；上传/删除可能已写，不推导回滚或清理成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>503 document_upload_unavailable\u003c/td>\n\u003ctd>原意图/回执/占用无法核实，保留身份，不删记录补成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除后配额未减\u003c/td>\n\u003ctd>新意图 size 保留，旧占用转清理记录；精确结算未接，不凭 204/对象查无扣减\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>切存储后旧附件不可读\u003c/td>\n\u003ctd>旧行不自动绑定，按\u003ca href=\"#docs/design/document-lifecycle.md::%E5%AD%98%E5%82%A8%E5%BD%92%E5%B1%9E%E4%B8%8E%E9%85%8D%E7%BD%AE%E5%88%87%E6%8D%A2\">归属\u003c/a>核原 ID/key/hash，不改摘要/复用 UUID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预览超限/资源消失\u003c/td>\n\u003ctd>实际 byte 超限停读，HTML 仅静态结构；原文件可下载，但打开安全性另判\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>无通用孤立清理/配额修复 CLI；按\u003ca href=\"#docs/design/document-lifecycle.md::\">文档生命周期\u003c/a>处理，不同名重传修复冻结输入。\u003c/p>\n\u003ch2 id=\"准备故障的只读分诊\">准备故障的只读分诊\u003c/h2>\n\u003cp>只查 Run/Attempt、日志与输入回执，不启动模型/重做物化；回执无公开管理 API。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观察\u003c/th>\n\u003cth>核对与停止条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>RUNNING 但无 Session\u003c/td>\n\u003ctd>运行态与 prepared event 可在 ContextBuilder 前产生，先查准备错误/回执/Brief\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>preparation_timeout\u003c/td>\n\u003ctd>查准备配置、资源耗时和回执提交；模型 wall timeout 不是替代\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>context_build_failed\u003c/td>\n\u003ctd>查脱敏异常、冻结来源、binding 和消费者，不一律归因网络\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>首次世代创建被拒绝\u003c/td>\n\u003ctd>旧 .skillmind-inputs、其他 UUID 或 symlink 都可阻止；保留现场，不删除或补 READY\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行权异常、不断接管\u003c/td>\n\u003ctd>查 lease/token 与 Attempt 时间线，旧 Worker 不得强写终态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已接受取消但未结束\u003c/td>\n\u003ctd>查取消意图/lease/Session；按钮或 CANCELLED 不证明进程退出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>READY 但 Run 失败\u003c/td>\n\u003ctd>输入就绪不保证 Brief/模型成功，不删完成回执解锁\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>计时器见\u003ca href=\"#docs/design/run-budgets.md::%E7%8E%B0%E6%9C%89%E8%AE%A1%E6%97%B6%E5%99%A8%E7%9A%84%E8%A6%86%E7%9B%96%E8%8C%83%E5%9B%B4\">执行限额\u003c/a>。未知保留原世代、输入不可用，不补 READY/换世代；停机试验见\u003ca href=\"#docs/operations/runbook.md::worker-%E5%96%AA%E5%A4%B1%E3%81%A8%E6%8E%A5%E7%AE%A1\">接管\u003c/a>。\u003c/p>\n\u003ch2 id=\"资源快照排障\">资源快照排障\u003c/h2>\n\u003cp>核部署版本、Run sources/manifest、回执世代和实际 revision，不用今日目录/HEAD/同名路径代替。缺 ID/hash 不符/混入文件保留现场，不重传、删缓存或改快照；输入改变建新 Run。\u003c/p>\n\u003cp>丢响应先确认\u003ca href=\"#docs/design/run-creation.md::\">原创建请求\u003c/a>，已有 Run 按\u003ca href=\"#docs/design/resource-snapshots.md::%E5%87%86%E5%A4%87%E4%B8%AD%E6%96%AD%E4%B8%8E%E5%86%8D%E6%AC%A1%E4%BD%BF%E7%94%A8\">准备中断规则\u003c/a>处理；hash/目录完整/迁移成功不授权放行，无补签 CLI。\u003c/p>\n\u003ch2 id=\"waiting-状态\">WAITING 状态\u003c/h2>\n\u003cp>WAITING_FOR_INPUT/APPROVAL 非终态；查 Interaction/Proposal、Brief/checkpoint、Session/事件。等待释放主 lease，已批准 Effect 可独立执行，不重复批准。答案追加 Segment，技术重试才追加 Attempt。\u003c/p>\n\u003cp>普通超期追加 INTERACTION_TIMEOUT，不代答；批准超期失效。410 可能已提交续行，先读状态，不换键补答；悬空 EFFECT_APPROVAL 不用普通答复/手写审批修复。\u003c/p>\n\u003cp>resume 须 transcript/workspace 与 engine/model 兼容；fork 保留 parent/checkpoint，replace 从可信 checkpoint 建会话，均不改冻结版本/权限/资源/预算。仅 PRIMARY 限一个 ACTIVE，不把子会话算重；见\u003ca href=\"#docs/design/user-interactions.md::\">交互\u003c/a>、\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>。\u003c/p>\n\u003ch2 id=\"结果与评价的只读分诊\">结果与评价的只读分诊\u003c/h2>\n\u003cp>查授权 detail/历史，保留原 ID/响应，不复制正文。SUCCEEDED 可与 PARTIAL/BLOCKED 并存；模型 APPLIED 不替代平台 read-back，引用计数不证明可读。\u003c/p>\n\u003cp>评价 pointer 相对 detail.result.data；400 查原值根，409 查 Result，401/403 回认证分诊。无评价非无 Result，同文/时间非原提交证明；未知不自动 POST、删重复或改原值，见\u003ca href=\"#docs/design/results-evaluation.md::\">结果评价\u003c/a>。\u003c/p>\n\u003ch2 id=\"schedule-与-recovery-的监视\">Schedule 与 Recovery 的监视\u003c/h2>\n\u003cp>tick 计数、Schedule last_* 与业务结果分开。FAILED_PRECONDITION 回写 ERROR，基础设施异常未必留状态；不补触发或改 DB 计数。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>异常\u003c/th>\n\u003cth>实际边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>迟到/漏跑\u003c/td>\n\u003ctd>当前可能执行最早迟到 occurrence，再跳过后续过期时刻；missed_count 单次最多 1000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>last_* 不一致\u003c/td>\n\u003ctd>跳过/失败可保留旧 Run ID，不能拼成同一次执行事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>next_run_at 已进但无 Run\u003c/td>\n\u003ctd>刷新“在途核对”，查原 occurrence/版本/认领/租约；可能处理、未知或恢复耗尽，不清记录/额度或换键\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>在途为空/租约到期\u003c/td>\n\u003ctd>不证明 Run 不存在、已停止或可重发；旧协议/读取失败另列，不补空值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编辑/停止同时触发\u003c/td>\n\u003ctd>认领提交后沿原配置完成，暂停不撤回在途；旧结算不覆盖新配置/暂停状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同 Task 多 Run\u003c/td>\n\u003ctd>重叠检查覆盖本 Schedule 的全部关联非终态 Run，不覆盖手动或其他 Schedule\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面找不到 Schedu
