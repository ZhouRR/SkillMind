md)区分 RUNNING/已物化、取消受理/进程退出/用量结清。\n\n[RunResultPanel](../../SKM/web/src/components/RunResultPanel.tsx)呈现结果/证据/评价；[Flow](task-flow.md)只观察，新增 ViewSpec 组件先扩契约。"}, {"title": "任务启动与执行", "level": "h2", "anchor": "任务启动与执行", "text": "## 任务启动与执行\n\nPreflight 显示精确版本/Task、输入、资源与 readiness，创建时服务端重验。DocumentSourceField 共用显式单份/集合/全集选择，可选未选省略；候选变化不覆盖草稿。\n\n草稿与已发送 payload/key 分开；[创建未知](run-creation.md#提交结果未知时的界面责任)先确认原请求，关窗保留待确认项，刷新/离页不承诺恢复。创建后按 Run ID 读 detail/SSE，以持久 sequence 重放，TEXT_DELTA 不推进 cursor。\n\n[冻结资源](resource-snapshots.md)不能中途换绑，变化须新 Run；文档槽位物化为 Run 级并集，不是槽位私有目录。"}, {"title": "结果与人工评价", "level": "h2", "anchor": "结果与人工评价", "text": "## 结果与人工评价\n\n摘要、交付、Findings、Evidence、限制、Proposal/Effect、Evaluation 分区；confidence 不是正确率。附件按同 Project/Run 发布索引区分采用/未采用，无保存记录不可下载；保持保存时 v1/v2 原义，字节与请求校验见[可信附件](results-evaluation.md#可信附件的发布与读取)。\n\nRunDocumentSnapshots 无 Result 也展示冻结槽位/模式/成员；FROZEN 不代表已物化或可下载。缺失/损坏与合法空数组分开，不拿当前目录补历史，长 ID/hash 局部换行或滚动。"}, {"title": "Evaluation", "level": "h3", "anchor": "evaluation", "text": "### Evaluation\n\n原值、修订、理由与分页历史并列；多修订不自动合并或续行，null 与不存在分开。按[评价界面责任](results-evaluation.md#提交未知与界面责任)保留草稿及原键/内容；未知只读确认或人工原样重发，相似历史不证明原提交。归档只读，换身份/结果不迁移动作。"}, {"title": "Task Center", "level": "h2", "anchor": "task-center", "text": "## Task Center\n\n列表采用服务端 task_id/latest_run 和精确版本，不从 UUID/最近历史推导；支持执行与 Schedule 管理，不提供任意 Task 编辑/复制、对话建 Task 或结果比较。\n\n[只读预览](task-flow.md#只读任务预览)展示单 Task，分开任务声明、Skill 共享要求、来源与全蓝图 readiness；未评估不显示“无需资源”，不启动 Run 或猜步骤状态。\n\nScheduleDialog 共用输入/文档字段；关闭创建销毁未保存草稿，切换 actor/Project 隔离旧响应。独立[调度管理](task-scheduling.md#保存后的管理入口)使用服务端分页/筛选，失效精确任务仍可读、不跟随 latest。冲突/未知保留原请求与草稿，人工采用版本后继续，重开不绕门禁，读取拒绝即关闭写入。\n\n[在途核对](task-scheduling.md#在途只读核对)分开读取时刻、配置版本、认领/租约，旧协议/失败/未见 PENDING 不混同；刷新不重发。预览不造 Run 或限额外次数，浏览器时区不等于规则 timezone。暂停不撤回已认领项，lease 到期不证明停止，run_count 非成功数，last_* 未必同次；不承诺全局串行或 exactly-once。"}, {"title": "对话与调整", "level": "h2", "anchor": "对话与调整", "text": "## 对话与调整\n\n普通答复、外部批准、Skill 调整各走独立协议；终态新目标建新 Run，不自动建 child 关系或开放自然语言管理。"}, {"title": "普通答复与续行状态", "level": "h3", "anchor": "普通答复与续行状态", "text": "### 普通答复与续行状态\n\nInteractionCard 由有 Project 写权成员回答文本/选项，不换绑资源或套用批准身份。共享防重/期限/旧响应隔离，保留草稿与原请求；切标签、刷新或转历史不丢待确认意图。\n\n按[用户交互](user-interactions.md)区分发送/确认/冲突/过期/未知：410 可能已追加 Segment，GET 不证明原 POST 成功；人工原键/内容确认也可能完成首次提交。推荐不自动提交，required=false 不虚构跳过，悬空批准只读。"}, {"title": "审批请求与执行结果", "level": "h3", "anchor": "审批请求与执行结果", "text": "### 审批请求与执行结果\n\n批准卡片在 RunResultPanel，PendingActionsPanel 只发现待办；提交精确 version/checksum/decision/reason，仅 Run 发起人或 ADMIN 可批。\n\n当前点击会换 key；目标按[效果契约](repository-effects.md)保留原 payload/key、先核对未知，新理由/相反决定不占原键。发送/abort 不等于撤销，APPROVED 不等于外部成功。换 actor/Project/Proposal 和刷新须隔离旧动作，不持久保存正文/token，也不按错误码猜远端阶段。"}, {"title": "项目文档管理的职责", "level": "h2", "anchor": "项目文档管理的职责", "text": "## 项目文档管理的职责\n\n文档页管当前资产，Task 管草稿选择，Run 管冻结事实。目录上传非整批事务，HTML 禁脚本不等于断网，列表消失不等于字节/备份清除；协议见[文档设计](document-lifecycle.md)。"}, {"title": "生成展示与流程的交接", "level": "h2", "anchor": "生成展示与流程的交接", "text": "## 生成展示与流程的交接\n\n[生成模块](generated-modules.md)负责 builder/CSP/Host/展示回退，不复用业务 module API 或文档 iframe，失败不切业务版本。[Flow](task-flow.md)负责计划/事实投影；未完成链路不由本页补造。"}, {"title": "可访问性、国际化与隐私", "level": "h2", "anchor": "可访问性国际化与隐私", "text": "## 可访问性、国际化与隐私\n\nzh/ja/en 与用户偏好共用 catalog，report_language 独立。状态不能只靠颜色，键盘/焦点/窄屏/长内容可用；正文不入遥测，不宣称任意输出已统一清洗。"}, {"title": "回归验收", "level": "h2", "anchor": "回归验收", "text": "## 回归验收\n\n- 精确任务/版本、有无 Schema、文档显式范围/历史损坏分别验证；创建未知保留原身份。\n- 资产部分成功/未知/换 context，调度分页/失效任务/版本冲突/时区用真实组件验。\n- SSE 重连不重复、terminal 后结束；普通答复/批准/Evaluation 不互借幂等保证，原结果不变。\n- 关闭弹窗仍有待办；410/未知/晚到与跨 actor 响应可解释，子分析失败范围不隐瞒。\n- 三语、键盘、窄屏/长内容与焦点浏览器验收；Flow/generated 另走专项门禁。\n\n实现与同步见[代码 README](../../SKM/README.md#web)、[变更指南](../development/change-guide.md)。"}], "toc": [{"title": "设计原则", "anchor": "设计原则", "level": "h2"}, {"title": "信息架构", "anchor": "信息架构", "level": "h2"}, {"title": "导航层级", "anchor": "导航层级", "level": "h3"}, {"title": "路由", "anchor": "路由", "level": "h3"}, {"title": "工作空间布局", "anchor": "工作空间布局", "level": "h3"}, {"title": "渲染模式", "anchor": "渲染模式", "level": "h2"}, {"title": "ViewSpec v1alpha1", "anchor": "viewspec-v1alpha1", "level": "h2"}, {"title": "合法结构示例", "anchor": "合法结构示例", "level": "h3"}, {"title": "现行组件与声明组件", "anchor": "现行组件与声明组件", "level": "h2"}, {"title": "任务启动与执行", "anchor": "任务启动与执行", "level": "h2"}, {"title": "结果与人工评价", "anchor": "结果与人工评价", "level": "h2"}, {"title": "Evaluation", "anchor": "evaluation", "level": "h3"}, {"title": "Task Center", "anchor": "task-center", "level": "h2"}, {"title": "对话与调整", "anchor": "对话与调整", "level": "h2"}, {"title": "普通答复与续行状态", "anchor": "普通答复与续行状态", "level": "h3"}, {"title": "审批请求与执行结果", "anchor": "审批请求与执行结果", "level": "h3"}, {"title": "项目文档管理的职责", "anchor": "项目文档管理的职责", "level": "h2"}, {"title": "生成展示与流程的交接", "anchor": "生成展示与流程的交接", "level": "h2"}, {"title": "可访问性、国际化与隐私", "anchor": "可访问性国际化与隐私", "level": "h2"}, {"title": "回归验收", "anchor": "回归验收", "level": "h2"}], "source": "design/workspace.md", "checksum": "8420bd7f3d3917dd6bad3c67a56fd77990beeb41f0d952ac80b084aea5876727"}, {"id": "docs/design/task-flow.md", "title": "Task Flow 与 Run Flow", "group": "design", "html": "\u003ch1 id=\"task-flow-与-run-flow\">Task Flow 与 Run Flow\u003c/h1>\n\u003cp>本页定义只读预览与后续 Run Flow，不新增执行器。现行预览不等于尚未冻结的 TaskFlowProjection，也不补造持久计划；状态见\u003ca href=\"#docs/planning/roadmap.md::r03-task-flow-%E5%AE%8C%E6%95%B4%E9%93%BE%E8%B7%AF\">计划 R03\u003c/a>，前置见\u003ca href=\"#docs/design/skill-contract.md::\">Skill\u003c/a>、\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a>。\u003c/p>\n\u003ch2 id=\"目标\">目标\u003c/h2>\n\u003cp>让用户看懂目标、资源、自动工作/人工确认及交付物，区分三层：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>视图\u003c/th>\n\u003cth>依据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Capability Map：Skill 能做什么\u003c/td>\n\u003ctd>精确 SkillVersion 的 Blueprint\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Task Flow：一个任务建议怎样完成\u003c/td>\n\u003ctd>一个 Task 的计划，当前 Project readiness 单独显示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run Flow：本次实际发生什么\u003c/td>\n\u003ctd>本 Run 冻结计划 + 审计事实，不读最新 Task 替换\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"一个例子计划不等于执行事实\">一个例子：计划不等于执行事实\u003c/h2>\n\u003cp>“读文档 → 分析 → 报告”只是计划：有候选不等于已读取，分析完成不等于质量通过，APPROVED 不等于 apply/read-back 成功。无关联的子分析显示为动态活动；缺事件不猜“已跳过”，不按节点数虚构百分比。\u003c/p>\n\u003ch2 id=\"已定决策\">已定决策\u003c/h2>\n\u003cul>\n\u003cli>Blueprint 是语义正本，节点只引用既有 task/resource/guidance/interaction/effect/deliverable；能力改变走追加解释与 DRAFT/diff/发布，不拖拽扩权。\u003c/li>\n\u003cli>每次投影一个 Task，不做 DAG、循环、自动分支或节点调度。\u003c/li>\n\u003cli>strength 仅 required/recommended；required 须有原规则/来源，不等于已有完成检测。Agent 可在授权/预算内调整推荐、追加只读验证；Project overlay 不得删 required、绕批准或添能力。\u003c/li>\n\u003cli>Run 创建冻结语义/checksum，后续 Segment/Attempt、版本、配置或布局不替换。flow_node_ref 只关联本 Run frozen flow，不用 SDK step_id 猜节点；无关联动态活动不倒写计划。\u003c/li>\n\u003cli>节点与持久待办双入口；回答/批准沿原 API 的身份/版本/CSRF/期限，关窗不丢待办。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"只读任务预览\">只读任务预览\u003c/h2>\n\u003cp>读取须同时满足 Project 授权、同组织、活动启用关系及 PUBLISHED；不存在/未启用/越权统一拒绝。归档可授权读取，但预览不授予执行权。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/contracts/tasks/flow-preview/v1.schema.json\">预览 v1\u003c/a>按单 Task 分区，不生成顺序或节点状态：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>展示规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Task 目标、成功标准、交付物\u003c/td>\n\u003ctd>原 Task 声明及原 Blueprint 指针；可选字段未声明与合法空值分别保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Task 资源\u003c/td>\n\u003ctd>仅取该 Task 的 resource_keys；其余资源单列为 Skill 共享声明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>规则、推荐、确认、效果与执行建议\u003c/td>\n\u003ctd>标明 Skill 共享范围；现 Blueprint 无 Task 关联，不能推定为本任务必经步骤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>来源\u003c/td>\n\u003ctd>原 target/path/line/reason；只验证指针、原文件索引和可用文本快照，不宣称自然语言含义已验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前 readiness\u003c/td>\n\u003ctd>独立 \u003ccode>scope=SKILL_BLUEPRINT\u003c/code> 的 assessment；null 为未评估，不显示“无需资源”，候选不等于已选择或已读取\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>读取入口：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">GET /api/v1/projects/{project_id}/skill-versions/{skill_version_id}/tasks/{task_key}/flow-preview\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"身份来源与失败\">身份、来源与失败\u003c/h3>\n\u003cp>与 DRAFT/发布共用校验：Manifest checksum、版本/解释/来源身份、原 Blueprint 及全部 Task 对应关系通过后才投影。不回写历史，Manifest 默认 \u003ccode>skill_key.task_key\u003c/code> 别名与原 capability 分开，不据此造能力。\u003c/p>\n\u003cp>source trace 的 target 须解析到原 Blueprint，path 须在安全文件索引中。非 binary 必须核对完整 UTF-8 快照的 size/hash/行范围，标为 \u003ccode>TEXT_SNAPSHOT\u003c/code>；binary 仅允许 line=null 的 \u003ccode>SOURCE_INDEX\u003c/code>，不表示已读 blob。两者均不证明规则完整、模型理解或外部可达。\u003c/p>\n\u003cp>\u003ccode>AVAILABLE\u003c/code> 返回原声明；仅未声明/null 返回 \u003ccode>NOT_DECLARED\u003c/code>，不从 Manifest 反推。损坏/身份/来源不符为静态 \u003ccode>409 task_flow_preview_invalid\u003c/code>，目标缺失为 \u003ccode>404 task_flow_preview_not_found\u003c/code>，读取故障为 \u003ccode>503 task_flow_preview_unavailable\u003c/code>。不回显正文/内部路径，成功及已处理拒绝均 no-store。\u003c/p>\n\u003cp>\u003ccode>blueprint_checksum\u003c/code> 使用原 Blueprint 的共享 canonical hash；\u003ccode>preview_checksum\u003c/code> 覆盖 preview_version、identity、status、blueprint_checksum、plan、source_traces，不含 readiness/自身。浏览器核对形状/精确身份并展示服务端 hash，不以 JS 重算 Python 历史格式；它不是签名或 Run 冻结身份。\u003c/p>\n\u003ch3 id=\"数值读取与校验\">数值读取与校验\u003c/h3>\n\u003cp>共享 HTTP 显式 decoder 读取严格 UTF-8；安全整数外的数值保留原 token，不先转 JS Number，也不暴露内部包装。协议、快照/hash 不改写，不另添 raw 字段；hash 未变不证明数值保真。\u003c/p>\n\u003cp>enum 按声明 scalar type 校验，integer 不接收 \u003ccode>1.0\u003c/code>。判重/上下限沿后端整数与双精度语义：\u003ccode>1\u003c/code> 等于 \u003ccode>1.0\u003c/code>，整数 \u003ccode>10**100\u003c/code> 不等于浮点 \u003ccode>1e100\u003c/code>；大整数不先转浮点，嵌套同规则。\u003c/p>\n\u003cp>拒绝非法 JSON、解码后重复 key 和超过 64 层的容器；TaskContract 深度另按契约。上传限额不限制生成 Manifest/enum，不截断合法声明；响应总量/并发内存需另定完整协议，不宣称其他 API 已无损。\u003c/p>\n\u003ch3 id=\"页面边界\">页面边界\u003c/h3>\n\u003cp>单 Task 用标题/列表/展开来源，无需拖拽。来源只匹配原指针及子项，不继承上级或其他 Task；全部来源可另读，无匹配不造依据。读取有期限，刷新/关闭/切 Task/版本/项目/会话隔离旧 200/401；平台三语，来源保留原语言。\u003c/p>\n\u003cp>预览不调用 Interpreter、建 DRAFT/Run、查事件或读脚本/blob；认证续期仍可能写入。未声明保留任务入口，损坏显示不可用而不改版本；执行另过原门禁。\u003c/p>\n\u003ch2 id=\"taskflowprojection-目标契约\">TaskFlowProjection 目标契约\u003c/h2>\n\u003cp>尚未冻结的目标结构：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">TaskFlowProjection\n  flow_version / task_key\n  nodes: id / kind / title / strength / blueprint_refs / source_traces\n  edges: from / to / condition_label\n  checksum\n  layout\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>节点 kind\u003c/th>\n\u003cth>引用依据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>resource\u003c/td>\n\u003ctd>ResourceRequirement、binding/readiness\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>activity\u003c/td>\n\u003ctd>Task、已声明只读 capability、guidance\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gate\u003c/td>\n\u003ctd>success/quality criteria\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>interaction\u003c/td>\n\u003ctd>InteractionPoint/UserInteraction\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>effect\u003c/td>\n\u003ctd>EffectIntent/Proposal/批准策略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>deliverable\u003c/td>\n\u003ctd>Task deliverable、Result/Artifact\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>不把全部规则拆成节点；edges 只表示建议，condition_label 不执行表达式/JS，不推导前置完成。\u003c/p>\n\u003ch3 id=\"计划身份与显示布局\">计划身份与显示布局\u003c/h3>\n\u003cp>语义 checksum 覆盖版本、Task、节点/边/引用/约束，不含实际状态或布局；语义变更走 DRAFT/发布，保存布局仍校验结构/文件完整性。节点 ID 计划内唯一，事件按 frozen flow 定位，不按标题/位置/SDK ID 猜测。采用\u003ca href=\"../SKM/backend/src/skillmind/core/hashing.py\">共享 hash\u003c/a>，同步 Schema/example 与消费者。\u003c/p>\n\u003ch3 id=\"从发布到历史重放\">从发布到历史重放\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">精确 Task/Blueprint → 来源验证/发布 Flow\n  → Run 创建冻结内容/checksum\n  → 持久事件与交互/效果可选关联\n  → 可重建的 Run Flow\n\u003c/code>\u003c/pre>\n\u003cp>旧版未声明则回退摘要/资源/动态活动；声明损坏须在发布/创建拒绝，历史保留事件并显示不可用，不借最新蓝图修饰。接线须同步 projector、Brief/checksum、Run detail/SSE、Web、契约与历史兼容；只读阶段不提前造 frozen 字段。\u003c/p>\n\u003ch2 id=\"目标用户体验\">目标用户体验\u003c/h2>\n\u003cp>Skill 默认预览、详情展开 report/Blueprint/diff/来源；Task Center 叠加 readiness，合法 Provider/binding 才显示可执行。Workspace 保留计划、动态活动、待办、证据及 Conversation/Result/Events；三语/长标题/未知可读，窄屏与键盘列表不依赖拖拽或颜色。\u003c/p>\n\u003ch2 id=\"实施工作包\">实施工作包\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>必须交付\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>只读投影\u003c/td>\n\u003ctd>复用现有 Blueprint/Task/readiness，能懂资源/建议/确认/产物，不改变执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>契约与 DRAFT\u003c/td>\n\u003ctd>可选 Schema、解释/校验、diff/编辑、发布身份和不扩权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 观察\u003c/td>\n\u003ctd>frozen flow、动态活动、可选关联、SSE 重放/重连与子分析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交互/证据联动\u003c/td>\n\u003ctd>原 API、持久待办、详情跳转、权限与状态一致\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>不依赖 generated FrontendModule，不增业务 Provider 分支或第二个 Run controller。\u003c/p>\n\u003ch2 id=\"节点状态的事实来源\">节点状态的事实来源\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>信息\u003c/th>\n\u003cth>依据与不可推导项\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>resource\u003c/td>\n\u003ctd>Task 看 readiness，Run 看冻结/真实准备；候选不等于读成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>activity\u003c/td>\n\u003ctd>关联 STEP 开始/完成/失败；活动完成不证明业务规则全过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gate\u003c/td>\n\u003ctd>明确检查结果、Evidence/人工确认；模型口头声明不足\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>interaction\u003c/td>\n\u003ctd>持久状态、Response/期限；关窗/发送中不等于受理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>effect\u003c/td>\n\u003ctd>Proposal/Approval/EffectExecution 分别显示；批准不等于外部成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>deliverable\u003c/td>\n\u003ctd>实际 Result/Artifact 及可访问性；SUCCEEDED 不补造产物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dynamic\u003c/td>\n\u003ctd>无关联实际事件/子分析；不倒写计划或升级 required\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>无事件显示“尚无执行证据”，未知/失败/无关联文字区分。旧 Run 无 flow 只显示当时活动；旁列最新 Task 必须标为非原计划，不拼旧完成状态。\u003c/p>\n\u003ch2 id=\"完成标准\">完成标准\u003c/h2>\n\u003cul>\n\u003cli>无 Flow 的 Skill 正常运行；拖布局不改语义，新发布不覆盖旧 Run。\u003c/li>\n\u003cli>删 required/添能力拒绝；损坏新契约与未声明旧契约分开处理。\u003c/li>\n\u003cli>SSE 重复/断线可重建，无关联不猜节点，不重复计数。\u003c/li>\n\u003cli>关闭弹窗仍有待办；回答、批准、apply/read-back 是不同事实。\u003c/li>\n\u003cli>Schema/consumer/三语与历史兼容同时回归；实际浏览器验证键盘/窄屏/来源与失败可读，图能显示不算全部验收。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "Task Flow 与 Run Flow", "level": "h1", "anchor": "task-flow-与-run-flow", "text": "# Task Flow 与 Run Flow\n\n本页定义只读预览与后续 Run Flow，不新增执行器。现行预览不等于尚未冻结的 TaskFlowProjection，也不补造持久计划；状态见[计划 R03](../planning/roadmap.md#r03-task-flow-完整链路)，前置见[Skill](skill-contract.md)、[Workspace](workspace.md)。"}, {"title": "目标", "level": "h2", "anchor": "目标", "text": "## 目标\n\n让用户看懂目标、资源、自动工作/人工确认及交付物，区分三层：\n\n| 视图 | 依据 |\n| --- | --- |\n| Capability Map：Skill 能做什么 | 精确 SkillVersion 的 Blueprint |\n| Task Flow：一个任务建议怎样完成 | 一个 Task 的计划，当前 Project readiness 单独显示 |\n| Run Flow：本次实际发生什么 | 本 Run 冻结计划 + 审计事实，不读最新 Task 替换 |"}, {"title": "一个例子：计划不等于执行事实", "level": "h2", "anchor": "一个例子计划不等于执行事实", "text": "## 一个例子：计划不等于执行事实\n\n“读文档 → 分析 → 报告”只是计划：有候选不等于已读取，分析完成不等于质量通过，APPROVED 不等于 apply/read-back 成功。无关联的子分析显示为动态活动；缺事件不猜“已跳过”，不按节点数虚构百分比。"}, {"title": "已定决策", "level": "h2", "anchor": "已定决策", "text": "## 已定决策\n\n- Blueprint 是语义正本，节点只引用既有 task/resource/guidance/interaction/effect/deliverable；能力改变走追加解释与 DRAFT/diff/发布，不拖拽扩权。\n- 每次投影一个 Task，不做 DAG、循环、自动分支或节点调度。\n- strength 仅 required/recommended；required 须有原规则/来源，不等于已有完成检测。Agent 可在授权/预算内调整推荐、追加只读验证；Project overlay 不得删 required、绕批准或添能力。\n- Run 创建冻结语义/checksum，后续 Segment/Attempt、版本、配置或布局不替换。flow_node_ref 只关联本 Run frozen flow，不用 SDK step_id 猜节点；无关联动态活动不倒写计划。\n- 节点与持久待办双入口；回答/批准沿原 API 的身份/版本/CSRF/期限，关窗不丢待办。"}, {"title": "只读任务预览", "level": "h2", "anchor": "只读任务预览", "text": "## 只读任务预览\n\n读取须同时满足 Project 授权、同组织、活动启用关系及 PUBLISHED；不存在/未启用/越权统一拒绝。归档可授权读取，但预览不授予执行权。\n\n[预览 v1](../../SKM/contracts/tasks/flow-preview/v1.schema.json)按单 Task 分区，不生成顺序或节点状态：\n\n| 内容 | 展示规则 |\n| --- | --- |\n| Task 目标、成功标准、交付物 | 原 Task 声明及原 Blueprint 指针；可选字段未声明与合法空值分别保留 |\n| Task 资源 | 仅取该 Task 的 resource_keys；其余资源单列为 Skill 共享声明 |\n| 规则、推荐、确认、效果与执行建议 | 标明 Skill 共享范围；现 Blueprint 无 Task 关联，不能推定为本任务必经步骤 |\n| 来源 | 原 target/path/line/reason；只验证指针、原文件索引和可用文本快照，不宣称自然语言含义已验证 |\n| 当前 readiness | 独立 `scope=SKILL_BLUEPRINT` 的 assessment；null 为未评估，不显示“无需资源”，候选不等于已选择或已读取 |\n\n读取入口：\n\n```text\nGET /api/v1/projects/{project_id}/skill-versions/{skill_version_id}/tasks/{task_key}/flow-preview\n```"}, {"title": "身份、来源与失败", "level": "h3", "anchor": "身份来源与失败", "text": "### 身份、来源与失败\n\n与 DRAFT/发布共用校验：Manifest checksum、版本/解释/来源身份、原 Blueprint 及全部 Task 对应关系通过后才投影。不回写历史，Manifest 默认 `skill_key.task_key` 别名与原 capability 分开，不据此造能力。\n\nsource trace 的 target 须解析到原 Blueprint，path 须在安全文件索引中。非 binary 必须核对完整 UTF-8 快照的 size/hash/行范围，标为 `TEXT_SNAPSHOT`；binary 仅允许 line=null 的 `SOURCE_INDEX`，不表示已读 blob。两者均不证明规则完整、模型理解或外部可达。\n\n`AVAILABLE` 返回原声明；仅未声明/null 返回 `NOT_DECLARED`，不从 Manifest 反推。损坏/身份/来源不符为静态 `409 task_flow_preview_invalid`，目标缺失为 `404 task_flow_preview_not_found`，读取故障为 `503 task_flow_preview_unavailable`。不回显正文/内部路径，成功及已处理拒绝均 no-store。\n\n`blueprint_checksum` 使用原 Blueprint 的共享 canonical hash；`preview_checksum` 覆盖 preview_version、identity、status、blueprint_checksum、plan、source_traces，不含 readiness/自身。浏览器核对形状/精确身份并展示服务端 hash，不以 JS 重算 Python 历史格式；它不是签名或 Run 冻结身份。"}, {"title": "数值读取与校验", "level": "h3", "anchor": "数值读取与校验", "text": "### 数值读取与校验\n\n共享 HTTP 显式 decoder 读取严格 UTF-8；安全整数外的数值保留原 token，不先转 JS Number，也不暴露内部包装。协议、快照/hash 不改写，不另添 raw 字段；hash 未变不证明数值保真。\n\nenum 按声明 scalar type 校验，integer 不接收 `1.0`。判重/上下限沿后端整数与双精度语义：`1` 等于 `1.0`，整数 `10**100` 不等于浮点 `1e100`；大整数不先转浮点，嵌套同规则。\n\n拒绝非法 JSON、解码后重复 key 和超过 64 层的容器；TaskContract 深度另按契约。上传限额不限制生成 Manifest/enum，不截断合法声明；响应总量/并发内存需另定完整协议，不宣称其他 API 已无损。"}, {"title": "页面边界", "level": "h3", "anchor": "页面边界", "text": "### 页面边界\n\n单 Task 用标题/列表/展开来源，无需拖拽。来源只匹配原指针及子项，不继承上级或其他 Task；全部来源可另读，无匹配不造依据。读取有期限，刷新/关闭/切 Task/版本/项目/会话隔离旧 200/401；平台三语，来源保留原语言。\n\n预览不调用 Interpreter、建 DRAFT/Run、查事件或读脚本/blob；认证续期仍可能写入。未声明保留任务入口，损坏显示不可用而不改版本；执行另过原门禁。"}, {"title": "TaskFlowProjection 目标契约", "level": "h2", "anchor": "taskflowprojection-目标契约", "text": "## TaskFlowProjection 目标契约\n\n尚未冻结的目标结构：\n\n```text\nTaskFlowProjection\n  flow_version / task_key\n  nodes: id / kind / title / strength / blueprint_refs / source_traces\n  edges: from / to / condition_label\n  checksum\n  layout\n```\n\n| 节点 kind | 引用依据 |\n| --- | --- |\n| resource | ResourceRequirement、binding/readiness |\n| activity | Task、已声明只读 capability、guidance |\n| gate | success/quality criteria |\n| interaction | InteractionPoint/UserInteraction |\n| effect | EffectIntent/Proposal/批准策略 |\n| deliverable | Task deliverable、Result/Artifact |\n\n不把全部规则拆成节点；edges 只表示建议，condition_label 不执行表达式/JS，不推导前置完成。"}, {"title": "计划身份与显示布局", "level": "h3", "anchor": "计划身份与显示布局", "text": "### 计划身份与显示布局\n\n语义 checksum 覆盖版本、Task、节点/边/引用/约束，不含实际状态或布局；语义变更走 DRAFT/发布，保存布局仍校验结构/文件完整性。节点 ID 计划内唯一，事件按 frozen flow 定位，不按标题/位置/SDK ID 猜测。采用[共享 hash](../../SKM/backend/src/skillmind/core/hashing.py)，同步 Schema/example 与消费者。"}, {"title": "从发布到历史重放", "level": "h3", "anchor": "从发布到历史重放", "text": "### 从发布到历史重放\n\n```text\n精确 Task/Blueprint → 来源验证/发布 Flow\n  → Run 创建冻结内容/checksum\n  → 持久事件与交互/效果可选关联\n  → 可重建的 Run Flow\n```\n\n旧版未声明则回退摘要/资源/动态活动；声明损坏须在发布/创建拒绝，历史保留事件并显示不可用，不借最新蓝图修饰。接线须同步 projector、Brief/checksum、Run detail/SSE、Web、契约与历史兼容；只读阶段不提前造 frozen 字段。"}, {"title": "目标用户体验", "level": "h2", "anchor": "目标用户体验", "text": "## 目标用户体验\n\nSkill 默认预览、详情展开 report/Blueprint/diff/来源；Task Center 叠加 readiness，合法 Provider/binding 才显示可执行。Workspace 保留计划、动态活动、待办、证据及 Conversation/Result/Events；三语/长标题/未知可读，窄屏与键盘列表不依赖拖拽或颜色。"}, {"title": "实施工作包", "level": "h2", "anchor": "实施工作包", "text": "## 实施工作包\n\n| 阶段 | 必须交付 |\n| --- | --- |\n| 只读投影 | 复用现有 Blueprint/Task/readiness，能懂资源/建议/确认/产物，不改变执行 |\n| 契约与 DRAFT | 可选 Schema、解释/校验、diff/编辑、发布身份和不扩权 |\n| Run 观察 | frozen flow、动态活动、可选关联、SSE 重放/重连与子分析 |\n| 交互/证据联动 | 原 API、持久待办、详情跳转、权限与状态一致 |\n\n不依赖 generated FrontendModule，不增业务 Provider 分支或第二个 Run controller。"}, {"title": "节点状态的事实来源", "level": "h2", "anchor": "节点状态的事实来源", "text": "## 节点状态的事实来源\n\n| 信息 | 依据与不可推导项 |\n| --- | --- |\n| resource | Task 看 readiness，Run 看冻结/真实准备；候选不等于读成功 |\n| activity | 关联 STEP 开始/完成/失败；活动完成不证明业务规则全过 |\n| gate | 明确检查结果、Evidence/人工确认；模型口头声明不足 |\n| interaction | 持久状态、Response/期限；关窗/发送中不等于受理 |\n| effect | Proposal/Approval/EffectExecution 分别显示；批准不等于外部成功 |\n| deliverable | 实际 Result/Artifact 及可访问性；SUCCEEDED 不补造产物 |\n| dynamic | 无关联实际事件/子分析；不倒写计划或升级 required |\n\n无事件显示“尚无执行证据”，未知/失败/无关联文字区分。旧 Run 无 flow 只显示当时活动；旁列最新 Task 必须标为非原计划，不拼旧完成状态。"}, {"title": "完成标准", "level": "h2", "anchor": "完成标准", "text": "## 完成标准\n\n- 无 Flow 的 Skill 正常运行；拖布局不改语义，新发布不覆盖旧 Run。\n- 删 required/添能力拒绝；损坏新契约与未声明旧契约分开处理。\n- SSE 重复/断线可重建，无关联不猜节点，不重复计数。\n- 关闭弹窗仍有待办；回答、批准、apply/read-back 是不同事实。\n- Schema/consumer/三语与历史兼容同时回归；实际浏览器验证键盘/窄屏/来源与失败可读，图能显示不算全部验收。"}], "toc": [{"title": "目标", "anchor": "目标", "level": "h2"}, {"title": "一个例子：计划不等于执行事实", "anchor": "一个例子计划不等于执行事实", "level": "h2"}, {"title": "已定决策", "anchor": "已定决策", "level": "h2"}, {"title": "只读任务预览", "anchor": "只读任务预览", "level": "h2"}, {"title": "身份、来源与失败", "anchor": "身份来源与失败", "level": "h3"}, {"title": "数值读取与校验", "anchor": "数值读取与校验", "level": "h3"}, {"title": "页面边界", "anchor": "页面边界", "level": "h3"}, {"title": "TaskFlowProjection 目标契约", "anchor": "taskflowprojection-目标契约", "level": "h2"}, {"title": "计划身份与显示布局", "anchor": "计划身份与显示布局", "level": "h3"}, {"title": "从发布到历史重放", "anchor": "从发布到历史重放", "level": "h3"}, {"title": "目标用户体验", "anchor": "目标用户体验", "level": "h2"}, {"title": "实施工作包", "anchor": "实施工作包", "level": "h2"}, {"title": "节点状态的事实来源", "anchor": "节点状态的事实来源", "level": "h2"}, {"title": "完成标准", "anchor": "完成标准", "level": "h2"}], "source": "design/task-flow.md", "checksum": "f2e75435744737c81e06b1a3ce0ce84b02293915b00faf61a2a0be03ea1db8c6"}, {"id": "docs/design/generated-modules.md", "title": "生成 FrontendModule", "group": "design", "html": "\u003ch1 id=\"生成-frontendmodule\">生成 FrontendModule\u003c/h1>\n\u003cp>本页负责生成界面的构建、隔离、版本和回退，业务/执行仍归 \u003ca href=\"#docs/design/skill-contract.md::\">SkillVersion\u003c/a>/\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>。当前仅有版本模型与纯检查函数，完整链路未接；状态见\u003ca href=\"#docs/planning/roadmap.md::r04-%E7%94%9F%E6%88%90%E6%A8%A1%E5%9D%97\">计划 R04\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清三种模块与预览\">先分清三种模块与预览\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>业务模块\u003c/td>\n\u003ctd>SkillComposition 组合精确 SkillVersion；现有 projects/modules API 只管理此对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成界面\u003c/td>\n\u003ctd>FrontendModuleVersion 对应隔离展示产物，不是新的业务能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档预览\u003c/td>\n\u003ctd>DocumentManagerPanel 的禁脚本 HTML，不可加 allow-scripts 当作生成 Preview\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>standard/ViewSpec 不执行生成代码；生成 Preview 已是代码执行，必须先过首次执行门禁。\u003c/p>\n\u003ch2 id=\"一个例子图表坏了任务没有失败\">一个例子：图表坏了，任务没有失败\u003c/h2>\n\u003cp>目标行为：G2 超时则关闭本页 iframe/通道，以 standard 展示原 Result/Evidence；不重跑、不换业务 SkillVersion、不全局停版。管理员可另选兼容且未停用的 G1，当前尚未实现。\u003c/p>\n\u003ch2 id=\"目标与流水线\">目标与流水线\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">冻结源码/依赖/构建配置 → 静态检查\n  → 隔离构建与断网测试 → 冻结产物/CSP/报告\n  → 隔离预览 → ADMIN 发布 → 独立展示选择\n  → Host 受控交互；本页失败回退 standard\n\u003c/code>\u003c/pre>\n\u003cp>模块只呈现，不创建服务、DB、Secret、Tool 或权限；builder 不接 edge、不挂凭据/Docker socket，只用批准依赖来源。\u003c/p>\n\u003ch2 id=\"现有代码与公开契约\">现有代码与公开契约\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前载体\u003c/th>\n\u003cth>不能推导的保证\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>FrontendModuleVersion / 0026\u003c/td>\n\u003ctd>有状态/hash/CSP/报告列，但无 service/repository 接线或完整 DB 不可变保护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plan_module_transition / require_publishable\u003c/td>\n\u003ctd>检查状态、bundle_hash、静态拒绝；不验证 blob/hash、完整报告或浏览器安全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>analyze_module_sources / validate_dependencies / plan_module_build\u003c/td>\n\u003ctd>局部前置函数，不执行安装、构建、隔离或投放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RuntimeManifest\u003c/td>\n\u003ctd>ui.frontend_module 当前只允许 null；Module API 常量不是 Host Schema/SDK\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>入口：\u003ca href=\"../SKM/backend/src/skillmind/modules\">modules\u003c/a>、\u003ca href=\"../SKM/contracts/runtime-manifest/v1alpha1.schema.json\">RuntimeManifest\u003c/a>。不向业务 module API 塞 bundle URL 或借 ViewSpec 绕协议。\u003c/p>\n\u003ch2 id=\"决策与安全边界\">决策与安全边界\u003c/h2>\n\u003ch3 id=\"origin-与-csp\">Origin 与 CSP\u003c/h3>\n\u003cp>目标为同主机 context path 的专用 bundle-hash 路径。iframe 仅 \u003ccode>sandbox=\u0026quot;allow-scripts\u0026quot;\u003c/code>，无 same-origin/弹窗/顶层导航/下载权限；HTTP 还须带 \u003ccode>Content-Security-Policy: sandbox allow-scripts\u003c/code> 保护直接导航，meta/Report-Only 无效，见 \u003ca href=\"https://www.w3.org/TR/CSP3/#directive-sandbox\">CSP\u003c/a>。\u003c/p>\n\u003cp>opaque origin 不保证请求无本站 cookie；静态路径不处理 mutation，API 独立验身份/Origin/CSRF/归属。同主机须专项威胁建模，不能视为独立站点隔离。\u003c/p>\n\u003cp>产物与脚本/样式 CSP 同时冻结，优先 hash；nonce 须先定义响应/缓存/完整性，不能长期固定。不得用 unsafe-inline/unsafe-eval、宽泛公网或未验证的 'self' 修错。CSP 覆盖加载、base-uri、form-action、frame/object/worker 与嵌入方；connect-src 不控制全部出网/导航，须实测允许渲染和禁止出网。\u003c/p>\n\u003ch3 id=\"当前-csp-常量不是投放配置\">当前 CSP 常量不是投放配置\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/modules/domain.py\">domain.py\u003c/a> 的 'self'/unsafe-inline 等常量尚不满足目标，也未用于投放。字符串测试不证明安全；旧记录缺验证保持不可运行，不覆盖 CSP 伪造验收。\u003c/p>\n\u003ch3 id=\"静态拒绝与依赖\">静态拒绝与依赖\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/modules/static_analysis.py\">静态检查\u003c/a>字面拒绝动态代码/网络/宿主 context/外部 URL/动态 import/持久存储，仍可能误报或漏过间接调用；通过不是执行许可，报告也须脱敏。\u003c/p>\n\u003cp>声明仅允许 react/react-dom/@skillmind/module-sdk/@skillmind/ui，不证明内部包可用。冻结版本与完整 lockfile 闭包，禁止 lifecycle script、native/Git/动态依赖；验证 manifest 后检查全部实际包，不能只查顶层。\u003c/p>\n\u003ch3 id=\"构建网络\">构建网络\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/modules/build_plan.py\">build_plan.py\u003c/a>的来源拒绝不是 egress allowlist。builder 只访问批准 registry/mirror，核验 resolved URL、重定向和出口，构建后断网测试；host 黑名单不能替代。\u003c/p>\n\u003ch3 id=\"构建输入与结果的提交\">构建输入与结果的提交\u003c/h3>\n\u003col>\n\u003cli>冻结源码/lockfile/依赖闭包、工具链/构建器、策略/限额与请求身份，不接受自选 Shell/输出路径。\u003c/li>\n\u003cli>独立临时目录运行平台命令；分别限制 CPU、内存、进程、磁盘、时间、产物大小，禁安装脚本。\u003c/li>\n\u003cli>受信提交者核对原请求、完整产物/hash、静态/隔离报告后提交 BUILT；网络 I/O 不占长期 DB 锁。\u003c/li>\n\u003cli>未知确认原身份，不重复发布；无完整记录不投放。BUILT、Preview、发布与选择分开决定，孤立产物延后清理。\u003c/li>\n\u003c/ol>\n\u003cp>报告/源码/产物须授权读取并有保留/恢复规则，普通成员不见原始错误/路径。\u003c/p>\n\u003ch2 id=\"host-协议\">Host 协议\u003c/h2>\n\u003cp>公开协议尚未冻结。null origin 不能授信，Host 须验 source window、随机 nonce、精确模块版本、当前 Project/Task/Run 与 payload Schema；nonce 只标识挂载。\u003c/p>\n\u003cp>仅开放最小 context/result、草稿更新、平台 Preflight/调度草稿、当前 Run 订阅和授权附件展示；不自动提交草稿或代理任意 URL，禁直接 API、批准、账户/Skill/Secret 管理及跨 Run 读取。\u003c/p>\n\u003ch3 id=\"挂载切换与晚到消息\">挂载、切换与晚到消息\u003c/h3>\n\u003cp>版本/账号/Project/Task/Run 切换、iframe 导航/重载/回退均关闭旧通道/订阅并拒绝晚到；同窗口不跨导航授信，草稿验当前版本。\u003c/p>\n\u003cp>若初始化必须以 * 向 opaque 接收方发送，引导不得含正文/凭据；专用通道、nonce 与导航失效评审通过后才传数据，见\u003ca href=\"https://html.spec.whatwg.org/multipage/web-messaging.html#security-postmsg\">消息安全\u003c/a>。限制 payload/速率/在途/重复动作，未知协议拒绝，不做通用 API proxy。\u003c/p>\n\u003ch2 id=\"版本与回退\">版本与回退\u003c/h2>\n\u003cp>版本绑定精确 SkillVersion，冻结 source/lockfile/bundle hash、Module API/CSP/报告。DRAFT → BUILT → PUBLISHED，各阶段可 DISABLED 且不可恢复；事务/审计待接。\u003c/p>\n\u003ch3 id=\"内容身份与历史兼容\">内容身份与历史兼容\u003c/h3>\n\u003cp>现唯一键 (skill_version_id, source_hash) 不区分依赖/工具链/CSP 变化。目标分源码、完整构建输入与产物身份：同输入确认原请求，不同输入建新版本，不伪造 hash/覆盖 bundle。同步 DB 唯一约束、repository 和发布契约，保留旧 ID/hash/引用；缺验证不投放，frozen DTO 不替代 DB 保护。\u003c/p>\n\u003ch3 id=\"展示选择与全局停用\">展示选择与全局停用\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>目标处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>本页超时、崩溃、协议错误\u003c/td>\n\u003ctd>关闭实例，保留草稿/焦点，standard 展示原结果；不重试业务或全局停版\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回选旧展示版\u003c/td>\n\u003ctd>经授权和并发检查选择兼容、仍可投放版本；不改 Run 或复活 DISABLED\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>管理员/安全停用\u003c/td>\n\u003ctd>记录 actor/原因/原选择，阻止新投放并使 Host 失效；不由不可信客户端错误单独触发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无模块、不兼容、历史验证不足\u003c/td>\n\u003ctd>standard，不猜 latest，不重新运行旧任务\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>展示故障不切业务 SkillVersion；bundle hash/缓存不越过 Project/停用检查。已下载字节不可收回，撤回传播、Host 断开和恢复分别验收。\u003c/p>\n\u003ch2 id=\"实施顺序与验收\">实施顺序与验收\u003c/h2>\n\u003cp>按身份/契约 → builder → 安全投放/Host → 发布/选择/回退推进；威胁模型与隔离门禁通过前不执行代码。\u003c/p>\n\u003cul>\n\u003cli>同源码换依赖/策略有新身份；超时重试无重复发布，未知可确认。\u003c/li>\n\u003cli>拒绝外部 host/重定向、传递脚本、伪造报告和超额产物，无半份可运行产物。\u003c/li>\n\u003cli>直接导航/iframe/缓存/错误响应检验实际 CSP；允许渲染正常，禁止的网络/DOM/导航失败。\u003c/li>\n\u003cli>null-origin 伪造、错 nonce、旧 iframe、换 actor/context、过大/重复消息不泄漏、不覆盖草稿、不写业务。\u003c/li>\n\u003cli>G2 失败、旧版不兼容与全局停用都能保留同一结果的 standard 入口；三语、键盘、窄屏可用。\u003c/li>\n\u003cli>\u003ca href=\"../SKM/backend/tests/modules\">局部回归\u003c/a>不代替真实 builder、代理和浏览器安全验收。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "生成 FrontendModule", "level": "h1", "anchor": "生成-frontendmodule", "text": "# 生成 FrontendModule\n\n本页负责生成界面的构建、隔离、版本和回退，业务/执行仍归 [SkillVersion](skill-contract.md)/[Runtime](agent-runtime.md)。当前仅有版本模型与纯检查函数，完整链路未接；状态见[计划 R04](../planning/roadmap.md#r04-生成模块)。"}, {"title": "先分清三种模块与预览", "level": "h2", "anchor": "先分清三种模块与预览", "text": "## 先分清三种模块与预览\n\n| 名称 | 边界 |\n| --- | --- |\n| 业务模块 | SkillComposition 组合精确 SkillVersion；现有 projects/modules API 只管理此对象 |\n| 生成界面 | FrontendModuleVersion 对应隔离展示产物，不是新的业务能力 |\n| 文档预览 | DocumentManagerPanel 的禁脚本 HTML，不可加 allow-scripts 当作生成 Preview |\n\nstandard/ViewSpec 不执行生成代码；生成 Preview 已是代码执行，必须先过首次执行门禁。"}, {"title": "一个例子：图表坏了，任务没有失败", "level": "h2", "anchor": "一个例子图表坏了任务没有失败", "text": "## 一个例子：图表坏了，任务没有失败\n\n目标行为：G2 超时则关闭本页 iframe/通道，以 standard 展示原 Result/Evidence；不重跑、不换业务 SkillVersion、不全局停版。管理员可另选兼容且未停用的 G1，当前尚未实现。"}, {"title": "目标与流水线", "level": "h2", "anchor": "目标与流水线", "text": "## 目标与流水线\n\n```text\n冻结源码/依赖/构建配置 → 静态检查\n  → 隔离构建与断网测试 → 冻结产物/CSP/报告\n  → 隔离预览 → ADMIN 发布 → 独立展示选择\n  → Host 受控交互；本页失败回退 standard\n```\n\n模块只呈现，不创建服务、DB、Secret、Tool 或权限；builder 不接 edge、不挂凭据/Docker socket，只用批准依赖来源。"}, {"title": "现有代码与公开契约", "level": "h2", "anchor": "现有代码与公开契约", "text": "## 现有代码与公开契约\n\n| 当前载体 | 不能推导的保证 |\n| --- | --- |\n| FrontendModuleVersion / 0026 | 有状态/hash/CSP/报告列，但无 service/repository 接线或完整 DB 不可变保护 |\n| plan_module_transition / require_publishable | 检查状态、bundle_hash、静态拒绝；不验证 blob/hash、完整报告或浏览器安全 |\n| analyze_module_sources / validate_dependencies / plan_module_build | 局部前置函数，不执行安装、构建、隔离或投放 |\n| RuntimeManifest | ui.frontend_module 当前只允许 null；Module API 常量不是 Host Schema/SDK |\n\n入口：[modules](../../SKM/backend/src/skillmind/modules/)、[RuntimeManifest](../../SKM/contracts/runtime-manifest/v1alpha1.schema.json)。不向业务 module API 塞 bundle URL 或借 ViewSpec 绕协议。"}, {"title": "决策与安全边界", "level": "h2", "anchor": "决策与安全边界", "text": "## 决策与安全边界"}, {"title": "Origin 与 CSP", "level": "h3", "anchor": "origin-与-csp", "text": "### Origin 与 CSP\n\n目标为同主机 context path 的专用 bundle-hash 路径。iframe 仅 `sandbox=\"allow-scripts\"`，无 same-origin/弹窗/顶层导航/下载权限；HTTP 还须带 `Content-Security-Policy: sandbox allow-scripts` 保护直接导航，meta/Report-Only 无效，见 [CSP](https://www.w3.org/TR/CSP3/#directive-sandbox)。\n\nopaque origin 不保证请求无本站 cookie；静态路径不处理 mutation，API 独立验身份/Origin/CSRF/归属。同主机须专项威胁建模，不能视为独立站点隔离。\n\n产物与脚本/样式 CSP 同时冻结，优先 hash；nonce 须先定义响应/缓存/完整性，不能长期固定。不得用 unsafe-inline/unsafe-eval、宽泛公网或未验证的 'self' 修错。CSP 覆盖加载、base-uri、form-action、frame/object/worker 与嵌入方；connect-src 不控制全部出网/导航，须实测允许渲染和禁止出网。"}, {"title": "当前 CSP 常量不是投放配置", "level": "h3", "anchor": "当前-csp-常量不是投放配置", "text": "### 当前 CSP 常量不是投放配置\n\n[domain.py](../../SKM/backend/src/skillmind/modules/domain.py) 的 'self'/unsafe-inline 等常量尚不满足目标，也未用于投放。字符串测试不证明安全；旧记录缺验证保持不可运行，不覆盖 CSP 伪造验收。"}, {"title": "静态拒绝与依赖", "level": "h3", "anchor": "静态拒绝与依赖", "text": "### 静态拒绝与依赖\n\n[静态检查](../../SKM/backend/src/skillmind/modules/static_analysis.py)字面拒绝动态代码/网络/宿主 context/外部 URL/动态 import/持久存储，仍可能误报或漏过间接调用；通过不是执行许可，报告也须脱敏。\n\n声明仅允许 react/react-dom/@skillmind/module-sdk/@skillmind/ui，不证明内部包可用。冻结版本与完整 lockfile 闭包，禁止 lifecycle script、native/Git/动态依赖；验证 manifest 后检查全部实际包，不能只查顶层。"}, {"title": "构建网络", "level": "h3", "anchor": "构建网络", "text": "### 构建网络\n\n[build_plan.py](../../SKM/backend/src/skillmind/modules/build_plan.py)的来源拒绝不是 egress allowlist。builder 只访问批准 registry/mirror，核验 resolved URL、重定向和出口，构建后断网测试；host 黑名单不能替代。"}, {"title": "构建输入与结果的提交", "level": "h3", "anchor": "构建输入与结果的提交", "text": "### 构建输入与结果的提交\n\n1. 冻结源码/lockfile/依赖闭包、工具链/构建器、策略/限额与请求身份，不接受自选 Shell/输出路径。\n2. 独立临时目录运行平台命令；分别限制 CPU、内存、进程、磁盘、时间、产物大小，禁安装脚本。\n3. 受信提交者核对原请求、完整产物/hash、静态/隔离报告后提交 BUILT；网络 I/O 不占长期 DB 锁。\n4. 未知确认原身份，不重复发布；无完整记录不投放。BUILT、Preview、发布与选择分开决定，孤立产物延后清理。\n\n报告/源码/产物须授权读取并有保留/恢复规则，普通成员不见原始错误/路径。"}, {"title": "Host 协议", "level": "h2", "anchor": "host-协议", "text": "## Host 协议\n\n公开协议尚未冻结。null origin 不能授信，Host 须验 source window、随机 nonce、精确模块版本、当前 Project/Task/Run 与 payload Schema；nonce 只标识挂载。\n\n仅开放最小 context/result、草稿更新、平台 Preflight/调度草稿、当前 Run 订阅和授权附件展示；不自动提交草稿或代理任意 URL，禁直接 API、批准、账户/Skill/Secret 管理及跨 Run 读取。"}, {"title": "挂载、切换与晚到消息", "level": "h3", "anchor": "挂载切换与晚到消息", "text": "### 挂载、切换与晚到消息\n\n版本/账号/Project/Task/Run 切换、iframe 导航/重载/回退均关闭旧通道/订阅并拒绝晚到；同窗口不跨导航授信，草稿验当前版本。\n\n若初始化必须以 * 向 opaque 接收方发送，引导不得含正文/凭据；专用通道、nonce 与导航失效评审通过后才传数据，见[消息安全](https://html.spec.whatwg.org/multipage/web-messaging.html#security-postmsg)。限制 payload/速率/在途/重复动作，未知协议拒绝，不做通用 API proxy。"}, {"title": "版本与回退", "level": "h2", "anchor": "版本与回退", "text": "## 版本与回退\n\n版本绑定精确 SkillVersion，冻结 source/lockfile/bundle hash、Module API/CSP/报告。DRAFT → BUILT → PUBLISHED，各阶段可 DISABLED 且不可恢复；事务/审计待接。"}, {"title": "内容身份与历史兼容", "level": "h3", "anchor": "内容身份与历史兼容", "text": "### 内容身份与历史兼容\n\n现唯一键 (skill_version_id, source_hash) 不区分依赖/工具链/CSP 变化。目标分源码、完整构建输入与产物身份：同输入确认原请求，不同输入建新版本，不伪造 hash/覆盖 bundle。同步 DB 唯一约束、repository 和发布契约，保留旧 ID/hash/引用；缺验证不投放，frozen DTO 不替代 DB 保护。"}, {"title": "展示选择与全局停用", "level": "h3", "anchor": "展示选择与全局停用", "text": "### 展示选择与全局停用\n\n| 情况 | 目标处理 |\n| --- | --- |\n| 本页超时、崩溃、协议错误 | 关闭实例，保留草稿/焦点，standard 展示原结果；不重试业务或全局停版 |\n| 回选旧展示版 | 经授权和并发检查选择兼容、仍可投放版本；不改 Run 或复活 DISABLED |\n| 管理员/安全停用 | 记录 actor/原因/原选择，阻止新投放并使 Host 失效；不由不可信客户端错误单独触发 |\n| 无模块、不兼容、历史验证不足 | standard，不猜 latest，不重新运行旧任务 |\n\n展示故障不切业务 SkillVersion；bundle hash/缓存不越过 Project/停用检查。已下载字节不可收回，撤回传播、Host 断开和恢复分别验收。"}, {"title": "实施顺序与验收", "level": "h2", "anchor": "实施顺序与验收", "text": "## 实施顺序与验收\n\n按身份/契约 → builder → 安全投放/Host → 发布/选择/回退推进；威胁模型与隔离门禁通过前不执行代码。\n\n- 同源码换依赖/策略有新身份；超时重试无重复发布，未知可确认。\n- 拒绝外部 host/重定向、传递脚本、伪造报告和超额产物，无半份可运行产物。\n- 直接导航/iframe/缓存/错误响应检验实际 CSP；允许渲染正常，禁止的网络/DOM/导航失败。\n- null-origin 伪造、错 nonce、旧 iframe、换 actor/context、过大/重复消息不泄漏、不覆盖草稿、不写业务。\n- G2 失败、旧版不兼容与全局停用都能保留同一结果的 standard 入口；三语、键盘、窄屏可用。\n- [局部回归](../../SKM/backend/tests/modules/)不代替真实 builder、代理和浏览器安全验收。"}], "toc": [{"title": "先分清三种模块与预览", "anchor": "先分清三种模块与预览", "level": "h2"}, {"title": "一个例子：图表坏了，任务没有失败", "anchor": "一个例子图表坏了任务没有失败", "level": "h2"}, {"title": "目标与流水线", "anchor": "目标与流水线", "level": "h2"}, {"title": "现有代码与公开契约", "anchor": "现有代码与公开契约", "level": "h2"}, {"title": "决策与安全边界", "anchor": "决策与安全边界", "level": "h2"}, {"title": "Origin 与 CSP", "anchor": "origin-与-csp", "level": "h3"}, {"title": "当前 CSP 常量不是投放配置", "anchor": "当前-csp-常量不是投放配置", "level": "h3"}, {"title": "静态拒绝与依赖", "anchor": "静态拒绝与依赖", "level": "h3"}, {"title": "构建网络", "anchor": "构建网络", "level": "h3"}, {"title": "构建输入与结果的提交", "anchor": "构建输入与结果的提交", "level": "h3"}, {"title": "Host 协议", "anchor": "host-协议", "level": "h2"}, {"title": "挂载、切换与晚到消息", "anchor": "挂载切换与晚到消息", "level": "h3"}, {"title": "版本与回退", "anchor": "版本与回退", "level": "h2"}, {"title": "内容身份与历史兼容", "anchor": "内容身份与历史兼容", "level": "h3"}, {"title": "展示选择与全局停用", "anchor": "展示选择与全局停用", "level": "h3"}, {"title": "实施顺序与验收", "anchor": "实施顺序与验收", "level": "h2"}], "source": "design/generated-modules.md", "checksum": "7f958b9698a500669ed8ec2aea3dcc49c8773e8c00b6982952c89c92af407d34"}, {"id": "docs/development/local-development.md", "title": "ローカル開発と検証", "group": "development", "html": "\u003ch1 id=\"ローカル開発と検証\">ローカル開発と検証\u003c/h1>\n\u003cp>全体の入口は \u003ca href=\"#SKM/README.md::\">SKM README\u003c/a>。コマンドの実行 directory は各節に示す。\u003c/p>\n\u003ch2 id=\"前提と設定\">前提と設定\u003c/h2>\n\u003cp>Python 3.12、Node.js 26 / pnpm 11.7.0 を使用する。venv は作らず、Backend 依存は user site、lockfile は手編集しない。依存導入と外部 service 起動は別である。\u003c/p>\n\u003cp>\u003ccode>.env.example\u003c/code> は production 雛形。HTTP localhost では development、許可 Origin、専用接続先、書込可能な Run workspace を設定する。\nBackend の .env は実行 directory 基準なので file または process environment を明示する。Compose は\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">共通設定入口\u003c/a>で ENV_FILE を固定する。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>\u003ccode>SKM/backend/\u003c/code> で実行する。migration は DB を変更するため、開発用の対象と権限を先に確認する。API と Worker は別 terminal で起動する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -e \u0026quot;.[dev]\u0026quot;\nalembic upgrade head\npython3 -m uvicorn skillmind.api.main:app --reload --port 8000\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">arq skillmind.worker.settings.WorkerSettings\n\u003c/code>\u003c/pre>\n\u003cp>health は \u003ccode>http://localhost:8000/internal/health/live\u003c/code> と \u003ccode>/internal/health/ready\u003c/code>（外部 service も検査）。一括起動は\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>へ。\u003c/p>\n\u003ch3 id=\"実-postgresql-の前提\">実 PostgreSQL の前提\u003c/h3>\n\u003cp>全 pytest は\u003ca href=\"../SKM/backend/tests/db/test_real_database_invariants.py\">実 DB fixture\u003c/a>を含む。\nSKILLMIND_DATABASE_URL の \u003cstrong>server 上で scratch DB を作り、migration 後に DROP DATABASE WITH (FORCE)\u003c/strong> を行う。URL の DB 名変更だけでは隔離にならない。\u003c/p>\n\u003cp>承認済み隔離 server/account と作成・強制削除権限が必要。文書確認のためには実行しない。\n接続不能による skip は未実施、認証/権限/migration の失敗は失敗として報告する。\u003c/p>\n\u003cp>許可された DB がなければ明示的な局部 test を選ぶか、\u003ccode>SKM/backend/\u003c/code> で実 DB module を除外する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">PYTHONDONTWRITEBYTECODE=1 python3 -m pytest --import-mode=importlib -p no:cacheprovider -o addopts= \\\n  --ignore=tests/db/test_real_database_invariants.py \\\n  --ignore=tests/db/test_real_auth_sessions.py \\\n  --ignore=tests/db/test_real_budget_ledger.py\n\u003c/code>\u003c/pre>\n\u003cp>新しい fixture 利用先も確認する。除外は全 test の無副作用保証ではなく、Redis 等の process は別に確認する。\u003c/p>\n\u003ch3 id=\"隔离-redis-登录防护验证\">隔离 Redis 登录防护验证\u003c/h3>\n\u003cp>信頼できる入手元/checksum を確認した Redis 8.2 系を使う。fixture は TCP/永続化なしの専用 process・Unix socket を作り、自分の process だけを停止する。既存 Redis や system service は使わない。\u003c/p>\n\u003cp>\u003ccode>SKM/backend/\u003c/code> で placeholder を確認済み絶対 path に置き換える：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">PYTHONDONTWRITEBYTECODE=1 \\\n  SKILLMIND_TEST_REDIS_SERVER=/absolute/path/to/redis-server \\\n  python3 -m pytest --import-mode=importlib -p no:cacheprovider -o addopts= \\\n  tests/auth/test_real_login_protection.py tests/auth/test_real_login_http.py\n\u003c/code>\u003c/pre>\n\u003cp>未指定なら PATH 検索、未発見は skip、不正な明示 path は fail。実 Lua/TTL と ASGI→AuthService→Redis を検査するが Session 保存は fake。\n実 DB、長時間待機、複数 API、HTTPS/Redis 切替は\u003ca href=\"#docs/design/login-protection.md::%E5%BC%80%E5%8F%91%E6%8E%A5%E7%BB%AD%E4%B8%8E%E9%AA%8C%E6%94%B6\">別の受入条件\u003c/a>。\u003c/p>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cp>\u003ccode>SKM/web/\u003c/code> で実行する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">CI=true npx -y pnpm@11.7.0 install --frozen-lockfile\nnpx -y pnpm@11.7.0 dev\n\u003c/code>\u003c/pre>\n\u003cp>既定 URL は \u003ccode>http://localhost:5173/skillmind/\u003c/code>、API proxy は \u003ccode>http://127.0.0.1:8000\u003c/code>。Web/API の context path と browser Origin を合わせる。\u003c/p>\n\u003ch3 id=\"ブラウザ回帰\">ブラウザ回帰\u003c/h3>\n\u003cp>専用 harness は実 Component + mock API を検証し、通常の Vitest には含まれない。\n実 credential/Backend/DB/model は使わず、runner を実環境 URL に向けない。\u003c/p>\n\u003cp>初回だけ \u003ccode>SKM/web/\u003c/code> で依存を導入し、専用 terminal で Vite を起動する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r tests/browser/requirements.txt\npython3 -m playwright install chromium\nnode_modules/.bin/vite --host 127.0.0.1 --port 5189 --strictPort\n\u003c/code>\u003c/pre>\n\u003cp>別 terminal の同 directory で \u003ccode>tests/browser/check_\u0026lt;runner\u0026gt;.py\u003c/code> を選ぶ。例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 tests/browser/check_projects.py \\\n  --url http://127.0.0.1:5189/skillmind/tests/browser/projects.html\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>runner\u003c/th>\n\u003cth>harness HTML\u003c/th>\n\u003cth>主な対象\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>login / accounts\u003c/td>\n\u003ctd>login.html / accounts.html\u003c/td>\n\u003ctd>ログイン防重、本人安全、ADMIN 管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>projects / project_members / project_management\u003c/td>\n\u003ctd>projects.html\u003c/td>\n\u003ctd>精確 Project、成員、CRUD、版衝突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>run_submission / interaction_responses\u003c/td>\n\u003ctd>run-submission.html\u003c/td>\n\u003ctd>原 key/内容の確認、答復、期限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>result_references / artifacts / evaluation_submissions\u003c/td>\n\u003ctd>projects.html\u003c/td>\n\u003ctd>結果範囲、原 byte download、評価回执/履歴\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>document_sources / schedule_times\u003c/td>\n\u003ctd>run-submission.html\u003c/td>\n\u003ctd>入力清単、時区/DST、preview\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>document_management / document_preview / document_upload\u003c/td>\n\u003ctd>projects.html\u003c/td>\n\u003ctd>削除未知、静的隔離、有界 upload\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>document_upload_receipts / document_upload_closures\u003c/td>\n\u003ctd>projects.html\u003c/td>\n\u003ctd>原 key 確認、batch pause、明示停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>task_flow / schedule_management\u003c/td>\n\u003ctd>projects.html\u003c/td>\n\u003ctd>読取専用 Flow、調度編集/未知/在途投影\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>各 runner の遅延・切替・防重・三語/keyboard/狭幅の範囲は test を参照する。\nmock browser は実 DB の CAS/rollback/撤権、blob/PUT/清理、model/外部 write、複数 Worker や HTTPS の証明ではない。\u003c/p>\n\u003cp>初回導入は download を伴う。外置依存は PYTHONPATH、browser は PLAYWRIGHT_BROWSERS_PATH を使う。\ndocument_sources は Backend src と依存も必要。\u003ccode>--output\u003c/code> は新しい外部 directory を指定する。使用中の port は奪わず変更し、終了時は自分の Vite だけを止める。\u003c/p>\n\u003cp>Task Flow の数値検証は合成 fixture を実 Backend projector/route/serializer に通した原 byte を使う。\n\u003ccode>SKM/web/\u003c/code> で Backend 依存を利用可能にし、途中で JS の JSON parse/stringify を挟まない：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">task_flow_wire=$(mktemp /tmp/skillmind-flow-wire.XXXXXXXX.json)\nPYTHONDONTWRITEBYTECODE=1 PYTHONPATH=../backend/src:../backend \\\n  python3 -c 'import sys; from tests.skills.task_flow_numeric_fixtures import numeric_flow_wire; sys.stdout.buffer.write(numeric_flow_wire())' \u0026gt; \u0026quot;$task_flow_wire\u0026quot;\npython3 tests/browser/check_task_flow.py \\\n  --url http://127.0.0.1:5189/skillmind/tests/browser/projects.html \\\n  --numeric-wire \u0026quot;$task_flow_wire\u0026quot;\n\u003c/code>\u003c/pre>\n\u003cp>対象は両原契約の大整数/浮動小数/負零、再帰表示、型/重複/逆転範囲。\u003ccode>--numeric-wire\u003c/code> 省略時は当該 case を実行せず runner が報告する。\u003c/p>\n\u003ch2 id=\"変更に応じた検証\">変更に応じた検証\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>実行位置とコマンド\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Backend\u003c/td>\n\u003ctd>SKM/backend/：\u003ccode>python3 -m ruff check .\u003c/code>、\u003ccode>python3 -m mypy src\u003c/code>、副作用確認後の pytest\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web\u003c/td>\n\u003ctd>SKM/web/：\u003ccode>node_modules/.bin/tsc -b --pretty false\u003c/code>、\u003ccode>node_modules/.bin/vitest run\u003c/code>、\u003ccode>node_modules/.bin/vite build\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>契約\u003c/td>\n\u003ctd>SKM/：\u003ccode>python3 scripts/validate_contracts.py\u003c/code>。\u003ca href=\"#docs/development/contract-workflow.md::%E9%81%87%E5%88%B0%E6%9C%AA%E6%8E%A5%E9%BD%90%E7%9A%84%E4%BA%A4%E4%BB%98%E9%93%BE\">OpenAPI 一致性\u003c/a>も確認\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compose / 工具\u003c/td>\n\u003ctd>SKM/：\u003ccode>python3 scripts/validate_compose.py\u003c/code>、\u003ccode>python3 -m unittest discover -s scripts/tests -v\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SDK offline\u003c/td>\n\u003ctd>SKM/：\u003ccode>PYTHONPATH=backend/src python3 scripts/probe_claude_agent_sdk.py\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文書\u003c/td>\n\u003ctd>SKM/：\u003ca href=\"#docs/development/documentation.md::\">build/check と閲覧検証\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>配備工具 test は合成 file/fake process で実 Docker を使わない。実環境の \u003ccode>make config\u003c/code> は Docker と確認済み対象が必要で、通常 config 出力には Secret が含まれ得る。\nmock/実環境、成功/skip/失敗を分け、Docker・Make・PowerShell 等がなければ該当する実起動・復旧・Windows 操作は未検証と報告する。\u003c/p>\n\u003ch2 id=\"skill-interpreter-の検証\">Skill Interpreter の検証\u003c/h2>\n\u003cp>Backend 依存導入後、\u003ccode>SKM/\u003c/code> で model 不使用の fixture runner：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">skillmind-skill-interpret-fixture \\\n  backend/tests/fixtures/skills/repository-review \\\n  contracts/examples/skill-interpreter-response.v1.json\n\u003c/code>\u003c/pre>\n\u003cp>再利用と構造化出力の条件は\u003ca href=\"#docs/design/skill-interpretation.md::\">Interpreter 設計\u003c/a>が正本。prompt JSON fallback でも Schema/identity/修復検査を省略しない。\u003c/p>\n\u003cp>次は実 model API と課金を伴うため、承認済み環境・入力・設定を確認してから実行する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/measure_skill_interpretations.py \\\n  /absolute/path/to/your-skill --repeats 3 --timeout-seconds 900\n\u003c/code>\u003c/pre>\n\u003cp>構造有効率・意味 signature に加え、人手で規則保真・証拠・修正量を評価する。fixture 成功を model 品質と扱わない。\u003c/p>\n\u003ch2 id=\"作業後の一時物\">作業後の一時物\u003c/h2>\n\u003cp>今回生成した cache、\u003cstrong>pycache\u003c/strong>、web/dist、node_modules/.tmp、egg-info だけを対象確認後に片付ける。既存成果物と node_modules 本体は残す。\u003c/p>\n", "sections": [{"title": "ローカル開発と検証", "level": "h1", "anchor": "ローカル開発と検証", "text": "# ローカル開発と検証\n\n全体の入口は [SKM README](../../SKM/README.md)。コマンドの実行 directory は各節に示す。"}, {"title": "前提と設定", "level": "h2", "anchor": "前提と設定", "text": "## 前提と設定\n\nPython 3.12、Node.js 26 / pnpm 11.7.0 を使用する。venv は作らず、Backend 依存は user site、lockfile は手編集しない。依存導入と外部 service 起動は別である。\n\n`.env.example` は production 雛形。HTTP localhost では development、許可 Origin、専用接続先、書込可能な Run workspace を設定する。\nBackend の .env は実行 directory 基準なので file または process environment を明示する。Compose は[共通設定入口](../operations/deployment.md#环境文件与配置边界)で ENV_FILE を固定する。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\n`SKM/backend/` で実行する。migration は DB を変更するため、開発用の対象と権限を先に確認する。API と Worker は別 terminal で起動する。\n\n```bash\npython3 -m pip install --user -e \".[dev]\"\nalembic upgrade head\npython3 -m uvicorn skillmind.api.main:app --reload --port 8000\n```\n\n```bash\narq skillmind.worker.settings.WorkerSettings\n```\n\nhealth は `http://localhost:8000/internal/health/live` と `/internal/health/ready`（外部 service も検査）。一括起動は[Quickstart](../operations/quickstart.md)へ。"}, {"title": "実 PostgreSQL の前提", "level": "h3", "anchor": "実-postgresql-の前提", "text": "### 実 PostgreSQL の前提\n\n全 pytest は[実 DB fixture](../../SKM/backend/tests/db/test_real_database_invariants.py)を含む。\nSKILLMIND_DATABASE_URL の **server 上で scratch DB を作り、migration 後に DROP DATABASE WITH (FORCE)** を行う。URL の DB 名変更だけでは隔離にならない。\n\n承認済み隔離 server/account と作成・強制削除権限が必要。文書確認のためには実行しない。\n接続不能による skip は未実施、認証/権限/migration の失敗は失敗として報告する。\n\n許可された DB がなければ明示的な局部 test を選ぶか、`SKM/backend/` で実 DB module を除外する：\n\n```bash\nPYTHONDONTWRITEBYTECODE=1 python3 -m pytest --import-mode=importlib -p no:cacheprovider -o addopts= \\\n  --ignore=tests/db/test_real_database_invariants.py \\\n  --ignore=tests/db/test_real_auth_sessions.py \\\n  --ignore=tests/db/test_real_budget_ledger.py\n```\n\n新しい fixture 利用先も確認する。除外は全 test の無副作用保証ではなく、Redis 等の process は別に確認する。"}, {"title": "隔离 Redis 登录防护验证", "level": "h3", "anchor": "隔离-redis-登录防护验证", "text": "### 隔离 Redis 登录防护验证\n\n信頼できる入手元/checksum を確認した Redis 8.2 系を使う。fixture は TCP/永続化なしの専用 process・Unix socket を作り、自分の process だけを停止する。既存 Redis や system service は使わない。\n\n`SKM/backend/` で placeholder を確認済み絶対 path に置き換える：\n\n```bash\nPYTHONDONTWRITEBYTECODE=1 \\\n  SKILLMIND_TEST_REDIS_SERVER=/absolute/path/to/redis-server \\\n  python3 -m pytest --import-mode=importlib -p no:cacheprovider -o addopts= \\\n  tests/auth/test_real_login_protection.py tests/auth/test_real_login_http.py\n```\n\n未指定なら PATH 検索、未発見は skip、不正な明示 path は fail。実 Lua/TTL と ASGI→AuthService→Redis を検査するが Session 保存は fake。\n実 DB、長時間待機、複数 API、HTTPS/Redis 切替は[別の受入条件](../design/login-protection.md#开发接续与验收)。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n`SKM/web/` で実行する：\n\n```bash\nCI=true npx -y pnpm@11.7.0 install --frozen-lockfile\nnpx -y pnpm@11.7.0 dev\n```\n\n既定 URL は `http://localhost:5173/skillmind/`、API proxy は `http://127.0.0.1:8000`。Web/API の context path と browser Origin を合わせる。"}, {"title": "ブラウザ回帰", "level": "h3", "anchor": "ブラウザ回帰", "text": "### ブラウザ回帰\n\n専用 harness は実 Component + mock API を検証し、通常の Vitest には含まれない。\n実 credential/Backend/DB/model は使わず、runner を実環境 URL に向けない。\n\n初回だけ `SKM/web/` で依存を導入し、専用 terminal で Vite を起動する：\n\n```bash\npython3 -m pip install --user -r tests/browser/requirements.txt\npython3 -m playwright install chromium\nnode_modules/.bin/vite --host 127.0.0.1 --port 5189 --strictPort\n```\n\n別 terminal の同 directory で `tests/browser/check_\u003crunner>.py` を選ぶ。例：\n\n```bash\npython3 tests/browser/check_projects.py \\\n  --url http://127.0.0.1:5189/skillmind/tests/browser/projects.html\n```\n\n| runner | harness HTML | 主な対象 |\n| --- | --- | --- |\n| login / accounts | login.html / accounts.html | ログイン防重、本人安全、ADMIN 管理 |\n| projects / project_members / project_management | projects.html | 精確 Project、成員、CRUD、版衝突 |\n| run_submission / interaction_responses | run-submission.html | 原 key/内容の確認、答復、期限 |\n| result_references / artifacts / evaluation_submissions | projects.html | 結果範囲、原 byte download、評価回执/履歴 |\n| document_sources / schedule_times | run-submission.html | 入力清単、時区/DST、preview |\n| document_management / document_preview / document_upload | projects.html | 削除未知、静的隔離、有界 upload |\n| document_upload_receipts / document_upload_closures | projects.html | 原 key 確認、batch pause、明示停止 |\n| task_flow / schedule_management | projects.html | 読取専用 Flow、調度編集/未知/在途投影 |\n\n各 runner の遅延・切替・防重・三語/keyboard/狭幅の範囲は test を参照する。\nmock browser は実 DB の CAS/rollback/撤権、blob/PUT/清理、model/外部 write、複数 Worker や HTTPS の証明ではない。\n\n初回導入は download を伴う。外置依存は PYTHONPATH、browser は PLAYWRIGHT_BROWSERS_PATH を使う。\ndocument_sources は Backend src と依存も必要。`--output` は新しい外部 directory を指定する。使用中の port は奪わず変更し、終了時は自分の Vite だけを止める。\n\nTask Flow の数値検証は合成 fixture を実 Backend projector/route/serializer に通した原 byte を使う。\n`SKM/web/` で Backend 依存を利用可能にし、途中で JS の JSON parse/stringify を挟まない：\n\n```bash\ntask_flow_wire=$(mktemp /tmp/skillmind-flow-wire.XXXXXXXX.json)\nPYTHONDONTWRITEBYTECODE=1 PYTHONPATH=../backend/src:../backend \\\n  python3 -c 'import sys; from tests.skills.task_flow_numeric_fixtures import numeric_flow_wire; sys.stdout.buffer.write(numeric_flow_wire())' > \"$task_flow_wire\"\npython3 tests/browser/check_task_flow.py \\\n  --url http://127.0.0.1:5189/skillmind/tests/browser/projects.html \\\n  --numeric-wire \"$task_flow_wire\"\n```\n\n対象は両原契約の大整数/浮動小数/負零、再帰表示、型/重複/逆転範囲。`--numeric-wire` 省略時は当該 case を実行せず runner が報告する。"}, {"title": "変更に応じた検証", "level": "h2", "anchor": "変更に応じた検証", "text": "## 変更に応じた検証\n\n| 対象 | 実行位置とコマンド |\n| --- | --- |\n| Backend | SKM/backend/：`python3 -m ruff check .`、`python3 -m mypy src`、副作用確認後の pytest |\n| Web | SKM/web/：`node_modules/.bin/tsc -b --pretty false`、`node_modules/.bin/vitest run`、`node_modules/.bin/vite build` |\n| 契約 | SKM/：`python3 scripts/validate_contracts.py`。[OpenAPI 一致性](contract-workflow.md#遇到未接齐的交付链)も確認 |\n| Compose / 工具 | SKM/：`python3 scripts/validate_compose.py`、`python3 -m unittest discover -s scripts/tests -v` |\n| SDK offline | SKM/：`PYTHONPATH=backend/src python3 scripts/probe_claude_agent_sdk.py` |\n| 文書 | SKM/：[build/check と閲覧検証](documentation.md) |\n\n配備工具 test は合成 file/fake process で実 Docker を使わない。実環境の `make config` は Docker と確認済み対象が必要で、通常 config 出力には Secret が含まれ得る。\nmock/実環境、成功/skip/失敗を分け、Docker・Make・PowerShell 等がなければ該当する実起動・復旧・Windows 操作は未検証と報告する。"}, {"title": "Skill Interpreter の検証", "level": "h2", "anchor": "skill-interpreter-の検証", "text": "## Skill Interpreter の検証\n\nBackend 依存導入後、`SKM/` で model 不使用の fixture runner：\n\n```bash\nskillmind-skill-interpret-fixture \\\n  backend/tests/fixtures/skills/repository-review \\\n  contracts/examples/skill-interpreter-response.v1.json\n```\n\n再利用と構造化出力の条件は[Interpreter 設計](../design/skill-interpretation.md)が正本。prompt JSON fallback でも Schema/identity/修復検査を省略しない。\n\n次は実 model API と課金を伴うため、承認済み環境・入力・設定を確認してから実行する：\n\n```bash\npython3 scripts/measure_skill_interpretations.py \\\n  /absolute/path/to/your-skill --repeats 3 --timeout-seconds 900\n```\n\n構造有効率・意味 signature に加え、人手で規則保真・証拠・修正量を評価する。fixture 成功を model 品質と扱わない。"}, {"title": "作業後の一時物", "level": "h2", "anchor": "作業後の一時物", "text": "## 作業後の一時物\n\n今回生成した cache、__pycache__、web/dist、node_modules/.tmp、egg-info だけを対象確認後に片付ける。既存成果物と node_modules 本体は残す。"}], "toc": [{"title": "前提と設定", "anchor": "前提と設定", "level": "h2"}, {"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "実 PostgreSQL の前提", "anchor": "実-postgresql-の前提", "level": "h3"}, {"title": "隔离 Redis 登录防护验证", "anchor": "隔离-redis-登录防护验证", "level": "h3"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "ブラウザ回帰", "anchor": "ブラウザ回帰", "level": "h3"}, {"title": "変更に応じた検証", "anchor": "変更に応じた検証", "level": "h2"}, {"title": "Skill Interpreter の検証", "anchor": "skill-interpreter-の検証", "level": "h2"}, {"title": "作業後の一時物", "anchor": "作業後の一時物", "level": "h2"}], "source": "development/local-development.md", "checksum": "7d7611a4b05f1d5c7d9cd73471f5b5bfd801c562772f529b243505eccb82a51e"}, {"id": "docs/development/change-guide.md", "title": "从设计到代码的变更指南", "group": "development", "html": "\u003ch1 id=\"从设计到代码的变更指南\">从设计到代码的变更指南\u003c/h1>\n\u003cp>先读 \u003ca href=\"#SKM/AGENTS.md::\">AGENTS\u003c/a>，再按下表选择正本。代码位置见\u003ca href=\"#SKM/README.md::\">README\u003c/a>，当前缺口见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>，完整分工见\u003ca href=\"#docs/design/README.md::\">设计索引\u003c/a>。\u003c/p>\n\u003ch2 id=\"先确定改的是哪条链路\">先确定改的是哪条链路\u003c/h2>\n\u003ch3 id=\"运行与数据\">运行与数据\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变更\u003c/th>\n\u003cth>设计 / 核心问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>上传、下载、清理\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/document-lifecycle.md::\">文档资产\u003c/a>：跨存储提交、配额、引用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>选择、准备输入\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>：冻结、物化与可信缓存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>创建、重复提交\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/run-creation.md::\">Run 创建\u003c/a>：原身份、内容、幂等键\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行、等待、恢复\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>：Segment/Attempt、事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>答复、评价\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/user-interactions.md::\">用户交互\u003c/a> / \u003ca href=\"#docs/design/results-evaluation.md::\">结果\u003c/a>：期限、原请求、不可变原值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>停止、预算\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/run-supervision.md::\">监督\u003c/a> / \u003ca href=\"#docs/design/run-budgets.md::\">预算\u003c/a>：提交权、真实停止、主子计量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部写、定时执行\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a> / \u003ca href=\"#docs/design/task-scheduling.md::\">调度\u003c/a>：认领、阶段回执、恢复\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"skill-与界面\">Skill 与界面\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变更\u003c/th>\n\u003cth>设计 / 核心问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>解释、发布、启停\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/skill-contract.md::\">Skill 契约\u003c/a> / \u003ca href=\"#docs/design/skill-interpretation.md::\">解释器\u003c/a>：来源、候选、精确版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面、流程预览\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a> / \u003ca href=\"#docs/design/task-flow.md::\">Task Flow\u003c/a>：投影、身份隔离、用户流程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成 UI、子分析\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/generated-modules.md::\">生成模块\u003c/a> / \u003ca href=\"#docs/design/subagents.md::\">子分析\u003c/a>：安全门禁、能力与共享预算\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"身份与交付\">身份与交付\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变更\u003c/th>\n\u003cth>设计 / 核心问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>登录、账户\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/login-protection.md::\">登录防护\u003c/a> / \u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a> / \u003ca href=\"#docs/design/user-lifecycle.md::\">用户\u003c/a>：原会话、撤权、审计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目、成员、删除\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/project-lifecycle.md::\">项目\u003c/a>：角色、归档竞争、引用保护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部凭据\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/secret-storage.md::\">Secret\u003c/a>：密文、轮换、旧备份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配置、迁移、恢复\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/deployment.md::\">发布\u003c/a> / \u003ca href=\"#docs/operations/backup-recovery.md::\">恢复\u003c/a>：所有写入者、同一恢复点、外部事实\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"开工前必须回答的六个问题\">开工前必须回答的六个问题\u003c/h2>\n\u003cp>明确场景与非目标、规则正本、冻结/授权时点、受影响消费者、失败/重发/恢复行为、可观察验收结果。\n已有 service/validator 应接续，不重造组件；新增概念不必然需要新表或公开字段。\u003c/p>\n\u003ch2 id=\"留下一条可接手的开发任务\">留下一条可接手的开发任务\u003c/h2>\n\u003cp>任务格式：\u003cstrong>场景 → 目标/非目标 → 设计 → 当前缺口 → 同步范围 → 验收\u003c/strong>。\n涉及历史数据时说明读取与版本共存；未接齐的链路按\u003ca href=\"#docs/development/contract-workflow.md::%E9%81%87%E5%88%B0%E6%9C%AA%E6%8E%A5%E9%BD%90%E7%9A%84%E4%BA%A4%E4%BB%98%E9%93%BE\">契约 workflow\u003c/a>定位，不把单层完成当成交付。\u003c/p>\n\u003ch2 id=\"验证与记录\">验证与记录\u003c/h2>\n\u003cp>应用\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">同步点\u003c/a>和\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">本地验证表\u003c/a>。\n规则回写领域设计，功能状态只更新计划；文档按\u003ca href=\"#docs/development/documentation.md::\">维护约定\u003c/a>生成检查。报告实际验证、失败/skip/未执行，区分 mock 与真实事务、浏览器、模型和部署。\u003c/p>\n", "sections": [{"title": "从设计到代码的变更指南", "level": "h1", "anchor": "从设计到代码的变更指南", "text": "# 从设计到代码的变更指南\n\n先读 [AGENTS](../../SKM/AGENTS.md)，再按下表选择正本。代码位置见[README](../../SKM/README.md)，当前缺口见[计划](../planning/roadmap.md)，完整分工见[设计索引](../design/README.md)。"}, {"title": "先确定改的是哪条链路", "level": "h2", "anchor": "先确定改的是哪条链路", "text": "## 先确定改的是哪条链路"}, {"title": "运行与数据", "level": "h3", "anchor": "运行与数据", "text": "### 运行与数据\n\n| 变更 | 设计 / 核心问题 |\n| --- | --- |\n| 上传、下载、清理 | [文档资产](../design/document-lifecycle.md)：跨存储提交、配额、引用 |\n| 选择、准备输入 | [资源快照](../design/resource-snapshots.md)：冻结、物化与可信缓存 |\n| 创建、重复提交 | [Run 创建](../design/run-creation.md)：原身份、内容、幂等键 |\n| 执行、等待、恢复 | [Runtime](../design/agent-runtime.md)：Segment/Attempt、事件 |\n| 答复、评价 | [用户交互](../design/user-interactions.md) / [结果](../design/results-evaluation.md)：期限、原请求、不可变原值 |\n| 停止、预算 | [监督](../design/run-supervision.md) / [预算](../design/run-budgets.md)：提交权、真实停止、主子计量 |\n| 外部写、定时执行 | [受控写入](../design/repository-effects.md) / [调度](../design/task-scheduling.md)：认领、阶段回执、恢复 |"}, {"title": "Skill 与界面", "level": "h3", "anchor": "skill-与界面", "text": "### Skill 与界面\n\n| 变更 | 设计 / 核心问题 |\n| --- | --- |\n| 解释、发布、启停 | [Skill 契约](../design/skill-contract.md) / [解释器](../design/skill-interpretation.md)：来源、候选、精确版本 |\n| 页面、流程预览 | [Workspace](../design/workspace.md) / [Task Flow](../design/task-flow.md)：投影、身份隔离、用户流程 |\n| 生成 UI、子分析 | [生成模块](../design/generated-modules.md) / [子分析](../design/subagents.md)：安全门禁、能力与共享预算 |"}, {"title": "身份与交付", "level": "h3", "anchor": "身份与交付", "text": "### 身份与交付\n\n| 变更 | 设计 / 核心问题 |\n| --- | --- |\n| 登录、账户 | [登录防护](../design/login-protection.md) / [认证](../design/authentication.md) / [用户](../design/user-lifecycle.md)：原会话、撤权、审计 |\n| 项目、成员、删除 | [项目](../design/project-lifecycle.md)：角色、归档竞争、引用保护 |\n| 外部凭据 | [Secret](../design/secret-storage.md)：密文、轮换、旧备份 |\n| 配置、迁移、恢复 | [发布](../operations/deployment.md) / [恢复](../operations/backup-recovery.md)：所有写入者、同一恢复点、外部事实 |"}, {"title": "开工前必须回答的六个问题", "level": "h2", "anchor": "开工前必须回答的六个问题", "text": "## 开工前必须回答的六个问题\n\n明确场景与非目标、规则正本、冻结/授权时点、受影响消费者、失败/重发/恢复行为、可观察验收结果。\n已有 service/validator 应接续，不重造组件；新增概念不必然需要新表或公开字段。"}, {"title": "留下一条可接手的开发任务", "level": "h2", "anchor": "留下一条可接手的开发任务", "text": "## 留下一条可接手的开发任务\n\n任务格式：**场景 → 目标/非目标 → 设计 → 当前缺口 → 同步范围 → 验收**。\n涉及历史数据时说明读取与版本共存；未接齐的链路按[契约 workflow](contract-workflow.md#遇到未接齐的交付链)定位，不把单层完成当成交付。"}, {"title": "验证与记录", "level": "h2", "anchor": "验证与记录", "text": "## 验证与记录\n\n应用[同步点](coding-rules.md#同步点)和[本地验证表](local-development.md#変更に応じた検証)。\n规则回写领域设计，功能状态只更新计划；文档按[维护约定](documentation.md)生成检查。报告实际验证、失败/skip/未执行，区分 mock 与真实事务、浏览器、模型和部署。"}], "toc": [{"title": "先确定改的是哪条链路", "anchor": "先确定改的是哪条链路", "level": "h2"}, {"title": "运行与数据", "anchor": "运行与数据", "level": "h3"}, {"title": "Skill 与界面", "anchor": "skill-与界面", "level": "h3"}, {"title": "身份与交付", "anchor": "身份与交付", "level": "h3"}, {"title": "开工前必须回答的六个问题", "anchor": "开工前必须回答的六个问题", "level": "h2"}, {"title": "留下一条可接手的开发任务", "anchor": "留下一条可接手的开发任务", "level": "h2"}, {"title": "验证与记录", "anchor": "验证与记录", "level": "h2"}], "source": "development/change-guide.md", "checksum": "52a9017d19b830e074e766dc87a93c6300ddbd9c3d94f88c24a87ee5781771c6"}, {"id": "docs/development/coding-rules.md", "title": "按改动类型查阅的实现细则", "group": "development", "html": "\u003ch1 id=\"按改动类型查阅的实现细则\">按改动类型查阅的实现细则\u003c/h1>\n\u003cp>本页由 \u003ca href=\"#SKM/AGENTS.md::\">AGENTS\u003c/a>强制引用，只读本次涉及的章节。领域规则见\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>，运行命令见\u003ca href=\"#docs/development/local-development.md::\">本地开发\u003c/a>。\nBackend 路径相对 SKM/backend/src/skillmind/，Web 路径相对 SKM/web/。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>route 只做认证/入出参，业务在 domain/service，查询/锁/持久化在 repository。公开 route 在 api/routes/ 资源模块单层实现，不增加未认证并行入口、转发 wrapper 或 ARQ job 内业务分支。\u003c/p>\n\u003cp>同义处理必须复用唯一入口：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>处理\u003c/th>\n\u003cth>入口 / 限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>JSON / SHA-256\u003c/td>\n\u003ctd>core/hashing.py：canonical_json / sha256_hex；源包索引按 skills/importer.py 的格式计算，不混用 JSON 与原字节摘要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>敏感字段\u003c/td>\n\u003ctd>core/redaction.py：find_sensitive_key；Evidence/Tool response 共用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lease token\u003c/td>\n\u003ctd>runs/domain.py：lease_token_hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RunEvent / Outbox\u003c/td>\n\u003ctd>runs/repository_base.py 的 RunRepository：_snapshot_event、_event_outbox、_dispatch_outbox、_next_sequence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>认证 Problem\u003c/td>\n\u003ctd>api/auth_dependencies.py 共享 factory；Run 用 routes/runs.py 的 run_not_found_problem / authorized_run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>binding / Secret\u003c/td>\n\u003ctd>agent/run_binding.py：load_bound_run_resource / resolve_binding_secret；检查 checksum、Integration 状态、provider/revision/capability\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部 repository\u003c/td>\n\u003ctd>agent/repository_client.py / repository_source.py；物化/read/write 共用，不另写 subprocess/凭据解析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可 apply effect\u003c/td>\n\u003ctd>effects/catalog.py：EFFECT_CAPABILITIES，创建/执行/审批共用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Binary 转文字\u003c/td>\n\u003ctd>agent/binary_text.py：render_text，不在 Provider 复制\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>documents/\u003cstrong>init\u003c/strong>.py 只导出 domain 类型，service/repository/source 显式导入，避免 DB → Run → 文档循环。\u003c/p>\n\u003cp>repository.write/v1 不可预授权。direct 仅默认 branch fast-forward；branch 仅新建 skillmind/ 命名空间 branch；禁止 force、覆盖既有 branch 或任意 branch 写入。协议见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。\u003c/p>\n\u003ch2 id=\"run-lifecycle\">Run lifecycle\u003c/h2>\n\u003cp>涉及 Run/Worker/Session/调度/子 Agent 时，先读 \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>和\u003ca href=\"#docs/design/run-supervision.md::\">监督\u003c/a>。\u003c/p>\n\u003cul>\n\u003cli>转换只经 plan_run_transition / ALLOWED_RUN_TRANSITIONS；锁序 Run → Segment → Attempt。旧 migration 路径仍为 Run → Attempt，不反转 _lock_claimed_execution。\u003c/li>\n\u003cli>答复/批准追加 Segment，retry/recovery 在同 Segment 追加 Attempt；等待不占 worker lease 或 active wall timeout。重发/新运行区别见\u003ca href=\"#docs/design/run-creation.md::\">创建协议\u003c/a>。\u003c/li>\n\u003cli>终态 RUN_SNAPSHOT 是最后一个 RunEvent。sequence 在 Run 内单调；TEXT_DELTA 消耗 sequence 但不持久化，允许缺号、不改子层编号。遵守 RunEvent Schema。\u003c/li>\n\u003cli>重新 dispatch 也受 SKILLMIND_RUN_MAX_ATTEMPTS 限制，耗尽以 retry_exhausted 关闭为 FAILED。\u003c/li>\n\u003cli>wall_timeout_seconds 只中断 event 等待，不中断终态 transaction；ARQ job_timeout 必须更长，不能替代执行 deadline。\u003c/li>\n\u003cli>PRIMARY Session 单 ACTIVE，只有设计允许的只读 SUBAGENT/BRANCH 可并行；resume/fork/replace 审计 parent 与 checkpoint checksum。\u003c/li>\n\u003cli>resolve_subagent_capabilities 同时按禁止集合和名称拦截 write，显式拒绝而非静默删减。split_budget 整除分配；子 Session 不写 RunEvent，归入主 Session 的一个 ToolCall + Evidence。\u003c/li>\n\u003cli>预算执行接线须满足\u003ca href=\"#docs/design/run-budgets.md::%E4%B8%8A%E7%BA%BF%E9%97%A8%E7%A6%81%E4%B8%8E%E6%8E%A5%E7%BA%BF%E9%A1%BA%E5%BA%8F\">上线门禁\u003c/a>，内部账本不等于实际执行受控。\u003c/li>\n\u003cli>scope 内资源物化为只读 input/：超限失败不截断、不可读记 skipped、冻结 ID/hash 不符失败。准备/缓存见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>。\u003c/li>\n\u003cli>TaskSchedule 调用 RunService.create_task_run；精确版/输入/资源失效即 ERROR，不换来源、不补跑全部历史发火。\u003ca href=\"#docs/design/task-scheduling.md::\">迟发规则\u003c/a>。\u003c/li>\n\u003cli>Result 满足 OutcomeEnvelope；task-specific output Schema 可选，未声明时不报 structured_output_missing。\u003ca href=\"#docs/design/results-evaluation.md::\">结果与评价\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cul>\n\u003cli>资源 client 放 src/api/，画面经 index.ts barrel；HTTP 只用 requestApiJson / requestApiEmpty。mutation 传 csrfToken / X-CSRF-Token，响应在 client 边界验证，纯逻辑放 src/lib/。\u003c/li>\n\u003cli>TasksPage 选任务，WorkspacePage 管理 Run；不重造 SSE/取消/终态 lifecycle。即时/调度共用 taskDraft.ts / TaskLaunchFields.tsx。\u003c/li>\n\u003cli>不在前端重算服务端 ID（如 derive_task_id）。筛选/分页在服务端，不能过滤第一页冒充全量。\u003c/li>\n\u003cli>三语统一 src/lib/i18n/{zh,ja,en}.ts，同步 UiMessages / MESSAGES；画面用 useMessages()。\u003c/li>\n\u003cli>生成 FrontendModule 不继承应用权限；CSP/iframe 隔离需回归，M3 后先完成威胁模型，见\u003ca href=\"#docs/design/generated-modules.md::\">生成界面\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"同步点\">同步点\u003c/h2>\n\u003cp>只更新受影响项；公开协议同时遵守\u003ca href=\"#docs/development/contract-workflow.md::\">契约 workflow\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>改动\u003c/th>\n\u003cth>同步范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Settings\u003c/td>\n\u003ctd>core/settings.py 的 Field 范围 → .env.example → API lifespan / Worker startup 注入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AgentEventType\u003c/td>\n\u003ctd>agent/domain.py → engine.py mapper → Web RUN_EVENT_NAMES → RunEvent Schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blueprint / Brief / OutcomeEnvelope\u003c/td>\n\u003ctd>contract → DTO/validator/projector → frozen checksum → Worker/Web → example/test；不加业务专属字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Segment / Interaction / Proposal\u003c/td>\n\u003ctd>transition → DB/repository → event/outbox/SSE → 授权/幂等 → Web → recovery/Compose\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tool capability\u003c/td>\n\u003ctd>versioned request/response/error → Provider → context_builder.py registry → allowed_capabilities → 回归\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>endpoint\u003c/td>\n\u003ctd>资源 route/actor alias → response allowlist/Problem → Schema/example/OpenAPI → Web validator/barrel → 回归\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DB model\u003c/td>\n\u003ctd>db/models.py → migration → repository DTO/projection → 回归；无 relationship 的 FK 父子同事务新增时，父行后显式 flush()\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema / example\u003c/td>\n\u003ctd>同时注册 scripts/validate_contracts.py 和 backend/tests/contracts/test_contracts.py；保持 Problem 兼容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenAPI\u003c/td>\n\u003ctd>endpoint 修改后运行 scripts/export_openapi.py 并验一致性；只读审查不重导出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构化 log\u003c/td>\n\u003ctd>注册 core/logging.py 的 _CONTEXT_FIELDS allowlist\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>system Interpreter Skill\u003c/td>\n\u003ctd>SemVer/content hash、example identity、prompt checksum 与测试同步；model 执行规则需 prompt 回归\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>tests/ 镜像模块职责，测试名说明验证的行为。API 测试按资源拆分，共用 tests/api/fakes.py / conftest.py，不复制认证 fixture；fake SQL 与\u003ca href=\"#docs/development/local-development.md::%E5%AE%9F-postgresql-%E3%81%AE%E5%89%8D%E6%8F%90\">真实 DB\u003c/a>分开举证。\u003c/p>\n\u003ch2 id=\"ingress\">Ingress\u003c/h2>\n\u003cul>\n\u003cli>复用共享 Traefik，不新增其 service/静态配置、证书 resolver、dashboard 或 Docker socket mount。\u003c/li>\n\u003cli>不发布 host port；只有 web/api 进入外部 edge network，其余 service 仅内部网络。\u003c/li>\n\u003cli>外部 URL 在 SKILLMIND_CONTEXT_PATH 下：{contextPath}/api 归 API，其余归 Web。Traefik 去掉 context path，内部 API 保持 /api、Web 保持 /。\u003c/li>\n\u003cli>配置与停写/迁移/放行见\u003ca href=\"#docs/operations/deployment.md::\">发布手册\u003c/a>，功能开关不能代替全局停写证明。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "按改动类型查阅的实现细则", "level": "h1", "anchor": "按改动类型查阅的实现细则", "text": "# 按改动类型查阅的实现细则\n\n本页由 [AGENTS](../../SKM/AGENTS.md)强制引用，只读本次涉及的章节。领域规则见[变更指南](change-guide.md)，运行命令见[本地开发](local-development.md)。\nBackend 路径相对 SKM/backend/src/skillmind/，Web 路径相对 SKM/web/。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\nroute 只做认证/入出参，业务在 domain/service，查询/锁/持久化在 repository。公开 route 在 api/routes/ 资源模块单层实现，不增加未认证并行入口、转发 wrapper 或 ARQ job 内业务分支。\n\n同义处理必须复用唯一入口：\n\n| 处理 | 入口 / 限制 |\n| --- | --- |\n| JSON / SHA-256 | core/hashing.py：canonical_json / sha256_hex；源包索引按 skills/importer.py 的格式计算，不混用 JSON 与原字节摘要 |\n| 敏感字段 | core/redaction.py：find_sensitive_key；Evidence/Tool response 共用 |\n| Lease token | runs/domain.py：lease_token_hash |\n| RunEvent / Outbox | runs/repository_base.py 的 RunRepository：_snapshot_event、_event_outbox、_dispatch_outbox、_next_sequence |\n| 认证 Problem | api/auth_dependencies.py 共享 factory；Run 用 routes/runs.py 的 run_not_found_problem / authorized_run |\n| binding / Secret | agent/run_binding.py：load_bound_run_resource / resolve_binding_secret；检查 checksum、Integration 状态、provider/revision/capability |\n| 外部 repository | agent/repository_client.py / repository_source.py；物化/read/write 共用，不另写 subprocess/凭据解析 |\n| 可 apply effect | effects/catalog.py：EFFECT_CAPABILITIES，创建/执行/审批共用 |\n| Binary 转文字 | agent/binary_text.py：render_text，不在 Provider 复制 |\n\ndocuments/__init__.py 只导出 domain 类型，service/repository/source 显式导入，避免 DB → Run → 文档循环。\n\nrepository.write/v1 不可预授权。direct 仅默认 branch fast-forward；branch 仅新建 skillmind/ 命名空间 branch；禁止 force、覆盖既有 branch 或任意 branch 写入。协议见[受控写入](../design/repository-effects.md)。"}, {"title": "Run lifecycle", "level": "h2", "anchor": "run-lifecycle", "text": "## Run lifecycle\n\n涉及 Run/Worker/Session/调度/子 Agent 时，先读 [Runtime](../design/agent-runtime.md)和[监督](../design/run-supervision.md)。\n\n- 转换只经 plan_run_transition / ALLOWED_RUN_TRANSITIONS；锁序 Run → Segment → Attempt。旧 migration 路径仍为 Run → Attempt，不反转 _lock_claimed_execution。\n- 答复/批准追加 Segment，retry/recovery 在同 Segment 追加 Attempt；等待不占 worker lease 或 active wall timeout。重发/新运行区别见[创建协议](../design/run-creation.md)。\n- 终态 RUN_SNAPSHOT 是最后一个 RunEvent。sequence 在 Run 内单调；TEXT_DELTA 消耗 sequence 但不持久化，允许缺号、不改子层编号。遵守 RunEvent Schema。\n- 重新 dispatch 也受 SKILLMIND_RUN_MAX_ATTEMPTS 限制，耗尽以 retry_exhausted 关闭为 FAILED。\n- wall_timeout_seconds 只中断 event 等待，不中断终态 transaction；ARQ job_timeout 必须更长，不能替代执行 deadline。\n- PRIMARY Session 单 ACTIVE，只有设计允许的只读 SUBAGENT/BRANCH 可并行；resume/fork/replace 审计 parent 与 checkpoint checksum。\n- resolve_subagent_capabilities 同时按禁止集合和名称拦截 write，显式拒绝而非静默删减。split_budget 整除分配；子 Session 不写 RunEvent，归入主 Session 的一个 ToolCall + Evidence。\n- 预算执行接线须满足[上线门禁](../design/run-budgets.md#上线门禁与接线顺序)，内部账本不等于实际执行受控。\n- scope 内资源物化为只读 input/：超限失败不截断、不可读记 skipped、冻结 ID/hash 不符失败。准备/缓存见[资源快照](../design/resource-snapshots.md)。\n- TaskSchedule 调用 RunService.create_task_run；精确版/输入/资源失效即 ERROR，不换来源、不补跑全部历史发火。[迟发规则](../design/task-scheduling.md)。\n- Result 满足 OutcomeEnvelope；task-specific output Schema 可选，未声明时不报 structured_output_missing。[结果与评价](../design/results-evaluation.md)。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n- 资源 client 放 src/api/，画面经 index.ts barrel；HTTP 只用 requestApiJson / requestApiEmpty。mutation 传 csrfToken / X-CSRF-Token，响应在 client 边界验证，纯逻辑放 src/lib/。\n- TasksPage 选任务，WorkspacePage 管理 Run；不重造 SSE/取消/终态 lifecycle。即时/调度共用 taskDraft.ts / TaskLaunchFields.tsx。\n- 不在前端重算服务端 ID（如 derive_task_id）。筛选/分页在服务端，不能过滤第一页冒充全量。\n- 三语统一 src/lib/i18n/{zh,ja,en}.ts，同步 UiMessages / MESSAGES；画面用 useMessages()。\n- 生成 FrontendModule 不继承应用权限；CSP/iframe 隔离需回归，M3 后先完成威胁模型，见[生成界面](../design/generated-modules.md)。"}, {"title": "同步点", "level": "h2", "anchor": "同步点", "text": "## 同步点\n\n只更新受影响项；公开协议同时遵守[契约 workflow](contract-workflow.md)。\n\n| 改动 | 同步范围 |\n| --- | --- |\n| Settings | core/settings.py 的 Field 范围 → .env.example → API lifespan / Worker startup 注入 |\n| AgentEventType | agent/domain.py → engine.py mapper → Web RUN_EVENT_NAMES → RunEvent Schema |\n| Blueprint / Brief / OutcomeEnvelope | contract → DTO/validator/projector → frozen checksum → Worker/Web → example/test；不加业务专属字段 |\n| Segment / Interaction / Proposal | transition → DB/repository → event/outbox/SSE → 授权/幂等 → Web → recovery/Compose |\n| Tool capability | versioned request/response/error → Provider → context_builder.py registry → allowed_capabilities → 回归 |\n| endpoint | 资源 route/actor alias → response allowlist/Problem → Schema/example/OpenAPI → Web validator/barrel → 回归 |\n| DB model | db/models.py → migration → repository DTO/projection → 回归；无 relationship 的 FK 父子同事务新增时，父行后显式 flush() |\n| Schema / example | 同时注册 scripts/validate_contracts.py 和 backend/tests/contracts/test_contracts.py；保持 Problem 兼容 |\n| OpenAPI | endpoint 修改后运行 scripts/export_openapi.py 并验一致性；只读审查不重导出 |\n| 结构化 log | 注册 core/logging.py 的 _CONTEXT_FIELDS allowlist |\n| system Interpreter Skill | SemVer/content hash、example identity、prompt checksum 与测试同步；model 执行规则需 prompt 回归 |\n\ntests/ 镜像模块职责，测试名说明验证的行为。API 测试按资源拆分，共用 tests/api/fakes.py / conftest.py，不复制认证 fixture；fake SQL 与[真实 DB](local-development.md#実-postgresql-の前提)分开举证。"}, {"title": "Ingress", "level": "h2", "anchor": "ingress", "text": "## Ingress\n\n- 复用共享 Traefik，不新增其 service/静态配置、证书 resolver、dashboard 或 Docker socket mount。\n- 不发布 host port；只有 web/api 进入外部 edge network，其余 service 仅内部网络。\n- 外部 URL 在 SKILLMIND_CONTEXT_PATH 下：{contextPath}/api 归 API，其余归 Web。Traefik 去掉 context path，内部 API 保持 /api、Web 保持 /。\n- 配置与停写/迁移/放行见[发布手册](../operations/deployment.md)，功能开关不能代替全局停写证明。"}], "toc": [{"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "Run lifecycle", "anchor": "run-lifecycle", "level": "h2"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "同步点", "anchor": "同步点", "level": "h2"}, {"title": "Ingress", "anchor": "ingress", "level": "h2"}], "source": "development/coding-rules.md", "checksum": "ecc3d0c6ca39d37c622b2a8363ea14c3e0be10cab075e26386a5d15de534c6f7"}, {"id": "docs/development/contract-workflow.md", "title": "公开契约变更与联调", "group": "development", "html": "\u003ch1 id=\"公开契约变更与联调\">公开契约变更与联调\u003c/h1>\n\u003cp>字段语义见\u003ca href=\"#docs/design/README.md::\">领域设计\u003c/a>，状态见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>，命令环境见\u003ca href=\"#docs/development/local-development.md::\">本地开发\u003c/a>。\u003c/p>\n\u003ch2 id=\"先看整条交付链\">先看整条交付链\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">领域规则/授权/兼容 → Schema/example → Backend\n  → Web/Worker → 契约与流程回归 → 版本匹配及发布\n\u003c/code>\u003c/pre>\n\u003cp>只改受影响层。新增 required、删字段、收窄 enum、改变空值或 HTTP 拒绝语义，即使 URL/v1 文件名不变也可能破坏兼容。\u003c/p>\n\u003ch2 id=\"三种数据不要混成一份\">三种数据不要混成一份\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>持久快照\u003c/td>\n\u003ctd>保存当时事实、格式版与 checksum，不为新页面重写旧 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公开响应\u003c/td>\n\u003ctd>授权后白名单投影，不直接暴露内部 JSON 或修改原值来脱敏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面状态\u003c/td>\n\u003ctd>validator 后生成视图，不补造历史资源、身份或缺失字段\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"开工时列出消费者和同步先后\">开工时列出消费者和同步先后\u003c/h2>\n\u003cp>按\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">同步表\u003c/a>核对：\u003c/p>\n\u003cul>\n\u003cli>Schema/DTO：required、nullable、enum、额外字段；route：status、media type、header、缓存和 Problem。\u003c/li>\n\u003cli>service/repository：授权、hash、幂等、持久兼容与迁移；Worker/CLI/Schedule：旁路消费者。\u003c/li>\n\u003cli>Web：validator/barrel、页面、三语、fixture 与 mock browser。\u003c/li>\n\u003cli>\u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a>：由 app 生成，不能手补。\u003c/li>\n\u003c/ul>\n\u003cp>新 example 同步 \u003ca href=\"../SKM/scripts/validate_contracts.py\">validator\u003c/a>与\u003ca href=\"../SKM/backend/tests/contracts/test_contracts.py\">契约测试\u003c/a>的注册表。\nSchema 不验证授权/并发，OpenAPI 一致性不证明声明覆盖真实响应；例如登录 429 还须检查 Retry-After 和页面处理。\u003c/p>\n\u003ch2 id=\"遇到未接齐的交付链\">遇到未接齐的交付链\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>断点\u003c/th>\n\u003cth>接续动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>DTO/model 有，route 未调用\u003c/td>\n\u003ctd>接装配与用例，不把字段当 API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>route 有，OpenAPI 缺失\u003c/td>\n\u003ctd>核对后生成，不重造 API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API 有，页面缺失\u003c/td>\n\u003ctd>接 validator/barrel，再验用户流程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>example 通过，一致性失败\u003c/td>\n\u003ctd>保留两项结论，查生产与声明差异\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>单模块通过，合跑收集失败\u003c/td>\n\u003ctd>修 fixture/import 后重跑同组合\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>读检查不启动 lifespan、不连 DB、不回写。Backend 依赖就绪后，在 \u003ccode>SKM/\u003c/code> 执行 \u003ccode>python3 scripts/validate_contracts.py\u003c/code>；在 \u003ccode>SKM/backend/\u003c/code> 执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3
