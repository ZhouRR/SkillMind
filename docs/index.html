  <style>
    :root { --ink:#182b40; --muted:#56697e; --line:#dce5ed; --blue:#175b99; --paper:#fff; --wash:#f3f6f9; }
    * { box-sizing:border-box; }
    html { scroll-padding-top:var(--docs-scroll-offset,32px); }
    body { margin:0; color:var(--ink); background:var(--paper); font:16px/1.8 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
    a { color:var(--blue); text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere; }
    a:hover { color:#0c3861; }
    :focus-visible { outline:3px solid #1f6aa7; outline-offset:3px; }
    button,input { font:inherit; }
    button { background:white; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 12px; cursor:pointer; }
    .skip { position:fixed; top:-80px; left:12px; z-index:10; background:white; padding:10px; }
    .skip:focus { top:10px; }
    .sidebar { position:fixed; inset:0 auto 0 0; width:284px; overflow:auto; padding:28px 20px 36px; background:var(--wash); border-right:1px solid var(--line); }
    .brand { color:var(--ink); font-size:23px; font-weight:750; text-decoration:none; letter-spacing:-.5px; }
    .subtitle { margin:2px 0 23px; color:var(--muted); font-size:13px; }
    .search-label { font-size:13px; font-weight:650; }
    #search { width:100%; border:1px solid #b9c9d8; background:white; color:var(--ink); border-radius:7px; padding:9px 10px; margin:5px 0 8px; }
    details { margin:14px 0; }
    summary { color:#405871; font-weight:650; font-size:13px; cursor:pointer; padding:4px 0; }
    nav a { display:block; padding:7px 9px; margin:2px 0; border-radius:6px; color:#41556a; font-size:13px; line-height:1.55; text-decoration:none; }
    nav a:hover { background:#e6edf4; }
    nav a[aria-current="page"] { background:#dce9f5; color:#104b80; box-shadow:inset 3px 0 #24699e; font-weight:650; }
    .search-hit { border-bottom:1px solid var(--line); padding-bottom:10px; }
    .search-hit small { display:block; color:var(--muted); font-size:12px; margin:3px 9px; overflow-wrap:anywhere; }

    #search-status { color:var(--muted); font-size:12px; }
    .layout { margin-left:284px; padding:30px 42px 80px; }
    .topbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 20px; border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:32px; }
    .eyebrow { color:var(--blue); font-weight:700; letter-spacing:1px; font-size:12px; }
    .actions { display:flex; flex-shrink:0; align-items:center; gap:14px; margin-left:auto; font-size:13px; white-space:nowrap; }
    .content-layout { display:grid; grid-template-columns:minmax(0,900px) 200px; gap:38px; justify-content:center; }
    article { min-width:0; overflow-wrap:break-word; }
    article:focus { outline:none; }
    h1 { font-size:32px; line-height:1.4; letter-spacing:-.5px; margin:0 0 24px; }
    h2 { font-size:23px; line-height:1.5; margin:44px 0 18px; padding-top:7px; border-top:1px solid var(--line); }
    h3 { font-size:18px; margin:28px 0 12px; }
    h4 { font-size:16px; margin:24px 0 10px; }
    p { margin:14px 0; }
    ul,ol { padding-left:26px; }
    li { margin:7px 0; }
    blockquote { margin:18px 0 26px; border-left:3px solid #6294bc; border-radius:0 7px 7px 0; padding:3px 18px; background:#f0f6fb; color:#41556b; font-size:14px; }
    code { font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-size:.88em; background:#edf2f6; color:#264b6c; padding:2px 5px; border-radius:4px; overflow-wrap:anywhere; }
    pre { background:#f3f6f9; border:1px solid var(--line); border-radius:8px; padding:20px; overflow:auto; line-height:1.7; font-size:14px; }
    pre code { background:none; padding:0; border-radius:0; color:#253f57; overflow-wrap:normal; }
    .table-scroll { overflow:auto; border:1px solid var(--line); border-radius:8px; margin:20px 0; }
    .scroll-hint { color:var(--muted); font-size:12px; margin:0 12px 8px; }
    .inline-toc { display:none; border:1px solid var(--line); border-radius:8px; padding:9px 14px; margin:20px 0; }
    .inline-toc summary { font-size:14px; }
    .inline-toc a { display:block; font-size:13px; line-height:1.6; padding:5px 0; }
    .inline-toc a.sub { padding-left:12px; }
    table { border-collapse:collapse; width:100%; font-size:14px; line-height:1.7; }
    th { text-align:left; background:#eef4f8; font-weight:650; color:#284861; }
    th,td { padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; min-width:140px; }
    /* 数値比較の右寄せ列は本文列の幅を予約せず、窄幅でも行全体を比較できるようにする。 */
    th[style*="text-align:right"],td[style*="text-align:right"] { min-width:0; white-space:nowrap; }
    td:first-child code { overflow-wrap:normal; }
    tr:last-child td { border-bottom:0; }
    img { max-width:100%; }
    .toc { position:sticky; top:30px; align-self:start; max-height:calc(100vh - 60px); overflow:auto; font-size:12px; border-left:1px solid var(--line); padding-left:17px; }
    .toc strong { display:block; color:var(--muted); margin-bottom:8px; }
    .toc a { display:block; margin:8px 0; color:var(--muted); text-decoration:none; line-height:1.5; }
    .toc a.sub { padding-left:10px; font-size:11px; }
    .page-footer { border-top:1px solid var(--line); margin-top:48px; padding-top:20px; color:var(--muted); font-size:12px; }
    #menu-button { display:none; }
    [hidden] { display:none !important; }
    @media(max-width:1250px) { .content-layout { display:block; max-width:900px; margin:auto; } .toc { display:none; } .inline-toc { display:block; } .layout { padding:26px 30px 60px; } }
    @media(max-width:760px) { .sidebar { display:none; z-index:3; top:var(--docs-header-height,64px); width:min(320px,90vw); box-shadow:6px 0 20px #182b4022; } body.menu-open .sidebar { display:block; } .layout { margin:0; padding:16px 18px 45px; } .topbar { position:sticky; top:0; background:white; z-index:2; margin:-16px -18px 26px; padding:13px 18px; min-height:64px; } .eyebrow { font-size:11px; } #menu-button { display:inline-block; } .actions { gap:8px; } #print-button { display:none; } h1 { font-size:27px; } h2 { font-size:21px; } pre { padding:15px; font-size:12px; } th,td { padding:10px; } }
    @media print { .sidebar,.topbar,.toc,.skip,.inline-toc,.scroll-hint { display:none !important; } .layout { margin:0; padding:0; } .content-layout { display:block; } body { font-size:11pt; } h1 { font-size:22pt; } h2 { break-after:avoid; font-size:16pt; } pre { white-space:pre-wrap; overflow:visible; } .table-scroll { overflow:visible; } table { font-size:9pt; } tr { break-inside:avoid; } a { color:inherit; } }

  <script type="application/json" id="docs-data">{"groups": {"overview": "开始阅读", "planning": "当前进度", "design": "界面规范", "development": "开发指南", "operations": "部署与运维", "code": "工程入口", "other": "其他资料"}, "pages": [{"id": "docs/README.md", "title": "Skillmind 文書ガイド", "group": "overview", "html": "\u003ch1 id=\"skillmind-文書ガイド\">Skillmind 文書ガイド\u003c/h1>\n\u003cp>\u003ca href=\"index.html\">ブラウザで読む\u003c/a> · \u003ca href=\"#SKM/README.md::\">コードの入口\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">現在の進捗\u003c/a>\u003c/p>\n\u003cp>利用・開発・運用に必要なガイドの入口。主要フローの実装後は、実際の利用結果から改善対象を選ぶ。現在の実装と配備待ちの修正は Roadmap で分けて確認する。\u003c/p>\n\u003ch2 id=\"目的から探す\">目的から探す\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目的\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>製品を使う\u003c/td>\n\u003ctd>\u003ca href=\"#docs/overview/product.md::\">利用の流れと画面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全体を理解する\u003c/td>\n\u003ctd>\u003ca href=\"#docs/overview/architecture.md::\">システム構成と用語\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>変更する\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a> / \u003ca href=\"#docs/development/runtime-guide.md::\">維持する実行境界\u003c/a> / \u003ca href=\"#docs/development/coding-rules.md::\">実装細則\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>画面を整える\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/workspace.md::%E8%A7%86%E8%A7%89%E8%A7%84%E8%8C%83\">UI ガイド\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>開発・連携する\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/local-development.md::\">ローカル開発\u003c/a> / \u003ca href=\"#docs/development/api-usage.md::\">API 利用\u003c/a> / \u003ca href=\"#docs/development/contract-workflow.md::\">契約変更\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>起動・更新する\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a> / \u003ca href=\"#docs/operations/deployment.md::\">配備\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>障害・遅延を調べる\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a> / \u003ca href=\"#docs/operations/backup-recovery.md::\">復元\u003c/a> / \u003ca href=\"#docs/operations/run-performance.md::\">性能観測\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>進捗・文書を更新する\u003c/td>\n\u003ctd>\u003ca href=\"#docs/planning/roadmap.md::\">Roadmap\u003c/a> / \u003ca href=\"#docs/development/documentation.md::\">文書維持\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"文書とコードの役割\">文書とコードの役割\u003c/h2>\n\u003cp>ガイドには操作手順、判断基準、維持すべき境界を置く。詳細な型・字段・状態遷移は \u003ca href=\"#SKM/README.md::contracts\">Contracts\u003c/a> と実装・回帰テストを参照する。\nコード上の実装、隔離テスト、実環境の確認、配備済み状態を区別する。過去の詳細設計と重複する構造図は保持せず、必要な経緯は Git 履歴を参照する。\u003c/p>\n\u003cp>業務 Skill の \u003ccode>SKILL.md\u003c/code>、参照資料、Schema は実行入力であり、この文書整理の対象に含めない。\u003c/p>\n", "sections": [{"title": "Skillmind 文書ガイド", "level": "h1", "anchor": "skillmind-文書ガイド", "text": "# Skillmind 文書ガイド\n\n[ブラウザで読む](index.html) · [コードの入口](../SKM/README.md) · [現在の進捗](planning/roadmap.md#当前执行状态)\n\n利用・開発・運用に必要なガイドの入口。主要フローの実装後は、実際の利用結果から改善対象を選ぶ。現在の実装と配備待ちの修正は Roadmap で分けて確認する。"}, {"title": "目的から探す", "level": "h2", "anchor": "目的から探す", "text": "## 目的から探す\n\n| 目的 | 入口 |\n| --- | --- |\n| 製品を使う | [利用の流れと画面](overview/product.md) |\n| 全体を理解する | [システム構成と用語](overview/architecture.md) |\n| 変更する | [変更ガイド](development/change-guide.md) / [維持する実行境界](development/runtime-guide.md) / [実装細則](development/coding-rules.md) |\n| 画面を整える | [UI ガイド](design/workspace.md#视觉规范) |\n| 開発・連携する | [ローカル開発](development/local-development.md) / [API 利用](development/api-usage.md) / [契約変更](development/contract-workflow.md) |\n| 起動・更新する | [Quickstart](operations/quickstart.md) / [配備](operations/deployment.md) |\n| 障害・遅延を調べる | [Runbook](operations/runbook.md) / [復元](operations/backup-recovery.md) / [性能観測](operations/run-performance.md) |\n| 進捗・文書を更新する | [Roadmap](planning/roadmap.md) / [文書維持](development/documentation.md) |"}, {"title": "文書とコードの役割", "level": "h2", "anchor": "文書とコードの役割", "text": "## 文書とコードの役割\n\nガイドには操作手順、判断基準、維持すべき境界を置く。詳細な型・字段・状態遷移は [Contracts](../SKM/README.md#contracts) と実装・回帰テストを参照する。\nコード上の実装、隔離テスト、実環境の確認、配備済み状態を区別する。過去の詳細設計と重複する構造図は保持せず、必要な経緯は Git 履歴を参照する。\n\n業務 Skill の `SKILL.md`、参照資料、Schema は実行入力であり、この文書整理の対象に含めない。"}], "toc": [{"title": "目的から探す", "anchor": "目的から探す", "level": "h2"}, {"title": "文書とコードの役割", "anchor": "文書とコードの役割", "level": "h2"}], "source": "README.md", "checksum": "e8574ac93242e4faa7de99a3751a2182a4f19281e00dee7fc4c874d63c32862b"}, {"id": "docs/overview/product.md", "title": "使用指南", "group": "overview", "html": "\u003ch1 id=\"使用指南\">使用指南\u003c/h1>\n\u003cp>Skillmind 将 Skill 原文作为执行依据，把输入选择、资源访问、任务运行、外部变更和结果审计集中到项目中。当前可用范围与尚待验证部分见 \u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">Roadmap\u003c/a>。\u003c/p>\n\u003ch2 id=\"从-skill-到结果\">从 Skill 到结果\u003c/h2>\n\u003col>\n\u003cli>在组织技能库导入 Skill，核对解析得到的任务、必要输入和资源声明，再发布版本。\u003c/li>\n\u003cli>在项目中启用该精确版本，通过「资源与连接」配置凭据与访问权限。\u003c/li>\n\u003cli>选择任务和文档范围，核对预检内容后启动；需要重复运行时，在任务卡片设置定期执行。\u003c/li>\n\u003cli>在工作空间查看进行中任务和待处理事项；缺少业务信息时回答问题，需要批准时处理具体变更。\u003c/li>\n\u003cli>在「完成与报告」选择任务查看最新一次终态执行的总结；进入执行详情查看完整结果、附件、证据和评价。\u003c/li>\n\u003c/ol>\n\u003cp>发布、项目启用与资源就绪分别检查。平台不会把模型推测当作实际输入或自动扩展文档范围。新导入的 Skill 采用最小输入/资源声明加冻结原文执行，无需事先拆解为固定业务流程。\u003c/p>\n\u003ch2 id=\"页面怎么用\">页面怎么用\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>页面\u003c/th>\n\u003cth>主要用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>概览\u003c/td>\n\u003ctd>待办、最近执行及项目入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组织技能库\u003c/td>\n\u003ctd>按名称、标识、版本及状态筛选，导入、解释、发布、项目启用和版本清理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务\u003c/td>\n\u003ctd>按名称、标识和定期执行状态检索，启动或设置调度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作空间\u003c/td>\n\u003ctd>待处理、执行中与按任务汇总的最新报告\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行历史\u003c/td>\n\u003ctd>分页查看、耗时、单次详情及回收站管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目文档\u003c/td>\n\u003ctd>上传、目录选择、改名、移动、预览、下载与回收站\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>资源与连接\u003c/td>\n\u003ctd>凭据、授权范围，以及 PostgreSQL、文档库、Git、MCP 等连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目与账户\u003c/td>\n\u003ctd>成员、归档、账户安全及管理员管理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>ADMIN 管理组织技能、项目和资源；普通用户在获授权项目中操作。API Key 可供其他应用调用，当前没有逐资源的细粒度 Key 权限，参见 \u003ca href=\"#docs/development/api-usage.md::\">API 指南\u003c/a>。\u003c/p>\n\u003cp>解析完成但尚未创建草稿时，同一浏览器页签刷新或切换页面可读取原请求恢复结果，不需要重新解析。存储受限或原记录不可读时不能保证自动恢复；已创建的草稿从技能库继续操作。\u003c/p>\n\u003ch2 id=\"自动批准与结果阅读\">自动批准与结果阅读\u003c/h2>\n\u003cp>任务启动时的自动批准是对本次运行的明确同意。当前页面的自动批准选项同时提交数据库、文档、Git 和 MCP 的同意，服务端按各项原始同意范围核验。权限检查、冲突检查和回读仍然执行；取消自动批准后逐次批准。\u003c/p>\n\u003cp>平台执行成功、结果是否完整与业务 PASS/FAIL 是不同事实。报告模板展示模型提供的结论及引用，不自行推断测试通过；原 Skill 明确要求的报告仍作为业务成果保存。\u003c/p>\n\u003ch2 id=\"整理旧数据\">整理旧数据\u003c/h2>\n\u003cp>执行历史和文档支持移入回收站、恢复及完全删除。先核对预览中的关联成果和阻断引用；执行清理保留原始输入及共享引用，不自动删除外部业务数据库或 Git 记录。\n回收站内记录仍可能引用 Skill 版本；确需删除版本时先处理这些引用。完全删除不可恢复，保留必要审计。执行删除审计仍关联项目，因此执行列表为空也不代表项目可以物理删除，此时保持归档。\u003c/p>\n\u003cp>系统组成见\u003ca href=\"#docs/overview/architecture.md::\">架构与术语\u003c/a>，错误处理见 \u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a>。\u003c/p>\n", "sections": [{"title": "使用指南", "level": "h1", "anchor": "使用指南", "text": "# 使用指南\n\nSkillmind 将 Skill 原文作为执行依据，把输入选择、资源访问、任务运行、外部变更和结果审计集中到项目中。当前可用范围与尚待验证部分见 [Roadmap](../planning/roadmap.md#当前执行状态)。"}, {"title": "从 Skill 到结果", "level": "h2", "anchor": "从-skill-到结果", "text": "## 从 Skill 到结果\n\n1. 在组织技能库导入 Skill，核对解析得到的任务、必要输入和资源声明，再发布版本。\n2. 在项目中启用该精确版本，通过「资源与连接」配置凭据与访问权限。\n3. 选择任务和文档范围，核对预检内容后启动；需要重复运行时，在任务卡片设置定期执行。\n4. 在工作空间查看进行中任务和待处理事项；缺少业务信息时回答问题，需要批准时处理具体变更。\n5. 在「完成与报告」选择任务查看最新一次终态执行的总结；进入执行详情查看完整结果、附件、证据和评价。\n\n发布、项目启用与资源就绪分别检查。平台不会把模型推测当作实际输入或自动扩展文档范围。新导入的 Skill 采用最小输入/资源声明加冻结原文执行，无需事先拆解为固定业务流程。"}, {"title": "页面怎么用", "level": "h2", "anchor": "页面怎么用", "text": "## 页面怎么用\n\n| 页面 | 主要用途 |\n| --- | --- |\n| 概览 | 待办、最近执行及项目入口 |\n| 组织技能库 | 按名称、标识、版本及状态筛选，导入、解释、发布、项目启用和版本清理 |\n| 任务 | 按名称、标识和定期执行状态检索，启动或设置调度 |\n| 工作空间 | 待处理、执行中与按任务汇总的最新报告 |\n| 执行历史 | 分页查看、耗时、单次详情及回收站管理 |\n| 项目文档 | 上传、目录选择、改名、移动、预览、下载与回收站 |\n| 资源与连接 | 凭据、授权范围，以及 PostgreSQL、文档库、Git、MCP 等连接 |\n| 项目与账户 | 成员、归档、账户安全及管理员管理 |\n\nADMIN 管理组织技能、项目和资源；普通用户在获授权项目中操作。API Key 可供其他应用调用，当前没有逐资源的细粒度 Key 权限，参见 [API 指南](../development/api-usage.md)。\n\n解析完成但尚未创建草稿时，同一浏览器页签刷新或切换页面可读取原请求恢复结果，不需要重新解析。存储受限或原记录不可读时不能保证自动恢复；已创建的草稿从技能库继续操作。"}, {"title": "自动批准与结果阅读", "level": "h2", "anchor": "自动批准与结果阅读", "text": "## 自动批准与结果阅读\n\n任务启动时的自动批准是对本次运行的明确同意。当前页面的自动批准选项同时提交数据库、文档、Git 和 MCP 的同意，服务端按各项原始同意范围核验。权限检查、冲突检查和回读仍然执行；取消自动批准后逐次批准。\n\n平台执行成功、结果是否完整与业务 PASS/FAIL 是不同事实。报告模板展示模型提供的结论及引用，不自行推断测试通过；原 Skill 明确要求的报告仍作为业务成果保存。"}, {"title": "整理旧数据", "level": "h2", "anchor": "整理旧数据", "text": "## 整理旧数据\n\n执行历史和文档支持移入回收站、恢复及完全删除。先核对预览中的关联成果和阻断引用；执行清理保留原始输入及共享引用，不自动删除外部业务数据库或 Git 记录。\n回收站内记录仍可能引用 Skill 版本；确需删除版本时先处理这些引用。完全删除不可恢复，保留必要审计。执行删除审计仍关联项目，因此执行列表为空也不代表项目可以物理删除，此时保持归档。\n\n系统组成见[架构与术语](architecture.md)，错误处理见 [Runbook](../operations/runbook.md)。"}], "toc": [{"title": "从 Skill 到结果", "anchor": "从-skill-到结果", "level": "h2"}, {"title": "页面怎么用", "anchor": "页面怎么用", "level": "h2"}, {"title": "自动批准与结果阅读", "anchor": "自动批准与结果阅读", "level": "h2"}, {"title": "整理旧数据", "anchor": "整理旧数据", "level": "h2"}], "source": "overview/product.md", "checksum": "39eeb926738192d6a82b4024add4913a8cc1d7ee9f9c904f85a271cf33b891eb"}, {"id": "docs/overview/architecture.md", "title": "架构与核心术语", "group": "overview", "html": "\u003ch1 id=\"架构与核心术语\">架构与核心术语\u003c/h1>\n\u003cp>Backend 是模块化单体：API、业务 Worker 与维护 Worker 共享 Python package，分别运行。业务层依赖 AgentEngine 抽象，SDK 适配器负责 Codex/Claude 的具体通信。\u003c/p>\n\u003ch2 id=\"执行链路\">执行链路\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Web / API 调用方 → Traefik → FastAPI → 领域服务 → PostgreSQL\n                                          ↓ Outbox\n                                Redis 队列与通知\n                                  ↓         ↓\n                             业务 Worker  维护 Worker\n                                  ↓\n                           AgentEngine → 模型\n                                  ↓\n                         Tool Gateway / Provider\n                                  ↓\n                        受绑定和授权限制的外部资源\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Skill：原文导入 → 最小执行声明 → 审查发布 → 项目启用 → 任务目录。历史 Blueprint 保持原版本兼容。\u003c/li>\n\u003cli>Run：冻结版本、输入与授权上限 → 入队 → 准备只读输入 → 执行 → 等待答复/批准或提交结果。\u003c/li>\n\u003cli>外部变更：观测 → 提案 → 人工或适用的自动批准 → Effect → 回读并保存回执。\u003c/li>\n\u003c/ul>\n\u003cp>数据库是业务与审计正本，Redis 提供队列、短期锁、通知和登录防护；文档 blob 与 Run workspace 独立存储，不能当作同一事务。恢复参见\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E6%81%A2%E5%A4%8D%E7%82%B9%E5%8C%85%E5%90%AB%E4%BB%80%E4%B9%88\">一致恢复点\u003c/a>。\u003c/p>\n\u003ch2 id=\"读代码时的核心术语\">读代码时的核心术语\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Organization / Project\u003c/td>\n\u003ctd>组织资产与项目访问范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillVersion / Task\u003c/td>\n\u003ctd>不可变发布版本及该版本提供的任务入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integration / ResourceBinding\u003c/td>\n\u003ctd>外部连接及运行获准使用的资源范围，凭据不交给模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run / Segment / Attempt\u003c/td>\n\u003ctd>一次业务请求、一次分析或续行阶段、同阶段的技术尝试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Brief / Snapshot\u003c/td>\n\u003ctd>冻结执行指令与输入事实，不能用当前配置回填旧值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Interaction / Proposal\u003c/td>\n\u003ctd>普通问题与具体外部变更提案，采用不同回答协议\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Effect / Receipt\u003c/td>\n\u003ctd>实际变更及原操作回执；回执不证明远端当前状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence / Artifact\u003c/td>\n\u003ctd>可追溯的观测证据与已保存文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Result / Evaluation\u003c/td>\n\u003ctd>不可变执行结果与追加式人工评价/修订\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>代码定位统一见\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>，详细接口见 \u003ca href=\"#SKM/README.md::contracts\">Contracts\u003c/a>。修改时核对\u003ca href=\"#docs/development/runtime-guide.md::\">运行边界\u003c/a>，部署拓扑与路径配置见\u003ca href=\"#docs/operations/deployment.md::\">部署指南\u003c/a>，此处不另列模块规格。\u003c/p>\n", "sections": [{"title": "架构与核心术语", "level": "h1", "anchor": "架构与核心术语", "text": "# 架构与核心术语\n\nBackend 是模块化单体：API、业务 Worker 与维护 Worker 共享 Python package，分别运行。业务层依赖 AgentEngine 抽象，SDK 适配器负责 Codex/Claude 的具体通信。"}, {"title": "执行链路", "level": "h2", "anchor": "执行链路", "text": "## 执行链路\n\n```text\nWeb / API 调用方 → Traefik → FastAPI → 领域服务 → PostgreSQL\n                                          ↓ Outbox\n                                Redis 队列与通知\n                                  ↓         ↓\n                             业务 Worker  维护 Worker\n                                  ↓\n                           AgentEngine → 模型\n                                  ↓\n                         Tool Gateway / Provider\n                                  ↓\n                        受绑定和授权限制的外部资源\n```\n\n- Skill：原文导入 → 最小执行声明 → 审查发布 → 项目启用 → 任务目录。历史 Blueprint 保持原版本兼容。\n- Run：冻结版本、输入与授权上限 → 入队 → 准备只读输入 → 执行 → 等待答复/批准或提交结果。\n- 外部变更：观测 → 提案 → 人工或适用的自动批准 → Effect → 回读并保存回执。\n\n数据库是业务与审计正本，Redis 提供队列、短期锁、通知和登录防护；文档 blob 与 Run workspace 独立存储，不能当作同一事务。恢复参见[一致恢复点](../operations/backup-recovery.md#一致恢复点包含什么)。"}, {"title": "读代码时的核心术语", "level": "h2", "anchor": "读代码时的核心术语", "text": "## 读代码时的核心术语\n\n| 名称 | 含义 |\n| --- | --- |\n| Organization / Project | 组织资产与项目访问范围 |\n| SkillVersion / Task | 不可变发布版本及该版本提供的任务入口 |\n| Integration / ResourceBinding | 外部连接及运行获准使用的资源范围，凭据不交给模型 |\n| Run / Segment / Attempt | 一次业务请求、一次分析或续行阶段、同阶段的技术尝试 |\n| Brief / Snapshot | 冻结执行指令与输入事实，不能用当前配置回填旧值 |\n| Interaction / Proposal | 普通问题与具体外部变更提案，采用不同回答协议 |\n| Effect / Receipt | 实际变更及原操作回执；回执不证明远端当前状态 |\n| Evidence / Artifact | 可追溯的观测证据与已保存文件 |\n| Result / Evaluation | 不可变执行结果与追加式人工评价/修订 |\n\n代码定位统一见[变更指南](../development/change-guide.md)，详细接口见 [Contracts](../../SKM/README.md#contracts)。修改时核对[运行边界](../development/runtime-guide.md)，部署拓扑与路径配置见[部署指南](../operations/deployment.md)，此处不另列模块规格。"}], "toc": [{"title": "执行链路", "anchor": "执行链路", "level": "h2"}, {"title": "读代码时的核心术语", "anchor": "读代码时的核心术语", "level": "h2"}], "source": "overview/architecture.md", "checksum": "e2a591cbf7a85cea3326095e074384d97909be07291ed3383fc5d25dcfbfb34f"}, {"id": "docs/planning/roadmap.md", "title": "Skillmind 当前进度与优化方向", "group": "planning", "html": "\u003ch1 id=\"skillmind-当前进度与优化方向\">Skillmind 当前进度与优化方向\u003c/h1>\n\u003cp>本页维护当前能力、待复验事项和优化取舍。开发入口见\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>，运行约束见\u003ca href=\"#docs/development/runtime-guide.md::\">运行守则\u003c/a>。\u003c/p>\n\u003ch2 id=\"当前执行状态\">当前执行状态\u003c/h2>\n\u003cp>评估基准：2026-09-19，最近一轮页面修复已部署并复验。\u003cstrong>主要业务流程已实现，已有真实业务执行和部署页面验收；后续根据实际效果优化，不再按原详细设计清单推进。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>已实现\u003c/strong>表示代码及对应验证存在，\u003cstrong>待复验\u003c/strong>表示目标部署或具体场景尚未确认，\u003cstrong>按需评估\u003c/strong>表示有实际需求后再决定。实现、上线和业务正确性分别核对；不以未采用的扩展功能计算完成百分比或剩余工期。\u003c/p>\n\u003ch2 id=\"已实现的主要能力\">已实现的主要能力\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>范围\u003c/th>\n\u003cth>当前可用能力\u003c/th>\n\u003cth>验证边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Skill 到任务\u003c/td>\n\u003ctd>导入、解释、发布、项目启用；最小输入/资源声明配合冻结原文执行，同一任务承接答复与续行\u003c/td>\n\u003ctd>已复验独立 Skill 的导入至执行、报告链路；不同 Skill 的解释质量仍按案例核验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RV\u003c/td>\n\u003ctd>Excel → Markdown 转换与保存 → 审查 → PostgreSQL/文档库记录；FAIL 才保存 Markdown 审查报告\u003c/td>\n\u003ctd>已走通真实业务链路；一次完成不能证明缺陷检出率或无人辅助稳定性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>桌面测试\u003c/td>\n\u003ctd>直接使用 RV 通过的 Markdown，执行前固定步骤索引、原始预期和环境；MCP 启动、观察、逐步操作并保存操作记录与结果\u003c/td>\n\u003ctd>已有真实执行走完既定 UI 步骤并完成结果保存；\u003ccode>COMPLETED\u003c/code> 表示执行完成，不等于业务 \u003ccode>PASS\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>资源与外部写入\u003c/td>\n\u003ctd>文档、Git、PostgreSQL、通用 MCP 工具；工具契约、受控提案、人工/启动时同意的自动批准、回读与原操作核对\u003c/td>\n\u003ctd>DB/文档/MCP 有真实使用；Git 写入有隔离真实仓库回归，业务仓库交付仍需对应案例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档与执行履历\u003c/td>\n\u003ctd>目录、改名/移动、批量整理、检索排序、预览；执行及成果回收、恢复、完全删除和最小审计\u003c/td>\n\u003ctd>已实测文档整理、预览下载和改名后完全删除，以及合成执行的回收→恢复→评价→完全删除；搜索展开和空目录检索修复已上线复验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作区与报告\u003c/td>\n\u003ctd>待处理、执行中、按任务的最新总结；详情包含结果、证据、审计、评价、附件及耗时\u003c/td>\n\u003ctd>已复验主要页面、页签、弹窗与窄屏双主题；资源候选列表、Skill 检索及解析刷新恢复等修复已上线复验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>基础管理\u003c/td>\n\u003ctd>登录/成员/项目、组织 API Key、连接凭据、任务检索和定期执行\u003c/td>\n\u003ctd>已实测项目管理、删除后导航、删除审计诊断及 API Key 创建/调用/撤销；调度表单及隔离回归通过，真实定时触发、他人权限修改与连接写入未在本轮重做\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运行效率与诊断\u003c/td>\n\u003ctd>SQLSTATE 分类、授权表结构获取与复用、冻结 Skill 文件直供、平台总结排版、审计导出、分离维护队列、有限重试与耗时观测\u003c/td>\n\u003ctd>已有回归与真实耗时改善反馈；收益按相同业务条件比较，不把 \u003ccode>engine_wait\u003c/code> 全部解释为模型思考\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>桌面执行与后续判定依据冻结 Markdown、完整步骤索引及原始预期，无需独立计划文件；仍保留未执行项并单独验收判定质量。一次执行完成不代表无人辅助稳定性或业务缺陷检出率。\u003c/p>\n\u003ch2 id=\"当前仍需核实的事项\">当前仍需核实的事项\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事项\u003c/th>\n\u003cth>当前处理方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>业务结果是否可信\u003c/td>\n\u003ctd>使用固定输入、明确范围和独立预期核对 RV、实际操作、结果保存与最终判断；保留遗漏、人工介入和未验证范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>异常与恢复\u003c/td>\n\u003ctd>在涉及取消、撤权、重启、并发、结果未知时，针对原操作和实际部署验证；不以新建 Run 或重发写入代替恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>证据是否齐全\u003c/td>\n\u003ctd>Runner 返回的路径不等于证据已入库；按当前许可能力核对文件实取和保存，无法取得的内容明确记为不足\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据清理与恢复\u003c/td>\n\u003ctd>引用保护及最小审计继续保留；对象删除的持久重试/配额结算、跨实例恢复、Secret/数据恢复及灾难恢复仍按实际部署要求验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持续性能\u003c/td>\n\u003ctd>比较首次业务操作时间、人工介入、暂停/续行、模型输出及收尾耗时；已接入有限 job 内确认自动批准后的 Codex 进程复用，以及只读/本地短工具序列；原生单调用内 Effect 回执和外部写序列仍未接入。新路径的真实业务提速待部署复验\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>完整共享预算与可信停止尚未闭合；可编辑 Flow、生成应用、子 Agent、高级编排及其他外部写入按需评估。局部实现或功能开关不代表正式交付，边界见\u003ca href=\"#docs/development/runtime-guide.md::%E5%90%8E%E7%BD%AE%E8%83%BD%E5%8A%9B\">后置能力\u003c/a>。旧任务编号和详细设计需要时查 Git 历史，不再维护平行计划。\u003c/p>\n\u003ch2 id=\"后续推进方式\">后续推进方式\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>从使用结果选问题。\u003c/strong> 记录重现方式和原 Run/页面；优先处理错误结果、数据风险与阻断，再处理耗时、重复操作和可读性。\u003c/li>\n\u003cli>\u003cstrong>定位后最小修复。\u003c/strong> 区分 Skill、模型、平台、外部服务及页面；按\u003ca href=\"#docs/operations/run-performance.md::\">性能口径\u003c/a>分析，不跳过必要保存、批准、回读和验证，不增加无依据的必填项或确认。\u003c/li>\n\u003cli>\u003cstrong>回归、上线、复核效果。\u003c/strong> 按改动风险验证，比较结论完整性、人工介入和耗时；冻结规则变化不覆盖旧执行。只有稳定规则变化才更新指南，具体协议以代码和 Schema 为准。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"交付判断\">交付判断\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>业务可用：\u003c/strong> 当前任务完成约定范围，结论、证据、必要记录与未执行项可追溯；执行成功与业务判定分开显示。\u003c/li>\n\u003cli>\u003cstrong>边界不退化：\u003c/strong> 权限、冻结输入、批准、幂等、引用保护和未知效果处理保持有效；不新增与本次问题无关的流程阻断。\u003c/li>\n\u003cli>\u003cstrong>实际可交付：\u003c/strong> 相关回归通过，目标部署可操作；明确剩余限制及尚未复验场景，不声称全环境或全流程已覆盖。\u003c/li>\n\u003c/ul>\n\u003cp>达到本次场景的交付条件后继续试用；未观察到的收益、部署或恢复能力不写成完成。\u003c/p>\n", "sections": [{"title": "Skillmind 当前进度与优化方向", "level": "h1", "anchor": "skillmind-当前进度与优化方向", "text": "# Skillmind 当前进度与优化方向\n\n本页维护当前能力、待复验事项和优化取舍。开发入口见[变更指南](../development/change-guide.md)，运行约束见[运行守则](../development/runtime-guide.md)。"}, {"title": "当前执行状态", "level": "h2", "anchor": "当前执行状态", "text": "## 当前执行状态\n\n评估基准：2026-09-19，最近一轮页面修复已部署并复验。**主要业务流程已实现，已有真实业务执行和部署页面验收；后续根据实际效果优化，不再按原详细设计清单推进。**\n\n**已实现**表示代码及对应验证存在，**待复验**表示目标部署或具体场景尚未确认，**按需评估**表示有实际需求后再决定。实现、上线和业务正确性分别核对；不以未采用的扩展功能计算完成百分比或剩余工期。"}, {"title": "已实现的主要能力", "level": "h2", "anchor": "已实现的主要能力", "text": "## 已实现的主要能力\n\n| 范围 | 当前可用能力 | 验证边界 |\n| --- | --- | --- |\n| Skill 到任务 | 导入、解释、发布、项目启用；最小输入/资源声明配合冻结原文执行，同一任务承接答复与续行 | 已复验独立 Skill 的导入至执行、报告链路；不同 Skill 的解释质量仍按案例核验 |\n| RV | Excel → Markdown 转换与保存 → 审查 → PostgreSQL/文档库记录；FAIL 才保存 Markdown 审查报告 | 已走通真实业务链路；一次完成不能证明缺陷检出率或无人辅助稳定性 |\n| 桌面测试 | 直接使用 RV 通过的 Markdown，执行前固定步骤索引、原始预期和环境；MCP 启动、观察、逐步操作并保存操作记录与结果 | 已有真实执行走完既定 UI 步骤并完成结果保存；`COMPLETED` 表示执行完成，不等于业务 `PASS` |\n| 资源与外部写入 | 文档、Git、PostgreSQL、通用 MCP 工具；工具契约、受控提案、人工/启动时同意的自动批准、回读与原操作核对 | DB/文档/MCP 有真实使用；Git 写入有隔离真实仓库回归，业务仓库交付仍需对应案例 |\n| 文档与执行履历 | 目录、改名/移动、批量整理、检索排序、预览；执行及成果回收、恢复、完全删除和最小审计 | 已实测文档整理、预览下载和改名后完全删除，以及合成执行的回收→恢复→评价→完全删除；搜索展开和空目录检索修复已上线复验 |\n| 工作区与报告 | 待处理、执行中、按任务的最新总结；详情包含结果、证据、审计、评价、附件及耗时 | 已复验主要页面、页签、弹窗与窄屏双主题；资源候选列表、Skill 检索及解析刷新恢复等修复已上线复验 |\n| 基础管理 | 登录/成员/项目、组织 API Key、连接凭据、任务检索和定期执行 | 已实测项目管理、删除后导航、删除审计诊断及 API Key 创建/调用/撤销；调度表单及隔离回归通过，真实定时触发、他人权限修改与连接写入未在本轮重做 |\n| 运行效率与诊断 | SQLSTATE 分类、授权表结构获取与复用、冻结 Skill 文件直供、平台总结排版、审计导出、分离维护队列、有限重试与耗时观测 | 已有回归与真实耗时改善反馈；收益按相同业务条件比较，不把 `engine_wait` 全部解释为模型思考 |\n\n桌面执行与后续判定依据冻结 Markdown、完整步骤索引及原始预期，无需独立计划文件；仍保留未执行项并单独验收判定质量。一次执行完成不代表无人辅助稳定性或业务缺陷检出率。"}, {"title": "当前仍需核实的事项", "level": "h2", "anchor": "当前仍需核实的事项", "text": "## 当前仍需核实的事项\n\n| 事项 | 当前处理方式 |\n| --- | --- |\n| 业务结果是否可信 | 使用固定输入、明确范围和独立预期核对 RV、实际操作、结果保存与最终判断；保留遗漏、人工介入和未验证范围 |\n| 异常与恢复 | 在涉及取消、撤权、重启、并发、结果未知时，针对原操作和实际部署验证；不以新建 Run 或重发写入代替恢复 |\n| 证据是否齐全 | Runner 返回的路径不等于证据已入库；按当前许可能力核对文件实取和保存，无法取得的内容明确记为不足 |\n| 数据清理与恢复 | 引用保护及最小审计继续保留；对象删除的持久重试/配额结算、跨实例恢复、Secret/数据恢复及灾难恢复仍按实际部署要求验证 |\n| 持续性能 | 比较首次业务操作时间、人工介入、暂停/续行、模型输出及收尾耗时；已接入有限 job 内确认自动批准后的 Codex 进程复用，以及只读/本地短工具序列；原生单调用内 Effect 回执和外部写序列仍未接入。新路径的真实业务提速待部署复验 |\n\n完整共享预算与可信停止尚未闭合；可编辑 Flow、生成应用、子 Agent、高级编排及其他外部写入按需评估。局部实现或功能开关不代表正式交付，边界见[后置能力](../development/runtime-guide.md#后置能力)。旧任务编号和详细设计需要时查 Git 历史，不再维护平行计划。"}, {"title": "后续推进方式", "level": "h2", "anchor": "后续推进方式", "text": "## 后续推进方式\n\n1. **从使用结果选问题。** 记录重现方式和原 Run/页面；优先处理错误结果、数据风险与阻断，再处理耗时、重复操作和可读性。\n2. **定位后最小修复。** 区分 Skill、模型、平台、外部服务及页面；按[性能口径](../operations/run-performance.md)分析，不跳过必要保存、批准、回读和验证，不增加无依据的必填项或确认。\n3. **回归、上线、复核效果。** 按改动风险验证，比较结论完整性、人工介入和耗时；冻结规则变化不覆盖旧执行。只有稳定规则变化才更新指南，具体协议以代码和 Schema 为准。"}, {"title": "交付判断", "level": "h2", "anchor": "交付判断", "text": "## 交付判断\n\n- **业务可用：** 当前任务完成约定范围，结论、证据、必要记录与未执行项可追溯；执行成功与业务判定分开显示。\n- **边界不退化：** 权限、冻结输入、批准、幂等、引用保护和未知效果处理保持有效；不新增与本次问题无关的流程阻断。\n- **实际可交付：** 相关回归通过，目标部署可操作；明确剩余限制及尚未复验场景，不声称全环境或全流程已覆盖。\n\n达到本次场景的交付条件后继续试用；未观察到的收益、部署或恢复能力不写成完成。"}], "toc": [{"title": "当前执行状态", "anchor": "当前执行状态", "level": "h2"}, {"title": "已实现的主要能力", "anchor": "已实现的主要能力", "level": "h2"}, {"title": "当前仍需核实的事项", "anchor": "当前仍需核实的事项", "level": "h2"}, {"title": "后续推进方式", "anchor": "后续推进方式", "level": "h2"}, {"title": "交付判断", "anchor": "交付判断", "level": "h2"}], "source": "planning/roadmap.md", "checksum": "db1be0e30d1e6e89499ced41a2029a239e4e1d2793e58c03459196511bd0382c"}, {"id": "docs/design/workspace.md", "title": "UI 开发指南", "group": "design", "html": "\u003ch1 id=\"ui-开发指南\">UI 开发指南\u003c/h1>\n\u003cp>工作空间负责任务启动、待办与总结；执行历史负责单次 Run 的完整记录。页面实现见 \u003ca href=\"../SKM/web/src\">web/src\u003c/a>，提交与恢复边界见\u003ca href=\"#docs/development/runtime-guide.md::\">运行维护指南\u003c/a>。\u003c/p>\n\u003ch2 id=\"视觉规范\">视觉规范\u003c/h2>\n\u003cp>新增页面延续现有工作台，通过留白、对齐和信息层级提高可读性，不另建视觉系统。\u003c/p>\n\u003cul>\n\u003cli>复用暖灰夜间、暖白日间与少量琥珀色主操作，沿用\u003ca href=\"../SKM/web/src/styles/base.css\">共享样式\u003c/a>、\u003ca href=\"../SKM/web/src/styles/reading.css\">阅读布局\u003c/a>和\u003ca href=\"../SKM/web/src/components/routeIcons.tsx\">线性图标\u003c/a>。\u003c/li>\n\u003cli>每个操作区一个主要动作。标题、状态、正文、工具栏与分页分组；长文本换行，不缩小字号或横向撑破页面。列表标题用任务名称，ID、版本与校验值放技术详情。\u003c/li>\n\u003cli>列表保留常用主动作，改名、移动、停用与删除等管理操作收进常驻的 \u003ccode>⋯\u003c/code> 菜单；不依赖悬停才能发现。文件名直接预览，无法预览时下载；目录复选框只选择当前筛选范围，批量操作仅在有选中项时显示。菜单复用原权限、确认与请求处理，支持键盘和窄屏。\u003c/li>\n\u003cli>跨页使用侧栏，同页模式使用页签。工作空间的待处理、执行中、报告保持同一宽度；空态仍保留切换与返回入口。\u003c/li>\n\u003cli>只保留影响选择、操作后果和结果判断的说明。标题或内容已说明用途时，不重复放常驻提示。错误显示失败位置、原因和下一步；权限、未知结果与未保存内容不可隐藏。\u003c/li>\n\u003cli>短说明用折叠，资源、证据和评价用抽屉，确认用小弹窗，不嵌套弹窗。保留键盘、焦点、Escape、长文本和滚动行为。\u003c/li>\n\u003cli>候选路径较多时先显示数量，展开后可滚动查看完整列表；必要状态和缺失原因始终可见，不让路径清单挤压主要操作。\u003c/li>\n\u003cli>三语统一使用消息目录。日间/夜间切换不重建表单；浏览器存储受限时仍可在当前页使用，默认主题遵从现有应用设置。\u003c/li>\n\u003c/ul>\n\u003cp>PC 1440×900 为主，兼顾 1366×768、1920×1080、三语及双主题；390px 窄屏保留可操作性。实际颜色、字号和间距以共享样式为准，不在文档复制 CSS 数值。\u003c/p>\n\u003ch2 id=\"导航与任务\">导航与任务\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/web/src/lib/routing.ts\">统一路由\u003c/a>负责精确 Project/Run/Task。概览、工作空间、报告、调度及历史中的执行链接统一打开历史详情，侧栏也选中执行历史。切换项目清除旧 Run/Task，失效链接不自动跳到其他项目。\n确认删除当前项目后清除该目标并提示选择项目；删除响应未知时保留原目标用于核对，不误报删除成功。\u003c/p>\n\u003cp>任务列表按名称、任务标识和定期执行状态检索；卡片显示调度状态及下次时间，设置入口保留在任务卡片，不增加独立调度 Tab。\n启动表单与调度复用 \u003ca href=\"../SKM/web/src/components/TaskLaunchFields.tsx\">TaskLaunchFields\u003c/a> 和 taskDraft。弹窗内选定的精确任务不被目录刷新或模块默认值替换；目录文档范围一次选择目录及子目录中的可用文档。\u003c/p>\n\u003ch2 id=\"报告与预览\">报告与预览\u003c/h2>\n\u003cp>「完成与报告」按任务显示最新终态执行的总结、状态、耗时与详情入口。最新失败或取消时不回退旧成功报告。附件、证据、评价及技术记录集中在执行详情，项目/任务切换立即隔离旧响应。\u003c/p>\n\u003cp>平台模板使用已有结果字段排版，保留业务结论、限制及引用，不根据 SUCCEEDED 推断 PASS。旧 HTML 报告仍可查看；Markdown 使用共享阅读组件，JSON 只格式化显示且保留数值精度、重复字段和原始下载字节。\u003c/p>\n\u003cp>HTML 预览沿用 sanitizer 和无脚本 sandbox，禁止外部资源及导航。附件按原 Run、hash、大小和当前授权校验；不可用时明确说明，不推测内容或为展示重跑模型。\u003c/p>\n\u003ch2 id=\"管理操作与异步状态\">管理操作与异步状态\u003c/h2>\n\u003cp>文档/目录管理、历史回收站与账户表单复用既有身份、防重、版本冲突和未知结果处理。已发送请求与草稿分开，通信失败不证明回滚；按原请求核对，不生成新 key 自动重发。关闭弹窗、切换目标或卸载后，旧响应不能覆盖当前内容。\u003c/p>\n\u003cp>筛选、分页与计数使用服务端事实，完整列表可本地筛选，不能筛第一页冒充全量。搜索目录时显露命中路径，空目录也应可找到。已选项随目标切换清理；确认弹窗说明实际影响，不新加无关前置条件。\u003c/p>\n\u003cp>异步解析完成后保留原请求引用供刷新恢复，不能为恢复显示再次调用模型；开始新原文或成功创建草稿后结束该临时引用。\u003c/p>\n\u003ch2 id=\"验证入口\">验证入口\u003c/h2>\n\u003cp>运行\u003ca href=\"#docs/development/local-development.md::%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E5%9B%9E%E5%B8%B0\">页面回归\u003c/a>，共用布局调整覆盖双主题、三语、PC 与窄屏；至少检查空态、多记录、长名称、键盘、失败及延迟响应。\n\u003ca href=\"../SKM/web/tests/browser/check_visual_style.py\">全站检查\u003c/a>和\u003ca href=\"../SKM/web/tests/browser/check_reading.py\">阅读检查\u003c/a>使用 mock；真实部署的字体、权限、网络与持久化另行验证。\u003c/p>\n", "sections": [{"title": "UI 开发指南", "level": "h1", "anchor": "ui-开发指南", "text": "# UI 开发指南\n\n工作空间负责任务启动、待办与总结；执行历史负责单次 Run 的完整记录。页面实现见 [web/src](../../SKM/web/src/)，提交与恢复边界见[运行维护指南](../development/runtime-guide.md)。"}, {"title": "视觉规范", "level": "h2", "anchor": "视觉规范", "text": "## 视觉规范\n\n新增页面延续现有工作台，通过留白、对齐和信息层级提高可读性，不另建视觉系统。\n\n- 复用暖灰夜间、暖白日间与少量琥珀色主操作，沿用[共享样式](../../SKM/web/src/styles/base.css)、[阅读布局](../../SKM/web/src/styles/reading.css)和[线性图标](../../SKM/web/src/components/routeIcons.tsx)。\n- 每个操作区一个主要动作。标题、状态、正文、工具栏与分页分组；长文本换行，不缩小字号或横向撑破页面。列表标题用任务名称，ID、版本与校验值放技术详情。\n- 列表保留常用主动作，改名、移动、停用与删除等管理操作收进常驻的 `⋯` 菜单；不依赖悬停才能发现。文件名直接预览，无法预览时下载；目录复选框只选择当前筛选范围，批量操作仅在有选中项时显示。菜单复用原权限、确认与请求处理，支持键盘和窄屏。\n- 跨页使用侧栏，同页模式使用页签。工作空间的待处理、执行中、报告保持同一宽度；空态仍保留切换与返回入口。\n- 只保留影响选择、操作后果和结果判断的说明。标题或内容已说明用途时，不重复放常驻提示。错误显示失败位置、原因和下一步；权限、未知结果与未保存内容不可隐藏。\n- 短说明用折叠，资源、证据和评价用抽屉，确认用小弹窗，不嵌套弹窗。保留键盘、焦点、Escape、长文本和滚动行为。\n- 候选路径较多时先显示数量，展开后可滚动查看完整列表；必要状态和缺失原因始终可见，不让路径清单挤压主要操作。\n- 三语统一使用消息目录。日间/夜间切换不重建表单；浏览器存储受限时仍可在当前页使用，默认主题遵从现有应用设置。\n\nPC 1440×900 为主，兼顾 1366×768、1920×1080、三语及双主题；390px 窄屏保留可操作性。实际颜色、字号和间距以共享样式为准，不在文档复制 CSS 数值。"}, {"title": "导航与任务", "level": "h2", "anchor": "导航与任务", "text": "## 导航与任务\n\n[统一路由](../../SKM/web/src/lib/routing.ts)负责精确 Project/Run/Task。概览、工作空间、报告、调度及历史中的执行链接统一打开历史详情，侧栏也选中执行历史。切换项目清除旧 Run/Task，失效链接不自动跳到其他项目。\n确认删除当前项目后清除该目标并提示选择项目；删除响应未知时保留原目标用于核对，不误报删除成功。\n\n任务列表按名称、任务标识和定期执行状态检索；卡片显示调度状态及下次时间，设置入口保留在任务卡片，不增加独立调度 Tab。\n启动表单与调度复用 [TaskLaunchFields](../../SKM/web/src/components/TaskLaunchFields.tsx) 和 taskDraft。弹窗内选定的精确任务不被目录刷新或模块默认值替换；目录文档范围一次选择目录及子目录中的可用文档。"}, {"title": "报告与预览", "level": "h2", "anchor": "报告与预览", "text": "## 报告与预览\n\n「完成与报告」按任务显示最新终态执行的总结、状态、耗时与详情入口。最新失败或取消时不回退旧成功报告。附件、证据、评价及技术记录集中在执行详情，项目/任务切换立即隔离旧响应。\n\n平台模板使用已有结果字段排版，保留业务结论、限制及引用，不根据 SUCCEEDED 推断 PASS。旧 HTML 报告仍可查看；Markdown 使用共享阅读组件，JSON 只格式化显示且保留数值精度、重复字段和原始下载字节。\n\nHTML 预览沿用 sanitizer 和无脚本 sandbox，禁止外部资源及导航。附件按原 Run、hash、大小和当前授权校验；不可用时明确说明，不推测内容或为展示重跑模型。"}, {"title": "管理操作与异步状态", "level": "h2", "anchor": "管理操作与异步状态", "text": "## 管理操作与异步状态\n\n文档/目录管理、历史回收站与账户表单复用既有身份、防重、版本冲突和未知结果处理。已发送请求与草稿分开，通信失败不证明回滚；按原请求核对，不生成新 key 自动重发。关闭弹窗、切换目标或卸载后，旧响应不能覆盖当前内容。\n\n筛选、分页与计数使用服务端事实，完整列表可本地筛选，不能筛第一页冒充全量。搜索目录时显露命中路径，空目录也应可找到。已选项随目标切换清理；确认弹窗说明实际影响，不新加无关前置条件。\n\n异步解析完成后保留原请求引用供刷新恢复，不能为恢复显示再次调用模型；开始新原文或成功创建草稿后结束该临时引用。"}, {"title": "验证入口", "level": "h2", "anchor": "验证入口", "text": "## 验证入口\n\n运行[页面回归](../development/local-development.md#ブラウザ回帰)，共用布局调整覆盖双主题、三语、PC 与窄屏；至少检查空态、多记录、长名称、键盘、失败及延迟响应。\n[全站检查](../../SKM/web/tests/browser/check_visual_style.py)和[阅读检查](../../SKM/web/tests/browser/check_reading.py)使用 mock；真实部署的字体、权限、网络与持久化另行验证。"}], "toc": [{"title": "视觉规范", "anchor": "视觉规范", "level": "h2"}, {"title": "导航与任务", "anchor": "导航与任务", "level": "h2"}, {"title": "报告与预览", "anchor": "报告与预览", "level": "h2"}, {"title": "管理操作与异步状态", "anchor": "管理操作与异步状态", "level": "h2"}, {"title": "验证入口", "anchor": "验证入口", "level": "h2"}], "source": "design/workspace.md", "checksum": "060308d4ff0076ba3a63fe42509d50c70e144d044520e1cc5d4a94724bba4487"}, {"id": "docs/development/local-development.md", "title": "ローカル開発と検証", "group": "development", "html": "\u003ch1 id=\"ローカル開発と検証\">ローカル開発と検証\u003c/h1>\n\u003cp>全体の入口は \u003ca href=\"#SKM/README.md::\">SKM README\u003c/a>。実行 directory を各節に示す。検証は今回の変更に必要な範囲を選び、mock と実環境の証拠を区別する。\u003c/p>\n\u003ch2 id=\"前提と設定\">前提と設定\u003c/h2>\n\u003cp>Python 3.12、Node.js 26 / pnpm 11.7.0 を使用する。既存依存を優先して再利用し、新規導入例を以下に示す。lockfile は手編集せず、Python 検証は \u003ccode>PYTHONDONTWRITEBYTECODE=1\u003c/code> を付ける。\n\u003ccode>.env.example\u003c/code> は production 雛形。localhost では development、許可 Origin、専用接続先と書込可能な Run workspace を設定する。Backend の \u003ccode>.env\u003c/code> は実行 directory 基準。Compose は\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">設定入口\u003c/a>の ENV_FILE を使う。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>\u003ccode>SKM/backend/\u003c/code> で実行する。migration は対象 DB を変更するため開発用接続を確認する。API と各 Worker は別 terminal で起動する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -e \u0026quot;.[dev]\u0026quot;\nalembic upgrade head\npython3 -m uvicorn skillmind.api.main:app --reload --port 8000\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">arq skillmind.worker.settings.WorkerSettings\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">arq skillmind.worker.settings.MaintenanceWorkerSettings\n\u003c/code>\u003c/pre>\n\u003cp>health は \u003ccode>http://localhost:8000/internal/health/live\u003c/code> と \u003ccode>/internal/health/ready\u003c/code>。後者は依存 service も確認する。Compose 起動は\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>を使う。\u003c/p>\n\u003ch3 id=\"実-postgresql-の前提\">実 PostgreSQL の前提\u003c/h3>\n\u003cp>全 pytest は\u003ca href=\"../SKM/backend/tests/db/test_real_database_invariants.py\">実 DB fixture\u003c/a>を含む。SKILLMIND_DATABASE_URL の \u003cstrong>server 上で scratch DB を作り、migration 後に DROP DATABASE WITH (FORCE)\u003c/strong> を行う。URL の DB 名変更だけでは隔離にならない。\n対象 server/account と作成・削除権限を確認する。実 DB を使わない場合は対象 test を指定するか、次で既知の実 DB module を除外する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">PYTHONDONTWRITEBYTECODE=1 python3 -m pytest --import-mode=importlib -p no:cacheprovider -o addopts= \\\n  --ignore=tests/db/test_real_database_invariants.py \\\n  --ignore=tests/db/test_real_auth_sessions.py \\\n  --ignore=tests/db/test_real_api_keys.py \\\n  --ignore=tests/db/test_real_budget_ledger.py\n\u003c/code>\u003c/pre>\n\u003cp>新たな fixture 利用先や Redis 等の process も確認する。接続不能による skip は未実施、認証/権限/migration エラーは失敗として報告する。\u003c/p>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cp>\u003ccode>SKM/web/\u003c/code> で実行する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">CI=true npx -y pnpm@11.7.0 install --frozen-lockfile\nnpx -y pnpm@11.7.0 dev\n\u003c/code>\u003c/pre>\n\u003cp>既定 URL は \u003ccode>http://localhost:5173/skillmind/\u003c/code>、API proxy は \u003ccode>http://127.0.0.1:8000\u003c/code>。context path と browser Origin を合わせる。\u003c/p>\n\u003ch3 id=\"ブラウザ回帰\">ブラウザ回帰\u003c/h3>\n\u003cp>専用 harness は実 Component + mock API を使う。実 credential/Backend/DB/model を使わず、runner を配備先 URL に向けない。\u003ccode>SKM/web/\u003c/code> で初回依存導入後、専用 terminal の Vite を起動する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r tests/browser/requirements.txt\npython3 -m playwright install chromium\nnode_modules/.bin/vite --host 127.0.0.1 --port 5189 --strictPort\n\u003c/code>\u003c/pre>\n\u003cp>別 terminal で対象 runner の \u003ccode>--help\u003c/code> を確認して実行する。例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 tests/browser/check_projects.py \\\n  --url http://127.0.0.1:5189/skillmind/tests/browser/projects.html\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>主な runner（check_*.py）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>全体の見た目・読みやすさ\u003c/td>\n\u003ctd>visual_style、reading\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Project・アカウント\u003c/td>\n\u003ctd>projects、project_members、project_management、login、accounts、api_keys\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>提出・待機・履歴\u003c/td>\n\u003ctd>run_submission、interaction_responses、proposal_decisions、run_history、evaluation_submissions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>レポート・証拠\u003c/td>\n\u003ctd>report_reading、workspace_reports、result_references、artifacts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文書・directory\u003c/td>\n\u003ctd>document_organization、document_management、document_preview、document_upload、document_batches\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接続・Skill・調度\u003c/td>\n\u003ctd>resource_editing、resource_request_lifecycle、mcp_tools、interpretation_requests、skill_library_delete、task_launch_identity、task_schedules、schedule_times\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>全 runner は \u003ca href=\"../SKM/web/tests/browser\">tests/browser\u003c/a> にある。harness URL と \u003ccode>--output\u003c/code> 等の必須引数は各 runner を参照する。主に projects.html、提出系は run-submission.html を使う。\n外置依存は PYTHONPATH、browser は PLAYWRIGHT_BROWSERS_PATH を指定する。使用中 port を奪わず、終了時は自分の Vite だけを止める。mock は実 DB の競合/撤権、blob、外部 write や複数 Worker の証明ではない。\u003c/p>\n\u003ch2 id=\"変更に応じた検証\">変更に応じた検証\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>実行位置と選択基準\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Backend\u003c/td>\n\u003ctd>SKM/backend/：対象 Ruff/pytest。型変更は \u003ccode>python3 -m mypy src\u003c/code>、広範囲変更は関連 module に拡大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web\u003c/td>\n\u003ctd>SKM/web/：\u003ccode>node_modules/.bin/tsc -b --pretty false\u003c/code> と対象 Vitest。共有 UI 変更は双テーマ・三語・PC/狭幅の browser 回帰。bundle/依存変更は \u003ccode>node_modules/.bin/vite build\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>契約\u003c/td>\n\u003ctd>SKM/：\u003ccode>python3 scripts/validate_contracts.py\u003c/code> と \u003ca href=\"#docs/development/contract-workflow.md::%E9%81%87%E5%88%B0%E6%9C%AA%E6%8E%A5%E9%BD%90%E7%9A%84%E4%BA%A4%E4%BB%98%E9%93%BE\">OpenAPI 一致性\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compose / 工具\u003c/td>\n\u003ctd>SKM/：\u003ccode>python3 scripts/validate_compose.py\u003c/code>、対象 unittest。横断変更は \u003ccode>python3 -m unittest discover -s scripts/tests -v\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文書\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/documentation.md::\">文書 build/check と閲覧検証\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>全体回帰は広範囲変更やリリース候補で行う。実 Docker/Make/PowerShell がない場合は該当する起動・更新が未検証と明記する。配備工具の fake Docker 成功は実 image の証拠にならない。\u003c/p>\n\u003ch2 id=\"必要な場合の隔離-probe\">必要な場合の隔離 probe\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/scripts\">スクリプト\u003c/a>の \u003ccode>--help\u003c/code> と先頭説明で前提・引数を確認してから実行する。既存の接続先や \u003ccode>.env\u003c/code> を試験環境の代用にしない。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>入口と検証範囲\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>PostgreSQL read/write\u003c/td>\n\u003ctd>probe_postgres_read.py / probe_postgres_write.py：外置 PGlite のメモリ DB。SQL/一行更新/原回执/rollback を確認、asyncpg 実接続や分散競争は別\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Worker Queue\u003c/td>\n\u003ctd>probe_worker_queues.py：専用の空 Redis Unix socket。保守中の業務 dispatch/続行を確認、DB/model は合成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ログイン防護\u003c/td>\n\u003ctd>tests/auth/test_real_login_protection.py と test_real_login_http.py：専用 Redis process。SKILLMIND_TEST_REDIS_SERVER で実行 file を指定、Session 保存は fake\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SDK / CLI\u003c/td>\n\u003ctd>probe_claude_agent_sdk.py / probe_claude_metering.py と Adapter test：offline または loopback 合成 API。実モデルの課金や停止は証明しない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原 SDK 提案続行\u003c/td>\n\u003ctd>tests/agent/test_proposal_resume_native.py：SKILLMIND_NATIVE_CLI_TESTS=1 で固定 CLI と合成応答を検証\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Skill 解釈の合成検証は \u003ccode>SKM/\u003c/code> で次を使う：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">skillmind-skill-interpret-fixture \\\n  backend/tests/fixtures/skills/repository-review \\\n  contracts/examples/skill-interpreter-response.v1.json\n\u003c/code>\u003c/pre>\n\u003cp>実モデル品質は同じ Skill・設定・独立期待値で別に評価する。\u003ccode>scripts/measure_skill_interpretations.py\u003c/code> は実モデルと課金を伴うため、合意した環境と範囲で使う。構造検証成功を業務品質と扱わない。\u003c/p>\n\u003ch2 id=\"作業後\">作業後\u003c/h2>\n\u003cp>今回作った cache、build、一時 probe の process と file だけを片付ける。既存成果物と依存 directory は保持する。実際に検証した範囲、skip/未実施、部署への反映有無を報告する。\u003c/p>\n", "sections": [{"title": "ローカル開発と検証", "level": "h1", "anchor": "ローカル開発と検証", "text": "# ローカル開発と検証\n\n全体の入口は [SKM README](../../SKM/README.md)。実行 directory を各節に示す。検証は今回の変更に必要な範囲を選び、mock と実環境の証拠を区別する。"}, {"title": "前提と設定", "level": "h2", "anchor": "前提と設定", "text": "## 前提と設定\n\nPython 3.12、Node.js 26 / pnpm 11.7.0 を使用する。既存依存を優先して再利用し、新規導入例を以下に示す。lockfile は手編集せず、Python 検証は `PYTHONDONTWRITEBYTECODE=1` を付ける。\n`.env.example` は production 雛形。localhost では development、許可 Origin、専用接続先と書込可能な Run workspace を設定する。Backend の `.env` は実行 directory 基準。Compose は[設定入口](../operations/deployment.md#环境文件与配置边界)の ENV_FILE を使う。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\n`SKM/backend/` で実行する。migration は対象 DB を変更するため開発用接続を確認する。API と各 Worker は別 terminal で起動する。\n\n```bash\npython3 -m pip install --user -e \".[dev]\"\nalembic upgrade head\npython3 -m uvicorn skillmind.api.main:app --reload --port 8000\n```\n\n```bash\narq skillmind.worker.settings.WorkerSettings\n```\n\n```bash\narq skillmind.worker.settings.MaintenanceWorkerSettings\n```\n\nhealth は `http://localhost:8000/internal/health/live` と `/internal/health/ready`。後者は依存 service も確認する。Compose 起動は[Quickstart](../operations/quickstart.md)を使う。"}, {"title": "実 PostgreSQL の前提", "level": "h3", "anchor": "実-postgresql-の前提", "text": "### 実 PostgreSQL の前提\n\n全 pytest は[実 DB fixture](../../SKM/backend/tests/db/test_real_database_invariants.py)を含む。SKILLMIND_DATABASE_URL の **server 上で scratch DB を作り、migration 後に DROP DATABASE WITH (FORCE)** を行う。URL の DB 名変更だけでは隔離にならない。\n対象 server/account と作成・削除権限を確認する。実 DB を使わない場合は対象 test を指定するか、次で既知の実 DB module を除外する。\n\n```bash\nPYTHONDONTWRITEBYTECODE=1 python3 -m pytest --import-mode=importlib -p no:cacheprovider -o addopts= \\\n  --ignore=tests/db/test_real_database_invariants.py \\\n  --ignore=tests/db/test_real_auth_sessions.py \\\n  --ignore=tests/db/test_real_api_keys.py \\\n  --ignore=tests/db/test_real_budget_ledger.py\n```\n\n新たな fixture 利用先や Redis 等の process も確認する。接続不能による skip は未実施、認証/権限/migration エラーは失敗として報告する。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n`SKM/web/` で実行する：\n\n```bash\nCI=true npx -y pnpm@11.7.0 install --frozen-lockfile\nnpx -y pnpm@11.7.0 dev\n```\n\n既定 URL は `http://localhost:5173/skillmind/`、API proxy は `http://127.0.0.1:8000`。context path と browser Origin を合わせる。"}, {"title": "ブラウザ回帰", "level": "h3", "anchor": "ブラウザ回帰", "text": "### ブラウザ回帰\n\n専用 harness は実 Component + mock API を使う。実 credential/Backend/DB/model を使わず、runner を配備先 URL に向けない。`SKM/web/` で初回依存導入後、専用 terminal の Vite を起動する：\n\n```bash\npython3 -m pip install --user -r tests/browser/requirements.txt\npython3 -m playwright install chromium\nnode_modules/.bin/vite --host 127.0.0.1 --port 5189 --strictPort\n```\n\n別 terminal で対象 runner の `--help` を確認して実行する。例：\n\n```bash\npython3 tests/browser/check_projects.py \\\n  --url http://127.0.0.1:5189/skillmind/tests/browser/projects.html\n```\n\n| 対象 | 主な runner（check_*.py） |\n| --- | --- |\n| 全体の見た目・読みやすさ | visual_style、reading |\n| Project・アカウント | projects、project_members、project_management、login、accounts、api_keys |\n| 提出・待機・履歴 | run_submission、interaction_responses、proposal_decisions、run_history、evaluation_submissions |\n| レポート・証拠 | report_reading、workspace_reports、result_references、artifacts |\n| 文書・directory | document_organization、document_management、document_preview、document_upload、document_batches |\n| 接続・Skill・調度 | resource_editing、resource_request_lifecycle、mcp_tools、interpretation_requests、skill_library_delete、task_launch_identity、task_schedules、schedule_times |\n\n全 runner は [tests/browser](../../SKM/web/tests/browser/) にある。harness URL と `--output` 等の必須引数は各 runner を参照する。主に projects.html、提出系は run-submission.html を使う。\n外置依存は PYTHONPATH、browser は PLAYWRIGHT_BROWSERS_PATH を指定する。使用中 port を奪わず、終了時は自分の Vite だけを止める。mock は実 DB の競合/撤権、blob、外部 write や複数 Worker の証明ではない。"}, {"title": "変更に応じた検証", "level": "h2", "anchor": "変更に応じた検証", "text": "## 変更に応じた検証\n\n| 対象 | 実行位置と選択基準 |\n| --- | --- |\n| Backend | SKM/backend/：対象 Ruff/pytest。型変更は `python3 -m mypy src`、広範囲変更は関連 module に拡大 |\n| Web | SKM/web/：`node_modules/.bin/tsc -b --pretty false` と対象 Vitest。共有 UI 変更は双テーマ・三語・PC/狭幅の browser 回帰。bundle/依存変更は `node_modules/.bin/vite build` |\n| 契約 | SKM/：`python3 scripts/validate_contracts.py` と [OpenAPI 一致性](contract-workflow.md#遇到未接齐的交付链) |\n| Compose / 工具 | SKM/：`python3 scripts/validate_compose.py`、対象 unittest。横断変更は `python3 -m unittest discover -s scripts/tests -v` |\n| 文書 | [文書 build/check と閲覧検証](documentation.md) |\n\n全体回帰は広範囲変更やリリース候補で行う。実 Docker/Make/PowerShell がない場合は該当する起動・更新が未検証と明記する。配備工具の fake Docker 成功は実 image の証拠にならない。"}, {"title": "必要な場合の隔離 probe", "level": "h2", "anchor": "必要な場合の隔離-probe", "text": "## 必要な場合の隔離 probe\n\n[スクリプト](../../SKM/scripts/)の `--help` と先頭説明で前提・引数を確認してから実行する。既存の接続先や `.env` を試験環境の代用にしない。\n\n| 対象 | 入口と検証範囲 |\n| --- | --- |\n| PostgreSQL read/write | probe_postgres_read.py / probe_postgres_write.py：外置 PGlite のメモリ DB。SQL/一行更新/原回执/rollback を確認、asyncpg 実接続や分散競争は別 |\n| Worker Queue | probe_worker_queues.py：専用の空 Redis Unix socket。保守中の業務 dispatch/続行を確認、DB/model は合成 |\n| ログイン防護 | tests/auth/test_real_login_protection.py と test_real_login_http.py：専用 Redis process。SKILLMIND_TEST_REDIS_SERVER で実行 file を指定、Session 保存は fake |\n| SDK / CLI | probe_claude_agent_sdk.py / probe_claude_metering.py と Adapter test：offline または loopback 合成 API。実モデルの課金や停止は証明しない |\n| 原 SDK 提案続行 | tests/agent/test_proposal_resume_native.py：SKILLMIND_NATIVE_CLI_TESTS=1 で固定 CLI と合成応答を検証 |\n\nSkill 解釈の合成検証は `SKM/` で次を使う：\n\n```bash\nskillmind-skill-interpret-fixture \\\n  backend/tests/fixtures/skills/repository-review \\\n  contracts/examples/skill-interpreter-response.v1.json\n```\n\n実モデル品質は同じ Skill・設定・独立期待値で別に評価する。`scripts/measure_skill_interpretations.py` は実モデルと課金を伴うため、合意した環境と範囲で使う。構造検証成功を業務品質と扱わない。"}, {"title": "作業後", "level": "h2", "anchor": "作業後", "text": "## 作業後\n\n今回作った cache、build、一時 probe の process と file だけを片付ける。既存成果物と依存 directory は保持する。実際に検証した範囲、skip/未実施、部署への反映有無を報告する。"}], "toc": [{"title": "前提と設定", "anchor": "前提と設定", "level": "h2"}, {"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "実 PostgreSQL の前提", "anchor": "実-postgresql-の前提", "level": "h3"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "ブラウザ回帰", "anchor": "ブラウザ回帰", "level": "h3"}, {"title": "変更に応じた検証", "anchor": "変更に応じた検証", "level": "h2"}, {"title": "必要な場合の隔離 probe", "anchor": "必要な場合の隔離-probe", "level": "h2"}, {"title": "作業後", "anchor": "作業後", "level": "h2"}], "source": "development/local-development.md", "checksum": "dbffcc2699f60f89ee6f29d2053fb7a98e9498bca8e37b2fae67d40d4fa8ffe6"}, {"id": "docs/development/change-guide.md", "title": "代码变更指南", "group": "development", "html": "\u003ch1 id=\"代码变更指南\">代码变更指南\u003c/h1>\n\u003cp>先读 \u003ca href=\"#SKM/AGENTS.md::\">AGENTS\u003c/a>与\u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">当前状态\u003c/a>，明确用户场景、具体问题和完成标准，再查下表。规则边界集中在\u003ca href=\"#docs/development/runtime-guide.md::\">运行维护指南\u003c/a>，详细形状以源码与 Contracts 为准。\u003c/p>\n\u003ch2 id=\"按问题定位代码\">按问题定位代码\u003c/h2>\n\u003cp>Backend 路径相对 \u003ccode>SKM/backend/src/skillmind/\u003c/code>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>主要入口\u003c/th>\n\u003cth>核对重点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>登录、账户、项目权限\u003c/td>\n\u003ctd>auth/、projects/、api/auth_dependencies.py\u003c/td>\n\u003ctd>原身份、撤权、CSRF/API Key、资源隔离\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill 导入与发布\u003c/td>\n\u003ctd>skills/service.py、skills/source_loader.py、skills/source_storage.py；agent/interpreter*\u003c/td>\n\u003ctd>预览/保存/重建共用源包解析与字节存储；授权和事务留在 Service，原文 hash 与发布校验不变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务、调度、输入\u003c/td>\n\u003ctd>runs/、schedules/、agent/context_builder.py\u003c/td>\n\u003ctd>精确任务、原请求幂等、冻结选择与物化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行、等待、恢复\u003c/td>\n\u003ctd>agent/、worker/、runs/\u003c/td>\n\u003ctd>Segment/Attempt、lease、事件、取消、未知结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据库、Git、MCP 写入\u003c/td>\n\u003ctd>effects/、agent/\u003cem>_provider.py、agent/\u003c/em>_source.py\u003c/td>\n\u003ctd>绑定、批准、冲突、原操作回执与回读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档、目录、回收站\u003c/td>\n\u003ctd>documents/、storage/、runs/\u003c/td>\n\u003ctd>原始输入、共享引用、恢复与完全删除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结果与评价\u003c/td>\n\u003ctd>agent/result_validation.py、evaluations/\u003c/td>\n\u003ctd>原结果不变、引用、追加评价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面与交互\u003c/td>\n\u003ctd>web/src/pages、components、hooks、api、lib\u003c/td>\n\u003ctd>页面组合、请求生命周期、纯数据转换分开；\u003ca href=\"#docs/design/workspace.md::\">UI 指南\u003c/a>、原请求及响应验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配置、迁移与恢复\u003c/td>\n\u003ctd>core/settings.py、backend/migrations、compose.yml\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/deployment.md::\">部署\u003c/a>与\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"保持改动与问题相称\">保持改动与问题相称\u003c/h2>\n\u003cp>局部样式、文案或错误诊断直接使用现有组件和服务，不额外设计流程。涉及权限、持久化或公开协议时，再核对冻结点、消费者、失败/恢复与版本兼容，按\u003ca href=\"#docs/development/contract-workflow.md::\">契约流程\u003c/a>同步。\u003c/p>\n\u003cp>不因指南提到后置能力而顺带补齐框架；不把性能优化变成跳过业务写入、审批、回读或结果校验。运行效果不足时先读\u003ca href=\"#docs/operations/run-performance.md::\">耗时观测\u003c/a>，用实际证据选择下一处优化。\u003c/p>\n\u003ch2 id=\"验证与交付\">验证与交付\u003c/h2>\n\u003cp>按\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">同步点\u003c/a>和\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">变更验证表\u003c/a>选择回归。区分局部通过、真实事务/浏览器/模型验证与部署状态；明确失败、skip 和未执行项。\n长期规则更新对应指南，功能状态更新 Roadmap，临时排查结果不增加正式文档。文档生成见\u003ca href=\"#docs/development/documentation.md::\">维护方式\u003c/a>。\u003c/p>\n", "sections": [{"title": "代码变更指南", "level": "h1", "anchor": "代码变更指南", "text": "# 代码变更指南\n\n先读 [AGENTS](../../SKM/AGENTS.md)与[当前状态](../planning/roadmap.md#当前执行状态)，明确用户场景、具体问题和完成标准，再查下表。规则边界集中在[运行维护指南](runtime-guide.md)，详细形状以源码与 Contracts 为准。"}, {"title": "按问题定位代码", "level": "h2", "anchor": "按问题定位代码", "text": "## 按问题定位代码\n\nBackend 路径相对 `SKM/backend/src/skillmind/`。\n\n| 场景 | 主要入口 | 核对重点 |\n| --- | --- | --- |\n| 登录、账户、项目权限 | auth/、projects/、api/auth_dependencies.py | 原身份、撤权、CSRF/API Key、资源隔离 |\n| Skill 导入与发布 | skills/service.py、skills/source_loader.py、skills/source_storage.py；agent/interpreter* | 预览/保存/重建共用源包解析与字节存储；授权和事务留在 Service，原文 hash 与发布校验不变 |\n| 任务、调度、输入 | runs/、schedules/、agent/context_builder.py | 精确任务、原请求幂等、冻结选择与物化 |\n| 执行、等待、恢复 | agent/、worker/、runs/ | Segment/Attempt、lease、事件、取消、未知结果 |\n| 数据库、Git、MCP 写入 | effects/、agent/*_provider.py、agent/*_source.py | 绑定、批准、冲突、原操作回执与回读 |\n| 文档、目录、回收站 | documents/、storage/、runs/ | 原始输入、共享引用、恢复与完全删除 |\n| 结果与评价 | agent/result_validation.py、evaluations/ | 原结果不变、引用、追加评价 |\n| 页面与交互 | web/src/pages、components、hooks、api、lib | 页面组合、请求生命周期、纯数据转换分开；[UI 指南](../design/workspace.md)、原请求及响应验证 |\n| 配置、迁移与恢复 | core/settings.py、backend/migrations、compose.yml | [部署](../operations/deployment.md)与[恢复](../operations/backup-recovery.md) |"}, {"title": "保持改动与问题相称", "level": "h2", "anchor": "保持改动与问题相称", "text": "## 保持改动与问题相称\n\n局部样式、文案或错误诊断直接使用现有组件和服务，不额外设计流程。涉及权限、持久化或公开协议时，再核对冻结点、消费者、失败/恢复与版本兼容，按[契约流程](contract-workflow.md)同步。\n\n不因指南提到后置能力而顺带补齐框架；不把性能优化变成跳过业务写入、审批、回读或结果校验。运行效果不足时先读[耗时观测](../operations/run-performance.md)，用实际证据选择下一处优化。"}, {"title": "验证与交付", "level": "h2", "anchor": "验证与交付", "text": "## 验证与交付\n\n按[同步点](coding-rules.md#同步点)和[变更验证表](local-development.md#変更に応じた検証)选择回归。区分局部通过、真实事务/浏览器/模型验证与部署状态；明确失败、skip 和未执行项。\n长期规则更新对应指南，功能状态更新 Roadmap，临时排查结果不增加正式文档。文档生成见[维护方式](documentation.md)。"}], "toc": [{"title": "按问题定位代码", "anchor": "按问题定位代码", "level": "h2"}, {"title": "保持改动与问题相称", "anchor": "保持改动与问题相称", "level": "h2"}, {"title": "验证与交付", "anchor": "验证与交付", "level": "h2"}], "source": "development/change-guide.md", "checksum": "ab8489d8db10bdca5faf30d7e1aae578a71ddcf4dfa8447d02f40b400b4fc5da"}, {"id": "docs/development/runtime-guide.md", "title": "运行与数据维护指南", "group": "development", "html": "\u003ch1 id=\"运行与数据维护指南\">运行与数据维护指南\u003c/h1>\n\u003cp>本页保留维护现有链路时必须守住的边界；详细字段、状态和实现以代码与 \u003ca href=\"../SKM/contracts\">contracts\u003c/a> 为准，能力进度见 \u003ca href=\"#docs/planning/roadmap.md::\">Roadmap\u003c/a>。\u003c/p>\n\u003ch2 id=\"身份与授权\">身份与授权\u003c/h2>\n\u003cul>\n\u003cli>入口复用 \u003ca href=\"../SKM/backend/src/skillmind/api/auth_dependencies.py\">actor dependency\u003c/a>：Cookie 写请求同时检查 Origin/CSRF；显式 API Key header 验证原 Key，重复、混用或无效时拒绝，不回退 Cookie。越权与不存在统一为 404，归档项目只开放获授权读取。\u003c/li>\n\u003cli>API Key 当前授予创建者所在组织的 ADMIN 资源权限，没有逐 Key scope；创建者须保持有效 ADMIN。不能借 Key 绕过项目状态、冻结权限、部署开关或批准。\u003c/li>\n\u003cli>入口认证与业务提交分属不同事务。涉及持久写入时复用 \u003ca href=\"../SKM/backend/src/skillmind/users/access.py\">UserAccess\u003c/a>，在业务锁等待后及最终提交检查原资格、当前成员与项目状态；后台执行按持久发起人、批准与原 claim 复核，不能伪造浏览器会话。\u003c/li>\n\u003cli>Run 冻结的是权限上限，后来的授权不能补进旧 Run；当前撤权仍须生效。凭据停用、业务取消、本地连接关闭分别处理，不据此宣称远端进程已停止。\u003c/li>\n\u003cli>Secret 只经 \u003ca href=\"../SKM/backend/src/skillmind/integrations/secrets.py\">resolver\u003c/a>交给受控 Provider，不进入 Brief、日志、Evidence 或业务工作区。ENVIRONMENT/FILE 保存引用，MANAGED 使用与项目及引用绑定的\u003ca href=\"../SKM/backend/src/skillmind/core/secret_crypto.py\">加密实现\u003c/a>；缺 key、篡改或解析失败必须拒绝。轮换与恢复按\u003ca href=\"#docs/operations/runbook.md::\">运行手册\u003c/a>和\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E6%81%A2%E5%A4%8D%E7%82%B9%E5%8C%85%E5%90%AB%E4%BB%80%E4%B9%88\">一致恢复点\u003c/a>执行，数据库与原 keyring 缺一不可。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"skill-与冻结原文\">Skill 与冻结原文\u003c/h2>\n\u003cul>\n\u003cli>Skill 是 Organization 资产，发布后由 Project 显式启用精确版本。沿 \u003ca href=\"../SKM/backend/src/skillmind/skills/service.py\">SkillService\u003c/a>处理导入、发布、启停与引用检查，不覆盖已发布内容或绕开现存引用删除版本。\u003c/li>\n\u003cli>新导入只提取输入、资源及操作的最小声明，并形成一个执行任务；完整冻结原文进入 Brief，业务顺序与条件由 Agent 按原文执行。入口为 \u003ca href=\"../SKM/backend/src/skillmind/skills/direct_candidate.py\">direct_candidate\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/skills/execution.py\">execution\u003c/a>及 \u003ca href=\"../SKM/backend/src/skillmind/agent/task_brief.py\">task_brief\u003c/a>。旧 Blueprint 保留原值，不从 Manifest 逆算，不在续行时升级历史策略。\u003c/li>\n\u003cli>来源、脚本和模型建议不是权限。Tool 由 \u003ca href=\"../SKM/backend/src/skillmind/agent/tool_catalog.py\">catalog\u003c/a>统一装配契约和 Provider，经 \u003ca href=\"../SKM/backend/src/skillmind/agent/context_builder.py\">ContextBuilder\u003c/a>及 \u003ca href=\"../SKM/backend/src/skillmind/agent/tool_policy.py\">ToolExecutionPolicy\u003c/a>核验冻结绑定、当前开关和调用权限；不按相近名字放行未知能力。SDK builtin 保持拒绝，Shell/网络/文件不能绕过 Gateway，改变 cwd 不构成隔离。执行脚本须核对发布 checksum，业务专用 Schema、seed 和 renderer 不进入通用层。\u003c/li>\n\u003cli>异步解释保留原请求、来源 hash、模型配置和调用事实；超时、取消或响应未知不能靠换 ID 重新生成。修改解释流程先核对 \u003ca href=\"../SKM/backend/src/skillmind/skills/request_service.py\">request_service\u003c/a>与消费者，模型质量另用固定输入和独立预期验收。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"输入与文档\">输入与文档\u003c/h2>\n\u003cul>\n\u003cli>冻结精确版本、资源选择、文档 ID/hash 与绑定。新增文件、同名重传或配置变化不改变原 Run；缺失或损坏不能用当前文件补齐。物化与复用沿 \u003ca href=\"../SKM/backend/src/skillmind/agent/workspace_materializer.py\">workspace_materializer\u003c/a>和 \u003ca href=\"../SKM/backend/src/skillmind/runs/input_snapshot.py\">input_snapshot\u003c/a>，校验原回执及完整输入树；\u003ccode>input/\u003c/code> 只读，写入限 \u003ccode>workspace/\u003c/code>、\u003ccode>output/\u003c/code>。\u003c/li>\n\u003cli>选择文档、读取正文、转换与保存成果是独立能力。按需准备仅冻结清单，后续工具核验原内容；文档观察不等于取得正文，MCP 服务的只读标注不等于授权。能力与 Provider 是否可用，以 \u003ca href=\"../SKM/backend/src/skillmind/worker/settings.py\">Worker 装配\u003c/a>及冻结 binding 为准。\u003c/li>\n\u003cli>上传按原 actor/Project、幂等键和内容确认；数据库提交与对象 PUT 不原子。沿 \u003ca href=\"../SKM/backend/src/skillmind/documents/service.py\">DocumentService\u003c/a>保留预约、发布/关闭回执及原存储归属；关闭发布不证明 PUT 停止，未知不自动重传、删对象或退配额。\u003c/li>\n\u003cli>改名/移动只改变展示路径，保留 ID、原字节、存储引用和原上传回执；清理时校验不变身份，不能要求当前路径仍等于上传路径。回收站仍占用存储；完全删除先检查回收状态、生成执行已结束、无未决操作及其他引用。\u003ca href=\"../SKM/backend/src/skillmind/documents/reference_repository.py\">引用查询\u003c/a>覆盖 Run、Schedule、occurrence，未知历史拒绝删除。\u003c/li>\n\u003cli>删除须在同一事务保存原对象清理要求，再在确认提交后尝试删 blob。204、目录消失或一次读不到对象都不证明全部版本、在途 PUT 和配额已结清；持久清理重试与结算仍待补齐。执行履历 purge 沿 \u003ca href=\"../SKM/backend/src/skillmind/runs/history_purge.py\">history_purge\u003c/a>，保留共享成果与最小删除审计，不删除外部业务数据或重做操作。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"执行与恢复\">执行与恢复\u003c/h2>\n\u003cul>\n\u003cli>按\u003ca href=\"#docs/overview/architecture.md::\">架构与术语\u003c/a>区分 Run、Segment 和 Attempt；生产入口为 \u003ca href=\"../SKM/backend/src/skillmind/worker/settings.py\">worker/settings\u003c/a>与 \u003ca href=\"../SKM/backend/src/skillmind/worker/executor.py\">executor\u003c/a>。同阶段技术恢复使用新 Attempt，不替换 Run，不改原快照、权限上限或 Result。\u003c/li>\n\u003cli>提交前冻结原身份、幂等键、输入、资源选择与批准同意；同键只确认同一内容。复用 \u003ca href=\"../SKM/backend/src/skillmind/runs/creation_request.py\">creation_request\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/runs/creation_replay.py\">creation_replay\u003c/a>与 Web \u003ca href=\"../SKM/web/src/lib/runSubmission.ts\">runSubmission\u003c/a>，重放不读取当前资源重建快照。\u003c/li>\n\u003cli>断网、超时、abort、提交异常或损坏的成功响应均可能已经落库。保留原请求，先查询原回执；404 仅表示本次未见。协议允许显式重发时仍用原键、原内容和相同业务身份，不自动换键；新会话可按接口规则查询原事实，不能接管旧在途写入。晚到响应必须隔离于新 actor/Project/Run。\u003c/li>\n\u003cli>取消先持久保存意图；\u003ca href=\"../SKM/backend/src/skillmind/runs/repository.py\">RunRepository\u003c/a>在原 Run/Segment/Attempt 锁内核验 lease、取消和终态。旧 Worker 失去 lease 后不得补写成功或失败；Tool 登记、调用与保存沿 \u003ca href=\"../SKM/backend/src/skillmind/agent/evidence.py\">evidence\u003c/a>复核原执行权，未决调用不重新发放执行许可，成功重放只返回可核实的原回执。\u003c/li>\n\u003cli>接受取消、业务终态、SDK 清理返回和远端停止分别核对；保留协作取消与清理，本地退出不能证明远端停止或作为退额依据。\u003c/li>\n\u003cli>模型/会话恢复沿原记录与 \u003ca href=\"../SKM/backend/src/skillmind/agent/session_store.py\">session_store\u003c/a>，缺失依据时停止；不补造 transcript、自动改模型或从头重跑。定期执行同样保留原 occurrence 与创建身份，入口见 \u003ca href=\"../SKM/backend/src/skillmind/schedules/service.py\">schedules/service\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"外部效果\">外部效果\u003c/h2>\n\u003cul>\n\u003cli>外部写入沿 observe → propose → approve → apply；Agent 提案不等于远端执行。批准绑定精确 Proposal version/checksum、Provider、操作与 scope；\u003ca href=\"../SKM/backend/src/skillmind/effects/service.py\">EffectService\u003c/a>与独立 Worker 核对当前资格、冻结 binding、lease、取消和期限，不在业务锁内等待远端 I/O。\u003c/li>\n\u003cli>自动批准只能来自原 Run 启动时明确记录的同意，或适用能力的既有预授权规则；Git/MCP 的额外同意不从旧 Run 补推。\u003ccode>repository.write/v1\u003c/code> 禁止 Project 预授权与 force，Git 仍核对精确 ref 和原提交，不把启动同意当作任意仓库写权限。\u003c/li>\n\u003cli>实际能力由 \u003ca href=\"../SKM/backend/src/skillmind/effects/release.py\">ExecutionFeatures\u003c/a>与 \u003ca href=\"../SKM/backend/src/skillmind/effects/wiring.py\">Provider registry\u003c/a>共同限定：PostgreSQL INSERT/UPDATE、文档 CREATE、Git commit、MCP 调用各有独立开关；开启一项不开放其余。旧队列也须检查当前开关，历史读取与获授权的原结果核对保持独立。\u003c/li>\n\u003cli>写入前观察、并发冲突检查、原操作幂等和 read-back 均须保留。原回执证明原操作；当前同名、同值或当前画面不能代替原回执。数据库、对象存储、仓库、MCP 与平台数据库之间没有统一原子事务。\u003c/li>\n\u003cli>写入结果未知时停止主处理，保留原 Effect 与已发生事实；失败状态不证明未写入，不据此重做写入或补偿删除。原结果只读核对走 \u003ca href=\"../SKM/backend/src/skillmind/effects/reconciliation_service.py\">reconciliation_service\u003c/a>。取消、lease 到期或核对未检出都不证明未执行；MCP 的回读重试不能重发修改操作，入口见 \u003ca href=\"../SKM/backend/src/skillmind/effects/mcp_provider.py\">mcp_provider\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"结果与评价\">结果与评价\u003c/h2>\n\u003cul>\n\u003cli>技术终态、结果完整程度与业务 PASS/FAIL 分开表达。结果通过 \u003ca href=\"../SKM/backend/src/skillmind/agent/result_validation.py\">ResultValidator\u003c/a>校验冻结 Schema、引用归属、附件字节及保存的 Effect 事实；模型自称成功不构成 APPLIED，结构有效不证明业务正确。\u003c/li>\n\u003cli>Result/Evidence/Artifact 保留原值。人工修正追加 \u003ca href=\"../SKM/backend/src/skillmind/evaluations/service.py\">Evaluation\u003c/a>，不覆盖结果或自动采用建议；重复提交和未知响应沿原评价身份确认。\u003c/li>\n\u003cli>附件只能发布经工具审计确认的原字节，下载核验归属和 hash。\u003ccode>audit.export/v1\u003c/code> 导出已存事实，不重新执行操作，不把通用审计 JSON 当作 Skill 规定的业务成果；入口见 \u003ca href=\"../SKM/backend/src/skillmind/agent/audit_export.py\">audit_export\u003c/a>。\u003c/li>\n\u003cli>报告与预览按 \u003ca href=\"#docs/design/workspace.md::%E6%8A%A5%E5%91%8A%E4%B8%8E%E9%A2%84%E8%A7%88\">UI 指南\u003c/a>展示；模板不替代 Skill 规定的业务成果，展示故障不重跑模型或改变业务状态。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"后置能力\">后置能力\u003c/h2>\n\u003cp>按生产接线和实际证据判断能力，不因存在数据表、开关或测试就扩大默认承诺。仅在真实需求涉及下列能力时核对，不把它们作为日常任务的新前置条件。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>范围\u003c/th>\n\u003cth>当前维护边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Run 统一预算\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/worker/primary_budget.py\">primary_budget\u003c/a>尚未接入生产 coordinator；Codex 启动前拒绝美元限额，局部 turns/output/timeout 不等于完整计费上限。接入时须主子共享、收费前预留、可信计量，未知费用不退额。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子 Agent\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/agent/subagent_provider.py\">Provider\u003c/a>仅局部实现，共享消费、停止与审计恢复未闭合；权限经 \u003ca href=\"../SKM/backend/src/skillmind/agent/subagent.py\">resolve_subagent_capabilities\u003c/a>收窄，禁止写入、交互和递归 dispatch。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成 UI\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/contracts/runtime-manifest/v1alpha1.schema.json\">Manifest\u003c/a>仍不允许 frontend_module，builder/Host 未接。未来开放须验证隔离：bundle 使用 CSP sandbox allow-scripts，iframe 禁止 allow-same-origin；静态报告不算生成应用。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部写操作序列\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/tests/worker/test_receipt_sequence_experiment.py\">局部实验\u003c/a>仍未接入生产。已接入的同 job SDK 复用和本地/只读短序列见下节；它们不等于取消逐次 Effect/Segment，也不执行批量外部写入。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>其他扩展\u003c/td>\n\u003ctd>Task Flow 只读预览；完整编排、SVN/Redmine 写入交付、PR 自动创建及更广的 Shell/network 能力按实际需求明确权限、恢复与验收范围。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"有限工具序列与暖续行\">有限工具序列与暖续行\u003c/h2>\n\u003cp>本地/只读短序列由 \u003ccode>agent/tool_sequence.py\u003c/code> 经原 \u003ccode>ToolGateway\u003c/code> 执行。注册项必须显式 \u003ccode>sequence_safe\u003c/code>，子工具仍须在原 Run 冻结集合中；改变注册不扩大历史权限。取消传播、未决不重放，外部写入与控制工具不能进入此序列。\u003c/p>\n\u003cp>Codex 的 \u003ccode>agent/warm_codex.py\u003c/code> 只在同一 Worker job 的原 Run 内复用 transport，绝不复用 Tool 权限或跨用户会话。\u003ccode>claim_for_execution(expected_previous=...)\u003c/code> 在原 Run 锁内校验相邻 Segment、原 Effect 和自动批准，仍经普通 claim 创建新 Attempt。回收及跨 Worker 处理保留原 Outbox。直接回执与多写操作序列仍未交付，不以暖续行混称。\u003c/p>\n", "sections": [{"title": "运行与数据维护指南", "level": "h1", "anchor": "运行与数据维护指南", "text": "# 运行与数据维护指南\n\n本页保留维护现有链路时必须守住的边界；详细字段、状态和实现以代码与 [contracts](../../SKM/contracts/) 为准，能力进度见 [Roadmap](../planning/roadmap.md)。"}, {"title": "身份与授权", "level": "h2", "anchor": "身份与授权", "text": "## 身份与授权\n\n- 入口复用 [actor dependency](../../SKM/backend/src/skillmind/api/auth_dependencies.py)：Cookie 写请求同时检查 Origin/CSRF；显式 API Key header 验证原 Key，重复、混用或无效时拒绝，不回退 Cookie。越权与不存在统一为 404，归档项目只开放获授权读取。\n- API Key 当前授予创建者所在组织的 ADMIN 资源权限，没有逐 Key scope；创建者须保持有效 ADMIN。不能借 Key 绕过项目状态、冻结权限、部署开关或批准。\n- 入口认证与业务提交分属不同事务。涉及持久写入时复用 [UserAccess](../../SKM/backend/src/skillmind/users/access.py)，在业务锁等待后及最终提交检查原资格、当前成员与项目状态；后台执行按持久发起人、批准与原 claim 复核，不能伪造浏览器会话。\n- Run 冻结的是权限上限，后来的授权不能补进旧 Run；当前撤权仍须生效。凭据停用、业务取消、本地连接关闭分别处理，不据此宣称远端进程已停止。\n- Secret 只经 [resolver](../../SKM/backend/src/skillmind/integrations/secrets.py)交给受控 Provider，不进入 Brief、日志、Evidence 或业务工作区。ENVIRONMENT/FILE 保存引用，MANAGED 使用与项目及引用绑定的[加密实现](../../SKM/backend/src/skillmind/core/secret_crypto.py)；缺 key、篡改或解析失败必须拒绝。轮换与恢复按[运行手册](../operations/runbook.md)和[一致恢复点](../operations/backup-recovery.md#一致恢复点包含什么)执行，数据库与原 keyring 缺一不可。"}, {"title": "Skill 与冻结原文", "level": "h2", "anchor": "skill-与冻结原文", "text": "## Skill 与冻结原文\n\n- Skill 是 Organization 资产，发布后由 Project 显式启用精确版本。沿 [SkillService](../../SKM/backend/src/skillmind/skills/service.py)处理导入、发布、启停与引用检查，不覆盖已发布内容或绕开现存引用删除版本。\n- 新导入只提取输入、资源及操作的最小声明，并形成一个执行任务；完整冻结原文进入 Brief，业务顺序与条件由 Agent 按原文执行。入口为 [direct_candidate](../../SKM/backend/src/skillmind/skills/direct_candidate.py)、[execution](../../SKM/backend/src/skillmind/skills/execution.py)及 [task_brief](../../SKM/backend/src/skillmind/agent/task_brief.py)。旧 Blueprint 保留原值，不从 Manifest 逆算，不在续行时升级历史策略。\n- 来源、脚本和模型建议不是权限。Tool 由 [catalog](../../SKM/backend/src/skillmind/agent/tool_catalog.py)统一装配契约和 Provider，经 [ContextBuilder](../../SKM/backend/src/skillmind/agent/context_builder.py)及 [ToolExecutionPolicy](../../SKM/backend/src/skillmind/agent/tool_policy.py)核验冻结绑定、当前开关和调用权限；不按相近名字放行未知能力。SDK builtin 保持拒绝，Shell/网络/文件不能绕过 Gateway，改变 cwd 不构成隔离。执行脚本须核对发布 checksum，业务专用 Schema、seed 和 renderer 不进入通用层。\n- 异步解释保留原请求、来源 hash、模型配置和调用事实；超时、取消或响应未知不能靠换 ID 重新生成。修改解释流程先核对 [request_service](../../SKM/backend/src/skillmind/skills/request_service.py)与消费者，模型质量另用固定输入和独立预期验收。"}, {"title": "输入与文档", "level": "h2", "anchor": "输入与文档", "text": "## 输入与文档\n\n- 冻结精确版本、资源选择、文档 ID/hash 与绑定。新增文件、同名重传或配置变化不改变原 Run；缺失或损坏不能用当前文件补齐。物化与复用沿 [workspace_materializer](../../SKM/backend/src/skillmind/agent/workspace_materializer.py)和 [input_snapshot](../../SKM/backend/src/skillmind/runs/input_snapshot.py)，校验原回执及完整输入树；`input/` 只读，写入限 `workspace/`、`output/`。\n- 选择文档、读取正文、转换与保存成果是独立能力。按需准备仅冻结清单，后续工具核验原内容；文档观察不等于取得正文，MCP 服务的只读标注不等于授权。能力与 Provider 是否可用，以 [Worker 装配](../../SKM/backend/src/skillmind/worker/settings.py)及冻结 binding 为准。\n- 上传按原 actor/Project、幂等键和内容确认；数据库提交与对象 PUT 不原子。沿 [DocumentService](../../SKM/backend/src/skillmind/documents/service.py)保留预约、发布/关闭回执及原存储归属；关闭发布不证明 PUT 停止，未知不自动重传、删对象或退配额。\n- 改名/移动只改变展示路径，保留 ID、原字节、存储引用和原上传回执；清理时校验不变身份，不能要求当前路径仍等于上传路径。回收站仍占用存储；完全删除先检查回收状态、生成执行已结束、无未决操作及其他引用。[引用查询](../../SKM/backend/src/skillmind/documents/reference_repository.py)覆盖 Run、Schedule、occurrence，未知历史拒绝删除。\n- 删除须在同一事务保存原对象清理要求，再在确认提交后尝试删 blob。204、目录消失或一次读不到对象都不证明全部版本、在途 PUT 和配额已结清；持久清理重试与结算仍待补齐。执行履历 purge 沿 [history_purge](../../SKM/backend/src/skillmind/runs/history_purge.py)，保留共享成果与最小删除审计，不删除外部业务数据或重做操作。"}, {"title": "执行与恢复", "level": "h2", "anchor": "执行与恢复", "text": "## 执行与恢复\n\n- 按[架构与术语](../overview/architecture.md)区分 Run、Segment 和 Attempt；生产入口为 [worker/settings](../../SKM/backend/src/skillmind/worker/settings.py)与 [executor](../../SKM/backend/src/skillmind/worker/executor.py)。同阶段技术恢复使用新 Attempt，不替换 Run，不改原快照、权限上限或 Result。\n- 提交前冻结原身份、幂等键、输入、资源选择与批准同意；同键只确认同一内容。复用 [creation_request](../../SKM/backend/src/skillmind/runs/creation_request.py)、[creation_replay](../../SKM/backend/src/skillmind/runs/creation_replay.py)与 Web [runSubmission](../../SKM/web/src/lib/runSubmission.ts)，重放不读取当前资源重建快照。\n- 断网、超时、abort、提交异常或损坏的成功响应均可能已经落库。保留原请求，先查询原回执；404 仅表示本次未见。协议允许显式重发时仍用原键、原内容和相同业务身份，不自动换键；新会话可按接口规则查询原事实，不能接管旧在途写入。晚到响应必须隔离于新 actor/Project/Run。\n- 取消先持久保存意图；[RunRepository](../../SKM/backend/src/skillmind/runs/repository.py)在原 Run/Segment/Attempt 锁内核验 lease、取消和终态。旧 Worker 失去 lease 后不得补写成功或失败；Tool 登记、调用与保存沿 [evidence](../../SKM/backend/src/skillmind/agent/evidence.py)复核原执行权，未决调用不重新发放执行许可，成功重放只返回可核实的原回执。\n- 接受取消、业务终态、SDK 清理返回和远端停止分别核对；保留协作取消与清理，本地退出不能证明远端停止或作为退额依据。\n- 模型/会话恢复沿原记录与 [session_store](../../SKM/backend/src/skillmind/agent/session_store.py)，缺失依据时停止；不补造 transcript、自动改模型或从头重跑。定期执行同样保留原 occurrence 与创建身份，入口见 [schedules/service](../../SKM/backend/src/skillmind/schedules/service.py)。"}, {"title": "外部效果", "level": "h2", "anchor": "外部效果", "text": "## 外部效果\n\n- 外部写入沿 observe → propose → approve → apply；Agent 提案不等于远端执行。批准绑定精确 Proposal version/checksum、Provider、操作与 scope；[EffectService](../../SKM/backend/src/skillmind/effects/service.py)与独立 Worker 核对当前资格、冻结 binding、lease、取消和期限，不在业务锁内等待远端 I/O。\n- 自动批准只能来自原 Run 启动时明确记录的同意，或适用能力的既有预授权规则；Git/MCP 的额外同意不从旧 Run 补推。`repository.write/v1` 禁止 Project 预授权与 force，Git 仍核对精确 ref 和原提交，不把启动同意当作任意仓库写权限。\n- 实际能力由 [ExecutionFeatures](../../SKM/backend/src/skillmind/effects/release.py)与 [Provider registry](../../SKM/backend/src/skillmind/effects/wiring.py)共同限定：PostgreSQL INSERT/UPDATE、文档 CREATE、Git commit、MCP 调用各有独立开关；开启一项不开放其余。旧队列也须检查当前开关，历史读取与获授权的原结果核对保持独立。\n- 写入前观察、并发冲突检查、原操作幂等和 read-back 均须保留。原回执证明原操作；当前同名、同值或当前画面不能代替原回执。数据库、对象存储、仓库、MCP 与平台数据库之间没有统一原子事务。\n- 写入结果未知时停止主处理，保留原 Effect 与已发生事实；失败状态不证明未写入，不据此重做写入或补偿删除。原结果只读核对走 [reconciliation_service](../../SKM/backend/src/skillmind/effects/reconciliation_service.py)。取消、lease 到期或核对未检出都不证明未执行；MCP 的回读重试不能重发修改操作，入口见 [mcp_provider](../../SKM/backend/src/skillmind/effects/mcp_provider.py)。"}, {"title": "结果与评价", "level": "h2", "anchor": "结果与评价", "text": "## 结果与评价\n\n- 技术终态、结果完整程度与业务 PASS/FAIL 分开表达。结果通过 [ResultValidator](../../SKM/backend/src/skillmind/agent/result_validation.py)校验冻结 Schema、引用归属、附件字节及保存的 Effect 事实；模型自称成功不构成 APPLIED，结构有效不证明业务正确。\n- Result/Evidence/Artifact 保留原值。人工修正追加 [Evaluation](../../SKM/backend/src/skillmind/evaluations/service.py)，不覆盖结果或自动采用建议；重复提交和未知响应沿原评价身份确认。\n- 附件只能发布经工具审计确认的原字节，下载核验归属和 hash。`audit.export/v1` 导出已存事实，不重新执行操作，不把通用审计 JSON 当作 Skill 规定的业务成果；入口见 [audit_export](../../SKM/backend/src/skillmind/agent/audit_export.py)。\n- 报告与预览按 [UI 指南](../design/workspace.md#报告与预览)展示；模板不替代 Skill 规定的业务成果，展示故障不重跑模型或改变业务状态。"}, {"title": "后置能力", "level": "h2", "anchor": "后置能力", "text": "## 后置能力\n\n按生产接线和实际证据判断能力，不因存在数据表、开关或测试就扩大默认承诺。仅在真实需求涉及下列能力时核对，不把它们作为日常任务的新前置条件。\n\n| 范围 | 当前维护边界 |\n| --- | --- |\n| Run 统一预算 | [primary_budget](../../SKM/backend/src/skillmind/worker/primary_budget.py)尚未接入生产 coordinator；Codex 启动前拒绝美元限额，局部 turns/output/timeout 不等于完整计费上限。接入时须主子共享、收费前预留、可信计量，未知费用不退额。 |\n| 子 Agent | [Provider](../../SKM/backend/src/skillmind/agent/subagent_provider.py)仅局部实现，共享消费、停止与审计恢复未闭合；权限经 [resolve_subagent_capabilities](../../SKM/backend/src/skillmind/agent/subagent.py)收窄，禁止写入、交互和递归 dispatch。 |\n| 生成 UI | [Manifest](../../SKM/contracts/runtime-manifest/v1alpha1.schema.json)仍不允许 frontend_module，builder/Host 未接。未来开放须验证隔离：bundle 使用 CSP sandbox allow-scripts，iframe 禁止 allow-same-origin；静态报告不算生成应用。 |\n| 外部写操作序列 | [局部实验](../../SKM/backend/tests/worker/test_receipt_sequence_experiment.py)仍未接入生产。已接入的同 job SDK 复用和本地/只读短序列见下节；它们不等于取消逐次 Effect/Segment，也不执行批量外部写入。 |\n| 其他扩展 | Task Flow 只读预览；完整编排、SVN/Redmine 写入交付、PR 自动创建及更广的 Shell/network 能力按实际需求明确权限、恢复与验收范围。 |"}, {"title": "有限工具序列与暖续行", "level": "h2", "anchor": "有限工具序列与暖续行", "text": "## 有限工具序列与暖续行\n\n本地/只读短序列由 `agent/tool_sequence.py` 经原 `ToolGateway` 执行。注册项必须显式 `sequence_safe`，子工具仍须在原 Run 冻结集合中；改变注册不扩大历史权限。取消传播、未决不重放，外部写入与控制工具不能进入此序列。\n\nCodex 的 `agent/warm_codex.py` 只在同一 Worker job 的原 Run 内复用 transport，绝不复用 Tool 权限或跨用户会话。`claim_for_execution(expected_previous=...)` 在原 Run 锁内校验相邻 Segment、原 Effect 和自动批准，仍经普通 claim 创建新 Attempt。回收及跨 Worker 处理保留原 Outbox。直接回执与多写操作序列仍未交付，不以暖续行混称。"}], "toc": [{"title": "身份与授权", "anchor": "身份与授权", "level": "h2"}, {"title": "Skill 与冻结原文", "anchor": "skill-与冻结原文", "level": "h2"}, {"title": "输入与文档", "anchor": "输入与文档", "level": "h2"}, {"title": "执行与恢复", "anchor": "执行与恢复", "level": "h2"}, {"title": "外部效果", "anchor": "外部效果", "level": "h2"}, {"title": "结果与评价", "anchor": "结果与评价", "level": "h2"}, {"title": "后置能力", "anchor": "后置能力", "level": "h2"}, {"title": "有限工具序列与暖续行", "anchor": "有限工具序列与暖续行", "level": "h2"}], "source": "development/runtime-guide.md", "checksum": "ae8cdaf3e8acefc3334db26369c67d4c23d5353fbfdf9f84c8d20c7210380c15"}, {"id": "docs/development/coding-rules.md", "title": "按改动类型查阅的实现细则", "group": "development", "html": "\u003ch1 id=\"按改动类型查阅的实现细则\">按改动类型查阅的实现细则\u003c/h1>\n\u003cp>按 \u003ca href=\"#SKM/AGENTS.md::\">AGENTS\u003c/a>只读本次涉及的章节；领域规则见\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>，运行命令见\u003ca href=\"#docs/development/local-development.md::\">本地开发\u003c/a>。\nBackend 路径相对 SKM/backend/src/skillmind/，Web 路径相对 SKM/web/。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>route 只做认证/入出参，业务在 domain/service，查询/锁/持久化在 repository。公开 route 在 api/routes/ 资源模块单层实现，不增加未认证并行入口、转发 wrapper 或 ARQ job 内业务分支。\u003c/p>\n\u003cp>同义处理必须复用唯一入口：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>处理\u003c/th>\n\u003cth>入口 / 限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>JSON / SHA-256\u003c/td>\n\u003ctd>core/hashing.py：canonical_json / sha256_hex；源包索引按 skills/importer.py 的格式计算，不混用 JSON 与原字节摘要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>敏感字段\u003c/td>\n\u003ctd>core/redaction.py：find_sensitive_key；Evidence/Tool response 共用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lease token\u003c/td>\n\u003ctd>runs/domain.py：lease_token_hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RunEvent / Outbox\u003c/td>\n\u003ctd>runs/repository_base.py 的 RunRepository：_snapshot_event、_event_outbox、_dispatch_outbox、_next_sequence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>认证 Problem\u003c/td>\n\u003ctd>api/auth_dependencies.py 共享 factory；Run 用 routes/runs.py 的 run_not_found_problem / authorized_run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>binding / Secret\u003c/td>\n\u003ctd>agent/run_binding.py：load_bound_run_resource / resolve_binding_secret；检查 checksum、Integration 状态、provider/revision/capability\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部 repository\u003c/td>\n\u003ctd>agent/repository_client.py / repository_source.py；物化/read/write 共用，不另写 subprocess/凭据解析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可 apply effect\u003c/td>\n\u003ctd>effects/catalog.py：EFFECT_CAPABILITIES，创建/执行/审批共用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Binary 转文字\u003c/td>\n\u003ctd>agent/binary_text.py：render_text / convert_excel_to_markdown，不在 Provider 复制\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>documents/\u003cstrong>init\u003c/strong>.py 只导出 domain 类型，service/repository/source 显式导入，避免 DB → Run → 文档循环。\u003c/p>\n\u003cp>Git 写入沿用上述共享实现；direct 仅默认 branch fast-forward，branch 仅新建 skillmind/ 命名空间 branch。授权、批准与未知结果统一见\u003ca href=\"#docs/development/runtime-guide.md::%E5%A4%96%E9%83%A8%E6%95%88%E6%9E%9C\">外部效果\u003c/a>。\u003c/p>\n\u003ch2 id=\"run-lifecycle\">Run lifecycle\u003c/h2>\n\u003cp>修改执行、认领、续行或取消时，查\u003ca href=\"#docs/development/runtime-guide.md::%E6%89%A7%E8%A1%8C%E4%B8%8E%E6%81%A2%E5%A4%8D\">执行与恢复边界\u003c/a>；仅改页面展示先查 \u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a>，不因此补齐全部执行链路。\u003c/p>\n\u003cul>\n\u003cli>转换只经 plan_run_transition / ALLOWED_RUN_TRANSITIONS；锁序 Run → Segment → Attempt。旧 migration 路径仍为 Run → Attempt，不反转 _lock_claimed_execution。\u003c/li>\n\u003cli>终态 RUN_SNAPSHOT 是最后一个 RunEvent。sequence 在 Run 内单调；TEXT_DELTA 消耗 sequence 但不持久化，允许缺号、不改子层编号。遵守 RunEvent Schema。\u003c/li>\n\u003cli>重新 dispatch 也受 SKILLMIND_RUN_MAX_ATTEMPTS 限制，耗尽以 retry_exhausted 关闭为 FAILED。\u003c/li>\n\u003cli>wall_timeout_seconds 只中断 event 等待，不中断终态 transaction；ARQ job_timeout 必须更长，不能替代执行 deadline。\u003c/li>\n\u003cli>子能力统一经 resolve_subagent_capabilities，分配与消费不混同；权限、返回和 Session 审计见\u003ca href=\"#docs/development/runtime-guide.md::%E5%
