\u003c/div>\n\u003cp>硬限额须有 adapter 强制上界。未启用不宣称受限，启用但不可计量则禁止新收费；null 不是零/免费。\u003c/p>\n\u003ch3 id=\"计量报告如何归一化\">计量报告如何归一化\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>报告\u003c/th>\n\u003cth>入账规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>增量\u003c/td>\n\u003ctd>绑定原执行的稳定键；同键同内容一次入账，异内容阻断核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>累计\u003c/td>\n\u003ctd>保存来源/水位，只计可信增量，旧报告不退款，最终值不整体再加\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>resume/fork/范围变化\u003c/td>\n\u003ctd>证明覆盖范围、历史/子调用与基线；不能共用一个 last_usage\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缺失/冲突/无效\u003c/td>\n\u003ctd>保留未知占用；负数、非有限数、错单位或无执行归属不变成零，更正另存审计\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>可信 adapter 固定 SDK/CLI/规则版本，一个来源入账、其余交叉核对。BudgetUsageReport 只收归一化值；final=True 证明启用维度收齐，不指最后事件。增量无漏报，累计 turns/cost 各有水位，缺测不推进。\u003c/p>\n\u003ch2 id=\"一个账户多个执行预留\">一个账户，多个执行预留\u003c/h2>\n\u003cp>可加维度满足 remaining = limit - consumed - reserved。预留前不启动，余额不足/账本不可用则拒绝；未知仍占 reserved，用量原子转 consumed。超支记真实差额并阻断新分配，不截断；活动时长另按区间计。\u003c/p>\n\u003ch3 id=\"一个例子已用占用与可用\">一个例子：已用、占用与可用\u003c/h3>\n\u003cp>假设目标账户已验证 20 turns 硬上界（非当前 dispatch 输出）：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时点\u003c/th>\n\u003cth style=\"text-align:right\">已用\u003c/th>\n\u003cth style=\"text-align:right\">占用\u003c/th>\n\u003cth style=\"text-align:right\">可用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>前一段结算\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003ctd style=\"text-align:right\">0\u003c/td>\n\u003ctd style=\"text-align:right\">16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主执行预留 6\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003ctd style=\"text-align:right\">6\u003c/td>\n\u003ctd style=\"text-align:right\">10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子 A/B 各预留 3\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003ctd style=\"text-align:right\">12\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A 用 2 且停止\u003c/td>\n\u003ctd style=\"text-align:right\">6\u003c/td>\n\u003ctd style=\"text-align:right\">9\u003c/td>\n\u003ctd style=\"text-align:right\">5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B 失联、主用 5 且停止\u003c/td>\n\u003ctd style=\"text-align:right\">11\u003c/td>\n\u003ctd style=\"text-align:right\">3\u003c/td>\n\u003ctd style=\"text-align:right\">6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>B 的 3 不因 lease 过期退还，新执行最多用 6；若不能证明 B 仍受 3 的上界约束，暂停整个账户分配。\u003c/p>\n\u003ch3 id=\"持久账本的当前载体\">持久账本的当前载体\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/runs/budget_store.py\">store\u003c/a>/\u003ca href=\"../SKM/backend/src/skillmind/runs/repository_budgets.py\">repository\u003c/a>使用 \u003ca href=\"../SKM/backend/migrations/versions/0030_run_budget_ledger.py\">0030\u003c/a> 账本、\u003ca href=\"../SKM/backend/migrations/versions/0035_budget_invocations.py\">0035\u003c/a> 调用/观察、\u003ca href=\"../SKM/backend/migrations/versions/0043_budget_start_owner.py\">0043\u003c/a> 启动所有权：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>run_budget_accounts\u003c/td>\n\u003ctd>Run 唯一，策略/限额 checksum、已用/占用、阻断与版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>run_budget_reservations\u003c/td>\n\u003ctd>Run/Segment/Attempt、操作组/执行键、parent、lease hash、授予量、原 invocation 绑定与启动/结算事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>run_budget_receipts\u003c/td>\n\u003ctd>原预留+回执键去重，追加用量、停止、未启动释放或核对失败；不依赖 RunEvent\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>run_budget_observations\u003c/td>\n\u003ctd>原预留+原 invocation 的 SDK Result 观察；未归一化，不改变消耗、停止或结算事实\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>内部 run-budget/v1 定义 turns/可选 nano-USD，非 HTTP。DTO 为整数，列 Numeric(38,0)，计算用整数、存储用 Decimal；拒绝 float/不足最小单位，不舍入，旧值需版本化转换。\u003c/p>\n\u003cp>new_budget_account 只构造未保存/未开始、限额匹配的账户，须与 Run 按 FK 顺序同事务保存；迁移不回填旧 Run，执行端不补零。\u003c/p>\n\u003ch3 id=\"原调用绑定与启动\">原调用绑定与启动\u003c/h3>\n\u003cp>invocation ID、完整 JSON/checksum 成组保存，一次 invocation 全局只绑定一份预留。内部 agent-invocation/v1 不改原 policy/request/group hash，不是 API。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>边界\u003c/th>\n\u003cth>必须核对的原事实\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>绑定\u003c/td>\n\u003ctd>有效 Run/Segment/Attempt lease、无取消、原 actor/Project/Run；首次仅 RESERVED，实际 max_turns 不超过授予量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>启动\u003c/td>\n\u003ctd>显式传原 invocation ID/checksum，并重验完整保存值、scope 和当前执行权；仅首次确认的 START_INTENT commit 允许调用 client\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>观察\u003c/td>\n\u003ctd>独立核对 lease 的 worker/token/到期世代、原预留与完整 invocation；重复同内容不重复写，异内容保留原值并先提交账户阻断及冲突审计\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>sdk-result-observation/v1 不是 USAGE 回执。冲突先保存阻断审计，不以换键/成功事件掩盖；未知保留占用。终态后可独立核对，不恢复旧 Attempt 或追加 RunEvent。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/runs/budget_execution.py\">Recorder\u003c/a>成对装配 before_connect/usage_observer；只有首次明确 True 才创建 client，拒绝/未知/取消不许可启动，client 由原执行清理。捕获取消不能获得下一副作用许可。\u003c/p>\n\u003cp>prepared_invocation 可固定原 Session/调用，Engine 仍从实际 prompt/options/模式逐字段重建核对；描述子或 RESERVED 都不是启动许可。\u003c/p>\n\u003ch3 id=\"启动所有权与协调方更替\">启动所有权与协调方更替\u003c/h3>\n\u003cp>描述子标识执行，owner 指定可尝试启动事务（TX B）的存活协调器。recorder 生成随机 token，首次 await 前取走并关闭复用，仅供本次绑定与启动；首次绑定同事务保存独立用途 hash。token 不从 lease/Session/invocation 派生，不进描述子、DTO、options、观察或 API。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>恢复场景\u003c/th>\n\u003cth>必须保持的判定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>原绑定事务响应丢失\u003c/td>\n\u003ctd>只用原描述与原 token 确认，未保存时不补写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原 recorder 的 B 成功\u003c/td>\n\u003ctd>仍须首次明确 commit 才允许 client；本地许可只使用一次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B 结果未知，行仍是 RESERVED\u003c/td>\n\u003ctd>原 recorder 不重试；新 recorder 的 token 不匹配，不能重新取得许可\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有 START_INTENT\u003c/td>\n\u003ctd>读回不许可再次启动；换协调方也不能继承原 token\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧绑定没有所有权\u003c/td>\n\u003ctd>保留原值并拒绝启动，不为旧调用补造 owner\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>owner 与原 lease/actor/绑定/父调用一起检查，阻止换 recorder 重获未知启动权；不证明开始、停止、结清，也不防受信代码复制内存 token 绕过 recorder。store/repository 仅供受信装配，不向未建身份的核对方开放。\u003c/p>\n\u003cp>丢 token 保留占用，由独立核对方按原事实关闭未启动或结算；核对 lease 不授启动权。0043 旧行留空，任何 owner 痕迹均在排他锁内阻止降级；隔离不识别它的旧调用方。恢复较早 DB 不证明后来未启动。\u003c/p>\n\u003ch3 id=\"内部状态不能当作运行证明\">内部状态不能当作运行证明\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>状态\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>RESERVED\u003c/td>\n\u003ctd>已占用、无启动意图；未启动释放同时关闭启动资格\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>START_INTENT\u003c/td>\n\u003ctd>可能已开始；重复读取不许可重启，未知占用继续保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SETTLED\u003c/td>\n\u003ctd>已提供停止依据和完整用量并释放未用量，不等于 Run 成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RELEASED\u003c/td>\n\u003ctd>未启动预留已关闭，不是启动后的退款\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>verified_evidence 仅验键形状，claim_reconciliation 仅管内部 lease；均不证明停止/核对方身份。须由受信服务锁外验来源/证据，不开放模型、用户或旧 Worker。\u003c/p>\n\u003ch3 id=\"原子性与重复请求\">原子性与重复请求\u003c/h3>\n\u003cp>同事务验状态/权限/余额/身份，按 Run → Segment → Attempt → 账户 → 预留取所需锁，不反向；锁后用新时间 fencing，锁外调用模型/核对。\u003c/p>\n\u003cp>同操作同键返原记录、异内容冲突，新执行以新身份取余额。Tool 重放不重调 Provider，新模型仍计量。整组 dispatch 原子预留，全部获准再逐支启动/独立结算。\u003c/p>\n\u003cp>主模型等 Tool 不释放预留；无中途缩额协议时，子支只用未承诺余额，不足拒绝。转移须先证明主执行停止并同步收窄局部上限。\u003c/p>\n\u003ch3 id=\"启动与结算的提交边界\">启动与结算的提交边界\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">TX A：执行权 + 原子预留，确认原键\n  → 绑定事务：固定原 invocation + 实际参数，确认原值\n  → TX B：重验执行权 + 原绑定 + START_INTENT\n  → 锁外：带执行身份/局部上限调用 adapter\n  → TX C：去重核对，结算或保留占用\n\u003c/code>\u003c/pre>\n\u003cp>DB/模型不原子。A 提交错误在 repository 返回后用新 session 按原组确认，绑定同样只确认、不补缺失值，均要求有效 lease。B 首次明确 commit 才返回 True；已有意图为 False，未知抛 BudgetStartUncertainError，均不重启。C 冲突先提交阻断审计，不抛异常回滚它；flush/fencing 不等于 commit 瞬间保证。\u003c/p>\n\u003cp>B 后崩溃/丢响应可能已收费，只有证明未开始且不能再开始才释放；取消窗口仍靠监督/硬上界。身份包括原 Tool/branch/重执行，接管不清旧未决预留。\u003c/p>\n\u003ch2 id=\"结束取消与故障恢复\">结束、取消与故障恢复\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>正常结束\u003c/td>\n\u003ctd>幂等结算可信用量，只释放已证明未用部分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取消/timeout/等待\u003c/td>\n\u003ctd>结算已知量；停止/未用尚不确定继续占用，interrupt 不代表停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>崩溃/丢报告/lease 失效\u003c/td>\n\u003ctd>保留待核对，不全额退款\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超预留/不可计量\u003c/td>\n\u003ctd>记录真实消耗并阻止新收费执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>终态后晚到\u003c/td>\n\u003ctd>独立追加核对，不重开 Run、不在末次 RUN_SNAPSHOT 后加事件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"执行权与结算权分开\">执行权与结算权分开\u003c/h3>\n\u003cp>旧 Worker 不得启动/续期/增额/释放。可信核对方按原身份、来源/水位、停止证据收晚到报告，不恢复执行权；Session CLOSED、branch outcome、Run 终态均不清零占用。部分证明只结部分，不设手工退款绕行。\u003c/p>\n\u003ch2 id=\"兼容公开信息与实施顺序\">兼容、公开信息与实施顺序\u003c/h2>\n\u003cp>旧 Run 无账本标累计未知，不从 Session 回填零；非终态须可靠重建才续行，否则停止收费、明确新建。max_output_bytes 仍指单响应；公开余额取服务端投影，Brief 余额带观察时点。\u003c/p>\n\u003ch3 id=\"上线门禁与接线顺序\">上线门禁与接线顺序\u003c/h3>\n\u003cp>顺序为计量/局部强制 → 真实 DB 并发/未知提交/受信核对 → 创建、主子、等待/取消/重试共用账户 → 公开投影/三语/新策略。缺入口不回退完整上限。\u003c/p>\n\u003cp>切换前隔离旧 Worker 并处理在途；旧未绑定 START_INTENT 不补绑重启。0035 任一绑定/观察、0030 非空账本均阻止破坏性降级，0043 另验 owner；仍须全实例停写，不以 migration guard 代替恢复证明。公开变化按\u003ca href=\"#docs/development/contract-workflow.md::\">契约流程\u003c/a>同步。\u003c/p>\n\u003ch2 id=\"验收矩阵\">验收矩阵\u003c/h2>\n\u003cp>覆盖连续主子分配、最后余额竞争、同键异内容、重复/乱序/缺测报告、resume 历史去重、A/B/C 提交丢响应、启动后崩溃/接管、晚到结算、混合 Worker/回退与旧 Run。分别证明真实事务、adapter 硬限额和 SDK 计量完整性；split_budget 或内部账本单测不代表 Run 级预算已生效。\u003c/p>\n", "sections": [{"title": "Run 预算与执行限额", "level": "h1", "anchor": "run-预算与执行限额", "text": "# Run 预算与执行限额\n\n主/子执行、Segment 续行、Attempt 重试须共用 Run 账户。本文区分局部限制与未接入执行的账本，不是预算 API；状态见[计划 R02](../planning/roadmap.md#r02-run-统一预算)。"}, {"title": "先区分上限、分配与消耗", "level": "h2", "anchor": "先区分上限分配与消耗", "text": "## 先区分上限、分配与消耗\n\n上限是冻结授权，预留是承诺额度，消耗是确认用量；分配、Session 数、摘要长度都不是消费。"}, {"title": "当前实现的实际口径", "level": "h3", "anchor": "当前实现的实际口径", "text": "### 当前实现的实际口径\n\n| 限制 | 当前边界 |\n| --- | --- |\n| max_turns | SDK 每次执行上限，不累计所有主子 Session/重试 |\n| max_budget_usd | 可选 SDK 局部限制；普通创建快照未设置，子 context 原值继承、不按支拆分 |\n| max_output_bytes | Gateway 单个序列化 Tool response 的 UTF-8 字节上限，不是累计输出/磁盘配额 |\n| 子分析 budget | 每次 dispatch 重拆父冻结 turns/output 上限；连续调用未扣共享余额 |\n| RUN_MAX_ATTEMPTS | 当前 Segment 的技术重试次数，不限制全部业务续行或 Run 成本 |\n| 输入文件数量/字节 | 逐根及跨根最终存量，规则见[资源总量](resource-snapshots.md#跨根总量) |\n\n父 20 turns 连续两次 dispatch 两支，每次仍各分 10，并非全 Run 20。创建、主 Executor、子 Provider、startup 尚未调用账本。"}, {"title": "用量现在流向哪里", "level": "h3", "anchor": "用量现在流向哪里", "text": "### 用量现在流向哪里\n\n| 来源 | 当前保存方式与缺口 |\n| --- | --- |\n| SDK mapper | usage 与 rate-limit 通知都可为 USAGE_UPDATED，Result 终端/等待另带 turns/cost；不能逐事件相加 |\n| 主 Executor / Session | Result 按 key 更新，Session usage 最新替换、cost 保存最近总值；无统一来源/去重账本 |\n| 取消覆盖事件 | 保留该事件已观察 usage/cost，丢弃成功/提问正文；SESSION_INTERRUPTED 不更新 Session usage，不能从事件反推相同投影 |\n| 子收集器 / Session | 校验终端和结果，但不归集用量；子 usage 仅 branch_key、cost 空，失败也不等于零消耗 |\n\n入账前须确认历史/重试/子调用范围，Session、Result、最终报告不可重复计量。"}, {"title": "原始用量观察入口", "level": "h3", "anchor": "原始用量观察入口", "text": "### 原始用量观察入口\n\n[Engine](../../SKM/backend/src/skillmind/agent/engine.py)的可选 `usage_observer` 在原 SDK Result 展示前同步处理；普通 usage/rate-limit 不进入。失败阻止成功/等待输出，取消传播，不后台补写。\n\n[观察](../../SKM/backend/src/skillmind/agent/metering.py)固定 invocation、Project/Run/Attempt/actor、SDK Session、续行模式、SDK/CLI 构建版本与实际 prompt checksum。options 仅记录实际模型、局部限额、Session/续行/输出格式摘要，不含凭据/结果，不冒充完整 options 审计。同 invocation 固定观察键，异内容不得换键；再次 resume 是新 invocation。\n\n整数、缺失、无效分开；有限非负 float 成本只存 binary64 hex，不转换为精确金额。观察不是 BudgetUsageReport，不声明累计范围/final/stopped；无 Result、流关闭、提交未知均不补零退款。\n\n接入前，可信协调方须验证计量 profile、实际构建和局部强制再归一化。离线 probe 只验版本标记/接口；SDK 可回退系统 CLI，故不证明实际二进制、resume 范围或硬上界。预算身份须经[绑定](#原调用绑定与启动)，不从 trace/Session/invocation ID 补造。"}, {"title": "现有计时器的覆盖范围", "level": "h3", "anchor": "现有计时器的覆盖范围", "text": "### 现有计时器的覆盖范围\n\n默认值来自 [Settings](../../SKM/backend/src/skillmind/core/settings.py)、[创建快照](../../SKM/backend/src/skillmind/runs/service.py)、[Worker](../../SKM/backend/src/skillmind/worker/settings.py)，部署以注入值为准。\n\n| 计时器 | 默认值与覆盖 |\n| --- | --- |\n| Attempt lease | 60 秒，可配 30–300；约每 1/3 续期，仅代表执行权 |\n| 准备 timeout | 300 秒，可配 1–3600；包住 ContextBuilder 及其输入提交，不含 Brief/启动/终态事务 |\n| 仓库单命令 | 120 秒，可配 5–600，不是所有根准备总时长 |\n| 模型事件流 | 普通创建冻结 900 秒，准备后起算；只对下一事件 await 施加 deadline，不打断事件持久化 |\n| 子分支 | 300 秒，可配 30–600，不赠送 Run 额度 |\n| ARQ execute_run | 1200 + 准备秒数，默认 1500；整个 job 最终防线，其他 job/cron 独立 |\n| 人工等待 | 持久 expires_at；释放主 lease，不刷新 Run 总额度 |\n\n准备 240 秒加模型 850 秒不违反各自限制，但不是 Run 共计 900 秒。续 lease 不延长 deadline；timeout 为协作取消，I/O/清理/DB 可晚返回，job 关停可打断终态提交。Effect 有[独立监督缺口](repository-effects.md#执行权与取消)。"}, {"title": "目标与非目标", "level": "h2", "anchor": "目标与非目标", "text": "## 目标与非目标\n\n重试/续行不重领额度，扩大上限新建 Run。不引入钱包/组织计费；Skill 解释、独立评估、模块构建另设限制。"}, {"title": "分开定义计量维度", "level": "h3", "anchor": "分开定义计量维度", "text": "### 分开定义计量维度\n\n| 维度 | 必须冻结的口径 |\n| --- | --- |\n| turns | Adapter 定义新增 turn；不按 ToolCall/事件数代替，resume 历史不重复 |\n| 成本 | 币种/精度/累计或增量/延迟规则；固定精度，不用 float 比余额 |\n| 累计输出（后续） | 明确文本/结构化/Tool response 范围，DELTA 与 COMPLETED 不重复 |\n| 活动时长（后续） | 累计墙钟区间，子并行重叠不相加，排队/人工等待不计，准备仍独立 timeout |\n\n硬限额须有 adapter 强制上界。未启用不宣称受限，启用但不可计量则禁止新收费；null 不是零/免费。"}, {"title": "计量报告如何归一化", "level": "h3", "anchor": "计量报告如何归一化", "text": "### 计量报告如何归一化\n\n| 报告 | 入账规则 |\n| --- | --- |\n| 增量 | 绑定原执行的稳定键；同键同内容一次入账，异内容阻断核对 |\n| 累计 | 保存来源/水位，只计可信增量，旧报告不退款，最终值不整体再加 |\n| resume/fork/范围变化 | 证明覆盖范围、历史/子调用与基线；不能共用一个 last_usage |\n| 缺失/冲突/无效 | 保留未知占用；负数、非有限数、错单位或无执行归属不变成零，更正另存审计 |\n\n可信 adapter 固定 SDK/CLI/规则版本，一个来源入账、其余交叉核对。BudgetUsageReport 只收归一化值；final=True 证明启用维度收齐，不指最后事件。增量无漏报，累计 turns/cost 各有水位，缺测不推进。"}, {"title": "一个账户，多个执行预留", "level": "h2", "anchor": "一个账户多个执行预留", "text": "## 一个账户，多个执行预留\n\n可加维度满足 remaining = limit - consumed - reserved。预留前不启动，余额不足/账本不可用则拒绝；未知仍占 reserved，用量原子转 consumed。超支记真实差额并阻断新分配，不截断；活动时长另按区间计。"}, {"title": "一个例子：已用、占用与可用", "level": "h3", "anchor": "一个例子已用占用与可用", "text": "### 一个例子：已用、占用与可用\n\n假设目标账户已验证 20 turns 硬上界（非当前 dispatch 输出）：\n\n| 时点 | 已用 | 占用 | 可用 |\n| --- | ---: | ---: | ---: |\n| 前一段结算 | 4 | 0 | 16 |\n| 主执行预留 6 | 4 | 6 | 10 |\n| 子 A/B 各预留 3 | 4 | 12 | 4 |\n| A 用 2 且停止 | 6 | 9 | 5 |\n| B 失联、主用 5 且停止 | 11 | 3 | 6 |\n\nB 的 3 不因 lease 过期退还，新执行最多用 6；若不能证明 B 仍受 3 的上界约束，暂停整个账户分配。"}, {"title": "持久账本的当前载体", "level": "h3", "anchor": "持久账本的当前载体", "text": "### 持久账本的当前载体\n\n[store](../../SKM/backend/src/skillmind/runs/budget_store.py)/[repository](../../SKM/backend/src/skillmind/runs/repository_budgets.py)使用 [0030](../../SKM/backend/migrations/versions/0030_run_budget_ledger.py) 账本、[0035](../../SKM/backend/migrations/versions/0035_budget_invocations.py) 调用/观察、[0043](../../SKM/backend/migrations/versions/0043_budget_start_owner.py) 启动所有权：\n\n| 表 | 责任 |\n| --- | --- |\n| run_budget_accounts | Run 唯一，策略/限额 checksum、已用/占用、阻断与版本 |\n| run_budget_reservations | Run/Segment/Attempt、操作组/执行键、parent、lease hash、授予量、原 invocation 绑定与启动/结算事实 |\n| run_budget_receipts | 原预留+回执键去重，追加用量、停止、未启动释放或核对失败；不依赖 RunEvent |\n| run_budget_observations | 原预留+原 invocation 的 SDK Result 观察；未归一化，不改变消耗、停止或结算事实 |\n\n内部 run-budget/v1 定义 turns/可选 nano-USD，非 HTTP。DTO 为整数，列 Numeric(38,0)，计算用整数、存储用 Decimal；拒绝 float/不足最小单位，不舍入，旧值需版本化转换。\n\nnew_budget_account 只构造未保存/未开始、限额匹配的账户，须与 Run 按 FK 顺序同事务保存；迁移不回填旧 Run，执行端不补零。"}, {"title": "原调用绑定与启动", "level": "h3", "anchor": "原调用绑定与启动", "text": "### 原调用绑定与启动\n\ninvocation ID、完整 JSON/checksum 成组保存，一次 invocation 全局只绑定一份预留。内部 agent-invocation/v1 不改原 policy/request/group hash，不是 API。\n\n| 边界 | 必须核对的原事实 |\n| --- | --- |\n| 绑定 | 有效 Run/Segment/Attempt lease、无取消、原 actor/Project/Run；首次仅 RESERVED，实际 max_turns 不超过授予量 |\n| 启动 | 显式传原 invocation ID/checksum，并重验完整保存值、scope 和当前执行权；仅首次确认的 START_INTENT commit 允许调用 client |\n| 观察 | 独立核对 lease 的 worker/token/到期世代、原预留与完整 invocation；重复同内容不重复写，异内容保留原值并先提交账户阻断及冲突审计 |\n\nsdk-result-observation/v1 不是 USAGE 回执。冲突先保存阻断审计，不以换键/成功事件掩盖；未知保留占用。终态后可独立核对，不恢复旧 Attempt 或追加 RunEvent。\n\n[Recorder](../../SKM/backend/src/skillmind/runs/budget_execution.py)成对装配 before_connect/usage_observer；只有首次明确 True 才创建 client，拒绝/未知/取消不许可启动，client 由原执行清理。捕获取消不能获得下一副作用许可。\n\nprepared_invocation 可固定原 Session/调用，Engine 仍从实际 prompt/options/模式逐字段重建核对；描述子或 RESERVED 都不是启动许可。"}, {"title": "启动所有权与协调方更替", "level": "h3", "anchor": "启动所有权与协调方更替", "text": "### 启动所有权与协调方更替\n\n描述子标识执行，owner 指定可尝试启动事务（TX B）的存活协调器。recorder 生成随机 token，首次 await 前取走并关闭复用，仅供本次绑定与启动；首次绑定同事务保存独立用途 hash。token 不从 lease/Session/invocation 派生，不进描述子、DTO、options、观察或 API。\n\n| 恢复场景 | 必须保持的判定 |\n| --- | --- |\n| 原绑定事务响应丢失 | 只用原描述与原 token 确认，未保存时不补写 |\n| 原 recorder 的 B 成功 | 仍须首次明确 commit 才允许 client；本地许可只使用一次 |\n| B 结果未知，行仍是 RESERVED | 原 recorder 不重试；新 recorder 的 token 不匹配，不能重新取得许可 |\n| 已有 START_INTENT | 读回不许可再次启动；换协调方也不能继承原 token |\n| 旧绑定没有所有权 | 保留原值并拒绝启动，不为旧调用补造 owner |\n\nowner 与原 lease/actor/绑定/父调用一起检查，阻止换 recorder 重获未知启动权；不证明开始、停止、结清，也不防受信代码复制内存 token 绕过 recorder。store/repository 仅供受信装配，不向未建身份的核对方开放。\n\n丢 token 保留占用，由独立核对方按原事实关闭未启动或结算；核对 lease 不授启动权。0043 旧行留空，任何 owner 痕迹均在排他锁内阻止降级；隔离不识别它的旧调用方。恢复较早 DB 不证明后来未启动。"}, {"title": "内部状态不能当作运行证明", "level": "h3", "anchor": "内部状态不能当作运行证明", "text": "### 内部状态不能当作运行证明\n\n| 状态 | 含义 |\n| --- | --- |\n| RESERVED | 已占用、无启动意图；未启动释放同时关闭启动资格 |\n| START_INTENT | 可能已开始；重复读取不许可重启，未知占用继续保留 |\n| SETTLED | 已提供停止依据和完整用量并释放未用量，不等于 Run 成功 |\n| RELEASED | 未启动预留已关闭，不是启动后的退款 |\n\nverified_evidence 仅验键形状，claim_reconciliation 仅管内部 lease；均不证明停止/核对方身份。须由受信服务锁外验来源/证据，不开放模型、用户或旧 Worker。"}, {"title": "原子性与重复请求", "level": "h3", "anchor": "原子性与重复请求", "text": "### 原子性与重复请求\n\n同事务验状态/权限/余额/身份，按 Run → Segment → Attempt → 账户 → 预留取所需锁，不反向；锁后用新时间 fencing，锁外调用模型/核对。\n\n同操作同键返原记录、异内容冲突，新执行以新身份取余额。Tool 重放不重调 Provider，新模型仍计量。整组 dispatch 原子预留，全部获准再逐支启动/独立结算。\n\n主模型等 Tool 不释放预留；无中途缩额协议时，子支只用未承诺余额，不足拒绝。转移须先证明主执行停止并同步收窄局部上限。"}, {"title": "启动与结算的提交边界", "level": "h3", "anchor": "启动与结算的提交边界", "text": "### 启动与结算的提交边界\n\n```text\nTX A：执行权 + 原子预留，确认原键\n  → 绑定事务：固定原 invocation + 实际参数，确认原值\n  → TX B：重验执行权 + 原绑定 + START_INTENT\n  → 锁外：带执行身份/局部上限调用 adapter\n  → TX C：去重核对，结算或保留占用\n```\n\nDB/模型不原子。A 提交错误在 repository 返回后用新 session 按原组确认，绑定同样只确认、不补缺失值，均要求有效 lease。B 首次明确 commit 才返回 True；已有意图为 False，未知抛 BudgetStartUncertainError，均不重启。C 冲突先提交阻断审计，不抛异常回滚它；flush/fencing 不等于 commit 瞬间保证。\n\nB 后崩溃/丢响应可能已收费，只有证明未开始且不能再开始才释放；取消窗口仍靠监督/硬上界。身份包括原 Tool/branch/重执行，接管不清旧未决预留。"}, {"title": "结束、取消与故障恢复", "level": "h2", "anchor": "结束取消与故障恢复", "text": "## 结束、取消与故障恢复\n\n| 场景 | 处理 |\n| --- | --- |\n| 正常结束 | 幂等结算可信用量，只释放已证明未用部分 |\n| 取消/timeout/等待 | 结算已知量；停止/未用尚不确定继续占用，interrupt 不代表停止 |\n| 崩溃/丢报告/lease 失效 | 保留待核对，不全额退款 |\n| 超预留/不可计量 | 记录真实消耗并阻止新收费执行 |\n| 终态后晚到 | 独立追加核对，不重开 Run、不在末次 RUN_SNAPSHOT 后加事件 |"}, {"title": "执行权与结算权分开", "level": "h3", "anchor": "执行权与结算权分开", "text": "### 执行权与结算权分开\n\n旧 Worker 不得启动/续期/增额/释放。可信核对方按原身份、来源/水位、停止证据收晚到报告，不恢复执行权；Session CLOSED、branch outcome、Run 终态均不清零占用。部分证明只结部分，不设手工退款绕行。"}, {"title": "兼容、公开信息与实施顺序", "level": "h2", "anchor": "兼容公开信息与实施顺序", "text": "## 兼容、公开信息与实施顺序\n\n旧 Run 无账本标累计未知，不从 Session 回填零；非终态须可靠重建才续行，否则停止收费、明确新建。max_output_bytes 仍指单响应；公开余额取服务端投影，Brief 余额带观察时点。"}, {"title": "上线门禁与接线顺序", "level": "h3", "anchor": "上线门禁与接线顺序", "text": "### 上线门禁与接线顺序\n\n顺序为计量/局部强制 → 真实 DB 并发/未知提交/受信核对 → 创建、主子、等待/取消/重试共用账户 → 公开投影/三语/新策略。缺入口不回退完整上限。\n\n切换前隔离旧 Worker 并处理在途；旧未绑定 START_INTENT 不补绑重启。0035 任一绑定/观察、0030 非空账本均阻止破坏性降级，0043 另验 owner；仍须全实例停写，不以 migration guard 代替恢复证明。公开变化按[契约流程](../development/contract-workflow.md)同步。"}, {"title": "验收矩阵", "level": "h2", "anchor": "验收矩阵", "text": "## 验收矩阵\n\n覆盖连续主子分配、最后余额竞争、同键异内容、重复/乱序/缺测报告、resume 历史去重、A/B/C 提交丢响应、启动后崩溃/接管、晚到结算、混合 Worker/回退与旧 Run。分别证明真实事务、adapter 硬限额和 SDK 计量完整性；split_budget 或内部账本单测不代表 Run 级预算已生效。"}], "toc": [{"title": "先区分上限、分配与消耗", "anchor": "先区分上限分配与消耗", "level": "h2"}, {"title": "当前实现的实际口径", "anchor": "当前实现的实际口径", "level": "h3"}, {"title": "用量现在流向哪里", "anchor": "用量现在流向哪里", "level": "h3"}, {"title": "原始用量观察入口", "anchor": "原始用量观察入口", "level": "h3"}, {"title": "现有计时器的覆盖范围", "anchor": "现有计时器的覆盖范围", "level": "h3"}, {"title": "目标与非目标", "anchor": "目标与非目标", "level": "h2"}, {"title": "分开定义计量维度", "anchor": "分开定义计量维度", "level": "h3"}, {"title": "计量报告如何归一化", "anchor": "计量报告如何归一化", "level": "h3"}, {"title": "一个账户，多个执行预留", "anchor": "一个账户多个执行预留", "level": "h2"}, {"title": "一个例子：已用、占用与可用", "anchor": "一个例子已用占用与可用", "level": "h3"}, {"title": "持久账本的当前载体", "anchor": "持久账本的当前载体", "level": "h3"}, {"title": "原调用绑定与启动", "anchor": "原调用绑定与启动", "level": "h3"}, {"title": "启动所有权与协调方更替", "anchor": "启动所有权与协调方更替", "level": "h3"}, {"title": "内部状态不能当作运行证明", "anchor": "内部状态不能当作运行证明", "level": "h3"}, {"title": "原子性与重复请求", "anchor": "原子性与重复请求", "level": "h3"}, {"title": "启动与结算的提交边界", "anchor": "启动与结算的提交边界", "level": "h3"}, {"title": "结束、取消与故障恢复", "anchor": "结束取消与故障恢复", "level": "h2"}, {"title": "执行权与结算权分开", "anchor": "执行权与结算权分开", "level": "h3"}, {"title": "兼容、公开信息与实施顺序", "anchor": "兼容公开信息与实施顺序", "level": "h2"}, {"title": "上线门禁与接线顺序", "anchor": "上线门禁与接线顺序", "level": "h3"}, {"title": "验收矩阵", "anchor": "验收矩阵", "level": "h2"}], "source": "design/run-budgets.md", "checksum": "05de25fddc9280a7b626f6ea9f386facba07f4dc571f878df8000cb1bc2df58a"}, {"id": "docs/design/repository-effects.md", "title": "受控外部写入", "group": "design", "html": "\u003ch1 id=\"受控外部写入\">受控外部写入\u003c/h1>\n\u003cp>本页定义提案、批准、远端效果与恢复；实现状态见\u003ca href=\"#docs/planning/roadmap.md::r08-%E5%A4%96%E9%83%A8%E6%95%88%E6%9E%9C\">计划 R08\u003c/a>，续行见 \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>，处置见\u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清四种事实\">先分清四种事实\u003c/h2>\n\u003cp>Git push/回读成功而 PR 超时：commit 已成立，PR/平台保存仍可能未知；重启、再批准、取消 Run 均不撤销 commit。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>状态含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ChangeProposal\u003c/td>\n\u003ctd>冻结变更；APPROVED 是获准，不是已写入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ChangeApproval\u003c/td>\n\u003ctd>对精确 version/checksum 的决定，不扩其他权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EffectExecution\u003c/td>\n\u003ctd>APPLIED 是已保存 Provider 完成结果；FAILED 不证明远端未变，VERIFICATION_FAILED 属于此对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run / Evidence\u003c/td>\n\u003ctd>分别是分析流程与审计依据，不代替远端执行事实\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Effect attempt_no 非 RunAttempt。before_ref/after_ref 可空，仓库 before 只定位基线、不保证逆向补丁。模型 effects 的\u003ca href=\"#docs/design/results-evaluation.md::%E6%95%88%E6%9E%9C%E6%91%98%E8%A6%81%E6%A0%B8%E5%AF%B9%E5%88%B0%E5%93%AA%E4%B8%80%E6%AD%A5\">保存记录核验\u003c/a>不证明远端原执行或解决可靠性缺口。\u003c/p>\n\u003ch2 id=\"调用与批准链路\">调用与批准链路\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">observe → Evidence → change.propose → 精确批准/允许的预授权\n  → TX 1：批准 / Effect / Outbox\n  → TX 2：提案与 binding 校验 / claim\n  → 锁外：凭据 / 前置检查 / 写入 / read-back / 可选 PR\n  → TX 3：结果 / Evidence / 事件 / 后续调度\n\u003c/code>\u003c/pre>\n\u003cp>锁序 Run → Segment → Proposal → Effect，远端 I/O 在锁外，无跨 DB/仓库/forge 原子性。拒绝不产生可执行 Effect；批准后 Run 可仍 WAITING_FOR_APPROVAL，Effect Worker 独立执行。\u003c/p>\n\u003cp>有效 finalize 的结果/不可重试失败交新 Segment，临时失败沿原 Segment/Proposal/Effect 重调度。Agent 仅提案；\u003ca href=\"../SKM/backend/src/skillmind/effects/catalog.py\">catalog\u003c/a>统一 Provider/validator/预授权资格。\u003c/p>\n\u003ch2 id=\"已注册写入\">已注册写入\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>capability\u003c/th>\n\u003cth>批准与执行边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>issue.update/v1\u003c/td>\n\u003ctd>Redmine CAS adapter；仅 system ADMIN 配置 LOW 风险精确 scope 可预授权，discovery → 前置 revision → 条件写入 → 回读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>repository.write/v1\u003c/td>\n\u003ctd>Git/SVN，始终人工批准，不 force；精确 CAS/恢复仍有缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>标准 Redmine REST 不具本协议 CAS/幂等，须通过版本化 discovery 及真实竞争验收。批准复验 actor/Project/version/checksum/Integration/binding/scope；仅 Run 发起人或组织 system ADMIN 决策。\u003c/p>\n\u003ch2 id=\"仓库写入模式\">仓库写入模式\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>write_mode\u003c/th>\n\u003cth>目标与限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>direct（默认）\u003c/td>\n\u003ctd>Git 默认目标普通 fast-forward push；SVN 绑定 URL，不据此宣称精确 revision CAS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>branch\u003c/td>\n\u003ctd>skillmind/ 保留分支；SVN 为仓库根 branches/skillmind/，只应新建或证明重放原提交\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Git branch 可经 forge 建 PR/MR，未配 forge 仅分支/commit；direct/SVN 不调 forge，PR 失败不撤 commit。\u003c/p>\n\u003ch2 id=\"变更载体和冻结内容\">变更载体和冻结内容\u003c/h2>\n\u003cp>提案冻结 binding、capability/operation、风险、Evidence、revision、预览、幂等身份。仓库只接受逐文件全文 SET/REMOVE，不执行 diff/Shell；Provider 使用独立可写副本，不从只读 input/ 提交。\u003c/p>\n\u003ch3 id=\"契约与幂等身份\">契约与幂等身份\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/contracts/tools/change.propose/v1/request.schema.json\">提案契约\u003c/a>由 capability validator 收窄；\u003ca href=\"../SKM/backend/src/skillmind/api/routes/effects.py\">decision\u003c/a>携带 Idempotency-Key，内部 ClaimedEffectExecution 不暴露凭据/config/lease。\u003c/p>\n\u003cp>提案/决定/Run 创建键分开；决定重放须原 key/proposal/version/checksum/decision/reason，远端重试沿原 Proposal/Effect，不随 Worker 换键。\u003ca href=\"../SKM/contracts/tools/repository.write/v1/request.schema.json\">旧 repository.write Schema\u003c/a>仍限 skillmind/ branch，非 Effect Worker 输入/direct 示例；须审查版本/历史再同步，不据此开放直接 write。\u003c/p>\n\u003ch2 id=\"并发重试和失败\">并发、重试和失败\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>当前处理及限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>决策版本/checksum 不符\u003c/td>\n\u003ctd>拒绝旧预览，重新读取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目标陈旧/冲突\u003c/td>\n\u003ctd>STALE/target_stale 或 FAILED/target_branch_conflict，不改已批准内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可重试 transport 错误\u003c/td>\n\u003ctd>记错后 REQUESTED/Outbox 重进整个 Provider；次数耗尽、取消、过期不自动继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回读不匹配\u003c/td>\n\u003ctd>VERIFICATION_FAILED，不自动重试；外部可能已变，证据未必保存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回读断连/commit 后 PR 失败\u003c/td>\n\u003ctd>按 transport 分类；暂无持久“commit 完成待 PR”阶段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>claim 前取消\u003c/td>\n\u003ctd>拒绝 Provider；claim 后仍有窗口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Provider 中取消\u003c/td>\n\u003ctd>有效 lease finalize 先存远端结果再取消 Run，不做逆向写入\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>reversible/rollback 不提供回滚操作；撤回须验真实 revision 再走新修正流程。禁止 force、自动合并、自批、repository 免审、跨仓库原子写及无 scope 更新。\u003c/p>\n\u003ch2 id=\"可靠性修正要求\">可靠性修正要求\u003c/h2>\n\u003cp>以下是待实现目标，不因 Provider 存在而视为完成。\u003c/p>\n\u003ch3 id=\"执行身份与远端前置条件\">执行身份与远端前置条件\u003c/h3>\n\u003cp>当前 Git/SVN matches 只比变更路径内容，Redmine 不同 revision 同值也可报 replayed；同内容/同名 branch 不证明原执行。\u003c/p>\n\u003cp>目标重放须证原 Effect/请求、目标、批准基线、实际 revision/变更集；已知未执行但基线失效拒绝 stale，未知先核对。Git direct/branch 须在远端更新点校验精确旧 ref/不存在条件，GET/本地锁不足，仍禁 force。\u003c/p>\n\u003cp>SVN 当前 checkout 未固定 revision，回读取事后值；须固定 direct/branch 基线、提交回执并按对应 revision 回读。out-of-date 不保护 checkout 前变化，旧记录不补造回执。\u003c/p>\n\u003ch3 id=\"阶段回执与不确定结果\">阶段回执与不确定结果\u003c/h3>\n\u003cp>当前 Provider 完整返回才存 before/after：forge 失败会丢 commit 返回，SVN copy/文件 commit 是两次写；首个同 source open PR 未完整验 target/提案/并发。\u003c/p>\n\u003cp>目标同 Effect 追加调用前身份、写后回执、回读，区分未执行/已执行待验证或 PR/未知。恢复查原身份、仅补未发生阶段；PR/MR 验仓库/source/target/提案，分别处理关闭/合并/并发/丢响应。\u003c/p>\n\u003cp>新载体未冻结，须同步存储/Provider/事件/消费者。旧空值不证明未执行，不靠改 SQL、删 Effect、换 key 修复；阶段记录不消除 DB/远端断连窗口。\u003c/p>\n\u003ch3 id=\"执行权与取消\">执行权与取消\u003c/h3>\n\u003cp>当前 Provider 无贯穿 heartbeat/取消监督，claim 时间在取锁前计算，过期重派时旧请求可能仍在写。\u003c/p>\n\u003cp>目标获锁后用新时间建/验 lease，每个新外部步骤前重验批准/取消/执行权。失权/超时先确认原事实，第二 Worker 不直接重写；只读核对与新写分开，取消保留已发生事实。\u003c/p>\n\u003ch2 id=\"验收\">验收\u003c/h2>\n\u003cp>覆盖决定丢响应/同键改 reason、同内容不同提案、预读后目标变化、SVN copy 中断及固定 revision 回读、commit 后 PR 超时/并发、Provider 超 lease/取消/旧 Worker 晚到、finalize 响应未知。原身份不重建，不误认他人提交，部分成功可追溯。\u003c/p>\n\u003cp>入口：\u003ca href=\"../SKM/backend/tests/effects\">Provider\u003c/a>、\u003ca href=\"../SKM/backend/tests/worker/test_effect_executor.py\">Worker\u003c/a>。真实 DB/远端/forge/CAS 与\u003ca href=\"#docs/design/workspace.md::%E5%AE%A1%E6%89%B9%E8%AF%B7%E6%B1%82%E4%B8%8E%E6%89%A7%E8%A1%8C%E7%BB%93%E6%9E%9C\">审批 UI\u003c/a>分别验收。\u003c/p>\n", "sections": [{"title": "受控外部写入", "level": "h1", "anchor": "受控外部写入", "text": "# 受控外部写入\n\n本页定义提案、批准、远端效果与恢复；实现状态见[计划 R08](../planning/roadmap.md#r08-外部效果)，续行见 [Runtime](agent-runtime.md)，处置见[Runbook](../operations/runbook.md)。"}, {"title": "先分清四种事实", "level": "h2", "anchor": "先分清四种事实", "text": "## 先分清四种事实\n\nGit push/回读成功而 PR 超时：commit 已成立，PR/平台保存仍可能未知；重启、再批准、取消 Run 均不撤销 commit。\n\n| 对象 | 状态含义 |\n| --- | --- |\n| ChangeProposal | 冻结变更；APPROVED 是获准，不是已写入 |\n| ChangeApproval | 对精确 version/checksum 的决定，不扩其他权限 |\n| EffectExecution | APPLIED 是已保存 Provider 完成结果；FAILED 不证明远端未变，VERIFICATION_FAILED 属于此对象 |\n| Run / Evidence | 分别是分析流程与审计依据，不代替远端执行事实 |\n\nEffect attempt_no 非 RunAttempt。before_ref/after_ref 可空，仓库 before 只定位基线、不保证逆向补丁。模型 effects 的[保存记录核验](results-evaluation.md#效果摘要核对到哪一步)不证明远端原执行或解决可靠性缺口。"}, {"title": "调用与批准链路", "level": "h2", "anchor": "调用与批准链路", "text": "## 调用与批准链路\n\n```text\nobserve → Evidence → change.propose → 精确批准/允许的预授权\n  → TX 1：批准 / Effect / Outbox\n  → TX 2：提案与 binding 校验 / claim\n  → 锁外：凭据 / 前置检查 / 写入 / read-back / 可选 PR\n  → TX 3：结果 / Evidence / 事件 / 后续调度\n```\n\n锁序 Run → Segment → Proposal → Effect，远端 I/O 在锁外，无跨 DB/仓库/forge 原子性。拒绝不产生可执行 Effect；批准后 Run 可仍 WAITING_FOR_APPROVAL，Effect Worker 独立执行。\n\n有效 finalize 的结果/不可重试失败交新 Segment，临时失败沿原 Segment/Proposal/Effect 重调度。Agent 仅提案；[catalog](../../SKM/backend/src/skillmind/effects/catalog.py)统一 Provider/validator/预授权资格。"}, {"title": "已注册写入", "level": "h2", "anchor": "已注册写入", "text": "## 已注册写入\n\n| capability | 批准与执行边界 |\n| --- | --- |\n| issue.update/v1 | Redmine CAS adapter；仅 system ADMIN 配置 LOW 风险精确 scope 可预授权，discovery → 前置 revision → 条件写入 → 回读 |\n| repository.write/v1 | Git/SVN，始终人工批准，不 force；精确 CAS/恢复仍有缺口 |\n\n标准 Redmine REST 不具本协议 CAS/幂等，须通过版本化 discovery 及真实竞争验收。批准复验 actor/Project/version/checksum/Integration/binding/scope；仅 Run 发起人或组织 system ADMIN 决策。"}, {"title": "仓库写入模式", "level": "h2", "anchor": "仓库写入模式", "text": "## 仓库写入模式\n\n| write_mode | 目标与限制 |\n| --- | --- |\n| direct（默认） | Git 默认目标普通 fast-forward push；SVN 绑定 URL，不据此宣称精确 revision CAS |\n| branch | skillmind/ 保留分支；SVN 为仓库根 branches/skillmind/，只应新建或证明重放原提交 |\n\nGit branch 可经 forge 建 PR/MR，未配 forge 仅分支/commit；direct/SVN 不调 forge，PR 失败不撤 commit。"}, {"title": "变更载体和冻结内容", "level": "h2", "anchor": "变更载体和冻结内容", "text": "## 变更载体和冻结内容\n\n提案冻结 binding、capability/operation、风险、Evidence、revision、预览、幂等身份。仓库只接受逐文件全文 SET/REMOVE，不执行 diff/Shell；Provider 使用独立可写副本，不从只读 input/ 提交。"}, {"title": "契约与幂等身份", "level": "h3", "anchor": "契约与幂等身份", "text": "### 契约与幂等身份\n\n[提案契约](../../SKM/contracts/tools/change.propose/v1/request.schema.json)由 capability validator 收窄；[decision](../../SKM/backend/src/skillmind/api/routes/effects.py)携带 Idempotency-Key，内部 ClaimedEffectExecution 不暴露凭据/config/lease。\n\n提案/决定/Run 创建键分开；决定重放须原 key/proposal/version/checksum/decision/reason，远端重试沿原 Proposal/Effect，不随 Worker 换键。[旧 repository.write Schema](../../SKM/contracts/tools/repository.write/v1/request.schema.json)仍限 skillmind/ branch，非 Effect Worker 输入/direct 示例；须审查版本/历史再同步，不据此开放直接 write。"}, {"title": "并发、重试和失败", "level": "h2", "anchor": "并发重试和失败", "text": "## 并发、重试和失败\n\n| 情况 | 当前处理及限制 |\n| --- | --- |\n| 决策版本/checksum 不符 | 拒绝旧预览，重新读取 |\n| 目标陈旧/冲突 | STALE/target_stale 或 FAILED/target_branch_conflict，不改已批准内容 |\n| 可重试 transport 错误 | 记错后 REQUESTED/Outbox 重进整个 Provider；次数耗尽、取消、过期不自动继续 |\n| 回读不匹配 | VERIFICATION_FAILED，不自动重试；外部可能已变，证据未必保存 |\n| 回读断连/commit 后 PR 失败 | 按 transport 分类；暂无持久“commit 完成待 PR”阶段 |\n| claim 前取消 | 拒绝 Provider；claim 后仍有窗口 |\n| Provider 中取消 | 有效 lease finalize 先存远端结果再取消 Run，不做逆向写入 |\n\nreversible/rollback 不提供回滚操作；撤回须验真实 revision 再走新修正流程。禁止 force、自动合并、自批、repository 免审、跨仓库原子写及无 scope 更新。"}, {"title": "可靠性修正要求", "level": "h2", "anchor": "可靠性修正要求", "text": "## 可靠性修正要求\n\n以下是待实现目标，不因 Provider 存在而视为完成。"}, {"title": "执行身份与远端前置条件", "level": "h3", "anchor": "执行身份与远端前置条件", "text": "### 执行身份与远端前置条件\n\n当前 Git/SVN matches 只比变更路径内容，Redmine 不同 revision 同值也可报 replayed；同内容/同名 branch 不证明原执行。\n\n目标重放须证原 Effect/请求、目标、批准基线、实际 revision/变更集；已知未执行但基线失效拒绝 stale，未知先核对。Git direct/branch 须在远端更新点校验精确旧 ref/不存在条件，GET/本地锁不足，仍禁 force。\n\nSVN 当前 checkout 未固定 revision，回读取事后值；须固定 direct/branch 基线、提交回执并按对应 revision 回读。out-of-date 不保护 checkout 前变化，旧记录不补造回执。"}, {"title": "阶段回执与不确定结果", "level": "h3", "anchor": "阶段回执与不确定结果", "text": "### 阶段回执与不确定结果\n\n当前 Provider 完整返回才存 before/after：forge 失败会丢 commit 返回，SVN copy/文件 commit 是两次写；首个同 source open PR 未完整验 target/提案/并发。\n\n目标同 Effect 追加调用前身份、写后回执、回读，区分未执行/已执行待验证或 PR/未知。恢复查原身份、仅补未发生阶段；PR/MR 验仓库/source/target/提案，分别处理关闭/合并/并发/丢响应。\n\n新载体未冻结，须同步存储/Provider/事件/消费者。旧空值不证明未执行，不靠改 SQL、删 Effect、换 key 修复；阶段记录不消除 DB/远端断连窗口。"}, {"title": "执行权与取消", "level": "h3", "anchor": "执行权与取消", "text": "### 执行权与取消\n\n当前 Provider 无贯穿 heartbeat/取消监督，claim 时间在取锁前计算，过期重派时旧请求可能仍在写。\n\n目标获锁后用新时间建/验 lease，每个新外部步骤前重验批准/取消/执行权。失权/超时先确认原事实，第二 Worker 不直接重写；只读核对与新写分开，取消保留已发生事实。"}, {"title": "验收", "level": "h2", "anchor": "验收", "text": "## 验收\n\n覆盖决定丢响应/同键改 reason、同内容不同提案、预读后目标变化、SVN copy 中断及固定 revision 回读、commit 后 PR 超时/并发、Provider 超 lease/取消/旧 Worker 晚到、finalize 响应未知。原身份不重建，不误认他人提交，部分成功可追溯。\n\n入口：[Provider](../../SKM/backend/tests/effects/)、[Worker](../../SKM/backend/tests/worker/test_effect_executor.py)。真实 DB/远端/forge/CAS 与[审批 UI](workspace.md#审批请求与执行结果)分别验收。"}], "toc": [{"title": "先分清四种事实", "anchor": "先分清四种事实", "level": "h2"}, {"title": "调用与批准链路", "anchor": "调用与批准链路", "level": "h2"}, {"title": "已注册写入", "anchor": "已注册写入", "level": "h2"}, {"title": "仓库写入模式", "anchor": "仓库写入模式", "level": "h2"}, {"title": "变更载体和冻结内容", "anchor": "变更载体和冻结内容", "level": "h2"}, {"title": "契约与幂等身份", "anchor": "契约与幂等身份", "level": "h3"}, {"title": "并发、重试和失败", "anchor": "并发重试和失败", "level": "h2"}, {"title": "可靠性修正要求", "anchor": "可靠性修正要求", "level": "h2"}, {"title": "执行身份与远端前置条件", "anchor": "执行身份与远端前置条件", "level": "h3"}, {"title": "阶段回执与不确定结果", "anchor": "阶段回执与不确定结果", "level": "h3"}, {"title": "执行权与取消", "anchor": "执行权与取消", "level": "h3"}, {"title": "验收", "anchor": "验收", "level": "h2"}], "source": "design/repository-effects.md", "checksum": "496dac601a0031dbf63ab64a5531152239d8419a33cecff0de23fbb4859df35c"}, {"id": "docs/design/task-scheduling.md", "title": "TaskSchedule 设计", "group": "design", "html": "\u003ch1 id=\"taskschedule-设计\">TaskSchedule 设计\u003c/h1>\n\u003cp>Schedule 决定何时、以谁、哪份配置调用普通 \u003ca href=\"#docs/design/run-creation.md::\">Run 创建\u003c/a>，不是第二引擎。实现与缺口集中在\u003ca href=\"#docs/planning/roadmap.md::r09-%E8%B0%83%E5%BA%A6\">计划 R09\u003c/a>。\u003c/p>\n\u003ch2 id=\"一页速览\">一页速览\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Schedule / Run\u003c/td>\n\u003ctd>前者存规则，每次成功触发创建独立 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>occurrence / 实际开始\u003c/td>\n\u003ctd>occurrence 是计划时刻，tick 与 Run 都可能晚到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>暂停 / 取消\u003c/td>\n\u003ctd>暂停阻止后续认领，不撤回在途；已有 Run 单独取消\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等 / 恢复\u003c/td>\n\u003ctd>原键抑制重复，持久 occurrence 保存原配置；有界恢复不承诺无限重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不批量补跑 / 不迟到\u003c/td>\n\u003ctd>当前处理一个到期 occurrence，其余计 missed，无最大迟到拒绝\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"一个例子规则触发与执行分别看\">一个例子：规则、触发与执行分别看\u003c/h2>\n\u003cp>08:00 创建 A，A 等批准；09:00 同调度因重叠跳过。ACTIVE、last_run_at=09:00、last_outcome=SKIPPED_OVERLAP、last_run_id=A、run_count=1 可同时成立。\u003c/p>\n\u003cp>last_run_at 是回写的计划时刻，last_run_id 是最近成功关联，跳过不清空；run_count 计创建不计成功。last_* 可滞后/覆盖，不是触发账本。\u003c/p>\n\u003ch2 id=\"生命周期与发火\">生命周期与发火\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">保存规则（仅 ACTIVE 参与 tick）\n  → TX A：认领 PENDING occurrence\n       冻结原配置 / lease\n       推进 next_run_at\n  → 当前授权 / 查询原键\n       无原 Run 才检查重叠和前置条件\n  → TX B：锁内复核当前授权与 claim\n       普通 Run 创建 / 原请求确认\n       同时关联、结算、更新摘要与计数\n已知无 Run：独立短事务结算\n\u003c/code>\u003c/pre>\n\u003cp>认领/创建分事务，A 后崩溃恢复原 PENDING；初始快照、事件/Outbox、关联同事务，commit 确认前不宣称成功。基础设施/提交未知保留记录，以原键确认，不造失败或退款。\u003c/p>\n\u003cp>ONCE/CRON 必填 IANA timezone、分钟粒度，共用\u003ca href=\"../SKM/backend/src/skillmind/schedules/cron.py\">求值器\u003c/a>。ONCE 一次；CRON 预览通常至少三次，受 end_at/max_runs 限制时不虚构。CRON 跳过 DST 缺失时刻、重复取首次；ONCE 规范到分钟，键用 UTC occurrence。\u003c/p>\n\u003cp>状态为 ACTIVE/PAUSED/COMPLETED/ERROR/ARCHIVED；编辑保留状态，ERROR 修正后显式恢复，从当前时刻重算，不补暂停历史。COMPLETED 可有关联非终态 Run。\u003c/p>\n\u003ch2 id=\"保存和执行边界\">保存和执行边界\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>任务/输入\u003c/td>\n\u003ctd>保存精确 SkillVersion/task_key、input/sources 规则，不跟 latest；发火才冻结本次资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>身份\u003c/td>\n\u003ctd>发火前重新检查创建者有效性/Project 权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等\u003c/td>\n\u003ctd>Schedule ID + UTC occurrence；先查原 Run，再判断新建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重叠\u003c/td>\n\u003ctd>查同 Schedule 的全部 occurrence 关联 Run，非终态含等待均跳过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失效\u003c/td>\n\u003ctd>FAILED_PRECONDITION / ERROR，修正后显式恢复，不换来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结束\u003c/td>\n\u003ctd>ONCE 一次机会；CRON 的 max_runs 是累计创建额度，跳过不消耗额度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>调度不绕批准/资源/审计；新 occurrence 冻结全集当时成员，单份/集合保持原 ID，重放不改快照。\u003c/p>\n\u003ch3 id=\"管理写入的授权事务\">管理写入的授权事务\u003c/h3>\n\u003cp>创建/编辑/状态写入经 ProjectWriteActor，并在事务复用\u003ca href=\"#docs/design/authentication.md::%E8%AE%A4%E8%AF%81%E4%B8%8E%E4%B8%9A%E5%8A%A1%E6%8F%90%E4%BA%A4%E4%B8%8D%E6%98%AF%E5%90%8C%E4%B8%80%E4%B8%AA%E4%BA%8B%E5%8A%A1\">原会话校验\u003c/a>。内部 UserAccess 保留原 cookie/CSRF/request UUID，不换会话、不改 HTTP。锁外解析 Skill/输入，写前重新授权。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Organization UPDATE → 当前 User SHARE → 原 AuthSession UPDATE\n  → Project SHARE → USER 的 ProjectMember SHARE\n  → 既有 Schedule UPDATE → 写入 / flush → 最终认证 → commit\n\u003c/code>\u003c/pre>\n\u003cp>创建不取既有 Schedule 锁；ADMIN 免 membership、不免组织/归档。取得业务锁及最终 flush 后用新时间验原 token/CSRF、角色、撤销、期限与当前成员：会话失效 401、CSRF 403、无权/不存在 404，已授权归档 409。\u003c/p>\n\u003cp>User SHARE 阻止停用/改角色并兼容 occurrence 外键锁，勿升级 UPDATE 造成与 Schedule 反向等待。CAS、状态、已用/占用额度在 Schedule 锁内检查；最终拒绝整体回滚，commit 未知不自动重发。此门禁不证明物理 commit 瞬间未过期或在途 Run 停止；发火用当前创建者/持久 claim，不依赖浏览器会话。\u003c/p>\n\u003cp>创建/编辑/恢复 ACTIVE 在 CAS/状态检查后，\u003ca href=\"#docs/design/skill-interpretation.md::resourcebinding-%E4%B8%8E-readiness\">可用性门禁\u003c/a>依次持有 SkillVersion/ProjectSkillVersion SHARE，验精确 PUBLISHED/未停用；不跟 latest，暂停/归档免可用性。SHARE 兼容 occurrence KEY SHARE。\u003c/p>\n\u003cp>input/sources 在首次 await 前复制，既有调度先验锁内版本；创建/编辑锁内重验文档元数据，不重新解释或读 blob。原 ID 缺失拒绝，不换同路径新文档；\u003ca href=\"#docs/design/document-lifecycle.md::%E5%88%A0%E9%99%A4%E4%BA%8B%E5%8A%A1%E4%B8%8E%E5%BC%95%E7%94%A8%E5%88%A4%E5%AE%9A\">删除门禁\u003c/a>保护当前规则及保留 occurrence。\u003c/p>\n\u003ch3 id=\"重叠检查到底看谁\">重叠检查到底看谁\u003c/h3>\n\u003cp>先确认原 occurrence，无原 Run 才查同 Schedule 其他关联。每 Schedule 最多一个 PENDING，未结算不认领下一项，不补历史队列；不检查手动/其他 Schedule，不是全局锁。新建事务再次 fencing/验重叠，解析、物化、模型均在锁外。\u003c/p>\n\u003ch2 id=\"保存表单与触发预览\">保存表单与触发预览\u003c/h2>\n\u003cp>ScheduleDialog 与即时执行共用输入组件，发送精确任务/input/sources，必需文档缺失或集合不完整拒绝保存。\u003c/p>\n\u003cp>保存须当前 definition 的成功非空预览和人工确认；修改即清确认，A→B→A 也不收旧响应。预览仅发 definition，只验时间、不授权资源或创建 Run。\u003c/p>\n\u003cp>关闭创建弹窗丢草稿；abort/超时非未保存证明。列表可核对当前事实，但无创建原键保证；同名/同配置/不可见均不证明原请求成败。\u003c/p>\n\u003ch3 id=\"保存后的管理入口\">保存后的管理入口\u003c/h3>\n\u003cp>\u003ccode>#/schedules?project=\u0026lt;id\u0026gt;\u003c/code> 独立于模块/TaskCatalog，默认全部状态。服务端 total/limit/offset 分页；q 对 name/task_key 做不区分大小写的字面子串查询，status 单选，created_at/ID 降序。count/items 非原子快照，矛盾须刷新；任务卡汇总读完后续页，遇总数变更/重复不宣称完整。\u003c/p>\n\u003cp>详情匹配精确 SkillVersion/task；失效仍展示原配置，只读编辑并说明，不跟 latest。目录错误不冒充任务失效、不清列表；归档 Project 只读。编辑保留原来源/未改绝对时刻精度，不归档重建或清计数。\u003c/p>\n\u003cp>PUT/状态操作携带用户看到的 expected_row_version。冲突并列原值、已发送内容、GET 当前值并保留草稿；人工采用新版本后重新预览确认再保存。未知不自动重发，GET 不证明原写成功；重开编辑保留未决、暂禁同目标其他写入，身份/Project/离页不承诺恢复，不持久存储正文。\u003c/p>\n\u003cp>任一列表/详情/目录/在途读取的 401/403/404 关闭写入资格，旧成功不复权；共用防重/期限/晚到隔离。旧客户端缺版本为 422，须更新 Web，不补最新版本。字段见\u003ca href=\"../SKM/contracts/task-schedule/v1.schema.json\">契约\u003c/a>和 \u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a>。\u003c/p>\n\u003ch3 id=\"在途只读核对\">在途只读核对\u003c/h3>\n\u003cp>GET /projects/{project_id}/schedules/{schedule_id}/activity 按当前 Project 读权限查询，不因创建者/任务失效或暂停/归档隐藏待结算。父配置版本、单 PENDING、DB checked_at 来自同条 SELECT，不锁业务或触发修复。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>读取结果\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>TRACKED + pending\u003c/td>\n\u003ctd>显示原 UTC occurrence、原/当前配置版本、认领次数/自动上限和租约截止；不是 Run 执行状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TRACKED + null\u003c/td>\n\u003ctd>本次读取未见 PENDING；不证明没有 Run、原触发成功或可以重发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LEGACY_UNAVAILABLE\u003c/td>\n\u003ctd>旧协议无法提供可靠在途追踪，不补空历史、不迁移旧数据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>读取失败 / 409 schedule_activity_unavailable\u003c/td>\n\u003ctd>保持未核实；损坏关联、快照或多 PENDING 不以第一条/空值掩盖\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>按 checked_at 精确到微秒判到期；未到期非存活证明，到期/耗尽非停止/释放证明。接管不一定改父 row_version，须重新 GET，不按父版本缓存；刷新不复权或清未知意图。\u003c/p>\n\u003cp>校验原快照/身份后才投影，不含正文/key/snapshot/hash/worker/token；非历史账本、原写回执或人工重试入口。旧 API 不支持则显示读取失败，保留独立详情。\u003c/p>\n\u003ch3 id=\"时间输入与展示的边界\">时间输入与展示的边界\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>边界\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>CRON\u003c/td>\n\u003ctd>按 definition.timezone 求值，未必是浏览器本地时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ONCE/end_at 输入\u003c/td>\n\u003ctd>datetime-local 按明确标注的浏览器时区转绝对时刻；改规则 timezone 不改变输入时区\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预览/摘要\u003c/td>\n\u003ctd>按规则时区显示 occurrence 与 UTC offset，不给本地文字拼上另一时区标签\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API datetime\u003c/td>\n\u003ctd>run_at/end_at 拒绝无 offset；旧已存绝对时刻不重新解释\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>浏览器 UTC/规则东京：CRON 09:00 是 UTC 00:00，ONCE 输入 09:00 是东京 18:00。非法日期/DST 缺失拒绝，歧义须显式选 offset，不靠 Date 纠正；改输入时区须另定兼容。\u003c/p>\n\u003ch2 id=\"可靠性保证的限度\">可靠性保证的限度\u003c/h2>\n\u003ch3 id=\"停机恢复的实际行为\">停机恢复的实际行为\u003c/h3>\n\u003cp>dispatch 不停止 tick，须按\u003ca href=\"#docs/operations/deployment.md::\">部署\u003c/a>覆盖所有 job/cron/实例。每小时规则积压 03:00 至 09:30：尝试 03:00 一次，04:00–09:00 计 missed，下次 10:00；ONCE 也无最大迟到拒绝。\u003c/p>\n\u003cp>_count_missed 单次最多 1000。迟到容忍/截止尚待 ONCE/CRON 产品策略，不临时补跑或改 occurrence。\u003c/p>\n\u003ch2 id=\"持久认领与结算\">持久认领与结算\u003c/h2>\n\u003cp>持久触发 → 普通幂等创建 → 幂等结算；不另建 Run/hash 或批量补未认领历史。\u003c/p>\n\u003ch3 id=\"认领记录与恢复权限\">认领记录与恢复权限\u003c/h3>\n\u003cp>认领原子验状态/候选/配置，保存原 actor/任务/规则/input/sources/UTC occurrence/key，再推进候选；唯一身份为 Schedule+UTC occurrence，编辑/接管不换键。\u003c/p>\n\u003cp>claim 保存 worker/token hash/generation/到期，非 RunAttempt；旧持有者不得晚到关联/结算。锁序为当前身份/Project → Schedule → occurrence → 普通 Run，Skill 解析锁外，快照/关联同事务。\u003c/p>\n\u003cp>恢复先授权/查原键，有 Run 即关联，无才验本调度其他在途/非终态再创建；创建事务重验 claim 和版本可用性。停用/废弃先提交则 FAILED_PRECONDITION，但须仍有 claim 才能结算；有原 Run 不重验今日可用性。普通入口不得用\u003ca href=\"#docs/design/run-creation.md::%E5%B9%82%E7%AD%89%E9%94%AE%E7%9A%84%E4%BD%9C%E7%94%A8%E5%9F%9F\">保留前缀\u003c/a>绕过关联/计数新建。\u003c/p>\n\u003ch3 id=\"配置并发与暂停\">配置并发与暂停\u003c/h3>\n\u003cp>编辑版本/状态/写入同一原子边界，核对条件 UPDATE 影响行数；row_version 不同于语义配置版本，tick 不算改输入。\u003c/p>\n\u003cp>暂停/归档阻止后续认领，不撤回已提交认领；旧 occurrence 用原配置/当前授权完成，不覆盖新定义/状态。公开版本修改须兼容旧客户端并同步消费者。\u003c/p>\n\u003ch3 id=\"结算计数与未知结果\">结算、计数与未知结果\u003c/h3>\n\u003cp>同 occurrence 幂等关联/结算，每 Run 只计一次、不等成功；晚结果补自身审计/数量，不回退新摘要。max_runs 原子留名额：确认无 Run 才释放，未知保留/查原键；编辑不清计数，上限不低于已用+占用。ONCE 一次机会不同于 CRON 额度耗尽。\u003c/p>\n\u003cp>基础设施错误不作 FAILED_PRECONDITION。默认 lease 60 秒、含首次最多 3 次认领，投影共用策略常量；到期原键接管，耗尽保留 PENDING/额度。人工处理/可配置策略未接，不自动释放、换键或强制重跑。\u003c/p>\n\u003ch3 id=\"历史兼容与实施顺序\">历史兼容与实施顺序\u003c/h3>\n\u003cp>0036 增 occurrence/configuration_version/occurrence_protocol。旧行/writer 默认 0，保留 last_*/run_count 不造历史；新创建显式 1。新 tick 遇到期旧行标 ERROR，编辑/恢复不能转换协议。\u003c/p>\n\u003cp>历史核对/迁移工具未实现；不得改 protocol、清数或归档重建冒充恢复。保留旧 Run/key/快照，历史可读不代表可发火。\u003c/p>\n\u003cp>发布前停全部 Run/Schedule writer、不混新旧 API/Worker；dispatch=false 不够。0036 排他锁下遇任一 occurrence/新协议 Schedule 拒绝降级，不删审计，也不证明更早迁移安全。\u003c/p>\n\u003ch2 id=\"实现与验收\">实现与验收\u003c/h2>\n\u003cp>入口见\u003ca href=\"#SKM/README.md::\">代码根 README\u003c/a>。\u003c/p>\n\u003cp>验收 ONCE/CRON/DST/跨时区同一绝对时刻、当前预览确认、编辑冲突保草稿、超过 100 条/任务失效可管理、A/B/C 间崩溃、同版竞争、暂停与旧回写、原键恢复/自身重叠、接管未知提交、跳过不耗创建额度及历史/混合版本。\u003c/p>\n\u003cp>时间单测、mock 创建和健康 tick 不证明真实事务/多 Worker/发火成功；专用 Project 另验实际 occurrence、停机迟到与 ERROR 恢复。\u003c/p>\n", "sections": [{"title": "TaskSchedule 设计", "level": "h1", "anchor": "taskschedule-设计", "text": "# TaskSchedule 设计\n\nSchedule 决定何时、以谁、哪份配置调用普通 [Run 创建](run-creation.md)，不是第二引擎。实现与缺口集中在[计划 R09](../planning/roadmap.md#r09-调度)。"}, {"title": "一页速览", "level": "h2", "anchor": "一页速览", "text": "## 一页速览\n\n| 概念 | 边界 |\n| --- | --- |\n| Schedule / Run | 前者存规则，每次成功触发创建独立 Run |\n| occurrence / 实际开始 | occurrence 是计划时刻，tick 与 Run 都可能晚到 |\n| 暂停 / 取消 | 暂停阻止后续认领，不撤回在途；已有 Run 单独取消 |\n| 幂等 / 恢复 | 原键抑制重复，持久 occurrence 保存原配置；有界恢复不承诺无限重试 |\n| 不批量补跑 / 不迟到 | 当前处理一个到期 occurrence，其余计 missed，无最大迟到拒绝 |"}, {"title": "一个例子：规则、触发与执行分别看", "level": "h2", "anchor": "一个例子规则触发与执行分别看", "text": "## 一个例子：规则、触发与执行分别看\n\n08:00 创建 A，A 等批准；09:00 同调度因重叠跳过。ACTIVE、last_run_at=09:00、last_outcome=SKIPPED_OVERLAP、last_run_id=A、run_count=1 可同时成立。\n\nlast_run_at 是回写的计划时刻，last_run_id 是最近成功关联，跳过不清空；run_count 计创建不计成功。last_* 可滞后/覆盖，不是触发账本。"}, {"title": "生命周期与发火", "level": "h2", "anchor": "生命周期与发火", "text": "## 生命周期与发火\n\n```text\n保存规则（仅 ACTIVE 参与 tick）\n  → TX A：认领 PENDING occurrence\n       冻结原配置 / lease\n       推进 next_run_at\n  → 当前授权 / 查询原键\n       无原 Run 才检查重叠和前置条件\n  → TX B：锁内复核当前授权与 claim\n       普通 Run 创建 / 原请求确认\n       同时关联、结算、更新摘要与计数\n已知无 Run：独立短事务结算\n```\n\n认领/创建分事务，A 后崩溃恢复原 PENDING；初始快照、事件/Outbox、关联同事务，commit 确认前不宣称成功。基础设施/提交未知保留记录，以原键确认，不造失败或退款。\n\nONCE/CRON 必填 IANA timezone、分钟粒度，共用[求值器](../../SKM/backend/src/skillmind/schedules/cron.py)。ONCE 一次；CRON 预览通常至少三次，受 end_at/max_runs 限制时不虚构。CRON 跳过 DST 缺失时刻、重复取首次；ONCE 规范到分钟，键用 UTC occurrence。\n\n状态为 ACTIVE/PAUSED/COMPLETED/ERROR/ARCHIVED；编辑保留状态，ERROR 修正后显式恢复，从当前时刻重算，不补暂停历史。COMPLETED 可有关联非终态 Run。"}, {"title": "保存和执行边界", "level": "h2", "anchor": "保存和执行边界", "text": "## 保存和执行边界\n\n| 项目 | 规则 |\n| --- | --- |\n| 任务/输入 | 保存精确 SkillVersion/task_key、input/sources 规则，不跟 latest；发火才冻结本次资源 |\n| 身份 | 发火前重新检查创建者有效性/Project 权限 |\n| 幂等 | Schedule ID + UTC occurrence；先查原 Run，再判断新建 |\n| 重叠 | 查同 Schedule 的全部 occurrence 关联 Run，非终态含等待均跳过 |\n| 失效 | FAILED_PRECONDITION / ERROR，修正后显式恢复，不换来源 |\n| 结束 | ONCE 一次机会；CRON 的 max_runs 是累计创建额度，跳过不消耗额度 |\n\n调度不绕批准/资源/审计；新 occurrence 冻结全集当时成员，单份/集合保持原 ID，重放不改快照。"}, {"title": "管理写入的授权事务", "level": "h3", "anchor": "管理写入的授权事务", "text": "### 管理写入的授权事务\n\n创建/编辑/状态写入经 ProjectWriteActor，并在事务复用[原会话校验](authentication.md#认证与业务提交不是同一个事务)。内部 UserAccess 保留原 cookie/CSRF/request UUID，不换会话、不改 HTTP。锁外解析 Skill/输入，写前重新授权。\n\n```text\nOrganization UPDATE → 当前 User SHARE → 原 AuthSession UPDATE\n  → Project SHARE → USER 的 ProjectMember SHARE\n  → 既有 Schedule UPDATE → 写入 / flush → 最终认证 → commit\n```\n\n创建不取既有 Schedule 锁；ADMIN 免 membership、不免组织/归档。取得业务锁及最终 flush 后用新时间验原 token/CSRF、角色、撤销、期限与当前成员：会话失效 401、CSRF 403、无权/不存在 404，已授权归档 409。\n\nUser SHARE 阻止停用/改角色并兼容 occurrence 外键锁，勿升级 UPDATE 造成与 Schedule 反向等待。CAS、状态、已用/占用额度在 Schedule 锁内检查；最终拒绝整体回滚，commit 未知不自动重发。此门禁不证明物理 commit 瞬间未过期或在途 Run 停止；发火用当前创建者/持久 claim，不依赖浏览器会话。\n\n创建/编辑/恢复 ACTIVE 在 CAS/状态检查后，[可用性门禁](skill-interpretation.md#resourcebinding-与-readiness)依次持有 SkillVersion/ProjectSkillVersion SHARE，验精确 PUBLISHED/未停用；不跟 latest，暂停/归档免可用性。SHARE 兼容 occurrence KEY SHARE。\n\ninput/sources 在首次 await 前复制，既有调度先验锁内版本；创建/编辑锁内重验文档元数据，不重新解释或读 blob。原 ID 缺失拒绝，不换同路径新文档；[删除门禁](document-lifecycle.md#删除事务与引用判定)保护当前规则及保留 occurrence。"}, {"title": "重叠检查到底看谁", "level": "h3", "anchor": "重叠检查到底看谁", "text": "### 重叠检查到底看谁\n\n先确认原 occurrence，无原 Run 才查同 Schedule 其他关联。每 Schedule 最多一个 PENDING，未结算不认领下一项，不补历史队列；不检查手动/其他 Schedule，不是全局锁。新建事务再次 fencing/验重叠，解析、物化、模型均在锁外。"}, {"title": "保存表单与触发预览", "level": "h2", "anchor": "保存表单与触发预览", "text": "## 保存表单与触发预览\n\nScheduleDialog 与即时执行共用输入组件，发送精确任务/input/sources，必需文档缺失或集合不完整拒绝保存。\n\n保存须当前 definition 的成功非空预览和人工确认；修改即清确认，A→B→A 也不收旧响应。预览仅发 definition，只验时间、不授权资源或创建 Run。\n\n关闭创建弹窗丢草稿；abort/超时非未保存证明。列表可核对当前事实，但无创建原键保证；同名/同配置/不可见均不证明原请求成败。"}, {"title": "保存后的管理入口", "level": "h3", "anchor": "保存后的管理入口", "text": "### 保存后的管理入口\n\n`#/schedules?project=\u003cid>` 独立于模块/TaskCatalog，默认全部状态。服务端 total/limit/offset 分页；q 对 name/task_key 做不区分大小写的字面子串查询，status 单选，created_at/ID 降序。count/items 非原子快照，矛盾须刷新；任务卡汇总读完后续页，遇总数变更/重复不宣称完整。\n\n详情匹配精确 SkillVersion/task；失效仍展示原配置，只读编辑并说明，不跟 latest。目录错误不冒充任务失效、不清列表；归档 Project 只读。编辑保留原来源/未改绝对时刻精度，不归档重建或清计数。\n\nPUT/状态操作携带用户看到的 expected_row_version。冲突并列原值、已发送内容、GET 当前值并保留草稿；人工采用新版本后重新预览确认再保存。未知不自动重发，GET 不证明原写成功；重开编辑保留未决、暂禁同目标其他写入，身份/Project/离页不承诺恢复，不持久存储正文。\n\n任一列表/详情/目录/在途读取的 401/403/404 关闭写入资格，旧成功不复权；共用防重/期限/晚到隔离。旧客户端缺版本为 422，须更新 Web，不补最新版本。字段见[契约](../../SKM/contracts/task-schedule/v1.schema.json)和 [OpenAPI](../../SKM/contracts/openapi/skillmind-api.v1.json)。"}, {"title": "在途只读核对", "level": "h3", "anchor": "在途只读核对", "text": "### 在途只读核对\n\nGET /projects/{project_id}/schedules/{schedule_id}/activity 按当前 Project 读权限查询，不因创建者/任务失效或暂停/归档隐藏待结算。父配置版本、单 PENDING、DB checked_at 来自同条 SELECT，不锁业务或触发修复。\n\n| 读取结果 | 含义 |\n| --- | --- |\n| TRACKED + pending | 显示原 UTC occurrence、原/当前配置版本、认领次数/自动上限和租约截止；不是 Run 执行状态 |\n| TRACKED + null | 本次读取未见 PENDING；不证明没有 Run、原触发成功或可以重发 |\n| LEGACY_UNAVAILABLE | 旧协议无法提供可靠在途追踪，不补空历史、不迁移旧数据 |\n| 读取失败 / 409 schedule_activity_unavailable | 保持未核实；损坏关联、快照或多 PENDING 不以第一条/空值掩盖 |\n\n按 checked_at 精确到微秒判到期；未到期非存活证明，到期/耗尽非停止/释放证明。接管不一定改父 row_version，须重新 GET，不按父版本缓存；刷新不复权或清未知意图。\n\n校验原快照/身份后才投影，不含正文/key/snapshot/hash/worker/token；非历史账本、原写回执或人工重试入口。旧 API 不支持则显示读取失败，保留独立详情。"}, {"title": "时间输入与展示的边界", "level": "h3", "anchor": "时间输入与展示的边界", "text": "### 时间输入与展示的边界\n\n| 边界 | 规则 |\n| --- | --- |\n| CRON | 按 definition.timezone 求值，未必是浏览器本地时间 |\n| ONCE/end_at 输入 | datetime-local 按明确标注的浏览器时区转绝对时刻；改规则 timezone 不改变输入时区 |\n| 预览/摘要 | 按规则时区显示 occurrence 与 UTC offset，不给本地文字拼上另一时区标签 |\n| API datetime | run_at/end_at 拒绝无 offset；旧已存绝对时刻不重新解释 |\n\n浏览器 UTC/规则东京：CRON 09:00 是 UTC 00:00，ONCE 输入 09:00 是东京 18:00。非法日期/DST 缺失拒绝，歧义须显式选 offset，不靠 Date 纠正；改输入时区须另定兼容。"}, {"title": "可靠性保证的限度", "level": "h2", "anchor": "可靠性保证的限度", "text": "## 可靠性保证的限度"}, {"title": "停机恢复的实际行为", "level": "h3", "anchor": "停机恢复的实际行为", "text": "### 停机恢复的实际行为\n\ndispatch 不停止 tick，须按[部署](../operations/deployment.md)覆盖所有 job/cron/实例。每小时规则积压 03:00 至 09:30：尝试 03:00 一次，04:00–09:00 计 missed，下次 10:00；ONCE 也无最大迟到拒绝。\n\n_count_missed 单次最多 1000。迟到容忍/截止尚待 ONCE/CRON 产品策略，不临时补跑或改 occurrence。"}, {"title": "持久认领与结算", "level": "h2", "anchor": "持久认领与结算", "text": "## 持久认领与结算\n\n持久触发 → 普通幂等创建 → 幂等结算；不另建 Run/hash 或批量补未认领历史。"}, {"title": "认领记录与恢复权限", "level": "h3", "anchor": "认领记录与恢复权限", "text": "### 认领记录与恢复权限\n\n认领原子验状态/候选/配置，保存原 actor/任务/规则/input/sources/UTC occurrence/key，再推进候选；唯一身份为 Schedule+UTC occurrence，编辑/接管不换键。\n\nclaim 保存 worker/token hash/generation/到期，非 RunAttempt；旧持有者不得晚到关联/结算。锁序为当前身份/Project → Schedule → occurrence → 普通 Run，Skill 解析锁外，快照/关联同事务。\n\n恢复先授权/查原键，有 Run 即关联，无才验本调度其他在途/非终态再创建；创建事务重验 claim 和版本可用性。停用/废弃先提交则 FAILED_PRECONDITION，但须仍有 claim 才能结算；有原 Run 不重验今日可用性。普通入口不得用[保留前缀](run-creation.md#幂等键的作用域)绕过关联/计数新建。"}, {"title": "配置并发与暂停", "level": "h3", "anchor": "配置并发与暂停", "text": "### 配置并发与暂停\n\n编辑版本/状态/写入同一原子边界，核对条件 UPDATE 影响行数；row_version 不同于语义配置版本，tick 不算改输入。\n\n暂停/归档阻止后续认领，不撤回已提交认领；旧 occurrence 用原配置/当前授权完成，不覆盖新定义/状态。公开版本修改须兼容旧客户端并同步消费者。"}, {"title": "结算、计数与未知结果", "level": "h3", "anchor": "结算计数与未知结果", "text": "### 结算、计数与未知结果\n\n同 occurrence 幂等关联/结算，每 Run 只计一次、不等成功；晚结果补自身审计/数量，不回退新摘要。max_runs 原子留名额：确认无 Run 才释放，未知保留/查原键；编辑不清计数，上限不低于已用+占用。ONCE 一次机会不同于 CRON 额度耗尽。\n\n基础设施错误不作 FAILED_PRECONDITION。默认 lease 60 秒、含首次最多 3 次认领，投影共用策略常量；到期原键接管，耗尽保留 PENDING/额度。人工处理/可配置策略未接，不自动释放、换键或强制重跑。"}, {"title": "历史兼容与实施顺序", "level": "h3", "anchor": "历史兼容与实施顺序", "text": "### 历史兼容与实施顺序\n\n0036 增 occurrence/configuration_version/occurrence_protocol。旧行/writer 默认 0，保留 last_*/run_count 不造历史；新创建显式 1。新 tick 遇到期旧行标 ERROR，编辑/恢复不能转换协议。\n\n历史核对/迁移工具未实现；不得改 protocol、清数或归档重建冒充恢复。保留旧 Run/key/快照，历史可读不代表可发火。\n\n发布前停全部 Run/Schedule writer、不混新旧 API/Worker；dispatch=false 不够。0036 排他锁下遇任一 occurrence/新协议 Schedule 拒绝降级，不删审计，也不证明更早迁移安全。"}, {"title": "实现与验收", "level": "h2", "anchor": "实现与验收", "text": "## 实现与验收\n\n入口见[代码根 README](../../SKM/README.md)。\n\n验收 ONCE/CRON/DST/跨时区同一绝对时刻、当前预览确认、编辑冲突保草稿、超过 100 条/任务失效可管理、A/B/C 间崩溃、同版竞争、暂停与旧回写、原键恢复/自身重叠、接管未知提交、跳过不耗创建额度及历史/混合版本。\n\n时间单测、mock 创建和健康 tick 不证明真实事务/多 Worker/发火成功；专用 Project 另验实际 occurrence、停机迟到与 ERROR 恢复。"}], "toc": [{"title": "一页速览", "anchor": "一页速览", "level": "h2"}, {"title": "一个例子：规则、触发与执行分别看", "anchor": "一个例子规则触发与执行分别看", "level": "h2"}, {"title": "生命周期与发火", "anchor": "生命周期与发火", "level": "h2"}, {"title": "保存和执行边界", "anchor": "保存和执行边界", "level": "h2"}, {"title": "管理写入的授权事务", "anchor": "管理写入的授权事务", "level": "h3"}, {"title": "重叠检查到底看谁", "anchor": "重叠检查到底看谁", "level": "h3"}, {"title": "保存表单与触发预览", "anchor": "保存表单与触发预览", "level": "h2"}, {"title": "保存后的管理入口", "anchor": "保存后的管理入口", "level": "h3"}, {"title": "在途只读核对", "anchor": "在途只读核对", "level": "h3"}, {"title": "时间输入与展示的边界", "anchor": "时间输入与展示的边界", "level": "h3"}, {"title": "可靠性保证的限度", "anchor": "可靠性保证的限度", "level": "h2"}, {"title": "停机恢复的实际行为", "anchor": "停机恢复的实际行为", "level": "h3"}, {"title": "持久认领与结算", "anchor": "持久认领与结算", "level": "h2"}, {"title": "认领记录与恢复权限", "anchor": "认领记录与恢复权限", "level": "h3"}, {"title": "配置并发与暂停", "anchor": "配置并发与暂停", "level": "h3"}, {"title": "结算、计数与未知结果", "anchor": "结算计数与未知结果", "level": "h3"}, {"title": "历史兼容与实施顺序", "anchor": "历史兼容与实施顺序", "level": "h3"}, {"title": "实现与验收", "anchor": "实现与验收", "level": "h2"}], "source": "design/task-scheduling.md", "checksum": "55035eb479107254d43326a3517672f7abbc77200822459cc27807c74e3206a5"}, {"id": "docs/design/subagents.md", "title": "并行子分析", "group": "design", "html": "\u003ch1 id=\"并行子分析\">并行子分析\u003c/h1>\n\u003cp>子分析不改变父 Run 的目标、主 Session 或审批链。额度见\u003ca href=\"#docs/design/run-budgets.md::\">预算\u003c/a>，停止见\u003ca href=\"#docs/design/run-supervision.md::\">监督\u003c/a>，状态见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>。\u003c/p>\n\u003ch2 id=\"责任与数据流\">责任与数据流\u003c/h2>\n\u003cp>PRIMARY 调用 subagent.dispatch/v1 → 多个只读子分析 → 结果/失败摘要与子 Session ID → Gateway 保存主 Session 的一条 ToolCall/Evidence → 返回主 Agent 汇总。\u003c/p>\n\u003cp>SUBAGENT/BRANCH 共用父 RunAttempt，不另写 RunEvent sequence；唯一活动限制仅针对 PRIMARY。\u003c/p>\n\u003ch2 id=\"一个例子完成的是哪一层\">一个例子：完成的是哪一层\u003c/h2>\n\u003cp>A 完成配置检查，B 读日志后失败，两支 Session 与 Gateway 审计都保存：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>看到什么\u003c/th>\n\u003cth>只说明什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Tool success\u003c/td>\n\u003ctd>整组符合返回协议，不是每支成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A COMPLETED / B FAILED\u003c/td>\n\u003ctd>仅 A 有有效结论，主结果保留 B 未完成的限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session 关闭\u003c/td>\n\u003ctd>生命周期已保存，不保证进程停/预算结清\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主 Run 仍执行\u003c/td>\n\u003ctd>主 Agent 还需综合证据与提交 Result\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Session 保存未知时，v1 仍须 Tool 错误，不省略必需 ID 或自动重跑补数据。\u003c/p>\n\u003ch2 id=\"能力与故障边界\">能力与故障边界\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/agent/subagent.py\">resolve_subagent_capabilities\u003c/a>唯一决定权限：不超父集合，排除 write/effect/propose/interaction/递归 dispatch；显式要求禁用能力则拒绝整组，不裁剪。\u003c/p>\n\u003cp>最多 4 支，各有 timeout，TaskGroup 持有全组并等取消清理。单支失败可留其余结论，审计失败则整组错误；coroutine 退出不证明进程停止。\u003c/p>\n\u003ch2 id=\"当前返回值的可信边界\">当前返回值的可信边界\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/agent/subagent_provider.py\">Provider\u003c/a>/\u003ca href=\"../SKM/backend/src/skillmind/agent/subagent_result.py\">收集器\u003c/a>的边界：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>边界\u003c/th>\n\u003cth>当前处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>终端/结果\u003c/td>\n\u003ctd>唯一有效终端、正常收尾后调用共享 ResultValidator；中途文字不是成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失败\u003c/td>\n\u003ctd>ENGINE_FAILED/SESSION_INTERRUPTED、非法等待/提案、空流、冲突终端或终端后事件拒绝；本支 deadline 为 TIMED_OUT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>身份/顺序\u003c/td>\n\u003ctd>验 Run/Attempt、SDK Session identity 与本支 sequence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session\u003c/td>\n\u003ctd>recorder/validator 必需；保存异常、ID 数量/格式错按 unavailable，不省略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>摘要\u003c/td>\n\u003ctd>已验证 summary，最多 20,000 字符；Gateway UTF-8 响应上限另验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未闭合部分\u003c/td>\n\u003ctd>子 prompt 仍继承父 Schema/Brief/checksum；budget 是分配值、cost 空，未接共享账本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>主/子虽共用清理入口，提交顺序不同。\u003c/p>\n\u003ch2 id=\"完成失败与审计如何表示\">完成、失败与审计如何表示\u003c/h2>\n\u003cp>COMPLETED 须有效终端/结果，不是无异常；失败保留安全原因/已知 Session identity，不用中途文本凑摘要。结论、审计、结清分别判断。\u003c/p>\n\u003cp>将来可版本化表达“结论有效但 Session 审计缺口”，v1 不支持，不伪造 ID 或降级预算保存。收费身份在启动前取得，不靠事后 Session 行补造。\u003c/p>\n\u003ch3 id=\"子任务指令与结果的边界\">子任务指令与结果的边界\u003c/h3>\n\u003cp>derive_child_context 只改 prompt/权限/Tool/局部额度；SDK 格式和 validator 仍用父 Schema，Brief/options checksum 仍属父配置。子任务可能被迫交完整父结果或丢规则，父 hash 不证明实际子指令。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目标责任\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>子指令\u003c/td>\n\u003ctd>从冻结来源派生，保留必需规则/出处，只收窄目标/能力；记录 dispatch/branch 与实际模型指令依据/checksum\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子输出\u003c/td>\n\u003ctd>平台版本化只读分析结果，表达结论/证据/未覆盖范围，不生成父全部交付或效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共享校验\u003c/td>\n\u003ctd>复用敏感信息/引用归属/结构校验，不复制宽松 validator 或接受模型自选 Schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主结果\u003c/td>\n\u003ctd>综合各支、保留失败/未知，仍满足原 OutcomeEnvelope/任务 Schema\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>子指令不另建 Run/Segment、不覆盖父 Brief。prompt、SDK 格式、validator、审计/汇总共用子契约版本；外形不变也须兼容审查，不先塞字段进 v1。\u003c/p>\n\u003ch3 id=\"提交顺序与版本兼容\">提交顺序与版本兼容\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">各支终端检查 → 关闭 stream → 结果校验\n  → 全组收束\n  → TX A：保存整组 Session\n  → Provider response / Evidence 草稿\n  → Gateway 引用/敏感信息/Schema/大小校验\n  → TX B：Tool response / Evidence → 主 Session\n\u003c/code>\u003c/pre>\n\u003cp>A 成功、B 失败可留 Session 而无成功 Tool，不删行/重跑，锁内不等模型。SDK UUID 非平台行 ID，格式不证明存在。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/contracts/tools/subagent.dispatch/v1/response.schema.json\">v1\u003c/a>要求每支 agent_session_id，保存失败拒绝；审计降级须新版本并同步所有消费者/历史。Tool 不省略，提交未知查原调用；Session 重放/取消/跨事务恢复尚缺。\u003c/p>\n\u003cp>主/子 Gateway 共用父 Worker \u003ca href=\"#docs/design/run-supervision.md::tool-%E8%B0%83%E7%94%A8%E7%9A%84%E6%8F%90%E4%BA%A4%E4%B8%8E%E9%87%8D%E6%94%BE\">原执行权\u003c/a>，未决 dispatch 不重启、B 未知不补失败；不代表 A 的 recorder 已有同等 fencing/停止回执。\u003c/p>\n\u003ch2 id=\"预算现状与修正设计\">预算现状与修正设计\u003c/h2>\n\u003cp>split_budget 每次重拆父 turns/output、不拆美元，分配非消费，Provider 未接账本。须按\u003ca href=\"#docs/design/run-budgets.md::%E5%8E%9F%E5%AD%90%E6%80%A7%E4%B8%8E%E9%87%8D%E5%A4%8D%E8%AF%B7%E6%B1%82\">预留协议\u003c/a>整组原子预留后启动、逐支结算/保留未知；主模型等 Tool 不释放承诺，账本不可用拒绝收费。\u003c/p>\n\u003ch2 id=\"开发接续顺序\">开发接续顺序\u003c/h2>\n\u003cp>先补停止/审计恢复和子指令版本，接通可信计量/统一预算后再开放新协议；保留既有终端/validator/Gateway/清理门禁，旧结果不改、权限额度不扩。\u003c/p>\n\u003ch2 id=\"验收\">验收\u003c/h2>\n\u003cp>覆盖缩权与显式禁止、空流/冲突终端/非法等待、部分失败、复杂父 Schema 的独立子产出、实际 prompt/options 身份、v1 ID 可查询、A/B 提交失败与不重跑、主子同时占用/连续 dispatch/未知费用。入口：\u003ca href=\"../SKM/backend/tests/agent/test_subagent_lifecycle.py\">Gateway 生命周期回归\u003c/a>；真实 DB、SDK 和模型汇总效果分别验收。\u003c/p>\n", "sections": [{"title": "并行子分析", "level": "h1", "anchor": "并行子分析", "text": "# 并行子分析\n\n子分析不改变父 Run 的目标、主 Session 或审批链。额度见[预算](run-budgets.md)，停止见[监督](run-supervision.md)，状态见[计划](../planning/roadmap.md)。"}, {"title": "责任与数据流", "level": "h2", "anchor": "责任与数据流", "text": "## 责任与数据流\n\nPRIMARY 调用 subagent.dispatch/v1 → 多个只读子分析 → 结果/失败摘要与子 Session ID → Gateway 保存主 Session 的一条 ToolCall/Evidence → 返回主 Agent 汇总。\n\nSUBAGENT/BRANCH 共用父 RunAttempt，不另写 RunEvent sequence；唯一活动限制仅针对 PRIMARY。"}, {"title": "一个例子：完成的是哪一层", "level": "h2", "anchor": "一个例子完成的是哪一层", "text": "## 一个例子：完成的是哪一层\n\nA 完成配置检查，B 读日志后失败，两支 Session 与 Gateway 审计都保存：\n\n| 看到什么 | 只说明什么 |\n| --- | --- |\n| Tool success | 整组符合返回协议，不是每支成功 |\n| A COMPLETED / B FAILED | 仅 A 有有效结论，主结果保留 B 未完成的限制 |\n| Session 关闭 | 生命周期已保存，不保证进程停/预算结清 |\n| 主 Run 仍执行 | 主 Agent 还需综合证据与提交 Result |\n\nSession 保存未知时，v1 仍须 Tool 错误，不省略必需 ID 或自动重跑补数据。"}, {"title": "能力与故障边界", "level": "h2", "anchor": "能力与故障边界", "text": "## 能力与故障边界\n\n[resolve_subagent_capabilities](../../SKM/backend/src/skillmind/agent/subagent.py)唯一决定权限：不超父集合，排除 write/effect/propose/interaction/递归 dispatch；显式要求禁用能力则拒绝整组，不裁剪。\n\n最多 4 支，各有 timeout，TaskGroup 持有全组并等取消清理。单支失败可留其余结论，审计失败则整组错误；coroutine 退出不证明进程停止。"}, {"title": "当前返回值的可信边界", "level": "h2", "anchor": "当前返回值的可信边界", "text": "## 当前返回值的可信边界\n\n[Provider](../../SKM/backend/src/skillmind/agent/subagent_provider.py)/[收集器](../../SKM/backend/src/skillmind/agent/subagent_result.py)的边界：\n\n| 边界 | 当前处理 |\n| --- | --- |\n| 终端/结果 | 唯一有效终端、正常收尾后调用共享 ResultValidator；中途文字不是成功 |\n| 失败 | ENGINE_FAILED/SESSION_INTERRUPTED、非法等待/提案、空流、冲突终端或终端后事件拒绝；本支 deadline 为 TIMED_OUT |\n| 身份/顺序 | 验 Run/Attempt、SDK Session identity 与本支 sequence |\n| Session | recorder/validator 必需；保存异常、ID 数量/格式错按 unavailable，不省略 |\n| 摘要 | 已验证 summary，最多 20,000 字符；Gateway UTF-8 响应上限另验 |\n| 未闭合部分 | 子 prompt 仍继承父 Schema/Brief/checksum；budget 是分配值、cost 空，未接共享账本 |\n\n主/子虽共用清理入口，提交顺序不同。"}, {"title": "完成、失败与审计如何表示", "level": "h2", "anchor": "完成失败与审计如何表示", "text": "## 完成、失败与审计如何表示\n\nCOMPLETED 须有效终端/结果，不是无异常；失败保留安全原因/已知 Session identity，不用中途文本凑摘要。结论、审计、结清分别判断。\n\n将来可版本化表达“结论有效但 Session 审计缺口”，v1 不支持，不伪造 ID 或降级预算保存。收费身份在启动前取得，不靠事后 Session 行补造。"}, {"title": "子任务指令与结果的边界", "level": "h3", "anchor": "子任务指令与结果的边界", "text": "### 子任务指令与结果的边界\n\nderive_child_context 只改 prompt/权限/Tool/局部额度；SDK 格式和 validator 仍用父 Schema，Brief/options checksum 仍属父配置。子任务可能被迫交完整父结果或丢规则，父 hash 不证明实际子指令。\n\n| 目标责任 | 要求 |\n| --- | --- |\n| 子指令 | 从冻结来源派生，保留必需规则/出处，只收窄目标/能力；记录 dispatch/branch 与实际模型指令依据/checksum |\n| 子输出 | 平台版本化只读分析结果，表达结论/证据/未覆盖范围，不生成父全部交付或效果 |\n| 共享校验 | 复用敏感信息/引用归属/结构校验，不复制宽松 validator 或接受模型自选 Schema |\n| 主结果 | 综合各支、保留失败/未知，仍满足原 OutcomeEnvelope/任务 Schema |\n\n子指令不另建 Run/Segment、不覆盖父 Brief。prompt、SDK 格式、validator、审计/汇总共用子契约版本；外形不变也须兼容审查，不先塞字段进 v1。"}, {"title": "提交顺序与版本兼容", "level": "h3", "anchor": "提交顺序与版本兼容", "text": "### 提交顺序与版本兼容\n\n```text\n各支终端检查 → 关闭 stream → 结果校验\n  → 全组收束\n  → TX A：保存整组 Session\n  → Provider response / Evidence 草稿\n  → Gateway 引用/敏感信息/Schema/大小校验\n  → TX B：Tool response / Evidence → 主 Session\n```\n\nA 成功、B 失败可留 Session 而无成功 Tool，不删行/重跑，锁内不等模型。SDK UUID 非平台行 ID，格式不证明存在。\n\n[v1](../../SKM/contracts/tools/subagent.dispatch/v1/response.schema.json)要求每支 agent_session_id，保存失败拒绝；审计降级须新版本并同步所有消费者/历史。Tool 不省略，提交未知查原调用；Session 重放/取消/跨事务恢复尚缺。\n\n主/子 Gateway 共用父 Worker [原执行权](run-supervision.md#tool-调用的提交与重放)，未决 dispatch 不重启、B 未知不补失败；不代表 A 的 recorder 已有同等 fencing/停止回执。"}, {"title": "预算现状与修正设计", "level": "h2", "anchor": "预算现状与修正设计", "text": "## 预算现状与修正设计\n\nsplit_budget 每次重拆父 turns/output、不拆美元，分配非消费，Provider 未接账本。须按[预留协议](run-budgets.md#原子性与重复请求)整组原子预留后启动、逐支结算/保留未知；主模型等 Tool 不释放承诺，账本不可用拒绝收费。"}, {"title": "开发接续顺序", "level": "h2", "anchor": "开发接续顺序", "text": "## 开发接续顺序\n\n先补停止/审计恢复和子指令版本，接通可信计量/统一预算后再开放新协议；保留既有终端/validator/Gateway/清理门禁，旧结果不改、权限额度不扩。"}, {"title": "验收", "level": "h2", "anchor": "验收", "text": "## 验收\n\n覆盖缩权与显式禁止、空流/冲突终端/非法等待、部分失败、复杂父 Schema 的独立子产出、实际 prompt/options 身份、v1 ID 可查询、A/B 提交失败与不重跑、主子同时占用/连续 dispatch/未知费用。入口：[Gateway 生命周期回归](../../SKM/backend/tests/agent/test_subagent_lifecycle.py)；真实 DB、SDK 和模型汇总效果分别验收。"}], "toc": [{"title": "责任与数据流", "anchor": "责任与数据流", "level": "h2"}, {"title": "一个例子：完成的是哪一层", "anchor": "一个例子完成的是哪一层", "level": "h2"}, {"title": "能力与故障边界", "anchor": "能力与故障边界", "level": "h2"}, {"title": "当前返回值的可信边界", "anchor": "当前返回值的可信边界", "level": "h2"}, {"title": "完成、失败与审计如何表示", "anchor": "完成失败与审计如何表示", "level": "h2"}, {"title": "子任务指令与结果的边界", "anchor": "子任务指令与结果的边界", "level": "h3"}, {"title": "提交顺序与版本兼容", "anchor": "提交顺序与版本兼容", "level": "h3"}, {"title": "预算现状与修正设计", "anchor": "预算现状与修正设计", "level": "h2"}, {"title": "开发接续顺序", "anchor": "开发接续顺序", "level": "h2"}, {"title": "验收", "anchor": "验收", "level": "h2"}], "source": "design/subagents.md", "checksum": "0c6c0e268194e681e6add4accfd2ef956e5e172ec12fdcdb5308d72390c827c2"}, {"id": "docs/design/workspace.md", "title": "Workspace 与 Web 交互", "group": "design", "html": "\u003ch1 id=\"workspace-与-web-交互\">Workspace 与 Web 交互\u003c/h1>\n\u003cp>任务中心选择“执行什么”，Workspace 观察“一次 Run”。本页负责布局与交互；提交协议见\u003ca href=\"#docs/design/run-creation.md::\">创建\u003c/a>、\u003ca href=\"#docs/design/user-interactions.md::\">答复\u003c/a>、\u003ca href=\"#docs/design/repository-effects.md::\">批准\u003c/a>、\u003ca href=\"#docs/design/results-evaluation.md::\">评价\u003c/a>。当前缺口统一见\u003ca href=\"#docs/planning/roadmap.md::r10-%E5%85%A8%E9%83%A8-web-%E9%A1%B5%E9%9D%A2\">计划 R10\u003c/a>。\u003c/p>\n\u003ch2 id=\"设计原则\">设计原则\u003c/h2>\n\u003cp>等待/批准有持久待办入口，服务端筛选而非只查首页；关窗不丢待办，等待释放 lease 但有独立期限。技术终态、业务完整性、引用与人工判断分开，子分析失败显示未覆盖范围；不虚构进度或外部成功。\u003c/p>\n\u003ch2 id=\"信息架构\">信息架构\u003c/h2>\n\u003ch3 id=\"导航层级\">导航层级\u003c/h3>\n\u003cp>平台入口不依赖项目选择；\u003ca href=\"#docs/design/user-lifecycle.md::\">账户\u003c/a>分本人安全与 ADMIN 用户管理，登录属于 App 状态而非 hash 页面。项目内按下表导航；Composition 的 module/role/task_group 只影响展示，不授予权限。\u003c/p>\n\u003ch3 id=\"路由\">路由\u003c/h3>\n\u003cp>现有 \u003ca href=\"../SKM/web/src/lib/routing.ts\">routing.ts\u003c/a>：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>hash\u003c/th>\n\u003cth>职责\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>#/\u003c/code>\u003c/td>\n\u003ctd>概览与待办\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/skills\u003c/code>、\u003ccode>#/projects\u003c/code>\u003c/td>\n\u003ctd>组织技能、项目管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/accounts\u003c/code>\u003c/td>\n\u003ctd>本人账户与安全、ADMIN 用户管理；不携带 Project/Run/Task 或账户搜索参数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/tasks?project=\u0026lt;id\u0026gt;\u003c/code>\u003c/td>\n\u003ctd>任务、Preflight、创建调度与任务汇总\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/schedules?project=\u0026lt;id\u0026gt;\u003c/code>\u003c/td>\n\u003ctd>项目全部调度的分页、筛选、详情与原配置管理，不受 module 筛选影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/workspace?project=\u0026lt;id\u0026gt;\u0026amp;run=\u0026lt;id\u0026gt;\u003c/code>\u003c/td>\n\u003ctd>单 Run；task 参数可定位新任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/history?project=\u0026lt;id\u0026gt;\u003c/code>\u003c/td>\n\u003ctd>项目历史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/documents?project=\u0026lt;id\u0026gt;\u003c/code>、\u003ccode>#/resources?project=\u0026lt;id\u0026gt;\u003c/code>\u003c/td>\n\u003ctd>文档、Integration/Secret/Binding/预授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Interaction/Result 无独立 path。按\u003ca href=\"#docs/design/project-lifecycle.md::%E9%A1%B9%E7%9B%AE%E9%80%89%E6%8B%A9%E4%B8%8E%E5%A4%B1%E6%95%88%E9%93%BE%E6%8E%A5\">项目选择\u003c/a>验证精确目标：无效链接不换项目，读取未确认不挂载业务页，平台入口仍可用。切换项目清除旧 Run/Task 参数，刷新/返回重验原 URL；列表失败、详情可读和归档分别显示。\u003c/p>\n\u003cp>窄屏菜单保留全部入口、项目选择、语言与退出；收起内容不可 Tab，Escape/选择后关闭并恢复焦点。\u003c/p>\n\u003cp>\u003ca href=\"#docs/design/project-lifecycle.md::%E6%88%90%E5%91%98%E7%AE%A1%E7%90%86%E9%A1%B5%E9%9D%A2\">成员页\u003c/a>与账户共用防重、期限和旧响应隔离，成员关系不等于账户状态。项目 CRUD 共用写入门禁；\u003ca href=\"#docs/design/project-lifecycle.md::%E5%B9%B6%E5%8F%91%E4%BF%AE%E6%94%B9%E4%B8%8D%E8%83%BD%E5%8F%AA%E7%9C%8B%E6%9C%89%E6%97%A0%E8%A1%8C%E9%94%81\">冲突/未知\u003c/a>保留原值、草稿和当前值，人工采用版本不自动提交。平台创建不依赖选中项目，默认选择到达不清空草稿。\u003c/p>\n\u003cp>\u003ca href=\"#docs/design/skill-contract.md::%E5%85%B1%E4%BA%AB%E6%9B%B4%E6%96%B0%E4%B8%8E%E5%88%A0%E9%99%A4%E7%9A%84%E5%8C%BA%E5%88%AB\">Module 共享配置/解绑\u003c/a>仅 ADMIN 可写；client 核对原 Project/module 和成功状态。错身份、坏响应、断连或取消均不证明回滚，不自动重试；管理页的完整未知隔离仍待接续。\u003c/p>\n\u003ch3 id=\"工作空间布局\">工作空间布局\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">项目/模块上下文\n├── 辅助区：新建执行、历史\n└── 当前 Run：状态、取消、等待\n    ├── Conversation / Result / Events\n    └── Evidence / Interaction / Proposal\n\u003c/code>\u003c/pre>\n\u003cp>窄屏收起辅助区仍保留状态/待办/结果，源码见 \u003ca href=\"../SKM/web/src/pages/WorkspacePage.tsx\">WorkspacePage\u003c/a>。\u003c/p>\n\u003ch2 id=\"渲染模式\">渲染模式\u003c/h2>\n\u003cp>standard 读取 Blueprint、可选输入 Schema 与 Outcome；assisted 不保证独立 renderer。缺 ViewSpec 不阻止任务，generated 尚无执行链路。\u003c/p>\n\u003ch2 id=\"viewspec-v1alpha1\">ViewSpec v1alpha1\u003c/h2>\n\u003cp>ViewSpec 不授予能力或权限；字段见 \u003ca href=\"../SKM/contracts/view-spec/v1alpha1.schema.json\">Schema\u003c/a>。新增组件/actions 须同步 validator/renderer，合法声明不等于行为已实现。\u003c/p>\n\u003ch3 id=\"合法结构示例\">合法结构示例\u003c/h3>\n\u003cp>以下仅示范合法结构；schema_ref 还须在发布上下文解析。\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \u0026quot;view_version\u0026quot;: \u0026quot;skillmind.view/v1alpha1\u0026quot;,\n  \u0026quot;key\u0026quot;: \u0026quot;standard-report\u0026quot;,\n  \u0026quot;title\u0026quot;: \u0026quot;分析结果\u0026quot;,\n  \u0026quot;mode\u0026quot;: \u0026quot;report\u0026quot;,\n  \u0026quot;input\u0026quot;: {\n    \u0026quot;schema_ref\u0026quot;: \u0026quot;schemas/input.json\u0026quot;,\n    \u0026quot;layout\u0026quot;: [{\u0026quot;component\u0026quot;: \u0026quot;schema-form\u0026quot;, \u0026quot;width\u0026quot;: 12}]\n  },\n  \u0026quot;preflight\u0026quot;: {\n    \u0026quot;sections\u0026quot;: [\u0026quot;selected_sources\u0026quot;, \u0026quot;automatic_tools\u0026quot;, \u0026quot;hard_denies\u0026quot;, \u0026quot;limits\u0026quot;]\n  },\n  \u0026quot;result\u0026quot;: {\n    \u0026quot;sections\u0026quot;: [\n      {\u0026quot;component\u0026quot;: \u0026quot;summary\u0026quot;, \u0026quot;pointer\u0026quot;: \u0026quot;/summary\u0026quot;},\n      {\u0026quot;component\u0026quot;: \u0026quot;evidence-panel\u0026quot;, \u0026quot;source\u0026quot;: \u0026quot;evidence_refs\u0026quot;}\n    ]\n  },\n  \u0026quot;actions\u0026quot;: [\u0026quot;run.execute\u0026quot;, \u0026quot;run.cancel\u0026quot;]\n}\n\u003c/code>\u003c/pre>\n\u003cp>JSON Pointer 仅读当前授权输入/结果；缺字段空状态，无任意表达式。未知 component/action 拒绝；未声明可回退，声明无效按发布 gate 处理。\u003c/p>\n\u003ch2 id=\"现行组件与声明组件\">现行组件与声明组件\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/web/src/components/TaskLaunchFields.tsx\">TaskLaunchFields\u003c/a>/taskDraft 共用于立即执行和调度，有 Schema 使用 SchemaTaskInput；能力/资源/权限 UI 不是任意声明协议。\u003c/p>\n\u003cp>Conversation、Session、Interaction、Proposal 由平台负责，Task Center 不另建 SSE/取消状态机。按\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a>区分 RUNNING/已物化、取消受理/进程退出/用量结清。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/web/src/components/RunResultPanel.tsx\">RunResultPanel\u003c/a>呈现结果/证据/评价；\u003ca href=\"#docs/design/task-flow.md::\">Flow\u003c/a>只观察，新增 ViewSpec 组件先扩契约。\u003c/p>\n\u003ch2 id=\"任务启动与执行\">任务启动与执行\u003c/h2>\n\u003cp>Preflight 显示精确版本/Task、输入、资源与 readiness，创建时服务端重验。DocumentSourceField 共用显式单份/集合/全集选择，可选未选省略；候选变化不覆盖草稿。\u003c/p>\n\u003cp>草稿与已发送 payload/key 分开；\u003ca href=\"#docs/design/run-creation.md::%E6%8F%90%E4%BA%A4%E7%BB%93%E6%9E%9C%E6%9C%AA%E7%9F%A5%E6%97%B6%E7%9A%84%E7%95%8C%E9%9D%A2%E8%B4%A3%E4%BB%BB\">创建未知\u003c/a>先确认原请求，关窗保留待确认项，刷新/离页不承诺恢复。创建后按 Run ID 读 detail/SSE，以持久 sequence 重放，TEXT_DELTA 不推进 cursor。\u003c/p>\n\u003cp>\u003ca href=\"#docs/design/resource-snapshots.md::\">冻结资源\u003c/a>不能中途换绑，变化须新 Run；文档槽位物化为 Run 级并集，不是槽位私有目录。\u003c/p>\n\u003ch2 id=\"结果与人工评价\">结果与人工评价\u003c/h2>\n\u003cp>摘要、交付、Findings、Evidence、限制、Proposal/Effect、Evaluation 分区；confidence 不是正确率。附件按同 Project/Run 发布索引区分采用/未采用，无保存记录不可下载；保持保存时 v1/v2 原义，字节与请求校验见\u003ca href=\"#docs/design/results-evaluation.md::%E5%8F%AF%E4%BF%A1%E9%99%84%E4%BB%B6%E7%9A%84%E5%8F%91%E5%B8%83%E4%B8%8E%E8%AF%BB%E5%8F%96\">可信附件\u003c/a>。\u003c/p>\n\u003cp>RunDocumentSnapshots 无 Result 也展示冻结槽位/模式/成员；FROZEN 不代表已物化或可下载。缺失/损坏与合法空数组分开，不拿当前目录补历史，长 ID/hash 局部换行或滚动。\u003c/p>\n\u003ch3 id=\"evaluation\">Evaluation\u003c/h3>\n\u003cp>原值、修订、理由与分页历史并列；多修订不自动合并或续行，null 与不存在分开。按\u003ca href=\"#docs/design/results-evaluation.md::%E6%8F%90%E4%BA%A4%E6%9C%AA%E7%9F%A5%E4%B8%8E%E7%95%8C%E9%9D%A2%E8%B4%A3%E4%BB%BB\">评价界面责任\u003c/a>保留草稿及原键/内容；未知只读确认或人工原样重发，相似历史不证明原提交。归档只读，换身份/结果不迁移动作。\u003c/p>\n\u003ch2 id=\"task-center\">Task Center\u003c/h2>\n\u003cp>列表采用服务端 task_id/latest_run 和精确版本，不从 UUID/最近历史推导；支持执行与 Schedule 管理，不提供任意 Task 编辑/复制、对话建 Task 或结果比较。\u003c/p>\n\u003cp>\u003ca href=\"#docs/design/task-flow.md::%E5%8F%AA%E8%AF%BB%E4%BB%BB%E5%8A%A1%E9%A2%84%E8%A7%88\">只读预览\u003c/a>展示单 Task，分开任务声明、Skill 共享要求、来源与全蓝图 readiness；未评估不显示“无需资源”，不启动 Run 或猜步骤状态。\u003c/p>\n\u003cp>ScheduleDialog 共用输入/文档字段；关闭创建销毁未保存草稿，切换 actor/Project 隔离旧响应。独立\u003ca href=\"#docs/design/task-scheduling.md::%E4%BF%9D%E5%AD%98%E5%90%8E%E7%9A%84%E7%AE%A1%E7%90%86%E5%85%A5%E5%8F%A3\">调度管理\u003c/a>使用服务端分页/筛选，失效精确任务仍可读、不跟随 latest。冲突/未知保留原请求与草稿，人工采用版本后继续，重开不绕门禁，读取拒绝即关闭写入。\u003c/p>\n\u003cp>\u003ca href=\"#docs/design/task-scheduling.md::%E5%9C%A8%E9%80%94%E5%8F%AA%E8%AF%BB%E6%A0%B8%E5%AF%B9\">在途核对\u003c/a>分开读取时刻、配置版本、认领/租约，旧协议/失败/未见 PENDING 不混同；刷新不重发。预览不造 Run 或限额外次数，浏览器时区不等于规则 timezone。暂停不撤回已认领项，lease 到期不证明停止，run_count 非成功数，last_* 未必同次；不承诺全局串行或 exactly-once。\u003c/p>\n\u003ch2 id=\"对话与调整\">对话与调整\u003c/h2>\n\u003cp>普通答复、外部批准、Skill 调整各走独立协议；终态新目标建新 Run，不自动建 child 关系或开放自然语言管理。\u003c/p>\n\u003ch3 id=\"普通答复与续行状态\">普通答复与续行状态\u003c/h3>\n\u003cp>InteractionCard 由有 Project 写权成员回答文本/选项，不换绑资源或套用批准身份。共享防重/期限/旧响应隔离，保留草稿与原请求；切标签、刷新或转历史不丢待确认意图。\u003c/p>\n\u003cp>按\u003ca href=\"#docs/design/user-interactions.md::\">用户交互\u003c/a>区分发送/确认/冲突/过期/未知：410 可能已追加 Segment，GET 不证明原 POST 成功；人工原键/内容确认也可能完成首次提交。推荐不自动提交，required=false 不虚构跳过，悬空批准只读。\u003c/p>\n\u003ch3 id=\"审批请求与执行结果\">审批请求与执行结果\u003c/h3>\n\u003cp>批准卡片在 RunResultPanel，PendingActionsPanel 只发现待办；提交精确 version/checksum/decision/reason，仅 Run 发起人或 ADMIN 可批。\u003c/p>\n\u003cp>当前点击会换 key；目标按\u003ca href=\"#docs/design/repository-effects.md::\">效果契约\u003c/a>保留原 payload/key、先核对未知，新理由/相反决定不占原键。发送/abort 不等于撤销，APPROVED 不等于外部成功。换 actor/Project/Proposal 和刷新须隔离旧动作，不持久保存正文/token，也不按错误码猜远端阶段。\u003c/p>\n\u003ch2 id=\"项目文档管理的职责\">项目文档管理的职责\u003c/h2>\n\u003cp>文档页管当前资产，Task 管草稿选择，Run 管冻结事实。目录上传非整批事务，HTML 禁脚本不等于断网，列表消失不等于字节/备份清除；协议见\u003ca href=\"#docs/design/document-lifecycle.md::\">文档设计\u003c/a>。\u003c/p>\n\u003ch2 id=\"生成展示与流程的交接\">生成展示与流程的交接\u003c/h2>\n\u003cp>\u003ca href=\"#docs/design/generated-modules.md::\">生成模块\u003c/a>负责 builder/CSP/Host/展示回退，不复用业务 module API 或文档 iframe，失败不切业务版本。\u003ca href=\"#docs/design/task-flow.md::\">Flow\u003c/a>负责计划/事实投影；未完成链路不由本页补造。\u003c/p>\n\u003ch2 id=\"可访问性国际化与隐私\">可访问性、国际化与隐私\u003c/h2>\n\u003cp>zh/ja/en 与用户偏好共用 catalog，report_language 独立。状态不能只靠颜色，键盘/焦点/窄屏/长内容可用；正文不入遥测，不宣称任意输出已统一清洗。\u003c/p>\n\u003ch2 id=\"回归验收\">回归验收\u003c/h2>\n\u003cul>\n\u003cli>精确任务/版本、有无 Schema、文档显式范围/历史损坏分别验证；创建未知保留原身份。\u003c/li>\n\u003cli>资产部分成功/未知/换 context，调度分页/失效任务/版本冲突/时区用真实组件验。\u003c/li>\n\u003cli>SSE 重连不重复、terminal 后结束；普通答复/批准/Evaluation 不互借幂等保证，原结果不变。\u003c/li>\n\u003cli>关闭弹窗仍有待办；410/未知/晚到与跨 actor 响应可解释，子分析失败范围不隐瞒。\u003c/li>\n\u003cli>三语、键盘、窄屏/长内容与焦点浏览器验收；Flow/generated 另走专项门禁。\u003c/li>\n\u003c/ul>\n\u003cp>实现与同步见\u003ca href=\"#SKM/README.md::web\">代码 README\u003c/a>、\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>。\u003c/p>\n", "sections": [{"title": "Workspace 与 Web 交互", "level": "h1", "anchor": "workspace-与-web-交互", "text": "# Workspace 与 Web 交互\n\n任务中心选择“执行什么”，Workspace 观察“一次 Run”。本页负责布局与交互；提交协议见[创建](run-creation.md)、[答复](user-interactions.md)、[批准](repository-effects.md)、[评价](results-evaluation.md)。当前缺口统一见[计划 R10](../planning/roadmap.md#r10-全部-web-页面)。"}, {"title": "设计原则", "level": "h2", "anchor": "设计原则", "text": "## 设计原则\n\n等待/批准有持久待办入口，服务端筛选而非只查首页；关窗不丢待办，等待释放 lease 但有独立期限。技术终态、业务完整性、引用与人工判断分开，子分析失败显示未覆盖范围；不虚构进度或外部成功。"}, {"title": "信息架构", "level": "h2", "anchor": "信息架构", "text": "## 信息架构"}, {"title": "导航层级", "level": "h3", "anchor": "导航层级", "text": "### 导航层级\n\n平台入口不依赖项目选择；[账户](user-lifecycle.md)分本人安全与 ADMIN 用户管理，登录属于 App 状态而非 hash 页面。项目内按下表导航；Composition 的 module/role/task_group 只影响展示，不授予权限。"}, {"title": "路由", "level": "h3", "anchor": "路由", "text": "### 路由\n\n现有 [routing.ts](../../SKM/web/src/lib/routing.ts)：\n\n| hash | 职责 |\n| --- | --- |\n| `#/` | 概览与待办 |\n| `#/skills`、`#/projects` | 组织技能、项目管理 |\n| `#/accounts` | 本人账户与安全、ADMIN 用户管理；不携带 Project/Run/Task 或账户搜索参数 |\n| `#/tasks?project=\u003cid>` | 任务、Preflight、创建调度与任务汇总 |\n| `#/schedules?project=\u003cid>` | 项目全部调度的分页、筛选、详情与原配置管理，不受 module 筛选影响 |\n| `#/workspace?project=\u003cid>\u0026run=\u003cid>` | 单 Run；task 参数可定位新任务 |\n| `#/history?project=\u003cid>` | 项目历史 |\n| `#/documents?project=\u003cid>`、`#/resources?project=\u003cid>` | 文档、Integration/Secret/Binding/预授权 |\n\nInteraction/Result 无独立 path。按[项目选择](project-lifecycle.md#项目选择与失效链接)验证精确目标：无效链接不换项目，读取未确认不挂载业务页，平台入口仍可用。切换项目清除旧 Run/Task 参数，刷新/返回重验原 URL；列表失败、详情可读和归档分别显示。\n\n窄屏菜单保留全部入口、项目选择、语言与退出；收起内容不可 Tab，Escape/选择后关闭并恢复焦点。\n\n[成员页](project-lifecycle.md#成员管理页面)与账户共用防重、期限和旧响应隔离，成员关系不等于账户状态。项目 CRUD 共用写入门禁；[冲突/未知](project-lifecycle.md#并发修改不能只看有无行锁)保留原值、草稿和当前值，人工采用版本不自动提交。平台创建不依赖选中项目，默认选择到达不清空草稿。\n\n[Module 共享配置/解绑](skill-contract.md#共享更新与删除的区别)仅 ADMIN 可写；client 核对原 Project/module 和成功状态。错身份、坏响应、断连或取消均不证明回滚，不自动重试；管理页的完整未知隔离仍待接续。"}, {"title": "工作空间布局", "level": "h3", "anchor": "工作空间布局", "text": "### 工作空间布局\n\n```text\n项目/模块上下文\n├── 辅助区：新建执行、历史\n└── 当前 Run：状态、取消、等待\n    ├── Conversation / Result / Events\n    └── Evidence / Interaction / Proposal\n```\n\n窄屏收起辅助区仍保留状态/待办/结果，源码见 [WorkspacePage](../../SKM/web/src/pages/WorkspacePage.tsx)。"}, {"title": "渲染模式", "level": "h2", "anchor": "渲染模式", "text": "## 渲染模式\n\nstandard 读取 Blueprint、可选输入 Schema 与 Outcome；assisted 不保证独立 renderer。缺 ViewSpec 不阻止任务，generated 尚无执行链路。"}, {"title": "ViewSpec v1alpha1", "level": "h2", "anchor": "viewspec-v1alpha1", "text": "## ViewSpec v1alpha1\n\nViewSpec 不授予能力或权限；字段见 [Schema](../../SKM/contracts/view-spec/v1alpha1.schema.json)。新增组件/actions 须同步 validator/renderer，合法声明不等于行为已实现。"}, {"title": "合法结构示例", "level": "h3", "anchor": "合法结构示例", "text": "### 合法结构示例\n\n以下仅示范合法结构；schema_ref 还须在发布上下文解析。\n\n```json\n{\n  \"view_version\": \"skillmind.view/v1alpha1\",\n  \"key\": \"standard-report\",\n  \"title\": \"分析结果\",\n  \"mode\": \"report\",\n  \"input\": {\n    \"schema_ref\": \"schemas/input.json\",\n    \"layout\": [{\"component\": \"schema-form\", \"width\": 12}]\n  },\n  \"preflight\": {\n    \"sections\": [\"selected_sources\", \"automatic_tools\", \"hard_denies\", \"limits\"]\n  },\n  \"result\": {\n    \"sections\": [\n      {\"component\": \"summary\", \"pointer\": \"/summary\"},\n      {\"component\": \"evidence-panel\", \"source\": \"evidence_refs\"}\n    ]\n  },\n  \"actions\": [\"run.execute\", \"run.cancel\"]\n}\n```\n\nJSON Pointer 仅读当前授权输入/结果；缺字段空状态，无任意表达式。未知 component/action 拒绝；未声明可回退，声明无效按发布 gate 处理。"}, {"title": "现行组件与声明组件", "level": "h2", "anchor": "现行组件与声明组件", "text": "## 现行组件与声明组件\n\n[TaskLaunchFields](../../SKM/web/src/components/TaskLaunchFields.tsx)/taskDraft 共用于立即执行和调度，有 Schema 使用 SchemaTaskInput；能力/资源/权限 UI 不是任意声明协议。\n\nConversation、Session、Interaction、Proposal 由平台负责，Task Center 不另建 SSE/取消状态机。按[执行监督](run-supervision.
