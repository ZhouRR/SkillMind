\u003cli>实 DB 验证成员加入/禁用、归档/Run/Schedule/删除竞争、版本冲突与审计回滚。\u003c/li>\n\u003cli>明确无效链接不换目标；无参数/空项目正常进入，切换和同 tick 双提交不消费旧结果。\u003c/li>\n\u003cli>ARCHIVED 无 Run 但有 Schedule 明确拒绝，无部分删除；真空项目删除与附件失败保持真实语义。\u003c/li>\n\u003cli>三语、键盘、窄屏用真实组件验；不对用户项目执行删除探针，真实 DB 必须专用授权。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "项目、成员与归档边界", "level": "h1", "anchor": "项目成员与归档边界", "text": "# 项目、成员与归档边界\n\n本页负责项目身份、成员、选择、归档与删除；账户、Run 停止、资产清理分别见[认证](authentication.md)、[执行监督](run-supervision.md)、[文档资产](document-lifecycle.md)。现有缺口见[计划 R05](../planning/roadmap.md#r05-领域与身份安全)。"}, {"title": "一个例子：归档不是停止或删除", "level": "h2", "anchor": "一个例子归档不是停止或删除", "text": "## 一个例子：归档不是停止或删除\n\n项目 P 归档后不再出现在默认活动列表，新建 Run/回答/批准被拒绝；授权历史仍可读，已有 Run、成员、Schedule、附件不会一起停止或删除。恢复复用原 ID/key/配置，但不恢复已移除成员、不自动恢复 ERROR Schedule 或补跑错过触发。\n\n停止执行、移除成员、归档、物理删除分别操作；归档成功不是进程已停止的证明。"}, {"title": "项目身份与成员资格", "level": "h2", "anchor": "项目身份与成员资格", "text": "## 项目身份与成员资格\n\n| 对象 | 含义 |\n| --- | --- |\n| Project | organization_id 隔离，project_id 是身份；组织内 key 唯一，归档仍占 key |\n| ProjectMember | ACTIVE/REMOVED 关系，无 Project ADMIN/OWNER 角色 |\n| User | 组织账户 ACTIVE/DISABLED、ADMIN/USER；建账户不自动入项目 |\n| ProjectSkillVersion | 精确版本启用，不授予成员或系统权限 |\n\n本组织 ADMIN 不依赖 membership，移除其成员关系不会撤销 ADMIN 权限；跨组织仍拒绝。USER 后续请求重验账户/会话及 ACTIVE 关系，不改写旧 Run actor/权限/结果，也不承诺已有 SSE 立即结束。"}, {"title": "成员管理的现状与目标", "level": "h3", "anchor": "成员管理的现状与目标", "text": "### 成员管理的现状与目标\n\nADMIN API 可列出/添加同组织 ACTIVE 用户/移除成员；列表含两种关系状态，无分页和独立用户状态，不把 membership ACTIVE 显示成账户已启用。响应使用公开字段白名单与 no-store。\n\n重新添加 REMOVED 复用行并刷新 joined_at；重复添加 ACTIVE 返回原行，不追加事件；重复移除为 404。移除账户已停用用户的关系仍允许，不改变账户本身。\n\n成员写入复用[用户事务](user-lifecycle.md#事务与并发)的 Organization → User（actor/target 去重排序）→ 原 AuthSession，再锁 Project → ProjectMember。锁后与 flush 后以新时刻复查原会话、ADMIN 和 CSRF；目标账户在持锁状态下检查 ACTIVE，锁保持到提交。偏好写入和项目删除也先取同一 Organization gate，避免 User → Project 引用与 Project → User 清理形成反向锁环。这不是全站授权或真实并发验收的证明。\n\n关系变化与 project_member_events 一起提交或回滚：保存组织/项目/关系/目标/actor ID、ADDED/REMOVED、前后 status/joined_at、服务器生成 request UUID 与时间，不记录密码或任意正文。0033 只记录新操作，不由现有关系补造旧历史；有任何事件即拒绝降级丢表。request UUID 不是幂等键，当前没有成员审计查询 API，当前关系与原操作结果须区分。"}, {"title": "成员管理页面", "level": "h3", "anchor": "成员管理页面", "text": "### 成员管理页面\n\n项目管理的成员页签仅向 ADMIN 提供；以精确已授权项目为边界，归档项目可读/移除但不可添加。候选复用组织账户的服务端搜索和分页，显示账户角色/状态，停用账户不可添加，不过滤第一页冒充全量。成员列表单独标明关系状态与 ADMIN 权限例外。\n\n添加、重新添加和移除先确认原项目/用户，每次只允许一个写请求。超时、中断、断连或成功响应损坏均为结果未知，不自动重放，也不把当前关系符合目标解释为原请求成功。用户显式重读原成员列表与精确账户、两项均成功后才能人工解除新写门禁；解除不执行原动作。切换页签或同项目资格刷新保留未知状态，重新确认资格期间暂停交互并中断在途写为未知；换 actor/项目或离页不迁移旧请求，页面不承诺跨刷新恢复。"}, {"title": "项目选择与失效链接", "level": "h2", "anchor": "项目选择与失效链接", "text": "## 项目选择与失效链接\n\npreference 只是上次选择，不是授权。服务端只返回当前可访问的 ACTIVE preference，否则 null，不保证立即清掉旧引用；删项目才显式清理。\n\n| 进入方式 | 要求 |\n| --- | --- |\n| URL 无项目 | 可选有效 preference、活动首项；无项目时保留平台入口 |\n| URL 明确无效/无权项目 | 保留目标、统一不可访问，不静默换项目或暴露原因差异 |\n| 主动切换或当前资格失效 | 确认/隔离旧草稿，阻止新提交，丢弃旧响应；不迁移未知写请求 |\n\n[App](../../PJM/web/src/App.tsx)通过 [useProjectContext](../../PJM/web/src/hooks/useProjectContext.ts)分开读取活动列表、偏好与精确项目详情。空值、重复参数及非法 UUID 不是“未指定”；授权与不存在统一提示，不展示服务器内部原因。首次无参数可以选有效偏好或活动首项，一旦目标确定，列表变化、归档或重新读取都不把它换成别的项目。\n\n进入另一个页面、切换目标或重新读取时，详情未确认前不挂载项目业务页面；平台入口保留。每次读取有独立身份与等待上限，返回曾访问过的 ID 也不能复用旧授权结果。主动切换清除旧 Run/Task 参数并隔离原页面；未知写入不自动迁移或重放。只有已确认 ACTIVE 的项目保存为偏好。\n\n详情成功不代表列表也成功：列表失败仍提示并可重新读取，授权归档详情仍可显示。偏好失败不丢掉成功列表。上述检查不替代每次业务请求的服务器授权，也不承诺权限变化会即时推送到已打开页面。"}, {"title": "归档的实际边界", "level": "h2", "anchor": "归档的实际边界", "text": "## 归档的实际边界\n\n归档/恢复改变项目状态及版本/更新时间，保留配置；同版同状态操作不增版或刷新时间，不调用 Run/Schedule/Integration/Session 停止服务。\n\n| 入口 | 当前行为 |\n| --- | --- |\n| 列表/preference | 默认只 ACTIVE；include_archived 可读授权归档项目 |\n| Project/Run 历史 | 保留当前授权读取；Web 活动选择器不是完整审计入口 |\n| ProjectWriteActor | 409 project_archived，覆盖创建、回答、评价、批准与 Schedule 修改 |\n| Run 取消 | WriteActor + Run 项目访问，无 ACTIVE 门槛；取消受理不证明进程停止 |\n| ADMIN 维护 | 编辑、归档/恢复、删除、移除成员走独立用例；新增成员要求 ACTIVE，否则 404 |\n| Schedule 触发 | 重新检查创建者/活动项目，但不与归档或 Run 创建同事务，不等于立即 PAUSED |"}, {"title": "并发修改不能只看有无行锁", "level": "h3", "anchor": "并发修改不能只看有无行锁", "text": "### 并发修改不能只看有无行锁\n\n项目管理采用以下统一版本协议；DB、API、Web 必须成套切换，接线与验收状态见计划 R05。\n\n- `row_version` 从 1 开始，范围 1–2147483647；只覆盖项目 metadata 与归档状态，不随成员、偏好、Run 或资源变化。它不是审计或全部引用的版本。\n- PATCH 必带原 `expected_row_version` 和至少一个非 null 的可修改字段；归档/恢复 POST 正文必带原版本，DELETE 用必填同名 query。缺版本或非法输入返回 422，不兼容为“使用当前版本”。\n- 本组织 ADMIN 的创建、修改、归档、恢复、删除在业务事务复核原会话与 CSRF；复用 Organization → User → 原 AuthSession → Project 顺序，所有锁后与 flush 后用新时间复核，锁保持到提交。\n- 先比较版本再判 no-op 或删除前置。旧版本即使目标值相同也返回 409 `project_version_conflict`；同版无变化不改版本/时间，有变化只增一次。达到上限后有变化返回 409 `project_version_exhausted`，不回绕。\n- 公开详情/列表均必带版本并使用 no-store。创建 key 冲突不是幂等成功；删除成功仍为 204，无权/不存在仍统一 404。版本通过不免除原来的归档、Run、Schedule、成员审计保护。\n\n页面保留原项目 ID/key/版本及非敏感草稿，提交同步防重。冲突后精确重读原 ID，显示原值、草稿与当前值，人工采用当前版本后仍须另行提交；不自动改版重放。未知结果先核对：既有项目精确重读，创建读取包含归档的完整列表并按原 key 比较。404 或列表无匹配只说明当前不可读/未发现，不证明原请求回滚；当前值符合目标也不证明由原请求造成。\n\n核对读取成功（既有目标的明确 `project_not_found` 404 也只作不可访问事实）后，用户可人工解除新写门禁；解除不重发、删除未知不按同 key 重建。切换页签或刷新列表不消除未知，换 actor/项目或离页丢弃旧响应，不迁移原动作；不承诺跨刷新恢复。无项目参数时，首次默认选择读取完成不是人工切换，不清空已填写的创建草稿、确认或未知状态；显式选择和后续目标切换仍隔离原请求。元数据与归档独立审计尚未定义完整载体，不伪造旧历史或削弱已有审计删除保护。\n\n0034 给旧项目初始化版本 1，不证明旧修改次数。降级须全实例停写并停止旧页面/在途请求；任何项目版本超过 1 拒绝丢列，避免恢复时悄悄重置已使用的并发版本。新旧 API/Web 不混跑，旧客户端缺版本明确拒绝。"}, {"title": "删除与数据保留", "level": "h2", "anchor": "删除与数据保留", "text": "## 删除与数据保留\n\n当前 ADMIN 按上述业务事务锁定原会话与 Project，先验原版本，再要求 ARCHIVED 且无 Run/TaskSchedule/成员审计；清理 preference 与列举配置后删除项目，成功 204。拒绝发生在任何关系删除之前：\n\n| 阻止条件 | Problem code |\n| --- | --- |\n| 未归档 | project_delete_requires_archive |\n| 存在 Run | project_delete_blocked_by_runs |\n| 存在任意状态/发火/认领阶段的 Schedule | project_delete_blocked_by_schedules |\n| 存在成员变更审计 | project_delete_blocked_by_member_audit |\n\n不为释放 key 删除审计或放宽 FK RESTRICT；这些前置不是完整可删证明，也不是回收站。\n\n| 已知缺口 | 风险 |\n| --- | --- |\n| 现有 Run/Schedule 检查不是完整引用证明 | 冻结输入、在途认领与并发新增仍须按统一提交协议验证 |\n| 删 ProjectDocument 行不清 blob | 204 不证明附件、Run 副本或备份清除 |\n| retention_days 仅配置 | 不保证自动清理、恢复或保留期定时器 |\n| 引用检查与新增引用不同协议 | 归档/认领/创建/删除竞争尚需真实事务验证 |"}, {"title": "删除门禁的修正要求", "level": "h3", "anchor": "删除门禁的修正要求", "text": "### 删除门禁的修正要求\n\n默认保留归档项目；物理删除只用于证明无执行/审计及在途引用的空项目。\n\n1. 纳入所有 Run/Schedule（含暂停/归档/未触发）、冻结输入和在途认领；有引用明确冲突，不静默删规则/审计释放 key。\n2. 所有新增引用、旧 Worker/恢复共用锁或条件提交，阻止检查后新增；关系删除同事务回滚，不拆 FK/宽泛 CASCADE。\n3. 字节清理使用[资产协议](document-lifecycle.md#删除与历史引用)，精确身份、回执、失败重试独立于 DB；同步整项目与单文件路径。\n4. 冲突同步 Problem/OpenAPI/client/三语，不把任意 DB 错误归为仍有 Run。未知先核对，不自动重删或建同 key 项目。\n\n恢复归档与[备份恢复](../operations/backup-recovery.md)不同；修改 retention_days 不等于授权清理。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n入口：[项目实现](../../PJM/backend/src/projectmind/projects/)、[ProjectsPage](../../PJM/web/src/pages/ProjectsPage.tsx)、[契约](../../PJM/README.md#contracts)。项目 CRUD 共用版本/请求边界，成员页复用账户查询；module 配置仍是独立领域，不由 CRUD 回归证明完整交付。真实事务、独立项目审计、完整引用保护与字节清理继续接续。\n\n- 失效成员、ADMIN membership、跨组织分别授权，旧 Run 身份不变。\n- 实 DB 验证成员加入/禁用、归档/Run/Schedule/删除竞争、版本冲突与审计回滚。\n- 明确无效链接不换目标；无参数/空项目正常进入，切换和同 tick 双提交不消费旧结果。\n- ARCHIVED 无 Run 但有 Schedule 明确拒绝，无部分删除；真空项目删除与附件失败保持真实语义。\n- 三语、键盘、窄屏用真实组件验；不对用户项目执行删除探针，真实 DB 必须专用授权。"}], "toc": [{"title": "一个例子：归档不是停止或删除", "anchor": "一个例子归档不是停止或删除", "level": "h2"}, {"title": "项目身份与成员资格", "anchor": "项目身份与成员资格", "level": "h2"}, {"title": "成员管理的现状与目标", "anchor": "成员管理的现状与目标", "level": "h3"}, {"title": "成员管理页面", "anchor": "成员管理页面", "level": "h3"}, {"title": "项目选择与失效链接", "anchor": "项目选择与失效链接", "level": "h2"}, {"title": "归档的实际边界", "anchor": "归档的实际边界", "level": "h2"}, {"title": "并发修改不能只看有无行锁", "anchor": "并发修改不能只看有无行锁", "level": "h3"}, {"title": "删除与数据保留", "anchor": "删除与数据保留", "level": "h2"}, {"title": "删除门禁的修正要求", "anchor": "删除门禁的修正要求", "level": "h3"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/project-lifecycle.md", "checksum": "834738714075d305c07287fbb6a5e49530c4ba3b51493916802410cd09d48980"}, {"id": "docs/design/document-lifecycle.md", "title": "项目文档的保存、读取与清理", "group": "design", "html": "\u003ch1 id=\"项目文档的保存读取与清理\">项目文档的保存、读取与清理\u003c/h1>\n\u003cp>本页负责文档资产；\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>负责 Run 选择、冻结和副本，\u003ca href=\"#docs/design/project-lifecycle.md::\">项目生命周期\u003c/a>负责整项目操作。以下区分现状与修正要求，不是完整存储可靠性已交付的声明。\u003c/p>\n\u003ch2 id=\"一个例子列表消失不等于清理完成\">一个例子：列表消失不等于清理完成\u003c/h2>\n\u003cp>上传 A 产生文档 ID 与 blob；Run 1 冻结 A 的 ID/hash。删除 A 当前先删元数据、再尝试删 blob；同路径重传 A′ 是新 ID，不能修复 Run 1 的原引用。\u003c/p>\n\u003cp>必须区分文档目录、存储字节、Run 冻结引用、物化副本：列表消失不证明字节清理，Run 仍显示 A 不证明可下载，删除报错也不证明元数据未提交。\u003c/p>\n\u003ch2 id=\"身份目录与公开面\">身份、目录与公开面\u003c/h2>\n\u003cp>ProjectDocument 元数据在 PostgreSQL，blob 用内部 storage_key 定位。document_id 是身份，folder/name 是展示路径；同 Project/路径唯一，不按内容去重。只有上传、列表、下载、删除，无覆盖、移动、改名、版本或恢复 API；目录由 folder 投影，空目录不保存。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>当前语义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>POST documents\u003c/td>\n\u003ctd>单 file + 可选 folder 的 multipart，201 元数据；同名 409 document_conflict\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET documents\u003c/td>\n\u003ctd>按 folder/name 排序的完整数组，无查询/分页/Folder 契约\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET document content\u003c/td>\n\u003ctd>Project + 精确 ID 授权后返回附件，不是公共 blob URL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DELETE document\u003c/td>\n\u003ctd>元数据 commit 后调用 storage，通常 204，不保证完整清理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>公开数据只含身份、路径、size/MIME/checksum、上传者和时间。读用 ProjectReadActor，写用 ProjectWriteActor 且要求 ACTIVE；越权与不存在统一 404。授权先于业务提交，尚不能保证在途撤权/归档阻止随后保存。\u003c/p>\n\u003ch2 id=\"上传的三个边界\">上传的三个边界\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/documents/service.py\">DocumentService\u003c/a>当前顺序：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">名称/目录校验 → 读取元数据用量 → 大小/MIME/配额/文本校验\n  → put 新 blob → 元数据事务 commit → 201\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前检查\u003c/th>\n\u003cth>实际缺口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>文件默认 25 MiB，Project 默认 500 MiB\u003c/td>\n\u003ctd>route 先完整 file.read；不是请求体/内存硬上限，配额不含孤立 blob/副本/备份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>名称、folder 最多 200 字符\u003c/td>\n\u003ctd>storage key 单段最多 128，129–200 名称可能存储失败且未映射上传 422；应写前稳定拒绝，不截断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MIME allowlist、指定文本凭据扫描\u003c/td>\n\u003ctd>校验申报类型，不证明真实格式、病毒安全或任意二进制已脱敏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>读取用量后检查配额\u003c/td>\n\u003ctd>没有原子预留，并发上传可分别通过旧用量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>blob 先写、元数据唯一约束后验\u003c/td>\n\u003ctd>冲突可留下孤立 blob；所有 IntegrityError 目前被误归为同名冲突\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"保存可靠性的修正要求\">保存可靠性的修正要求\u003c/h3>\n\u003cp>写前限制实际流式字节，明确内容/MIME 策略；为 Project 建立原子配额预留与结算，最终发布时复核授权、状态、路径与预留。网络 I/O 不放入长期 Project 行锁。\u003c/p>\n\u003cp>持久保存上传意图、原请求身份与 blob 归属，区分确定拒绝、存储未知、commit 未知。未知先核对，不能异常后立即删除可能已提交的对象；确认无引用的失败上传才进入可重试清理。幂等需定义 actor/Project、摘要、保留期和并发胜者，不是仅加 header。\u003c/p>\n\u003ch2 id=\"读取下载与预览\">读取、下载与预览\u003c/h2>\n\u003cp>普通下载不复核真实 size/checksum；read_frozen_document 才验证原 ID、元数据与字节。目标统一完整性与安全错误，区分损坏、缺失、存储不可用，不用同路径新文件补旧引用。\u003c/p>\n\u003cp>Web 仅预览 txt/md/markdown/htm/html，元数据不超过 1,000,000 bytes；Markdown 显示原文，超限提示下载。HTML srcDoc 使用 sandbox=\u0026quot;\u0026quot; 禁脚本/同源，但没有外部资源禁载策略，不是网络隔离或 generated Host。\u003c/p>\n\u003cp>待补实际预览字节上限、外部图片/CSS 拒绝、下载文件名安全编码。现行直接拼 filename 对非 Latin-1 名称会失败，引号也需测试；上传接受中文名不证明下载可用。\u003c/p>\n\u003ch2 id=\"删除与历史引用\">删除与历史引用\u003c/h2>\n\u003cp>当前无 Run/Schedule 引用检查或持久清理回执：元数据 commit 后 storage 失败会留下 blob，原 ID 再删先得 404；S3 adapter 吞掉全部 S3Error，204 可掩盖 AccessDenied。整 Project 删除另走元数据清单，不调用逐文件清理。\u003c/p>\n\u003ch3 id=\"引用保护与清理的修正要求\">引用保护与清理的修正要求\u003c/h3>\n\u003cul>\n\u003cli>Run、Schedule、JSON snapshot 和在途冻结引用共同阻止物理删除；引用检查与新增引用共享并发约束，不只隐藏按钮或检查外键。\u003c/li>\n\u003cli>若需停止新选择，另设计可审计退役状态；不迁移旧 ID/hash，不用删除再上传模拟版本。\u003c/li>\n\u003cli>元数据持久记录待清理身份和精确对象；异步确认、失败重试，不按 bucket 前缀广泛删除。不存在、拒绝、断连、未知分别记录。\u003c/li>\n\u003cli>单文档与整 Project 共用清理协议；Run 副本和备份独立保留。当前没有该协议、状态 API 或修复 CLI。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"页面与结果未知\">页面与结果未知\u003c/h2>\n\u003cp>目录上传是顺序的独立 POST，单份失败后继续；done 表示已处理，不是成功数。取消本地等待不能撤回已保存文件。\u003c/p>\n\u003cp>目标分别展示成功/确定拒绝/未知，保留原文件、Project、路径，不自动重发整目录，也不以同名列表项证明成功。上传/删除需同步防重复及 actor/Project/request 身份检查；切换、卸载后丢弃晚到响应。\u003c/p>\n\u003cp>删除未知只读核对原 ID，不能宣称附件已彻底清理。client 尚缺 UUID/日期/checksum/安全整数/Project 关联的严格校验，组件未知状态也未闭合；受控三语错误不暴露存储细节。未来分页须标明已加载范围。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>入口：\u003ca href=\"../PJM/backend/src/projectmind/api/routes/documents.py\">documents route\u003c/a>、\u003ca href=\"../PJM/backend/src/projectmind/storage\">存储实现\u003c/a>、\u003ca href=\"../PJM/web/src/components/DocumentManagerPanel.tsx\">Web 管理组件\u003c/a>、\u003ca href=\"#PJM/README.md::contracts\">契约索引\u003c/a>。当前缺口登记 R01/R10/R11；排障见\u003ca href=\"#docs/operations/runbook.md::%E6%96%87%E6%A1%A3%E4%BF%9D%E5%AD%98%E4%B8%8E%E5%88%A0%E9%99%A4%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">Runbook\u003c/a>。\u003c/p>\n\u003cul>\n\u003cli>实 DB 验证配额/同名竞争、撤权/归档/引用竞争和完整回滚。\u003c/li>\n\u003cli>在 put/commit/响应边界注入失败，重启后可确认原意图，不误删成功对象或重复创建。\u003c/li>\n\u003cli>专用 bucket 区分 S3 拒绝、超时、不存在；验证篡改、伪报 MIME、大文件与 Unicode header。\u003c/li>\n\u003cli>实组件 + mock API 验证目录部分成功、重复提交、切换、三语/键盘/窄屏；真实会话和存储另验。\u003c/li>\n\u003cli>历史 Run、物化副本与备份保持原身份；真实 DB/bucket 写入只使用明确授权的专用目标。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "项目文档的保存、读取与清理", "level": "h1", "anchor": "项目文档的保存读取与清理", "text": "# 项目文档的保存、读取与清理\n\n本页负责文档资产；[资源快照](resource-snapshots.md)负责 Run 选择、冻结和副本，[项目生命周期](project-lifecycle.md)负责整项目操作。以下区分现状与修正要求，不是完整存储可靠性已交付的声明。"}, {"title": "一个例子：列表消失不等于清理完成", "level": "h2", "anchor": "一个例子列表消失不等于清理完成", "text": "## 一个例子：列表消失不等于清理完成\n\n上传 A 产生文档 ID 与 blob；Run 1 冻结 A 的 ID/hash。删除 A 当前先删元数据、再尝试删 blob；同路径重传 A′ 是新 ID，不能修复 Run 1 的原引用。\n\n必须区分文档目录、存储字节、Run 冻结引用、物化副本：列表消失不证明字节清理，Run 仍显示 A 不证明可下载，删除报错也不证明元数据未提交。"}, {"title": "身份、目录与公开面", "level": "h2", "anchor": "身份目录与公开面", "text": "## 身份、目录与公开面\n\nProjectDocument 元数据在 PostgreSQL，blob 用内部 storage_key 定位。document_id 是身份，folder/name 是展示路径；同 Project/路径唯一，不按内容去重。只有上传、列表、下载、删除，无覆盖、移动、改名、版本或恢复 API；目录由 folder 投影，空目录不保存。\n\n| 操作 | 当前语义 |\n| --- | --- |\n| POST documents | 单 file + 可选 folder 的 multipart，201 元数据；同名 409 document_conflict |\n| GET documents | 按 folder/name 排序的完整数组，无查询/分页/Folder 契约 |\n| GET document content | Project + 精确 ID 授权后返回附件，不是公共 blob URL |\n| DELETE document | 元数据 commit 后调用 storage，通常 204，不保证完整清理 |\n\n公开数据只含身份、路径、size/MIME/checksum、上传者和时间。读用 ProjectReadActor，写用 ProjectWriteActor 且要求 ACTIVE；越权与不存在统一 404。授权先于业务提交，尚不能保证在途撤权/归档阻止随后保存。"}, {"title": "上传的三个边界", "level": "h2", "anchor": "上传的三个边界", "text": "## 上传的三个边界\n\n[DocumentService](../../PJM/backend/src/projectmind/documents/service.py)当前顺序：\n\n```text\n名称/目录校验 → 读取元数据用量 → 大小/MIME/配额/文本校验\n  → put 新 blob → 元数据事务 commit → 201\n```\n\n| 当前检查 | 实际缺口 |\n| --- | --- |\n| 文件默认 25 MiB，Project 默认 500 MiB | route 先完整 file.read；不是请求体/内存硬上限，配额不含孤立 blob/副本/备份 |\n| 名称、folder 最多 200 字符 | storage key 单段最多 128，129–200 名称可能存储失败且未映射上传 422；应写前稳定拒绝，不截断 |\n| MIME allowlist、指定文本凭据扫描 | 校验申报类型，不证明真实格式、病毒安全或任意二进制已脱敏 |\n| 读取用量后检查配额 | 没有原子预留，并发上传可分别通过旧用量 |\n| blob 先写、元数据唯一约束后验 | 冲突可留下孤立 blob；所有 IntegrityError 目前被误归为同名冲突 |"}, {"title": "保存可靠性的修正要求", "level": "h3", "anchor": "保存可靠性的修正要求", "text": "### 保存可靠性的修正要求\n\n写前限制实际流式字节，明确内容/MIME 策略；为 Project 建立原子配额预留与结算，最终发布时复核授权、状态、路径与预留。网络 I/O 不放入长期 Project 行锁。\n\n持久保存上传意图、原请求身份与 blob 归属，区分确定拒绝、存储未知、commit 未知。未知先核对，不能异常后立即删除可能已提交的对象；确认无引用的失败上传才进入可重试清理。幂等需定义 actor/Project、摘要、保留期和并发胜者，不是仅加 header。"}, {"title": "读取、下载与预览", "level": "h2", "anchor": "读取下载与预览", "text": "## 读取、下载与预览\n\n普通下载不复核真实 size/checksum；read_frozen_document 才验证原 ID、元数据与字节。目标统一完整性与安全错误，区分损坏、缺失、存储不可用，不用同路径新文件补旧引用。\n\nWeb 仅预览 txt/md/markdown/htm/html，元数据不超过 1,000,000 bytes；Markdown 显示原文，超限提示下载。HTML srcDoc 使用 sandbox=\"\" 禁脚本/同源，但没有外部资源禁载策略，不是网络隔离或 generated Host。\n\n待补实际预览字节上限、外部图片/CSS 拒绝、下载文件名安全编码。现行直接拼 filename 对非 Latin-1 名称会失败，引号也需测试；上传接受中文名不证明下载可用。"}, {"title": "删除与历史引用", "level": "h2", "anchor": "删除与历史引用", "text": "## 删除与历史引用\n\n当前无 Run/Schedule 引用检查或持久清理回执：元数据 commit 后 storage 失败会留下 blob，原 ID 再删先得 404；S3 adapter 吞掉全部 S3Error，204 可掩盖 AccessDenied。整 Project 删除另走元数据清单，不调用逐文件清理。"}, {"title": "引用保护与清理的修正要求", "level": "h3", "anchor": "引用保护与清理的修正要求", "text": "### 引用保护与清理的修正要求\n\n- Run、Schedule、JSON snapshot 和在途冻结引用共同阻止物理删除；引用检查与新增引用共享并发约束，不只隐藏按钮或检查外键。\n- 若需停止新选择，另设计可审计退役状态；不迁移旧 ID/hash，不用删除再上传模拟版本。\n- 元数据持久记录待清理身份和精确对象；异步确认、失败重试，不按 bucket 前缀广泛删除。不存在、拒绝、断连、未知分别记录。\n- 单文档与整 Project 共用清理协议；Run 副本和备份独立保留。当前没有该协议、状态 API 或修复 CLI。"}, {"title": "页面与结果未知", "level": "h2", "anchor": "页面与结果未知", "text": "## 页面与结果未知\n\n目录上传是顺序的独立 POST，单份失败后继续；done 表示已处理，不是成功数。取消本地等待不能撤回已保存文件。\n\n目标分别展示成功/确定拒绝/未知，保留原文件、Project、路径，不自动重发整目录，也不以同名列表项证明成功。上传/删除需同步防重复及 actor/Project/request 身份检查；切换、卸载后丢弃晚到响应。\n\n删除未知只读核对原 ID，不能宣称附件已彻底清理。client 尚缺 UUID/日期/checksum/安全整数/Project 关联的严格校验，组件未知状态也未闭合；受控三语错误不暴露存储细节。未来分页须标明已加载范围。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n入口：[documents route](../../PJM/backend/src/projectmind/api/routes/documents.py)、[存储实现](../../PJM/backend/src/projectmind/storage/)、[Web 管理组件](../../PJM/web/src/components/DocumentManagerPanel.tsx)、[契约索引](../../PJM/README.md#contracts)。当前缺口登记 R01/R10/R11；排障见[Runbook](../operations/runbook.md#文档保存与删除的只读分诊)。\n\n- 实 DB 验证配额/同名竞争、撤权/归档/引用竞争和完整回滚。\n- 在 put/commit/响应边界注入失败，重启后可确认原意图，不误删成功对象或重复创建。\n- 专用 bucket 区分 S3 拒绝、超时、不存在；验证篡改、伪报 MIME、大文件与 Unicode header。\n- 实组件 + mock API 验证目录部分成功、重复提交、切换、三语/键盘/窄屏；真实会话和存储另验。\n- 历史 Run、物化副本与备份保持原身份；真实 DB/bucket 写入只使用明确授权的专用目标。"}], "toc": [{"title": "一个例子：列表消失不等于清理完成", "anchor": "一个例子列表消失不等于清理完成", "level": "h2"}, {"title": "身份、目录与公开面", "anchor": "身份目录与公开面", "level": "h2"}, {"title": "上传的三个边界", "anchor": "上传的三个边界", "level": "h2"}, {"title": "保存可靠性的修正要求", "anchor": "保存可靠性的修正要求", "level": "h3"}, {"title": "读取、下载与预览", "anchor": "读取下载与预览", "level": "h2"}, {"title": "删除与历史引用", "anchor": "删除与历史引用", "level": "h2"}, {"title": "引用保护与清理的修正要求", "anchor": "引用保护与清理的修正要求", "level": "h3"}, {"title": "页面与结果未知", "anchor": "页面与结果未知", "level": "h2"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/document-lifecycle.md", "checksum": "17f82a0122f1939969a9907d9c187395ab3c719f8dbc56fb87a4523e9c76882f"}, {"id": "docs/design/authentication.md", "title": "认证、会话与项目授权", "group": "design", "html": "\u003ch1 id=\"认证会话与项目授权\">认证、会话与项目授权\u003c/h1>\n\u003cp>本页负责浏览器身份和授权入口；\u003ca href=\"#docs/design/login-protection.md::\">登录防护\u003c/a>、\u003ca href=\"#docs/design/user-lifecycle.md::\">用户管理\u003c/a>、\u003ca href=\"#docs/design/secret-storage.md::\">外部 Secret\u003c/a>分别维护独立协议。当前交付缺口见\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清四类凭据\">先分清四类凭据\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>凭据\u003c/th>\n\u003cth>用途与边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>login CSRF challenge\u003c/td>\n\u003ctd>登录前正文与短时 HttpOnly cookie 配对，Redis 一次性消费；不是会话\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>session token\u003c/td>\n\u003ctd>HttpOnly cookie 携带；服务端仅保存 hash，Web 不读取原值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>session CSRF token\u003c/td>\n\u003ctd>当前会话的写请求 header；Web 仅在内存保存，不能单独证明身份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Provider Secret\u003c/td>\n\u003ctd>只交受控 Provider 使用，不授予额外 Tool 权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"威胁边界与目标\">威胁边界与目标\u003c/h2>\n\u003cul>\n\u003cli>独立账号体系，当前只支持一个 Organization。email 唯一键含组织，但登录只按 email 查询；引入多组织前须先定义组织选择与查询隔离。\u003c/li>\n\u003cli>生产由共享 Traefik 提供 HTTPS；API/Web 同源，位于 PROJECTMIND_CONTEXT_PATH 下。浏览器不持有长期 Bearer token，不将会话存入 Local/Session Storage。\u003c/li>\n\u003cli>PostgreSQL 保存用户、会话、成员与审计；Redis 仅承载登录防护等短期状态。\u003c/li>\n\u003cli>当前不提供 OAuth/OIDC、API token、找回密码、邮件验证或 MFA；受控内部部署的边界不能直接推广到公网。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"密码认证\">密码认证\u003c/h2>\n\u003cp>email 标准化后在组织内唯一。不存在、停用和密码错误统一为 invalid_credentials；配额、防护不可用、CSRF 和结构错误保持各自语义，见\u003ca href=\"#docs/design/login-protection.md::%E5%85%AC%E5%BC%80%E5%93%8D%E5%BA%94%E4%B8%8E%E5%AE%A2%E6%88%B7%E7%AB%AF%E8%B4%A3%E4%BB%BB\">登录错误\u003c/a>。\u003c/p>\n\u003cp>密码允许 Unicode、空格和密码管理器值：至少 15 字符，UTF-8 最多 1,024 bytes，不强制字符组合。使用 Argon2id（19 MiB、iterations 2、parallelism 1），只保存 PHC hash；成功登录按需 rehash。密码、完整 session/CSRF 不进入日志、Problem、审计或 fixture。\u003c/p>\n\u003cp>策略依据：\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html\">密码存储\u003c/a>、\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html\">认证建议\u003c/a>。项目参数仍需结合部署容量验证。\u003c/p>\n\u003ch2 id=\"浏览器会话\">浏览器会话\u003c/h2>\n\u003cp>登录使用至少 256 bit 随机 opaque token，数据库保存 \u003ccode>sha256:\u0026lt;hex\u0026gt;\u003c/code>。生产 cookie 为 \u003ccode>__Host-projectmind_session\u003c/code>，固定 \u003ccode>Secure; HttpOnly; SameSite=Strict; Path=/\u003c/code>，无 Domain；非 Secure 开发设置不能带入生产。\u003c/p>\n\u003cp>默认 idle 30 分钟，absolute 12 小时，ADMIN absolute 8 小时；idle 写入按 5 分钟节流且不超过 absolute 截止。每次登录创建新 token，不自动撤销其他登录。认证仍锁行，节流不等于无锁。\u003c/p>\n\u003ch3 id=\"会话失效与权限变化\">会话失效与权限变化\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>登出\u003c/td>\n\u003ctd>Origin/CSRF 通过后持久写 revoked_at，再删除 cookie\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>停用、角色变化、改密、主动撤销\u003c/td>\n\u003ctd>用户管理事务撤销旧会话；重新启用或改回角色不能复活它们\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前角色与登录快照不同\u003c/td>\n\u003ctd>v2 读写均拒绝；仅比较当前角色不能代替持久撤销\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>锁等待期间过期\u003c/td>\n\u003ctd>User → AuthSession 取锁后再取时间，检查状态、撤销、idle/absolute 期限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>密码 hash 改变不自动使会话失效，必须走管理用例。撤销也不改写 Run permission snapshot，更不证明已有 SSE/进程已停止，见\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a>。\u003c/p>\n\u003ch2 id=\"csrf-与同源约束\">CSRF 与同源约束\u003c/h2>\n\u003cp>非安全方法同时验证 Origin 与 synchronizer CSRF；SameSite 只是纵深防御。登录前 challenge 经 header/cookie 配对后以 Redis GETDEL 消费，每次重试重新获取；登录后 token 只经 X-CSRF-Token 返回，不能混用两种凭据。\u003c/p>\n\u003cp>GET/SSE 不触发业务命令，但认证可能更新 idle，login-context 会保存 challenge；不能作为无持久副作用的健康检查。只信任明确配置的代理，不直接相信任意 X-Forwarded-*。\u003c/p>\n\u003ch3 id=\"会话读取与多页面\">会话读取与多页面\u003c/h3>\n\u003cp>同一有效 session 的页面 A、B 读取会话都得到相同 CSRF S；B 的读取不撤销 A 的写凭据。重新登录换 cookie 后，旧页面的 S 不适用于新会话。\u003c/p>\n\u003cp>这仅保证稳定凭据，不是跨标签页身份同步或业务重试协议。CSRF 失败后先确认当前 actor/Project 与原提交事实，不自动重放创建、批准或外部写入；Web 不自行派生 token。\u003c/p>\n\u003ch3 id=\"会话凭据-v2-与切换要求\">会话凭据 v2 与切换要求\u003c/h3>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/auth/domain.py\">auth/domain.py\u003c/a>定义内部凭据协议，不改变公开 SessionResponse 版本：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>固定值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>session\u003c/td>\n\u003ctd>pm2. + 32 随机 bytes 的无填充 base64url，47 ASCII 字符\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HKDF 输入\u003c/td>\n\u003ctd>完整 session 原值的 ASCII bytes，不是数据库 hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>派生\u003c/td>\n\u003ctd>SHA-256，32 bytes，salt=None，info=projectmind.auth.session-csrf/v2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CSRF\u003c/td>\n\u003ctd>csrf2. + 派生值的无填充 base64url，49 ASCII 字符\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保存\u003c/td>\n\u003ctd>session/CSRF 各自 hash；不存明文或可逆 token 密文\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>使用 cryptography HKDF；固定用途标记和默认 salt 遵循 \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5869\">RFC 5869\u003c/a>。方案依赖 session 随机性与保密性，不能降低 cookie 被窃风险。\u003c/p>\n\u003cp>新登录保存 credential_version=2 与 system_role_at_login；数据库默认仍为 1，以识别旧写入方。认证校验格式后锁 User/AuthSession，锁后检查期限、撤销、用户状态、协议、角色和派生 hash；损坏/未知版本 fail closed，无旧格式 fallback。\u003c/p>\n\u003cp>\u003ca href=\"../PJM/backend/migrations/versions/0031_auth_session_credentials.py\">0031 migration\u003c/a>标记并撤销旧活动会话，要求重新登录，不迁移旧随机 CSRF。任何 v2 行存在时均拒绝 downgrade 丢列。新旧 API 不混跑，不删除审计绕过回退限制；上线见\u003ca href=\"#docs/operations/deployment.md::%E4%BC%9A%E8%AF%9D%E5%8D%8F%E8%AE%AE%E5%88%87%E6%8D%A2%E6%A3%80%E6%9F%A5\">会话切换\u003c/a>。\u003c/p>\n\u003ch3 id=\"缓存与代理\">缓存与代理\u003c/h3>\n\u003cp>auth-tag route 的已处理响应与登录防护路径设置 Cache-Control: no-store，Web auth client 同样禁止缓存；不外推到未处理异常、代理自产错误或全站。实际 HTTPS 入口仍须验收。\u003c/p>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/api/auth_dependencies.py\">require_same_origin\u003c/a>比较 Origin 与代理恢复后的 scheme/host/port；context path 不属于 Origin。缺失 Origin 拒绝，不以关掉 Secure/CSRF 或信任全部代理解决配置错误。\u003c/p>\n\u003ch2 id=\"首个-admin-初始化\">首个 ADMIN 初始化\u003c/h2>\n\u003cp>仅提供受控 CLI，不提供匿名 HTTP bootstrap 或启动时自动建管理员。CLI 交互读取 email/display name/密码，密码使用 getpass，不进入参数、环境或 shell history。\u003c/p>\n\u003cp>初始化锁定 migration 已创建的 Organization，存在任何 ADMIN 即拒绝；后续创建走\u003ca href=\"#docs/design/user-lifecycle.md::\">用户管理\u003c/a>。不能反复 bootstrap 或直接 SQL 提权。普通 CLI 与会清空数据的近名 Make target 须区分，命令只维护在\u003ca href=\"#docs/operations/quickstart.md::%E6%9C%80%E5%88%9D%E3%81%AE-admin-%E3%82%92%E4%BD%9C%E6%88%90%E3%81%99%E3%82%8B\">首次起动\u003c/a>。\u003c/p>\n\u003ch2 id=\"权限判定\">权限判定\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">cookie + 写请求 Origin/CSRF\n  → 当前会话/用户/期限\n  → actor dependency：角色与 Project\n  → use case：目标所有权、版本、业务条件\n  → 执行边界：冻结权限、scope、Tool 与批准\n\u003c/code>\u003c/pre>\n\u003cp>ADMIN 管理本组织，USER 需 ACTIVE ProjectMember；不存在与越权资源统一 404。ProjectReadActor 可读获授权历史，ProjectWriteActor 另拒绝 ARCHIVED；ReadActor/WriteActor 本身不建立 Project 边界。\u003c/p>\n\u003cp>Run 创建冻结 actor、成员资格及 Skill/Tool 权限上限，不随后来权限修改。当前请求仍须重新授权，冻结上限不替代当前资格。外部批准另限制 Run 发起人或 system ADMIN；低风险预授权仅 ADMIN 配置，repository.write 不可预授权，见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。\u003c/p>\n\u003ch3 id=\"认证与业务提交不是同一个事务\">认证与业务提交不是同一个事务\u003c/h3>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/auth/service.py\">AuthService\u003c/a>返回 actor 前结束认证事务。锁后认证只保护当次判断，不证明所有业务提交都重新检查撤权。\u003c/p>\n\u003cp>\u003ca href=\"#docs/design/user-lifecycle.md::%E4%BA%8B%E5%8A%A1%E4%B8%8E%E5%B9%B6%E5%8F%91\">用户管理事务\u003c/a>另重验原会话，将账户变更、撤销和审计一起提交；\u003ca href=\"#docs/design/project-lifecycle.md::%E6%88%90%E5%91%98%E7%AE%A1%E7%90%86%E7%9A%84%E7%8E%B0%E7%8A%B6%E4%B8%8E%E7%9B%AE%E6%A0%87\">项目成员管理\u003c/a>复用同一凭据校验并保持目标账户锁，\u003ca href=\"#docs/design/project-lifecycle.md::%E5%B9%B6%E5%8F%91%E4%BF%AE%E6%94%B9%E4%B8%8D%E8%83%BD%E5%8F%AA%E7%9C%8B%E6%9C%89%E6%97%A0%E8%A1%8C%E9%94%81\">项目 CRUD\u003c/a>也在业务锁后及 flush 后复核原 ADMIN 会话。\u003c/p>\n\u003cp>\u003ca href=\"#docs/design/user-interactions.md::%E9%A6%96%E6%AC%A1%E7%AD%94%E5%A4%8D%E4%B8%8E%E5%8E%9F%E7%AD%94%E5%A4%8D%E9%87%8D%E6%94%BE\">普通答复\u003c/a>复用该凭据验证，固定当前 Project/成员资格，再锁 Run/Segment/Interaction；首次、重放及过期续行都经过最终门禁。其他业务仍须按各自设计闭合授权竞争，不能由这些链路推导全系统立即停权或已有 Run 停止。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>现有登录/登出、v2 稳定 CSRF、统一 actor、管理 API 与账户页是接续起点；剩余实现和真实环境缺口以 R05 为准。接口变更同步\u003ca href=\"#PJM/README.md::contracts\">认证契约入口\u003c/a>、Web client 和回归；不得增加旁路认证。\u003c/p>\n\u003cul>\n\u003cli>多页面、乱序、换账号：同会话不互撤凭据，原业务动作不自动重放。\u003c/li>\n\u003cli>错误 challenge/Origin、跨 Project、归档、非 ADMIN：按各层拒绝，不泄露账号或资源。\u003c/li>\n\u003cli>真正锁等待、并发撤销/登录、停用后启用：旧会话不复活，管理事务完整回滚。\u003c/li>\n\u003cli>0031 升降级、HTTPS/context path、多 API：旧会话切换、cookie、no-store、代理信任与限流分别验证。\u003c/li>\n\u003cli>\u003ca href=\"../PJM/backend/tests/auth/test_session_service.py\">service 回归\u003c/a>与\u003ca href=\"../PJM/backend/tests/db/test_real_auth_sessions.py\">真实会话测试\u003c/a>按替身/真实数据库区分证据；创建测试数据库前确认专用目标授权。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "认证、会话与项目授权", "level": "h1", "anchor": "认证会话与项目授权", "text": "# 认证、会话与项目授权\n\n本页负责浏览器身份和授权入口；[登录防护](login-protection.md)、[用户管理](user-lifecycle.md)、[外部 Secret](secret-storage.md)分别维护独立协议。当前交付缺口见[计划 R05](../planning/roadmap.md#r05-领域与身份安全)。"}, {"title": "先分清四类凭据", "level": "h2", "anchor": "先分清四类凭据", "text": "## 先分清四类凭据\n\n| 凭据 | 用途与边界 |\n| --- | --- |\n| login CSRF challenge | 登录前正文与短时 HttpOnly cookie 配对，Redis 一次性消费；不是会话 |\n| session token | HttpOnly cookie 携带；服务端仅保存 hash，Web 不读取原值 |\n| session CSRF token | 当前会话的写请求 header；Web 仅在内存保存，不能单独证明身份 |\n| Provider Secret | 只交受控 Provider 使用，不授予额外 Tool 权限 |"}, {"title": "威胁边界与目标", "level": "h2", "anchor": "威胁边界与目标", "text": "## 威胁边界与目标\n\n- 独立账号体系，当前只支持一个 Organization。email 唯一键含组织，但登录只按 email 查询；引入多组织前须先定义组织选择与查询隔离。\n- 生产由共享 Traefik 提供 HTTPS；API/Web 同源，位于 PROJECTMIND_CONTEXT_PATH 下。浏览器不持有长期 Bearer token，不将会话存入 Local/Session Storage。\n- PostgreSQL 保存用户、会话、成员与审计；Redis 仅承载登录防护等短期状态。\n- 当前不提供 OAuth/OIDC、API token、找回密码、邮件验证或 MFA；受控内部部署的边界不能直接推广到公网。"}, {"title": "密码认证", "level": "h2", "anchor": "密码认证", "text": "## 密码认证\n\nemail 标准化后在组织内唯一。不存在、停用和密码错误统一为 invalid_credentials；配额、防护不可用、CSRF 和结构错误保持各自语义，见[登录错误](login-protection.md#公开响应与客户端责任)。\n\n密码允许 Unicode、空格和密码管理器值：至少 15 字符，UTF-8 最多 1,024 bytes，不强制字符组合。使用 Argon2id（19 MiB、iterations 2、parallelism 1），只保存 PHC hash；成功登录按需 rehash。密码、完整 session/CSRF 不进入日志、Problem、审计或 fixture。\n\n策略依据：[密码存储](https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html)、[认证建议](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html)。项目参数仍需结合部署容量验证。"}, {"title": "浏览器会话", "level": "h2", "anchor": "浏览器会话", "text": "## 浏览器会话\n\n登录使用至少 256 bit 随机 opaque token，数据库保存 `sha256:\u003chex>`。生产 cookie 为 `__Host-projectmind_session`，固定 `Secure; HttpOnly; SameSite=Strict; Path=/`，无 Domain；非 Secure 开发设置不能带入生产。\n\n默认 idle 30 分钟，absolute 12 小时，ADMIN absolute 8 小时；idle 写入按 5 分钟节流且不超过 absolute 截止。每次登录创建新 token，不自动撤销其他登录。认证仍锁行，节流不等于无锁。"}, {"title": "会话失效与权限变化", "level": "h3", "anchor": "会话失效与权限变化", "text": "### 会话失效与权限变化\n\n| 情况 | 规则 |\n| --- | --- |\n| 登出 | Origin/CSRF 通过后持久写 revoked_at，再删除 cookie |\n| 停用、角色变化、改密、主动撤销 | 用户管理事务撤销旧会话；重新启用或改回角色不能复活它们 |\n| 当前角色与登录快照不同 | v2 读写均拒绝；仅比较当前角色不能代替持久撤销 |\n| 锁等待期间过期 | User → AuthSession 取锁后再取时间，检查状态、撤销、idle/absolute 期限 |\n\n密码 hash 改变不自动使会话失效，必须走管理用例。撤销也不改写 Run permission snapshot，更不证明已有 SSE/进程已停止，见[执行监督](run-supervision.md)。"}, {"title": "CSRF 与同源约束", "level": "h2", "anchor": "csrf-与同源约束", "text": "## CSRF 与同源约束\n\n非安全方法同时验证 Origin 与 synchronizer CSRF；SameSite 只是纵深防御。登录前 challenge 经 header/cookie 配对后以 Redis GETDEL 消费，每次重试重新获取；登录后 token 只经 X-CSRF-Token 返回，不能混用两种凭据。\n\nGET/SSE 不触发业务命令，但认证可能更新 idle，login-context 会保存 challenge；不能作为无持久副作用的健康检查。只信任明确配置的代理，不直接相信任意 X-Forwarded-*。"}, {"title": "会话读取与多页面", "level": "h3", "anchor": "会话读取与多页面", "text": "### 会话读取与多页面\n\n同一有效 session 的页面 A、B 读取会话都得到相同 CSRF S；B 的读取不撤销 A 的写凭据。重新登录换 cookie 后，旧页面的 S 不适用于新会话。\n\n这仅保证稳定凭据，不是跨标签页身份同步或业务重试协议。CSRF 失败后先确认当前 actor/Project 与原提交事实，不自动重放创建、批准或外部写入；Web 不自行派生 token。"}, {"title": "会话凭据 v2 与切换要求", "level": "h3", "anchor": "会话凭据-v2-与切换要求", "text": "### 会话凭据 v2 与切换要求\n\n[auth/domain.py](../../PJM/backend/src/projectmind/auth/domain.py)定义内部凭据协议，不改变公开 SessionResponse 版本：\n\n| 项目 | 固定值 |\n| --- | --- |\n| session | pm2. + 32 随机 bytes 的无填充 base64url，47 ASCII 字符 |\n| HKDF 输入 | 完整 session 原值的 ASCII bytes，不是数据库 hash |\n| 派生 | SHA-256，32 bytes，salt=None，info=projectmind.auth.session-csrf/v2 |\n| CSRF | csrf2. + 派生值的无填充 base64url，49 ASCII 字符 |\n| 保存 | session/CSRF 各自 hash；不存明文或可逆 token 密文 |\n\n使用 cryptography HKDF；固定用途标记和默认 salt 遵循 [RFC 5869](https://www.rfc-editor.org/rfc/rfc5869)。方案依赖 session 随机性与保密性，不能降低 cookie 被窃风险。\n\n新登录保存 credential_version=2 与 system_role_at_login；数据库默认仍为 1，以识别旧写入方。认证校验格式后锁 User/AuthSession，锁后检查期限、撤销、用户状态、协议、角色和派生 hash；损坏/未知版本 fail closed，无旧格式 fallback。\n\n[0031 migration](../../PJM/backend/migrations/versions/0031_auth_session_credentials.py)标记并撤销旧活动会话，要求重新登录，不迁移旧随机 CSRF。任何 v2 行存在时均拒绝 downgrade 丢列。新旧 API 不混跑，不删除审计绕过回退限制；上线见[会话切换](../operations/deployment.md#会话协议切换检查)。"}, {"title": "缓存与代理", "level": "h3", "anchor": "缓存与代理", "text": "### 缓存与代理\n\nauth-tag route 的已处理响应与登录防护路径设置 Cache-Control: no-store，Web auth client 同样禁止缓存；不外推到未处理异常、代理自产错误或全站。实际 HTTPS 入口仍须验收。\n\n[require_same_origin](../../PJM/backend/src/projectmind/api/auth_dependencies.py)比较 Origin 与代理恢复后的 scheme/host/port；context path 不属于 Origin。缺失 Origin 拒绝，不以关掉 Secure/CSRF 或信任全部代理解决配置错误。"}, {"title": "首个 ADMIN 初始化", "level": "h2", "anchor": "首个-admin-初始化", "text": "## 首个 ADMIN 初始化\n\n仅提供受控 CLI，不提供匿名 HTTP bootstrap 或启动时自动建管理员。CLI 交互读取 email/display name/密码，密码使用 getpass，不进入参数、环境或 shell history。\n\n初始化锁定 migration 已创建的 Organization，存在任何 ADMIN 即拒绝；后续创建走[用户管理](user-lifecycle.md)。不能反复 bootstrap 或直接 SQL 提权。普通 CLI 与会清空数据的近名 Make target 须区分，命令只维护在[首次起动](../operations/quickstart.md#最初の-admin-を作成する)。"}, {"title": "权限判定", "level": "h2", "anchor": "权限判定", "text": "## 权限判定\n\n```text\ncookie + 写请求 Origin/CSRF\n  → 当前会话/用户/期限\n  → actor dependency：角色与 Project\n  → use case：目标所有权、版本、业务条件\n  → 执行边界：冻结权限、scope、Tool 与批准\n```\n\nADMIN 管理本组织，USER 需 ACTIVE ProjectMember；不存在与越权资源统一 404。ProjectReadActor 可读获授权历史，ProjectWriteActor 另拒绝 ARCHIVED；ReadActor/WriteActor 本身不建立 Project 边界。\n\nRun 创建冻结 actor、成员资格及 Skill/Tool 权限上限，不随后来权限修改。当前请求仍须重新授权，冻结上限不替代当前资格。外部批准另限制 Run 发起人或 system ADMIN；低风险预授权仅 ADMIN 配置，repository.write 不可预授权，见[受控写入](repository-effects.md)。"}, {"title": "认证与业务提交不是同一个事务", "level": "h3", "anchor": "认证与业务提交不是同一个事务", "text": "### 认证与业务提交不是同一个事务\n\n[AuthService](../../PJM/backend/src/projectmind/auth/service.py)返回 actor 前结束认证事务。锁后认证只保护当次判断，不证明所有业务提交都重新检查撤权。\n\n[用户管理事务](user-lifecycle.md#事务与并发)另重验原会话，将账户变更、撤销和审计一起提交；[项目成员管理](project-lifecycle.md#成员管理的现状与目标)复用同一凭据校验并保持目标账户锁，[项目 CRUD](project-lifecycle.md#并发修改不能只看有无行锁)也在业务锁后及 flush 后复核原 ADMIN 会话。\n\n[普通答复](user-interactions.md#首次答复与原答复重放)复用该凭据验证，固定当前 Project/成员资格，再锁 Run/Segment/Interaction；首次、重放及过期续行都经过最终门禁。其他业务仍须按各自设计闭合授权竞争，不能由这些链路推导全系统立即停权或已有 Run 停止。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n现有登录/登出、v2 稳定 CSRF、统一 actor、管理 API 与账户页是接续起点；剩余实现和真实环境缺口以 R05 为准。接口变更同步[认证契约入口](../../PJM/README.md#contracts)、Web client 和回归；不得增加旁路认证。\n\n- 多页面、乱序、换账号：同会话不互撤凭据，原业务动作不自动重放。\n- 错误 challenge/Origin、跨 Project、归档、非 ADMIN：按各层拒绝，不泄露账号或资源。\n- 真正锁等待、并发撤销/登录、停用后启用：旧会话不复活，管理事务完整回滚。\n- 0031 升降级、HTTPS/context path、多 API：旧会话切换、cookie、no-store、代理信任与限流分别验证。\n- [service 回归](../../PJM/backend/tests/auth/test_session_service.py)与[真实会话测试](../../PJM/backend/tests/db/test_real_auth_sessions.py)按替身/真实数据库区分证据；创建测试数据库前确认专用目标授权。"}], "toc": [{"title": "先分清四类凭据", "anchor": "先分清四类凭据", "level": "h2"}, {"title": "威胁边界与目标", "anchor": "威胁边界与目标", "level": "h2"}, {"title": "密码认证", "anchor": "密码认证", "level": "h2"}, {"title": "浏览器会话", "anchor": "浏览器会话", "level": "h2"}, {"title": "会话失效与权限变化", "anchor": "会话失效与权限变化", "level": "h3"}, {"title": "CSRF 与同源约束", "anchor": "csrf-与同源约束", "level": "h2"}, {"title": "会话读取与多页面", "anchor": "会话读取与多页面", "level": "h3"}, {"title": "会话凭据 v2 与切换要求", "anchor": "会话凭据-v2-与切换要求", "level": "h3"}, {"title": "缓存与代理", "anchor": "缓存与代理", "level": "h3"}, {"title": "首个 ADMIN 初始化", "anchor": "首个-admin-初始化", "level": "h2"}, {"title": "权限判定", "anchor": "权限判定", "level": "h2"}, {"title": "认证与业务提交不是同一个事务", "anchor": "认证与业务提交不是同一个事务", "level": "h3"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/authentication.md", "checksum": "88fb70939ad576ff4ff14c3da86890c97d5ad4bde8c22104f62336ce86c54932"}, {"id": "docs/design/login-protection.md", "title": "登录入口防护与失败恢复", "group": "design", "html": "\u003ch1 id=\"登录入口防护与失败恢复\">登录入口防护与失败恢复\u003c/h1>\n\u003cp>本页负责登录/本人改密的配额、短期状态和失败语义；\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>负责身份，\u003ca href=\"#docs/design/user-lifecycle.md::\">用户管理\u003c/a>负责改密事务。当前缺口见\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>，现场操作见\u003ca href=\"#docs/operations/runbook.md::%E7%99%BB%E5%BD%95%E9%98%B2%E6%8A%A4%E7%9A%84%E6%8E%92%E6%9F%A5%E4%B8%8E%E6%81%A2%E5%A4%8D\">Runbook\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子一次登录两次入口请求\">一个例子：一次登录，两次入口请求\u003c/h2>\n\u003cp>Web 每次提交先 GET login-context，再 POST login：正常登录占两次来源配额，一次账号/组合配额。同组合窗口内第六次尝试被拒绝，前五次不必都到密码验证，challenge 拒绝也可能已计数；正确密码不绕过限制。\u003c/p>\n\u003cp>换来源不清账号累计，换账号不清来源累计；NAT 用户共享来源额度。手动重试取新 challenge，不自动重发密码。\u003c/p>\n\u003ch2 id=\"保护范围与执行顺序\">保护范围与执行顺序\u003c/h2>\n\u003cp>middleware 按路径覆盖 login-context、login、users/me/password；错误方法、尾斜线、非法正文也先过来源 gate。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">来源检查 → 路由/正文/header\n  ├─ login-context → 保存 challenge\n  └─ login → Origin → 标准化 email → 账号/组合检查\n               → 消费 challenge → 密码/新会话\n\u003c/code>\u003c/pre>\n\u003cp>正文/header/Origin 拒绝在账号计数前。可标准化 email 在 challenge 前计数，不查询账号存在性绕过 gate；无效 email 不建账号 key，但来源已计数，仍消费 challenge 并 dummy 验密。尾斜线重定向与后续请求分别计来源。\u003c/p>\n\u003cp>LoginAdmission 是同一 AuthService 一次性内存回执，30 秒失效，不公开、不证明密码通过。网络 body/连接/超时仍需 ingress 限制。\u003c/p>\n\u003cp>本人改密：来源 → 请求/Origin/会话 CSRF → 从 actor 取账号计数 → 管理事务验密。它不消费匿名 challenge、不接受另传 email，与登录共享额度；\u003ca href=\"#docs/design/user-lifecycle.md::%E7%94%9F%E6%95%88%E4%B8%8E%E7%95%8C%E9%9D%A2\">管理错误\u003c/a>不能套用匿名登录的全部 401 逻辑。\u003c/p>\n\u003ch2 id=\"计数与退避如何恢复\">计数与退避如何恢复\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>默认窗口与上限\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>来源\u003c/td>\n\u003ctd>60 秒 / 100 个入口 HTTP 请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标准化账号\u003c/td>\n\u003ctd>60 秒 / 15 次尝试，跨来源与登录/改密共享\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账号 + 来源\u003c/td>\n\u003ctd>60 秒 / 5 次尝试，登录/改密共享\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>窗口从首次计数开始，不是自然分钟/滑动窗口。超过上限的请求拒绝并退避 60、120、240、300 秒，封顶 300；等待结束不立即忘掉升级次数。安静至少 900 秒才于下次检查重置，状态最长到最后写入后 1260 秒。\u003c/p>\n\u003cp>阻塞中的单次 Redis 检查不更新其计数、退避或 TTL；但账号拒绝前独立来源检查可能已写入。成功也不清零，避免抹掉其他在途计数；这是尝试限流，不只是错误密码累计。\u003c/p>\n\u003cp>账号/来源/组合同时限制覆盖常见绕过，但持续攻击、NAT 与账号维度仍可能误伤；不是分布式 DoS 防御。取舍参考 \u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html#login-throttling\">OWASP 登录限流\u003c/a>，数值是项目策略。\u003c/p>\n\u003ch2 id=\"短期状态与失败关闭\">短期状态与失败关闭\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/auth/login_protection.py\">LoginProtection\u003c/a>用 Redis TIME；来源一次 EVAL，账号/组合另一次 EVAL，各写入以 SET PX 设置有限 TTL。它们不与 PostgreSQL 会话/账户事务原子提交，Lua 执行错误也不保证回滚先前写入。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>key 缺失/过期\u003c/td>\n\u003ctd>新窗口；驱逐/重启丢失无法与正常过期区分，会削弱累计防护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>格式/版本/类型错或无 TTL\u003c/td>\n\u003ctd>拒绝，不自动删除重置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EVAL 超时/错误/异常结果\u003c/td>\n\u003ctd>503，未进入验密；业务层不自动重试或补偿计数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>challenge 保存/消费未知\u003c/td>\n\u003ctd>503，不发新 challenge/不继续验密；明确缺失、过期、已消费为 403\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>防护故障但会话已存在\u003c/td>\n\u003ctd>读会话/登出仍独立检查 DB 与 CSRF，不因此全部阻断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>key 使用 projectmind:auth:limit:v2: 与 email/来源 SHA-256，不公开 key/状态；hash 不是匿名化，低熵值可被枚举。账号/组合 hash tag 不证明 Redis Cluster 支持，原子脚本不证明故障切换 exactly-once。\u003c/p>\n\u003ch2 id=\"公开响应与客户端责任\">公开响应与客户端责任\u003c/h2>\n\u003cp>沿用 \u003ca href=\"../PJM/contracts/errors/problem/v1.schema.json\">Problem Schema\u003c/a>，不公开触发维度、email、IP 或内部回执。受保护路径的已处理响应含 no-store 和服务器 request_id；不外推到代理/未处理异常。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回\u003c/th>\n\u003cth>含义与客户端处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>429 login_rate_limited\u003c/td>\n\u003ctd>未获本次验密许可；Retry-After 为 1–300 秒，等完不保证通过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>503 login_protection_unavailable\u003c/td>\n\u003ctd>防护无法确认，未验密；不承诺恢复时间或等同账号停用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>401 invalid_credentials\u003c/td>\n\u003ctd>登录凭据失败，不区分账号不存在/停用/密码错误\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403/422/405\u003c/td>\n\u003ctd>Origin/challenge、结构或方法问题；来源可能已消耗，错误不优先于 gate\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改密 400 current_password_rejected\u003c/td>\n\u003ctd>当前密码错误，不注销仍有效会话\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../PJM/web/src/api/http.ts\">HTTP client\u003c/a>仅将非负安全整数的秒数 header 保存为 retryAfterSeconds；日期、小数、溢出不猜测转换，非 JSON 错误也保留 HTTP 元数据。\u003ca href=\"../PJM/web/src/lib/loginFeedback.ts\">loginFeedback\u003c/a>另限制登录范围为 1–300。\u003c/p>\n\u003cp>LoginPage 当前对合法 429 显示静态“至少等 N 秒后手动重试”，不是倒计时或按钮本地锁定；无效 header 用通用提示，503 不套等待 header。提交错误经 zh/ja/en catalog，不直接展示原 message；App 初始会话检查仍是另一条字符串路径。\u003c/p>\n\u003ch2 id=\"提交离页与结果未知\">提交、离页与结果未知\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/web/src/pages/LoginPage.tsx\">LoginPage\u003c/a>用 activeRequest ref 防同 tick 双提交，离页 abort 并清引用；\u003ca href=\"../PJM/web/src/api/auth.ts\">auth client\u003c/a>在 challenge 与密码 POST 之间检查取消。只在请求仍有效时回调，busy/aria-busy 提示在途，不构成多 tab 全局互斥。\u003c/p>\n\u003cp>密码 POST 已发出后，断连/abort/解析失败不能证明 Session 未提交或 cookie 未接收。此类未知不同于明确 429/503；确认应读当前会话，不重发密码，不在 cleanup 自动 logout。登录没有原请求幂等重放，跨页协调/完整未知恢复仍待实现。\u003c/p>\n\u003ch2 id=\"来源识别与上线边界\">来源识别与上线边界\u003c/h2>\n\u003cp>来源取 ASGI request.client；IPv4 与 mapped IPv6 合并，无法识别入 unknown 桶，不自行信任 Forwarded。实际 Traefik/ASGI 拓扑必须验证，信任过窄会共享代理 IP，过宽可伪造；不能通过扩大代理信任或关闭 Origin/CSRF 解决。\u003c/p>\n\u003cp>Settings → .env.example → lifespan 已接组合/账号/来源上限与 Redis 调用 timeout：默认分别 5/15/100、2 秒；允许范围以 \u003ca href=\"../PJM/backend/src/projectmind/core/settings.py\">Settings\u003c/a>为准。timeout 不等于整个 HTTP deadline，窗口/退避不是环境变量策略，所有 API 实例保持一致。\u003c/p>\n\u003cp>limiter namespace v2、状态 JSON v1、session 凭据 v2 是不同版本。新 limiter 不读旧 key；切换需评审旧累计丢失与混跑绕过，不批删 Redis、queue 或 challenge。容量/驱逐/重启/切换与恢复独立验收。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cul>\n\u003cli>非法正文/header/Origin/方法/尾斜线仍先计来源；并发、换来源/账号触发共享维度。\u003c/li>\n\u003cli>连续超限、安静期和成功登录不破坏有限退避；损坏/无 TTL/未知结果 fail closed。\u003c/li>\n\u003cli>已有会话在防护故障时按自身协议读/登出；密码错误不误注销。\u003c/li>\n\u003cli>mock Web 与\u003ca href=\"../PJM/web/tests/browser/check_login.py\">真实表单回归\u003c/a>验证重复/卸载、三语/键盘/窄屏、429/503，不证明真实 cookie/DB。\u003c/li>\n\u003cli>\u003ca href=\"../PJM/backend/tests/auth/test_real_login_protection.py\">实际 Lua\u003c/a>与 \u003ca href=\"../PJM/backend/tests/auth/test_real_login_http.py\">ASGI + Redis\u003c/a>分别证明状态和拒绝顺序；后者不启动网络 server，也不验证真实会话提交。\u003c/li>\n\u003cli>专用隔离 Redis、真实 PostgreSQL、HTTPS 多实例、NAT、多页面与 Redis 切换分别验收；按\u003ca href=\"#docs/development/local-development.md::\">本地指南\u003c/a>准备，不连接用户项目 Redis 做故障实验。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "登录入口防护与失败恢复", "level": "h1", "anchor": "登录入口防护与失败恢复", "text": "# 登录入口防护与失败恢复\n\n本页负责登录/本人改密的配额、短期状态和失败语义；[认证](authentication.md)负责身份，[用户管理](user-lifecycle.md)负责改密事务。当前缺口见[计划 R05](../planning/roadmap.md#r05-领域与身份安全)，现场操作见[Runbook](../operations/runbook.md#登录防护的排查与恢复)。"}, {"title": "一个例子：一次登录，两次入口请求", "level": "h2", "anchor": "一个例子一次登录两次入口请求", "text": "## 一个例子：一次登录，两次入口请求\n\nWeb 每次提交先 GET login-context，再 POST login：正常登录占两次来源配额，一次账号/组合配额。同组合窗口内第六次尝试被拒绝，前五次不必都到密码验证，challenge 拒绝也可能已计数；正确密码不绕过限制。\n\n换来源不清账号累计，换账号不清来源累计；NAT 用户共享来源额度。手动重试取新 challenge，不自动重发密码。"}, {"title": "保护范围与执行顺序", "level": "h2", "anchor": "保护范围与执行顺序", "text": "## 保护范围与执行顺序\n\nmiddleware 按路径覆盖 login-context、login、users/me/password；错误方法、尾斜线、非法正文也先过来源 gate。\n\n```text\n来源检查 → 路由/正文/header\n  ├─ login-context → 保存 challenge\n  └─ login → Origin → 标准化 email → 账号/组合检查\n               → 消费 challenge → 密码/新会话\n```\n\n正文/header/Origin 拒绝在账号计数前。可标准化 email 在 challenge 前计数，不查询账号存在性绕过 gate；无效 email 不建账号 key，但来源已计数，仍消费 challenge 并 dummy 验密。尾斜线重定向与后续请求分别计来源。\n\nLoginAdmission 是同一 AuthService 一次性内存回执，30 秒失效，不公开、不证明密码通过。网络 body/连接/超时仍需 ingress 限制。\n\n本人改密：来源 → 请求/Origin/会话 CSRF → 从 actor 取账号计数 → 管理事务验密。它不消费匿名 challenge、不接受另传 email，与登录共享额度；[管理错误](user-lifecycle.md#生效与界面)不能套用匿名登录的全部 401 逻辑。"}, {"title": "计数与退避如何恢复", "level": "h2", "anchor": "计数与退避如何恢复", "text": "## 计数与退避如何恢复\n\n| 维度 | 默认窗口与上限 |\n| --- | --- |\n| 来源 | 60 秒 / 100 个入口 HTTP 请求 |\n| 标准化账号 | 60 秒 / 15 次尝试，跨来源与登录/改密共享 |\n| 账号 + 来源 | 60 秒 / 5 次尝试，登录/改密共享 |\n\n窗口从首次计数开始，不是自然分钟/滑动窗口。超过上限的请求拒绝并退避 60、120、240、300 秒，封顶 300；等待结束不立即忘掉升级次数。安静至少 900 秒才于下次检查重置，状态最长到最后写入后 1260 秒。\n\n阻塞中的单次 Redis 检查不更新其计数、退避或 TTL；但账号拒绝前独立来源检查可能已写入。成功也不清零，避免抹掉其他在途计数；这是尝试限流，不只是错误密码累计。\n\n账号/来源/组合同时限制覆盖常见绕过，但持续攻击、NAT 与账号维度仍可能误伤；不是分布式 DoS 防御。取舍参考 [OWASP 登录限流](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html#login-throttling)，数值是项目策略。"}, {"title": "短期状态与失败关闭", "level": "h2", "anchor": "短期状态与失败关闭", "text": "## 短期状态与失败关闭\n\n[LoginProtection](../../PJM/backend/src/projectmind/auth/login_protection.py)用 Redis TIME；来源一次 EVAL，账号/组合另一次 EVAL，各写入以 SET PX 设置有限 TTL。它们不与 PostgreSQL 会话/账户事务原子提交，Lua 执行错误也不保证回滚先前写入。\n\n| 情况 | 处理 |\n| --- | --- |\n| key 缺失/过期 | 新窗口；驱逐/重启丢失无法与正常过期区分，会削弱累计防护 |\n| 格式/版本/类型错或无 TTL | 拒绝，不自动删除重置 |\n| EVAL 超时/错误/异常结果 | 503，未进入验密；业务层不自动重试或补偿计数 |\n| challenge 保存/消费未知 | 503，不发新 challenge/不继续验密；明确缺失、过期、已消费为 403 |\n| 防护故障但会话已存在 | 读会话/登出仍独立检查 DB 与 CSRF，不因此全部阻断 |\n\nkey 使用 projectmind:auth:limit:v2: 与 email/来源 SHA-256，不公开 key/状态；hash 不是匿名化，低熵值可被枚举。账号/组合 hash tag 不证明 Redis Cluster 支持，原子脚本不证明故障切换 exactly-once。"}, {"title": "公开响应与客户端责任", "level": "h2", "anchor": "公开响应与客户端责任", "text": "## 公开响应与客户端责任\n\n沿用 [Problem Schema](../../PJM/contracts/errors/problem/v1.schema.json)，不公开触发维度、email、IP 或内部回执。受保护路径的已处理响应含 no-store 和服务器 request_id；不外推到代理/未处理异常。\n\n| 返回 | 含义与客户端处理 |\n| --- | --- |\n| 429 login_rate_limited | 未获本次验密许可；Retry-After 为 1–300 秒，等完不保证通过 |\n| 503 login_protection_unavailable | 防护无法确认，未验密；不承诺恢复时间或等同账号停用 |\n| 401 invalid_credentials | 登录凭据失败，不区分账号不存在/停用/密码错误 |\n| 403/422/405 | Origin/challenge、结构或方法问题；来源可能已消耗，错误不优先于 gate |\n| 改密 400 current_password_rejected | 当前密码错误，不注销仍有效会话 |\n\n[HTTP client](../../PJM/web/src/api/http.ts)仅将非负安全整数的秒数 header 保存为 retryAfterSeconds；日期、小数、溢出不猜测转换，非 JSON 错误也保留 HTTP 元数据。[loginFeedback](../../PJM/web/src/lib/loginFeedback.ts)另限制登录范围为 1–300。\n\nLoginPage 当前对合法 429 显示静态“至少等 N 秒后手动重试”，不是倒计时或按钮本地锁定；无效 header 用通用提示，503 不套等待 header。提交错误经 zh/ja/en catalog，不直接展示原 message；App 初始会话检查仍是另一条字符串路径。"}, {"title": "提交、离页与结果未知", "level": "h2", "anchor": "提交离页与结果未知", "text": "## 提交、离页与结果未知\n\n[LoginPage](../../PJM/web/src/pages/LoginPage.tsx)用 activeRequest ref 防同 tick 双提交，离页 abort 并清引用；[auth client](../../PJM/web/src/api/auth.ts)在 challenge 与密码 POST 之间检查取消。只在请求仍有效时回调，busy/aria-busy 提示在途，不构成多 tab 全局互斥。\n\n密码 POST 已发出后，断连/abort/解析失败不能证明 Session 未提交或 cookie 未接收。此类未知不同于明确 429/503；确认应读当前会话，不重发密码，不在 cleanup 自动 logout。登录没有原请求幂等重放，跨页协调/完整未知恢复仍待实现。"}, {"title": "来源识别与上线边界", "level": "h2", "anchor": "来源识别与上线边界", "text": "## 来源识别与上线边界\n\n来源取 ASGI request.client；IPv4 与 mapped IPv6 合并，无法识别入 unknown 桶，不自行信任 Forwarded。实际 Traefik/ASGI 拓扑必须验证，信任过窄会共享代理 IP，过宽可伪造；不能通过扩大代理信任或关闭 Origin/CSRF 解决。\n\nSettings → .env.example → lifespan 已接组合/账号/来源上限与 Redis 调用 timeout：默认分别 5/15/100、2 秒；允许范围以 [Settings](../../PJM/backend/src/projectmind/core/settings.py)为准。timeout 不等于整个 HTTP deadline，窗口/退避不是环境变量策略，所有 API 实例保持一致。\n\nlimiter namespace v2、状态 JSON v1、session 凭据 v2 是不同版本。新 limiter 不读旧 key；切换需评审旧累计丢失与混跑绕过，不批删 Redis、queue 或 challenge。容量/驱逐/重启/切换与恢复独立验收。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n- 非法正文/header/Origin/方法/尾斜线仍先计来源；并发、换来源/账号触发共享维度。\n- 连续超限、安静期和成功登录不破坏有限退避；损坏/无 TTL/未知结果 fail closed。\n- 已有会话在防护故障时按自身协议读/登出；密码错误不误注销。\n- mock Web 与[真实表单回归](../../PJM/web/tests/browser/check_login.py)验证重复/卸载、三语/键盘/窄屏、429/503，不证明真实 cookie/DB。\n- [实际 Lua](../../PJM/backend/tests/auth/test_real_login_protection.py)与 [ASGI + Redis](../../PJM/backend/tests/auth/test_real_login_http.py)分别证明状态和拒绝顺序；后者不启动网络 server，也不验证真实会话提交。\n- 专用隔离 Redis、真实 PostgreSQL、HTTPS 多实例、NAT、多页面与 Redis 切换分别验收；按[本地指南](../development/local-development.md)准备，不连接用户项目 Redis 做故障实验。"}], "toc": [{"title": "一个例子：一次登录，两次入口请求", "anchor": "一个例子一次登录两次入口请求", "level": "h2"}, {"title": "保护范围与执行顺序", "anchor": "保护范围与执行顺序", "level": "h2"}, {"title": "计数与退避如何恢复", "anchor": "计数与退避如何恢复", "level": "h2"}, {"title": "短期状态与失败关闭", "anchor": "短期状态与失败关闭", "level": "h2"}, {"title": "公开响应与客户端责任", "anchor": "公开响应与客户端责任", "level": "h2"}, {"title": "提交、离页与结果未知", "anchor": "提交离页与结果未知", "level": "h2"}, {"title": "来源识别与上线边界", "anchor": "来源识别与上线边界", "level": "h2"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/login-protection.md", "checksum": "df6fb47f9e50ccd6b65b4d5c9ae63878ef37070c1e8873249749c0b061c5f33b"}, {"id": "docs/design/user-lifecycle.md", "title": "用户生命周期与安全管理", "group": "design", "html": "\u003ch1 id=\"用户生命周期与安全管理\">用户生命周期与安全管理\u003c/h1>\n\u003cp>本页负责账号创建、资料/角色/状态、本人改密、会话撤销与审计；\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>和\u003ca href=\"#docs/design/login-protection.md::\">登录防护\u003c/a>分别定义凭据与配额。账户属于 Organization，不依赖 Project。交付缺口见\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子停用再启用不恢复旧登录\">一个例子：停用再启用，不恢复旧登录\u003c/h2>\n\u003cp>U 版本 7、会话 S1/S2 → ADMIN 停用事务保存 DISABLED/版本 8、撤销 S1/S2、追加审计 → 启用事务保存 ACTIVE/版本 9 与审计。旧会话仍撤销，必须重新登录 S3；改回角色同理。\u003c/p>\n\u003cp>最后一个活动 ADMIN 的停用在首笔事务内拒绝，不先停用再补建。会话撤销不证明已有 SSE/Run/外部进程停止。\u003c/p>\n\u003ch2 id=\"工作副本与公开入口\">工作副本与公开入口\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层\u003c/th>\n\u003cth>现状与缺口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Backend\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/users\">users service/repository\u003c/a>有锁后认证、版本、末位 ADMIN、撤销/审计；测试多为 mock transaction\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DB\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/db/models.py\">models\u003c/a>、\u003ca href=\"../PJM/backend/migrations/versions/0032_user_lifecycle.py\">0032\u003c/a>有用户版本/安全事件，不证明已部署迁移\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP/契约\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/api/routes/users.py\">users route\u003c/a>的 10 个操作已接 \u003ca href=\"../PJM/contracts/users/v1\">Schema\u003c/a>/example、\u003ca href=\"../PJM/contracts/openapi/projectmind-api.v1.json\">OpenAPI\u003c/a>与响应 header 声明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/web/src/pages/AccountsPage.tsx\">AccountsPage\u003c/a>经 \u003ccode>#/accounts\u003c/code> 接入 App；复用 \u003ca href=\"../PJM/web/src/api/users.ts\">users client\u003c/a>、版本表单、安全事件与请求 hook，三语区分本人安全和 ADMIN 管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>初始化/关联\u003c/td>\n\u003ctd>bootstrap 已追加 CREATED；middleware 生成服务器 UUID，不信任 X-Request-ID\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>接续现有实现，不新造平行服务或 client；文件存在不证明真实事务、可访问页面或部署验收。\u003c/p>\n\u003ch2 id=\"场景与非目标\">场景与非目标\u003c/h2>\n\u003cp>所有用户可读本人账户/安全事件、验当前密码后改密、撤销本人全部会话；ADMIN 管理本组织用户。创建不自动加入 Project，移除成员不等于停用账户，ADMIN membership 不决定组织权限。\u003c/p>\n\u003cp>不提供第三角色、匿名注册、找回密码/MFA、硬删账户、管理员代改密码或登录 email 变更。ADMIN 受控提交初始密码仅存 hash，不等于邀请/强制首次改密或公网恢复协议。\u003c/p>\n\u003ch2 id=\"用户操作与目标公开面\">用户操作与目标公开面\u003c/h2>\n\u003cp>以下操作由 /api/v1 路由与账户页消费；真实事务和部署仍须独立验收：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>本人读取\u003c/td>\n\u003ctd>GET /users/me/account、/users/me/security-events\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本人安全变更\u003c/td>\n\u003ctd>POST /users/me/password、/users/me/sessions/revoke\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMIN 列表/创建\u003c/td>\n\u003ctd>GET /users、POST /users\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMIN 精确读取/修改\u003c/td>\n\u003ctd>GET /users/{user_id}、PUT /users/{user_id}\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMIN 撤销/审计\u003c/td>\n\u003ctd>POST /users/{user_id}/sessions/revoke、GET /users/{user_id}/security-events\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"版本查询与公开数据\">版本、查询与公开数据\u003c/h3>\n\u003cp>既有账户 mutation 均要求正整数 expected_row_version，先验版本再判 no-op；旧版即使值相同也冲突。同版无变化 PUT 不增版/事件，改密/撤销即使撤销零行也增版审计。\u003c/p>\n\u003cp>email 组织内标准化唯一，不等于创建幂等；重复 email 不证明原请求成功，不覆盖密码/角色。用户 q 最长 200，limit 1–100 默认 25，offset 非负；按 email/ID 排序，通配符作普通字符，响应 items/total/limit/offset。审计按目标分页，不用首页过滤冒充完整历史；offset 稳定排序不是跨页快照。\u003c/p>\n\u003cp>ADMIN 冲突后读精确 ID，保留原版本与非敏感草稿供比较，用户确认后再提交。本人走 me/account，USER 不能借管理读取他人。\u003c/p>\n\u003cp>账户 allowlist 仅 ID/email/display_name/role/status/version/时间；变更另报本次 revoked_sessions 和当前会话是否失效。撤销数包括未标记撤销的过期行，不是在线人数。安全事件不返回密码/token/hash/任意 metadata，响应/client no-store，不推广全站缓存保证。\u003c/p>\n\u003ch3 id=\"改密入口的配额\">改密入口的配额\u003c/h3>\n\u003cp>来源检查先于正文 → 请求/Origin/会话 CSRF → actor 账号/组合配额 → 管理事务验密/更新。共享登录配额/退避，成功不清零，不发匿名 challenge、不接受另传账号。Redis 未确认则 429/503 拒绝，不进入昂贵验密/管理变更，不与 DB 画成同事务。\u003c/p>\n\u003ch2 id=\"事务与并发\">事务与并发\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">入口认证事务结束\n  → 管理事务锁 Organization → User（ID 升序）→ AuthSession（ID 升序）\n  → 锁后重新验证原凭据/权限/期限、目标版本、活动 ADMIN\n  → 账户 + 撤销 + 追加审计一起 commit 或 rollback\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>与 bootstrap 共用组织串行化点；actor/target User 去重排序。正常登录 User → AuthSession，不反向获取 Organization。\u003c/li>\n\u003cli>所需锁结束后取新时间，核对原 token/CSRF、期限、撤销、账户/角色；耗时验密 await 后、应用变更前再验期限。\u003c/li>\n\u003cli>授权判定点是持锁时最终检查，不承诺物理 commit 瞬间未过期；合法自撤销后不能再用“会话未撤销”否定自身。\u003c/li>\n\u003cli>降级/停用活动 ADMIN 在组织锁内确认仍有另一个活动 ADMIN；所有管理写入遵循同序，不能外推任意 SQL。\u003c/li>\n\u003cli>改密、角色/状态变化、主动撤销使目标所有未撤销会话持久失效；只改 display_name 不撤销。User 锁与新登录协调，避免漏撤销。\u003c/li>\n\u003cli>新用户先 flush 父行再插审计，flush 不是 commit；任何审计失败整体回滚。组织锁保守串行化，优化须有实 DB 数据。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"审计与请求关联\">审计与请求关联\u003c/h2>\n\u003cp>row_version 仅账户/安全链路，不随偏好、语言或登录时间变。UserSecurityEvent 保存 actor/target、CREATED/UPDATED/PASSWORD_CHANGED/SESSIONS_REVOKED、版本、前后角色/状态、撤销数、时间/UUID；每目标版本最多一条，不是全部字段差异历史。\u003c/p>\n\u003cp>服务器生成关联 UUID，header/Problem/审计一致；不沿用客户端 ID。request ID 不是幂等键，重发产生新 ID；拒绝/no-op 未必有事件，查不到不能证明请求未到达。\u003c/p>\n\u003cp>bootstrap 用新 ADMIN 自身作 actor、CLI UUID 作关联，同事务保存；任何 ADMIN（含 DISABLED）存在均拒绝，不是恢复通道。追加式是用例约束，FK/唯一键不证明 DB 已禁所有 UPDATE/DELETE，不开放普通删改审计 API。\u003c/p>\n\u003ch2 id=\"生效与界面\">生效与界面\u003c/h2>\n\u003cp>账户入口独立于 Project，本人安全与 ADMIN 管理分开；没有项目或项目列表仍在加载时也可访问。首次项目读取不清除账户草稿，用户实际切换项目时丢弃旧表单；隐藏按钮不代替授权。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>成功且当前会话已撤销、401 失效\u003c/td>\n\u003ctd>清本地身份/密码，要求重登；不额外 logout，不自动重放原动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>400 current_password_rejected\u003c/td>\n\u003ctd>密码错误，保留有效登录态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403/404\u003c/td>\n\u003ctd>CSRF/ADMIN 权限与目标不可访问分别提示，不切目标/提权/重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 user_version_conflict\u003c/td>\n\u003ctd>读精确账户，保留草稿，由用户比较后采用新版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 last_active_admin / user_email_conflict\u003c/td>\n\u003ctd>保留末位 ADMIN / 不覆盖原账户；刷新版本不能自动解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422\u003c/td>\n\u003ctd>修参数，不展示可能含密码的原始校验输入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>429/503\u003c/td>\n\u003ctd>有限等待或不可用，不自动发密码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>timeout/断连/abort\u003c/td>\n\u003ctd>结果未知，核对当前身份、原目标/版本及授权审计，不推断回滚\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>当前账户/新版本本身不证明原操作造成，无专用重放时不承诺 exactly-once。表单同步 ref 防双提交，换 actor/Project、卸载后丢弃旧结果；密码/token 不进 URL/storage/日志，email 搜索不入遥测，三语/键盘/窄屏均覆盖。\u003c/p>\n\u003ch2 id=\"迁移与历史兼容\">迁移与历史兼容\u003c/h2>\n\u003cp>0032 给旧用户 row_version=1，不补造 CREATED；有任意安全事件拒绝 downgrade 丢表，不删事件凑条件。0031 会话协议是另一迁移，按\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E4%B8%8E%E5%9B%9E%E9%80%80%E5%AE%A1%E6%9F%A5\">发布审查\u003c/a>分别验收。\u003c/p>\n\u003cp>备份可能恢复旧角色/密码/会话，按\u003ca href=\"#docs/operations/backup-recovery.md::%E6%81%A2%E5%A4%8D%E5%90%8E%E9%AA%8C%E8%AF%81\">恢复后验证\u003c/a>重核安全事实，不提供未经审查的 SQL 清表/撤权。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>修改时合跑 users/API/contracts，核对错误、Schema、OpenAPI 与实际账户页；浏览器入口及 mock 的限度见\u003ca href=\"#docs/development/local-development.md::%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E5%9B%9E%E5%B8%B0\">本地验证\u003c/a>。专用授权环境仍须验证：\u003c/p>\n\u003cul>\n\u003cli>双 ADMIN 互停用/降级、bootstrap、登录/撤销竞争，末位保护与完整回滚。\u003c/li>\n\u003cli>锁等待过期/撤权、角色改回、停用后启用，旧会话不复活。\u003c/li>\n\u003cli>旧版本/no-op/重复 email/审计失败，冲突无部分变更，唯一键不冒充幂等。\u003c/li>\n\u003cli>改密错误/配额/Redis 不可用，拒绝阶段准确、不误注销；可信 UUID 与 DTO 无泄漏。\u003c/li>\n\u003cli>实组件的未知、同 tick 双提交和换 actor；真实双浏览器/HTTPS/DB 另验。\u003c/li>\n\u003cli>0031/0032 升降级与备份恢复，不伪造旧审计；mock 或离线文档检查不替代真实事务。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "用户生命周期与安全管理", "level": "h1", "anchor": "用户生命周期与安全管理", "text": "# 用户生命周期与安全管理\n\n本页负责账号创建、资料/角色/状态、本人改密、会话撤销与审计；[认证](authentication.md)和[登录防护](login-protection.md)分别定义凭据与配额。账户属于 Organization，不依赖 Project。交付缺口见[计划 R05](../planning/roadmap.md#r05-领域与身份安全)。"}, {"title": "一个例子：停用再启用，不恢复旧登录", "level": "h2", "anchor": "一个例子停用再启用不恢复旧登录", "text": "## 一个例子：停用再启用，不恢复旧登录\n\nU 版本 7、会话 S1/S2 → ADMIN 停用事务保存 DISABLED/版本 8、撤销 S1/S2、追加审计 → 启用事务保存 ACTIVE/版本 9 与审计。旧会话仍撤销，必须重新登录 S3；改回角色同理。\n\n最后一个活动 ADMIN 的停用在首笔事务内拒绝，不先停用再补建。会话撤销不证明已有 SSE/Run/外部进程停止。"}, {"title": "工作副本与公开入口", "level": "h2", "anchor": "工作副本与公开入口", "text": "## 工作副本与公开入口\n\n| 层 | 现状与缺口 |\n| --- | --- |\n| Backend | [users service/repository](../../PJM/backend/src/projectmind/users/)有锁后认证、版本、末位 ADMIN、撤销/审计；测试多为 mock transaction |\n| DB | [models](../../PJM/backend/src/projectmind/db/models.py)、[0032](../../PJM/backend/migrations/versions/0032_user_lifecycle.py)有用户版本/安全事件，不证明已部署迁移 |\n| HTTP/契约 | [users route](../../PJM/backend/src/projectmind/api/routes/users.py)的 10 个操作已接 [Schema](../../PJM/contracts/users/v1/)/example、[OpenAPI](../../PJM/contracts/openapi/projectmind-api.v1.json)与响应 header 声明 |\n| Web | [AccountsPage](../../PJM/web/src/pages/AccountsPage.tsx)经 `#/accounts` 接入 App；复用 [users client](../../PJM/web/src/api/users.ts)、版本表单、安全事件与请求 hook，三语区分本人安全和 ADMIN 管理 |\n| 初始化/关联 | bootstrap 已追加 CREATED；middleware 生成服务器 UUID，不信任 X-Request-ID |\n\n接续现有实现，不新造平行服务或 client；文件存在不证明真实事务、可访问页面或部署验收。"}, {"title": "场景与非目标", "level": "h2", "anchor": "场景与非目标", "text": "## 场景与非目标\n\n所有用户可读本人账户/安全事件、验当前密码后改密、撤销本人全部会话；ADMIN 管理本组织用户。创建不自动加入 Project，移除成员不等于停用账户，ADMIN membership 不决定组织权限。\n\n不提供第三角色、匿名注册、找回密码/MFA、硬删账户、管理员代改密码或登录 email 变更。ADMIN 受控提交初始密码仅存 hash，不等于邀请/强制首次改密或公网恢复协议。"}, {"title": "用户操作与目标公开面", "level": "h2", "anchor": "用户操作与目标公开面", "text": "## 用户操作与目标公开面\n\n以下操作由 /api/v1 路由与账户页消费；真实事务和部署仍须独立验收：\n\n| 操作 | 入口 |\n| --- | --- |\n| 本人读取 | GET /users/me/account、/users/me/security-events |\n| 本人安全变更 | POST /users/me/password、/users/me/sessions/revoke |\n| ADMIN 列表/创建 | GET /users、POST /users |\n| ADMIN 精确读取/修改 | GET /users/{user_id}、PUT /users/{user_id} |\n| ADMIN 撤销/审计 | POST /users/{user_id}/sessions/revoke、GET /users/{user_id}/security-events |"}, {"title": "版本、查询与公开数据", "level": "h3", "anchor": "版本查询与公开数据", "text": "### 版本、查询与公开数据\n\n既有账户 mutation 均要求正整数 expected_row_version，先验版本再判 no-op；旧版即使值相同也冲突。同版无变化 PUT 不增版/事件，改密/撤销即使撤销零行也增版审计。\n\nemail 组织内标准化唯一，不等于创建幂等；重复 email 不证明原请求成功，不覆盖密码/角色。用户 q 最长 200，limit 1–100 默认 25，offset 非负；按 email/ID 排序，通配符作普通字符，响应 items/total/limit/offset。审计按目标分页，不用首页过滤冒充完整历史；offset 稳定排序不是跨页快照。\n\nADMIN 冲突后读精确 ID，保留原版本与非敏感草稿供比较，用户确认后再提交。本人走 me/account，USER 不能借管理读取他人。\n\n账户 allowlist 仅 ID/email/display_name/role/status/version/时间；变更另报本次 revoked_sessions 和当前会话是否失效。撤销数包括未标记撤销的过期行，不是在线人数。安全事件不返回密码/token/hash/任意 metadata，响应/client no-store，不推广全站缓存保证。"}, {"title": "改密入口的配额", "level": "h3", "anchor": "改密入口的配额", "text": "### 改密入口的配额\n\n来源检查先于正文 → 请求/Origin/会话 CSRF → actor 账号/组合配额 → 管理事务验密/更新。共享登录配额/退避，成功不清零，不发匿名 challenge、不接受另传账号。Redis 未确认则 429/503 拒绝，不进入昂贵验密/管理变更，不与 DB 画成同事务。"}, {"title": "事务与并发", "level": "h2", "anchor": "事务与并发", "text": "## 事务与并发\n\n```text\n入口认证事务结束\n  → 管理事务锁 Organization → User（ID 升序）→ AuthSession（ID 升序）\n  → 锁后重新验证原凭据/权限/期限、目标版本、活动 ADMIN\n  → 账户 + 撤销 + 追加审计一起 commit 或 rollback\n```\n\n- 与 bootstrap 共用组织串行化点；actor/target User 去重排序。正常登录 User → AuthSession，不反向获取 Organization。\n- 所需锁结束后取新时间，核对原 token/CSRF、期限、撤销、账户/角色；耗时验密 await 后、应用变更前再验期限。\n- 授权判定点是持锁时最终检查，不承诺物理 commit 瞬间未过期；合法自撤销后不能再用“会话未撤销”否定自身。\n- 降级/停用活动 ADMIN 在组织锁内确认仍有另一个活动 ADMIN；所有管理写入遵循同序，不能外推任意 SQL。\n- 改密、角色/状态变化、主动撤销使目标所有未撤销会话持久失效；只改 display_name 不撤销。User 锁与新登录协调，避免漏撤销。\n- 新用户先 flush 父行再插审计，flush 不是 commit；任何审计失败整体回滚。组织锁保守串行化，优化须有实 DB 数据。"}, {"title": "审计与请求关联", "level": "h2", "anchor": "审计与请求关联", "text": "## 审计与请求关联\n\nrow_version 仅账户/安全链路，不随偏好、语言或登录时间变。UserSecurityEvent 保存 actor/target、CREATED/UPDATED/PASSWORD_CHANGED/SESSIONS_REVOKED、版本、前后角色/状态、撤销数、时间/UUID；每目标版本最多一条，不是全部字段差异历史。\n\n服务器生成关联 UUID，header/Problem/审计一致；不沿用客户端 ID。request ID 不是幂等键，重发产生新 ID；拒绝/no-op 未必有事件，查不到不能证明请求未到达。\n\nbootstrap 用新 ADMIN 自身作 actor、CLI UUID 作关联，同事务保存；任何 ADMIN（含 DISABLED）存在均拒绝，不是恢复通道。追加式是用例约束，FK/唯一键不证明 DB 已禁所有 UPDATE/DELETE，不开放普通删改审计 API。"}, {"title": "生效与界面", "level": "h2", "anchor": "生效与界面", "text": "## 生效与界面\n\n账户入口独立于 Project，本人安全与 ADMIN 管理分开；没有项目或项目列表仍在加载时也可访问。首次项目读取不清除账户草稿，用户实际切换项目时丢弃旧表单；隐藏按钮不代替授权。\n\n| 返回 | 处理 |\n| --- | --- |\n| 成功且当前会话已撤销、401 失效 | 清本地身份/密码，要求重登；不额外 logout，不自动重放原动作 |\n| 400 current_password_rejected | 密码错误，保留有效登录态 |\n| 403/404 | CSRF/ADMIN 权限与目标不可访问分别提示，不切目标/提权/重试 |\n| 409 user_version_conflict | 读精确账户，保留草稿，由用户比较后采用新版本 |\n| 409 last_active_admin / user_email_conflict | 保留末位 ADMIN / 不覆盖原账户；刷新版本不能自动解决 |\n| 422 | 修参数，不展示可能含密码的原始校验输入 |\n| 429/503 | 有限等待或不可用，不自动发密码 |\n| timeout/断连/abort | 结果未知，核对当前身份、原目标/版本及授权审计，不推断回滚 |\n\n当前账户/新版本本身不证明原操作造成，无专用重放时不承诺 exactly-once。表单同步 ref 防双提交，换 actor/Project、卸载后丢弃旧结果；密码/token 不进 URL/storage/日志，email 搜索不入遥测，三语/键盘/窄屏均覆盖。"}, {"title": "迁移与历史兼容", "level": "h2", "anchor": "迁移与历史兼容", "text": "## 迁移与历史兼容\n\n0032 给旧用户 row_version=1，不补造 CREATED；有任意安全事件拒绝 downgrade 丢表，不删事件凑条件。0031 会话协议是另一迁移，按[发布审查](../operations/deployment.md#迁移与回退审查)分别验收。\n\n备份可能恢复旧角色/密码/会话，按[恢复后验证](../operations/backup-recovery.md#恢复后验证)重核安全事实，不提供未经审查的 SQL 清表/撤权。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n修改时合跑 users/API/contracts，核对错误、Schema、OpenAPI 与实际账户页；浏览器入口及 mock 的限度见[本地验证](../development/local-development.md#ブラウザ回帰)。专用授权环境仍须验证：\n\n- 双 ADMIN 互停用/降级、bootstrap、登录/撤销竞争，末位保护与完整回滚。\n- 锁等待过期/撤权、角色改回、停用后启用，旧会话不复活。\n- 旧版本/no-op/重复 email/审计失败，冲突无部分变更，唯一键不冒充幂等。\n- 改密错误/配额/Redis 不可用，拒绝阶段准确、不误注销；可信 UUID 与 DTO 无泄漏。\n- 实组件的未知、同 tick 双提交和换 actor；真实双浏览器/HTTPS/DB 另验。\n- 0031/0032 升降级与备份恢复，不伪造旧审计；mock 或离线文档检查不替代真实事务。"}], "toc": [{"title": "一个例子：停用再启用，不恢复旧登录", "anchor": "一个例子停用再启用不恢复旧登录", "level": "h2"}, {"title": "工作副本与公开入口", "anchor": "工作副本与公开入口", "level": "h2"}, {"title": "场景与非目标", "anchor": "场景与非目标", "level": "h2"}, {"title": "用户操作与目标公开面", "anchor": "用户操作与目标公开面", "level": "h2"}, {"title": "版本、查询与公开数据", "anchor": "版本查询与公开数据", "level": "h3"}, {"title": "改密入口的配额", "anchor": "改密入口的配额", "level": "h3"}, {"title": "事务与并发", "anchor": "事务与并发", "level": "h2"}, {"title": "审计与请求关联", "anchor": "审计与请求关联", "level": "h2"}, {"title": "生效与界面", "anchor": "生效与界面", "level": "h2"}, {"title": "迁移与历史兼容", "anchor": "迁移与历史兼容", "level": "h2"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/user-lifecycle.md", "checksum": "cfbf62f2bfee3167d9aa3899ee2f6a5c56985f057fa067325f8995ce81fb3978"}, {"id": "docs/design/secret-storage.md", "title": "Secret 保存、解析与轮换", "group": "design", "html": "\u003ch1 id=\"secret-保存解析与轮换\">Secret 保存、解析与轮换\u003c/h1>\n\u003cp>本页负责外部 Provider 凭据；\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>负责浏览器 token，\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>负责模型连接配置，\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>负责批准。凭据可用不授予额外 scope/Tool 权限，当前缺口见\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子保存成功不等于资源可用\">一个例子：保存成功不等于资源可用\u003c/h2>\n\u003cp>ADMIN 保存 MANAGED key 时，引用与密文同事务提交，公开响应不返回原值。执行时 Worker 先验证冻结 binding，再解析给 Provider；外部 key 仍可能已撤销。保存、配置就绪、远端访问是三种事实，不是一笔跨系统事务。\u003c/p>\n\u003ch2 id=\"三种来源的边界\">三种来源的边界\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>来源\u003c/th>\n\u003cth>保存与约束\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ENVIRONMENT\u003c/td>\n\u003ctd>DB 只存 locator，原值由部署环境提供；宿主/配置仍可能有副本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FILE\u003c/td>\n\u003ctd>受控 /run/secrets 文件，不是用户上传或 Run input\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MANAGED\u003c/td>\n\u003ctd>ADMIN 提交明文，DB 独立表保存 AES-256-GCM 密文；部署密钥另保管\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>ENVIRONMENT/FILE 的“零 at-rest”仅指应用 DB 不存原值。正式部署优先受控文件注入；Settings 不支持任意 _FILE 自动替代，不能与 FILE resolver 混淆。\u003c/p>\n\u003cp>当前 FILE 仅词法限制绝对路径与 ..，普通 stat/read_text 不防 symlink/替换竞争。部署须独占管理、最小只读挂载；目标补最终文件、链接竞争与权限验证。\u003c/p>\n\u003cp>resolver 上限为 65,536 UTF-8 bytes，FILE 去末尾 CR/LF，ENVIRONMENT 不去；MANAGED 创建另限 8,192 bytes。空值/超限拒绝，不截断继续。\u003c/p>\n\u003ch2 id=\"managed-的实际加密结构\">MANAGED 的实际加密结构\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/core/secret_crypto.py\">SecretCipher\u003c/a>直接用 32-byte 主密钥执行 AES-256-GCM，每次随机 nonce，Project/引用身份作为 AAD；没有逐项 DEK 包装层，不称为信封加密。\u003c/p>\n\u003cp>既有设置 PROJECTMIND_MANAGED_SECRET_KEK 与 kek_version 名称保持兼容；更换 DEK/KMS 方案需另设计版本/迁移，不能据改名重写旧密文。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>载体\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>SecretReference\u003c/td>\n\u003ctd>provider/resolver/locator/key_version/status；公开不含 locator/原值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ManagedSecretMaterial\u003c/td>\n\u003ctd>引用/Project、nonce、ciphertext、kek_version；引用 key_version 与密文版本不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keyring\u003c/td>\n\u003ctd>首项新加密 active，旧项解密；与 DB dump 分开保管，不入 Run/日志/Agent\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AAD\u003c/td>\n\u003ctd>固定格式绑定 Project + 引用；不能代替访问授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"明文与威胁边界\">明文与威胁边界\u003c/h3>\n\u003cp>创建时 ADMIN 页面/API、使用时 Worker/Provider 必须短暂接触明文；要求不回显、不入响应/日志/Evidence/workspace/prompt/业务子进程环境，而非声称 Web/API 从不接触。\u003c/p>\n\u003cp>该结构降低 DB 单独泄漏风险，不防同时控制应用进程与 DB 的攻击者。字段 redaction 也不证明任意自由文本已脱敏，不因此引入 Vault/KMS 或扩大服务暴露。\u003c/p>\n\u003ch2 id=\"读取与失效\">读取与失效\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/agent/run_binding.py\">run_binding\u003c/a>先重验 Run binding、Integration、capability 与同 Project 引用，再由 \u003ca href=\"../PJM/backend/src/projectmind/integrations/secrets.py\">DeploymentSecretResolver\u003c/a>解析。\u003c/p>\n\u003cp>停用、缺材料、未知密钥版、AAD/密文错误、不可读/空/超限均 fail closed，不换引用或空凭据降级。停用只阻止后续解析，不能收回已解出的值或已发送请求；立即切断外部访问另走 incident 流程。\u003c/p>\n\u003cp>Run 不存原值；替换引用/连接 revision 不改写旧 snapshot。相同明文重加密不应改变 binding 身份或 scope。\u003c/p>\n\u003ch2 id=\"轮换不是更换外部凭据\">轮换不是更换外部凭据\u003c/h2>\n\u003cp>存储密钥 k1 → k2 的重加密不改变外部 API key，更不撤销其权限。\u003ca href=\"../PJM/backend/src/projectmind/integrations/repository.py\">rotate_managed_material\u003c/a>锁定材料并事务重加密；active 标签相同的行直接 skipped，不验证解密。标签必须稳定对应同一 key bytes，不能将全 skipped 当作可读证明。\u003c/p>\n\u003ch3 id=\"切换与恢复的顺序\">切换与恢复的顺序\u003c/h3>\n\u003col>\n\u003cli>确认获批维护窗口，独立保留 DB 恢复点及对应旧 key，不在普通清单登记原值。\u003c/li>\n\u003cli>所有读写进程加载“新 active + 旧解密 key”；cipher 在启动时构造，只改 CLI 环境不更新 API/Worker。按\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">环境边界\u003c/a>核对 migrate 等实际持钥者。\u003c/li>\n\u003cli>运行既有 CLI 并检查退出/计数；旧实例仍可写旧版时不能宣称完成，行锁不防随后旧配置写入。\u003c/li>\n\u003cli>受控验证必要解密与完整读取链后再移出现用旧 key；当前无全量只读验证 CLI，不输出原值作替代。\u003c/li>\n\u003cli>只要备份仍需旧 key，就独立安全保管恢复副本；仅 DB dump 无法恢复丢失密钥。\u003c/li>\n\u003c/ol>\n\u003cp>命令集中在 \u003ca href=\"#docs/operations/runbook.md::managed-secret-%E3%81%AE-kek-%E9%81%8B%E7%94%A8\">Runbook\u003c/a>，不承诺热更新或已演练。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>\u003ca href=\"#PJM/README.md::contracts\">契约入口\u003c/a>与 \u003ca href=\"#PJM/README.md::backend\">Backend\u003c/a>连接现有实现；R05/R11 保留加固与部署缺口。\u003c/p>\n\u003cul>\n\u003cli>跨 Project/非 ADMIN 拒绝，响应不含 locator/原值/密文；引用与材料完整回滚。\u003c/li>\n\u003cli>key/AAD/篡改、空值、文件不可读均安全拒绝；FILE symlink/替换需独立真实文件测试。\u003c/li>\n\u003cli>API/Worker/CLI 混合配置不误接新材料、不降级；skipped 不替代解密验证。\u003c/li>\n\u003cli>旧备份与对应 key 能恢复，Run/binding 不变；crypto/helper 或 fake repository 测试不证明真实 DB、进程切换、Web 明文处理及恢复。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "Secret 保存、解析与轮换", "level": "h1", "anchor": "secret-保存解析与轮换", "text": "# Secret 保存、解析与轮换\n\n本页负责外部 Provider 凭据；[认证](authentication.md)负责浏览器 token，[Runtime](agent-runtime.md)负责模型连接配置，[受控写入](repository-effects.md)负责批准。凭据可用不授予额外 scope/Tool 权限，当前缺口见[计划 R05](../planning/roadmap.md#r05-领域与身份安全)。"}, {"title": "一个例子：保存成功不等于资源可用", "level": "h2", "anchor": "一个例子保存成功不等于资源可用", "text": "## 一个例子：保存成功不等于资源可用\n\nADMIN 保存 MANAGED key 时，引用与密文同事务提交，公开响应不返回原值。执行时 Worker 先验证冻结 binding，再解析给 Provider；外部 key 仍可能已撤销。保存、配置就绪、远端访问是三种事实，不是一笔跨系统事务。"}, {"title": "三种来源的边界", "level": "h2", "anchor": "三种来源的边界", "text": "## 三种来源的边界\n\n| 来源 | 保存与约束 |\n| --- | --- |\n| ENVIRONMENT | DB 只存 locator，原值由部署环境提供；宿主/配置仍可能有副本 |\n| FILE | 受控 /run/secrets 文件，不是用户上传或 Run input |\n| MANAGED | ADMIN 提交明文，DB 独立表保存 AES-256-GCM 密文；部署密钥另保管 |\n\nENVIRONMENT/FILE 的“零 at-rest”仅指应用 DB 不存原值。正式部署优先受控文件注入；Settings 不支持任意 _FILE 自动替代，不能与 FILE resolver 混淆。\n\n当前 FILE 仅词法限制绝对路径与 ..，普通 stat/read_text 不防 symlink/替换竞争。部署须独占管理、最小只读挂载；目标补最终文件、链接竞争与权限验证。\n\nresolver 上限为 65,536 UTF-8 bytes，FILE 去末尾 CR/LF，ENVIRONMENT 不去；MANAGED 创建另限 8,192 bytes。空值/超限拒绝，不截断继续。"}, {"title": "MANAGED 的实际加密结构", "level": "h2", "anchor": "managed-的实际加密结构", "text": "## MANAGED 的实际加密结构\n\n[SecretCipher](../../PJM/backend/src/projectmind/core/secret_crypto.py)直接用 32-byte 主密钥执行 AES-256-GCM，每次随机 nonce，Project/引用身份作为 AAD；没有逐项 DEK 包装层，不称为信封加密。\n\n既有设置 PROJECTMIND_MANAGED_SECRET_KEK 与 kek_version 名称保持兼容；更换 DEK/KMS 方案需另设计版本/迁移，不能据改名重写旧密文。\n\n| 载体 | 边界 |\n| --- | --- |\n| SecretReference | provider/resolver/locator/key_version/status；公开不含 locator/原值 |\n| ManagedSecretMaterial | 引用/Project、nonce、ciphertext、kek_version；引用 key_version 与密文版本不同 |\n| keyring | 首项新加密 active，旧项解密；与 DB dump 分开保管，不入 Run/日志/Agent |\n| AAD | 固定格式绑定 Project + 引用；不能代替访问授权 |"}, {"title": "明文与威胁边界", "level": "h3", "anchor": "明文与威胁边界", "text": "### 明文与威胁边界\n\n创建时 ADMIN 页面/API、使用时 Worker/Provider 必须短暂接触明文；要求不回显、不入响应/日志/Evidence/workspace/prompt/业务子进程环境，而非声称 Web/API 从不接触。\n\n该结构降低 DB 单独泄漏风险，不防同时控制应用进程与 DB 的攻击者。字段 redaction 也不证明任意自由文本已脱敏，不因此引入 Vault/KMS 或扩大服务暴露。"}, {"title": "读取与失效", "level": "h2", "anchor": "读取与失效", "text": "## 读取与失效\n\n[run_binding](../../PJM/backend/src/projectmind/agent/run_binding.py)先重验 Run binding、Integration、capability 与同 Project 引用，再由 [DeploymentSecretResolver](../../PJM/backend/src/projectmind/integrations/secrets.py)解析。\n\n停用、缺材料、未知密钥版、AAD/密文错误、不可读/空/超限均 fail closed，不换引用或空凭据降级。停用只阻止后续解析，不能收回已解出的值或已发送请求；立即切断外部访问另走 incident 流程。\n\nRun 不存原值；替换引用/连接 revision 不改写旧 snapshot。相同明文重加密不应改变 binding 身份或 scope。"}, {"title": "轮换不是更换外部凭据", "level": "h2", "anchor": "轮换不是更换外部凭据", "text": "## 轮换不是更换外部凭据\n\n存储密钥 k1 → k2 的重加密不改变外部 API key，更不撤销其权限。[rotate_managed_material](../../PJM/backend/src/projectmind/integrations/repository.py)锁定材料并事务重加密；active 标签相同的行直接 skipped，不验证解密。标签必须稳定对应同一 key bytes，不能将全 skipped 当作可读证明。"}, {"title": "切换与恢复的顺序", "level": "h3", "anchor": "切换与恢复的顺序", "text": "### 切换与恢复的顺序\n\n1. 确认获批维护窗口，独立保留 DB 恢复点及对应旧 key，不在普通清单登记原值。\n2. 所有读写进程加载“新 active + 旧解密 key”；cipher 在启动时构造，只改 CLI 环境不更新 API/Worker。按[环境边界](../operations/deployment.md#环境文件与配置边界)核对 migrate 等实际持钥者。\n3. 运行既有 CLI 并检查退出/计数；旧实例仍可写旧版时不能宣称完成，行锁不防随后旧配置写入。\n4. 受控验证必要解密与完整读取链后再移出现用旧 key；当前无全量只读验证 CLI，不输出原值作替代。\n5. 只要备份仍需旧 key，就独立安全保管恢复副本；仅 DB dump 无法恢复丢失密钥。\n\n命令集中在 [Runbook](../operations/runbook.md#managed-secret-の-kek-運用)，不承诺热更新或已演练。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n[契约入口](../../PJM/README.md#contracts)与 [Backend](../../PJM/README.md#backend)连接现有实现；R05/R11 保留加固与部署缺口。\n\n- 跨 Project/非 ADMIN 拒绝，响应不含 locator/原值/密文；引用与材料完整回滚。\n- key/AAD/篡改、空值、文件不可读均安全拒绝；FILE symlink/替换需独立真实文件测试。\n- API/Worker/CLI 混合配置不误接新材料、不降级；skipped 不替代解密验证。\n- 旧备份与对应 key 能恢复，Run/binding 不变；crypto/helper 或 fake repository 测试不证明真实 DB、进程切换、Web 明文处理及恢复。"}], "toc": [{"title": "一个例子：保存成功不等于资源可用", "anchor": "一个例子保存成功不等于资源可用", "level": "h2"}, {"title": "三种来源的边界", "anchor": "三种来源的边界", "level": "h2"}, {"title": "MANAGED 的实际加密结构", "anchor": "managed-的实际加密结构", "level": "h2"}, {"title": "明文与威胁边界", "anchor": "明文与威胁边界", "level": "h3"}, {"title": "读取与失效", "anchor": "读取与失效", "level": "h2"}, {"title": "轮换不是更换外部凭据", "anchor": "轮换不是更换外部凭据", "level": "h2"}, {"title": "切换与恢复的顺序", "anchor": "切换与恢复的顺序", "level": "h3"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/secret-storage.md", "checksum": "58ed847950257739922bfa05d86e2f969f78f1a3024d5e856f67be7491270fa5"}, {"id": "docs/design/skill-contract.md", "title": "Skill 兼容、解释与发布", "group": "design", "html": "\u003ch1 id=\"skill-兼容解释与发布\">Skill 兼容、解释与发布\u003c/h1>\n\u003cp>本页是目录式 Skill 的语义契约与生命周期正本；代码调用见\u003ca href=\"#docs/design/skill-interpretation.md::\">解释实现\u003c/a>，进度见\u003ca href=\"#docs/planning/roadmap.md::r06-skill-%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9F\">计划 R06\u003c/a>。\u003c/p>\n\u003ch2 id=\"设计目标\">设计目标\u003c/h2>\n\u003cp>外部 Skill 无需先改为平台专用目录或业务 Schema。Interpreter 理解目标、资源、规则、交付物；业务字段可动态派生，平台只固定跨组件控制协议。\u003c/p>\n\u003cp>Tool/Shell/network/write 声明只是需求，不能授予权限。必需规则与禁止事项不能为了可运行而弱化；推荐步骤允许在冻结权限内调整。来源、解释与调整保留 trace，发布版本不可原地改写。\u003c/p>\n\u003ch2 id=\"分层架构\">分层架构\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">可信 ImportAdapter / Normalizer → 不执行来源的静态分析\n  → 版本化 Interpreter 系统 Skill + 模型\n  → 确定性 Validator → Preview / 追加调整\n  → ADMIN Publisher → Project 启用 → TaskProjector / RuntimeLoader\n\u003c/code>\u003c/pre>\n\u003cp>业务层依赖 SkillInterpreter 抽象，不依赖 SDK message。来源不能携带或替换 Adapter；脚本只作为来源与 checksum 对象，自动执行仅可走已注册 Provider。\u003c/p>\n\u003ch2 id=\"导入兼容层\">导入兼容层\u003c/h2>\n\u003cp>当前支持本地目录 CLI、内联 JSON、多文件 multipart；Directory/Generic Markdown 读取主说明、metadata、references、scripts 和文本资产，见 \u003ca href=\"../PJM/backend/src/projectmind/skills/importer.py\">importer\u003c/a>。\u003c/p>\n\u003cp>不执行脚本、安装依赖、访问来源 URL 或解析 Secret。ZIP/TAR 自动解包与远程 Git URL 尚未提供；新增前必须定义路径穿越/symlink/设备文件、体积/数量与固定 revision 防护。\u003c/p>\n\u003cp>NormalizedSkillPackage 保存来源身份、adapter version、content hash、文件索引、原文/未知 metadata、静态发现和 source trace。统一索引不能丢弃未理解原文或提升其权限。\u003c/p>\n\u003ch2 id=\"interpreter-的核心输出\">Interpreter 的核心输出\u003c/h2>\n\u003ch3 id=\"capabilityblueprint\">CapabilityBlueprint\u003c/h3>\n\u003cp>主要产物是 \u003ca href=\"../PJM/contracts/capability-blueprint/v1.schema.json\">CapabilityBlueprint\u003c/a>，不是业务表单 Schema：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>capability/intents/objectives\u003c/td>\n\u003ctd>能做什么、何时调用、完成什么目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>resource_requirements\u003c/td>\n\u003ctd>抽象资源、必需性、访问与绑定条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>guidance/success_criteria\u003c/td>\n\u003ctd>必需规则、建议步骤、质量依据与禁止事项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>deliverables/interaction_points/effect_intents\u003c/td>\n\u003ctd>交付、澄清/审查/批准点与可能效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>source_traces/assumptions/questions\u003c/td>\n\u003ctd>来源依据和不应伪造的未知\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>新领域 capability 不必预先注册；只有真正 Tool 调用使用 repository.read/v1 等注册版本 ID。\u003c/p>\n\u003ch3 id=\"resourcerequirement\">ResourceRequirement\u003c/h3>\n\u003cp>资源以 kind、required、access、versioned capabilities 和 selection_guidance 表达，例如“必须提供可读 repository，优先用户指定 revision，否则询问”。accepted_providers 是兼容提示，不替代实际 capability/scope 校验。\u003c/p>\n\u003cp>多个资源独立 requirement；Project/Run 在创建前选定绑定。运行交互只能补充冻结 scope 内信息，不换 Integration/文档或扩权；变化需新 Run，见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>。\u003c/p>\n\u003ch3 id=\"guidance-与约束\">Guidance 与约束\u003c/h3>\n\u003cp>required_rules 必须遵守；recommended_steps 可重排；quality_criteria 约束最终证据/完整性；prohibited_actions 与平台硬拒绝独立生效。原文和规范化 guidance 均冻结，Worker 得到 checksum/引用，不能只传丢规则的摘要。\u003c/p>\n\u003ch3 id=\"taskblueprint-与动态参数\">TaskBlueprint 与动态参数\u003c/h3>\n\u003cp>TaskBlueprint 投影目标、资源槽位、参数、交付与效果策略。稳定输入/机器消费输出可从受限 TaskContractDraft 编译 Schema；开放分析可仅用 OutcomeEnvelope、Markdown/Artifact、Evidence 和 Proposal。缺业务 Schema、ViewSpec 或 fixture 不能单独阻止解释/发布。\u003c/p>\n\u003ch2 id=\"平台-contracts-的边界\">平台 contracts 的边界\u003c/h2>\n\u003cp>contracts 固定 API/Problem/RunEvent、Manifest/Blueprint/Brief/Outcome、Interaction/Effect/Evidence 与 Tool request/response/error 等通用协议，不预置某类业务结果模型或保存 Skill Gold。业务实例和评价数据在各自资产/测试边界，结构正确不证明推理正确。\u003c/p>\n\u003ch2 id=\"解释请求与响应\">解释请求与响应\u003c/h2>\n\u003ch3 id=\"冻结输入\">冻结输入\u003c/h3>\n\u003cp>冻结 SkillSource/hash/文件索引/adapter、归一化与静态报告、资源/Tool catalog、目标协议、Interpreter Skill/version/prompt checksum、模型参数、父解释及调整指示。不包含 Project credential。\u003c/p>\n\u003ch3 id=\"结构化响应\">结构化响应\u003c/h3>\n\u003cp>响应包含 summary、compatibility、Blueprint、trace/diagnostics 与可选 confidence/assumptions/questions/TaskContractDraft。完整结构失败不能偷包自由文本为已验证 Manifest；调整追加新 Interpretation、parent lineage 和 diff。\u003c/p>\n\u003cp>默认 SDK structured-output；显式 PROJECTMIND_SKILL_INTERPRETER_ACCEPT_PROMPT_JSON=true 可接收文本中的完整 JSON，但不补字段或绕过 Schema/identity/hash/gate。兼容路径不算 structured-output 已验收。\u003c/p>\n\u003ch3 id=\"防提示注入\">防提示注入\u003c/h3>\n\u003cp>平台规则、发布 guidance、用户输入、Tool 外部数据分别信任。来源文本不得泄露 Secret、修改系统指令或授予未注册 Tool；记录 diagnostic 并按上层边界处理。发现明文 credential 在模型解释前阻断，不等模型脱敏。\u003c/p>\n\u003ch2 id=\"兼容级别与运行就绪度\">兼容级别与运行就绪度\u003c/h2>\n\u003ch3 id=\"发布与就绪的判断顺序\">发布与就绪的判断顺序\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事实\u003c/th>\n\u003cth>仍需检查\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>parse / Preview\u003c/td>\n\u003ctd>来源可审查，不代表有合法蓝图或可发布\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gate_passed\u003c/td>\n\u003ctd>无 hard error，warning 仍需 ADMIN 显式接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PUBLISHED\u003c/td>\n\u003ctd>精确版已发布，Project 仍须显式启用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Project 已启用\u003c/td>\n\u003ctd>资源、真实已安装 Provider 与策略决定 readiness\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RUNNABLE/ACTIONABLE\u003c/td>\n\u003ctd>创建重验输入/资源，apply 仍校验精确批准\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"兼容级别\">兼容级别\u003c/h3>\n\u003cp>native/adapted/assisted 是实际小写标签，不是发布状态。native 不提供绕过 Interpreter 的路径；Adapter 只归一化，手工 native fixture 不构成产品通道。assisted 产生待接受 warning，仍满足其他 gate。\u003c/p>\n\u003ch3 id=\"运行就绪度\">运行就绪度\u003c/h3>\n\u003cp>GUIDANCE_ONLY 仅指导/人工清单；CONFIGURATION_REQUIRED 待参数/资源；RUNNABLE 只读/工作区能力就绪；ACTIONABLE 识别可 apply 的资源与 Provider，不表示 Proposal 已批准或远端可达。\u003c/p>\n\u003cp>SkillVersion 属 Organization，Project 复用精确版并独立计算 readiness。未启用不可发现，新发布不自动增加执行面。\u003c/p>\n\u003ch2 id=\"校验与发布门禁\">校验与发布门禁\u003c/h2>\n\u003cp>硬门禁：来源/hash/解释 identity 一致，蓝图合法，trace 指向真实文件，Tool requirement 版本格式正确，无 credential/路径逃逸/任意宿主命令授权/远程可执行引用，效果正确区分 observe/propose/apply，Manifest checksum/lineage/发布者有效。\u003c/p>\n\u003cp>未知业务概念、缺可选 Schema/ViewSpec/fixture、Project 未配资源、推荐步骤不完整或 assisted 标签本身不构成 hard error；必要配置仍须创建前补齐，warning 必须明确接受。\u003c/p>\n\u003cp>蓝图只由 Interpreter 生成；parse Draft 可为 null，发布报 capability_blueprint_missing。Manifest Schema 容纳 Draft 不等于免发布 gate，不能从旧 workflow/data_sources 反推蓝图。\u003c/p>\n\u003ch2 id=\"runtimemanifest-v1alpha1\">RuntimeManifest v1alpha1\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/contracts/runtime-manifest/v1alpha1.schema.json\">Schema\u003c/a>中的 manifest_version 精确为 projectmind/v1alpha1。Manifest 冻结蓝图/任务、Tool/资源、规则、执行建议、效果和可选 Schema；字段以契约为准，不另造语义摘要字段。\u003c/p>\n\u003cp>从 DRAFT 创建起内容/checksum 固定。发布状态、发布者/时间、接受 warning 属版本/gate metadata，不重写 Manifest。资源唯一声明位于 capability_blueprint.resource_requirements，无顶层 data_sources；具体 Integration/Secret 不进入 Manifest。\u003c/p>\n\u003ch2 id=\"skill-组合\">Skill 组合\u003c/h2>\n\u003cp>现行 SkillComposition（Module）只把精确版本任务归组，ProjectComposition 控制展示；无跨 Skill 规则求解器、自动编排或组合授予权限。\u003c/p>\n\u003cp>未来组合提示/偏好须先定版本/快照：平台安全最高，Project scope 限制，各 Skill required 均保留；冲突要求选择，不直接运行。组合只可调推荐步骤/表达，虚拟角色不是系统角色。\u003c/p>\n\u003ch2 id=\"版本回滚与评价\">版本、回滚与评价\u003c/h2>\n\u003ch3 id=\"版本内容与可见性\">版本内容与可见性\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>现行边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>发布/废弃\u003c/td>\n\u003ctd>DRAFT → PUBLISHED → DEPRECATED；重复发布读原行，废弃不可复活\u00
