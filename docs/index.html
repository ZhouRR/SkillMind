区边界", "anchor": "tool-与工作区边界", "level": "h2"}, {"title": "Tool 分类", "anchor": "tool-分类", "level": "h3"}, {"title": "文件、Shell 和 Web", "anchor": "文件shell-和-web", "level": "h3"}, {"title": "PreToolUse 判定", "anchor": "pretooluse-判定", "level": "h3"}, {"title": "资源快照的物化", "anchor": "资源快照的物化", "level": "h3"}, {"title": "持续 Run 与多会话", "anchor": "持续-run-与多会话", "level": "h2"}, {"title": "生命周期", "anchor": "生命周期", "level": "h3"}, {"title": "Segment、Attempt 与 Session 的区别", "anchor": "segmentattempt-与-session-的区别", "level": "h3"}, {"title": "会话延续策略", "anchor": "会话延续策略", "level": "h3"}, {"title": "从领取到模型启动的边界", "anchor": "从领取到模型启动的边界", "level": "h3"}, {"title": "取消、超时与失去执行权", "anchor": "取消超时与失去执行权", "level": "h3"}, {"title": "用户交互协议", "anchor": "用户交互协议", "level": "h2"}, {"title": "外部效果协议", "anchor": "外部效果协议", "level": "h2"}, {"title": "结果与输出验证", "anchor": "结果与输出验证", "level": "h2"}, {"title": "事件、状态与可靠性", "anchor": "事件状态与可靠性", "level": "h2"}, {"title": "Claude Agent SDK 实现要求", "anchor": "claude-agent-sdk-实现要求", "level": "h2"}, {"title": "安全测试矩阵", "anchor": "安全测试矩阵", "level": "h2"}, {"title": "当前实现边界", "anchor": "当前实现边界", "level": "h2"}], "source": "design/agent-runtime.md", "checksum": "fa07d27876fc82f15ef3a46d28e3bb669eeb8d2eecee6e4bc5423e82fb245ff1"}, {"id": "docs/design/user-interactions.md", "title": "用户答复、等待与续行", "group": "design", "html": "\u003ch1 id=\"用户答复等待与续行\">用户答复、等待与续行\u003c/h1>\n\u003cp>本页定义普通交互的提出、答复、过期和原请求确认。外部批准见\u003ca href=\"#docs/design/repository-effects.md::\">受控效果\u003c/a>，结果评价见\u003ca href=\"#docs/design/results-evaluation.md::\">结果设计\u003c/a>；实施状态见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划 R07\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清三种人工参与\">先分清三种人工参与\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>改变什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>普通答复\u003c/td>\n\u003ctd>CLARIFICATION/CHOICE/REVIEW 追加 Response 与新 Segment，不改目标/资源/权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部批准\u003c/td>\n\u003ctd>独立 decision API 决定精确 Proposal version/checksum，APPROVED 不等于已写入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evaluation\u003c/td>\n\u003ctd>对保存的 Result 追加判断，不改原值、不恢复终态\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>REVIEW 不等于 Evaluation。普通答复需当前 ProjectWriteActor，批准另外限发起人或 system ADMIN。\u003c/p>\n\u003ch2 id=\"一个例子回答超时不等于什么都没发生\">一个例子：回答超时不等于什么都没发生\u003c/h2>\n\u003cp>问题推荐 A、也可选 B，用户提交 B 后丢响应：可能 B 与新 Segment/Outbox 已提交，应确认原请求；也可能已过期，服务端先提交无答复续行再返回 410；另一成员先回答则返回 409 并保留对方决定。\u003c/p>\n\u003cp>推荐不是默认答案，required=false 不自动跳过，也不允许空答案；当前无 skip。超时记录“未收到答复”，不能伪造用户选了推荐项。\u003c/p>\n\u003ch2 id=\"提问与答复的实际形状\">提问与答复的实际形状\u003c/h2>\n\u003cp>精确字段见\u003ca href=\"../PJM/contracts/tools/interaction.request/v1/request.schema.json\">提问 Tool\u003c/a>和\u003ca href=\"../PJM/contracts/runs/interaction-response/v1/request.schema.json\">答复契约\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>prompt/rationale/impact\u003c/td>\n\u003ctd>公开说明，不含 hidden reasoning、系统 prompt 或 Secret\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>options\u003c/td>\n\u003ctd>必须存在，可空；新问题的 key 唯一，CHOICE 至少两项；按 allow_multiple 限制，recommended 仅提示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回答\u003c/td>\n\u003ctd>CLARIFICATION/REVIEW 非空 text；CHOICE 选已知 key，可附 text，不经文本换绑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>required/期限\u003c/td>\n\u003ctd>所有普通交互暂停；过期可无信息续行。expires_at 从事件 occurred_at 解析，不按打开页面重算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>checkpoint/continuation\u003c/td>\n\u003ctd>冻结问题依据，回答追加到新段，Session 续行另守 Runtime 兼容\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>每 Run 最多一个 OPEN 交互。持久化校验 checkpoint 的 Evidence/Artifact/Proposal 归属，格式不证明可读；期限以服务端为准。\u003c/p>\n\u003cp>旧问题若有重复选项 key，原文保留只读，不再收取无法区分含义的新答案；已有原答复仍可按原身份确认，不改旧选项、payload 或 hash。\u003c/p>\n\u003ch3 id=\"普通提问不能代替外部批准\">普通提问不能代替外部批准\u003c/h3>\n\u003cp>interaction.request 只允许 CLARIFICATION/CHOICE/REVIEW；Tool Schema、parser 与直接持久化入口使用同一限制，普通等待只能进入 WAITING_FOR_INPUT。外部效果统一 change.propose → 关联批准 → decision/Effect，不能通过普通答案取得批准。\u003c/p>\n\u003cp>共享 enum 中合法 Proposal 与旧 detail/event 保持可读。旧无 Proposal 的 EFFECT_APPROVAL 只读辨认，既不接受普通答复，也不由普通过期恢复解锁；不伪造 Proposal、批准或改写历史记录。\u003c/p>\n\u003ch2 id=\"三个提交边界\">三个提交边界\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">提问事务：问题/checkpoint/事件 + Segment WAITING\n          Attempt DEFERRED / 主 Session IDLE / 释放 lease\n  ↓\n答复或过期事务：关闭旧交互/Segment\n               新 Segment + 事件/Outbox，Run QUEUED\n  ↓\n新 Attempt：准备输入 / 冻结 Brief / 启动校验 → Session\n\u003c/code>\u003c/pre>\n\u003cp>提问锁顺序 Run → Segment → Attempt，重验 lease/RUNNING/取消。等待保存与 lease 释放不证明进程退出/费用结清，\u003ca href=\"#docs/design/run-supervision.md::%E7%AD%89%E5%BE%85%E6%8F%90%E4%BA%A4%E4%BB%8D%E6%98%AF%E7%8B%AC%E7%AB%8B%E8%BE%B9%E7%95%8C\">监督\u003c/a>另管；任何事务都不持锁等模型或资源 I/O。\u003c/p>\n\u003ch3 id=\"首次答复与原答复重放\">首次答复与原答复重放\u003c/h3>\n\u003cp>POST /api/v1/projects/{project_id}/runs/{run_id}/interactions/{interaction_id}/responses 带当前 Session/Origin/CSRF、Idempotency-Key、interaction_version/response。入口认证与业务事务分开。\u003c/p>\n\u003cp>答复事务须复核入口的原会话凭据，而不是只接收 actor_id。先复用 Organization → User → AuthSession 锁序，再锁当前 Project 与 USER 的成员资格，最后按 Run → Segment → Interaction 加锁并刷新问题。ADMIN 也不能跨组织或绕过归档。\u003c/p>\n\u003cp>Project/成员使用 FOR SHARE：阻止状态修改，同时兼容 Worker 保存 Project 外键引用需要的 KEY SHARE，避免答复等 Run、Worker 又等 Project 的锁环。模式依据 \u003ca href=\"https://www.postgresql.org/docs/current/explicit-locking.html#LOCKING-ROWS\">PostgreSQL 行锁规则\u003c/a>；仍须真实事务验收。\u003c/p>\n\u003cp>拿齐业务锁后，以当前时刻复查原会话、CSRF 与当前资格，再校验题型并查询原 Response；首次还验 OPEN、原版本、当前期限、Run 与原 Segment 的等待状态。同事务保存回答、关闭旧段、追加新段/事件/Outbox；flush 后再验会话期限，才允许提交。\u003c/p>\n\u003cp>首次返回 201 / Idempotent-Replay: false，重放返回 200 / Idempotent-Replay: true，且 header 与 body 的 idempotent_replay 必须一致。详情与答复不缓存；Web 核验状态码、header、白名单字段和原 Project/Run/Interaction，而非把任意 2xx 当成功。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>身份项\u003c/th>\n\u003cth>准确边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>interaction_version\u003c/td>\n\u003ctd>问题原版本，不是 Run.row_version，不刷新版本自动重发旧答案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>key/hash\u003c/td>\n\u003ctd>按 interaction 唯一答复比较原 key 与 ID/版本/payload hash；对象键规范化，选择数组顺序不变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重放响应\u003c/td>\n\u003ctd>response_id/run_segment_id 是原答复，status/row_version 是当前 Run，不强制退回 QUEUED\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>actor\u003c/td>\n\u003ctd>首次保存回答者；重放独立核对原 actor_id，仍须当前 Project 授权，不要求与 Run 发起人相同\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>原 actor 独立比较，不加入或重算旧 request_hash。其他成员不能用相同答案/键确认别人的请求；已有答复可以在当前授权详情中阅读。首次与重放都经过上述授权门禁；答复先持锁则先完成，撤权/归档先完成则拒绝。不外推为其他业务、已有 SSE 或模型立即停权。\u003c/p>\n\u003ch3 id=\"过期与拒绝响应\">过期与拒绝响应\u003c/h3>\n\u003cp>首次答复锁后发现到期，或 Recovery 扫描到期：等待 Run 记录 EXPIRED/INTERACTION_EXPIRED、INTERACTION_TIMEOUT 新段与 dispatch，不造 Response；Run 已终态/续行时只关闭旧交互，不重开或追加末次事件之后的记录。\u003c/p>\n\u003cp>service 在事务内捕获 InteractionExpiredError，最终授权仍有效且过期事实已提交后才返回 410，所以 410 不等于回滚。最终认证失败则连同过期续行一起回滚并返回权限错误；commit 失败仍可能未知。QUEUED 也不证明 Worker 已恢复，dispatch/队列仍可阻塞。\u003c/p>\n\u003ch2 id=\"答复界面与结果未知\">答复界面与结果未知\u003c/h2>\n\u003cp>草稿与已发送意图分开；同一浏览器页面内，以原 actor/会话/Project/Run/Interaction 为边界保留原版本、payload 与 key。答复状态只有一个所有者，不能因切换观察标签、详情重新加载，或问题从 OPEN 移到历史区而丢失。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>界面规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>编辑/发送\u003c/td>\n\u003ctd>显示原问题/期限/推荐；同步防重，共用 30 秒请求期限，发送后草稿不改原请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>确认成功\u003c/td>\n\u003ctd>回执确定原 response_id/续行；不以较旧 row_version 回退 Run，再读取当前详情\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 / 410\u003c/td>\n\u003ctd>读取原 Project/Run 详情中的原问题、已有答复与续行；不覆盖别人，不声称没有发生变更\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422 / 身份权限失败\u003c/td>\n\u003ctd>用稳定 Problem 分类和三语提示，不直接显示服务端原始正文；登录后不自动重发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网络/超时/abort/无效响应\u003c/td>\n\u003ctd>保留原请求，读取当前事实；不自动重试、换键或宣称 rollback\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>详情刷新失败\u003c/td>\n\u003ctd>保留待确认意图，不将旧详情当作当前可写资格；自动刷新与人工 GET 的明确权限拒绝均关闭确认门禁，普通读失败不证明提交失败\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>“读取当前事实”只发送 GET；相同正文、作者或已续行都不能证明丢失的那次 POST。“确认原答复”是用户明确发起的同 key、原版本和原 payload POST：若此前已提交，返回原回执；若此前未落库，可能完成首次提交。页面必须说明这一副作用，不把它命名为纯查询。\u003c/p>\n\u003cp>每次 await/callback 前验当前身份与请求世代；同一 ID 离开后再返回也不能接收旧结果。Abort 不撤销服务端。换账号/会话/Project/Run、离页后旧响应无效；原请求仅存页面内存，整页刷新不保证恢复，不放 URL/Web storage/日志。重新进入先读授权历史，不从本地无 key 推断未提交。\u003c/p>\n\u003ch2 id=\"兼容与开发接续\">兼容与开发接续\u003c/h2>\n\u003cp>这是普通提问入口的安全收窄：旧 Worker 不应继续产生 EFFECT_APPROVAL，API/Worker/Web 配套发布并停止旧写入者；历史读取 enum 与 hash 不变，不用数据迁移“修复”旧悬空等待。\u003c/p>\n\u003cp>回答请求遵守原公开 Schema：原版本为正整数，可选字段可省略但不接受显式 null、空选择或额外字段；不对已发送正文、对象或选择顺序做新一轮整形。Web 不接受无法无损表示的整数。批准和 Evaluation 仍有独立协议，不能复用普通答复的原请求确认。\u003c/p>\n\u003ch2 id=\"验收条件\">验收条件\u003c/h2>\n\u003cp>覆盖禁止普通 EFFECT_APPROVAL 但保留合法/旧记录；CHOICE/REVIEW/非必答无隐式选择；原请求同 Response/Segment/dispatch；同键改内容/版本/actor 冲突；双人/expiry 竞争只一续行；410 已提交过期而未保存答案；丢响应/同 tick/切换不乱写；终态不重开。\u003c/p>\n\u003cp>真实 DB 锁/回滚、浏览器时序、模型暂停退出分别验证。代码入口见\u003ca href=\"#PJM/README.md::\">代码根 README\u003c/a>。\u003c/p>\n", "sections": [{"title": "用户答复、等待与续行", "level": "h1", "anchor": "用户答复等待与续行", "text": "# 用户答复、等待与续行\n\n本页定义普通交互的提出、答复、过期和原请求确认。外部批准见[受控效果](repository-effects.md)，结果评价见[结果设计](results-evaluation.md)；实施状态见[计划 R07](../planning/roadmap.md#r07-run-与审计)。"}, {"title": "先分清三种人工参与", "level": "h2", "anchor": "先分清三种人工参与", "text": "## 先分清三种人工参与\n\n| 操作 | 改变什么 |\n| --- | --- |\n| 普通答复 | CLARIFICATION/CHOICE/REVIEW 追加 Response 与新 Segment，不改目标/资源/权限 |\n| 外部批准 | 独立 decision API 决定精确 Proposal version/checksum，APPROVED 不等于已写入 |\n| Evaluation | 对保存的 Result 追加判断，不改原值、不恢复终态 |\n\nREVIEW 不等于 Evaluation。普通答复需当前 ProjectWriteActor，批准另外限发起人或 system ADMIN。"}, {"title": "一个例子：回答超时不等于什么都没发生", "level": "h2", "anchor": "一个例子回答超时不等于什么都没发生", "text": "## 一个例子：回答超时不等于什么都没发生\n\n问题推荐 A、也可选 B，用户提交 B 后丢响应：可能 B 与新 Segment/Outbox 已提交，应确认原请求；也可能已过期，服务端先提交无答复续行再返回 410；另一成员先回答则返回 409 并保留对方决定。\n\n推荐不是默认答案，required=false 不自动跳过，也不允许空答案；当前无 skip。超时记录“未收到答复”，不能伪造用户选了推荐项。"}, {"title": "提问与答复的实际形状", "level": "h2", "anchor": "提问与答复的实际形状", "text": "## 提问与答复的实际形状\n\n精确字段见[提问 Tool](../../PJM/contracts/tools/interaction.request/v1/request.schema.json)和[答复契约](../../PJM/contracts/runs/interaction-response/v1/request.schema.json)。\n\n| 内容 | 规则 |\n| --- | --- |\n| prompt/rationale/impact | 公开说明，不含 hidden reasoning、系统 prompt 或 Secret |\n| options | 必须存在，可空；新问题的 key 唯一，CHOICE 至少两项；按 allow_multiple 限制，recommended 仅提示 |\n| 回答 | CLARIFICATION/REVIEW 非空 text；CHOICE 选已知 key，可附 text，不经文本换绑 |\n| required/期限 | 所有普通交互暂停；过期可无信息续行。expires_at 从事件 occurred_at 解析，不按打开页面重算 |\n| checkpoint/continuation | 冻结问题依据，回答追加到新段，Session 续行另守 Runtime 兼容 |\n\n每 Run 最多一个 OPEN 交互。持久化校验 checkpoint 的 Evidence/Artifact/Proposal 归属，格式不证明可读；期限以服务端为准。\n\n旧问题若有重复选项 key，原文保留只读，不再收取无法区分含义的新答案；已有原答复仍可按原身份确认，不改旧选项、payload 或 hash。"}, {"title": "普通提问不能代替外部批准", "level": "h3", "anchor": "普通提问不能代替外部批准", "text": "### 普通提问不能代替外部批准\n\ninteraction.request 只允许 CLARIFICATION/CHOICE/REVIEW；Tool Schema、parser 与直接持久化入口使用同一限制，普通等待只能进入 WAITING_FOR_INPUT。外部效果统一 change.propose → 关联批准 → decision/Effect，不能通过普通答案取得批准。\n\n共享 enum 中合法 Proposal 与旧 detail/event 保持可读。旧无 Proposal 的 EFFECT_APPROVAL 只读辨认，既不接受普通答复，也不由普通过期恢复解锁；不伪造 Proposal、批准或改写历史记录。"}, {"title": "三个提交边界", "level": "h2", "anchor": "三个提交边界", "text": "## 三个提交边界\n\n```text\n提问事务：问题/checkpoint/事件 + Segment WAITING\n          Attempt DEFERRED / 主 Session IDLE / 释放 lease\n  ↓\n答复或过期事务：关闭旧交互/Segment\n               新 Segment + 事件/Outbox，Run QUEUED\n  ↓\n新 Attempt：准备输入 / 冻结 Brief / 启动校验 → Session\n```\n\n提问锁顺序 Run → Segment → Attempt，重验 lease/RUNNING/取消。等待保存与 lease 释放不证明进程退出/费用结清，[监督](run-supervision.md#等待提交仍是独立边界)另管；任何事务都不持锁等模型或资源 I/O。"}, {"title": "首次答复与原答复重放", "level": "h3", "anchor": "首次答复与原答复重放", "text": "### 首次答复与原答复重放\n\nPOST /api/v1/projects/{project_id}/runs/{run_id}/interactions/{interaction_id}/responses 带当前 Session/Origin/CSRF、Idempotency-Key、interaction_version/response。入口认证与业务事务分开。\n\n答复事务须复核入口的原会话凭据，而不是只接收 actor_id。先复用 Organization → User → AuthSession 锁序，再锁当前 Project 与 USER 的成员资格，最后按 Run → Segment → Interaction 加锁并刷新问题。ADMIN 也不能跨组织或绕过归档。\n\nProject/成员使用 FOR SHARE：阻止状态修改，同时兼容 Worker 保存 Project 外键引用需要的 KEY SHARE，避免答复等 Run、Worker 又等 Project 的锁环。模式依据 [PostgreSQL 行锁规则](https://www.postgresql.org/docs/current/explicit-locking.html#LOCKING-ROWS)；仍须真实事务验收。\n\n拿齐业务锁后，以当前时刻复查原会话、CSRF 与当前资格，再校验题型并查询原 Response；首次还验 OPEN、原版本、当前期限、Run 与原 Segment 的等待状态。同事务保存回答、关闭旧段、追加新段/事件/Outbox；flush 后再验会话期限，才允许提交。\n\n首次返回 201 / Idempotent-Replay: false，重放返回 200 / Idempotent-Replay: true，且 header 与 body 的 idempotent_replay 必须一致。详情与答复不缓存；Web 核验状态码、header、白名单字段和原 Project/Run/Interaction，而非把任意 2xx 当成功。\n\n| 身份项 | 准确边界 |\n| --- | --- |\n| interaction_version | 问题原版本，不是 Run.row_version，不刷新版本自动重发旧答案 |\n| key/hash | 按 interaction 唯一答复比较原 key 与 ID/版本/payload hash；对象键规范化，选择数组顺序不变 |\n| 重放响应 | response_id/run_segment_id 是原答复，status/row_version 是当前 Run，不强制退回 QUEUED |\n| actor | 首次保存回答者；重放独立核对原 actor_id，仍须当前 Project 授权，不要求与 Run 发起人相同 |\n\n原 actor 独立比较，不加入或重算旧 request_hash。其他成员不能用相同答案/键确认别人的请求；已有答复可以在当前授权详情中阅读。首次与重放都经过上述授权门禁；答复先持锁则先完成，撤权/归档先完成则拒绝。不外推为其他业务、已有 SSE 或模型立即停权。"}, {"title": "过期与拒绝响应", "level": "h3", "anchor": "过期与拒绝响应", "text": "### 过期与拒绝响应\n\n首次答复锁后发现到期，或 Recovery 扫描到期：等待 Run 记录 EXPIRED/INTERACTION_EXPIRED、INTERACTION_TIMEOUT 新段与 dispatch，不造 Response；Run 已终态/续行时只关闭旧交互，不重开或追加末次事件之后的记录。\n\nservice 在事务内捕获 InteractionExpiredError，最终授权仍有效且过期事实已提交后才返回 410，所以 410 不等于回滚。最终认证失败则连同过期续行一起回滚并返回权限错误；commit 失败仍可能未知。QUEUED 也不证明 Worker 已恢复，dispatch/队列仍可阻塞。"}, {"title": "答复界面与结果未知", "level": "h2", "anchor": "答复界面与结果未知", "text": "## 答复界面与结果未知\n\n草稿与已发送意图分开；同一浏览器页面内，以原 actor/会话/Project/Run/Interaction 为边界保留原版本、payload 与 key。答复状态只有一个所有者，不能因切换观察标签、详情重新加载，或问题从 OPEN 移到历史区而丢失。\n\n| 情况 | 界面规则 |\n| --- | --- |\n| 编辑/发送 | 显示原问题/期限/推荐；同步防重，共用 30 秒请求期限，发送后草稿不改原请求 |\n| 确认成功 | 回执确定原 response_id/续行；不以较旧 row_version 回退 Run，再读取当前详情 |\n| 409 / 410 | 读取原 Project/Run 详情中的原问题、已有答复与续行；不覆盖别人，不声称没有发生变更 |\n| 422 / 身份权限失败 | 用稳定 Problem 分类和三语提示，不直接显示服务端原始正文；登录后不自动重发 |\n| 网络/超时/abort/无效响应 | 保留原请求，读取当前事实；不自动重试、换键或宣称 rollback |\n| 详情刷新失败 | 保留待确认意图，不将旧详情当作当前可写资格；自动刷新与人工 GET 的明确权限拒绝均关闭确认门禁，普通读失败不证明提交失败 |\n\n“读取当前事实”只发送 GET；相同正文、作者或已续行都不能证明丢失的那次 POST。“确认原答复”是用户明确发起的同 key、原版本和原 payload POST：若此前已提交，返回原回执；若此前未落库，可能完成首次提交。页面必须说明这一副作用，不把它命名为纯查询。\n\n每次 await/callback 前验当前身份与请求世代；同一 ID 离开后再返回也不能接收旧结果。Abort 不撤销服务端。换账号/会话/Project/Run、离页后旧响应无效；原请求仅存页面内存，整页刷新不保证恢复，不放 URL/Web storage/日志。重新进入先读授权历史，不从本地无 key 推断未提交。"}, {"title": "兼容与开发接续", "level": "h2", "anchor": "兼容与开发接续", "text": "## 兼容与开发接续\n\n这是普通提问入口的安全收窄：旧 Worker 不应继续产生 EFFECT_APPROVAL，API/Worker/Web 配套发布并停止旧写入者；历史读取 enum 与 hash 不变，不用数据迁移“修复”旧悬空等待。\n\n回答请求遵守原公开 Schema：原版本为正整数，可选字段可省略但不接受显式 null、空选择或额外字段；不对已发送正文、对象或选择顺序做新一轮整形。Web 不接受无法无损表示的整数。批准和 Evaluation 仍有独立协议，不能复用普通答复的原请求确认。"}, {"title": "验收条件", "level": "h2", "anchor": "验收条件", "text": "## 验收条件\n\n覆盖禁止普通 EFFECT_APPROVAL 但保留合法/旧记录；CHOICE/REVIEW/非必答无隐式选择；原请求同 Response/Segment/dispatch；同键改内容/版本/actor 冲突；双人/expiry 竞争只一续行；410 已提交过期而未保存答案；丢响应/同 tick/切换不乱写；终态不重开。\n\n真实 DB 锁/回滚、浏览器时序、模型暂停退出分别验证。代码入口见[代码根 README](../../PJM/README.md)。"}], "toc": [{"title": "先分清三种人工参与", "anchor": "先分清三种人工参与", "level": "h2"}, {"title": "一个例子：回答超时不等于什么都没发生", "anchor": "一个例子回答超时不等于什么都没发生", "level": "h2"}, {"title": "提问与答复的实际形状", "anchor": "提问与答复的实际形状", "level": "h2"}, {"title": "普通提问不能代替外部批准", "anchor": "普通提问不能代替外部批准", "level": "h3"}, {"title": "三个提交边界", "anchor": "三个提交边界", "level": "h2"}, {"title": "首次答复与原答复重放", "anchor": "首次答复与原答复重放", "level": "h3"}, {"title": "过期与拒绝响应", "anchor": "过期与拒绝响应", "level": "h3"}, {"title": "答复界面与结果未知", "anchor": "答复界面与结果未知", "level": "h2"}, {"title": "兼容与开发接续", "anchor": "兼容与开发接续", "level": "h2"}, {"title": "验收条件", "anchor": "验收条件", "level": "h2"}], "source": "design/user-interactions.md", "checksum": "8883229c27c074912d95ac995f4b3df16ea45fa45329f11246c76ee0ea3111ad"}, {"id": "docs/design/results-evaluation.md", "title": "结果、证据与人工评价", "group": "design", "html": "\u003ch1 id=\"结果证据与人工评价\">结果、证据与人工评价\u003c/h1>\n\u003cp>本页定义模型交付、引用与追加评价。执行终态见 \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>，运行中回答见\u003ca href=\"#docs/design/user-interactions.md::\">普通交互\u003c/a>，远端事实见\u003ca href=\"#docs/design/repository-effects.md::\">受控效果\u003c/a>；当前缺口见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划 R07\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清四种事实\">先分清四种事实\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>含义与边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Run 终态\u003c/td>\n\u003ctd>执行如何结束；SUCCEEDED 不等于业务全对、进程已停或费用结清\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Result / Outcome\u003c/td>\n\u003ctd>原模型交付；COMPLETED/PARTIAL/BLOCKED 是完整度，不是 Run 状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence / Artifact\u003c/td>\n\u003ctd>依据与产物；引用合法不证明存在、归属、内容或现在可读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evaluation\u003c/td>\n\u003ctd>用户评分/判断/修订建议，追加保存，不改原值、不批准效果、不恢复 Run\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"一个例子执行结束结论仍需修订\">一个例子：执行结束，结论仍需修订\u003c/h3>\n\u003cp>Run SUCCEEDED、Outcome PARTIAL、模型 confidence 0.8 与人工 2/5、partially_accurate 可以同时成立。confidence 不是校准正确率，单次 rating 不直接成为整体质量指标。两份 Evaluation 都针对原 Result，不互相覆盖或合并。\u003c/p>\n\u003cp>needs_review 不自动创建 REVIEW 或重开终态。采用建议、再次分析须另有明确操作；当前无“采用修订/重开/自动父子 Run”协议。\u003c/p>\n\u003ch2 id=\"结果的形状与读取来源\">结果的形状与读取来源\u003c/h2>\n\u003cp>一个 Run 最多一个 run_results，Evaluation 用 result_id 关联。data_json 公开为 detail.result.data，是修订原值根；外层 summary/validation/usage 是投影，不是原业务内容。\u003c/p>\n\u003cp>\u003ca href=\"../PJM/contracts/outcomes/envelope/v1.schema.json\">OutcomeEnvelope\u003c/a>区分交付物、发现、证据、限制、待确认与效果摘要。无业务 Schema 也必须有合法包络；只有冻结任务声明可选 Schema 才允许 structured_data，并严格用原 Schema，不取最新版本。\u003c/p>\n\u003cp>\u003ca href=\"../PJM/contracts/runs/detail/v1.schema.json\">Run detail\u003c/a>读取保存事实，不按今天的文档库或外部地址重拼原结果。Artifact 暂不能假定已有独立表、索引/下载 API 或任意 URL 解析能力。子任务的输出派生见\u003ca href=\"#docs/design/subagents.md::%E5%AD%90%E4%BB%BB%E5%8A%A1%E6%8C%87%E4%BB%A4%E4%B8%8E%E7%BB%93%E6%9E%9C%E7%9A%84%E8%BE%B9%E7%95%8C\">子分析\u003c/a>。\u003c/p>\n\u003ch2 id=\"结果校验的实际保证\">结果校验的实际保证\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/agent/result_validation.py\">ResultValidator\u003c/a>当前边界：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>检查\u003c/th>\n\u003cth>实际保证与缺口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>结构\u003c/td>\n\u003ctd>包络及冻结业务 Schema 合法，不验证推理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>敏感信息\u003c/td>\n\u003ctd>递归可疑字段名，不证明普通文本无秘密\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence\u003c/td>\n\u003ctd>收集 source_ref/evidence_refs 查同 Run，不证明支持结论或 blob 可读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Proposal\u003c/td>\n\u003ctd>顶层引用同 Run，拒绝仍在批准/执行中的提案；未核对完整效果摘要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Artifact\u003c/td>\n\u003ctd>顶层收集计数，无归属/hash/可读性查询；不能显示“已验证附件”\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>effects[].before_ref/after_ref/proposal_ref 与 deliverables[].artifact_ref 尚未完整核验，effects 状态未逐项对比 EffectExecution。Web 一处显示模型摘要、另一处显示平台记录，尚未对应核对；数量或 APPLIED 文本不能冒充验证通过。\u003c/p>\n\u003ch3 id=\"引用可信性的修正要求\">引用可信性的修正要求\u003c/h3>\n\u003col>\n\u003cli>统一收集所有契约引用位置，校验同 Run 归属；同 Project 的另一个 Run 也不可借用。\u003c/li>\n\u003cli>建立受控产物索引，证明归属、内容身份及保存后才开放读取，不把 art_ 前缀或模型 path/URL 当许可。\u003c/li>\n\u003cli>effects 是待核对声明；与 Proposal/Approval/EffectExecution/read-back 关联及状态一致才可确认，否则明确未证实。\u003c/li>\n\u003cli>错误候选不保存为成功 Result，保留脱敏审计；旧结果只读并说明原校验范围，不补造通过。\u003c/li>\n\u003c/ol>\n\u003cp>扩大校验须同步主/子 validator、保存与 Web，审查冻结 Schema/混合 Worker/公开 validation 兼容，不改旧 Result 迎合新规则。\u003c/p>\n\u003ch2 id=\"保存与显示不是同一个提交\">保存与显示不是同一个提交\u003c/h2>\n\u003cp>候选只读校验 → 终态事务重验 lease/取消并保存允许的 Result、末次事件与 Outbox → 提交后 detail/SSE 各自读取 → 另一个 Evaluation 事务。\u003c/p>\n\u003cp>校验查询与终态不原子；锁后持久取消可覆盖成功候选。失败/取消可以无 Result，不能伪造空成功。此前 Tool Evidence 和后续评价均不属于终态事务；SSE 末次快照也不含完整 Result，须授权读取 detail。提交/停止边界见\u003ca href=\"#docs/design/run-supervision.md::%E6%8F%90%E4%BA%A4%E6%97%B6%E8%B0%81%E5%86%B3%E5%AE%9A%E6%9C%80%E7%BB%88%E7%8A%B6%E6%80%81\">执行监督\u003c/a>。\u003c/p>\n\u003ch2 id=\"评价请求与历史\">评价请求与历史\u003c/h2>\n\u003cp>GET/POST 共用 /api/v1/projects/{project_id}/runs/{run_id}/evaluations；\u003ca href=\"../PJM/contracts/evaluations/v1/create-request.schema.json\">请求 Schema\u003c/a>规定 rating 1–5、verdict accurate/partially_accurate/inaccurate/uncertain，comment/revisions 可省略，最多 100 条修订，Web 仅提供一条。\u003c/p>\n\u003cp>POST 经 ProjectWriteActor/Origin/CSRF，user_id 来自 actor；业务事务验证 Run/Project 与 Result 存在，无 Result 返回 409，不额外以页面 SUCCEEDED 授权。认证与业务提交不是同一锁内事务。\u003c/p>\n\u003cp>每次成功 POST 新增一条，当前无请求幂等。GET 按 created_at/ID 返回全部、无分页；空列表是没有评价，不等于 Result 不可用。多用户/多次评价并存，不默认最后一条为正式结论。\u003c/p>\n\u003ch2 id=\"修订指向哪份原值\">修订指向哪份原值\u003c/h2>\n\u003cp>pointer 相对 detail.result.data，服务端读取 original_value；客户端只提交建议和理由。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目标\u003c/th>\n\u003cth>指针\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>原包络摘要\u003c/td>\n\u003ctd>/summary，不是外层截短投影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>包络业务字段\u003c/td>\n\u003ctd>/structured_data 下已存在的位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧结构化输出\u003c/td>\n\u003ctd>原业务对象根，不擅加 structured_data\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/data\u003c/td>\n\u003ctd>仅原内容真有 data 时有效，不代表 API 包装层\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>例如原包络存在 summary 时：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \u0026quot;rating\u0026quot;: 2,\n  \u0026quot;verdict\u0026quot;: \u0026quot;partially_accurate\u0026quot;,\n  \u0026quot;revisions\u0026quot;: [{\n    \u0026quot;pointer\u0026quot;: \u0026quot;/summary\u0026quot;,\n    \u0026quot;suggested_value\u0026quot;: \u0026quot;材料不足，结论有限。\u0026quot;,\n    \u0026quot;reason\u0026quot;: \u0026quot;原结果已列出限制。\u0026quot;\n  }]\n}\n\u003c/code>\u003c/pre>\n\u003cp>解析器要求 / 开头的既有目标，支持 ~0/~1；拒绝空指针、缺字段、无效数组位置、穿过标量及同次重复 pointer。合法 null 不是缺失；不是任意 JSON Patch，不新增/删除/追加目标。\u003c/p>\n\u003cp>suggested_value 可为任意 JSON，当前不再套业务字段 Schema、不合并 Result；类型不同仍只是建议。未来“采用”须另定义授权、版本、审计。\u003c/p>\n\u003ch2 id=\"提交未知与界面责任\">提交未知与界面责任\u003c/h2>\n\u003cp>当前 \u003ca href=\"../PJM/web/src/components/RunResultPanel.tsx\">EvaluationSection\u003c/a>只有 state 禁用和卸载 abort，当前请求/context 校验、读写竞争尚未闭合，晚到列表可覆盖刚追加显示。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>修正要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>核对 Project/Run/Result/Evaluation 身份，只追加一次显示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>拒绝\u003c/td>\n\u003ctd>分开输入错误、结果不可用、身份/权限错误，不统一自动重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未知\u003c/td>\n\u003ctd>断网/超时/abort/无效成功响应可能已提交；禁止自动 POST\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>刷新/切换\u003c/td>\n\u003ctd>相似历史不能证明原请求；旧 actor/Project/Run/Result 响应不更新新页或清空新草稿\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>当前无原请求确认接口。再次提交须明确是可能重复的新增，不删审计消重复；短期草稿只存内存，不进 URL/持久存储/日志，abort 不是撤销。\u003c/p>\n\u003cp>安全重放须先定义服务端绑定 actor/Result/原内容、唯一键及原记录确认，同键异内容拒绝；不能只加 header 声称幂等，也不回填虚构旧键。\u003c/p>\n\u003ch2 id=\"兼容与开发接续\">兼容与开发接续\u003c/h2>\n\u003cp>先补引用与验证范围投影，再补评价 Web 当前请求隔离/未知状态；重放、分页另定协议，同步 API/OpenAPI、Schema/example、validator、三语与浏览器。新包络与旧 STRUCTURED_OUTPUT 分别可读，损坏不变成空成功。唯一 Result 约束不等于禁止任意 UPDATE，追加式服务与 DB 运维保护分别验收。\u003c/p>\n\u003ch2 id=\"验收条件\">验收条件\u003c/h2>\n\u003cp>覆盖 PARTIAL/技术终态/人工判断分离、冻结 Schema、所有跨 Run/缺失引用、模型假称 APPLIED、两次评价原值不变、非法 pointer 整条回滚、合法 null/转义、提交丢响应与上下文切换。真实 commit/rollback 和浏览器时序分别验证；入口见\u003ca href=\"#PJM/README.md::\">代码根 README\u003c/a>。\u003c/p>\n", "sections": [{"title": "结果、证据与人工评价", "level": "h1", "anchor": "结果证据与人工评价", "text": "# 结果、证据与人工评价\n\n本页定义模型交付、引用与追加评价。执行终态见 [Runtime](agent-runtime.md)，运行中回答见[普通交互](user-interactions.md)，远端事实见[受控效果](repository-effects.md)；当前缺口见[计划 R07](../planning/roadmap.md#r07-run-与审计)。"}, {"title": "先分清四种事实", "level": "h2", "anchor": "先分清四种事实", "text": "## 先分清四种事实\n\n| 对象 | 含义与边界 |\n| --- | --- |\n| Run 终态 | 执行如何结束；SUCCEEDED 不等于业务全对、进程已停或费用结清 |\n| Result / Outcome | 原模型交付；COMPLETED/PARTIAL/BLOCKED 是完整度，不是 Run 状态 |\n| Evidence / Artifact | 依据与产物；引用合法不证明存在、归属、内容或现在可读 |\n| Evaluation | 用户评分/判断/修订建议，追加保存，不改原值、不批准效果、不恢复 Run |"}, {"title": "一个例子：执行结束，结论仍需修订", "level": "h3", "anchor": "一个例子执行结束结论仍需修订", "text": "### 一个例子：执行结束，结论仍需修订\n\nRun SUCCEEDED、Outcome PARTIAL、模型 confidence 0.8 与人工 2/5、partially_accurate 可以同时成立。confidence 不是校准正确率，单次 rating 不直接成为整体质量指标。两份 Evaluation 都针对原 Result，不互相覆盖或合并。\n\nneeds_review 不自动创建 REVIEW 或重开终态。采用建议、再次分析须另有明确操作；当前无“采用修订/重开/自动父子 Run”协议。"}, {"title": "结果的形状与读取来源", "level": "h2", "anchor": "结果的形状与读取来源", "text": "## 结果的形状与读取来源\n\n一个 Run 最多一个 run_results，Evaluation 用 result_id 关联。data_json 公开为 detail.result.data，是修订原值根；外层 summary/validation/usage 是投影，不是原业务内容。\n\n[OutcomeEnvelope](../../PJM/contracts/outcomes/envelope/v1.schema.json)区分交付物、发现、证据、限制、待确认与效果摘要。无业务 Schema 也必须有合法包络；只有冻结任务声明可选 Schema 才允许 structured_data，并严格用原 Schema，不取最新版本。\n\n[Run detail](../../PJM/contracts/runs/detail/v1.schema.json)读取保存事实，不按今天的文档库或外部地址重拼原结果。Artifact 暂不能假定已有独立表、索引/下载 API 或任意 URL 解析能力。子任务的输出派生见[子分析](subagents.md#子任务指令与结果的边界)。"}, {"title": "结果校验的实际保证", "level": "h2", "anchor": "结果校验的实际保证", "text": "## 结果校验的实际保证\n\n[ResultValidator](../../PJM/backend/src/projectmind/agent/result_validation.py)当前边界：\n\n| 检查 | 实际保证与缺口 |\n| --- | --- |\n| 结构 | 包络及冻结业务 Schema 合法，不验证推理 |\n| 敏感信息 | 递归可疑字段名，不证明普通文本无秘密 |\n| Evidence | 收集 source_ref/evidence_refs 查同 Run，不证明支持结论或 blob 可读 |\n| Proposal | 顶层引用同 Run，拒绝仍在批准/执行中的提案；未核对完整效果摘要 |\n| Artifact | 顶层收集计数，无归属/hash/可读性查询；不能显示“已验证附件” |\n\neffects[].before_ref/after_ref/proposal_ref 与 deliverables[].artifact_ref 尚未完整核验，effects 状态未逐项对比 EffectExecution。Web 一处显示模型摘要、另一处显示平台记录，尚未对应核对；数量或 APPLIED 文本不能冒充验证通过。"}, {"title": "引用可信性的修正要求", "level": "h3", "anchor": "引用可信性的修正要求", "text": "### 引用可信性的修正要求\n\n1. 统一收集所有契约引用位置，校验同 Run 归属；同 Project 的另一个 Run 也不可借用。\n2. 建立受控产物索引，证明归属、内容身份及保存后才开放读取，不把 art_ 前缀或模型 path/URL 当许可。\n3. effects 是待核对声明；与 Proposal/Approval/EffectExecution/read-back 关联及状态一致才可确认，否则明确未证实。\n4. 错误候选不保存为成功 Result，保留脱敏审计；旧结果只读并说明原校验范围，不补造通过。\n\n扩大校验须同步主/子 validator、保存与 Web，审查冻结 Schema/混合 Worker/公开 validation 兼容，不改旧 Result 迎合新规则。"}, {"title": "保存与显示不是同一个提交", "level": "h2", "anchor": "保存与显示不是同一个提交", "text": "## 保存与显示不是同一个提交\n\n候选只读校验 → 终态事务重验 lease/取消并保存允许的 Result、末次事件与 Outbox → 提交后 detail/SSE 各自读取 → 另一个 Evaluation 事务。\n\n校验查询与终态不原子；锁后持久取消可覆盖成功候选。失败/取消可以无 Result，不能伪造空成功。此前 Tool Evidence 和后续评价均不属于终态事务；SSE 末次快照也不含完整 Result，须授权读取 detail。提交/停止边界见[执行监督](run-supervision.md#提交时谁决定最终状态)。"}, {"title": "评价请求与历史", "level": "h2", "anchor": "评价请求与历史", "text": "## 评价请求与历史\n\nGET/POST 共用 /api/v1/projects/{project_id}/runs/{run_id}/evaluations；[请求 Schema](../../PJM/contracts/evaluations/v1/create-request.schema.json)规定 rating 1–5、verdict accurate/partially_accurate/inaccurate/uncertain，comment/revisions 可省略，最多 100 条修订，Web 仅提供一条。\n\nPOST 经 ProjectWriteActor/Origin/CSRF，user_id 来自 actor；业务事务验证 Run/Project 与 Result 存在，无 Result 返回 409，不额外以页面 SUCCEEDED 授权。认证与业务提交不是同一锁内事务。\n\n每次成功 POST 新增一条，当前无请求幂等。GET 按 created_at/ID 返回全部、无分页；空列表是没有评价，不等于 Result 不可用。多用户/多次评价并存，不默认最后一条为正式结论。"}, {"title": "修订指向哪份原值", "level": "h2", "anchor": "修订指向哪份原值", "text": "## 修订指向哪份原值\n\npointer 相对 detail.result.data，服务端读取 original_value；客户端只提交建议和理由。\n\n| 目标 | 指针 |\n| --- | --- |\n| 原包络摘要 | /summary，不是外层截短投影 |\n| 包络业务字段 | /structured_data 下已存在的位置 |\n| 旧结构化输出 | 原业务对象根，不擅加 structured_data |\n| /data | 仅原内容真有 data 时有效，不代表 API 包装层 |\n\n例如原包络存在 summary 时：\n\n```json\n{\n  \"rating\": 2,\n  \"verdict\": \"partially_accurate\",\n  \"revisions\": [{\n    \"pointer\": \"/summary\",\n    \"suggested_value\": \"材料不足，结论有限。\",\n    \"reason\": \"原结果已列出限制。\"\n  }]\n}\n```\n\n解析器要求 / 开头的既有目标，支持 ~0/~1；拒绝空指针、缺字段、无效数组位置、穿过标量及同次重复 pointer。合法 null 不是缺失；不是任意 JSON Patch，不新增/删除/追加目标。\n\nsuggested_value 可为任意 JSON，当前不再套业务字段 Schema、不合并 Result；类型不同仍只是建议。未来“采用”须另定义授权、版本、审计。"}, {"title": "提交未知与界面责任", "level": "h2", "anchor": "提交未知与界面责任", "text": "## 提交未知与界面责任\n\n当前 [EvaluationSection](../../PJM/web/src/components/RunResultPanel.tsx)只有 state 禁用和卸载 abort，当前请求/context 校验、读写竞争尚未闭合，晚到列表可覆盖刚追加显示。\n\n| 情况 | 修正要求 |\n| --- | --- |\n| 成功 | 核对 Project/Run/Result/Evaluation 身份，只追加一次显示 |\n| 拒绝 | 分开输入错误、结果不可用、身份/权限错误，不统一自动重试 |\n| 未知 | 断网/超时/abort/无效成功响应可能已提交；禁止自动 POST |\n| 刷新/切换 | 相似历史不能证明原请求；旧 actor/Project/Run/Result 响应不更新新页或清空新草稿 |\n\n当前无原请求确认接口。再次提交须明确是可能重复的新增，不删审计消重复；短期草稿只存内存，不进 URL/持久存储/日志，abort 不是撤销。\n\n安全重放须先定义服务端绑定 actor/Result/原内容、唯一键及原记录确认，同键异内容拒绝；不能只加 header 声称幂等，也不回填虚构旧键。"}, {"title": "兼容与开发接续", "level": "h2", "anchor": "兼容与开发接续", "text": "## 兼容与开发接续\n\n先补引用与验证范围投影，再补评价 Web 当前请求隔离/未知状态；重放、分页另定协议，同步 API/OpenAPI、Schema/example、validator、三语与浏览器。新包络与旧 STRUCTURED_OUTPUT 分别可读，损坏不变成空成功。唯一 Result 约束不等于禁止任意 UPDATE，追加式服务与 DB 运维保护分别验收。"}, {"title": "验收条件", "level": "h2", "anchor": "验收条件", "text": "## 验收条件\n\n覆盖 PARTIAL/技术终态/人工判断分离、冻结 Schema、所有跨 Run/缺失引用、模型假称 APPLIED、两次评价原值不变、非法 pointer 整条回滚、合法 null/转义、提交丢响应与上下文切换。真实 commit/rollback 和浏览器时序分别验证；入口见[代码根 README](../../PJM/README.md)。"}], "toc": [{"title": "先分清四种事实", "anchor": "先分清四种事实", "level": "h2"}, {"title": "一个例子：执行结束，结论仍需修订", "anchor": "一个例子执行结束结论仍需修订", "level": "h3"}, {"title": "结果的形状与读取来源", "anchor": "结果的形状与读取来源", "level": "h2"}, {"title": "结果校验的实际保证", "anchor": "结果校验的实际保证", "level": "h2"}, {"title": "引用可信性的修正要求", "anchor": "引用可信性的修正要求", "level": "h3"}, {"title": "保存与显示不是同一个提交", "anchor": "保存与显示不是同一个提交", "level": "h2"}, {"title": "评价请求与历史", "anchor": "评价请求与历史", "level": "h2"}, {"title": "修订指向哪份原值", "anchor": "修订指向哪份原值", "level": "h2"}, {"title": "提交未知与界面责任", "anchor": "提交未知与界面责任", "level": "h2"}, {"title": "兼容与开发接续", "anchor": "兼容与开发接续", "level": "h2"}, {"title": "验收条件", "anchor": "验收条件", "level": "h2"}], "source": "design/results-evaluation.md", "checksum": "c76c0c069b38473f9be9b247eaceef61d038a6ebb64c3bbc71515703060ad802"}, {"id": "docs/design/run-supervision.md", "title": "执行监督与停止", "group": "design", "html": "\u003ch1 id=\"执行监督与停止\">执行监督与停止\u003c/h1>\n\u003cp>本页负责已有 Run 的取消、超时、失去 lease 与清理，不新增状态机。启动见 \u003ca href=\"#docs/design/agent-runtime.md::%E4%BB%8E%E9%A2%86%E5%8F%96%E5%88%B0%E6%A8%A1%E5%9E%8B%E5%90%AF%E5%8A%A8%E7%9A%84%E8%BE%B9%E7%95%8C\">Runtime\u003c/a>，外部 Effect 有\u003ca href=\"#docs/design/repository-effects.md::%E6%89%A7%E8%A1%8C%E6%9D%83%E4%B8%8E%E5%8F%96%E6%B6%88\">独立边界\u003c/a>，实施状态见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划 R07\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子点击取消之后\">一个例子：点击取消之后\u003c/h2>\n\u003cp>模型尚未返回首事件时，API 先保存取消意图；Worker 观察后取消自己拥有的 await，等待 client 清理，有效 lease 下才提交 CANCELLED。以下事实不能互相替代：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事实\u003c/th>\n\u003cth>只证明什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>请求已接受\u003c/td>\n\u003ctd>收到取消意图，不是退出回执\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run CANCELLED\u003c/td>\n\u003ctd>业务终态不可重开，不保证进程已停\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>client 清理返回\u003c/td>\n\u003ctd>清理调用结束，adapter 仍须证明外部停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用量已确认\u003c/td>\n\u003ctd>对应执行范围已核对，不把其他未知调用归零\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>这不是固定顺序的 UI 向导。主执行已有首事件时，终态和清理的顺序不同；Web 不得在无公开证据时显示“进程全停/额度退还”。\u003c/p>\n\u003ch2 id=\"谁负责停止\">谁负责停止\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>责任方\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>API / RunService\u003c/td>\n\u003ctd>授权并保存意图，不等待所有外部进程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/worker/executor.py\">Executor\u003c/a>\u003c/td>\n\u003ctd>监督准备、heartbeat、取消、事件等待；有效 lease 下提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/agent/engine.py\">AgentEngine\u003c/a>\u003c/td>\n\u003ctd>向其拥有的 client 传递取消/关闭，清理并提供核对依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子 Provider\u003c/td>\n\u003ctd>TaskGroup 持有全组 task，等待各支清理，不遗留后台工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Repository / Recovery\u003c/td>\n\u003ctd>按持久状态与 fencing 决定提交/接管\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/run-budgets.md::%E7%BB%93%E6%9D%9F%E5%8F%96%E6%B6%88%E4%B8%8E%E6%95%85%E9%9A%9C%E6%81%A2%E5%A4%8D\">预算协议\u003c/a>\u003c/td>\n\u003ctd>确认消费、保留未知占用，lease 过期不退款\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>取消 Run 不撤销已发生的远端写入，也不证明 Effect Provider 已停。\u003c/p>\n\u003ch2 id=\"不同阶段如何收束\">不同阶段如何收束\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>当前停止路径\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ContextBuilder 准备\u003c/td>\n\u003ctd>取消 builder task，等待退出，不再冻结 Brief/启动模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最终 gate 后、首事件前\u003c/td>\n\u003ctd>_first_engine_event 同时等首次事件与取消；由拥有 await 的 task 取消 connect/receive，不依赖 Session ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有首事件\u003c/td>\n\u003ctd>以 session_ref interrupt，消费侧继续处理终端/等待/deadline；interrupt 失败不是停止证明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子执行中\u003c/td>\n\u003ctd>TaskGroup 取消并等待全组，某支完成不再次打断兄弟清理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>首事件前路径为“持久意图 → 取消等待 → connect/receive 退出 → 清理 → 有效 lease 下 CANCELLED”，以协作取消、清理返回为前提。各 deadline 见\u003ca href=\"#docs/design/run-budgets.md::%E7%8E%B0%E6%9C%89%E8%AE%A1%E6%97%B6%E5%99%A8%E7%9A%84%E8%A6%86%E7%9B%96%E8%8C%83%E5%9B%B4\">计时器\u003c/a>，不承诺硬杀时间。\u003c/p>\n\u003cp>线程文件 I/O 可晚返回，但不能再提交 READY/Brief 或启动；\u003ca href=\"#docs/design/resource-snapshots.md::%E5%87%86%E5%A4%87%E4%B8%AD%E6%96%AD%E4%B8%8E%E5%86%8D%E6%AC%A1%E4%BD%BF%E7%94%A8\">输入现场\u003c/a>保留不重建。启动 gate 与模型调用不原子，gate、运行监督和数据库 fencing 缺一不可。\u003c/p>\n\u003ch2 id=\"原因与执行权如何分类\">原因与执行权如何分类\u003c/h2>\n\u003cp>先判提交权，再判原因：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条件\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>lease 失效\u003c/td>\n\u003ctd>旧 Worker 退出，不补 FAILED/CANCELLED，合法恢复接管\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持久用户取消且 lease 有效\u003c/td>\n\u003ctd>取消收尾；无已观察 Session identity 不伪造事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>准备 deadline / Provider TimeoutError\u003c/td>\n\u003ctd>分别 preparation_timeout / context_build_failed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型下一事件 deadline\u003c/td>\n\u003ctd>wall_timeout；另查已成立的持久取消\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>job 关停/裸取消\u003c/td>\n\u003ctd>传播执行取消，不创造用户意图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SDK interrupted 但无持久取消\u003c/td>\n\u003ctd>主执行 FAILED / agent_session_interrupted；payload 自称 user 也不授权取消\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>上述主执行分类已接入；子收集器将 interrupted 作为失败终端，分支失败不等于整个 Run 失败。旧原因缺来源则保持未记录，不改历史 CANCELLED。\u003c/p>\n\u003ch2 id=\"提交时谁决定最终状态\">提交时谁决定最终状态\u003c/h2>\n\u003cp>按 Run → Segment → Attempt 锁后的持久事实与当前 lease 判定，不按浏览器点击或 SDK 时间戳。前提是事件身份与终态参数合法。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>提交顺序\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>取消意图先提交\u003c/td>\n\u003ctd>保存 CANCELLED，不保存成功 Result，不覆盖取消占用的 sequence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUCCEEDED/FAILED 先提交\u003c/td>\n\u003ctd>保持原终态；后续取消返回 409 run_not_cancellable\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已 CANCELLED 再取消\u003c/td>\n\u003ctd>返回已有状态，不重复终态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧 lease 失效\u003c/td>\n\u003ctd>不能因存在取消意图恢复提交权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/runs/repository.py\">finalize_execution\u003c/a>已锁内复查取消，拒绝无意图 CANCELLED 候选并返回实际状态；service 在事务成功退出后才返回。repository 返回不等于 commit，提交响应未知须读原事实，不换身份重跑。\u003c/p>\n\u003cp>主终态只查同 Run/Attempt 的 PRIMARY，不把多个子 Session 当查询错误。取消覆盖时保留事件已观察用量但不保存成功正文；Session usage 与账本另见\u003ca href=\"#docs/design/run-budgets.md::%E7%94%A8%E9%87%8F%E7%8E%B0%E5%9C%A8%E6%B5%81%E5%90%91%E5%93%AA%E9%87%8C\">用量投影\u003c/a>。\u003c/p>\n\u003ch3 id=\"等待提交仍是独立边界\">等待提交仍是独立边界\u003c/h3>\n\u003cp>普通事件、suspend_for_interaction、suspend_for_proposal 已共用取消拒绝检查：锁后先验 lease/状态/事件身份，再查持久取消，随后才分配 sequence/新增记录。取消不能使旧 lease 或外来事件合法；TEXT_DELTA 不走持久路径。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">TX A：合法身份/lease → 发现取消 → 回滚等待/事件\n  ↓ 释放锁；Worker 收到 RunCancellationRequestedError\nTX B：重新取锁/验证 lease 与持久意图\n  ├─ 有效：保存 CANCELLED\n  └─ 失效：旧 Worker 退出\n\u003c/code>\u003c/pre>\n\u003cp>A 不新增待办、checkpoint、Session、事件/Outbox 或预授权 Effect，但不等于 B 已提交。两事务间可崩溃/失去 lease；意图保留，由合法恢复处理，不持锁 interrupt。等待先提交时按已存状态取消，独立 Effect 不被视为撤销。\u003c/p>\n\u003ch2 id=\"收尾终态与晚到信息\">收尾、终态与晚到信息\u003c/h2>\n\u003cp>当前主执行先保存 Result/终态，再 finally 关闭 stream；子执行先关闭 stream/校验结果，再保存 Session/Tool 审计。首事件前取消及超时另有先收束 await 的路径。\u003c/p>\n\u003cp>主 _close_stream 会吞普通关闭异常，Engine disconnect 失败也会移除 active 注册；没有活动 Session 不是退出证明。目标要求：\u003c/p>\n\u003col>\n\u003cli>准备、事件等待、清理和提交各有唯一所有者；不重复取消兄弟清理，真实进程须有界停止/核对，wait_for 不等于硬杀。\u003c/li>\n\u003cli>DB 锁外清理，锁后以当前时间 fencing。done 会影响 heartbeat 寿命，不能假定 finally 都续租，也不能无限清理无限占权。\u003c/li>\n\u003cli>停止事实独立追加核对；终态 Run 不重开、不在最后 RUN_SNAPSHOT 后补事件。当前尚无完整持久停止回执/查询接口。\u003c/li>\n\u003cli>晚到用量由可信核对方按原身份处理；旧 Worker 不复权，未知占用不退款。子 v1 的必需 Session/Gateway 审计不放宽。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"兼容与开发接续\">兼容与开发接续\u003c/h2>\n\u003cp>保持已有准备监督、首事件取消、原因分类、终态覆盖、等待/普通事件拒绝与子 TaskGroup；接续真实取消/终态锁竞争、两个事务之间崩溃、提交不明及进程清理，随后将停止核对身份与\u003ca href=\"#docs/design/run-budgets.md::\">共享预算\u003c/a>接齐。\u003c/p>\n\u003cp>现有 endpoint/RunStatus/SSE 不变；旧 Brief/Result/事件不回写，缺原因/回执不补造。新增公开信息同步版本化 DTO、授权 allowlist、Web validator 与三语，不临时塞 STOPPING 状态。\u003c/p>\n\u003ch2 id=\"验收矩阵\">验收矩阵\u003c/h2>\n\u003cp>覆盖准备取消/超时、connect/receive 无首事件、清理暂停、兄弟清理交错、无原因 interrupted、取消与终态两种提交顺序、等待拒绝后失去 lease、等待先提交后取消、多子 Session 下只终态化 PRIMARY、disconnect 失败和终态后晚到用量。\u003c/p>\n\u003cp>入口：\u003ca href=\"../PJM/backend/tests/worker/test_execution_outcomes.py\">执行结果回归\u003c/a>、\u003ca href=\"../PJM/backend/tests/runs/test_cancelled_execution_writes.py\">取消写入回归\u003c/a>。真实事务/进程与 Web 事实展示分别验证，不把 task 结束或文档浏览检查当业务停止验收。\u003c/p>\n", "sections": [{"title": "执行监督与停止", "level": "h1", "anchor": "执行监督与停止", "text": "# 执行监督与停止\n\n本页负责已有 Run 的取消、超时、失去 lease 与清理，不新增状态机。启动见 [Runtime](agent-runtime.md#从领取到模型启动的边界)，外部 Effect 有[独立边界](repository-effects.md#执行权与取消)，实施状态见[计划 R07](../planning/roadmap.md#r07-run-与审计)。"}, {"title": "一个例子：点击取消之后", "level": "h2", "anchor": "一个例子点击取消之后", "text": "## 一个例子：点击取消之后\n\n模型尚未返回首事件时，API 先保存取消意图；Worker 观察后取消自己拥有的 await，等待 client 清理，有效 lease 下才提交 CANCELLED。以下事实不能互相替代：\n\n| 事实 | 只证明什么 |\n| --- | --- |\n| 请求已接受 | 收到取消意图，不是退出回执 |\n| Run CANCELLED | 业务终态不可重开，不保证进程已停 |\n| client 清理返回 | 清理调用结束，adapter 仍须证明外部停止 |\n| 用量已确认 | 对应执行范围已核对，不把其他未知调用归零 |\n\n这不是固定顺序的 UI 向导。主执行已有首事件时，终态和清理的顺序不同；Web 不得在无公开证据时显示“进程全停/额度退还”。"}, {"title": "谁负责停止", "level": "h2", "anchor": "谁负责停止", "text": "## 谁负责停止\n\n| 责任方 | 责任 |\n| --- | --- |\n| API / RunService | 授权并保存意图，不等待所有外部进程 |\n| [Executor](../../PJM/backend/src/projectmind/worker/executor.py) | 监督准备、heartbeat、取消、事件等待；有效 lease 下提交 |\n| [AgentEngine](../../PJM/backend/src/projectmind/agent/engine.py) | 向其拥有的 client 传递取消/关闭，清理并提供核对依据 |\n| 子 Provider | TaskGroup 持有全组 task，等待各支清理，不遗留后台工作 |\n| Repository / Recovery | 按持久状态与 fencing 决定提交/接管 |\n| [预算协议](run-budgets.md#结束取消与故障恢复) | 确认消费、保留未知占用，lease 过期不退款 |\n\n取消 Run 不撤销已发生的远端写入，也不证明 Effect Provider 已停。"}, {"title": "不同阶段如何收束", "level": "h2", "anchor": "不同阶段如何收束", "text": "## 不同阶段如何收束\n\n| 阶段 | 当前停止路径 |\n| --- | --- |\n| ContextBuilder 准备 | 取消 builder task，等待退出，不再冻结 Brief/启动模型 |\n| 最终 gate 后、首事件前 | _first_engine_event 同时等首次事件与取消；由拥有 await 的 task 取消 connect/receive，不依赖 Session ID |\n| 已有首事件 | 以 session_ref interrupt，消费侧继续处理终端/等待/deadline；interrupt 失败不是停止证明 |\n| 子执行中 | TaskGroup 取消并等待全组，某支完成不再次打断兄弟清理 |\n\n首事件前路径为“持久意图 → 取消等待 → connect/receive 退出 → 清理 → 有效 lease 下 CANCELLED”，以协作取消、清理返回为前提。各 deadline 见[计时器](run-budgets.md#现有计时器的覆盖范围)，不承诺硬杀时间。\n\n线程文件 I/O 可晚返回，但不能再提交 READY/Brief 或启动；[输入现场](resource-snapshots.md#准备中断与再次使用)保留不重建。启动 gate 与模型调用不原子，gate、运行监督和数据库 fencing 缺一不可。"}, {"title": "原因与执行权如何分类", "level": "h2", "anchor": "原因与执行权如何分类", "text": "## 原因与执行权如何分类\n\n先判提交权，再判原因：\n\n| 条件 | 处理 |\n| --- | --- |\n| lease 失效 | 旧 Worker 退出，不补 FAILED/CANCELLED，合法恢复接管 |\n| 持久用户取消且 lease 有效 | 取消收尾；无已观察 Session identity 不伪造事件 |\n| 准备 deadline / Provider TimeoutError | 分别 preparation_timeout / context_build_failed |\n| 模型下一事件 deadline | wall_timeout；另查已成立的持久取消 |\n| job 关停/裸取消 | 传播执行取消，不创造用户意图 |\n| SDK interrupted 但无持久取消 | 主执行 FAILED / agent_session_interrupted；payload 自称 user 也不授权取消 |\n\n上述主执行分类已接入；子收集器将 interrupted 作为失败终端，分支失败不等于整个 Run 失败。旧原因缺来源则保持未记录，不改历史 CANCELLED。"}, {"title": "提交时谁决定最终状态", "level": "h2", "anchor": "提交时谁决定最终状态", "text": "## 提交时谁决定最终状态\n\n按 Run → Segment → Attempt 锁后的持久事实与当前 lease 判定，不按浏览器点击或 SDK 时间戳。前提是事件身份与终态参数合法。\n\n| 提交顺序 | 结果 |\n| --- | --- |\n| 取消意图先提交 | 保存 CANCELLED，不保存成功 Result，不覆盖取消占用的 sequence |\n| SUCCEEDED/FAILED 先提交 | 保持原终态；后续取消返回 409 run_not_cancellable |\n| 已 CANCELLED 再取消 | 返回已有状态，不重复终态 |\n| 旧 lease 失效 | 不能因存在取消意图恢复提交权 |\n\n[finalize_execution](../../PJM/backend/src/projectmind/runs/repository.py)已锁内复查取消，拒绝无意图 CANCELLED 候选并返回实际状态；service 在事务成功退出后才返回。repository 返回不等于 commit，提交响应未知须读原事实，不换身份重跑。\n\n主终态只查同 Run/Attempt 的 PRIMARY，不把多个子 Session 当查询错误。取消覆盖时保留事件已观察用量但不保存成功正文；Session usage 与账本另见[用量投影](run-budgets.md#用量现在流向哪里)。"}, {"title": "等待提交仍是独立边界", "level": "h3", "anchor": "等待提交仍是独立边界", "text": "### 等待提交仍是独立边界\n\n普通事件、suspend_for_interaction、suspend_for_proposal 已共用取消拒绝检查：锁后先验 lease/状态/事件身份，再查持久取消，随后才分配 sequence/新增记录。取消不能使旧 lease 或外来事件合法；TEXT_DELTA 不走持久路径。\n\n```text\nTX A：合法身份/lease → 发现取消 → 回滚等待/事件\n  ↓ 释放锁；Worker 收到 RunCancellationRequestedError\nTX B：重新取锁/验证 lease 与持久意图\n  ├─ 有效：保存 CANCELLED\n  └─ 失效：旧 Worker 退出\n```\n\nA 不新增待办、checkpoint、Session、事件/Outbox 或预授权 Effect，但不等于 B 已提交。两事务间可崩溃/失去 lease；意图保留，由合法恢复处理，不持锁 interrupt。等待先提交时按已存状态取消，独立 Effect 不被视为撤销。"}, {"title": "收尾、终态与晚到信息", "level": "h2", "anchor": "收尾终态与晚到信息", "text": "## 收尾、终态与晚到信息\n\n当前主执行先保存 Result/终态，再 finally 关闭 stream；子执行先关闭 stream/校验结果，再保存 Session/Tool 审计。首事件前取消及超时另有先收束 await 的路径。\n\n主 _close_stream 会吞普通关闭异常，Engine disconnect 失败也会移除 active 注册；没有活动 Session 不是退出证明。目标要求：\n\n1. 准备、事件等待、清理和提交各有唯一所有者；不重复取消兄弟清理，真实进程须有界停止/核对，wait_for 不等于硬杀。\n2. DB 锁外清理，锁后以当前时间 fencing。done 会影响 heartbeat 寿命，不能假定 finally 都续租，也不能无限清理无限占权。\n3. 停止事实独立追加核对；终态 Run 不重开、不在最后 RUN_SNAPSHOT 后补事件。当前尚无完整持久停止回执/查询接口。\n4. 晚到用量由可信核对方按原身份处理；旧 Worker 不复权，未知占用不退款。子 v1 的必需 Session/Gateway 审计不放宽。"}, {"title": "兼容与开发接续", "level": "h2", "anchor": "兼容与开发接续", "text": "## 兼容与开发接续\n\n保持已有准备监督、首事件取消、原因分类、终态覆盖、等待/普通事件拒绝与子 TaskGroup；接续真实取消/终态锁竞争、两个事务之间崩溃、提交不明及进程清理，随后将停止核对身份与[共享预算](run-budgets.md)接齐。\n\n现有 endpoint/RunStatus/SSE 不变；旧 Brief/Result/事件不回写，缺原因/回执不补造。新增公开信息同步版本化 DTO、授权 allowlist、Web validator 与三语，不临时塞 STOPPING 状态。"}, {"title": "验收矩阵", "level": "h2", "anchor": "验收矩阵", "text": "## 验收矩阵\n\n覆盖准备取消/超时、connect/receive 无首事件、清理暂停、兄弟清理交错、无原因 interrupted、取消与终态两种提交顺序、等待拒绝后失去 lease、等待先提交后取消、多子 Session 下只终态化 PRIMARY、disconnect 失败和终态后晚到用量。\n\n入口：[执行结果回归](../../PJM/backend/tests/worker/test_execution_outcomes.py)、[取消写入回归](../../PJM/backend/tests/runs/test_cancelled_execution_writes.py)。真实事务/进程与 Web 事实展示分别验证，不把 task 结束或文档浏览检查当业务停止验收。"}], "toc": [{"title": "一个例子：点击取消之后", "anchor": "一个例子点击取消之后", "level": "h2"}, {"title": "谁负责停止", "anchor": "谁负责停止", "level": "h2"}, {"title": "不同阶段如何收束", "anchor": "不同阶段如何收束", "level": "h2"}, {"title": "原因与执行权如何分类", "anchor": "原因与执行权如何分类", "level": "h2"}, {"title": "提交时谁决定最终状态", "anchor": "提交时谁决定最终状态", "level": "h2"}, {"title": "等待提交仍是独立边界", "anchor": "等待提交仍是独立边界", "level": "h3"}, {"title": "收尾、终态与晚到信息", "anchor": "收尾终态与晚到信息", "level": "h2"}, {"title": "兼容与开发接续", "anchor": "兼容与开发接续", "level": "h2"}, {"title": "验收矩阵", "anchor": "验收矩阵", "level": "h2"}], "source": "design/run-supervision.md", "checksum": "ff3d43ee2044f0e2ccfd2208a05587df88dba86bfb12962278e645058462d033"}, {"id": "docs/design/run-budgets.md", "title": "Run 预算与执行限额", "group": "design", "html": "\u003ch1 id=\"run-预算与执行限额\">Run 预算与执行限额\u003c/h1>\n\u003cp>同一 Run 的主执行、子分析、Segment 续行与 Attempt 重试必须共用账户。本页区分现行局部限制与尚未接入执行的持久账本；不是预算 API。当前状态见\u003ca href=\"#docs/planning/roadmap.md::r02-run-%E7%BB%9F%E4%B8%80%E9%A2%84%E7%AE%97\">计划 R02\u003c/a>。\u003c/p>\n\u003ch2 id=\"先区分上限分配与消耗\">先区分上限、分配与消耗\u003c/h2>\n\u003cp>冻结上限是授权，预留是已承诺额度，消耗是已确认用量。分支拿到 10 turns 不等于用掉 10；Session 数和摘要长度也不是消费。\u003c/p>\n\u003ch3 id=\"当前实现的实际口径\">当前实现的实际口径\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>限制\u003c/th>\n\u003cth>当前边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>max_turns\u003c/td>\n\u003ctd>SDK 每次执行上限，不累计所有主子 Session/重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>max_budget_usd\u003c/td>\n\u003ctd>可选 SDK 局部限制；普通创建快照未设置，子 context 原值继承、不按支拆分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>max_output_bytes\u003c/td>\n\u003ctd>Gateway 单个序列化 Tool response 的 UTF-8 字节上限，不是累计输出/磁盘配额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子分析 budget\u003c/td>\n\u003ctd>每次 dispatch 重拆父冻结 turns/output 上限；连续调用未扣共享余额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RUN_MAX_ATTEMPTS\u003c/td>\n\u003ctd>当前 Segment 的技术重试次数，不限制全部业务续行或 Run 成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输入文件数量/字节\u003c/td>\n\u003ctd>逐根及跨根最终存量，规则见\u003ca href=\"#docs/design/resource-snapshots.md::%E8%B7%A8%E6%A0%B9%E6%80%BB%E9%87%8F\">资源总量\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>例如父快照 20 turns，两次各派两支时每次仍各分 10，不构成全 Run 20 的保证。账本已有内部实现，但创建、主 Executor、子 Provider 与 Worker startup 均未调用。\u003c/p>\n\u003ch3 id=\"用量现在流向哪里\">用量现在流向哪里\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>来源\u003c/th>\n\u003cth>当前保存方式与缺口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>SDK mapper\u003c/td>\n\u003ctd>usage 与 rate-limit 通知都可为 USAGE_UPDATED，Result 终端/等待另带 turns/cost；不能逐事件相加\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主 Executor / Session\u003c/td>\n\u003ctd>Result 按 key 更新，Session usage 最新替换、cost 保存最近总值；无统一来源/去重账本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取消覆盖事件\u003c/td>\n\u003ctd>保留该事件已观察 usage/cost，丢弃成功/提问正文；SESSION_INTERRUPTED 不更新 Session usage，不能从事件反推相同投影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子收集器 / Session\u003c/td>\n\u003ctd>校验终端和结果，但不归集用量；子 usage 仅 branch_key、cost 空，失败也不等于零消耗\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>计量必须先确认 SDK 报告是否含历史、重试或子调用，不能把 Session、Result 和最终报告重复入账。\u003c/p>\n\u003ch3 id=\"现有计时器的覆盖范围\">现有计时器的覆盖范围\u003c/h3>\n\u003cp>默认配置来自 \u003ca href=\"../PJM/backend/src/projectmind/core/settings.py\">Settings\u003c/a>、\u003ca href=\"../PJM/backend/src/projectmind/runs/service.py\">创建快照\u003c/a>和 \u003ca href=\"../PJM/backend/src/projectmind/worker/settings.py\">Worker 注册\u003c/a>，部署以实际注入值为准。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>计时器\u003c/th>\n\u003cth>默认值与覆盖\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Attempt lease\u003c/td>\n\u003ctd>60 秒，可配 30–300；约每 1/3 续期，仅代表执行权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>准备 timeout\u003c/td>\n\u003ctd>300 秒，可配 1–3600；包住 ContextBuilder 及其输入提交，不含 Brief/启动/终态事务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仓库单命令\u003c/td>\n\u003ctd>120 秒，可配 5–600，不是所有根准备总时长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型事件流\u003c/td>\n\u003ctd>普通创建冻结 900 秒，准备后起算；只对下一事件 await 施加 deadline，不打断事件持久化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子分支\u003c/td>\n\u003ctd>300 秒，可配 30–600，不赠送 Run 额度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ARQ execute_run\u003c/td>\n\u003ctd>1200 + 准备秒数，默认 1500；整个 job 最终防线，其他 job/cron 独立\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人工等待\u003c/td>\n\u003ctd>持久 expires_at；释放主 lease，不刷新 Run 总额度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>准备 240 秒加模型 850 秒可分别合法，但不是 900 秒的 Run 总预算。续 lease 不延长 deadline；准备/事件 timeout 为协作取消，线程 I/O、清理或 DB 等待可能晚返回，不能承诺按秒硬杀。Job timeout/关停仍可能中断终态提交。\u003c/p>\n\u003cp>Effect Worker 另有 lease，复用部分配置但无主 Executor 的贯穿监督；其\u003ca href=\"#docs/design/repository-effects.md::%E6%89%A7%E8%A1%8C%E6%9D%83%E4%B8%8E%E5%8F%96%E6%B6%88\">执行权/取消缺口\u003c/a>不能由本表推导为已解决。\u003c/p>\n\u003ch2 id=\"目标与非目标\">目标与非目标\u003c/h2>\n\u003cp>目标是冻结授权不变、余额可审计变化，重试/续行不重领完整额度。不引入钱包、充值或组织计费；扩大上限新建 Run。Skill 解释、独立评估、模块构建另设限制，不借本 Run 账户。\u003c/p>\n\u003ch3 id=\"分开定义计量维度\">分开定义计量维度\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>必须冻结的口径\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>turns\u003c/td>\n\u003ctd>Adapter 定义新增 turn；不按 ToolCall/事件数代替，resume 历史不重复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成本\u003c/td>\n\u003ctd>币种/精度/累计或增量/延迟规则；固定精度，不用 float 比余额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>累计输出（后续）\u003c/td>\n\u003ctd>明确文本/结构化/Tool response 范围，DELTA 与 COMPLETED 不重复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>活动时长（后续）\u003c/td>\n\u003ctd>累计墙钟区间，子并行重叠不相加，排队/人工等待不计，准备仍独立 timeout\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>只有 adapter 可强制执行上界，才可承诺硬限额。未启用某维度不宣称受限；已启用但不可计量则阻止新收费执行。null 不等于零或免费。\u003c/p>\n\u003ch3 id=\"计量报告如何归一化\">计量报告如何归一化\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>报告\u003c/th>\n\u003cth>入账规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>增量\u003c/td>\n\u003ctd>绑定原执行的稳定键；同键同内容一次入账，异内容阻断核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>累计\u003c/td>\n\u003ctd>保存来源/水位，只计可信增量，旧报告不退款，最终值不整体再加\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>resume/fork/范围变化\u003c/td>\n\u003ctd>证明覆盖范围、历史/子调用与基线；不能共用一个 last_usage\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缺失/冲突/无效\u003c/td>\n\u003ctd>保留未知占用；负数、非有限数、错单位或无执行归属不变成零，更正另存审计\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>可信 adapter 归一化并固定 SDK/CLI/规则版本，一个来源入账、其他交叉核对。BudgetUsageReport 只接收已归一化值；final=True 必须证明启用维度收齐，而非“最后事件”。增量须无漏报，累计 turns/cost 各自水位，缺测不推进。\u003c/p>\n\u003ch2 id=\"一个账户多个执行预留\">一个账户，多个执行预留\u003c/h2>\n\u003cp>每个可加维度：remaining = limit - consumed - reserved。预留前不启动，余额不足/账本不可用则拒绝；reserved 包含未知占用，确认用量原子转 consumed，不双算。实际超支保留真实差额并阻断新分配，不截断数字。活动时长按区间另算。\u003c/p>\n\u003ch3 id=\"一个例子已用占用与可用\">一个例子：已用、占用与可用\u003c/h3>\n\u003cp>以下是目标账户，不是当前 dispatch 输出，假设已验证 20 turns 的共享硬上界：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时点\u003c/th>\n\u003cth style=\"text-align:right\">已用\u003c/th>\n\u003cth style=\"text-align:right\">占用\u003c/th>\n\u003cth style=\"text-align:right\">可用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>前一段结算\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003ctd style=\"text-align:right\">0\u003c/td>\n\u003ctd style=\"text-align:right\">16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主执行预留 6\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003ctd style=\"text-align:right\">6\u003c/td>\n\u003ctd style=\"text-align:right\">10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子 A/B 各预留 3\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003ctd style=\"text-align:right\">12\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A 用 2 且停止\u003c/td>\n\u003ctd style=\"text-align:right\">6\u003c/td>\n\u003ctd style=\"text-align:right\">9\u003c/td>\n\u003ctd style=\"text-align:right\">5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B 失联、主用 5 且停止\u003c/td>\n\u003ctd style=\"text-align:right\">11\u003c/td>\n\u003ctd style=\"text-align:right\">3\u003c/td>\n\u003ctd style=\"text-align:right\">6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>B 的 3 不因 lease 过期退还，新执行最多用 6；若不能证明 B 仍受 3 的上界约束，暂停整个账户分配。\u003c/p>\n\u003ch3 id=\"持久账本的当前载体\">持久账本的当前载体\u003c/h3>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/runs/budget_store.py\">budget_store\u003c/a>、\u003ca href=\"../PJM/backend/src/projectmind/runs/repository_budgets.py\">repository_budgets\u003c/a>与 \u003ca href=\"../PJM/backend/migrations/versions/0030_run_budget_ledger.py\">0030\u003c/a>已有以下内部载体：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>run_budget_accounts\u003c/td>\n\u003ctd>Run 唯一，策略/限额 checksum、已用/占用、阻断与版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>run_budget_reservations\u003c/td>\n\u003ctd>Run/Segment/Attempt、操作组/执行键、parent、lease hash、授予量与启动/结算事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>run_budget_receipts\u003c/td>\n\u003ctd>原预留+回执键去重，追加用量、停止、未启动释放或核对失败；不依赖 RunEvent\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>内部 run-budget/v1 只定义 turns/可选成本，非 HTTP 协议。成本为 nano-USD，DTO 整数、列 Numeric(38,0)，计算先转整数、存储再转 Decimal；边界拒绝 float/不足最小单位，不静默舍入。旧数值须经版本化转换。\u003c/p>\n\u003cp>new_budget_account 仅构造未保存/未开始且限额匹配的新账户；未来与 Run 同事务按 FK 顺序保存。0030 不回填旧 Run、不启动核对；执行端不能补造零余额。\u003c/p>\n\u003ch3 id=\"内部状态不能当作运行证明\">内部状态不能当作运行证明\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>状态\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>RESERVED\u003c/td>\n\u003ctd>已占用、无启动意图；未启动释放同时关闭启动资格\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>START_INTENT\u003c/td>\n\u003ctd>可能已开始；重复读取不许可重启，未知占用继续保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SETTLED\u003c/td>\n\u003ctd>已提供停止依据和完整用量并释放未用量，不等于 Run 成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RELEASED\u003c/td>\n\u003ctd>未启动预留已关闭，不是启动后的退款\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>verified_evidence 目前只校验键形状，claim_reconciliation 只操作内部 lease。二者不验证真实停止、不建立核对方身份；须接受信服务、锁外证据校验和来源验证，不能开放给模型/用户/旧 Worker。\u003c/p>\n\u003ch3 id=\"原子性与重复请求\">原子性与重复请求\u003c/h3>\n\u003cp>预留同事务验证状态/权限/余额/身份。所需锁顺序为 Run → Segment → Attempt → 账户 → 预留，可跳不需要层，不得反向取锁；获锁后再判当前时间/fencing，锁外调用模型和核对。\u003c/p>\n\u003cp>同操作同键返回原记录，异内容冲突；真正重执行用新身份取余额。回放 Tool 结果不重调 Provider，但新模型执行仍计量。全组 dispatch 原子预留，全部获准才逐支启动，之后各自结算。\u003c/p>\n\u003cp>主执行未用预留不能复制给子支。主模型等待 Tool 不表示已停止或缩额；现有 adapter 无中途缩额协议时，只从未承诺余额分配，不足拒绝。转移额度须先证明主执行停止且局部上限同步收窄。\u003c/p>\n\u003ch3 id=\"启动与结算的提交边界\">启动与结算的提交边界\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">TX A：执行权 + 原子预留，确认原键\n  → TX B：重验执行权 + START_INTENT\n  → 锁外：带执行身份/局部上限调用 adapter\n  → TX C：去重核对，结算或保留占用\n\u003c/code>\u003c/pre>\n\u003cp>DB 与模型不能原子启动。A 响应丢失查原键，不换键扣额；B 后崩溃/响应丢失可能已收费，只在证明未开始且不能再开始时释放。\u003c/p>\n\u003cp>当前 store 的 A 在 repository 返回后遇提交错误会新 session 按原组确认，仍要求有效 lease。B 仅首次明确提交返回 True；已有意图返回 False，提交未知抛 BudgetStartUncertainError，均不许可再次启动。C 冲突以结果返回并先提交阻断事实，不能改抛异常使审计回滚。repository.flush 不等于 commit。\u003c/p>\n\u003cp>B 后仍有取消窗口，需运行监督与硬上界。执行身份包含原 Tool/branch/重执行，不仅 branch_key；Attempt 接管不洗掉旧未决预留。\u003c/p>\n\u003ch2 id=\"结束取消与故障恢复\">结束、取消与故障恢复\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>正常结束\u003c/td>\n\u003ctd>幂等结算可信用量，只释放已证明未用部分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取消/timeout/等待\u003c/td>\n\u003ctd>结算已知量；停止/未用尚不确定继续占用，interrupt 不代表停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>崩溃/丢报告/lease 失效\u003c/td>\n\u003ctd>保留待核对，不全额退款\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超预留/不可计量\u003c/td>\n\u003ctd>记录真实消耗并阻止新收费执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>终态后晚到\u003c/td>\n\u003ctd>独立追加核对，不重开 Run、不在末次 RUN_SNAPSHOT 后加事件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"执行权与结算权分开\">执行权与结算权分开\u003c/h3>\n\u003cp>旧 Worker 无权启动、续期、增额或释放；可信核对方可按原执行身份、来源/水位和停止证据接受晚到报告，不恢复旧执行权。停止与结清分别证明，Session CLOSED/branch outcome/Run 终态不能清零占用；部分证明只结算该部分，不增手工退款绕行入口。\u003c/p>\n\u003ch2 id=\"兼容公开信息与实施顺序\">兼容、公开信息与实施顺序\u003c/h2>\n\u003cp>旧 Run 无可靠账本时标累计未知，不从 Session 摘要回填零；旧非终态能可靠重建才续行，否则停止收费并明确新建。max_output_bytes 保持单响应含义；公开上限/已用/占用/待核对量取服务端投影，Brief 余额也只是带时点观察。\u003c/p>\n\u003ch3 id=\"上线门禁与接线顺序\">上线门禁与接线顺序\u003c/h3>\n\u003cp>先固定计量契约/局部强制，再验证真实 DB 并发、未知提交与受信核对方；随后把创建重放、主子执行、等待/取消/重试全部接同一账户，最后开放投影、三语与新策略。缺一入口不回退完整上限。\u003c/p>\n\u003cp>切换前隔离不识别策略的旧 Worker，处理在途；回退保留账户/预留/报告，不删账让旧执行继续。0030 任一表有数据时拒绝 downgrade 删表，空表才可删除；不据此假定已具备完整恢复。公开变化同步 DTO、Schema/example/OpenAPI 与消费者。\u003c/p>\n\u003ch2 id=\"验收矩阵\">验收矩阵\u003c/h2>\n\u003cp>覆盖连续主子分配、最后余额竞争、同键异内容、重复/乱序/缺测报告、resume 历史去重、A/B/C 提交丢响应、启动后崩溃/接管、晚到结算、混合 Worker/回退与旧 Run。分别证明真实事务、adapter 硬限额和 SDK 计量完整性；split_budget 或内部账本单测不代表 Run 级预算已生效。\u003c/p>\n", "sections": [{"title": "Run 预算与执行限额", "level": "h1", "anchor": "run-预算与执行限额", "text": "# Run 预算与执行限额\n\n同一 Run 的主执行、子分析、Segment 续行与 Attempt 重试必须共用账户。本页区分现行局部限制与尚未接入执行的持久账本；不是预算 API。当前状态见[计划 R02](../planning/roadmap.md#r02-run-统一预算)。"}, {"title": "先区分上限、分配与消耗", "level": "h2", "anchor": "先区分上限分配与消耗", "text": "## 先区分上限、分配与消耗\n\n冻结上限是授权，预留是已承诺额度，消耗是已确认用量。分支拿到 10 turns 不等于用掉 10；Session 数和摘要长度也不是消费。"}, {"title": "当前实现的实际口径", "level": "h3", "anchor": "当前实现的实际口径", "text": "### 当前实现的实际口径\n\n| 限制 | 当前边界 |\n| --- | --- |\n| max_turns | SDK 每次执行上限，不累计所有主子 Session/重试 |\n| max_budget_usd | 可选 SDK 局部限制；普通创建快照未设置，子 context 原值继承、不按支拆分 |\n| max_output_bytes | Gateway 单个序列化 Tool response 的 UTF-8 字节上限，不是累计输出/磁盘配额 |\n| 子分析 budget | 每次 dispatch 重拆父冻结 turns/output 上限；连续调用未扣共享余额 |\n| RUN_MAX_ATTEMPTS | 当前 Segment 的技术重试次数，不限制全部业务续行或 Run 成本 |\n| 输入文件数量/字节 | 逐根及跨根最终存量，规则见[资源总量](resource-snapshots.md#跨根总量) |\n\n例如父快照 20 turns，两次各派两支时每次仍各分 10，不构成全 Run 20 的保证。账本已有内部实现，但创建、主 Executor、子 Provider 与 Worker startup 均未调用。"}, {"title": "用量现在流向哪里", "level": "h3", "anchor": "用量现在流向哪里", "text": "### 用量现在流向哪里\n\n| 来源 | 当前保存方式与缺口 |\n| --- | --- |\n| SDK mapper | usage 与 rate-limit 通知都可为 USAGE_UPDATED，Result 终端/等待另带 turns/cost；不能逐事件相加 |\n| 主 Executor / Session | Result 按 key 更新，Session usage 最新替换、cost 保存最近总值；无统一来源/去重账本 |\n| 取消覆盖事件 | 保留该事件已观察 usage/cost，丢弃成功/提问正文；SESSION_INTERRUPTED 不更新 Session usage，不能从事件反推相同投影 |\n| 子收集器 / Session | 校验终端和结果，但不归集用量；子 usage 仅 branch_key、cost 空，失败也不等于零消耗 |\n\n计量必须先确认 SDK 报告是否含历史、重试或子调用，不能把 Session、Result 和最终报告重复入账。"}, {"title": "现有计时器的覆盖范围", "level": "h3", "anchor": "现有计时器的覆盖范围", "text": "### 现有计时器的覆盖范围\n\n默认配置来自 [Settings](../../PJM/backend/src/projectmind/core/settings.py)、[创建快照](../../PJM/backend/src/projectmind/runs/service.py)和 [Worker 注册](../../PJM/backend/src/projectmind/worker/settings.py)，部署以实际注入值为准。\n\n| 计时器 | 默认值与覆盖 |\n| --- | --- |\n| Attempt lease | 60 秒，可配 30–300；约每 1/3 续期，仅代表执行权 |\n| 准备 timeout | 300 秒，可配 1–3600；包住 ContextBuilder 及其输入提交，不含 Brief/启动/终态事务 |\n| 仓库单命令 | 120 秒，可配 5–600，不是所有根准备总时长 |\n| 模型事件流 | 普通创建冻结 900 秒，准备后起算；只对下一事件 await 施加 deadline，不打断事件持久化 |\n| 子分支 | 300 秒，可配 30–600，不赠送 Run 额度 |\n| ARQ execute_run | 1200 + 准备秒数，默认 1500；整个 job 最终防线，其他 job/cron 独立 |\n| 人工等待 | 持久 expires_at；释放主 lease，不刷新 Run 总额度 |\n\n准备 240 秒加模型 850 秒可分别合法，但不是 900 秒的 Run 总预算。续 lease 不延长 deadline；准备/事件 timeout 为协作取消，线程 I/O、清理或 DB 等待可能晚返回，不能承诺按秒硬杀。Job timeout/关停仍可能中断终态提交。\n\nEffect Worker 另有 lease，复用部分配置但无主 Executor 的贯穿监督；其[执行权/取消缺口](repository-effects.md#执行权与取消)不能由本表推导为已解决。"}, {"title": "目标与非目标", "level": "h2", "anchor": "目标与非目标", "text": "## 目标与非目标\n\n目标是冻结授权不变、余额可审计变化，重试/续行不重领完整额度。不引入钱包、充值或组织计费；扩大上限新建 Run。Skill 解释、独立评估、模块构建另设限制，不借本 Run 账户。"}, {"title": "分开定义计量维度", "level": "h3", "anchor": "分开定义计量维度", "text": "### 分开定义计量维度\n\n| 维度 | 必须冻结的口径 |\n| --- | --- |\n| turns | Adapter 定义新增 turn；不按 ToolCall/事件数代替，resume 历史不重复 |\n| 成本 | 币种/精度/累计或增量/延迟规则；固定精度，不用 float 比余额 |\n| 累计输出（后续） | 明确文本/结构化/Tool response 范围，DELTA 与 COMPLETED 不重复 |\n| 活动时长（后续） | 累计墙钟区间，子并行重叠不相加，排队/人工等待不计，准备仍独立 timeout |\n\n只有 adapter 可强制执行上界，才可承诺硬限额。未启用某维度不宣称受限；已启用但不可计量则阻止新收费执行。null 不等于零或免费。"}, {"title": "计量报告如何归一化", "level": "h3", "anchor": "计量报告如何归一化", "text": "### 计量报告如何归一化\n\n| 报告 | 入账规则 |\n| --- | --- |\n| 增量 | 绑定原执行的稳定键；同键同内容一次入账，异内容阻断核对 |\n| 累计 | 保存来源/水位，只计可信增量，旧报告不退款，最终值不整体再加 |\n| resume/fork/范围变化 | 证明覆盖范围、历史/子调用与基线；不能共用一个 last_usage |\n| 缺失/冲突/无效 | 保留未知占用；负数、非有限数、错单位或无执行归属不变成零，更正另存审计 |\n\n可信 adapter 归一化并固定 SDK/CLI/规则版本，一个来源入账、其他交叉核对。BudgetUsageReport 只接收已归一化值；final=True 必须证明启用维度收齐，而非“最后事件”。增量须无漏报，累计 turns/cost 各自水位，缺测不推进。"}, {"title": "一个账户，多个执行预留", "level": "h2", "anchor": "一个账户多个执行预留", "text": "## 一个账户，多个执行预留\n\n每个可加维度：remaining = limit - consumed - reserved。预留前不启动，余额不足/账本不可用则拒绝；reserved 包含未知占用，确认用量原子转 consumed，不双算。实际超支保留真实差额并阻断新分配，不截断数字。活动时长按区间另算。"}, {"title": "一个例子：已用、占用与可用", "level": "h3", "anchor": "一个例子已用占用与可用", "text": "### 一个例子：已用、占用与可用\n\n以下是目标账户，不是当前 dispatch 输出，假设已验证 20 turns 的共享硬上界：\n\n| 时点 | 已用 | 占用 | 可用 |\n| --- | ---: | ---: | ---: |\n| 前一段结算 | 4 | 0 | 16 |\n| 主执行预留 6 | 4 | 6 | 10 |\n| 子 A/B 各预留 3 | 4 | 12 | 4 |\n| A 用 2 且停止 | 6 | 9 | 5 |\n| B 失联、主用 5 且停止 | 11 | 3 | 6 |\n\nB 的 3 不因 lease 过期退还，新执行最多用 6；若不能证明 B 仍受 3 的上界约束，暂停整个账户分配。"}, {"title": "持久账本的当前载体", "level": "h3", "anchor": "持久账本的当前载体", "text": "### 持久账本的当前载体\n\n[budget_store](../../PJM/backend/src/projectmind/runs/budget_store.py)、[repository_budgets](../../PJM/backend/src/projectmind/runs/repository_budgets.py)与 [0030](../../PJM/backend/migrations/versions/0030_run_budget_ledger.py)已有以下内部载体：\n\n| 表 | 责任 |\n| --- | --- |\n| run_budget_accounts | Run 唯一，策略/限额 checksum、已用/占用、阻断与版本 |\n| run_budget_reservations | Run/Segment/Attempt、操作组/执行键、parent、lease hash、授予量与启动/结算事实 |\n| run_budget_receipts | 原预留+回执键去重，追加用量、停止、未启动释放或核对失败；不依赖 RunEvent |\n\n内部 run-budget/v1 只定义 turns/可选成本，非 HTTP 协议。成本为 nano-USD，DTO 整数、列 Numeric(38,0)，计算先转整数、存储再转 Decimal；边界拒绝 float/不足最小单位，不静默舍入。旧数值须经版本化转换。\n\nnew_budget_account 仅构造未保存/未开始且限额匹配的新账户；未来与 Run 同事务按 FK 顺序保存。0030 不回填旧 Run、不启动核对；执行端不能补造零余额。"}, {"title": "内部状态不能当作运行证明", "level": "h3", "anchor": "内部状态不能当作运行证明", "text": "### 内部状态不能当作运行证明\n\n| 状态 | 含义 |\n| --- | --- |\n| RESERVED | 已占用、无启动意图；未启动释放同时关闭启动资格 |\n| START_INTENT | 可能已开始；重复读取不许可重启，未知占用继续保留 |\n| SETTLED | 已提供停止依据和完整用量并释放未用量，不等于 Run 成功 |\n| RELEASED | 未启动预留已关闭，不是启动后的退款 |\n\nverified_evidence 目前只校验键形状，claim_reconciliation 只操作内部 lease。二者不验证真实停止、不建立核对方身份；须接受信服务、锁外证据校验和来源验证，不能开放给模型/用户/旧 Worker。"}, {"title": "原子性与重复请求", "level": "h3", "anchor": "原子性与重复请求", "text": "### 原子性与重复请求\n\n预留同事务验证状态/权限/余额/身份。所需锁顺序为 Run → Segment → Attempt → 账户 → 预留，可跳不需要层，不得反向取锁；获锁后再判当前时间/fencing，锁外调用模型和核对。\n\n同操作同键返回原记录，异内容冲突；真正重执行用新身份取余额。回放 Tool 结果不重调 Provider，但新模型执行仍计量。全组 dispatch 原子预留，全部获准才逐支启动，之后各自结算。\n\n主执行未用预留不能复制给子支。主模型等待 Tool 不表示已停止或缩额；现有 adapter 无中途缩额协议时，只从未承诺余额分配，不足拒绝。转移额度须先证明主执行停止且局部上限同步收窄。"}, {"title": "启动与结算的提交边界", "level": "h3", "anchor": "启动与结算的提交边界", "text": "### 启动与结算的提交边界\n\n```text\nTX A：执行权 + 原子预留，确认原键\n  → TX B：重验执行权 + START_INTENT\n  → 锁外：带执行身份/局部上限调用 adapter\n  → TX C：去重核对，结算或保留占用\n```\n\nDB 与模型不能原子启动。A 响应丢失查原键，不换键扣额；B 后崩溃/响应丢失可能已收费，只在证明未开始且不能再开始时释放。\n\n当前 store 的 A 在 repository 返回后遇提交错误会新 session 按原组确认，仍要求有效 lease。B 仅首次明确提交返回 True；已有意图返回 False，提交未知抛 BudgetStartUncertainError，均不许可再次启动。C 冲突以结果返回并先提交阻断事实，不能改抛异常使审计回滚。repository.flush 不等于 commit。\n\nB 后仍有取消窗口，需运行监督与硬上界。执行身份包含原 Tool/branch/重执行，不仅 branch_key；Attempt 接管不洗掉旧未决预留。"}, {"title": "结束、取消与故障恢复", "level": "h2", "anchor": "结束取消与故障恢复", "text": "## 结束、取消与故障恢复\n\n| 场景 | 处理 |\n| --- | --- |\n| 正常结束 | 幂等结算可信用量，只释放已证明未用部分 |\n| 取消/timeout/等待 | 结算已知量；停止/未用尚不确定继续占用，interrupt 不代表停止 |\n| 崩溃/丢报告/lease 失效 | 保留待核对，不全额退款 |\n| 超预留/不可计量 | 记录真实消耗并阻止新收费执行 |\n| 终态后晚到 | 独立追加核对，不重开 Run、不在末次 RUN_SNAPSHOT 后加事件 |"}, {"title": "执行权与结算权分开", "level": "h3", "anchor": "执行权与结算权分开", "text": "### 执行权与结算权分开\n\n旧 Worker 无权启动、续期、增额或释放；可信核对方可按原执行身份、来源/水位和停止证据接受晚到报告，不恢复旧执行权。停止与结清分别证明，Session CLOSED/branch outcome/Run 终态不能清零占用；部分证明只结算该部分，不增手工退款绕行入口。"}, {"title": "兼容、公开信息与实施顺序", "level": "h2", "anchor": "兼容公开信息与实施顺序", "text": "## 兼容、公开信息与实施顺序\n\n旧 Run 无可靠账本时标累计未知，不从 Session 摘要回填零；旧非终态能可靠重建才续行，否则停止收费并明确新建。max_output_bytes 保持单响应含义；公开上限/已用/占用/待核对量取服务端投影，Brief 余额也只是带时点观察。"}, {"title": "上线门禁与接线顺序", "level": "h3", "anchor": "上线门禁与接线顺序", "text": "### 上线门禁与接线顺序\n\n先固定计量契约/局部强制，再验证真实 DB 并发、未知提交与受信核对方；随后把创建重放、主子执行、等待/取消/重试全部接同一账户，最后开放投影、三语与新策略。缺一入口不回退完整上限。\n\n切换前隔离不识别策略的旧 Worker，处理在途；回退保留账户/预留/报告，不删账让旧执行继续。0030 任一表有数据时拒绝 downgrade 删表，空表才可删除；不据此假定已具备完整恢复。公开变化同步 DTO、Schema/example/OpenAPI 与消费者。"}, {"title": "验收矩阵", "level": "h2", "anchor": "验收矩阵", "text": "## 验收矩阵\n\n覆盖连续主子分配、最后余额竞争、同键异内容、重复/乱序/缺测报告、resume 历史去重、A/B/C 提交丢响应、启动后崩溃/接管、晚到结算、混合 Worker/回退与旧 Run。分别证明真实事务、adapter 硬限额和 SDK 计量完整性；split_budget 或内部账本单测不代表 Run 级预算已生效。"}], "toc": [{"title": "先区分上限、分配与消耗", "anchor": "先区分上限分配与消耗", "level": "h2"}, {"title": "当前实现的实际口径", "anchor": "当前实现的实际口径", "level": "h3"}, {"title": "用量现在流向哪里", "anchor": "用量现在流向哪里", "level": "h3"}, {"title": "现有计时器的覆盖范围", "anchor": "现有计时器的覆盖范围", "level": "h3"}, {"title": "目标与非目标", "anchor": "目标与非目标", "level": "h2"}, {"title": "分开定义计量维度", "anchor": "分开定义计量维度", "level": "h3"}, {"title": "计量报告如何归一化", "anchor": "计量报告如何归一化", "level": "h3"}, {"title": "一个账户，多个执行预留", "anchor": "一个账户多个执行预留", "level": "h2"}, {"title": "一个例子：已用、占用与可用", "anchor": "一个例子已用占用与可用", "level": "h3"}, {"title": "持久账本的当前载体", "anchor": "持久账本的当前载体", "level": "h3"}, {"title": "内部状态不能当作运行证明", "anchor": "内部状态不能当作运行证明", "level": "h3"}, {"title": "原子性与重复请求", "anchor": "原子性与重复请求", "level": "h3"}, {"title": "启动与结算的提交边界", "anchor": "启动与结算的提交边界", "level": "h3"}, {"title": "结束、取消与故障恢复", "anchor": "结束取消与故障恢复", "level": "h2"}, {"title": "执行权与结算权分开", "anchor": "执行权与结算权分开", "level": "h3"}, {"title": "兼容、公开信息与实施顺序", "anchor": "兼容公开信息与实施顺序", "level": "h2"}, {"title": "上线门禁与接线顺序", "anchor": "上线门禁与接线顺序", "level": "h3"}, {"title": "验收矩阵", "anchor": "验收矩阵", "level": "h2"}], "source": "design/run-budgets.md", "checksum": "5db3e06f50aa72a644012687da805a02011482ab864d48c4656990d7d702768e"}, {"id": "docs/design/repository-effects.md", "title": "受控外部写入", "group": "design", "html": "\u003ch1 id=\"受控外部写入\">受控外部写入\u003c/h1>\n\u003cp>本页负责提案、批准、远端效果与恢复。Provider/审批链已有实现，可靠性缺口见后文及\u003ca href=\"#docs/planning/roadmap.md::r08-%E5%A4%96%E9%83%A8%E6%95%88%E6%9E%9C\">计划 R08\u003c/a>。Run 续行见 \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>，现场处置见\u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清四种事实\">先分清四种事实\u003c/h2>\n\u003cp>用户批准修改文件，Git push/回读成功，PR 请求超时：批准和 commit 可已成立，PR 与平台最终保存仍可能未知；重启、再批准或取消 Run 都不撤销 commit。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>状态含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ChangeProposal\u003c/td>\n\u003ctd>冻结变更；APPROVED 是获准，不是已写入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ChangeApproval\u003c/td>\n\u003ctd>对精确 version/checksum 的决定，不扩其他权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EffectExecution\u003c/td>\n\u003ctd>APPLIED 是已保存 Provider 完成结果；FAILED 不证明远端未变，VERIFICATION_FAILED 属于此对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run / Evidence\u003c/td>\n\u003ctd>分别是分析流程与审计依据，不代替远端执行事实\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Effect attempt_no 不是 RunAttempt。before_ref/after_ref 可空，仓库 before Evidence 仅定位基线，不保证逆向补丁。Result 中模型 effects 摘要尚未逐项核验，不能替代平台记录，见\u003ca href=\"#docs/design/results-evaluation.md::%E5%BC%95%E7%94%A8%E5%8F%AF%E4%BF%A1%E6%80%A7%E7%9A%84%E4%BF%AE%E6%AD%A3%E8%A6%81%E6%B1%82\">结果引用\u003c/a>。\u003c/p>\n\u003ch2 id=\"调用与批准链路\">调用与批准链路\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">observe → Evidence → change.propose → 精确批准/允许的预授权\n  → TX 1：批准 / Effect / Outbox\n  → TX 2：提案与 binding 校验 / claim\n  → 锁外：凭据 / 前置检查 / 写入 / read-back / 可选 PR\n  → TX 3：结果 / Evidence / 事件 / 后续调度\n\u003c/code>\u003c/pre>\n\u003cp>数据库所需锁按 Run → Segment → Proposal → Effect；不持锁远端 I/O，不宣称跨 DB/仓库/forge 原子。拒绝不产生可执行 Effect；批准后 Run 仍可 WAITING_FOR_APPROVAL，但已由独立 Effect Worker 工作。\u003c/p>\n\u003cp>有效 finalize 后，结果或不可重试失败交新 Segment；临时失败在原 Segment/Proposal/Effect 重调度，不制造新业务需求。Agent 只提案，不直接调用 write；\u003ca href=\"../PJM/backend/src/projectmind/effects/catalog.py\">EFFECT_CAPABILITIES\u003c/a>统一 Provider/validator/预授权资格。\u003c/p>\n\u003ch2 id=\"已注册写入\">已注册写入\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>capability\u003c/th>\n\u003cth>批准与执行边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>issue.update/v1\u003c/td>\n\u003ctd>Redmine CAS adapter；仅 system ADMIN 配置 LOW 风险精确 scope 可预授权，discovery → 前置 revision → 条件写入 → 回读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>repository.write/v1\u003c/td>\n\u003ctd>Git/SVN，始终人工批准，不 force；精确 CAS/恢复仍有缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>标准 Redmine REST 不自带本协议的 CAS/幂等，未通过版本化 discovery 禁止 apply；声明也须真实竞争验收。批准时重验 actor/Project/version/checksum/Integration/binding，不扩大原 scope；决策者限 Run 发起人或组织 system ADMIN，不是普通 ProjectMember。\u003c/p>\n\u003ch2 id=\"仓库写入模式\">仓库写入模式\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>write_mode\u003c/th>\n\u003cth>目标与限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>direct（默认）\u003c/td>\n\u003ctd>Git 默认目标普通 fast-forward push；SVN 绑定 URL，不据此宣称精确 revision CAS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>branch\u003c/td>\n\u003ctd>projectmind/ 保留分支；SVN 为仓库根 branches/projectmind/，只应新建或证明重放原提交\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Git branch 可经 forge 创建 GitHub/GitLab PR/MR；未配 forge 仅分支/commit，direct 和 SVN 不调 forge。PR 失败不撤回 commit。\u003ca href=\"../PJM/backend/src/projectmind/effects/repository_effect.py\">repository_effect\u003c/a>旧“仅 Git 分支”注释不覆盖现有 direct/SVN 行为。\u003c/p>\n\u003ch2 id=\"变更载体和冻结内容\">变更载体和冻结内容\u003c/h2>\n\u003cp>提案冻结 binding、capability/operation、风险、Evidence、前置 revision、预览与幂等身份。仓库仅逐文件全文 SET/REMOVE，不执行任意 diff/Shell。Provider 使用独立可写临时副本，不能拿只读 input/ 提交。\u003c/p>\n\u003ch3 id=\"契约与幂等身份\">契约与幂等身份\u003c/h3>\n\u003cp>\u003ca href=\"../PJM/contracts/tools/change.propose/v1/request.schema.json\">change.propose request\u003c/a>由 capability validator 收窄；\u003ca href=\"../PJM/backend/src/projectmind/api/routes/effects.py\">decision route\u003c/a>接收决定与 Idempotency-Key；ClaimedEffectExecution 是内部冻结载体，不暴露凭据/config/lease。\u003c/p>\n\u003cp>提案键、决定键、Run 创建键分别定义。决策重放要求原 key 及同 proposal/version/checksum/decision/reason；远端沿原 Proposal/Effect 身份重试，不因新 Worker 换键。\u003c/p>\n\u003cp>现有 \u003ca href=\"../PJM/contracts/tools/repository.write/v1/request.schema.json\">repository.write Schema\u003c/a>仍限定 projectmind/ branch，非当前 Effect Worker 输入，也不是 direct 示例。后续审查消费者/版本/历史再同步，不能借旧 Schema 开放 Agent 直接 write。\u003c/p>\n\u003ch2 id=\"并发重试和失败\">并发、重试和失败\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>当前处理及限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>决策版本/checksum 不符\u003c/td>\n\u003ctd>拒绝旧预览，重新读取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目标陈旧/冲突\u003c/td>\n\u003ctd>STALE/target_stale 或 FAILED/target_branch_conflict，不改已批准内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可重试 transport 错误\u003c/td>\n\u003ctd>记错后 REQUESTED/Outbox 重进整个 Provider；次数耗尽、取消、过期不自动继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回读不匹配\u003c/td>\n\u003ctd>VERIFICATION_FAILED，不自动重试；外部可能已变，证据未必保存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回读断连/commit 后 PR 失败\u003c/td>\n\u003ctd>按 transport 分类；暂无持久“commit 完成待 PR”阶段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>claim 前取消\u003c/td>\n\u003ctd>拒绝 Provider；claim 后仍有窗口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Provider 中取消\u003c/td>\n\u003ctd>有效 lease finalize 先存远端结果再取消 Run，不做逆向写入\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>reversible/rollback 仅说明可逆性，不提供一键回滚。撤回须审查真实 revision 后走新的修正流程；禁止 force、自动合并、自批、repository 免审、跨仓库原子写和无 scope 更新。\u003c/p>\n\u003ch2 id=\"可靠性修正要求\">可靠性修正要求\u003c/h2>\n\u003cp>以下是待实现目标，不因 Provider 存在而视为完成。\u003c/p>\n\u003ch3 id=\"执行身份与远端前置条件\">执行身份与远端前置条件\u003c/h3>\n\u003cp>当前 Git/SVN 的 matches 仅比较变更路径内容；Redmine 在 revision 不同但字段相同时也可报 replayed。内容相同不能证明原身份执行，同名 branch 也可能属他人。\u003c/p>\n\u003cp>目标重放须同时证明原 Effect/请求、目标、批准基线及实际 revision/变更集；已知未执行则拒绝 stale，仍未知先核对。Git direct 预读+普通 push、branch 先查不存在+push 均需远端更新点的精确旧 ref/不存在条件；增加 GET/本地锁不足，不放开 force。\u003c/p>\n\u003cp>SVN 当前 checkout 未固定 revision，回读与返回 revision 取事后当前值。须固定 direct/branch 基线、提交回执与对应 revision 回读，out-of-date 不能覆盖 checkout 前变化。旧记录无证明不补造回执。\u003c/p>\n\u003ch3 id=\"阶段回执与不确定结果\">阶段回执与不确定结果\u003c/h3>\n\u003cp>当前整个 Provider 成功返回后才保存 before/after：Git forge 失败丢失已确认 commit 的返回；SVN copy 与文件 commit 为两次写入；forge 复用同 source 首个 open PR，未完整核对 target/提案和并发。\u003c/p>\n\u003cp>目标在同 Effect 下追加调用前身份、写后可验证回执和读取结果，区分未执行、已执行待验证/PR、未知。恢复先查原身份，仅补未发生阶段；PR/MR 匹配仓库/source/target/提案，关闭/合并/并发/丢响应分别处理。\u003c/p>\n\u003cp>新载体尚未冻结，实施同步 migration/repository/Provider/事件/detail/Web。空旧字段不证明未执行；不靠 SQL、删 Effect 或换 key 修复，阶段记录也不能消除 DB 与远端断连窗口。\u003c/p>\n\u003ch3 id=\"执行权与取消\">执行权与取消\u003c/h3>\n\u003cp>当前 claim → apply → finalize 无贯穿 Provider 的 heartbeat/取消监督；过期重派时旧请求可能还在执行。claim 时间在取锁前计算，不能忽略等锁消耗。\u003c/p>\n\u003cp>目标获锁后用新时间建/验 lease，各新外部步骤前重验批准/取消与执行权。失权/超时不证明未写；保留并确认原结果后再决策，不能让第二 Worker 直接重写。只读核对与新写分开，取消也保留已发生事实。\u003c/p>\n\u003ch2 id=\"验收\">验收\u003c/h2>\n\u003cp>覆盖决定丢响应/同键改 reason、同内容不同提案、预读后目标变化、SVN copy 中断及固定 revision 回读、commit 后 PR 超时/并发、Provider 超 lease/取消/旧 Worker 晚到、finalize 响应未知。原身份不重建，不误认他人提交，部分成功可追溯。\u003c/p>\n\u003cp>入口：\u003ca href=\"../PJM/backend/tests/effects\">Provider 回归\u003c/a>、\u003ca href=\"../PJM/backend/tests/worker/test_effect_executor.py\">Effect Worker\u003c/a>。真实 DB/远端/forge/CAS 故障注入与\u003ca href=\"#docs/design/workspace.md::%E5%AE%A1%E6%89%B9%E8%AF%B7%E6%B1%82%E4%B8%8E%E6%89%A7%E8%A1%8C%E7%BB%93%E6%9E%9C\">审批 UI\u003c/a>恢复分别验收，局部 transport 测试不证明整链可靠。\u003c/p>\n", "sections": [{"title": "受控外部写入", "level": "h1", "anchor": "受控外部写入", "text": "# 受控外部写入\n\n本页负责提案、批准、远端效果与恢复。Provider/审批链已有实现，可靠性缺口见后文及[计划 R08](../planning/roadmap.md#r08-外部效果)。Run 续行见 [Runtime](agent-runtime.md)，现场处置见[Runbook](../operations/runbook.md)。"}, {"title": "先分清四种事实", "level": "h2", "anchor": "先分清四种事实", "text": "## 先分清四种事实\n\n用户批准修改文件，Git push/回读成功，PR 请求超时：批准和 commit 可已成立，PR 与平台最终保存仍可能未知；重启、再批准或取消 Run 都不撤销 commit。\n\n| 对象 | 状态含义 |\n| --- | --- |\n| ChangeProposal | 冻结变更；APPROVED 是获准，不是已写入 |\n| ChangeApproval | 对精确 version/checksum 的决定，不扩其他权限 |\n| EffectExecution | APPLIED 是已保存 Provider 完成结果；FAILED 不证明远端未变，VERIFICATION_FAILED 属于此对象 |\n| Run / Evidence | 分别是分析流程与审计依据，不代替远端执行事实 |\n\nEffect attempt_no 不是 RunAttempt。before_ref/after_ref 可空，仓库 before Evidence 仅定位基线，不保证逆向补丁。Result 中模型 effects 摘要尚未逐项核验，不能替代平台记录，见[结果引用](results-evaluation.md#引用可信性的修正要求)。"}, {"title": "调用与批准链路", "level": "h2", "anchor": "调用与批准链路", "text": "## 调用与批准链路\n\n```text\nobserve → Evidence → change.propose → 精确批准/允许的预授权\n  → TX 1：批准 / Effect / Outbox\n  → TX 2：提案与 binding 校验 / claim\n  → 锁外：凭据 / 前置检查 / 写入 / read-back / 可选 PR\n  → TX 3：结果 / Evidence / 事件 / 后续调度\n```\n\n数据库所需锁按 Run → Segment → Proposal → Effect；不持锁远端 I/O，不宣称跨 DB/仓库/forge 原子。拒绝不产生可执行 Effect；批准后 Run 仍可 WAITING_FOR_APPROVAL，但已由独立 Effect Worker 工作。\n\n有效 finalize 后，结果或不可重试失败交新 Segment；临时失败在原 Segment/Proposal/Effect 重调度，不制造新业务需求。Agent 只提案，不直接调用 write；[EFFECT_CAPABILITIES](../../PJM/backend/src/projectmind/effects/catalog.py)统一 Provider/validator/预授权资格。"}, {"title": "已注册写入", "level": "h2", "anchor": "已注册写入", "text": "## 已注册写入\n\n| capability | 批准与执行边界 |\n| --- | --- |\n| issue.update/v1 | Redmine CAS adapter；仅 system ADMIN 配置 LOW 风险精确 scope 可预授权，discovery → 前置 revision → 条件写入 → 回读 |\n| repository.write/v1 | Git/SVN，始终人工批准，不 force；精确 CAS/恢复仍有缺口 |\n\n标准 Redmine REST 不自带本协议的 CAS/幂等，未通过版本化 discovery 禁止 apply；声明也须真实竞争验收。批准时重验 actor/Project/version/checksum/Integration/binding，不扩大原 scope；决策者限 Run 发起人或组织 system ADMIN，不是普通 ProjectMember。"}, {"title": "仓库写入模式", "level": "h2", "anchor": "仓库写入模式", "text": "## 仓库写入模式\n\n| write_mode | 目标与限制 |\n| --- | --- |\n| direct（默认） | Git 默认目标普通 fast-forward push；SVN 绑定 URL，不据此宣称精确 revision CAS |\n| branch | projectmind/ 保留分支；SVN 为仓库根 branches/projectmind/，只应新建或证明重放原提交 |\n\nGit branch 可经 forge 创建 GitHub/GitLab PR/MR；未配 forge 仅分支/commit，direct 和 SVN 不调 forge。PR 失败不撤回 commit。[repository_effect](../../PJM/backend/src/projectmind/effects/repository_effect.py)旧“仅 Git 分支”注释不覆盖现有 direct/SVN 行为。"}, {"title": "变更载体和冻结内容", "level": "h2", "anchor": "变更载体和冻结内容", "text": "## 变更载体和冻结内容\n\n提案冻结 binding、capability/operation、风险、Evidence、前置 revision、预览与幂等身份。仓库仅逐文件全文 SET/REMOVE，不执行任意 diff/Shell。Provider 使用独立可写临时副本，不能拿只读 input/ 提交。"}, {"title": "契约与幂等身份", "level": "h3", "anchor": "契约与幂等身份", "text": "### 契约与幂等身份\n\n[change.propose request](../../PJM/contracts/tools/change.propose/v1/request.schema.json)由 capability validator 收窄；[decision route](../../PJM/backend/src/projectmind/api/routes/effects.py)接收决定与 Idempotency-Key；ClaimedEffectExecution 是内部冻结载体，不暴露凭据/config/lease。\n\n提案键、决定键、Run 创建键分别定义。决策重放要求原 key 及同 proposal/version/checksum/decision/reason；远端沿原 Proposal/Effect 身份重试，不因新 Worker 换键。\n\n现有 [repository.write Schema](../../PJM/contracts/tools/repository.write/v1/request.schema.json)仍限定 projectmind/ branch，非当前 Effect Worker 输入，也不是 direct 示例。后续审查消费者/版本/历史再同步，不能借旧 Schema 开放 Agent 直接 write。"}, {"title": "并发、重试和失败", "level": "h2", "anchor": "并发重试和失败", "text": "## 并发、重试和失败\n\n| 情况 | 当前处理及限制 |\n| --- | --- |\n| 决策版本/checksum 不符 | 拒绝旧预览，重新读取 |\n| 目标陈旧/冲突 | STALE/target_stale 或 FAILED/target_branch_conflict，不改已批准内容 |\n| 可重试 transport 错误 | 记错后 REQUESTED/Outbox 重进整个 Provider；次数耗尽、取消、过期不自动继续 |\n| 回读不匹配 | VERIFICATION_FAILED，不自动重试；外部可能已变，证据未必保存 |\n| 回读断连/commit 后 PR 失败 | 按 transport 分类；暂无持久“commit 完成待 PR”阶段 |\n| claim 前取消 | 拒绝 Provider；claim 后仍有窗口 |\n| Provider 中取消 | 有效 lease finalize 先存远端结果再取消 Run，不做逆向写入 |\n\nreversible/rollback 仅说明可逆性，不提供一键回滚。撤回须审查真实 revision 后走新的修正流程；禁止 force、自动合并、自批、repository 免审、跨仓库原子写和无 scope 更新。"}, {"title": "可靠性修正要求", "level": "h2", "anchor": "可靠性修正要求", "text": "## 可靠性修正要求\n\n以下是待实现目标，不因 Provider 存在而视为完成。"}, {"title": "执行身份与远端前置条件", "level": "h3", "anchor": "执行身份与远端前置条件", "text": "### 执行身份与远端前置条件\n\n当前 Git/SVN 的 matches 仅比较变更路径内容；Redmine 在 revision 不同但字段相同时也可报 replayed。内容相同不能证明原身份执行，同名 branch 也可能属他人。\n\n目标重放须同时证明原 Effect/请求、目标、批准基线及实际 revision/变更集；已知未执行则拒绝 stale，仍未知先核对。Git direct 预读+普通 push、branch 先查不存在+push 均需远端更新点的精确旧 ref/不存在条件；增加 GET/本地锁不足，不放开 force。\n\nSVN 当前 checkout 未固定 revision，回读与返回 revision 取事后当前值。须固定 direct/branch 基线、提交回执与对应 revision 回读，out-of-date 不能覆盖 checkout 前变化。旧记录无证明不补造回执。"}, {"title": "阶段回执与不确定结果", "level": "h3", "anchor": "阶段回执与不确定结果", "text": "### 阶段回执与不确定结果\n\n当前整个 Provider 成功返回后才保存 before/after：Git forge 失败丢失已确认 commit 的返回；SVN copy 与文件 commit 为两次写入；forge 复用同 source 首个 open PR，未完整核对 target/提案和并发。\n\n目标在同 Effect 下追加调用前身份、写后可验证回执和读取结果，区分未执行、已执行待验证/PR、未知。恢复先查原身份，仅补未发生阶段；PR/MR 匹配仓库/source/target/提案，关闭/合并/并发/丢响应分别处理。\n\n新载体尚未冻结，实施同步 migration/repository/Provider/事件/detail/Web。空旧字段不证明未执行；不靠 SQL、删 Effect 或换 key 修复，阶段记录也不能消除 DB 与远端断连窗口。"}, {"title": "执行权与取消", "level": "h3", "anchor": "执行权与取消", "text": "### 执行权与取消\n\n当前 claim → apply → finalize 无贯穿 Provider 的 heartbeat/取消监督；过期重派时旧请求可能还在执行。claim 时间在取锁前计算，不能忽略等锁消耗。\n\n目标获锁后用新时间建/验 lease，各新外部步骤前重验批准/取消与执行权。失权/超时不证明未写；保留并确认原结果后再决策，不能让第二 Worker 直接重写。只读核对与新写分开，取消也保留已发生事实。"}, {"title": "验收", "level": "h2", "anchor": "验收", "text": "## 验收\n\n覆盖决定丢响应/同键改 reason、同内容不同提案、预读后目标变化、SVN copy 中断及固定 revision 回读、commit 后 PR 超时/并发、Provider 超 lease/取消/旧 Worker 晚到、finalize 响应未知。原身份不重建，不误认他人提交，部分成功可追溯。\n\n入口：[Provider 回归](../../PJM/backend/tests/effects/)、[Effect Worker](../../PJM/backend/tests/worker/test_effect_executor.py)。真实 DB/远端/forge/CAS 故障注入与[审批 UI](workspace.md#审批请求与执行结果)恢复分别验收，局部 transport 测试不证明整链可靠。"}], "toc": [{"title": "先分清四种事实", "anchor": "先分清四种事实", "level": "h2"}, {"title": "调用与批准链路", "anchor": "调用与批准链路", "level": "h2"}, {"title": "已注册写入", "anchor": "已注册写入", "level": "h2"}, {"title": "仓库写入模式", "anchor": "仓库写入模式", "level": "h2"}, {"title": "变更载体和冻结内容", "anchor": "变更载体和冻结内容", "level": "h2"}, {"title": "契约与幂等身份", "anchor": "契约与幂等身份", "level": "h3"}, {"title": "并发、重试和失败", "anchor": "并发重试和失败", "level": "h2"}, {"title": "可靠性修正要求", "anchor": "可靠性修正要求", "level": "h2"}, {"title": "执行身份与远端前置条件", "anchor": "执行身份与远端前置条件", "level": "h3"
