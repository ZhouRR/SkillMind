pability、同 Project 引用，再由 [resolver](../../SKM/backend/src/skillmind/integrations/secrets.py)解析。\n\n停用、材料缺失、未知 key 版、AAD/密文错误、不可读/空/超限均 fail closed，不换引用或空凭据降级。停用仅阻止后续解析，不能收回已解析值/已发请求；外部立即撤权另走 incident 流程。\n\nRun 不存原值，换引用/连接 revision 不改旧 snapshot；同明文重加密不改变 binding 身份/scope。"}, {"title": "轮换不是更换外部凭据", "level": "h2", "anchor": "轮换不是更换外部凭据", "text": "## 轮换不是更换外部凭据\n\nk1 → k2 重加密不更换或撤销外部 API key。[rotate_managed_material](../../SKM/backend/src/skillmind/integrations/repository.py)锁材料并事务重加密；active 标签相同直接 skipped、不验解密，标签必须稳定对应同一 key bytes，全 skipped 不是可读证明。"}, {"title": "切换与恢复的顺序", "level": "h3", "anchor": "切换与恢复的顺序", "text": "### 切换与恢复的顺序\n\n1. 获准维护窗口内，分别保留 DB 恢复点与对应旧 key，不在普通清单登记原值。\n2. 所有读写进程加载“新 active + 旧解密 key”；cipher 启动时构造，改 CLI 环境不更新 API/Worker。按[环境边界](../operations/deployment.md#环境文件与配置边界)核对 migrate 等实际持钥者。\n3. 执行既有 CLI、核对退出/计数；旧实例仍写旧版时不算完成，行锁不阻止随后旧配置写入。\n4. 受控验必要解密及完整读取链，再移出现用旧 key；尚无全量只读验证 CLI，不输出明文代验。\n5. 备份仍依赖旧 key 时独立保管恢复副本；仅 DB dump 无法恢复丢失密钥。\n\n命令见 [Runbook](../operations/runbook.md#managed-secret-の-kek-運用)，不承诺热更新。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n入口见[Backend](../../SKM/README.md#backend)/[契约](../../SKM/README.md#contracts)。验证跨 Project/非 ADMIN 拒绝、DTO 无泄漏、引用/材料回滚、key/AAD/篡改/空值失败关闭，以及 FILE 链接竞争、API/Worker/CLI 混合配置和旧备份恢复。\n\ncrypto/helper 或 fake repository 不证明真实事务、进程切换、Web 明文处理和恢复；R05/R11 的实环境缺口保留。"}], "toc": [{"title": "一个例子：保存成功不等于资源可用", "anchor": "一个例子保存成功不等于资源可用", "level": "h2"}, {"title": "三种来源的边界", "anchor": "三种来源的边界", "level": "h2"}, {"title": "MANAGED 的实际加密结构", "anchor": "managed-的实际加密结构", "level": "h2"}, {"title": "明文与威胁边界", "anchor": "明文与威胁边界", "level": "h3"}, {"title": "读取与失效", "anchor": "读取与失效", "level": "h2"}, {"title": "轮换不是更换外部凭据", "anchor": "轮换不是更换外部凭据", "level": "h2"}, {"title": "切换与恢复的顺序", "anchor": "切换与恢复的顺序", "level": "h3"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/secret-storage.md", "checksum": "1b33c1b466f1259911a35e20f90377ab29b3575c0b3965feed45499334b4bc45"}, {"id": "docs/design/skill-contract.md", "title": "Skill 兼容、解释与发布", "group": "design", "html": "\u003ch1 id=\"skill-兼容解释与发布\">Skill 兼容、解释与发布\u003c/h1>\n\u003cp>本页是目录式 Skill 的语义与生命周期正本；代码见\u003ca href=\"#docs/design/skill-interpretation.md::\">解释实现\u003c/a>，缺口见\u003ca href=\"#docs/planning/roadmap.md::r06-skill-%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9F\">计划 R06\u003c/a>。\u003c/p>\n\u003ch2 id=\"设计目标\">设计目标\u003c/h2>\n\u003cp>外部 Skill 无需改成平台专用目录/业务 Schema；Interpreter 理解目标、资源、规则和交付，动态派生业务字段，平台仅固定跨组件协议。\u003c/p>\n\u003cp>Tool/Shell/network/write 声明不是权限。必需规则/禁止事项不因缺工具而弱化，推荐步骤可在冻结权限内调整；来源/解释/调整保留 trace，发布版本不可原地修改。\u003c/p>\n\u003ch2 id=\"分层架构\">分层架构\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">可信 Adapter/Normalizer → 不执行来源的静态分析\n  → 版本化 Interpreter 系统 Skill + 模型\n  → 确定性 Validator → Preview / 追加调整\n  → ADMIN 发布 → Project 启用 → TaskProjector / RuntimeLoader\n\u003c/code>\u003c/pre>\n\u003cp>业务依赖 SkillInterpreter 抽象而非 SDK message。来源不能替换 Adapter；脚本只作来源/checksum 对象，执行须走注册 Provider。\u003c/p>\n\u003ch2 id=\"导入兼容层\">导入兼容层\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/skills/importer.py\">importer\u003c/a>支持本地目录 CLI、内联 JSON、多文件 multipart，读取说明、metadata、references、scripts 和文本资产。HTTP 的\u003ca href=\"#docs/design/skill-interpretation.md::%E5%AF%BC%E5%85%A5%E4%BF%9D%E5%AD%98%E4%B8%8E%E4%B8%8A%E4%BC%A0%E6%8E%88%E6%9D%83\">限额/原 ADMIN 授权/跨存储失败\u003c/a>由用例负责；CLI 只本地解析，不伪造会话或直接持久保存。\u003c/p>\n\u003cp>不执行来源脚本、装依赖、访问来源 URL、解析 Secret。ZIP/TAR 自动解包、远程 Git 尚不支持；新增须先定义路径/symlink/设备文件、体积/数量与固定 revision 防护。\u003c/p>\n\u003cp>NormalizedSkillPackage 保留身份、adapter version、hash、文件索引、原文/未知 metadata、静态发现与 trace，不丢未理解内容或提升权限。\u003c/p>\n\u003ch2 id=\"interpreter-的核心输出\">Interpreter 的核心输出\u003c/h2>\n\u003ch3 id=\"capabilityblueprint\">CapabilityBlueprint\u003c/h3>\n\u003cp>主要产物是 \u003ca href=\"../SKM/contracts/capability-blueprint/v1.schema.json\">CapabilityBlueprint\u003c/a>，不是业务表单 Schema：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>capability/intents/objectives\u003c/td>\n\u003ctd>能做什么、何时调用、目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>resource_requirements\u003c/td>\n\u003ctd>资源、必需性、访问/绑定条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>guidance/success_criteria\u003c/td>\n\u003ctd>必需/建议、质量与禁止事项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>deliverables/interaction_points/effect_intents\u003c/td>\n\u003ctd>交付、澄清/审查/批准、可能效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>source_traces/assumptions/questions\u003c/td>\n\u003ctd>依据及不能伪造的未知\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>新业务 capability 不必注册；真正 Tool 调用才使用 repository.read/v1 等注册版本 ID。\u003c/p>\n\u003ch3 id=\"resourcerequirement\">ResourceRequirement\u003c/h3>\n\u003cp>kind、required、access、versioned capabilities、selection_guidance 表达抽象条件；accepted_providers 只是兼容提示，不代替 capability/scope 校验。\u003c/p>\n\u003cp>多资源独立声明，创建前选定绑定；交互只能补冻结 scope 内信息，不换 Integration/文档或扩权，变化须新 Run，见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>。\u003c/p>\n\u003ch3 id=\"guidance-与约束\">Guidance 与约束\u003c/h3>\n\u003cp>required_rules 必须保留，recommended_steps 可重排，quality_criteria 约束最终证据/完整性，prohibited_actions 与平台硬拒绝独立生效。原文和规范化 guidance 均冻结，Worker 接收 checksum/引用，不能只传丢规则的摘要。\u003c/p>\n\u003ch3 id=\"taskblueprint-与动态参数\">TaskBlueprint 与动态参数\u003c/h3>\n\u003cp>TaskBlueprint 投影目标、资源槽、参数、交付/效果。稳定输入/机器输出可由受限 TaskContractDraft 编译 Schema；开放分析可仅用 OutcomeEnvelope、Markdown/Artifact、Evidence/Proposal。缺业务 Schema、ViewSpec、fixture 不单独阻止解释/发布。\u003c/p>\n\u003ch2 id=\"平台-contracts-的边界\">平台 contracts 的边界\u003c/h2>\n\u003cp>contracts 固定 API/Problem/RunEvent、Manifest/Blueprint/Brief/Outcome、Interaction/Effect/Evidence 和 Tool 通用协议，不预置业务结果模型或保存 Skill Gold。实例/评价数据留各自资产/测试边界，结构正确不证明推理正确。\u003c/p>\n\u003ch2 id=\"解释请求与响应\">解释请求与响应\u003c/h2>\n\u003ch3 id=\"冻结输入\">冻结输入\u003c/h3>\n\u003cp>冻结 Source/hash/索引/adapter、归一化/静态报告、资源/Tool catalog、目标协议、Interpreter Skill/version/prompt checksum、模型参数、父解释/调整指示，不含 Project credential。\u003c/p>\n\u003ch3 id=\"结构化响应\">结构化响应\u003c/h3>\n\u003cp>响应含 summary、compatibility、Blueprint、trace/diagnostics 及可选 confidence/assumptions/questions/TaskContractDraft。结构失败不将自由文本包装为已验证 Manifest；调整追加 Interpretation、lineage/diff。\u003c/p>\n\u003cp>默认 SDK structured-output；显式 SKILLMIND_SKILL_INTERPRETER_ACCEPT_PROMPT_JSON=true 可接文本完整 JSON，仍不得补字段/绕 Schema、identity/hash/gate，且不能当 structured-output 验收。\u003c/p>\n\u003ch3 id=\"防提示注入\">防提示注入\u003c/h3>\n\u003cp>平台规则、发布 guidance、用户输入、Tool 外部数据分层信任。来源不得泄露 Secret、改系统指令或授未注册 Tool；记录 diagnostic 并受上层边界约束。发现明文 credential 在模型前阻断，不等模型脱敏。\u003c/p>\n\u003ch2 id=\"兼容级别与运行就绪度\">兼容级别与运行就绪度\u003c/h2>\n\u003ch3 id=\"发布与就绪的判断顺序\">发布与就绪的判断顺序\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事实\u003c/th>\n\u003cth>仍需检查\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>parse / Preview\u003c/td>\n\u003ctd>可审查，不代表合法蓝图或可发布\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gate_passed\u003c/td>\n\u003ctd>无 hard error，warning 仍须 ADMIN 接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PUBLISHED\u003c/td>\n\u003ctd>Project 显式启用精确版\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Project 已启用\u003c/td>\n\u003ctd>资源、真实已安装 Provider/策略决定 readiness\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RUNNABLE/ACTIONABLE\u003c/td>\n\u003ctd>创建重验输入/资源，apply 重验精确批准\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"兼容级别\">兼容级别\u003c/h3>\n\u003cp>native/adapted/assisted 是小写兼容标签，不是发布状态。native/手工 fixture 不绕 Interpreter；Adapter 只归一化，assisted 仍满足门禁并需接受 warning。\u003c/p>\n\u003ch3 id=\"运行就绪度\">运行就绪度\u003c/h3>\n\u003cp>GUIDANCE_ONLY：指导/人工清单；CONFIGURATION_REQUIRED：待参数/资源；RUNNABLE：只读/工作区能力就绪；ACTIONABLE：存在可 apply 的资源/Provider，不代表已批准或远端可达。\u003c/p>\n\u003cp>版本属组织，Project 分别启用和计算 readiness；未启用不可发现，新发布不自动扩大执行面。\u003c/p>\n\u003ch2 id=\"校验与发布门禁\">校验与发布门禁\u003c/h2>\n\u003cp>硬门禁检查来源/hash/解释 identity、蓝图结构、真实 trace、Tool 版本格式、credential/路径逃逸/宿主命令授权/远程可执行引用、observe/propose/apply 区分、Manifest checksum/lineage/发布者。\u003c/p>\n\u003cp>来源验证覆盖全部 Manifest/Blueprint Task 的 key/capability，不只所选任务；Blueprint target 须能在原蓝图解析。Blueprint/动态契约 trace 的文件/行按原索引及可用文本核验，见\u003ca href=\"#docs/design/task-flow.md::%E8%BA%AB%E4%BB%BD%E6%9D%A5%E6%BA%90%E4%B8%8E%E5%A4%B1%E8%B4%A5\">来源核验\u003c/a>。field_path 保留现行 Schema/原文，不虚称已验证尚未定义的业务字段定位或模型理解。\u003c/p>\n\u003cp>未知业务概念、缺可选 Schema/ViewSpec/fixture、项目缺资源、推荐步骤不完整、assisted 本身不作 hard error；必要配置须创建前补，warning 必须明确接受。\u003c/p>\n\u003cp>蓝图仅由 Interpreter 生成；parse Draft 可 null，发布报 capability_blueprint_missing。Schema 容纳 Draft 不豁免发布，不从旧 workflow/data_sources 反推蓝图。\u003c/p>\n\u003ch2 id=\"runtimemanifest-v1alpha1\">RuntimeManifest v1alpha1\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/contracts/runtime-manifest/v1alpha1.schema.json\">Schema\u003c/a>固定 manifest_version=skillmind/v1alpha1。Manifest 冻结蓝图/任务、Tool/资源、规则、建议、效果及可选 Schema，不增平行语义摘要。\u003c/p>\n\u003cp>DRAFT 起内容/checksum 不变；发布状态、actor/时间、warning 接受属于版本/gate metadata。资源只声明于 capability_blueprint.resource_requirements，无顶层 data_sources，不含 Integration/Secret。\u003c/p>\n\u003ch2 id=\"skill-组合\">Skill 组合\u003c/h2>\n\u003cp>SkillComposition（Module）仅归组精确版本任务，ProjectComposition 控制展示；无跨 Skill 规则求解、自动编排或组合授权。\u003c/p>\n\u003ch3 id=\"组合保存的授权事务\">组合保存的授权事务\u003c/h3>\n\u003cp>三写仅当前本组织 ADMIN。必填原会话/CSRF，不另传创建者；复用\u003ca href=\"#docs/design/authentication.md::%E8%AE%A4%E8%AF%81%E4%B8%8E%E4%B8%9A%E5%8A%A1%E6%8F%90%E4%BA%A4%E4%B8%8D%E6%98%AF%E5%90%8C%E4%B8%80%E4%B8%AA%E4%BA%8B%E5%8A%A1\">原凭据校验\u003c/a>，锁 Organization → User SHARE → 原 AuthSession UPDATE → 当前 Project SHARE 并复核 ACTIVE；更新/删除再锁同组织组合和按 ID 排序的全部关联。锁、读取、flush 后取新时间复核，持锁至提交。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>创建/更新\u003c/td>\n\u003ctd>共享 require_current_task_binding 验同组织 Skill/Source、精确 PUBLISHED、当前未停用启用关系；按 UUID 锁 Version SHARE → 关系 SHARE，展示仍按原输入去重顺序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除\u003c/td>\n\u003ctd>不要求版本今日可用，只解绑当前项目；末个关联消失才删组合/items\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有读取\u003c/td>\n\u003ctd>停用/废弃仍保留配置、不换 latest；错误跨组织关联不泄露名称\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>无权/不存在统一 404，授权归档 409；缺失/跨组织/未发布/不可用绑定统一静态 module_rejected 422。领域拒绝前重验资格，SQL 失败仅以锁内副本分类、不读失效 ORM。取消/提交未知不当成功、不重试；最终持锁检查不承诺物理 commit 瞬间未过期。\u003c/p>\n\u003ch3 id=\"共享更新与删除的区别\">共享更新与删除的区别\u003c/h3>\n\u003cp>组合是组织共享对象：A 更新名称/说明/items 会影响全部关联项目（含归档 B），但不替 B 启用版本。跨项目提示/采用、版本比较、幂等回执/历史尚待定义；不私自复制为项目私有或用行锁宣称解决覆盖冲突。\u003c/p>\n\u003cp>整项目删除仅清自身关联，可留下无关联组合及版本引用；不级联清组织资产。旧 Run/Manifest/启用事实/审计不变。\u003c/p>\n\u003cp>未来组合先定义版本/快照：平台安全优先、Project scope 限制、各 Skill required 保留，冲突须选择而非直接执行。组合只能调整建议/表达，虚拟角色不是系统角色。\u003c/p>\n\u003ch2 id=\"版本回滚与评价\">版本、回滚与评价\u003c/h2>\n\u003ch3 id=\"版本内容与可见性\">版本内容与可见性\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>发布/废弃\u003c/td>\n\u003ctd>DRAFT → PUBLISHED → DEPRECATED；重复发布读原行，废弃不复活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目启用/停用\u003c/td>\n\u003ctd>精确 PUBLISHED；活动关系重启用读原行，停用保留记录、不改旧 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同版重新启用\u003c/td>\n\u003ctd>当前拒绝恢复已停用关系，不是普通开关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除废弃版\u003c/td>\n\u003ctd>独立引用检查，不作升级/回滚步骤\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>停用 v1 不能直接复活；选择仍合法精确版或解释发布新版本，后者不是恢复原身份。不删关系/改 DB 绕过，组合不复活废弃版，Run/Schedule 不跟随 latest。\u003c/p>\n\u003cp>删除保护全部状态的 RunSkillSnapshot、ChangeProposal、SkillCompositionItem、TaskSchedule、TaskScheduleOccurrence、FrontendModuleVersion；任一引用 409。仅无引用废弃版可连同 Manifest/启用关系删除，不删来源/解释/资源/审计解除拒绝，保留 RESTRICT/版本锁。\u003c/p>\n\u003cp>版本六操作须\u003ca href=\"#docs/design/skill-interpretation.md::%E7%89%88%E6%9C%AC%E7%AE%A1%E7%90%86%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">重验原 ADMIN\u003c/a>。新 Run、调度保存/恢复在事务固定精确版/启用关系；原 Run 确认、调度暂停/归档不要求版本重新可用。\u003c/p>\n\u003ch3 id=\"可审计的重新启用与回滚\">可审计的重新启用与回滚\u003c/h3>\n\u003cp>目标是 ADMIN 对 Project + 精确 PUBLISHED 显式恢复，追加 actor/时间/原因/所据状态；不清 disabled_at 抹历史或复活 DEPRECATED。\u003c/p>\n\u003cp>须成套定义载体、幂等身份/Schema：重复不重复记事实，并发启停版本冲突，重读后人工确认。只影响新发现，不改权限/Run/Schedule/组合、不自动恢复 ERROR Schedule；两次启停不等于原子切换。\u003c/p>\n\u003ch3 id=\"生命周期验收与质量评价\">生命周期验收与质量评价\u003c/h3>\n\u003cp>覆盖无蓝图/hard error/未接受 warning、未启用/缺资源、旧 Run/Manifest 不变；组合原授权/精确版/跨组织、共享更新/末次解绑及回滚；目标重新启用另验追加审计与竞争。\u003c/p>\n\u003cp>Interpreter 用独立通用样例评审规则保真、资源/Tool/效果映射、trace/调整量，覆盖分析、代码审查、缺资源、写意图、恶意指令。质量答案与执行输入隔离，Schema exact match 不代替模型/人工评审。\u003c/p>\n\u003cp>改动同步\u003ca href=\"#docs/design/skill-interpretation.md::\">解释实现\u003c/a>、\u003ca href=\"#docs/development/contract-workflow.md::\">契约 workflow\u003c/a>、\u003ca href=\"../SKM/backend/tests/skills\">skills 回归\u003c/a>；真实事务/模型质量分别举证，旧不可变版本只作审计，不恢复平台预定义业务规则。\u003c/p>\n", "sections": [{"title": "Skill 兼容、解释与发布", "level": "h1", "anchor": "skill-兼容解释与发布", "text": "# Skill 兼容、解释与发布\n\n本页是目录式 Skill 的语义与生命周期正本；代码见[解释实现](skill-interpretation.md)，缺口见[计划 R06](../planning/roadmap.md#r06-skill-生命周期)。"}, {"title": "设计目标", "level": "h2", "anchor": "设计目标", "text": "## 设计目标\n\n外部 Skill 无需改成平台专用目录/业务 Schema；Interpreter 理解目标、资源、规则和交付，动态派生业务字段，平台仅固定跨组件协议。\n\nTool/Shell/network/write 声明不是权限。必需规则/禁止事项不因缺工具而弱化，推荐步骤可在冻结权限内调整；来源/解释/调整保留 trace，发布版本不可原地修改。"}, {"title": "分层架构", "level": "h2", "anchor": "分层架构", "text": "## 分层架构\n\n```text\n可信 Adapter/Normalizer → 不执行来源的静态分析\n  → 版本化 Interpreter 系统 Skill + 模型\n  → 确定性 Validator → Preview / 追加调整\n  → ADMIN 发布 → Project 启用 → TaskProjector / RuntimeLoader\n```\n\n业务依赖 SkillInterpreter 抽象而非 SDK message。来源不能替换 Adapter；脚本只作来源/checksum 对象，执行须走注册 Provider。"}, {"title": "导入兼容层", "level": "h2", "anchor": "导入兼容层", "text": "## 导入兼容层\n\n[importer](../../SKM/backend/src/skillmind/skills/importer.py)支持本地目录 CLI、内联 JSON、多文件 multipart，读取说明、metadata、references、scripts 和文本资产。HTTP 的[限额/原 ADMIN 授权/跨存储失败](skill-interpretation.md#导入保存与上传授权)由用例负责；CLI 只本地解析，不伪造会话或直接持久保存。\n\n不执行来源脚本、装依赖、访问来源 URL、解析 Secret。ZIP/TAR 自动解包、远程 Git 尚不支持；新增须先定义路径/symlink/设备文件、体积/数量与固定 revision 防护。\n\nNormalizedSkillPackage 保留身份、adapter version、hash、文件索引、原文/未知 metadata、静态发现与 trace，不丢未理解内容或提升权限。"}, {"title": "Interpreter 的核心输出", "level": "h2", "anchor": "interpreter-的核心输出", "text": "## Interpreter 的核心输出"}, {"title": "CapabilityBlueprint", "level": "h3", "anchor": "capabilityblueprint", "text": "### CapabilityBlueprint\n\n主要产物是 [CapabilityBlueprint](../../SKM/contracts/capability-blueprint/v1.schema.json)，不是业务表单 Schema：\n\n| 内容 | 含义 |\n| --- | --- |\n| capability/intents/objectives | 能做什么、何时调用、目标 |\n| resource_requirements | 资源、必需性、访问/绑定条件 |\n| guidance/success_criteria | 必需/建议、质量与禁止事项 |\n| deliverables/interaction_points/effect_intents | 交付、澄清/审查/批准、可能效果 |\n| source_traces/assumptions/questions | 依据及不能伪造的未知 |\n\n新业务 capability 不必注册；真正 Tool 调用才使用 repository.read/v1 等注册版本 ID。"}, {"title": "ResourceRequirement", "level": "h3", "anchor": "resourcerequirement", "text": "### ResourceRequirement\n\nkind、required、access、versioned capabilities、selection_guidance 表达抽象条件；accepted_providers 只是兼容提示，不代替 capability/scope 校验。\n\n多资源独立声明，创建前选定绑定；交互只能补冻结 scope 内信息，不换 Integration/文档或扩权，变化须新 Run，见[资源快照](resource-snapshots.md)。"}, {"title": "Guidance 与约束", "level": "h3", "anchor": "guidance-与约束", "text": "### Guidance 与约束\n\nrequired_rules 必须保留，recommended_steps 可重排，quality_criteria 约束最终证据/完整性，prohibited_actions 与平台硬拒绝独立生效。原文和规范化 guidance 均冻结，Worker 接收 checksum/引用，不能只传丢规则的摘要。"}, {"title": "TaskBlueprint 与动态参数", "level": "h3", "anchor": "taskblueprint-与动态参数", "text": "### TaskBlueprint 与动态参数\n\nTaskBlueprint 投影目标、资源槽、参数、交付/效果。稳定输入/机器输出可由受限 TaskContractDraft 编译 Schema；开放分析可仅用 OutcomeEnvelope、Markdown/Artifact、Evidence/Proposal。缺业务 Schema、ViewSpec、fixture 不单独阻止解释/发布。"}, {"title": "平台 contracts 的边界", "level": "h2", "anchor": "平台-contracts-的边界", "text": "## 平台 contracts 的边界\n\ncontracts 固定 API/Problem/RunEvent、Manifest/Blueprint/Brief/Outcome、Interaction/Effect/Evidence 和 Tool 通用协议，不预置业务结果模型或保存 Skill Gold。实例/评价数据留各自资产/测试边界，结构正确不证明推理正确。"}, {"title": "解释请求与响应", "level": "h2", "anchor": "解释请求与响应", "text": "## 解释请求与响应"}, {"title": "冻结输入", "level": "h3", "anchor": "冻结输入", "text": "### 冻结输入\n\n冻结 Source/hash/索引/adapter、归一化/静态报告、资源/Tool catalog、目标协议、Interpreter Skill/version/prompt checksum、模型参数、父解释/调整指示，不含 Project credential。"}, {"title": "结构化响应", "level": "h3", "anchor": "结构化响应", "text": "### 结构化响应\n\n响应含 summary、compatibility、Blueprint、trace/diagnostics 及可选 confidence/assumptions/questions/TaskContractDraft。结构失败不将自由文本包装为已验证 Manifest；调整追加 Interpretation、lineage/diff。\n\n默认 SDK structured-output；显式 SKILLMIND_SKILL_INTERPRETER_ACCEPT_PROMPT_JSON=true 可接文本完整 JSON，仍不得补字段/绕 Schema、identity/hash/gate，且不能当 structured-output 验收。"}, {"title": "防提示注入", "level": "h3", "anchor": "防提示注入", "text": "### 防提示注入\n\n平台规则、发布 guidance、用户输入、Tool 外部数据分层信任。来源不得泄露 Secret、改系统指令或授未注册 Tool；记录 diagnostic 并受上层边界约束。发现明文 credential 在模型前阻断，不等模型脱敏。"}, {"title": "兼容级别与运行就绪度", "level": "h2", "anchor": "兼容级别与运行就绪度", "text": "## 兼容级别与运行就绪度"}, {"title": "发布与就绪的判断顺序", "level": "h3", "anchor": "发布与就绪的判断顺序", "text": "### 发布与就绪的判断顺序\n\n| 事实 | 仍需检查 |\n| --- | --- |\n| parse / Preview | 可审查，不代表合法蓝图或可发布 |\n| gate_passed | 无 hard error，warning 仍须 ADMIN 接受 |\n| PUBLISHED | Project 显式启用精确版 |\n| Project 已启用 | 资源、真实已安装 Provider/策略决定 readiness |\n| RUNNABLE/ACTIONABLE | 创建重验输入/资源，apply 重验精确批准 |"}, {"title": "兼容级别", "level": "h3", "anchor": "兼容级别", "text": "### 兼容级别\n\nnative/adapted/assisted 是小写兼容标签，不是发布状态。native/手工 fixture 不绕 Interpreter；Adapter 只归一化，assisted 仍满足门禁并需接受 warning。"}, {"title": "运行就绪度", "level": "h3", "anchor": "运行就绪度", "text": "### 运行就绪度\n\nGUIDANCE_ONLY：指导/人工清单；CONFIGURATION_REQUIRED：待参数/资源；RUNNABLE：只读/工作区能力就绪；ACTIONABLE：存在可 apply 的资源/Provider，不代表已批准或远端可达。\n\n版本属组织，Project 分别启用和计算 readiness；未启用不可发现，新发布不自动扩大执行面。"}, {"title": "校验与发布门禁", "level": "h2", "anchor": "校验与发布门禁", "text": "## 校验与发布门禁\n\n硬门禁检查来源/hash/解释 identity、蓝图结构、真实 trace、Tool 版本格式、credential/路径逃逸/宿主命令授权/远程可执行引用、observe/propose/apply 区分、Manifest checksum/lineage/发布者。\n\n来源验证覆盖全部 Manifest/Blueprint Task 的 key/capability，不只所选任务；Blueprint target 须能在原蓝图解析。Blueprint/动态契约 trace 的文件/行按原索引及可用文本核验，见[来源核验](task-flow.md#身份来源与失败)。field_path 保留现行 Schema/原文，不虚称已验证尚未定义的业务字段定位或模型理解。\n\n未知业务概念、缺可选 Schema/ViewSpec/fixture、项目缺资源、推荐步骤不完整、assisted 本身不作 hard error；必要配置须创建前补，warning 必须明确接受。\n\n蓝图仅由 Interpreter 生成；parse Draft 可 null，发布报 capability_blueprint_missing。Schema 容纳 Draft 不豁免发布，不从旧 workflow/data_sources 反推蓝图。"}, {"title": "RuntimeManifest v1alpha1", "level": "h2", "anchor": "runtimemanifest-v1alpha1", "text": "## RuntimeManifest v1alpha1\n\n[Schema](../../SKM/contracts/runtime-manifest/v1alpha1.schema.json)固定 manifest_version=skillmind/v1alpha1。Manifest 冻结蓝图/任务、Tool/资源、规则、建议、效果及可选 Schema，不增平行语义摘要。\n\nDRAFT 起内容/checksum 不变；发布状态、actor/时间、warning 接受属于版本/gate metadata。资源只声明于 capability_blueprint.resource_requirements，无顶层 data_sources，不含 Integration/Secret。"}, {"title": "Skill 组合", "level": "h2", "anchor": "skill-组合", "text": "## Skill 组合\n\nSkillComposition（Module）仅归组精确版本任务，ProjectComposition 控制展示；无跨 Skill 规则求解、自动编排或组合授权。"}, {"title": "组合保存的授权事务", "level": "h3", "anchor": "组合保存的授权事务", "text": "### 组合保存的授权事务\n\n三写仅当前本组织 ADMIN。必填原会话/CSRF，不另传创建者；复用[原凭据校验](authentication.md#认证与业务提交不是同一个事务)，锁 Organization → User SHARE → 原 AuthSession UPDATE → 当前 Project SHARE 并复核 ACTIVE；更新/删除再锁同组织组合和按 ID 排序的全部关联。锁、读取、flush 后取新时间复核，持锁至提交。\n\n| 操作 | 边界 |\n| --- | --- |\n| 创建/更新 | 共享 require_current_task_binding 验同组织 Skill/Source、精确 PUBLISHED、当前未停用启用关系；按 UUID 锁 Version SHARE → 关系 SHARE，展示仍按原输入去重顺序 |\n| 删除 | 不要求版本今日可用，只解绑当前项目；末个关联消失才删组合/items |\n| 已有读取 | 停用/废弃仍保留配置、不换 latest；错误跨组织关联不泄露名称 |\n\n无权/不存在统一 404，授权归档 409；缺失/跨组织/未发布/不可用绑定统一静态 module_rejected 422。领域拒绝前重验资格，SQL 失败仅以锁内副本分类、不读失效 ORM。取消/提交未知不当成功、不重试；最终持锁检查不承诺物理 commit 瞬间未过期。"}, {"title": "共享更新与删除的区别", "level": "h3", "anchor": "共享更新与删除的区别", "text": "### 共享更新与删除的区别\n\n组合是组织共享对象：A 更新名称/说明/items 会影响全部关联项目（含归档 B），但不替 B 启用版本。跨项目提示/采用、版本比较、幂等回执/历史尚待定义；不私自复制为项目私有或用行锁宣称解决覆盖冲突。\n\n整项目删除仅清自身关联，可留下无关联组合及版本引用；不级联清组织资产。旧 Run/Manifest/启用事实/审计不变。\n\n未来组合先定义版本/快照：平台安全优先、Project scope 限制、各 Skill required 保留，冲突须选择而非直接执行。组合只能调整建议/表达，虚拟角色不是系统角色。"}, {"title": "版本、回滚与评价", "level": "h2", "anchor": "版本回滚与评价", "text": "## 版本、回滚与评价"}, {"title": "版本内容与可见性", "level": "h3", "anchor": "版本内容与可见性", "text": "### 版本内容与可见性\n\n| 操作 | 边界 |\n| --- | --- |\n| 发布/废弃 | DRAFT → PUBLISHED → DEPRECATED；重复发布读原行，废弃不复活 |\n| 项目启用/停用 | 精确 PUBLISHED；活动关系重启用读原行，停用保留记录、不改旧 Run |\n| 同版重新启用 | 当前拒绝恢复已停用关系，不是普通开关 |\n| 删除废弃版 | 独立引用检查，不作升级/回滚步骤 |\n\n停用 v1 不能直接复活；选择仍合法精确版或解释发布新版本，后者不是恢复原身份。不删关系/改 DB 绕过，组合不复活废弃版，Run/Schedule 不跟随 latest。\n\n删除保护全部状态的 RunSkillSnapshot、ChangeProposal、SkillCompositionItem、TaskSchedule、TaskScheduleOccurrence、FrontendModuleVersion；任一引用 409。仅无引用废弃版可连同 Manifest/启用关系删除，不删来源/解释/资源/审计解除拒绝，保留 RESTRICT/版本锁。\n\n版本六操作须[重验原 ADMIN](skill-interpretation.md#版本管理的授权事务)。新 Run、调度保存/恢复在事务固定精确版/启用关系；原 Run 确认、调度暂停/归档不要求版本重新可用。"}, {"title": "可审计的重新启用与回滚", "level": "h3", "anchor": "可审计的重新启用与回滚", "text": "### 可审计的重新启用与回滚\n\n目标是 ADMIN 对 Project + 精确 PUBLISHED 显式恢复，追加 actor/时间/原因/所据状态；不清 disabled_at 抹历史或复活 DEPRECATED。\n\n须成套定义载体、幂等身份/Schema：重复不重复记事实，并发启停版本冲突，重读后人工确认。只影响新发现，不改权限/Run/Schedule/组合、不自动恢复 ERROR Schedule；两次启停不等于原子切换。"}, {"title": "生命周期验收与质量评价", "level": "h3", "anchor": "生命周期验收与质量评价", "text": "### 生命周期验收与质量评价\n\n覆盖无蓝图/hard error/未接受 warning、未启用/缺资源、旧 Run/Manifest 不变；组合原授权/精确版/跨组织、共享更新/末次解绑及回滚；目标重新启用另验追加审计与竞争。\n\nInterpreter 用独立通用样例评审规则保真、资源/Tool/效果映射、trace/调整量，覆盖分析、代码审查、缺资源、写意图、恶意指令。质量答案与执行输入隔离，Schema exact match 不代替模型/人工评审。\n\n改动同步[解释实现](skill-interpretation.md)、[契约 workflow](../development/contract-workflow.md)、[skills 回归](../../SKM/backend/tests/skills/)；真实事务/模型质量分别举证，旧不可变版本只作审计，不恢复平台预定义业务规则。"}], "toc": [{"title": "设计目标", "anchor": "设计目标", "level": "h2"}, {"title": "分层架构", "anchor": "分层架构", "level": "h2"}, {"title": "导入兼容层", "anchor": "导入兼容层", "level": "h2"}, {"title": "Interpreter 的核心输出", "anchor": "interpreter-的核心输出", "level": "h2"}, {"title": "CapabilityBlueprint", "anchor": "capabilityblueprint", "level": "h3"}, {"title": "ResourceRequirement", "anchor": "resourcerequirement", "level": "h3"}, {"title": "Guidance 与约束", "anchor": "guidance-与约束", "level": "h3"}, {"title": "TaskBlueprint 与动态参数", "anchor": "taskblueprint-与动态参数", "level": "h3"}, {"title": "平台 contracts 的边界", "anchor": "平台-contracts-的边界", "level": "h2"}, {"title": "解释请求与响应", "anchor": "解释请求与响应", "level": "h2"}, {"title": "冻结输入", "anchor": "冻结输入", "level": "h3"}, {"title": "结构化响应", "anchor": "结构化响应", "level": "h3"}, {"title": "防提示注入", "anchor": "防提示注入", "level": "h3"}, {"title": "兼容级别与运行就绪度", "anchor": "兼容级别与运行就绪度", "level": "h2"}, {"title": "发布与就绪的判断顺序", "anchor": "发布与就绪的判断顺序", "level": "h3"}, {"title": "兼容级别", "anchor": "兼容级别", "level": "h3"}, {"title": "运行就绪度", "anchor": "运行就绪度", "level": "h3"}, {"title": "校验与发布门禁", "anchor": "校验与发布门禁", "level": "h2"}, {"title": "RuntimeManifest v1alpha1", "anchor": "runtimemanifest-v1alpha1", "level": "h2"}, {"title": "Skill 组合", "anchor": "skill-组合", "level": "h2"}, {"title": "组合保存的授权事务", "anchor": "组合保存的授权事务", "level": "h3"}, {"title": "共享更新与删除的区别", "anchor": "共享更新与删除的区别", "level": "h3"}, {"title": "版本、回滚与评价", "anchor": "版本回滚与评价", "level": "h2"}, {"title": "版本内容与可见性", "anchor": "版本内容与可见性", "level": "h3"}, {"title": "可审计的重新启用与回滚", "anchor": "可审计的重新启用与回滚", "level": "h3"}, {"title": "生命周期验收与质量评价", "anchor": "生命周期验收与质量评价", "level": "h3"}], "source": "design/skill-contract.md", "checksum": "b160a00472e177ce150b96e52aee6b77e561df3801b03caed333cf6ef0bf1810"}, {"id": "docs/design/skill-interpretation.md", "title": "Skill 解释与发布实现", "group": "design", "html": "\u003ch1 id=\"skill-解释与发布实现\">Skill 解释与发布实现\u003c/h1>\n\u003cp>本页连接\u003ca href=\"#docs/design/skill-contract.md::\">语义契约\u003c/a>与实现，负责解释、确定性门禁和发布；运行见\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>，缺口见\u003ca href=\"#docs/planning/roadmap.md::r06-skill-%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9F\">计划 R06\u003c/a>。\u003c/p>\n\u003ch2 id=\"目标与主流程\">目标与主流程\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">文件 → Normalize/Static Analyze → immutable SkillSource\n  → 冻结 identity/catalog → 模型 Blueprint candidate\n  → 确定性验证 → Preview/追加调整 → SkillVersion DRAFT\n  → ADMIN 发布 → Project 启用精确版 → TaskCatalog/readiness\n\u003c/code>\u003c/pre>\n\u003cp>parse 不调用模型，初始 Draft 可无蓝图、不可直接发布。ZIP/TAR、远程 Git、TaskFlow/生成模块执行不属于这条已接链路。\u003c/p>\n\u003ch2 id=\"信任边界\">信任边界\u003c/h2>\n\u003cp>来源/附件/外部内容不覆盖平台规则，Tool/Shell 声明不授权，credential 静态发现后在模型前阻断。Interpreter 不读 Project Secret/Integration、不发布或建 Run；可重表达手段，不因缺工具弱化 required。\u003c/p>\n\u003ch2 id=\"代码责任\">代码责任\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>入口\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/skills/importer.py\">importer\u003c/a>\u003c/td>\n\u003ctd>归一化、文件/引用、静态 Draft\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/skills/interpreter.py\">interpreter\u003c/a> / \u003ca href=\"../SKM/backend/src/skillmind/skills/model_interpreter.py\">model_interpreter\u003c/a>\u003c/td>\n\u003ctd>静态发现、identity/报告、结构化模型适配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/skills/interpreter_execution.py\">interpreter_execution\u003c/a>\u003c/td>\n\u003ctd>冻结执行、复用/恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/skills/capability_blueprint.py\">capability_blueprint\u003c/a> / \u003ca href=\"../SKM/backend/src/skillmind/skills/task_contract.py\">task_contract\u003c/a>\u003c/td>\n\u003ctd>蓝图校验/投影、动态契约编译\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/skills/design_validation.py\">design_validation\u003c/a>\u003c/td>\n\u003ctd>预览/发布共用原 identity、全部 Task/来源校验，无 Project 或补写声明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/skills/manifest_gate.py\">manifest_gate\u003c/a>\u003c/td>\n\u003ctd>复用来源校验，验 Tool/权限、契约、可选资产/warning\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/skills/service.py\">service\u003c/a> / \u003ca href=\"../SKM/backend/src/skillmind/skills/repository.py\">repository\u003c/a>\u003c/td>\n\u003ctd>协调、版本/可见性、引用门禁、TaskCatalog\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>系统 \u003ca href=\"../SKM/skills/skillmind-skill-interpreter/SKILL.md\">Interpreter Skill\u003c/a>是执行资产；改正文/references 须同步 package hash、prompt identity、版本/example/回归，不当普通文档搬迁。\u003c/p>\n\u003ch3 id=\"导入保存与上传授权\">导入保存与上传授权\u003c/h3>\n\u003cp>内联/上传必填原 UserAccess，组织/导入者从事务锁定的当前 ADMIN 取得，不另传 UUID。解析无模型/DB 锁；首次 await 前冻结原会话和文件。保存采用 Organization → User SHARE → 原 AuthSession UPDATE，无 Project 门禁；查询、父行 flush、写前/最终 flush 后取新时间复核，Source/静态 Interpretation 原子保存。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接收\u003c/td>\n\u003ctd>Origin/CSRF/ADMIN 后才读 multipart；仅重复 files 文件字段，filename 保留相对路径，不截 basename\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>限额\u003c/td>\n\u003ctd>共用 HTTP parser：100 文件、单份 1,000,000 bytes、总 5,000,000；正文总 + 128 KiB，header 总 128 KiB、单 part 16 KiB，实际计数不信 Content-Length\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TX A\u003c/td>\n\u003ctd>原 ADMIN 下查本组织精确 source hash；已有来源复用静态预览，保留 URI/导入者/时间，不 PUT 或修旧 blob\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>锁外 PUT\u003c/td>\n\u003ctd>新来源先验全部 key；每份 PUT 前后短事务重验原资格，核对返回 key/size/MIME/hash，不跨 I/O 持锁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TX B\u003c/td>\n\u003ctd>所有 PUT 返回后重验原 ADMIN，再保存 Source/Interpretation；撤销/到期/降级不发布元数据\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>超限为 skill_upload_too_large 413，结构/不完整边界为 invalid_skill_upload 422，静态解析拒绝仍 400。不建 spool/写线程，取消/断连直接传播。原资格失效 401，CSRF/非 ADMIN 403，存储故障/回执不符静态 skill_storage_unavailable 503；Web 只认 201，不自动重发未知。\u003c/p>\n\u003cp>这不是跨存储原子提交：取消不停止线程/远端 PUT，最终拒绝可留字节，不补偿删除共享内容 key。hash 非原请求回执，并发首次仍可能重复 PUT。持久意图/确认、SkillSource 归属、旧 blob 核验/精确清理尚缺，不套用文档协议或重写原 hash。\u003c/p>\n\u003ch3 id=\"异步解释的交接要求\">异步解释的交接要求\u003c/h3>\n\u003cp>当前解释/调整只传组织/参数入队，无持久原请求授权；Worker 重建输入，终态唯一键不能阻止重复模型调用。须成套补齐：\u003c/p>\n\u003col>\n\u003cli>原请求 ID 与内容 execution key 分开；短事务绑定原 actor/会话引用、冻结输入/Interpreter/model 身份及 dispatch Outbox。队列只传持久 ID，不传 cookie/CSRF。\u003c/li>\n\u003cli>Worker 复用原会话资格校验，锁外模型调用前和结果提交时复核；每次初次/修复调用分别取得原 Worker 一次启动许可。未知启动不由重投/新会话接管。\u003c/li>\n\u003cli>原请求只读确认、撤权审计、旧队列拒绝、迁移/恢复一起实现，不补造旧作者/执行事实。\u003c/li>\n\u003cli>SSE 先按持久身份验组织归属，再订阅并复查终态/长连接资格。当前仅把组织写入 key、查不到终态仍转 Pub/Sub 不满足授权；超时/断连不证明持久 FAILED 或模型未运行，页面不能据此自动换身份生成。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"从候选到项目任务的接线\">从候选到项目任务的接线\u003c/h3>\n\u003cp>PREVIEW_READY → create_version_draft 冻结 Manifest/checksum/findings → publish_skill_version 重验设计/确认 warning → 显式启用 → 真实资源 readiness。\u003c/p>\n\u003cp>首次冻结只把 Manifest/Blueprint 相同候选 Interpretation UUID 绑定实际行，不规范化候选、补蓝图身份或改 source/hash/interpreter version。DRAFT 可保存错误供审查，parse 无蓝图仍不可发布。\u003c/p>\n\u003cp>首次发布锁精确版本，验组织及 Source/Interpretation/Manifest 关系，再用原索引、文本、冻结 Manifest 跑当前门禁。旧报告缺损/hard error 拒绝；保存时与当前 warning 都须本次明确接受。只改版本/gate metadata，不调用模型、修 Manifest/checksum。\u003c/p>\n\u003cp>PUBLISHED 重复发布仍验当前 ADMIN，但返回原记录，不追溯撤销/改 actor/时间。来源/解释变化须追加解释和 DRAFT；TaskCatalog 不证明外部可达。来源重建、模型恢复、发布复用是独立边界。\u003c/p>\n\u003cp>Manifest checksum 证明自身内容一致，Interpretation 既有 checksum 是执行复用键而非候选正文 hash。候选持久绑定尚须候选 checksum/冻结转换版，不用当前 normalizer 推断历史等值或回填。\u003c/p>\n\u003ch3 id=\"版本管理的授权事务\">版本管理的授权事务\u003c/h3>\n\u003cp>草稿、发布、废弃、删除、项目启停必填原会话/CSRF；组织、首次发布者/启用者从锁定 User 取得。组织资产不受 Project 成员/归档限制；项目启停须同组织精确 ACTIVE Project，ADMIN 无需 membership。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">入口认证结束 → Organization UPDATE → User SHARE\n  → 原 AuthSession UPDATE / 当前 ADMIN、凭据、期限\n  → 项目启停时 Project SHARE → 既有 SkillVersion UPDATE\n  → 启停关系 UPDATE / 业务门禁 → 写前复核\n  → 最终 flush / 复核 → commit\n\u003c/code>\u003c/pre>\n\u003cp>复用\u003ca href=\"#docs/design/user-lifecycle.md::%E4%BA%8B%E5%8A%A1%E4%B8%8E%E5%B9%B6%E5%8F%91\">账户锁序/凭据校验\u003c/a>；User SHARE 阻止角色/状态修改且兼容 FK KEY SHARE。父行 flush、来源/引用读取、版本/关系等锁后取新时间验 idle/absolute；领域 404/409 前也复核，失效优先共享 401，CSRF/非 ADMIN 403。Project 越权/不存在统一 404，授权归档 409，不泄漏原凭据/来源。\u003c/p>\n\u003cp>重复发布/废弃/启停保留原 actor/时间仍重验资格，删后再删 404，不补删除回执。同组织其他有效 ADMIN 可操作原版，新会话不恢复旧会话。最终持锁判定不承诺物理 commit 瞬间未过期；SQL 失败仅以锁内副本和新时间分类，不隐式读失效 ORM。取消/提交未知不转成功、不重试/补偿。\u003c/p>\n\u003cp>删除在版本锁内验\u003ca href=\"#docs/design/skill-contract.md::%E7%89%88%E6%9C%AC%E5%86%85%E5%AE%B9%E4%B8%8E%E5%8F%AF%E8%A7%81%E6%80%A7\">全部引用\u003c/a>，拒绝先于关系/Manifest 删除；真实锁、回滚及旧 writer 兼容另验。\u003c/p>\n\u003ch2 id=\"capabilityblueprint\">CapabilityBlueprint\u003c/h2>\n\u003cp>以 \u003ca href=\"../SKM/contracts/capability-blueprint/v1.schema.json\">Schema\u003c/a>为准；标题/说明保留源语言，enum 大小写按契约。identity/hash/trace/结构错误拒绝，新业务 capability 允许，真实 Tool 须注册；缺业务 Schema/ViewSpec/fixture 不单独硬拒绝，assisted_review_required 须接受。结构/trace 不证明自然语言完整性。\u003c/p>\n\u003ch3 id=\"蓝图是唯一来源\">蓝图是唯一来源\u003c/h3>\n\u003cp>Interpreter 唯一生成；parse null 发布报 capability_blueprint_missing。Draft Schema 不是许可，Worker 只读冻结蓝图，不从旧 workflows/data_sources 反推，手工 native fixture 不绕门禁。\u003c/p>\n\u003ch3 id=\"过程重表达\">过程重表达\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>来源表达\u003c/th>\n\u003cth>平台路径与限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>curl 业务读取、git/svn 读代码\u003c/td>\n\u003ctd>issue.read/v1、repository.read/v1，地址/凭据/revision 来自绑定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>list/grep/log\u003c/td>\n\u003ctd>物化、files.txt、workspace.search/read、有界 history.txt，无自由 shell\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>xlsx/xlsm/docx\u003c/td>\n\u003ctd>平台文本化后定位读取，不宣称支持 PDF/任意格式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报告/补丁\u003c/td>\n\u003ctd>显式 workspace.write/v2 写 output/ 并取得已提交 Artifact；v1/workspace 中间文件不是已发布附件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部修改\u003c/td>\n\u003ctd>change.propose/v1 → 批准/效果链，不给 Agent 直调 write\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无等价能力\u003c/td>\n\u003ctd>限制、人工处理或 GUIDANCE_ONLY，不虚构 Tool/弱化 required\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>确定性守卫只验显式能力/结构，不证明语义等价或参数正确；Gateway 验参数，Preview/质量评审验保真。\u003ca href=\"#docs/design/task-flow.md::\">Flow\u003c/a>新字段先冻结 Schema。\u003c/p>\n\u003ch2 id=\"resourcebinding-与-readiness\">ResourceBinding 与 readiness\u003c/h2>\n\u003cp>资源仅来自 capability_blueprint.resource_requirements，无顶层 data_sources；Tool 投影用相同 key，write 不进入 Agent allowed_capabilities。\u003c/p>\n\u003cp>空 allowlist 不授权；issue_ids/field_keys 可显式 [\u0026quot;*\u0026quot;]，子 scope 不枚举扩 wildcard；repository path 不用该 wildcard，LOW 预授权须精确 scope。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/skills/resource_binding.py\">resource_binding\u003c/a>先验精确项目启用，再按已安装 Provider 算任务及 requirement AVAILABLE/UNAVAILABLE/UNSUPPORTED。候选不是选定/实际连通，创建前冻结，运行 CHOICE 不换绑，见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源规则\u003c/a>。\u003c/p>\n\u003cp>业务资源必须绑定真实 Integration 或显式选择的 Project 文档；裸 Provider 名称不代表来源。缺少绑定或客户端时拒绝创建/执行，不回退到模拟数据。合成 Provider 与 Skill 仅保留在 Backend tests，不随镜像部署。\u003c/p>\n\u003cp>新 Run、调度保存/恢复 ACTIVE、\u003ca href=\"#docs/design/skill-contract.md::%E7%BB%84%E5%90%88%E4%BF%9D%E5%AD%98%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">组合保存\u003c/a>在事务共用 require_current_task_binding，锁 SkillVersion SHARE → ProjectSkillVersion SHARE，固定精确 PUBLISHED/未停用关系；兼容 occurrence FK 并协调启停/废弃。它不重解 Manifest/资源，也不用于\u003ca href=\"#docs/design/run-creation.md::%E7%9B%AE%E6%A0%87%E5%88%9B%E5%BB%BA%E6%B5%81%E7%A8%8B\">原 Run 确认\u003c/a>。\u003c/p>\n\u003cp>同版停用不可恢复、DEPRECATED 不复活；目标审计恢复见\u003ca href=\"#docs/design/skill-contract.md::%E5%8F%AF%E5%AE%A1%E8%AE%A1%E7%9A%84%E9%87%8D%E6%96%B0%E5%90%AF%E7%94%A8%E4%B8%8E%E5%9B%9E%E6%BB%9A\">生命周期\u003c/a>。\u003c/p>\n\u003ch2 id=\"brief-与运行交接\">Brief 与运行交接\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/contracts/agent-task-brief/v1.schema.json\">AgentTaskBrief\u003c/a>按 Segment 存 brief_json/checksum，完整携带 required/quality、目标、资源、权限、交付/限制。物化路径仅来自物化器，日志只记 identity/checksum/profile，不记 Brief 正文。\u003c/p>\n\u003cp>GUIDED/SUPERVISED/DELEGATED 默认 SUPERVISED，不能覆盖硬拒绝。新 Run 显式 Segment/Brief，旧 Run 只读隐式投影；续行/Attempt/Session、workspace/效果分别遵循 Runtime、\u003ca href=\"#docs/design/resource-snapshots.md::\">资源\u003c/a>、\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>，不另存规则副本。\u003c/p>\n\u003cp>结果用通用 Outcome、可选 structured_data；缺业务 Schema 不等于 structured_output_missing，结构不证明业务正确。\u003c/p>\n\u003ch2 id=\"验证与接续\">验证与接续\u003c/h2>\n\u003cul>\n\u003cli>Parser/导入：不执行来源，路径/限额/hash，未授权不收正文，原会话/等锁/flush、旧来源不重写、PUT 前后撤权/错误/取消/未知。\u003c/li>\n\u003cli>解释/发布：冻结身份、结构输出、追加调整、来源/warning 门禁、六操作授权/回滚/引用保护；模型恢复、候选绑定、目标重新启用分别验证。\u003c/li>\n\u003cli>泛化/安全：分析、审查、开放文档、缺资源、恶意指令走同链路，敏感阻断、scope/跨项目拒绝、不扩权。\u003c/li>\n\u003cli>模型质量：固定输入重复采样，独立人工评审保真/证据/调整量；prompt JSON 与 structured-output 分别举证。\u003c/li>\n\u003c/ul>\n\u003cp>入口：\u003ca href=\"../SKM/backend/tests/skills\">skills\u003c/a>、\u003ca href=\"../SKM/backend/tests/contracts\">contracts\u003c/a>。真实事务、存储残留/恢复、模型/部署分别验收。结构/系统 Skill 改动同步契约、版本/checksum、validator/projector、Web、example/回归与质量评审；不引入任意脚本、自动扩权/升级或生成后端服务。\u003c/p>\n", "sections": [{"title": "Skill 解释与发布实现", "level": "h1", "anchor": "skill-解释与发布实现", "text": "# Skill 解释与发布实现\n\n本页连接[语义契约](skill-contract.md)与实现，负责解释、确定性门禁和发布；运行见[Runtime](agent-runtime.md)，缺口见[计划 R06](../planning/roadmap.md#r06-skill-生命周期)。"}, {"title": "目标与主流程", "level": "h2", "anchor": "目标与主流程", "text": "## 目标与主流程\n\n```text\n文件 → Normalize/Static Analyze → immutable SkillSource\n  → 冻结 identity/catalog → 模型 Blueprint candidate\n  → 确定性验证 → Preview/追加调整 → SkillVersion DRAFT\n  → ADMIN 发布 → Project 启用精确版 → TaskCatalog/readiness\n```\n\nparse 不调用模型，初始 Draft 可无蓝图、不可直接发布。ZIP/TAR、远程 Git、TaskFlow/生成模块执行不属于这条已接链路。"}, {"title": "信任边界", "level": "h2", "anchor": "信任边界", "text": "## 信任边界\n\n来源/附件/外部内容不覆盖平台规则，Tool/Shell 声明不授权，credential 静态发现后在模型前阻断。Interpreter 不读 Project Secret/Integration、不发布或建 Run；可重表达手段，不因缺工具弱化 required。"}, {"title": "代码责任", "level": "h2", "anchor": "代码责任", "text": "## 代码责任\n\n| 入口 | 责任 |\n| --- | --- |\n| [importer](../../SKM/backend/src/skillmind/skills/importer.py) | 归一化、文件/引用、静态 Draft |\n| [interpreter](../../SKM/backend/src/skillmind/skills/interpreter.py) / [model_interpreter](../../SKM/backend/src/skillmind/skills/model_interpreter.py) | 静态发现、identity/报告、结构化模型适配 |\n| [interpreter_execution](../../SKM/backend/src/skillmind/skills/interpreter_execution.py) | 冻结执行、复用/恢复 |\n| [capability_blueprint](../../SKM/backend/src/skillmind/skills/capability_blueprint.py) / [task_contract](../../SKM/backend/src/skillmind/skills/task_contract.py) | 蓝图校验/投影、动态契约编译 |\n| [design_validation](../../SKM/backend/src/skillmind/skills/design_validation.py) | 预览/发布共用原 identity、全部 Task/来源校验，无 Project 或补写声明 |\n| [manifest_gate](../../SKM/backend/src/skillmind/skills/manifest_gate.py) | 复用来源校验，验 Tool/权限、契约、可选资产/warning |\n| [service](../../SKM/backend/src/skillmind/skills/service.py) / [repository](../../SKM/backend/src/skillmind/skills/repository.py) | 协调、版本/可见性、引用门禁、TaskCatalog |\n\n系统 [Interpreter Skill](../../SKM/skills/skillmind-skill-interpreter/SKILL.md)是执行资产；改正文/references 须同步 package hash、prompt identity、版本/example/回归，不当普通文档搬迁。"}, {"title": "导入保存与上传授权", "level": "h3", "anchor": "导入保存与上传授权", "text": "### 导入保存与上传授权\n\n内联/上传必填原 UserAccess，组织/导入者从事务锁定的当前 ADMIN 取得，不另传 UUID。解析无模型/DB 锁；首次 await 前冻结原会话和文件。保存采用 Organization → User SHARE → 原 AuthSession UPDATE，无 Project 门禁；查询、父行 flush、写前/最终 flush 后取新时间复核，Source/静态 Interpretation 原子保存。\n\n| 阶段 | 边界 |\n| --- | --- |\n| 接收 | Origin/CSRF/ADMIN 后才读 multipart；仅重复 files 文件字段，filename 保留相对路径，不截 basename |\n| 限额 | 共用 HTTP parser：100 文件、单份 1,000,000 bytes、总 5,000,000；正文总 + 128 KiB，header 总 128 KiB、单 part 16 KiB，实际计数不信 Content-Length |\n| TX A | 原 ADMIN 下查本组织精确 source hash；已有来源复用静态预览，保留 URI/导入者/时间，不 PUT 或修旧 blob |\n| 锁外 PUT | 新来源先验全部 key；每份 PUT 前后短事务重验原资格，核对返回 key/size/MIME/hash，不跨 I/O 持锁 |\n| TX B | 所有 PUT 返回后重验原 ADMIN，再保存 Source/Interpretation；撤销/到期/降级不发布元数据 |\n\n超限为 skill_upload_too_large 413，结构/不完整边界为 invalid_skill_upload 422，静态解析拒绝仍 400。不建 spool/写线程，取消/断连直接传播。原资格失效 401，CSRF/非 ADMIN 403，存储故障/回执不符静态 skill_storage_unavailable 503；Web 只认 201，不自动重发未知。\n\n这不是跨存储原子提交：取消不停止线程/远端 PUT，最终拒绝可留字节，不补偿删除共享内容 key。hash 非原请求回执，并发首次仍可能重复 PUT。持久意图/确认、SkillSource 归属、旧 blob 核验/精确清理尚缺，不套用文档协议或重写原 hash。"}, {"title": "异步解释的交接要求", "level": "h3", "anchor": "异步解释的交接要求", "text": "### 异步解释的交接要求\n\n当前解释/调整只传组织/参数入队，无持久原请求授权；Worker 重建输入，终态唯一键不能阻止重复模型调用。须成套补齐：\n\n1. 原请求 ID 与内容 execution key 分开；短事务绑定原 actor/会话引用、冻结输入/Interpreter/model 身份及 dispatch Outbox。队列只传持久 ID，不传 cookie/CSRF。\n2. Worker 复用原会话资格校验，锁外模型调用前和结果提交时复核；每次初次/修复调用分别取得原 Worker 一次启动许可。未知启动不由重投/新会话接管。\n3. 原请求只读确认、撤权审计、旧队列拒绝、迁移/恢复一起实现，不补造旧作者/执行事实。\n4. SSE 先按持久身份验组织归属，再订阅并复查终态/长连接资格。当前仅把组织写入 key、查不到终态仍转 Pub/Sub 不满足授权；超时/断连不证明持久 FAILED 或模型未运行，页面不能据此自动换身份生成。"}, {"title": "从候选到项目任务的接线", "level": "h3", "anchor": "从候选到项目任务的接线", "text": "### 从候选到项目任务的接线\n\nPREVIEW_READY → create_version_draft 冻结 Manifest/checksum/findings → publish_skill_version 重验设计/确认 warning → 显式启用 → 真实资源 readiness。\n\n首次冻结只把 Manifest/Blueprint 相同候选 Interpretation UUID 绑定实际行，不规范化候选、补蓝图身份或改 source/hash/interpreter version。DRAFT 可保存错误供审查，parse 无蓝图仍不可发布。\n\n首次发布锁精确版本，验组织及 Source/Interpretation/Manifest 关系，再用原索引、文本、冻结 Manifest 跑当前门禁。旧报告缺损/hard error 拒绝；保存时与当前 warning 都须本次明确接受。只改版本/gate metadata，不调用模型、修 Manifest/checksum。\n\nPUBLISHED 重复发布仍验当前 ADMIN，但返回原记录，不追溯撤销/改 actor/时间。来源/解释变化须追加解释和 DRAFT；TaskCatalog 不证明外部可达。来源重建、模型恢复、发布复用是独立边界。\n\nManifest checksum 证明自身内容一致，Interpretation 既有 checksum 是执行复用键而非候选正文 hash。候选持久绑定尚须候选 checksum/冻结转换版，不用当前 normalizer 推断历史等值或回填。"}, {"title": "版本管理的授权事务", "level": "h3", "anchor": "版本管理的授权事务", "text": "### 版本管理的授权事务\n\n草稿、发布、废弃、删除、项目启停必填原会话/CSRF；组织、首次发布者/启用者从锁定 User 取得。组织资产不受 Project 成员/归档限制；项目启停须同组织精确 ACTIVE Project，ADMIN 无需 membership。\n\n```text\n入口认证结束 → Organization UPDATE → User SHARE\n  → 原 AuthSession UPDATE / 当前 ADMIN、凭据、期限\n  → 项目启停时 Project SHARE → 既有 SkillVersion UPDATE\n  → 启停关系 UPDATE / 业务门禁 → 写前复核\n  → 最终 flush / 复核 → commit\n```\n\n复用[账户锁序/凭据校验](user-lifecycle.md#事务与并发)；User SHARE 阻止角色/状态修改且兼容 FK KEY SHARE。父行 flush、来源/引用读取、版本/关系等锁后取新时间验 idle/absolute；领域 404/409 前也复核，失效优先共享 401，CSRF/非 ADMIN 403。Project 越权/不存在统一 404，授权归档 409，不泄漏原凭据/来源。\n\n重复发布/废弃/启停保留原 actor/时间仍重验资格，删后再删 404，不补删除回执。同组织其他有效 ADMIN 可操作原版，新会话不恢复旧会话。最终持锁判定不承诺物理 commit 瞬间未过期；SQL 失败仅以锁内副本和新时间分类，不隐式读失效 ORM。取消/提交未知不转成功、不重试/补偿。\n\n删除在版本锁内验[全部引用](skill-contract.md#版本内容与可见性)，拒绝先于关系/Manifest 删除；真实锁、回滚及旧 writer 兼容另验。"}, {"title": "CapabilityBlueprint", "level": "h2", "anchor": "capabilityblueprint", "text": "## CapabilityBlueprint\n\n以 [Schema](../../SKM/contracts/capability-blueprint/v1.schema.json)为准；标题/说明保留源语言，enum 大小写按契约。identity/hash/trace/结构错误拒绝，新业务 capability 允许，真实 Tool 须注册；缺业务 Schema/ViewSpec/fixture 不单独硬拒绝，assisted_review_required 须接受。结构/trace 不证明自然语言完整性。"}, {"title": "蓝图是唯一来源", "level": "h3", "anchor": "蓝图是唯一来源", "text": "### 蓝图是唯一来源\n\nInterpreter 唯一生成；parse null 发布报 capability_blueprint_missing。Draft Schema 不是许可，Worker 只读冻结蓝图，不从旧 workflows/data_sources 反推，手工 native fixture 不绕门禁。"}, {"title": "过程重表达", "level": "h3", "anchor": "过程重表达", "text": "### 过程重表达\n\n| 来源表达 | 平台路径与限制 |\n| --- | --- |\n| curl 业务读取、git/svn 读代码 | issue.read/v1、repository.read/v1，地址/凭据/revision 来自绑定 |\n| list/grep/log | 物化、files.txt、workspace.search/read、有界 history.txt，无自由 shell |\n| xlsx/xlsm/docx | 平台文本化后定位读取，不宣称支持 PDF/任意格式 |\n| 报告/补丁 | 显式 workspace.write/v2 写 output/ 并取得已提交 Artifact；v1/workspace 中间文件不是已发布附件 |\n| 外部修改 | change.propose/v1 → 批准/效果链，不给 Agent 直调 write |\n| 无等价能力 | 限制、人工处理或 GUIDANCE_ONLY，不虚构 Tool/弱化 required |\n\n确定性守卫只验显式能力/结构，不证明语义等价或参数正确；Gateway 验参数，Preview/质量评审验保真。[Flow](task-flow.md)新字段先冻结 Schema。"}, {"title": "ResourceBinding 与 readiness", "level": "h2", "anchor": "resourcebinding-与-readiness", "text": "## ResourceBinding 与 readiness\n\n资源仅来自 capability_blueprint.resource_requirements，无顶层 data_sources；Tool 投影用相同 key，write 不进入 Agent allowed_capabilities。\n\n空 allowlist 不授权；issue_ids/field_keys 可显式 [\"*\"]，子 scope 不枚举扩 wildcard；repository path 不用该 wildcard，LOW 预授权须精确 scope。\n\n[resource_binding](../../SKM/backend/src/skillmind/skills/resource_binding.py)先验精确项目启用，再按已安装 Provider 算任务及 requirement AVAILABLE/UNAVAILABLE/UNSUPPORTED。候选不是选定/实际连通，创建前冻结，运行 CHOICE 不换绑，见[资源规则](resource-snapshots.md)。\n\n业务资源必须绑定真实 Integration 或显式选择的 Project 文档；裸 Provider 名称不代表来源。缺少绑定或客户端时拒绝创建/执行，不回退到模拟数据。合成 Provider 与 Skill 仅保留在 Backend tests，不随镜像部署。\n\n新 Run、调度保存/恢复 ACTIVE、[组合保存](skill-contract.md#组合保存的授权事务)在事务共用 require_current_task_binding，锁 SkillVersion SHARE → ProjectSkillVersion SHARE，固定精确 PUBLISHED/未停用关系；兼容 occurrence FK 并协调启停/废弃。它不重解 Manifest/资源，也不用于[原 Run 确认](run-creation.md#目标创建流程)。\n\n同版停用不可恢复、DEPRECATED 不复活；目标审计恢复见[生命周期](skill-contract.md#可审计的重新启用与回滚)。"}, {"title": "Brief 与运行交接", "level": "h2", "anchor": "brief-与运行交接", "text": "## Brief 与运行交接\n\n[AgentTaskBrief](../../SKM/contracts/agent-task-brief/v1.schema.json)按 Segment 存 brief_json/checksum，完整携带 required/quality、目标、资源、权限、交付/限制。物化路径仅来自物化器，日志只记 identity/checksum/profile，不记 Brief 正文。\n\nGUIDED/SUPERVISED/DELEGATED 默认 SUPERVISED，不能覆盖硬拒绝。新 Run 显式 Segment/Brief，旧 Run 只读隐式投影；续行/Attempt/Session、workspace/效果分别遵循 Runtime、[资源](resource-snapshots.md)、[受控写入](repository-effects.md)，不另存规则副本。\n\n结果用通用 Outcome、可选 structured_data；缺业务 Schema 不等于 structured_output_missing，结构不证明业务正确。"}, {"title": "验证与接续", "level": "h2", "anchor": "验证与接续", "text": "## 验证与接续\n\n- Parser/导入：不执行来源，路径/限额/hash，未授权不收正文，原会话/等锁/flush、旧来源不重写、PUT 前后撤权/错误/取消/未知。\n- 解释/发布：冻结身份、结构输出、追加调整、来源/warning 门禁、六操作授权/回滚/引用保护；模型恢复、候选绑定、目标重新启用分别验证。\n- 泛化/安全：分析、审查、开放文档、缺资源、恶意指令走同链路，敏感阻断、scope/跨项目拒绝、不扩权。\n- 模型质量：固定输入重复采样，独立人工评审保真/证据/调整量；prompt JSON 与 structured-output 分别举证。\n\n入口：[skills](../../SKM/backend/tests/skills/)、[contracts](../../SKM/backend/tests/contracts/)。真实事务、存储残留/恢复、模型/部署分别验收。结构/系统 Skill 改动同步契约、版本/checksum、validator/projector、Web、example/回归与质量评审；不引入任意脚本、自动扩权/升级或生成后端服务。"}], "toc": [{"title": "目标与主流程", "anchor": "目标与主流程", "level": "h2"}, {"title": "信任边界", "anchor": "信任边界", "level": "h2"}, {"title": "代码责任", "anchor": "代码责任", "level": "h2"}, {"title": "导入保存与上传授权", "anchor": "导入保存与上传授权", "level": "h3"}, {"title": "异步解释的交接要求", "anchor": "异步解释的交接要求", "level": "h3"}, {"title": "从候选到项目任务的接线", "anchor": "从候选到项目任务的接线", "level": "h3"}, {"title": "版本管理的授权事务", "anchor": "版本管理的授权事务", "level": "h3"}, {"title": "CapabilityBlueprint", "anchor": "capabilityblueprint", "level": "h2"}, {"title": "蓝图是唯一来源", "anchor": "蓝图是唯一来源", "level": "h3"}, {"title": "过程重表达", "anchor": "过程重表达", "level": "h3"}, {"title": "ResourceBinding 与 readiness", "anchor": "resourcebinding-与-readiness", "level": "h2"}, {"title": "Brief 与运行交接", "anchor": "brief-与运行交接", "level": "h2"}, {"title": "验证与接续", "anchor": "验证与接续", "level": "h2"}], "source": "design/skill-interpretation.md", "checksum": "ec6a66e1ae3944af958e1b09f1ce678b721998715a7ba85a6a2b0c675bb4c42a"}, {"id": "docs/design/run-creation.md", "title": "Run 创建、重发与幂等", "group": "design", "html": "\u003ch1 id=\"run-创建重发与幂等\">Run 创建、重发与幂等\u003c/h1>\n\u003cp>本页定义创建身份、首次快照与原请求确认；资源规则见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>，实现状态见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清三种再执行\">先分清三种“再执行”\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>意图\u003c/th>\n\u003cth>正确结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>创建响应丢失，确认原请求\u003c/td>\n\u003ctd>返回原 Run，不新增快照、Segment 或 dispatch\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Worker 故障恢复\u003c/td>\n\u003ctd>同 Segment 新增 Attempt，沿用冻结事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用户改变输入/范围/目标\u003c/td>\n\u003ctd>新键、新 Run，不改旧快照\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>答复/批准是已有 Run 的业务续行；Schedule 每个 occurrence 独立创建，同一 occurrence 的恢复不是新触发。\u003c/p>\n\u003ch2 id=\"请求身份与执行快照分开保存\">请求身份与执行快照分开保存\u003c/h2>\n\u003cp>请求身份是用户意图，执行快照是首次固定的事实；重放均不改写。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>身份 / 首次快照\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>actor、Project、精确 SkillVersion/task_key\u003c/td>\n\u003ctd>全部参与身份；快照另存 Manifest checksum\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>input、显式选项\u003c/td>\n\u003ctd>按版本化规则比较；保存验证后的输入/Schema，不任意排序数组、转型或补默认值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档单份/集合\u003c/td>\n\u003ctd>比较 ID；集合排序且拒绝重复；快照固定成员、路径、MIME、size/hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档全集\u003c/td>\n\u003ctd>比较“全集”规则，不重新展开；首次成员单独冻结\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integration/binding\u003c/td>\n\u003ctd>比较显式身份或默认选择规则；冻结实际 scope/配置版本/binding，不重读今天的默认值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>权限/额度与追踪\u003c/td>\n\u003ctd>上限由服务端冻结；trace、时间、生成 ID 不造成请求差异\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>文档必须显式选择，可选省略不授权全集；Integration 可解析默认 binding，但省略与显式指定仍是不同意图。新增限额选项须版本化纳入身份。\u003c/p>\n\u003cp>服务端用\u003ca href=\"../SKM/backend/src/skillmind/core/hashing.py\">共享 hashing\u003c/a>保存规范化意图、摘要及格式版本；客户端 fingerprint 不能代替认证或原内容比较。\u003c/p>\n\u003ch3 id=\"幂等键的作用域\">幂等键的作用域\u003c/h3>\n\u003cp>唯一约束为 (project_id, task_id, Idempotency-Key)，task_id 由精确 SkillVersion/task_key 导出，不按 actor 隔离。同作用域同键异 actor/input/选择冲突，跨作用域不承诺冲突；新意图生成新键。\u003c/p>\n\u003cp>\u003ccode>schedule:\u003c/code> 保留给持久 occurrence。普通入口仅可确认已有同身份/内容的 Run；不存在则 409 idempotency_conflict，不能绕过调度关联/重叠/计数新建。旧键/快照不改，发布时 API/Worker 配套切换，不混用旧 API。\u003c/p>\n\u003ch2 id=\"目标创建流程\">目标创建流程\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">入口认证 / CSRF / ProjectWriteActor / 请求校验\n  → 确认事务：复核原授权，规范化意图，查询幂等作用域\n  ├─ 已存在：验证原身份/意图 → 最终认证 → 返回原 Run\n  └─ 不存在：最终认证 → 锁外解析精确任务/输入\n       → 创建事务：再次复核原授权，先查同键胜者\n       → 无胜者才解析/冻结资源并创建，唯一冲突则读取胜者\n       → 最终认证 → commit 后交付结果\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>所有出口复核当前授权；重放另验原 actor，历史查看权不能代替。\u003c/li>\n\u003cli>先重放、后解析当前版本/资源；原 Run 不重新枚举、调用 Provider 或更新快照。新建另验输入/资源/策略，并在写入事务重新固定版本可用性。\u003c/li>\n\u003cli>一次提交 Run、Segment 1、全部快照、初始事件和 dispatch Outbox；失败整体回滚，模型/大文件物化在锁外。\u003c/li>\n\u003cli>唯一约束决定并发胜者，只接受其完整首次快照。解析失败也查询同键胜者，未见则返回原错误；不无限等待或换键。\u003c/li>\n\u003c/ul>\n\u003cp>确认不保证可执行：Provider 仍验冻结授权、Integration 状态和批准，版本停用后的确认不许可新建。\u003c/p>\n\u003ch3 id=\"创建与确认的授权事务\">创建与确认的授权事务\u003c/h3>\n\u003cp>普通请求以内部 UserAccess 保留原 cookie/CSRF、服务器 request UUID；不改 HTTP/持久身份格式，不只凭入口 actor 或换用该用户的新会话。actor 须匹配原会话，首次权限取锁内当前角色/成员，不接受调用者角色或 M0 默认授权。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Organization UPDATE → 当前 User SHARE → 原 AuthSession UPDATE\n  → Project SHARE → USER 的 ProjectMember SHARE\n  → 原请求查询 / 首次快照写入 → flush → 最终认证 → commit\n\u003c/code>\u003c/pre>\n\u003cp>复用\u003ca href=\"#docs/design/authentication.md::%E8%AE%A4%E8%AF%81%E4%B8%8E%E4%B8%9A%E5%8A%A1%E6%8F%90%E4%BA%A4%E4%B8%8D%E6%98%AF%E5%90%8C%E4%B8%80%E4%B8%AA%E4%BA%8B%E5%8A%A1\">共同凭据校验\u003c/a>，身份锁、Project/成员锁及最终 flush 后取新时间。ADMIN 免 membership，不免组织/会话/归档检查。会话失效 401、CSRF 403、无权/不存在 404，已授权归档项目 409；不更新 User 或延长会话。\u003c/p>\n\u003cp>重放、解析失败/唯一冲突后的胜者、新建及独立查询命中/未命中均走同一授权出口；选择/来源/幂等拒绝也复核，不提交部分写入。查询未命中不授权下一事务，Skill 解析失败仍用原凭据查询胜者。\u003c/p>\n\u003cp>首次保存 Skill snapshot 前，\u003ca href=\"#docs/design/skill-interpretation.md::resourcebinding-%E4%B8%8E-readiness\">共享可用性检查\u003c/a>依序持有精确 SkillVersion SHARE、ProjectSkillVersion SHARE 至事务结束，核对组织/Project、PUBLISHED、未停用。SHARE 兼容 occurrence 外键锁；停用/废弃先提交则整笔拒绝，同键原 Run 不重验可用性。\u003c/p>\n\u003cp>flush 后失效整体回滚，不改历史胜者。DB 异常、取消、commit 未知不自动重发；最终认证不保证物理 commit 瞬间未过期。创建响应使用 no-store。\u003c/p>\n\u003cp>调度使用\u003ca href=\"#docs/design/task-scheduling.md::%E6%8C%81%E4%B9%85%E8%AE%A4%E9%A2%86%E4%B8%8E%E7%BB%93%E7%AE%97\">持久 occurrence participant\u003c/a>，验证当前创建者/原 claim 并同事务结算，不依赖浏览器会话；UserAccess 不授予调度新建资格。此锁协议不代替文档引用保护或 Integration 配置竞争控制。\u003c/p>\n\u003ch2 id=\"响应界面与历史兼容\">响应、界面与历史兼容\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>响应\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>201 + Location\u003c/td>\n\u003ctd>首次创建成功，不代表执行成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200 + Idempotent-Replay: true\u003c/td>\n\u003ctd>原 Run 的当前状态，不新增事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 idempotency_conflict\u003c/td>\n\u003ctd>同作用域的意图不同或旧身份无法证明；核对后显式新建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>断网/超时/无法校验响应\u003c/td>\n\u003ctd>提交未知，不能自动换键\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"提交结果未知时的界面责任\">提交结果未知时的界面责任\u003c/h3>\n\u003cp>页面分开 TaskDraft 与已发送请求；提交固定 actor/Project/精确任务/input/sources/key，确认只发送原内容，不复制服务端 hash。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>状态\u003c/th>\n\u003cth>界面行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>sending\u003c/td>\n\u003ctd>同步防重；关闭弹窗后重新打开仍能查看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>unknown\u003c/td>\n\u003ctd>网络错误、30 秒等待超时、408/429/服务错误或无效响应；原键确认或新标签页核对历史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rejected\u003c/td>\n\u003ctd>其余非 409 的 4xx；只说明本次拒绝，不清除先前“可能已创建”事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>conflict\u003c/td>\n\u003ctd>不自动重试、刷新原内容或换键；明确核对后新建\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>确认不依赖草稿是否合法；另建前提示原 Run 可能存在，由用户明确提交新意图。30 秒只结束 HTTP 等待，不取消 Run。\u003c/p>\n\u003cp>重发用当前 CSRF 和原 actor/Project；每次 await 后验身份，合法回执才切换 detail/SSE。切换账号/Project、离页使旧响应失效。原请求只存内存：关弹窗保留，刷新/离页不保证恢复，正文/token 不进 URL/Web storage；后续拒绝不能抹去先前未知。\u003c/p>\n\u003ch3 id=\"历史身份的证明范围\">历史身份的证明范围\u003c/h3>\n\u003cp>旧 request_hash 早于 binding 字段，不能直接重算 selected_sources。\u003ca href=\"../SKM/backend/src/skillmind/runs/creation_replay.py\">兼容器\u003c/a>仅移除可证明为初次补入的 binding_id/binding_checksum/binding_capability，用完整旧 hash 验证后，从保存的 candidate/default 恢复意图。\u003c/p>\n\u003cp>不读当前资源、不改旧行；缺原选择、未知版本或 hash 不符返回 409。历史可读、创建可确认、非终态可按新输入协议续行分别判断。\u003c/p>\n\u003ch2 id=\"当前代码与实施入口\">当前代码与实施入口\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>责任\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>意图/持久格式\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/runs/creation_request.py\">creation_request\u003c/a>；task_snapshot_json.creation_request 保存 v1，无独立公开字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重放/创建/胜者\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/runs/service.py\">service\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/runs/repository.py\">repository\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web 原请求\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/web/src/lib/runSubmission.ts\">runSubmission\u003c/a>、\u003ca href=\"../SKM/web/src/hooks/useRunSubmission.ts\">useRunSubmission\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schedule\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/schedules/service.py\">ScheduleService\u003c/a>提供 occurrence participant，不另建 Run/hash\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>内部身份版本不等于 HTTP 版本；同步要求见\u003ca href=\"#docs/development/contract-workflow.md::\">契约 workflow\u003c/a>。\u003c/p>\n\u003ch2 id=\"验收清单\">验收清单\u003c/h2>\n\u003cp>覆盖全集变化不改重放、集合换序/改 ID、并发唯一完整胜者、解析失败确认、跨 actor/权限拒绝、停用区分新建/确认、旧 hash 拒绝。各出口检验撤销、锁/flush 过期、移除成员、归档与整笔回滚；commit 未知不换键。\u003c/p>\n\u003cp>Web 验同 tick 防重、丢响应、草稿/身份切换及原键确认；调度另验\u003ca href=\"#docs/design/task-scheduling.md::%E5%AE%9E%E7%8E%B0%E4%B8%8E%E9%AA%8C%E6%94%B6\">关联/计数\u003c/a>。入口：\u003ca href=\"../SKM/backend/tests/runs\">Backend\u003c/a>、\u003ca href=\"../SKM/web/tests/browser/check_run_submission.py\">浏览器\u003c/a>；真实事务与浏览器时序分别举证。\u003c/p>\n", "sections": [{"title": "Run 创建、重发与幂等", "level": "h1", "anchor": "run-创建重发与幂等", "text": "# Run 创建、重发与幂等\n\n本页定义创建身份、首次快照与原请求确认；资源规则见[资源快照](resource-snapshots.md)，实现状态见[计划](../planning/roadmap.md)。"}, {"title": "先分清三种“再执行”", "level": "h2", "anchor": "先分清三种再执行", "text": "## 先分清三种“再执行”\n\n| 意图 | 正确结果 |\n| --- | --- |\n| 创建响应丢失，确认原请求 | 返回原 Run，不新增快照、Segment 或 dispatch |\n| Worker 故障恢复 | 同 Segment 新增 Attempt，沿用冻结事实 |\n| 用户改变输入/范围/目标 | 新键、新 Run，不改旧快照 |\n\n答复/批准是已有 Run 的业务续行；Schedule 每个 occurrence 独立创建，同一 occurrence 的恢复不是新触发。"}, {"title": "请求身份与执行快照分开保存", "level": "h2", "anchor": "请求身份与执行快照分开保存", "text": "## 请求身份与执行快照分开保存\n\n请求身份是用户意图，执行快照是首次固定的事实；重放均不改写。\n\n| 内容 | 身份 / 首次快照 |\n| --- | --- |\n| actor、Project、精确 SkillVersion/task_key | 全部参与身份；快照另存 Manifest checksum |\n| input、显式选项 | 按版本化规则比较；保存验证后的输入/Schema，不任意排序数组、转型或补默认值 |\n| 文档单份/集合 | 比较 ID；集合排序且拒绝重复；快照固定成员、路径、MIME、size/hash |\n| 文档全集 | 比较“全集”规则，不重新展开；首次成员单独冻结 |\n| Integration/binding | 比较显式身份或默认选择规则；冻结实际 scope/配置版本/binding，不重读今天的默认值 |\n| 权限/额度与追踪 | 上限由服务端冻结；trace、时间、生成 ID 不造成请求差异 |\n\n文档必须显式选择，可选省略不授权全集；Integration 可解析默认 binding，但省略与显式指定仍是不同意图。新增限额选项须版本化纳入身份。\n\n服务端用[共享 hashing](../../SKM/backend/src/skillmind/core/hashing.py)保存规范化意图、摘要及格式版本；客户端 fingerprint 不能代替认证或原内容比较。"}, {"title": "幂等键的作用域", "level": "h3", "anchor": "幂等键的作用域", "text": "### 幂等键的作用域\n\n唯一约束为 (project_id, task_id, Idempotency-Key)，task_id 由精确 SkillVersion/task_key 导出，不按 actor 隔离。同作用域同键异 actor/input/选择冲突，跨作用域不承诺冲突；新意图生成新键。\n\n`schedule:` 保留给持久 occurrence。普通入口仅可确认已有同身份/内容的 Run；不存在则 409 idempotency_conflict，不能绕过调度关联/重叠/计数新建。旧键/快照不改，发布时 API/Worker 配套切换，不混用旧 API。"}, {"title": "目标创建流程", "level": "h2", "anchor": "目标创建流程", "text": "## 目标创建流程\n\n```text\n入口认证 / CSRF / ProjectWriteActor / 请求校验\n  → 确认事务：复核原授权，规范化意图，查询幂等作用域\n  ├─ 已存在：验证原身份/意图 → 最终认证 → 返回原 Run\n  └─ 不存在：最终认证 → 锁外解析精确任务/输入\n       → 创建事务：再次复核原授权，先查同键胜者\n       → 无胜者才解析/冻结资源并创建，唯一冲突则读取胜者\n       → 最终认证 → commit 后交付结果\n```\n\n- 所有出口复核当前授权；重放另验原 actor，历史查看权不能代替。\n- 先重放、后解析当前版本/资源；原 Run 不重新枚举、调用 Provider 或更新快照。新建另验输入/资源/策略，并在写入事务重新固定版本可用性。\n- 一次提交 Run、Segment 1、全部快照、初始事件和 dispatch Outbox；失败整体回滚，模型/大文件物化在锁外。\n- 唯一约束决定并发胜者，只接受其完整首次快照。解析失败也查询同键胜者，未见则返回原错误；不无限等待或换键。\n\n确认不保证可执行：Provider 仍验冻结授权、Integration 状态和批准，版本停用后的确认不许可新建。"}, {"title": "创建与确认的授权事务", "level": "h3", "anchor": "创建与确认的授权事务", "text": "### 创建与确认的授权事务\n\n普通请求以内部 UserAccess 保留原 cookie/CSRF、服务器 request UUID；不改 HTTP/持久身份格式，不只凭入口 actor 或换用该用户的新会话。actor 须匹配原会话，首次权限取锁内当前角色/成员，不接受调用者角色或 M0 默认授权。\n\n```text\nOrganization UPDATE → 当前 User SHARE → 原 AuthSession UPDATE\n  → Project SHARE → USER 的 ProjectMember SHARE\n  → 原请求查询 / 首次快照写入 → flush → 最终认证 → commit\n```\n\n复用[共同凭据校验](authentication.md#认证与业务提交不是同一个事务)，身份锁、Project/成员锁及最终 flush 后取新时间。ADMIN 免 membership，不免组织/会话/归档检查。会话失效 401、CSRF 403、无权/不存在 404，已授权归档项目 409；不更新 User 或延长会话。\n\n重放、解析失败/唯一冲突后的胜者、新建及独立查询命中/未命中均走同一授权出口；选择/来源/幂等拒绝也复核，不提交部分写入。查询未命中不授权下一事务，Skill 解析失败仍用原凭据查询胜者。\n\n首次保存 Skill snapshot 前，[共享可用性检查](skill-interpretation.md#resourcebinding-与-readiness)依序持有精确 SkillVersion SHARE、ProjectSkillVersion SHARE 至事务结束，核对组织/Project、PUBLISHED、未停用。SHARE 兼容 occurrence 外键锁；停用/废弃先提交则整笔拒绝，同键原 Run 不重验可用性。\n\nflush 后失效整体回滚，不改历史胜者。DB 异常、取消、commit 未知不自动重发；最终认证不保证物理 commit 瞬间未过期。创建响应使用 no-store。\n\n调度使用[持久 occurrence participant](task-scheduling.md#持久认领与结算)，验证当前创建者/原 claim 并同事务结算，不依赖浏览器会话；UserAccess 不授予调度新建资格。此锁协议不代替文档引用保护或 Integration 配置竞争控制。"}, {"title": "响应、界面与历史兼容", "level": "h2", "anchor": "响应界面与历史兼容", "text": "## 响应、界面与历史兼容\n\n| 响应 | 含义 |\n| --- | --- |\n| 201 + Location | 首次创建成功，不代表执行成功 |\n| 200 + Idempotent-Replay: true | 原 Run 的当前状态，不新增事件 |\n| 409 idempotency_conflict | 同作用域的意图不同或旧身份无法证明；核对后显式新建 |\n| 断网/超时/无法校验响应 | 提交未知，不能自动换键 |"}, {"title": "提交结果未知时的界面责任", "level": "h3", "anchor": "提交结果未知时的界面责任", "text": "### 提交结果未知时的界面责任\n\n页面分开 TaskDraft 与已发送请求；提交固定 actor/Project/精确任务/input/sources/key，确认只发送原内容，不复制服务端 hash。\n\n| 状态 | 界面行为 |\n| --- | --- |\n| sending | 同步防重；关闭弹窗后重新打开仍能查看 |\n| unknown | 网络错误、30 秒等待超时、408/429/服务错误或无效响应；原键确认或新标签页核对历史 |\n| rejected | 其余非 409 的 4xx；只说明本次拒绝，不清除先前“可能已创建”事实 |\n| conflict | 不自动重试、刷新原内容或换键；明确核对后新建 |\n\n确认不依赖草稿是否合法；另建前提示原 Run 可能存在，由用户明确提交新意图。30 秒只结束 HTTP 等待，不取消 Run。\n\n重发用当前 CSRF 和原 actor/Project；每次 await 后验身份，合法回执才切换 detail/SSE。切换账号/Project、离页使旧响应失效。原请求只存内存：关弹窗保留，刷新/离页不保证恢复，正文/token 不进 URL/Web storage；后续拒绝不能抹去先前未知。"}, {"title": "历史身份的证明范围", "level": "h3", "anchor": "历史身份的证明范围", "text": "### 历史身份的证明范围\n\n旧 request_hash 早于 binding 字段，不能直接重算 selected_sources。[兼容器](../../SKM/backend/src/skillmind/runs/creation_replay.py)仅移除可证明为初次补入的 binding_id/binding_checksum/binding_capability，用完整旧 hash 验证后，从保存的 candidate/default 恢复意图。\n\n不读当前资源、不改旧行；缺原选择、未知版本或 hash 不符返回 409。历史可读、创建可确认、非终态可按新输入协议续行分别判断。"}, {"title": "当前代码与实施入口", "level": "h2", "anchor": "当前代码与实施入口", "text": "## 当前代码与实施入口\n\n| 责任 | 入口 |\n| --- | --- |\n| 意图/持久格式 | [creation_request](../../SKM/backend/src/skillmind/runs/creation_request.py)；task_snapshot_json.creation_request 保存 v1，无独立公开字段 |\n| 重放/创建/胜者 | [service](../../SKM/backend/src/skillmind/runs/service.py)、[repository](../../SKM/backend/src/skillmind/runs/repository.py) |\n| Web 原请求 | [runSubmission](../../SKM/web/src/lib/runSubmission.ts)、[useRunSubmission](../../SKM/web/src/hooks/useRunSubmission.ts) |\n| Schedule | [ScheduleService](../../SKM/backend/src/skillmind/schedules/service.py)提供 occurrence participant，不另建 Run/hash |\n\n内部身份版本不等于 HTTP 版本；同步要求见[契约 workflow](../development/contract-workflow.md)。"}, {"title": "验收清单", "level": "h2", "anchor": "验收清单", "text": "## 验收清单\n\n覆盖全集变化不改重放、集合换序/改 ID、并发唯一完整胜者、解析失败确认、跨 actor/权限拒绝、停用区分新建/确认、旧 hash 拒绝。各出口检验撤销、锁/flush 过期、移除成员、归档与整笔回滚；commit 未知不换键。\n\nWeb 验同 tick 防重、丢响应、草稿/身份切换及原键确认；调度另验[关联/计数](task-scheduling.md#实现与验收)。入口：[Backend](../../SKM/backend/tests/runs/)、[浏览器](../../SKM/web/tests/browser/check_run_submission.py)；真实事务与浏览器时序分别举证。"}], "toc": [{"title": "先分清三种“再执行”", "anchor": "先分清三种再执行", "level": "h2"}, {"title": "请求身份与执行快照分开保存", "anchor": "请求身份与执行快照分开保存", "level": "h2"}, {"title": "幂等键的作用域", "anchor": "幂等键的作用域", "level": "h3"}, {"title": "目标创建流程", "anchor": "目标创建流程", "level": "h2"}, {"title": "创建与确认的授权事务", "anchor": "创建与确认的授权事务", "level": "h3"}, {"title": "响应、界面与历史兼容", "anchor": "响应界面与历史兼容", "level": "h2"}, {"title": "提交结果未知时的界面责任", "anchor": "提交结果未知时的界面责任", "level": "h3"}, {"title": "历史身份的证明范围", "anchor": "历史身份的证明范围", "level": "h3"}, {"title": "当前代码与实施入口", "anchor": "当前代码与实施入口", "level": "h2"}, {"title": "验收清单", "anchor": "验收清单", "level": "h2"}], "source": "design/run-creation.md", "checksum": "e37d2719d3adce66e16ce9e19aa3d0852ae8616ad1fcef045cf0de315ad2ec62"}, {"id": "docs/design/resource-snapshots.md", "title": "资源快照与 Run 工作区", "group": "design", "html": "\u003ch1 id=\"资源快照与-run-工作区\">资源快照与 Run 工作区\u003c/h1>\n\u003cp>本页定义 Run 的读取范围、内容冻结和输入副本。上传/下载/删除属于\u003ca href=\"#docs/design/document-lifecycle.md::\">文档生命周期\u003c/a>，请求重放属于\u003ca href=\"#docs/design/run-creation.md::\">创建协议\u003c/a>，实施状态见\u003ca href=\"#docs/planning/roadmap.md::r01-%E8%B5%84%E6%BA%90%E5%86%BB%E7%BB%93\">计划 R01\u003c/a>。\u003c/p>\n\u003ch2 id=\"先区分三种冻结\">先区分三种“冻结”\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>固定事实与边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>授权快照\u003c/td>\n\u003ctd>Project、资源、capability、scope、Integration 版本；分支名不等于 commit，读取权不保证可达\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容快照\u003c/td>\n\u003ctd>文档 ID/hash/成员，或仓库读取时解析出的 revision；checksum 不是授权，也不是备份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>物化副本\u003c/td>\n\u003ctd>实际文件、转换、索引与 skipped；首次准备不等于创建瞬间已取得内容\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>分别记录三个时点：document 用创建清单，repository 首次打开解析版本；issue 按 binding live 读取形成 Evidence，不物化文件树。\u003c/p>\n\u003ch2 id=\"文档选择与冻结设计\">文档选择与冻结设计\u003c/h2>\n\u003ch3 id=\"用户选择的是范围不是-provider-名称\">用户选择的是范围，不是 Provider 名称\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选择\u003c/th>\n\u003cth>冻结与限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>单份/集合\u003c/td>\n\u003ctd>同 Project 的原 ID/hash；集合去重校验后排序，不替换同路径重传的新 ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>显式全集\u003c/td>\n\u003ctd>固定创建事务当时的成员，后续上传不加入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可选不选\u003c/td>\n\u003ctd>不授予该槽位读取权，不回退全集\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>必需未选\u003c/td>\n\u003ctd>创建失败，不在后续对话中补授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>多槽位共用 Run 级去重并集与 input/documents/，不做槽位隔离；manifest 保留 requirement 关系，重复 ID 元数据必须一致。\u003c/p>\n\u003ch3 id=\"公开选择与读取投影的实施契约\">公开选择与读取投影的实施契约\u003c/h3>\n\u003cp>sources 由客户端编码、服务端校验，界面显示名称与范围。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>编码与数量\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>单份\u003c/td>\n\u003ctd>document:\u0026lt;UUID\u0026gt;，恰好一个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>集合\u003c/td>\n\u003ctd>documents:\u0026lt;UUID\u0026gt;,\u0026lt;UUID\u0026gt;…，同槽位 2–5000 个不同候选\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全集\u003c/td>\n\u003ctd>project-documents:all，创建时 1–5000 个成员；空/超量拒绝，不截断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不使用\u003c/td>\n\u003ctd>省略可选槽位；空串不是合法选择\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>即时执行/Schedule 共用组件，不自动选首份。候选变化保留草稿并要求修正，不改全集、替换 ID 或接受单成员集合；原请求确认不受草稿影响。\u003c/p>\n\u003cp>selected_sources_json 保存 Project/requirement、模式、成员 ID/路径/MIME/size/hash 与服务端 checksum。Worker 按原 ID 验字节，后续 Segment/Attempt 不重新枚举；客户端 checksum 不提供信任。\u003c/p>\n\u003ch3 id=\"用一个例子理解冻结边界\">用一个例子理解冻结边界\u003c/h3>\n\u003cp>Run 1 全集冻结 A、B 后新增 C：排队、重试、原请求确认仍只有 A、B，新 Run/occurrence 才可包含 C。同路径重传 A′不能替代 A，原内容缺失则失败。\u003c/p>\n\u003ch3 id=\"读取清单和资源摘要\">读取清单和资源摘要\u003c/h3>\n\u003cp>Run detail 的 document_snapshots 按 requirement_key 提供服务端验证后的清单：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>status\u003c/th>\n\u003cth>snapshot 与含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>FROZEN\u003c/td>\n\u003ctd>合法 v1 清单；不是当前目录、blob 可达性或准备完成证明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LEGACY_UNAVAILABLE\u003c/td>\n\u003ctd>null；旧记录没有可信清单，不猜测历史范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>INVALID\u003c/td>\n\u003ctd>null；校验失败，不公开未验证成员，其他合法历史仍可读\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>空数组表示未识别文档来源；缺必需 document_snapshots 是 API 契约错误，旧 Run 则用历史状态表达。\u003c/p>\n\u003cp>detail/history 的 selected_sources 仅公开 provider/capability/resource_kind/access，兼容已知旧字符串，不暴露内部 JSON、scope 或 Secret locator。大清单只在 detail，不作授权输入。\u003ca href=\"../SKM/backend/src/skillmind/runs/resource_projection.py\">服务端投影\u003c/a>重算 checksum，\u003ca href=\"../SKM/web/src/api/runResources.ts\">Web\u003c/a>只验形状和 Project/slot/关联，不复制身份算法。\u003c/p>\n\u003ch3 id=\"失败缓存与历史\">失败、缓存与历史\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>原 ID/blob 缺失，元数据或实际 hash 不符\u003c/td>\n\u003ctd>准备失败；不按路径替换、不伪装普通 skipped\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容合法但不支持/单文件过大\u003c/td>\n\u003ctd>manifest 记录 skipped，结果说明未覆盖范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完整副本合法\u003c/td>\n\u003ctd>校验来源、Run/Project、完整文件树后复用，不重新读取全集\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>副本缺失、改写或混入文件\u003c/td>\n\u003ctd>保留现场并失败，不删除重建或降级 live\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>live Tool 无法取原 ID\u003c/td>\n\u003ctd>返回不可用；已存副本与 live 可达性分别判断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧 Run 无清单/回执\u003c/td>\n\u003ctd>终态只读且标未知；非终态不自动授权全集，需新输入则新建 Run\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>删除须经\u003ca href=\"#docs/design/document-lifecycle.md::%E5%88%A0%E9%99%A4%E4%BA%8B%E5%8A%A1%E4%B8%8E%E5%BC%95%E7%94%A8%E5%88%A4%E5%AE%9A\">原 Run/调度/occurrence 引用门禁\u003c/a>，未知历史拒绝；恢复不得任意删除缓存。\u003c/p>\n\u003ch3 id=\"创建重放与调度\">创建重放与调度\u003c/h3>\n\u003cp>全集规则是请求意图，首次成员是执行事实，不把动态展开混入请求 hash。重放沿用原快照；Schedule 每 occurrence 独立冻结，原 occurrence 返回原 Run，失效按\u003ca href=\"#docs/design/task-scheduling.md::%E4%BF%9D%E5%AD%98%E5%92%8C%E6%89%A7%E8%A1%8C%E8%BE%B9%E7%95%8C\">调度规则\u003c/a>拒绝，不换来源。\u003c/p>\n\u003ch2 id=\"仓库授权与内容版本\">仓库授权与内容版本\u003c/h2>\n\u003cp>scope.paths 是硬边界，scope.revisions 是允许范围；HEAD/分支可移动，空 allowlist 不限首次版本。\u003ca href=\"../SKM/backend/src/skillmind/agent/repository_source.py\">repository_source\u003c/a>解析检查后，manifest 记录具体 commit/SVN revision。\u003c/p>\n\u003cp>复现优先副本；live 读取仍验冻结授权并标实际 revision，跨版本证据分开。要求创建瞬间内容时，须指定固定可达 revision 或先实现创建时解析持久化。\u003c/p>\n\u003ch2 id=\"产物与访问\">产物与访问\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">input/（只读）\n├── documents/               文档或转换文本\n│   └── .skillmind/        manifest.json、files.txt\n└── \u0026lt;repository requirement\u0026gt;/\n    └── .skillmind/        manifest.json、files.txt、history.txt\nworkspace/                   可写临时工作\noutput/                      可写报告/补丁\n\u003c/code>\u003c/pre>\n\u003cp>Tool 逻辑路径映射到 Run 根下 .skillmind-inputs/\u0026lt;snapshot_id\u0026gt;/，不开放世代目录、不用 symlink 切换，也不搬迁旧 input/ 补签。Brief、read/search、Evidence 必须消费同一 PreparedInput。\u003c/p>\n\u003cp>workspace.write 只写 workspace/output；v2 output 原 UTF-8 字节另作\u003ca href=\"#docs/design/results-evaluation.md::%E5%8F%AF%E4%BF%A1%E9%99%84%E4%BB%B6%E7%9A%84%E5%8F%91%E5%B8%83%E4%B8%8E%E8%AF%BB%E5%8F%96\">不可变附件\u003c/a>，v1/中间文件不自动成为附件。xlsx/xlsm/docx 经\u003ca href=\"../SKM/backend/src/skillmind/agent/binary_text.py\">统一转换\u003c/a>保留源 hash/位置，PDF 未支持；文件、manifest、Evidence、上下文均不含凭据。\u003c/p>\n\u003ch2 id=\"输入准备与可信缓存\">输入准备与可信缓存\u003c/h2>\n\u003cp>每 Run 一份覆盖全部根的 DB 回执，防止文件与本地 manifest 一起被改；信任 DB/受控 Worker，不替代路径隔离和授权。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/runs/input_snapshot.py\">DTO\u003c/a>/\u003ca href=\"../SKM/backend/src/skillmind/runs/repository_inputs.py\">store\u003c/a>/\u003ca href=\"../SKM/backend/migrations/versions/0029_run_input_snapshots.py\">0029\u003c/a>固定 PREPARING/READY、世代、Run/Project/Attempt、来源摘要、全部 path/size/hash、总量和完成时间。它是内部回执，非 Run 状态/API；READY 空集不同于缺回执。\u003c/p>\n\u003ch3 id=\"一次准备的提交边界\">一次准备的提交边界\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">有效 Attempt + heartbeat/取消监督\n  → TX A：校验来源/执行权，保存 PREPARING\n  → 锁外：独占世代，全部根读取/转换/计量，同步并封闭候选\n  → TX B：重验准备身份/lease/取消，提交 READY\n  → 确认同世代回执 → PreparedInput\n  → 冻结 Brief / 最终启动校验 → Agent\n\u003c/code>\u003c/pre>\n\u003cp>按 Run → Segment → Attempt 取锁后验当前 lease/取消。候选落盘不是发布；摘要只取冻结数据，不从旧目录补信任。首次核对回执/候选，复用验完整树/字节/总量/manifest，重复完成不改事实。\u003c/p>\n\u003cp>后续 Segment/Attempt 只复用原 READY；取消后的慢 I/O 不得提交/启动，准备 timeout 不证明回滚或许可删世代。启动监督见\u003ca href=\"#docs/design/agent-runtime.md::%E4%BB%8E%E9%A2%86%E5%8F%96%E5%88%B0%E6%A8%A1%E5%9E%8B%E5%90%AF%E5%8A%A8%E7%9A%84%E8%BE%B9%E7%95%8C\">Runtime\u003c/a>。\u003c/p>\n\u003ch3 id=\"准备中断与再次使用\">准备中断与再次使用\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>状态\u003c/th>\n\u003cth>放行条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>无回执且无旧输入/命名空间\u003c/td>\n\u003ctd>有效 Attempt 可首次准备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无回执但存在命名空间/旧输入\u003c/td>\n\u003ctd>保留并拒绝；空目录、另一 UUID、文件/symlink 都不能换名绕过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PREPARING，无论文件看似完整与否\u003c/td>\n\u003ctd>仅原有效准备继续；接管不替别人补签，暂无自动修复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>READY 且所有来源/树/字节/总量匹配\u003c/td>\n\u003ctd>当前授权下复用；额外文件/目录、缺失或 hash 不符则失败保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完成响应未知\u003c/td>\n\u003ctd>只确认原 Run 的同世代 READY；不再次 begin/complete 或新建输入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lease 失效/取消成立\u003c/td>\n\u003ctd>禁止完成与模型启动，由合法恢复处理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/agent/materialization_storage.py\">安全 I/O\u003c/a>先独占整个 .skillmind-inputs，再建 UUID，防止绕开丢回执现场；中断保留痕迹，READY 不重新创建。\u003c/p>\n\u003cp>store 仅对 complete 已返回后、事务退出的 DBAPIError/TimeoutError/ConnectionError，另开 session 一次确认原准备者/世代/来源/文件及当前 lease/取消。complete 前错误、CancelledError 不确认；仍未知则失败。\u003c/p>\n\u003cp>DB、世代文件、transcript 必须来自匹配的\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复点\u003c/a>，不以较晚文件补签较早 DB。\u003c/p>\n\u003ch3 id=\"读取时的完整性边界\">读取时的完整性边界\u003c/h3>\n\u003cp>read/search 与 Evidence 使用同次回执核验的字节，不先 hash 后重开。描述符锚定 Run 根、不跟 symlink、有界读取，且只接受普通单链接文件。\u003c/p>\n\u003cp>input search 先验全树再查可信清单；未知文件、hardlink/FIFO、缺失/篡改不得伪装 skipped。结果/扫描截断标 truncated，零匹配仅覆盖实际范围。可变 workspace 不要求回执，仍守路径/读取上限。\u003c/p>\n\u003ch3 id=\"跨根总量\">跨根总量\u003c/h3>\n\u003cp>三层限制为单文件、逐根 max_files/max_bytes、跨根 max_total_files/max_total_bytes。最终存量包含转换物、manifest、索引/history；保留原文另计，未落盘 skipped 不计。共享文档计一次，不同仓库根副本分别计。\u003c/p>\n\u003cp>必需索引或任一根/总量超限则整批失败，不交付部分根。复用不双计，但按有效限制验证。临时峰值、workspace/output、搜索响应与\u003ca href=\"#docs/design/run-budgets.md::\">模型预算\u003c/a>另限，最终存量不保证磁盘不耗尽。\u003c/p>\n\u003ch2 id=\"已知差距与后续设计\">已知差距与后续设计\u003c/h2>\n\u003cp>接续 \u003ca href=\"../SKM/backend/src/skillmind/agent/workspace_materializer.py\">workspace_materializer\u003c/a>与\u003ca href=\"../SKM/backend/tests/agent/test_input_preparation_protocol.py\">协议回归\u003c/a>，必需 store 不得改为可选。PREPARING/孤立目录尚无自动修复；消费者联调、历史/混合版本及真实事务/恢复/仓库验收见\u003ca href=\"#docs/planning/roadmap.md::r01-%E8%B5%84%E6%BA%90%E5%86%BB%E7%BB%93\">计划 R01\u003c/a>。\u003c/p>\n\u003ch2 id=\"验收条件\">验收条件\u003c/h2>\n\u003cp>验收选择并集、全集新增/同路径重传、跨 Project/伪造 hash、原键并发胜者；再验全树双重篡改、额外文件、校验后替换、慢准备/接管/取消/未知提交，以及多根最后超限时模型未启动。仓库 live 与副本 revision、转换来源和 skipped 必须可追溯；旧记录不补造。\u003c/p>\n", "sections": [{"title": "资源快照与 Run 工作区", "level": "h1", "anchor": "资源快照与-run-工作区", "text": "# 资源快照与 Run 工作区\n\n本页定义 Run 的读取范围、内容冻结和输入副本。上传/下载/删除属于[文档生命周期](document-lifecycle.md)，请求重放属于[创建协议](run-creation.md)，实施状态见[计划 R01](../planning/roadmap.md#r01-资源冻结)。"}, {"title": "先区分三种“冻结”", "level": "h2", "anchor": "先区分三种冻结", "text": "## 先区分三种“冻结”\n\n| 层次 | 固定事实与边界 |\n| --- | --- |\n| 授权快照 | Project、资源、capability、scope、Integration 版本；分支名不等于 commit，读取权不保证可达 |\n| 内容快照 | 文档 ID/hash/成员，或仓库读取时解析出的 revision；checksum 不是授权，也不是备份 |\n| 物化副本 | 实际文件、转换、索引与 skipped；首次准备不等于创建瞬间已取得内容 |\n\n分别记录三个时点：document 用创建清单，repository 首次打开解析版本；issue 按 binding live 读取形成 Evidence，不物化文件树。"}, {"title": "文档选择与冻结设计", "level": "h2", "anchor": "文档选择与冻结设计", "text": "## 文档选择与冻结设计"}, {"title": "用户选择的是范围，不是 Provider 名称", "level": "h3", "anchor": "用户选择的是范围不是-provider-名称", "text": "### 用户选择的是范围，不是 Provider 名称\n\n| 选择 | 冻结与限制 |\n| --- | --- |\n| 单份/集合 | 同 Project 的原 ID/hash；集合去重校验后排序，不替换同路径重传的新 ID |\n| 显式全集 | 固定创建事务当时的成员，后续上传不加入 |\n| 可选不选 | 不授予该槽位读取权，不回退全集 |\n| 必需未选 | 创建失败，不在后续对话中补授权 |\n\n多槽位共用 Run 级去重并集与 input/documents/，不做槽位隔离；manifest 保留 requirement 关系，重复 ID 元数据必须一致。"}, {"title": "公开选择与读取投影的实施契约", "level": "h3", "anchor": "公开选择与读取投影的实施契约", "text": "### 公开选择与读取投影的实施契约\n\nsources 由客户端编码、服务端校验，界面显示名称与范围。\n\n| 模式 | 编码与数量 |\n| --- | --- |\n| 单份 | document:\u0026lt;UUID\u0026gt;，恰好一个 |\n| 集合 | documents:\u0026lt;UUID\u0026gt;,\u0026lt;UUID\u0026gt;…，同槽位 2–5000 个不同候选 |\n| 全集 | project-documents:all，创建时 1–5000 个成员；空/超量拒绝，不截断 |\n| 不使用 | 省略可选槽位；空串不是合法选择 |\n\n即时执行/Schedule 共用组件，不自动选首份。候选变化保留草稿并要求修正，不改全集、替换 ID 或接受单成员集合；原请求确认不受草稿影响。\n\nselected_sources_json 保存 Project/requirement、模式、成员 ID/路径/MIME/size/hash 与服务端 checksum。Worker 按原 ID 验字节，后续 Segment/Attempt 不重新枚举；客户端 checksum 不提供信任。"}, {"title": "用一个例子理解冻结边界", "level": "h3", "anchor": "用一个例子理解冻结边界", "text": "### 用一个例子理解冻结边界\n\nRun 1 全集冻结 A、B 后新增 C：排队、重试、原请求确认仍只有 A、B，新 Run/occurrence 才可包含 C。同路径重传 A′不能替代 A，原内容缺失则失败。"}, {"title": "读取清单和资源摘要", "level": "h3", "anchor": "读取清单和资源摘要", "text": "### 读取清单和资源摘要\n\nRun detail 的 document_snapshots 按 requirement_key 提供服务端验证后的清单：\n\n| status | snapshot 与含义 |\n| --- | --- |\n| FROZEN | 合法 v1 清单；不是当前目录、blob 可达性或准备完成证明 |\n| LEGACY_UNAVAILABLE | null；旧记录没有可信清单，不猜测历史范围 |\n| INVALID | null；校验失败，不公开未验证成员，其他合法历史仍可读 |\n\n空数组表示未识别文档来源；缺必需 document_snapshots 是 API 契约错误，旧 Run 则用历史状态表达。\n\ndetail/history 的 selected_sources 仅公开 provider/capability/resource_kind/access，兼容已知旧字符串，不暴露内部 JSON、scope 或 Secret locator。大清单只在 detail，不作授权输入。[服务端投影](../../SKM/backend/src/skillmind/runs/resource_projection.py)重算 checksum，[Web](../../SKM/web/src/api/runResources.ts)只验形状和 Project/slot/关联，不复制身份算法。"}, {"title": "失败、缓存与历史", "level": "h3", "anchor": "失败缓存与历史", "text": "### 失败、缓存与历史\n\n| 情况 | 处理 |\n| --- | --- |\n| 原 ID/blob 缺失，元数据或实际 hash 不符 | 准备失败；不按路径替换、不伪装普通 skipped |\n| 内容合法但不支持/单文件过大 | manifest 记录 skipped，结果说明未覆盖范围 |\n| 完整副本合法 | 校验来源、Run/Project、完整文件树后复用，不重新读取全集 |\n| 副本缺失、改写或混入文件 | 保留现场并失败，不删除重建或降级 live |\n| live Tool 无法取原 ID | 返回不可用；已存副本与 live 可达性分别判断 |\n| 旧 Run 无清单/回执 | 终态只读且标未知；非终态不自动授权全集，需新输入则新建 Run |\n\n删除须经[原 Run/调度/occurrence 引用门禁](document-lifecycle.md#删除事务与引用判定)，未知历史拒绝；恢复不得任意删除缓存。"}, {"title": "创建重放与调度", "level": "h3", "anchor": "创建重放与调度", "text": "### 创建重放与调度\n\n全集规则是请求意图，首次成员是执行事实，不把动态展开混入请求 hash。重放沿用原快照；Schedule 每 occurrence 独立冻结，原 occurrence 返回原 Run，失效按[调度规则](task-scheduling.md#保存和执行边界)拒绝，不换来源。"}, {"title": "仓库授权与内容版本", "level": "h2", "anchor": "仓库授权与内容版本", "text": "## 仓库授权与内容版本\n\nscope.paths 是硬边界，scope.revisions 是允许范围；HEAD/分支可移动，空 allowlist 不限首次版本。[repository_source](../../SKM/backend/src/skillmind/agent/repository_source.py)解析检查后，manifest 记录具体 commit/SVN revision。\n\n复现优先副本；live 读取仍验冻结授权并标实际 revision，跨版本证据分开。要求创建瞬间内容时，须指定固定可达 revision 或先实现创建时解析持久化。"}, {"title": "产物与访问", "level": "h2", "anchor": "产物与访问", "text": "## 产物与访问\n\n```text\ninput/（只读）\n├── documents/               文档或转换文本\n│   └── .skillmind/        manifest.json、files.txt\n└── \u003crepository requirement>/\n    └── .skillmind/        manifest.json、files.txt、history.txt\nworkspace/                   可写临时工作\noutput/                      可写报告/补丁\n```\n\nTool 逻辑路径映射到 Run 根下 .skillmind-inputs/\u0026lt;snapshot_id\u0026gt;/，不开放世代目录、不用 symlink 切换，也不搬迁旧 input/ 补签。Brief、read/search、Evidence 必须消费同一 PreparedInput。\n\nworkspace.write 只写 workspace/output；v2 output 原 UTF-8 字节另作[不可变附件](results-evaluation.md#可信附件的发布与读取)，v1/中间文件不自动成为附件。xlsx/xlsm/docx 经[统一转换](../../SKM/backend/src/skillmind/agent/binary_text.py)保留源 hash/位置，PDF 未支持；文件、manifest、Evidence、上下文均不含凭据。"}, {"title": "输入准备与可信缓存", "level": "h2", "anchor": "输入准备与可信缓存", "text": "## 输入准备与可信缓存\n\n每 Run 一份覆盖全部根的 DB 回执，防止文件与本地 manifest 一起被改；信任 DB/受控 Worker，不替代路径隔离和授权。\n\n[DTO](../../SKM/backend/src/skillmind/runs/input_snapshot.py)/[store](../../SKM/backend/src/skillmind/runs/repository_inputs.py)/[0029](../../SKM/backend/migrations/versions/0029_run_input_snapshots.py)固定 PREPARING/READY、世代、Run/Project/Attempt、来源摘要、全部 path/size/hash、总量和完成时间。它是内部回执，非 Run 状态/API；READY 空集不同于缺回执。"}, {"title": "一次准备的提交边界", "level": "h3", "anchor": "一次准备的提交边界", "text": "### 一次准备的提交边界\n\n```text\n有效 Attempt + heartbeat/取消监督\n  → TX A：校验来源/执行权，保存 PREPARING\n  → 锁外：独占世代，全部根读取/转换/计量，同步并封闭候选\n  → TX B：重验准备身份/lease/取消，提交 READY\n  → 确认同世代回执 → PreparedInput\n  → 冻结 Brief / 最终启动校验 → Agent\n```\n\n按 Run → Segment → Attempt 取锁后验当前 lease/取消。候选落盘不是发布；摘要只取冻结数据，不从旧目录补信任。首次核对回执/候选，复用验完整树/字节/总量/manifest，重复完成不改事实。\n\n后续 Segment/Attempt 只复用原 READY；取消后的慢 I/O 不得提交/启动，准备 timeout 不证明回滚或许可删世代。启动监督见[Runtime](agent-runtime.md#从领取到模型启动的边界)。"}, {"title": "准备中断与再次使用", "level": "h3", "anchor": "准备中断与再次使用", "text": "### 准备中断与再次使用\n\n| 状态 | 放行条件 |\n| --- | --- |\n| 无回执且无旧输入/命名空间 | 有效 Attempt 可首次准备 |\n| 无回执但存在命名空间/旧输入 | 保留并拒绝；空目录、另一 UUID、文件/symlink 都不能换名绕过 |\n| PREPARING，无论文件看似完整与否 | 仅原有效准备继续；接管不替别人补签，暂无自动修复 |\n| READY 且所有来源/树/字节/总量匹配 | 当前授权下复用；额外文件/目录、缺失或 hash 不符则失败保留 |\n| 完成响应未知 | 只确认原 Run 的同世代 READY；不再次 begin/complete 或新建输入 |\n| lease 失效/取消成立 | 禁止完成与模型启动，由合法恢复处理 |\n\n[安全 I/O](../../SKM/backend/src/skillmind/agent/materialization_storage.py)先独占整个 .skillmind-inputs，再建 UUID，防止绕开丢回执现场；中断保留痕迹，READY 不重新创建。\n\nstore 仅对 complete 已返回后、事务退出的 DBAPIError/TimeoutError/ConnectionError，另开 session 一次确认原准备者/世代/来源/文件及当前 lease/取消。complete 前错误、CancelledError 不确认；仍未知则失败。\n\nDB、世代文件、transcript 必须来自匹配的[恢复点](../operations/backup-recovery.md)，不以较晚文件补签较早 DB。"}, {"title": "读取时的完整性边界", "level": "h3", "anchor": "读取时的完整性边界", "text": "### 读取时的完整性边界\n\nread/search 与 Evidence 使用同次回执核验的字节，不先 hash 后重开。描述符锚定 Run 根、不跟 symlink、有界读取，且只接受普通单链接文件。\n\ninput search 先验全树再查可信清单；未知文件、hardlink/FIFO、缺失/篡改不得伪装 skipped。结果/扫描截断标 truncated，零匹配仅覆盖实际范围。可变 workspace 不要求回执，仍守路径/读取上限。"}, {"title": "跨根总量", "level": "h3", "anchor": "跨根总量", "text": "### 跨根总量\n\n三层限制为单文件、逐根 max_files/max_bytes、跨根 max_total_files/max_total_bytes。最终存量包含转换物、manifest、索引/history；保留原文另计，未落盘 skipped 不计。共享文档计一次，不同仓库根副本分别计。\n\n必需索引或任一根/总量超限则整批失败，不交付部分根。复用不双计，但按有效限制验证。临时峰值、workspace/output、搜索响应与[模型预算](run-budgets.md)另限，最终存量不保证磁盘不耗尽。"}, {"title": "已知差距与后续设计", "level": "h2", "anchor": "已知差距与后续设计", "text": "## 已知差距与后续设计\n\n接续 [workspace_materializer](../../SKM/backend/src/skillmind/agent/workspace_materializer.py)与[协议回归](../../SKM/backend/tests/agent/test_input_preparation_protocol.py)，必需 store 不得改为可选。PREPARING/孤立目录尚无自动修复；消费者联调、历史/混合版本及真实事务/恢复/仓库验收见[计划 R01](../planning/roadmap.md#r01-资源冻结)。"}, {"title": "验收条件", "level": "h2", "anchor": "验收条件", "text": "## 验收条件\n\n验收选择并集、全集新增/同路径重传、跨 Project/伪造 hash、原键并发胜者；再验全树双重篡改、额外文件、校验后替换、慢准备/接管/取消/未知提交，以及多根最后超限时模型未启动。仓库 live 与副本 revision、转换来源和 skipped 必须可追溯；旧记录不补造。"}], "toc": [{"title": "先区分三种“冻结”", "anchor": "先区分三种冻结", "level": "h2"}, {"title": "文档选择与冻结设计", "anchor": "文档选择与冻结设计", "level": "h2"}, {"title": "用户选择的是范围，不是 Provider 名称", "anchor": "用户选择的是范围不是-provider-名称", "level": "h3"}, {"title": "公开选择与读取投影的实施契约", "anchor": "公开选择与读取投影的实施契约", "level": "h3"}, {"title": "用一个例子理解冻结边界", "anchor": "用一个例子理解冻结边界", "level": "h3"}, {"title": "读取清单和资源摘要", "anchor": "读取清单和资源摘要", "level": "h3"}, {"title": "失败、缓存与历史", "anchor": "失败缓存与历史", "level": "h3"}, {"title": "创建重放与调度", "anchor": "创建重放与调度", "level": "h3"}, {"title": "仓库授权与内容版本", "anchor": "仓库授权与内容版本", "level": "h2"}, {"title": "产物与访问", "anchor": "产物与访问", "level": "h2"}, {"title": "输入准备与可信缓存", "anchor": "输入准备与可信缓存", "level": "h2"}, {"title": "一次准备的提交边界", "anchor": "一次准备的提交边界", "level": "h3"}, {"title": "准备中断与再次使用", "anchor": "准备中断与再次使用", "level": "h3"}, {"title": "读取时的完整性边界", "anchor": "读取时的完整性边界", "level": "h3"}, {"title": "跨根总量", "anchor": "跨根总量", "level": "h3"}, {"title": "已知差距与后续设计", "anchor": "已知差距与后续设计", "level": "h2"}, {"title": "验收条件", "anchor": "验收条件", "level": "h2"}], "source": "design/resource-snapshots.md", "checksum": "05427e5dfee1c47dc7fb8f0d1a1fc9b3aeb79aa7c57e5fd67537c245485363c2"}, {"id": "docs/design/agent-runtime.md", "title": "Agent Runtime 与持续执行", "group": "design", "html": "\u003ch1 id=\"agent-runtime-与持续执行\">Agent Runtime 与持续执行\u003c/h1>\n\u003cp>本页负责已有 Run 的执行、会话与事件协议。创建身份见\u003ca href=\"#docs/design/run-creation.md::\">R
