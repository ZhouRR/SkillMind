}, {"title": "阶段回执与不确定结果", "anchor": "阶段回执与不确定结果", "level": "h3"}, {"title": "执行权与取消", "anchor": "执行权与取消", "level": "h3"}, {"title": "验收", "anchor": "验收", "level": "h2"}], "source": "design/repository-effects.md", "checksum": "c70160021cf37e506e179a7000d1432759a05e7a09d98b27e2b2fdddd9a2dbe3"}, {"id": "docs/design/task-scheduling.md", "title": "TaskSchedule 设计", "group": "design", "html": "\u003ch1 id=\"taskschedule-设计\">TaskSchedule 设计\u003c/h1>\n\u003cp>Schedule 只决定何时、以谁和哪份配置调用普通 \u003ca href=\"#docs/design/run-creation.md::\">Run 创建\u003c/a>，不成为第二引擎。下文分开现行行为与待实现可靠性，状态见\u003ca href=\"#docs/planning/roadmap.md::r09-%E8%B0%83%E5%BA%A6\">计划 R09\u003c/a>。\u003c/p>\n\u003ch2 id=\"一页速览\">一页速览\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Schedule / Run\u003c/td>\n\u003ctd>前者存规则，每次成功触发创建独立 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>occurrence / 实际开始\u003c/td>\n\u003ctd>occurrence 是计划时刻，tick 与 Run 都可能晚到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>暂停 / 取消\u003c/td>\n\u003ctd>暂停阻止后续认领，不撤回在途；已有 Run 单独取消\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等 / 不漏发\u003c/td>\n\u003ctd>稳定键抑制重复，不能修复认领后崩溃丢失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不批量补跑 / 不迟到\u003c/td>\n\u003ctd>当前处理一个到期 occurrence，其余计 missed，无最大迟到拒绝\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"一个例子规则触发与执行分别看\">一个例子：规则、触发与执行分别看\u003c/h2>\n\u003cp>08:00 创建 Run A，A 等批准；09:00 同 Schedule 触发因重叠跳过。此时 status=ACTIVE、last_run_at=09:00、last_outcome=SKIPPED_OVERLAP、last_run_id=A、run_count=1 可以同时成立。\u003c/p>\n\u003cp>last_run_at 是最近回写的计划时刻，不是 A 开始时间；last_run_id 保留最近成功关联，跳过不清空；run_count 不是成功数。last_* 是会被覆盖/滞后的摘要，不是完整触发账本。\u003c/p>\n\u003ch2 id=\"生命周期与发火\">生命周期与发火\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">保存规则 / 候选，仅 ACTIVE 参与 tick\n  → TX A：认领并推进 next_run_at（还没有 Run）\n  → 当前授权 / 查询原键 / 重叠与前置检查\n  → TX B：普通创建 Run / Segment / Outbox\n  → TX C：回写触发摘要 / 计数\n\u003c/code>\u003c/pre>\n\u003cp>三个事务不原子，已有原 Run/重叠/前置不符时不执行 B，基础设施失败可能中断于 C 前。\u003c/p>\n\u003cp>支持 ONCE/CRON、必填 IANA timezone、分钟粒度；定义/预览/发火共用求值。ONCE 一次、CRON 通常展示至少三次，end_at/max_runs 限制不足时不虚构。状态 ACTIVE/PAUSED/COMPLETED/ERROR/ARCHIVED；修改保留状态，ERROR 修正后显式恢复，从当前时刻重算，不追赶暂停历史。COMPLETED 可仍有关联非终态 Run。\u003c/p>\n\u003cp>CRON 跳过 DST 不存在时刻、重复时刻取第一次；ONCE 规范到分钟，持久身份使用 UTC occurrence，不用浏览器文字生成键。代码见 \u003ca href=\"../PJM/backend/src/projectmind/schedules/cron.py\">cron\u003c/a>。\u003c/p>\n\u003ch2 id=\"保存和执行边界\">保存和执行边界\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>任务/输入\u003c/td>\n\u003ctd>保存精确 SkillVersion/task_key、input/sources 规则，不跟 latest；发火才冻结本次资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>身份\u003c/td>\n\u003ctd>发火前重新检查创建者有效性/Project 权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等\u003c/td>\n\u003ctd>Schedule ID + UTC occurrence；先查原 Run，再判断新建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重叠\u003c/td>\n\u003ctd>当前仅查该 Schedule 的 last_run_id，非终态含等待均跳过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失效\u003c/td>\n\u003ctd>FAILED_PRECONDITION / ERROR，修正后显式恢复，不换来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结束\u003c/td>\n\u003ctd>ONCE 消化后停止；CRON 按候选/end_at/max_runs，计数缺口见下文\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>调度不绕过批准、资源再验证或审计。文档全集每个新 Run 固定当时成员；单份/集合保持原 ID，同 occurrence 重放原快照。\u003c/p>\n\u003ch3 id=\"重叠检查到底看谁\">重叠检查到底看谁\u003c/h3>\n\u003cp>当前 \u003ca href=\"../PJM/backend/src/projectmind/schedules/service.py\">ScheduleService\u003c/a>只看本 Schedule 上次关联 Run，不查同 Task 的手动/其他 Schedule；自身创建后漏回写也可能漏判。原 occurrence 重放先于重叠检查。\u003c/p>\n\u003cp>修正范围仍是同 Schedule 不重叠，使用可追溯关联而非摘要指针；不悄悄扩成 Project/Task 全局锁或排队。全局串行若另立项须覆盖全部普通创建入口。\u003c/p>\n\u003ch2 id=\"保存表单与触发预览\">保存表单与触发预览\u003c/h2>\n\u003cp>TasksPage/ScheduleDialog 与即时执行共用 TaskLaunchFields/taskDraft，发送实际 input/sources/精确任务，必需文档未选或集合不完整不能保存。预览只验证时间，不授权资源、不创建 Run，也不保证未来发火成功。\u003c/p>\n\u003cp>当前预览可选，只发送 definition，改时间后清旧预览并拒绝晚到旧结果；保存尚未要求确认当前 definition 的服务端候选，需补齐。关闭创建弹窗丢草稿，abort 不证明 Schedule 未保存；它没有 Run 创建的原键恢复保证。\u003c/p>\n\u003ch3 id=\"保存后的管理入口\">保存后的管理入口\u003c/h3>\n\u003cp>当前 PUT/client 已有 expected_row_version、不允许换任务，但页面无编辑表单；版本比较非原子。Web 只取 Project 前 100 条且丢分页，再依赖 TaskCatalog 卡片、隐藏 ARCHIVED，失效任务和后续页可能无法管理。\u003c/p>\n\u003cp>目标：编辑载入原配置/共享输入，冲突保留草稿，不归档重建；Project 级独立分页/筛选保留 total，失效版本只读标原因、不换 latest；归档可显式查询。页面不可见不代表保存失败。\u003c/p>\n\u003ch3 id=\"时间输入与展示的边界\">时间输入与展示的边界\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>边界\u003c/th>\n\u003cth>当前问题 / 修正\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>CRON\u003c/td>\n\u003ctd>按 definition.timezone 求值，未必是浏览器本地时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ONCE/end_at 输入\u003c/td>\n\u003ctd>datetime-local 按浏览器时区转绝对时刻；改规则 timezone 不改变转换，须显式标输入时区\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预览/列表\u003c/td>\n\u003ctd>预览显示本地时间；ONCE 摘要会拼另一规则时区，可能误标。目标按规则时区显示 occurrence/offset，必要时另列本地对照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API datetime\u003c/td>\n\u003ctd>当前可接受无 offset，可能依赖进程时区；目标拒绝无 offset，不重新解释旧已存绝对时刻\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>浏览器 UTC、规则 Asia/Tokyo 时，CRON 09:00 是 UTC 00:00，而当前 ONCE 输入 09:00 是东京 18:00。跨日、DST 缺失/歧义须明确拒绝或确认 offset，不能依赖 Date 隐式纠正。改为规则时区输入需另定兼容协议。\u003c/p>\n\u003ch2 id=\"可靠性保证的限度\">可靠性保证的限度\u003c/h2>\n\u003ch3 id=\"停机恢复的实际行为\">停机恢复的实际行为\u003c/h3>\n\u003cp>dispatch 开关不停止 Schedule tick，停写须覆盖实际 job/cron/实例，见\u003ca href=\"#docs/operations/deployment.md::\">部署\u003c/a>。每小时规则 next_run_at=03:00、09:30 恢复：当前尝试 03:00 一次，04:00–09:00 六次计 missed，下次 10:00；ONCE 也无最大迟到拒绝。\u003c/p>\n\u003cp>_count_missed 单次最多 1000，长期停机可能截顶。迟到容忍/截止须明确 ONCE/CRON 产品策略再同步实现和 UI，不能临时补跑或改 occurrence。\u003c/p>\n\u003ch3 id=\"事务并发与统计\">事务、并发与统计\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>边界\u003c/th>\n\u003cth>当前风险\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>A 后 B 前崩溃\u003c/td>\n\u003ctd>候选已推进，无 Run/持久在途\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B 后 C 前崩溃\u003c/td>\n\u003ctd>Run 已在，摘要/last_run_id 未更新\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>claim 只比候选/ACTIVE\u003c/td>\n\u003ctd>同时间编辑可被旧输入认领，未比配置版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编辑先读后 Python 比版本\u003c/td>\n\u003ctd>两请求可同版通过，未条件 UPDATE/锁内 CAS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>状态与结果回写\u003c/td>\n\u003ctd>先读后判、按 ID 回写，旧结果可能覆盖暂停/归档/新定义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内存 ClaimedSchedule\u003c/td>\n\u003ctd>重放入口存在，崩溃后仍可能失去原配置\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>row_version 随编辑、状态、claim、回写都增长，不是语义配置版本。run_count 在非空 run_id 回写时增加，不是 Run 成功数；重复/漏回写会失真。plan_occurrence 用 run_count+1 预判 max_runs，最后机会若跳过也可提前 COMPLETED；ONCE 的唯一机会与 CRON 额度另判。\u003c/p>\n\u003ch2 id=\"可靠性修正要求待实现\">可靠性修正要求（待实现）\u003c/h2>\n\u003cp>采用持久在途触发 → 普通幂等创建 → 幂等结算，不设计第二套 Run 插入/hash，也不批量补发未认领历史。\u003c/p>\n\u003ch3 id=\"认领记录与恢复权限\">认领记录与恢复权限\u003c/h3>\n\u003cp>认领事务原子校验状态、候选、配置版本，保存原 actor/任务/时间规则/input/sources/UTC occurrence/key，再推进候选。逻辑唯一身份仍 Schedule+UTC occurrence，编辑/接管不换键。\u003c/p>\n\u003cp>持久 claim 有有界执行权/fencing，非 RunAttempt；旧持有者不能晚到关联/结算。锁只覆盖认领/校验/结算，不长期跨资源和普通创建调用。\u003c/p>\n\u003cp>恢复顺序：当前授权 → 查原键，有 Run 即关联 → 无 Run 才查本 Schedule 其他在途和非终态关联 → 允许时经普通创建。创建事务也须验证认领仍可新建，不能仅在调用前检查。\u003c/p>\n\u003ch3 id=\"配置并发与暂停\">配置并发与暂停\u003c/h3>\n\u003cp>编辑的版本、状态与写入须同原子边界，条件 UPDATE/锁协议核验影响行数；状态按锁内最新事实判定。区分整行 row_version 与语义配置版本，tick 统计不等于改输入。\u003c/p>\n\u003cp>认领提交是暂停/归档边界：阻止未来认领，不撤回在途；旧 occurrence 按原配置及当前授权完成，不覆盖新定义/PAUSED/ARCHIVED。改公开版本请求时同步 DTO/OpenAPI/Web 冲突与旧客户端兼容。\u003c/p>\n\u003ch3 id=\"结算计数与未知结果\">结算、计数与未知结果\u003c/h3>\n\u003cp>同 occurrence 关联/结算幂等，每个不同已关联 Run 只计一次、不等 SUCCEEDED；晚结果可补自身审计/数量，不回退较新摘要。\u003c/p>\n\u003cp>max_runs 是累计创建额度：认领原子留名额；确认无 Run 的跳过/失败释放，已有 Run 只结一次，创建未知保留并查原键。编辑不清计数，上限不得低于已关联与占用之和。ONCE 一次机会与 CRON 额度耗尽分开。\u003c/p>\n\u003cp>基础设施错误不是 FAILED_PRECONDITION；有界重试耗尽仍保留待核对记录，不换键/改计数。迟到准入、missed 截顶与在途投影随协议交付，不先造公开字段。\u003c/p>\n\u003ch3 id=\"历史兼容与实施顺序\">历史兼容与实施顺序\u003c/h3>\n\u003cp>先持久协议/普通创建接线/原子编辑认领结算/故障测试，再 API 投影、独立分页编辑与三语。旧 last_* 不能补造历史 occurrence、配置或精确计数；保留原 Run/key/快照，可证明关联与未知分开。\u003c/p>\n\u003cp>新旧 tick 不混跑绕过认领门禁，回退保留 Run 与触发审计。仍不加入全局 task mutex、跨 Project 调度、条件监控或任意补跑。\u003c/p>\n\u003ch2 id=\"实现与验收\">实现与验收\u003c/h2>\n\u003cp>入口：\u003ca href=\"../PJM/backend/src/projectmind/schedules/service.py\">service\u003c/a>、\u003ca href=\"../PJM/backend/src/projectmind/schedules/repository.py\">repository\u003c/a>、\u003ca href=\"../PJM/backend/src/projectmind/api/routes/schedules.py\">API\u003c/a>、\u003ca href=\"../PJM/web/src/components/ScheduleDialog.tsx\">ScheduleDialog\u003c/a>。\u003c/p>\n\u003cp>验收 ONCE/CRON/DST/跨时区同一绝对时刻、当前预览确认、编辑冲突保草稿、超过 100 条/任务失效可管理、A/B/C 间崩溃、同版竞争、暂停与旧回写、原键恢复/自身重叠、接管未知提交、跳过不耗创建额度及历史/混合版本。\u003c/p>\n\u003cp>时间单测、mock 创建和健康 tick 不证明真实事务/多 Worker/发火成功；专用 Project 另验实际 occurrence、停机迟到与 ERROR 恢复。\u003c/p>\n", "sections": [{"title": "TaskSchedule 设计", "level": "h1", "anchor": "taskschedule-设计", "text": "# TaskSchedule 设计\n\nSchedule 只决定何时、以谁和哪份配置调用普通 [Run 创建](run-creation.md)，不成为第二引擎。下文分开现行行为与待实现可靠性，状态见[计划 R09](../planning/roadmap.md#r09-调度)。"}, {"title": "一页速览", "level": "h2", "anchor": "一页速览", "text": "## 一页速览\n\n| 概念 | 边界 |\n| --- | --- |\n| Schedule / Run | 前者存规则，每次成功触发创建独立 Run |\n| occurrence / 实际开始 | occurrence 是计划时刻，tick 与 Run 都可能晚到 |\n| 暂停 / 取消 | 暂停阻止后续认领，不撤回在途；已有 Run 单独取消 |\n| 幂等 / 不漏发 | 稳定键抑制重复，不能修复认领后崩溃丢失 |\n| 不批量补跑 / 不迟到 | 当前处理一个到期 occurrence，其余计 missed，无最大迟到拒绝 |"}, {"title": "一个例子：规则、触发与执行分别看", "level": "h2", "anchor": "一个例子规则触发与执行分别看", "text": "## 一个例子：规则、触发与执行分别看\n\n08:00 创建 Run A，A 等批准；09:00 同 Schedule 触发因重叠跳过。此时 status=ACTIVE、last_run_at=09:00、last_outcome=SKIPPED_OVERLAP、last_run_id=A、run_count=1 可以同时成立。\n\nlast_run_at 是最近回写的计划时刻，不是 A 开始时间；last_run_id 保留最近成功关联，跳过不清空；run_count 不是成功数。last_* 是会被覆盖/滞后的摘要，不是完整触发账本。"}, {"title": "生命周期与发火", "level": "h2", "anchor": "生命周期与发火", "text": "## 生命周期与发火\n\n```text\n保存规则 / 候选，仅 ACTIVE 参与 tick\n  → TX A：认领并推进 next_run_at（还没有 Run）\n  → 当前授权 / 查询原键 / 重叠与前置检查\n  → TX B：普通创建 Run / Segment / Outbox\n  → TX C：回写触发摘要 / 计数\n```\n\n三个事务不原子，已有原 Run/重叠/前置不符时不执行 B，基础设施失败可能中断于 C 前。\n\n支持 ONCE/CRON、必填 IANA timezone、分钟粒度；定义/预览/发火共用求值。ONCE 一次、CRON 通常展示至少三次，end_at/max_runs 限制不足时不虚构。状态 ACTIVE/PAUSED/COMPLETED/ERROR/ARCHIVED；修改保留状态，ERROR 修正后显式恢复，从当前时刻重算，不追赶暂停历史。COMPLETED 可仍有关联非终态 Run。\n\nCRON 跳过 DST 不存在时刻、重复时刻取第一次；ONCE 规范到分钟，持久身份使用 UTC occurrence，不用浏览器文字生成键。代码见 [cron](../../PJM/backend/src/projectmind/schedules/cron.py)。"}, {"title": "保存和执行边界", "level": "h2", "anchor": "保存和执行边界", "text": "## 保存和执行边界\n\n| 项目 | 规则 |\n| --- | --- |\n| 任务/输入 | 保存精确 SkillVersion/task_key、input/sources 规则，不跟 latest；发火才冻结本次资源 |\n| 身份 | 发火前重新检查创建者有效性/Project 权限 |\n| 幂等 | Schedule ID + UTC occurrence；先查原 Run，再判断新建 |\n| 重叠 | 当前仅查该 Schedule 的 last_run_id，非终态含等待均跳过 |\n| 失效 | FAILED_PRECONDITION / ERROR，修正后显式恢复，不换来源 |\n| 结束 | ONCE 消化后停止；CRON 按候选/end_at/max_runs，计数缺口见下文 |\n\n调度不绕过批准、资源再验证或审计。文档全集每个新 Run 固定当时成员；单份/集合保持原 ID，同 occurrence 重放原快照。"}, {"title": "重叠检查到底看谁", "level": "h3", "anchor": "重叠检查到底看谁", "text": "### 重叠检查到底看谁\n\n当前 [ScheduleService](../../PJM/backend/src/projectmind/schedules/service.py)只看本 Schedule 上次关联 Run，不查同 Task 的手动/其他 Schedule；自身创建后漏回写也可能漏判。原 occurrence 重放先于重叠检查。\n\n修正范围仍是同 Schedule 不重叠，使用可追溯关联而非摘要指针；不悄悄扩成 Project/Task 全局锁或排队。全局串行若另立项须覆盖全部普通创建入口。"}, {"title": "保存表单与触发预览", "level": "h2", "anchor": "保存表单与触发预览", "text": "## 保存表单与触发预览\n\nTasksPage/ScheduleDialog 与即时执行共用 TaskLaunchFields/taskDraft，发送实际 input/sources/精确任务，必需文档未选或集合不完整不能保存。预览只验证时间，不授权资源、不创建 Run，也不保证未来发火成功。\n\n当前预览可选，只发送 definition，改时间后清旧预览并拒绝晚到旧结果；保存尚未要求确认当前 definition 的服务端候选，需补齐。关闭创建弹窗丢草稿，abort 不证明 Schedule 未保存；它没有 Run 创建的原键恢复保证。"}, {"title": "保存后的管理入口", "level": "h3", "anchor": "保存后的管理入口", "text": "### 保存后的管理入口\n\n当前 PUT/client 已有 expected_row_version、不允许换任务，但页面无编辑表单；版本比较非原子。Web 只取 Project 前 100 条且丢分页，再依赖 TaskCatalog 卡片、隐藏 ARCHIVED，失效任务和后续页可能无法管理。\n\n目标：编辑载入原配置/共享输入，冲突保留草稿，不归档重建；Project 级独立分页/筛选保留 total，失效版本只读标原因、不换 latest；归档可显式查询。页面不可见不代表保存失败。"}, {"title": "时间输入与展示的边界", "level": "h3", "anchor": "时间输入与展示的边界", "text": "### 时间输入与展示的边界\n\n| 边界 | 当前问题 / 修正 |\n| --- | --- |\n| CRON | 按 definition.timezone 求值，未必是浏览器本地时间 |\n| ONCE/end_at 输入 | datetime-local 按浏览器时区转绝对时刻；改规则 timezone 不改变转换，须显式标输入时区 |\n| 预览/列表 | 预览显示本地时间；ONCE 摘要会拼另一规则时区，可能误标。目标按规则时区显示 occurrence/offset，必要时另列本地对照 |\n| API datetime | 当前可接受无 offset，可能依赖进程时区；目标拒绝无 offset，不重新解释旧已存绝对时刻 |\n\n浏览器 UTC、规则 Asia/Tokyo 时，CRON 09:00 是 UTC 00:00，而当前 ONCE 输入 09:00 是东京 18:00。跨日、DST 缺失/歧义须明确拒绝或确认 offset，不能依赖 Date 隐式纠正。改为规则时区输入需另定兼容协议。"}, {"title": "可靠性保证的限度", "level": "h2", "anchor": "可靠性保证的限度", "text": "## 可靠性保证的限度"}, {"title": "停机恢复的实际行为", "level": "h3", "anchor": "停机恢复的实际行为", "text": "### 停机恢复的实际行为\n\ndispatch 开关不停止 Schedule tick，停写须覆盖实际 job/cron/实例，见[部署](../operations/deployment.md)。每小时规则 next_run_at=03:00、09:30 恢复：当前尝试 03:00 一次，04:00–09:00 六次计 missed，下次 10:00；ONCE 也无最大迟到拒绝。\n\n_count_missed 单次最多 1000，长期停机可能截顶。迟到容忍/截止须明确 ONCE/CRON 产品策略再同步实现和 UI，不能临时补跑或改 occurrence。"}, {"title": "事务、并发与统计", "level": "h3", "anchor": "事务并发与统计", "text": "### 事务、并发与统计\n\n| 边界 | 当前风险 |\n| --- | --- |\n| A 后 B 前崩溃 | 候选已推进，无 Run/持久在途 |\n| B 后 C 前崩溃 | Run 已在，摘要/last_run_id 未更新 |\n| claim 只比候选/ACTIVE | 同时间编辑可被旧输入认领，未比配置版本 |\n| 编辑先读后 Python 比版本 | 两请求可同版通过，未条件 UPDATE/锁内 CAS |\n| 状态与结果回写 | 先读后判、按 ID 回写，旧结果可能覆盖暂停/归档/新定义 |\n| 内存 ClaimedSchedule | 重放入口存在，崩溃后仍可能失去原配置 |\n\nrow_version 随编辑、状态、claim、回写都增长，不是语义配置版本。run_count 在非空 run_id 回写时增加，不是 Run 成功数；重复/漏回写会失真。plan_occurrence 用 run_count+1 预判 max_runs，最后机会若跳过也可提前 COMPLETED；ONCE 的唯一机会与 CRON 额度另判。"}, {"title": "可靠性修正要求（待实现）", "level": "h2", "anchor": "可靠性修正要求待实现", "text": "## 可靠性修正要求（待实现）\n\n采用持久在途触发 → 普通幂等创建 → 幂等结算，不设计第二套 Run 插入/hash，也不批量补发未认领历史。"}, {"title": "认领记录与恢复权限", "level": "h3", "anchor": "认领记录与恢复权限", "text": "### 认领记录与恢复权限\n\n认领事务原子校验状态、候选、配置版本，保存原 actor/任务/时间规则/input/sources/UTC occurrence/key，再推进候选。逻辑唯一身份仍 Schedule+UTC occurrence，编辑/接管不换键。\n\n持久 claim 有有界执行权/fencing，非 RunAttempt；旧持有者不能晚到关联/结算。锁只覆盖认领/校验/结算，不长期跨资源和普通创建调用。\n\n恢复顺序：当前授权 → 查原键，有 Run 即关联 → 无 Run 才查本 Schedule 其他在途和非终态关联 → 允许时经普通创建。创建事务也须验证认领仍可新建，不能仅在调用前检查。"}, {"title": "配置并发与暂停", "level": "h3", "anchor": "配置并发与暂停", "text": "### 配置并发与暂停\n\n编辑的版本、状态与写入须同原子边界，条件 UPDATE/锁协议核验影响行数；状态按锁内最新事实判定。区分整行 row_version 与语义配置版本，tick 统计不等于改输入。\n\n认领提交是暂停/归档边界：阻止未来认领，不撤回在途；旧 occurrence 按原配置及当前授权完成，不覆盖新定义/PAUSED/ARCHIVED。改公开版本请求时同步 DTO/OpenAPI/Web 冲突与旧客户端兼容。"}, {"title": "结算、计数与未知结果", "level": "h3", "anchor": "结算计数与未知结果", "text": "### 结算、计数与未知结果\n\n同 occurrence 关联/结算幂等，每个不同已关联 Run 只计一次、不等 SUCCEEDED；晚结果可补自身审计/数量，不回退较新摘要。\n\nmax_runs 是累计创建额度：认领原子留名额；确认无 Run 的跳过/失败释放，已有 Run 只结一次，创建未知保留并查原键。编辑不清计数，上限不得低于已关联与占用之和。ONCE 一次机会与 CRON 额度耗尽分开。\n\n基础设施错误不是 FAILED_PRECONDITION；有界重试耗尽仍保留待核对记录，不换键/改计数。迟到准入、missed 截顶与在途投影随协议交付，不先造公开字段。"}, {"title": "历史兼容与实施顺序", "level": "h3", "anchor": "历史兼容与实施顺序", "text": "### 历史兼容与实施顺序\n\n先持久协议/普通创建接线/原子编辑认领结算/故障测试，再 API 投影、独立分页编辑与三语。旧 last_* 不能补造历史 occurrence、配置或精确计数；保留原 Run/key/快照，可证明关联与未知分开。\n\n新旧 tick 不混跑绕过认领门禁，回退保留 Run 与触发审计。仍不加入全局 task mutex、跨 Project 调度、条件监控或任意补跑。"}, {"title": "实现与验收", "level": "h2", "anchor": "实现与验收", "text": "## 实现与验收\n\n入口：[service](../../PJM/backend/src/projectmind/schedules/service.py)、[repository](../../PJM/backend/src/projectmind/schedules/repository.py)、[API](../../PJM/backend/src/projectmind/api/routes/schedules.py)、[ScheduleDialog](../../PJM/web/src/components/ScheduleDialog.tsx)。\n\n验收 ONCE/CRON/DST/跨时区同一绝对时刻、当前预览确认、编辑冲突保草稿、超过 100 条/任务失效可管理、A/B/C 间崩溃、同版竞争、暂停与旧回写、原键恢复/自身重叠、接管未知提交、跳过不耗创建额度及历史/混合版本。\n\n时间单测、mock 创建和健康 tick 不证明真实事务/多 Worker/发火成功；专用 Project 另验实际 occurrence、停机迟到与 ERROR 恢复。"}], "toc": [{"title": "一页速览", "anchor": "一页速览", "level": "h2"}, {"title": "一个例子：规则、触发与执行分别看", "anchor": "一个例子规则触发与执行分别看", "level": "h2"}, {"title": "生命周期与发火", "anchor": "生命周期与发火", "level": "h2"}, {"title": "保存和执行边界", "anchor": "保存和执行边界", "level": "h2"}, {"title": "重叠检查到底看谁", "anchor": "重叠检查到底看谁", "level": "h3"}, {"title": "保存表单与触发预览", "anchor": "保存表单与触发预览", "level": "h2"}, {"title": "保存后的管理入口", "anchor": "保存后的管理入口", "level": "h3"}, {"title": "时间输入与展示的边界", "anchor": "时间输入与展示的边界", "level": "h3"}, {"title": "可靠性保证的限度", "anchor": "可靠性保证的限度", "level": "h2"}, {"title": "停机恢复的实际行为", "anchor": "停机恢复的实际行为", "level": "h3"}, {"title": "事务、并发与统计", "anchor": "事务并发与统计", "level": "h3"}, {"title": "可靠性修正要求（待实现）", "anchor": "可靠性修正要求待实现", "level": "h2"}, {"title": "认领记录与恢复权限", "anchor": "认领记录与恢复权限", "level": "h3"}, {"title": "配置并发与暂停", "anchor": "配置并发与暂停", "level": "h3"}, {"title": "结算、计数与未知结果", "anchor": "结算计数与未知结果", "level": "h3"}, {"title": "历史兼容与实施顺序", "anchor": "历史兼容与实施顺序", "level": "h3"}, {"title": "实现与验收", "anchor": "实现与验收", "level": "h2"}], "source": "design/task-scheduling.md", "checksum": "916ebfb9f0c3e374da601ae8ba479a860b819bc6d5f793e39b166720a8000cb1"}, {"id": "docs/design/subagents.md", "title": "并行子分析", "group": "design", "html": "\u003ch1 id=\"并行子分析\">并行子分析\u003c/h1>\n\u003cp>子分析属于一个 Run，不改变主目标/Session/审批链。共享额度见\u003ca href=\"#docs/design/run-budgets.md::\">Run 预算\u003c/a>，停止见\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a>；当前实现与接续范围见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>。\u003c/p>\n\u003ch2 id=\"责任与数据流\">责任与数据流\u003c/h2>\n\u003cp>PRIMARY 调用 subagent.dispatch/v1 → 多个只读子分析 → 结果/失败摘要与子 Session ID → Gateway 保存主 Session 的一条 ToolCall/Evidence → 返回主 Agent 汇总。\u003c/p>\n\u003cp>子 Session 为 SUBAGENT/BRANCH，共用父 RunAttempt；数据库只限制活动 PRIMARY 唯一，子支不写独立 RunEvent sequence，不成为第二执行器。\u003c/p>\n\u003ch2 id=\"一个例子完成的是哪一层\">一个例子：完成的是哪一层\u003c/h2>\n\u003cp>A 完成配置检查，B 读日志后失败，两支 Session 与 Gateway 审计都保存：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>看到什么\u003c/th>\n\u003cth>只说明什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Tool success\u003c/td>\n\u003ctd>整组符合返回协议，不是每支成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A COMPLETED / B FAILED\u003c/td>\n\u003ctd>仅 A 有有效结论，主结果保留 B 未完成的限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session 关闭\u003c/td>\n\u003ctd>生命周期已保存，不保证进程停/预算结清\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主 Run 仍执行\u003c/td>\n\u003ctd>主 Agent 还需综合证据与提交 Result\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>结论已有但 Session 保存未知时，v1 只能 Tool 错误，不能省略必需 ID；不自动再跑收费分支补数据。\u003c/p>\n\u003ch2 id=\"能力与故障边界\">能力与故障边界\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/agent/subagent.py\">resolve_subagent_capabilities\u003c/a>是唯一权限决定点：子能力不超父集合，排除 write、effect/propose、interaction、递归 dispatch；显式要求禁止能力时拒绝整组，不静默裁剪。\u003c/p>\n\u003cp>单次最多 4 支，各自 timeout，TaskGroup 持有全组并等待取消清理。单支失败可保留其余结论，但 Session/Gateway 审计失败是整组错误；coroutine 退出不等于真实进程停止。\u003c/p>\n\u003ch2 id=\"当前返回值的可信边界\">当前返回值的可信边界\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/agent/subagent_provider.py\">Provider\u003c/a>和\u003ca href=\"../PJM/backend/src/projectmind/agent/subagent_result.py\">收集器\u003c/a>已有以下接线：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>边界\u003c/th>\n\u003cth>当前处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>终端/结果\u003c/td>\n\u003ctd>唯一有效终端、正常收尾后调用共享 ResultValidator；中途文字不是成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失败\u003c/td>\n\u003ctd>ENGINE_FAILED/SESSION_INTERRUPTED、非法等待/提案、空流、冲突终端或终端后事件拒绝；本支 deadline 为 TIMED_OUT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>身份/顺序\u003c/td>\n\u003ctd>验 Run/Attempt、SDK Session identity 与本支 sequence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session\u003c/td>\n\u003ctd>recorder/validator 必需；保存异常、ID 数量/格式错按 unavailable，不省略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>摘要\u003c/td>\n\u003ctd>已验证 summary，最多 20,000 字符；Gateway UTF-8 响应上限另验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未闭合部分\u003c/td>\n\u003ctd>子 prompt 仍继承父 Schema/Brief/checksum；budget 是分配值、cost 空，未接共享账本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>主/子共用 stream 清理入口不等于同提交顺序；真实 SDK 退出另验。\u003c/p>\n\u003ch2 id=\"完成失败与审计如何表示\">完成、失败与审计如何表示\u003c/h2>\n\u003cp>COMPLETED 必须有符合该执行输出要求的有效终端，不是“无 Python 异常”。失败保留安全原因与已知 Session identity，不拿中途文字凑摘要。执行结论、Session 审计完整性、消费结清分别判断。\u003c/p>\n\u003cp>目标可在版本化协议下保留已验证结论并说明 Session 审计缺口；当前 v1 不支持，不能伪造 ID，也不能把预算保存变为 best-effort。收费执行身份必须先取得，不能等事后 Session 行产生。\u003c/p>\n\u003ch3 id=\"子任务指令与结果的边界\">子任务指令与结果的边界\u003c/h3>\n\u003cp>当前 derive_child_context 只改 prompt、权限、Tool 与局部分配；SDK output_format/validator 仍读父 result_schema，task_brief/checksum 与 engine_options_checksum 仍属父配置。局部子任务可能被迫输出完整父结果，也可能丢必需规则；父 hash 不证明实际子指令/options。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目标责任\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>子指令\u003c/td>\n\u003ctd>从冻结来源派生，保留必需规则/出处，只收窄目标/能力；记录 dispatch/branch 与实际模型指令依据/checksum\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子输出\u003c/td>\n\u003ctd>平台版本化只读分析结果，表达结论/证据/未覆盖范围，不生成父全部交付或效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共享校验\u003c/td>\n\u003ctd>复用敏感信息/引用归属/结构校验，不复制宽松 validator 或接受模型自选 Schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主结果\u003c/td>\n\u003ctd>综合各支、保留失败/未知，仍满足原 OutcomeEnvelope/任务 Schema\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>子指令不是新 Run/Segment，不覆盖父 Brief。prompt、SDK 格式、validator、审计与汇总引用同一子契约版本；即使 response 外形不变也要兼容审查，不先把目标字段塞进 v1。\u003c/p>\n\u003ch3 id=\"提交顺序与版本兼容\">提交顺序与版本兼容\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">各支终端检查 → 关闭 stream → 结果校验\n  → 全组收束\n  → TX A：保存整组 Session\n  → Provider response / Evidence 草稿\n  → Gateway 引用/敏感信息/Schema/大小校验\n  → TX B：Tool response / Evidence → 主 Session\n\u003c/code>\u003c/pre>\n\u003cp>A 成功、B 失败可留下 Session 而无成功 Tool 结果，不删行、不自动重跑；DB 锁内不等模型。SDK Session UUID 不等于平台行 ID，格式也不证明存在。\u003c/p>\n\u003cp>\u003ca href=\"../PJM/contracts/tools/subagent.dispatch/v1/response.schema.json\">v1 response\u003c/a>要求每支 agent_session_id，保存失败保持拒绝。审计降级另定可表达缺口的版本，同步 registry/Provider/Gateway/Evidence/Web/历史；旧消费者不得接收新结构。Tool 审计不可省略，提交未知查原调用。Session 重放、取消记录与跨事务恢复还须补齐。\u003c/p>\n\u003ch2 id=\"预算现状与修正设计\">预算现状与修正设计\u003c/h2>\n\u003cp>split_budget 每次重拆父冻结 turns/output，美元上限不拆，返回分配不是消费；连续 dispatch、主子混合和跨 Attempt/Segment 无累计保证。内部账本已有但 Provider 未调用。\u003c/p>\n\u003cp>目标全组原子预留后逐支启动，完成/超时/取消分别结算或保留未知。主模型等 Tool 不等于释放原承诺，不可复制父可花费额度；账本不可用拒绝新收费。规则唯一来源见\u003ca href=\"#docs/design/run-budgets.md::%E5%8E%9F%E5%AD%90%E6%80%A7%E4%B8%8E%E9%87%8D%E5%A4%8D%E8%AF%B7%E6%B1%82\">预留协议\u003c/a>。\u003c/p>\n\u003ch2 id=\"开发接续顺序\">开发接续顺序\u003c/h2>\n\u003cp>保持已有终端/validator/Gateway/整组清理回归；补停止核对、Session/Tool 未知提交/重放及子指令版本，接通可信计量与创建/主子统一预算后才开放新子协议。旧结果不覆盖，修异常不扩权/扩额。\u003c/p>\n\u003ch2 id=\"验收\">验收\u003c/h2>\n\u003cp>覆盖缩权与显式禁止、空流/冲突终端/非法等待、部分失败、复杂父 Schema 的独立子产出、实际 prompt/options 身份、v1 ID 可查询、A/B 提交失败与不重跑、主子同时占用/连续 dispatch/未知费用。入口：\u003ca href=\"../PJM/backend/tests/agent/test_subagent_lifecycle.py\">Gateway 生命周期回归\u003c/a>；真实 DB、SDK 和模型汇总效果分别验收。\u003c/p>\n", "sections": [{"title": "并行子分析", "level": "h1", "anchor": "并行子分析", "text": "# 并行子分析\n\n子分析属于一个 Run，不改变主目标/Session/审批链。共享额度见[Run 预算](run-budgets.md)，停止见[执行监督](run-supervision.md)；当前实现与接续范围见[计划](../planning/roadmap.md)。"}, {"title": "责任与数据流", "level": "h2", "anchor": "责任与数据流", "text": "## 责任与数据流\n\nPRIMARY 调用 subagent.dispatch/v1 → 多个只读子分析 → 结果/失败摘要与子 Session ID → Gateway 保存主 Session 的一条 ToolCall/Evidence → 返回主 Agent 汇总。\n\n子 Session 为 SUBAGENT/BRANCH，共用父 RunAttempt；数据库只限制活动 PRIMARY 唯一，子支不写独立 RunEvent sequence，不成为第二执行器。"}, {"title": "一个例子：完成的是哪一层", "level": "h2", "anchor": "一个例子完成的是哪一层", "text": "## 一个例子：完成的是哪一层\n\nA 完成配置检查，B 读日志后失败，两支 Session 与 Gateway 审计都保存：\n\n| 看到什么 | 只说明什么 |\n| --- | --- |\n| Tool success | 整组符合返回协议，不是每支成功 |\n| A COMPLETED / B FAILED | 仅 A 有有效结论，主结果保留 B 未完成的限制 |\n| Session 关闭 | 生命周期已保存，不保证进程停/预算结清 |\n| 主 Run 仍执行 | 主 Agent 还需综合证据与提交 Result |\n\n结论已有但 Session 保存未知时，v1 只能 Tool 错误，不能省略必需 ID；不自动再跑收费分支补数据。"}, {"title": "能力与故障边界", "level": "h2", "anchor": "能力与故障边界", "text": "## 能力与故障边界\n\n[resolve_subagent_capabilities](../../PJM/backend/src/projectmind/agent/subagent.py)是唯一权限决定点：子能力不超父集合，排除 write、effect/propose、interaction、递归 dispatch；显式要求禁止能力时拒绝整组，不静默裁剪。\n\n单次最多 4 支，各自 timeout，TaskGroup 持有全组并等待取消清理。单支失败可保留其余结论，但 Session/Gateway 审计失败是整组错误；coroutine 退出不等于真实进程停止。"}, {"title": "当前返回值的可信边界", "level": "h2", "anchor": "当前返回值的可信边界", "text": "## 当前返回值的可信边界\n\n[Provider](../../PJM/backend/src/projectmind/agent/subagent_provider.py)和[收集器](../../PJM/backend/src/projectmind/agent/subagent_result.py)已有以下接线：\n\n| 边界 | 当前处理 |\n| --- | --- |\n| 终端/结果 | 唯一有效终端、正常收尾后调用共享 ResultValidator；中途文字不是成功 |\n| 失败 | ENGINE_FAILED/SESSION_INTERRUPTED、非法等待/提案、空流、冲突终端或终端后事件拒绝；本支 deadline 为 TIMED_OUT |\n| 身份/顺序 | 验 Run/Attempt、SDK Session identity 与本支 sequence |\n| Session | recorder/validator 必需；保存异常、ID 数量/格式错按 unavailable，不省略 |\n| 摘要 | 已验证 summary，最多 20,000 字符；Gateway UTF-8 响应上限另验 |\n| 未闭合部分 | 子 prompt 仍继承父 Schema/Brief/checksum；budget 是分配值、cost 空，未接共享账本 |\n\n主/子共用 stream 清理入口不等于同提交顺序；真实 SDK 退出另验。"}, {"title": "完成、失败与审计如何表示", "level": "h2", "anchor": "完成失败与审计如何表示", "text": "## 完成、失败与审计如何表示\n\nCOMPLETED 必须有符合该执行输出要求的有效终端，不是“无 Python 异常”。失败保留安全原因与已知 Session identity，不拿中途文字凑摘要。执行结论、Session 审计完整性、消费结清分别判断。\n\n目标可在版本化协议下保留已验证结论并说明 Session 审计缺口；当前 v1 不支持，不能伪造 ID，也不能把预算保存变为 best-effort。收费执行身份必须先取得，不能等事后 Session 行产生。"}, {"title": "子任务指令与结果的边界", "level": "h3", "anchor": "子任务指令与结果的边界", "text": "### 子任务指令与结果的边界\n\n当前 derive_child_context 只改 prompt、权限、Tool 与局部分配；SDK output_format/validator 仍读父 result_schema，task_brief/checksum 与 engine_options_checksum 仍属父配置。局部子任务可能被迫输出完整父结果，也可能丢必需规则；父 hash 不证明实际子指令/options。\n\n| 目标责任 | 要求 |\n| --- | --- |\n| 子指令 | 从冻结来源派生，保留必需规则/出处，只收窄目标/能力；记录 dispatch/branch 与实际模型指令依据/checksum |\n| 子输出 | 平台版本化只读分析结果，表达结论/证据/未覆盖范围，不生成父全部交付或效果 |\n| 共享校验 | 复用敏感信息/引用归属/结构校验，不复制宽松 validator 或接受模型自选 Schema |\n| 主结果 | 综合各支、保留失败/未知，仍满足原 OutcomeEnvelope/任务 Schema |\n\n子指令不是新 Run/Segment，不覆盖父 Brief。prompt、SDK 格式、validator、审计与汇总引用同一子契约版本；即使 response 外形不变也要兼容审查，不先把目标字段塞进 v1。"}, {"title": "提交顺序与版本兼容", "level": "h3", "anchor": "提交顺序与版本兼容", "text": "### 提交顺序与版本兼容\n\n```text\n各支终端检查 → 关闭 stream → 结果校验\n  → 全组收束\n  → TX A：保存整组 Session\n  → Provider response / Evidence 草稿\n  → Gateway 引用/敏感信息/Schema/大小校验\n  → TX B：Tool response / Evidence → 主 Session\n```\n\nA 成功、B 失败可留下 Session 而无成功 Tool 结果，不删行、不自动重跑；DB 锁内不等模型。SDK Session UUID 不等于平台行 ID，格式也不证明存在。\n\n[v1 response](../../PJM/contracts/tools/subagent.dispatch/v1/response.schema.json)要求每支 agent_session_id，保存失败保持拒绝。审计降级另定可表达缺口的版本，同步 registry/Provider/Gateway/Evidence/Web/历史；旧消费者不得接收新结构。Tool 审计不可省略，提交未知查原调用。Session 重放、取消记录与跨事务恢复还须补齐。"}, {"title": "预算现状与修正设计", "level": "h2", "anchor": "预算现状与修正设计", "text": "## 预算现状与修正设计\n\nsplit_budget 每次重拆父冻结 turns/output，美元上限不拆，返回分配不是消费；连续 dispatch、主子混合和跨 Attempt/Segment 无累计保证。内部账本已有但 Provider 未调用。\n\n目标全组原子预留后逐支启动，完成/超时/取消分别结算或保留未知。主模型等 Tool 不等于释放原承诺，不可复制父可花费额度；账本不可用拒绝新收费。规则唯一来源见[预留协议](run-budgets.md#原子性与重复请求)。"}, {"title": "开发接续顺序", "level": "h2", "anchor": "开发接续顺序", "text": "## 开发接续顺序\n\n保持已有终端/validator/Gateway/整组清理回归；补停止核对、Session/Tool 未知提交/重放及子指令版本，接通可信计量与创建/主子统一预算后才开放新子协议。旧结果不覆盖，修异常不扩权/扩额。"}, {"title": "验收", "level": "h2", "anchor": "验收", "text": "## 验收\n\n覆盖缩权与显式禁止、空流/冲突终端/非法等待、部分失败、复杂父 Schema 的独立子产出、实际 prompt/options 身份、v1 ID 可查询、A/B 提交失败与不重跑、主子同时占用/连续 dispatch/未知费用。入口：[Gateway 生命周期回归](../../PJM/backend/tests/agent/test_subagent_lifecycle.py)；真实 DB、SDK 和模型汇总效果分别验收。"}], "toc": [{"title": "责任与数据流", "anchor": "责任与数据流", "level": "h2"}, {"title": "一个例子：完成的是哪一层", "anchor": "一个例子完成的是哪一层", "level": "h2"}, {"title": "能力与故障边界", "anchor": "能力与故障边界", "level": "h2"}, {"title": "当前返回值的可信边界", "anchor": "当前返回值的可信边界", "level": "h2"}, {"title": "完成、失败与审计如何表示", "anchor": "完成失败与审计如何表示", "level": "h2"}, {"title": "子任务指令与结果的边界", "anchor": "子任务指令与结果的边界", "level": "h3"}, {"title": "提交顺序与版本兼容", "anchor": "提交顺序与版本兼容", "level": "h3"}, {"title": "预算现状与修正设计", "anchor": "预算现状与修正设计", "level": "h2"}, {"title": "开发接续顺序", "anchor": "开发接续顺序", "level": "h2"}, {"title": "验收", "anchor": "验收", "level": "h2"}], "source": "design/subagents.md", "checksum": "265ca8f3d0a4116300d2468521b774c3bd079a46b8fafdda829d29396c85ac16"}, {"id": "docs/design/workspace.md", "title": "Workspace 与 Web 交互", "group": "design", "html": "\u003ch1 id=\"workspace-与-web-交互\">Workspace 与 Web 交互\u003c/h1>\n\u003cp>任务中心说明“能执行什么”，Workspace 观察“这一次发生什么”。本页负责布局、导航和交互交接；协议分别由\u003ca href=\"#docs/design/run-creation.md::\">创建\u003c/a>、\u003ca href=\"#docs/design/user-interactions.md::\">普通答复\u003c/a>、\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>、\u003ca href=\"#docs/design/results-evaluation.md::\">结果评价\u003c/a>定义。\u003c/p>\n\u003ch2 id=\"设计原则\">设计原则\u003c/h2>\n\u003cp>等待/批准在 Workspace、概览与导航都有持久入口，不以弹窗为唯一通知；服务端筛选待办，不只查首页。等待释放 Worker lease，但有独立期限。\u003c/p>\n\u003cp>技术终态、业务完整性、引用与人工判断分开；子分析部分失败显式展示未覆盖范围。前端不合成没有服务器依据的准备进度、百分比或外部成功。\u003c/p>\n\u003ch2 id=\"信息架构\">信息架构\u003c/h2>\n\u003ch3 id=\"导航层级\">导航层级\u003c/h3>\n\u003cp>平台含概览、组织技能库、项目管理、账户与安全；当前项目含任务中心/调度、Workspace、历史、文档、资源管理。Composition 的 module/role/task_group 是展示，不是权限。\u003c/p>\n\u003cp>登录属于 App 认证状态，不是 Project/hash 页面。\u003ca href=\"#docs/design/user-lifecycle.md::\">账户入口\u003c/a>属于平台，不依赖项目选择；本人安全设置与 ADMIN 的组织用户管理分区显示。\u003c/p>\n\u003ch3 id=\"路由\">路由\u003c/h3>\n\u003cp>现有 \u003ca href=\"../PJM/web/src/lib/routing.ts\">routing.ts\u003c/a>：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>hash\u003c/th>\n\u003cth>职责\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>#/\u003c/code>\u003c/td>\n\u003ctd>概览与待办\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/skills\u003c/code>、\u003ccode>#/projects\u003c/code>\u003c/td>\n\u003ctd>组织技能、项目管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/accounts\u003c/code>\u003c/td>\n\u003ctd>本人账户与安全、ADMIN 用户管理；不携带 Project/Run/Task 或账户搜索参数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/tasks?project=\u0026lt;id\u0026gt;\u003c/code>\u003c/td>\n\u003ctd>任务、Preflight、调度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/workspace?project=\u0026lt;id\u0026gt;\u0026amp;run=\u0026lt;id\u0026gt;\u003c/code>\u003c/td>\n\u003ctd>单 Run；task 参数可定位新任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/history?project=\u0026lt;id\u0026gt;\u003c/code>\u003c/td>\n\u003ctd>项目历史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>#/documents?project=\u0026lt;id\u0026gt;\u003c/code>、\u003ccode>#/resources?project=\u0026lt;id\u0026gt;\u003c/code>\u003c/td>\n\u003ctd>文档、Integration/Secret/Binding/预授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Interaction/Result 在 Workspace 内，无独立 path。显式无效 Project 保留目标、统一提示，不自动换项目；无参数初次选择、详情验证与失效恢复按\u003ca href=\"#docs/design/project-lifecycle.md::%E9%A1%B9%E7%9B%AE%E9%80%89%E6%8B%A9%E4%B8%8E%E5%A4%B1%E6%95%88%E9%93%BE%E6%8E%A5\">项目选择\u003c/a>处理。读取未确认时不挂载项目业务页面，账户等平台入口独立可用。路由不授予权限。\u003c/p>\n\u003cp>窄屏主导航通过菜单按钮展开完整入口，包括项目选择、语言与退出；收起内容不参与 Tab，Escape/选择后关闭并恢复焦点。项目列表失败与当前详情可读分别显示，归档目标有明确标记。切换项目清除旧 Run/Task 参数，返回和刷新仍按原 URL 目标验证。\u003c/p>\n\u003cp>项目管理的 ADMIN 成员页签遵循\u003ca href=\"#docs/design/project-lifecycle.md::%E6%88%90%E5%91%98%E7%AE%A1%E7%90%86%E9%A1%B5%E9%9D%A2\">成员页面规则\u003c/a>：成员关系与账户状态分开、候选服务端分页、先确认原目标、未知后只读核对。账户与成员共用请求的防重、期限和旧响应隔离实现，各自保留领域拒绝规则。\u003c/p>\n\u003cp>项目 CRUD 也共用请求边界，活动与归档列表由同一完整读取投影、共用一个写入门禁；\u003ca href=\"#docs/design/project-lifecycle.md::%E5%B9%B6%E5%8F%91%E4%BF%AE%E6%94%B9%E4%B8%8D%E8%83%BD%E5%8F%AA%E7%9C%8B%E6%9C%89%E6%97%A0%E8%A1%8C%E9%94%81\">原版本冲突与未知核对\u003c/a>保留原值/草稿/当前值，人工采用新版不自动提交。平台创建不依赖选中项目，首次默认选择到达不清空原草稿；成员和 module 仍使用真实项目授权边界。\u003c/p>\n\u003ch3 id=\"工作空间布局\">工作空间布局\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">项目/模块上下文\n├── 辅助区：新建执行、历史\n└── 当前 Run：状态、取消、等待\n    ├── Conversation / Result / Events\n    └── Evidence / Interaction / Proposal\n\u003c/code>\u003c/pre>\n\u003cp>窄屏收起辅助区仍保留状态/待办/结果，源码见 \u003ca href=\"../PJM/web/src/pages/WorkspacePage.tsx\">WorkspacePage\u003c/a>。\u003c/p>\n\u003ch2 id=\"渲染模式\">渲染模式\u003c/h2>\n\u003cp>当前平台 standard 组件读取 Blueprint、可选输入 Schema 与 Outcome；assisted 表示信息不足，不保证独立 renderer。缺 ViewSpec 不阻止任务，generated 尚无执行链路。\u003c/p>\n\u003ch2 id=\"viewspec-v1alpha1\">ViewSpec v1alpha1\u003c/h2>\n\u003cp>ViewSpec 是展示契约，不定义能力或权限。必填字段见 \u003ca href=\"../PJM/contracts/view-spec/v1alpha1.schema.json\">Schema\u003c/a>；新增组件/actions 同步 validator/renderer，合法声明不证明所有行为已实现。\u003c/p>\n\u003ch3 id=\"合法结构示例\">合法结构示例\u003c/h3>\n\u003cp>以下通过现有结构约束；schema_ref 仍需在真实发布上下文解析，不是完整可发布 package。\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \u0026quot;view_version\u0026quot;: \u0026quot;projectmind.view/v1alpha1\u0026quot;,\n  \u0026quot;key\u0026quot;: \u0026quot;standard-report\u0026quot;,\n  \u0026quot;title\u0026quot;: \u0026quot;分析结果\u0026quot;,\n  \u0026quot;mode\u0026quot;: \u0026quot;report\u0026quot;,\n  \u0026quot;input\u0026quot;: {\n    \u0026quot;schema_ref\u0026quot;: \u0026quot;schemas/input.json\u0026quot;,\n    \u0026quot;layout\u0026quot;: [{\u0026quot;component\u0026quot;: \u0026quot;schema-form\u0026quot;, \u0026quot;width\u0026quot;: 12}]\n  },\n  \u0026quot;preflight\u0026quot;: {\n    \u0026quot;sections\u0026quot;: [\u0026quot;selected_sources\u0026quot;, \u0026quot;automatic_tools\u0026quot;, \u0026quot;hard_denies\u0026quot;, \u0026quot;limits\u0026quot;]\n  },\n  \u0026quot;result\u0026quot;: {\n    \u0026quot;sections\u0026quot;: [\n      {\u0026quot;component\u0026quot;: \u0026quot;summary\u0026quot;, \u0026quot;pointer\u0026quot;: \u0026quot;/summary\u0026quot;},\n      {\u0026quot;component\u0026quot;: \u0026quot;evidence-panel\u0026quot;, \u0026quot;source\u0026quot;: \u0026quot;evidence_refs\u0026quot;}\n    ]\n  },\n  \u0026quot;actions\u0026quot;: [\u0026quot;run.execute\u0026quot;, \u0026quot;run.cancel\u0026quot;]\n}\n\u003c/code>\u003c/pre>\n\u003cp>JSON Pointer 仅读当前授权输入/结果；缺字段空状态，无任意表达式。未知 component/action 拒绝；未声明可回退，声明无效按发布 gate 处理。\u003c/p>\n\u003ch2 id=\"现行组件与声明组件\">现行组件与声明组件\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/web/src/components/TaskLaunchFields.tsx\">TaskLaunchFields\u003c/a>/taskDraft 为立即执行与调度共用，有 Schema 使用 SchemaTaskInput。能力/资源/权限 UI 不是可任意声明的组件协议。\u003c/p>\n\u003cp>Conversation、事件/Session、Interaction、Proposal 由平台组件负责；Task Center 不重复启动 SSE/取消状态机。RUNNING 不等于输入已物化，取消受理/终态不等于进程退出或用量结清，按\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a>显示现有事实。\u003c/p>\n\u003cp>\u003ca href=\"../PJM/web/src/components/RunResultPanel.tsx\">RunResultPanel\u003c/a>呈现 Outcome/Evidence/Evaluation；新增 run-flow 等 ViewSpec 名须先扩契约。\u003ca href=\"#docs/design/task-flow.md::\">Flow\u003c/a>只观察，不按建议节点猜进度。\u003c/p>\n\u003ch2 id=\"任务启动与执行\">任务启动与执行\u003c/h2>\n\u003cp>Preflight 显示精确 SkillVersion/task、输入、资源与 readiness；服务端创建重验。文档单份/集合/全集均显式确认，可选未选省略槽位；复用 DocumentSourceField，候选变化不悄悄覆盖草稿。\u003c/p>\n\u003cp>创建已分开可编辑草稿与已发送 payload/幂等键；未知先确认原请求，明确确认后才另开 Run。关闭弹窗保留待确认请求，刷新/离页不承诺恢复，见\u003ca href=\"#docs/design/run-creation.md::%E6%8F%90%E4%BA%A4%E7%BB%93%E6%9E%9C%E6%9C%AA%E7%9F%A5%E6%97%B6%E7%9A%84%E7%95%8C%E9%9D%A2%E8%B4%A3%E4%BB%BB\">创建未知\u003c/a>。\u003c/p>\n\u003cp>创建后按 Run ID 读 detail/SSE，持久 sequence 恢复，TEXT_DELTA 不推进 replay cursor。冻结资源不能中途换绑，变化须新 Run；多个文档槽位物化成 Run 级并集，不是私有隔离目录，见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>。\u003c/p>\n\u003ch2 id=\"结果与人工评价\">结果与人工评价\u003c/h2>\n\u003cp>摘要、交付、Findings、Evidence、限制、Proposal/Effect、Evaluation 分区。confidence 不是正确率，Artifact ref 不是已验证下载对象。\u003c/p>\n\u003cp>RunDocumentSnapshots 独立展示冻结槽位/模式/成员，即使尚无 Result；FROZEN 不代表已物化或仍可下载。缺失/历史不可用/校验失败与合法空数组区分，不查今天目录补旧事实，长 ID/hash 局部换行或滚动。\u003c/p>\n\u003ch3 id=\"evaluation\">Evaluation\u003c/h3>\n\u003cp>AI 原值、修订建议、理由与历史并列；多建议不自动合并，不续行。精确指针/包络规则见\u003ca href=\"#docs/design/results-evaluation.md::\">结果设计\u003c/a>。\u003c/p>\n\u003cp>当前表单一次一条修订、历史无分页、POST 无原请求幂等，state/abort 未闭合全部竞态；未知不套 Run 创建的重放协议，按\u003ca href=\"#docs/design/results-evaluation.md::%E6%8F%90%E4%BA%A4%E6%9C%AA%E7%9F%A5%E4%B8%8E%E7%95%8C%E9%9D%A2%E8%B4%A3%E4%BB%BB\">评价界面责任\u003c/a>接续。\u003c/p>\n\u003ch2 id=\"task-center\">Task Center\u003c/h2>\n\u003cp>列表使用服务端 task_id/latest_run 与精确版本，不由 UUID 或最近 N 条历史推导。已有选择任务、立即执行、创建/暂停/恢复/归档 Schedule；没有任意任务编辑/复制、对话建 Task 或结果比较。\u003c/p>\n\u003cp>ScheduleDialog 共用实际输入/文档字段；关闭销毁未保存草稿，换 actor/Project 不接收旧结果。修改 Schedule API/client 已有而页面入口缺失，需原配置/expected_row_version 与人工冲突比较。\u003c/p>\n\u003cp>当前只把前 100 条 Schedule 挂到可见 Task 卡片，失效任务规则可能无入口；目标独立管理列表、服务端分页/筛选。预览不创建 Run、不补造 end_at/max_runs 外次数；浏览器时区与规则 timezone 不能混同。\u003c/p>\n\u003cp>ONCE/CRON、重叠/错过/失效唯一规则见\u003ca href=\"#docs/design/task-scheduling.md::\">调度\u003c/a>。暂停不撤销已认领触发，run_count 不是成功数，last_run_at/last_run_id 未必同次，UI 不承诺全局串行或 exactly-once。\u003c/p>\n\u003ch2 id=\"对话与调整\">对话与调整\u003c/h2>\n\u003cp>普通 CLARIFICATION/CHOICE/REVIEW、外部批准、Skill 追加调整各走独立协议。终态新目标创建新 Run，不自动建 child 关系或自然语言任意管理入口。\u003c/p>\n\u003ch3 id=\"普通答复与续行状态\">普通答复与续行状态\u003c/h3>\n\u003cp>InteractionCard 是文本/选项，不换绑资源；有 Project 写权成员可答，外部批准身份不套所有问题。草稿与已发送原请求分开，复用共享防重、期限和旧响应隔离；待确认意图不因切标签、刷新详情或 OPEN 转为历史而丢失。\u003c/p>\n\u003cp>区分发送/确认/冲突/过期/未知；410 可能已提交过期并追加 Segment，原答复重放返回原续行与当前状态。读取详情不证明原 POST 成功；人工“确认原答复”沿原键与内容发送，可能完成此前未落库的首次提交。推荐不自动提交，required=false 不提供不存在的跳过，历史悬空批准只读。完整规则见\u003ca href=\"#docs/design/user-interactions.md::\">用户交互\u003c/a>。\u003c/p>\n\u003ch3 id=\"审批请求与执行结果\">审批请求与执行结果\u003c/h3>\n\u003cp>批准卡片在 RunResultPanel，PendingActionsPanel 仅发现待办。提交精确 Proposal version/checksum/decision/reason，服务端限制 Run 发起人或 ADMIN。\u003c/p>\n\u003cp>当前每次点击换 key，丢响应后再点可能冲突。目标保留原 payload/key，未知先确认，不让新 reason/相反决定偷用原键；发出/abort 不等于批准撤销，APPROVED 不显示外部成功。\u003c/p>\n\u003cp>切换 actor/Project/Proposal、刷新和未知明确处理，不把正文/token 存浏览器持久层，不据错误码猜“commit 已完成/PR 未创建”。新增回执须先有\u003ca href=\"#docs/design/repository-effects.md::\">效果契约\u003c/a>。\u003c/p>\n\u003ch2 id=\"项目文档管理的职责\">项目文档管理的职责\u003c/h2>\n\u003cp>文档页管理当前资产，Task 管草稿选择，Run 显示冻结事实。目录上传逐文件非整批事务；HTML 禁脚本不等于断网，列表消失不等于 blob/副本/备份清除。现有未知/同步防重/context 检查缺口见\u003ca href=\"#docs/design/document-lifecycle.md::\">文档设计\u003c/a>，不复刻协议。\u003c/p>\n\u003ch2 id=\"生成展示与流程的交接\">生成展示与流程的交接\u003c/h2>\n\u003cp>\u003ca href=\"#docs/design/generated-modules.md::\">生成模块\u003c/a>负责 builder、CSP、Host、版本/回退：现有业务 module API 和文档 iframe 不是生成入口，失败不得切换业务 SkillVersion。Flow 由\u003ca href=\"#docs/design/task-flow.md::\">流程设计\u003c/a>负责只读投影、冻结和事件关联，两者均不作为当前已完成能力。\u003c/p>\n\u003ch2 id=\"可访问性国际化与隐私\">可访问性、国际化与隐私\u003c/h2>\n\u003cp>zh/ja/en catalog 与服务端用户偏好已存在；report_language 独立于 UI 语言。状态不用单一颜色，键盘、焦点、窄屏/长内容可读；不将敏感正文写入遥测，不承诺所有任意输出已有统一清洗。\u003c/p>\n\u003ch2 id=\"回归验收\">回归验收\u003c/h2>\n\u003cul>\n\u003cli>精确任务/版本、有无 Schema、文档显式范围/历史损坏分别验证；创建未知保留原身份。\u003c/li>\n\u003cli>资产部分成功/未知/换 context，调度分页/失效任务/版本冲突/时区用真实组件验。\u003c/li>\n\u003cli>SSE 重连不重复、terminal 后结束；普通答复/批准/Evaluation 不互借幂等保证，原结果不变。\u003c/li>\n\u003cli>关闭弹窗仍有待办；410/未知/晚到与跨 actor 响应可解释，子分析失败范围不隐瞒。\u003c/li>\n\u003cli>三语、键盘、窄屏/长内容与焦点浏览器验收；Flow/generated 另走专项门禁。\u003c/li>\n\u003c/ul>\n\u003cp>源码与同步入口见\u003ca href=\"#PJM/README.md::web\">代码 README\u003c/a>、\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>，完成状态只维护\u003ca href=\"#docs/planning/roadmap.md::r10-%E5%85%A8%E9%83%A8-web-%E9%A1%B5%E9%9D%A2\">计划 R10\u003c/a>。\u003c/p>\n", "sections": [{"title": "Workspace 与 Web 交互", "level": "h1", "anchor": "workspace-与-web-交互", "text": "# Workspace 与 Web 交互\n\n任务中心说明“能执行什么”，Workspace 观察“这一次发生什么”。本页负责布局、导航和交互交接；协议分别由[创建](run-creation.md)、[普通答复](user-interactions.md)、[受控写入](repository-effects.md)、[结果评价](results-evaluation.md)定义。"}, {"title": "设计原则", "level": "h2", "anchor": "设计原则", "text": "## 设计原则\n\n等待/批准在 Workspace、概览与导航都有持久入口，不以弹窗为唯一通知；服务端筛选待办，不只查首页。等待释放 Worker lease，但有独立期限。\n\n技术终态、业务完整性、引用与人工判断分开；子分析部分失败显式展示未覆盖范围。前端不合成没有服务器依据的准备进度、百分比或外部成功。"}, {"title": "信息架构", "level": "h2", "anchor": "信息架构", "text": "## 信息架构"}, {"title": "导航层级", "level": "h3", "anchor": "导航层级", "text": "### 导航层级\n\n平台含概览、组织技能库、项目管理、账户与安全；当前项目含任务中心/调度、Workspace、历史、文档、资源管理。Composition 的 module/role/task_group 是展示，不是权限。\n\n登录属于 App 认证状态，不是 Project/hash 页面。[账户入口](user-lifecycle.md)属于平台，不依赖项目选择；本人安全设置与 ADMIN 的组织用户管理分区显示。"}, {"title": "路由", "level": "h3", "anchor": "路由", "text": "### 路由\n\n现有 [routing.ts](../../PJM/web/src/lib/routing.ts)：\n\n| hash | 职责 |\n| --- | --- |\n| `#/` | 概览与待办 |\n| `#/skills`、`#/projects` | 组织技能、项目管理 |\n| `#/accounts` | 本人账户与安全、ADMIN 用户管理；不携带 Project/Run/Task 或账户搜索参数 |\n| `#/tasks?project=\u003cid>` | 任务、Preflight、调度 |\n| `#/workspace?project=\u003cid>\u0026run=\u003cid>` | 单 Run；task 参数可定位新任务 |\n| `#/history?project=\u003cid>` | 项目历史 |\n| `#/documents?project=\u003cid>`、`#/resources?project=\u003cid>` | 文档、Integration/Secret/Binding/预授权 |\n\nInteraction/Result 在 Workspace 内，无独立 path。显式无效 Project 保留目标、统一提示，不自动换项目；无参数初次选择、详情验证与失效恢复按[项目选择](project-lifecycle.md#项目选择与失效链接)处理。读取未确认时不挂载项目业务页面，账户等平台入口独立可用。路由不授予权限。\n\n窄屏主导航通过菜单按钮展开完整入口，包括项目选择、语言与退出；收起内容不参与 Tab，Escape/选择后关闭并恢复焦点。项目列表失败与当前详情可读分别显示，归档目标有明确标记。切换项目清除旧 Run/Task 参数，返回和刷新仍按原 URL 目标验证。\n\n项目管理的 ADMIN 成员页签遵循[成员页面规则](project-lifecycle.md#成员管理页面)：成员关系与账户状态分开、候选服务端分页、先确认原目标、未知后只读核对。账户与成员共用请求的防重、期限和旧响应隔离实现，各自保留领域拒绝规则。\n\n项目 CRUD 也共用请求边界，活动与归档列表由同一完整读取投影、共用一个写入门禁；[原版本冲突与未知核对](project-lifecycle.md#并发修改不能只看有无行锁)保留原值/草稿/当前值，人工采用新版不自动提交。平台创建不依赖选中项目，首次默认选择到达不清空原草稿；成员和 module 仍使用真实项目授权边界。"}, {"title": "工作空间布局", "level": "h3", "anchor": "工作空间布局", "text": "### 工作空间布局\n\n```text\n项目/模块上下文\n├── 辅助区：新建执行、历史\n└── 当前 Run：状态、取消、等待\n    ├── Conversation / Result / Events\n    └── Evidence / Interaction / Proposal\n```\n\n窄屏收起辅助区仍保留状态/待办/结果，源码见 [WorkspacePage](../../PJM/web/src/pages/WorkspacePage.tsx)。"}, {"title": "渲染模式", "level": "h2", "anchor": "渲染模式", "text": "## 渲染模式\n\n当前平台 standard 组件读取 Blueprint、可选输入 Schema 与 Outcome；assisted 表示信息不足，不保证独立 renderer。缺 ViewSpec 不阻止任务，generated 尚无执行链路。"}, {"title": "ViewSpec v1alpha1", "level": "h2", "anchor": "viewspec-v1alpha1", "text": "## ViewSpec v1alpha1\n\nViewSpec 是展示契约，不定义能力或权限。必填字段见 [Schema](../../PJM/contracts/view-spec/v1alpha1.schema.json)；新增组件/actions 同步 validator/renderer，合法声明不证明所有行为已实现。"}, {"title": "合法结构示例", "level": "h3", "anchor": "合法结构示例", "text": "### 合法结构示例\n\n以下通过现有结构约束；schema_ref 仍需在真实发布上下文解析，不是完整可发布 package。\n\n```json\n{\n  \"view_version\": \"projectmind.view/v1alpha1\",\n  \"key\": \"standard-report\",\n  \"title\": \"分析结果\",\n  \"mode\": \"report\",\n  \"input\": {\n    \"schema_ref\": \"schemas/input.json\",\n    \"layout\": [{\"component\": \"schema-form\", \"width\": 12}]\n  },\n  \"preflight\": {\n    \"sections\": [\"selected_sources\", \"automatic_tools\", \"hard_denies\", \"limits\"]\n  },\n  \"result\": {\n    \"sections\": [\n      {\"component\": \"summary\", \"pointer\": \"/summary\"},\n      {\"component\": \"evidence-panel\", \"source\": \"evidence_refs\"}\n    ]\n  },\n  \"actions\": [\"run.execute\", \"run.cancel\"]\n}\n```\n\nJSON Pointer 仅读当前授权输入/结果；缺字段空状态，无任意表达式。未知 component/action 拒绝；未声明可回退，声明无效按发布 gate 处理。"}, {"title": "现行组件与声明组件", "level": "h2", "anchor": "现行组件与声明组件", "text": "## 现行组件与声明组件\n\n[TaskLaunchFields](../../PJM/web/src/components/TaskLaunchFields.tsx)/taskDraft 为立即执行与调度共用，有 Schema 使用 SchemaTaskInput。能力/资源/权限 UI 不是可任意声明的组件协议。\n\nConversation、事件/Session、Interaction、Proposal 由平台组件负责；Task Center 不重复启动 SSE/取消状态机。RUNNING 不等于输入已物化，取消受理/终态不等于进程退出或用量结清，按[执行监督](run-supervision.md)显示现有事实。\n\n[RunResultPanel](../../PJM/web/src/components/RunResultPanel.tsx)呈现 Outcome/Evidence/Evaluation；新增 run-flow 等 ViewSpec 名须先扩契约。[Flow](task-flow.md)只观察，不按建议节点猜进度。"}, {"title": "任务启动与执行", "level": "h2", "anchor": "任务启动与执行", "text": "## 任务启动与执行\n\nPreflight 显示精确 SkillVersion/task、输入、资源与 readiness；服务端创建重验。文档单份/集合/全集均显式确认，可选未选省略槽位；复用 DocumentSourceField，候选变化不悄悄覆盖草稿。\n\n创建已分开可编辑草稿与已发送 payload/幂等键；未知先确认原请求，明确确认后才另开 Run。关闭弹窗保留待确认请求，刷新/离页不承诺恢复，见[创建未知](run-creation.md#提交结果未知时的界面责任)。\n\n创建后按 Run ID 读 detail/SSE，持久 sequence 恢复，TEXT_DELTA 不推进 replay cursor。冻结资源不能中途换绑，变化须新 Run；多个文档槽位物化成 Run 级并集，不是私有隔离目录，见[资源快照](resource-snapshots.md)。"}, {"title": "结果与人工评价", "level": "h2", "anchor": "结果与人工评价", "text": "## 结果与人工评价\n\n摘要、交付、Findings、Evidence、限制、Proposal/Effect、Evaluation 分区。confidence 不是正确率，Artifact ref 不是已验证下载对象。\n\nRunDocumentSnapshots 独立展示冻结槽位/模式/成员，即使尚无 Result；FROZEN 不代表已物化或仍可下载。缺失/历史不可用/校验失败与合法空数组区分，不查今天目录补旧事实，长 ID/hash 局部换行或滚动。"}, {"title": "Evaluation", "level": "h3", "anchor": "evaluation", "text": "### Evaluation\n\nAI 原值、修订建议、理由与历史并列；多建议不自动合并，不续行。精确指针/包络规则见[结果设计](results-evaluation.md)。\n\n当前表单一次一条修订、历史无分页、POST 无原请求幂等，state/abort 未闭合全部竞态；未知不套 Run 创建的重放协议，按[评价界面责任](results-evaluation.md#提交未知与界面责任)接续。"}, {"title": "Task Center", "level": "h2", "anchor": "task-center", "text": "## Task Center\n\n列表使用服务端 task_id/latest_run 与精确版本，不由 UUID 或最近 N 条历史推导。已有选择任务、立即执行、创建/暂停/恢复/归档 Schedule；没有任意任务编辑/复制、对话建 Task 或结果比较。\n\nScheduleDialog 共用实际输入/文档字段；关闭销毁未保存草稿，换 actor/Project 不接收旧结果。修改 Schedule API/client 已有而页面入口缺失，需原配置/expected_row_version 与人工冲突比较。\n\n当前只把前 100 条 Schedule 挂到可见 Task 卡片，失效任务规则可能无入口；目标独立管理列表、服务端分页/筛选。预览不创建 Run、不补造 end_at/max_runs 外次数；浏览器时区与规则 timezone 不能混同。\n\nONCE/CRON、重叠/错过/失效唯一规则见[调度](task-scheduling.md)。暂停不撤销已认领触发，run_count 不是成功数，last_run_at/last_run_id 未必同次，UI 不承诺全局串行或 exactly-once。"}, {"title": "对话与调整", "level": "h2", "anchor": "对话与调整", "text": "## 对话与调整\n\n普通 CLARIFICATION/CHOICE/REVIEW、外部批准、Skill 追加调整各走独立协议。终态新目标创建新 Run，不自动建 child 关系或自然语言任意管理入口。"}, {"title": "普通答复与续行状态", "level": "h3", "anchor": "普通答复与续行状态", "text": "### 普通答复与续行状态\n\nInteractionCard 是文本/选项，不换绑资源；有 Project 写权成员可答，外部批准身份不套所有问题。草稿与已发送原请求分开，复用共享防重、期限和旧响应隔离；待确认意图不因切标签、刷新详情或 OPEN 转为历史而丢失。\n\n区分发送/确认/冲突/过期/未知；410 可能已提交过期并追加 Segment，原答复重放返回原续行与当前状态。读取详情不证明原 POST 成功；人工“确认原答复”沿原键与内容发送，可能完成此前未落库的首次提交。推荐不自动提交，required=false 不提供不存在的跳过，历史悬空批准只读。完整规则见[用户交互](user-interactions.md)。"}, {"title": "审批请求与执行结果", "level": "h3", "anchor": "审批请求与执行结果", "text": "### 审批请求与执行结果\n\n批准卡片在 RunResultPanel，PendingActionsPanel 仅发现待办。提交精确 Proposal version/checksum/decision/reason，服务端限制 Run 发起人或 ADMIN。\n\n当前每次点击换 key，丢响应后再点可能冲突。目标保留原 payload/key，未知先确认，不让新 reason/相反决定偷用原键；发出/abort 不等于批准撤销，APPROVED 不显示外部成功。\n\n切换 actor/Project/Proposal、刷新和未知明确处理，不把正文/token 存浏览器持久层，不据错误码猜“commit 已完成/PR 未创建”。新增回执须先有[效果契约](repository-effects.md)。"}, {"title": "项目文档管理的职责", "level": "h2", "anchor": "项目文档管理的职责", "text": "## 项目文档管理的职责\n\n文档页管理当前资产，Task 管草稿选择，Run 显示冻结事实。目录上传逐文件非整批事务；HTML 禁脚本不等于断网，列表消失不等于 blob/副本/备份清除。现有未知/同步防重/context 检查缺口见[文档设计](document-lifecycle.md)，不复刻协议。"}, {"title": "生成展示与流程的交接", "level": "h2", "anchor": "生成展示与流程的交接", "text": "## 生成展示与流程的交接\n\n[生成模块](generated-modules.md)负责 builder、CSP、Host、版本/回退：现有业务 module API 和文档 iframe 不是生成入口，失败不得切换业务 SkillVersion。Flow 由[流程设计](task-flow.md)负责只读投影、冻结和事件关联，两者均不作为当前已完成能力。"}, {"title": "可访问性、国际化与隐私", "level": "h2", "anchor": "可访问性国际化与隐私", "text": "## 可访问性、国际化与隐私\n\nzh/ja/en catalog 与服务端用户偏好已存在；report_language 独立于 UI 语言。状态不用单一颜色，键盘、焦点、窄屏/长内容可读；不将敏感正文写入遥测，不承诺所有任意输出已有统一清洗。"}, {"title": "回归验收", "level": "h2", "anchor": "回归验收", "text": "## 回归验收\n\n- 精确任务/版本、有无 Schema、文档显式范围/历史损坏分别验证；创建未知保留原身份。\n- 资产部分成功/未知/换 context，调度分页/失效任务/版本冲突/时区用真实组件验。\n- SSE 重连不重复、terminal 后结束；普通答复/批准/Evaluation 不互借幂等保证，原结果不变。\n- 关闭弹窗仍有待办；410/未知/晚到与跨 actor 响应可解释，子分析失败范围不隐瞒。\n- 三语、键盘、窄屏/长内容与焦点浏览器验收；Flow/generated 另走专项门禁。\n\n源码与同步入口见[代码 README](../../PJM/README.md#web)、[变更指南](../development/change-guide.md)，完成状态只维护[计划 R10](../planning/roadmap.md#r10-全部-web-页面)。"}], "toc": [{"title": "设计原则", "anchor": "设计原则", "level": "h2"}, {"title": "信息架构", "anchor": "信息架构", "level": "h2"}, {"title": "导航层级", "anchor": "导航层级", "level": "h3"}, {"title": "路由", "anchor": "路由", "level": "h3"}, {"title": "工作空间布局", "anchor": "工作空间布局", "level": "h3"}, {"title": "渲染模式", "anchor": "渲染模式", "level": "h2"}, {"title": "ViewSpec v1alpha1", "anchor": "viewspec-v1alpha1", "level": "h2"}, {"title": "合法结构示例", "anchor": "合法结构示例", "level": "h3"}, {"title": "现行组件与声明组件", "anchor": "现行组件与声明组件", "level": "h2"}, {"title": "任务启动与执行", "anchor": "任务启动与执行", "level": "h2"}, {"title": "结果与人工评价", "anchor": "结果与人工评价", "level": "h2"}, {"title": "Evaluation", "anchor": "evaluation", "level": "h3"}, {"title": "Task Center", "anchor": "task-center", "level": "h2"}, {"title": "对话与调整", "anchor": "对话与调整", "level": "h2"}, {"title": "普通答复与续行状态", "anchor": "普通答复与续行状态", "level": "h3"}, {"title": "审批请求与执行结果", "anchor": "审批请求与执行结果", "level": "h3"}, {"title": "项目文档管理的职责", "anchor": "项目文档管理的职责", "level": "h2"}, {"title": "生成展示与流程的交接", "anchor": "生成展示与流程的交接", "level": "h2"}, {"title": "可访问性、国际化与隐私", "anchor": "可访问性国际化与隐私", "level": "h2"}, {"title": "回归验收", "anchor": "回归验收", "level": "h2"}], "source": "design/workspace.md", "checksum": "c2e0f64464ffbf39529cc673d0d7d5ba82475ec033eee00cb0380a987334a02b"}, {"id": "docs/design/task-flow.md", "title": "Task Flow 与 Run Flow", "group": "design", "html": "\u003ch1 id=\"task-flow-与-run-flow\">Task Flow 与 Run Flow\u003c/h1>\n\u003cp>本页是后续展示设计，不是 Workflow Controller。当前没有 TaskFlowProjection Schema、持久字段或运行画布，状态见\u003ca href=\"#docs/planning/roadmap.md::r03-task-flow-%E5%AE%8C%E6%95%B4%E9%93%BE%E8%B7%AF\">计划 R03\u003c/a>。前置：\u003ca href=\"#docs/design/skill-contract.md::\">Skill 契约\u003c/a>、\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a>。\u003c/p>\n\u003ch2 id=\"目标\">目标\u003c/h2>\n\u003cp>用户一眼理解目标、资源准备、自动工作/人工确认和交付物。区分三层：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>视图\u003c/th>\n\u003cth>依据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Capability Map：Skill 能做什么\u003c/td>\n\u003ctd>精确 SkillVersion 的 Blueprint\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Task Flow：一个任务建议怎样完成\u003c/td>\n\u003ctd>一个 Task 的计划，当前 Project readiness 单独显示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run Flow：本次实际发生什么\u003c/td>\n\u003ctd>本 Run 冻结计划 + 审计事实，不读最新 Task 替换\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"一个例子计划不等于执行事实\">一个例子：计划不等于执行事实\u003c/h2>\n\u003cp>任务建议“读文档 → 分析 → 报告”，外部变更须批准。资源候选存在不代表 Run 已读取；无节点关联的子分析属于动态活动；分析完成不等于质量门禁通过；Proposal APPROVED 不等于 apply/read-back 成功。\u003c/p>\n\u003cp>未提出变更不伪造批准，缺事件也不自动“已跳过”。不按完成节点数虚构 80% 进度，推荐数量、实际活动和质量不是同一计量。\u003c/p>\n\u003ch2 id=\"已定决策\">已定决策\u003c/h2>\n\u003cul>\n\u003cli>Blueprint 是语义正本。节点只能引用既有 task/resource/guidance/interaction/effect/deliverable；真实能力改变走追加解释与新 DRAFT，不拖拽扩权。\u003c/li>\n\u003cli>每次展示一个 Task，不拼全 Skill 大图。首版只投影，不做 DAG/循环/自动分支/节点调度。\u003c/li>\n\u003cli>计划 strength 只有 required/recommended；required 须引用原规则/来源，不因模型建议升级。dynamic 是未关联实际活动，不写进 frozen plan。\u003c/li>\n\u003cli>required 是约束，不证明已有逐节点执行/完成检测。Agent 可在授权与预算内调整推荐步骤、追加只读验证。\u003c/li>\n\u003cli>编辑走 Interpretation adjustment/diff/发布；未来 Project overlay 只能添说明、检查点和推荐，不能删 required、绕批准或添能力。\u003c/li>\n\u003cli>Run 引入 Flow 后创建时冻结语义及 checksum；后续 Segment/Attempt、版本/配置/布局变化不替换旧计划。\u003c/li>\n\u003cli>SDK step_id 不等于节点 ID；未来可选 flow_node_ref 须在本 Run frozen flow 校验，无关联保持动态。\u003c/li>\n\u003cli>等待使用节点 + 持久待办双入口；关闭 Modal/离页不丢服务端 PendingActions，回答/批准仍走原 API 的权限/版本/CSRF/期限。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"taskflowprojection-目标契约\">TaskFlowProjection 目标契约\u003c/h2>\n\u003cp>尚未冻结的目标结构：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">TaskFlowProjection\n  flow_version / task_key\n  nodes: id / kind / title / strength / blueprint_refs / source_traces\n  edges: from / to / condition_label\n  checksum\n  layout\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>节点 kind\u003c/th>\n\u003cth>引用依据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>resource\u003c/td>\n\u003ctd>ResourceRequirement、binding/readiness\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>activity\u003c/td>\n\u003ctd>Task、已声明只读 capability、guidance\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gate\u003c/td>\n\u003ctd>success/quality criteria\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>interaction\u003c/td>\n\u003ctd>InteractionPoint/UserInteraction\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>effect\u003c/td>\n\u003ctd>EffectIntent/Proposal/批准策略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>deliverable\u003c/td>\n\u003ctd>Task deliverable、Result/Artifact\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>规则详情不全拆成节点。edges 是建议关系，condition_label 仅文字，不执行表达式/JS，不推导前置已完成。\u003c/p>\n\u003ch3 id=\"计划身份与显示布局\">计划身份与显示布局\u003c/h3>\n\u003cp>语义 checksum 覆盖协议版本、Task、节点/边/引用/约束；变更走 DRAFT/发布。布局位置、缩放、折叠不参与语义身份，但若保存仍要结构和文件完整性校验。\u003c/p>\n\u003cp>节点 ID 在计划内唯一，事件按 frozen flow 定位，不用标题、数组位置、SDK ID 或跨版同名猜测。实际状态不进入计划 checksum。规范化使用\u003ca href=\"../PJM/backend/src/projectmind/core/hashing.py\">共享 hash\u003c/a>，Schema/example、Backend/Web 同步冻结。\u003c/p>\n\u003ch3 id=\"从发布到历史重放\">从发布到历史重放\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">精确 Task/Blueprint → 来源验证/发布 Flow\n  → Run 创建冻结内容/checksum\n  → 持久事件与交互/效果可选关联\n  → 可重建的 Run Flow\n\u003c/code>\u003c/pre>\n\u003cp>只读阶段不提前造 frozen 字段。旧版没声明 Flow 时回退能力摘要/资源/动态步骤；新版声明却损坏应在发布/创建拒绝，历史显示不可用并保留事件，不用最新蓝图修饰旧事实。\u003c/p>\n\u003cp>同步点包括 Blueprint/projector、Brief/checksum、Run detail/SSE、Web validator/view、Schema/example 与历史兼容。\u003c/p>\n\u003ch2 id=\"目标用户体验\">目标用户体验\u003c/h2>\n\u003cp>Skill 页面默认流程预览，report/Blueprint/diff/source trace 作详情；Task Center 查看单任务 Flow 并叠加当前资源 readiness，只有合法 Provider/binding 才显示可执行。\u003c/p>\n\u003cp>Workspace 展示计划、动态活动、等待、证据与下一步；Conversation/Result/Technical Events 保留。窄屏提供抽屉和键盘列表 fallback，不依赖拖拽/颜色，三语、长标题和未知原因可读。\u003c/p>\n\u003ch2 id=\"实施工作包\">实施工作包\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>必须交付\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>只读投影\u003c/td>\n\u003ctd>复用现有 Blueprint/Task/readiness，能懂资源/建议/确认/产物，不改变执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>契约与 DRAFT\u003c/td>\n\u003ctd>可选 Schema、解释/校验、diff/编辑、发布身份和不扩权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 观察\u003c/td>\n\u003ctd>frozen flow、动态活动、可选关联、SSE 重放/重连与子分析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交互/证据联动\u003c/td>\n\u003ctd>原 API、持久待办、详情跳转、权限与状态一致\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>只读预览不是完整链路完成；不依赖 generated FrontendModule、不增业务 Provider 分支、不形成第二个 Run controller。\u003c/p>\n\u003ch2 id=\"节点状态的事实来源\">节点状态的事实来源\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>信息\u003c/th>\n\u003cth>依据与不可推导项\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>resource\u003c/td>\n\u003ctd>Task 看 readiness，Run 看冻结/真实准备；候选不等于读成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>activity\u003c/td>\n\u003ctd>关联 STEP 开始/完成/失败；活动完成不证明业务规则全过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gate\u003c/td>\n\u003ctd>明确检查结果、Evidence/人工确认；模型口头声明不足\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>interaction\u003c/td>\n\u003ctd>持久状态、Response/期限；关窗/发送中不等于受理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>effect\u003c/td>\n\u003ctd>Proposal/Approval/EffectExecution 分别显示；批准不等于外部成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>deliverable\u003c/td>\n\u003ctd>实际 Result/Artifact 及可访问性；SUCCEEDED 不补造产物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dynamic\u003c/td>\n\u003ctd>无关联实际事件/子分析；不倒写计划或升级 required\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>没有事件写“尚无执行证据”；未知/失败/无关联以文字区分。旧 Run 无 flow 时仅显示当时活动；若旁列最新 Task，明确它不是原计划，不与旧完成状态拼接。\u003c/p>\n\u003ch2 id=\"完成标准\">完成标准\u003c/h2>\n\u003cul>\n\u003cli>无 Flow 的 Skill 正常运行；拖布局不改语义，新发布不覆盖旧 Run。\u003c/li>\n\u003cli>删 required/添能力拒绝；损坏新契约与未声明旧契约分开处理。\u003c/li>\n\u003cli>SSE 重复/断线可重建，无关联不猜节点，不重复计数。\u003c/li>\n\u003cli>关闭弹窗仍有待办；回答、批准、apply/read-back 是不同事实。\u003c/li>\n\u003cli>Schema/consumer/三语与历史兼容同时回归；实际浏览器验证键盘/窄屏/来源与失败可读，图能显示不算全部验收。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "Task Flow 与 Run Flow", "level": "h1", "anchor": "task-flow-与-run-flow", "text": "# Task Flow 与 Run Flow\n\n本页是后续展示设计，不是 Workflow Controller。当前没有 TaskFlowProjection Schema、持久字段或运行画布，状态见[计划 R03](../planning/roadmap.md#r03-task-flow-完整链路)。前置：[Skill 契约](skill-contract.md)、[Workspace](workspace.md)。"}, {"title": "目标", "level": "h2", "anchor": "目标", "text": "## 目标\n\n用户一眼理解目标、资源准备、自动工作/人工确认和交付物。区分三层：\n\n| 视图 | 依据 |\n| --- | --- |\n| Capability Map：Skill 能做什么 | 精确 SkillVersion 的 Blueprint |\n| Task Flow：一个任务建议怎样完成 | 一个 Task 的计划，当前 Project readiness 单独显示 |\n| Run Flow：本次实际发生什么 | 本 Run 冻结计划 + 审计事实，不读最新 Task 替换 |"}, {"title": "一个例子：计划不等于执行事实", "level": "h2", "anchor": "一个例子计划不等于执行事实", "text": "## 一个例子：计划不等于执行事实\n\n任务建议“读文档 → 分析 → 报告”，外部变更须批准。资源候选存在不代表 Run 已读取；无节点关联的子分析属于动态活动；分析完成不等于质量门禁通过；Proposal APPROVED 不等于 apply/read-back 成功。\n\n未提出变更不伪造批准，缺事件也不自动“已跳过”。不按完成节点数虚构 80% 进度，推荐数量、实际活动和质量不是同一计量。"}, {"title": "已定决策", "level": "h2", "anchor": "已定决策", "text": "## 已定决策\n\n- Blueprint 是语义正本。节点只能引用既有 task/resource/guidance/interaction/effect/deliverable；真实能力改变走追加解释与新 DRAFT，不拖拽扩权。\n- 每次展示一个 Task，不拼全 Skill 大图。首版只投影，不做 DAG/循环/自动分支/节点调度。\n- 计划 strength 只有 required/recommended；required 须引用原规则/来源，不因模型建议升级。dynamic 是未关联实际活动，不写进 frozen plan。\n- required 是约束，不证明已有逐节点执行/完成检测。Agent 可在授权与预算内调整推荐步骤、追加只读验证。\n- 编辑走 Interpretation adjustment/diff/发布；未来 Project overlay 只能添说明、检查点和推荐，不能删 required、绕批准或添能力。\n- Run 引入 Flow 后创建时冻结语义及 checksum；后续 Segment/Attempt、版本/配置/布局变化不替换旧计划。\n- SDK step_id 不等于节点 ID；未来可选 flow_node_ref 须在本 Run frozen flow 校验，无关联保持动态。\n- 等待使用节点 + 持久待办双入口；关闭 Modal/离页不丢服务端 PendingActions，回答/批准仍走原 API 的权限/版本/CSRF/期限。"}, {"title": "TaskFlowProjection 目标契约", "level": "h2", "anchor": "taskflowprojection-目标契约", "text": "## TaskFlowProjection 目标契约\n\n尚未冻结的目标结构：\n\n```text\nTaskFlowProjection\n  flow_version / task_key\n  nodes: id / kind / title / strength / blueprint_refs / source_traces\n  edges: from / to / condition_label\n  checksum\n  layout\n```\n\n| 节点 kind | 引用依据 |\n| --- | --- |\n| resource | ResourceRequirement、binding/readiness |\n| activity | Task、已声明只读 capability、guidance |\n| gate | success/quality criteria |\n| interaction | InteractionPoint/UserInteraction |\n| effect | EffectIntent/Proposal/批准策略 |\n| deliverable | Task deliverable、Result/Artifact |\n\n规则详情不全拆成节点。edges 是建议关系，condition_label 仅文字，不执行表达式/JS，不推导前置已完成。"}, {"title": "计划身份与显示布局", "level": "h3", "anchor": "计划身份与显示布局", "text": "### 计划身份与显示布局\n\n语义 checksum 覆盖协议版本、Task、节点/边/引用/约束；变更走 DRAFT/发布。布局位置、缩放、折叠不参与语义身份，但若保存仍要结构和文件完整性校验。\n\n节点 ID 在计划内唯一，事件按 frozen flow 定位，不用标题、数组位置、SDK ID 或跨版同名猜测。实际状态不进入计划 checksum。规范化使用[共享 hash](../../PJM/backend/src/projectmind/core/hashing.py)，Schema/example、Backend/Web 同步冻结。"}, {"title": "从发布到历史重放", "level": "h3", "anchor": "从发布到历史重放", "text": "### 从发布到历史重放\n\n```text\n精确 Task/Blueprint → 来源验证/发布 Flow\n  → Run 创建冻结内容/checksum\n  → 持久事件与交互/效果可选关联\n  → 可重建的 Run Flow\n```\n\n只读阶段不提前造 frozen 字段。旧版没声明 Flow 时回退能力摘要/资源/动态步骤；新版声明却损坏应在发布/创建拒绝，历史显示不可用并保留事件，不用最新蓝图修饰旧事实。\n\n同步点包括 Blueprint/projector、Brief/checksum、Run detail/SSE、Web validator/view、Schema/example 与历史兼容。"}, {"title": "目标用户体验", "level": "h2", "anchor": "目标用户体验", "text": "## 目标用户体验\n\nSkill 页面默认流程预览，report/Blueprint/diff/source trace 作详情；Task Center 查看单任务 Flow 并叠加当前资源 readiness，只有合法 Provider/binding 才显示可执行。\n\nWorkspace 展示计划、动态活动、等待、证据与下一步；Conversation/Result/Technical Events 保留。窄屏提供抽屉和键盘列表 fallback，不依赖拖拽/颜色，三语、长标题和未知原因可读。"}, {"title": "实施工作包", "level": "h2", "anchor": "实施工作包", "text": "## 实施工作包\n\n| 阶段 | 必须交付 |\n| --- | --- |\n| 只读投影 | 复用现有 Blueprint/Task/readiness，能懂资源/建议/确认/产物，不改变执行 |\n| 契约与 DRAFT | 可选 Schema、解释/校验、diff/编辑、发布身份和不扩权 |\n| Run 观察 | frozen flow、动态活动、可选关联、SSE 重放/重连与子分析 |\n| 交互/证据联动 | 原 API、持久待办、详情跳转、权限与状态一致 |\n\n只读预览不是完整链路完成；不依赖 generated FrontendModule、不增业务 Provider 分支、不形成第二个 Run controller。"}, {"title": "节点状态的事实来源", "level": "h2", "anchor": "节点状态的事实来源", "text": "## 节点状态的事实来源\n\n| 信息 | 依据与不可推导项 |\n| --- | --- |\n| resource | Task 看 readiness，Run 看冻结/真实准备；候选不等于读成功 |\n| activity | 关联 STEP 开始/完成/失败；活动完成不证明业务规则全过 |\n| gate | 明确检查结果、Evidence/人工确认；模型口头声明不足 |\n| interaction | 持久状态、Response/期限；关窗/发送中不等于受理 |\n| effect | Proposal/Approval/EffectExecution 分别显示；批准不等于外部成功 |\n| deliverable | 实际 Result/Artifact 及可访问性；SUCCEEDED 不补造产物 |\n| dynamic | 无关联实际事件/子分析；不倒写计划或升级 required |\n\n没有事件写“尚无执行证据”；未知/失败/无关联以文字区分。旧 Run 无 flow 时仅显示当时活动；若旁列最新 Task，明确它不是原计划，不与旧完成状态拼接。"}, {"title": "完成标准", "level": "h2", "anchor": "完成标准", "text": "## 完成标准\n\n- 无 Flow 的 Skill 正常运行；拖布局不改语义，新发布不覆盖旧 Run。\n- 删 required/添能力拒绝；损坏新契约与未声明旧契约分开处理。\n- SSE 重复/断线可重建，无关联不猜节点，不重复计数。\n- 关闭弹窗仍有待办；回答、批准、apply/read-back 是不同事实。\n- Schema/consumer/三语与历史兼容同时回归；实际浏览器验证键盘/窄屏/来源与失败可读，图能显示不算全部验收。"}], "toc": [{"title": "目标", "anchor": "目标", "level": "h2"}, {"title": "一个例子：计划不等于执行事实", "anchor": "一个例子计划不等于执行事实", "level": "h2"}, {"title": "已定决策", "anchor": "已定决策", "level": "h2"}, {"title": "TaskFlowProjection 目标契约", "anchor": "taskflowprojection-目标契约", "level": "h2"}, {"title": "计划身份与显示布局", "anchor": "计划身份与显示布局", "level": "h3"}, {"title": "从发布到历史重放", "anchor": "从发布到历史重放", "level": "h3"}, {"title": "目标用户体验", "anchor": "目标用户体验", "level": "h2"}, {"title": "实施工作包", "anchor": "实施工作包", "level": "h2"}, {"title": "节点状态的事实来源", "anchor": "节点状态的事实来源", "level": "h2"}, {"title": "完成标准", "anchor": "完成标准", "level": "h2"}], "source": "design/task-flow.md", "checksum": "42dd157964615937fe0ee8de60aed985854158f4696dc435068436233134be0e"}, {"id": "docs/design/generated-modules.md", "title": "生成 FrontendModule", "group": "design", "html": "\u003ch1 id=\"生成-frontendmodule\">生成 FrontendModule\u003c/h1>\n\u003cp>本页负责生成界面的构建、隔离、版本和回退；业务仍由 \u003ca href=\"#docs/design/skill-contract.md::\">SkillVersion\u003c/a>定义，执行事实由 \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>保存。当前仅有版本模型、migration 0026 与纯检查函数，尚无 builder、投放、Preview 或 Host；状态见\u003ca href=\"#docs/planning/roadmap.md::r04-%E7%94%9F%E6%88%90%E6%A8%A1%E5%9D%97\">计划 R04\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清三种模块与预览\">先分清三种模块与预览\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>业务模块\u003c/td>\n\u003ctd>SkillComposition 组合精确 SkillVersion；现有 projects/modules API 只管理此对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成界面\u003c/td>\n\u003ctd>FrontendModuleVersion 对应隔离展示产物，不是新的业务能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档预览\u003c/td>\n\u003ctd>DocumentManagerPanel 的禁脚本 HTML，不可加 allow-scripts 当作生成 Preview\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>standard/ViewSpec 是平台受控展示，不执行生成 React/TS。任何预览已经执行生成代码，必须先满足首次执行门禁。\u003c/p>\n\u003ch2 id=\"一个例子图表坏了任务没有失败\">一个例子：图表坏了，任务没有失败\u003c/h2>\n\u003cp>Run 使用 SkillVersion A，生成展示 G2 初始化超时：Host 关闭本页 iframe/通道，使用 standard 展示同一 Result/Evidence。它不重跑任务、不改变 A、不自动全局停版。管理员可另选兼容且未停用的 G1；这是目标行为，当前未实现。\u003c/p>\n\u003ch2 id=\"目标与流水线\">目标与流水线\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">冻结源码/依赖/构建配置 → 静态检查\n  → 隔离构建与断网测试 → 冻结产物/CSP/报告\n  → 隔离预览 → ADMIN 发布 → 独立展示选择\n  → Host 受控交互；本页失败回退 standard\n\u003c/code>\u003c/pre>\n\u003cp>生成模块只呈现，不创建后端服务、DB、Secret、Tool 或权限。独立 builder 不接 edge、不挂凭据或 Docker socket，只使用批准依赖来源。\u003c/p>\n\u003ch2 id=\"现有代码与公开契约\">现有代码与公开契约\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前载体\u003c/th>\n\u003cth>不能推导的保证\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>FrontendModuleVersion / 0026\u003c/td>\n\u003ctd>有状态/hash/CSP/报告列，但无 service/repository 接线或完整 DB 不可变保护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plan_module_transition / require_publishable\u003c/td>\n\u003ctd>检查状态、bundle_hash、静态拒绝；不验证 blob/hash、完整报告或浏览器安全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>analyze_module_sources / validate_dependencies / plan_module_build\u003c/td>\n\u003ctd>局部前置函数，不执行安装、构建、隔离或投放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RuntimeManifest\u003c/td>\n\u003ctd>ui.frontend_module 当前只允许 null；Module API 常量不是 Host Schema/SDK\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>源码入口：\u003ca href=\"../PJM/backend/src/projectmind/modules\">modules\u003c/a>，契约入口：\u003ca href=\"../PJM/contracts/runtime-manifest/v1alpha1.schema.json\">RuntimeManifest\u003c/a>。不可给业务 module API 临时加 bundle URL，或借 ViewSpec 绕开协议。\u003c/p>\n\u003ch2 id=\"决策与安全边界\">决策与安全边界\u003c/h2>\n\u003ch3 id=\"origin-与-csp\">Origin 与 CSP\u003c/h3>\n\u003cp>目标使用同主机 context path 下的专用 bundle-hash 路径。iframe 固定 sandbox=\u0026quot;allow-scripts\u0026quot;，无 allow-same-origin、弹窗、顶层导航和下载权限；HTTP 响应还必须带 Content-Security-Policy: sandbox allow-scripts，覆盖直接导航。meta/Report-Only 的 sandbox 无效，见 \u003ca href=\"https://www.w3.org/TR/CSP3/#directive-sandbox\">CSP 规范\u003c/a>。\u003c/p>\n\u003cp>opaque origin 不保证加载请求不带本主机 cookie；静态路径不处理业务 mutation，API 的认证、Origin/CSRF 和所有权仍独立检查。同主机方案须专项威胁建模，不能视为独立站点等价隔离。\u003c/p>\n\u003cp>产物与脚本/样式 CSP 同时冻结，优先内容 hash；采用 nonce 时先定义响应、缓存和完整性，不固定 nonce 长期复用。不以 unsafe-inline/unsafe-eval、宽泛公网或未经验证的 'self' 修复报错。\u003c/p>\n\u003cp>CSP 同时约束加载、base-uri、form-action、frame/object/worker 与嵌入方；connect-src 不是全部网络/导航控制，必须实际验证正向渲染及负向出网。\u003c/p>\n\u003ch3 id=\"当前-csp-常量不是投放配置\">当前 CSP 常量不是投放配置\u003c/h3>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/modules/domain.py\">domain.py\u003c/a>仍有 script-src 'self'、style 的 unsafe-inline 等目标差距，未被投放路由使用。字符串测试不证明浏览器安全；旧记录缺验证时保持不可运行，不覆盖旧 CSP 伪造验收。\u003c/p>\n\u003ch3 id=\"静态拒绝与依赖\">静态拒绝与依赖\u003c/h3>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/modules/static_analysis.py\">static_analysis.py\u003c/a>按字面拒绝动态代码、网络调用、宿主 context、外部 URL、动态 import 和持久存储访问；可能误报、漏过间接调用。通过不是执行许可，报告摘录也可能敏感。\u003c/p>\n\u003cp>依赖声明允许 react/react-dom/@projectmind/module-sdk/@projectmind/ui，不证明内部包已经可用。目标冻结版本与完整 lockfile 闭包，禁止 lifecycle script、native/Git/动态依赖；先验证 manifest 形状，再检查实际取得的所有包，不能只检查顶层声明。\u003c/p>\n\u003ch3 id=\"构建网络\">构建网络\u003c/h3>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/modules/build_plan.py\">build_plan.py\u003c/a>只拒绝已知公共来源与部分 lockfile URL，不是 egress allowlist。实际 builder 必须批准 registry/mirror，校验 resolved URL、重定向及出口并阻断其他网络，构建后断网测试；不能靠扩大 host 黑名单代替。\u003c/p>\n\u003ch3 id=\"构建输入与结果的提交\">构建输入与结果的提交\u003c/h3>\n\u003col>\n\u003cli>冻结源码、lockfile、依赖闭包、工具链/构建器、策略和限额，创建可审计请求；不接受来源自选 Shell/输出路径。\u003c/li>\n\u003cli>独立临时目录执行平台固定命令；CPU、内存、进程、磁盘、时间、产物大小各自限额，不运行安装脚本。\u003c/li>\n\u003cli>受信提交者核对请求身份、完整产物/hash 与静态/隔离报告后提交 BUILT；网络 I/O 不占长期 DB 锁。\u003c/li>\n\u003cli>未知提交核对原构建身份，不重复发布；无完整记录的 blob 不投放，孤立产物可延后清理。BUILT、Preview、PUBLISHED、展示选择分别决定。\u003c/li>\n\u003c/ol>\n\u003cp>报告、源码与产物须有授权读取、保留与恢复规则，不向普通成员暴露原始错误/路径。\u003c/p>\n\u003ch2 id=\"host-协议\">Host 协议\u003c/h2>\n\u003cp>尚未冻结公开协议。消息 origin 可能为 null，Host 必须同时验证 source window、随机 channel nonce、精确模块版本、当前 Project/Task/Run 与 payload Schema；nonce 是挂载身份，不是账号权限。\u003c/p>\n\u003cp>只允许最小 context/result、草稿更新、打开平台 Preflight/调度草稿、订阅当前 Run、请求 Host 展示授权 Evidence/Artifact。草稿不自动提交，不发放任意 URL 读取能力；禁止直接 API、批准、管理用户/Skill/Secret 或读取其他 Run。\u003c/p>\n\u003ch3 id=\"挂载切换与晚到消息\">挂载、切换与晚到消息\u003c/h3>\n\u003cp>版本、账号、Project/Task/Run 切换，iframe 重载/导航或回退时关闭旧通道/订阅，丢弃晚到响应；同窗口引用也不能跨导航延续信任。草稿更新需校验当前版本。\u003c/p>\n\u003cp>初始化若必须向 opaque 接收方用 *，引导不得含业务内容或凭据；专用通道、nonce、导航失效须评审后才传真实数据，见 \u003ca href=\"https://html.spec.whatwg.org/multipage/web-messaging.html#security-postmsg\">消息安全规范\u003c/a>。限制 payload、速率、在途和重复动作，未知协议拒绝，不做通用 API proxy。\u003c/p>\n\u003ch2 id=\"版本与回退\">版本与回退\u003c/h2>\n\u003cp>版本绑定精确 SkillVersion，冻结 source/lockfile/bundle hash、Module API、CSP 与报告。DRAFT → BUILT → PUBLISHED，各阶段可 DISABLED，停用不可恢复；事务与审计尚待实现。\u003c/p>\n\u003ch3 id=\"内容身份与历史兼容\">内容身份与历史兼容\u003c/h3>\n\u003cp>当前唯一键 (skill_version_id, source_hash) 不能表达只换 lockfile/工具链/CSP 的新版本。目标区分源码身份、完整构建输入身份、产物身份：同输入重试确认原请求，不同输入创建新版本，不伪造 source_hash 或覆盖旧 bundle。\u003c/p>\n\u003cp>同时设计 model/migration/repository、唯一约束与发布契约；保留旧 ID/hash/引用，缺验证的旧行不自动可投放，frozen DTO 不替代 DB 内容保护。\u003c/p>\n\u003ch3 id=\"展示选择与全局停用\">展示选择与全局停用\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>目标处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>本页超时、崩溃、协议错误\u003c/td>\n\u003ctd>关闭实例，保留草稿/焦点，standard 展示原结果；不重试业务或全局停版\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回选旧展示版\u003c/td>\n\u003ctd>经授权和并发检查选择兼容、仍可投放版本；不改 Run 或复活 DISABLED\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>管理员/安全停用\u003c/td>\n\u003ctd>记录 actor/原因/原选择，阻止新投放并使 Host 失效；不由不可信客户端错误单独触发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无模块、不兼容、历史验证不足\u003c/td>\n\u003ctd>standard，不猜 latest，不重新运行旧任务\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>不能切换 ProjectComposition 的业务 SkillVersion 来修复界面。bundle hash 不是授权，缓存不能越过 Project/停用检查；已下载字节不可收回，撤回传播、Host 断开与备份恢复须独立验收。\u003c/p>\n\u003ch2 id=\"实施顺序与验收\">实施顺序与验收\u003c/h2>\n\u003cp>按完整身份/契约 → builder → 安全投放/Host → 发布/展示选择/回退推进；未满足威胁模型与隔离门禁前不执行生成代码。\u003c/p>\n\u003cul>\n\u003cli>同源码换依赖/策略有新身份；超时重试无重复发布，未知可确认。\u003c/li>\n\u003cli>拒绝外部 host/重定向、传递脚本、伪造报告和超额产物，无半份可运行产物。\u003c/li>\n\u003cli>直接导航/iframe/缓存/错误响应检验实际 CSP；允许渲染正常，禁止的网络/DOM/导航失败。\u003c/li>\n\u003cli>null-origin 伪造、错 nonce、旧 iframe、换 actor/context、过大/重复消息不泄漏、不覆盖草稿、不写业务。\u003c/li>\n\u003cli>G2 失败、旧版不兼容与全局停用都能保留同一结果的 standard 入口；三语、键盘、窄屏可用。\u003c/li>\n\u003cli>\u003ca href=\"../PJM/backend/tests/modules\">局部回归\u003c/a>不代替真实 builder、代理和浏览器安全验收。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "生成 FrontendModule", "level": "h1", "anchor": "生成-frontendmodule", "text": "# 生成 FrontendModule\n\n本页负责生成界面的构建、隔离、版本和回退；业务仍由 [SkillVersion](skill-contract.md)定义，执行事实由 [Runtime](agent-runtime.md)保存。当前仅有版本模型、migration 0026 与纯检查函数，尚无 builder、投放、Preview 或 Host；状态见[计划 R04](../planning/roadmap.md#r04-生成模块)。"}, {"title": "先分清三种模块与预览", "level": "h2", "anchor": "先分清三种模块与预览", "text": "## 先分清三种模块与预览\n\n| 名称 | 边界 |\n| --- | --- |\n| 业务模块 | SkillComposition 组合精确 SkillVersion；现有 projects/modules API 只管理此对象 |\n| 生成界面 | FrontendModuleVersion 对应隔离展示产物，不是新的业务能力 |\n| 文档预览 | DocumentManagerPanel 的禁脚本 HTML，不可加 allow-scripts 当作生成 Preview |\n\nstandard/ViewSpec 是平台受控展示，不执行生成 React/TS。任何预览已经执行生成代码，必须先满足首次执行门禁。"}, {"title": "一个例子：图表坏了，任务没有失败", "level": "h2", "anchor": "一个例子图表坏了任务没有失败", "text": "## 一个例子：图表坏了，任务没有失败\n\nRun 使用 SkillVersion A，生成展示 G2 初始化超时：Host 关闭本页 iframe/通道，使用 standard 展示同一 Result/Evidence。它不重跑任务、不改变 A、不自动全局停版。管理员可另选兼容且未停用的 G1；这是目标行为，当前未实现。"}, {"title": "目标与流水线", "level": "h2", "anchor": "目标与流水线", "text": "## 目标与流水线\n\n```text\n冻结源码/依赖/构建配置 → 静态检查\n  → 隔离构建与断网测试 → 冻结产物/CSP/报告\n  → 隔离预览 → ADMIN 发布 → 独立展示选择\n  → Host 受控交互；本页失败回退 standard\n```\n\n生成模块只呈现，不创建后端服务、DB、Secret、Tool 或权限。独立 builder 不接 edge、不挂凭据或 Docker socket，只使用批准依赖来源。"}, {"title": "现有代码与公开契约", "level": "h2", "anchor": "现有代码与公开契约", "text": "## 现有代码与公开契约\n\n| 当前载体 | 不能推导的保证 |\n| --- | --- |\n| FrontendModuleVersion / 0026 | 有状态/hash/CSP/报告列，但无 service/repository 接线或完整 DB 不可变保护 |\n| plan_module_transition / require_publishable | 检查状态、bundle_hash、静态拒绝；不验证 blob/hash、完整报告或浏览器安全 |\n| analyze_module_sources / validate_dependencies / plan_module_build | 局部前置函数，不执行安装、构建、隔离或投放 |\n| RuntimeManifest | ui.frontend_module 当前只允许 null；Module API 常量不是 Host Schema/SDK |\n\n源码入口：[modules](../../PJM/backend/src/projectmind/modules/)，契约入口：[RuntimeManifest](../../PJM/contracts/runtime-manifest/v1alpha1.schema.json)。不可给业务 module API 临时加 bundle URL，或借 ViewSpec 绕开协议。"}, {"title": "决策与安全边界", "level": "h2", "anchor": "决策与安全边界", "text": "## 决策与安全边界"}, {"title": "Origin 与 CSP", "level": "h3", "anchor": "origin-与-csp", "text": "### Origin 与 CSP\n\n目标使用同主机 context path 下的专用 bundle-hash 路径。iframe 固定 sandbox=\"allow-scripts\"，无 allow-same-origin、弹窗、顶层导航和下载权限；HTTP 响应还必须带 Content-Security-Policy: sandbox allow-scripts，覆盖直接导航。meta/Report-Only 的 sandbox 无效，见 [CSP 规范](https://www.w3.org/TR/CSP3/#directive-sandbox)。\n\nopaque origin 不保证加载请求不带本主机 cookie；静态路径不处理业务 mutation，API 的认证、Origin/CSRF 和所有权仍独立检查。同主机方案须专项威胁建模，不能视为独立站点等价隔离。\n\n产物与脚本/样式 CSP 同时冻结，优先内容 hash；采用 nonce 时先定义响应、缓存和完整性，不固定 nonce 长期复用。不以 unsafe-inline/unsafe-eval、宽泛公网或未经验证的 'self' 修复报错。\n\nCSP 同时约束加载、base-uri、form-action、frame/object/worker 与嵌入方；connect-src 不是全部网络/导航控制，必须实际验证正向渲染及负向出网。"}, {"title": "当前 CSP 常量不是投放配置", "level": "h3", "anchor": "当前-csp-常量不是投放配置", "text": "### 当前 CSP 常量不是投放配置\n\n[domain.py](../../PJM/backend/src/projectmind/modules/domain.py)仍有 script-src 'self'、style 的 unsafe-inline 等目标差距，未被投放路由使用。字符串测试不证明浏览器安全；旧记录缺验证时保持不可运行，不覆盖旧 CSP 伪造验收。"}, {"title": "静态拒绝与依赖", "level": "h3", "anchor": "静态拒绝与依赖", "text": "### 静态拒绝与依赖\n\n[static_analysis.py](../../PJM/backend/src/projectmind/modules/static_analysis.py)按字面拒绝动态代码、网络调用、宿主 context、外部 URL、动态 import 和持久存储访问；可能误报、漏过间接调用。通过不是执行许可，报告摘录也可能敏感。\n\n依赖声明允许 react/react-dom/@projectmind/module-sdk/@projectmind/ui，不证明内部包已经可用。目标冻结版本与完整 lockfile 闭包，禁止 lifecycle script、native/Git/动态依赖；先验证 manifest 形状，再检查实际取得的所有包，不能只检查顶层声明。"}, {"title": "构建网络", "level": "h3", "anchor": "构建网络", "text": "### 构建网络\n\n[build_plan.py](../../PJM/backend/src/projectmind/modules/build_plan.py)只拒绝已知公共来源与部分 lockfile URL，不是 egress allowlist。实际 builder 必须批准 registry/mirror，校验 resolved URL、重定向及出口并阻断其他网络，构建后断网测试；不能靠扩大 host 黑名单代替。"}, {"title": "构建输入与结果的提交", "level": "h3", "anchor": "构建输入与结果的提交", "text": "### 构建输入与结果的提交\n\n1. 冻结源码、lockfile、依赖闭包、工具链/构建器、策略和限额，创建可审计请求；不接受来源自选 Shell/输出路径。\n2. 独立临时目录执行平台固定命令；CPU、内存、进程、磁盘、时间、产物大小各自限额，不运行安装脚本。\n3. 受信提交者核对请求身份、完整产物/hash 与静态/隔离报告后提交 BUILT；网络 I/O 不占长期 DB 锁。\n4. 未知提交核对原构建身份，不重复发布；无完整记录的 blob 不投放，孤立产物可延后清理。BUILT、Preview、PUBLISHED、展示选择分别决定。\n\n报告、源码与产物须有授权读取、保留与恢复规则，不向普通成员暴露原始错误/路径。"}, {"title": "Host 协议", "level": "h2", "anchor": "host-协议", "text": "## Host 协议\n\n尚未冻结公开协议。消息 origin 可能为 null，Host 必须同时验证 source window、随机 channel nonce、精确模块版本、当前 Project/Task/Run 与 payload Schema；nonce 是挂载身份，不是账号权限。\n\n只允许最小 context/result、草稿更新、打开平台 Preflight/调度草稿、订阅当前 Run、请求 Host 展示授权 Evidence/Artifact。草稿不自动提交，不发放任意 URL 读取能力；禁止直接 API、批准、管理用户/Skill/Secret 或读取其他 Run。"}, {"title": "挂载、切换与晚到消息", "level": "h3", "anchor": "挂载切换与晚到消息", "text": "### 挂载、切换与晚到消息\n\n版本、账号、Project/Task/Run 切换，iframe 重载/导航或回退时关闭旧通道/订阅，丢弃晚到响应；同窗口引用也不能跨导航延续信任。草稿更新需校验当前版本。\n\n初始化若必须向 opaque 接收方用 *，引导不得含业务内容或凭据；专用通道、nonce、导航失效须评审后才传真实数据，见 [消息安全规范](https://html.spec.whatwg.org/multipage/web-messaging.html#security-postmsg)。限制 payload、速率、在途和重复动作，未知协议拒绝，不做通用 API proxy。"}, {"title": "版本与回退", "level": "h2", "anchor": "版本与回退", "text": "## 版本与回退\n\n版本绑定精确 SkillVersion，冻结 source/lockfile/bundle hash、Module API、CSP 与报告。DRAFT → BUILT → PUBLISHED，各阶段可 DISABLED，停用不可恢复；事务与审计尚待实现。"}, {"title": "内容身份与历史兼容", "level": "h3", "anchor": "内容身份与历史兼容", "text": "### 内容身份与历史兼容\n\n当前唯一键 (skill_version_id, source_hash) 不能表达只换 lockfile/工具链/CSP 的新版本。目标区分源码身份、完整构建输入身份、产物身份：同输入重试确认原请求，不同输入创建新版本，不伪造 source_hash 或覆盖旧 bundle。\n\n同时设计 model/migration/repository、唯一约束与发布契约；保留旧 ID/hash/引用，缺验证的旧行不自动可投放，frozen DTO 不替代 DB 内容保护。"}, {"title": "展示选择与全局停用", "level": "h3", "anchor": "展示选择与全局停用", "text": "### 展示选择与全局停用\n\n| 情况 | 目标处理 |\n| --- | --- |\n| 本页超时、崩溃、协议错误 | 关闭实例，保留草稿/焦点，standard 展示原结果；不重试业务或全局停版 |\n| 回选旧展示版 | 经授权和并发检查选择兼容、仍可投放版本；不改 Run 或复活 DISABLED |\n| 管理员/安全停用 | 记录 actor/原因/原选择，阻止新投放并使 Host 失效；不由不可信客户端错误单独触发 |\n| 无模块、不兼容、历史验证不足 | standard，不猜 latest，不重新运行旧任务 |\n\n不能切换 ProjectComposition 的业务 SkillVersion 来修复界面。bundle hash 不是授权，缓存不能越过 Project/停用检查；已下载字节不可收回，撤回传播、Host 断开与备份恢复须独立验收。"}, {"title": "实施顺序与验收", "level": "h2", "anchor": "实施顺序与验收", "text": "## 实施顺序与验收\n\n按完整身份/契约 → builder → 安全投放/Host → 发布/展示选择/回退推进；未满足威胁模型与隔离门禁前不执行生成代码。\n\n- 同源码换依赖/策略有新身份；超时重试无重复发布，未知可确认。\n- 拒绝外部 host/重定向、传递脚本、伪造报告和超额产物，无半份可运行产物。\n- 直接导航/iframe/缓存/错误响应检验实际 CSP；允许渲染正常，禁止的网络/DOM/导航失败。\n- null-origin 伪造、错 nonce、旧 iframe、换 actor/context、过大/重复消息不泄漏、不覆盖草稿、不写业务。\n- G2 失败、旧版不兼容与全局停用都能保留同一结果的 standard 入口；三语、键盘、窄屏可用。\n- [局部回归](../../PJM/backend/tests/modules/)不代替真实 builder、代理和浏览器安全验收。"}], "toc": [{"title": "先分清三种模块与预览", "anchor": "先分清三种模块与预览", "level": "h2"}, {"title": "一个例子：图表坏了，任务没有失败", "anchor": "一个例子图表坏了任务没有失败", "level": "h2"}, {"title": "目标与流水线", "anchor": "目标与流水线", "level": "h2"}, {"title": "现有代码与公开契约", "anchor": "现有代码与公开契约", "level": "h2"}, {"title": "决策与安全边界", "anchor": "决策与安全边界", "level": "h2"}, {"title": "Origin 与 CSP", "anchor": "origin-与-csp", "level": "h3"}, {"title": "当前 CSP 常量不是投放配置", "anchor": "当前-csp-常量不是投放配置", "level": "h3"}, {"title": "静态拒绝与依赖", "anchor": "静态拒绝与依赖", "level": "h3"}, {"title": "构建网络", "anchor": "构建网络", "level": "h3"}, {"title": "构建输入与结果的提交", "anchor": "构建输入与结果的提交", "level": "h3"}, {"title": "Host 协议", "anchor": "host-协议", "level": "h2"}, {"title": "挂载、切换与晚到消息", "anchor": "挂载切换与晚到消息", "level": "h3"}, {"title": "版本与回退", "anchor": "版本与回退", "level": "h2"}, {"title": "内容身份与历史兼容", "anchor": "内容身份与历史兼容", "level": "h3"}, {"title": "展示选择与全局停用", "anchor": "展示选择与全局停用", "level": "h3"}, {"title": "实施顺序与验收", "anchor": "实施顺序与验收", "level": "h2"}], "source": "design/generated-modules.md", "checksum": "f0a1d715ffc9366cec4bb3ad4d8f53d1fcbd23f385de363f0eb9791c340f40d0"}, {"id": "docs/development/local-development.md", "title": "ローカル開発と検証", "group": "development", "html": "\u003ch1 id=\"ローカル開発と検証\">ローカル開発と検証\u003c/h1>\n\u003cp>全体の入口は \u003ca href=\"#PJM/README.md::\">PJM README\u003c/a>。以下はコード root \u003ccode>PJM/\u003c/code> 起点で、各節に実行 directory を明示する。\u003c/p>\n\u003ch2 id=\"前提と設定\">前提と設定\u003c/h2>\n\u003cp>Python 3.12、Node.js 26 / pnpm 11.7.0 を用意する。venv は作らず Backend 依存を user site に置き、lockfile を手編集しない。導入だけでは DB/Redis/object storage は起動しない。\u003c/p>\n\u003cp>\u003ccode>.env.example\u003c/code> は production 雛形。HTTP localhost は \u003ccode>PROJECTMIND_ENVIRONMENT=development\u003c/code>、許可 Origin、専用接続先、書込可能な Run workspace を設定する。通常 Backend の \u003ccode>.env\u003c/code> は実行 directory 基準なので、\u003ccode>backend/\u003c/code> から親の file が自動で読まれると仮定せず、設定 file または process environment を明示する。Compose は \u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">compose.py の共通設定入口\u003c/a>で ENV_FILE を同一 source に固定する。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>\u003ccode>PJM/backend/\u003c/code> で依存を入れる。migration は確認済み開発 DB を変更する操作なので、対象と権限を確認してから進む。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -e \u0026quot;.[dev]\u0026quot;\nalembic upgrade head\npython3 -m uvicorn projectmind.api.main:app --reload --port 8000\n\u003c/code>\u003c/pre>\n\u003cp>health は \u003ccode>http://localhost:8000/internal/health/live\u003c/code> と \u003ccode>/internal/health/ready\u003c/code>（外部 service も検査）。Worker は \u003ca href=\"#PJM/README.md::backend\">Backend 入口\u003c/a>、一括起動は\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>を参照する。\u003c/p>\n\u003ch3 id=\"実-postgresql-の前提\">実 PostgreSQL の前提\u003c/h3>\n\u003cp>全 pytest には\u003ca href=\"../PJM/backend/tests/db/test_real_database_invariants.py\">実 DB fixture\u003c/a>が含まれる。\u003ccode>PROJECTMIND_DATABASE_URL\u003c/code> の server 上で scratch DB を作り、全 migration 後に DROP DATABASE WITH (FORCE) を行う。実会話・予算 test も再利用する。\u003c/p>\n\u003cp>承認済み隔離 server/account、作成・強制削除権限を確認する。URL の DB 名変更だけでは隔離にならない。文書確認のために実行せず、接続不能の skip は未実施、認証/権限/migration の失敗は失敗のまま報告する。\u003c/p>\n\u003cp>許可された DB がない場合は局部 test、または \u003ccode>PJM/backend/\u003c/code> で現在の実 DB module を除外する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -p no:cacheprovider -o addopts= \\\n  --ignore=tests/db/test_real_database_invariants.py \\\n  --ignore=tests/db/test_real_auth_sessions.py \\\n  --ignore=tests/db/test_real_budget_ledger.py\n\u003c/code>\u003c/pre>\n\u003cp>これは無副作用の保証ではない。新しい fixture 利用先を追加したら除外対象を同期し、一時 Redis 等の process は別に確認する。\u003c/p>\n\u003ch3 id=\"隔离-redis-登录防护验证\">隔离 Redis 登录防护验证\u003c/h3>\n\u003cp>信頼できる入手元と checksum を確認した Redis 8.2 系 executable が必要。fixture は TCP/永続化を無効にした自分専用 process と短い path の Unix socket を使い、終了時も自分の process だけを止める。既存 Redis の URL、system service や DB 消去は使わない。\u003c/p>\n\u003cp>\u003ccode>PJM/backend/\u003c/code> で placeholder を確認済み絶対 path に置き換える：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">PYTHONDONTWRITEBYTECODE=1 \\\n  PROJECTMIND_TEST_REDIS_SERVER=/absolute/path/to/redis-server \\\n  python3 -m pytest -p no:cacheprovider -o addopts= \\\n  tests/auth/test_real_login_protection.py tests/auth/test_real_login_http.py\n\u003c/code>\u003c/pre>\n\u003cp>未指定なら PATH を検索し、見つからなければ skip、不正な明示 path は fail。実 Lua/TTL と ASGI→AuthService→Redis を検証するが Session 保存は fake、一部時刻は操作する。実 PostgreSQL、長時間待機、複数 API process、HTTPS proxy と Redis 切替は別の\u003ca href=\"#docs/design/login-protection.md::%E5%BC%80%E5%8F%91%E6%8E%A5%E7%BB%AD%E4%B8%8E%E9%AA%8C%E6%94%B6\">受入条件\u003c/a>。\u003c/p>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cp>\u003ccode>PJM/web/\u003c/code> で実行する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">CI=true npx -y pnpm@11.7.0 install --frozen-lockfile\nnpx -y pnpm@11.7.0 dev\n\u003c/code>\u003c/pre>\n\u003cp>既定 URL は \u003ccode>http://localhost:5173/projectmind/\u003c/code>、API proxy は \u003ccode>http://127.0.0.1:8000\u003c/code>。context path は Web/API で合わせ、cookie は同じ browser Origin で使う。\u003c/p>\n\u003ch3 id=\"ブラウザ回帰\">ブラウザ回帰\u003c/h3>\n\u003cp>全 API を mock する専用 harness。実 credential、Backend、DB、model は使わ
