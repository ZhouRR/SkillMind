ーと Project 権限を再確認）、アップロード回執 ID/hash による直接読取に対応する。`document.convert_to_markdown/v1` も `response_mode=file` と `publish_artifact=true` を優先し、`workspace.read/v1` は `offset`・`max_chars`（既定 64,000、上限 200,000）・`expected_hash` による分割読取に対応し、ローカル欠落時は `artifact.materialize/v1` で検証済み原バイトから復元する。\n- **ワークスペース編集とディレクトリ提案**：`workspace.edit/v1` は原ハッシュに基づくコピー・追記・一意文字列置換・出力公開に対応し、`document.files/v1` は認可文書ライブラリ内のディレクトリ列挙と保存・改名・移動・空ディレクトリ作成/削除・ごみ箱移動/復元提案を準備する（実書込は共有 Effect と元版競合検証を通す）。"}, {"title": "資源ファイルと原生クライアント", "level": "h2", "anchor": "資源ファイルと原生クライアント", "text": "## 資源ファイルと原生クライアント\n\nネットワークアクセスは Worker 内の共有クライアントが実行し、束縛・権限・回執を検証して資格情報をモデルに露出しない。要求は `request_file` + `expected_hash` に対応し、応答は `workspace/resources/` に保存する。`change.propose` は JSON ファイル提出とその内容ハッシュ束縛に対応する。8 KiB を超える確認済み Effect 回執はファイル参照として交付し（短い回執や保存失敗時は原値を返却）、同一回執は継続・復旧でも同一投影を保つ。\n\nMCP・repository の応答を JSON ファイルで交付する場合も原観測の Evidence を使い、保存先・ファイルハッシュ・サイズをその metadata に保持する。ファイル交付だけを理由に別の Evidence は作成しない。\n\n- **Git**：`repository.workspace/v1` で認可 UTF-8 ファイルを編集可能ディレクトリに配置し、`prepare_commit` でローカルファイルハッシュから提案を準備し、コミット時も branch・パス・原 revision・read-back を検証する。\n- **MCP**：検出・凍結された原生パラメータ Schema を使い、読取はファイル入出力に対応し、書込は Effect・承認・原操作 ID を通す。\n- **PostgreSQL**：`database.query/v1` と `database.execute/v1` を使い、テーブル/列権限は DB アカウントに委ねる。単一 SELECT と承認後の INSERT/UPDATE/DELETE・JOIN/CTE・`$1` パラメータに対応する。原 DML を一度実行し、commit 確認後の命令状態と影響行数を返す。業務上の事前確認・前後スナップショット・結果照会は Agent が選び、外部回執表は不要。未送信または rollback 確認済みのエラーは修正可能な診断を返し、commit 応答喪失は結果不明のまま再送しない。\n- **HTTP API**：接続にはルート URL 一覧と認証 Secret のみを登録し、パス・メソッド・引数は登録された origin とルート配下で Skill/Agent が指定する。GET/HEAD 読取と承認後の POST/PUT/PATCH/DELETE に対応し、事前 GET や read-back は強制しない。原ステータスコード・許可ヘッダ・完全バイト列ファイルをそのまま Agent に渡す（自動リダイレクト禁止、タイムアウトや結果不明時の自動再送禁止）。\n- **設定移行**：`0059_native_resource_clients` で旧書込接続を SELECT/INSERT/UPDATE/DELETE へ、Redmine を HTTP へ変換し、`0062_http_resource_roots` で基底 URL をルート一覧へ統合して旧既定束縛を無効化する（旧 Run スナップショットは書き換えない）。"}, {"title": "画像と精密読取", "level": "h2", "anchor": "画像と精密読取", "text": "## 画像と精密読取\n\n- `mcp.download/v1` は同一 Run・同一束縛の成功した MCP 読取 Evidence と原応答 JSON Pointer からダウンロード URL を解決し、同一 origin へのみ資格情報付き GET を送り（リダイレクト・別接続参照は禁止）、権限検証後に完全バイト列とハッシュを保存する。\n- `workspace.read/v1` の JSON モードは `pointers`（RFC 6901）と `expected_hash` で項目を精密読取する（欠落は `exists: false`、配列は既定 20 件/ページ・上限 200 件、元ファイル上限 16 MiB・結果上限 64 KiB、超過時は切り詰めず拒否）。\n- `workspace.image/v1` は Run 内パス・原ハッシュ・PNG/JPEG/WebP 実体（上限 8 MiB・2,500 万画素・単一フレーム）を検証してエンジンへ画像を渡し、SDK builtin `view_image` は禁止する。スクリーンショットとウィンドウ状態は Skill が照合し、クリックは確認済み MCP セレクタを使用する。"}, {"title": "実行と復旧", "level": "h2", "anchor": "実行と復旧", "text": "## 実行と復旧\n\n- [システム構成と用語](../overview/architecture.md)に従い Run・Segment・Attempt を区別する（入口は [worker/settings](../../SKM/backend/src/skillmind/worker/settings.py) と [executor](../../SKM/backend/src/skillmind/worker/executor.py)）。同一段階の復旧は新 Attempt を作成し、原スナップショット・権限上限・Result は変更しない。\n- 送信前に主体・冪等キー・入力・資源選択・承認同意を凍結し、[creation_request](../../SKM/backend/src/skillmind/runs/creation_request.py)・[creation_replay](../../SKM/backend/src/skillmind/runs/creation_replay.py)・Web [runSubmission](../../SKM/web/src/lib/runSubmission.ts) を共用する。通信断やタイムアウト時はまず原回執を確認し、再送は原キーと原内容を維持して遅延応答を隔離する。\n- 取消はまず意図を永続化し、[RunRepository](../../SKM/backend/src/skillmind/runs/repository.py) がロック内で lease・取消・終端状態を検証し、ツール呼出は [evidence](../../SKM/backend/src/skillmind/agent/evidence.py) で実行権を再確認する。モデルセッション復旧は [session_store](../../SKM/backend/src/skillmind/agent/session_store.py) の原記録を読み、根拠欠落時は停止する。\n- 定期実行（[schedules/service](../../SKM/backend/src/skillmind/schedules/service.py)）は既定で自動承認を有効にし、汎用・Git・MCP の同意を発火時の原 occurrence 要求に固定した上で、実行時に作成者の現在の Project・資源権限を再検証する。"}, {"title": "外部効果", "level": "h2", "anchor": "外部効果", "text": "## 外部効果\n\n- 外部書込は observe → propose → approve → apply に従う。モデル向け説明は各 Effect request Schema の `description` から供給し、文書と Git は提案準備ツールを優先利用する。\n- 承認は特定 Proposal の version/checksum・Provider・操作・scope に束縛し、[EffectService](../../SKM/backend/src/skillmind/effects/service.py) が業務ロック外でリモート I/O を実行する。自動承認は原 Run 開始時に記録された同意または既存の事前認可に限定する（`repository.write/v1` は Project 事前認可と force を禁止）。\n- 実効能力は [ExecutionFeatures](../../SKM/backend/src/skillmind/effects/release.py) と [Provider registry](../../SKM/backend/src/skillmind/effects/wiring.py) のスイッチ双方で制限する。MCP 提案は同一 Run/接続/束縛のツールカタログ証拠を自動関連付けして checksum に含める。\n- MCP の回読は原呼出しの確定した回執を確認し、業務成功・全件完了とは分離する。状態条件は工具契約に示された失敗を含む終端集合と、呼出し終了・続行可能と明示された部分完了を使う。Agent は回執を評価し、続行が必要なら同じ原 ID・対象集合を使う別の受控提案を行う。進行中・結果不明を完了扱いせず、承認済み条件も実行後に緩和しない。送信前検証は出力 Schema と比較値の整合を確認し、enum から終端性を推測しない。応答受信の診断事実は後続の読取専用 attempt に引き継ぐ。\n- 書込結果が不明な場合は主フローを停止して原 Effect を保持し、[reconciliation_service](../../SKM/backend/src/skillmind/effects/reconciliation_service.py) で読取照合を行う。MCP の read-back 再試行（[mcp_provider](../../SKM/backend/src/skillmind/effects/mcp_provider.py)）は変更操作を決して再送しない。"}, {"title": "結果と評価", "level": "h2", "anchor": "結果と評価", "text": "## 結果と評価\n\n- 技術的終端状態・結果の完全性・業務 PASS/FAIL は分けて表現する。[ResultValidator](../../SKM/backend/src/skillmind/agent/result_validation.py) が凍結 Schema・参照帰属・添付バイト・保存済み Effect 事実を検証する。\n- 新規 Run は[モデル結果契約](../../SKM/contracts/outcomes/model/v1.schema.json)を task snapshot に固定する。モデルは業務内容とツールの `result_references` にある短参照だけを返し、[組立処理](../../SKM/backend/src/skillmind/agent/model_result.py)が原 Evidence/Artifact ID、提案一覧、保存済み操作状態と回執から従来の OutcomeEnvelope を構成する。発見事項の根拠はモデルが選択し、全証拠を一括で根拠にしない。短参照は原 ID から安定生成し、欠落・衝突・別種を拒否する。主実行と続行で同じ参照を使い、子は自身の Session の観測だけを解決する。組立後も全提案の未完了、帰属、原回執と Artifact 実体の検証を省略せず、保存形式・業務ファイル・外部操作は変更しない。\n- Result/Evidence/Artifact は不変とし、人手修正は [Evaluation](../../SKM/backend/src/skillmind/evaluations/service.py) を追記して原結果を上書きしない。\n- `audit.export/v1`（[audit_export](../../SKM/backend/src/skillmind/agent/audit_export.py)）は保存済み事実のみを出力し、`artifact.append/v1` は原バイト検証後に短文を追記して新 Artifact 参照を公開する（元の監査参照は不変）。表示規則は [UI ガイド](../design/workspace.md#レポートとプレビュー)を参照。"}, {"title": "後置能力", "level": "h2", "anchor": "後置能力", "text": "## 後置能力\n\n未接続または要否判断待ちの能力は日常タスクの前提としない。\n\n| 範囲 | 現在の保守境界 |\n| --- | --- |\n| Run 共通予算 | [primary_budget](../../SKM/backend/src/skillmind/worker/primary_budget.py) は本番 coordinator 未接続。Codex 起動前にドル上限を拒否し、将来接続時は親子共有・課金前確保・費用不明時の返還なしを守る |\n| 子 Agent | [Provider](../../SKM/backend/src/skillmind/agent/subagent_provider.py) は部分実装。権限は [resolve_subagent_capabilities](../../SKM/backend/src/skillmind/agent/subagent.py) で絞り込み、書込・対話・再帰 dispatch を禁止 |\n| 生成 UI | [Manifest](../../SKM/contracts/runtime-manifest/v1alpha1.schema.json) は `frontend_module` を引き続き禁止。将来開放時は CSP `sandbox allow-scripts` と iframe の `allow-same-origin` 禁止を検証する |\n| 外部書込シーケンス | [局所実験](../../SKM/backend/tests/worker/test_receipt_sequence_experiment.py) は本番未接続。同一 job の SDK 再利用と読取専用短列では一括外部書込を行わない |\n| その他拡張 | Task Flow は読取専用プレビュー。完全オーケストレーション・SVN 書込・PR 自動作成・広範な Shell/network は実需要に応じて評価 |"}, {"title": "限定ツール列とウォーム継続", "level": "h2", "anchor": "限定ツール列とウォーム継続", "text": "## 限定ツール列とウォーム継続\n\n- `agent/tool_sequence.py` は元の `ToolGateway` を通じて `sequence_safe` と明示されたローカル/読取専用サブツール 1〜5 個（原 Run の凍結集合内）を順次実行し、取消伝播に対応し外部書込と制御ツールを禁止する。\n- `agent/warm_codex.py` は同一 Worker job の原 Run 内でのみ Codex プロセスを再利用し（Run 間で権限やセッションを共有しない）、原 Run ロック内で隣接 Segment・原 Effect・自動承認を検証して新 Attempt を作成する。"}, {"title": "自動承認操作の直接回執", "level": "h2", "anchor": "自動承認操作の直接回執", "text": "## 自動承認操作の直接回執\n\n`SKILLMIND_INLINE_EFFECTS_ENABLED` は既定で無効（migration `0056_inline_effect_owner` に依存し、Codex かつ Attempt 残り時間が十分な自動承認操作にのみ適用。Claude や他条件は従来の延期経路を通る）。`change.propose/v1` は原 SDK 呼出 ID から冪等キーを生成して既定管理項目を補完し、有効時は原 Attempt を `RUNNING` のまま `ApprovedEffectExecutor` で claim・コミットして原回執を当該ツール結果として直接返す。失敗・取消・応答不明時は即座に当該 turn を停止して従来の Effect 待機/照合フローへ戻し、重複する書込操作を決して新規作成しない。"}, {"title": "同一タスクの同種複数資源", "level": "h2", "anchor": "同一タスクの同種複数資源", "text": "## 同一タスクの同種複数資源\n\nRun は Skill の資源スロットに従い同種の複数接続を束縛できる。`database.*`・`mcp.*`・`repository.read`・`issue.read`・`tool.sequence` のサブ呼出および `change.propose` は最上位の `resource_key` で凍結済みスロットを選択する（複数束縛時は必須、単一束縛時は省略可。URL/ID の直接指定やテーブル名からの推測は不可）。SDK は能力ごとに 1 つのツール定義のみを公開して選択可能な key を列挙し、内部では `(capability, resource_key)` ごとに独立して認可・ルーティング・監査を行い、最上位 selector を除いた業務引数を Provider に渡す。"}], "toc": [{"title": "認証と認可", "anchor": "認証と認可", "level": "h2"}, {"title": "Skill と凍結原文", "anchor": "skill-と凍結原文", "level": "h2"}, {"title": "入力と文書", "anchor": "入力と文書", "level": "h2"}, {"title": "資源ファイルと原生クライアント", "anchor": "資源ファイルと原生クライアント", "level": "h2"}, {"title": "画像と精密読取", "anchor": "画像と精密読取", "level": "h2"}, {"title": "実行と復旧", "anchor": "実行と復旧", "level": "h2"}, {"title": "外部効果", "anchor": "外部効果", "level": "h2"}, {"title": "結果と評価", "anchor": "結果と評価", "level": "h2"}, {"title": "後置能力", "anchor": "後置能力", "level": "h2"}, {"title": "限定ツール列とウォーム継続", "anchor": "限定ツール列とウォーム継続", "level": "h2"}, {"title": "自動承認操作の直接回執", "anchor": "自動承認操作の直接回執", "level": "h2"}, {"title": "同一タスクの同種複数資源", "anchor": "同一タスクの同種複数資源", "level": "h2"}], "source": "development/runtime-guide.md", "checksum": "628e8f1590bacd038d9b857f692de24eeb62d5d42495506a71f0d3f6aa33ca52"}, {"id": "docs/development/coding-rules.md", "title": "変更種別ごとの実装細則", "group": "development", "html": "\u003ch1 id=\"変更種別ごとの実装細則\">変更種別ごとの実装細則\u003c/h1>\n\u003cp>\u003ca href=\"#AGENTS.md::\">AGENTS\u003c/a>に従い今回の変更に関連する章のみを参照する。領域規則は\u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>、実行コマンドは\u003ca href=\"#docs/development/local-development.md::\">ローカル開発\u003c/a>を参照。\nBackend パスは \u003ccode>SKM/backend/src/skillmind/\u003c/code> 相対、Web パスは \u003ccode>SKM/web/\u003c/code> 相対で記す。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>route は認証・入出力変換のみを担い、業務規則は domain/service、クエリ・ロック・永続化は repository に置く。公開 route は \u003ccode>api/routes/\u003c/code> の資源モジュール単層で実装し、未認証の並行入口・転送 wrapper・ARQ job 内の業務分岐を設けない。\u003c/p>\n\u003cp>同義の処理は単一入口を再利用する。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>処理\u003c/th>\n\u003cth>入口 / 制限\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>JSON / SHA-256\u003c/td>\n\u003ctd>\u003ccode>core/hashing.py\u003c/code>：\u003ccode>canonical_json\u003c/code> / \u003ccode>sha256_hex\u003c/code>。パッケージ索引は \u003ccode>skills/importer.py\u003c/code> の形式で計算し、JSON と生バイト要約を混用しない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>機密項目\u003c/td>\n\u003ctd>\u003ccode>core/redaction.py\u003c/code>：\u003ccode>find_sensitive_key\u003c/code>。ツール応答・Evidence・最終結果は \u003ccode>password\u003c/code> 項目名のみで拒否せず、設定・資格情報の宣言は厳格検査を維持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lease token\u003c/td>\n\u003ctd>\u003ccode>runs/domain.py\u003c/code>：\u003ccode>lease_token_hash\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RunEvent / Outbox\u003c/td>\n\u003ctd>\u003ccode>runs/repository_base.py\u003c/code> の \u003ccode>RunRepository\u003c/code>：\u003ccode>_snapshot_event\u003c/code>、\u003ccode>_event_outbox\u003c/code>、\u003ccode>_dispatch_outbox\u003c/code>、\u003ccode>_next_sequence\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>認証 Problem\u003c/td>\n\u003ctd>\u003ccode>api/auth_dependencies.py\u003c/code> の共有 factory。Run は \u003ccode>routes/runs.py\u003c/code> の \u003ccode>run_not_found_problem\u003c/code> / \u003ccode>authorized_run\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>binding / Secret\u003c/td>\n\u003ctd>\u003ccode>agent/run_binding.py\u003c/code>：\u003ccode>load_bound_run_resource\u003c/code> / \u003ccode>resolve_binding_secret\u003c/code>。checksum・Integration 状態・provider/revision/capability を検証\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部 repository\u003c/td>\n\u003ctd>\u003ccode>agent/repository_client.py\u003c/code> / \u003ccode>repository_source.py\u003c/code>。実体化・read・write で共用し、独自の subprocess や資格情報解決を書かない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>apply 可能な effect\u003c/td>\n\u003ctd>\u003ccode>effects/catalog.py\u003c/code>：\u003ccode>EFFECT_CAPABILITIES\u003c/code>。作成・実行・承認で共用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Binary 文字列化\u003c/td>\n\u003ctd>\u003ccode>agent/binary_text.py\u003c/code>：\u003ccode>render_text\u003c/code> / \u003ccode>convert_excel_to_markdown\u003c/code>。Provider 側へ複製しない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ccode>documents/__init__.py\u003c/code> は domain 型のみを公開し、service/repository/source は明示 import して DB → Run → 文書の循環を防ぐ。\u003c/p>\n\u003cp>Git 書込は上記共有実装に従い、\u003ccode>direct\u003c/code> は既定 branch の fast-forward のみ、\u003ccode>branch\u003c/code> は \u003ccode>skillmind/\u003c/code> 名前空間の新規 branch のみとする。認可・承認・結果不明時の扱いは\u003ca href=\"#docs/development/runtime-guide.md::%E5%A4%96%E9%83%A8%E5%8A%B9%E6%9E%9C\">外部効果\u003c/a>を参照。\u003c/p>\n\u003ch2 id=\"run-lifecycle\">Run lifecycle\u003c/h2>\n\u003cp>実行・claim・継続・取消を変更する際は\u003ca href=\"#docs/development/runtime-guide.md::%E5%AE%9F%E8%A1%8C%E3%81%A8%E5%BE%A9%E6%97%A7\">実行と復旧\u003c/a>を、画面表示のみは \u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a> を参照。\u003c/p>\n\u003cul>\n\u003cli>状態遷移は \u003ccode>plan_run_transition\u003c/code> / \u003ccode>ALLOWED_RUN_TRANSITIONS\u003c/code> のみを通す。ロック順は \u003ccode>Run → Segment → Attempt\u003c/code>（旧 migration 経路は \u003ccode>Run → Attempt\u003c/code> を維持し、\u003ccode>_lock_claimed_execution\u003c/code> を逆転させない）。\u003c/li>\n\u003cli>終端 \u003ccode>RUN_SNAPSHOT\u003c/code> が最後の RunEvent となる。\u003ccode>sequence\u003c/code> は Run 内で単調増加し、\u003ccode>TEXT_DELTA\u003c/code> は sequence を消費するが永続化せず、RunEvent Schema に従う。\u003c/li>\n\u003cli>再 dispatch は \u003ccode>SKILLMIND_RUN_MAX_ATTEMPTS\u003c/code> で制限し、上限到達時は \u003ccode>retry_exhausted\u003c/code> で \u003ccode>FAILED\u003c/code> に閉じる。\u003ccode>wall_timeout_seconds\u003c/code> はイベント待機のみを中断し、終端トランザクションは中断しない（ARQ \u003ccode>job_timeout\u003c/code> はさらに長く設定する）。\u003c/li>\n\u003cli>子能力は \u003ccode>resolve_subagent_capabilities\u003c/code> で絞り込み、予算配線と隔離は\u003ca href=\"#docs/development/runtime-guide.md::%E5%BE%8C%E7%BD%AE%E8%83%BD%E5%8A%9B\">後置能力\u003c/a>に従う。\u003c/li>\n\u003cli>文脈準備は\u003ca href=\"#docs/development/runtime-guide.md::%E5%85%A5%E5%8A%9B%E3%81%A8%E6%96%87%E6%9B%B8\">入力と文書\u003c/a>、結果検証は\u003ca href=\"#docs/development/runtime-guide.md::%E7%B5%90%E6%9E%9C%E3%81%A8%E8%A9%95%E4%BE%A1\">結果と評価\u003c/a>に従い、\u003ccode>TaskSchedule\u003c/code> は \u003ccode>RunService.create_task_run\u003c/code> を再利用する。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cul>\n\u003cli>資源 client は \u003ccode>src/api/\u003c/code> に置き、画面からは \u003ccode>index.ts\u003c/code> barrel 経由で呼ぶ。HTTP は \u003ccode>requestApiJson\u003c/code> / \u003ccode>requestApiEmpty\u003c/code> に統一し、mutation は \u003ccode>csrfToken\u003c/code> / \u003ccode>X-CSRF-Token\u003c/code> を渡し、純粋ロジックは \u003ccode>src/lib/\u003c/code> に置く。\u003c/li>\n\u003cli>\u003ccode>TasksPage\u003c/code> でタスクを選択し、\u003ccode>WorkspacePage\u003c/code> で待受とレポートを扱い、Run 詳細は実行履歴に属する。即時起動とスケジュールは \u003ccode>taskDraft.ts\u003c/code> / \u003ccode>TaskLaunchFields.tsx\u003c/code> を共用する。\u003c/li>\n\u003cli>フロントエンドでサーバー側 ID（\u003ccode>derive_task_id\u003c/code> 等）を再計算せず、絞り込みとページングはサーバーを正とする。三語は \u003ccode>src/lib/i18n/{zh,ja,en}.ts\u003c/code> で管理し、画面は \u003ccode>useMessages()\u003c/code> を使う。\u003c/li>\n\u003cli>要求状態は対応 hook/コンポーネントが保持し、同期多重送信防止と遅延応答の帰属確認はボタンの \u003ccode>disabled\u003c/code> に依存しない。子コンポーネント定義はモジュール最上位に置き、下書き編集時のサブツリー再構築によるフォーカス喪失を防ぐ。生成 \u003ccode>FrontendModule\u003c/code> の隔離要件は\u003ca href=\"#docs/development/runtime-guide.md::%E5%BE%8C%E7%BD%AE%E8%83%BD%E5%8A%9B\">後置能力\u003c/a>を参照。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"同期点\">同期点\u003c/h2>\n\u003cp>影響箇所のみを更新し、公開契約は\u003ca href=\"#docs/development/contract-workflow.md::\">契約 workflow\u003c/a>も併せて遵守する。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>変更対象\u003c/th>\n\u003cth>同期範囲\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Settings\u003c/td>\n\u003ctd>\u003ccode>core/settings.py\u003c/code> の Field 範囲 → \u003ccode>.env.example\u003c/code> → API lifespan / Worker startup 注入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AgentEventType\u003c/td>\n\u003ctd>\u003ccode>agent/domain.py\u003c/code> → \u003ccode>engine.py\u003c/code> mapper → Web \u003ccode>RUN_EVENT_NAMES\u003c/code> → RunEvent Schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillExecution / Brief / OutcomeEnvelope / 旧 Blueprint\u003c/td>\n\u003ctd>contract → DTO/validator/projector → frozen checksum → Worker/Web → example/test\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Segment / Interaction / Proposal\u003c/td>\n\u003ctd>transition → DB/repository → event/outbox/SSE → 認可/冪等 → Web → recovery/Compose\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tool capability\u003c/td>\n\u003ctd>versioned request/response/error → Provider → \u003ccode>tool_catalog.py\u003c/code> 登録 → \u003ccode>context_builder.py\u003c/code> 凍結束縛/\u003ccode>allowed_capabilities\u003c/code> → 回帰\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>endpoint\u003c/td>\n\u003ctd>資源 route/actor alias → response allowlist/Problem → Schema/example/OpenAPI → Web validator/barrel → 回帰\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DB model\u003c/td>\n\u003ctd>\u003ccode>db/models.py\u003c/code> → migration → repository DTO/projection → 回帰。relationship のない FK 親子を同一トランザクションで追加する際は明示的に \u003ccode>flush()\u003c/code> する\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema / example\u003c/td>\n\u003ctd>\u003ccode>scripts/validate_contracts.py\u003c/code> と \u003ccode>backend/tests/contracts/test_contracts.py\u003c/code> の双方に登録\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenAPI\u003c/td>\n\u003ctd>endpoint 変更後に \u003ccode>scripts/export_openapi.py\u003c/code> を実行して整合を検証（読取専用レビューでは再出力しない）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>構造化 log\u003c/td>\n\u003ctd>\u003ccode>core/logging.py\u003c/code> の \u003ccode>_CONTEXT_FIELDS\u003c/code> allowlist に登録\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>system Interpreter Skill\u003c/td>\n\u003ctd>SemVer/content hash・example identity・prompt checksum・テストを同期\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ccode>tests/\u003c/code> はモジュール責務を反映し、API テストは \u003ccode>tests/api/fakes.py\u003c/code> / \u003ccode>conftest.py\u003c/code> を共用する。fake SQL と\u003ca href=\"#docs/development/local-development.md::%E5%AE%9F-postgresql-%E3%81%AE%E5%89%8D%E6%8F%90\">実 DB\u003c/a>の証跡は区別して記録する。\u003c/p>\n\u003ch2 id=\"ingress\">Ingress\u003c/h2>\n\u003cp>共有 Traefik を再利用し、\u003ccode>web\u003c/code>/\u003ccode>api\u003c/code> のみを edge network に参加させ、host port は公開しない。外部入口は \u003ccode>SKILLMIND_CONTEXT_PATH\u003c/code> 配下に統一し、API 転送時にプレフィックスを除去する。設定と移行は\u003ca href=\"#docs/operations/deployment.md::\">配備手順\u003c/a>を参照。\u003c/p>\n", "sections": [{"title": "変更種別ごとの実装細則", "level": "h1", "anchor": "変更種別ごとの実装細則", "text": "# 変更種別ごとの実装細則\n\n[AGENTS](../../AGENTS.md)に従い今回の変更に関連する章のみを参照する。領域規則は[変更ガイド](change-guide.md)、実行コマンドは[ローカル開発](local-development.md)を参照。\nBackend パスは `SKM/backend/src/skillmind/` 相対、Web パスは `SKM/web/` 相対で記す。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\nroute は認証・入出力変換のみを担い、業務規則は domain/service、クエリ・ロック・永続化は repository に置く。公開 route は `api/routes/` の資源モジュール単層で実装し、未認証の並行入口・転送 wrapper・ARQ job 内の業務分岐を設けない。\n\n同義の処理は単一入口を再利用する。\n\n| 処理 | 入口 / 制限 |\n| --- | --- |\n| JSON / SHA-256 | `core/hashing.py`：`canonical_json` / `sha256_hex`。パッケージ索引は `skills/importer.py` の形式で計算し、JSON と生バイト要約を混用しない |\n| 機密項目 | `core/redaction.py`：`find_sensitive_key`。ツール応答・Evidence・最終結果は `password` 項目名のみで拒否せず、設定・資格情報の宣言は厳格検査を維持 |\n| Lease token | `runs/domain.py`：`lease_token_hash` |\n| RunEvent / Outbox | `runs/repository_base.py` の `RunRepository`：`_snapshot_event`、`_event_outbox`、`_dispatch_outbox`、`_next_sequence` |\n| 認証 Problem | `api/auth_dependencies.py` の共有 factory。Run は `routes/runs.py` の `run_not_found_problem` / `authorized_run` |\n| binding / Secret | `agent/run_binding.py`：`load_bound_run_resource` / `resolve_binding_secret`。checksum・Integration 状態・provider/revision/capability を検証 |\n| 外部 repository | `agent/repository_client.py` / `repository_source.py`。実体化・read・write で共用し、独自の subprocess や資格情報解決を書かない |\n| apply 可能な effect | `effects/catalog.py`：`EFFECT_CAPABILITIES`。作成・実行・承認で共用 |\n| Binary 文字列化 | `agent/binary_text.py`：`render_text` / `convert_excel_to_markdown`。Provider 側へ複製しない |\n\n`documents/__init__.py` は domain 型のみを公開し、service/repository/source は明示 import して DB → Run → 文書の循環を防ぐ。\n\nGit 書込は上記共有実装に従い、`direct` は既定 branch の fast-forward のみ、`branch` は `skillmind/` 名前空間の新規 branch のみとする。認可・承認・結果不明時の扱いは[外部効果](runtime-guide.md#外部効果)を参照。"}, {"title": "Run lifecycle", "level": "h2", "anchor": "run-lifecycle", "text": "## Run lifecycle\n\n実行・claim・継続・取消を変更する際は[実行と復旧](runtime-guide.md#実行と復旧)を、画面表示のみは [Workspace](../design/workspace.md) を参照。\n\n- 状態遷移は `plan_run_transition` / `ALLOWED_RUN_TRANSITIONS` のみを通す。ロック順は `Run → Segment → Attempt`（旧 migration 経路は `Run → Attempt` を維持し、`_lock_claimed_execution` を逆転させない）。\n- 終端 `RUN_SNAPSHOT` が最後の RunEvent となる。`sequence` は Run 内で単調増加し、`TEXT_DELTA` は sequence を消費するが永続化せず、RunEvent Schema に従う。\n- 再 dispatch は `SKILLMIND_RUN_MAX_ATTEMPTS` で制限し、上限到達時は `retry_exhausted` で `FAILED` に閉じる。`wall_timeout_seconds` はイベント待機のみを中断し、終端トランザクションは中断しない（ARQ `job_timeout` はさらに長く設定する）。\n- 子能力は `resolve_subagent_capabilities` で絞り込み、予算配線と隔離は[後置能力](runtime-guide.md#後置能力)に従う。\n- 文脈準備は[入力と文書](runtime-guide.md#入力と文書)、結果検証は[結果と評価](runtime-guide.md#結果と評価)に従い、`TaskSchedule` は `RunService.create_task_run` を再利用する。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n- 資源 client は `src/api/` に置き、画面からは `index.ts` barrel 経由で呼ぶ。HTTP は `requestApiJson` / `requestApiEmpty` に統一し、mutation は `csrfToken` / `X-CSRF-Token` を渡し、純粋ロジックは `src/lib/` に置く。\n- `TasksPage` でタスクを選択し、`WorkspacePage` で待受とレポートを扱い、Run 詳細は実行履歴に属する。即時起動とスケジュールは `taskDraft.ts` / `TaskLaunchFields.tsx` を共用する。\n- フロントエンドでサーバー側 ID（`derive_task_id` 等）を再計算せず、絞り込みとページングはサーバーを正とする。三語は `src/lib/i18n/{zh,ja,en}.ts` で管理し、画面は `useMessages()` を使う。\n- 要求状態は対応 hook/コンポーネントが保持し、同期多重送信防止と遅延応答の帰属確認はボタンの `disabled` に依存しない。子コンポーネント定義はモジュール最上位に置き、下書き編集時のサブツリー再構築によるフォーカス喪失を防ぐ。生成 `FrontendModule` の隔離要件は[後置能力](runtime-guide.md#後置能力)を参照。"}, {"title": "同期点", "level": "h2", "anchor": "同期点", "text": "## 同期点\n\n影響箇所のみを更新し、公開契約は[契約 workflow](contract-workflow.md)も併せて遵守する。\n\n| 変更対象 | 同期範囲 |\n| --- | --- |\n| Settings | `core/settings.py` の Field 範囲 → `.env.example` → API lifespan / Worker startup 注入 |\n| AgentEventType | `agent/domain.py` → `engine.py` mapper → Web `RUN_EVENT_NAMES` → RunEvent Schema |\n| SkillExecution / Brief / OutcomeEnvelope / 旧 Blueprint | contract → DTO/validator/projector → frozen checksum → Worker/Web → example/test |\n| Segment / Interaction / Proposal | transition → DB/repository → event/outbox/SSE → 認可/冪等 → Web → recovery/Compose |\n| Tool capability | versioned request/response/error → Provider → `tool_catalog.py` 登録 → `context_builder.py` 凍結束縛/`allowed_capabilities` → 回帰 |\n| endpoint | 資源 route/actor alias → response allowlist/Problem → Schema/example/OpenAPI → Web validator/barrel → 回帰 |\n| DB model | `db/models.py` → migration → repository DTO/projection → 回帰。relationship のない FK 親子を同一トランザクションで追加する際は明示的に `flush()` する |\n| Schema / example | `scripts/validate_contracts.py` と `backend/tests/contracts/test_contracts.py` の双方に登録 |\n| OpenAPI | endpoint 変更後に `scripts/export_openapi.py` を実行して整合を検証（読取専用レビューでは再出力しない） |\n| 構造化 log | `core/logging.py` の `_CONTEXT_FIELDS` allowlist に登録 |\n| system Interpreter Skill | SemVer/content hash・example identity・prompt checksum・テストを同期 |\n\n`tests/` はモジュール責務を反映し、API テストは `tests/api/fakes.py` / `conftest.py` を共用する。fake SQL と[実 DB](local-development.md#実-postgresql-の前提)の証跡は区別して記録する。"}, {"title": "Ingress", "level": "h2", "anchor": "ingress", "text": "## Ingress\n\n共有 Traefik を再利用し、`web`/`api` のみを edge network に参加させ、host port は公開しない。外部入口は `SKILLMIND_CONTEXT_PATH` 配下に統一し、API 転送時にプレフィックスを除去する。設定と移行は[配備手順](../operations/deployment.md)を参照。"}], "toc": [{"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "Run lifecycle", "anchor": "run-lifecycle", "level": "h2"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "同期点", "anchor": "同期点", "level": "h2"}, {"title": "Ingress", "anchor": "ingress", "level": "h2"}], "source": "development/coding-rules.md", "checksum": "a6aa97dee5f9e14ace58fcea980ae1d944ac0cbdf0c510e6abc03edd55b98087"}, {"id": "docs/development/contract-workflow.md", "title": "公開契約の変更と結合", "group": "development", "html": "\u003ch1 id=\"公開契約の変更と結合\">公開契約の変更と結合\u003c/h1>\n\u003cp>本ページは公開プロトコルおよび永続フォーマットの変更に適用する。内部リファクタリング・スタイル・文言のみの変更では Schema、版、migration を追加しない。保守境界は\u003ca href=\"#docs/development/runtime-guide.md::\">実行境界\u003c/a>、状態は\u003ca href=\"#docs/planning/roadmap.md::\">計画\u003c/a>、コマンド環境は\u003ca href=\"#docs/development/local-development.md::\">ローカル開発\u003c/a>を参照。\u003c/p>\n\u003ch2 id=\"交付経路の全体像\">交付経路の全体像\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">領域規則/認可/互換 → Schema/example → Backend\n  → Web/Worker → 契約・フロー回帰 → 版整合と配備\n\u003c/code>\u003c/pre>\n\u003cp>影響する層のみを更新する。\u003ccode>required\u003c/code> 追加・項目削除・enum 縮小・null 許容や HTTP 拒否意味の変更は、URL や \u003ccode>v1\u003c/code> ファイル名が同じでも互換性を壊し得る。\u003c/p>\n\u003ch2 id=\"3-種類のデータを混同しない\">3 種類のデータを混同しない\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>層\u003c/th>\n\u003cth>境界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>永続スナップショット\u003c/td>\n\u003ctd>当時の事実・フォーマット版・checksum を保持し、新画面のために旧 Run を書き換えない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公開応答\u003c/td>\n\u003ctd>認可後の allowlist 投影とし、内部 JSON の直接露出や元値の書き換えによるマスクを行わない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>画面状態\u003c/td>\n\u003ctd>validator 通過後にビューを生成し、履歴資源・主体・欠落項目を捏造しない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"消費者と同期順序の特定\">消費者と同期順序の特定\u003c/h2>\n\u003cp>\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%9C%9F%E7%82%B9\">同期点\u003c/a>に従い Worker・CLI・Schedule 等の経路を含む実際の消費者を特定し、影響項目のみを同期する。JSON 項目だけでなく route の status、media type、header、キャッシュ、Problem も照合する。\u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a> は app から生成し、手編集しない。\nSchema は認可や並行制御を検証せず、OpenAPI 整合は宣言が実応答を網羅することまでは保証しない（例：ログイン 429 では \u003ccode>Retry-After\u003c/code> と画面処理も確認する）。\u003c/p>\n\u003ch2 id=\"未接続の交付経路と検査\">未接続の交付経路と検査\u003c/h2>\n\u003cp>実際の route・配線・消費者から欠落箇所を特定する。DTO・example・単体テストの存在はユーザー動線の開通を意味しない。整合検査や一括テストの失敗は原因箇所を修復し、検証を無効化してエラーを隠さない。\u003c/p>\n\u003cp>読取検査は lifespan を起動せず、DB 接続や書き戻しも行わない。Backend 依存の準備後、\u003ccode>SKM/\u003c/code> で \u003ccode>python3 scripts/validate_contracts.py\u003c/code> を、\u003ccode>SKM/backend/\u003c/code> で以下を実行する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pytest -p no:cacheprovider -o addopts= -q \\\n  tests/contracts/test_contracts.py::test_exported_openapi_is_current\n\u003c/code>\u003c/pre>\n\u003cp>公開 API を変更した場合は \u003ccode>SKM/\u003c/code> で \u003ccode>python3 scripts/export_openapi.py\u003c/code> を実行し、消費者とテストを同期する（読取専用レビューや文書整理では再出力しない）。\u003c/p>\n\u003ch2 id=\"履歴互換と版互換\">履歴互換と版互換\u003c/h2>\n\u003cul>\n\u003cli>新 API で旧 Run を読む：明確な履歴状態を返し、現在の資源からスナップショットを補完しない。\u003c/li>\n\u003cli>新 Web で旧 API を読む：規定された互換形状のみを受け入れ、必須項目を空配列へ既定化しない。\u003c/li>\n\u003cli>旧 Web で新 API を読む：追加項目や enum を確認する。一括配備でも旧ブラウザ・Worker・処理中リクエストが残る。\u003c/li>\n\u003cli>API/Worker のロールバック：schema・キュー・非終端状態の読取互換を確認し、監査削除や検証緩和を行わない。\u003c/li>\n\u003c/ul>\n\u003cp>任意の表示データの破損は既存規則で縮退表示できるが、主体・認可・必須プロトコルエラーを成功へ縮退させてはならない。\u003c/p>\n\u003ch2 id=\"検証結果の記録\">検証結果の記録\u003c/h2>\n\u003cp>変更範囲に応じて文書・契約・Backend/Web・実トランザクション・配備/モデルの結果を報告し、mock・失敗・skip・未実行を明記する。\n実 DB や外部 write は承認された隔離対象のみで行う。継続的な能力不足は計画へ反映し、一時的な診断は交付報告に留めて履歴文書の追加や過去の通過件数の流用を行わない。\u003c/p>\n", "sections": [{"title": "公開契約の変更と結合", "level": "h1", "anchor": "公開契約の変更と結合", "text": "# 公開契約の変更と結合\n\n本ページは公開プロトコルおよび永続フォーマットの変更に適用する。内部リファクタリング・スタイル・文言のみの変更では Schema、版、migration を追加しない。保守境界は[実行境界](runtime-guide.md)、状態は[計画](../planning/roadmap.md)、コマンド環境は[ローカル開発](local-development.md)を参照。"}, {"title": "交付経路の全体像", "level": "h2", "anchor": "交付経路の全体像", "text": "## 交付経路の全体像\n\n```text\n領域規則/認可/互換 → Schema/example → Backend\n  → Web/Worker → 契約・フロー回帰 → 版整合と配備\n```\n\n影響する層のみを更新する。`required` 追加・項目削除・enum 縮小・null 許容や HTTP 拒否意味の変更は、URL や `v1` ファイル名が同じでも互換性を壊し得る。"}, {"title": "3 種類のデータを混同しない", "level": "h2", "anchor": "3-種類のデータを混同しない", "text": "## 3 種類のデータを混同しない\n\n| 層 | 境界 |\n| --- | --- |\n| 永続スナップショット | 当時の事実・フォーマット版・checksum を保持し、新画面のために旧 Run を書き換えない |\n| 公開応答 | 認可後の allowlist 投影とし、内部 JSON の直接露出や元値の書き換えによるマスクを行わない |\n| 画面状態 | validator 通過後にビューを生成し、履歴資源・主体・欠落項目を捏造しない |"}, {"title": "消費者と同期順序の特定", "level": "h2", "anchor": "消費者と同期順序の特定", "text": "## 消費者と同期順序の特定\n\n[同期点](coding-rules.md#同期点)に従い Worker・CLI・Schedule 等の経路を含む実際の消費者を特定し、影響項目のみを同期する。JSON 項目だけでなく route の status、media type、header、キャッシュ、Problem も照合する。[OpenAPI](../../SKM/contracts/openapi/skillmind-api.v1.json) は app から生成し、手編集しない。\nSchema は認可や並行制御を検証せず、OpenAPI 整合は宣言が実応答を網羅することまでは保証しない（例：ログイン 429 では `Retry-After` と画面処理も確認する）。"}, {"title": "未接続の交付経路と検査", "level": "h2", "anchor": "未接続の交付経路と検査", "text": "## 未接続の交付経路と検査\n\n実際の route・配線・消費者から欠落箇所を特定する。DTO・example・単体テストの存在はユーザー動線の開通を意味しない。整合検査や一括テストの失敗は原因箇所を修復し、検証を無効化してエラーを隠さない。\n\n読取検査は lifespan を起動せず、DB 接続や書き戻しも行わない。Backend 依存の準備後、`SKM/` で `python3 scripts/validate_contracts.py` を、`SKM/backend/` で以下を実行する。\n\n```bash\npython3 -m pytest -p no:cacheprovider -o addopts= -q \\\n  tests/contracts/test_contracts.py::test_exported_openapi_is_current\n```\n\n公開 API を変更した場合は `SKM/` で `python3 scripts/export_openapi.py` を実行し、消費者とテストを同期する（読取専用レビューや文書整理では再出力しない）。"}, {"title": "履歴互換と版互換", "level": "h2", "anchor": "履歴互換と版互換", "text": "## 履歴互換と版互換\n\n- 新 API で旧 Run を読む：明確な履歴状態を返し、現在の資源からスナップショットを補完しない。\n- 新 Web で旧 API を読む：規定された互換形状のみを受け入れ、必須項目を空配列へ既定化しない。\n- 旧 Web で新 API を読む：追加項目や enum を確認する。一括配備でも旧ブラウザ・Worker・処理中リクエストが残る。\n- API/Worker のロールバック：schema・キュー・非終端状態の読取互換を確認し、監査削除や検証緩和を行わない。\n\n任意の表示データの破損は既存規則で縮退表示できるが、主体・認可・必須プロトコルエラーを成功へ縮退させてはならない。"}, {"title": "検証結果の記録", "level": "h2", "anchor": "検証結果の記録", "text": "## 検証結果の記録\n\n変更範囲に応じて文書・契約・Backend/Web・実トランザクション・配備/モデルの結果を報告し、mock・失敗・skip・未実行を明記する。\n実 DB や外部 write は承認された隔離対象のみで行う。継続的な能力不足は計画へ反映し、一時的な診断は交付報告に留めて履歴文書の追加や過去の通過件数の流用を行わない。"}], "toc": [{"title": "交付経路の全体像", "anchor": "交付経路の全体像", "level": "h2"}, {"title": "3 種類のデータを混同しない", "anchor": "3-種類のデータを混同しない", "level": "h2"}, {"title": "消費者と同期順序の特定", "anchor": "消費者と同期順序の特定", "level": "h2"}, {"title": "未接続の交付経路と検査", "anchor": "未接続の交付経路と検査", "level": "h2"}, {"title": "履歴互換と版互換", "anchor": "履歴互換と版互換", "level": "h2"}, {"title": "検証結果の記録", "anchor": "検証結果の記録", "level": "h2"}], "source": "development/contract-workflow.md", "checksum": "79fd3257361d5804af907c8061edf491b025743c88bbe720f4c6ed858f80d9b2"}, {"id": "docs/development/api-usage.md", "title": "API 利用ガイド", "group": "development", "html": "\u003ch1 id=\"api-利用ガイド\">API 利用ガイド\u003c/h1>\n\u003cp>配備先の context path 配下に \u003ccode>/api/v1\u003c/code>、対話式仕様に \u003ccode>/api/docs\u003c/code> がある。正確な method/path/field は \u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a> と \u003ca href=\"#SKM/README.md::contracts\">Contracts\u003c/a> を参照する。\u003c/p>\n\u003ch2 id=\"認証\">認証\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>呼出元\u003c/th>\n\u003cth>方法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>外部アプリ\u003c/td>\n\u003ctd>\u003ccode>Authorization: Bearer \u0026lt;API_KEY\u0026gt;\u003c/code> または \u003ccode>X-API-Key: \u0026lt;API_KEY\u0026gt;\u003c/code> のどちらか一つ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ブラウザ session\u003c/td>\n\u003ctd>GET \u003ccode>/auth/login-context\u003c/code> → POST \u003ccode>/auth/login\u003c/code>（cookie・Origin・login CSRF を使用し、以後の unsafe request に \u003ccode>X-CSRF-Token\u003c/code> を送る）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>API Key は ADMIN が \u003ccode>/api-keys\u003c/code> で作成・一覧・失効でき、token 全文は作成時だけ取得する（組織内全資源対象、細粒度 scope なし）。明示 Key の不正・重複時は拒否し、cookie へ fallback しない。アカウント契約は \u003ca href=\"../SKM/contracts/users/v1\">users/v1\u003c/a>。\u003c/p>\n\u003ch2 id=\"タスクの開始と観察\">タスクの開始と観察\u003c/h2>\n\u003col>\n\u003cli>GET \u003ccode>/projects/{id}/tasks\u003c/code> で精確な SkillVersion/task_key、入力 Schema と資源候補を取得する。\u003c/li>\n\u003cli>POST \u003ccode>/projects/{id}/task-runs\u003c/code> に\u003ca href=\"../SKM/contracts/runs/task-create/v1/request.schema.json\">作成契約\u003c/a>と新規 \u003ccode>Idempotency-Key\u003c/code> を送る。\u003c/li>\n\u003cli>GET \u003ccode>/projects/{id}/runs/{run_id}/detail\u003c/code> と Run events を読む（作成受理・プラットフォーム終了・業務成功は別状態）。\u003c/li>\n\u003c/ol>\n\u003cp>SSE の再開には \u003ccode>Last-Event-ID\u003c/code> / \u003ccode>after\u003c/code> を使い、一時 \u003ccode>TEXT_DELTA\u003c/code> で位置を進めない。終了履歴は \u003ccode>/runs/{run_id}\u003c/code> の DELETE で回収、\u003ccode>/deletion-preview\u003c/code> の GET で確認、\u003ccode>/restore\u003c/code> の POST で復元、\u003ccode>/purge\u003c/code> の DELETE で完全削除する（原入力・共有参照・最小監査を保護し、外部 DB や Git は削除しない）。\u003c/p>\n\u003ch2 id=\"文書とディレクトリ\">文書とディレクトリ\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/api/routes/documents.py\">documents route\u003c/a> と OpenAPI から一覧・アップロード・元 byte 取得、\u003ccode>document-folders\u003c/code>、\u003ccode>document-operations\u003c/code> を利用する。完全削除は \u003ccode>DELETE /projects/{project_id}/documents/{document_id}?purge=true\u003c/code> を使う。\u003c/p>\n\u003cp>タスク入力の \u003ccode>sources\u003c/code> には \u003ccode>document:\u0026lt;UUID\u0026gt;\u003c/code>、\u003ccode>documents:\u0026lt;UUID\u0026gt;,\u0026lt;UUID\u0026gt;...\u003c/code>、\u003ccode>project-documents:all\u003c/code> を指定する（directory 選択時は配下の文書 ID 集合を送る）。Run detail の \u003ccode>document_snapshots\u003c/code> は作成時の凍結範囲であり、\u003ccode>LEGACY_UNAVAILABLE\u003c/code>/\u003ccode>INVALID\u003c/code> を空の正常 snapshot に置換しない。\u003c/p>\n\u003ch2 id=\"回答批准評価\">回答・批准・評価\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>普通の回答\u003c/strong>：\u003ccode>/projects/{id}/runs/{run_id}/interactions/{interaction_id}/responses\u003c/code> に原 version・\u003ca href=\"../SKM/contracts/runs/interaction-response/v1/request.schema.json\">回答契約\u003c/a>・\u003ccode>Idempotency-Key\u003c/code> を送る。\u003c/li>\n\u003cli>\u003cstrong>Proposal 批准\u003c/strong>：別 endpoint で原 version/checksum を維持し、現在の権限と起動時同意を再確認する。\u003c/li>\n\u003cli>\u003cstrong>人工評価\u003c/strong>：\u003ccode>evaluation-submissions\u003c/code> に \u003ccode>submission_key\u003c/code> と \u003ccode>result_id\u003c/code> を付ける（\u003ca href=\"../SKM/contracts/evaluations/v1/create-request.schema.json\">評価契約\u003c/a>に従い、元 Result を上書きしない）。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"再送と復旧\">再送と復旧\u003c/h2>\n\u003cp>帰档 Project の完全削除は \u003ccode>POST /projects/{project_id}/purge\u003c/code> に \u003ccode>expected_row_version\u003c/code> を送る（終了済み実行・回収箱・Project 文書と設定を削除し、組織 Skill・外部 DB・独立監査は保持；\u003ccode>cleanup_pending\u003c/code> は残存 blob 清掃件数）。\u003c/p>\n\u003cp>timeout/abort は rollback の証明ではない。原 actor・内容・key を保って照会し、409（競合）・410（期限）は現状を再読する。旧 Run を現在設定から再構成せず、\u003ca href=\"#docs/development/contract-workflow.md::%E5%B1%A5%E6%AD%B4%E4%BA%92%E6%8F%9B%E3%81%A8%E7%89%88%E4%BA%92%E6%8F%9B\">版互換\u003c/a>と\u003ca href=\"#docs/development/runtime-guide.md::\">実行境界\u003c/a>を維持する。\u003c/p>\n", "sections": [{"title": "API 利用ガイド", "level": "h1", "anchor": "api-利用ガイド", "text": "# API 利用ガイド\n\n配備先の context path 配下に `/api/v1`、対話式仕様に `/api/docs` がある。正確な method/path/field は [OpenAPI](../../SKM/contracts/openapi/skillmind-api.v1.json) と [Contracts](../../SKM/README.md#contracts) を参照する。"}, {"title": "認証", "level": "h2", "anchor": "認証", "text": "## 認証\n\n| 呼出元 | 方法 |\n| --- | --- |\n| 外部アプリ | `Authorization: Bearer \u003cAPI_KEY>` または `X-API-Key: \u003cAPI_KEY>` のどちらか一つ |\n| ブラウザ session | GET `/auth/login-context` → POST `/auth/login`（cookie・Origin・login CSRF を使用し、以後の unsafe request に `X-CSRF-Token` を送る） |\n\nAPI Key は ADMIN が `/api-keys` で作成・一覧・失効でき、token 全文は作成時だけ取得する（組織内全資源対象、細粒度 scope なし）。明示 Key の不正・重複時は拒否し、cookie へ fallback しない。アカウント契約は [users/v1](../../SKM/contracts/users/v1/)。"}, {"title": "タスクの開始と観察", "level": "h2", "anchor": "タスクの開始と観察", "text": "## タスクの開始と観察\n\n1. GET `/projects/{id}/tasks` で精確な SkillVersion/task_key、入力 Schema と資源候補を取得する。\n2. POST `/projects/{id}/task-runs` に[作成契約](../../SKM/contracts/runs/task-create/v1/request.schema.json)と新規 `Idempotency-Key` を送る。\n3. GET `/projects/{id}/runs/{run_id}/detail` と Run events を読む（作成受理・プラットフォーム終了・業務成功は別状態）。\n\nSSE の再開には `Last-Event-ID` / `after` を使い、一時 `TEXT_DELTA` で位置を進めない。終了履歴は `/runs/{run_id}` の DELETE で回収、`/deletion-preview` の GET で確認、`/restore` の POST で復元、`/purge` の DELETE で完全削除する（原入力・共有参照・最小監査を保護し、外部 DB や Git は削除しない）。"}, {"title": "文書とディレクトリ", "level": "h2", "anchor": "文書とディレクトリ", "text": "## 文書とディレクトリ\n\n[documents route](../../SKM/backend/src/skillmind/api/routes/documents.py) と OpenAPI から一覧・アップロード・元 byte 取得、`document-folders`、`document-operations` を利用する。完全削除は `DELETE /projects/{project_id}/documents/{document_id}?purge=true` を使う。\n\nタスク入力の `sources` には `document:\u003cUUID>`、`documents:\u003cUUID>,\u003cUUID>...`、`project-documents:all` を指定する（directory 選択時は配下の文書 ID 集合を送る）。Run detail の `document_snapshots` は作成時の凍結範囲であり、`LEGACY_UNAVAILABLE`/`INVALID` を空の正常 snapshot に置換しない。"}, {"title": "回答・批准・評価", "level": "h2", "anchor": "回答批准評価", "text": "## 回答・批准・評価\n\n- **普通の回答**：`/projects/{id}/runs/{run_id}/interactions/{interaction_id}/responses` に原 version・[回答契約](../../SKM/contracts/runs/interaction-response/v1/request.schema.json)・`Idempotency-Key` を送る。\n- **Proposal 批准**：別 endpoint で原 version/checksum を維持し、現在の権限と起動時同意を再確認する。\n- **人工評価**：`evaluation-submissions` に `submission_key` と `result_id` を付ける（[評価契約](../../SKM/contracts/evaluations/v1/create-request.schema.json)に従い、元 Result を上書きしない）。"}, {"title": "再送と復旧", "level": "h2", "anchor": "再送と復旧", "text": "## 再送と復旧\n\n帰档 Project の完全削除は `POST /projects/{project_id}/purge` に `expected_row_version` を送る（終了済み実行・回収箱・Project 文書と設定を削除し、組織 Skill・外部 DB・独立監査は保持；`cleanup_pending` は残存 blob 清掃件数）。\n\ntimeout/abort は rollback の証明ではない。原 actor・内容・key を保って照会し、409（競合）・410（期限）は現状を再読する。旧 Run を現在設定から再構成せず、[版互換](contract-workflow.md#履歴互換と版互換)と[実行境界](runtime-guide.md)を維持する。"}], "toc": [{"title": "認証", "anchor": "認証", "level": "h2"}, {"title": "タスクの開始と観察", "anchor": "タスクの開始と観察", "level": "h2"}, {"title": "文書とディレクトリ", "anchor": "文書とディレクトリ", "level": "h2"}, {"title": "回答・批准・評価", "anchor": "回答批准評価", "level": "h2"}, {"title": "再送と復旧", "anchor": "再送と復旧", "level": "h2"}], "source": "development/api-usage.md", "checksum": "5ca45639ed850ce81f4d5a8bff6bd39001fbaa44ad94e8a1c26636188671a967"}, {"id": "docs/development/documentation.md", "title": "文書維持", "group": "development", "html": "\u003ch1 id=\"文書維持\">文書維持\u003c/h1>\n\u003cp>正式文書には現在の利用・開発・運用を導く内容のみを残す。入口は\u003ca href=\"#docs/README.md::\">文書ガイド\u003c/a>、コードモジュール案内は \u003ca href=\"#SKM/README.md::\">SKM README\u003c/a> に集約する。\u003c/p>\n\u003ch2 id=\"残す内容\">残す内容\u003c/h2>\n\u003cul>\n\u003cli>利用者の操作手順、保守者が守るべき境界、実行可能な検証・復元コマンド。\u003c/li>\n\u003cli>重要な設計判断とコード/契約の入口（詳細なフィールド・状態図・実装手順はソースコードを直接参照し、並行仕様を重複管理しない）。\u003c/li>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::\">Roadmap\u003c/a> には現在の能力、再確認待ち事項、実利用に基づく改善方針のみを記録する。\u003c/li>\n\u003c/ul>\n\u003cp>各規則は単一のガイドでのみ保守し、他所からはリンクで参照する。廃止された詳細設計や進捗ログは正式ディレクトリに残さず、経緯は Git 履歴を参照する。\u003c/p>\n\u003ch2 id=\"整理の境界\">整理の境界\u003c/h2>\n\u003cp>\u003ccode>SKILL.md\u003c/code> および Skill の references/Schema/template は実行入力であり、製品文書の整理対象に含めない（業務規則・凍結内容・モデル設定を書き換えない）。\n実消費者が存在する安定アンカーは維持し、ページ統合時は入口と検査を更新する。\u003c/p>\n\u003cp>文書に資格情報・内部 URL・実業務本文・一時的な受入データを含めず、例示には合成値を使う。生成器は正式 Markdown と 3 つのルート入口のみを読み、\u003ccode>.env\u003c/code> や依存ディレクトリを走査しない。\u003c/p>\n\u003ch2 id=\"ビルドと検査\">ビルドと検査\u003c/h2>\n\u003cp>\u003ccode>SKM/\u003c/code> で実行する（生成物である \u003ccode>docs/index.html\u003c/code> は直接編集しない）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r scripts/docs-requirements.txt\npython3 scripts/build_docs.py\npython3 scripts/build_docs.py --check\npython3 -m unittest discover -s scripts/tests -p 'test_build_docs.py' -v\n\u003c/code>\u003c/pre>\n\u003cp>ビルドは見出し階層・コードフェンス・リンク・アンカー・ViewSpec 例を検証し、\u003ccode>--check\u003c/code> は生成結果が最新かも確認する。レイアウトやナビゲーションを変更した場合は、\u003ca href=\"#docs/development/local-development.md::%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E5%9B%9E%E5%B8%B0\">ブラウザ回帰依存\u003c/a>を導入して次を実行する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/check_docs_browser.py --output /tmp/skillmind-docs-check\n\u003c/code>\u003c/pre>\n\u003cp>全ページ・全章の複数ウィンドウ幅と文字サイズでのレイアウト、検索、実リンク、キーボード操作、履歴、印刷をローカルで検査する（業務環境へは接続しない）。完了時は変更範囲・実施した検査・未検証の制限を報告する。\u003c/p>\n", "sections": [{"title": "文書維持", "level": "h1", "anchor": "文書維持", "text": "# 文書維持\n\n正式文書には現在の利用・開発・運用を導く内容のみを残す。入口は[文書ガイド](../README.md)、コードモジュール案内は [SKM README](../../SKM/README.md) に集約する。"}, {"title": "残す内容", "level": "h2", "anchor": "残す内容", "text": "## 残す内容\n\n- 利用者の操作手順、保守者が守るべき境界、実行可能な検証・復元コマンド。\n- 重要な設計判断とコード/契約の入口（詳細なフィールド・状態図・実装手順はソースコードを直接参照し、並行仕様を重複管理しない）。\n- [Roadmap](../planning/roadmap.md) には現在の能力、再確認待ち事項、実利用に基づく改善方針のみを記録する。\n\n各規則は単一のガイドでのみ保守し、他所からはリンクで参照する。廃止された詳細設計や進捗ログは正式ディレクトリに残さず、経緯は Git 履歴を参照する。"}, {"title": "整理の境界", "level": "h2", "anchor": "整理の境界", "text": "## 整理の境界\n\n`SKILL.md` および Skill の references/Schema/template は実行入力であり、製品文書の整理対象に含めない（業務規則・凍結内容・モデル設定を書き換えない）。\n実消費者が存在する安定アンカーは維持し、ページ統合時は入口と検査を更新する。\n\n文書に資格情報・内部 URL・実業務本文・一時的な受入データを含めず、例示には合成値を使う。生成器は正式 Markdown と 3 つのルート入口のみを読み、`.env` や依存ディレクトリを走査しない。"}, {"title": "ビルドと検査", "level": "h2", "anchor": "ビルドと検査", "text": "## ビルドと検査\n\n`SKM/` で実行する（生成物である `docs/index.html` は直接編集しない）：\n\n```bash\npython3 -m pip install --user -r scripts/docs-requirements.txt\npython3 scripts/build_docs.py\npython3 scripts/build_docs.py --check\npython3 -m unittest discover -s scripts/tests -p 'test_build_docs.py' -v\n```\n\nビルドは見出し階層・コードフェンス・リンク・アンカー・ViewSpec 例を検証し、`--check` は生成結果が最新かも確認する。レイアウトやナビゲーションを変更した場合は、[ブラウザ回帰依存](local-development.md#ブラウザ回帰)を導入して次を実行する：\n\n```bash\npython3 scripts/check_docs_browser.py --output /tmp/skillmind-docs-check\n```\n\n全ページ・全章の複数ウィンドウ幅と文字サイズでのレイアウト、検索、実リンク、キーボード操作、履歴、印刷をローカルで検査する（業務環境へは接続しない）。完了時は変更範囲・実施した検査・未検証の制限を報告する。"}], "toc": [{"title": "残す内容", "anchor": "残す内容", "level": "h2"}, {"title": "整理の境界", "anchor": "整理の境界", "level": "h2"}, {"title": "ビルドと検査", "anchor": "ビルドと検査", "level": "h2"}], "source": "development/documentation.md", "checksum": "3769ec891922785087c90ca24fa0f853cf736747fec8eb0f2b18315efa5b7a17"}, {"id": "docs/operations/quickstart.md", "title": "起動と初期管理者", "group": "operations", "html": "\u003ch1 id=\"起動と初期管理者\">起動と初期管理者\u003c/h1>\n\u003cp>Windows で構築し、Linux では初回・更新とも \u003ccode>make deploy\u003c/code> を使う。配置と設定は\u003ca href=\"#docs/operations/deployment.md::\">配備手順\u003c/a>、データ復元は\u003ca href=\"#docs/operations/backup-recovery.md::\">backup\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"compose-の前提\">Compose の前提\u003c/h2>\n\u003cp>Windows は Rancher Desktop（Moby）+ PowerShell + Docker Compose、Linux は Docker Compose v2 + GNU make を使う（宿主 Python/Node は不要）。共有 Traefik と external edge network は既存基盤を利用する。\u003c/p>\n\u003ch2 id=\"image-移送と更新\">Image 移送と更新\u003c/h2>\n\u003cp>Windows の \u003ccode>SKM/\u003c/code> で実行する（再 export は \u003ccode>-Force\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">docker compose build api web\n.\\scripts\\export-images.ps1\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>images/images.tar、compose.yml、Makefile\u003c/strong> を Linux の同一 directory へコピーし、サーバー \u003ccode>.env\u003c/code> を維持する。完全 offline の初回は\u003ca href=\"#docs/operations/deployment.md::windows-%E6%A7%8B%E7%AF%89%E3%81%A8%E7%A7%BB%E9%80%81\">基盤 image も同梱\u003c/a>する。\u003c/p>\n\u003ch2 id=\"初回設定と基盤起動\">初回設定と基盤起動\u003c/h2>\n\u003cp>\u003ccode>.env\u003c/code> が無い初回だけ \u003ccode>.env.example\u003c/code> から作り、host/context path、TLS、Traefik network、DB/ストレージ、KEK/model を設定する。新ストレージには非零 UUID の \u003ccode>SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID\u003c/code> を設定し、更新時は既存値・project 名・データ巻を維持する。\u003c/p>\n\u003cp>四 file のある Linux directory で実行する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make deploy\n\u003c/code>\u003c/pre>\n\u003cp>image 導入、基盤と bucket 準備、DB migration、API/Worker/Maintenance/Web 起動を順に行う。更新判断と失敗時の操作は\u003ca href=\"#docs/operations/deployment.md::%E7%A7%BB%E8%A1%8C%E5%89%8D%E6%8F%90%E3%81%A8%E5%AE%9F%E8%A1%8C\">配備手順\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"最初の-admin-を作成する\">最初の ADMIN を作成する\u003c/h2>\n\u003cp>初回 deploy 成功後に対話入力する（既存 ADMIN があれば拒否され、password 再設定には使えない）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make bootstrap-admin\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"最初の業務実行\">最初の業務実行\u003c/h2>\n\u003cp>ADMIN でログインし、Project/メンバー、Integration/資源、Skill の取込・公開を行う。業務配送には \u003ccode>SKILLMIND_WORKER_DISPATCH_ENABLED=true\u003c/code> と\u003ca href=\"#docs/operations/deployment.md::%E7%A7%BB%E8%A1%8C%E5%89%8D%E6%8F%90%E3%81%A8%E5%AE%9F%E8%A1%8C\">対応する機能設定\u003c/a>が必要。\u003c/p>\n\u003ch2 id=\"操作の区別\">操作の区別\u003c/h2>\n\u003cp>\u003ccode>make status\u003c/code>（一覧）、\u003ccode>make logs\u003c/code>（直近 log）、\u003ccode>make logs-follow\u003c/code>（追跡）、\u003ccode>make stop\u003c/code>（基盤を含む停止）、\u003ccode>make down\u003c/code>（container/network 削除、named volume 維持）、\u003ccode>make run\u003c/code>（deploy の別名）。\u003c/p>\n", "sections": [{"title": "起動と初期管理者", "level": "h1", "anchor": "起動と初期管理者", "text": "# 起動と初期管理者\n\nWindows で構築し、Linux では初回・更新とも `make deploy` を使う。配置と設定は[配備手順](deployment.md)、データ復元は[backup](backup-recovery.md)を参照する。"}, {"title": "Compose の前提", "level": "h2", "anchor": "compose-の前提", "text": "## Compose の前提\n\nWindows は Rancher Desktop（Moby）+ PowerShell + Docker Compose、Linux は Docker Compose v2 + GNU make を使う（宿主 Python/Node は不要）。共有 Traefik と external edge network は既存基盤を利用する。"}, {"title": "Image 移送と更新", "level": "h2", "anchor": "image-移送と更新", "text": "## Image 移送と更新\n\nWindows の `SKM/` で実行する（再 export は `-Force`）：\n\n```powershell\ndocker compose build api web\n.\\scripts\\export-images.ps1\n```\n\n**images/images.tar、compose.yml、Makefile** を Linux の同一 directory へコピーし、サーバー `.env` を維持する。完全 offline の初回は[基盤 image も同梱](deployment.md#windows-構築と移送)する。"}, {"title": "初回設定と基盤起動", "level": "h2", "anchor": "初回設定と基盤起動", "text": "## 初回設定と基盤起動\n\n`.env` が無い初回だけ `.env.example` から作り、host/context path、TLS、Traefik network、DB/ストレージ、KEK/model を設定する。新ストレージには非零 UUID の `SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID` を設定し、更新時は既存値・project 名・データ巻を維持する。\n\n四 file のある Linux directory で実行する：\n\n```bash\nmake deploy\n```\n\nimage 導入、基盤と bucket 準備、DB migration、API/Worker/Maintenance/Web 起動を順に行う。更新判断と失敗時の操作は[配備手順](deployment.md#移行前提と実行)を参照する。"}, {"title": "最初の ADMIN を作成する", "level": "h2", "anchor": "最初の-admin-を作成する", "text": "## 最初の ADMIN を作成する\n\n初回 deploy 成功後に対話入力する（既存 ADMIN があれば拒否され、password 再設定には使えない）：\n\n```bash\nmake bootstrap-admin\n```"}, {"title": "最初の業務実行", "level": "h2", "anchor": "最初の業務実行", "text": "## 最初の業務実行\n\nADMIN でログインし、Project/メンバー、Integration/資源、Skill の取込・公開を行う。業務配送には `SKILLMIND_WORKER_DISPATCH_ENABLED=true` と[対応する機能設定](deployment.md#移行前提と実行)が必要。"}, {"title": "操作の区別", "level": "h2", "anchor": "操作の区別", "text": "## 操作の区別\n\n`make status`（一覧）、`make logs`（直近 log）、`make logs-follow`（追跡）、`make stop`（基盤を含む停止）、`make down`（container/network 削除、named volume 維持）、`make run`（deploy の別名）。"}], "toc": [{"title": "Compose の前提", "anchor": "compose-の前提", "level": "h2"}, {"title": "Image 移送と更新", "anchor": "image-移送と更新", "level": "h2"}, {"title": "初回設定と基盤起動", "anchor": "初回設定と基盤起動", "level": "h2"}, {"title": "最初の ADMIN を作成する", "anchor": "最初の-admin-を作成する", "level": "h2"}, {"title": "最初の業務実行", "anchor": "最初の業務実行", "level": "h2"}, {"title": "操作の区別", "anchor": "操作の区別", "level": "h2"}], "source": "operations/quickstart.md", "checksum": "a17082dbd64ca0b50685f57596e1150602a391cd3a97effb08f4e31a1270b55b"}, {"id": "docs/operations/deployment.md", "title": "配備・移行・起動", "group": "operations", "html": "\u003ch1 id=\"配備移行起動\">配備・移行・起動\u003c/h1>\n\u003cp>Windows でイメージを構築し、Linux で Docker Compose + GNU make により配備する。初回・更新ともに \u003ccode>make deploy\u003c/code> を実行する。初回設定は \u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>、データ復元は\u003ca href=\"#docs/operations/backup-recovery.md::\">復元\u003c/a>を参照。\u003c/p>\n\u003ch2 id=\"環境ファイルと設定境界\">環境ファイルと設定境界\u003c/h2>\n\u003cp>サーバーの同一配備ディレクトリに \u003ccode>images.tar\u003c/code>・\u003ccode>compose.yml\u003c/code>・\u003ccode>.env\u003c/code>・\u003ccode>Makefile\u003c/code> を配置する。\u003ca href=\"../SKM/compose.yml\">Compose\u003c/a> がサービスを、\u003ca href=\"../SKM/Makefile\">Makefile\u003c/a> が配備手順を定義する。更新時はイメージアーカイブ・Compose・Makefile を差し替え、サーバーの \u003ccode>.env\u003c/code> は保持する。イメージには system Interpreter のみが含まれ、業務 Skill は画面から取り込む。\u003c/p>\n\u003cp>既定ではカレントディレクトリの \u003ccode>.env\u003c/code> を読み込む（dotenv を \u003ccode>source\u003c/code> しないこと）。別パスを使う場合は \u003ccode>export ENV_FILE=/path/app.env\u003c/code> の後に \u003ccode>make deploy\u003c/code> を実行し、生の Compose コマンドには \u003ccode>--env-file \u0026quot;${ENV_FILE:-.env}\u0026quot;\u003c/code> を渡す。更新時は元の \u003ccode>COMPOSE_PROJECT_NAME\u003c/code> とデータボリュームを維持する。\u003c/p>\n\u003cp>既存の Traefik と外部ネットワークを再利用し、host port は公開しない。ドメイン・TLS・ネットワーク・\u003ccode>SKILLMIND_CONTEXT_PATH\u003c/code> を一致させること（Web の context path はイメージに焼き込まれるため、変更時は Web の再構築が必要）。\u003ccode>SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID\u003c/code> は非ゼロ UUID とし全 Backend で共有する（新規ストレージでは新規生成し、更新時は既存値を維持）。Excel アップロードには \u003ccode>.xlsx\u003c/code> / \u003ccode>.xls\u003c/code> の実 MIME タイプを許可リストに含める。\u003c/p>\n\u003ch2 id=\"agent-sdk-と-device-code-ログイン\">Agent SDK と device code ログイン\u003c/h2>\n\u003cp>API・業務 \u003ccode>worker\u003c/code>・\u003ccode>maintenance\u003c/code> は Backend イメージと \u003ccode>.env\u003c/code> を共有する。業務 Worker はモデルとツールを実行し、保守 Worker は専用キューで Outbox・回収・定期発火を実行する（Run/Codex ボリュームはマウントしない）。更新時は 3 サービスすべてを含める。\u003c/p>\n\u003cp>\u003ccode>SKILLMIND_AGENT_SDK\u003c/code> で Interpreter と Run のエンジンを選択する（既定は Codex、設定は\u003ca href=\"../SKM/.env.example\">環境テンプレート\u003c/a>を参照）。更新時はサーバーの既存値を維持し、不足項目のみを補う。配備後にデバイスログインを実行する（ログインとセッションは \u003ccode>codex-data\u003c/code> ボリュームに保存され、更新時も維持される）。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T worker python -m skillmind.agent.codex_login\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T worker python -m skillmind.agent.codex_login --status\n\u003c/code>\u003c/pre>\n\u003cp>プロキシが必要な場合は \u003ccode>SKILLMIND_WORKER_HTTP_PROXY\u003c/code> / \u003ccode>SKILLMIND_WORKER_HTTPS_PROXY\u003c/code> / \u003ccode>SKILLMIND_WORKER_NO_PROXY\u003c/code> を設定して業務 Worker を再作成する。Claude を使う場合は \u003ccode>SKILLMIND_AGENT_SDK=claude\u003c/code> と Anthropic 互換エンドポイント・資格情報・モデルを設定し、切替前に処理中タスクを整理して Backend を一括更新する（エンジン間でセッションは互換しない）。\u003c/p>\n\u003ch2 id=\"移行前提と実行\">移行前提と実行\u003c/h2>\n\u003cp>\u003ccode>make deploy\u003c/code> は対象 Compose project のアプリサービスを停止し、マイグレーション後にバックグラウンドを自動復旧してキューを消費する。\u003ccode>SKILLMIND_WORKER_DISPATCH_ENABLED=false\u003c/code> は新規業務 job の配送のみを止め、処理中呼出の取消や保守プロセスの停止は行わない。\u003c/p>\n\u003cp>必要に応じて以下の機能スイッチを有効化する（既定はすべて \u003ccode>false\u003c/code>、API/Worker/Maintenance で一致させること）。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>設定名（接頭辞 \u003ccode>SKILLMIND_\u003c/code>）\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>WORKER_DISPATCH_ENABLED\u003c/code>\u003c/td>\n\u003ctd>Run・Effect・解釈・照合 job の配送と実行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DATABASE_WRITES_ENABLED\u003c/code>\u003c/td>\n\u003ctd>PostgreSQL INSERT/UPDATE/DELETE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DOCUMENT_WRITES_ENABLED\u003c/code>\u003c/td>\n\u003ctd>Project 文書ライブラリの Artifact CREATE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GIT_WRITES_ENABLED\u003c/code>\u003c/td>\n\u003ctd>制御下 Git commit/push\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>MCP_TOOLS_ENABLED\u003c/code>\u003c/td>\n\u003ctd>認可済み MCP ツール検出・読取・制御下呼出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>SCHEDULING_ENABLED\u003c/code>\u003c/td>\n\u003ctd>定期発火（業務配送の有効化も必要）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DEFERRED_FEATURES_ENABLED\u003c/code>\u003c/td>\n\u003ctd>その他後置能力のスイッチ\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>機能スイッチに加え、資源範囲・タスク束縛・承認の設定が必要となる（境界は\u003ca href=\"#docs/development/runtime-guide.md::\">実行・データ保守ガイド\u003c/a>を参照）。原生 SQL は DB アカウントの業務テーブル権限を使い、対象 DB にプラットフォーム用テーブルを作成しない。旧 \u003ccode>database.write/v1\u003c/code> を明示利用する場合だけ\u003ca href=\"../SKM/scripts/sql/postgres-effect-receipts.sql\">回執テーブル SQL\u003c/a> が必要となる。MCP 接続は完全な Streamable HTTP \u003ccode>/mcp\u003c/code> URL と資格情報を入力し、資源編集画面でツールを検出してアクセス権を保存すると有効になる。\u003c/p>\n\u003ch3 id=\"windows-構築と移送\">Windows 構築と移送\u003c/h3>\n\u003cp>ソース \u003ccode>SKM/\u003c/code> の PowerShell で実行する（再出力時は \u003ccode>-Force\u003c/code> を付与）。\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">docker compose build api web\n.\\scripts\\export-images.ps1\n\u003c/code>\u003c/pre>\n\u003cp>スクリプトはローカルの \u003ccode>skillmind/backend:0.1.0\u003c/code>・\u003ccode>skillmind/web:0.1.0\u003c/code> のみを出力する（ビルドアーキテクチャはサーバーと一致させること）。完全オフライン環境への初回配備では基盤イメージも取得して同梱出力できる。\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">docker compose pull postgres redis object-storage object-storage-init\n.\\scripts\\export-images.ps1 -IncludeInfrastructure -Force\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"linux-検証と配備\">Linux 検証と配備\u003c/h3>\n\u003cp>4 ファイルを置いたディレクトリで \u003ccode>make deploy\u003c/code> を実行する。主な段階は以下のとおり。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段階\u003c/th>\n\u003cth>動作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>configuration / cleanup-old-images / load-images / prepare-images\u003c/td>\n\u003ctd>設定検証、未参照の旧アプリイメージ削除、イメージ読込とアーキテクチャ確認\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stop-application / infrastructure / initialize-storage\u003c/td>\n\u003ctd>現アプリの停止、基盤起動、バケット作成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>migration-check / migrate / readiness\u003c/td>\n\u003ctd>マイグレーション経路検証、\u003ccode>upgrade head\u003c/code>、DB/Redis/ストレージ設定検査\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>backend / runtime-check / web / cleanup-replaced-images\u003c/td>\n\u003ctd>API/Worker/Maintenance の一括再作成、整合確認後の Web 復旧と旧イメージ削除\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>失敗時は元エラー・段階・終了コードを表示して後続手順を停止する。状態を確認してから再試行を判断する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make status\nmake logs\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; run --rm -T --no-deps migrate alembic current\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; run --rm -T --no-deps migrate alembic heads\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"一括更新と検査\">一括更新と検査\u003c/h2>\n\u003cp>\u003ccode>make runtime-check\u003c/code> は Backend 各レプリカの実 image ID と設定 fingerprint を照合する（モデル呼出や業務データのクエリは行わない）。\u003c/p>\n\u003ch2 id=\"移行とロールバック審査\">移行とロールバック審査\u003c/h2>\n\u003cp>今回関連する \u003ca href=\"../SKM/backend/migrations/versions\">migration\u003c/a> とプロトコル消費者を照合する。未知の revision・複数 head・マイグレーション失敗時はまず DB 状態を確認し、\u003ccode>stamp\u003c/code>・監査削除・キュー消去を行わない。旧イメージは現在の schema・スナップショット・キューと互換する場合のみ戻せる（\u003ca href=\"#docs/operations/backup-recovery.md::%E3%82%A2%E3%83%97%E3%83%AA%E7%89%88%E3%81%AE%E3%83%AD%E3%83%BC%E3%83%AB%E3%83%90%E3%83%83%E3%82%AF\">アプリ版のロールバック\u003c/a>を参照）。\u003c/p>\n\u003ch2 id=\"web-のみの更新\">Web のみの更新\u003c/h2>\n\u003cp>フロントエンドのみの変更では、\u003ccode>web\u003c/code> イメージのみを構築・出力してサーバー（\u003ccode>skillmind/backend:0.1.0\u003c/code> が存在すること）で \u003ccode>make deploy\u003c/code> を実行できる。配備前に API・契約・context path の互換性を確認すること。\u003c/p>\n", "sections": [{"title": "配備・移行・起動", "level": "h1", "anchor": "配備移行起動", "text": "# 配備・移行・起動\n\nWindows でイメージを構築し、Linux で Docker Compose + GNU make により配備する。初回・更新ともに `make deploy` を実行する。初回設定は [Quickstart](quickstart.md)、データ復元は[復元](backup-recovery.md)を参照。"}, {"title": "環境ファイルと設定境界", "level": "h2", "anchor": "環境ファイルと設定境界", "text": "## 環境ファイルと設定境界\n\nサーバーの同一配備ディレクトリに `images.tar`・`compose.yml`・`.env`・`Makefile` を配置する。[Compose](../../SKM/compose.yml) がサービスを、[Makefile](../../SKM/Makefile) が配備手順を定義する。更新時はイメージアーカイブ・Compose・Makefile を差し替え、サーバーの `.env` は保持する。イメージには system Interpreter のみが含まれ、業務 Skill は画面から取り込む。\n\n既定ではカレントディレクトリの `.env` を読み込む（dotenv を `source` しないこと）。別パスを使う場合は `export ENV_FILE=/path/app.env` の後に `make deploy` を実行し、生の Compose コマンドには `--env-file \"${ENV_FILE:-.env}\"` を渡す。更新時は元の `COMPOSE_PROJECT_NAME` とデータボリュームを維持する。\n\n既存の Traefik と外部ネットワークを再利用し、host port は公開しない。ドメイン・TLS・ネットワーク・`SKILLMIND_CONTEXT_PATH` を一致させること（Web の context path はイメージに焼き込まれるため、変更時は Web の再構築が必要）。`SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID` は非ゼロ UUID とし全 Backend で共有する（新規ストレージでは新規生成し、更新時は既存値を維持）。Excel アップロードには `.xlsx` / `.xls` の実 MIME タイプを許可リストに含める。"}, {"title": "Agent SDK と device code ログイン", "level": "h2", "anchor": "agent-sdk-と-device-code-ログイン", "text": "## Agent SDK と device code ログイン\n\nAPI・業務 `worker`・`maintenance` は Backend イメージと `.env` を共有する。業務 Worker はモデルとツールを実行し、保守 Worker は専用キューで Outbox・回収・定期発火を実行する（Run/Codex ボリュームはマウントしない）。更新時は 3 サービスすべてを含める。\n\n`SKILLMIND_AGENT_SDK` で Interpreter と Run のエンジンを選択する（既定は Codex、設定は[環境テンプレート](../../SKM/.env.example)を参照）。更新時はサーバーの既存値を維持し、不足項目のみを補う。配備後にデバイスログインを実行する（ログインとセッションは `codex-data` ボリュームに保存され、更新時も維持される）。\n\n```bash\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec -T worker python -m skillmind.agent.codex_login\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec -T worker python -m skillmind.agent.codex_login --status\n```\n\nプロキシが必要な場合は `SKILLMIND_WORKER_HTTP_PROXY` / `SKILLMIND_WORKER_HTTPS_PROXY` / `SKILLMIND_WORKER_NO_PROXY` を設定して業務 Worker を再作成する。Claude を使う場合は `SKILLMIND_AGENT_SDK=claude` と Anthropic 互換エンドポイント・資格情報・モデルを設定し、切替前に処理中タスクを整理して Backend を一括更新する（エンジン間でセッションは互換しない）。"}, {"title": "移行前提と実行", "level": "h2", "anchor": "移行前提と実行", "text": "## 移行前提と実行\n\n`make deploy` は対象 Compose project のアプリサービスを停止し、マイグレーション後にバックグラウンドを自動復旧してキューを消費する。`SKILLMIND_WORKER_DISPATCH_ENABLED=false` は新規業務 job の配送のみを止め、処理中呼出の取消や保守プロセスの停止は行わない。\n\n必要に応じて以下の機能スイッチを有効化する（既定はすべて `false`、API/Worker/Maintenance で一致させること）。\n\n| 設定名（接頭辞 `SKILLMIND_`） | 用途 |\n| --- | --- |\n| `WORKER_DISPATCH_ENABLED` | Run・Effect・解釈・照合 job の配送と実行 |\n| `DATABASE_WRITES_ENABLED` | PostgreSQL INSERT/UPDATE/DELETE |\n| `DOCUMENT_WRITES_ENABLED` | Project 文書ライブラリの Artifact CREATE |\n| `GIT_WRITES_ENABLED` | 制御下 Git commit/push |\n| `MCP_TOOLS_ENABLED` | 認可済み MCP ツール検出・読取・制御下呼出 |\n| `SCHEDULING_ENABLED` | 定期発火（業務配送の有効化も必要） |\n| `DEFERRED_FEATURES_ENABLED` | その他後置能力のスイッチ |\n\n機能スイッチに加え、資源範囲・タスク束縛・承認の設定が必要となる（境界は[実行・データ保守ガイド](../development/runtime-guide.md)を参照）。原生 SQL は DB アカウントの業務テーブル権限を使い、対象 DB にプラットフォーム用テーブルを作成しない。旧 `database.write/v1` を明示利用する場合だけ[回執テーブル SQL](../../SKM/scripts/sql/postgres-effect-receipts.sql) が必要となる。MCP 接続は完全な Streamable HTTP `/mcp` URL と資格情報を入力し、資源編集画面でツールを検出してアクセス権を保存すると有効になる。"}, {"title": "Windows 構築と移送", "level": "h3", "anchor": "windows-構築と移送", "text": "### Windows 構築と移送\n\nソース `SKM/` の PowerShell で実行する（再出力時は `-Force` を付与）。\n\n```powershell\ndocker compose build api web\n.\\scripts\\export-images.ps1\n```\n\nスクリプトはローカルの `skillmind/backend:0.1.0`・`skillmind/web:0.1.0` のみを出力する（ビルドアーキテクチャはサーバーと一致させること）。完全オフライン環境への初回配備では基盤イメージも取得して同梱出力できる。\n\n```powershell\ndocker compose pull postgres redis object-storage object-storage-init\n.\\scripts\\export-images.ps1 -IncludeInfrastructure -Force\n```"}, {"title": "Linux 検証と配備", "level": "h3", "anchor": "linux-検証と配備", "text": "### Linux 検証と配備\n\n4 ファイルを置いたディレクトリで `make deploy` を実行する。主な段階は以下のとおり。\n\n| 段階 | 動作 |\n| --- | --- |\n| configuration / cleanup-old-images / load-images / prepare-images | 設定検証、未参照の旧アプリイメージ削除、イメージ読込とアーキテクチャ確認 |\n| stop-application / infrastructure / initialize-storage | 現アプリの停止、基盤起動、バケット作成 |\n| migration-check / migrate / readiness | マイグレーション経路検証、`upgrade head`、DB/Redis/ストレージ設定検査 |\n| backend / runtime-check / web / cleanup-replaced-images | API/Worker/Maintenance の一括再作成、整合確認後の Web 復旧と旧イメージ削除 |\n\n失敗時は元エラー・段階・終了コードを表示して後続手順を停止する。状態を確認してから再試行を判断する。\n\n```bash\nmake status\nmake logs\ndocker compose --env-file \"${ENV_FILE:-.env}\" run --rm -T --no-deps migrate alembic current\ndocker compose --env-file \"${ENV_FILE:-.env}\" run --rm -T --no-deps migrate alembic heads\n```"}, {"title": "一括更新と検査", "level": "h2", "anchor": "一括更新と検査", "text": "## 一括更新と検査\n\n`make runtime-check` は Backend 各レプリカの実 image ID と設定 fingerprint を照合する（モデル呼出や業務データのクエリは行わない）。"}, {"title": "移行とロールバック審査", "level": "h2", "anchor": "移行とロールバック審査", "text": "## 移行とロールバック審査\n\n今回関連する [migration](../../SKM/backend/migrations/versions/) とプロトコル消費者を照合する。未知の revision・複数 head・マイグレーション失敗時はまず DB 状態を確認し、`stamp`・監査削除・キュー消去を行わない。旧イメージは現在の schema・スナップショット・キューと互換する場合のみ戻せる（[アプリ版のロールバック](backup-recovery.md#アプリ版のロールバック)を参照）。"}, {"title": "Web のみの更新", "level": "h2", "anchor": "web-のみの更新", "text": "## Web のみの更新\n\nフロントエンドのみの変更では、`web` イメージのみを構築・出力してサーバー（`skillmind/backend:0.1.0` が存在すること）で `make deploy` を実行できる。配備前に API・契約・context path の互換性を確認すること。"}], "toc": [{"title": "環境ファイルと設定境界", "anchor": "環境ファイルと設定境界", "level": "h2"}, {"title": "Agent SDK と device code ログイン", "anchor": "agent-sdk-と-device-code-ログイン", "level": "h2"}, {"title": "移行前提と実行", "anchor": "移行前提と実行", "level": "h2"}, {"title": "Windows 構築と移送", "anchor": "windows-構築と移送", "level": "h3"}, {"title": "Linux 検証と配備", "anchor": "linux-検証と配備", "level": "h3"}, {"title": "一括更新と検査", "anchor": "一括更新と検査", "level": "h2"}, {"title": "移行とロールバック審査", "anchor": "移行とロールバック審査", "level": "h2"}, {"title": "Web のみの更新", "anchor": "web-のみの更新", "level": "h2"}], "source": "operations/deployment.md", "checksum": "9b6535dd96afa8879c946a0c8e4373128dedfc40a31c81dc20b2f193b50ea8a2"}, {"id": "docs/operations/backup-recovery.md", "title": "バックアップ・復元・ロールバック", "group": "operations", "html": "\u003ch1 id=\"バックアップ復元ロールバック\">バックアップ・復元・ロールバック\u003c/h1>\n\u003cp>本ページはデータ保護・障害復元・アプリ版のロールバックを扱う。通常の配備は\u003ca href=\"#docs/operations/deployment.md::\">配備\u003c/a>を参照し、データ価値・移行・復元要件に応じてバックアップを実施する。\u003c/p>\n\u003ch2 id=\"復元点の取得\">復元点の取得\u003c/h2>\n\u003cp>DB・オブジェクトストレージ・実行ファイルを跨ぐ一致復元点を取得する際は、新規業務と発火を止め、処理中書込の収束を確認して全 writer を停止する。結果不明の外部効果は\u003ca href=\"#docs/operations/runbook.md::incident-%E3%81%A8-recovery\">原主体での照合\u003c/a>に従う（単一インスタンスの停止や \u003ccode>dispatch=false\u003c/code> のみでは全体停止にならない）。\u003c/p>\n\u003ch3 id=\"一致復元点の内容\">一致復元点の内容\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>資産\u003c/th>\n\u003cth>保全内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>PostgreSQL\u003c/td>\n\u003ctd>完全 dump・DB 識別子・migration revision・書込停止時刻。スナップショット・原要求・承認・Outbox・監査を保持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>オブジェクトストレージ\u003c/td>\n\u003ctd>Skill/文書/添付の原バイト・key/hash・DB 参照・ストレージ namespace/設定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run・Codex ボリューム\u003c/td>\n\u003ctd>復元対象の workspace・入力・transcript・原生セッション（ログイン材料は資格情報として保護）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>イメージと設定\u003c/td>\n\u003ctd>アプリおよび依存 image ID・互換設定・context path\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>KEK\u003c/td>\n\u003ctd>現在および旧バックアップに必要な全バージョン（dump とは独立して管理保管）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部事実\u003c/td>\n\u003ctd>原操作 ID・回執・リモート revision・復元点以降の書込や権限剥奪\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>復元点 ID・UTC 窓・資産参照と checksum・欠落項目・復元訓練結果を記録する。Redis は業務正本ではないため、旧キュー/lease/スケジュールは個別に照合し、Redis 消去を復元の代替としない。現在ストレージ横断の自動バックアップや統合復元ツールはなく、DB dump 単独ではシステム全体を復元できない。\u003c/p>\n\u003ch3 id=\"db-バックアップの取得と検査\">DB バックアップの取得と検査\u003c/h3>\n\u003cp>対象配備ディレクトリで実行する（DB のみ、2 ブロックは同一シェルで実行）。失敗時に生成されたファイルは現場証跡として残し、有効なバックアップとは扱わない。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">umask 077\nSKM_BACKUP_DIR=\u0026quot;$(mktemp -d ./skillmind-backup-XXXXXXXX)\u0026quot; \u0026amp;\u0026amp;\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres sh -ceu \\\n  'pg_dump --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; --format=custom' \\\n  \u0026gt; \u0026quot;${SKM_BACKUP_DIR:?Backup directory is required}/database.dump\u0026quot;\n\u003c/code>\u003c/pre>\n\u003cp>成功後にアーカイブ目次を検査してハッシュを生成する（パスワードはコマンドラインに含めない）。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${SKM_BACKUP_DIR:?Specify the directory created for this backup}\u0026quot;\n  test -s \u0026quot;$SKM_BACKUP_DIR/database.dump\u0026quot;\n  docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres pg_restore --list \\\n    \u0026lt; \u0026quot;$SKM_BACKUP_DIR/database.dump\u0026quot; \u0026gt; \u0026quot;$SKM_BACKUP_DIR/database.toc\u0026quot;\n  docker image inspect skillmind/backend:0.1.0 skillmind/web:0.1.0 \\\n    --format '{{.RepoTags}} {{.Id}}' \u0026gt; \u0026quot;$SKM_BACKUP_DIR/images.txt\u0026quot;\n  cd \u0026quot;$SKM_BACKUP_DIR\u0026quot;\n  sha256sum database.dump \u0026gt; database.dump.sha256\n  sha256sum --check database.dump.sha256\n)\n\u003c/code>\u003c/pre>\n\u003cp>dump・TOC・実行ファイル・設定は管理下で保管する。checksum は完全性を示すが出所や復元可能性までは保証しないため、隔離環境での復元訓練で確認する。\u003c/p>\n\u003ch2 id=\"データベース復元\">データベース復元\u003c/h2>\n\u003cp>\u003cstrong>以下の手順はデータベースを削除・置換し、復元点以降のローカルデータを失わせる。\u003c/strong> 復元対象の特定・現状保全・dump と関連資産・互換イメージ・旧 KEK・書込停止範囲を確認してから実行する。事前に検証済みバックアップディレクトリを \u003ccode>SKM_RESTORE_DIR\u003c/code> に設定する。\u003c/p>\n\u003ch3 id=\"復元前の停止条件\">復元前の停止条件\u003c/h3>\n\u003cp>まず材料を検査し、失敗した場合は即中止する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${SKM_RESTORE_DIR:?Specify the verified backup directory}\u0026quot;\n  test -s \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot;\n  docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres pg_restore --list \\\n    \u0026lt; \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot; \u0026gt; /dev/null\n  cd \u0026quot;$SKM_RESTORE_DIR\u0026quot;\n  sha256sum --check database.dump.sha256\n)\n\u003c/code>\u003c/pre>\n\u003cp>他インスタンスの書込停止も確認した上で本 project のアプリを停止し、対象 DB とロールが復元先と一致することを確認する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; stop api web worker maintenance migrate object-storage-init\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres sh -ceu '\n  psql --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; --no-psqlrc \\\n    --set=ON_ERROR_STOP=1 --command=\u0026quot;SELECT current_database(), current_user\u0026quot;\n'\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"データベースの置換\">データベースの置換\u003c/h3>\n\u003cp>以下は既定のアプリロールで復元する例である（複数 owner やカスタム権限がある場合は事前に手順を検証すること）。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${SKM_RESTORE_DIR:?Specify the verified backup directory}\u0026quot;\n  test -s \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot;\n  docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres sh -ceu '\n    dropdb --force --username=\u0026quot;$POSTGRES_USER\u0026quot; \u0026quot;$POSTGRES_DB\u0026quot;\n    createdb --username=\u0026quot;$POSTGRES_USER\u0026quot; --owner=\u0026quot;$POSTGRES_USER\u0026quot; \u0026quot;$POSTGRES_DB\u0026quot;\n  '\n  docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres sh -ceu '\n    pg_restore --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; \\\n      --no-owner --single-transaction --exit-on-error\n  ' \u0026lt; \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot;\n)\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>--single-transaction\u003c/code> は \u003ccode>pg_restore\u003c/code> のみを保護し、失敗時は空 DB が残り得るため業務停止を維持する。DB 復元は外部書込を取り消さず、過去の権限や失効済みセッションを復活させ得る点に注意する。\u003c/p>\n\u003ch3 id=\"復元後の検証\">復元後の検証\u003c/h3>\n\u003cp>関連 blob/実行ファイル・互換設定・KEK を揃え、migration revision・資産バイト/参照・権限とセッション・キュー/lease/スケジュール・外部回執を照合する。入力・transcript・信頼できる回執を欠く Run は強制継続しない。検証中はバックグラウンドを自動起動する \u003ccode>make deploy\u003c/code> を使わず、生の Compose コマンドで段階的に事実を確認してから業務・保守 Worker を再開する。\u003c/p>\n\u003ch2 id=\"アプリ版のロールバック\">アプリ版のロールバック\u003c/h2>\n\u003cp>旧 API/Web/Worker が現在の schema・データ・キュー・非終端スナップショットと互換することを確認した上で、検証済み旧イメージへ戻す。非互換の場合は隔離を維持して前方修正または完全復元を選択し、破壊的な \u003ccode>downgrade\u003c/code>・\u003ccode>stamp\u003c/code>・監査削除は行わない。\u003c/p>\n", "sections": [{"title": "バックアップ・復元・ロールバック", "level": "h1", "anchor": "バックアップ復元ロールバック", "text": "# バックアップ・復元・ロールバック\n\n本ページはデータ保護・障害復元・アプリ版のロールバックを扱う。通常の配備は[配備](deployment.md)を参照し、データ価値・移行・復元要件に応じてバックアップを実施する。"}, {"title": "復元点の取得", "level": "h2", "anchor": "復元点の取得", "text": "## 復元点の取得\n\nDB・オブジェクトストレージ・実行ファイルを跨ぐ一致復元点を取得する際は、新規業務と発火を止め、処理中書込の収束を確認して全 writer を停止する。結果不明の外部効果は[原主体での照合](runbook.md#incident-と-recovery)に従う（単一インスタンスの停止や `dispatch=false` のみでは全体停止にならない）。"}, {"title": "一致復元点の内容", "level": "h3", "anchor": "一致復元点の内容", "text": "### 一致復元点の内容\n\n| 資産 | 保全内容 |\n| --- | --- |\n| PostgreSQL | 完全 dump・DB 識別子・migration revision・書込停止時刻。スナップショット・原要求・承認・Outbox・監査を保持 |\n| オブジェクトストレージ | Skill/文書/添付の原バイト・key/hash・DB 参照・ストレージ namespace/設定 |\n| Run・Codex ボリューム | 復元対象の workspace・入力・transcript・原生セッション（ログイン材料は資格情報として保護） |\n| イメージと設定 | アプリおよび依存 image ID・互換設定・context path |\n| KEK | 現在および旧バックアップに必要な全バージョン（dump とは独立して管理保管） |\n| 外部事実 | 原操作 ID・回執・リモート revision・復元点以降の書込や権限剥奪 |\n\n復元点 ID・UTC 窓・資産参照と checksum・欠落項目・復元訓練結果を記録する。Redis は業務正本ではないため、旧キュー/lease/スケジュールは個別に照合し、Redis 消去を復元の代替としない。現在ストレージ横断の自動バックアップや統合復元ツールはなく、DB dump 単独ではシステム全体を復元できない。"}, {"title": "DB バックアップの取得と検査", "level": "h3", "anchor": "db-バックアップの取得と検査", "text": "### DB バックアップの取得と検査\n\n対象配備ディレクトリで実行する（DB のみ、2 ブロックは同一シェルで実行）。失敗時に生成されたファイルは現場証跡として残し、有効なバックアップとは扱わない。\n\n```bash\numask 077\nSKM_BACKUP_DIR=\"$(mktemp -d ./skillmind-backup-XXXXXXXX)\" \u0026\u0026\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres sh -ceu \\\n  'pg_dump --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" --format=custom' \\\n  > \"${SKM_BACKUP_DIR:?Backup directory is required}/database.dump\"\n```\n\n成功後にアーカイブ目次を検査してハッシュを生成する（パスワードはコマンドラインに含めない）。\n\n```bash\n(\n  set -eu\n  : \"${SKM_BACKUP_DIR:?Specify the directory created for this backup}\"\n  test -s \"$SKM_BACKUP_DIR/database.dump\"\n  docker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres pg_restore --list \\\n    \u003c \"$SKM_BACKUP_DIR/database.dump\" > \"$SKM_BACKUP_DIR/database.toc\"\n  docker image inspect skillmind/backend:0.1.0 skillmind/web:0.1.0 \\\n    --format '{{.RepoTags}} {{.Id}}' > \"$SKM_BACKUP_DIR/images.txt\"\n  cd \"$SKM_BACKUP_DIR\"\n  sha256sum database.dump > database.dump.sha256\n  sha256sum --check database.dump.sha256\n)\n```\n\ndump・TOC・実行ファイル・設定は管理下で保管する。checksum は完全性を示すが出所や復元可能性までは保証しないため、隔離環境での復元訓練で確認する。"}, {"title": "データベース復元", "level": "h2", "anchor": "データベース復元", "text": "## データベース復元\n\n**以下の手順はデータベースを削除・置換し、復元点以降のローカルデータを失わせる。** 復元対象の特定・現状保全・dump と関連資産・互換イメージ・旧 KEK・書込停止範囲を確認してから実行する。事前に検証済みバックアップディレクトリを `SKM_RESTORE_DIR` に設定する。"}, {"title": "復元前の停止条件", "level": "h3", "anchor": "復元前の停止条件", "text": "### 復元前の停止条件\n\nまず材料を検査し、失敗した場合は即中止する。\n\n```bash\n(\n  set -eu\n  : \"${SKM_RESTORE_DIR:?Specify the verified backup directory}\"\n  test -s \"$SKM_RESTORE_DIR/database.dump\"\n  docker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres pg_restore --list \\\n    \u003c \"$SKM_RESTORE_DIR/database.dump\" > /dev/null\n  cd \"$SKM_RESTORE_DIR\"\n  sha256sum --check database.dump.sha256\n)\n```\n\n他インスタンスの書込停止も確認した上で本 project のアプリを停止し、対象 DB とロールが復元先と一致することを確認する。\n\n```bash\ndocker compose --env-file \"${ENV_FILE:-.env}\" stop api web worker maintenance migrate object-storage-init\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres sh -ceu '\n  psql --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" --no-psqlrc \\\n    --set=ON_ERROR_STOP=1 --command=\"SELECT current_database(), current_user\"\n'\n```"}, {"title": "データベースの置換", "level": "h3", "anchor": "データベースの置換", "text": "### データベースの置換\n\n以下は既定のアプリロールで復元する例である（複数 owner やカスタム権限がある場合は事前に手順を検証すること）。\n\n```bash\n(\n  set -eu\n  : \"${SKM_RESTORE_DIR:?Specify the verified backup directory}\"\n  test -s \"$SKM_RESTORE_DIR/database.dump\"\n  docker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres sh -ceu '\n    dropdb --force --username=\"$POSTGRES_USER\" \"$POSTGRES_DB\"\n    createdb --username=\"$POSTGRES_USER\" --owner=\"$POSTGRES_USER\" \"$POSTGRES_DB\"\n  '\n  docker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres sh -ceu '\n    pg_restore --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" \\\n      --no-owner --single-transaction --exit-on-error\n  ' \u003c \"$SKM_RESTORE_DIR/database.dump\"\n)\n```\n\n`--single-transaction` は `pg_restore` のみを保護し、失敗時は空 DB が残り得るため業務停止を維持する。DB 復元は外部書込を取り消さず、過去の権限や失効済みセッションを復活させ得る点に注意する。"}, {"title": "復元後の検証", "level": "h3", "anchor": "復元後の検証", "text": "### 復元後の検証\n\n関連 blob/実行ファイル・互換設定・KEK を揃え、migration revision・資産バイト/参照・権限とセッション・キュー/lease/スケジュール・外部回執を照合する。入力・transcript・信頼できる回執を欠く Run は強制継続しない。検証中はバックグラウンドを自動起動する `make deploy` を使わず、生の Compose コマンドで段階的に事実を確認してから業務・保守 Worker を再開する。"}, {"title": "アプリ版のロールバック", "level": "h2", "anchor": "アプリ版のロールバック", "text": "## アプリ版のロールバック\n\n旧 API/Web/Worker が現在の schema・データ・キュー・非終端スナップショットと互換することを確認した上で、検証済み旧イメージへ戻す。非互換の場合は隔離を維持して前方修正または完全復元を選択し、破壊的な `downgrade`・`stamp`・監査削除は行わない。"}], "toc": [{"title": "復元点の取得", "anchor": "復元点の取得", "level": "h2"}, {"title": "一致復元点の内容", "anchor": "一致復元点の内容", "level": "h3"}, {"title": "DB バックアップの取得と検査", "anchor": "db-バックアップの取得と検査", "level": "h3"}, {"title": "データベース復元", "anchor": "データベース復元", "level": "h2"}, {"title": "復元前の停止条件", "anchor": "復元前の停止条件", "level": "h3"}, {"title": "データベースの置換", "anchor": "データベースの置換", "level": "h3"}, {"title": "復元後の検証", "anchor": "復元後の検証", "level": "h3"}, {"title": "アプリ版のロールバック", "anchor": "アプリ版のロールバック", "level": "h2"}], "source": "operations/backup-recovery.md", "checksum": "cbdac0c7e9f6f24913e22cf1296e47cd032af5e5923025b7a9197049519b061d"}, {"id": "docs/operations/runbook.md", "title": "Skillmind 運用・障害対応", "group": "operations", "html": "\u003ch1 id=\"skillmind-運用障害対応\">Skillmind 運用・障害対応\u003c/h1>\n\u003cp>症状から対象サービスと原要求を特定して対処を決める。起動は \u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>、更新は\u003ca href=\"#docs/operations/deployment.md::\">配備\u003c/a>、データ復元は\u003ca href=\"#docs/operations/backup-recovery.md::\">復元\u003c/a>、実行境界は\u003ca href=\"#docs/development/runtime-guide.md::\">実行・データ保守ガイド\u003c/a>を参照。\u003c/p>\n\u003ch2 id=\"運用原則\">運用原則\u003c/h2>\n\u003cp>原応答・Run/Attempt/Effect ID・マスク済みログを優先確認する。PostgreSQL が正本であり、エラー解消のために状態書換・監査削除・キュー消去・キー変更を行わない。共有するのは UTC・版・オブジェクト ID・公開エラーコード・影響範囲のみとし、\u003ccode>.env\u003c/code>・資格情報・業務本文は出さない。調査コマンドは \u003ccode>ENV_FILE\u003c/code>/project を確認した配備ディレクトリで実行する。\u003c/p>\n\u003ch2 id=\"サービスとキュー\">サービスとキュー\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">make status\nmake runtime-check\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; logs --no-log-prefix --tail=200 api worker maintenance\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>確認事項\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>API 不健全または版不一致\u003c/td>\n\u003ctd>配備段階・migration head・DB/Redis・\u003ccode>runtime-check\u003c/code>。\u003ca href=\"#docs/operations/deployment.md::linux-%E6%A4%9C%E8%A8%BC%E3%81%A8%E9%85%8D%E5%82%99\">配備\u003c/a>に従い元エラーを特定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新規タスク未実行・承認後に継続しない\u003c/td>\n\u003ctd>dispatch スイッチ・\u003ccode>worker\u003c/code> と \u003ccode>maintenance\u003c/code> の健全性・原 Outbox/job。両キューの稼働が必要であり、Run の再作成で実行を促さない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>実行や画面更新が遅い\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/run-performance.md::\">性能観測\u003c/a>に従い準備・モデル/ツール待機・収束・表示を切り分ける\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>モデル認証や通信の失敗\u003c/td>\n\u003ctd>Worker のデバイスログイン状態・プロキシ・認証/モデルサービスへの疎通\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"認証障害の読取トリアージ\">認証障害の読取トリアージ\u003c/h2>\n\u003cp>path（クエリなし）・status/code/request_id を記録し、ヘッダ有無・cookie 属性・Origin のみを確認する（機密値は記録しない）。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>応答\u003c/th>\n\u003cth>対処\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>401 \u003ccode>invalid_credentials\u003c/code> / \u003ccode>authentication_required\u003c/code>\u003c/td>\n\u003ctd>環境・セッション期限・権限を確認。\u003ccode>bootstrap-admin\u003c/code> は最初の ADMIN 作成専用でありアカウント初期化には使えない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 \u003ccode>csrf_rejected\u003c/code>\u003c/td>\n\u003ctd>Origin・CSRF header・現セッションを確認。未確認要求を保全し、そのまま再送しない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 \u003ccode>administrator_required\u003c/code> / 404\u003c/td>\n\u003ctd>システム ADMIN と ProjectMember を区別する（404 は越権の秘匿でも返る）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 \u003ccode>project_archived\u003c/code> / 版競合\u003c/td>\n\u003ctd>対象オブジェクトの最新状態を読み、原要求を保全する（アーカイブは処理中 Run/Effect を取消さない）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422\u003c/td>\n\u003ctd>公開契約に従い入力を修正し、パスワードを含む原値は共有しない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ccode>login-context\u003c/code> は challenge を発行しクォータを消費するため、ヘルスチェック用途で反復呼出しない。\u003c/p>\n\u003ch2 id=\"ログイン防護の調査と復旧\">ログイン防護の調査と復旧\u003c/h2>\n\u003cp>429 は \u003ccode>Retry-After\u003c/code> に従い再試行を止め、共有出口 IP や信頼プロキシを確認する。503 \u003ccode>login_protection_unavailable\u003c/code> は Redis の権限・容量・TTL・タイムアウトを確認し、制限回避のための \u003ccode>FLUSHDB\u003c/code>・クォータ削除・送信元ローテーションは行わない。\u003c/p>\n\u003ch2 id=\"文書保存と削除の読取トリアージ\">文書保存と削除の読取トリアージ\u003c/h2>\n\u003cp>Project/document ID・原 upload key・応答を保全する。改名・移動・復元は同一文書 ID を維持するため、ID と内容ハッシュで照合する。\u003c/p>\n\u003cp>過去実行から参照されている知識ベース等のファイルは行メニュー「ファイルを更新」を使うか、ファイル/フォルダの一括投入で同ディレクトリ同名ファイルを上書き更新できる（旧ファイルの事前削除は不要）。新規タスクは新版を選択し、過去実行は旧版を維持する。更新競合時は一覧を再読込してから再操作する。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>対処\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>アップロード結果不明・\u003ccode>PENDING\u003c/code>・原 key 不在\u003c/td>\n\u003ctd>原 key のまま回執を確認し、キーを変えて再送しない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PUBLISHED\u003c/code> だが一覧にない\u003c/td>\n\u003ctd>原 document ID で後続の移動/削除を確認し、同名で新規作成しない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>削除 409\u003c/td>\n\u003ctd>Run・スケジュール・履歴参照を確認し、参照解消を確認できない間は保持する\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>削除 503 または応答中断\u003c/td>\n\u003ctd>まず原文書の現在状態を読み、原アップロード記録とストレージを照合する（ID を変えてやり直さない）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ダウンロード欠落/hash 不一致・ストレージ切替後の読取不可\u003c/td>\n\u003ctd>原 ID/key/hash と復元点で照合し、hash 書換や namespace 流用を行わない\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>削除後もオブジェクトやクォータが残る\u003c/td>\n\u003ctd>メタデータ削除はストレージ清掃やクォータ精算の完了を意味しない。ストレージ接頭辞を手動再帰削除しない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>ごみ箱からは復元可能だが、完全削除は復元できない（原入力・共有参照・結果不明操作の保護対象）。Project の実行一覧が空でも削除監査等の参照が残る場合はアーカイブを維持する。\u003c/p>\n\u003ch2 id=\"準備障害の読取トリアージ\">準備障害の読取トリアージ\u003c/h2>\n\u003cp>\u003ccode>RUNNING\u003c/code> で Session がない場合は Context 準備・入力回執・Brief を確認する。\u003ccode>preparation_timeout\u003c/code> は準備タイムアウト設定と資源応答時間を、\u003ccode>context_build_failed\u003c/code> は凍結ソースと束縛を確認する。引継ぎが繰り返される場合は lease・Attempt 時系列・エラーを確認する（lease 期限切れや取消受理は旧リモートプロセスの終了を意味しない）。\u003c/p>\n\u003ch2 id=\"waiting-状態\">WAITING 状態\u003c/h2>\n\u003cp>\u003ccode>WAITING_FOR_INPUT/APPROVAL\u003c/code> は非終端状態であり、原 Interaction/Proposal と期限を確認して回答・承認する。要求タイムアウト・410・通信断時はまず原状態を読み、自動承認範囲は原 Run 開始時の同意に従う。\u003c/p>\n\u003ch2 id=\"結果と評価の読取トリアージ\">結果と評価の読取トリアージ\u003c/h2>\n\u003cp>結果の \u003ccode>PARTIAL\u003c/code>/\u003ccode>BLOCKED\u003c/code>・証拠・プラットフォーム書込回執を併せて確認する（モデル自身の保存完了申告は read-back の代替にならない）。評価は原 Result（pointer は \u003ccode>detail.result.data\u003c/code> 相対）に対して行い、送信原キーを保持して結果不明時は重複 POST しない。\u003c/p>\n\u003ch2 id=\"schedule-と-recovery-の監視\">Schedule と Recovery の監視\u003c/h2>\n\u003cp>\u003ccode>SCHEDULING_ENABLED\u003c/code>・dispatch・保守 Worker・ルールタイムゾーン・原 occurrence を確認する。\u003ccode>next_run_at\u003c/code> が進んで Run がない場合は「処理中照合」を確認し、カウンタ消去やスケジュール再作成で補填実行しない。\u003c/p>\n\u003ch2 id=\"incident-と-recovery\">Incident と recovery\u003c/h2>\n\u003cp>原 Proposal/Effect・要求キー・承認・リモート回執に沿って事実を照合する。読取照合の \u003ccode>CONFIRMED\u003c/code> は原操作が観測された
