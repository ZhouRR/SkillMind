  <style>

3c/a> / \u003ca href=\"#docs/operations/runbook.md::\">運用\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/skill-interpretation.md::\">解釈・公開\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n", "sections": [{"title": "ProjectMind 文書ガイド", "level": "h1", "anchor": "projectmind-文書ガイド", "text": "# ProjectMind 文書ガイド\n\n[ブラウザで読む](index.html) · [コードの入口](../PJM/README.md) · [現在の計画](planning/roadmap.md#当前执行状态)"}, {"title": "目的から探す", "level": "h2", "anchor": "目的から探す", "text": "## 目的から探す\n\n| 目的 | 読む順序 |\n| --- | --- |\n| 製品を理解する | [概要](overview/product.md) → [システム構成](overview/architecture.md) → [用語](overview/glossary.md) |\n| 機能を開発する | [設計の責任分担](design/README.md) → [変更ガイド](development/change-guide.md) → [実装細則](development/coding-rules.md) |\n| 環境を用意・API を変更する | [ローカル開発](development/local-development.md) / [API 利用](development/api-usage.md) / [契約変更](development/contract-workflow.md) |\n| 起動・更新・障害対応 | [初回起動](operations/quickstart.md) → [公開・移行](operations/deployment.md) / [復旧](operations/backup-recovery.md) / [Runbook](operations/runbook.md) |\n| 文書を更新する | [維持と閲覧チェック](development/documentation.md) |"}, {"title": "配置と責任", "level": "h2", "anchor": "配置と責任", "text": "## 配置と責任\n\n- `overview/`：製品・用語・構成。[業務構造図](overview/business-structure.html) / [技術構造図](overview/technical-architecture.html)は全体像の補助。\n- `design/`：各領域の規則、失敗・復旧、実装との未解消差距。\n- `planning/`：現在の未完了範囲と着手順。設計や検証ログを複製しない。\n- `development/`：実装規約、開発と検証の手順。\n- `operations/`：起動、公開、backup/restore と症状別の確認。\n\n正式コードは `../PJM/`。設計は保証すべき規則、契約はデータの形、コードと検証は実際の到達点を示す。\n「設計済み」「局部実装」「実環境で受入済み」を区別し、未完成の機能を操作手順として案内しない。"}, {"title": "旧番号の対応", "level": "h2", "anchor": "旧番号の対応", "text": "## 旧番号の対応\n\nコード注釈の `docs/06` 等は旧文書番号。未掲載の番号を現在の開発規則として使わない。\n\n| ID | 現在の正本 |\n| --- | --- |\n| 01 | [計画](planning/roadmap.md) |\n| 02 / 03 | [業務構造](overview/business-structure.html) / [技術構造](overview/technical-architecture.html) |\n| 04 / 05 | [領域モデル](design/domain-model.md) / [Skill 契約](design/skill-contract.md) |\n| 06 / 07 | [Runtime](design/agent-runtime.md) / [Workspace](design/workspace.md) |\n| 09 / 10 | [認証](design/authentication.md) / [運用](operations/runbook.md) |\n| 11 | [解釈・公開](design/skill-interpretation.md) |"}], "toc": [{"title": "目的から探す", "anchor": "目的から探す", "level": "h2"}, {"title": "配置と責任", "anchor": "配置と責任", "level": "h2"}, {"title": "旧番号の対応", "anchor": "旧番号の対応", "level": "h2"}], "source": "README.md", "checksum": "a57cb88d884d2f5952da5cc3346154d2c36fb6a082ea150119b904c207304321"}, {"id": "docs/overview/product.md", "title": "产品概览", "group": "overview", "html": "\u003ch1 id=\"产品概览\">产品概览\u003c/h1>\n\u003cp>ProjectMind 把目录式 Skill 中的工作方法转成可选择、配置、执行的项目任务，统一提供资源访问、持续执行、人工参与、证据和审计。\n\u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">当前状态\u003c/a>记录实际完成度，本页只说明产品范围。\u003c/p>\n\u003ch2 id=\"一次使用过程\">一次使用过程\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">导入 Skill → 解释与预览 → 发布精确版本 → 项目启用与资源配置\n                                              ↓\n                                      任务中心选择任务\n                                              ↓\n                                      工作空间观察 Run\n                                              ↓\n                              分析 ↔ 回答问题 / 审查变更\n                                              ↓\n                                  结果 + 证据 + 人工评价\n\u003c/code>\u003c/pre>\n\u003cp>发布表示版本通过平台校验，项目启用决定可发现版本，资源就绪判断能否执行；三者不是一个“可用”开关。\n需要修改外部系统时，平台展示具体 Proposal，获得批准后执行并回读验证。\u003c/p>\n\u003ch2 id=\"用户与页面\">用户与页面\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>使用者\u003c/th>\n\u003cth>主要工作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ADMIN\u003c/td>\n\u003ctd>管理组织 Skill、精确版本、项目和资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目成员 USER\u003c/td>\n\u003ctd>选择任务、提供输入、查看过程和反馈结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 发起人或 ADMIN\u003c/td>\n\u003ctd>审查具体外部变更；权限由平台重新校验\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>任务中心选择“运行什么”，工作空间观察“一次 Run”。页面与未接入的管理入口见 \u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a>。\nProject 隔离资源与执行，不是系统角色；归档、撤权、取消和删除分别处理，见\u003ca href=\"#docs/design/project-lifecycle.md::\">项目生命周期\u003c/a>。\u003c/p>\n\u003ch2 id=\"产品边界\">产品边界\u003c/h2>\n\u003cul>\n\u003cli>业务规则来自 Skill，平台只固定通用协议；业务输入/输出 Schema 可选。\u003c/li>\n\u003cli>Integration 与 ResourceBinding 限定资源，Agent 不接触凭据；输入与权限按运行协议冻结。\u003c/li>\n\u003cli>一个 Run 可包含多个 Segment/Session，技术恢复记为 Attempt。Result 不可改，人工修订追加 Evaluation。\u003c/li>\n\u003cli>外部写入采用 observe → propose → apply；repository 始终需要人工批准。\u003c/li>\n\u003cli>调度复用普通 Run 创建，子分析只读有界；共享预算、Task Flow、生成界面仍有未完成链路，不能把设计当作可用功能。\u003c/li>\n\u003c/ul>\n\u003cp>开放市场、条件监控、任意宿主 Shell/网络、自动升级 SkillVersion、自动合并 PR、多仓库原子变更及完整多租户计费不在当前范围。\n继续阅读\u003ca href=\"#docs/overview/architecture.md::\">系统结构\u003c/a>、\u003ca href=\"#docs/overview/glossary.md::\">术语\u003c/a>或\u003ca href=\"#docs/development/change-guide.md::\">开发入口\u003c/a>。\u003c/p>\n", "sections": [{"title": "产品概览", "level": "h1", "anchor": "产品概览", "text": "# 产品概览\n\nProjectMind 把目录式 Skill 中的工作方法转成可选择、配置、执行的项目任务，统一提供资源访问、持续执行、人工参与、证据和审计。\n[当前状态](../planning/roadmap.md#当前执行状态)记录实际完成度，本页只说明产品范围。"}, {"title": "一次使用过程", "level": "h2", "anchor": "一次使用过程", "text": "## 一次使用过程\n\n```text\n导入 Skill → 解释与预览 → 发布精确版本 → 项目启用与资源配置\n                                              ↓\n                                      任务中心选择任务\n                                              ↓\n                                      工作空间观察 Run\n                                              ↓\n                              分析 ↔ 回答问题 / 审查变更\n                                              ↓\n                                  结果 + 证据 + 人工评价\n```\n\n发布表示版本通过平台校验，项目启用决定可发现版本，资源就绪判断能否执行；三者不是一个“可用”开关。\n需要修改外部系统时，平台展示具体 Proposal，获得批准后执行并回读验证。"}, {"title": "用户与页面", "level": "h2", "anchor": "用户与页面", "text": "## 用户与页面\n\n| 使用者 | 主要工作 |\n| --- | --- |\n| ADMIN | 管理组织 Skill、精确版本、项目和资源 |\n| 项目成员 USER | 选择任务、提供输入、查看过程和反馈结果 |\n| Run 发起人或 ADMIN | 审查具体外部变更；权限由平台重新校验 |\n\n任务中心选择“运行什么”，工作空间观察“一次 Run”。页面与未接入的管理入口见 [Workspace](../design/workspace.md)。\nProject 隔离资源与执行，不是系统角色；归档、撤权、取消和删除分别处理，见[项目生命周期](../design/project-lifecycle.md)。"}, {"title": "产品边界", "level": "h2", "anchor": "产品边界", "text": "## 产品边界\n\n- 业务规则来自 Skill，平台只固定通用协议；业务输入/输出 Schema 可选。\n- Integration 与 ResourceBinding 限定资源，Agent 不接触凭据；输入与权限按运行协议冻结。\n- 一个 Run 可包含多个 Segment/Session，技术恢复记为 Attempt。Result 不可改，人工修订追加 Evaluation。\n- 外部写入采用 observe → propose → apply；repository 始终需要人工批准。\n- 调度复用普通 Run 创建，子分析只读有界；共享预算、Task Flow、生成界面仍有未完成链路，不能把设计当作可用功能。\n\n开放市场、条件监控、任意宿主 Shell/网络、自动升级 SkillVersion、自动合并 PR、多仓库原子变更及完整多租户计费不在当前范围。\n继续阅读[系统结构](architecture.md)、[术语](glossary.md)或[开发入口](../development/change-guide.md)。"}], "toc": [{"title": "一次使用过程", "anchor": "一次使用过程", "level": "h2"}, {"title": "用户与页面", "anchor": "用户与页面", "level": "h2"}, {"title": "产品边界", "anchor": "产品边界", "level": "h2"}], "source": "overview/product.md", "checksum": "b3b756757d41ab9a1151c9d8e4c9dbc84afa773f534cf2184d2e90bfe3bf8f4b"}, {"id": "docs/overview/architecture.md", "title": "系统结构与执行链路", "group": "overview", "html": "\u003ch1 id=\"系统结构与执行链路\">系统结构与执行链路\u003c/h1>\n\u003cp>Backend 是模块化单体，API 与 Worker 共享 \u003ccode>projectmind\u003c/code> package、分进程运行；业务层依赖 AgentEngine 抽象。\u003c/p>\n\u003ch2 id=\"组件和数据所有权\">组件和数据所有权\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">浏览器 Web → 共享 Traefik → FastAPI → 领域服务 → PostgreSQL\n                  └── Web 静态资源        │         └── 业务与审计正本\n                                      Outbox\n                                         ↓\n                                   Redis → ARQ Worker\n                                              ↓\n                                    AgentEngine → 模型\n                                              ↓\n                                       Tool Gateway\n                                              ↓\n                                    Provider → 已绑定资源\n                                              ↓\n                                      Evidence / Artifact\n\u003c/code>\u003c/pre>\n\u003cp>PostgreSQL 保存 Skill、Run/Segment/Attempt、Session、Event/Outbox、Result 和批准。\nRedis 承担队列、短期锁、通知与登录防护；blob 在 object storage，执行文件在 Run workspace。\n这些存储不属于同一事务；恢复需一起核对数据库引用、blob、workspace 和密钥。\u003c/p>\n\u003ch2 id=\"三条关键链路\">三条关键链路\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>链路\u003c/th>\n\u003cth>关键步骤\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Skill 成为任务\u003c/td>\n\u003ctd>Source → Interpreter → Blueprint → 审查/发布 → Project 启用 → TaskCatalog\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一次 Run\u003c/td>\n\u003ctd>冻结输入/授权 → Outbox → claim → 受监督准备 → Brief/启动校验 → 执行 → 等待或终态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部变更\u003c/td>\n\u003ctd>Proposal → 精确批准 → EffectExecution → CAS → 写入 → read-back\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>模型提出调用，平台校验 capability、绑定、参数、预算与批准后才执行。\n创建冻结授权与选择；Run 输入回执、Segment Brief、Attempt lease 分别证明不同事实，不能互相替代。\n登录防护的 Redis 配额也不等于数据库 Session 的撤销状态。\u003c/p>\n\u003ch2 id=\"变更应放在哪一层\">变更应放在哪一层\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层\u003c/th>\n\u003cth>实现与责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>API\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/api/routes\">routes\u003c/a> / \u003ca href=\"../PJM/backend/src/projectmind/api/auth_dependencies.py\">actor dependency\u003c/a>：认证、授权、入出参\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>领域与持久化\u003c/td>\n\u003ctd>service/domain 决定规则；repository / \u003ca href=\"../PJM/backend/src/projectmind/db\">db\u003c/a>负责事务、锁与快照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/agent\">agent\u003c/a> / \u003ca href=\"../PJM/backend/src/projectmind/worker\">worker\u003c/a>：SDK、Tool、监督与恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web / 契约\u003c/td>\n\u003ctd>\u003ca href=\"#PJM/README.md::web\">代码入口\u003c/a>负责校验和交互；\u003ca href=\"#PJM/README.md::contracts\">contracts\u003c/a>固定公开形状\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>规则归属见\u003ca href=\"#docs/design/README.md::%E3%81%A9%E3%81%AE%E8%A8%AD%E8%A8%88%E3%82%92%E5%A4%89%E6%9B%B4%E3%81%99%E3%82%8B%E3%81%8B\">设计索引\u003c/a>，同步步骤见\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>。\u003c/p>\n\u003ch2 id=\"部署边界\">部署边界\u003c/h2>\n\u003cp>复用共享 Traefik，仅 web/api 进入 edge network，不发布宿主端口。外部 context path 被 Traefik 去除；\nAPI 内部保持 \u003ccode>/api\u003c/code>、Web 保持 \u003ccode>/\u003c/code>，Web build path 与 API root_path 须匹配。\n\u003ca href=\"../PJM/compose.yaml\">Compose\u003c/a>包含应用、存储与一次性迁移/初始化服务，module-builder 尚未接入。\n\u003ca href=\"overview/technical-architecture.html\">技术结构图\u003c/a>用于整体展示，发布步骤见\u003ca href=\"#docs/operations/deployment.md::\">部署指南\u003c/a>。\u003c/p>\n", "sections": [{"title": "系统结构与执行链路", "level": "h1", "anchor": "系统结构与执行链路", "text": "# 系统结构与执行链路\n\nBackend 是模块化单体，API 与 Worker 共享 `projectmind` package、分进程运行；业务层依赖 AgentEngine 抽象。"}, {"title": "组件和数据所有权", "level": "h2", "anchor": "组件和数据所有权", "text": "## 组件和数据所有权\n\n```text\n浏览器 Web → 共享 Traefik → FastAPI → 领域服务 → PostgreSQL\n                  └── Web 静态资源        │         └── 业务与审计正本\n                                      Outbox\n                                         ↓\n                                   Redis → ARQ Worker\n                                              ↓\n                                    AgentEngine → 模型\n                                              ↓\n                                       Tool Gateway\n                                              ↓\n                                    Provider → 已绑定资源\n                                              ↓\n                                      Evidence / Artifact\n```\n\nPostgreSQL 保存 Skill、Run/Segment/Attempt、Session、Event/Outbox、Result 和批准。\nRedis 承担队列、短期锁、通知与登录防护；blob 在 object storage，执行文件在 Run workspace。\n这些存储不属于同一事务；恢复需一起核对数据库引用、blob、workspace 和密钥。"}, {"title": "三条关键链路", "level": "h2", "anchor": "三条关键链路", "text": "## 三条关键链路\n\n| 链路 | 关键步骤 |\n| --- | --- |\n| Skill 成为任务 | Source → Interpreter → Blueprint → 审查/发布 → Project 启用 → TaskCatalog |\n| 一次 Run | 冻结输入/授权 → Outbox → claim → 受监督准备 → Brief/启动校验 → 执行 → 等待或终态 |\n| 外部变更 | Proposal → 精确批准 → EffectExecution → CAS → 写入 → read-back |\n\n模型提出调用，平台校验 capability、绑定、参数、预算与批准后才执行。\n创建冻结授权与选择；Run 输入回执、Segment Brief、Attempt lease 分别证明不同事实，不能互相替代。\n登录防护的 Redis 配额也不等于数据库 Session 的撤销状态。"}, {"title": "变更应放在哪一层", "level": "h2", "anchor": "变更应放在哪一层", "text": "## 变更应放在哪一层\n\n| 层 | 实现与责任 |\n| --- | --- |\n| API | [routes](../../PJM/backend/src/projectmind/api/routes/) / [actor dependency](../../PJM/backend/src/projectmind/api/auth_dependencies.py)：认证、授权、入出参 |\n| 领域与持久化 | service/domain 决定规则；repository / [db](../../PJM/backend/src/projectmind/db/)负责事务、锁与快照 |\n| 执行 | [agent](../../PJM/backend/src/projectmind/agent/) / [worker](../../PJM/backend/src/projectmind/worker/)：SDK、Tool、监督与恢复 |\n| Web / 契约 | [代码入口](../../PJM/README.md#web)负责校验和交互；[contracts](../../PJM/README.md#contracts)固定公开形状 |\n\n规则归属见[设计索引](../design/README.md#どの設計を変更するか)，同步步骤见[变更指南](../development/change-guide.md)。"}, {"title": "部署边界", "level": "h2", "anchor": "部署边界", "text": "## 部署边界\n\n复用共享 Traefik，仅 web/api 进入 edge network，不发布宿主端口。外部 context path 被 Traefik 去除；\nAPI 内部保持 `/api`、Web 保持 `/`，Web build path 与 API root_path 须匹配。\n[Compose](../../PJM/compose.yaml)包含应用、存储与一次性迁移/初始化服务，module-builder 尚未接入。\n[技术结构图](technical-architecture.html)用于整体展示，发布步骤见[部署指南](../operations/deployment.md)。"}], "toc": [{"title": "组件和数据所有权", "anchor": "组件和数据所有权", "level": "h2"}, {"title": "三条关键链路", "anchor": "三条关键链路", "level": "h2"}, {"title": "变更应放在哪一层", "anchor": "变更应放在哪一层", "level": "h2"}, {"title": "部署边界", "anchor": "部署边界", "level": "h2"}], "source": "overview/architecture.md", "checksum": "9f318a1372ba60aa50b7ce03da319b27c07db9ffe7bdbdf4a2933b84623b3a02"}, {"id": "docs/overview/glossary.md", "title": "核心术语", "group": "overview", "html": "\u003ch1 id=\"核心术语\">核心术语\u003c/h1>\n\u003cp>这里只解释词义与易混淆的边界；完整规则见\u003ca href=\"#docs/design/README.md::\">设计索引\u003c/a>。\u003c/p>\n\u003ch2 id=\"从工作方法到执行\">从工作方法到执行\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>SkillSource / SkillInterpretation\u003c/td>\n\u003ctd>导入来源 / 一次解释记录；导入不执行来源脚本，重解释不覆盖旧记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CapabilityBlueprint\u003c/td>\n\u003ctd>目标、规则、资源和完成条件的语义来源，不授予 Tool 权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RuntimeManifest\u003c/td>\n\u003ctd>精确版本的运行投影与约束，不用来反推新蓝图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillVersion / ProjectSkillVersion\u003c/td>\n\u003ctd>内容不可变的发布版 / 项目显式启用关系；发布、启用与 readiness 分开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Task / ExecutableTask\u003c/td>\n\u003ctd>从版本投影的可启动工作，不必对应独立数据库表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillComposition\u003c/td>\n\u003ctd>多 SkillVersion 的展示组合；虚拟角色不是权限角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FrontendModuleVersion / ViewSpec\u003c/td>\n\u003ctd>生成界面版本 / 平台声明式展示；与业务 module API、文档预览分开\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"资源与权限\">资源与权限\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Domain / Tool capability\u003c/td>\n\u003ctd>业务能力名称 / 注册的版本化 Tool 协议，前者不能直接调用后者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ResourceRequirement / Integration\u003c/td>\n\u003ctd>抽象资源需求 / 实际 Provider、实例和范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ResourceBinding\u003c/td>\n\u003ctd>requirement 到资源的选择；配置与 Run 冻结记录不是同一层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容快照 / 物化副本\u003c/td>\n\u003ctd>ID/hash/revision / 实际文件；授权固定不等于全部内容已取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RunInputSnapshot\u003c/td>\n\u003ctd>Run 级准备回执；READY 绑定完整文件集合，PREPARING 不可使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>逻辑 input / 物理世代\u003c/td>\n\u003ctd>Agent 所见路径 / 平台隔离存储位置，由平台映射\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User / ProjectMember\u003c/td>\n\u003ctd>账户 / 项目成员关系；账户创建和项目偏好不授予 membership\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AuthSession / CSRF\u003c/td>\n\u003ctd>浏览器会话 / 会话绑定的写请求校验值，不是模型 AgentSession\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账户版本 / 安全事件\u003c/td>\n\u003ctd>管理并发版本 / 接受的安全操作；不是在线人数或完整登录日志\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录配额 / 退避\u003c/td>\n\u003ctd>短期计数 / 有限等待，不等于停用账户或撤销会话\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SecretReference\u003c/td>\n\u003ctd>外部凭据引用，公开响应不含原值、locator 或密文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>key_version / kek_version\u003c/td>\n\u003ctd>引用 metadata 版本 / 部署加密密钥版本，均不代表外部凭据已更新\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Readiness\u003c/td>\n\u003ctd>由 Provider 和配置计算的就绪状态，执行时仍须重新校验权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"一次-run-内部\">一次 Run 内部\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Run（固定目标、权限与输入）\n└── Segment（连续工作；业务答复后追加）\n    └── Attempt（一次技术执行；重试后追加）\n        ├── PRIMARY Session（同一时刻一个活动主会话）\n        └── SUBAGENT Session（有界只读分支）\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>AgentTaskBrief\u003c/td>\n\u003ctd>该 Segment 的目标、指导、资源与策略快照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lease / fencing\u003c/td>\n\u003ctd>限时执行权 / 提交时拒绝失效持有者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>准备 / wall / job timeout\u003c/td>\n\u003ctd>分别约束准备、模型等待和 Worker job，不是 Run 累计预算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>限额 / 预留 / 消耗\u003c/td>\n\u003ctd>上限 / 未确认结清的占用 / 已确认用量；usage、cost 和成功状态分别判断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UserInteraction / ChangeProposal\u003c/td>\n\u003ctd>普通问题或批准交互 / 具体变更提案；回答、批准与评价不是同一种提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EffectExecution\u003c/td>\n\u003ctd>已批准变更的执行和回读记录，批准不保证远端已经完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence / Artifact\u003c/td>\n\u003ctd>可定位、带版本的事实引用 / 报告或补丁文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Result / OutcomeEnvelope\u003c/td>\n\u003ctd>不可变原结果 / 通用输出包络，执行成功不等于业务判断全对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evaluation\u003c/td>\n\u003ctd>追加式评分和修订，原值来自 Result，不覆盖原结果或续行 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Task Flow / Run Flow\u003c/td>\n\u003ctd>版本化计划 / 实际活动投影，不是第二个执行控制器\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"创建与调度恢复\">创建与调度恢复\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Idempotency-Key / 请求身份\u003c/td>\n\u003ctd>定位一次提交 / 判断其内容相同；持有键不授予访问权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>创建重放\u003c/td>\n\u003ctd>确认首次创建的 Run，不重新冻结资源或追加执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>occurrence\u003c/td>\n\u003ctd>计划触发时刻，不等于 Worker 开始时间或 Run 终态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>missed / overlap\u003c/td>\n\u003ctd>错过发火 / 重叠跳过；当前重叠判断限于本 Schedule 摘要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schedule 摘要 / 触发账本\u003c/td>\n\u003ctd>可覆盖的 last_*、run_count / 待完整实现的逐次持久记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>在途恢复 / 补跑\u003c/td>\n\u003ctd>完成已经认领的一次 / 为过去未处理时刻新造执行，前者不授权后者\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n", "sections": [{"title": "核心术语", "level": "h1", "anchor": "核心术语", "text": "# 核心术语\n\n这里只解释词义与易混淆的边界；完整规则见[设计索引](../design/README.md)。"}, {"title": "从工作方法到执行", "level": "h2", "anchor": "从工作方法到执行", "text": "## 从工作方法到执行\n\n| 术语 | 含义 |\n| --- | --- |\n| SkillSource / SkillInterpretation | 导入来源 / 一次解释记录；导入不执行来源脚本，重解释不覆盖旧记录 |\n| CapabilityBlueprint | 目标、规则、资源和完成条件的语义来源，不授予 Tool 权限 |\n| RuntimeManifest | 精确版本的运行投影与约束，不用来反推新蓝图 |\n| SkillVersion / ProjectSkillVersion | 内容不可变的发布版 / 项目显式启用关系；发布、启用与 readiness 分开 |\n| Task / ExecutableTask | 从版本投影的可启动工作，不必对应独立数据库表 |\n| SkillComposition | 多 SkillVersion 的展示组合；虚拟角色不是权限角色 |\n| FrontendModuleVersion / ViewSpec | 生成界面版本 / 平台声明式展示；与业务 module API、文档预览分开 |"}, {"title": "资源与权限", "level": "h2", "anchor": "资源与权限", "text": "## 资源与权限\n\n| 术语 | 含义 |\n| --- | --- |\n| Domain / Tool capability | 业务能力名称 / 注册的版本化 Tool 协议，前者不能直接调用后者 |\n| ResourceRequirement / Integration | 抽象资源需求 / 实际 Provider、实例和范围 |\n| ResourceBinding | requirement 到资源的选择；配置与 Run 冻结记录不是同一层 |\n| 内容快照 / 物化副本 | ID/hash/revision / 实际文件；授权固定不等于全部内容已取得 |\n| RunInputSnapshot | Run 级准备回执；READY 绑定完整文件集合，PREPARING 不可使用 |\n| 逻辑 input / 物理世代 | Agent 所见路径 / 平台隔离存储位置，由平台映射 |\n| User / ProjectMember | 账户 / 项目成员关系；账户创建和项目偏好不授予 membership |\n| AuthSession / CSRF | 浏览器会话 / 会话绑定的写请求校验值，不是模型 AgentSession |\n| 账户版本 / 安全事件 | 管理并发版本 / 接受的安全操作；不是在线人数或完整登录日志 |\n| 登录配额 / 退避 | 短期计数 / 有限等待，不等于停用账户或撤销会话 |\n| SecretReference | 外部凭据引用，公开响应不含原值、locator 或密文 |\n| key_version / kek_version | 引用 metadata 版本 / 部署加密密钥版本，均不代表外部凭据已更新 |\n| Readiness | 由 Provider 和配置计算的就绪状态，执行时仍须重新校验权限 |"}, {"title": "一次 Run 内部", "level": "h2", "anchor": "一次-run-内部", "text": "## 一次 Run 内部\n\n```text\nRun（固定目标、权限与输入）\n└── Segment（连续工作；业务答复后追加）\n    └── Attempt（一次技术执行；重试后追加）\n        ├── PRIMARY Session（同一时刻一个活动主会话）\n        └── SUBAGENT Session（有界只读分支）\n```\n\n| 术语 | 含义 |\n| --- | --- |\n| AgentTaskBrief | 该 Segment 的目标、指导、资源与策略快照 |\n| lease / fencing | 限时执行权 / 提交时拒绝失效持有者 |\n| 准备 / wall / job timeout | 分别约束准备、模型等待和 Worker job，不是 Run 累计预算 |\n| 限额 / 预留 / 消耗 | 上限 / 未确认结清的占用 / 已确认用量；usage、cost 和成功状态分别判断 |\n| UserInteraction / ChangeProposal | 普通问题或批准交互 / 具体变更提案；回答、批准与评价不是同一种提交 |\n| EffectExecution | 已批准变更的执行和回读记录，批准不保证远端已经完成 |\n| Evidence / Artifact | 可定位、带版本的事实引用 / 报告或补丁文件 |\n| Result / OutcomeEnvelope | 不可变原结果 / 通用输出包络，执行成功不等于业务判断全对 |\n| Evaluation | 追加式评分和修订，原值来自 Result，不覆盖原结果或续行 Run |\n| Task Flow / Run Flow | 版本化计划 / 实际活动投影，不是第二个执行控制器 |"}, {"title": "创建与调度恢复", "level": "h2", "anchor": "创建与调度恢复", "text": "## 创建与调度恢复\n\n| 术语 | 含义 |\n| --- | --- |\n| Idempotency-Key / 请求身份 | 定位一次提交 / 判断其内容相同；持有键不授予访问权 |\n| 创建重放 | 确认首次创建的 Run，不重新冻结资源或追加执行 |\n| occurrence | 计划触发时刻，不等于 Worker 开始时间或 Run 终态 |\n| missed / overlap | 错过发火 / 重叠跳过；当前重叠判断限于本 Schedule 摘要 |\n| Schedule 摘要 / 触发账本 | 可覆盖的 last_*、run_count / 待完整实现的逐次持久记录 |\n| 在途恢复 / 补跑 | 完成已经认领的一次 / 为过去未处理时刻新造执行，前者不授权后者 |"}], "toc": [{"title": "从工作方法到执行", "anchor": "从工作方法到执行", "level": "h2"}, {"title": "资源与权限", "anchor": "资源与权限", "level": "h2"}, {"title": "一次 Run 内部", "anchor": "一次-run-内部", "level": "h2"}, {"title": "创建与调度恢复", "anchor": "创建与调度恢复", "level": "h2"}], "source": "overview/glossary.md", "checksum": "efbc73b37d55776ccaf2b1b872b31b638dc2ef01dfce72ea55ec3f50008bbf99"}, {"id": "docs/planning/roadmap.md", "title": "ProjectMind 实施计划", "group": "planning", "html": "\u003ch1 id=\"projectmind-实施计划\">ProjectMind 实施计划\u003c/h1>\n\u003cp>本页只维护当前未完成范围与着手顺序；功能规则见\u003ca href=\"#docs/design/README.md::\">设计索引\u003c/a>，代码入口见\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>。\n以下按当前代码与验证范围登记，不是全项目完成或部署证明。\u003c/p>\n\u003ch2 id=\"当前执行状态\">当前执行状态\u003c/h2>\n\u003cp>核心 Skill/Run/资源/身份/外部效果链已有代码；共享预算、完整管理页面、Task Flow、生成界面及真实环境验收尚未完成。\n保留 R01–R13 作为开发任务 ID，不再按历次文档整理轮次登记进度。\u003c/p>\n\u003ch3 id=\"完成状态的判定\">完成状态的判定\u003c/h3>\n\u003cul>\n\u003cli>实现完成：代码、契约、消费者和相应回归接齐。\u003c/li>\n\u003cli>部署完成：目标镜像、配置、迁移、健康检查与放行均确认。\u003c/li>\n\u003cli>专项验收：具体场景有输入、环境、可观察结果及未覆盖范围。\u003c/li>\n\u003cli>设计完成：规则可评审，不表示 API 或页面已经可用。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"当前证据怎么用\">当前证据怎么用\u003c/h3>\n\u003cp>局部 mock/fake 测试、真实 DB、浏览器、模型和部署各自证明不同范围；skip、测试文件存在或旧通过次数不算当前验收。\n账户 API/Schema/OpenAPI/client 与 App 页面已接通；fake API 和 mock 浏览器不证明真实账户事务、会话部署或全站隔离。共享预算未接执行等缺口继续保留，文档构建不消除它们。\u003c/p>\n\u003ch3 id=\"下一步与当前决策\">下一步与当前决策\u003c/h3>\n\u003col>\n\u003cli>先收口身份/资源边界、Run 停止与事务、共享预算和调度可靠性，再扩大自主执行能力。\u003c/li>\n\u003cli>保持账户链路回归，完善普通答复、评价、项目/文档管理的未知结果与上下文隔离。\u003c/li>\n\u003cli>Task Flow 先做只读投影，再接版本契约、Run 冻结和事件关联；不另建执行器。\u003c/li>\n\u003cli>生成界面先满足威胁模型、构建身份、隔离与安全投放条件，静态 helper 通过不足以放行。\u003c/li>\n\u003cli>有获准的隔离环境后补真实资源、DB、代理、模型、外部写入与恢复验收；不为验证临时放宽权限。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"开发任务\">开发任务\u003c/h3>\n\u003cp>范围覆盖 Backend、Web、contracts、Skill 执行资产、工具、构建/部署配置与对应测试。\n已有组件应接续而非重建；明确列为非目标的能力不当作缺失功能。\u003c/p>\n\u003cp>运行基础：\u003ca href=\"#docs/planning/roadmap.md::r01-%E8%B5%84%E6%BA%90%E5%86%BB%E7%BB%93\">R01\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r02-run-%E7%BB%9F%E4%B8%80%E9%A2%84%E7%AE%97\">R02\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">R05\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">R07\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r08-%E5%A4%96%E9%83%A8%E6%95%88%E6%9E%9C\">R08\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r09-%E8%B0%83%E5%BA%A6\">R09\u003c/a>\n产品能力：\u003ca href=\"#docs/planning/roadmap.md::r03-task-flow-%E5%AE%8C%E6%95%B4%E9%93%BE%E8%B7%AF\">R03\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r04-%E7%94%9F%E6%88%90%E6%A8%A1%E5%9D%97\">R04\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r06-skill-%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9F\">R06\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r10-%E5%85%A8%E9%83%A8-web-%E9%A1%B5%E9%9D%A2\">R10\u003c/a>\n交付验收：\u003ca href=\"#docs/planning/roadmap.md::r11-%E8%BF%90%E7%BB%B4%E4%B8%8E%E5%B7%A5%E7%A8%8B%E5%B7%A5%E5%85%B7\">R11\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r12-%E4%B8%9A%E5%8A%A1%E8%B4%A8%E9%87%8F%E9%AA%8C%E6%94%B6\">R12\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r13-%E5%85%A8%E9%87%8F%E5%A5%91%E7%BA%A6%E4%B8%8E%E6%9C%80%E7%BB%88%E5%AE%A1%E8%AE%A1\">R13\u003c/a>\u003c/p>\n\u003ch4 id=\"r01-资源冻结\">R01 资源冻结\u003c/h4>\n\u003cul>\n\u003cli>状态：选择/清单、输入回执、命名空间独占、多根与世代隔离已有实现；真实事务、迁移恢复及完整外部执行链待验。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/document-lifecycle.md::\">文档资产\u003c/a>、\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>、\u003ca href=\"#docs/design/run-creation.md::\">创建\u003c/a>；documents/integrations/runs/agent、Preflight、Run 详情。\u003c/li>\n\u003cli>验收：不越权/漂移、重放兼容、可信 byte 与跨根限额；补跨存储提交、并发配额、Run/Schedule 引用保护、下载完整性与持久清理，关联 R05 的撤权/归档竞争。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r02-run-统一预算\">R02 Run 统一预算\u003c/h4>\n\u003cul>\n\u003cli>状态：DTO、三表/0030、repository/store 已有代码，创建、主子执行、Worker startup 与受信计量/核对方尚未接入。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/run-budgets.md::\">预算\u003c/a>、Runtime 与子分析；复用账本，不重建内部保存版或直接当作公开协议。\u003c/li>\n\u003cli>验收：可信计量、主子共同预约/结算、真实并发与提交未知、跨 Segment/Attempt、旧 Run/混合 Worker/回退和公开投影。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r03-task-flow-完整链路\">R03 Task Flow 完整链路\u003c/h4>\n\u003cul>\n\u003cli>状态：待实现，尚无完整 Flow 契约、持久化或页面。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/task-flow.md::\">Task Flow\u003c/a>、Workspace、Interpreter；contracts/skills/runs/Web。\u003c/li>\n\u003cli>验收：预览、Draft/diff/发布、不可变 Run 流程、事件/待办/证据关联、三语与无 Flow 数据回退。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r04-生成模块\">R04 生成模块\u003c/h4>\n\u003cul>\n\u003cli>状态：模型/迁移和静态前置已有代码，构建、投放、Host、回退链未完成；CSP、构建身份与发布证明仍有差距。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/generated-modules.md::\">生成界面\u003c/a>；modules/API/Web/builder/Compose，与 SkillComposition 管理分开。\u003c/li>\n\u003cli>验收：依赖来源、隔离、产物和报告、提交恢复、安全投放、旧 Host 消息、独立显示回退。Preview 同样须满足首次执行门禁。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r05-领域与身份安全\">R05 领域与身份安全\u003c/h4>\n\u003cul>\n\u003cli>状态：会话 v2/0031、登录防护、账户与项目精确上下文已有实现；成员管理有业务事务重新认证、0033 审计与 ADMIN 页面。项目 CRUD 已接原会话复核、0034 版本、冲突比较与未知核对；成员审计和 Schedule 阻止整项目删除。真实事务、迁移和 HTTPS 仍待验。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/domain-model.md::\">领域\u003c/a>、\u003ca href=\"#docs/design/project-lifecycle.md::\">项目\u003c/a>、\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>、\u003ca href=\"#docs/design/login-protection.md::\">登录防护\u003c/a>、\u003ca href=\"#docs/design/user-lifecycle.md::\">用户\u003c/a>、\u003ca href=\"#docs/design/secret-storage.md::\">Secret\u003c/a>及相应 Web。\u003c/li>\n\u003cli>验收：最后 ADMIN、改密/撤销及成员/禁用竞争、0031–0034、真实 Redis/DB/HTTPS、多页面与未知提交；项目 CAS/成员审计真实回滚、独立项目审计、归档与创建竞争、完整删除引用和 blob 清理。TaskSchedule/成员审计的 RESTRICT 不能被“无 Run”替代。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r06-skill-生命周期\">R06 Skill 生命周期\u003c/h4>\n\u003cul>\n\u003cli>状态：导入/解释/发布/启停已有实现，同版重新启用审计、回滚与跨 Skill 规则组合尚未收口。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/skill-contract.md::\">Skill 契约\u003c/a>、\u003ca href=\"#docs/design/skill-interpretation.md::\">解释与发布\u003c/a>；skills/compositions/contracts/Web/system Skill。\u003c/li>\n\u003cli>验收：source/identity、候选与动态契约、精确版本、项目启用、兼容及失败恢复；模型解释质量另验。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r07-run-与审计\">R07 Run 与审计\u003c/h4>\n\u003cul>\n\u003cli>状态：主子结果、停止分类、终态复查、等待/普通事件取消检查已有代码。普通提问已与批准分路，答复原作者重放、原会话/Project/成员的事务内复核、锁后刷新与过期保护已接；Web 保留原请求，区分 GET 核对与人工重发，读取遭拒关闭确认。真实事务、撤权竞争、持久停止核对与完整结果校验仍待验收。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>、\u003ca href=\"#docs/design/user-interactions.md::\">普通答复\u003c/a>、\u003ca href=\"#docs/design/results-evaluation.md::\">结果\u003c/a>、\u003ca href=\"#docs/design/run-supervision.md::\">监督\u003c/a>；runs/worker/agent/events/evidence/evaluations/storage。\u003c/li>\n\u003cli>验收：保持普通答复/合法批准分路、历史只读和原 actor 重放回归；补答复/过期与撤权竞争的真实锁/回滚/接管/提交未知，Session/Tool 审计、进程退出和 SSE；补 Artifact/效果引用校验及评价原请求确认/分页。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r08-外部效果\">R08 外部效果\u003c/h4>\n\u003cul>\n\u003cli>状态：Git/SVN 与 Proposal/read-back 已有实现；内容相同不证明原执行，SVN 固定基线、阶段回执、贯穿监督、批准重发及旧 Schema 待补。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>；effects/integrations/repository/Provider/Web。\u003c/li>\n\u003cli>验收：精确批准/预授权、CAS、原执行身份、Effect lease、阶段回执、read-back、Git/SVN/PR 部分失败与真实外部恢复。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r09-调度\">R09 调度\u003c/h4>\n\u003cul>\n\u003cli>状态：ONCE/CRON、tick、API/创建 UI 已有代码；持久 occurrence、并发更新、计数/迟到恢复、编辑/分页/时区待补。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/task-scheduling.md::\">TaskSchedule\u003c/a>；schedules/worker/API/Web。\u003c/li>\n\u003cli>验收：精确时间、同 Schedule 重叠、原子配置、在途执行权、幂等计数、失效来源拒绝与兼容；不扩展成全局精确一次或停机补跑。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r10-全部-web-页面\">R10 全部 Web 页面\u003c/h4>\n\u003cul>\n\u003cli>状态：原请求确认、文档选择/详情、调度输入及登录已有局部基础；账户、成员、项目 CRUD 与普通答复共用防重/期限/旧响应隔离，各自定义拒绝和未知核对。普通答复有会话/Run 内稳定原请求与三语，App 分离项目目标/精确授权并保留失效深链接和初次平台草稿；module、文档、评价与批准页面的完整 mutation/未知结果隔离仍待收口。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a>与\u003ca href=\"#docs/design/document-lifecycle.md::\">文档管理\u003c/a>；pages/components/API/hooks/lib/styles/i18n。\u003c/li>\n\u003cli>验收：保持普通答复的切换、详情/SSE 刷新和原请求确认回归；补评价/批准/上传删除的同步防重、晚到响应和未知结果，服务端筛选/完整分页、三语、键盘、窄屏与真实用户流程。输入选择回归不能替代资产管理时序。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r11-运维与工程工具\">R11 运维与工程工具\u003c/h4>\n\u003cul>\n\u003cli>状态：ENV_FILE 已统一到公共 Compose 入口；发布有独立 load/migrate/api/worker、daemon/project/image 与有效配置复核，0027 不再降级删子会话审计。脚本/fake 与迁移谓词回归已接；统一全实例停写/清理、实际 Docker/Make/PowerShell 与真实恢复仍待验。\u003c/li>\n\u003cli>范围：\u003ca href=\"#docs/development/local-development.md::\">开发验证\u003c/a>、\u003ca href=\"#docs/operations/deployment.md::\">发布\u003c/a>、\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复\u003c/a>、\u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a>；ops/migrations/scripts/images/Compose/Dockerfile。\u003c/li>\n\u003cli>验收：锁定依赖、静态检查、迁移/回退、完整恢复点与 KEK、受引用资产清理、smoke；停止全部实例、旧队列、cron/recovery/解释写入者后再操作，dispatch=false 不构成停写证明。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r12-业务质量验收\">R12 业务质量验收\u003c/h4>\n\u003cul>\n\u003cli>状态：通用模型与结果质量需要获准、隔离的真实场景验证。\u003c/li>\n\u003cli>范围：Skill 解释、通用运行链、\u003ca href=\"#docs/design/results-evaluation.md::\">结果与人工评价\u003c/a>。\u003c/li>\n\u003cli>验收：规则保真、证据可追溯、输出可用与人工判定；输入与评价答案隔离，fixture 成功不当作实模型质量结论。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r13-全量契约与最终审计\">R13 全量契约与最终审计\u003c/h4>\n\u003cul>\n\u003cli>状态：全项目尚未完成，局部通过不关闭上述缺口。\u003c/li>\n\u003cli>范围：全部现行设计、\u003ca href=\"#PJM/AGENTS.md::\">AGENTS\u003c/a>、\u003ca href=\"#PJM/README.md::contracts\">契约\u003c/a>和工程入口。\u003c/li>\n\u003cli>验收：逐需求对应代码/契约/消费者/测试；Schema/example/OpenAPI 同步，真实 DB、浏览器、模型、外部与部署各按适用范围举证。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "ProjectMind 实施计划", "level": "h1", "anchor": "projectmind-实施计划", "text": "# ProjectMind 实施计划\n\n本页只维护当前未完成范围与着手顺序；功能规则见[设计索引](../design/README.md)，代码入口见[变更指南](../development/change-guide.md)。\n以下按当前代码与验证范围登记，不是全项目完成或部署证明。"}, {"title": "当前执行状态", "level": "h2", "anchor": "当前执行状态", "text": "## 当前执行状态\n\n核心 Skill/Run/资源/身份/外部效果链已有代码；共享预算、完整管理页面、Task Flow、生成界面及真实环境验收尚未完成。\n保留 R01–R13 作为开发任务 ID，不再按历次文档整理轮次登记进度。"}, {"title": "完成状态的判定", "level": "h3", "anchor": "完成状态的判定", "text": "### 完成状态的判定\n\n- 实现完成：代码、契约、消费者和相应回归接齐。\n- 部署完成：目标镜像、配置、迁移、健康检查与放行均确认。\n- 专项验收：具体场景有输入、环境、可观察结果及未覆盖范围。\n- 设计完成：规则可评审，不表示 API 或页面已经可用。"}, {"title": "当前证据怎么用", "level": "h3", "anchor": "当前证据怎么用", "text": "### 当前证据怎么用\n\n局部 mock/fake 测试、真实 DB、浏览器、模型和部署各自证明不同范围；skip、测试文件存在或旧通过次数不算当前验收。\n账户 API/Schema/OpenAPI/client 与 App 页面已接通；fake API 和 mock 浏览器不证明真实账户事务、会话部署或全站隔离。共享预算未接执行等缺口继续保留，文档构建不消除它们。"}, {"title": "下一步与当前决策", "level": "h3", "anchor": "下一步与当前决策", "text": "### 下一步与当前决策\n\n1. 先收口身份/资源边界、Run 停止与事务、共享预算和调度可靠性，再扩大自主执行能力。\n2. 保持账户链路回归，完善普通答复、评价、项目/文档管理的未知结果与上下文隔离。\n3. Task Flow 先做只读投影，再接版本契约、Run 冻结和事件关联；不另建执行器。\n4. 生成界面先满足威胁模型、构建身份、隔离与安全投放条件，静态 helper 通过不足以放行。\n5. 有获准的隔离环境后补真实资源、DB、代理、模型、外部写入与恢复验收；不为验证临时放宽权限。"}, {"title": "开发任务", "level": "h3", "anchor": "开发任务", "text": "### 开发任务\n\n范围覆盖 Backend、Web、contracts、Skill 执行资产、工具、构建/部署配置与对应测试。\n已有组件应接续而非重建；明确列为非目标的能力不当作缺失功能。\n\n运行基础：[R01](#r01-资源冻结) · [R02](#r02-run-统一预算) · [R05](#r05-领域与身份安全) · [R07](#r07-run-与审计) · [R08](#r08-外部效果) · [R09](#r09-调度)\n产品能力：[R03](#r03-task-flow-完整链路) · [R04](#r04-生成模块) · [R06](#r06-skill-生命周期) · [R10](#r10-全部-web-页面)\n交付验收：[R11](#r11-运维与工程工具) · [R12](#r12-业务质量验收) · [R13](#r13-全量契约与最终审计)"}, {"title": "R01 资源冻结", "level": "h4", "anchor": "r01-资源冻结", "text": "#### R01 资源冻结\n\n- 状态：选择/清单、输入回执、命名空间独占、多根与世代隔离已有实现；真实事务、迁移恢复及完整外部执行链待验。\n- 范围：[文档资产](../design/document-lifecycle.md)、[资源快照](../design/resource-snapshots.md)、[创建](../design/run-creation.md)；documents/integrations/runs/agent、Preflight、Run 详情。\n- 验收：不越权/漂移、重放兼容、可信 byte 与跨根限额；补跨存储提交、并发配额、Run/Schedule 引用保护、下载完整性与持久清理，关联 R05 的撤权/归档竞争。"}, {"title": "R02 Run 统一预算", "level": "h4", "anchor": "r02-run-统一预算", "text": "#### R02 Run 统一预算\n\n- 状态：DTO、三表/0030、repository/store 已有代码，创建、主子执行、Worker startup 与受信计量/核对方尚未接入。\n- 范围：[预算](../design/run-budgets.md)、Runtime 与子分析；复用账本，不重建内部保存版或直接当作公开协议。\n- 验收：可信计量、主子共同预约/结算、真实并发与提交未知、跨 Segment/Attempt、旧 Run/混合 Worker/回退和公开投影。"}, {"title": "R03 Task Flow 完整链路", "level": "h4", "anchor": "r03-task-flow-完整链路", "text": "#### R03 Task Flow 完整链路\n\n- 状态：待实现，尚无完整 Flow 契约、持久化或页面。\n- 范围：[Task Flow](../design/task-flow.md)、Workspace、Interpreter；contracts/skills/runs/Web。\n- 验收：预览、Draft/diff/发布、不可变 Run 流程、事件/待办/证据关联、三语与无 Flow 数据回退。"}, {"title": "R04 生成模块", "level": "h4", "anchor": "r04-生成模块", "text": "#### R04 生成模块\n\n- 状态：模型/迁移和静态前置已有代码，构建、投放、Host、回退链未完成；CSP、构建身份与发布证明仍有差距。\n- 范围：[生成界面](../design/generated-modules.md)；modules/API/Web/builder/Compose，与 SkillComposition 管理分开。\n- 验收：依赖来源、隔离、产物和报告、提交恢复、安全投放、旧 Host 消息、独立显示回退。Preview 同样须满足首次执行门禁。"}, {"title": "R05 领域与身份安全", "level": "h4", "anchor": "r05-领域与身份安全", "text": "#### R05 领域与身份安全\n\n- 状态：会话 v2/0031、登录防护、账户与项目精确上下文已有实现；成员管理有业务事务重新认证、0033 审计与 ADMIN 页面。项目 CRUD 已接原会话复核、0034 版本、冲突比较与未知核对；成员审计和 Schedule 阻止整项目删除。真实事务、迁移和 HTTPS 仍待验。\n- 范围：[领域](../design/domain-model.md)、[项目](../design/project-lifecycle.md)、[认证](../design/authentication.md)、[登录防护](../design/login-protection.md)、[用户](../design/user-lifecycle.md)、[Secret](../design/secret-storage.md)及相应 Web。\n- 验收：最后 ADMIN、改密/撤销及成员/禁用竞争、0031–0034、真实 Redis/DB/HTTPS、多页面与未知提交；项目 CAS/成员审计真实回滚、独立项目审计、归档与创建竞争、完整删除引用和 blob 清理。TaskSchedule/成员审计的 RESTRICT 不能被“无 Run”替代。"}, {"title": "R06 Skill 生命周期", "level": "h4", "anchor": "r06-skill-生命周期", "text": "#### R06 Skill 生命周期\n\n- 状态：导入/解释/发布/启停已有实现，同版重新启用审计、回滚与跨 Skill 规则组合尚未收口。\n- 范围：[Skill 契约](../design/skill-contract.md)、[解释与发布](../design/skill-interpretation.md)；skills/compositions/contracts/Web/system Skill。\n- 验收：source/identity、候选与动态契约、精确版本、项目启用、兼容及失败恢复；模型解释质量另验。"}, {"title": "R07 Run 与审计", "level": "h4", "anchor": "r07-run-与审计", "text": "#### R07 Run 与审计\n\n- 状态：主子结果、停止分类、终态复查、等待/普通事件取消检查已有代码。普通提问已与批准分路，答复原作者重放、原会话/Project/成员的事务内复核、锁后刷新与过期保护已接；Web 保留原请求，区分 GET 核对与人工重发，读取遭拒关闭确认。真实事务、撤权竞争、持久停止核对与完整结果校验仍待验收。\n- 范围：[Runtime](../design/agent-runtime.md)、[普通答复](../design/user-interactions.md)、[结果](../design/results-evaluation.md)、[监督](../design/run-supervision.md)；runs/worker/agent/events/evidence/evaluations/storage。\n- 验收：保持普通答复/合法批准分路、历史只读和原 actor 重放回归；补答复/过期与撤权竞争的真实锁/回滚/接管/提交未知，Session/Tool 审计、进程退出和 SSE；补 Artifact/效果引用校验及评价原请求确认/分页。"}, {"title": "R08 外部效果", "level": "h4", "anchor": "r08-外部效果", "text": "#### R08 外部效果\n\n- 状态：Git/SVN 与 Proposal/read-back 已有实现；内容相同不证明原执行，SVN 固定基线、阶段回执、贯穿监督、批准重发及旧 Schema 待补。\n- 范围：[受控写入](../design/repository-effects.md)；effects/integrations/repository/Provider/Web。\n- 验收：精确批准/预授权、CAS、原执行身份、Effect lease、阶段回执、read-back、Git/SVN/PR 部分失败与真实外部恢复。"}, {"title": "R09 调度", "level": "h4", "anchor": "r09-调度", "text": "#### R09 调度\n\n- 状态：ONCE/CRON、tick、API/创建 UI 已有代码；持久 occurrence、并发更新、计数/迟到恢复、编辑/分页/时区待补。\n- 范围：[TaskSchedule](../design/task-scheduling.md)；schedules/worker/API/Web。\n- 验收：精确时间、同 Schedule 重叠、原子配置、在途执行权、幂等计数、失效来源拒绝与兼容；不扩展成全局精确一次或停机补跑。"}, {"title": "R10 全部 Web 页面", "level": "h4", "anchor": "r10-全部-web-页面", "text": "#### R10 全部 Web 页面\n\n- 状态：原请求确认、文档选择/详情、调度输入及登录已有局部基础；账户、成员、项目 CRUD 与普通答复共用防重/期限/旧响应隔离，各自定义拒绝和未知核对。普通答复有会话/Run 内稳定原请求与三语，App 分离项目目标/精确授权并保留失效深链接和初次平台草稿；module、文档、评价与批准页面的完整 mutation/未知结果隔离仍待收口。\n- 范围：[Workspace](../design/workspace.md)与[文档管理](../design/document-lifecycle.md)；pages/components/API/hooks/lib/styles/i18n。\n- 验收：保持普通答复的切换、详情/SSE 刷新和原请求确认回归；补评价/批准/上传删除的同步防重、晚到响应和未知结果，服务端筛选/完整分页、三语、键盘、窄屏与真实用户流程。输入选择回归不能替代资产管理时序。"}, {"title": "R11 运维与工程工具", "level": "h4", "anchor": "r11-运维与工程工具", "text": "#### R11 运维与工程工具\n\n- 状态：ENV_FILE 已统一到公共 Compose 入口；发布有独立 load/migrate/api/worker、daemon/project/image 与有效配置复核，0027 不再降级删子会话审计。脚本/fake 与迁移谓词回归已接；统一全实例停写/清理、实际 Docker/Make/PowerShell 与真实恢复仍待验。\n- 范围：[开发验证](../development/local-development.md)、[发布](../operations/deployment.md)、[恢复](../operations/backup-recovery.md)、[Runbook](../operations/runbook.md)；ops/migrations/scripts/images/Compose/Dockerfile。\n- 验收：锁定依赖、静态检查、迁移/回退、完整恢复点与 KEK、受引用资产清理、smoke；停止全部实例、旧队列、cron/recovery/解释写入者后再操作，dispatch=false 不构成停写证明。"}, {"title": "R12 业务质量验收", "level": "h4", "anchor": "r12-业务质量验收", "text": "#### R12 业务质量验收\n\n- 状态：通用模型与结果质量需要获准、隔离的真实场景验证。\n- 范围：Skill 解释、通用运行链、[结果与人工评价](../design/results-evaluation.md)。\n- 验收：规则保真、证据可追溯、输出可用与人工判定；输入与评价答案隔离，fixture 成功不当作实模型质量结论。"}, {"title": "R13 全量契约与最终审计", "level": "h4", "anchor": "r13-全量契约与最终审计", "text": "#### R13 全量契约与最终审计\n\n- 状态：全项目尚未完成，局部通过不关闭上述缺口。\n- 范围：全部现行设计、[AGENTS](../../PJM/AGENTS.md)、[契约](../../PJM/README.md#contracts)和工程入口。\n- 验收：逐需求对应代码/契约/消费者/测试；Schema/example/OpenAPI 同步，真实 DB、浏览器、模型、外部与部署各按适用范围举证。"}], "toc": [{"title": "当前执行状态", "anchor": "当前执行状态", "level": "h2"}, {"title": "完成状态的判定", "anchor": "完成状态的判定", "level": "h3"}, {"title": "当前证据怎么用", "anchor": "当前证据怎么用", "level": "h3"}, {"title": "下一步与当前决策", "anchor": "下一步与当前决策", "level": "h3"}, {"title": "开发任务", "anchor": "开发任务", "level": "h3"}], "source": "planning/roadmap.md", "checksum": "181619d0df8f1e4ba6feb3bc637631bf9cfb8d1e1dfbea18e40496acf9e7124d"}, {"id": "docs/design/README.md", "title": "設計の読み順と責任分担", "group": "design", "html": "\u003ch1 id=\"設計の読み順と責任分担\">設計の読み順と責任分担\u003c/h1>\n\u003cp>\u003ca href=\"#docs/README.md::\">文書ガイド\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">現在の計画\u003c/a> · \u003ca href=\"#docs/development/change-guide.md::\">コードへの対応\u003c/a>\u003c/p>\n\u003cp>各設計は保証すべき規則と未解消差距を記す。正確な field/type は \u003ca href=\"#PJM/README.md::contracts\">contracts\u003c/a>、実装状況と優先順は計画を確認する。\u003c/p>\n\u003ch2 id=\"初めて読むとき\">初めて読むとき\u003c/h2>\n\u003cul>\n\u003cli>全体：\u003ca href=\"#docs/overview/product.md::\">製品\u003c/a> → \u003ca href=\"#docs/overview/architecture.md::\">構成\u003c/a> → \u003ca href=\"#docs/design/domain-model.md::\">領域モデル\u003c/a>。\u003c/li>\n\u003cli>一回の実行：\u003ca href=\"#docs/design/run-creation.md::\">作成\u003c/a> → \u003ca href=\"#docs/design/resource-snapshots.md::\">資源\u003c/a> → \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a> → \u003ca href=\"#docs/design/results-evaluation.md::\">結果\u003c/a>。\u003c/li>\n\u003cli>変更を始める：下表から責任を持つ設計を選び、\u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>でコード・回帰へ進む。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"どの設計を変更するか\">どの設計を変更するか\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>正本\u003c/th>\n\u003cth>担当する規則\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/domain-model.md::\">領域モデル\u003c/a>\u003c/td>\n\u003ctd>所有者、主要オブジェクトと永続化の境界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/project-lifecycle.md::\">Project\u003c/a> / \u003ca href=\"#docs/design/document-lifecycle.md::\">文書資産\u003c/a>\u003c/td>\n\u003ctd>選択・メンバー・アーカイブ・参照保護 / upload・配額・blob 清理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/authentication.md::\">認証\u003c/a> / \u003ca href=\"#docs/design/login-protection.md::\">ログイン防護\u003c/a>\u003c/td>\n\u003ctd>Session・CSRF・授権 / 配額・退避・Redis 故障\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/user-lifecycle.md::\">ユーザー\u003c/a> / \u003ca href=\"#docs/design/secret-storage.md::\">Secret\u003c/a>\u003c/td>\n\u003ctd>管理 transaction・撤銷・監査 / 暗号化・resolver・鍵更新\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/skill-contract.md::\">Skill 契約\u003c/a> / \u003ca href=\"#docs/design/skill-interpretation.md::\">解釈・公開\u003c/a>\u003c/td>\n\u003ctd>Blueprint・Manifest・精確版・Project 有効化 / source から候補への検証\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/run-creation.md::\">Run 作成\u003c/a> / \u003ca href=\"#docs/design/resource-snapshots.md::\">資源快照\u003c/a>\u003c/td>\n\u003ctd>原要求と再送 / 選択・凍結・準備回执・実 byte\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a> / \u003ca href=\"#docs/design/run-supervision.md::\">実行監督\u003c/a>\u003c/td>\n\u003ctd>Segment・Attempt・Session・event / 取消・timeout・lease・停止確認\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/user-interactions.md::\">回答と続行\u003c/a> / \u003ca href=\"#docs/design/results-evaluation.md::\">結果と評価\u003c/a>\u003c/td>\n\u003ctd>普通回答・期限・未知提交 / 引用・原値・追加式修訂\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/run-budgets.md::\">予算\u003c/a> / \u003ca href=\"#docs/design/subagents.md::\">子分析\u003c/a>\u003c/td>\n\u003ctd>計量・予約・結算 / 子能力・出力・Session/Tool 監査\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/repository-effects.md::\">受控書き込み\u003c/a> / \u003ca href=\"#docs/design/task-scheduling.md::\">調度\u003c/a>\u003c/td>\n\u003ctd>Proposal・承認・CAS・read-back / 発火・並行更新・在途復旧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a> / \u003ca href=\"#docs/design/task-flow.md::\">Task Flow\u003c/a>\u003c/td>\n\u003ctd>ページ・入力・三語 / 計画と実活動の投影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/generated-modules.md::\">生成モジュール\u003c/a>\u003c/td>\n\u003ctd>構築 identity・隔離・Host・独立表示回退\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"境界をまたぐ変更の読み方\">境界をまたぐ変更の読み方\u003c/h2>\n\u003cp>一つの規則は一つの正本に置く。たとえば原要求の再送は Run 作成、入力の固定は資源快照、画面の確認は Workspace が担当し、Worker の技術復旧とは分ける。\n権限・契約・永続化・消費側が変わる場合は、\u003ca href=\"#docs/development/contract-workflow.md::\">同期と版互換\u003c/a>も確認する。\u003c/p>\n", "sections": [{"title": "設計の読み順と責任分担", "level": "h1", "anchor": "設計の読み順と責任分担", "text": "# 設計の読み順と責任分担\n\n[文書ガイド](../README.md) · [現在の計画](../planning/roadmap.md#当前执行状态) · [コードへの対応](../development/change-guide.md)\n\n各設計は保証すべき規則と未解消差距を記す。正確な field/type は [contracts](../../PJM/README.md#contracts)、実装状況と優先順は計画を確認する。"}, {"title": "初めて読むとき", "level": "h2", "anchor": "初めて読むとき", "text": "## 初めて読むとき\n\n- 全体：[製品](../overview/product.md) → [構成](../overview/architecture.md) → [領域モデル](domain-model.md)。\n- 一回の実行：[作成](run-creation.md) → [資源](resource-snapshots.md) → [Runtime](agent-runtime.md) → [結果](results-evaluation.md)。\n- 変更を始める：下表から責任を持つ設計を選び、[変更ガイド](../development/change-guide.md)でコード・回帰へ進む。"}, {"title": "どの設計を変更するか", "level": "h2", "anchor": "どの設計を変更するか", "text": "## どの設計を変更するか\n\n| 正本 | 担当する規則 |\n| --- | --- |\n| [領域モデル](domain-model.md) | 所有者、主要オブジェクトと永続化の境界 |\n| [Project](project-lifecycle.md) / [文書資産](document-lifecycle.md) | 選択・メンバー・アーカイブ・参照保護 / upload・配額・blob 清理 |\n| [認証](authentication.md) / [ログイン防護](login-protection.md) | Session・CSRF・授権 / 配額・退避・Redis 故障 |\n| [ユーザー](user-lifecycle.md) / [Secret](secret-storage.md) | 管理 transaction・撤銷・監査 / 暗号化・resolver・鍵更新 |\n| [Skill 契約](skill-contract.md) / [解釈・公開](skill-interpretation.md) | Blueprint・Manifest・精確版・Project 有効化 / source から候補への検証 |\n| [Run 作成](run-creation.md) / [資源快照](resource-snapshots.md) | 原要求と再送 / 選択・凍結・準備回执・実 byte |\n| [Runtime](agent-runtime.md) / [実行監督](run-supervision.md) | Segment・Attempt・Session・event / 取消・timeout・lease・停止確認 |\n| [回答と続行](user-interactions.md) / [結果と評価](results-evaluation.md) | 普通回答・期限・未知提交 / 引用・原値・追加式修訂 |\n| [予算](run-budgets.md) / [子分析](subagents.md) | 計量・予約・結算 / 子能力・出力・Session/Tool 監査 |\n| [受控書き込み](repository-effects.md) / [調度](task-scheduling.md) | Proposal・承認・CAS・read-back / 発火・並行更新・在途復旧 |\n| [Workspace](workspace.md) / [Task Flow](task-flow.md) | ページ・入力・三語 / 計画と実活動の投影 |\n| [生成モジュール](generated-modules.md) | 構築 identity・隔離・Host・独立表示回退 |"}, {"title": "境界をまたぐ変更の読み方", "level": "h2", "anchor": "境界をまたぐ変更の読み方", "text": "## 境界をまたぐ変更の読み方\n\n一つの規則は一つの正本に置く。たとえば原要求の再送は Run 作成、入力の固定は資源快照、画面の確認は Workspace が担当し、Worker の技術復旧とは分ける。\n権限・契約・永続化・消費側が変わる場合は、[同期と版互換](../development/contract-workflow.md)も確認する。"}], "toc": [{"title": "初めて読むとき", "anchor": "初めて読むとき", "level": "h2"}, {"title": "どの設計を変更するか", "anchor": "どの設計を変更するか", "level": "h2"}, {"title": "境界をまたぐ変更の読み方", "anchor": "境界をまたぐ変更の読み方", "level": "h2"}], "source": "design/README.md", "checksum": "78df45ef5cf0bb90a272d325a8a66d91be6acfcbfcc71e1a722e0eb775ac959b"}, {"id": "docs/design/domain-model.md", "title": "领域模型与权限", "group": "design", "html": "\u003ch1 id=\"领域模型与权限\">领域模型与权限\u003c/h1>\n\u003cp>本页是实体与边界地图，不重复各专题协议。术语见\u003ca href=\"#docs/overview/glossary.md::\">词汇表\u003c/a>，实施状态见\u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">计划\u003c/a>。平台不把特定业务字段固化为通用领域对象。\u003c/p>\n\u003ch2 id=\"建模原则\">建模原则\u003c/h2>\n\u003cul>\n\u003cli>Skill 描述目标、资源、规则与产物，不授予权限；平台固定跨 Skill 控制协议，不预定义所有业务 Schema。\u003c/li>\n\u003cli>Organization 保存可复用 Skill 资产，Project 显式启用精确版本并绑定资源。\u003c/li>\n\u003cli>Run 固定目标与权限；业务续行追加 Segment，技术恢复追加 Attempt，模型 Session 只是执行载体。\u003c/li>\n\u003cli>已发布内容、Run snapshot、Result 不变；答复、评价、外部批准和审计各自追加。\u003c/li>\n\u003cli>外部写入必须 propose → 批准/适用预授权 → 执行 → 回读，不把 Agent 建议变成权限。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"组织项目与资源\">组织、项目与资源\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>责任与实际边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Organization\u003c/td>\n\u003ctd>组织隔离；当前仅单组织部署，不等于多租户登录已实现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User / AuthSession\u003c/td>\n\u003ctd>ADMIN/USER、ACTIVE/DISABLED；浏览器会话保存 hash、期限、撤销、凭据版及登录角色，不是 AgentSession\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UserSecurityEvent\u003c/td>\n\u003ctd>账户安全操作追加记录，不是登录尝试日志或 RunEvent\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Project / ProjectMember\u003c/td>\n\u003ctd>项目资源边界与 ACTIVE/REMOVED 成员关系；不增加 Project ADMIN 角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectMemberEvent\u003c/td>\n\u003ctd>成员加入/移除的前后关系与原 actor/request 关联，和关系变更同事务保存；不回填虚构历史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integration\u003c/td>\n\u003ctd>项目中的版本化 Provider 资源与 scope；内置文档不要求 Integration 行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SecretReference\u003c/td>\n\u003ctd>定位凭据；MANAGED 材料独立加密保存，原值不进入 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectDocument\u003c/td>\n\u003ctd>ProjectKnowledge 的实际载体：元数据与 blob；自动同步/独立知识索引不是现有服务\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"#docs/design/project-lifecycle.md::\">项目生命周期\u003c/a>负责成员、偏好、归档与删除；归档不停止 Run，移除成员不撤销账户全部会话。ADMIN 的本组织访问不依赖 ProjectMember；\u003ca href=\"#docs/design/user-lifecycle.md::\">用户管理\u003c/a>和\u003ca href=\"#docs/design/authentication.md::%E4%BC%9A%E8%AF%9D%E5%87%AD%E6%8D%AE-v2-%E4%B8%8E%E5%88%87%E6%8D%A2%E8%A6%81%E6%B1%82\">会话 v2\u003c/a>分别负责账户变更与凭据。\u003c/p>\n\u003cp>SkillSource、Interpretation、SkillVersion、Manifest 归 Organization。同一版本可在多个 Project 使用，但每个 Project 必须显式启用精确 PUBLISHED 版本；新发布不自动启用或升级。资源就绪度按项目独立计算，启用关系不授予资源/Tool 权限。\u003c/p>\n\u003ch2 id=\"skill-导入解释与发布\">Skill 导入、解释与发布\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>SkillSource\u003c/td>\n\u003ctd>不可变来源目录、附件、metadata、hash 与文件索引\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillInterpretation\u003c/td>\n\u003ctd>一次追加式解释；重新调整保留 parent lineage\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CapabilityBlueprint\u003c/td>\n\u003ctd>能力、目标、资源、规则、交付物、交互/效果意图及来源依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ResourceRequirement / OutcomeDefinition\u003c/td>\n\u003ctd>抽象资源条件与交付/证据要求，不绑定 Project Secret\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill / SkillVersion\u003c/td>\n\u003ctd>稳定业务身份 / 冻结内容的精确版本；生命周期状态与内容分开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RuntimeManifest\u003c/td>\n\u003ctd>版本化运行投影，冻结蓝图、Tool/Task 与可选业务 Schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillComposition / ProjectComposition\u003c/td>\n\u003ctd>精确版本的展示组合及项目启用；不是新系统角色或自动编排器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectSkillVersion\u003c/td>\n\u003ctd>Project 对精确 PUBLISHED 版本的启停记录；当前停用关系不能重新启用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>领域 capability 可是新概念，真实 Tool 调用才要求平台注册的 versioned capability。合法蓝图与发布门禁不能因 GUIDANCE_ONLY 或缺资源而省略。\u003c/p>\n\u003cp>发布、项目启用、readiness 是不同判断：同版在 A 项目可运行，在 B 项目缺资源；ACTIONABLE 不等于具体变更已批准。详见\u003ca href=\"#docs/design/skill-contract.md::%E5%8F%91%E5%B8%83%E4%B8%8E%E5%B0%B1%E7%BB%AA%E7%9A%84%E5%88%A4%E6%96%AD%E9%A1%BA%E5%BA%8F\">Skill 契约\u003c/a>与\u003ca href=\"#docs/design/skill-interpretation.md::\">解释实现\u003c/a>。\u003c/p>\n\u003ch2 id=\"任务run-与会话\">任务、Run 与会话\u003c/h2>\n\u003ch3 id=\"任务定义\">任务定义\u003c/h3>\n\u003cp>ExecutableTask 从精确已发布蓝图投影，无独立 task 业务表，task_id 由服务端生成。ResourceBinding 将抽象要求绑定 Integration、文档或用户输入；Project/Task 配置在创建时冻结为 Run 资源。\u003c/p>\n\u003cp>AgentTaskBriefSnapshot 按 Segment 冻结目标、原 Skill、规则、资源、权限与交付要求。TaskSchedule 保存精确版本、输入及选择规则；每次 ONCE/CRON 触发再经普通创建服务生成 Run，必带 IANA timezone，见\u003ca href=\"#docs/design/task-scheduling.md::\">调度\u003c/a>。\u003c/p>\n\u003ch3 id=\"执行对象\">执行对象\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">Run：固定目标、版本、权限与资源\n├── Segment 1：初始工作\n│   ├── Attempt 1：Worker 领取\n│   └── Attempt 2：同段技术恢复\n├── Segment 2：业务答复/效果处理后续行\n├── RunInputSnapshot：整个 Run 的准备回执\n├── 主 AgentSession：顺序 resume/fork/replace\n│   └── SUBAGENT / BRANCH：受限只读并行\n└── Result、Evidence、Artifact、Interaction、Proposal 与审计\n\u003c/code>\u003c/pre>\n\u003cp>Brief 按 Segment 冻结，输入准备回执按 Run 复用，lease 按 Attempt 校验；不是同一种 checksum 对象。RunInputSnapshot 已有模型与部分接线，完整恢复仍见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>。RunBudgetAccount/Reservation/Receipt 有内部载体，但尚未接入主/子执行，不从实体存在推断共享预算已生效。\u003c/p>\n\u003cp>RunStep 是 STEP_* 事件的投影，不是独立持久表。RunEvent 是追加式审计/SSE 来源；TEXT_DELTA 可消耗 sequence 却不持久化，欠号不自动说明丢事件。\u003c/p>\n\u003ch3 id=\"用户交互与外部效果\">用户交互与外部效果\u003c/h3>\n\u003cul>\n\u003cli>UserInteraction/InteractionResponse：问题、期限、版本与原答复身份；CLARIFICATION/CHOICE/REVIEW 走\u003ca href=\"#docs/design/user-interactions.md::\">普通答复\u003c/a>，EFFECT_APPROVAL 必须关联 Proposal。\u003c/li>\n\u003cli>ChangeProposal/Approval/EffectExecution：精确变更、决定和真实执行/回读事实；APPROVED 不证明 APPLIED 或模型已续行。\u003c/li>\n\u003cli>Result：最多一个终态原始结果，可含通用 Outcome；失败/取消可没有 Result，SUCCEEDED 不证明业务完整。\u003c/li>\n\u003cli>Evidence/Artifact：证据及产物引用；引用格式、可访问对象和实际内容验证不能合并。\u003c/li>\n\u003cli>Evaluation：人工评分和修订建议；多条建议均相对同一原值，不顺次覆盖 Result，见\u003ca href=\"#docs/design/results-evaluation.md::\">结果设计\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"核心字段与实际载体\">核心字段与实际载体\u003c/h2>\n\u003cp>完整列见 \u003ca href=\"../PJM/backend/src/projectmind/db/models.py\">db/models.py\u003c/a>，公开数据需同时核对 \u003ca href=\"../PJM/contracts\">Schema\u003c/a>、route 和 \u003ca href=\"../PJM/contracts/openapi/projectmind-api.v1.json\">OpenAPI\u003c/a>。概念不等于同名表，快照存在不证明与工作副本同步。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>领域\u003c/th>\n\u003cth>持久化入口与限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>账户\u003c/td>\n\u003ctd>users / auth_sessions / user_security_events；账户 row_version 不覆盖偏好/登录时间，审计唯一键不等于 DB 禁止任意修改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill\u003c/td>\n\u003ctd>skill_sources / skill_interpretations / skills / skill_versions / runtime_manifests；Blueprint 内嵌于解释与 Manifest\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目资源\u003c/td>\n\u003ctd>projects / project_members / project_member_events / integrations / resource_bindings / project_documents；Project row_version 只覆盖 metadata/归档，成员审计阻止整项目删除，字节与 DB 分别提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>凭据\u003c/td>\n\u003ctd>secret_references / managed_secret_material；引用 key_version 与密文 kek_version 不是同层版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务配置\u003c/td>\n\u003ctd>project_skill_versions、组合表、task_schedules；当前启停单行记录不代表完整历次审计，旧成员关系也不补造事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行\u003c/td>\n\u003ctd>runs / run_skill_snapshots / run_segments / run_attempts / agent_task_brief_snapshots\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session\u003c/td>\n\u003ctd>agent_sessions / agent_session_transcripts / agent_session_entries；transcript 追加镜像，不替代业务事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输入与预算\u003c/td>\n\u003ctd>run_input_snapshots（0029）；run_budget_accounts/reservations/receipts（0030），有载体不等于消费者全部接齐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交互/效果\u003c/td>\n\u003ctd>user_interactions / interaction_responses / change_proposals / change_approvals / effect_executions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结果/事件\u003c/td>\n\u003ctd>run_results / evaluations / evidence / run_events / outbox_messages；Artifact 不假设独立表\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>frontend_module_versions（0026）属于\u003ca href=\"#docs/design/generated-modules.md::\">生成展示\u003c/a>，不是 SkillComposition；构建、发布与 Host 尚未接通，不能混用版本回退。\u003c/p>\n\u003cp>Run 创建意图保存在 task_snapshot_json.creation_request；其身份与 runtime snapshot 不同。兼容 hash 与事务规则见\u003ca href=\"#docs/design/run-creation.md::\">Run 创建\u003c/a>，不改写旧快照补造请求。\u003c/p>\n\u003ch2 id=\"权限模型\">权限模型\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>ADMIN\u003c/th>\n\u003cth>USER\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>管理组织用户、项目成员、Integration、Secret\u003c/td>\n\u003ctd>本组织允许\u003c/td>\n\u003ctd>禁止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本人账户、安全历史、改密、撤销本人会话\u003c/td>\n\u003ctd>本人范围\u003c/td>\n\u003ctd>本人范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>导入/解释/发布/废弃 Skill，项目启停版本\u003c/td>\n\u003ctd>本组织允许\u003c/td>\n\u003ctd>禁止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行任务、读 Run/结果、追加评价\u003c/td>\n\u003ctd>仍受项目与业务硬约束\u003c/td>\n\u003ctd>活动成员及对应业务条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>普通答复\u003c/td>\n\u003ctd>Project 写权限及交互版本/期限\u003c/td>\n\u003ctd>同左\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部批准\u003c/td>\n\u003ctd>system ADMIN\u003c/td>\n\u003ctd>当前有 Project 写权限的 Run 发起人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>低风险预授权\u003c/td>\n\u003ctd>精确 scope；repository.write 除外\u003c/td>\n\u003ctd>禁止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除审计\u003c/td>\n\u003ctd>禁止；仅独立保留策略清理\u003c/td>\n\u003ctd>禁止\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>判定顺序：平台硬拒绝 → 当前身份/成员 → Project 策略/Integration scope → Skill/Task 要求 → Run 冻结上限 → 参数级 Tool 校验 → 精确批准/适用预授权。后一层不能覆盖前面的拒绝，用户文本和模型建议不扩权。\u003c/p>\n\u003ch2 id=\"状态与不变量\">状态与不变量\u003c/h2>\n\u003ch3 id=\"状态流转\">状态流转\u003c/h3>\n\u003cp>SkillInterpretation 为 ANALYZING → PREVIEW_READY → SUPERSEDED，失败为 FAILED；SkillVersion 为 DRAFT → PUBLISHED → DEPRECATED，废弃不可复活。readiness 的 GUIDANCE_ONLY/CONFIGURATION_REQUIRED/RUNNABLE/ACTIONABLE 不替代发布状态。\u003c/p>\n\u003cp>Proposal 从 DRAFT/PENDING_APPROVAL 到 APPROVED/APPLYING/APPLIED，也可 REJECTED/STALE/FAILED；EffectExecution 有独立 REQUESTED/LEASED/APPLYING/APPLIED 与失败/重试路径，见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。\u003c/p>\n\u003ch3 id=\"run-状态速查\">Run 状态速查\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事件\u003c/th>\n\u003cth>常见 Run 路径与执行变化\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>首次启动\u003c/td>\n\u003ctd>QUEUED → PREPARING → RUNNING；初始 Segment，claim 创建 LEASED Attempt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等待用户/批准\u003c/td>\n\u003ctd>WAITING_FOR_INPUT/WAITING_FOR_APPROVAL；Segment WAITING，Attempt DEFERRED，释放 lease\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有效答复/独立期限处理\u003c/td>\n\u003ctd>追加 Segment，重新 QUEUED；原答复和批准不覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lease 失效可恢复\u003c/td>\n\u003ctd>RETRY_PENDING → PREPARING；原 Attempt LEASE_EXPIRED，同段追加 Attempt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结束\u003c/td>\n\u003ctd>SUCCEEDED/FAILED/CANCELLED；terminal RUN_SNAPSHOT，终态不重新打开\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>允许转换与 enum 以 \u003ca href=\"../PJM/backend/src/projectmind/runs/domain.py\">runs/domain.py\u003c/a>为准；WAITING_PERMISSION 仅旧协议兼容。RUNNING 可能先于资源物化，不代表输入 READY 或 Session 已启动。取消受理、终态、进程退出和用量结清分别举证。\u003c/p>\n\u003ch3 id=\"执行不变量\">执行不变量\u003c/h3>\n\u003cul>\n\u003cli>等待释放 lease，不计 engine wall timeout；普通交互期限独立，过期以 INTERACTION_TIMEOUT 新段携带缺失事实，不代答推荐项。批准过期不执行 Provider。\u003c/li>\n\u003cli>普通答复/效果处理追加 Segment；可恢复 lease 失效追加同段 Attempt。engine wall timeout 按 FAILED，不能泛化为可重试。\u003c/li>\n\u003cli>aggregate 锁顺序固定 Run → Segment → Attempt 或 Proposal/Interaction/Effect；不先锁子对象。\u003c/li>\n\u003cli>terminal RUN_SNAPSHOT 是最后持久事件；PostgreSQL 为正本，状态与 Outbox 同事务，消费幂等。\u003c/li>\n\u003cli>改目标、项目、精确版本、权限上限或已用资源须新 Run；Session 变化不改变冻结边界。\u003c/li>\n\u003cli>预算需跨主/子/续行共享；\u003ca href=\"#docs/design/run-budgets.md::\">内部账本\u003c/a>和局部限制均不证明此目标已落实。\u003c/li>\n\u003cli>外部执行重验版本、binding、scope、前置条件与批准，Provider 必须有可验证并发/幂等和 read-back。\u003c/li>\n\u003cli>Result 保持原值，Evaluation 只追加。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"实施兼容说明\">实施兼容说明\u003c/h2>\n\u003cp>新 Run 显式创建 Segment 1 和 immutable binding；旧 Run 按隐式 Segment 只读投影，不回填虚构事实。旧版本、Run 和业务结果继续只读审计，不恢复业务专用 Schema/seed/renderer 为通用规则来源。\u003c/p>\n\u003cp>模型、migration、repository、公开契约与 Web 必须一起核对；真实锁竞争、事务回滚、历史重放、引用删除保护及跨 Project 拒绝分别验收，不由 DTO 或测试文件存在推断完成。\u003c/p>\n", "sections": [{"title": "领域模型与权限", "level": "h1", "anchor": "领域模型与权限", "text": "# 领域模型与权限\n\n本页是实体与边界地图，不重复各专题协议。术语见[词汇表](../overview/glossary.md)，实施状态见[计划](../planning/roadmap.md#当前执行状态)。平台不把特定业务字段固化为通用领域对象。"}, {"title": "建模原则", "level": "h2", "anchor": "建模原则", "text": "## 建模原则\n\n- Skill 描述目标、资源、规则与产物，不授予权限；平台固定跨 Skill 控制协议，不预定义所有业务 Schema。\n- Organization 保存可复用 Skill 资产，Project 显式启用精确版本并绑定资源。\n- Run 固定目标与权限；业务续行追加 Segment，技术恢复追加 Attempt，模型 Session 只是执行载体。\n- 已发布内容、Run snapshot、Result 不变；答复、评价、外部批准和审计各自追加。\n- 外部写入必须 propose → 批准/适用预授权 → 执行 → 回读，不把 Agent 建议变成权限。"}, {"title": "组织、项目与资源", "level": "h2", "anchor": "组织项目与资源", "text": "## 组织、项目与资源\n\n| 对象 | 责任与实际边界 |\n| --- | --- |\n| Organization | 组织隔离；当前仅单组织部署，不等于多租户登录已实现 |\n| User / AuthSession | ADMIN/USER、ACTIVE/DISABLED；浏览器会话保存 hash、期限、撤销、凭据版及登录角色，不是 AgentSession |\n| UserSecurityEvent | 账户安全操作追加记录，不是登录尝试日志或 RunEvent |\n| Project / ProjectMember | 项目资源边界与 ACTIVE/REMOVED 成员关系；不增加 Project ADMIN 角色 |\n| ProjectMemberEvent | 成员加入/移除的前后关系与原 actor/request 关联，和关系变更同事务保存；不回填虚构历史 |\n| Integration | 项目中的版本化 Provider 资源与 scope；内置文档不要求 Integration 行 |\n| SecretReference | 定位凭据；MANAGED 材料独立加密保存，原值不进入 Run |\n| ProjectDocument | ProjectKnowledge 的实际载体：元数据与 blob；自动同步/独立知识索引不是现有服务 |\n\n[项目生命周期](project-lifecycle.md)负责成员、偏好、归档与删除；归档不停止 Run，移除成员不撤销账户全部会话。ADMIN 的本组织访问不依赖 ProjectMember；[用户管理](user-lifecycle.md)和[会话 v2](authentication.md#会话凭据-v2-与切换要求)分别负责账户变更与凭据。\n\nSkillSource、Interpretation、SkillVersion、Manifest 归 Organization。同一版本可在多个 Project 使用，但每个 Project 必须显式启用精确 PUBLISHED 版本；新发布不自动启用或升级。资源就绪度按项目独立计算，启用关系不授予资源/Tool 权限。"}, {"title": "Skill 导入、解释与发布", "level": "h2", "anchor": "skill-导入解释与发布", "text": "## Skill 导入、解释与发布\n\n| 对象 | 责任 |\n| --- | --- |\n| SkillSource | 不可变来源目录、附件、metadata、hash 与文件索引 |\n| SkillInterpretation | 一次追加式解释；重新调整保留 parent lineage |\n| CapabilityBlueprint | 能力、目标、资源、规则、交付物、交互/效果意图及来源依据 |\n| ResourceRequirement / OutcomeDefinition | 抽象资源条件与交付/证据要求，不绑定 Project Secret |\n| Skill / SkillVersion | 稳定业务身份 / 冻结内容的精确版本；生命周期状态与内容分开 |\n| RuntimeManifest | 版本化运行投影，冻结蓝图、Tool/Task 与可选业务 Schema |\n| SkillComposition / ProjectComposition | 精确版本的展示组合及项目启用；不是新系统角色或自动编排器 |\n| ProjectSkillVersion | Project 对精确 PUBLISHED 版本的启停记录；当前停用关系不能重新启用 |\n\n领域 capability 可是新概念，真实 Tool 调用才要求平台注册的 versioned capability。合法蓝图与发布门禁不能因 GUIDANCE_ONLY 或缺资源而省略。\n\n发布、项目启用、readiness 是不同判断：同版在 A 项目可运行，在 B 项目缺资源；ACTIONABLE 不等于具体变更已批准。详见[Skill 契约](skill-contract.md#发布与就绪的判断顺序)与[解释实现](skill-interpretation.md)。"}, {"title": "任务、Run 与会话", "level": "h2", "anchor": "任务run-与会话", "text": "## 任务、Run 与会话"}, {"title": "任务定义", "level": "h3", "anchor": "任务定义", "text": "### 任务定义\n\nExecutableTask 从精确已发布蓝图投影，无独立 task 业务表，task_id 由服务端生成。ResourceBinding 将抽象要求绑定 Integration、文档或用户输入；Project/Task 配置在创建时冻结为 Run 资源。\n\nAgentTaskBriefSnapshot 按 Segment 冻结目标、原 Skill、规则、资源、权限与交付要求。TaskSchedule 保存精确版本、输入及选择规则；每次 ONCE/CRON 触发再经普通创建服务生成 Run，必带 IANA timezone，见[调度](task-scheduling.md)。"}, {"title": "执行对象", "level": "h3", "anchor": "执行对象", "text": "### 执行对象\n\n```text\nRun：固定目标、版本、权限与资源\n├── Segment 1：初始工作\n│   ├── Attempt 1：Worker 领取\n│   └── Attempt 2：同段技术恢复\n├── Segment 2：业务答复/效果处理后续行\n├── RunInputSnapshot：整个 Run 的准备回执\n├── 主 AgentSession：顺序 resume/fork/replace\n│   └── SUBAGENT / BRANCH：受限只读并行\n└── Result、Evidence、Artifact、Interaction、Proposal 与审计\n```\n\nBrief 按 Segment 冻结，输入准备回执按 Run 复用，lease 按 Attempt 校验；不是同一种 checksum 对象。RunInputSnapshot 已有模型与部分接线，完整恢复仍见[资源快照](resource-snapshots.md)。RunBudgetAccount/Reservation/Receipt 有内部载体，但尚未接入主/子执行，不从实体存在推断共享预算已生效。\n\nRunStep 是 STEP_* 事件的投影，不是独立持久表。RunEvent 是追加式审计/SSE 来源；TEXT_DELTA 可消耗 sequence 却不持久化，欠号不自动说明丢事件。"}, {"title": "用户交互与外部效果", "level": "h3", "anchor": "用户交互与外部效果", "text": "### 用户交互与外部效果\n\n- UserInteraction/InteractionResponse：问题、期限、版本与原答复身份；CLARIFICATION/CHOICE/REVIEW 走[普通答复](user-interactions.md)，EFFECT_APPROVAL 必须关联 Proposal。\n- ChangeProposal/Approval/EffectExecution：精确变更、决定和真实执行/回读事实；APPROVED 不证明 APPLIED 或模型已续行。\n- Result：最多一个终态原始结果，可含通用 Outcome；失败/取消可没有 Result，SUCCEEDED 不证明业务完整。\n- Evidence/Artifact：证据及产物引用；引用格式、可访问对象和实际内容验证不能合并。\n- Evaluation：人工评分和修订建议；多条建议均相对同一原值，不顺次覆盖 Result，见[结果设计](results-evaluation.md)。"}, {"title": "核心字段与实际载体", "level": "h2", "anchor": "核心字段与实际载体", "text": "## 核心字段与实际载体\n\n完整列见 [db/models.py](../../PJM/backend/src/projectmind/db/models.py)，公开数据需同时核对 [Schema](../../PJM/contracts/)、route 和 [OpenAPI](../../PJM/contracts/openapi/projectmind-api.v1.json)。概念不等于同名表，快照存在不证明与工作副本同步。\n\n| 领域 | 持久化入口与限制 |\n| --- | --- |\n| 账户 | users / auth_sessions / user_security_events；账户 row_version 不覆盖偏好/登录时间，审计唯一键不等于 DB 禁止任意修改 |\n| Skill | skill_sources / skill_interpretations / skills / skill_versions / runtime_manifests；Blueprint 内嵌于解释与 Manifest |\n| 项目资源 | projects / project_members / project_member_events / integrations / resource_bindings / project_documents；Project row_version 只覆盖 metadata/归档，成员审计阻止整项目删除，字节与 DB 分别提交 |\n| 凭据 | secret_references / managed_secret_material；引用 key_version 与密文 kek_version 不是同层版本 |\n| 任务配置 | project_skill_versions、组合表、task_schedules；当前启停单行记录不代表完整历次审计，旧成员关系也不补造事件 |\n| 执行 | runs / run_skill_snapshots / run_segments / run_attempts / agent_task_brief_snapshots |\n| Session | agent_sessions / agent_session_transcripts / agent_session_entries；transcript 追加镜像，不替代业务事实 |\n| 输入与预算 | run_input_snapshots（0029）；run_budget_accounts/reservations/receipts（0030），有载体不等于消费者全部接齐 |\n| 交互/效果 | user_interactions / interaction_responses / change_proposals / change_approvals / effect_executions |\n| 结果/事件 | run_results / evaluations / evidence / run_events / outbox_messages；Artifact 不假设独立表 |\n\nfrontend_module_versions（0026）属于[生成展示](generated-modules.md)，不是 SkillComposition；构建、发布与 Host 尚未接通，不能混用版本回退。\n\nRun 创建意图保存在 task_snapshot_json.creation_request；其身份与 runtime snapshot 不同。兼容 hash 与事务规则见[Run 创建](run-creation.md)，不改写旧快照补造请求。"}, {"title": "权限模型", "level": "h2", "anchor": "权限模型", "text": "## 权限模型\n\n| 操作 | ADMIN | USER |\n| --- | --- | --- |\n| 管理组织用户、项目成员、Integration、Secret | 本组织允许 | 禁止 |\n| 本人账户、安全历史、改密、撤销本人会话 | 本人范围 | 本人范围 |\n| 导入/解释/发布/废弃 Skill，项目启停版本 | 本组织允许 | 禁止 |\n| 执行任务、读 Run/结果、追加评价 | 仍受项目与业务硬约束 | 活动成员及对应业务条件 |\n| 普通答复 | Project 写权限及交互版本/期限 | 同左 |\n| 外部批准 | system ADMIN | 当前有 Project 写权限的 Run 发起人 |\n| 低风险预授权 | 精确 scope；repository.write 除外 | 禁止 |\n| 删除审计 | 禁止；仅独立保留策略清理 | 禁止 |\n\n判定顺序：平台硬拒绝 → 当前身份/成员 → Project 策略/Integration scope → Skill/Task 要求 → Run 冻结上限 → 参数级 Tool 校验 → 精确批准/适用预授权。后一层不能覆盖前面的拒绝，用户文本和模型建议不扩权。"}, {"title": "状态与不变量", "level": "h2", "anchor": "状态与不变量", "text": "## 状态与不变量"}, {"title": "状态流转", "level": "h3", "anchor": "状态流转", "text": "### 状态流转\n\nSkillInterpretation 为 ANALYZING → PREVIEW_READY → SUPERSEDED，失败为 FAILED；SkillVersion 为 DRAFT → PUBLISHED → DEPRECATED，废弃不可复活。readiness 的 GUIDANCE_ONLY/CONFIGURATION_REQUIRED/RUNNABLE/ACTIONABLE 不替代发布状态。\n\nProposal 从 DRAFT/PENDING_APPROVAL 到 APPROVED/APPLYING/APPLIED，也可 REJECTED/STALE/FAILED；EffectExecution 有独立 REQUESTED/LEASED/APPLYING/APPLIED 与失败/重试路径，见[受控写入](repository-effects.md)。"}, {"title": "Run 状态速查", "level": "h3", "anchor": "run-状态速查", "text": "### Run 状态速查\n\n| 事件 | 常见 Run 路径与执行变化 |\n| --- | --- |\n| 首次启动 | QUEUED → PREPARING → RUNNING；初始 Segment，claim 创建 LEASED Attempt |\n| 等待用户/批准 | WAITING_FOR_INPUT/WAITING_FOR_APPROVAL；Segment WAITING，Attempt DEFERRED，释放 lease |\n| 有效答复/独立期限处理 | 追加 Segment，重新 QUEUED；原答复和批准不覆盖 |\n| lease 失效可恢复 | RETRY_PENDING → PREPARING；原 Attempt LEASE_EXPIRED，同段追加 Attempt |\n| 结束 | SUCCEEDED/FAILED/CANCELLED；terminal RUN_SNAPSHOT，终态不重新打开 |\n\n允许转换与 enum 以 [runs/domain.py](../../PJM/backend/src/projectmind/runs/domain.py)为准；WAITING_PERMISSION 仅旧协议兼容。RUNNING 可能先于资源物化，不代表输入 READY 或 Session 已启动。取消受理、终态、进程退出和用量结清分别举证。"}, {"title": "执行不变量", "level": "h3", "anchor": "执行不变量", "text": "### 执行不变量\n\n- 等待释放 lease，不计 engine wall timeout；普通交互期限独立，过期以 INTERACTION_TIMEOUT 新段携带缺失事实，不代答推荐项。批准过期不执行 Provider。\n- 普通答复/效果处理追加 Segment；可恢复 lease 失效追加同段 Attempt。engine wall timeout 按 FAILED，不能泛化为可重试。\n- aggregate 锁顺序固定 Run → Segment → Attempt 或 Proposal/Interaction/Effect；不先锁子对象。\n- terminal RUN_SNAPSHOT 是最后持久事件；PostgreSQL 为正本，状态与 Outbox 同事务，消费幂等。\n- 改目标、项目、精确版本、权限上限或已用资源须新 Run；Session 变化不改变冻结边界。\n- 预算需跨主/子/续行共享；[内部账本](run-budgets.md)和局部限制均不证明此目标已落实。\n- 外部执行重验版本、binding、scope、前置条件与批准，Provider 必须有可验证并发/幂等和 read-back。\n- Result 保持原值，Evaluation 只追加。"}, {"title": "实施兼容说明", "level": "h2", "anchor": "实施兼容说明", "text": "## 实施兼容说明\n\n新 Run 显式创建 Segment 1 和 immutable binding；旧 Run 按隐式 Segment 只读投影，不回填虚构事实。旧版本、Run 和业务结果继续只读审计，不恢复业务专用 Schema/seed/renderer 为通用规则来源。\n\n模型、migration、repository、公开契约与 Web 必须一起核对；真实锁竞争、事务回滚、历史重放、引用删除保护及跨 Project 拒绝分别验收，不由 DTO 或测试文件存在推断完成。"}], "toc": [{"title": "建模原则", "anchor": "建模原则", "level": "h2"}, {"title": "组织、项目与资源", "anchor": "组织项目与资源", "level": "h2"}, {"title": "Skill 导入、解释与发布", "anchor": "skill-导入解释与发布", "level": "h2"}, {"title": "任务、Run 与会话", "anchor": "任务run-与会话", "level": "h2"}, {"title": "任务定义", "anchor": "任务定义", "level": "h3"}, {"title": "执行对象", "anchor": "执行对象", "level": "h3"}, {"title": "用户交互与外部效果", "anchor": "用户交互与外部效果", "level": "h3"}, {"title": "核心字段与实际载体", "anchor": "核心字段与实际载体", "level": "h2"}, {"title": "权限模型", "anchor": "权限模型", "level": "h2"}, {"title": "状态与不变量", "anchor": "状态与不变量", "level": "h2"}, {"title": "状态流转", "anchor": "状态流转", "level": "h3"}, {"title": "Run 状态速查", "anchor": "run-状态速查", "level": "h3"}, {"title": "执行不变量", "anchor": "执行不变量", "level": "h3"}, {"title": "实施兼容说明", "anchor": "实施兼容说明", "level": "h2"}], "source": "design/domain-model.md", "checksum": "f3f3878b15096eae651433ee04fc4cb08fdf281b0e5064d5b0e8d1f8320122ba"}, {"id": "docs/design/project-lifecycle.md", "title": "项目、成员与归档边界", "group": "design", "html": "\u003ch1 id=\"项目成员与归档边界\">项目、成员与归档边界\u003c/h1>\n\u003cp>本页负责项目身份、成员、选择、归档与删除；账户、Run 停止、资产清理分别见\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>、\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a>、\u003ca href=\"#docs/design/document-lifecycle.md::\">文档资产\u003c/a>。现有缺口见\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子归档不是停止或删除\">一个例子：归档不是停止或删除\u003c/h2>\n\u003cp>项目 P 归档后不再出现在默认活动列表，新建 Run/回答/批准被拒绝；授权历史仍可读，已有 Run、成员、Schedule、附件不会一起停止或删除。恢复复用原 ID/key/配置，但不恢复已移除成员、不自动恢复 ERROR Schedule 或补跑错过触发。\u003c/p>\n\u003cp>停止执行、移除成员、归档、物理删除分别操作；归档成功不是进程已停止的证明。\u003c/p>\n\u003ch2 id=\"项目身份与成员资格\">项目身份与成员资格\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Project\u003c/td>\n\u003ctd>organization_id 隔离，project_id 是身份；组织内 key 唯一，归档仍占 key\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectMember\u003c/td>\n\u003ctd>ACTIVE/REMOVED 关系，无 Project ADMIN/OWNER 角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User\u003c/td>\n\u003ctd>组织账户 ACTIVE/DISABLED、ADMIN/USER；建账户不自动入项目\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectSkillVersion\u003c/td>\n\u003ctd>精确版本启用，不授予成员或系统权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>本组织 ADMIN 不依赖 membership，移除其成员关系不会撤销 ADMIN 权限；跨组织仍拒绝。USER 后续请求重验账户/会话及 ACTIVE 关系，不改写旧 Run actor/权限/结果，也不承诺已有 SSE 立即结束。\u003c/p>\n\u003ch3 id=\"成员管理的现状与目标\">成员管理的现状与目标\u003c/h3>\n\u003cp>ADMIN API 可列出/添加同组织 ACTIVE 用户/移除成员；列表含两种关系状态，无分页和独立用户状态，不把 membership ACTIVE 显示成账户已启用。响应使用公开字段白名单与 no-store。\u003c/p>\n\u003cp>重新添加 REMOVED 复用行并刷新 joined_at；重复添加 ACTIVE 返回原行，不追加事件；重复移除为 404。移除账户已停用用户的关系仍允许，不改变账户本身。\u003c/p>\n\u003cp>成员写入复用\u003ca href=\"#docs/design/user-lifecycle.md::%E4%BA%8B%E5%8A%A1%E4%B8%8E%E5%B9%B6%E5%8F%91\">用户事务\u003c/a>的 Organization → User（actor/target 去重排序）→ 原 AuthSession，再锁 Project → ProjectMember。锁后与 flush 后以新时刻复查原会话、ADMIN 和 CSRF；目标账户在持锁状态下检查 ACTIVE，锁保持到提交。偏好写入和项目删除也先取同一 Organization gate，避免 User → Project 引用与 Project → User 清理形成反向锁环。这不是全站授权或真实并发验收的证明。\u003c/p>\n\u003cp>关系变化与 project_member_events 一起提交或回滚：保存组织/项目/关系/目标/actor ID、ADDED/REMOVED、前后 status/joined_at、服务器生成 request UUID 与时间，不记录密码或任意正文。0033 只记录新操作，不由现有关系补造旧历史；有任何事件即拒绝降级丢表。request UUID 不是幂等键，当前没有成员审计查询 API，当前关系与原操作结果须区分。\u003c/p>\n\u003ch3 id=\"成员管理页面\">成员管理页面\u003c/h3>\n\u003cp>项目管理的成员页签仅向 ADMIN 提供；以精确已授权项目为边界，归档项目可读/移除但不可添加。候选复用组织账户的服务端搜索和分页，显示账户角色/状态，停用账户不可添加，不过滤第一页冒充全量。成员列表单独标明关系状态与 ADMIN 权限例外。\u003c/p>\n\u003cp>添加、重新添加和移除先确认原项目/用户，每次只允许一个写请求。超时、中断、断连或成功响应损坏均为结果未知，不自动重放，也不把当前关系符合目标解释为原请求成功。用户显式重读原成员列表与精确账户、两项均成功后才能人工解除新写门禁；解除不执行原动作。切换页签或同项目资格刷新保留未知状态，重新确认资格期间暂停交互并中断在途写为未知；换 actor/项目或离页不迁移旧请求，页面不承诺跨刷新恢复。\u003c/p>\n\u003ch2 id=\"项目选择与失效链接\">项目选择与失效链接\u003c/h2>\n\u003cp>preference 只是上次选择，不是授权。服务端只返回当前可访问的 ACTIVE preference，否则 null，不保证立即清掉旧引用；删项目才显式清理。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>进入方式\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>URL 无项目\u003c/td>\n\u003ctd>可选有效 preference、活动首项；无项目时保留平台入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>URL 明确无效/无权项目\u003c/td>\n\u003ctd>保留目标、统一不可访问，不静默换项目或暴露原因差异\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主动切换或当前资格失效\u003c/td>\n\u003ctd>确认/隔离旧草稿，阻止新提交，丢弃旧响应；不迁移未知写请求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../PJM/web/src/App.tsx\">App\u003c/a>通过 \u003ca href=\"../PJM/web/src/hooks/useProjectContext.ts\">useProjectContext\u003c/a>分开读取活动列表、偏好与精确项目详情。空值、重复参数及非法 UUID 不是“未指定”；授权与不存在统一提示，不展示服务器内部原因。首次无参数可以选有效偏好或活动首项，一旦目标确定，列表变化、归档或重新读取都不把它换成别的项目。\u003c/p>\n\u003cp>进入另一个页面、切换目标或重新读取时，详情未确认前不挂载项目业务页面；平台入口保留。每次读取有独立身份与等待上限，返回曾访问过的 ID 也不能复用旧授权结果。主动切换清除旧 Run/Task 参数并隔离原页面；未知写入不自动迁移或重放。只有已确认 ACTIVE 的项目保存为偏好。\u003c/p>\n\u003cp>详情成功不代表列表也成功：列表失败仍提示并可重新读取，授权归档详情仍可显示。偏好失败不丢掉成功列表。上述检查不替代每次业务请求的服务器授权，也不承诺权限变化会即时推送到已打开页面。\u003c/p>\n\u003ch2 id=\"归档的实际边界\">归档的实际边界\u003c/h2>\n\u003cp>归档/恢复改变项目状态及版本/更新时间，保留配置；同版同状态操作不增版或刷新时间，不调用 Run/Schedule/Integration/Session 停止服务。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>入口\u003c/th>\n\u003cth>当前行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>列表/preference\u003c/td>\n\u003ctd>默认只 ACTIVE；include_archived 可读授权归档项目\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Project/Run 历史\u003c/td>\n\u003ctd>保留当前授权读取；Web 活动选择器不是完整审计入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectWriteActor\u003c/td>\n\u003ctd>409 project_archived，覆盖创建、回答、评价、批准与 Schedule 修改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 取消\u003c/td>\n\u003ctd>WriteActor + Run 项目访问，无 ACTIVE 门槛；取消受理不证明进程停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMIN 维护\u003c/td>\n\u003ctd>编辑、归档/恢复、删除、移除成员走独立用例；新增成员要求 ACTIVE，否则 404\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schedule 触发\u003c/td>\n\u003ctd>重新检查创建者/活动项目，但不与归档或 Run 创建同事务，不等于立即 PAUSED\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"并发修改不能只看有无行锁\">并发修改不能只看有无行锁\u003c/h3>\n\u003cp>项目管理采用以下统一版本协议；DB、API、Web 必须成套切换，接线与验收状态见计划 R05。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>row_version\u003c/code> 从 1 开始，范围 1–2147483647；只覆盖项目 metadata 与归档状态，不随成员、偏好、Run 或资源变化。它不是审计或全部引用的版本。\u003c/li>\n\u003cli>PATCH 必带原 \u003ccode>expected_row_version\u003c/code> 和至少一个非 null 的可修改字段；归档/恢复 POST 正文必带原版本，DELETE 用必填同名 query。缺版本或非法输入返回 422，不兼容为“使用当前版本”。\u003c/li>\n\u003cli>本组织 ADMIN 的创建、修改、归档、恢复、删除在业务事务复核原会话与 CSRF；复用 Organization → User → 原 AuthSession → Project 顺序，所有锁后与 flush 后用新时间复核，锁保持到提交。\u003c/li>\n\u003cli>先比较版本再判 no-op 或删除前置。旧版本即使目标值相同也返回 409 \u003ccode>project_version_conflict\u003c/code>；同版无变化不改版本/时间，有变化只增一次。达到上限后有变化返回 409 \u003ccode>project_version_exhausted\u003c/code>，不回绕。\u003c/li>\n\u003cli>公开详情/列表均必带版本并使用 no-store。创建 key 冲突不是幂等成功；删除成功仍为 204，无权/不存在仍统一 404。版本通过不免除原来的归档、Run、Schedule、成员审计保护。\u003c/li>\n\u003c/ul>\n\u003cp>页面保留原项目 ID/key/版本及非敏感草稿，提交同步防重。冲突后精确重读原 ID，显示原值、草稿与当前值，人工采用当前版本后仍须另行提交；不自动改版重放。未知结果先核对：既有项目精确重读，创建读取包含归档的完整列表并按原 key 比较。404 或列表无匹配只说明当前不可读/未发现，不证明原请求回滚；当前值符合目标也不证明由原请求造成。\u003c/p>\n\u003cp>核对读取成功（既有目标的明确 \u003ccode>project_not_found\u003c/code> 404 也只作不可访问事实）后，用户可人工解除新写门禁；解除不重发、删除未知不按同 key 重建。切换页签或刷新列表不消除未知，换 actor/项目或离页丢弃旧响应，不迁移原动作；不承诺跨刷新恢复。无项目参数时，首次默认选择读取完成不是人工切换，不清空已填写的创建草稿、确认或未知状态；显式选择和后续目标切换仍隔离原请求。元数据与归档独立审计尚未定义完整载体，不伪造旧历史或削弱已有审计删除保护。\u003c/p>\n\u003cp>0034 给旧项目初始化版本 1，不证明旧修改次数。降级须全实例停写并停止旧页面/在途请求；任何项目版本超过 1 拒绝丢列，避免恢复时悄悄重置已使用的并发版本。新旧 API/Web 不混跑，旧客户端缺版本明确拒绝。\u003c/p>\n\u003ch2 id=\"删除与数据保留\">删除与数据保留\u003c/h2>\n\u003cp>当前 ADMIN 按上述业务事务锁定原会话与 Project，先验原版本，再要求 ARCHIVED 且无 Run/TaskSchedule/成员审计；清理 preference 与列举配置后删除项目，成功 204。拒绝发生在任何关系删除之前：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阻止条件\u003c/th>\n\u003cth>Problem code\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>未归档\u003c/td>\n\u003ctd>project_delete_requires_archive\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>存在 Run\u003c/td>\n\u003ctd>project_delete_blocked_by_runs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>存在任意状态/发火/认领阶段的 Schedule\u003c/td>\n\u003ctd>project_delete_blocked_by_schedules\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>存在成员变更审计\u003c/td>\n\u003ctd>project_delete_blocked_by_member_audit\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>不为释放 key 删除审计或放宽 FK RESTRICT；这些前置不是完整可删证明，也不是回收站。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>已知缺口\u003c/th>\n\u003cth>风险\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>现有 Run/Schedule 检查不是完整引用证明\u003c/td>\n\u003ctd>冻结输入、在途认领与并发新增仍须按统一提交协议验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删 ProjectDocument 行不清 blob\u003c/td>\n\u003ctd>204 不证明附件、Run 副本或备份清除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>retention_days 仅配置\u003c/td>\n\u003ctd>不保证自动清理、恢复或保留期定时器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>引用检查与新增引用不同协议\u003c/td>\n\u003ctd>归档/认领/创建/删除竞争尚需真实事务验证\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"删除门禁的修正要求\">删除门禁的修正要求\u003c/h3>\n\u003cp>默认保留归档项目；物理删除只用于证明无执行/审计及在途引用的空项目。\u003c/p>\n\u003col>\n\u003cli>纳入所有 Run/Schedule（含暂停/归档/未触发）、冻结输入和在途认领；有引用明确冲突，不静默删规则/审计释放 key。\u003c/li>\n\u003cli>所有新增引用、旧 Worker/恢复共用锁或条件提交，阻止检查后新增；关系删除同事务回滚，不拆 FK/宽泛 CASCADE。\u003c/li>\n\u003cli>字节清理使用\u003ca href=\"#docs/design/document-lifecycle.md::%E5%88%A0%E9%99%A4%E4%B8%8E%E5%8E%86%E5%8F%B2%E5%BC%95%E7%94%A8\">资产协议\u003c/a>，精确身份、回执、失败重试独立于 DB；同步整项目与单文件路径。\u003c/li>\n\u003cli>冲突同步 Problem/OpenAPI/client/三语，不把任意 DB 错误归为仍有 Run。未知先核对，不自动重删或建同 key 项目。\u003c/li>\n\u003c/ol>\n\u003cp>恢复归档与\u003ca href=\"#docs/operations/backup-recovery.md::\">备份恢复\u003c/a>不同；修改 retention_days 不等于授权清理。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>入口：\u003ca href=\"../PJM/backend/src/projectmind/projects\">项目实现\u003c/a>、\u003ca href=\"../PJM/web/src/pages/ProjectsPage.tsx\">ProjectsPage\u003c/a>、\u003ca href=\"#PJM/README.md::contracts\">契约\u003c/a>。项目 CRUD 共用版本/请求边界，成员页复用账户查询；module 配置仍是独立领域，不由 CRUD 回归证明完整交付。真实事务、独立项目审计、完整引用保护与字节清理继续接续。\u003c/p>\n\u003cul>\n\u003cli>失效成员、ADMIN membership、跨组织分别授权，旧 Run 身份不变。\u003c/li>\n
