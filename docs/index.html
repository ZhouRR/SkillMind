le\u003c/td>\n\u003ctd>在“定时安排”清筛选/翻页；失效 task/归档仍可读，不重建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>冲突/保存未知\u003c/td>\n\u003ctd>保留草稿/原请求，独立读取并人工比较采用版本；GET 不证明原提交，不自动重发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧状态按钮返回 422\u003c/td>\n\u003ctd>新协议要求 expected_row_version；刷新 Web，不让 API 自动补当前版\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>历史 Schedule 不能恢复\u003c/td>\n\u003ctd>protocol=0 须独立历史核对/迁移，工具仍待实现；不改 protocol、清计数或归档重建\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>保留 ID、带 offset 的 occurrence、原键/日志，核规则与浏览器时区；摘要不足保持未知。Run/Effect lease 与交互/批准超期分别观察，Effect 未知先对账，见\u003ca href=\"#docs/design/task-scheduling.md::\">调度\u003c/a>。\u003c/p>\n\u003ch2 id=\"repository-与-cas-接入\">Repository 与 CAS 接入\u003c/h2>\n\u003cp>按 \u003ca href=\"../SKM/backend/src/skillmind/agent/repository_source.py\">repository source\u003c/a>核验：Git 支持 http/https/file，SVN 另支持 svn，禁 SSH/URI 密码；Secret 首冒号分 username:secret，无冒号用 x-access-token。Git 凭据经环境、SVN 经 stdin，不入 argv；image 需 git/subversion，超时用 SKILLMIND_REPOSITORY_COMMAND_TIMEOUT_SECONDS。\u003c/p>\n\u003cp>paths 是硬范围，记录实际 commit/revision；普通不可读可 skipped，冻结来源/hash 不符必须失败，原 stderr 不进 Agent/Evidence。\u003c/p>\n\u003cp>Redmine 须 CAS adapter 声明 issue.update/v1、atomic_precondition=revision、idempotency=key，经 well-known 校验与 pre-read/apply/read-back，不回退普通更新；配置/Secret 变化不改原 binding。\u003c/p>\n\u003cp>repository.write/v1 始终人工批准：默认 direct、Git fast-forward/不 force、具体 default branch；branch 用 skillmind/。同名同内容不证明原执行；SVN 未固定批准基线，仍可能包含变化 revision。\u003c/p>\n\u003cp>PR/MR 仅 Git branch 且完整 forge_kind/forge_api_base_url/forge_project；全无则只保留 branch/commit，部分配置拒绝。PR 失败不撤销 commit；target_stale 重新观察/提案，见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。\u003c/p>\n\u003ch2 id=\"incident-与-recovery\">Incident 与 recovery\u003c/h2>\n\u003cp>保留 ID、Provider/capability 版、Proposal checksum、请求指纹/键 hash；批准、远端写入、read-back、PR、本地 finalize 分阶段核对，不合成 FAILED。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原执行的外部事实\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>已应用且回读一致\u003c/td>\n\u003ctd>沿原身份确认既有结果，不再写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>明确未应用\u003c/td>\n\u003ctd>仍复查批准/scope/期限/revision，只走原受控恢复路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未知或部分成功\u003c/td>\n\u003ctd>保持隔离对账，不换键、强推、改 SQL 或盲目重试\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>重试可能重跑整个 Provider，无“只补 PR”/通用补账 CLI。lease 到期不证明旧请求停止，恢复 DB 不证明远端未写；不靠重启 Worker 促恢复。人工修正须 incident 及适用 Evaluation，不覆盖原 Effect/Result。\u003c/p>\n\u003ch2 id=\"managed-secret-の-kek-運用\">MANAGED Secret の KEK 運用\u003c/h2>\n\u003cp>MANAGED 直接用主密钥 AES-256-GCM，非两层信封。keyring 为逗号分隔 version:base64key（32 字节），首项加密、其余解旧密文，经 Secret 管理注入；DB 备份补不了丢失 KEK。\u003c/p>\n\u003cp>按\u003ca href=\"#docs/design/secret-storage.md::%E5%88%87%E6%8D%A2%E4%B8%8E%E6%81%A2%E5%A4%8D%E7%9A%84%E9%A1%BA%E5%BA%8F\">切换/恢复\u003c/a>核备份、维护窗口、全部进程及旧备份解封。API/Worker 启动加载 cipher，改 CLI 环境不更新实例；新标签必须配新 key，不能同标签换 bytes。\u003c/p>\n\u003cp>获批后在目标环境执行 \u003ccode>python -m skillmind.ops.rotate_secrets\u003c/code>，会锁定/改写材料，不改 Run/binding。核退出/数量及必要解封；skipped 不验证解密，全 skipped 不证明成功。无全量只读解密 CLI，不输出明文替验。\u003c/p>\n\u003cp>旧备份所需 KEK 继续独立保管；版本不明/缺 key/认证失败拒绝，不降明文。不能防同时掌控 host/process 与 DB 的攻击者，KMS/HSM 未实现。\u003c/p>\n\u003ch2 id=\"验收与故障注入\">验收与故障注入\u003c/h2>\n\u003ch3 id=\"通常-smoke\">通常 smoke\u003c/h3>\n\u003cp>smoke 调模型、创建 Run/Evaluation、测试取消，会计费/持久写入。须获准专用环境/Project/published task，并满足\u003ca href=\"#docs/operations/deployment.md::%E5%90%AF%E5%8A%A8%E4%B8%8E%E6%94%BE%E8%A1%8C\">Worker 放行\u003c/a>、dispatch/模型凭据；单独 Project 不隔离旧 job/cron。\u003c/p>\n\u003cp>明确设置测试 UUID 为 SMOKE_PROJECT_ID 后执行，未指定会拒绝：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- exec \\\n  -e SKILLMIND_SMOKE_PROJECT_ID=\u0026quot;$SMOKE_PROJECT_ID\u0026quot; \\\n  api python -m skillmind.ops.smoke\n\u003c/code>\u003c/pre>\n\u003cp>密码经 TTY。SKILLMIND_SMOKE_ 前缀的 SKILL_VERSION_ID/TASK_KEY 固定任务，TASK_INPUT_JSON/TASK_SOURCES_JSON 提供输入；正文/凭据不入共享 history。通过仅覆盖认证、创建重放、结果/证据、评价、SSE/取消，不证明全部 Provider/页面/质量。\u003c/p>\n\u003ch3 id=\"worker-喪失と接管\">Worker 喪失と接管\u003c/h3>\n\u003cp>仅可停机专用环境，分别选准备中/模型执行中 Run，保留原 ID、快照/lease；RUNNING 不证明模型已启动。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">LEASE_SECONDS=\u0026quot;$(python3 scripts/compose.py -- exec -T api python -c \\\n  'from skillmind.core.settings import get_settings; print(get_settings().run_lease_seconds)')\u0026quot;\npython3 scripts/compose.py -- stop worker\n\u003c/code>\u003c/pre>\n\u003cp>确认 LEASE_SECONDS 为有效秒数，加 recovery cron 观察窗口后再启动；20 秒余量不保证恢复完成：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">sleep \u0026quot;$((LEASE_SECONDS + 20))\u0026quot;\npython3 scripts/compose.py -- start worker\npython3 scripts/compose.py -- logs --no-log-prefix --tail=200 worker\n\u003c/code>\u003c/pre>\n\u003cp>观察实际 tick：旧 Attempt 为 LEASE_EXPIRED，经 RETRY_PENDING 在原 Segment 追加 Attempt，快照不变；超限 retry_exhausted。新 Attempt 不补签旧 PREPARING。部署版本/真实持久恢复分别验，mock 或仅模型阶段成功不能替代。\u003c/p>\n\u003ch2 id=\"log-確認と-incident-記録\">Log 確認と incident 記録\u003c/h2>\n\u003cp>受控终端按服务器 request/trace 或 Run/Attempt ID 查日志并关联 Session/Effect；客户端 X-Request-ID 非服务器审计值，request ID 非重放键。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- logs --no-log-prefix api worker \\\n  | jq -c 'select(.run_id == \u0026quot;\u0026lt;RUN_ID\u0026gt;\u0026quot; or .trace_id == \u0026quot;\u0026lt;TRACE_ID\u0026gt;\u0026quot;)'\n\u003c/code>\u003c/pre>\n\u003cp>原日志可能敏感，只转录\u003ca href=\"#docs/operations/runbook.md::%E8%BF%90%E7%94%A8%E5%8E%9F%E5%88%99\">运用原则\u003c/a>的脱敏事实，不附 Tool 正文/Evidence/配置。\u003c/p>\n", "sections": [{"title": "Skillmind 运维与故障排查", "level": "h1", "anchor": "skillmind-运维与故障排查", "text": "# Skillmind 运维与故障排查\n\n按症状分诊；起动、发布、恢复分别见[Quickstart](quickstart.md)、[发布](deployment.md)、[恢复](backup-recovery.md)。缺口见[计划](../planning/roadmap.md)，设计不代表已有修复 CLI。"}, {"title": "按问题找入口", "level": "h2", "anchor": "按问题找入口", "text": "## 按问题找入口\n\n| 症状 | 入口 |\n| --- | --- |\n| 登录、CSRF、权限异常 | [认证](#认证故障的只读分诊) / [登录防护](#登录防护的排查与恢复) |\n| 项目消失、归档或删除异常 | [项目](#项目与归档的只读分诊) |\n| 上传部分成功、列表与附件不一致 | [文档保存与删除](#文档保存与删除的只读分诊) |\n| Run 无会话、准备超时、不断接管 | [准备](#准备故障的只读分诊) / [冻结输入](#资源快照排障) |\n| 等待回答/批准、结果或评价可疑 | [WAITING](#waiting-状态) / [结果](#结果与评价的只读分诊) |\n| 调度漏跑或计数不符 | [Schedule](#schedule-与-recovery-的监视) |\n| 外部写入未知、PR 失败 | [Effect 对账](#incident-与-recovery) |\n| 凭据无法解封或准备轮换 | [KEK](#managed-secret-の-kek-運用) |\n| 验收或 Worker 故障注入 | [smoke](#通常-smoke) / [接管](#worker-喪失と接管) |"}, {"title": "运用原则", "level": "h2", "anchor": "运用原则", "text": "## 运用原则\n\n优先已有响应/脱敏日志/获准只读查询。PostgreSQL 是正本，不改状态、stamp、删审计或换键消错；未知保全原身份，不自动重放。启动/停机/模型/外部写入/恢复须另确认目标、副作用和授权；命令在目标 `SKM/` 经[统一入口](deployment.md#环境文件与配置边界)使用已确认 ENV_FILE/project，不切默认 context 误操作。\n\n对外只留 UTC、image/revision、对象 ID、公开错误码和范围；不附 `.env`、Cookie/CSRF、密码/KEK、内部地址、正文或完整 workspace/HAR。"}, {"title": "认证故障的只读分诊", "level": "h2", "anchor": "认证故障的只读分诊", "text": "## 认证故障的只读分诊\n\n记录原 path（无参数）、status/code/request_id 和版本，只查 header 存在性、cookie 属性和刷新顺序。\n\n| 原响应 | 核对与停止条件 |\n| --- | --- |\n| 401 invalid_credentials | 确认环境，不探测账号存在性或重跑 bootstrap |\n| 400 current_password_rejected | 改密操作拒绝，不是登录失效；保留仍有效 session |\n| 401 authentication_required | 查 cookie、期限、用户/角色/失效及 API 协议；不公开内部原因 |\n| 403 csrf_rejected | 查 Origin scheme/host/port、header 类型和是否换会话；不关闭 CSRF 或放宽 cookie |\n| 403 administrator_required / 404 | 系统 ADMIN 与 ProjectMember 不同；404 也可能隐藏越权，不枚举或换账号探测 |\n| 409 project_archived / 用户冲突 | 按[项目](../design/project-lifecycle.md)或[账户](../design/user-lifecycle.md)规则核对，不擅自恢复项目、换版重发 |\n| 429 / 503 | 转[登录防护](#登录防护的排查与恢复)，不当作密码错误 |\n| 422 | 按契约修正缺失 header/结构/输入，不显示含密码的原值 |\n\nGET 不轮换 v2 CSRF 但可更新 idle，login-context 占配额/建 challenge，均非纯只读探针。旧 API 混跑按[会话切换](deployment.md#会话协议切换检查)处理；重登先保全未确认 ID/key，403 不证明未提交。无通用账户排障 CLI，不用 SQL/bootstrap 代替。"}, {"title": "登录防护的排查与恢复", "level": "h2", "anchor": "登录防护的排查与恢复", "text": "## 登录防护的排查与恢复\n\n429 记录 Retry-After 并停止快速重试，查共享出口/challenge/可信代理；正常登录通常消耗两次来源请求。不连续探测、轮询、换来源或删配额解锁，等待不保证成功。\n\n503 区分 `login_protection_unavailable` 与代理错误，查指定 Redis 的权限、容量/驱逐、TTL/损坏和超时；PING 不证明 EVAL/SET/GETDEL 可用。\n\n修配置/重启/切 Redis/主动登录须获批环境、专用账号和影响评审；不 FLUSHDB/删 key。修复后验来源不可伪造、正常登录、429 等待及 503 拒绝；不据此放行旧会话/Worker/Effect。\n\nWeb 的 1–300 秒只作静态提示；通信失败/离页按[提交未知](../design/login-protection.md#提交离页与结果未知)处理，未跳页不证明登录未成功。"}, {"title": "项目与归档的只读分诊", "level": "h2", "anchor": "项目与归档的只读分诊", "text": "## 项目与归档的只读分诊\n\n核对原 project_id/调用者/服务端状态；失效链接保留原目标，导航选中不代替详情授权。\n\n| 症状 | 核对与停止条件 |\n| --- | --- |\n| 移出成员后仍可访问 | 系统 ADMIN 不依赖 membership，成员移除不是账户降权 |\n| 归档后仍有 Run/Effect | 归档不是取消或全局停写，按原对象停止协议处理 |\n| 无 Run 但 DELETE 失败 | TaskSchedule、成员审计、文档/上传意图/清理记录仍会阻止删除；原版本冲突须核对，不拆外键、删历史或循环 DELETE |\n| 204 后仍有附件/备份 | 只证明所列元数据删除，不证明字节清理；不递归删目录 |\n\n修复边界见[项目生命周期](../design/project-lifecycle.md)。"}, {"title": "文档保存与删除的只读分诊", "level": "h2", "anchor": "文档保存与删除的只读分诊", "text": "## 文档保存与删除的只读分诊\n\n保留原 Project/document ID、upload key、时点/code/版本；无文档 ID 用原 key 查，文件受控保全，正文/storage key 不入报告。\n\n| 症状 | 核对与停止条件 |\n| --- | --- |\n| 同名 409 | 当前目录/PENDING 占用在 PUT 前拒绝；旧 writer/孤立对象另查，不重复上传验证 |\n| 409 document_upload_pending / document_upload_key_conflict | 原 key 待确认 / 绑定另一输入；人工 GET 原 key，不换键重传 |\n| 原 key GET PENDING / 404 | 已预约未确认 / 当前未查到；均不证明旧 POST 不继续，不释放占用 |\n| 原 key GET PUBLISHED，目录无文档 | 原发布成立，元数据可能后来删除；按原 ID 核对，不补建 |\n| 413 document_upload_too_large | 实际文件/multipart 超限，本次未进存储；缩小请求，不伪报 Content-Length |\n| 422 invalid_document_upload | 查单 file、可选 UTF-8 folder、重复字段/参数和完整结束边界 |\n| 422 invalid_document_upload_key | 须单个非 nil UUID header；核对 API/Web 版本，不换键重试未知 |\n| 目录部分完成 | 分开已发布/拒绝/未知/未发送；未知暂停后续，查原回执后人工继续 |\n| DELETE 报错后 ID 消失 | 可能已提交 metadata；404 不恢复清理，不循环删或删同路径新 ID |\n| 删除 409 | document_in_use 为原引用，document_references_unavailable 为历史无法核实；查 Run/调度/occurrence，不删审计、改 hash 或换 ID |\n| 204 后对象仍在 | 不证明旧版本/在途 PUT/全部字节已清理，不清 Project 前缀 |\n| 下载 409 document_content_missing / document_content_invalid | 原 blob 缺失 / 内容不符；按原 ID/hash 与恢复点核对，不改 hash/同名覆盖 |\n| 503 document_storage_unavailable | 查 namespace/归属、存储可达性/权限；上传/删除可能已写，不推导回滚或清理成功 |\n| 503 document_upload_unavailable | 原意图/回执/占用无法核实，保留身份，不删记录补成功 |\n| 删除后配额未减 | 新意图 size 保留，旧占用转清理记录；精确结算未接，不凭 204/对象查无扣减 |\n| 切存储后旧附件不可读 | 旧行不自动绑定，按[归属](../design/document-lifecycle.md#存储归属与配置切换)核原 ID/key/hash，不改摘要/复用 UUID |\n| 预览超限/资源消失 | 实际 byte 超限停读，HTML 仅静态结构；原文件可下载，但打开安全性另判 |\n\n无通用孤立清理/配额修复 CLI；按[文档生命周期](../design/document-lifecycle.md)处理，不同名重传修复冻结输入。"}, {"title": "准备故障的只读分诊", "level": "h2", "anchor": "准备故障的只读分诊", "text": "## 准备故障的只读分诊\n\n只查 Run/Attempt、日志与输入回执，不启动模型/重做物化；回执无公开管理 API。\n\n| 观察 | 核对与停止条件 |\n| --- | --- |\n| RUNNING 但无 Session | 运行态与 prepared event 可在 ContextBuilder 前产生，先查准备错误/回执/Brief |\n| preparation_timeout | 查准备配置、资源耗时和回执提交；模型 wall timeout 不是替代 |\n| context_build_failed | 查脱敏异常、冻结来源、binding 和消费者，不一律归因网络 |\n| 首次世代创建被拒绝 | 旧 .skillmind-inputs、其他 UUID 或 symlink 都可阻止；保留现场，不删除或补 READY |\n| 执行权异常、不断接管 | 查 lease/token 与 Attempt 时间线，旧 Worker 不得强写终态 |\n| 已接受取消但未结束 | 查取消意图/lease/Session；按钮或 CANCELLED 不证明进程退出 |\n| READY 但 Run 失败 | 输入就绪不保证 Brief/模型成功，不删完成回执解锁 |\n\n计时器见[执行限额](../design/run-budgets.md#现有计时器的覆盖范围)。未知保留原世代、输入不可用，不补 READY/换世代；停机试验见[接管](#worker-喪失と接管)。"}, {"title": "资源快照排障", "level": "h2", "anchor": "资源快照排障", "text": "## 资源快照排障\n\n核部署版本、Run sources/manifest、回执世代和实际 revision，不用今日目录/HEAD/同名路径代替。缺 ID/hash 不符/混入文件保留现场，不重传、删缓存或改快照；输入改变建新 Run。\n\n丢响应先确认[原创建请求](../design/run-creation.md)，已有 Run 按[准备中断规则](../design/resource-snapshots.md#准备中断与再次使用)处理；hash/目录完整/迁移成功不授权放行，无补签 CLI。"}, {"title": "WAITING 状态", "level": "h2", "anchor": "waiting-状态", "text": "## WAITING 状态\n\nWAITING_FOR_INPUT/APPROVAL 非终态；查 Interaction/Proposal、Brief/checkpoint、Session/事件。等待释放主 lease，已批准 Effect 可独立执行，不重复批准。答案追加 Segment，技术重试才追加 Attempt。\n\n普通超期追加 INTERACTION_TIMEOUT，不代答；批准超期失效。410 可能已提交续行，先读状态，不换键补答；悬空 EFFECT_APPROVAL 不用普通答复/手写审批修复。\n\nresume 须 transcript/workspace 与 engine/model 兼容；fork 保留 parent/checkpoint，replace 从可信 checkpoint 建会话，均不改冻结版本/权限/资源/预算。仅 PRIMARY 限一个 ACTIVE，不把子会话算重；见[交互](../design/user-interactions.md)、[Runtime](../design/agent-runtime.md)。"}, {"title": "结果与评价的只读分诊", "level": "h2", "anchor": "结果与评价的只读分诊", "text": "## 结果与评价的只读分诊\n\n查授权 detail/历史，保留原 ID/响应，不复制正文。SUCCEEDED 可与 PARTIAL/BLOCKED 并存；模型 APPLIED 不替代平台 read-back，引用计数不证明可读。\n\n评价 pointer 相对 detail.result.data；400 查原值根，409 查 Result，401/403 回认证分诊。无评价非无 Result，同文/时间非原提交证明；未知不自动 POST、删重复或改原值，见[结果评价](../design/results-evaluation.md)。"}, {"title": "Schedule 与 Recovery 的监视", "level": "h2", "anchor": "schedule-与-recovery-的监视", "text": "## Schedule 与 Recovery 的监视\n\ntick 计数、Schedule last_* 与业务结果分开。FAILED_PRECONDITION 回写 ERROR，基础设施异常未必留状态；不补触发或改 DB 计数。\n\n| 异常 | 实际边界 |\n| --- | --- |\n| 迟到/漏跑 | 当前可能执行最早迟到 occurrence，再跳过后续过期时刻；missed_count 单次最多 1000 |\n| last_* 不一致 | 跳过/失败可保留旧 Run ID，不能拼成同一次执行事实 |\n| next_run_at 已进但无 Run | 刷新“在途核对”，查原 occurrence/版本/认领/租约；可能处理、未知或恢复耗尽，不清记录/额度或换键 |\n| 在途为空/租约到期 | 不证明 Run 不存在、已停止或可重发；旧协议/读取失败另列，不补空值 |\n| 编辑/停止同时触发 | 认领提交后沿原配置完成，暂停不撤回在途；旧结算不覆盖新配置/暂停状态 |\n| 同 Task 多 Run | 重叠检查覆盖本 Schedule 的全部关联非终态 Run，不覆盖手动或其他 Schedule |\n| 页面找不到 Schedule | 在“定时安排”清筛选/翻页；失效 task/归档仍可读，不重建 |\n| 冲突/保存未知 | 保留草稿/原请求，独立读取并人工比较采用版本；GET 不证明原提交，不自动重发 |\n| 旧状态按钮返回 422 | 新协议要求 expected_row_version；刷新 Web，不让 API 自动补当前版 |\n| 历史 Schedule 不能恢复 | protocol=0 须独立历史核对/迁移，工具仍待实现；不改 protocol、清计数或归档重建 |\n\n保留 ID、带 offset 的 occurrence、原键/日志，核规则与浏览器时区；摘要不足保持未知。Run/Effect lease 与交互/批准超期分别观察，Effect 未知先对账，见[调度](../design/task-scheduling.md)。"}, {"title": "Repository 与 CAS 接入", "level": "h2", "anchor": "repository-与-cas-接入", "text": "## Repository 与 CAS 接入\n\n按 [repository source](../../SKM/backend/src/skillmind/agent/repository_source.py)核验：Git 支持 http/https/file，SVN 另支持 svn，禁 SSH/URI 密码；Secret 首冒号分 username:secret，无冒号用 x-access-token。Git 凭据经环境、SVN 经 stdin，不入 argv；image 需 git/subversion，超时用 SKILLMIND_REPOSITORY_COMMAND_TIMEOUT_SECONDS。\n\npaths 是硬范围，记录实际 commit/revision；普通不可读可 skipped，冻结来源/hash 不符必须失败，原 stderr 不进 Agent/Evidence。\n\nRedmine 须 CAS adapter 声明 issue.update/v1、atomic_precondition=revision、idempotency=key，经 well-known 校验与 pre-read/apply/read-back，不回退普通更新；配置/Secret 变化不改原 binding。\n\nrepository.write/v1 始终人工批准：默认 direct、Git fast-forward/不 force、具体 default branch；branch 用 skillmind/。同名同内容不证明原执行；SVN 未固定批准基线，仍可能包含变化 revision。\n\nPR/MR 仅 Git branch 且完整 forge_kind/forge_api_base_url/forge_project；全无则只保留 branch/commit，部分配置拒绝。PR 失败不撤销 commit；target_stale 重新观察/提案，见[受控写入](../design/repository-effects.md)。"}, {"title": "Incident 与 recovery", "level": "h2", "anchor": "incident-与-recovery", "text": "## Incident 与 recovery\n\n保留 ID、Provider/capability 版、Proposal checksum、请求指纹/键 hash；批准、远端写入、read-back、PR、本地 finalize 分阶段核对，不合成 FAILED。\n\n| 原执行的外部事实 | 处理 |\n| --- | --- |\n| 已应用且回读一致 | 沿原身份确认既有结果，不再写 |\n| 明确未应用 | 仍复查批准/scope/期限/revision，只走原受控恢复路径 |\n| 未知或部分成功 | 保持隔离对账，不换键、强推、改 SQL 或盲目重试 |\n\n重试可能重跑整个 Provider，无“只补 PR”/通用补账 CLI。lease 到期不证明旧请求停止，恢复 DB 不证明远端未写；不靠重启 Worker 促恢复。人工修正须 incident 及适用 Evaluation，不覆盖原 Effect/Result。"}, {"title": "MANAGED Secret の KEK 運用", "level": "h2", "anchor": "managed-secret-の-kek-運用", "text": "## MANAGED Secret の KEK 運用\n\nMANAGED 直接用主密钥 AES-256-GCM，非两层信封。keyring 为逗号分隔 version:base64key（32 字节），首项加密、其余解旧密文，经 Secret 管理注入；DB 备份补不了丢失 KEK。\n\n按[切换/恢复](../design/secret-storage.md#切换与恢复的顺序)核备份、维护窗口、全部进程及旧备份解封。API/Worker 启动加载 cipher，改 CLI 环境不更新实例；新标签必须配新 key，不能同标签换 bytes。\n\n获批后在目标环境执行 `python -m skillmind.ops.rotate_secrets`，会锁定/改写材料，不改 Run/binding。核退出/数量及必要解封；skipped 不验证解密，全 skipped 不证明成功。无全量只读解密 CLI，不输出明文替验。\n\n旧备份所需 KEK 继续独立保管；版本不明/缺 key/认证失败拒绝，不降明文。不能防同时掌控 host/process 与 DB 的攻击者，KMS/HSM 未实现。"}, {"title": "验收与故障注入", "level": "h2", "anchor": "验收与故障注入", "text": "## 验收与故障注入"}, {"title": "通常 smoke", "level": "h3", "anchor": "通常-smoke", "text": "### 通常 smoke\n\nsmoke 调模型、创建 Run/Evaluation、测试取消，会计费/持久写入。须获准专用环境/Project/published task，并满足[Worker 放行](deployment.md#启动与放行)、dispatch/模型凭据；单独 Project 不隔离旧 job/cron。\n\n明确设置测试 UUID 为 SMOKE_PROJECT_ID 后执行，未指定会拒绝：\n\n```bash\npython3 scripts/compose.py -- exec \\\n  -e SKILLMIND_SMOKE_PROJECT_ID=\"$SMOKE_PROJECT_ID\" \\\n  api python -m skillmind.ops.smoke\n```\n\n密码经 TTY。SKILLMIND_SMOKE_ 前缀的 SKILL_VERSION_ID/TASK_KEY 固定任务，TASK_INPUT_JSON/TASK_SOURCES_JSON 提供输入；正文/凭据不入共享 history。通过仅覆盖认证、创建重放、结果/证据、评价、SSE/取消，不证明全部 Provider/页面/质量。"}, {"title": "Worker 喪失と接管", "level": "h3", "anchor": "worker-喪失と接管", "text": "### Worker 喪失と接管\n\n仅可停机专用环境，分别选准备中/模型执行中 Run，保留原 ID、快照/lease；RUNNING 不证明模型已启动。\n\n```bash\nLEASE_SECONDS=\"$(python3 scripts/compose.py -- exec -T api python -c \\\n  'from skillmind.core.settings import get_settings; print(get_settings().run_lease_seconds)')\"\npython3 scripts/compose.py -- stop worker\n```\n\n确认 LEASE_SECONDS 为有效秒数，加 recovery cron 观察窗口后再启动；20 秒余量不保证恢复完成：\n\n```bash\nsleep \"$((LEASE_SECONDS + 20))\"\npython3 scripts/compose.py -- start worker\npython3 scripts/compose.py -- logs --no-log-prefix --tail=200 worker\n```\n\n观察实际 tick：旧 Attempt 为 LEASE_EXPIRED，经 RETRY_PENDING 在原 Segment 追加 Attempt，快照不变；超限 retry_exhausted。新 Attempt 不补签旧 PREPARING。部署版本/真实持久恢复分别验，mock 或仅模型阶段成功不能替代。"}, {"title": "Log 確認と incident 記録", "level": "h2", "anchor": "log-確認と-incident-記録", "text": "## Log 確認と incident 記録\n\n受控终端按服务器 request/trace 或 Run/Attempt ID 查日志并关联 Session/Effect；客户端 X-Request-ID 非服务器审计值，request ID 非重放键。\n\n```bash\npython3 scripts/compose.py -- logs --no-log-prefix api worker \\\n  | jq -c 'select(.run_id == \"\u003cRUN_ID>\" or .trace_id == \"\u003cTRACE_ID>\")'\n```\n\n原日志可能敏感，只转录[运用原则](#运用原则)的脱敏事实，不附 Tool 正文/Evidence/配置。"}], "toc": [{"title": "按问题找入口", "anchor": "按问题找入口", "level": "h2"}, {"title": "运用原则", "anchor": "运用原则", "level": "h2"}, {"title": "认证故障的只读分诊", "anchor": "认证故障的只读分诊", "level": "h2"}, {"title": "登录防护的排查与恢复", "anchor": "登录防护的排查与恢复", "level": "h2"}, {"title": "项目与归档的只读分诊", "anchor": "项目与归档的只读分诊", "level": "h2"}, {"title": "文档保存与删除的只读分诊", "anchor": "文档保存与删除的只读分诊", "level": "h2"}, {"title": "准备故障的只读分诊", "anchor": "准备故障的只读分诊", "level": "h2"}, {"title": "资源快照排障", "anchor": "资源快照排障", "level": "h2"}, {"title": "WAITING 状态", "anchor": "waiting-状态", "level": "h2"}, {"title": "结果与评价的只读分诊", "anchor": "结果与评价的只读分诊", "level": "h2"}, {"title": "Schedule 与 Recovery 的监视", "anchor": "schedule-与-recovery-的监视", "level": "h2"}, {"title": "Repository 与 CAS 接入", "anchor": "repository-与-cas-接入", "level": "h2"}, {"title": "Incident 与 recovery", "anchor": "incident-与-recovery", "level": "h2"}, {"title": "MANAGED Secret の KEK 運用", "anchor": "managed-secret-の-kek-運用", "level": "h2"}, {"title": "验收与故障注入", "anchor": "验收与故障注入", "level": "h2"}, {"title": "通常 smoke", "anchor": "通常-smoke", "level": "h3"}, {"title": "Worker 喪失と接管", "anchor": "worker-喪失と接管", "level": "h3"}, {"title": "Log 確認と incident 記録", "anchor": "log-確認と-incident-記録", "level": "h2"}], "source": "operations/runbook.md", "checksum": "44b2d2f31a14a7522de5676bee292abdf45016576ef8fc4795d452ccf5db34ac"}, {"id": "README.md", "title": "Skillmind ワークスペース", "group": "code", "html": "\u003ch1 id=\"skillmind-ワークスペース\">Skillmind ワークスペース\u003c/h1>\n\u003cp>Skill をプロジェクトのタスクとして実行し、結果・根拠・承認を記録する AI Agent プラットフォーム。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"index.html\">文書ブラウザ\u003c/a>：オフライン閲覧・検索。\u003c/li>\n\u003cli>\u003ca href=\"#docs/README.md::\">文書ガイド\u003c/a>：製品・設計・運用の入口。\u003c/li>\n\u003cli>\u003ca href=\"#SKM/README.md::\">開発案内\u003c/a>：正式コード・環境構築・開発規約。\u003c/li>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::\">現在の計画\u003c/a>：実装範囲と残る課題。\u003c/li>\n\u003c/ul>\n\u003cp>正式コードは \u003ccode>SKM/\u003c/code>、文書の正本は \u003ccode>docs/\u003c/code> に置く。\u003c/p>\n", "sections": [{"title": "Skillmind ワークスペース", "level": "h1", "anchor": "skillmind-ワークスペース", "text": "# Skillmind ワークスペース\n\nSkill をプロジェクトのタスクとして実行し、結果・根拠・承認を記録する AI Agent プラットフォーム。\n\n- [文書ブラウザ](docs/index.html)：オフライン閲覧・検索。\n- [文書ガイド](docs/README.md)：製品・設計・運用の入口。\n- [開発案内](SKM/README.md)：正式コード・環境構築・開発規約。\n- [現在の計画](docs/planning/roadmap.md)：実装範囲と残る課題。\n\n正式コードは `SKM/`、文書の正本は `docs/` に置く。"}], "toc": [], "source": "../README.md", "checksum": "922437e9d5c8efe7a948141b3622847a9e9f887ce3c18407177b8fe5e1ca2cd3"}, {"id": "SKM/AGENTS.md", "title": "Skillmind エージェント開発規約", "group": "code", "html": "\u003ch1 id=\"skillmind-エージェント開発規約\">Skillmind エージェント開発規約\u003c/h1>\n\u003cp>本規約は Skillmind 全体に適用する。コード・起動は \u003ca href=\"#SKM/README.md::\">README\u003c/a>、設計は \u003ca href=\"#docs/README.md::\">docs\u003c/a>を正本とし、ここに複製しない。\u003c/p>\n\u003ch2 id=\"作業前に読むもの\">作業前に読むもの\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">現在の計画\u003c/a>で実装範囲と不足を確認する。規約や test の存在を実装済みの証拠にしない。\u003c/li>\n\u003cli>\u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>から対象設計を読む。仕様と実装の矛盾は影響を明示して整合させる。\u003c/li>\n\u003cli>\u003ca href=\"#docs/development/coding-rules.md::\">実装細則\u003c/a>の該当章を遵守する。文書のみなら\u003ca href=\"#docs/development/documentation.md::\">文書維持\u003c/a>を読み、実装細則の一律再読は不要。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"変更してはいけない境界\">変更してはいけない境界\u003c/h2>\n\u003cul>\n\u003cli>API/Worker は共有 package のモジュラーモノリス。Business は AgentEngine 抽象に依存し、SDK 型や route/job に業務規則を漏らさない。\u003c/li>\n\u003cli>認証は共有 actor dependency、unsafe request は Origin/CSRF。越権と不存在は同じ 404。hash・認可・event/outbox 等は\u003ca href=\"#docs/development/coding-rules.md::backend\">単一実装\u003c/a>を使う。\u003c/li>\n\u003cli>PostgreSQL は正本、Redis は Queue・短期 Lock・通知。Run snapshot/権限上限/Result は不変。人工修正は Evaluation、答復/批准は新 Segment、同 Segment 復旧は新 Attempt。\u003c/li>\n\u003cli>Skill は Organization 資産 + Project 明示有効化。Blueprint は Interpreter のみが生成する。Manifest から逆算せず、業務専用 Schema/seed/renderer を共通規則へ戻さない。\u003c/li>\n\u003cli>guidance・script・model 提案は権限ではない。未知の業務能力と登録済み versioned Tool を区別し、実行 Script は公開 checksum に一致させる。SDK builtin は DENIED_BUILTIN_TOOLS で fail closed、cwd は隔離ではない。凍結 input/ は読取専用、write は workspace/・output/ のみ。\u003c/li>\n\u003cli>外部 write は observe → propose → apply。\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>の承認、Provider、scope、競合・idempotency・read-back を省略しない。repository.write/v1 は事前許可不可・force 禁止。\u003c/li>\n\u003cli>生成 UI・並行子 Agent・Shell/network の拡張は計画と脅威モデルを先に更新し、各設計の門禁を満たす。局部実装を全面許可にしない。生成 bundle は CSP sandbox allow-scripts、iframe に allow-same-origin を付けない。子能力は resolve_subagent_capabilities と Run 共通予算を通す。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"言語とコード\">言語とコード\u003c/h2>\n\u003cp>会話は中国語、AGENTS/README・docstring/JSDoc/コメントは日本語。識別子と公開契約は既存表記を維持する。\n関数・型・Component・fixture・migration には責務、複雑な分岐・安全/transaction/復旧には理由を記し、古いコメントも同期する。単純処理の逐語説明は不要。\nPython の future annotations、TypeScript strict を維持し、any で契約を回避しない。広い例外捕捉は理由のある境界層に限定する。Effect は cleanup、遅延応答は unmount/対象切替後に反映しない。三語は共有 catalog を使う。\u003c/p>\n\u003ch2 id=\"検証と変更規律\">検証と変更規律\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">同期点\u003c/a>と\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">変更別検証\u003c/a>を適用する。動作変更には対応回帰を追加し、未実行・skip・失敗と残る risk を報告する。\u003c/li>\n\u003cli>文書は規則を更新し、進捗ログを増やさない。生成 HTML は直接編集せず、SKILL.md/references は整理対象外。\u003c/li>\n\u003cli>ユーザーの既存変更・成果物を保全する。lockfile を手編集せず、Credential・内部 URL・Ticket 本文・Gold・Secret を fixture/log に置かない。\u003c/li>\n\u003cli>Git 書込・履歴変更・破壊的操作は明示依頼が必要。実 DB・モデル・外部 write の検証は対象と副作用を事前確認する。\u003c/li>\n\u003cli>完了時は設計/契約との整合と今回の検証を報告し、mock と実環境の証拠を区別する。計画は機能状態が変わった時だけ更新する。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "Skillmind エージェント開発規約", "level": "h1", "anchor": "skillmind-エージェント開発規約", "text": "# Skillmind エージェント開発規約\n\n本規約は Skillmind 全体に適用する。コード・起動は [README](README.md)、設計は [docs](../docs/README.md)を正本とし、ここに複製しない。"}, {"title": "作業前に読むもの", "level": "h2", "anchor": "作業前に読むもの", "text": "## 作業前に読むもの\n\n1. [現在の計画](../docs/planning/roadmap.md#当前执行状态)で実装範囲と不足を確認する。規約や test の存在を実装済みの証拠にしない。\n2. [変更ガイド](../docs/development/change-guide.md)から対象設計を読む。仕様と実装の矛盾は影響を明示して整合させる。\n3. [実装細則](../docs/development/coding-rules.md)の該当章を遵守する。文書のみなら[文書維持](../docs/development/documentation.md)を読み、実装細則の一律再読は不要。"}, {"title": "変更してはいけない境界", "level": "h2", "anchor": "変更してはいけない境界", "text": "## 変更してはいけない境界\n\n- API/Worker は共有 package のモジュラーモノリス。Business は AgentEngine 抽象に依存し、SDK 型や route/job に業務規則を漏らさない。\n- 認証は共有 actor dependency、unsafe request は Origin/CSRF。越権と不存在は同じ 404。hash・認可・event/outbox 等は[単一実装](../docs/development/coding-rules.md#backend)を使う。\n- PostgreSQL は正本、Redis は Queue・短期 Lock・通知。Run snapshot/権限上限/Result は不変。人工修正は Evaluation、答復/批准は新 Segment、同 Segment 復旧は新 Attempt。\n- Skill は Organization 資産 + Project 明示有効化。Blueprint は Interpreter のみが生成する。Manifest から逆算せず、業務専用 Schema/seed/renderer を共通規則へ戻さない。\n- guidance・script・model 提案は権限ではない。未知の業務能力と登録済み versioned Tool を区別し、実行 Script は公開 checksum に一致させる。SDK builtin は DENIED_BUILTIN_TOOLS で fail closed、cwd は隔離ではない。凍結 input/ は読取専用、write は workspace/・output/ のみ。\n- 外部 write は observe → propose → apply。[受控写入](../docs/design/repository-effects.md)の承認、Provider、scope、競合・idempotency・read-back を省略しない。repository.write/v1 は事前許可不可・force 禁止。\n- 生成 UI・並行子 Agent・Shell/network の拡張は計画と脅威モデルを先に更新し、各設計の門禁を満たす。局部実装を全面許可にしない。生成 bundle は CSP sandbox allow-scripts、iframe に allow-same-origin を付けない。子能力は resolve_subagent_capabilities と Run 共通予算を通す。"}, {"title": "言語とコード", "level": "h2", "anchor": "言語とコード", "text": "## 言語とコード\n\n会話は中国語、AGENTS/README・docstring/JSDoc/コメントは日本語。識別子と公開契約は既存表記を維持する。\n関数・型・Component・fixture・migration には責務、複雑な分岐・安全/transaction/復旧には理由を記し、古いコメントも同期する。単純処理の逐語説明は不要。\nPython の future annotations、TypeScript strict を維持し、any で契約を回避しない。広い例外捕捉は理由のある境界層に限定する。Effect は cleanup、遅延応答は unmount/対象切替後に反映しない。三語は共有 catalog を使う。"}, {"title": "検証と変更規律", "level": "h2", "anchor": "検証と変更規律", "text": "## 検証と変更規律\n\n- [同期点](../docs/development/coding-rules.md#同步点)と[変更別検証](../docs/development/local-development.md#変更に応じた検証)を適用する。動作変更には対応回帰を追加し、未実行・skip・失敗と残る risk を報告する。\n- 文書は規則を更新し、進捗ログを増やさない。生成 HTML は直接編集せず、SKILL.md/references は整理対象外。\n- ユーザーの既存変更・成果物を保全する。lockfile を手編集せず、Credential・内部 URL・Ticket 本文・Gold・Secret を fixture/log に置かない。\n- Git 書込・履歴変更・破壊的操作は明示依頼が必要。実 DB・モデル・外部 write の検証は対象と副作用を事前確認する。\n- 完了時は設計/契約との整合と今回の検証を報告し、mock と実環境の証拠を区別する。計画は機能状態が変わった時だけ更新する。"}], "toc": [{"title": "作業前に読むもの", "anchor": "作業前に読むもの", "level": "h2"}, {"title": "変更してはいけない境界", "anchor": "変更してはいけない境界", "level": "h2"}, {"title": "言語とコード", "anchor": "言語とコード", "level": "h2"}, {"title": "検証と変更規律", "anchor": "検証と変更規律", "level": "h2"}], "source": "../SKM/AGENTS.md", "checksum": "685bf354c420784760dbbe6f618d4d0792a875ba5bfa884d14a0f977dc15e10a"}, {"id": "SKM/README.md", "title": "Skillmind", "group": "code", "html": "\u003ch1 id=\"skillmind\">Skillmind\u003c/h1>\n\u003cp>Skill をタスクとして実行し、結果・根拠・人工評価・外部変更の承認を記録する AI Agent プラットフォーム。\u003c/p>\n\u003cp>\u003ca href=\"index.html\">文書ブラウザ\u003c/a> · \u003ca href=\"#docs/design/README.md::\">設計索引\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">現在の計画\u003c/a> · \u003ca href=\"#SKM/AGENTS.md::\">開発規約\u003c/a>\u003c/p>\n\u003ch2 id=\"はじめに\">はじめに\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目的\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>開発環境と検証\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/local-development.md::\">ローカル開発\u003c/a> / \u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>起動・更新\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a> / \u003ca href=\"#docs/operations/deployment.md::\">配備手順\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API・障害対応\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/api-usage.md::\">API 利用\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a> / \u003ca href=\"#docs/operations/backup-recovery.md::\">復元\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Python 3.12、Node.js 26 / pnpm 11.7.0 を使用する。DB・Redis・object storage は別途必要。\n通常の ADMIN 作成は \u003ccode>python -m skillmind.ops.bootstrap_admin\u003c/code>。\u003cstrong>\u003ccode>make bootstrap-admin\u003c/code> は全 volume を消す\u003c/strong>ため、初回の通常手順と混同しない。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind\">backend/src/skillmind\u003c/a> は API と Worker の共有 Python package。\nroute は認証と入出力、service は業務処理、repository は永続化、AgentEngine/Provider は実行境界を担当する。\u003c/p>\n\u003cul>\n\u003cli>auth・users・projects・documents・skills・compositions：\u003ca href=\"#docs/design/user-lifecycle.md::\">アカウント\u003c/a>・\u003ca href=\"#docs/design/project-lifecycle.md::\">Project\u003c/a>・\u003ca href=\"#docs/design/document-lifecycle.md::\">文書資産\u003c/a>・Skill。\u003c/li>\n\u003cli>runs・agent・worker・schedules：実行・監督・調度。\u003ca href=\"#docs/design/run-creation.md::\">Run 作成\u003c/a>と \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>。\u003c/li>\n\u003cli>evaluations・effects・modules・integrations・storage：評価・外部連携・保存。\u003ccode>db/\u003c/code> と \u003ca href=\"../SKM/backend/migrations\">migrations\u003c/a> は永続形式。\u003c/li>\n\u003c/ul>\n\u003cp>起動・検証は\u003ca href=\"#docs/development/local-development.md::backend\">Backend 手順\u003c/a>へ。\n全 pytest は専用 DB の作成・強制削除を伴うため、\u003ca href=\"#docs/development/local-development.md::%E5%AE%9F-postgresql-%E3%81%AE%E5%89%8D%E6%8F%90\">実 DB の前提\u003c/a>を先に確認する。\u003c/p>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/web/src\">web/src\u003c/a> は React + TypeScript。pages・components は画面、api は共有 HTTP client、lib・hooks は純粋処理・非同期制御。\nTask Center は実行対象の選択、\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a> は一つの Run の観察を担当する。\u003c/p>\n\u003cp>環境・proxy・typecheck/Vitest/build・mock browser は\u003ca href=\"#docs/development/local-development.md::web\">Web 手順\u003c/a>へ。画面別の実装状態は計画で確認する。\u003c/p>\n\u003ch2 id=\"contracts\">Contracts\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/contracts\">contracts\u003c/a> に versioned JSON Schema（例：\u003ca href=\"../SKM/contracts/users/v1\">アカウント\u003c/a>）、example、Tool capability、\u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a> を置く。\n形状は契約、権限・凍結・再送の意味は設計が正本。\u003ca href=\"#docs/development/contract-workflow.md::\">契約変更手順\u003c/a>に従い、Backend・Web・テストを同期する。OpenAPI は生成物であり手編集しない。\u003c/p>\n\u003ch2 id=\"scripts\">Scripts\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/scripts\">scripts\u003c/a> に契約/Compose の検査、OpenAPI・文書生成、配備・image 移送の工具を置く。\nコマンドと副作用は\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">検証表\u003c/a>、\u003ca href=\"#docs/development/documentation.md::\">文書管理\u003c/a>、\u003ca href=\"#docs/operations/deployment.md::\">配備手順\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"skills\">Skills\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/skills\">skills\u003c/a> には system Skill \u003ccode>skillmind-skill-interpreter\u003c/code> と開発 workflow \u003ccode>skm-project-dev\u003c/code> を置く。業務 Skill は配備後に実際の内容を取り込む。合成入力は Backend の tests 専用とし、配備 image に含めない。\n各 SKILL.md を入口とし、文書整理では変更しない。配置や script の存在は実行許可ではなく、\u003ca href=\"#docs/design/skill-contract.md::\">公開・Project 有効化\u003c/a>が別途必要。\u003c/p>\n\u003ch2 id=\"images\">Images\u003c/h2>\n\u003cp>\u003ccode>images/skillmind-images.tar\u003c/code> は配備 image であり、DB・blob・workspace・KEK の backup ではない。\n\u003ca href=\"#docs/operations/quickstart.md::image-%E7%A7%BB%E9%80%81%E3%81%A8%E6%9B%B4%E6%96%B0\">image 移送と更新\u003c/a>で必要 image・送受信 checksum・既存 archive の保全を確認し、復旧は\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E6%81%A2%E5%A4%8D%E7%82%B9%E5%8C%85%E5%90%AB%E4%BB%80%E4%B9%88\">同一復元点\u003c/a>を使う。\u003c/p>\n", "sections": [{"title": "Skillmind", "level": "h1", "anchor": "skillmind", "text": "# Skillmind\n\nSkill をタスクとして実行し、結果・根拠・人工評価・外部変更の承認を記録する AI Agent プラットフォーム。\n\n[文書ブラウザ](../docs/index.html) · [設計索引](../docs/design/README.md) · [現在の計画](../docs/planning/roadmap.md#当前执行状态) · [開発規約](AGENTS.md)"}, {"title": "はじめに", "level": "h2", "anchor": "はじめに", "text": "## はじめに\n\n| 目的 | 入口 |\n| --- | --- |\n| 開発環境と検証 | [ローカル開発](../docs/development/local-development.md) / [変更ガイド](../docs/development/change-guide.md) |\n| 起動・更新 | [Quickstart](../docs/operations/quickstart.md) / [配備手順](../docs/operations/deployment.md) |\n| API・障害対応 | [API 利用](../docs/development/api-usage.md) / [Runbook](../docs/operations/runbook.md) / [復元](../docs/operations/backup-recovery.md) |\n\nPython 3.12、Node.js 26 / pnpm 11.7.0 を使用する。DB・Redis・object storage は別途必要。\n通常の ADMIN 作成は `python -m skillmind.ops.bootstrap_admin`。**`make bootstrap-admin` は全 volume を消す**ため、初回の通常手順と混同しない。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\n[backend/src/skillmind](backend/src/skillmind/) は API と Worker の共有 Python package。\nroute は認証と入出力、service は業務処理、repository は永続化、AgentEngine/Provider は実行境界を担当する。\n\n- auth・users・projects・documents・skills・compositions：[アカウント](../docs/design/user-lifecycle.md)・[Project](../docs/design/project-lifecycle.md)・[文書資産](../docs/design/document-lifecycle.md)・Skill。\n- runs・agent・worker・schedules：実行・監督・調度。[Run 作成](../docs/design/run-creation.md)と [Runtime](../docs/design/agent-runtime.md)。\n- evaluations・effects・modules・integrations・storage：評価・外部連携・保存。`db/` と [migrations](backend/migrations/) は永続形式。\n\n起動・検証は[Backend 手順](../docs/development/local-development.md#backend)へ。\n全 pytest は専用 DB の作成・強制削除を伴うため、[実 DB の前提](../docs/development/local-development.md#実-postgresql-の前提)を先に確認する。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n[web/src](web/src/) は React + TypeScript。pages・components は画面、api は共有 HTTP client、lib・hooks は純粋処理・非同期制御。\nTask Center は実行対象の選択、[Workspace](../docs/design/workspace.md) は一つの Run の観察を担当する。\n\n環境・proxy・typecheck/Vitest/build・mock browser は[Web 手順](../docs/development/local-development.md#web)へ。画面別の実装状態は計画で確認する。"}, {"title": "Contracts", "level": "h2", "anchor": "contracts", "text": "## Contracts\n\n[contracts](contracts/) に versioned JSON Schema（例：[アカウント](contracts/users/v1/)）、example、Tool capability、[OpenAPI](contracts/openapi/skillmind-api.v1.json) を置く。\n形状は契約、権限・凍結・再送の意味は設計が正本。[契約変更手順](../docs/development/contract-workflow.md)に従い、Backend・Web・テストを同期する。OpenAPI は生成物であり手編集しない。"}, {"title": "Scripts", "level": "h2", "anchor": "scripts", "text": "## Scripts\n\n[scripts](scripts/) に契約/Compose の検査、OpenAPI・文書生成、配備・image 移送の工具を置く。\nコマンドと副作用は[検証表](../docs/development/local-development.md#変更に応じた検証)、[文書管理](../docs/development/documentation.md)、[配備手順](../docs/operations/deployment.md)を参照する。"}, {"title": "Skills", "level": "h2", "anchor": "skills", "text": "## Skills\n\n[skills](skills/) には system Skill `skillmind-skill-interpreter` と開発 workflow `skm-project-dev` を置く。業務 Skill は配備後に実際の内容を取り込む。合成入力は Backend の tests 専用とし、配備 image に含めない。\n各 SKILL.md を入口とし、文書整理では変更しない。配置や script の存在は実行許可ではなく、[公開・Project 有効化](../docs/design/skill-contract.md)が別途必要。"}, {"title": "Images", "level": "h2", "anchor": "images", "text": "## Images\n\n`images/skillmind-images.tar` は配備 image であり、DB・blob・workspace・KEK の backup ではない。\n[image 移送と更新](../docs/operations/quickstart.md#image-移送と更新)で必要 image・送受信 checksum・既存 archive の保全を確認し、復旧は[同一復元点](../docs/operations/backup-recovery.md#一致恢复点包含什么)を使う。"}], "toc": [{"title": "はじめに", "anchor": "はじめに", "level": "h2"}, {"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "Contracts", "anchor": "contracts", "level": "h2"}, {"title": "Scripts", "anchor": "scripts", "level": "h2"}, {"title": "Skills", "anchor": "skills", "level": "h2"}, {"title": "Images", "anchor": "images", "level": "h2"}], "source": "../SKM/README.md", "checksum": "86a3605a021ead5707dd92bd10c489f5c1f91f3b064c9af9f6ba73dc42557b69"}], "aliases": {"SKM/backend/README.md": {"page": "SKM/README.md", "anchor": "backend"}, "SKM/web/README.md": {"page": "SKM/README.md", "anchor": "web"}, "SKM/contracts/README.md": {"page": "SKM/README.md", "anchor": "contracts"}, "SKM/scripts/README.md": {"page": "SKM/README.md", "anchor": "scripts"}, "SKM/skills/README.md": {"page": "SKM/README.md", "anchor": "skills"}, "SKM/images/README.md": {"page": "SKM/README.md", "anchor": "images"}}}</script>
  <script>
    'use strict';
    const data = JSON.parse(document.getElementById('docs-data').textContent);
    const pages = new Map(data.pages.map(page => [page.id, page]));
    const main = document.getElementById('main');
    const search = document.getElementById('search');
    const menuButton = document.getElementById('menu-button');
    const topbar = document.querySelector('.topbar');
    let currentId = '';

    /** 文書と章を browser history に保存する。 */
    function pageHref(page, anchor = '') {
      return '#' + encodeURI(page.id) + '::' + encodeURIComponent(anchor);
    }

    /** 信頼していない検索語を HTML として挿入しない。 */
    function linkFor(page, title = page.title, anchor = '') {
      const link = document.createElement('a');
      link.href = pageHref(page, anchor);
      link.textContent = title;
      if (page.id === currentId && !anchor) link.setAttribute('aria-current', 'page');
      return link;
    }

    /** 検索語を escape 済み HTML に再解釈せず、text node と mark だけで強調する。 */
    function searchExcerpt(section, query) {
      const excerpt = document.createElement('small');
      const position = section.text.toLocaleLowerCase().indexOf(query);
      const start = Math.max(0, position - 32);
      const end = Math.min(section.text.length, Math.max(0, position) + query.length + 80);
      const snippet = section.text.slice(start, end).replace(/\s+/g, ' ');
      const match = snippet.toLocaleLowerCase().indexOf(query);
      if (start) excerpt.append('…');
      if (match < 0) {
        excerpt.append(snippet);
      } else {
        const mark = document.createElement('mark');
        mark.textContent = snippet.slice(match, match + query.length);
        excerpt.append(snippet.slice(0, match), mark, snippet.slice(match + query.length));
      }
      if (end < section.text.length) excerpt.append('…');
      return excerpt;
    }

    /** 通常時は分類ナビ、検索時は本文を含む候補を表示する。 */
    function renderNavigation() {
      const navigation = document.getElementById('navigation');
      navigation.replaceChildren();
      const query = search.value.trim().toLocaleLowerCase();
      if (query) {
        const found = data.pages.flatMap(page => {
          const sections = page.sections.filter(section => section.text.toLocaleLowerCase().includes(query));
          const id = page.id.toLocaleLowerCase();
          const title = page.title.toLocaleLowerCase();
          // file 名を探すとき、他文書の相互参照より対象文書を先に案内する。
          const rank = id === query || id.split('/').at(-1) === query ? 0
            : title.includes(query) ? 1 : id.includes(query) ? 2 : 3;
          return rank < 3 || sections.length ? [{page, sections, rank}] : [];
        }).sort((left, right) => left.rank - right.rank);
        document.getElementById('search-status').textContent = found.length + ' 篇匹配文档';
        for (const {page, sections} of found) {
          const row = document.createElement('div');
          row.className = 'search-hit';
          row.append(linkFor(page, page.title, sections[0]?.anchor || ''));
          const location = document.createElement('small');
          location.textContent = data.groups[page.group] + ' · ' + page.id;
          row.append(location);
          for (const section of sections.slice(0, 3)) {
            const result = document.createElement('div');
            result.className = 'search-section';
            result.append(linkFor(page, section.title, section.anchor), searchExcerpt(section, query));
            row.append(result);
          }
          if (sections.length > 3) {
            const more = document.createElement('small');
            more.textContent = '本页另有 ' + (sections.length - 3) + ' 个匹配章节，可用浏览器查找继续定位。';
            row.append(more);
          }
          navigation.append(row);
        }
        return;
      }
      document.getElementById('search-status').textContent = '';
      for (const [group, title] of Object.entries(data.groups)) {
        const children = data.pages.filter(page => page.group === group);
        if (!children.length) continue;
        const section = document.createElement('details');
        section.open = true;
        const heading = document.createElement('summary');
        heading.textContent = title;
        section.append(heading);
        for (const page of children) section.append(linkFor(page));
        navigation.append(section);
      }
    }

    /** 表が本当に溢れた場合だけ keyboard 操作とスクロール案内を表示する。 */
    function updateScrollableTables() {
      for (const [index, region] of [...main.querySelectorAll('.table-scroll')].entries()) {
        const table = region.querySelector('table');
        const overflow = table.getBoundingClientRect().width > region.clientWidth + 1;
        const hint = region.previousElementSibling;
        hint.hidden = !overflow;
        region.tabIndex = overflow ? 0 : -1;
        if (overflow) {
          region.setAttribute('role', 'region');
          region.setAttribute('aria-label', '表格 ' + (index + 1) + '，可横向滚动');
          region.setAttribute('aria-describedby', hint.id);
        } else {
          region.removeAttribute('role');
          region.removeAttribute('aria-label');
          region.removeAttribute('aria-describedby');
        }
      }
    }

    /** 改行や文字拡大後も固定 header が章の見出しと menu を覆わないようにする。 */
    function updateScrollOffset() {
      const sticky = getComputedStyle(topbar).position === 'sticky';
      const height = sticky ? Math.ceil(topbar.getBoundingClientRect().height) : 0;
      document.documentElement.style.setProperty('--docs-header-height', height + 'px');
      document.documentElement.style.setProperty('--docs-scroll-offset', (sticky ? height + 16 : 32) + 'px');
    }

    /** 直接リンク・戻る・進むを同じ経路で扱う。 */
    function showPage() {
      if (location.hash === '#main') { main.focus(); return; }
      let id, anchor;
      try { [id, anchor = ''] = location.hash.slice(1).split('::').map(decodeURIComponent); }
      catch { id = ''; anchor = ''; }
      id ||= 'docs/README.md';
      // 統合前の module README の bookmark は、本文を残さず対応する中心章へ案内する。
      if (Object.hasOwn(data.aliases, id)) {
        ({page: id, anchor} = data.aliases[id]);
        history.replaceState(null, '', pageHref(pages.get(id), anchor));
      }
      const page = pages.get(id);
      currentId = id;
      const toc = document.getElementById('toc-links');
      toc.replaceChildren();
      if (!page) {
        main.replaceChildren();
        const title = document.createElement('h1');
        title.textContent = '文档不存在';
        main.append(title, linkFor(pages.get('docs/README.md'), '返回文档导航'));
        document.getElementById('category').textContent = 'SKILLMIND / 未找到';
        document.getElementById('source-link').hidden = true;
        document.title = '文档不存在 · Skillmind';
        document.body.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        renderNavigation();
        main.focus();
        return;
      }
      document.title = page.title + ' · Skillmind';
      document.getElementById('category').textContent = 'SKILLMIND / ' + data.groups[page.group];
      const source = document.getElementById('source-link');
      source.hidden = false;
      source.href = page.source;
      // 本文は build 時に raw HTML 無効の parser で生成済み。検索語や URL は混ぜない。
      main.innerHTML = page.html;
      const inlineToc = document.createElement('details');
      inlineToc.className = 'inline-toc';
      const inlineSummary = document.createElement('summary');
      inlineSummary.textContent = '本页内容';
      const inlineLinks = document.createElement('nav');
      inlineLinks.setAttribute('aria-label', '本页章节');
      inlineToc.append(inlineSummary, inlineLinks);
      for (const heading of page.toc) {
        const link = linkFor(page, heading.title, heading.anchor);
        if (heading.level === 'h3') link.className = 'sub';
        inlineLinks.append(link.cloneNode(true));
        toc.append(link);
      }
      if (page.toc.length) main.querySelector('h1').after(inlineToc);
      for (const [index, region] of [...main.querySelectorAll('.table-scroll')].entries()) {
        const hint = document.createElement('p');
        hint.className = 'scroll-hint';
        hint.id = 'docs-table-hint-' + index;
        hint.hidden = true;
        hint.textContent = '表格可横向滚动；聚焦表格后可用方向键查看。';
        region.before(hint);
      }
      const footer = document.createElement('footer');
      footer.className = 'page-footer';
      footer.textContent = page.id + ' · 从 Markdown 生成；修改源文件后重新构建。';
      main.append(footer);
      document.body.classList.remove('menu-open');
      menuButton.setAttribute('aria-expanded', 'false');
      renderNavigation();
      requestAnimationFrame(() => {
        updateScrollOffset();
        updateScrollableTables();
        const target = anchor ? main.querySelector('#' + CSS.escape(anchor)) : null;
        if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
        const focusTarget = target || main;
        focusTarget.setAttribute('tabindex', '-1');
        focusTarget.focus({preventScroll:true});
      });
    }

    search.addEventListener('input', renderNavigation);
    window.addEventListener('hashchange', showPage);
    document.addEventListener('click', event => {
      // 同じ章への再クリックでは hashchange が発生しない。検索や目次から再び焦点を戻す。
      const link = event.target instanceof Element ? event.target.closest('a') : null;
      if (link?.getAttribute('href') === location.hash && location.hash.includes('::') &&
          event.button === 0 && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey) {
        event.preventDefault();
        showPage();
      }
    });
    window.addEventListener('resize', () => requestAnimationFrame(() => {
      updateScrollOffset();
      updateScrollableTables();
    }));
    new ResizeObserver(updateScrollOffset).observe(topbar);
    document.getElementById('print-button').addEventListener('click', () => window.print());
    menuButton.addEventListener('click', () => {
      const open = document.body.classList.toggle('menu-open');
      menuButton.setAttribute('aria-expanded', String(open));
      if (open) search.focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && document.body.classList.contains('menu-open')) {
        document.body.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.focus();
      }
    });
    showPage();
  </script>
</body>
</html>
