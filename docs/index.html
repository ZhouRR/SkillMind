6362a2afbed80dfeeead750bd69001"}, {"id": "docs/design/document-lifecycle.md", "title": "项目文档的保存、读取与清理", "group": "design", "html": "\u003ch1 id=\"项目文档的保存读取与清理\">项目文档的保存、读取与清理\u003c/h1>\n\u003cp>本页负责文档资产；\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>负责 Run 冻结/副本，\u003ca href=\"#docs/design/project-lifecycle.md::\">项目生命周期\u003c/a>负责整项目操作。当前缺口见\u003ca href=\"#docs/planning/roadmap.md::\">计划 R01/R10/R11\u003c/a>，下述局部实现不代表完整存储可靠性。\u003c/p>\n\u003ch2 id=\"一个例子列表消失不等于清理完成\">一个例子：列表消失不等于清理完成\u003c/h2>\n\u003cp>A 的 document ID/hash 被 Run 冻结后，删除元数据再删 blob 是两步；同路径重传 A′ 会产生新 ID，不能修复原引用。目录、存储字节、冻结引用、物化副本须分别确认：列表消失不证明清理，Run 显示引用不证明可下载，删除报错不证明元数据回滚。\u003c/p>\n\u003ch2 id=\"身份目录与公开面\">身份、目录与公开面\u003c/h2>\n\u003cp>ProjectDocument 元数据在 PostgreSQL，内部 storage_key 定位 blob。document_id 是身份，folder/name 仅展示路径；同 Project/路径唯一、不按内容去重。无覆盖、移动、改名、版本或恢复 API；目录由 folder 投影，不保存空目录。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>语义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>POST documents\u003c/td>\n\u003ctd>原 Idempotency-Key + 单 file/可选 folder；201 原发布元数据，同名 409 document_conflict\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET document-uploads/{upload_key}\u003c/td>\n\u003ctd>原 actor/Project 上传记录；PENDING 未确认发布，PUBLISHED 返回历史回执，不是当前目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST / GET document-uploads/{upload_key}/closure\u003c/td>\n\u003ctd>原作者显式停止发布 / 查询关闭回执；不停止 PUT、删 blob 或退配额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET documents / document\u003c/td>\n\u003ctd>完整数组按 folder/name 排序 / Project + 原 ID 当前元数据；无分页/Folder 契约，不是删除回执\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET document content\u003c/td>\n\u003ctd>精确 ID 授权并核验实际 size/hash 后返回附件，不公开 blob URL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DELETE document\u003c/td>\n\u003ctd>元数据 commit 后尝试删 blob；204 不保证完整清理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>公开字段仅身份、路径、size/MIME/checksum、上传者/时间；读用 ProjectReadActor，写用要求 ACTIVE 的 ProjectWriteActor，越权/不存在统一 404，已处理响应 no-store。上传、原请求查询和删除另经业务事务复核当前会话/Project/成员。\u003c/p>\n\u003ch3 id=\"存储归属与配置切换\">存储归属与配置切换\u003c/h3>\n\u003cp>0037 为新文档保存 namespace UUID、非秘密连接描述 checksum、后端持久性；与 key 一起传递，不进入公开元数据/Run 清单。PUT 前后及发布前复核，下载/冻结读取/删除只用原身份匹配的已配置 client，不由 DB 构造 endpoint 或凭据。\u003c/p>\n\u003cp>S3 的 SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID 是存储世代 UUID：同原存储的 API/Worker 一致，重建必须换 UUID。摘要含规范化 HTTP(S) endpoint、bucket、固定空前缀，不含凭据，轮换不改身份；endpoint 拒绝 userinfo、路径前缀、query、fragment、含糊 authority。memory 每实例独立非持久身份。\u003c/p>\n\u003cp>未配置、归属不符或旧行未绑定，blob 操作为 503 document_storage_unavailable，列表/精确元数据仍可读；删除须在改元数据前拒绝。0037 不以当前配置回填旧 ID/key/hash，旧资产核验/归属迁移工具尚未实现。\u003c/p>\n\u003cp>配置 UUID 不是服务端 bucket 身份证明；同地址重建误复用 UUID、对象篡改/版本和迟到 PUT 仍需 marker/精确清理协议。当前只解析单 namespace，SkillSource 等消费者未接持久归属。\u003c/p>\n\u003ch2 id=\"上传的三个边界\">上传的三个边界\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/api/routes/documents.py\">入口\u003c/a>先验 Origin/CSRF、会话与 Project，再读 multipart，不用 dependency 前解析正文的 File/Form。只允许一个 file、可选一个 folder；重复/未知字段、类型混用、不完整结束返回 422 invalid_document_upload。\u003c/p>\n\u003cp>现有 multipart 引擎流式解析，不建临时文件/后台写线程。实际文件 bytes 受配置上限约束，整请求最多上限 + 16 KiB，header 合计 16 KiB、folder 1,024 bytes；分块、缺失/低报 Content-Length、epilogue 均计数，追加 buffer 前超限返回 413 document_upload_too_large。filename/folder 严格 UTF-8，拒绝歧义/扩展参数和压缩 envelope；业务另限字符数。\u003c/p>\n\u003cp>完成后交付不可变 bytes，断连/取消直接传播。每请求有界不等于全进程内存、并发、慢请求或代理预算。\u003c/p>\n\u003ch3 id=\"上传的授权事务\">上传的授权事务\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/documents/service.py\">DocumentService\u003c/a>首次 await 前复制正文，规范化路径并验大小/MIME/文本策略：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>提交边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>TX A\u003c/td>\n\u003ctd>原授权/ACTIVE 下按 actor/Project/key 查意图；首次才验目录/待发布路径/配额，保存原意图与占用并 commit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>锁外 PUT\u003c/td>\n\u003ctd>仅确认首次预约 commit 的调用可 application PUT 一次；同键重发/提交未知不 PUT，回执须匹配原 key/size/MIME/hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TX B\u003c/td>\n\u003ctd>同一原授权、未关闭预约、ACTIVE/最新占用下创建元数据与 PUBLISHED 回执，flush/最终授权后 commit，返回 201\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>两个事务锁序均为 Organization UPDATE → User SHARE → 原 AuthSession UPDATE → Project/成员 SHARE。等锁、读取、flush 后取新时间复核原会话，不换同用户新登录；上传者从原 access 取得。撤销/到期、停用/移除成员、归档/项目删除后不得发布；存储 I/O 不持上述锁。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>校验\u003c/th>\n\u003cth>保证范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>默认单文件 25 MiB、Project 500 MiB\u003c/td>\n\u003ctd>占用 = 全部上传意图 + 未关联旧元数据 + 未关联旧清理记录 size，不是 bucket 实际字节\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>名称/folder 最多 200 字符\u003c/td>\n\u003ctd>名称另受共享 key 单段 128 限制；129–200 在 PUT 前 422 invalid_document_name，不截断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MIME allowlist、指定文本凭据扫描\u003c/td>\n\u003ctd>仅申报类型/指定文本，不证明真实格式、病毒安全或任意二进制脱敏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组织 gate\u003c/td>\n\u003ctd>PUT 前预约，发布不双计；旧负 size 拒绝不抵扣，PENDING 路径阻止同名新 PUT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>唯一约束\u003c/td>\n\u003ctd>仅精确路径冲突映射 document_conflict；其他 DB 异常不冒充同名，PUT 后失败保留意图与可能对象\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>UNCONDITIONAL_V1 的一次 application PUT 不等于一次 wire PUT，仍可能 SDK 重试/multipart/迟到写。拒绝、取消、存储错误、commit 未知均不补偿删除或释放占用。\u003c/p>\n\u003cp>路径冲突返回前复核期限；failed flush 只以锁内授权副本作拒绝分类，禁止失效 ORM 隐式查询或凭副本续写。上述门禁限本版 writer，不覆盖任意 SQL/旧实例。\u003c/p>\n\u003ch3 id=\"原上传身份与查询\">原上传身份与查询\u003c/h3>\n\u003cp>Idempotency-Key 必须单个非 nil UUID；缺失/重复/非法在授权后、正文前返回 422 invalid_document_upload_key。0038 的原意图绑定组织/Project/actor/key、服务器 request UUID、原会话、规范化输入摘要、目标 document ID、namespace/key、占用/时间，不存正文/凭据。摘要含协议版、组织/Project/actor、folder/name、size/MIME/hash，不含后来请求或会话 ID。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原记录\u003c/th>\n\u003cth>同键 POST / GET\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>无\u003c/td>\n\u003ctd>POST 可预约；GET 404 document_upload_not_found 不证明旧请求以后不会提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PENDING\u003c/td>\n\u003ctd>同内容 POST 409 document_upload_pending，已关闭为 document_upload_closed，均不 PUT；GET 200、document=null，不断言对象有无\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PUBLISHED\u003c/td>\n\u003ctd>同内容 POST 原 201，GET 原九字段回执；文档后来删除不改回执、不重建目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同 key 不同摘要\u003c/td>\n\u003ctd>POST 409 document_upload_key_conflict，无新占用/PUT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>损坏/不可核实\u003c/td>\n\u003ctd>503 document_upload_unavailable，不补造事实\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>POST 重放仍验当前接收策略/ACTIVE，但不要求存储可达或重新计费。GET 不复验文件策略，允许同 actor 新有效会话和授权归档，不允许其他 actor（含 ADMIN）查询；查到/未中/拒绝都过最终授权。不以文件名或列表推断原请求结果。\u003c/p>\n\u003cp>意图不自动过期/删除；已发布或元数据已删仍保留占用，不代表副本/备份/孤立对象/历史版本已精确计量。无响应、metadata 删除或一次对象不存在均不足以结算。0038 不补造旧上传历史，任意意图/关联阻止降级。\u003c/p>\n\u003ch3 id=\"显式停止待发布上传\">显式停止待发布上传\u003c/h3>\n\u003cp>原作者向原 Project/key POST closure，正文必须为 {\u0026quot;confirmation\u0026quot;:\u0026quot;STOP_PUBLICATION\u0026quot;}；按上传事务复核当前会话/CSRF/ACTIVE/成员。同 actor 新会话可关闭但不接管旧 PUT，ADMIN 不代关他人 key。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>竞争结果\u003c/th>\n\u003cth>响应\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>关闭先提交\u003c/td>\n\u003ctd>首次 201、同目标重放 200，原回执不变；TX A/TX B 拒绝 document_upload_closed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>发布先提交\u003c/td>\n\u003ctd>409 document_upload_already_published，不改发布回执或自动删文档\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关闭提交未知\u003c/td>\n\u003ctd>GET 同 URL；200 才确认，404 document_upload_closure_not_found 不证明旧 POST 不会提交，不自动重发\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../SKM/contracts/documents/v1/upload-closure.schema.json\">独立回执\u003c/a>严格包含 upload_key、project_id、document_id、closed_at、publication_state=CLOSED，不扩旧五字段响应。原上传仍为 PENDING/null，不补发布日期。GET 按原作者当前只读授权，可新会话/归档，全部路径过最终门禁。\u003c/p>\n\u003cp>0042 原子保存 publication_closed_at 和 document_upload_closures 审计；独立 checksum 绑定原 key、私有目标、原作者/request/session/时间/内容及本次关闭身份，不改 v1 摘要、不存正文。缺失/孤立/不匹配为 document_upload_unavailable，不补签。\u003c/p>\n\u003cp>关闭释放展示路径给新 key/ID，但保留原占用、意图、关闭审计与对象身份。DB CHECK 阻止关闭后 PUBLISHED，能使忽略新列的旧发布 SQL 回滚，却不能阻止旧 PUT 或代替全实例停写。任意关闭标记/审计阻止 0042 降级。\u003c/p>\n\u003ch2 id=\"读取下载与预览\">读取、下载与预览\u003c/h2>\n\u003cp>普通下载和冻结读取共用实际字节校验：按原 ID 取元数据，锁外读对象，size/SHA-256 一致才返回完整内容；冻结另比原快照 ID/路径/MIME/hash，不以同路径新文件替代。\u003c/p>\n\u003cp>S3 同一次 GET 最多读取声明 size + 1 bytes，不先 stat；连接/读取/关闭在线程内，线程自行关闭响应。取消等待不证明线程/远端已停，也不等于全服务内存/并发/网络 deadline。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>结果\u003c/th>\n\u003cth>响应\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>元数据不存在/越权\u003c/td>\n\u003ctd>404，不通过存储枚举补身份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原 blob 缺失\u003c/td>\n\u003ctd>409 document_content_missing，不同名补齐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际 size/hash 不符、元数据非法\u003c/td>\n\u003ctd>409 document_content_invalid，无部分返回或重算保存 hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>归属未绑定/不符、S3 拒绝/读取故障\u003c/td>\n\u003ctd>静态 503 document_storage_unavailable，不暴露 namespace/key/SDK 错误\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>附件带 no-store、nosniff、安全 Content-Disposition；合法 MIME 保留，非法降 octet-stream。文件名用单段 ASCII fallback + UTF-8 filename*，不拼原引号/控制字符，不改 DB 原名。\u003c/p>\n\u003cp>Web 预览仅 txt/md/markdown/htm/html，最多 1,000,000 实际 bytes，只接受 200，错误正文也有界。列表 size 仅作按钮提示，Content-Length 不可信；超限停止并提示下载，不显示截断片段，UTF-8 错误明确拒绝。\u003c/p>\n\u003cp>文本/Markdown 保留原文；HTML 在无浏览上下文 template 解析，只重建静态结构白名单，无脚本、上传 CSS、表单/frame、外部资源、URL/事件属性；图片留 alt、链接留文本。超过 20,000 节点安全显示原文，不递归截断。\u003c/p>\n\u003cp>srcDoc 正文前设置\u003ca href=\"https://www.w3.org/TR/CSP3/#meta-element\">默认拒绝 CSP\u003c/a>，仅允许平台固定 CSS；iframe sandbox=\u0026quot;\u0026quot;、no-referrer。页面说明主动内容已移除、原文件仍可下载；这不是 generated Host，也不保证其他应用打开原文件安全。\u003c/p>\n\u003cp>预览读取期限 30 秒；关闭/同 tick 换文件、换 actor/会话/Project 立即作废旧请求，晚到正文/401 不影响新上下文。当前 401/403/Project 404 关闭写资格，列表刷新不重开，预览不解除未知删除。\u003c/p>\n\u003ch2 id=\"删除与历史引用\">删除与历史引用\u003c/h2>\n\u003cp>0039 在原授权/引用/归属检查后，同事务保存独立清理要求、关联意图的 cleanup_requested_at，再删元数据；commit 后才尝试删同 namespace 原 key。失败可留 blob，重删原 ID 得 404；持久要求不是清理回执或异步重试。\u003c/p>\n\u003cp>清理要求保存原 ID/元数据/namespace/key、本次 DELETE 组织/actor/request/session/时间，无凭据：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>来源\u003c/th>\n\u003cth>占用与历史\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>UPLOAD_INTENT_V1\u003c/td>\n\u003ctd>关联原意图，不双计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LEGACY_UNVERIFIED\u003c/td>\n\u003ctd>旧元数据 size 原子转入清理占用，不造 upload key/会话/停止证明\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>未绑定、不安全或损坏目标仍在删除前拒绝，不用当前配置补齐。新旧元数据删除、要求和关联更新原子提交，PUBLISHED 回执不变；任意清理要求阻止 0039 降级。\u003c/p>\n\u003cp>文档不进入整项目配置批删；任意文档/意图/清理记录均触发 project_delete_blocked_by_document_uploads，不能清空审计/占用释放项目。\u003c/p>\n\u003cp>S3 get/stat/exists/delete 仅明确 NoSuchKey/NoSuchObject 算不存在；NoSuchBucket、AccessDenied、SDK/HTTP/连接故障均不可用。PUT 失败/取消不证明无写入或已停止；上传/删除存储故障为静态 503，页面仍按未知处理。204 不证明历史版本、在途 PUT 或所有字节清理，SDK 重试/multipart/无条件 PUT 尚未被封闭。\u003c/p>\n\u003ch3 id=\"删除事务与引用判定\">删除事务与引用判定\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">Organization UPDATE → User SHARE → 原 AuthSession UPDATE\n  → Project/成员 SHARE → 原 Document UPDATE\n  → 历史引用 → 关联 Upload UPDATE/标记清理\n  → 独立 Cleanup（旧占用转入）→ 删除元数据\n  → flush → 最终授权 → commit → 锁外删原 blob\n\u003c/code>\u003c/pre>\n\u003cp>只用原 cookie/CSRF、服务器 request UUID，不选新会话。等锁、引用读取和最终 flush 后复核；失效回滚。DB 异常、取消、commit 未知不调用 blob 删除、不自动重发。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>保存事实\u003c/th>\n\u003cth>引用判定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>任意状态 Run 的可信文档快照\u003c/td>\n\u003ctd>原请求/Project/槽位/成员/hash 一致后保护冻结 ID；终态/已存副本不解除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任意状态 Schedule 的 SINGLE/SET\u003c/td>\n\u003ctd>保护显式原 ID，暂停/归档/未触发不解除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保留 occurrence 的 SINGLE/SET\u003c/td>\n\u003ctd>校验原快照/checksum/索引/父身份；旧配置、SETTLED 无 Run 审计仍保护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schedule/occurrence 动态 ALL\u003c/td>\n\u003ctd>未展开规则不永久占当前目录；已建 Run 只保护冻结成员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原可选槽未选、合法无文档 Run\u003c/td>\n\u003ctd>无引用；任意输入 UUID 不算引用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧 provider 含义不明、快照缺损\u003c/td>\n\u003ctd>409 document_references_unavailable，不当空集合\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>精确引用为 409 document_in_use，不公开引用正文/ID。仅扫相关 Project，不以“有任意 Run”代判，不回写旧数据/hash；扫描成本和真实并发仍待验。\u003c/p>\n\u003cp>新建 Run、调度保存、删除共用 Organization gate；调度创建/编辑锁内重验元数据，防止锁外验证后被删。认领只在 Schedule 锁内复制配置，不反向取组织锁；已有输入回执/工作区/Evidence 沿冻结来源派生，不扩权。旧 writer/任意 SQL/混跑不受此保证。\u003c/p>\n\u003ch3 id=\"持久清理仍待补齐\">持久清理仍待补齐\u003c/h3>\n\u003cp>已实现独立停止发布和删除后的清理要求；清理成功/结算 API、修复 CLI 尚未实现。必须分开保存：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事实\u003c/th>\n\u003cth>必要证明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>停止发布\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/document-lifecycle.md::%E6%98%BE%E5%BC%8F%E5%81%9C%E6%AD%A2%E5%BE%85%E5%8F%91%E5%B8%83%E4%B8%8A%E4%BC%A0\">关闭协议\u003c/a>与 TX B 共用门禁；不证明 PUT 已停/对象不存在/可退额度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>封闭写入、精确清理\u003c/td>\n\u003ctd>原 namespace/对象版本及阻止迟到写的持久证明，锁外执行、按原目标恢复，不前缀清空；DELETE/HEAD、DB lease、本地取消不够\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结算原占用\u003c/td>\n\u003ctd>有效执行权与清理证明同事务绑定原目标，只结算一次，commit 未知先读；不删审计、改发布回执或放行整项目删除\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>新协议绑定原 key/私有目标，保留 v1 摘要及旧严格响应，不补造未发布元数据。旧 UNCONDITIONAL_V1 另须全部旧 writer 停止与归属核验证据，不按等待时长自动收养。\u003c/p>\n\u003cp>服务端封闭前提不能由 client 条件 header 代替。当前 Compose 固定 MinIO 使用 \u003ca href=\"https://github.com/minio/minio/blob/RELEASE.2025-09-07T16-13-09Z/go.mod#L62\">policy v3.1.3\u003c/a>，\u003ca href=\"https://github.com/minio/pkg/blob/v3.1.3/policy/condition/keyname.go#L225\">条件键\u003c/a>不含 s3:if-none-match / s3:if-match，不能照搬 AWS 策略限制无条件写；\u003ca href=\"https://github.com/minio/minio/blob/RELEASE.2025-09-07T16-13-09Z/cmd/erasure-object.go#L1176\">PUT 条件检查\u003c/a>也未对读仲裁错误一律拒绝，不能认定未知时已封闭。\u003c/p>\n\u003cp>新 namespace 需受保护的服务端 marker、与旧 put/delete 隔离的权限、全对象版本保证；\u003ca href=\"https://github.com/minio/minio/blob/RELEASE.2025-09-07T16-13-09Z/internal/bucket/versioning/versioning.go#L91\">前缀/目录排除\u003c/a>使仅验 versioning=Enabled 不足。启动只核对已有 marker，不自动创建或以配置布尔值充当验收。服务端方案/故障验收后再接 Worker 重试、结算与恢复；长期占用是缺口。Run 副本、备份、退役另行评审，不改旧 ID/hash。\u003c/p>\n\u003ch2 id=\"页面与结果未知\">页面与结果未知\u003c/h2>\n\u003cp>目录上传依次独立 POST，选择时冻结 actor/Project、每份 UUID/File/路径，显示已发布、确定拒绝、未知、未发送。确定文件拒绝可继续；未知或资格拒绝暂停，剩余不发送。取消、30 秒期限、损坏成功响应、断连均不撤回操作或自动重发。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>恢复门禁\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>真实批次上传未知\u003c/td>\n\u003ctd>人工 GET 原 key；PENDING/404/503/取消不解除，原 PUBLISHED 确认后仍须显式继续未发送项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>真实批次关闭未知\u003c/td>\n\u003ctd>只查本次原 key 的独立 closure；合法 CLOSED 后标记关闭，再人工继续；发布冲突须另查 PUBLISHED\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手工原 key 只读查询\u003c/td>\n\u003ctd>可取消/结束/换 key；不造 POST/File/假批次，不替代真实批次核对或解除其未知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>刷新/新会话后的独立关闭\u003c/td>\n\u003ctd>手工确认原 key 为 PENDING 后显式发起；成功只结束独立操作，不恢复旧批次；有真实未知批次时不另关其他 key\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除未知\u003c/td>\n\u003ctd>GET 原 ID；合法元数据或明确 document_not_found 404 仅确认目录事实，仍须人工解除；Project 404、401/403 不算核对成功\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>原 UUID 可复制或刷新后手输只读恢复；File、正文、Cookie/CSRF 不进浏览器存储，不承诺恢复旧批次或重传丢失文件。列表/同名项不替代回执，关闭不自动删文档。新会话可查询、不能重放旧写入；归档只读。\u003c/p>\n\u003cp>手工查询与真实批次独立，退出/成功均不消费批次 File、未发送项或未知。新批次动作、关闭确认/提交/核对、删除确认同步作废旧查询；取消/换 key 的晚到成功或 401 不影响新操作。\u003c/p>\n\u003cp>上传/删除共用同步写门禁，确认删除期间也不得上传，删除 B 不中断 A。仅合法 204 结束删除等待，不宣称完整清理；异常 2xx 同样未知。人工解除不重发，列表/预览/同名重传不换原 ID。\u003c/p>\n\u003cp>换 actor/会话/CSRF/Project、离页均隔离旧响应；删除未知不承诺跨刷新恢复。资格通知必须属于当前请求且未过绝对期限，同一 owner 只通知一次失效。归档仅关闭写入，不覆盖既有身份/归属拒绝或阻止授权原 ID/key 读取；核对失败结束等待但保留未知。\u003c/p>\n\u003cp>client 校验 UUID、带时区时间、checksum、安全整数、字段白名单、原 Project/ID；原上传另核 key/state/回执。三语不展示内部错误，未来分页须标明已加载范围。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>入口：\u003ca href=\"../SKM/backend/src/skillmind/api/routes/documents.py\">documents route\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/storage\">存储\u003c/a>、\u003ca href=\"../SKM/web/src/components/DocumentManagerPanel.tsx\">管理组件\u003c/a>、\u003ca href=\"#SKM/README.md::contracts\">契约\u003c/a>，排障见\u003ca href=\"#docs/operations/runbook.md::%E6%96%87%E6%A1%A3%E4%BF%9D%E5%AD%98%E4%B8%8E%E5%88%A0%E9%99%A4%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">Runbook\u003c/a>。\u003c/p>\n\u003cp>重点验证配额/同名/撤权/归档/引用竞争及回滚；PUT/commit/响应边界失败、重启原意图确认；S3 拒绝/超时/缺失/篡改、MIME/大文件/Unicode；目录部分成功、防重/切换、三语/键盘/窄屏。历史引用/副本/备份保持原身份；真实 DB/bucket 与会话验收只使用获准专用目标，不由 mock 或文档检查替代。\u003c/p>\n", "sections": [{"title": "项目文档的保存、读取与清理", "level": "h1", "anchor": "项目文档的保存读取与清理", "text": "# 项目文档的保存、读取与清理\n\n本页负责文档资产；[资源快照](resource-snapshots.md)负责 Run 冻结/副本，[项目生命周期](project-lifecycle.md)负责整项目操作。当前缺口见[计划 R01/R10/R11](../planning/roadmap.md)，下述局部实现不代表完整存储可靠性。"}, {"title": "一个例子：列表消失不等于清理完成", "level": "h2", "anchor": "一个例子列表消失不等于清理完成", "text": "## 一个例子：列表消失不等于清理完成\n\nA 的 document ID/hash 被 Run 冻结后，删除元数据再删 blob 是两步；同路径重传 A′ 会产生新 ID，不能修复原引用。目录、存储字节、冻结引用、物化副本须分别确认：列表消失不证明清理，Run 显示引用不证明可下载，删除报错不证明元数据回滚。"}, {"title": "身份、目录与公开面", "level": "h2", "anchor": "身份目录与公开面", "text": "## 身份、目录与公开面\n\nProjectDocument 元数据在 PostgreSQL，内部 storage_key 定位 blob。document_id 是身份，folder/name 仅展示路径；同 Project/路径唯一、不按内容去重。无覆盖、移动、改名、版本或恢复 API；目录由 folder 投影，不保存空目录。\n\n| 操作 | 语义 |\n| --- | --- |\n| POST documents | 原 Idempotency-Key + 单 file/可选 folder；201 原发布元数据，同名 409 document_conflict |\n| GET document-uploads/{upload_key} | 原 actor/Project 上传记录；PENDING 未确认发布，PUBLISHED 返回历史回执，不是当前目录 |\n| POST / GET document-uploads/{upload_key}/closure | 原作者显式停止发布 / 查询关闭回执；不停止 PUT、删 blob 或退配额 |\n| GET documents / document | 完整数组按 folder/name 排序 / Project + 原 ID 当前元数据；无分页/Folder 契约，不是删除回执 |\n| GET document content | 精确 ID 授权并核验实际 size/hash 后返回附件，不公开 blob URL |\n| DELETE document | 元数据 commit 后尝试删 blob；204 不保证完整清理 |\n\n公开字段仅身份、路径、size/MIME/checksum、上传者/时间；读用 ProjectReadActor，写用要求 ACTIVE 的 ProjectWriteActor，越权/不存在统一 404，已处理响应 no-store。上传、原请求查询和删除另经业务事务复核当前会话/Project/成员。"}, {"title": "存储归属与配置切换", "level": "h3", "anchor": "存储归属与配置切换", "text": "### 存储归属与配置切换\n\n0037 为新文档保存 namespace UUID、非秘密连接描述 checksum、后端持久性；与 key 一起传递，不进入公开元数据/Run 清单。PUT 前后及发布前复核，下载/冻结读取/删除只用原身份匹配的已配置 client，不由 DB 构造 endpoint 或凭据。\n\nS3 的 SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID 是存储世代 UUID：同原存储的 API/Worker 一致，重建必须换 UUID。摘要含规范化 HTTP(S) endpoint、bucket、固定空前缀，不含凭据，轮换不改身份；endpoint 拒绝 userinfo、路径前缀、query、fragment、含糊 authority。memory 每实例独立非持久身份。\n\n未配置、归属不符或旧行未绑定，blob 操作为 503 document_storage_unavailable，列表/精确元数据仍可读；删除须在改元数据前拒绝。0037 不以当前配置回填旧 ID/key/hash，旧资产核验/归属迁移工具尚未实现。\n\n配置 UUID 不是服务端 bucket 身份证明；同地址重建误复用 UUID、对象篡改/版本和迟到 PUT 仍需 marker/精确清理协议。当前只解析单 namespace，SkillSource 等消费者未接持久归属。"}, {"title": "上传的三个边界", "level": "h2", "anchor": "上传的三个边界", "text": "## 上传的三个边界\n\n[入口](../../SKM/backend/src/skillmind/api/routes/documents.py)先验 Origin/CSRF、会话与 Project，再读 multipart，不用 dependency 前解析正文的 File/Form。只允许一个 file、可选一个 folder；重复/未知字段、类型混用、不完整结束返回 422 invalid_document_upload。\n\n现有 multipart 引擎流式解析，不建临时文件/后台写线程。实际文件 bytes 受配置上限约束，整请求最多上限 + 16 KiB，header 合计 16 KiB、folder 1,024 bytes；分块、缺失/低报 Content-Length、epilogue 均计数，追加 buffer 前超限返回 413 document_upload_too_large。filename/folder 严格 UTF-8，拒绝歧义/扩展参数和压缩 envelope；业务另限字符数。\n\n完成后交付不可变 bytes，断连/取消直接传播。每请求有界不等于全进程内存、并发、慢请求或代理预算。"}, {"title": "上传的授权事务", "level": "h3", "anchor": "上传的授权事务", "text": "### 上传的授权事务\n\n[DocumentService](../../SKM/backend/src/skillmind/documents/service.py)首次 await 前复制正文，规范化路径并验大小/MIME/文本策略：\n\n| 阶段 | 提交边界 |\n| --- | --- |\n| TX A | 原授权/ACTIVE 下按 actor/Project/key 查意图；首次才验目录/待发布路径/配额，保存原意图与占用并 commit |\n| 锁外 PUT | 仅确认首次预约 commit 的调用可 application PUT 一次；同键重发/提交未知不 PUT，回执须匹配原 key/size/MIME/hash |\n| TX B | 同一原授权、未关闭预约、ACTIVE/最新占用下创建元数据与 PUBLISHED 回执，flush/最终授权后 commit，返回 201 |\n\n两个事务锁序均为 Organization UPDATE → User SHARE → 原 AuthSession UPDATE → Project/成员 SHARE。等锁、读取、flush 后取新时间复核原会话，不换同用户新登录；上传者从原 access 取得。撤销/到期、停用/移除成员、归档/项目删除后不得发布；存储 I/O 不持上述锁。\n\n| 校验 | 保证范围 |\n| --- | --- |\n| 默认单文件 25 MiB、Project 500 MiB | 占用 = 全部上传意图 + 未关联旧元数据 + 未关联旧清理记录 size，不是 bucket 实际字节 |\n| 名称/folder 最多 200 字符 | 名称另受共享 key 单段 128 限制；129–200 在 PUT 前 422 invalid_document_name，不截断 |\n| MIME allowlist、指定文本凭据扫描 | 仅申报类型/指定文本，不证明真实格式、病毒安全或任意二进制脱敏 |\n| 组织 gate | PUT 前预约，发布不双计；旧负 size 拒绝不抵扣，PENDING 路径阻止同名新 PUT |\n| 唯一约束 | 仅精确路径冲突映射 document_conflict；其他 DB 异常不冒充同名，PUT 后失败保留意图与可能对象 |\n\nUNCONDITIONAL_V1 的一次 application PUT 不等于一次 wire PUT，仍可能 SDK 重试/multipart/迟到写。拒绝、取消、存储错误、commit 未知均不补偿删除或释放占用。\n\n路径冲突返回前复核期限；failed flush 只以锁内授权副本作拒绝分类，禁止失效 ORM 隐式查询或凭副本续写。上述门禁限本版 writer，不覆盖任意 SQL/旧实例。"}, {"title": "原上传身份与查询", "level": "h3", "anchor": "原上传身份与查询", "text": "### 原上传身份与查询\n\nIdempotency-Key 必须单个非 nil UUID；缺失/重复/非法在授权后、正文前返回 422 invalid_document_upload_key。0038 的原意图绑定组织/Project/actor/key、服务器 request UUID、原会话、规范化输入摘要、目标 document ID、namespace/key、占用/时间，不存正文/凭据。摘要含协议版、组织/Project/actor、folder/name、size/MIME/hash，不含后来请求或会话 ID。\n\n| 原记录 | 同键 POST / GET |\n| --- | --- |\n| 无 | POST 可预约；GET 404 document_upload_not_found 不证明旧请求以后不会提交 |\n| PENDING | 同内容 POST 409 document_upload_pending，已关闭为 document_upload_closed，均不 PUT；GET 200、document=null，不断言对象有无 |\n| PUBLISHED | 同内容 POST 原 201，GET 原九字段回执；文档后来删除不改回执、不重建目录 |\n| 同 key 不同摘要 | POST 409 document_upload_key_conflict，无新占用/PUT |\n| 损坏/不可核实 | 503 document_upload_unavailable，不补造事实 |\n\nPOST 重放仍验当前接收策略/ACTIVE，但不要求存储可达或重新计费。GET 不复验文件策略，允许同 actor 新有效会话和授权归档，不允许其他 actor（含 ADMIN）查询；查到/未中/拒绝都过最终授权。不以文件名或列表推断原请求结果。\n\n意图不自动过期/删除；已发布或元数据已删仍保留占用，不代表副本/备份/孤立对象/历史版本已精确计量。无响应、metadata 删除或一次对象不存在均不足以结算。0038 不补造旧上传历史，任意意图/关联阻止降级。"}, {"title": "显式停止待发布上传", "level": "h3", "anchor": "显式停止待发布上传", "text": "### 显式停止待发布上传\n\n原作者向原 Project/key POST closure，正文必须为 {\"confirmation\":\"STOP_PUBLICATION\"}；按上传事务复核当前会话/CSRF/ACTIVE/成员。同 actor 新会话可关闭但不接管旧 PUT，ADMIN 不代关他人 key。\n\n| 竞争结果 | 响应 |\n| --- | --- |\n| 关闭先提交 | 首次 201、同目标重放 200，原回执不变；TX A/TX B 拒绝 document_upload_closed |\n| 发布先提交 | 409 document_upload_already_published，不改发布回执或自动删文档 |\n| 关闭提交未知 | GET 同 URL；200 才确认，404 document_upload_closure_not_found 不证明旧 POST 不会提交，不自动重发 |\n\n[独立回执](../../SKM/contracts/documents/v1/upload-closure.schema.json)严格包含 upload_key、project_id、document_id、closed_at、publication_state=CLOSED，不扩旧五字段响应。原上传仍为 PENDING/null，不补发布日期。GET 按原作者当前只读授权，可新会话/归档，全部路径过最终门禁。\n\n0042 原子保存 publication_closed_at 和 document_upload_closures 审计；独立 checksum 绑定原 key、私有目标、原作者/request/session/时间/内容及本次关闭身份，不改 v1 摘要、不存正文。缺失/孤立/不匹配为 document_upload_unavailable，不补签。\n\n关闭释放展示路径给新 key/ID，但保留原占用、意图、关闭审计与对象身份。DB CHECK 阻止关闭后 PUBLISHED，能使忽略新列的旧发布 SQL 回滚，却不能阻止旧 PUT 或代替全实例停写。任意关闭标记/审计阻止 0042 降级。"}, {"title": "读取、下载与预览", "level": "h2", "anchor": "读取下载与预览", "text": "## 读取、下载与预览\n\n普通下载和冻结读取共用实际字节校验：按原 ID 取元数据，锁外读对象，size/SHA-256 一致才返回完整内容；冻结另比原快照 ID/路径/MIME/hash，不以同路径新文件替代。\n\nS3 同一次 GET 最多读取声明 size + 1 bytes，不先 stat；连接/读取/关闭在线程内，线程自行关闭响应。取消等待不证明线程/远端已停，也不等于全服务内存/并发/网络 deadline。\n\n| 结果 | 响应 |\n| --- | --- |\n| 元数据不存在/越权 | 404，不通过存储枚举补身份 |\n| 原 blob 缺失 | 409 document_content_missing，不同名补齐 |\n| 实际 size/hash 不符、元数据非法 | 409 document_content_invalid，无部分返回或重算保存 hash |\n| 归属未绑定/不符、S3 拒绝/读取故障 | 静态 503 document_storage_unavailable，不暴露 namespace/key/SDK 错误 |\n\n附件带 no-store、nosniff、安全 Content-Disposition；合法 MIME 保留，非法降 octet-stream。文件名用单段 ASCII fallback + UTF-8 filename*，不拼原引号/控制字符，不改 DB 原名。\n\nWeb 预览仅 txt/md/markdown/htm/html，最多 1,000,000 实际 bytes，只接受 200，错误正文也有界。列表 size 仅作按钮提示，Content-Length 不可信；超限停止并提示下载，不显示截断片段，UTF-8 错误明确拒绝。\n\n文本/Markdown 保留原文；HTML 在无浏览上下文 template 解析，只重建静态结构白名单，无脚本、上传 CSS、表单/frame、外部资源、URL/事件属性；图片留 alt、链接留文本。超过 20,000 节点安全显示原文，不递归截断。\n\nsrcDoc 正文前设置[默认拒绝 CSP](https://www.w3.org/TR/CSP3/#meta-element)，仅允许平台固定 CSS；iframe sandbox=\"\"、no-referrer。页面说明主动内容已移除、原文件仍可下载；这不是 generated Host，也不保证其他应用打开原文件安全。\n\n预览读取期限 30 秒；关闭/同 tick 换文件、换 actor/会话/Project 立即作废旧请求，晚到正文/401 不影响新上下文。当前 401/403/Project 404 关闭写资格，列表刷新不重开，预览不解除未知删除。"}, {"title": "删除与历史引用", "level": "h2", "anchor": "删除与历史引用", "text": "## 删除与历史引用\n\n0039 在原授权/引用/归属检查后，同事务保存独立清理要求、关联意图的 cleanup_requested_at，再删元数据；commit 后才尝试删同 namespace 原 key。失败可留 blob，重删原 ID 得 404；持久要求不是清理回执或异步重试。\n\n清理要求保存原 ID/元数据/namespace/key、本次 DELETE 组织/actor/request/session/时间，无凭据：\n\n| 来源 | 占用与历史 |\n| --- | --- |\n| UPLOAD_INTENT_V1 | 关联原意图，不双计 |\n| LEGACY_UNVERIFIED | 旧元数据 size 原子转入清理占用，不造 upload key/会话/停止证明 |\n\n未绑定、不安全或损坏目标仍在删除前拒绝，不用当前配置补齐。新旧元数据删除、要求和关联更新原子提交，PUBLISHED 回执不变；任意清理要求阻止 0039 降级。\n\n文档不进入整项目配置批删；任意文档/意图/清理记录均触发 project_delete_blocked_by_document_uploads，不能清空审计/占用释放项目。\n\nS3 get/stat/exists/delete 仅明确 NoSuchKey/NoSuchObject 算不存在；NoSuchBucket、AccessDenied、SDK/HTTP/连接故障均不可用。PUT 失败/取消不证明无写入或已停止；上传/删除存储故障为静态 503，页面仍按未知处理。204 不证明历史版本、在途 PUT 或所有字节清理，SDK 重试/multipart/无条件 PUT 尚未被封闭。"}, {"title": "删除事务与引用判定", "level": "h3", "anchor": "删除事务与引用判定", "text": "### 删除事务与引用判定\n\n```text\nOrganization UPDATE → User SHARE → 原 AuthSession UPDATE\n  → Project/成员 SHARE → 原 Document UPDATE\n  → 历史引用 → 关联 Upload UPDATE/标记清理\n  → 独立 Cleanup（旧占用转入）→ 删除元数据\n  → flush → 最终授权 → commit → 锁外删原 blob\n```\n\n只用原 cookie/CSRF、服务器 request UUID，不选新会话。等锁、引用读取和最终 flush 后复核；失效回滚。DB 异常、取消、commit 未知不调用 blob 删除、不自动重发。\n\n| 保存事实 | 引用判定 |\n| --- | --- |\n| 任意状态 Run 的可信文档快照 | 原请求/Project/槽位/成员/hash 一致后保护冻结 ID；终态/已存副本不解除 |\n| 任意状态 Schedule 的 SINGLE/SET | 保护显式原 ID，暂停/归档/未触发不解除 |\n| 保留 occurrence 的 SINGLE/SET | 校验原快照/checksum/索引/父身份；旧配置、SETTLED 无 Run 审计仍保护 |\n| Schedule/occurrence 动态 ALL | 未展开规则不永久占当前目录；已建 Run 只保护冻结成员 |\n| 原可选槽未选、合法无文档 Run | 无引用；任意输入 UUID 不算引用 |\n| 旧 provider 含义不明、快照缺损 | 409 document_references_unavailable，不当空集合 |\n\n精确引用为 409 document_in_use，不公开引用正文/ID。仅扫相关 Project，不以“有任意 Run”代判，不回写旧数据/hash；扫描成本和真实并发仍待验。\n\n新建 Run、调度保存、删除共用 Organization gate；调度创建/编辑锁内重验元数据，防止锁外验证后被删。认领只在 Schedule 锁内复制配置，不反向取组织锁；已有输入回执/工作区/Evidence 沿冻结来源派生，不扩权。旧 writer/任意 SQL/混跑不受此保证。"}, {"title": "持久清理仍待补齐", "level": "h3", "anchor": "持久清理仍待补齐", "text": "### 持久清理仍待补齐\n\n已实现独立停止发布和删除后的清理要求；清理成功/结算 API、修复 CLI 尚未实现。必须分开保存：\n\n| 事实 | 必要证明 |\n| --- | --- |\n| 停止发布 | [关闭协议](#显式停止待发布上传)与 TX B 共用门禁；不证明 PUT 已停/对象不存在/可退额度 |\n| 封闭写入、精确清理 | 原 namespace/对象版本及阻止迟到写的持久证明，锁外执行、按原目标恢复，不前缀清空；DELETE/HEAD、DB lease、本地取消不够 |\n| 结算原占用 | 有效执行权与清理证明同事务绑定原目标，只结算一次，commit 未知先读；不删审计、改发布回执或放行整项目删除 |\n\n新协议绑定原 key/私有目标，保留 v1 摘要及旧严格响应，不补造未发布元数据。旧 UNCONDITIONAL_V1 另须全部旧 writer 停止与归属核验证据，不按等待时长自动收养。\n\n服务端封闭前提不能由 client 条件 header 代替。当前 Compose 固定 MinIO 使用 [policy v3.1.3](https://github.com/minio/minio/blob/RELEASE.2025-09-07T16-13-09Z/go.mod#L62)，[条件键](https://github.com/minio/pkg/blob/v3.1.3/policy/condition/keyname.go#L225)不含 s3:if-none-match / s3:if-match，不能照搬 AWS 策略限制无条件写；[PUT 条件检查](https://github.com/minio/minio/blob/RELEASE.2025-09-07T16-13-09Z/cmd/erasure-object.go#L1176)也未对读仲裁错误一律拒绝，不能认定未知时已封闭。\n\n新 namespace 需受保护的服务端 marker、与旧 put/delete 隔离的权限、全对象版本保证；[前缀/目录排除](https://github.com/minio/minio/blob/RELEASE.2025-09-07T16-13-09Z/internal/bucket/versioning/versioning.go#L91)使仅验 versioning=Enabled 不足。启动只核对已有 marker，不自动创建或以配置布尔值充当验收。服务端方案/故障验收后再接 Worker 重试、结算与恢复；长期占用是缺口。Run 副本、备份、退役另行评审，不改旧 ID/hash。"}, {"title": "页面与结果未知", "level": "h2", "anchor": "页面与结果未知", "text": "## 页面与结果未知\n\n目录上传依次独立 POST，选择时冻结 actor/Project、每份 UUID/File/路径，显示已发布、确定拒绝、未知、未发送。确定文件拒绝可继续；未知或资格拒绝暂停，剩余不发送。取消、30 秒期限、损坏成功响应、断连均不撤回操作或自动重发。\n\n| 操作 | 恢复门禁 |\n| --- | --- |\n| 真实批次上传未知 | 人工 GET 原 key；PENDING/404/503/取消不解除，原 PUBLISHED 确认后仍须显式继续未发送项 |\n| 真实批次关闭未知 | 只查本次原 key 的独立 closure；合法 CLOSED 后标记关闭，再人工继续；发布冲突须另查 PUBLISHED |\n| 手工原 key 只读查询 | 可取消/结束/换 key；不造 POST/File/假批次，不替代真实批次核对或解除其未知 |\n| 刷新/新会话后的独立关闭 | 手工确认原 key 为 PENDING 后显式发起；成功只结束独立操作，不恢复旧批次；有真实未知批次时不另关其他 key |\n| 删除未知 | GET 原 ID；合法元数据或明确 document_not_found 404 仅确认目录事实，仍须人工解除；Project 404、401/403 不算核对成功 |\n\n原 UUID 可复制或刷新后手输只读恢复；File、正文、Cookie/CSRF 不进浏览器存储，不承诺恢复旧批次或重传丢失文件。列表/同名项不替代回执，关闭不自动删文档。新会话可查询、不能重放旧写入；归档只读。\n\n手工查询与真实批次独立，退出/成功均不消费批次 File、未发送项或未知。新批次动作、关闭确认/提交/核对、删除确认同步作废旧查询；取消/换 key 的晚到成功或 401 不影响新操作。\n\n上传/删除共用同步写门禁，确认删除期间也不得上传，删除 B 不中断 A。仅合法 204 结束删除等待，不宣称完整清理；异常 2xx 同样未知。人工解除不重发，列表/预览/同名重传不换原 ID。\n\n换 actor/会话/CSRF/Project、离页均隔离旧响应；删除未知不承诺跨刷新恢复。资格通知必须属于当前请求且未过绝对期限，同一 owner 只通知一次失效。归档仅关闭写入，不覆盖既有身份/归属拒绝或阻止授权原 ID/key 读取；核对失败结束等待但保留未知。\n\nclient 校验 UUID、带时区时间、checksum、安全整数、字段白名单、原 Project/ID；原上传另核 key/state/回执。三语不展示内部错误，未来分页须标明已加载范围。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n入口：[documents route](../../SKM/backend/src/skillmind/api/routes/documents.py)、[存储](../../SKM/backend/src/skillmind/storage/)、[管理组件](../../SKM/web/src/components/DocumentManagerPanel.tsx)、[契约](../../SKM/README.md#contracts)，排障见[Runbook](../operations/runbook.md#文档保存与删除的只读分诊)。\n\n重点验证配额/同名/撤权/归档/引用竞争及回滚；PUT/commit/响应边界失败、重启原意图确认；S3 拒绝/超时/缺失/篡改、MIME/大文件/Unicode；目录部分成功、防重/切换、三语/键盘/窄屏。历史引用/副本/备份保持原身份；真实 DB/bucket 与会话验收只使用获准专用目标，不由 mock 或文档检查替代。"}], "toc": [{"title": "一个例子：列表消失不等于清理完成", "anchor": "一个例子列表消失不等于清理完成", "level": "h2"}, {"title": "身份、目录与公开面", "anchor": "身份目录与公开面", "level": "h2"}, {"title": "存储归属与配置切换", "anchor": "存储归属与配置切换", "level": "h3"}, {"title": "上传的三个边界", "anchor": "上传的三个边界", "level": "h2"}, {"title": "上传的授权事务", "anchor": "上传的授权事务", "level": "h3"}, {"title": "原上传身份与查询", "anchor": "原上传身份与查询", "level": "h3"}, {"title": "显式停止待发布上传", "anchor": "显式停止待发布上传", "level": "h3"}, {"title": "读取、下载与预览", "anchor": "读取下载与预览", "level": "h2"}, {"title": "删除与历史引用", "anchor": "删除与历史引用", "level": "h2"}, {"title": "删除事务与引用判定", "anchor": "删除事务与引用判定", "level": "h3"}, {"title": "持久清理仍待补齐", "anchor": "持久清理仍待补齐", "level": "h3"}, {"title": "页面与结果未知", "anchor": "页面与结果未知", "level": "h2"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/document-lifecycle.md", "checksum": "936671be3ecf8868aff064763bc67ba945ee175d3530533dad66e79a5bdd9a73"}, {"id": "docs/design/authentication.md", "title": "认证、会话与项目授权", "group": "design", "html": "\u003ch1 id=\"认证会话与项目授权\">认证、会话与项目授权\u003c/h1>\n\u003cp>本页负责浏览器身份和授权入口；\u003ca href=\"#docs/design/login-protection.md::\">登录防护\u003c/a>、\u003ca href=\"#docs/design/user-lifecycle.md::\">用户管理\u003c/a>、\u003ca href=\"#docs/design/secret-storage.md::\">外部 Secret\u003c/a>分别维护独立协议。当前交付缺口见\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清四类凭据\">先分清四类凭据\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>凭据\u003c/th>\n\u003cth>用途与边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>login CSRF challenge\u003c/td>\n\u003ctd>登录前正文与短时 HttpOnly cookie 配对，Redis 一次性消费；不是会话\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>session token\u003c/td>\n\u003ctd>HttpOnly cookie 携带；服务端仅保存 hash，Web 不读取原值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>session CSRF token\u003c/td>\n\u003ctd>当前会话的写请求 header；Web 仅在内存保存，不能单独证明身份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Provider Secret\u003c/td>\n\u003ctd>只交受控 Provider 使用，不授予额外 Tool 权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"威胁边界与目标\">威胁边界与目标\u003c/h2>\n\u003cul>\n\u003cli>独立账号体系，当前只支持一个 Organization。email 唯一键含组织，但登录只按 email 查询；引入多组织前须先定义组织选择与查询隔离。\u003c/li>\n\u003cli>生产由共享 Traefik 提供 HTTPS；API/Web 同源，位于 SKILLMIND_CONTEXT_PATH 下。浏览器不持有长期 Bearer token，不将会话存入 Local/Session Storage。\u003c/li>\n\u003cli>PostgreSQL 保存用户、会话、成员与审计；Redis 仅承载登录防护等短期状态。\u003c/li>\n\u003cli>当前不提供 OAuth/OIDC、API token、找回密码、邮件验证或 MFA；受控内部部署的边界不能直接推广到公网。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"密码认证\">密码认证\u003c/h2>\n\u003cp>email 标准化后在组织内唯一。不存在、停用和密码错误统一为 invalid_credentials；配额、防护不可用、CSRF 和结构错误保持各自语义，见\u003ca href=\"#docs/design/login-protection.md::%E5%85%AC%E5%BC%80%E5%93%8D%E5%BA%94%E4%B8%8E%E5%AE%A2%E6%88%B7%E7%AB%AF%E8%B4%A3%E4%BB%BB\">登录错误\u003c/a>。\u003c/p>\n\u003cp>密码允许 Unicode、空格和密码管理器值：至少 8 字符，UTF-8 最多 1,024 bytes，不强制字符组合。使用 Argon2id（19 MiB、iterations 2、parallelism 1），只保存 PHC hash；成功登录按需 rehash。密码、完整 session/CSRF 不进入日志、Problem、审计或 fixture。\u003c/p>\n\u003cp>策略依据：\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html\">密码存储\u003c/a>、\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html\">认证建议\u003c/a>。项目参数仍需结合部署容量验证。\u003c/p>\n\u003ch2 id=\"浏览器会话\">浏览器会话\u003c/h2>\n\u003cp>登录使用至少 256 bit 随机 opaque token，数据库保存 \u003ccode>sha256:\u0026lt;hex\u0026gt;\u003c/code>。生产 cookie 为 \u003ccode>__Host-skillmind_session\u003c/code>，固定 \u003ccode>Secure; HttpOnly; SameSite=Strict; Path=/\u003c/code>，无 Domain；非 Secure 开发设置不能带入生产。\u003c/p>\n\u003cp>默认 idle 30 分钟，absolute 12 小时，ADMIN absolute 8 小时；idle 写入按 5 分钟节流且不超过 absolute 截止。每次登录创建新 token，不自动撤销其他登录。认证仍锁行，节流不等于无锁。\u003c/p>\n\u003ch3 id=\"会话失效与权限变化\">会话失效与权限变化\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>登出\u003c/td>\n\u003ctd>Origin/CSRF 通过后持久写 revoked_at，再删除 cookie\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>停用、角色变化、改密、主动撤销\u003c/td>\n\u003ctd>用户管理事务撤销旧会话；重新启用或改回角色不能复活它们\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前角色与登录快照不同\u003c/td>\n\u003ctd>v2 读写均拒绝；仅比较当前角色不能代替持久撤销\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>锁等待期间过期\u003c/td>\n\u003ctd>User → AuthSession 取锁后再取时间，检查状态、撤销、idle/absolute 期限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>密码 hash 改变不自动使会话失效，必须走管理用例。撤销也不改写 Run permission snapshot，更不证明已有 SSE/进程已停止，见\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a>。\u003c/p>\n\u003ch2 id=\"csrf-与同源约束\">CSRF 与同源约束\u003c/h2>\n\u003cp>非安全方法同时验证 Origin 与 synchronizer CSRF；SameSite 只是纵深防御。登录前 challenge 经 header/cookie 配对后以 Redis GETDEL 消费，每次重试重新获取；登录后写请求仅通过 X-CSRF-Token 提交会话 CSRF，不能混用两种凭据。\u003c/p>\n\u003cp>GET/SSE 不触发业务命令，但认证可能更新 idle，login-context 会保存 challenge；不能作为无持久副作用的健康检查。只信任明确配置的代理，不直接相信任意 X-Forwarded-*。\u003c/p>\n\u003ch3 id=\"会话读取与多页面\">会话读取与多页面\u003c/h3>\n\u003cp>同一有效 session 的各页面读取相同 CSRF；重新登录换 cookie 后，旧 token 不再适用。稳定凭据不等于跨标签同步或重试协议：CSRF 失败先核对 actor/Project 与原提交事实，不自动重放创建、批准或外部写入，Web 不自行派生 token。\u003c/p>\n\u003ch3 id=\"会话凭据-v2-与切换要求\">会话凭据 v2 与切换要求\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/auth/domain.py\">auth/domain.py\u003c/a>定义内部凭据协议，不改变公开 SessionResponse 版本：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>固定值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>session\u003c/td>\n\u003ctd>sm2. + 32 随机 bytes 的无填充 base64url，47 ASCII 字符\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HKDF 输入\u003c/td>\n\u003ctd>完整 session 原值的 ASCII bytes，不是数据库 hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>派生\u003c/td>\n\u003ctd>SHA-256，32 bytes，salt=None，info=skillmind.auth.session-csrf/v2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CSRF\u003c/td>\n\u003ctd>csrf2. + 派生值的无填充 base64url，49 ASCII 字符\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保存\u003c/td>\n\u003ctd>session/CSRF 各自 hash；不存明文或可逆 token 密文\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>使用 cryptography HKDF；固定用途标记和默认 salt 遵循 \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5869\">RFC 5869\u003c/a>。方案依赖 session 随机性与保密性，不能降低 cookie 被窃风险。\u003c/p>\n\u003cp>新登录保存 credential_version=2 与 system_role_at_login；数据库默认仍为 1，以识别旧写入方。认证校验格式后锁 User/AuthSession，锁后检查期限、撤销、用户状态、协议、角色和派生 hash；损坏/未知版本 fail closed，无旧格式 fallback。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/backend/migrations/versions/0031_auth_session_credentials.py\">0031 migration\u003c/a>标记并撤销旧活动会话，要求重新登录，不迁移旧随机 CSRF。任何 v2 行存在时均拒绝 downgrade 丢列。新旧 API 不混跑，不删除审计绕过回退限制；上线见\u003ca href=\"#docs/operations/deployment.md::%E4%BC%9A%E8%AF%9D%E5%8D%8F%E8%AE%AE%E5%88%87%E6%8D%A2%E6%A3%80%E6%9F%A5\">会话切换\u003c/a>。\u003c/p>\n\u003ch3 id=\"缓存与代理\">缓存与代理\u003c/h3>\n\u003cp>auth-tag route 的已处理响应与登录防护路径设置 Cache-Control: no-store，Web auth client 同样禁止缓存；不外推到未处理异常、代理自产错误或全站。实际 HTTPS 入口仍须验收。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/api/auth_dependencies.py\">require_same_origin\u003c/a>比较 Origin 与代理恢复后的 scheme/host/port；context path 不属于 Origin。缺失 Origin 拒绝，不以关掉 Secure/CSRF 或信任全部代理解决配置错误。\u003c/p>\n\u003ch2 id=\"首个-admin-初始化\">首个 ADMIN 初始化\u003c/h2>\n\u003cp>仅受控交互 CLI，密码经 getpass，不进参数、环境或 shell history。锁 migration 创建的 Organization，存在任何 ADMIN 即拒绝；后续走\u003ca href=\"#docs/design/user-lifecycle.md::\">用户管理\u003c/a>，不以反复 bootstrap、匿名 HTTP、启动自动创建或 SQL 提权恢复账户。命令见\u003ca href=\"#docs/operations/quickstart.md::%E6%9C%80%E5%88%9D%E3%81%AE-admin-%E3%82%92%E4%BD%9C%E6%88%90%E3%81%99%E3%82%8B\">首次起动\u003c/a>，与会清空数据的近名 Make target 区分。\u003c/p>\n\u003ch2 id=\"权限判定\">权限判定\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">cookie + 写请求 Origin/CSRF\n  → 当前会话/用户/期限\n  → actor dependency：角色与 Project\n  → use case：目标所有权、版本、业务条件\n  → 执行边界：冻结权限、scope、Tool 与批准\n\u003c/code>\u003c/pre>\n\u003cp>ADMIN 管理本组织，USER 需 ACTIVE ProjectMember；不存在与越权资源统一 404。ProjectReadActor 可读获授权历史，ProjectWriteActor 另拒绝 ARCHIVED；ReadActor/WriteActor 本身不建立 Project 边界。\u003c/p>\n\u003cp>Run 创建冻结 actor、成员资格及 Skill/Tool 权限上限，不随后来权限修改。当前请求仍须重新授权，冻结上限不替代当前资格。外部批准另限制 Run 发起人或 system ADMIN；低风险预授权仅 ADMIN 配置，repository.write 不可预授权，见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。\u003c/p>\n\u003ch3 id=\"认证与业务提交不是同一个事务\">认证与业务提交不是同一个事务\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/auth/service.py\">AuthService\u003c/a>返回 actor 前已结束认证事务。业务用例须在自身锁等待后及最终提交门禁重验原请求；入口成功不证明提交时仍有资格。各用例的锁序、重复/未知结果和审计规则只在所属设计维护：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>授权对象\u003c/th>\n\u003cth>事务正本\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>账户、成员、项目\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/user-lifecycle.md::%E4%BA%8B%E5%8A%A1%E4%B8%8E%E5%B9%B6%E5%8F%91\">用户\u003c/a>、\u003ca href=\"#docs/design/project-lifecycle.md::%E6%88%90%E5%91%98%E7%AE%A1%E7%90%86%E7%9A%84%E7%8E%B0%E7%8A%B6%E4%B8%8E%E7%9B%AE%E6%A0%87\">成员\u003c/a>、\u003ca href=\"#docs/design/project-lifecycle.md::%E5%B9%B6%E5%8F%91%E4%BF%AE%E6%94%B9%E4%B8%8D%E8%83%BD%E5%8F%AA%E7%9C%8B%E6%9C%89%E6%97%A0%E8%A1%8C%E9%94%81\">项目 CRUD\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 与人工操作\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/run-creation.md::%E5%88%9B%E5%BB%BA%E4%B8%8E%E7%A1%AE%E8%AE%A4%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">创建/确认\u003c/a>、\u003ca href=\"#docs/design/user-interactions.md::%E9%A6%96%E6%AC%A1%E7%AD%94%E5%A4%8D%E4%B8%8E%E5%8E%9F%E7%AD%94%E5%A4%8D%E9%87%8D%E6%94%BE\">普通答复\u003c/a>、\u003ca href=\"#docs/design/results-evaluation.md::%E8%AF%84%E4%BB%B7%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">评价\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill 组织资产与项目配置\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/skill-interpretation.md::%E5%AF%BC%E5%85%A5%E4%BF%9D%E5%AD%98%E4%B8%8E%E4%B8%8A%E4%BC%A0%E6%8E%88%E6%9D%83\">导入\u003c/a>、\u003ca href=\"#docs/design/skill-interpretation.md::%E7%89%88%E6%9C%AC%E7%AE%A1%E7%90%86%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">版本管理\u003c/a>、\u003ca href=\"#docs/design/skill-contract.md::%E7%BB%84%E5%90%88%E4%BF%9D%E5%AD%98%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">组合\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>调度与文档\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/task-scheduling.md::%E7%AE%A1%E7%90%86%E5%86%99%E5%85%A5%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">调度管理\u003c/a>、\u003ca href=\"#docs/design/document-lifecycle.md::%E4%B8%8A%E4%BC%A0%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">上传\u003c/a>、\u003ca href=\"#docs/design/document-lifecycle.md::%E5%88%A0%E9%99%A4%E4%BA%8B%E5%8A%A1%E4%B8%8E%E5%BC%95%E7%94%A8%E5%88%A4%E5%AE%9A\">删除\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>新会话可按各协议人工查询原事实，不能恢复旧会话或接管旧写入；历史 Run/发布/上传回执不因当前授权而重写。\u003ca href=\"#docs/design/skill-interpretation.md::%E5%BC%82%E6%AD%A5%E8%A7%A3%E9%87%8A%E7%9A%84%E4%BA%A4%E6%8E%A5%E8%A6%81%E6%B1%82\">异步解释/Worker/SSE\u003c/a>尚未闭合原请求授权，其他业务与长连接也不能从上述局部实现推导立即停权。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>复用统一 actor 与凭据校验，接口变更同步\u003ca href=\"#SKM/README.md::contracts\">契约\u003c/a>、Web client 和回归。重点验证多页面/换账号不自动重放、拒绝不泄漏身份、撤销/登录与锁等待竞争、旧会话不复活，以及 0031、HTTPS/context path、cookie/no-store 和多实例代理信任。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/backend/tests/auth/test_session_service.py\">service 回归\u003c/a>与\u003ca href=\"../SKM/backend/tests/db/test_real_auth_sessions.py\">真实会话测试\u003c/a>分别举证；真实数据库须使用获准的专用目标。\u003c/p>\n", "sections": [{"title": "认证、会话与项目授权", "level": "h1", "anchor": "认证会话与项目授权", "text": "# 认证、会话与项目授权\n\n本页负责浏览器身份和授权入口；[登录防护](login-protection.md)、[用户管理](user-lifecycle.md)、[外部 Secret](secret-storage.md)分别维护独立协议。当前交付缺口见[计划 R05](../planning/roadmap.md#r05-领域与身份安全)。"}, {"title": "先分清四类凭据", "level": "h2", "anchor": "先分清四类凭据", "text": "## 先分清四类凭据\n\n| 凭据 | 用途与边界 |\n| --- | --- |\n| login CSRF challenge | 登录前正文与短时 HttpOnly cookie 配对，Redis 一次性消费；不是会话 |\n| session token | HttpOnly cookie 携带；服务端仅保存 hash，Web 不读取原值 |\n| session CSRF token | 当前会话的写请求 header；Web 仅在内存保存，不能单独证明身份 |\n| Provider Secret | 只交受控 Provider 使用，不授予额外 Tool 权限 |"}, {"title": "威胁边界与目标", "level": "h2", "anchor": "威胁边界与目标", "text": "## 威胁边界与目标\n\n- 独立账号体系，当前只支持一个 Organization。email 唯一键含组织，但登录只按 email 查询；引入多组织前须先定义组织选择与查询隔离。\n- 生产由共享 Traefik 提供 HTTPS；API/Web 同源，位于 SKILLMIND_CONTEXT_PATH 下。浏览器不持有长期 Bearer token，不将会话存入 Local/Session Storage。\n- PostgreSQL 保存用户、会话、成员与审计；Redis 仅承载登录防护等短期状态。\n- 当前不提供 OAuth/OIDC、API token、找回密码、邮件验证或 MFA；受控内部部署的边界不能直接推广到公网。"}, {"title": "密码认证", "level": "h2", "anchor": "密码认证", "text": "## 密码认证\n\nemail 标准化后在组织内唯一。不存在、停用和密码错误统一为 invalid_credentials；配额、防护不可用、CSRF 和结构错误保持各自语义，见[登录错误](login-protection.md#公开响应与客户端责任)。\n\n密码允许 Unicode、空格和密码管理器值：至少 8 字符，UTF-8 最多 1,024 bytes，不强制字符组合。使用 Argon2id（19 MiB、iterations 2、parallelism 1），只保存 PHC hash；成功登录按需 rehash。密码、完整 session/CSRF 不进入日志、Problem、审计或 fixture。\n\n策略依据：[密码存储](https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html)、[认证建议](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html)。项目参数仍需结合部署容量验证。"}, {"title": "浏览器会话", "level": "h2", "anchor": "浏览器会话", "text": "## 浏览器会话\n\n登录使用至少 256 bit 随机 opaque token，数据库保存 `sha256:\u003chex>`。生产 cookie 为 `__Host-skillmind_session`，固定 `Secure; HttpOnly; SameSite=Strict; Path=/`，无 Domain；非 Secure 开发设置不能带入生产。\n\n默认 idle 30 分钟，absolute 12 小时，ADMIN absolute 8 小时；idle 写入按 5 分钟节流且不超过 absolute 截止。每次登录创建新 token，不自动撤销其他登录。认证仍锁行，节流不等于无锁。"}, {"title": "会话失效与权限变化", "level": "h3", "anchor": "会话失效与权限变化", "text": "### 会话失效与权限变化\n\n| 情况 | 规则 |\n| --- | --- |\n| 登出 | Origin/CSRF 通过后持久写 revoked_at，再删除 cookie |\n| 停用、角色变化、改密、主动撤销 | 用户管理事务撤销旧会话；重新启用或改回角色不能复活它们 |\n| 当前角色与登录快照不同 | v2 读写均拒绝；仅比较当前角色不能代替持久撤销 |\n| 锁等待期间过期 | User → AuthSession 取锁后再取时间，检查状态、撤销、idle/absolute 期限 |\n\n密码 hash 改变不自动使会话失效，必须走管理用例。撤销也不改写 Run permission snapshot，更不证明已有 SSE/进程已停止，见[执行监督](run-supervision.md)。"}, {"title": "CSRF 与同源约束", "level": "h2", "anchor": "csrf-与同源约束", "text": "## CSRF 与同源约束\n\n非安全方法同时验证 Origin 与 synchronizer CSRF；SameSite 只是纵深防御。登录前 challenge 经 header/cookie 配对后以 Redis GETDEL 消费，每次重试重新获取；登录后写请求仅通过 X-CSRF-Token 提交会话 CSRF，不能混用两种凭据。\n\nGET/SSE 不触发业务命令，但认证可能更新 idle，login-context 会保存 challenge；不能作为无持久副作用的健康检查。只信任明确配置的代理，不直接相信任意 X-Forwarded-*。"}, {"title": "会话读取与多页面", "level": "h3", "anchor": "会话读取与多页面", "text": "### 会话读取与多页面\n\n同一有效 session 的各页面读取相同 CSRF；重新登录换 cookie 后，旧 token 不再适用。稳定凭据不等于跨标签同步或重试协议：CSRF 失败先核对 actor/Project 与原提交事实，不自动重放创建、批准或外部写入，Web 不自行派生 token。"}, {"title": "会话凭据 v2 与切换要求", "level": "h3", "anchor": "会话凭据-v2-与切换要求", "text": "### 会话凭据 v2 与切换要求\n\n[auth/domain.py](../../SKM/backend/src/skillmind/auth/domain.py)定义内部凭据协议，不改变公开 SessionResponse 版本：\n\n| 项目 | 固定值 |\n| --- | --- |\n| session | sm2. + 32 随机 bytes 的无填充 base64url，47 ASCII 字符 |\n| HKDF 输入 | 完整 session 原值的 ASCII bytes，不是数据库 hash |\n| 派生 | SHA-256，32 bytes，salt=None，info=skillmind.auth.session-csrf/v2 |\n| CSRF | csrf2. + 派生值的无填充 base64url，49 ASCII 字符 |\n| 保存 | session/CSRF 各自 hash；不存明文或可逆 token 密文 |\n\n使用 cryptography HKDF；固定用途标记和默认 salt 遵循 [RFC 5869](https://www.rfc-editor.org/rfc/rfc5869)。方案依赖 session 随机性与保密性，不能降低 cookie 被窃风险。\n\n新登录保存 credential_version=2 与 system_role_at_login；数据库默认仍为 1，以识别旧写入方。认证校验格式后锁 User/AuthSession，锁后检查期限、撤销、用户状态、协议、角色和派生 hash；损坏/未知版本 fail closed，无旧格式 fallback。\n\n[0031 migration](../../SKM/backend/migrations/versions/0031_auth_session_credentials.py)标记并撤销旧活动会话，要求重新登录，不迁移旧随机 CSRF。任何 v2 行存在时均拒绝 downgrade 丢列。新旧 API 不混跑，不删除审计绕过回退限制；上线见[会话切换](../operations/deployment.md#会话协议切换检查)。"}, {"title": "缓存与代理", "level": "h3", "anchor": "缓存与代理", "text": "### 缓存与代理\n\nauth-tag route 的已处理响应与登录防护路径设置 Cache-Control: no-store，Web auth client 同样禁止缓存；不外推到未处理异常、代理自产错误或全站。实际 HTTPS 入口仍须验收。\n\n[require_same_origin](../../SKM/backend/src/skillmind/api/auth_dependencies.py)比较 Origin 与代理恢复后的 scheme/host/port；context path 不属于 Origin。缺失 Origin 拒绝，不以关掉 Secure/CSRF 或信任全部代理解决配置错误。"}, {"title": "首个 ADMIN 初始化", "level": "h2", "anchor": "首个-admin-初始化", "text": "## 首个 ADMIN 初始化\n\n仅受控交互 CLI，密码经 getpass，不进参数、环境或 shell history。锁 migration 创建的 Organization，存在任何 ADMIN 即拒绝；后续走[用户管理](user-lifecycle.md)，不以反复 bootstrap、匿名 HTTP、启动自动创建或 SQL 提权恢复账户。命令见[首次起动](../operations/quickstart.md#最初の-admin-を作成する)，与会清空数据的近名 Make target 区分。"}, {"title": "权限判定", "level": "h2", "anchor": "权限判定", "text": "## 权限判定\n\n```text\ncookie + 写请求 Origin/CSRF\n  → 当前会话/用户/期限\n  → actor dependency：角色与 Project\n  → use case：目标所有权、版本、业务条件\n  → 执行边界：冻结权限、scope、Tool 与批准\n```\n\nADMIN 管理本组织，USER 需 ACTIVE ProjectMember；不存在与越权资源统一 404。ProjectReadActor 可读获授权历史，ProjectWriteActor 另拒绝 ARCHIVED；ReadActor/WriteActor 本身不建立 Project 边界。\n\nRun 创建冻结 actor、成员资格及 Skill/Tool 权限上限，不随后来权限修改。当前请求仍须重新授权，冻结上限不替代当前资格。外部批准另限制 Run 发起人或 system ADMIN；低风险预授权仅 ADMIN 配置，repository.write 不可预授权，见[受控写入](repository-effects.md)。"}, {"title": "认证与业务提交不是同一个事务", "level": "h3", "anchor": "认证与业务提交不是同一个事务", "text": "### 认证与业务提交不是同一个事务\n\n[AuthService](../../SKM/backend/src/skillmind/auth/service.py)返回 actor 前已结束认证事务。业务用例须在自身锁等待后及最终提交门禁重验原请求；入口成功不证明提交时仍有资格。各用例的锁序、重复/未知结果和审计规则只在所属设计维护：\n\n| 授权对象 | 事务正本 |\n| --- | --- |\n| 账户、成员、项目 | [用户](user-lifecycle.md#事务与并发)、[成员](project-lifecycle.md#成员管理的现状与目标)、[项目 CRUD](project-lifecycle.md#并发修改不能只看有无行锁) |\n| Run 与人工操作 | [创建/确认](run-creation.md#创建与确认的授权事务)、[普通答复](user-interactions.md#首次答复与原答复重放)、[评价](results-evaluation.md#评价的授权事务) |\n| Skill 组织资产与项目配置 | [导入](skill-interpretation.md#导入保存与上传授权)、[版本管理](skill-interpretation.md#版本管理的授权事务)、[组合](skill-contract.md#组合保存的授权事务) |\n| 调度与文档 | [调度管理](task-scheduling.md#管理写入的授权事务)、[上传](document-lifecycle.md#上传的授权事务)、[删除](document-lifecycle.md#删除事务与引用判定) |\n\n新会话可按各协议人工查询原事实，不能恢复旧会话或接管旧写入；历史 Run/发布/上传回执不因当前授权而重写。[异步解释/Worker/SSE](skill-interpretation.md#异步解释的交接要求)尚未闭合原请求授权，其他业务与长连接也不能从上述局部实现推导立即停权。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n复用统一 actor 与凭据校验，接口变更同步[契约](../../SKM/README.md#contracts)、Web client 和回归。重点验证多页面/换账号不自动重放、拒绝不泄漏身份、撤销/登录与锁等待竞争、旧会话不复活，以及 0031、HTTPS/context path、cookie/no-store 和多实例代理信任。\n\n[service 回归](../../SKM/backend/tests/auth/test_session_service.py)与[真实会话测试](../../SKM/backend/tests/db/test_real_auth_sessions.py)分别举证；真实数据库须使用获准的专用目标。"}], "toc": [{"title": "先分清四类凭据", "anchor": "先分清四类凭据", "level": "h2"}, {"title": "威胁边界与目标", "anchor": "威胁边界与目标", "level": "h2"}, {"title": "密码认证", "anchor": "密码认证", "level": "h2"}, {"title": "浏览器会话", "anchor": "浏览器会话", "level": "h2"}, {"title": "会话失效与权限变化", "anchor": "会话失效与权限变化", "level": "h3"}, {"title": "CSRF 与同源约束", "anchor": "csrf-与同源约束", "level": "h2"}, {"title": "会话读取与多页面", "anchor": "会话读取与多页面", "level": "h3"}, {"title": "会话凭据 v2 与切换要求", "anchor": "会话凭据-v2-与切换要求", "level": "h3"}, {"title": "缓存与代理", "anchor": "缓存与代理", "level": "h3"}, {"title": "首个 ADMIN 初始化", "anchor": "首个-admin-初始化", "level": "h2"}, {"title": "权限判定", "anchor": "权限判定", "level": "h2"}, {"title": "认证与业务提交不是同一个事务", "anchor": "认证与业务提交不是同一个事务", "level": "h3"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/authentication.md", "checksum": "f609ffee520349a04789fb2b96bfd60890dedeba4fb230c8861225b7b668b640"}, {"id": "docs/design/login-protection.md", "title": "登录入口防护与失败恢复", "group": "design", "html": "\u003ch1 id=\"登录入口防护与失败恢复\">登录入口防护与失败恢复\u003c/h1>\n\u003cp>本页定义登录/本人改密的配额、短期状态与失败语义；身份见\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>，改密事务见\u003ca href=\"#docs/design/user-lifecycle.md::\">用户管理\u003c/a>，缺口与操作分别见\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>、\u003ca href=\"#docs/operations/runbook.md::%E7%99%BB%E5%BD%95%E9%98%B2%E6%8A%A4%E7%9A%84%E6%8E%92%E6%9F%A5%E4%B8%8E%E6%81%A2%E5%A4%8D\">Runbook\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子一次登录两次入口请求\">一个例子：一次登录，两次入口请求\u003c/h2>\n\u003cp>每次提交先 GET login-context、再 POST login：正常登录消耗两次来源配额、一次账号/组合配额。同组合窗口内第六次尝试拒绝；前五次不必都到验密，challenge 拒绝也可能已计数，正确密码不豁免。换来源不清账号累计，换账号不清来源累计，NAT 共享来源额度；手动重试取新 challenge，不自动重发密码。\u003c/p>\n\u003ch2 id=\"保护范围与执行顺序\">保护范围与执行顺序\u003c/h2>\n\u003cp>middleware 按路径保护 login-context、login、users/me/password；错误方法、尾斜线、非法正文也先计来源，重定向前后分别计数。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">来源 gate → 路由/正文/header\n  ├─ login-context → 保存 challenge\n  └─ login → Origin → 标准化 email → 账号/组合 gate\n               → 消费 challenge → 密码/新会话\n\u003c/code>\u003c/pre>\n\u003cp>正文/header/Origin 拒绝先于账号计数；可标准化 email 在 challenge 前计数，不查询账号存在性绕过 gate。无效 email 不建账号 key，但来源已计数，仍消费 challenge 并 dummy 验密。\u003c/p>\n\u003cp>LoginAdmission 是同一 AuthService 的一次性内存回执，30 秒失效，不公开、不证明验密通过；body/连接/超时仍由 ingress 限制。\u003c/p>\n\u003cp>本人改密沿“来源 → 请求/Origin/会话 CSRF → actor 账号/组合计数 → 管理事务验密”，与登录共享额度；不用匿名 challenge、不接受另传 email，错误按\u003ca href=\"#docs/design/user-lifecycle.md::%E7%94%9F%E6%95%88%E4%B8%8E%E7%95%8C%E9%9D%A2\">管理协议\u003c/a>处理。\u003c/p>\n\u003ch2 id=\"计数与退避如何恢复\">计数与退避如何恢复\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>默认窗口 / 上限\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>来源\u003c/td>\n\u003ctd>60 秒 / 100 个入口 HTTP 请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标准化账号\u003c/td>\n\u003ctd>60 秒 / 15 次尝试，跨来源、登录/改密共享\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账号 + 来源\u003c/td>\n\u003ctd>60 秒 / 5 次尝试，登录/改密共享\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>窗口从首次计数开始，不是自然分钟或滑动窗口。超限退避依次 60、120、240、300 秒；安静至少 900 秒才于下次检查重置升级次数，状态最长保留到最后写入后 1260 秒。\u003c/p>\n\u003cp>阻塞中的单次检查不更新计数/退避/TTL，但账号拒绝前的来源 gate 可能已写入。成功也不清零，避免抹掉其他在途计数。这是尝试限流而非错误密码累计；NAT、持续攻击和账号维度仍可能误伤，不替代分布式 DoS 防护。策略取舍见 \u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html#login-throttling\">OWASP\u003c/a>。\u003c/p>\n\u003ch2 id=\"短期状态与失败关闭\">短期状态与失败关闭\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/auth/login_protection.py\">LoginProtection\u003c/a>使用 Redis TIME；来源与账号/组合各一次 EVAL，以 SET PX 写有限 TTL。它们不与 PostgreSQL 原子提交，Lua 错误也不保证回滚已写状态。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>key 缺失/过期\u003c/td>\n\u003ctd>新窗口；无法区分驱逐/重启丢失，累计防护可能削弱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>格式/版本/类型错、无 TTL\u003c/td>\n\u003ctd>拒绝，不删除重置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EVAL 超时/错误/异常结果\u003c/td>\n\u003ctd>503，不验密、不自动重试或补偿计数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>challenge 保存/消费未知\u003c/td>\n\u003ctd>503，不发新 challenge、不验密；明确缺失/过期/已消费为 403\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>防护故障但已有会话\u003c/td>\n\u003ctd>会话读取/登出仍独立检查 DB/CSRF\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>key 使用 skillmind:auth:limit:v2: 及 email/来源 SHA-256，不公开内部状态。hash 可被低熵枚举，不是匿名化；hash tag 不证明 Redis Cluster 支持，Lua 原子性不证明故障切换 exactly-once。\u003c/p>\n\u003ch2 id=\"公开响应与客户端责任\">公开响应与客户端责任\u003c/h2>\n\u003cp>沿用 \u003ca href=\"../SKM/contracts/errors/problem/v1.schema.json\">Problem\u003c/a>，不暴露维度、email、IP 或回执。已处理的受保护响应有 no-store 和服务器 request_id，不涵盖代理/未处理异常。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回\u003c/th>\n\u003cth>客户端含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>429 login_rate_limited\u003c/td>\n\u003ctd>本次未获验密许可；Retry-After 1–300 秒，等完不保证通过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>503 login_protection_unavailable\u003c/td>\n\u003ctd>防护未确认、未验密；不代表账号停用或承诺恢复时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>401 invalid_credentials\u003c/td>\n\u003ctd>不区分不存在、停用、密码错误\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403/422/405\u003c/td>\n\u003ctd>Origin/challenge、结构或方法错误；来源可能已消耗，不优先于 gate\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改密 400 current_password_rejected\u003c/td>\n\u003ctd>保留仍有效会话\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../SKM/web/src/api/http.ts\">HTTP client\u003c/a>只接非负安全整数秒为 retryAfterSeconds，非 JSON 错误也保留 HTTP 元数据；日期、小数、溢出不猜测。\u003ca href=\"../SKM/web/src/lib/loginFeedback.ts\">loginFeedback\u003c/a>再限制为 1–300。\u003c/p>\n\u003cp>LoginPage 对合法 429 显示静态“至少等 N 秒后手动重试”，无效 header 用通用提示；不是倒计时/本地锁定，503 不套等待 header。提交错误走三语 catalog、不显示原 message；App 初始会话检查仍是独立字符串路径。\u003c/p>\n\u003ch2 id=\"提交离页与结果未知\">提交、离页与结果未知\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/web/src/pages/LoginPage.tsx\">LoginPage\u003c/a>以 activeRequest ref 防同 tick 双提交，离页 abort/清引用；\u003ca href=\"../SKM/web/src/api/auth.ts\">auth client\u003c/a>在 challenge 与密码 POST 之间复查取消。只有有效请求可回调，busy/aria-busy 不构成跨 tab 互斥。\u003c/p>\n\u003cp>密码 POST 发出后的断连、abort、解析失败不证明 Session 未提交或 cookie 未接收。应读当前会话确认，不重发密码、不在 cleanup 自动 logout。登录没有原请求幂等重放，完整跨页未知恢复尚未实现。\u003c/p>\n\u003ch2 id=\"来源识别与上线边界\">来源识别与上线边界\u003c/h2>\n\u003cp>来源取 ASGI request.client，合并 IPv4/mapped IPv6，无法识别入 unknown 桶；不自行信任 Forwarded。须验证 Traefik/ASGI 拓扑：信任过窄共享代理 IP，过宽可伪造，不能关闭 Origin/CSRF 或扩大信任来修复。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/core/settings.py\">Settings\u003c/a>→ .env.example → lifespan 定义上限与 Redis timeout（默认 5/15/100、2 秒）。timeout 不是 HTTP 总 deadline；窗口/退避不是环境变量策略，各 API 实例保持一致。\u003c/p>\n\u003cp>limiter namespace v2、状态 JSON v1、session v2 各自独立。新 limiter 不读旧 key；切换评审累计丢失与混跑绕过，不批删 Redis、queue 或 challenge。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>重点覆盖拒绝顺序、共享计数/有限退避、损坏/未知 fail closed、已有会话独立可用与密码错误不误注销。\u003ca href=\"../SKM/web/tests/browser/check_login.py\">表单回归\u003c/a>检查重复/卸载及三语/键盘/窄屏；\u003ca href=\"../SKM/backend/tests/auth/test_real_login_protection.py\">真实 Lua\u003c/a>和 \u003ca href=\"../SKM/backend/tests/auth/test_real_login_http.py\">ASGI + Redis\u003c/a>分别检查状态与顺序，后者不证明网络服务或真实会话提交。\u003c/p>\n\u003cp>真实 PostgreSQL、HTTPS 多实例、NAT、多页面及 Redis 容量/驱逐/重启/切换须独立验收；按\u003ca href=\"#docs/development/local-development.md::\">本地指南\u003c/a>使用获准专用目标，不对用户 Redis 做故障实验。\u003c/p>\n", "sections": [{"title": "登录入口防护与失败恢复", "level": "h1", "anchor": "登录入口防护与失败恢复", "text": "# 登录入口防护与失败恢复\n\n本页定义登录/本人改密的配额、短期状态与失败语义；身份见[认证](authentication.md)，改密事务见[用户管理](user-lifecycle.md)，缺口与操作分别见[计划 R05](../planning/roadmap.md#r05-领域与身份安全)、[Runbook](../operations/runbook.md#登录防护的排查与恢复)。"}, {"title": "一个例子：一次登录，两次入口请求", "level": "h2", "anchor": "一个例子一次登录两次入口请求", "text": "## 一个例子：一次登录，两次入口请求\n\n每次提交先 GET login-context、再 POST login：正常登录消耗两次来源配额、一次账号/组合配额。同组合窗口内第六次尝试拒绝；前五次不必都到验密，challenge 拒绝也可能已计数，正确密码不豁免。换来源不清账号累计，换账号不清来源累计，NAT 共享来源额度；手动重试取新 challenge，不自动重发密码。"}, {"title": "保护范围与执行顺序", "level": "h2", "anchor": "保护范围与执行顺序", "text": "## 保护范围与执行顺序\n\nmiddleware 按路径保护 login-context、login、users/me/password；错误方法、尾斜线、非法正文也先计来源，重定向前后分别计数。\n\n```text\n来源 gate → 路由/正文/header\n  ├─ login-context → 保存 challenge\n  └─ login → Origin → 标准化 email → 账号/组合 gate\n               → 消费 challenge → 密码/新会话\n```\n\n正文/header/Origin 拒绝先于账号计数；可标准化 email 在 challenge 前计数，不查询账号存在性绕过 gate。无效 email 不建账号 key，但来源已计数，仍消费 challenge 并 dummy 验密。\n\nLoginAdmission 是同一 AuthService 的一次性内存回执，30 秒失效，不公开、不证明验密通过；body/连接/超时仍由 ingress 限制。\n\n本人改密沿“来源 → 请求/Origin/会话 CSRF → actor 账号/组合计数 → 管理事务验密”，与登录共享额度；不用匿名 challenge、不接受另传 email，错误按[管理协议](user-lifecycle.md#生效与界面)处理。"}, {"title": "计数与退避如何恢复", "level": "h2", "anchor": "计数与退避如何恢复", "text": "## 计数与退避如何恢复\n\n| 维度 | 默认窗口 / 上限 |\n| --- | --- |\n| 来源 | 60 秒 / 100 个入口 HTTP 请求 |\n| 标准化账号 | 60 秒 / 15 次尝试，跨来源、登录/改密共享 |\n| 账号 + 来源 | 60 秒 / 5 次尝试，登录/改密共享 |\n\n窗口从首次计数开始，不是自然分钟或滑动窗口。超限退避依次 60、120、240、300 秒；安静至少 900 秒才于下次检查重置升级次数，状态最长保留到最后写入后 1260 秒。\n\n阻塞中的单次检查不更新计数/退避/TTL，但账号拒绝前的来源 gate 可能已写入。成功也不清零，避免抹掉其他在途计数。这是尝试限流而非错误密码累计；NAT、持续攻击和账号维度仍可能误伤，不替代分布式 DoS 防护。策略取舍见 [OWASP](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html#login-throttling)。"}, {"title": "短期状态与失败关闭", "level": "h2", "anchor": "短期状态与失败关闭", "text": "## 短期状态与失败关闭\n\n[LoginProtection](../../SKM/backend/src/skillmind/auth/login_protection.py)使用 Redis TIME；来源与账号/组合各一次 EVAL，以 SET PX 写有限 TTL。它们不与 PostgreSQL 原子提交，Lua 错误也不保证回滚已写状态。\n\n| 情况 | 处理 |\n| --- | --- |\n| key 缺失/过期 | 新窗口；无法区分驱逐/重启丢失，累计防护可能削弱 |\n| 格式/版本/类型错、无 TTL | 拒绝，不删除重置 |\n| EVAL 超时/错误/异常结果 | 503，不验密、不自动重试或补偿计数 |\n| challenge 保存/消费未知 | 503，不发新 challenge、不验密；明确缺失/过期/已消费为 403 |\n| 防护故障但已有会话 | 会话读取/登出仍独立检查 DB/CSRF |\n\nkey 使用 skillmind:auth:limit:v2: 及 email/来源 SHA-256，不公开内部状态。hash 可被低熵枚举，不是匿名化；hash tag 不证明 Redis Cluster 支持，Lua 原子性不证明故障切换 exactly-once。"}, {"title": "公开响应与客户端责任", "level": "h2", "anchor": "公开响应与客户端责任", "text": "## 公开响应与客户端责任\n\n沿用 [Problem](../../SKM/contracts/errors/problem/v1.schema.json)，不暴露维度、email、IP 或回执。已处理的受保护响应有 no-store 和服务器 request_id，不涵盖代理/未处理异常。\n\n| 返回 | 客户端含义 |\n| --- | --- |\n| 429 login_rate_limited | 本次未获验密许可；Retry-After 1–300 秒，等完不保证通过 |\n| 503 login_protection_unavailable | 防护未确认、未验密；不代表账号停用或承诺恢复时间 |\n| 401 invalid_credentials | 不区分不存在、停用、密码错误 |\n| 403/422/405 | Origin/challenge、结构或方法错误；来源可能已消耗，不优先于 gate |\n| 改密 400 current_password_rejected | 保留仍有效会话 |\n\n[HTTP client](../../SKM/web/src/api/http.ts)只接非负安全整数秒为 retryAfterSeconds，非 JSON 错误也保留 HTTP 元数据；日期、小数、溢出不猜测。[loginFeedback](../../SKM/web/src/lib/loginFeedback.ts)再限制为 1–300。\n\nLoginPage 对合法 429 显示静态“至少等 N 秒后手动重试”，无效 header 用通用提示；不是倒计时/本地锁定，503 不套等待 header。提交错误走三语 catalog、不显示原 message；App 初始会话检查仍是独立字符串路径。"}, {"title": "提交、离页与结果未知", "level": "h2", "anchor": "提交离页与结果未知", "text": "## 提交、离页与结果未知\n\n[LoginPage](../../SKM/web/src/pages/LoginPage.tsx)以 activeRequest ref 防同 tick 双提交，离页 abort/清引用；[auth client](../../SKM/web/src/api/auth.ts)在 challenge 与密码 POST 之间复查取消。只有有效请求可回调，busy/aria-busy 不构成跨 tab 互斥。\n\n密码 POST 发出后的断连、abort、解析失败不证明 Session 未提交或 cookie 未接收。应读当前会话确认，不重发密码、不在 cleanup 自动 logout。登录没有原请求幂等重放，完整跨页未知恢复尚未实现。"}, {"title": "来源识别与上线边界", "level": "h2", "anchor": "来源识别与上线边界", "text": "## 来源识别与上线边界\n\n来源取 ASGI request.client，合并 IPv4/mapped IPv6，无法识别入 unknown 桶；不自行信任 Forwarded。须验证 Traefik/ASGI 拓扑：信任过窄共享代理 IP，过宽可伪造，不能关闭 Origin/CSRF 或扩大信任来修复。\n\n[Settings](../../SKM/backend/src/skillmind/core/settings.py)→ .env.example → lifespan 定义上限与 Redis timeout（默认 5/15/100、2 秒）。timeout 不是 HTTP 总 deadline；窗口/退避不是环境变量策略，各 API 实例保持一致。\n\nlimiter namespace v2、状态 JSON v1、session v2 各自独立。新 limiter 不读旧 key；切换评审累计丢失与混跑绕过，不批删 Redis、queue 或 challenge。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n重点覆盖拒绝顺序、共享计数/有限退避、损坏/未知 fail closed、已有会话独立可用与密码错误不误注销。[表单回归](../../SKM/web/tests/browser/check_login.py)检查重复/卸载及三语/键盘/窄屏；[真实 Lua](../../SKM/backend/tests/auth/test_real_login_protection.py)和 [ASGI + Redis](../../SKM/backend/tests/auth/test_real_login_http.py)分别检查状态与顺序，后者不证明网络服务或真实会话提交。\n\n真实 PostgreSQL、HTTPS 多实例、NAT、多页面及 Redis 容量/驱逐/重启/切换须独立验收；按[本地指南](../development/local-development.md)使用获准专用目标，不对用户 Redis 做故障实验。"}], "toc": [{"title": "一个例子：一次登录，两次入口请求", "anchor": "一个例子一次登录两次入口请求", "level": "h2"}, {"title": "保护范围与执行顺序", "anchor": "保护范围与执行顺序", "level": "h2"}, {"title": "计数与退避如何恢复", "anchor": "计数与退避如何恢复", "level": "h2"}, {"title": "短期状态与失败关闭", "anchor": "短期状态与失败关闭", "level": "h2"}, {"title": "公开响应与客户端责任", "anchor": "公开响应与客户端责任", "level": "h2"}, {"title": "提交、离页与结果未知", "anchor": "提交离页与结果未知", "level": "h2"}, {"title": "来源识别与上线边界", "anchor": "来源识别与上线边界", "level": "h2"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/login-protection.md", "checksum": "4a73bc7f494b63ecce6235da662747c7c50e2b6c65586b64ac5933c296629eb5"}, {"id": "docs/design/user-lifecycle.md", "title": "用户生命周期与安全管理", "group": "design", "html": "\u003ch1 id=\"用户生命周期与安全管理\">用户生命周期与安全管理\u003c/h1>\n\u003cp>本页负责组织账号的创建、资料/角色/状态、本人改密、会话撤销与审计，不依赖 Project。凭据和配额见\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>、\u003ca href=\"#docs/design/login-protection.md::\">登录防护\u003c/a>，缺口见\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子停用再启用不恢复旧登录\">一个例子：停用再启用，不恢复旧登录\u003c/h2>\n\u003cp>U 版本 7、会话 S1/S2 → 停用事务保存 DISABLED/版本 8、撤销 S1/S2、追加审计 → 启用事务保存 ACTIVE/版本 9 与审计。旧会话仍须重新登录，改回角色同理。最后一个活动 ADMIN 在停用事务内拒绝；撤销不证明 SSE/Run/外部进程已停止。\u003c/p>\n\u003ch2 id=\"工作副本与公开入口\">工作副本与公开入口\u003c/h2>\n\u003cp>复用 \u003ca href=\"../SKM/backend/src/skillmind/users\">users service/repository\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/api/routes/users.py\">users route\u003c/a>、\u003ca href=\"../SKM/contracts/users/v1\">Schema\u003c/a>及\u003ca href=\"../SKM/web/src/pages/AccountsPage.tsx\">账户页\u003c/a>。页面经 #/accounts 接入 App，使用现有 client、版本表单和请求 hook，不新造平行服务。\u003ca href=\"../SKM/backend/migrations/versions/0032_user_lifecycle.py\">0032\u003c/a>定义版本/安全事件；文件存在不等于迁移部署或真实事务验收。\u003c/p>\n\u003ch2 id=\"场景与非目标\">场景与非目标\u003c/h2>\n\u003cp>用户可读本人账户/安全事件，验当前密码后改密、撤销本人全部会话；ADMIN 管理本组织用户。创建不自动加入 Project，移除成员不等于停用账户，ADMIN 不依赖 membership。\u003c/p>\n\u003cp>不提供第三角色、匿名注册、找回密码/MFA、硬删账户、管理员代改密码或 email 变更。ADMIN 提交初始密码只存 hash，不等于邀请、强制首次改密或公网恢复协议。\u003c/p>\n\u003ch2 id=\"用户操作与目标公开面\">用户操作与目标公开面\u003c/h2>\n\u003cp>路由统一位于 /api/v1：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>本人读取\u003c/td>\n\u003ctd>GET /users/me/account、/users/me/security-events\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本人安全变更\u003c/td>\n\u003ctd>POST /users/me/password、/users/me/sessions/revoke\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMIN 列表/创建\u003c/td>\n\u003ctd>GET /users、POST /users\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMIN 精确读取/修改\u003c/td>\n\u003ctd>GET /users/{user_id}、PUT /users/{user_id}\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMIN 撤销/审计\u003c/td>\n\u003ctd>POST /users/{user_id}/sessions/revoke、GET /users/{user_id}/security-events\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"版本查询与公开数据\">版本、查询与公开数据\u003c/h3>\n\u003cul>\n\u003cli>既有账户 mutation 必带正整数 expected_row_version，先验版本再判 no-op；旧版即使值相同也冲突。同版无变化 PUT 不增版/事件，改密/撤销即使撤销零行也增版审计。\u003c/li>\n\u003cli>标准化 email 组织内唯一，但不构成创建幂等；重复 email 不证明原请求成功，不覆盖密码/角色。\u003c/li>\n\u003cli>用户查询 q 最长 200，limit 1–100（默认 25）、offset 非负，按 email/ID 排序，通配符作普通字符；返回 items/total/limit/offset。审计按目标分页，不能过滤首页冒充历史；offset 排序不保证跨页快照。\u003c/li>\n\u003cli>冲突后 ADMIN 读精确 ID、本人读 me/account，保留原版本和非敏感草稿供人工比较；USER 不借管理读取他人。\u003c/li>\n\u003cli>账户仅公开 ID/email/display_name/role/status/version/时间；mutation 另报本次 revoked_sessions、当前会话是否失效。撤销数含未标记撤销的过期行，不是在线人数。安全事件不返密码/token/hash/任意 metadata；响应/client no-store，不外推全站。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"改密入口的配额\">改密入口的配额\u003c/h3>\n\u003cp>来源 gate → 请求/Origin/会话 CSRF → actor 账号/组合 gate → 管理事务验密。共享登录配额且成功不清零，不用匿名 challenge/另传账号。429/503 拒绝不进入验密或账户变更，Redis 与 DB 不属同一事务；计数细节见\u003ca href=\"#docs/design/login-protection.md::%E4%BF%9D%E6%8A%A4%E8%8C%83%E5%9B%B4%E4%B8%8E%E6%89%A7%E8%A1%8C%E9%A1%BA%E5%BA%8F\">登录防护\u003c/a>。\u003c/p>\n\u003ch2 id=\"事务与并发\">事务与并发\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">入口认证事务结束\n  → Organization → User（actor/target 去重、ID 升序）\n  → AuthSession（ID 升序）\n  → 原凭据/权限/期限、目标版本、活动 ADMIN\n  → 账户 + 会话撤销 + 审计一并 commit / rollback\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>与 bootstrap 共用 Organization 串行化点；登录只按 User → AuthSession，不反向取组织锁。\u003c/li>\n\u003cli>锁后及耗时验密 await 后、应用变更前取新时间复核原 token/CSRF、期限、撤销、账户/角色。最终持锁判定不承诺物理 commit 瞬间未过期；合法自撤销不能再被“会话已撤销”否定。\u003c/li>\n\u003cli>停用/降级活动 ADMIN 须在组织锁内确认另有活动 ADMIN。全部管理 writer 同序；不能外推任意 SQL。\u003c/li>\n\u003cli>改密、角色/状态变化、主动撤销持久撤销目标全部未撤销会话；仅改 display_name 不撤销。User 锁与新登录协调，防止漏撤销。\u003c/li>\n\u003cli>新用户先 flush 父行再插审计，flush 不等于 commit；审计失败整体回滚。组织锁优化须有真实 DB 依据。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"审计与请求关联\">审计与请求关联\u003c/h2>\n\u003cp>row_version 仅覆盖账户/安全变更，不随偏好、语言或登录时间变化。UserSecurityEvent 保存 actor/target、操作类型、版本、前后角色/状态、撤销数、时间/UUID；每目标版本最多一条，不是全字段差异历史。操作类型为 CREATED/UPDATED/PASSWORD_CHANGED/SESSIONS_REVOKED。\u003c/p>\n\u003cp>服务器生成 UUID 并用于 header/Problem/审计，不信任客户端 X-Request-ID。它不是幂等键，重发换 ID；拒绝/no-op 未必有事件，查不到不证明请求没到达。\u003c/p>\n\u003cp>bootstrap 以新 ADMIN 自身和 CLI UUID 同事务追加 CREATED；已有任意 ADMIN（含 DISABLED）即拒绝。审计追加式是用例约束，FK/唯一键不保证 DB 禁止任意 UPDATE/DELETE，不开放普通删改 API。\u003c/p>\n\u003ch2 id=\"生效与界面\">生效与界面\u003c/h2>\n\u003cp>本人安全与 ADMIN 管理分开，无 Project 或列表加载时仍可访问。首次项目读取不清草稿，用户实际换项目时隔离旧表单；隐藏按钮不代替授权。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>当前会话撤销成功 / 401 失效\u003c/td>\n\u003ctd>清身份与密码、要求重登；不额外 logout 或自动重放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>400 current_password_rejected\u003c/td>\n\u003ctd>保留有效登录态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403/404\u003c/td>\n\u003ctd>区分 CSRF/ADMIN 拒绝与目标不可访问，不换目标或重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 user_version_conflict\u003c/td>\n\u003ctd>精确重读，人工比较草稿后采用新版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 last_active_admin / user_email_conflict\u003c/td>\n\u003ctd>保留末位 ADMIN / 原账户；刷新版本不自动解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422\u003c/td>\n\u003ctd>修参数，不展示可能含密码的原始校验输入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>429/503\u003c/td>\n\u003ctd>有限等待或不可用，不自动发密码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>timeout/断连/abort\u003c/td>\n\u003ctd>结果未知；核对当前身份、原目标/版本和授权审计，不推断回滚\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>当前值或新版本不证明原操作造成，无专用重放协议不承诺 exactly-once。同步 ref 防双提交；换 actor/Project、卸载后丢弃旧结果。密码/token 不进 URL/storage/日志，email 搜索不入遥测。\u003c/p>\n\u003ch2 id=\"迁移与历史兼容\">迁移与历史兼容\u003c/h2>\n\u003cp>0032 将旧用户初始化为 row_version=1，不补造 CREATED；任意安全事件阻止 downgrade 丢表，不删事件凑条件。0031 会话迁移按\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E4%B8%8E%E5%9B%9E%E9%80%80%E5%AE%A1%E6%9F%A5\">发布审查\u003c/a>独立验收。\u003c/p>\n\u003cp>备份可恢复旧角色/密码/会话，按\u003ca href=\"#docs/operations/backup-recovery.md::%E6%81%A2%E5%A4%8D%E5%90%8E%E9%AA%8C%E8%AF%81\">恢复后验证\u003c/a>重核，不用未经审查 SQL 清表/撤权。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>合跑 users/API/contracts 并核对错误、Schema/OpenAPI 与账户页。重点覆盖双 ADMIN/末位保护、bootstrap/登录/撤销竞争、锁等待过期和旧会话不复活、版本/no-op/email 冲突、审计失败回滚、改密配额/错误不误注销、UUID/DTO 无泄漏。\u003c/p>\n\u003cp>实组件验证未知、同 tick 防重、换 actor、三语/键盘/窄屏；真实 DB、双浏览器/HTTPS、0031/0032 及备份恢复分别举证，见\u003ca href=\"#docs/development/local-development.md::%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E5%9B%9E%E5%B8%B0\">本地验证\u003c/a>。\u003c/p>\n", "sections": [{"title": "用户生命周期与安全管理", "level": "h1", "anchor": "用户生命周期与安全管理", "text": "# 用户生命周期与安全管理\n\n本页负责组织账号的创建、资料/角色/状态、本人改密、会话撤销与审计，不依赖 Project。凭据和配额见[认证](authentication.md)、[登录防护](login-protection.md)，缺口见[计划 R05](../planning/roadmap.md#r05-领域与身份安全)。"}, {"title": "一个例子：停用再启用，不恢复旧登录", "level": "h2", "anchor": "一个例子停用再启用不恢复旧登录", "text": "## 一个例子：停用再启用，不恢复旧登录\n\nU 版本 7、会话 S1/S2 → 停用事务保存 DISABLED/版本 8、撤销 S1/S2、追加审计 → 启用事务保存 ACTIVE/版本 9 与审计。旧会话仍须重新登录，改回角色同理。最后一个活动 ADMIN 在停用事务内拒绝；撤销不证明 SSE/Run/外部进程已停止。"}, {"title": "工作副本与公开入口", "level": "h2", "anchor": "工作副本与公开入口", "text": "## 工作副本与公开入口\n\n复用 [users service/repository](../../SKM/backend/src/skillmind/users/)、[users route](../../SKM/backend/src/skillmind/api/routes/users.py)、[Schema](../../SKM/contracts/users/v1/)及[账户页](../../SKM/web/src/pages/AccountsPage.tsx)。页面经 #/accounts 接入 App，使用现有 client、版本表单和请求 hook，不新造平行服务。[0032](../../SKM/backend/migrations/versions/0032_user_lifecycle.py)定义版本/安全事件；文件存在不等于迁移部署或真实事务验收。"}, {"title": "场景与非目标", "level": "h2", "anchor": "场景与非目标", "text": "## 场景与非目标\n\n用户可读本人账户/安全事件，验当前密码后改密、撤销本人全部会话；ADMIN 管理本组织用户。创建不自动加入 Project，移除成员不等于停用账户，ADMIN 不依赖 membership。\n\n不提供第三角色、匿名注册、找回密码/MFA、硬删账户、管理员代改密码或 email 变更。ADMIN 提交初始密码只存 hash，不等于邀请、强制首次改密或公网恢复协议。"}, {"title": "用户操作与目标公开面", "level": "h2", "anchor": "用户操作与目标公开面", "text": "## 用户操作与目标公开面\n\n路由统一位于 /api/v1：\n\n| 操作 | 入口 |\n| --- | --- |\n| 本人读取 | GET /users/me/account、/users/me/security-events |\n| 本人安全变更 | POST /users/me/password、/users/me/sessions/revoke |\n| ADMIN 列表/创建 | GET /users、POST /users |\n| ADMIN 精确读取/修改 | GET /users/{user_id}、PUT /users/{user_id} |\n| ADMIN 撤销/审计 | POST /users/{user_id}/sessions/revoke、GET /users/{user_id}/security-events |"}, {"title": "版本、查询与公开数据", "level": "h3", "anchor": "版本查询与公开数据", "text": "### 版本、查询与公开数据\n\n- 既有账户 mutation 必带正整数 expected_row_version，先验版本再判 no-op；旧版即使值相同也冲突。同版无变化 PUT 不增版/事件，改密/撤销即使撤销零行也增版审计。\n- 标准化 email 组织内唯一，但不构成创建幂等；重复 email 不证明原请求成功，不覆盖密码/角色。\n- 用户查询 q 最长 200，limit 1–100（默认 25）、offset 非负，按 email/ID 排序，通配符作普通字符；返回 items/total/limit/offset。审计按目标分页，不能过滤首页冒充历史；offset 排序不保证跨页快照。\n- 冲突后 ADMIN 读精确 ID、本人读 me/account，保留原版本和非敏感草稿供人工比较；USER 不借管理读取他人。\n- 账户仅公开 ID/email/display_name/role/status/version/时间；mutation 另报本次 revoked_sessions、当前会话是否失效。撤销数含未标记撤销的过期行，不是在线人数。安全事件不返密码/token/hash/任意 metadata；响应/client no-store，不外推全站。"}, {"title": "改密入口的配额", "level": "h3", "anchor": "改密入口的配额", "text": "### 改密入口的配额\n\n来源 gate → 请求/Origin/会话 CSRF → actor 账号/组合 gate → 管理事务验密。共享登录配额且成功不清零，不用匿名 challenge/另传账号。429/503 拒绝不进入验密或账户变更，Redis 与 DB 不属同一事务；计数细节见[登录防护](login-protection.md#保护范围与执行顺序)。"}, {"title": "事务与并发", "level": "h2", "anchor": "事务与并发", "text": "## 事务与并发\n\n```text\n入口认证事务结束\n  → Organization → User（actor/target 去重、ID 升序）\n  → AuthSession（ID 升序）\n  → 原凭据/权限/期限、目标版本、活动 ADMIN\n  → 账户 + 会话撤销 + 审计一并 commit / rollback\n```\n\n- 与 bootstrap 共用 Organization 串行化点；登录只按 User → AuthSession，不反向取组织锁。\n- 锁后及耗时验密 await 后、应用变更前取新时间复核原 token/CSRF、期限、撤销、账户/角色。最终持锁判定不承诺物理 commit 瞬间未过期；合法自撤销不能再被“会话已撤销”否定。\n- 停用/降级活动 ADMIN 须在组织锁内确认另有活动 ADMIN。全部管理 writer 同序；不能外推任意 SQL。\n- 改密、角色/状态变化、主动撤销持久撤销目标全部未撤销会话；仅改 display_name 不撤销。User 锁与新登录协调，防止漏撤销。\n- 新用户先 flush 父行再插审计，flush 不等于 commit；审计失败整体回滚。组织锁优化须有真实 DB 依据。"}, {"title": "审计与请求关联", "level": "h2", "anchor": "审计与请求关联", "text": "## 审计与请求关联\n\nrow_version 仅覆盖账户/安全变更，不随偏好、语言或登录时间变化。UserSecurityEvent 保存 actor/target、操作类型、版本、前后角色/状态、撤销数、时间/UUID；每目标版本最多一条，不是全字段差异历史。操作类型为 CREATED/UPDATED/PASSWORD_CHANGED/SESSIONS_REVOKED。\n\n服务器生成 UUID 并用于 header/Problem/审计，不信任客户端 X-Request-ID。它不是幂等键，重发换 ID；拒绝/no-op 未必有事件，查不到不证明请求没到达。\n\nbootstrap 以新 ADMIN 自身和 CLI UUID 同事务追加 CREATED；已有任意 ADMIN（含 DISABLED）即拒绝。审计追加式是用例约束，FK/唯一键不保证 DB 禁止任意 UPDATE/DELETE，不开放普通删改 API。"}, {"title": "生效与界面", "level": "h2", "anchor": "生效与界面", "text": "## 生效与界面\n\n本人安全与 ADMIN 管理分开，无 Project 或列表加载时仍可访问。首次项目读取不清草稿，用户实际换项目时隔离旧表单；隐藏按钮不代替授权。\n\n| 返回 | 处理 |\n| --- | --- |\n| 当前会话撤销成功 / 401 失效 | 清身份与密码、要求重登；不额外 logout 或自动重放 |\n| 400 current_password_rejected | 保留有效登录态 |\n| 403/404 | 区分 CSRF/ADMIN 拒绝与目标不可访问，不换目标或重试 |\n| 409 user_version_conflict | 精确重读，人工比较草稿后采用新版本 |\n| 409 last_active_admin / user_email_conflict | 保留末位 ADMIN / 原账户；刷新版本不自动解决 |\n| 422 | 修参数，不展示可能含密码的原始校验输入 |\n| 429/503 | 有限等待或不可用，不自动发密码 |\n| timeout/断连/abort | 结果未知；核对当前身份、原目标/版本和授权审计，不推断回滚 |\n\n当前值或新版本不证明原操作造成，无专用重放协议不承诺 exactly-once。同步 ref 防双提交；换 actor/Project、卸载后丢弃旧结果。密码/token 不进 URL/storage/日志，email 搜索不入遥测。"}, {"title": "迁移与历史兼容", "level": "h2", "anchor": "迁移与历史兼容", "text": "## 迁移与历史兼容\n\n0032 将旧用户初始化为 row_version=1，不补造 CREATED；任意安全事件阻止 downgrade 丢表，不删事件凑条件。0031 会话迁移按[发布审查](../operations/deployment.md#迁移与回退审查)独立验收。\n\n备份可恢复旧角色/密码/会话，按[恢复后验证](../operations/backup-recovery.md#恢复后验证)重核，不用未经审查 SQL 清表/撤权。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n合跑 users/API/contracts 并核对错误、Schema/OpenAPI 与账户页。重点覆盖双 ADMIN/末位保护、bootstrap/登录/撤销竞争、锁等待过期和旧会话不复活、版本/no-op/email 冲突、审计失败回滚、改密配额/错误不误注销、UUID/DTO 无泄漏。\n\n实组件验证未知、同 tick 防重、换 actor、三语/键盘/窄屏；真实 DB、双浏览器/HTTPS、0031/0032 及备份恢复分别举证，见[本地验证](../development/local-development.md#ブラウザ回帰)。"}], "toc": [{"title": "一个例子：停用再启用，不恢复旧登录", "anchor": "一个例子停用再启用不恢复旧登录", "level": "h2"}, {"title": "工作副本与公开入口", "anchor": "工作副本与公开入口", "level": "h2"}, {"title": "场景与非目标", "anchor": "场景与非目标", "level": "h2"}, {"title": "用户操作与目标公开面", "anchor": "用户操作与目标公开面", "level": "h2"}, {"title": "版本、查询与公开数据", "anchor": "版本查询与公开数据", "level": "h3"}, {"title": "改密入口的配额", "anchor": "改密入口的配额", "level": "h3"}, {"title": "事务与并发", "anchor": "事务与并发", "level": "h2"}, {"title": "审计与请求关联", "anchor": "审计与请求关联", "level": "h2"}, {"title": "生效与界面", "anchor": "生效与界面", "level": "h2"}, {"title": "迁移与历史兼容", "anchor": "迁移与历史兼容", "level": "h2"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/user-lifecycle.md", "checksum": "bc96e7938de93b8bb33c70ca4aa1ccb40518334c403da9d5557240ccc075ca49"}, {"id": "docs/design/secret-storage.md", "title": "Secret 保存、解析与轮换", "group": "design", "html": "\u003ch1 id=\"secret-保存解析与轮换\">Secret 保存、解析与轮换\u003c/h1>\n\u003cp>本页负责 Provider 凭据；浏览器 token、模型连接、批准分别见\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>、\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>、\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。Secret 可用不增加 scope/Tool 权限，缺口见\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子保存成功不等于资源可用\">一个例子：保存成功不等于资源可用\u003c/h2>\n\u003cp>ADMIN 保存 MANAGED 引用/密文同事务提交，响应不返原值；Worker 验冻结 binding 后解析给 Provider，外部 key 仍可能已撤销。保存、配置就绪、远端可达不是同一事实或跨系统事务。\u003c/p>\n\u003ch2 id=\"三种来源的边界\">三种来源的边界\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>来源\u003c/th>\n\u003cth>保存与约束\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ENVIRONMENT\u003c/td>\n\u003ctd>DB 只存 locator，原值来自部署环境，宿主/配置仍可能有副本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FILE\u003c/td>\n\u003ctd>受控 /run/secrets 文件，非上传或 Run input\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MANAGED\u003c/td>\n\u003ctd>ADMIN 提交明文，DB 独立保存 AES-256-GCM 密文，密钥另保管\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>ENVIRONMENT/FILE 的“零 at-rest”仅指 DB 不存原值；部署优先只读文件注入，Settings 并无任意 _FILE 自动替代。\u003c/p>\n\u003cp>FILE 当前只词法限制绝对路径/..，stat/read_text 不防 symlink/替换竞争；部署须独占管理、最小只读挂载，最终文件/链接/权限核验仍待补。\u003c/p>\n\u003cp>resolver 最多 65,536 UTF-8 bytes；FILE 去末尾 CR/LF，ENVIRONMENT 不去，MANAGED 创建另限 8,192 bytes。空值/超限拒绝、不截断。\u003c/p>\n\u003ch2 id=\"managed-的实际加密结构\">MANAGED 的实际加密结构\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/core/secret_crypto.py\">SecretCipher\u003c/a>以 32-byte 主密钥直接 AES-256-GCM，加随机 nonce、Project/引用 AAD；无逐项 DEK，不称信封加密。SKILLMIND_MANAGED_SECRET_KEK 与 kek_version 名称保持兼容；DEK/KMS 另定版本/迁移，不因改名重写密文。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>载体\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>SecretReference\u003c/td>\n\u003ctd>provider/resolver/locator/key_version/status，公开无 locator/原值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ManagedSecretMaterial\u003c/td>\n\u003ctd>引用/Project、nonce/ciphertext/kek_version；与引用 key_version 不同层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keyring\u003c/td>\n\u003ctd>首项 active 加密、旧项解密，与 DB dump 分开保管，不进 Run/日志/Agent\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AAD\u003c/td>\n\u003ctd>固定格式绑定 Project/引用，不代替访问授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"明文与威胁边界\">明文与威胁边界\u003c/h3>\n\u003cp>ADMIN 页面/API 创建、Worker/Provider 使用时必须短暂接触明文，但不回显或进入响应、日志、Evidence、workspace、prompt、业务子进程环境。加密降低 DB 单独泄漏风险，不防同时控制应用/DB；字段 redaction 不保证自由文本脱敏，不据此扩服务暴露。\u003c/p>\n\u003ch2 id=\"读取与失效\">读取与失效\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/agent/run_binding.py\">run_binding\u003c/a>先验 Run binding、Integration/capability、同 Project 引用，再由 \u003ca href=\"../SKM/backend/src/skillmind/integrations/secrets.py\">resolver\u003c/a>解析。\u003c/p>\n\u003cp>停用、材料缺失、未知 key 版、AAD/密文错误、不可读/空/超限均 fail closed，不换引用或空凭据降级。停用仅阻止后续解析，不能收回已解析值/已发请求；外部立即撤权另走 incident 流程。\u003c/p>\n\u003cp>Run 不存原值，换引用/连接 revision 不改旧 snapshot；同明文重加密不改变 binding 身份/scope。\u003c/p>\n\u003ch2 id=\"轮换不是更换外部凭据\">轮换不是更换外部凭据\u003c/h2>\n\u003cp>k1 → k2 重加密不更换或撤销外部 API key。\u003ca href=\"../SKM/backend/src/skillmind/integrations/repository.py\">rotate_managed_material\u003c/a>锁材料并事务重加密；active 标签相同直接 skipped、不验解密，标签必须稳定对应同一 key bytes，全 skipped 不是可读证明。\u003c/p>\n\u003ch3 id=\"切换与恢复的顺序\">切换与恢复的顺序\u003c/h3>\n\u003col>\n\u003cli>获准维护窗口内，分别保留 DB 恢复点与对应旧 key，不在普通清单登记原值。\u003c/li>\n\u003cli>所有读写进程加载“新 active + 旧解密 key”；cipher 启动时构造，改 CLI 环境不更新 API/Worker。按\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">环境边界\u003c/a>核对 migrate 等实际持钥者。\u003c/li>\n\u003cli>执行既有 CLI、核对退出/计数；旧实例仍写旧版时不算完成，行锁不阻止随后旧配置写入。\u003c/li>\n\u003cli>受控验必要解密及完整读取链，再移出现用旧 key；尚无全量只读验证 CLI，不输出明文代验。\u003c/li>\n\u003cli>备份仍依赖旧 key 时独立保管恢复副本；仅 DB dump 无法恢复丢失密钥。\u003c/li>\n\u003c/ol>\n\u003cp>命令见 \u003ca href=\"#docs/operations/runbook.md::managed-secret-%E3%81%AE-kek-%E9%81%8B%E7%94%A8\">Runbook\u003c/a>，不承诺热更新。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>入口见\u003ca href=\"#SKM/README.md::backend\">Backend\u003c/a>/\u003ca href=\"#SKM/README.md::contracts\">契约\u003c/a>。验证跨 Project/非 ADMIN 拒绝、DTO 无泄漏、引用/材料回滚、key/AAD/篡改/空值失败关闭，以及 FILE 链接竞争、API/Worker/CLI 混合配置和旧备份恢复。\u003c/p>\n\u003cp>crypto/helper 或 fake repository 不证明真实事务、进程切换、Web 明文处理和恢复；R05/R11 的实环境缺口保留。\u003c/p>\n", "sections": [{"title": "Secret 保存、解析与轮换", "level": "h1", "anchor": "secret-保存解析与轮换", "text": "# Secret 保存、解析与轮换\n\n本页负责 Provider 凭据；浏览器 token、模型连接、批准分别见[认证](authentication.md)、[Runtime](agent-runtime.md)、[受控写入](repository-effects.md)。Secret 可用不增加 scope/Tool 权限，缺口见[计划 R05](../planning/roadmap.md#r05-领域与身份安全)。"}, {"title": "一个例子：保存成功不等于资源可用", "level": "h2", "anchor": "一个例子保存成功不等于资源可用", "text": "## 一个例子：保存成功不等于资源可用\n\nADMIN 保存 MANAGED 引用/密文同事务提交，响应不返原值；Worker 验冻结 binding 后解析给 Provider，外部 key 仍可能已撤销。保存、配置就绪、远端可达不是同一事实或跨系统事务。"}, {"title": "三种来源的边界", "level": "h2", "anchor": "三种来源的边界", "text": "## 三种来源的边界\n\n| 来源 | 保存与约束 |\n| --- | --- |\n| ENVIRONMENT | DB 只存 locator，原值来自部署环境，宿主/配置仍可能有副本 |\n| FILE | 受控 /run/secrets 文件，非上传或 Run input |\n| MANAGED | ADMIN 提交明文，DB 独立保存 AES-256-GCM 密文，密钥另保管 |\n\nENVIRONMENT/FILE 的“零 at-rest”仅指 DB 不存原值；部署优先只读文件注入，Settings 并无任意 _FILE 自动替代。\n\nFILE 当前只词法限制绝对路径/..，stat/read_text 不防 symlink/替换竞争；部署须独占管理、最小只读挂载，最终文件/链接/权限核验仍待补。\n\nresolver 最多 65,536 UTF-8 bytes；FILE 去末尾 CR/LF，ENVIRONMENT 不去，MANAGED 创建另限 8,192 bytes。空值/超限拒绝、不截断。"}, {"title": "MANAGED 的实际加密结构", "level": "h2", "anchor": "managed-的实际加密结构", "text": "## MANAGED 的实际加密结构\n\n[SecretCipher](../../SKM/backend/src/skillmind/core/secret_crypto.py)以 32-byte 主密钥直接 AES-256-GCM，加随机 nonce、Project/引用 AAD；无逐项 DEK，不称信封加密。SKILLMIND_MANAGED_SECRET_KEK 与 kek_version 名称保持兼容；DEK/KMS 另定版本/迁移，不因改名重写密文。\n\n| 载体 | 边界 |\n| --- | --- |\n| SecretReference | provider/resolver/locator/key_version/status，公开无 locator/原值 |\n| ManagedSecretMaterial | 引用/Project、nonce/ciphertext/kek_version；与引用 key_version 不同层 |\n| keyring | 首项 active 加密、旧项解密，与 DB dump 分开保管，不进 Run/日志/Agent |\n| AAD | 固定格式绑定 Project/引用，不代替访问授权 |"}, {"title": "明文与威胁边界", "level": "h3", "anchor": "明文与威胁边界", "text": "### 明文与威胁边界\n\nADMIN 页面/API 创建、Worker/Provider 使用时必须短暂接触明文，但不回显或进入响应、日志、Evidence、workspace、prompt、业务子进程环境。加密降低 DB 单独泄漏风险，不防同时控制应用/DB；字段 redaction 不保证自由文本脱敏，不据此扩服务暴露。"}, {"title": "读取与失效", "level": "h2", "anchor": "读取与失效", "text": "## 读取与失效\n\n[run_binding](../../SKM/backend/src/skillmind/agent/run_binding.py)先验 Run binding、Integration/ca
