90%8E%E7%BD%AE%E8%83%BD%E5%8A%9B\">后置能力\u003c/a>。\u003c/li>\n\u003cli>预算执行接线须满足\u003ca href=\"#docs/development/runtime-guide.md::%E5%90%8E%E7%BD%AE%E8%83%BD%E5%8A%9B\">后置范围\u003c/a>，内部账本不等于实际执行受控。\u003c/li>\n\u003cli>准备遵循\u003ca href=\"#docs/development/runtime-guide.md::%E8%BE%93%E5%85%A5%E4%B8%8E%E6%96%87%E6%A1%A3\">输入与文档\u003c/a>，Result 遵循\u003ca href=\"#docs/development/runtime-guide.md::%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%AF%84%E4%BB%B7\">结果与评价\u003c/a>，不在 route/job 复制校验。\u003c/li>\n\u003cli>TaskSchedule 复用 RunService.create_task_run；版本、失效与迟发行为见\u003ca href=\"#docs/development/runtime-guide.md::%E6%89%A7%E8%A1%8C%E4%B8%8E%E6%81%A2%E5%A4%8D\">执行与恢复\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cul>\n\u003cli>资源 client 放 src/api/，画面经 index.ts barrel；HTTP 只用 requestApiJson / requestApiEmpty。mutation 传 csrfToken / X-CSRF-Token，响应在 client 边界验证，纯逻辑放 src/lib/。\u003c/li>\n\u003cli>TasksPage 选任务，WorkspacePage 管理待办与报告，Run 详情归属历史；不重造 SSE/取消/终态 lifecycle。即时/调度共用 taskDraft.ts / TaskLaunchFields.tsx。\u003c/li>\n\u003cli>不在前端重算服务端 ID（如 derive_task_id）。筛选/分页在服务端，不能过滤第一页冒充全量。\u003c/li>\n\u003cli>三语统一 src/lib/i18n/{zh,ja,en}.ts，同步 UiMessages / MESSAGES；画面用 useMessages()。\u003c/li>\n\u003cli>请求状态由对应 hook/组件持有，提交中的同步防重入与迟到响应归属检查不能只靠按钮 disabled。子组件定义放模块级，避免父组件编辑草稿时重建子树、丢失焦点或展开状态。\u003c/li>\n\u003cli>实现生成 FrontendModule 时先完成威胁模型与 CSP/iframe 隔离回归，且不继承应用权限，见\u003ca href=\"#docs/development/runtime-guide.md::%E5%90%8E%E7%BD%AE%E8%83%BD%E5%8A%9B\">后置能力\u003c/a>；普通 Web 页面不套用 builder/Host 门禁。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"同步点\">同步点\u003c/h2>\n\u003cp>只更新受影响项；公开协议同时遵守\u003ca href=\"#docs/development/contract-workflow.md::\">契约 workflow\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>改动\u003c/th>\n\u003cth>同步范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Settings\u003c/td>\n\u003ctd>core/settings.py 的 Field 范围 → .env.example → API lifespan / Worker startup 注入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AgentEventType\u003c/td>\n\u003ctd>agent/domain.py → engine.py mapper → Web RUN_EVENT_NAMES → RunEvent Schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillExecution / Brief / OutcomeEnvelope / 旧 Blueprint\u003c/td>\n\u003ctd>contract → DTO/validator/projector → frozen checksum → Worker/Web → example/test；不加业务专属字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Segment / Interaction / Proposal\u003c/td>\n\u003ctd>transition → DB/repository → event/outbox/SSE → 授权/幂等 → Web → recovery/Compose\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tool capability\u003c/td>\n\u003ctd>versioned request/response/error → Provider → tool_catalog.py 注册 → context_builder.py 冻结绑定/allowed_capabilities → 回归\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>endpoint\u003c/td>\n\u003ctd>资源 route/actor alias → response allowlist/Problem → Schema/example/OpenAPI → Web validator/barrel → 回归\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DB model\u003c/td>\n\u003ctd>db/models.py → migration → repository DTO/projection → 回归；无 relationship 的 FK 父子同事务新增时，父行后显式 flush()\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema / example\u003c/td>\n\u003ctd>同时注册 scripts/validate_contracts.py 和 backend/tests/contracts/test_contracts.py；保持 Problem 兼容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenAPI\u003c/td>\n\u003ctd>endpoint 修改后运行 scripts/export_openapi.py 并验一致性；只读审查不重导出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构化 log\u003c/td>\n\u003ctd>注册 core/logging.py 的 _CONTEXT_FIELDS allowlist\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>system Interpreter Skill\u003c/td>\n\u003ctd>SemVer/content hash、example identity、prompt checksum 与测试同步；model 执行规则需 prompt 回归\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>tests/ 镜像模块职责，测试名说明验证的行为。API 测试按资源拆分，共用 tests/api/fakes.py / conftest.py，不复制认证 fixture；fake SQL 与\u003ca href=\"#docs/development/local-development.md::%E5%AE%9F-postgresql-%E3%81%AE%E5%89%8D%E6%8F%90\">真实 DB\u003c/a>分开举证。\u003c/p>\n\u003ch2 id=\"ingress\">Ingress\u003c/h2>\n\u003cp>复用共享 Traefik，不新增其管理配置或 Docker socket mount；只有 web/api 进入 edge network，不发布 host port。\n外部入口统一在 SKILLMIND_CONTEXT_PATH 下，API 转发时去掉前缀。配置、网络与迁移操作见\u003ca href=\"#docs/operations/deployment.md::\">发布手册\u003c/a>，功能开关不能代替停写证明。\u003c/p>\n", "sections": [{"title": "按改动类型查阅的实现细则", "level": "h1", "anchor": "按改动类型查阅的实现细则", "text": "# 按改动类型查阅的实现细则\n\n按 [AGENTS](../../SKM/AGENTS.md)只读本次涉及的章节；领域规则见[变更指南](change-guide.md)，运行命令见[本地开发](local-development.md)。\nBackend 路径相对 SKM/backend/src/skillmind/，Web 路径相对 SKM/web/。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\nroute 只做认证/入出参，业务在 domain/service，查询/锁/持久化在 repository。公开 route 在 api/routes/ 资源模块单层实现，不增加未认证并行入口、转发 wrapper 或 ARQ job 内业务分支。\n\n同义处理必须复用唯一入口：\n\n| 处理 | 入口 / 限制 |\n| --- | --- |\n| JSON / SHA-256 | core/hashing.py：canonical_json / sha256_hex；源包索引按 skills/importer.py 的格式计算，不混用 JSON 与原字节摘要 |\n| 敏感字段 | core/redaction.py：find_sensitive_key；Evidence/Tool response 共用 |\n| Lease token | runs/domain.py：lease_token_hash |\n| RunEvent / Outbox | runs/repository_base.py 的 RunRepository：_snapshot_event、_event_outbox、_dispatch_outbox、_next_sequence |\n| 认证 Problem | api/auth_dependencies.py 共享 factory；Run 用 routes/runs.py 的 run_not_found_problem / authorized_run |\n| binding / Secret | agent/run_binding.py：load_bound_run_resource / resolve_binding_secret；检查 checksum、Integration 状态、provider/revision/capability |\n| 外部 repository | agent/repository_client.py / repository_source.py；物化/read/write 共用，不另写 subprocess/凭据解析 |\n| 可 apply effect | effects/catalog.py：EFFECT_CAPABILITIES，创建/执行/审批共用 |\n| Binary 转文字 | agent/binary_text.py：render_text / convert_excel_to_markdown，不在 Provider 复制 |\n\ndocuments/__init__.py 只导出 domain 类型，service/repository/source 显式导入，避免 DB → Run → 文档循环。\n\nGit 写入沿用上述共享实现；direct 仅默认 branch fast-forward，branch 仅新建 skillmind/ 命名空间 branch。授权、批准与未知结果统一见[外部效果](runtime-guide.md#外部效果)。"}, {"title": "Run lifecycle", "level": "h2", "anchor": "run-lifecycle", "text": "## Run lifecycle\n\n修改执行、认领、续行或取消时，查[执行与恢复边界](runtime-guide.md#执行与恢复)；仅改页面展示先查 [Workspace](../design/workspace.md)，不因此补齐全部执行链路。\n\n- 转换只经 plan_run_transition / ALLOWED_RUN_TRANSITIONS；锁序 Run → Segment → Attempt。旧 migration 路径仍为 Run → Attempt，不反转 _lock_claimed_execution。\n- 终态 RUN_SNAPSHOT 是最后一个 RunEvent。sequence 在 Run 内单调；TEXT_DELTA 消耗 sequence 但不持久化，允许缺号、不改子层编号。遵守 RunEvent Schema。\n- 重新 dispatch 也受 SKILLMIND_RUN_MAX_ATTEMPTS 限制，耗尽以 retry_exhausted 关闭为 FAILED。\n- wall_timeout_seconds 只中断 event 等待，不中断终态 transaction；ARQ job_timeout 必须更长，不能替代执行 deadline。\n- 子能力统一经 resolve_subagent_capabilities，分配与消费不混同；权限、返回和 Session 审计见[后置能力](runtime-guide.md#后置能力)。\n- 预算执行接线须满足[后置范围](runtime-guide.md#后置能力)，内部账本不等于实际执行受控。\n- 准备遵循[输入与文档](runtime-guide.md#输入与文档)，Result 遵循[结果与评价](runtime-guide.md#结果与评价)，不在 route/job 复制校验。\n- TaskSchedule 复用 RunService.create_task_run；版本、失效与迟发行为见[执行与恢复](runtime-guide.md#执行与恢复)。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n- 资源 client 放 src/api/，画面经 index.ts barrel；HTTP 只用 requestApiJson / requestApiEmpty。mutation 传 csrfToken / X-CSRF-Token，响应在 client 边界验证，纯逻辑放 src/lib/。\n- TasksPage 选任务，WorkspacePage 管理待办与报告，Run 详情归属历史；不重造 SSE/取消/终态 lifecycle。即时/调度共用 taskDraft.ts / TaskLaunchFields.tsx。\n- 不在前端重算服务端 ID（如 derive_task_id）。筛选/分页在服务端，不能过滤第一页冒充全量。\n- 三语统一 src/lib/i18n/{zh,ja,en}.ts，同步 UiMessages / MESSAGES；画面用 useMessages()。\n- 请求状态由对应 hook/组件持有，提交中的同步防重入与迟到响应归属检查不能只靠按钮 disabled。子组件定义放模块级，避免父组件编辑草稿时重建子树、丢失焦点或展开状态。\n- 实现生成 FrontendModule 时先完成威胁模型与 CSP/iframe 隔离回归，且不继承应用权限，见[后置能力](runtime-guide.md#后置能力)；普通 Web 页面不套用 builder/Host 门禁。"}, {"title": "同步点", "level": "h2", "anchor": "同步点", "text": "## 同步点\n\n只更新受影响项；公开协议同时遵守[契约 workflow](contract-workflow.md)。\n\n| 改动 | 同步范围 |\n| --- | --- |\n| Settings | core/settings.py 的 Field 范围 → .env.example → API lifespan / Worker startup 注入 |\n| AgentEventType | agent/domain.py → engine.py mapper → Web RUN_EVENT_NAMES → RunEvent Schema |\n| SkillExecution / Brief / OutcomeEnvelope / 旧 Blueprint | contract → DTO/validator/projector → frozen checksum → Worker/Web → example/test；不加业务专属字段 |\n| Segment / Interaction / Proposal | transition → DB/repository → event/outbox/SSE → 授权/幂等 → Web → recovery/Compose |\n| Tool capability | versioned request/response/error → Provider → tool_catalog.py 注册 → context_builder.py 冻结绑定/allowed_capabilities → 回归 |\n| endpoint | 资源 route/actor alias → response allowlist/Problem → Schema/example/OpenAPI → Web validator/barrel → 回归 |\n| DB model | db/models.py → migration → repository DTO/projection → 回归；无 relationship 的 FK 父子同事务新增时，父行后显式 flush() |\n| Schema / example | 同时注册 scripts/validate_contracts.py 和 backend/tests/contracts/test_contracts.py；保持 Problem 兼容 |\n| OpenAPI | endpoint 修改后运行 scripts/export_openapi.py 并验一致性；只读审查不重导出 |\n| 结构化 log | 注册 core/logging.py 的 _CONTEXT_FIELDS allowlist |\n| system Interpreter Skill | SemVer/content hash、example identity、prompt checksum 与测试同步；model 执行规则需 prompt 回归 |\n\ntests/ 镜像模块职责，测试名说明验证的行为。API 测试按资源拆分，共用 tests/api/fakes.py / conftest.py，不复制认证 fixture；fake SQL 与[真实 DB](local-development.md#実-postgresql-の前提)分开举证。"}, {"title": "Ingress", "level": "h2", "anchor": "ingress", "text": "## Ingress\n\n复用共享 Traefik，不新增其管理配置或 Docker socket mount；只有 web/api 进入 edge network，不发布 host port。\n外部入口统一在 SKILLMIND_CONTEXT_PATH 下，API 转发时去掉前缀。配置、网络与迁移操作见[发布手册](../operations/deployment.md)，功能开关不能代替停写证明。"}], "toc": [{"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "Run lifecycle", "anchor": "run-lifecycle", "level": "h2"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "同步点", "anchor": "同步点", "level": "h2"}, {"title": "Ingress", "anchor": "ingress", "level": "h2"}], "source": "development/coding-rules.md", "checksum": "0f44411917deb08ae8cf77e41917544550a7af2dcb3e755a7b353ff24aace916"}, {"id": "docs/development/contract-workflow.md", "title": "公开契约变更与联调", "group": "development", "html": "\u003ch1 id=\"公开契约变更与联调\">公开契约变更与联调\u003c/h1>\n\u003cp>本页适用于公开协议或持久格式变更；内部重构、样式和文案不因此新增 Schema、版本或 migration。维护边界见\u003ca href=\"#docs/development/runtime-guide.md::\">运行指南\u003c/a>，状态见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>，命令环境见\u003ca href=\"#docs/development/local-development.md::\">本地开发\u003c/a>。\u003c/p>\n\u003ch2 id=\"先看整条交付链\">先看整条交付链\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">领域规则/授权/兼容 → Schema/example → Backend\n  → Web/Worker → 契约与流程回归 → 版本匹配及发布\n\u003c/code>\u003c/pre>\n\u003cp>只改受影响层。新增 required、删字段、收窄 enum、改变空值或 HTTP 拒绝语义，即使 URL/v1 文件名不变也可能破坏兼容。\u003c/p>\n\u003ch2 id=\"三种数据不要混成一份\">三种数据不要混成一份\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>持久快照\u003c/td>\n\u003ctd>保存当时事实、格式版与 checksum，不为新页面重写旧 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公开响应\u003c/td>\n\u003ctd>授权后白名单投影，不直接暴露内部 JSON 或修改原值来脱敏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面状态\u003c/td>\n\u003ctd>validator 后生成视图，不补造历史资源、身份或缺失字段\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"开工时列出消费者和同步先后\">开工时列出消费者和同步先后\u003c/h2>\n\u003cp>按\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">同步表\u003c/a>识别实际消费者，包括 Worker/CLI/Schedule 等旁路；只同步受影响项。除了 JSON 字段，还需核对 route 的 status、media type、header、缓存和 Problem。\u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a>由 app 生成，不能手补。\nSchema 不验证授权/并发，OpenAPI 一致性不证明声明覆盖真实响应；例如登录 429 还须检查 Retry-After 和页面处理。\u003c/p>\n\u003ch2 id=\"遇到未接齐的交付链\">遇到未接齐的交付链\u003c/h2>\n\u003cp>从实际 route、装配和消费者定位缺口。DTO、example 或单模块测试存在，都不等于用户流程已接通；一致性或合跑失败须修复原断点，不能关闭校验来消除错误。\u003c/p>\n\u003cp>读检查不启动 lifespan、不连 DB、不回写。Backend 依赖就绪后，在 \u003ccode>SKM/\u003c/code> 执行 \u003ccode>python3 scripts/validate_contracts.py\u003c/code>；在 \u003ccode>SKM/backend/\u003c/code> 执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pytest -p no:cacheprovider -o addopts= -q \\\n  tests/contracts/test_contracts.py::test_exported_openapi_is_current\n\u003c/code>\u003c/pre>\n\u003cp>公开 API 变更时在 \u003ccode>SKM/\u003c/code> 运行 \u003ccode>python3 scripts/export_openapi.py\u003c/code>，并同步消费者和测试；只读审查和文档整理不重导出。\u003c/p>\n\u003ch2 id=\"历史数据兼容不等于前后端版本兼容\">历史数据兼容不等于前后端版本兼容\u003c/h2>\n\u003cul>\n\u003cli>新 API 读旧 Run：返回明确历史状态，不从当前资源补快照。\u003c/li>\n\u003cli>新 Web 读旧 API：只接受规定的兼容形状，必需字段不默认空数组。\u003c/li>\n\u003cli>旧 Web 读新 API：核对额外字段/enum；同批发布仍有旧浏览器、Worker 和在途请求。\u003c/li>\n\u003cli>API/Worker 回退：确认 schema、队列和非终态可读，不删审计或降低校验。\u003c/li>\n\u003c/ul>\n\u003cp>可选展示损坏可按既有规则降级；身份、授权和必需协议错误不能降级为成功。\u003c/p>\n\u003ch2 id=\"怎样记录验证结论\">怎样记录验证结论\u003c/h2>\n\u003cp>按本次范围报告文档、契约、Backend/Web、真实事务与部署/模型结果，明确 mock、失败、skip 和未执行。\n真实 DB/外部 write 只用获准的隔离目标。持续能力缺口更新计划，临时诊断留在交付结果，不追加历史文档或借用旧通过次数。\u003c/p>\n", "sections": [{"title": "公开契约变更与联调", "level": "h1", "anchor": "公开契约变更与联调", "text": "# 公开契约变更与联调\n\n本页适用于公开协议或持久格式变更；内部重构、样式和文案不因此新增 Schema、版本或 migration。维护边界见[运行指南](runtime-guide.md)，状态见[计划](../planning/roadmap.md)，命令环境见[本地开发](local-development.md)。"}, {"title": "先看整条交付链", "level": "h2", "anchor": "先看整条交付链", "text": "## 先看整条交付链\n\n```text\n领域规则/授权/兼容 → Schema/example → Backend\n  → Web/Worker → 契约与流程回归 → 版本匹配及发布\n```\n\n只改受影响层。新增 required、删字段、收窄 enum、改变空值或 HTTP 拒绝语义，即使 URL/v1 文件名不变也可能破坏兼容。"}, {"title": "三种数据不要混成一份", "level": "h2", "anchor": "三种数据不要混成一份", "text": "## 三种数据不要混成一份\n\n| 层 | 边界 |\n| --- | --- |\n| 持久快照 | 保存当时事实、格式版与 checksum，不为新页面重写旧 Run |\n| 公开响应 | 授权后白名单投影，不直接暴露内部 JSON 或修改原值来脱敏 |\n| 页面状态 | validator 后生成视图，不补造历史资源、身份或缺失字段 |"}, {"title": "开工时列出消费者和同步先后", "level": "h2", "anchor": "开工时列出消费者和同步先后", "text": "## 开工时列出消费者和同步先后\n\n按[同步表](coding-rules.md#同步点)识别实际消费者，包括 Worker/CLI/Schedule 等旁路；只同步受影响项。除了 JSON 字段，还需核对 route 的 status、media type、header、缓存和 Problem。[OpenAPI](../../SKM/contracts/openapi/skillmind-api.v1.json)由 app 生成，不能手补。\nSchema 不验证授权/并发，OpenAPI 一致性不证明声明覆盖真实响应；例如登录 429 还须检查 Retry-After 和页面处理。"}, {"title": "遇到未接齐的交付链", "level": "h2", "anchor": "遇到未接齐的交付链", "text": "## 遇到未接齐的交付链\n\n从实际 route、装配和消费者定位缺口。DTO、example 或单模块测试存在，都不等于用户流程已接通；一致性或合跑失败须修复原断点，不能关闭校验来消除错误。\n\n读检查不启动 lifespan、不连 DB、不回写。Backend 依赖就绪后，在 `SKM/` 执行 `python3 scripts/validate_contracts.py`；在 `SKM/backend/` 执行：\n\n```bash\npython3 -m pytest -p no:cacheprovider -o addopts= -q \\\n  tests/contracts/test_contracts.py::test_exported_openapi_is_current\n```\n\n公开 API 变更时在 `SKM/` 运行 `python3 scripts/export_openapi.py`，并同步消费者和测试；只读审查和文档整理不重导出。"}, {"title": "历史数据兼容不等于前后端版本兼容", "level": "h2", "anchor": "历史数据兼容不等于前后端版本兼容", "text": "## 历史数据兼容不等于前后端版本兼容\n\n- 新 API 读旧 Run：返回明确历史状态，不从当前资源补快照。\n- 新 Web 读旧 API：只接受规定的兼容形状，必需字段不默认空数组。\n- 旧 Web 读新 API：核对额外字段/enum；同批发布仍有旧浏览器、Worker 和在途请求。\n- API/Worker 回退：确认 schema、队列和非终态可读，不删审计或降低校验。\n\n可选展示损坏可按既有规则降级；身份、授权和必需协议错误不能降级为成功。"}, {"title": "怎样记录验证结论", "level": "h2", "anchor": "怎样记录验证结论", "text": "## 怎样记录验证结论\n\n按本次范围报告文档、契约、Backend/Web、真实事务与部署/模型结果，明确 mock、失败、skip 和未执行。\n真实 DB/外部 write 只用获准的隔离目标。持续能力缺口更新计划，临时诊断留在交付结果，不追加历史文档或借用旧通过次数。"}], "toc": [{"title": "先看整条交付链", "anchor": "先看整条交付链", "level": "h2"}, {"title": "三种数据不要混成一份", "anchor": "三种数据不要混成一份", "level": "h2"}, {"title": "开工时列出消费者和同步先后", "anchor": "开工时列出消费者和同步先后", "level": "h2"}, {"title": "遇到未接齐的交付链", "anchor": "遇到未接齐的交付链", "level": "h2"}, {"title": "历史数据兼容不等于前后端版本兼容", "anchor": "历史数据兼容不等于前后端版本兼容", "level": "h2"}, {"title": "怎样记录验证结论", "anchor": "怎样记录验证结论", "level": "h2"}], "source": "development/contract-workflow.md", "checksum": "345030667283cc643b4dcd6393d48f6046047f7f78a3d24819ee7862433fe2dc"}, {"id": "docs/development/api-usage.md", "title": "API 利用ガイド", "group": "development", "html": "\u003ch1 id=\"api-利用ガイド\">API 利用ガイド\u003c/h1>\n\u003cp>配備先の context path 配下に \u003ccode>/api/v1\u003c/code>、対話式仕様に \u003ccode>/api/docs\u003c/code> がある。正確な method/path/field は \u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a> と \u003ca href=\"#SKM/README.md::contracts\">Contracts\u003c/a> を参照する。\u003c/p>\n\u003ch2 id=\"認証\">認証\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>呼出元\u003c/th>\n\u003cth>方法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>外部アプリ\u003c/td>\n\u003ctd>\u003ccode>Authorization: Bearer \u0026lt;API_KEY\u0026gt;\u003c/code> または \u003ccode>X-API-Key: \u0026lt;API_KEY\u0026gt;\u003c/code> のどちらか一つ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ブラウザ session\u003c/td>\n\u003ctd>GET \u003ccode>/auth/login-context\u003c/code> → POST \u003ccode>/auth/login\u003c/code>。cookie、Origin、login CSRF を使用し、以後の unsafe request に業務用 \u003ccode>X-CSRF-Token\u003c/code> を送る\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>API Key は ADMIN が \u003ccode>/api-keys\u003c/code> で作成・一覧・失効でき、token 全文は作成時だけ取得する。現在は組織内全資源を扱う Key で、細粒度 scope はない。明示 Key の不正・重複時は拒否し、cookie へ fallback しない。Key 認証の API 操作は session login/CSRF を要しない。\u003c/p>\n\u003cp>資格情報を URL・command history・共有 log に置かない。login の 429 は Retry-After に従い、503 を password 誤りと扱わない。session 失効後の mutation を自動再送しない。アカウント契約は \u003ca href=\"../SKM/contracts/users/v1\">users/v1\u003c/a>。\u003c/p>\n\u003ch2 id=\"タスクの開始と観察\">タスクの開始と観察\u003c/h2>\n\u003col>\n\u003cli>GET \u003ccode>/projects/{id}/tasks\u003c/code> で精確な SkillVersion/task_key、入力 Schema と資源候補を取得する。\u003c/li>\n\u003cli>POST \u003ccode>/projects/{id}/task-runs\u003c/code> に\u003ca href=\"../SKM/contracts/runs/task-create/v1/request.schema.json\">作成契約\u003c/a>と新規 \u003ccode>Idempotency-Key\u003c/code> を送る。文書範囲と必要入力を省略しない。\u003c/li>\n\u003cli>GET \u003ccode>/projects/{id}/runs/{run_id}/detail\u003c/code> と Run events を読む。作成受理、プラットフォーム終了、業務成功は別の状態として扱う。\u003c/li>\n\u003c/ol>\n\u003cp>SSE の \u003ccode>Last-Event-ID\u003c/code> / \u003ccode>after\u003c/code> は持続 event の再開に使う。一時 TEXT_DELTA で再開位置を進めない。キャンセルは Run の cancel endpoint を使い、受付後も終態を確認する。\u003c/p>\n\u003cp>終了履歴は Project 配下の \u003ccode>/runs/{run_id}\u003c/code> を DELETE して回収する。このパスに付ける \u003ccode>/deletion-preview\u003c/code> の GET で対象を確認でき、\u003ccode>/restore\u003c/code> の POST で復元、\u003ccode>/purge\u003c/code> の DELETE で完全削除する。完全削除は回収後に行い、原入力・共有参照・最小監査を保護する。外部 DB や Git のデータは削除されない。\u003c/p>\n\u003ch2 id=\"文書とディレクトリ\">文書とディレクトリ\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/api/routes/documents.py\">documents route\u003c/a> と OpenAPI から、一覧・アップロード・元 byte 取得、\u003ccode>document-folders\u003c/code>、\u003ccode>document-operations\u003c/code> を利用する。改名、移動、directory 作成、回収・復元は共通操作契約を使う。完全削除は \u003ccode>DELETE /projects/{project_id}/documents/{document_id}?purge=true\u003c/code> を使い、参照保護と回収状態を確認する。表示 path を blob key として組み立てない。\u003c/p>\n\u003cp>タスクの文書入力用 \u003ccode>sources\u003c/code> 値は \u003ccode>document:\u0026lt;UUID\u0026gt;\u003c/code>、\u003ccode>documents:\u0026lt;UUID\u0026gt;,\u0026lt;UUID\u0026gt;...\u003c/code>、明示的な \u003ccode>project-documents:all\u003c/code> を使う。directory 選択は、候補一覧からその配下の文書 ID を集合にして送る。directory path 自体は指定せず、作成後に追加された文書を旧 Run に含めない。任意 slot 未使用は省略する。\nRun detail の document_snapshots は作成時の範囲であり、現在の内容可読性を保証しない。LEGACY_UNAVAILABLE/INVALID を空の正常 snapshot に置換しない。\u003c/p>\n\u003ch2 id=\"回答批准評価\">回答・批准・評価\u003c/h2>\n\u003cul>\n\u003cli>普通の回答は \u003ccode>/projects/{id}/runs/{run_id}/interactions/{interaction_id}/responses\u003c/code> に原 version・\u003ca href=\"../SKM/contracts/runs/interaction-response/v1/request.schema.json\">回答契約\u003c/a>・Idempotency-Key を送る。\u003c/li>\n\u003cli>Proposal decision は普通回答と別 endpoint。原 version/checksum を維持し、現在の権限と適用可能な起動時同意を再確認する。\u003c/li>\n\u003cli>人工評価は \u003ccode>evaluation-submissions\u003c/code> に submission_key と result_id を付ける。\u003ca href=\"../SKM/contracts/evaluations/v1/create-request.schema.json\">評価契約\u003c/a>に従い、元 Result を上書きしない。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"再送と復旧\">再送と復旧\u003c/h2>\n\u003cp>timeout/abort は取消や rollback の証明ではない。原 actor・内容・key を保って確認し、結果不明のまま別 key で再実行しない。409 は競合、410 は期限を確認し、Run/Interaction の現状を再読する。404 も原操作の未実行証明ではない。\u003c/p>\n\u003cp>現在の認証と Project 授権は確認時にも必要。旧 Run を現在設定から再構成せず、\u003ca href=\"#docs/development/contract-workflow.md::%E5%8E%86%E5%8F%B2%E6%95%B0%E6%8D%AE%E5%85%BC%E5%AE%B9%E4%B8%8D%E7%AD%89%E4%BA%8E%E5%89%8D%E5%90%8E%E7%AB%AF%E7%89%88%E6%9C%AC%E5%85%BC%E5%AE%B9\">版互換\u003c/a>と\u003ca href=\"#docs/development/runtime-guide.md::\">実行境界\u003c/a>を維持する。\u003c/p>\n", "sections": [{"title": "API 利用ガイド", "level": "h1", "anchor": "api-利用ガイド", "text": "# API 利用ガイド\n\n配備先の context path 配下に `/api/v1`、対話式仕様に `/api/docs` がある。正確な method/path/field は [OpenAPI](../../SKM/contracts/openapi/skillmind-api.v1.json) と [Contracts](../../SKM/README.md#contracts) を参照する。"}, {"title": "認証", "level": "h2", "anchor": "認証", "text": "## 認証\n\n| 呼出元 | 方法 |\n| --- | --- |\n| 外部アプリ | `Authorization: Bearer \u003cAPI_KEY>` または `X-API-Key: \u003cAPI_KEY>` のどちらか一つ |\n| ブラウザ session | GET `/auth/login-context` → POST `/auth/login`。cookie、Origin、login CSRF を使用し、以後の unsafe request に業務用 `X-CSRF-Token` を送る |\n\nAPI Key は ADMIN が `/api-keys` で作成・一覧・失効でき、token 全文は作成時だけ取得する。現在は組織内全資源を扱う Key で、細粒度 scope はない。明示 Key の不正・重複時は拒否し、cookie へ fallback しない。Key 認証の API 操作は session login/CSRF を要しない。\n\n資格情報を URL・command history・共有 log に置かない。login の 429 は Retry-After に従い、503 を password 誤りと扱わない。session 失効後の mutation を自動再送しない。アカウント契約は [users/v1](../../SKM/contracts/users/v1/)。"}, {"title": "タスクの開始と観察", "level": "h2", "anchor": "タスクの開始と観察", "text": "## タスクの開始と観察\n\n1. GET `/projects/{id}/tasks` で精確な SkillVersion/task_key、入力 Schema と資源候補を取得する。\n2. POST `/projects/{id}/task-runs` に[作成契約](../../SKM/contracts/runs/task-create/v1/request.schema.json)と新規 `Idempotency-Key` を送る。文書範囲と必要入力を省略しない。\n3. GET `/projects/{id}/runs/{run_id}/detail` と Run events を読む。作成受理、プラットフォーム終了、業務成功は別の状態として扱う。\n\nSSE の `Last-Event-ID` / `after` は持続 event の再開に使う。一時 TEXT_DELTA で再開位置を進めない。キャンセルは Run の cancel endpoint を使い、受付後も終態を確認する。\n\n終了履歴は Project 配下の `/runs/{run_id}` を DELETE して回収する。このパスに付ける `/deletion-preview` の GET で対象を確認でき、`/restore` の POST で復元、`/purge` の DELETE で完全削除する。完全削除は回収後に行い、原入力・共有参照・最小監査を保護する。外部 DB や Git のデータは削除されない。"}, {"title": "文書とディレクトリ", "level": "h2", "anchor": "文書とディレクトリ", "text": "## 文書とディレクトリ\n\n[documents route](../../SKM/backend/src/skillmind/api/routes/documents.py) と OpenAPI から、一覧・アップロード・元 byte 取得、`document-folders`、`document-operations` を利用する。改名、移動、directory 作成、回収・復元は共通操作契約を使う。完全削除は `DELETE /projects/{project_id}/documents/{document_id}?purge=true` を使い、参照保護と回収状態を確認する。表示 path を blob key として組み立てない。\n\nタスクの文書入力用 `sources` 値は `document:\u003cUUID>`、`documents:\u003cUUID>,\u003cUUID>...`、明示的な `project-documents:all` を使う。directory 選択は、候補一覧からその配下の文書 ID を集合にして送る。directory path 自体は指定せず、作成後に追加された文書を旧 Run に含めない。任意 slot 未使用は省略する。\nRun detail の document_snapshots は作成時の範囲であり、現在の内容可読性を保証しない。LEGACY_UNAVAILABLE/INVALID を空の正常 snapshot に置換しない。"}, {"title": "回答・批准・評価", "level": "h2", "anchor": "回答批准評価", "text": "## 回答・批准・評価\n\n- 普通の回答は `/projects/{id}/runs/{run_id}/interactions/{interaction_id}/responses` に原 version・[回答契約](../../SKM/contracts/runs/interaction-response/v1/request.schema.json)・Idempotency-Key を送る。\n- Proposal decision は普通回答と別 endpoint。原 version/checksum を維持し、現在の権限と適用可能な起動時同意を再確認する。\n- 人工評価は `evaluation-submissions` に submission_key と result_id を付ける。[評価契約](../../SKM/contracts/evaluations/v1/create-request.schema.json)に従い、元 Result を上書きしない。"}, {"title": "再送と復旧", "level": "h2", "anchor": "再送と復旧", "text": "## 再送と復旧\n\ntimeout/abort は取消や rollback の証明ではない。原 actor・内容・key を保って確認し、結果不明のまま別 key で再実行しない。409 は競合、410 は期限を確認し、Run/Interaction の現状を再読する。404 も原操作の未実行証明ではない。\n\n現在の認証と Project 授権は確認時にも必要。旧 Run を現在設定から再構成せず、[版互換](contract-workflow.md#历史数据兼容不等于前后端版本兼容)と[実行境界](runtime-guide.md)を維持する。"}], "toc": [{"title": "認証", "anchor": "認証", "level": "h2"}, {"title": "タスクの開始と観察", "anchor": "タスクの開始と観察", "level": "h2"}, {"title": "文書とディレクトリ", "anchor": "文書とディレクトリ", "level": "h2"}, {"title": "回答・批准・評価", "anchor": "回答批准評価", "level": "h2"}, {"title": "再送と復旧", "anchor": "再送と復旧", "level": "h2"}], "source": "development/api-usage.md", "checksum": "69550fcc7ea020e68e52b07213a6ceca5f12dad02b4999f535d7519642fa2aa6"}, {"id": "docs/development/documentation.md", "title": "文档维护", "group": "development", "html": "\u003ch1 id=\"文档维护\">文档维护\u003c/h1>\n\u003cp>正式文档只保留指导当前使用、开发与运维的内容。入口是\u003ca href=\"#docs/README.md::\">文档指南\u003c/a>，代码模块导航集中在 \u003ca href=\"#SKM/README.md::\">SKM README\u003c/a>。\u003c/p>\n\u003ch2 id=\"保留什么\">保留什么\u003c/h2>\n\u003cul>\n\u003cli>用户需要执行的操作、维护者必须保持的边界、可运行的验证和恢复命令。\u003c/li>\n\u003cli>关键取舍及其代码/契约入口；详细字段、状态图和实现步骤直接引用源码，不再维护平行规格。\u003c/li>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::\">Roadmap\u003c/a>只记录当前能力、待复验事项与依据实际效果确定的下一步。没有可靠分母时不用百分比估算。\u003c/li>\n\u003c/ul>\n\u003cp>每条规则只在一个指南维护，其他位置链接引用。废弃详细设计、重复结构图和逐轮进度日志不归档到正式目录，历史用 Git 查询。使用场景未变化时不机械更新进度。\u003c/p>\n\u003ch2 id=\"整理边界\">整理边界\u003c/h2>\n\u003cp>\u003ccode>SKILL.md\u003c/code>、Skill 的 references/Schema/template 是执行输入，不属于产品文档整理；不要改写业务规则、冻结内容或模型配置。\n保留有实际消费者的稳定锚点，删除页面后同步入口和工具检查；不要创建空重定向文档维持旧目录规模。\u003c/p>\n\u003cp>文档不收录凭据、内部地址、真实业务正文和临时验收数据。示例使用合成值。仅生成器读取正式 Markdown 和三个工程入口，不扫描 \u003ccode>.env\u003c/code> 或依赖目录。\u003c/p>\n\u003ch2 id=\"构建与检查\">构建与检查\u003c/h2>\n\u003cp>在 \u003ccode>SKM/\u003c/code> 执行，HTML 是生成物，不直接修改：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 -m pip install --user -r scripts/docs-requirements.txt\npython3 scripts/build_docs.py\npython3 scripts/build_docs.py --check\npython3 -m unittest discover -s scripts/tests -p 'test_build_docs.py' -v\n\u003c/code>\u003c/pre>\n\u003cp>构建检查标题、围栏、链接、锚点及存在的契约示例，\u003ccode>--check\u003c/code> 同时检查生成结果是否最新。文档入口/分组变化时更新 build_docs.py 与对应导航回归；不把旧篇数或详细设计的章节数当作必要功能。\u003c/p>\n\u003cp>布局或导航改变后，安装 \u003ca href=\"#docs/development/local-development.md::%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E5%9B%9E%E5%B8%B0\">Web 浏览器测试依赖\u003c/a>并运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/check_docs_browser.py --output /tmp/skillmind-docs-check\n\u003c/code>\u003c/pre>\n\u003cp>检查全页和章节在不同窗口、字号下的布局、搜索、实际链接、键盘、历史和打印；仅访问本地生成文档，不调用业务环境。外置依赖使用 PYTHONPATH，浏览器使用 PLAYWRIGHT_BROWSERS_PATH。\u003c/p>\n\u003cp>文档整理无需运行业务任务、真实数据库或模型；生成器发生逻辑改动时运行其测试。完成时说明删改范围、实际检查和未验证限制。\u003c/p>\n", "sections": [{"title": "文档维护", "level": "h1", "anchor": "文档维护", "text": "# 文档维护\n\n正式文档只保留指导当前使用、开发与运维的内容。入口是[文档指南](../README.md)，代码模块导航集中在 [SKM README](../../SKM/README.md)。"}, {"title": "保留什么", "level": "h2", "anchor": "保留什么", "text": "## 保留什么\n\n- 用户需要执行的操作、维护者必须保持的边界、可运行的验证和恢复命令。\n- 关键取舍及其代码/契约入口；详细字段、状态图和实现步骤直接引用源码，不再维护平行规格。\n- [Roadmap](../planning/roadmap.md)只记录当前能力、待复验事项与依据实际效果确定的下一步。没有可靠分母时不用百分比估算。\n\n每条规则只在一个指南维护，其他位置链接引用。废弃详细设计、重复结构图和逐轮进度日志不归档到正式目录，历史用 Git 查询。使用场景未变化时不机械更新进度。"}, {"title": "整理边界", "level": "h2", "anchor": "整理边界", "text": "## 整理边界\n\n`SKILL.md`、Skill 的 references/Schema/template 是执行输入，不属于产品文档整理；不要改写业务规则、冻结内容或模型配置。\n保留有实际消费者的稳定锚点，删除页面后同步入口和工具检查；不要创建空重定向文档维持旧目录规模。\n\n文档不收录凭据、内部地址、真实业务正文和临时验收数据。示例使用合成值。仅生成器读取正式 Markdown 和三个工程入口，不扫描 `.env` 或依赖目录。"}, {"title": "构建与检查", "level": "h2", "anchor": "构建与检查", "text": "## 构建与检查\n\n在 `SKM/` 执行，HTML 是生成物，不直接修改：\n\n```bash\npython3 -m pip install --user -r scripts/docs-requirements.txt\npython3 scripts/build_docs.py\npython3 scripts/build_docs.py --check\npython3 -m unittest discover -s scripts/tests -p 'test_build_docs.py' -v\n```\n\n构建检查标题、围栏、链接、锚点及存在的契约示例，`--check` 同时检查生成结果是否最新。文档入口/分组变化时更新 build_docs.py 与对应导航回归；不把旧篇数或详细设计的章节数当作必要功能。\n\n布局或导航改变后，安装 [Web 浏览器测试依赖](local-development.md#ブラウザ回帰)并运行：\n\n```bash\npython3 scripts/check_docs_browser.py --output /tmp/skillmind-docs-check\n```\n\n检查全页和章节在不同窗口、字号下的布局、搜索、实际链接、键盘、历史和打印；仅访问本地生成文档，不调用业务环境。外置依赖使用 PYTHONPATH，浏览器使用 PLAYWRIGHT_BROWSERS_PATH。\n\n文档整理无需运行业务任务、真实数据库或模型；生成器发生逻辑改动时运行其测试。完成时说明删改范围、实际检查和未验证限制。"}], "toc": [{"title": "保留什么", "anchor": "保留什么", "level": "h2"}, {"title": "整理边界", "anchor": "整理边界", "level": "h2"}, {"title": "构建与检查", "anchor": "构建与检查", "level": "h2"}], "source": "development/documentation.md", "checksum": "afeb31a9d9cfce9f46fdad34a7d7c0e01c40097a46c5e549aabe1ab5ea0aa7b3"}, {"id": "docs/operations/quickstart.md", "title": "起動と初期管理者", "group": "operations", "html": "\u003ch1 id=\"起動と初期管理者\">起動と初期管理者\u003c/h1>\n\u003cp>Windows で構築し、Linux では初回・更新とも \u003ccode>make deploy\u003c/code> を使う。配置と設定は\u003ca href=\"#docs/operations/deployment.md::\">配備手順\u003c/a>、データ復元は\u003ca href=\"#docs/operations/backup-recovery.md::\">backup\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"compose-の前提\">Compose の前提\u003c/h2>\n\u003cp>Windows は Rancher Desktop（Moby）+ PowerShell + Docker Compose、Linux は Docker Compose v2 + GNU make を使う。宿主 Python/Node は不要。共有 Traefik と external edge network は既存基盤を利用する。\u003c/p>\n\u003ch2 id=\"image-移送と更新\">Image 移送と更新\u003c/h2>\n\u003cp>Windows の \u003ccode>SKM/\u003c/code> で実行する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">docker compose build api web\n.\\scripts\\export-images.ps1\n\u003c/code>\u003c/pre>\n\u003cp>再 export は \u003ccode>-Force\u003c/code> を付ける。\u003cstrong>images/images.tar、compose.yml、Makefile\u003c/strong> を Linux の同一 directory へコピーし、サーバー \u003ccode>.env\u003c/code> を維持する。完全 offline の初回は\u003ca href=\"#docs/operations/deployment.md::windows-%E6%9E%84%E5%BB%BA%E4%B8%8E%E7%A7%BB%E9%80%81\">基盤 image も同梱\u003c/a>する。\u003c/p>\n\u003ch2 id=\"初回設定と基盤起動\">初回設定と基盤起動\u003c/h2>\n\u003cp>\u003ccode>.env\u003c/code> が無い初回だけ \u003ccode>.env.example\u003c/code> から作り、host/context path、TLS、Traefik network、DB/ストレージ、KEK/model を設定する。Web context path は構築時と一致させ、production は HTTPS を使う。新ストレージには非零 UUID の \u003ccode>SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID\u003c/code> を設定し、更新時は既存値・project 名・データ卷を維持する。\u003c/p>\n\u003cp>四 file のある Linux directory で：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make deploy\n\u003c/code>\u003c/pre>\n\u003cp>image 導入、基盤と bucket の準備、DB migration、API/Worker/Maintenance/Web 起動を順に行う。失敗時は表示された stage と原 error を確認する。更新の判断と失敗時の操作は\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E5%89%8D%E7%BD%AE%E4%B8%8E%E6%89%A7%E8%A1%8C\">配備手順\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"最初の-admin-を作成する\">最初の ADMIN を作成する\u003c/h2>\n\u003cp>初回 deploy 成功後、email/display name/password を対話入力する：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make bootstrap-admin\n\u003c/code>\u003c/pre>\n\u003cp>既存 ADMIN があれば拒否する。password 再設定や data 再初期化には使わない。\u003c/p>\n\u003ch2 id=\"最初の業務実行\">最初の業務実行\u003c/h2>\n\u003cp>ADMIN でログインし、Project/メンバー、Integration/資源、Skill の導入・説明確認・公開を行う。業務配送には \u003ccode>SKILLMIND_WORKER_DISPATCH_ENABLED=true\u003c/code>、使用能力には\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E5%89%8D%E7%BD%AE%E4%B8%8E%E6%89%A7%E8%A1%8C\">対応する機能設定\u003c/a>が必要。承認済み環境と入力で実行し、成果・根拠・保存先を確認する。実モデルや外部書込は計費・永続化を伴う。\u003c/p>\n\u003ch2 id=\"操作の区別\">操作の区別\u003c/h2>\n\u003cp>\u003ccode>make status\u003c/code> は一覧、\u003ccode>make logs\u003c/code> は直近 log、\u003ccode>make logs-follow\u003c/code> は追跡、\u003ccode>make stop\u003c/code> は基盤を含む停止、\u003ccode>make down\u003c/code> は container/network の削除（named volume は維持）。\u003ccode>make run\u003c/code> は deploy の別名。通常操作で volume を削除しない。\u003c/p>\n", "sections": [{"title": "起動と初期管理者", "level": "h1", "anchor": "起動と初期管理者", "text": "# 起動と初期管理者\n\nWindows で構築し、Linux では初回・更新とも `make deploy` を使う。配置と設定は[配備手順](deployment.md)、データ復元は[backup](backup-recovery.md)を参照する。"}, {"title": "Compose の前提", "level": "h2", "anchor": "compose-の前提", "text": "## Compose の前提\n\nWindows は Rancher Desktop（Moby）+ PowerShell + Docker Compose、Linux は Docker Compose v2 + GNU make を使う。宿主 Python/Node は不要。共有 Traefik と external edge network は既存基盤を利用する。"}, {"title": "Image 移送と更新", "level": "h2", "anchor": "image-移送と更新", "text": "## Image 移送と更新\n\nWindows の `SKM/` で実行する：\n\n```powershell\ndocker compose build api web\n.\\scripts\\export-images.ps1\n```\n\n再 export は `-Force` を付ける。**images/images.tar、compose.yml、Makefile** を Linux の同一 directory へコピーし、サーバー `.env` を維持する。完全 offline の初回は[基盤 image も同梱](deployment.md#windows-构建与移送)する。"}, {"title": "初回設定と基盤起動", "level": "h2", "anchor": "初回設定と基盤起動", "text": "## 初回設定と基盤起動\n\n`.env` が無い初回だけ `.env.example` から作り、host/context path、TLS、Traefik network、DB/ストレージ、KEK/model を設定する。Web context path は構築時と一致させ、production は HTTPS を使う。新ストレージには非零 UUID の `SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID` を設定し、更新時は既存値・project 名・データ卷を維持する。\n\n四 file のある Linux directory で：\n\n```bash\nmake deploy\n```\n\nimage 導入、基盤と bucket の準備、DB migration、API/Worker/Maintenance/Web 起動を順に行う。失敗時は表示された stage と原 error を確認する。更新の判断と失敗時の操作は[配備手順](deployment.md#迁移前置与执行)を参照する。"}, {"title": "最初の ADMIN を作成する", "level": "h2", "anchor": "最初の-admin-を作成する", "text": "## 最初の ADMIN を作成する\n\n初回 deploy 成功後、email/display name/password を対話入力する：\n\n```bash\nmake bootstrap-admin\n```\n\n既存 ADMIN があれば拒否する。password 再設定や data 再初期化には使わない。"}, {"title": "最初の業務実行", "level": "h2", "anchor": "最初の業務実行", "text": "## 最初の業務実行\n\nADMIN でログインし、Project/メンバー、Integration/資源、Skill の導入・説明確認・公開を行う。業務配送には `SKILLMIND_WORKER_DISPATCH_ENABLED=true`、使用能力には[対応する機能設定](deployment.md#迁移前置与执行)が必要。承認済み環境と入力で実行し、成果・根拠・保存先を確認する。実モデルや外部書込は計費・永続化を伴う。"}, {"title": "操作の区別", "level": "h2", "anchor": "操作の区別", "text": "## 操作の区別\n\n`make status` は一覧、`make logs` は直近 log、`make logs-follow` は追跡、`make stop` は基盤を含む停止、`make down` は container/network の削除（named volume は維持）。`make run` は deploy の別名。通常操作で volume を削除しない。"}], "toc": [{"title": "Compose の前提", "anchor": "compose-の前提", "level": "h2"}, {"title": "Image 移送と更新", "anchor": "image-移送と更新", "level": "h2"}, {"title": "初回設定と基盤起動", "anchor": "初回設定と基盤起動", "level": "h2"}, {"title": "最初の ADMIN を作成する", "anchor": "最初の-admin-を作成する", "level": "h2"}, {"title": "最初の業務実行", "anchor": "最初の業務実行", "level": "h2"}, {"title": "操作の区別", "anchor": "操作の区別", "level": "h2"}], "source": "operations/quickstart.md", "checksum": "36ac0c21334e629fb922a22da79688106074a0a1639e4deaf9cc86250dd2187d"}, {"id": "docs/operations/deployment.md", "title": "发布、迁移与启动", "group": "operations", "html": "\u003ch1 id=\"发布迁移与启动\">发布、迁移与启动\u003c/h1>\n\u003cp>Windows 构建镜像，Linux 用 Docker Compose + GNU make 部署。首次与更新均执行 \u003ccode>make deploy\u003c/code>；首次配置见\u003ca href=\"#docs/operations/quickstart.md::\">启动\u003c/a>，数据恢复见\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复\u003c/a>。\u003c/p>\n\u003ch2 id=\"环境文件与配置边界\">环境文件与配置边界\u003c/h2>\n\u003cp>服务器同一部署目录放置 \u003ccode>images.tar\u003c/code>、\u003ccode>compose.yml\u003c/code>、\u003ccode>.env\u003c/code>、\u003ccode>Makefile\u003c/code>。\u003ca href=\"../SKM/compose.yml\">Compose\u003c/a>定义服务，\u003ca href=\"../SKM/Makefile\">Makefile\u003c/a>定义部署步骤；更新替换镜像包、Compose 和 Makefile，保留服务器 \u003ccode>.env\u003c/code>。镜像只含 system Interpreter，业务 Skill 从页面导入。\u003c/p>\n\u003cp>默认读取当前目录 \u003ccode>.env\u003c/code>，不要 source/include dotenv。特殊路径先 \u003ccode>export ENV_FILE=/path/app.env\u003c/code>，再执行 \u003ccode>make deploy\u003c/code>；原生 Compose 命令对应传 \u003ccode>--env-file \u0026quot;${ENV_FILE:-.env}\u0026quot;\u003c/code>。更新保持原 \u003ccode>COMPOSE_PROJECT_NAME\u003c/code> 和数据卷，避免误连空环境。\u003c/p>\n\u003cp>复用已有 Traefik 和外部网络，不发布 host port。域名、TLS、网络及 \u003ccode>SKILLMIND_CONTEXT_PATH\u003c/code> 须匹配；Web context path 编入镜像，修改服务器配置后仍需重建 Web。production 使用 HTTPS，可信代理范围按实际网络设置。\u003c/p>\n\u003cp>\u003ccode>SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID\u003c/code> 必须是非零 UUID，并由全部 Backend 共用。新存储生成新值，更新保留既有值；更换 endpoint/bucket 或重建存储不自动迁移旧文档，不能复用 UUID 绕过归属检查。preflight 检查配置，不检查对象读写。服务器显式设置内容类型白名单时，更新不会替换它；Excel 上传须允许 \u003ccode>.xlsx\u003c/code> / \u003ccode>.xls\u003c/code> 的真实 MIME。\u003c/p>\n\u003ch2 id=\"agent-sdk-与-device-code-登录\">Agent SDK 与 device code 登录\u003c/h2>\n\u003cp>API、业务 \u003ccode>worker\u003c/code> 和 \u003ccode>maintenance\u003c/code> 共用 Backend 镜像与 \u003ccode>.env\u003c/code>。业务 Worker 执行模型与工具；维护 Worker 在独立队列运行 Outbox、回收和定时触发，不挂载 Run/Codex 卷。更新须包含三个服务。\u003c/p>\n\u003cp>\u003ccode>SKILLMIND_AGENT_SDK\u003c/code> 选择解释器与 Run 引擎，默认 Codex；模型、思考强度与 Codex 数据目录配置见\u003ca href=\"../SKM/.env.example\">环境模板\u003c/a>。更新时保留服务器已有值，只补缺失字段，不用模板默认值覆盖已选模型或代理。\u003c/p>\n\u003cp>部署后执行设备登录，在命令给出的网页输入一次性代码并等待成功；第二条只检查登录状态：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T worker python -m skillmind.agent.codex_login\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T worker python -m skillmind.agent.codex_login --status\n\u003c/code>\u003c/pre>\n\u003cp>登录与原生会话保存在 \u003ccode>codex-data\u003c/code>，更新保留该卷。不要复制宿主 \u003ccode>.codex\u003c/code> 或把凭据放入镜像。需代理时设置 \u003ccode>SKILLMIND_WORKER_HTTP_PROXY\u003c/code> / \u003ccode>SKILLMIND_WORKER_HTTPS_PROXY\u003c/code> / \u003ccode>SKILLMIND_WORKER_NO_PROXY\u003c/code> 后重建业务 Worker；Compose 自动保留内部服务和 loopback 直连。认证服务与模型服务都须可达。\u003c/p>\n\u003cp>使用 Claude 时显式设置 \u003ccode>SKILLMIND_AGENT_SDK=claude\u003c/code>，配套设置 Anthropic 兼容端点、凭据和模型，示例见\u003ca href=\"../SKM/.env.example\">配置模板\u003c/a>。切换前核清活动解释与 Run，同批更新 Backend；不同引擎的原生会话不能互相恢复，失败不会自动切换引擎。\u003c/p>\n\u003ch2 id=\"迁移前置与执行\">迁移前置与执行\u003c/h2>\n\u003cp>普通重新部署沿用现有数据和配置。涉及数据库变更时，按实际 migration 评估兼容性、在途执行和恢复点；数据恢复另走\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复流程\u003c/a>。不要并发部署或在部署期间改写镜像 tag、配置。\u003c/p>\n\u003cp>\u003ccode>make deploy\u003c/code> 停止当前 Compose project 的应用服务，迁移后自动恢复后台并消费队列。涉及停写的操作还须核对其他实例及远端在途请求；Makefile 不提供全局停写。\u003ccode>SKILLMIND_WORKER_DISPATCH_ENABLED=false\u003c/code> 会阻止新业务 job 的配送/执行，不能取消正在进行的调用，也不停止维护进程。\u003c/p>\n\u003cp>按需要启用功能，以下配置默认均为 \u003ccode>false\u003c/code>，API/Worker/Maintenance 保持一致：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>配置前缀均为 \u003ccode>SKILLMIND_\u003c/code>\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>WORKER_DISPATCH_ENABLED\u003c/code>\u003c/td>\n\u003ctd>Run、Effect、解释和核对 job 的配送/执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DATABASE_WRITES_ENABLED\u003c/code>\u003c/td>\n\u003ctd>PostgreSQL INSERT/UPDATE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DOCUMENT_WRITES_ENABLED\u003c/code>\u003c/td>\n\u003ctd>项目文档库 Artifact CREATE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GIT_WRITES_ENABLED\u003c/code>\u003c/td>\n\u003ctd>受控 Git commit/push\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>MCP_TOOLS_ENABLED\u003c/code>\u003c/td>\n\u003ctd>已授权 MCP 工具发现、查询和受控调用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>SCHEDULING_ENABLED\u003c/code>\u003c/td>\n\u003ctd>定时触发；仍需业务配送开启\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DEFERRED_FEATURES_ENABLED\u003c/code>\u003c/td>\n\u003ctd>其他后置能力；不作为单项功能的默认启用方式\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>功能开关之外仍需资源范围、任务绑定和批准。启动画面的自动批准涵盖 DB/文档、Git 和 MCP，平台按原请求中各项同意验证，旧 Run 不因更新扩权；边界见\u003ca href=\"#docs/development/runtime-guide.md::\">运行与资源指南\u003c/a>。数据库写入前，由目标库管理员应用\u003ca href=\"../SKM/scripts/sql/postgres-effect-receipts.sql\">回执表 SQL\u003c/a>，向执行角色授予 schema USAGE、回执表 SELECT/INSERT 及必要业务表权限；不授回执修改/删除权限。\u003c/p>\n\u003cp>MCP 连接填写完整 Streamable HTTP \u003ccode>/mcp\u003c/code> 地址与凭据，在资源编辑页取得工具、选择整体访问权限后保存；新发现工具须保存后才授权。任务声明并绑定所需能力；目录或绑定变化后通过新 Run 使用新快照。旧权限格式升级需重新发现和保存，Skill 声明变化时重新导入。\u003c/p>\n\u003ch3 id=\"windows-构建与移送\">Windows 构建与移送\u003c/h3>\n\u003cp>在源码 \u003ccode>SKM/\u003c/code> 的 PowerShell 执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">docker compose build api web\n.\\scripts\\export-images.ps1\n\u003c/code>\u003c/pre>\n\u003cp>再次导出加 \u003ccode>-Force\u003c/code>。导出固定应用 tag \u003ccode>skillmind/backend:0.1.0\u003c/code> 和 \u003ccode>skillmind/web:0.1.0\u003c/code>，不执行 build/pull；失败保留旧 archive，\u003ccode>.partial\u003c/code> 不是成品。只改 Web 可仅构建 \u003ccode>web\u003c/code>，导出仍需两个应用镜像。构建架构须匹配服务器，导出不转换架构。\u003c/p>\n\u003cp>按\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">环境文件布局\u003c/a>移送导出包。基建镜像缺失时部署会拉取；完全离线的初次部署先在 Windows 准备并同包导出：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">docker compose pull postgres redis object-storage object-storage-init\n.\\scripts\\export-images.ps1 -IncludeInfrastructure -Force\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"linux-核验与部署\">Linux 核验与部署\u003c/h3>\n\u003cp>在四文件目录执行 \u003ccode>make deploy\u003c/code>。主要阶段如下：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>configuration / load-images / prepare-images\u003c/td>\n\u003ctd>校验配置、导入应用镜像、补齐基建并检查架构\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stop-application / infrastructure / initialize-storage\u003c/td>\n\u003ctd>停止当前应用、启动基建、创建 bucket\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>migration-check / migrate / readiness\u003c/td>\n\u003ctd>核合法迁移路径、upgrade head、核 DB head/Redis/存储配置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>backend / runtime-check / web\u003c/td>\n\u003ctd>同批重建 API/Worker/Maintenance，核一致性后恢复 Web\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>失败会显示原始错误、阶段和退出码并停止后续步骤；已完成步骤不会自动回滚，已启动后台可能继续运行。先检查再决定重试：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make status\nmake logs\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; run --rm -T --no-deps migrate alembic current\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; run --rm -T --no-deps migrate alembic heads\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"同批更新与检查\">同批更新与检查\u003c/h2>\n\u003cp>\u003ccode>make runtime-check\u003c/code> 检查 Backend 各副本的实际 image ID 和配置 fingerprint，不调用模型、创建 Run 或查询业务数据。独立执行失败只返回非零，不停止容器。检查一致不证明登录、网络、blob/KEK 或业务结果正确。\u003c/p>\n\u003ch2 id=\"迁移与回退审查\">迁移与回退审查\u003c/h2>\n\u003cp>只核本次实际涉及的 \u003ca href=\"../SKM/backend/migrations/versions\">migration\u003c/a> 与协议消费者。未知 revision、多 head 或迁移失败时先核 DB 状态，不 stamp、删审计或清队列。旧镜像仅在兼容当前 schema、快照和队列时可恢复使用，见\u003ca href=\"#docs/operations/backup-recovery.md::%E5%BA%94%E7%94%A8%E7%89%88%E6%9C%AC%E5%9B%9E%E9%80%80\">应用版本回退\u003c/a>。\u003c/p>\n\u003ch2 id=\"仅更新-web\">仅更新 Web\u003c/h2>\n\u003cp>仅构建 Web 后仍正常导出并执行 \u003ccode>make deploy\u003c/code>，包含未变的 Backend 镜像；此流程会停机、检查迁移并重启应用。发布前确认 API/契约/context path 兼容。\u003c/p>\n", "sections": [{"title": "发布、迁移与启动", "level": "h1", "anchor": "发布迁移与启动", "text": "# 发布、迁移与启动\n\nWindows 构建镜像，Linux 用 Docker Compose + GNU make 部署。首次与更新均执行 `make deploy`；首次配置见[启动](quickstart.md)，数据恢复见[恢复](backup-recovery.md)。"}, {"title": "环境文件与配置边界", "level": "h2", "anchor": "环境文件与配置边界", "text": "## 环境文件与配置边界\n\n服务器同一部署目录放置 `images.tar`、`compose.yml`、`.env`、`Makefile`。[Compose](../../SKM/compose.yml)定义服务，[Makefile](../../SKM/Makefile)定义部署步骤；更新替换镜像包、Compose 和 Makefile，保留服务器 `.env`。镜像只含 system Interpreter，业务 Skill 从页面导入。\n\n默认读取当前目录 `.env`，不要 source/include dotenv。特殊路径先 `export ENV_FILE=/path/app.env`，再执行 `make deploy`；原生 Compose 命令对应传 `--env-file \"${ENV_FILE:-.env}\"`。更新保持原 `COMPOSE_PROJECT_NAME` 和数据卷，避免误连空环境。\n\n复用已有 Traefik 和外部网络，不发布 host port。域名、TLS、网络及 `SKILLMIND_CONTEXT_PATH` 须匹配；Web context path 编入镜像，修改服务器配置后仍需重建 Web。production 使用 HTTPS，可信代理范围按实际网络设置。\n\n`SKILLMIND_OBJECT_STORAGE_NAMESPACE_ID` 必须是非零 UUID，并由全部 Backend 共用。新存储生成新值，更新保留既有值；更换 endpoint/bucket 或重建存储不自动迁移旧文档，不能复用 UUID 绕过归属检查。preflight 检查配置，不检查对象读写。服务器显式设置内容类型白名单时，更新不会替换它；Excel 上传须允许 `.xlsx` / `.xls` 的真实 MIME。"}, {"title": "Agent SDK 与 device code 登录", "level": "h2", "anchor": "agent-sdk-与-device-code-登录", "text": "## Agent SDK 与 device code 登录\n\nAPI、业务 `worker` 和 `maintenance` 共用 Backend 镜像与 `.env`。业务 Worker 执行模型与工具；维护 Worker 在独立队列运行 Outbox、回收和定时触发，不挂载 Run/Codex 卷。更新须包含三个服务。\n\n`SKILLMIND_AGENT_SDK` 选择解释器与 Run 引擎，默认 Codex；模型、思考强度与 Codex 数据目录配置见[环境模板](../../SKM/.env.example)。更新时保留服务器已有值，只补缺失字段，不用模板默认值覆盖已选模型或代理。\n\n部署后执行设备登录，在命令给出的网页输入一次性代码并等待成功；第二条只检查登录状态：\n\n```bash\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec -T worker python -m skillmind.agent.codex_login\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec -T worker python -m skillmind.agent.codex_login --status\n```\n\n登录与原生会话保存在 `codex-data`，更新保留该卷。不要复制宿主 `.codex` 或把凭据放入镜像。需代理时设置 `SKILLMIND_WORKER_HTTP_PROXY` / `SKILLMIND_WORKER_HTTPS_PROXY` / `SKILLMIND_WORKER_NO_PROXY` 后重建业务 Worker；Compose 自动保留内部服务和 loopback 直连。认证服务与模型服务都须可达。\n\n使用 Claude 时显式设置 `SKILLMIND_AGENT_SDK=claude`，配套设置 Anthropic 兼容端点、凭据和模型，示例见[配置模板](../../SKM/.env.example)。切换前核清活动解释与 Run，同批更新 Backend；不同引擎的原生会话不能互相恢复，失败不会自动切换引擎。"}, {"title": "迁移前置与执行", "level": "h2", "anchor": "迁移前置与执行", "text": "## 迁移前置与执行\n\n普通重新部署沿用现有数据和配置。涉及数据库变更时，按实际 migration 评估兼容性、在途执行和恢复点；数据恢复另走[恢复流程](backup-recovery.md)。不要并发部署或在部署期间改写镜像 tag、配置。\n\n`make deploy` 停止当前 Compose project 的应用服务，迁移后自动恢复后台并消费队列。涉及停写的操作还须核对其他实例及远端在途请求；Makefile 不提供全局停写。`SKILLMIND_WORKER_DISPATCH_ENABLED=false` 会阻止新业务 job 的配送/执行，不能取消正在进行的调用，也不停止维护进程。\n\n按需要启用功能，以下配置默认均为 `false`，API/Worker/Maintenance 保持一致：\n\n| 配置前缀均为 `SKILLMIND_` | 用途 |\n| --- | --- |\n| `WORKER_DISPATCH_ENABLED` | Run、Effect、解释和核对 job 的配送/执行 |\n| `DATABASE_WRITES_ENABLED` | PostgreSQL INSERT/UPDATE |\n| `DOCUMENT_WRITES_ENABLED` | 项目文档库 Artifact CREATE |\n| `GIT_WRITES_ENABLED` | 受控 Git commit/push |\n| `MCP_TOOLS_ENABLED` | 已授权 MCP 工具发现、查询和受控调用 |\n| `SCHEDULING_ENABLED` | 定时触发；仍需业务配送开启 |\n| `DEFERRED_FEATURES_ENABLED` | 其他后置能力；不作为单项功能的默认启用方式 |\n\n功能开关之外仍需资源范围、任务绑定和批准。启动画面的自动批准涵盖 DB/文档、Git 和 MCP，平台按原请求中各项同意验证，旧 Run 不因更新扩权；边界见[运行与资源指南](../development/runtime-guide.md)。数据库写入前，由目标库管理员应用[回执表 SQL](../../SKM/scripts/sql/postgres-effect-receipts.sql)，向执行角色授予 schema USAGE、回执表 SELECT/INSERT 及必要业务表权限；不授回执修改/删除权限。\n\nMCP 连接填写完整 Streamable HTTP `/mcp` 地址与凭据，在资源编辑页取得工具、选择整体访问权限后保存；新发现工具须保存后才授权。任务声明并绑定所需能力；目录或绑定变化后通过新 Run 使用新快照。旧权限格式升级需重新发现和保存，Skill 声明变化时重新导入。"}, {"title": "Windows 构建与移送", "level": "h3", "anchor": "windows-构建与移送", "text": "### Windows 构建与移送\n\n在源码 `SKM/` 的 PowerShell 执行：\n\n```powershell\ndocker compose build api web\n.\\scripts\\export-images.ps1\n```\n\n再次导出加 `-Force`。导出固定应用 tag `skillmind/backend:0.1.0` 和 `skillmind/web:0.1.0`，不执行 build/pull；失败保留旧 archive，`.partial` 不是成品。只改 Web 可仅构建 `web`，导出仍需两个应用镜像。构建架构须匹配服务器，导出不转换架构。\n\n按[环境文件布局](#环境文件与配置边界)移送导出包。基建镜像缺失时部署会拉取；完全离线的初次部署先在 Windows 准备并同包导出：\n\n```powershell\ndocker compose pull postgres redis object-storage object-storage-init\n.\\scripts\\export-images.ps1 -IncludeInfrastructure -Force\n```"}, {"title": "Linux 核验与部署", "level": "h3", "anchor": "linux-核验与部署", "text": "### Linux 核验与部署\n\n在四文件目录执行 `make deploy`。主要阶段如下：\n\n| 阶段 | 行为 |\n| --- | --- |\n| configuration / load-images / prepare-images | 校验配置、导入应用镜像、补齐基建并检查架构 |\n| stop-application / infrastructure / initialize-storage | 停止当前应用、启动基建、创建 bucket |\n| migration-check / migrate / readiness | 核合法迁移路径、upgrade head、核 DB head/Redis/存储配置 |\n| backend / runtime-check / web | 同批重建 API/Worker/Maintenance，核一致性后恢复 Web |\n\n失败会显示原始错误、阶段和退出码并停止后续步骤；已完成步骤不会自动回滚，已启动后台可能继续运行。先检查再决定重试：\n\n```bash\nmake status\nmake logs\ndocker compose --env-file \"${ENV_FILE:-.env}\" run --rm -T --no-deps migrate alembic current\ndocker compose --env-file \"${ENV_FILE:-.env}\" run --rm -T --no-deps migrate alembic heads\n```"}, {"title": "同批更新与检查", "level": "h2", "anchor": "同批更新与检查", "text": "## 同批更新与检查\n\n`make runtime-check` 检查 Backend 各副本的实际 image ID 和配置 fingerprint，不调用模型、创建 Run 或查询业务数据。独立执行失败只返回非零，不停止容器。检查一致不证明登录、网络、blob/KEK 或业务结果正确。"}, {"title": "迁移与回退审查", "level": "h2", "anchor": "迁移与回退审查", "text": "## 迁移与回退审查\n\n只核本次实际涉及的 [migration](../../SKM/backend/migrations/versions/) 与协议消费者。未知 revision、多 head 或迁移失败时先核 DB 状态，不 stamp、删审计或清队列。旧镜像仅在兼容当前 schema、快照和队列时可恢复使用，见[应用版本回退](backup-recovery.md#应用版本回退)。"}, {"title": "仅更新 Web", "level": "h2", "anchor": "仅更新-web", "text": "## 仅更新 Web\n\n仅构建 Web 后仍正常导出并执行 `make deploy`，包含未变的 Backend 镜像；此流程会停机、检查迁移并重启应用。发布前确认 API/契约/context path 兼容。"}], "toc": [{"title": "环境文件与配置边界", "anchor": "环境文件与配置边界", "level": "h2"}, {"title": "Agent SDK 与 device code 登录", "anchor": "agent-sdk-与-device-code-登录", "level": "h2"}, {"title": "迁移前置与执行", "anchor": "迁移前置与执行", "level": "h2"}, {"title": "Windows 构建与移送", "anchor": "windows-构建与移送", "level": "h3"}, {"title": "Linux 核验与部署", "anchor": "linux-核验与部署", "level": "h3"}, {"title": "同批更新与检查", "anchor": "同批更新与检查", "level": "h2"}, {"title": "迁移与回退审查", "anchor": "迁移与回退审查", "level": "h2"}, {"title": "仅更新 Web", "anchor": "仅更新-web", "level": "h2"}], "source": "operations/deployment.md", "checksum": "e65a8e19a8454938d1bc0cd6c570d798059f9be7762809a6ccf94b277bc1209b"}, {"id": "docs/operations/backup-recovery.md", "title": "备份、恢复与版本回退", "group": "operations", "html": "\u003ch1 id=\"备份恢复与版本回退\">备份、恢复与版本回退\u003c/h1>\n\u003cp>本页用于数据保护、故障恢复和版本回退。日常部署见\u003ca href=\"#docs/operations/deployment.md::\">发布\u003c/a>；按数据价值、实际迁移和恢复需求安排备份。\u003c/p>\n\u003ch2 id=\"取得恢复点\">取得恢复点\u003c/h2>\n\u003cp>取得跨数据库、对象存储与运行文件的一致恢复点时，先关闭新业务/触发，核清在途写入并停止全部写入者；未知外部效果按\u003ca href=\"#docs/operations/runbook.md::incident-%E4%B8%8E-recovery\">原身份对账\u003c/a>。仅停一个实例或设 dispatch=false 不能证明全局停写。\u003c/p>\n\u003ch3 id=\"一致恢复点包含什么\">一致恢复点包含什么\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>资产\u003c/th>\n\u003cth>保留内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>PostgreSQL\u003c/td>\n\u003ctd>完整 dump、数据库身份、migration revision、停写时点；保留快照、原请求、批准、Outbox 与审计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>对象存储\u003c/td>\n\u003ctd>Skill/文档/附件原字节、key/hash、DB 引用及存储 namespace/配置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 与 Codex 卷\u003c/td>\n\u003ctd>需要恢复的 workspace、输入、transcript、原生会话；登录材料按凭据保护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>镜像与配置\u003c/td>\n\u003ctd>应用与依赖 image ID、兼容配置及 context path\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>KEK\u003c/td>\n\u003ctd>当前及旧备份所需版本，独立于 dump 受控保管\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部事实\u003c/td>\n\u003ctd>原操作 ID、回执、远端 revision 和恢复点后的写入/撤权变化\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>记录恢复点 ID、UTC 窗口、资产引用和 checksum、缺项与恢复演练结果。Redis 不是业务正本，旧队列/lease/调度须独立对账；不清空 Redis 代替恢复。当前没有跨存储自动备份或统一恢复工具，DB dump 本身不能恢复全部系统。\u003c/p>\n\u003ch3 id=\"取得并检查数据库备份\">取得并检查数据库备份\u003c/h3>\n\u003cp>在目标部署目录执行，只备份 DB；两块使用同一 shell。失败文件保留为现场，不认定为有效备份。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">umask 077\nSKM_BACKUP_DIR=\u0026quot;$(mktemp -d ./skillmind-backup-XXXXXXXX)\u0026quot; \u0026amp;\u0026amp;\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres sh -ceu \\\n  'pg_dump --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; --format=custom' \\\n  \u0026gt; \u0026quot;${SKM_BACKUP_DIR:?Backup directory is required}/database.dump\u0026quot;\n\u003c/code>\u003c/pre>\n\u003cp>成功后检查 archive 目录并生成校验值；密码不入命令行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${SKM_BACKUP_DIR:?Specify the directory created for this backup}\u0026quot;\n  test -s \u0026quot;$SKM_BACKUP_DIR/database.dump\u0026quot;\n  docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres pg_restore --list \\\n    \u0026lt; \u0026quot;$SKM_BACKUP_DIR/database.dump\u0026quot; \u0026gt; \u0026quot;$SKM_BACKUP_DIR/database.toc\u0026quot;\n  docker image inspect skillmind/backend:0.1.0 skillmind/web:0.1.0 \\\n    --format '{{.RepoTags}} {{.Id}}' \u0026gt; \u0026quot;$SKM_BACKUP_DIR/images.txt\u0026quot;\n  cd \u0026quot;$SKM_BACKUP_DIR\u0026quot;\n  sha256sum database.dump \u0026gt; database.dump.sha256\n  sha256sum --check database.dump.sha256\n)\n\u003c/code>\u003c/pre>\n\u003cp>dump、TOC、运行文件和配置均受控保存；checksum 证明完整性，不证明来源或可恢复性。完整恢复能力须在隔离环境演练。\u003c/p>\n\u003ch2 id=\"数据库恢复\">数据库恢复\u003c/h2>\n\u003cp>\u003cstrong>以下会删除并替换数据库，丢失恢复点后的本地数据。\u003c/strong> 确认恢复目标、保全当前现场，并核实 dump 及关联资产、兼容镜像、旧 KEK、停写范围后执行。先设置 \u003ccode>SKM_RESTORE_DIR\u003c/code> 为已核验备份目录。\u003c/p>\n\u003ch3 id=\"恢复前的停止条件\">恢复前的停止条件\u003c/h3>\n\u003cp>先检查材料；失败即停：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${SKM_RESTORE_DIR:?Specify the verified backup directory}\u0026quot;\n  test -s \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot;\n  docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres pg_restore --list \\\n    \u0026lt; \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot; \u0026gt; /dev/null\n  cd \u0026quot;$SKM_RESTORE_DIR\u0026quot;\n  sha256sum --check database.dump.sha256\n)\n\u003c/code>\u003c/pre>\n\u003cp>确认其他实例也已停写，再停止本 project 应用并核 DB/角色；输出须与恢复目标一致：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; stop api web worker maintenance migrate object-storage-init\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres sh -ceu '\n  psql --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; --no-psqlrc \\\n    --set=ON_ERROR_STOP=1 --command=\u0026quot;SELECT current_database(), current_user\u0026quot;\n'\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"替换数据库\">替换数据库\u003c/h3>\n\u003cp>示例以原应用角色恢复；多 owner 或自定义权限先验证对应方案：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${SKM_RESTORE_DIR:?Specify the verified backup directory}\u0026quot;\n  test -s \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot;\n  docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres sh -ceu '\n    dropdb --force --username=\u0026quot;$POSTGRES_USER\u0026quot; \u0026quot;$POSTGRES_DB\u0026quot;\n    createdb --username=\u0026quot;$POSTGRES_USER\u0026quot; --owner=\u0026quot;$POSTGRES_USER\u0026quot; \u0026quot;$POSTGRES_DB\u0026quot;\n  '\n  docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec -T postgres sh -ceu '\n    pg_restore --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; \\\n      --no-owner --single-transaction --exit-on-error\n  ' \u0026lt; \u0026quot;$SKM_RESTORE_DIR/database.dump\u0026quot;\n)\n\u003c/code>\u003c/pre>\n\u003cp>单事务只保护 pg_restore，失败可能留下空库；保持业务关闭。恢复 DB 不撤销远端写入，还可能恢复旧权限和已撤销会话。\u003c/p>\n\u003ch3 id=\"恢复后验证\">恢复后验证\u003c/h3>\n\u003cp>恢复关联 blob/运行文件、兼容配置与 KEK，核 migration revision、资产字节/引用、权限与会话、队列/lease/调度及原外部回执。缺输入、transcript 或可信回执的 Run 不能认定可续行；不换键重放 UNKNOWN，也不补签历史。\u003c/p>\n\u003cp>恢复核验期间不要执行会自动启动后台的 \u003ccode>make deploy\u003c/code>。通过原生 Compose 分步启动已核验服务，核清事实后再放行业务 Worker、维护 Worker 和普通入口；记录实际损失、恢复耗时与未解决事项。\u003c/p>\n\u003ch2 id=\"应用版本回退\">应用版本回退\u003c/h2>\n\u003cp>先确认旧 API/Web/Worker 能理解当前 schema、数据、队列和非终态快照，再使用已核验旧镜像。旧 tag 或旧镜像包不等于完整恢复方案；不兼容时保持隔离，选择向前修复或完整恢复，不试跑破坏性 downgrade、stamp 或删除审计。\u003c/p>\n", "sections": [{"title": "备份、恢复与版本回退", "level": "h1", "anchor": "备份恢复与版本回退", "text": "# 备份、恢复与版本回退\n\n本页用于数据保护、故障恢复和版本回退。日常部署见[发布](deployment.md)；按数据价值、实际迁移和恢复需求安排备份。"}, {"title": "取得恢复点", "level": "h2", "anchor": "取得恢复点", "text": "## 取得恢复点\n\n取得跨数据库、对象存储与运行文件的一致恢复点时，先关闭新业务/触发，核清在途写入并停止全部写入者；未知外部效果按[原身份对账](runbook.md#incident-与-recovery)。仅停一个实例或设 dispatch=false 不能证明全局停写。"}, {"title": "一致恢复点包含什么", "level": "h3", "anchor": "一致恢复点包含什么", "text": "### 一致恢复点包含什么\n\n| 资产 | 保留内容 |\n| --- | --- |\n| PostgreSQL | 完整 dump、数据库身份、migration revision、停写时点；保留快照、原请求、批准、Outbox 与审计 |\n| 对象存储 | Skill/文档/附件原字节、key/hash、DB 引用及存储 namespace/配置 |\n| Run 与 Codex 卷 | 需要恢复的 workspace、输入、transcript、原生会话；登录材料按凭据保护 |\n| 镜像与配置 | 应用与依赖 image ID、兼容配置及 context path |\n| KEK | 当前及旧备份所需版本，独立于 dump 受控保管 |\n| 外部事实 | 原操作 ID、回执、远端 revision 和恢复点后的写入/撤权变化 |\n\n记录恢复点 ID、UTC 窗口、资产引用和 checksum、缺项与恢复演练结果。Redis 不是业务正本，旧队列/lease/调度须独立对账；不清空 Redis 代替恢复。当前没有跨存储自动备份或统一恢复工具，DB dump 本身不能恢复全部系统。"}, {"title": "取得并检查数据库备份", "level": "h3", "anchor": "取得并检查数据库备份", "text": "### 取得并检查数据库备份\n\n在目标部署目录执行，只备份 DB；两块使用同一 shell。失败文件保留为现场，不认定为有效备份。\n\n```bash\numask 077\nSKM_BACKUP_DIR=\"$(mktemp -d ./skillmind-backup-XXXXXXXX)\" \u0026\u0026\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres sh -ceu \\\n  'pg_dump --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" --format=custom' \\\n  > \"${SKM_BACKUP_DIR:?Backup directory is required}/database.dump\"\n```\n\n成功后检查 archive 目录并生成校验值；密码不入命令行：\n\n```bash\n(\n  set -eu\n  : \"${SKM_BACKUP_DIR:?Specify the directory created for this backup}\"\n  test -s \"$SKM_BACKUP_DIR/database.dump\"\n  docker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres pg_restore --list \\\n    \u003c \"$SKM_BACKUP_DIR/database.dump\" > \"$SKM_BACKUP_DIR/database.toc\"\n  docker image inspect skillmind/backend:0.1.0 skillmind/web:0.1.0 \\\n    --format '{{.RepoTags}} {{.Id}}' > \"$SKM_BACKUP_DIR/images.txt\"\n  cd \"$SKM_BACKUP_DIR\"\n  sha256sum database.dump > database.dump.sha256\n  sha256sum --check database.dump.sha256\n)\n```\n\ndump、TOC、运行文件和配置均受控保存；checksum 证明完整性，不证明来源或可恢复性。完整恢复能力须在隔离环境演练。"}, {"title": "数据库恢复", "level": "h2", "anchor": "数据库恢复", "text": "## 数据库恢复\n\n**以下会删除并替换数据库，丢失恢复点后的本地数据。** 确认恢复目标、保全当前现场，并核实 dump 及关联资产、兼容镜像、旧 KEK、停写范围后执行。先设置 `SKM_RESTORE_DIR` 为已核验备份目录。"}, {"title": "恢复前的停止条件", "level": "h3", "anchor": "恢复前的停止条件", "text": "### 恢复前的停止条件\n\n先检查材料；失败即停：\n\n```bash\n(\n  set -eu\n  : \"${SKM_RESTORE_DIR:?Specify the verified backup directory}\"\n  test -s \"$SKM_RESTORE_DIR/database.dump\"\n  docker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres pg_restore --list \\\n    \u003c \"$SKM_RESTORE_DIR/database.dump\" > /dev/null\n  cd \"$SKM_RESTORE_DIR\"\n  sha256sum --check database.dump.sha256\n)\n```\n\n确认其他实例也已停写，再停止本 project 应用并核 DB/角色；输出须与恢复目标一致：\n\n```bash\ndocker compose --env-file \"${ENV_FILE:-.env}\" stop api web worker maintenance migrate object-storage-init\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres sh -ceu '\n  psql --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" --no-psqlrc \\\n    --set=ON_ERROR_STOP=1 --command=\"SELECT current_database(), current_user\"\n'\n```"}, {"title": "替换数据库", "level": "h3", "anchor": "替换数据库", "text": "### 替换数据库\n\n示例以原应用角色恢复；多 owner 或自定义权限先验证对应方案：\n\n```bash\n(\n  set -eu\n  : \"${SKM_RESTORE_DIR:?Specify the verified backup directory}\"\n  test -s \"$SKM_RESTORE_DIR/database.dump\"\n  docker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres sh -ceu '\n    dropdb --force --username=\"$POSTGRES_USER\" \"$POSTGRES_DB\"\n    createdb --username=\"$POSTGRES_USER\" --owner=\"$POSTGRES_USER\" \"$POSTGRES_DB\"\n  '\n  docker compose --env-file \"${ENV_FILE:-.env}\" exec -T postgres sh -ceu '\n    pg_restore --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" \\\n      --no-owner --single-transaction --exit-on-error\n  ' \u003c \"$SKM_RESTORE_DIR/database.dump\"\n)\n```\n\n单事务只保护 pg_restore，失败可能留下空库；保持业务关闭。恢复 DB 不撤销远端写入，还可能恢复旧权限和已撤销会话。"}, {"title": "恢复后验证", "level": "h3", "anchor": "恢复后验证", "text": "### 恢复后验证\n\n恢复关联 blob/运行文件、兼容配置与 KEK，核 migration revision、资产字节/引用、权限与会话、队列/lease/调度及原外部回执。缺输入、transcript 或可信回执的 Run 不能认定可续行；不换键重放 UNKNOWN，也不补签历史。\n\n恢复核验期间不要执行会自动启动后台的 `make deploy`。通过原生 Compose 分步启动已核验服务，核清事实后再放行业务 Worker、维护 Worker 和普通入口；记录实际损失、恢复耗时与未解决事项。"}, {"title": "应用版本回退", "level": "h2", "anchor": "应用版本回退", "text": "## 应用版本回退\n\n先确认旧 API/Web/Worker 能理解当前 schema、数据、队列和非终态快照，再使用已核验旧镜像。旧 tag 或旧镜像包不等于完整恢复方案；不兼容时保持隔离，选择向前修复或完整恢复，不试跑破坏性 downgrade、stamp 或删除审计。"}], "toc": [{"title": "取得恢复点", "anchor": "取得恢复点", "level": "h2"}, {"title": "一致恢复点包含什么", "anchor": "一致恢复点包含什么", "level": "h3"}, {"title": "取得并检查数据库备份", "anchor": "取得并检查数据库备份", "level": "h3"}, {"title": "数据库恢复", "anchor": "数据库恢复", "level": "h2"}, {"title": "恢复前的停止条件", "anchor": "恢复前的停止条件", "level": "h3"}, {"title": "替换数据库", "anchor": "替换数据库", "level": "h3"}, {"title": "恢复后验证", "anchor": "恢复后验证", "level": "h3"}, {"title": "应用版本回退", "anchor": "应用版本回退", "level": "h2"}], "source": "operations/backup-recovery.md", "checksum": "ad8dd7289a6c1d784a2198d956e868944c2866a903ce950962e677841f1455f3"}, {"id": "docs/operations/runbook.md", "title": "Skillmind 运维与故障排查", "group": "operations", "html": "\u003ch1 id=\"skillmind-运维与故障排查\">Skillmind 运维与故障排查\u003c/h1>\n\u003cp>从症状定位服务和原请求，再决定处理方式。启动见\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>、升级见\u003ca href=\"#docs/operations/deployment.md::\">发布\u003c/a>、数据恢复见\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复\u003c/a>，运行边界见\u003ca href=\"#docs/development/runtime-guide.md::\">运行与资源指南\u003c/a>。\u003c/p>\n\u003ch2 id=\"运用原则\">运用原则\u003c/h2>\n\u003cp>优先查看原响应、Run/Attempt/Effect ID 和脱敏日志。PostgreSQL 是正本；不改状态、删审计、清队列或换键消除错误。只分享 UTC、版本、对象 ID、公开错误码和影响范围，不上传 \u003ccode>.env\u003c/code>、凭据或业务正文。\u003c/p>\n\u003cp>命令在已确认 ENV_FILE/project 的部署目录执行。已授权操作按其范围继续；排障本身不授权真实模型、停机、恢复或外部写入。\u003c/p>\n\u003ch2 id=\"服务与队列\">服务与队列\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">make status\nmake runtime-check\ndocker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; logs --no-log-prefix --tail=200 api worker maintenance\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>核对\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>API 不健康或版本不一致\u003c/td>\n\u003ctd>部署阶段、migration head、DB/Redis 和 runtime-check；按\u003ca href=\"#docs/operations/deployment.md::linux-%E6%A0%B8%E9%AA%8C%E4%B8%8E%E9%83%A8%E7%BD%B2\">发布\u003c/a>定位原错误\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新任务不执行、批准后不续行\u003c/td>\n\u003ctd>dispatch 开关、\u003ccode>worker\u003c/code> 与 \u003ccode>maintenance\u003c/code> 健康状态、原 Outbox/job；两队列都要运行，不重建 Run 催执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行慢、页面更新慢\u003c/td>\n\u003ctd>按\u003ca href=\"#docs/operations/run-performance.md::\">耗时观测\u003c/a>区分准备、模型/工具等待、收尾与展示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型认证或网络失败\u003c/td>\n\u003ctd>Worker 设备登录状态、出口代理和认证/模型服务连通性；配置 fingerprint 不验证登录\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"认证故障的只读分诊\">认证故障的只读分诊\u003c/h2>\n\u003cp>记录 path（无参数）、status/code/request_id，只核 header 存在性、cookie 属性和 Origin，不记录值。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>响应\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>401 invalid_credentials / authentication_required\u003c/td>\n\u003ctd>核环境、会话期限和权限；bootstrap 只用于首个 ADMIN，不能重置账户\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 csrf_rejected\u003c/td>\n\u003ctd>核 Origin scheme/host/port、CSRF header 与当前会话；保全未确认请求，不直接重发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 administrator_required / 404\u003c/td>\n\u003ctd>区分系统 ADMIN 与 ProjectMember；404 也可能隐藏越权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 project_archived / 版本冲突\u003c/td>\n\u003ctd>读取原对象最新状态，保留原请求；归档不会取消在途 Run/Effect\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422\u003c/td>\n\u003ctd>按公开契约修正输入，不分享包含密码的原值\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>会话读取可能更新 idle，login-context 会建立 challenge 并消耗配额，不能反复请求作为健康探针。修改密码被拒绝不代表当前会话失效。\u003c/p>\n\u003ch2 id=\"登录防护的排查与恢复\">登录防护的排查与恢复\u003c/h2>\n\u003cp>429 按 \u003ccode>Retry-After\u003c/code> 停止快速重试，核共享出口和可信代理。503 \u003ccode>login_protection_unavailable\u003c/code> 核 Redis 权限、容量、TTL 与超时；PING 不能证明登录所需命令可用。不 FLUSHDB、删配额或轮换来源绕过限制。\u003c/p>\n\u003ch2 id=\"文档保存与删除的只读分诊\">文档保存与删除的只读分诊\u003c/h2>\n\u003cp>保留 Project/document ID、原 upload key 和响应。改名、移动和恢复保持同一文档 ID；原上传回执保留上传时路径，排障按 ID 与内容身份核对，不能仅凭名称差异判断回执损坏。超限或 MIME 拒绝应修正文件/配置；存储异常先核 namespace、连接和权限。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>上传未知、PENDING 或原 key 查无\u003c/td>\n\u003ctd>继续按原 key 核回执，不换键重传或释放占用；查无不证明旧请求未提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已 PUBLISHED 但列表无文件\u003c/td>\n\u003ctd>按原 document ID 核后续移动/删除，不同名补建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除 409\u003c/td>\n\u003ctd>查 Run、调度及历史引用；引用无法确认时保留，不拆外键或删审计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除 503 或响应中断\u003c/td>\n\u003ctd>先读原文档当前状态，再核原上传记录与存储；元数据可能已提交删除，不因错误响应换 ID 重做\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下载缺失/hash 不符、切存储后不可读\u003c/td>\n\u003ctd>按原 ID/key/hash 和恢复点核对，不改 hash、复用 namespace 或覆盖同名文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除后对象/配额仍在\u003c/td>\n\u003ctd>元数据删除不证明存储清理和配额结算完成；无通用孤立对象清理 CLI，不递归删前缀\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>回收箱可恢复，完全删除不可恢复；两者仍受原始输入、共享引用和未知操作保护。项目删除还受执行删除审计、调度、成员审计及文档等引用保护；执行列表为空时仍可能返回执行审计占用，应保持归档。\u003c/p>\n\u003ch2 id=\"准备故障的只读分诊\">准备故障的只读分诊\u003c/h2>\n\u003cp>\u003ccode>RUNNING\u003c/code> 且无 Session 时先查 Context 准备、输入回执和 Brief。\u003ccode>preparation_timeout\u003c/code> 核准备超时配置与资源耗时；\u003ccode>context_build_failed\u003c/code> 核冻结来源和绑定。保留原输入世代及 workspace，不删目录、补 READY 或用今日 HEAD/同名文件替代冻结输入。\u003c/p>\n\u003cp>反复接管时核 lease、Attempt 时间线和错误；租约到期不证明旧调用已停止。已接受取消也不证明 SDK/远端进程已退出。恢复能力须按实际 engine/model、输入和会话材料验证。\u003c/p>\n\u003ch2 id=\"waiting-状态\">WAITING 状态\u003c/h2>\n\u003cp>\u003ccode>WAITING_FOR_INPUT/APPROVAL\u003c/code> 是非终态。查看原 Interaction/Proposal 和期限后答复或批准；已批准 Effect 可独立执行，不重复批准。请求返回超时、410 或断线时先读原状态；自动批准范围以原 Run 启动同意为准，开关或 Project 权限不能补造同意。\u003c/p>\n\u003ch2 id=\"结果与评价的只读分诊\">结果与评价的只读分诊\u003c/h2>\n\u003cp>Run 成功不等于业务全部完成；同时查看结果的 PARTIAL/BLOCKED、证据与平台写入回执。模型称已保存不替代 read-back。评价针对原 Result，pointer 相对 \u003ccode>detail.result.data\u003c/code>；保留提交原键，未知不重复 POST，也不覆盖原结果。\u003c/p>\n\u003ch2 id=\"schedule-与-recovery-的监视\">Schedule 与 Recovery 的监视\u003c/h2>\n\u003cp>核 \u003ccode>SCHEDULING_ENABLED\u003c/code>、dispatch、维护 Worker、规则时区和原 occurrence。暂停/修改不撤回已认领触发，last_* 摘要和业务结果须分别读取。\u003ccode>next_run_at\u003c/code> 前进而没有 Run 时查“在途核对”，不清计数或重建调度补跑；租约到期与查询为空都不是可重发证明。\u003c/p>\n\u003ch2 id=\"incident-与-recovery\">Incident 与 recovery\u003c/h2>\n\u003cp>沿原 Proposal/Effect、请求键、批准与远端回执核事实。执行详情提供只读核对时，CONFIRMED 只证明原操作被观察到，不保证 Run 已续行；NOT_OBSERVED/CONFLICT 不授权重推。明确未应用仍需复查授权/范围/期限/revision；未知或部分成功保持原记录，不换键、强推或以重启 Worker 促恢复。\u003c/p>\n\u003cp>外部 Git commit、数据库事务、文档保存和 MCP 调用均可能先于本地收尾完成。数据库恢复也不能撤销它们；没有通用补账或“只补 PR” CLI。修正保留原结果和适用 Evaluation/incident 记录。\u003c/p>\n\u003ch2 id=\"managed-secret-の-kek-運用\">MANAGED Secret の KEK 運用\u003c/h2>\n\u003cp>\u003ccode>SKILLMIND_MANAGED_SECRET_KEK\u003c/code> 使用 \u003ccode>version:base64key\u003c/code> 的逗号分隔 keyring，每个 key 为 32 字节，首项用于新加密，旧项用于解密。轮换先保全所需旧 key，让全部持钥进程加载“新 active + 旧 key”，再执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec api python -m skillmind.ops.rotate_secrets\n\u003c/code>\u003c/pre>\n\u003cp>命令会重封装数据库密文；检查退出状态及 rotated/skipped，skipped 不验证解密。cipher 在进程启动时加载，只改 CLI 环境不会更新服务。不同 key 使用不同版本名，旧备份所需 key 独立保留；DB 备份无法补回丢失 KEK。\u003c/p>\n\u003ch2 id=\"通常-smoke\">通常 smoke\u003c/h2>\n\u003cp>仅在获准测试环境执行；会调用模型、创建 Run/Evaluation 并测试取消。指定已有 Project 和已发布任务，不能把新 Project 当作旧队列的隔离措施：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec \\\n  -e SKILLMIND_SMOKE_PROJECT_ID=\u0026quot;${SMOKE_PROJECT_ID:?Specify the test project UUID}\u0026quot; \\\n  api python -m skillmind.ops.smoke\n\u003c/code>\u003c/pre>\n\u003cp>密码通过 TTY。可用 \u003ccode>SKILLMIND_SMOKE_SKILL_VERSION_ID\u003c/code>、\u003ccode>TASK_KEY\u003c/code>、\u003ccode>TASK_INPUT_JSON\u003c/code>、\u003ccode>TASK_SOURCES_JSON\u003c/code>（后三者也加 \u003ccode>SKILLMIND_SMOKE_\u003c/code> 前缀）指定任务。通过只覆盖脚本所验链路，不代表全部 Provider、质量或灾难恢复通过。Worker 停机/接管试验另在允许中断的隔离环境执行。\u003c/p>\n", "sections": [{"title": "Skillmind 运维与故障排查", "level": "h1", "anchor": "skillmind-运维与故障排查", "text": "# Skillmind 运维与故障排查\n\n从症状定位服务和原请求，再决定处理方式。启动见[Quickstart](quickstart.md)、升级见[发布](deployment.md)、数据恢复见[恢复](backup-recovery.md)，运行边界见[运行与资源指南](../development/runtime-guide.md)。"}, {"title": "运用原则", "level": "h2", "anchor": "运用原则", "text": "## 运用原则\n\n优先查看原响应、Run/Attempt/Effect ID 和脱敏日志。PostgreSQL 是正本；不改状态、删审计、清队列或换键消除错误。只分享 UTC、版本、对象 ID、公开错误码和影响范围，不上传 `.env`、凭据或业务正文。\n\n命令在已确认 ENV_FILE/project 的部署目录执行。已授权操作按其范围继续；排障本身不授权真实模型、停机、恢复或外部写入。"}, {"title": "服务与队列", "level": "h2", "anchor": "服务与队列", "text": "## 服务与队列\n\n```bash\nmake status\nmake runtime-check\ndocker compose --env-file \"${ENV_FILE:-.env}\" logs --no-log-prefix --tail=200 api worker maintenance\n```\n\n| 症状 | 核对 |\n| --- | --- |\n| API 不健康或版本不一致 | 部署阶段、migration head、DB/Redis 和 runtime-check；按[发布](deployment.md#linux-核验与部署)定位原错误 |\n| 新任务不执行、批准后不续行 | dispatch 开关、`worker` 与 `maintenance` 健康状态、原 Outbox/job；两队列都要运行，不重建 Run 催执行 |\n| 执行慢、页面更新慢 | 按[耗时观测](run-performance.md)区分准备、模型/工具等待、收尾与展示 |\n| 模型认证或网络失败 | Worker 设备登录状态、出口代理和认证/模型服务连通性；配置 fingerprint 不验证登录 |"}, {"title": "认证故障的只读分诊", "level": "h2", "anchor": "认证故障的只读分诊", "text": "## 认证故障的只读分诊\n\n记录 path（无参数）、status/code/request_id，只核 header 存在性、cookie 属性和 Origin，不记录值。\n\n| 响应 | 处理 |\n| --- | --- |\n| 401 invalid_credentials / authentication_required | 核环境、会话期限和权限；bootstrap 只用于首个 ADMIN，不能重置账户 |\n| 403 csrf_rejected | 核 Origin scheme/host/port、CSRF header 与当前会话；保全未确认请求，不直接重发 |\n| 403 administrator_required / 404 | 区分系统 ADMIN 与 ProjectMember；404 也可能隐藏越权 |\n| 409 project_archived / 版本冲突 | 读取原对象最新状态，保留原请求；归档不会取消在途 Run/Effect |\n| 422 | 按公开契约修正输入，不分享包含密码的原值 |\n\n会话读取可能更新 idle，login-context 会建立 challenge 并消耗配额，不能反复请求作为健康探针。修改密码被拒绝不代表当前会话失效。"}, {"title": "登录防护的排查与恢复", "level": "h2", "anchor": "登录防护的排查与恢复", "text": "## 登录防护的排查与恢复\n\n429 按 `Retry-After` 停止快速重试，核共享出口和可信代理。503 `login_protection_unavailable` 核 Redis 权限、容量、TTL 与超时；PING 不能证明登录所需命令可用。不 FLUSHDB、删配额或轮换来源绕过限制。"}, {"title": "文档保存与删除的只读分诊", "level": "h2", "anchor": "文档保存与删除的只读分诊", "text": "## 文档保存与删除的只读分诊\n\n保留 Project/document ID、原 upload key 和响应。改名、移动和恢复保持同一文档 ID；原上传回执保留上传时路径，排障按 ID 与内容身份核对，不能仅凭名称差异判断回执损坏。超限或 MIME 拒绝应修正文件/配置；存储异常先核 namespace、连接和权限。\n\n| 症状 | 处理 |\n| --- | --- |\n| 上传未知、PENDING 或原 key 查无 | 继续按原 key 核回执，不换键重传或释放占用；查无不证明旧请求未提交 |\n| 已 PUBLISHED 但列表无文件 | 按原 document ID 核后续移动/删除，不同名补建 |\n| 删除 409 | 查 Run、调度及历史引用；引用无法确认时保留，不拆外键或删审计 |\n| 删除 503 或响应中断 | 先读原文档当前状态，再核原上传记录与存储；元数据可能已提交删除，不因错误响应换 ID 重做 |\n| 下载缺失/hash 不符、切存储后不可读 | 按原 ID/key/hash 和恢复点核对，不改 hash、复用 namespace 或覆盖同名文件 |\n| 删除后对象/配额仍在 | 元数据删除不证明存储清理和配额结算完成；无通用孤立对象清理 CLI，不递归删前缀 |\n\n回收箱可恢复，完全删除不可恢复；两者仍受原始输入、共享引用和未知操作保护。项目删除还受执行删除审计、调度、成员审计及文档等引用保护；执行列表为空时仍可能返回执行审计占用，应保持归档。"}, {"title": "准备故障的只读分诊", "level": "h2", "anchor": "准备故障的只读分诊", "text": "## 准备故障的只读分诊\n\n`RUNNING` 且无 Session 时先查 Context 准备、输入回执和 Brief。`preparation_timeout` 核准备超时配置与资源耗时；`context_build_failed` 核冻结来源和绑定。保留原输入世代及 workspace，不删目录、补 READY 或用今日 HEAD/同名文件替代冻结输入。\n\n反复接管时核 lease、Attempt 时间线和错误；租约到期不证明旧调用已停止。已接受取消也不证明 SDK/远端进程已退出。恢复能力须按实际 engine/model、输入和会话材料验证。"}, {"title": "WAITING 状态", "level": "h2", "anchor": "waiting-状态", "text": "## WAITING 状态\n\n`WAITING_FOR_INPUT/APPROVAL` 是非终态。查看原 Interaction/Proposal 和期限后答复或批准；已批准 Effect 可独立执行，不重复批准。请求返回超时、410 或断线时先读原状态；自动批准范围以原 Run 启动同意为准，开关或 Project 权限不能补造同意。"}, {"title": "结果与评价的只读分诊", "level": "h2", "anchor": "结果与评价的只读分诊", "text": "## 结果与评价的只读分诊\n\nRun 成功不等于业务全部完成；同时查看结果的 PARTIAL/BLOCKED、证据与平台写入回执。模型称已保存不替代 read-back。评价针对原 Result，pointer 相对 `detail.result.data`；保留提交原键，未知不重复 POST，也不覆盖原结果。"}, {"title": "Schedule 与 Recovery 的监视", "level": "h2", "anchor": "schedule-与-recovery-的监视", "text": "## Schedule 与 Recovery 的监视\n\n核 `SCHEDULING_ENABLED`、dispatch、维护 Worker、规则时区和原 occurrence。暂停/修改不撤回已认领触发，last_* 摘要和业务结果须分别读取。`next_run_at` 前进而没有 Run 时查“在途核对”，不清计数或重建调度补跑；租约到期与查询为空都不是可重发证明。"}, {"title": "Incident 与 recovery", "level": "h2", "anchor": "incident-与-recovery", "text": "## Incident 与 recovery\n\n沿原 Proposal/Effect、请求键、批准与远端回执核事实。执行详情提供只读核对时，CONFIRMED 只证明原操作被观察到，不保证 Run 已续行；NOT_OBSERVED/CONFLICT 不授权重推。明确未应用仍需复查授权/范围/期限/revision；未知或部分成功保持原记录，不换键、强推或以重启 Worker 促恢复。\n\n外部 Git commit、数据库事务、文档保存和 MCP 调用均可能先于本地收尾完成。数据库恢复也不能撤销它们；没有通用补账或“只补 PR” CLI。修正保留原结果和适用 Evaluation/incident 记录。"}, {"title": "MANAGED Secret の KEK 運用", "level": "h2", "anchor": "managed-secret-の-kek-運用", "text": "## MANAGED Secret の KEK 運用\n\n`SKILLMIND_MANAGED_SECRET_KEK` 使用 `version:base64key` 的逗号分隔 keyring，每个 key 为 32 字节，首项用于新加密，旧项用于解密。轮换先保全所需旧 key，让全部持钥进程加载“新 active + 旧 key”，再执行：\n\n```bash\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec api python -m skillmind.ops.rotate_secrets\n```\n\n命令会重封装数据库密文；检查退出状态及 rotated/skipped，skipped 不验证解密。cipher 在进程启动时加载，只改 CLI 环境不会更新服务。不同 key 使用不同版本名，旧备份所需 key 独立保留；DB 备份无法补回丢失 KEK。"}, {"title": "通常 smoke", "level": "h2", "anchor": "通常-smoke", "text": "## 通常 smoke\n\n仅在获准测试环境执行；会调用模型、创建 Run/Evaluation 并测试取消。指定已有 Project 和已发布任务，不能把新 Project 当作旧队列的隔离措施：\n\n```bash\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec \\\n  -e SKILLMIND_SMOKE_PROJECT_ID=\"${SMOKE_PROJECT_ID:?Specify the test project UUID}\" \\\n  api python -m skillmind.ops.smoke\n```\n\n密码通过 TTY。可用 `SKILLMIND_SMOKE_SKILL_VERSION_ID`、`TASK_KEY`、`TASK_INPUT_JSON`、`TASK_SOURCES_JSON`（后三者也加 `SKILLMIND_SMOKE_` 前缀）指定任务。通过只覆盖脚本所验链路，不代表全部 Provider、质量或灾难恢复通过。Worker 停机/接管试验另在允许中断的隔离环境执行。"}], "toc": [{"title": "运用原则", "anchor": "运用原则", "level": "h2"}, {"title": "服务与队列", "anchor": "服务与队列", "level": "h2"}, {"title": "认证故障的只读分诊", "anchor": "认证故障的只读分诊", "level": "h2"}, {"title": "登录防护的排查与恢复", "anchor": "登录防护的排查与恢复", "level": "h2"}, {"title": "文档保存与删除的只读分诊", "anchor": "文档保存与删除的只读分诊", "level": "h2"}, {"title": "准备故障的只读分诊", "anchor": "准备故障的只读分诊", "level": "h2"}, {"title": "WAITING 状态", "anchor": "waiting-状态", "level": "h2"}, {"title": "结果与评价的只读分诊", "anchor": "结果与评价的只读分诊", "level": "h2"}, {"title": "Schedule 与 Recovery 的监视", "anchor": "schedule-与-recovery-的监视", "level": "h2"}, {"title": "Incident 与 recovery", "anchor": "incident-与-recovery", "level": "h2"}, {"title": "MANAGED Secret の KEK 運用", "anchor": "managed-secret-の-kek-運用", "level": "h2"}, {"title": "通常 smoke", "anchor": "通常-smoke", "level": "h2"}], "source": "operations/runbook.md", "checksum": "f6d67958878db8687cc963aafbd9e1f38a560408beef596106bf3b9a1b47ffba"}, {"id": "docs/operations/run-performance.md", "title": "Run 耗时观测与优化", "group": "operations", "html": "\u003ch1 id=\"run-耗时观测与优化\">Run 耗时观测与优化\u003c/h1>\n\u003cp>先用相同任务、输入、模型配置和并发条件比较耗时与业务结果，再决定优化范围。关联 \u003ccode>run_id\u003c/code> / \u003ccode>run_attempt_id\u003c/code>，分别记录首次执行、等待批准/答复及续行；不把一次最快结果当成整体收益。\u003c/p>\n\u003ch2 id=\"固定日志事件\">固定日志事件\u003c/h2>\n\u003cp>INFO JSON 日志使用 \u003ccode>run.performance.\u003c/code> 前缀。实现入口为\u003ca href=\"../SKM/backend/src/skillmind/core/timing.py\">计时器\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/worker/executor.py\">执行器\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/agent/result_validation.py\">结果校验\u003c/a>与\u003ca href=\"../SKM/backend/src/skillmind/runs/repository.py\">查询\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事件后缀\u003c/th>\n\u003cth>观测范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>history_query\u003c/code> / \u003ccode>detail_query\u003c/code>\u003c/td>\n\u003ctd>履历/详情读取与 DTO 投影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>prepare\u003c/code>\u003c/td>\n\u003ctd>Context 准备和 Brief 冻结\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>engine_total\u003c/code>\u003c/td>\n\u003ctd>engine 消费、工具、持久化、校验和 cleanup\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>engine_wait\u003c/code>\u003c/td>\n\u003ctd>等待 engine event 的累计时间，含 SDK/模型/工具等待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>event_persist\u003c/code> / \u003ccode>realtime_publish\u003c/code>\u003c/td>\n\u003ctd>持久事件保存 / 即时文字通知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>result_finalize\u003c/code>\u003c/td>\n\u003ctd>结果校验与终态收尾\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>result_validation\u003c/code> / \u003ccode>result_schema\u003c/code> / \u003ccode>result_references\u003c/code>\u003c/td>\n\u003ctd>结果完整校验 / Schema / 引用核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>terminal_save\u003c/code>\u003c/td>\n\u003ctd>终态持久化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>final_output\u003c/code>\u003c/td>\n\u003ctd>最终数据 \u003ccode>output_bytes\u003c/code>，无 duration_ms\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>耗时单位为 \u003ccode>duration_ms\u003c/code>；\u003ccode>sample_count\u003c/code> 是累计 await 区间数，不是模型请求数。区间存在包含和并行关系，不能相加为总耗时；\u003ccode>engine_wait\u003c/code> 也不是纯推理时间。当前日志不能完整拆分排队、工具内部和页面首屏时间。\u003c/p>\n\u003ch2 id=\"按瓶颈行动\">按瓶颈行动\u003c/h2>\n\u003cul>\n\u003cli>准备慢：查资源读取、冻结输入大小和外部连接，不用当前资源替换原快照。\u003c/li>\n\u003cli>执行慢：比较工具调用、批准/续行次数及最终输出量；区分模型等待和远端工具耗时。\u003c/li>\n\u003cli>收尾慢：比较 Schema、引用核对与终态保存区间；已有 \u003ccode>audit.export/v1\u003c/code> 可导出平台原记录，减少重复生成，仍需满足结果契约和保存要求。\u003c/li>\n\u003cli>页面慢：分别观察 API 响应和渲染；履历技术明细按展开挂载，页面内搜索前先展开相应内容。\u003c/li>\n\u003c/ul>\n\u003cp>业务 Worker 与维护 Worker 已分队列；健康检查正常不证明没有业务排队。实时文字配送采用有界队列，过载可能丢即时片段，完整消息和持久结果仍应从详情核对。\u003c/p>\n\u003ch2 id=\"验证与解释\">验证与解释\u003c/h2>\n\u003cp>每次只调整已确认瓶颈，比较多次执行的耗时、输出完整性和业务准确性；需要真实模型/写入时使用获准环境。查询列减少或测试变快不证明真实任务提速，隔离实验也不代表生产恢复能力已闭环。\u003c/p>\n\u003cp>观测不记录正文或凭据，不为提速跳过授权、批准、read-back、持久事件或结果校验。质量缺陷与耗时问题分别记录，实施验证见\u003ca href=\"#docs/development/local-development.md::\">本地开发\u003c/a>。\u003c/p>\n\u003ch2 id=\"连续处理的边界\">连续处理的边界\u003c/h2>\n\u003cp>\u003ccode>audit.export/v1\u003c/code> 可通过 \u003ccode>include_index: true\u003c/code> 返回精确引用/hash 的小索引，完整导出 Artifact 不变。直接引用该 Artifact 保存原记录，避免为了汇总再次把全文送回模型。索引不是实测正文，也不替代业务 Schema 或必要外部保存。\u003c/p>\n\u003cp>\u003ccode>tool.sequence/v1\u003c/code> 将 1–5 个参数已确定的只读/本地工具交给同一 Gateway 逐项执行，每个子调用单独授权、审计和计量；可用 JSON Pointer 完全一致检查决定是否继续。失败、条件不成立或聚合上限时停止后续。没有脚本、循环、动态参数、外部写入、审批、递归或子模型。已有单步路径仍保留；这不是 MCP 写操作序列。\u003c/p>\n\u003cp>Codex Worker 对同一 Run 的确认自动批准续行，可在一个有限 job 中复用 SDK 进程。每个 Attempt 仍有新 lease、Gateway 和秘密 MCP URL，原 Segment/审批/回读/Outbox 不变。旧 native turn 终态已保存、thread 已 unsubscribe 后才复用；不重放未确认操作。至多连续五段，无法为下一段预留原完整时间、人工等待、非 APPLIED 或竞争认领时退回原 Queue。\u003ccode>sdk_start\u003c/code> 可用于观察进程启动次数；本优化减少重建，不等于生产 inline 回执或减少每段的模型判断。\u003c/p>\n\u003cp>SDK 生命周期还分别记录 \u003ccode>sdk_start\u003c/code>、\u003ccode>sdk_thread\u003c/code>、\u003ccode>sdk_turn_start\u003c/code>；\u003ccode>sdk_reuse\u003c/code> 的 \u003ccode>status\u003c/code> 区分 \u003ccode>new\u003c/code> / \u003ccode>reused\u003c/code>，不包含正文。它们属于 engine 等待内的子区间，不能与 \u003ccode>engine_wait\u003c/code> 重复相加。暖续行保留原 Segment/Attempt 和每步心跳，仅减少进程启动；不把一次复用写成少一次模型决策。\u003c/p>\n", "sections": [{"title": "Run 耗时观测与优化", "level": "h1", "anchor": "run-耗时观测与优化", "text": "# Run 耗时观测与优化\n\n先用相同任务、输入、模型配置和并发条件比较耗时与业务结果，再决定优化范围。关联 `run_id` / `run_attempt_id`，分别记录首次执行、等待批准/答复及续行；不把一次最快结果当成整体收益。"}, {"title": "固定日志事件", "level": "h2", "anchor": "固定日志事件", "text": "## 固定日志事件\n\nINFO JSON 日志使用 `run.performance.` 前缀。实现入口为[计时器](../../SKM/backend/src/skillmind/core/timing.py)、[执行器](../../SKM/backend/src/skillmind/worker/executor.py)、[结果校验](../../SKM/backend/src/skillmind/agent/result_validation.py)与[查询](../../SKM/backend/src/skillmind/runs/repository.py)。\n\n| 事件后缀 | 观测范围 |\n| --- | --- |\n| `history_query` / `detail_query` | 履历/详情读取与 DTO 投影 |\n| `prepare` | Context 准备和 Brief 冻结 |\n| `engine_total` | engine 消费、工具、持久化、校验和 cleanup |\n| `engine_wait` | 等待 engine event 的累计时间，含 SDK/模型/工具等待 |\n| `event_persist` / `realtime_publish` | 持久事件保存 / 即时文字通知 |\n| `result_finalize` | 结果校验与终态收尾 |\n| `result_validation` / `result_schema` / `result_references` | 结果完整校验 / Schema / 引用核对 |\n| `terminal_save` | 终态持久化 |\n| `final_output` | 最终数据 `output_bytes`，无 duration_ms |\n\n耗时单位为 `duration_ms`；`sample_count` 是累计 await 区间数，不是模型请求数。区间存在包含和并行关系，不能相加为总耗时；`engine_wait` 也不是纯推理时间。当前日志不能完整拆分排队、工具内部和页面首屏时间。"}, {"title": "按瓶颈行动", "level": "h2", "anchor": "按瓶颈行动", "text": "## 按瓶颈行动\n\n- 准备慢：查资源读取、冻结输入大小和外部连接，不用当前资源替换原快照。\n- 执行慢：比较工具调用、批准/续行次数及最终输出量；区分模型等待和远端工具耗时。\n- 收尾慢：比较 Schema、引用核对与终态保存区间；已有 `audit.export/v1` 可导出平台原记录，减少重复生成，仍需满足结果契约和保存要求。\n- 页面慢：分别观察 API 响应和渲染；履历技术明细按展开挂载，页面内搜索前先展开相应内容。\n\n业务 Worker 与维护 Worker 已分队列；健康检查正常不证明没有业务排队。实时文字配送采用有界队列，过载可能丢即时片段，完整消息和持久结果仍应从详情核对。"}, {"title": "验证与解释", "level": "h2", "anchor": "验证与解释", "text": "## 验证与解释\n\n每次只调整已确认瓶颈，比较多次执行的耗时、输出完整性和业务准确性；需要真实模型/写入时使用获准环境。查询列减少或测试变快不证明真实任务提速，隔离实验也不代表生产恢复能力已闭环。\n\n观测不记录正文或凭据，不为提速跳过授权、批准、read-back、持久事件或结果校验。质量缺陷与耗时问题分别记录，实施验证见[本地开发](../development/local-development.md)。"}, {"title": "连续处理的边界", "level": "h2", "anchor": "连续处理的边界", "text": "## 连续处理的边界\n\n`audit.export/v1` 可通过 `include_index: true` 返回精确引用/hash 的小索引，完整导出 Artifact 不变。直接引用该 Artifact 保存原记录，避免为了汇总再次把全文送回模型。索引不是实测正文，也不替代业务 Schema 或必要外部保存。\n\n`tool.sequence/v1` 将 1–5 个参数已确定的只读/本地工具交给同一 Gateway 逐项执行，每个子调用单独授权、审计和计量；可用 JSON Pointer 完全一致检查决定是否继续。失败、条件不成立或聚合上限时停止后续。没有脚本、循环、动态参数、外部写入、审批、递归或子模型。已有单步路径仍保留；这不是 MCP 写操作序列。\n\nCodex Worker 对同一 Run 的确认自动批准续行，可在一个有限 job 中复用 SDK 进程。每个 Attempt 仍有新 lease、Gateway 和秘密 MCP URL，原 Segment/审批/回读/Outbox 不变。旧 native turn 终态已保存、thread 已 unsubscribe 后才复用；不重放未确认操作。至多连续五段，无法为下一段预留原完整时间、人工等待、非 APPLIED 或竞争认领时退回原 Queue。`sdk_start` 可用于观察进程启动次数；本优化减少重建，不等于生产 inline 回执或减少每段的模型判断。\n\nSDK 生命周期还分别记录 `sdk_start`、`sdk_thread`、`sdk_turn_start`；`sdk_reuse` 的 `status` 区分 `new` / `reused`，不包含正文。它们属于 engine 等待内的子区间，不能与 `engine_wait`
