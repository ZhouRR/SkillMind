3c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目启用\u003c/td>\n\u003ctd>本组织精确 PUBLISHED；活动关系重复启用读原行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目停用\u003c/td>\n\u003ctd>保留记录，禁止新发现/创建，不取消或修改旧 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同版重新启用\u003c/td>\n\u003ctd>当前拒绝恢复已停用关系，不是普通开关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除废弃版\u003c/td>\n\u003ctd>独立入口检查 Run/Proposal/Composition 引用，不作升级/回滚步骤\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>当前不能将已停用 v1 直接重新启用；只能选仍合法可用的精确版，或重新解释发布新版本，后者不是恢复原身份。不删关系/直接改 DB 绕过。组合不复活废弃版，Run/Schedule 不跟随 latest。\u003c/p>\n\u003ch3 id=\"可审计的重新启用与回滚\">可审计的重新启用与回滚\u003c/h3>\n\u003cp>目标另定义 ADMIN 对 Project + 精确 PUBLISHED 的显式恢复，并追加 actor/时间/原因/所据状态；不清 disabled_at 抹历史，不复活 DEPRECATED。\u003c/p>\n\u003cp>重复请求不重复记事实，并发启停按版本冲突，重新读后由用户确认；载体、幂等身份和 Schema 一起定义。仅影响新发现，不改权限/Run/Schedule/组合，不自动恢复 ERROR Schedule。双请求启停不是原子“一键切换”，需独立协议。\u003c/p>\n\u003ch3 id=\"生命周期验收与质量评价\">生命周期验收与质量评价\u003c/h3>\n\u003cul>\n\u003cli>parse 无蓝图、hard error、未接受 warning 分别拒绝，不将 gate_passed 当发布。\u003c/li>\n\u003cli>未启用不可发现、缺资源需配置；升级/停用/删除不改旧 Run 与 Manifest。\u003c/li>\n\u003cli>目标重新启用保留历次事实，重复不增记，并发不覆盖，不复活废弃版。\u003c/li>\n\u003cli>Interpreter 用独立通用样例评估规则保真、资源/Tool/效果映射、trace 和调整量；覆盖资料分析、代码审查、缺资源、写入意图、恶意指令。\u003c/li>\n\u003cli>质量答案与执行输入隔离，Schema exact match 不代替模型/人工质量评审。\u003c/li>\n\u003c/ul>\n\u003cp>实施同步：\u003ca href=\"#docs/design/skill-interpretation.md::\">解释实现\u003c/a>、\u003ca href=\"#docs/development/contract-workflow.md::\">契约工作流\u003c/a>、\u003ca href=\"../PJM/backend/tests/skills\">skills 回归\u003c/a>。现有状态/引用测试与真实并发、模型质量分别举证；旧不可变版本仅审计读取，不恢复为平台预定义业务规则。\u003c/p>\n", "sections": [{"title": "Skill 兼容、解释与发布", "level": "h1", "anchor": "skill-兼容解释与发布", "text": "# Skill 兼容、解释与发布\n\n本页是目录式 Skill 的语义契约与生命周期正本；代码调用见[解释实现](skill-interpretation.md)，进度见[计划 R06](../planning/roadmap.md#r06-skill-生命周期)。"}, {"title": "设计目标", "level": "h2", "anchor": "设计目标", "text": "## 设计目标\n\n外部 Skill 无需先改为平台专用目录或业务 Schema。Interpreter 理解目标、资源、规则、交付物；业务字段可动态派生，平台只固定跨组件控制协议。\n\nTool/Shell/network/write 声明只是需求，不能授予权限。必需规则与禁止事项不能为了可运行而弱化；推荐步骤允许在冻结权限内调整。来源、解释与调整保留 trace，发布版本不可原地改写。"}, {"title": "分层架构", "level": "h2", "anchor": "分层架构", "text": "## 分层架构\n\n```text\n可信 ImportAdapter / Normalizer → 不执行来源的静态分析\n  → 版本化 Interpreter 系统 Skill + 模型\n  → 确定性 Validator → Preview / 追加调整\n  → ADMIN Publisher → Project 启用 → TaskProjector / RuntimeLoader\n```\n\n业务层依赖 SkillInterpreter 抽象，不依赖 SDK message。来源不能携带或替换 Adapter；脚本只作为来源与 checksum 对象，自动执行仅可走已注册 Provider。"}, {"title": "导入兼容层", "level": "h2", "anchor": "导入兼容层", "text": "## 导入兼容层\n\n当前支持本地目录 CLI、内联 JSON、多文件 multipart；Directory/Generic Markdown 读取主说明、metadata、references、scripts 和文本资产，见 [importer](../../PJM/backend/src/projectmind/skills/importer.py)。\n\n不执行脚本、安装依赖、访问来源 URL 或解析 Secret。ZIP/TAR 自动解包与远程 Git URL 尚未提供；新增前必须定义路径穿越/symlink/设备文件、体积/数量与固定 revision 防护。\n\nNormalizedSkillPackage 保存来源身份、adapter version、content hash、文件索引、原文/未知 metadata、静态发现和 source trace。统一索引不能丢弃未理解原文或提升其权限。"}, {"title": "Interpreter 的核心输出", "level": "h2", "anchor": "interpreter-的核心输出", "text": "## Interpreter 的核心输出"}, {"title": "CapabilityBlueprint", "level": "h3", "anchor": "capabilityblueprint", "text": "### CapabilityBlueprint\n\n主要产物是 [CapabilityBlueprint](../../PJM/contracts/capability-blueprint/v1.schema.json)，不是业务表单 Schema：\n\n| 内容 | 含义 |\n| --- | --- |\n| capability/intents/objectives | 能做什么、何时调用、完成什么目标 |\n| resource_requirements | 抽象资源、必需性、访问与绑定条件 |\n| guidance/success_criteria | 必需规则、建议步骤、质量依据与禁止事项 |\n| deliverables/interaction_points/effect_intents | 交付、澄清/审查/批准点与可能效果 |\n| source_traces/assumptions/questions | 来源依据和不应伪造的未知 |\n\n新领域 capability 不必预先注册；只有真正 Tool 调用使用 repository.read/v1 等注册版本 ID。"}, {"title": "ResourceRequirement", "level": "h3", "anchor": "resourcerequirement", "text": "### ResourceRequirement\n\n资源以 kind、required、access、versioned capabilities 和 selection_guidance 表达，例如“必须提供可读 repository，优先用户指定 revision，否则询问”。accepted_providers 是兼容提示，不替代实际 capability/scope 校验。\n\n多个资源独立 requirement；Project/Run 在创建前选定绑定。运行交互只能补充冻结 scope 内信息，不换 Integration/文档或扩权；变化需新 Run，见[资源快照](resource-snapshots.md)。"}, {"title": "Guidance 与约束", "level": "h3", "anchor": "guidance-与约束", "text": "### Guidance 与约束\n\nrequired_rules 必须遵守；recommended_steps 可重排；quality_criteria 约束最终证据/完整性；prohibited_actions 与平台硬拒绝独立生效。原文和规范化 guidance 均冻结，Worker 得到 checksum/引用，不能只传丢规则的摘要。"}, {"title": "TaskBlueprint 与动态参数", "level": "h3", "anchor": "taskblueprint-与动态参数", "text": "### TaskBlueprint 与动态参数\n\nTaskBlueprint 投影目标、资源槽位、参数、交付与效果策略。稳定输入/机器消费输出可从受限 TaskContractDraft 编译 Schema；开放分析可仅用 OutcomeEnvelope、Markdown/Artifact、Evidence 和 Proposal。缺业务 Schema、ViewSpec 或 fixture 不能单独阻止解释/发布。"}, {"title": "平台 contracts 的边界", "level": "h2", "anchor": "平台-contracts-的边界", "text": "## 平台 contracts 的边界\n\ncontracts 固定 API/Problem/RunEvent、Manifest/Blueprint/Brief/Outcome、Interaction/Effect/Evidence 与 Tool request/response/error 等通用协议，不预置某类业务结果模型或保存 Skill Gold。业务实例和评价数据在各自资产/测试边界，结构正确不证明推理正确。"}, {"title": "解释请求与响应", "level": "h2", "anchor": "解释请求与响应", "text": "## 解释请求与响应"}, {"title": "冻结输入", "level": "h3", "anchor": "冻结输入", "text": "### 冻结输入\n\n冻结 SkillSource/hash/文件索引/adapter、归一化与静态报告、资源/Tool catalog、目标协议、Interpreter Skill/version/prompt checksum、模型参数、父解释及调整指示。不包含 Project credential。"}, {"title": "结构化响应", "level": "h3", "anchor": "结构化响应", "text": "### 结构化响应\n\n响应包含 summary、compatibility、Blueprint、trace/diagnostics 与可选 confidence/assumptions/questions/TaskContractDraft。完整结构失败不能偷包自由文本为已验证 Manifest；调整追加新 Interpretation、parent lineage 和 diff。\n\n默认 SDK structured-output；显式 PROJECTMIND_SKILL_INTERPRETER_ACCEPT_PROMPT_JSON=true 可接收文本中的完整 JSON，但不补字段或绕过 Schema/identity/hash/gate。兼容路径不算 structured-output 已验收。"}, {"title": "防提示注入", "level": "h3", "anchor": "防提示注入", "text": "### 防提示注入\n\n平台规则、发布 guidance、用户输入、Tool 外部数据分别信任。来源文本不得泄露 Secret、修改系统指令或授予未注册 Tool；记录 diagnostic 并按上层边界处理。发现明文 credential 在模型解释前阻断，不等模型脱敏。"}, {"title": "兼容级别与运行就绪度", "level": "h2", "anchor": "兼容级别与运行就绪度", "text": "## 兼容级别与运行就绪度"}, {"title": "发布与就绪的判断顺序", "level": "h3", "anchor": "发布与就绪的判断顺序", "text": "### 发布与就绪的判断顺序\n\n| 事实 | 仍需检查 |\n| --- | --- |\n| parse / Preview | 来源可审查，不代表有合法蓝图或可发布 |\n| gate_passed | 无 hard error，warning 仍需 ADMIN 显式接受 |\n| PUBLISHED | 精确版已发布，Project 仍须显式启用 |\n| Project 已启用 | 资源、真实已安装 Provider 与策略决定 readiness |\n| RUNNABLE/ACTIONABLE | 创建重验输入/资源，apply 仍校验精确批准 |"}, {"title": "兼容级别", "level": "h3", "anchor": "兼容级别", "text": "### 兼容级别\n\nnative/adapted/assisted 是实际小写标签，不是发布状态。native 不提供绕过 Interpreter 的路径；Adapter 只归一化，手工 native fixture 不构成产品通道。assisted 产生待接受 warning，仍满足其他 gate。"}, {"title": "运行就绪度", "level": "h3", "anchor": "运行就绪度", "text": "### 运行就绪度\n\nGUIDANCE_ONLY 仅指导/人工清单；CONFIGURATION_REQUIRED 待参数/资源；RUNNABLE 只读/工作区能力就绪；ACTIONABLE 识别可 apply 的资源与 Provider，不表示 Proposal 已批准或远端可达。\n\nSkillVersion 属 Organization，Project 复用精确版并独立计算 readiness。未启用不可发现，新发布不自动增加执行面。"}, {"title": "校验与发布门禁", "level": "h2", "anchor": "校验与发布门禁", "text": "## 校验与发布门禁\n\n硬门禁：来源/hash/解释 identity 一致，蓝图合法，trace 指向真实文件，Tool requirement 版本格式正确，无 credential/路径逃逸/任意宿主命令授权/远程可执行引用，效果正确区分 observe/propose/apply，Manifest checksum/lineage/发布者有效。\n\n未知业务概念、缺可选 Schema/ViewSpec/fixture、Project 未配资源、推荐步骤不完整或 assisted 标签本身不构成 hard error；必要配置仍须创建前补齐，warning 必须明确接受。\n\n蓝图只由 Interpreter 生成；parse Draft 可为 null，发布报 capability_blueprint_missing。Manifest Schema 容纳 Draft 不等于免发布 gate，不能从旧 workflow/data_sources 反推蓝图。"}, {"title": "RuntimeManifest v1alpha1", "level": "h2", "anchor": "runtimemanifest-v1alpha1", "text": "## RuntimeManifest v1alpha1\n\n[Schema](../../PJM/contracts/runtime-manifest/v1alpha1.schema.json)中的 manifest_version 精确为 projectmind/v1alpha1。Manifest 冻结蓝图/任务、Tool/资源、规则、执行建议、效果和可选 Schema；字段以契约为准，不另造语义摘要字段。\n\n从 DRAFT 创建起内容/checksum 固定。发布状态、发布者/时间、接受 warning 属版本/gate metadata，不重写 Manifest。资源唯一声明位于 capability_blueprint.resource_requirements，无顶层 data_sources；具体 Integration/Secret 不进入 Manifest。"}, {"title": "Skill 组合", "level": "h2", "anchor": "skill-组合", "text": "## Skill 组合\n\n现行 SkillComposition（Module）只把精确版本任务归组，ProjectComposition 控制展示；无跨 Skill 规则求解器、自动编排或组合授予权限。\n\n未来组合提示/偏好须先定版本/快照：平台安全最高，Project scope 限制，各 Skill required 均保留；冲突要求选择，不直接运行。组合只可调推荐步骤/表达，虚拟角色不是系统角色。"}, {"title": "版本、回滚与评价", "level": "h2", "anchor": "版本回滚与评价", "text": "## 版本、回滚与评价"}, {"title": "版本内容与可见性", "level": "h3", "anchor": "版本内容与可见性", "text": "### 版本内容与可见性\n\n| 操作 | 现行边界 |\n| --- | --- |\n| 发布/废弃 | DRAFT → PUBLISHED → DEPRECATED；重复发布读原行，废弃不可复活 |\n| 项目启用 | 本组织精确 PUBLISHED；活动关系重复启用读原行 |\n| 项目停用 | 保留记录，禁止新发现/创建，不取消或修改旧 Run |\n| 同版重新启用 | 当前拒绝恢复已停用关系，不是普通开关 |\n| 删除废弃版 | 独立入口检查 Run/Proposal/Composition 引用，不作升级/回滚步骤 |\n\n当前不能将已停用 v1 直接重新启用；只能选仍合法可用的精确版，或重新解释发布新版本，后者不是恢复原身份。不删关系/直接改 DB 绕过。组合不复活废弃版，Run/Schedule 不跟随 latest。"}, {"title": "可审计的重新启用与回滚", "level": "h3", "anchor": "可审计的重新启用与回滚", "text": "### 可审计的重新启用与回滚\n\n目标另定义 ADMIN 对 Project + 精确 PUBLISHED 的显式恢复，并追加 actor/时间/原因/所据状态；不清 disabled_at 抹历史，不复活 DEPRECATED。\n\n重复请求不重复记事实，并发启停按版本冲突，重新读后由用户确认；载体、幂等身份和 Schema 一起定义。仅影响新发现，不改权限/Run/Schedule/组合，不自动恢复 ERROR Schedule。双请求启停不是原子“一键切换”，需独立协议。"}, {"title": "生命周期验收与质量评价", "level": "h3", "anchor": "生命周期验收与质量评价", "text": "### 生命周期验收与质量评价\n\n- parse 无蓝图、hard error、未接受 warning 分别拒绝，不将 gate_passed 当发布。\n- 未启用不可发现、缺资源需配置；升级/停用/删除不改旧 Run 与 Manifest。\n- 目标重新启用保留历次事实，重复不增记，并发不覆盖，不复活废弃版。\n- Interpreter 用独立通用样例评估规则保真、资源/Tool/效果映射、trace 和调整量；覆盖资料分析、代码审查、缺资源、写入意图、恶意指令。\n- 质量答案与执行输入隔离，Schema exact match 不代替模型/人工质量评审。\n\n实施同步：[解释实现](skill-interpretation.md)、[契约工作流](../development/contract-workflow.md)、[skills 回归](../../PJM/backend/tests/skills/)。现有状态/引用测试与真实并发、模型质量分别举证；旧不可变版本仅审计读取，不恢复为平台预定义业务规则。"}], "toc": [{"title": "设计目标", "anchor": "设计目标", "level": "h2"}, {"title": "分层架构", "anchor": "分层架构", "level": "h2"}, {"title": "导入兼容层", "anchor": "导入兼容层", "level": "h2"}, {"title": "Interpreter 的核心输出", "anchor": "interpreter-的核心输出", "level": "h2"}, {"title": "CapabilityBlueprint", "anchor": "capabilityblueprint", "level": "h3"}, {"title": "ResourceRequirement", "anchor": "resourcerequirement", "level": "h3"}, {"title": "Guidance 与约束", "anchor": "guidance-与约束", "level": "h3"}, {"title": "TaskBlueprint 与动态参数", "anchor": "taskblueprint-与动态参数", "level": "h3"}, {"title": "平台 contracts 的边界", "anchor": "平台-contracts-的边界", "level": "h2"}, {"title": "解释请求与响应", "anchor": "解释请求与响应", "level": "h2"}, {"title": "冻结输入", "anchor": "冻结输入", "level": "h3"}, {"title": "结构化响应", "anchor": "结构化响应", "level": "h3"}, {"title": "防提示注入", "anchor": "防提示注入", "level": "h3"}, {"title": "兼容级别与运行就绪度", "anchor": "兼容级别与运行就绪度", "level": "h2"}, {"title": "发布与就绪的判断顺序", "anchor": "发布与就绪的判断顺序", "level": "h3"}, {"title": "兼容级别", "anchor": "兼容级别", "level": "h3"}, {"title": "运行就绪度", "anchor": "运行就绪度", "level": "h3"}, {"title": "校验与发布门禁", "anchor": "校验与发布门禁", "level": "h2"}, {"title": "RuntimeManifest v1alpha1", "anchor": "runtimemanifest-v1alpha1", "level": "h2"}, {"title": "Skill 组合", "anchor": "skill-组合", "level": "h2"}, {"title": "版本、回滚与评价", "anchor": "版本回滚与评价", "level": "h2"}, {"title": "版本内容与可见性", "anchor": "版本内容与可见性", "level": "h3"}, {"title": "可审计的重新启用与回滚", "anchor": "可审计的重新启用与回滚", "level": "h3"}, {"title": "生命周期验收与质量评价", "anchor": "生命周期验收与质量评价", "level": "h3"}], "source": "design/skill-contract.md", "checksum": "ccf92c7f8ff6e00737d92c94e8b83b7d511f64d92766a9facbd518e6e6b66a9b"}, {"id": "docs/design/skill-interpretation.md", "title": "Skill 解释与发布实现", "group": "design", "html": "\u003ch1 id=\"skill-解释与发布实现\">Skill 解释与发布实现\u003c/h1>\n\u003cp>本页连接\u003ca href=\"#docs/design/skill-contract.md::\">语义契约\u003c/a>与代码，负责解释、确定性门禁和发布；运行协议见\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>，当前缺口见\u003ca href=\"#docs/planning/roadmap.md::r06-skill-%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9F\">计划 R06\u003c/a>。\u003c/p>\n\u003ch2 id=\"目标与主流程\">目标与主流程\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">文件 → Normalize / Static Analyze → immutable SkillSource\n  → 冻结 identity/catalog → 模型 Blueprint candidate\n  → 确定性验证 → Preview / 追加调整\n  → SkillVersion DRAFT → ADMIN 发布\n  → Project 显式启用精确版 → TaskCatalog/readiness\n\u003c/code>\u003c/pre>\n\u003cp>当前导入、结构解释、调整/diff、发布与项目启用已有实现。parse 不调用模型，初始 Draft 可无蓝图，不能直接发布；ZIP/TAR 自动解包、远程 Git、TaskFlow 和生成模块执行不在这条已接链路中。\u003c/p>\n\u003ch2 id=\"信任边界\">信任边界\u003c/h2>\n\u003cp>来源/附件/外部内容是数据，不覆盖平台规则。Tool/Shell 声明不授权，静态发现 credential 在解释前阻断；Interpreter 不读取 Project Secret/Integration、不发布、不建 Run。业务 required 不因缺工具而弱化，可重表达实现手段。\u003c/p>\n\u003ch2 id=\"代码责任\">代码责任\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>入口\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/skills/importer.py\">importer\u003c/a>\u003c/td>\n\u003ctd>归一化、文件/引用、静态 Draft\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/skills/interpreter.py\">interpreter\u003c/a> / \u003ca href=\"../PJM/backend/src/projectmind/skills/model_interpreter.py\">model_interpreter\u003c/a>\u003c/td>\n\u003ctd>静态发现、identity、报告与结构化模型适配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/skills/interpreter_execution.py\">interpreter_execution\u003c/a>\u003c/td>\n\u003ctd>冻结执行、复用和恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/skills/capability_blueprint.py\">capability_blueprint\u003c/a> / \u003ca href=\"../PJM/backend/src/projectmind/skills/task_contract.py\">task_contract\u003c/a>\u003c/td>\n\u003ctd>蓝图校验/投影，受限动态契约编译\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/skills/manifest_gate.py\">manifest_gate\u003c/a>\u003c/td>\n\u003ctd>来源、结构、能力与 warning gate\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/skills/service.py\">service\u003c/a> / \u003ca href=\"../PJM/backend/src/projectmind/skills/repository.py\">repository\u003c/a>\u003c/td>\n\u003ctd>解释协调、版本/可见性、引用门禁和 TaskCatalog\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>系统 \u003ca href=\"../PJM/skills/projectmind-skill-interpreter/SKILL.md\">Interpreter Skill\u003c/a>是版本化执行资产，改正文/references 必须同步 package hash、prompt identity、版本/example/回归，不当普通文档搬迁。\u003c/p>\n\u003ch3 id=\"从候选到项目任务的接线\">从候选到项目任务的接线\u003c/h3>\n\u003cp>PREVIEW_READY → create_version_draft 绑定真实 Interpretation/Blueprint identity，冻结 Manifest/checksum/findings → publish_skill_version 检查 hard error 与所有 warning → 显式项目启用 → 按真实资源计算 readiness。\u003c/p>\n\u003cp>DRAFT 可保存错误供审查；发布不重新调用模型或修改 Manifest。来源/解释改变需追加解释和新 DRAFT。TaskCatalog 不证明外部可达；创建/Provider 重验。来源重建、模型恢复与发布复用是不同幂等边界。\u003c/p>\n\u003ch2 id=\"capabilityblueprint\">CapabilityBlueprint\u003c/h2>\n\u003cp>字段以 \u003ca href=\"../PJM/contracts/capability-blueprint/v1.schema.json\">Blueprint Schema\u003c/a>为准；标题/说明保留源语言，协议 enum 大小写按 Schema，不笼统要求全小写。\u003c/p>\n\u003cp>identity/hash/trace/结构错误拒绝；新领域 capability 允许，实际 Tool 必须注册；缺业务 Schema/ViewSpec/fixture 不能单独硬拒绝，assisted_review_required 须接受。自然语言完整性不能靠 trace/Schema 证明。\u003c/p>\n\u003ch3 id=\"蓝图是唯一来源\">蓝图是唯一来源\u003c/h3>\n\u003cp>蓝图只由 Interpreter 产生，parse 返回 null 时发布 gate 报 capability_blueprint_missing。Manifest Schema 保留 Draft 形态不等于发布许可；Worker 只读冻结蓝图，不从旧 workflows/data_sources 反推。手工 native fixture 不是绕过路径。\u003c/p>\n\u003ch3 id=\"过程重表达\">过程重表达\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>来源表达\u003c/th>\n\u003cth>平台路径与限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>curl 读取业务记录、git/svn 读代码\u003c/td>\n\u003ctd>issue.read/v1、repository.read/v1；地址/凭据/revision 归绑定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>list/grep/log\u003c/td>\n\u003ctd>资源物化、files.txt、workspace.search/read、有界 history.txt；无自由 shell\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>xlsx/xlsm/docx\u003c/td>\n\u003ctd>平台文本化后读位置；不宣称支持 PDF/任意格式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报告/补丁\u003c/td>\n\u003ctd>workspace.write/v1，仅 workspace/output\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>修改外部内容\u003c/td>\n\u003ctd>change.propose/v1 → 批准/效果链，不给 Agent 直调 write\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无等价能力\u003c/td>\n\u003ctd>说明限制、人工处理或 GUIDANCE_ONLY，不虚构 Tool/弱化 required\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>确定性守卫只检查显式能力引用与结构，不证明语义等价或运行参数正确；Gateway 校验参数，Preview/质量评审检查保真。新增 \u003ca href=\"#docs/design/task-flow.md::\">Flow\u003c/a>字段须先冻结 Schema，不随意扩 Blueprint/Brief。\u003c/p>\n\u003ch2 id=\"resourcebinding-与-readiness\">ResourceBinding 与 readiness\u003c/h2>\n\u003cp>资源唯一来自 capability_blueprint.resource_requirements，无顶层 data_sources；Tool 投影引用相同 key，write 不折入 Agent allowed_capabilities。\u003c/p>\n\u003cp>空 allowlist 不授权。issue_ids/field_keys 允许显式 [\u0026quot;*\u0026quot;]，子 scope 不能枚举扩 wildcard；repository path 不用该 wildcard，LOW 预授权必须精确 scope。\u003c/p>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/skills/resource_binding.py\">resource_binding\u003c/a>先查精确项目启用，再算任务 readiness 与 requirement AVAILABLE/UNAVAILABLE/UNSUPPORTED；依据真实已安装 Provider。候选可用不是选择或实际连通，选择创建前冻结，运行中 CHOICE 不换绑。旧注释若相反按\u003ca href=\"#docs/design/resource-snapshots.md::\">冻结规则\u003c/a>修正。\u003c/p>\n\u003cp>同版停用后不可恢复，发布不可复活 DEPRECATED；目标审计恢复由\u003ca href=\"#docs/design/skill-contract.md::%E5%8F%AF%E5%AE%A1%E8%AE%A1%E7%9A%84%E9%87%8D%E6%96%B0%E5%90%AF%E7%94%A8%E4%B8%8E%E5%9B%9E%E6%BB%9A\">生命周期\u003c/a>维护。\u003c/p>\n\u003ch2 id=\"brief-与运行交接\">Brief 与运行交接\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/contracts/agent-task-brief/v1.schema.json\">AgentTaskBrief\u003c/a>按 Segment 保存 brief_json/checksum，完整带 required/quality、目标、资源、权限、交付和限制。物化路径只来自物化器，日志仅 identity/checksum/profile，不记录业务 Brief 正文。\u003c/p>\n\u003cp>GUIDED/SUPERVISED/DELEGATED 默认 SUPERVISED，不能覆盖硬拒绝。新 Run 显式 Segment/Brief，旧 Run 只读隐式投影；续行/Attempt、Session、workspace 和效果的唯一规则分别在 Runtime、\u003ca href=\"#docs/design/resource-snapshots.md::\">资源\u003c/a>、\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>，不再维护副本。\u003c/p>\n\u003cp>结果用通用 Outcome，可选 task-specific structured_data；缺业务 Schema 不等于 structured_output_missing，结构不保证业务正确。\u003c/p>\n\u003ch2 id=\"验证与接续\">验证与接续\u003c/h2>\n\u003cul>\n\u003cli>Parser：不执行来源，路径/大小/引用/hash；Interpreter：冻结 identity、结构输出、失败恢复、追加调整/diff。\u003c/li>\n\u003cli>发布：蓝图必需、warning 接受、精确版本/不可变、组织/项目启停与引用保护；目标重新启用另验并发/审计。\u003c/li>\n\u003cli>泛化：资料分析、代码审查、开放文档、缺资源、恶意指令走同一路径，不添平台业务分支。\u003c/li>\n\u003cli>安全：敏感来源阻断、scope/跨 Project 拒绝、能力不扩权；runtime/Provider 再验证。\u003c/li>\n\u003cli>模型质量：固定输入重复采样，独立人工判断规则保真/证据/调整量；prompt JSON 与 SDK structured-output 分别举证。\u003c/li>\n\u003c/ul>\n\u003cp>回归入口：\u003ca href=\"../PJM/backend/tests/skills\">skills tests\u003c/a>、\u003ca href=\"../PJM/backend/tests/contracts\">contracts tests\u003c/a>。mock repository 不证明真实事务竞争；模型、部署、外部系统另按授权环境验收。\u003c/p>\n\u003cp>改解释结构/系统 Skill 时同步契约、版本/checksum、Backend validator/projector、Web 预览、example/回归及质量评审。不增加任意脚本、自动扩权、自动升级发布版或生成后端服务。\u003c/p>\n", "sections": [{"title": "Skill 解释与发布实现", "level": "h1", "anchor": "skill-解释与发布实现", "text": "# Skill 解释与发布实现\n\n本页连接[语义契约](skill-contract.md)与代码，负责解释、确定性门禁和发布；运行协议见[Runtime](agent-runtime.md)，当前缺口见[计划 R06](../planning/roadmap.md#r06-skill-生命周期)。"}, {"title": "目标与主流程", "level": "h2", "anchor": "目标与主流程", "text": "## 目标与主流程\n\n```text\n文件 → Normalize / Static Analyze → immutable SkillSource\n  → 冻结 identity/catalog → 模型 Blueprint candidate\n  → 确定性验证 → Preview / 追加调整\n  → SkillVersion DRAFT → ADMIN 发布\n  → Project 显式启用精确版 → TaskCatalog/readiness\n```\n\n当前导入、结构解释、调整/diff、发布与项目启用已有实现。parse 不调用模型，初始 Draft 可无蓝图，不能直接发布；ZIP/TAR 自动解包、远程 Git、TaskFlow 和生成模块执行不在这条已接链路中。"}, {"title": "信任边界", "level": "h2", "anchor": "信任边界", "text": "## 信任边界\n\n来源/附件/外部内容是数据，不覆盖平台规则。Tool/Shell 声明不授权，静态发现 credential 在解释前阻断；Interpreter 不读取 Project Secret/Integration、不发布、不建 Run。业务 required 不因缺工具而弱化，可重表达实现手段。"}, {"title": "代码责任", "level": "h2", "anchor": "代码责任", "text": "## 代码责任\n\n| 入口 | 责任 |\n| --- | --- |\n| [importer](../../PJM/backend/src/projectmind/skills/importer.py) | 归一化、文件/引用、静态 Draft |\n| [interpreter](../../PJM/backend/src/projectmind/skills/interpreter.py) / [model_interpreter](../../PJM/backend/src/projectmind/skills/model_interpreter.py) | 静态发现、identity、报告与结构化模型适配 |\n| [interpreter_execution](../../PJM/backend/src/projectmind/skills/interpreter_execution.py) | 冻结执行、复用和恢复 |\n| [capability_blueprint](../../PJM/backend/src/projectmind/skills/capability_blueprint.py) / [task_contract](../../PJM/backend/src/projectmind/skills/task_contract.py) | 蓝图校验/投影，受限动态契约编译 |\n| [manifest_gate](../../PJM/backend/src/projectmind/skills/manifest_gate.py) | 来源、结构、能力与 warning gate |\n| [service](../../PJM/backend/src/projectmind/skills/service.py) / [repository](../../PJM/backend/src/projectmind/skills/repository.py) | 解释协调、版本/可见性、引用门禁和 TaskCatalog |\n\n系统 [Interpreter Skill](../../PJM/skills/projectmind-skill-interpreter/SKILL.md)是版本化执行资产，改正文/references 必须同步 package hash、prompt identity、版本/example/回归，不当普通文档搬迁。"}, {"title": "从候选到项目任务的接线", "level": "h3", "anchor": "从候选到项目任务的接线", "text": "### 从候选到项目任务的接线\n\nPREVIEW_READY → create_version_draft 绑定真实 Interpretation/Blueprint identity，冻结 Manifest/checksum/findings → publish_skill_version 检查 hard error 与所有 warning → 显式项目启用 → 按真实资源计算 readiness。\n\nDRAFT 可保存错误供审查；发布不重新调用模型或修改 Manifest。来源/解释改变需追加解释和新 DRAFT。TaskCatalog 不证明外部可达；创建/Provider 重验。来源重建、模型恢复与发布复用是不同幂等边界。"}, {"title": "CapabilityBlueprint", "level": "h2", "anchor": "capabilityblueprint", "text": "## CapabilityBlueprint\n\n字段以 [Blueprint Schema](../../PJM/contracts/capability-blueprint/v1.schema.json)为准；标题/说明保留源语言，协议 enum 大小写按 Schema，不笼统要求全小写。\n\nidentity/hash/trace/结构错误拒绝；新领域 capability 允许，实际 Tool 必须注册；缺业务 Schema/ViewSpec/fixture 不能单独硬拒绝，assisted_review_required 须接受。自然语言完整性不能靠 trace/Schema 证明。"}, {"title": "蓝图是唯一来源", "level": "h3", "anchor": "蓝图是唯一来源", "text": "### 蓝图是唯一来源\n\n蓝图只由 Interpreter 产生，parse 返回 null 时发布 gate 报 capability_blueprint_missing。Manifest Schema 保留 Draft 形态不等于发布许可；Worker 只读冻结蓝图，不从旧 workflows/data_sources 反推。手工 native fixture 不是绕过路径。"}, {"title": "过程重表达", "level": "h3", "anchor": "过程重表达", "text": "### 过程重表达\n\n| 来源表达 | 平台路径与限制 |\n| --- | --- |\n| curl 读取业务记录、git/svn 读代码 | issue.read/v1、repository.read/v1；地址/凭据/revision 归绑定 |\n| list/grep/log | 资源物化、files.txt、workspace.search/read、有界 history.txt；无自由 shell |\n| xlsx/xlsm/docx | 平台文本化后读位置；不宣称支持 PDF/任意格式 |\n| 报告/补丁 | workspace.write/v1，仅 workspace/output |\n| 修改外部内容 | change.propose/v1 → 批准/效果链，不给 Agent 直调 write |\n| 无等价能力 | 说明限制、人工处理或 GUIDANCE_ONLY，不虚构 Tool/弱化 required |\n\n确定性守卫只检查显式能力引用与结构，不证明语义等价或运行参数正确；Gateway 校验参数，Preview/质量评审检查保真。新增 [Flow](task-flow.md)字段须先冻结 Schema，不随意扩 Blueprint/Brief。"}, {"title": "ResourceBinding 与 readiness", "level": "h2", "anchor": "resourcebinding-与-readiness", "text": "## ResourceBinding 与 readiness\n\n资源唯一来自 capability_blueprint.resource_requirements，无顶层 data_sources；Tool 投影引用相同 key，write 不折入 Agent allowed_capabilities。\n\n空 allowlist 不授权。issue_ids/field_keys 允许显式 [\"*\"]，子 scope 不能枚举扩 wildcard；repository path 不用该 wildcard，LOW 预授权必须精确 scope。\n\n[resource_binding](../../PJM/backend/src/projectmind/skills/resource_binding.py)先查精确项目启用，再算任务 readiness 与 requirement AVAILABLE/UNAVAILABLE/UNSUPPORTED；依据真实已安装 Provider。候选可用不是选择或实际连通，选择创建前冻结，运行中 CHOICE 不换绑。旧注释若相反按[冻结规则](resource-snapshots.md)修正。\n\n同版停用后不可恢复，发布不可复活 DEPRECATED；目标审计恢复由[生命周期](skill-contract.md#可审计的重新启用与回滚)维护。"}, {"title": "Brief 与运行交接", "level": "h2", "anchor": "brief-与运行交接", "text": "## Brief 与运行交接\n\n[AgentTaskBrief](../../PJM/contracts/agent-task-brief/v1.schema.json)按 Segment 保存 brief_json/checksum，完整带 required/quality、目标、资源、权限、交付和限制。物化路径只来自物化器，日志仅 identity/checksum/profile，不记录业务 Brief 正文。\n\nGUIDED/SUPERVISED/DELEGATED 默认 SUPERVISED，不能覆盖硬拒绝。新 Run 显式 Segment/Brief，旧 Run 只读隐式投影；续行/Attempt、Session、workspace 和效果的唯一规则分别在 Runtime、[资源](resource-snapshots.md)、[受控写入](repository-effects.md)，不再维护副本。\n\n结果用通用 Outcome，可选 task-specific structured_data；缺业务 Schema 不等于 structured_output_missing，结构不保证业务正确。"}, {"title": "验证与接续", "level": "h2", "anchor": "验证与接续", "text": "## 验证与接续\n\n- Parser：不执行来源，路径/大小/引用/hash；Interpreter：冻结 identity、结构输出、失败恢复、追加调整/diff。\n- 发布：蓝图必需、warning 接受、精确版本/不可变、组织/项目启停与引用保护；目标重新启用另验并发/审计。\n- 泛化：资料分析、代码审查、开放文档、缺资源、恶意指令走同一路径，不添平台业务分支。\n- 安全：敏感来源阻断、scope/跨 Project 拒绝、能力不扩权；runtime/Provider 再验证。\n- 模型质量：固定输入重复采样，独立人工判断规则保真/证据/调整量；prompt JSON 与 SDK structured-output 分别举证。\n\n回归入口：[skills tests](../../PJM/backend/tests/skills/)、[contracts tests](../../PJM/backend/tests/contracts/)。mock repository 不证明真实事务竞争；模型、部署、外部系统另按授权环境验收。\n\n改解释结构/系统 Skill 时同步契约、版本/checksum、Backend validator/projector、Web 预览、example/回归及质量评审。不增加任意脚本、自动扩权、自动升级发布版或生成后端服务。"}], "toc": [{"title": "目标与主流程", "anchor": "目标与主流程", "level": "h2"}, {"title": "信任边界", "anchor": "信任边界", "level": "h2"}, {"title": "代码责任", "anchor": "代码责任", "level": "h2"}, {"title": "从候选到项目任务的接线", "anchor": "从候选到项目任务的接线", "level": "h3"}, {"title": "CapabilityBlueprint", "anchor": "capabilityblueprint", "level": "h2"}, {"title": "蓝图是唯一来源", "anchor": "蓝图是唯一来源", "level": "h3"}, {"title": "过程重表达", "anchor": "过程重表达", "level": "h3"}, {"title": "ResourceBinding 与 readiness", "anchor": "resourcebinding-与-readiness", "level": "h2"}, {"title": "Brief 与运行交接", "anchor": "brief-与运行交接", "level": "h2"}, {"title": "验证与接续", "anchor": "验证与接续", "level": "h2"}], "source": "design/skill-interpretation.md", "checksum": "72e42322017ed8ae5c8df12109174d7e7fa01ad7e579622208218df93990ba9c"}, {"id": "docs/design/run-creation.md", "title": "Run 创建、重发与幂等", "group": "design", "html": "\u003ch1 id=\"run-创建重发与幂等\">Run 创建、重发与幂等\u003c/h1>\n\u003cp>本页定义创建身份、首次快照与原请求确认。Backend 版本化重放和 Web 确认已有接线；真实事务验收与调度缺口见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>。资源成员规则由\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>负责。\u003c/p>\n\u003ch2 id=\"先分清三种再执行\">先分清三种“再执行”\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>意图\u003c/th>\n\u003cth>正确结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>创建响应丢失，确认原请求\u003c/td>\n\u003ctd>返回原 Run，不新增快照、Segment 或 dispatch\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Worker 故障恢复\u003c/td>\n\u003ctd>同 Segment 新增 Attempt，沿用冻结事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用户改变输入/范围/目标\u003c/td>\n\u003ctd>新键、新 Run，不改旧快照\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>答复/批准是已有 Run 的业务续行；Schedule 每个 occurrence 独立创建，同一 occurrence 的恢复不是新触发。\u003c/p>\n\u003ch2 id=\"请求身份与执行快照分开保存\">请求身份与执行快照分开保存\u003c/h2>\n\u003cp>请求身份保存“用户要创建什么”，执行快照保存“首次实际固定什么”。两者都不可在重放时改写。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>身份 / 首次快照\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>actor、Project、精确 SkillVersion/task_key\u003c/td>\n\u003ctd>全部参与身份；快照另存 Manifest checksum\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>input、显式选项\u003c/td>\n\u003ctd>按版本化规则比较；保存验证后的输入/Schema，不任意排序数组、转型或补默认值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档单份/集合\u003c/td>\n\u003ctd>比较 ID；集合排序且拒绝重复；快照固定成员、路径、MIME、size/hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档全集\u003c/td>\n\u003ctd>比较“全集”规则，不重新展开；首次成员单独冻结\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integration/binding\u003c/td>\n\u003ctd>比较显式身份或默认选择规则；冻结实际 scope/配置版本/binding，不重读今天的默认值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>权限/额度与追踪\u003c/td>\n\u003ctd>上限由服务端冻结；trace、时间、生成 ID 不造成请求差异\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>文档必需显式选择，省略可选槽位不授权全集；Integration 可按 Task/Project 默认 binding 解析。省略与显式指定是不同意图。未来开放限额选项须版本化纳入身份。\u003c/p>\n\u003cp>服务端用\u003ca href=\"../PJM/backend/src/projectmind/core/hashing.py\">共享 hashing\u003c/a>保存规范化意图、摘要及格式版本；客户端 fingerprint 不能代替认证或原内容比较。\u003c/p>\n\u003ch3 id=\"幂等键的作用域\">幂等键的作用域\u003c/h3>\n\u003cp>唯一约束为 (project_id, task_id, Idempotency-Key)，task_id 从精确 SkillVersion/task_key 导出，不按 actor 隔离。作用域内同键不同 actor/input/选择冲突；不同 Project/精确任务不承诺冲突。每个新意图仍生成新键，不能使用常量。\u003c/p>\n\u003ch2 id=\"目标创建流程\">目标创建流程\u003c/h2>\n\u003cp>以下流程已接入，仍需真实 PostgreSQL 并发/回滚验收：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">当前认证 / CSRF / ProjectWriteActor / 请求校验\n  → 规范化意图，查询幂等作用域\n  ├─ 已存在：验证原身份/意图 → 相同返回原 Run，否则 409\n  └─ 不存在：解析精确任务/资源 → 创建事务\n       → 提交成功，或唯一冲突后读取胜者\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>所有请求都做当前授权；无权限者不能用 key 探测旧 Run。重放要求原 actor，不因有历史查看权即可冒充。\u003c/li>\n\u003cli>重放先于当前资源/版本解析，不再枚举文档、调用 Provider 或刷新权限。新建才检查版本可用、输入、资源与策略。\u003c/li>\n\u003cli>创建事务一次保存 Run、Segment 1、Skill/资源快照、初始事件与 dispatch Outbox；失败整体回滚，模型/大文件物化在事务外。\u003c/li>\n\u003cli>预查询不替代唯一约束。并发同意图只接受胜者的首次快照，不拼接两次解析。\u003c/li>\n\u003cli>解析失败时复查刚提交的同键胜者；仍不存在则返回原错误，不无限等待。再次确认继续保留原键。\u003c/li>\n\u003c/ul>\n\u003cp>确认已有 Run 不等于它仍可执行。运行时 Provider 继续验证冻结授权、Integration 状态与批准；版本停用后的旧请求确认也不许可新建。\u003c/p>\n\u003ch2 id=\"响应界面与历史兼容\">响应、界面与历史兼容\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>响应\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>201 + Location\u003c/td>\n\u003ctd>首次创建成功，不代表执行成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200 + Idempotent-Replay: true\u003c/td>\n\u003ctd>原 Run 的当前状态，不新增事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 idempotency_conflict\u003c/td>\n\u003ctd>同作用域的意图不同或旧身份无法证明；核对后显式新建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>断网/超时/无法校验响应\u003c/td>\n\u003ctd>提交未知，不能自动换键\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"提交结果未知时的界面责任\">提交结果未知时的界面责任\u003c/h3>\n\u003cp>\u003ca href=\"../PJM/web/src/pages/WorkspacePage.tsx\">WorkspacePage\u003c/a>把可编辑 TaskDraft 与已发送请求分开。提交时固定 actor/Project/精确任务/input/sources/key，确认只发送原内容，不复制服务端 hash 算法。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>状态\u003c/th>\n\u003cth>界面行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>sending\u003c/td>\n\u003ctd>同步防重；关闭弹窗后重新打开仍能查看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>unknown\u003c/td>\n\u003ctd>网络错误、30 秒等待超时、408/429/服务错误或无效响应；原键确认或新标签页核对历史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rejected\u003c/td>\n\u003ctd>其余非 409 的 4xx；只说明本次拒绝，不清除先前“可能已创建”事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>conflict\u003c/td>\n\u003ctd>不自动重试、刷新原内容或换键；明确核对后新建\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>草稿继续可编辑，原请求确认不依赖草稿现是否合法。另建前明确提示原 Run 可能存在，再由用户提交新意图。30 秒只结束 HTTP 等待，不取消 Run。\u003c/p>\n\u003cp>重发用当前 CSRF，但必须仍是原 actor/Project；每次 await 后检查请求身份。切换账号/Project、离页后不处理旧结果，确认合法响应后才切换 detail/SSE 观察对象。\u003c/p>\n\u003cp>待确认内容只存页面内存：关弹窗保留，刷新/离页/身份切换不保证恢复；正文和 token 不进 URL/Web storage。未知后再收到拒绝不能抹去不确定性。\u003c/p>\n\u003ch3 id=\"历史身份的证明范围\">历史身份的证明范围\u003c/h3>\n\u003cp>旧 request_hash 计算早于 binding 字段补入，不能直接对持久 selected_sources 重算。当前\u003ca href=\"../PJM/backend/src/projectmind/runs/creation_replay.py\">兼容器\u003c/a>仅移除能证明属于初次初始化的 binding_id / binding_checksum / binding_capability，以完整旧 hash 验证剩余快照，再从保存的 candidate/default 恢复意图。\u003c/p>\n\u003cp>不读当前资源、不改旧行；缺原选择、未知版本或 hash 不符返回 409。历史可读、创建可确认、非终态可按新输入协议续行分别判断。\u003c/p>\n\u003ch2 id=\"当前代码与实施入口\">当前代码与实施入口\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>责任\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>意图/持久格式\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/runs/creation_request.py\">creation_request\u003c/a>；task_snapshot_json.creation_request 保存 v1，无独立公开字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重放/创建/胜者\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/runs/service.py\">service\u003c/a>、\u003ca href=\"../PJM/backend/src/projectmind/runs/repository.py\">repository\u003c/a>；API 在解析当前任务前先查询\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web 原请求\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/web/src/lib/runSubmission.ts\">runSubmission\u003c/a>、\u003ca href=\"../PJM/web/src/hooks/useRunSubmission.ts\">useRunSubmission\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schedule\u003c/td>\n\u003ctd>\u003ca href=\"../PJM/backend/src/projectmind/schedules/service.py\">ScheduleService\u003c/a>先授权/查原键，再查重叠；不因此具备持久 occurrence 或幂等计数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>公开修改同步 Problem/response、Schema/example/OpenAPI、Web validator 和测试。内部身份版本不等于 HTTP 版本；仅 DB schema 变化才加 migration。\u003c/p>\n\u003ch2 id=\"验收清单\">验收清单\u003c/h2>\n\u003cp>验收原全集在新增/删除后重放不变；集合换序重放、改 ID 冲突；并发创建只留一个完整初始事务；解析失败能确认并发胜者；换 actor/越权不泄露；版本停用区分确认与新建；旧 hash 无法证明时拒绝兼容。\u003c/p>\n\u003cp>Web 另验同 tick 防重、丢响应、编辑草稿、身份切换及原键确认。Schedule 同 occurrence 不重建/不重复计数属于\u003ca href=\"#docs/design/task-scheduling.md::%E5%AE%9E%E7%8E%B0%E4%B8%8E%E9%AA%8C%E6%94%B6\">调度验收\u003c/a>，不是创建服务独自保证。\u003c/p>\n\u003cp>测试入口：\u003ca href=\"../PJM/backend/tests/runs\">Backend runs\u003c/a>、\u003ca href=\"../PJM/web/tests/browser/check_run_submission.py\">原请求浏览器回归\u003c/a>。数据库竞争与浏览器时序分别执行，mock API 不证明事务可靠。\u003c/p>\n", "sections": [{"title": "Run 创建、重发与幂等", "level": "h1", "anchor": "run-创建重发与幂等", "text": "# Run 创建、重发与幂等\n\n本页定义创建身份、首次快照与原请求确认。Backend 版本化重放和 Web 确认已有接线；真实事务验收与调度缺口见[计划](../planning/roadmap.md)。资源成员规则由[资源快照](resource-snapshots.md)负责。"}, {"title": "先分清三种“再执行”", "level": "h2", "anchor": "先分清三种再执行", "text": "## 先分清三种“再执行”\n\n| 意图 | 正确结果 |\n| --- | --- |\n| 创建响应丢失，确认原请求 | 返回原 Run，不新增快照、Segment 或 dispatch |\n| Worker 故障恢复 | 同 Segment 新增 Attempt，沿用冻结事实 |\n| 用户改变输入/范围/目标 | 新键、新 Run，不改旧快照 |\n\n答复/批准是已有 Run 的业务续行；Schedule 每个 occurrence 独立创建，同一 occurrence 的恢复不是新触发。"}, {"title": "请求身份与执行快照分开保存", "level": "h2", "anchor": "请求身份与执行快照分开保存", "text": "## 请求身份与执行快照分开保存\n\n请求身份保存“用户要创建什么”，执行快照保存“首次实际固定什么”。两者都不可在重放时改写。\n\n| 内容 | 身份 / 首次快照 |\n| --- | --- |\n| actor、Project、精确 SkillVersion/task_key | 全部参与身份；快照另存 Manifest checksum |\n| input、显式选项 | 按版本化规则比较；保存验证后的输入/Schema，不任意排序数组、转型或补默认值 |\n| 文档单份/集合 | 比较 ID；集合排序且拒绝重复；快照固定成员、路径、MIME、size/hash |\n| 文档全集 | 比较“全集”规则，不重新展开；首次成员单独冻结 |\n| Integration/binding | 比较显式身份或默认选择规则；冻结实际 scope/配置版本/binding，不重读今天的默认值 |\n| 权限/额度与追踪 | 上限由服务端冻结；trace、时间、生成 ID 不造成请求差异 |\n\n文档必需显式选择，省略可选槽位不授权全集；Integration 可按 Task/Project 默认 binding 解析。省略与显式指定是不同意图。未来开放限额选项须版本化纳入身份。\n\n服务端用[共享 hashing](../../PJM/backend/src/projectmind/core/hashing.py)保存规范化意图、摘要及格式版本；客户端 fingerprint 不能代替认证或原内容比较。"}, {"title": "幂等键的作用域", "level": "h3", "anchor": "幂等键的作用域", "text": "### 幂等键的作用域\n\n唯一约束为 (project_id, task_id, Idempotency-Key)，task_id 从精确 SkillVersion/task_key 导出，不按 actor 隔离。作用域内同键不同 actor/input/选择冲突；不同 Project/精确任务不承诺冲突。每个新意图仍生成新键，不能使用常量。"}, {"title": "目标创建流程", "level": "h2", "anchor": "目标创建流程", "text": "## 目标创建流程\n\n以下流程已接入，仍需真实 PostgreSQL 并发/回滚验收：\n\n```text\n当前认证 / CSRF / ProjectWriteActor / 请求校验\n  → 规范化意图，查询幂等作用域\n  ├─ 已存在：验证原身份/意图 → 相同返回原 Run，否则 409\n  └─ 不存在：解析精确任务/资源 → 创建事务\n       → 提交成功，或唯一冲突后读取胜者\n```\n\n- 所有请求都做当前授权；无权限者不能用 key 探测旧 Run。重放要求原 actor，不因有历史查看权即可冒充。\n- 重放先于当前资源/版本解析，不再枚举文档、调用 Provider 或刷新权限。新建才检查版本可用、输入、资源与策略。\n- 创建事务一次保存 Run、Segment 1、Skill/资源快照、初始事件与 dispatch Outbox；失败整体回滚，模型/大文件物化在事务外。\n- 预查询不替代唯一约束。并发同意图只接受胜者的首次快照，不拼接两次解析。\n- 解析失败时复查刚提交的同键胜者；仍不存在则返回原错误，不无限等待。再次确认继续保留原键。\n\n确认已有 Run 不等于它仍可执行。运行时 Provider 继续验证冻结授权、Integration 状态与批准；版本停用后的旧请求确认也不许可新建。"}, {"title": "响应、界面与历史兼容", "level": "h2", "anchor": "响应界面与历史兼容", "text": "## 响应、界面与历史兼容\n\n| 响应 | 含义 |\n| --- | --- |\n| 201 + Location | 首次创建成功，不代表执行成功 |\n| 200 + Idempotent-Replay: true | 原 Run 的当前状态，不新增事件 |\n| 409 idempotency_conflict | 同作用域的意图不同或旧身份无法证明；核对后显式新建 |\n| 断网/超时/无法校验响应 | 提交未知，不能自动换键 |"}, {"title": "提交结果未知时的界面责任", "level": "h3", "anchor": "提交结果未知时的界面责任", "text": "### 提交结果未知时的界面责任\n\n[WorkspacePage](../../PJM/web/src/pages/WorkspacePage.tsx)把可编辑 TaskDraft 与已发送请求分开。提交时固定 actor/Project/精确任务/input/sources/key，确认只发送原内容，不复制服务端 hash 算法。\n\n| 状态 | 界面行为 |\n| --- | --- |\n| sending | 同步防重；关闭弹窗后重新打开仍能查看 |\n| unknown | 网络错误、30 秒等待超时、408/429/服务错误或无效响应；原键确认或新标签页核对历史 |\n| rejected | 其余非 409 的 4xx；只说明本次拒绝，不清除先前“可能已创建”事实 |\n| conflict | 不自动重试、刷新原内容或换键；明确核对后新建 |\n\n草稿继续可编辑，原请求确认不依赖草稿现是否合法。另建前明确提示原 Run 可能存在，再由用户提交新意图。30 秒只结束 HTTP 等待，不取消 Run。\n\n重发用当前 CSRF，但必须仍是原 actor/Project；每次 await 后检查请求身份。切换账号/Project、离页后不处理旧结果，确认合法响应后才切换 detail/SSE 观察对象。\n\n待确认内容只存页面内存：关弹窗保留，刷新/离页/身份切换不保证恢复；正文和 token 不进 URL/Web storage。未知后再收到拒绝不能抹去不确定性。"}, {"title": "历史身份的证明范围", "level": "h3", "anchor": "历史身份的证明范围", "text": "### 历史身份的证明范围\n\n旧 request_hash 计算早于 binding 字段补入，不能直接对持久 selected_sources 重算。当前[兼容器](../../PJM/backend/src/projectmind/runs/creation_replay.py)仅移除能证明属于初次初始化的 binding_id / binding_checksum / binding_capability，以完整旧 hash 验证剩余快照，再从保存的 candidate/default 恢复意图。\n\n不读当前资源、不改旧行；缺原选择、未知版本或 hash 不符返回 409。历史可读、创建可确认、非终态可按新输入协议续行分别判断。"}, {"title": "当前代码与实施入口", "level": "h2", "anchor": "当前代码与实施入口", "text": "## 当前代码与实施入口\n\n| 责任 | 入口 |\n| --- | --- |\n| 意图/持久格式 | [creation_request](../../PJM/backend/src/projectmind/runs/creation_request.py)；task_snapshot_json.creation_request 保存 v1，无独立公开字段 |\n| 重放/创建/胜者 | [service](../../PJM/backend/src/projectmind/runs/service.py)、[repository](../../PJM/backend/src/projectmind/runs/repository.py)；API 在解析当前任务前先查询 |\n| Web 原请求 | [runSubmission](../../PJM/web/src/lib/runSubmission.ts)、[useRunSubmission](../../PJM/web/src/hooks/useRunSubmission.ts) |\n| Schedule | [ScheduleService](../../PJM/backend/src/projectmind/schedules/service.py)先授权/查原键，再查重叠；不因此具备持久 occurrence 或幂等计数 |\n\n公开修改同步 Problem/response、Schema/example/OpenAPI、Web validator 和测试。内部身份版本不等于 HTTP 版本；仅 DB schema 变化才加 migration。"}, {"title": "验收清单", "level": "h2", "anchor": "验收清单", "text": "## 验收清单\n\n验收原全集在新增/删除后重放不变；集合换序重放、改 ID 冲突；并发创建只留一个完整初始事务；解析失败能确认并发胜者；换 actor/越权不泄露；版本停用区分确认与新建；旧 hash 无法证明时拒绝兼容。\n\nWeb 另验同 tick 防重、丢响应、编辑草稿、身份切换及原键确认。Schedule 同 occurrence 不重建/不重复计数属于[调度验收](task-scheduling.md#实现与验收)，不是创建服务独自保证。\n\n测试入口：[Backend runs](../../PJM/backend/tests/runs/)、[原请求浏览器回归](../../PJM/web/tests/browser/check_run_submission.py)。数据库竞争与浏览器时序分别执行，mock API 不证明事务可靠。"}], "toc": [{"title": "先分清三种“再执行”", "anchor": "先分清三种再执行", "level": "h2"}, {"title": "请求身份与执行快照分开保存", "anchor": "请求身份与执行快照分开保存", "level": "h2"}, {"title": "幂等键的作用域", "anchor": "幂等键的作用域", "level": "h3"}, {"title": "目标创建流程", "anchor": "目标创建流程", "level": "h2"}, {"title": "响应、界面与历史兼容", "anchor": "响应界面与历史兼容", "level": "h2"}, {"title": "提交结果未知时的界面责任", "anchor": "提交结果未知时的界面责任", "level": "h3"}, {"title": "历史身份的证明范围", "anchor": "历史身份的证明范围", "level": "h3"}, {"title": "当前代码与实施入口", "anchor": "当前代码与实施入口", "level": "h2"}, {"title": "验收清单", "anchor": "验收清单", "level": "h2"}], "source": "design/run-creation.md", "checksum": "c8b7ba541be137ec25db5b850ba077241a5d0d0e1481837d8a372d10eef3f36b"}, {"id": "docs/design/resource-snapshots.md", "title": "资源快照与 Run 工作区", "group": "design", "html": "\u003ch1 id=\"资源快照与-run-工作区\">资源快照与 Run 工作区\u003c/h1>\n\u003cp>本页定义 Run 的读取范围、内容冻结和输入副本。上传/下载/删除属于\u003ca href=\"#docs/design/document-lifecycle.md::\">文档生命周期\u003c/a>，请求重放属于\u003ca href=\"#docs/design/run-creation.md::\">创建协议\u003c/a>，实施状态见\u003ca href=\"#docs/planning/roadmap.md::r01-%E8%B5%84%E6%BA%90%E5%86%BB%E7%BB%93\">计划 R01\u003c/a>。\u003c/p>\n\u003ch2 id=\"先区分三种冻结\">先区分三种“冻结”\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>固定事实与边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>授权快照\u003c/td>\n\u003ctd>Project、资源、capability、scope、Integration 版本；分支名不等于 commit，读取权不保证可达\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容快照\u003c/td>\n\u003ctd>文档 ID/hash/成员，或仓库读取时解析出的 revision；checksum 不是授权，也不是备份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>物化副本\u003c/td>\n\u003ctd>实际文件、转换、索引与 skipped；首次准备不等于创建瞬间已取得内容\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>三个时点分别记录。当前 document 使用创建清单，repository 首次打开才解析具体版本，issue 按 binding 逐条 live 读取并形成 Evidence，不物化文件树。\u003c/p>\n\u003ch2 id=\"文档选择与冻结设计\">文档选择与冻结设计\u003c/h2>\n\u003ch3 id=\"用户选择的是范围不是-provider-名称\">用户选择的是范围，不是 Provider 名称\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选择\u003c/th>\n\u003cth>冻结与限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>单份/集合\u003c/td>\n\u003ctd>同 Project 的原 ID/hash；集合去重校验后排序，不替换同路径重传的新 ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>显式全集\u003c/td>\n\u003ctd>固定创建事务当时的成员，后续上传不加入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可选不选\u003c/td>\n\u003ctd>不授予该槽位读取权，不回退全集\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>必需未选\u003c/td>\n\u003ctd>创建失败，不在后续对话中补授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>多槽位文档形成 Run 级去重并集，共用 input/documents/，不是槽位间隔离。Manifest 保留各 requirement 成员关系，重复 ID 的元数据必须一致。\u003c/p>\n\u003ch3 id=\"公开选择与读取投影的实施契约\">公开选择与读取投影的实施契约\u003c/h3>\n\u003cp>沿用 sources 字符串，由客户端编码、服务端独立校验；用户界面显示名称与范围。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>编码与数量\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>单份\u003c/td>\n\u003ctd>document:\u0026lt;UUID\u0026gt;，恰好一个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>集合\u003c/td>\n\u003ctd>documents:\u0026lt;UUID\u0026gt;,\u0026lt;UUID\u0026gt;…，同槽位 2–5000 个不同候选\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全集\u003c/td>\n\u003ctd>project-documents:all，创建时 1–5000 个成员；空/超量拒绝，不截断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不使用\u003c/td>\n\u003ctd>省略可选槽位；空串不是合法选择\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>不自动选择首份文档；即时执行和 Schedule 共用输入组件。候选变化后保留可解释草稿并要求修正，不偷偷改全集、替换 ID 或把单成员集合当有效集合。原请求确认使用已发送内容，不受新草稿影响。\u003c/p>\n\u003cp>服务端创建时保存 Project/requirement、模式、ID、路径、MIME、size、hash 与快照 checksum 于 selected_sources_json；客户端 checksum 不提供信任。Worker 按原 ID 校验实际字节，后续 Segment/Attempt 不重新枚举。\u003c/p>\n\u003ch3 id=\"用一个例子理解冻结边界\">用一个例子理解冻结边界\u003c/h3>\n\u003cp>全集创建 Run 1 时只有 A、B，随后新增 C：Run 1 的排队、重试和原请求确认仍只有 A、B；明确新建 Run 2 或下一次 Schedule occurrence 才可能固定 A、B、C。A 同路径重传为 A′不替代原 ID；缺失原内容明确失败。\u003c/p>\n\u003ch3 id=\"读取清单和资源摘要\">读取清单和资源摘要\u003c/h3>\n\u003cp>Run detail 的 document_snapshots 按 requirement_key 提供服务端验证后的清单：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>status\u003c/th>\n\u003cth>snapshot 与含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>FROZEN\u003c/td>\n\u003ctd>合法 v1 清单；不是当前目录、blob 可达性或准备完成证明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LEGACY_UNAVAILABLE\u003c/td>\n\u003ctd>null；旧记录没有可信清单，不猜测历史范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>INVALID\u003c/td>\n\u003ctd>null；校验失败，不公开未验证成员，其他合法历史仍可读\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>合法空数组表示未识别到文档来源，不等于旧响应缺字段。Web 对缺少必需 document_snapshots 的旧 API 报契约错误；新 API 读取旧 Run 用明确历史状态。\u003c/p>\n\u003cp>detail/history 的 selected_sources 只公开 provider / capability / resource_kind / access 摘要，兼容已知旧字符串；不暴露内部 JSON、scope、Secret locator 或未来字段。大成员清单只在 detail，不成为 Provider 授权输入。\u003c/p>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/runs/resource_projection.py\">服务端投影\u003c/a>重算 checksum；\u003ca href=\"../PJM/web/src/api/runResources.ts\">Web validator\u003c/a>校验形状、Project/slot 与关联，不复制服务端身份算法。公开变化同步 response、Schema/example/OpenAPI、Web 与三语，不改冻结快照。\u003c/p>\n\u003ch3 id=\"失败缓存与历史\">失败、缓存与历史\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>原 ID/blob 缺失，元数据或实际 hash 不符\u003c/td>\n\u003ctd>准备失败；不按路径替换、不伪装普通 skipped\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容合法但不支持/单文件过大\u003c/td>\n\u003ctd>manifest 记录 skipped，结果说明未覆盖范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完整副本合法\u003c/td>\n\u003ctd>校验来源、Run/Project、完整文件树后复用，不重新读取全集\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>副本缺失、改写或混入文件\u003c/td>\n\u003ctd>保留现场并失败，不删除重建或降级 live\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>live Tool 无法取原 ID\u003c/td>\n\u003ctd>返回不可用；已存副本与 live 可达性分别判断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧 Run 无清单/回执\u003c/td>\n\u003ctd>终态只读且标未知；非终态不自动授权全集，需新输入则新建 Run\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>当前文档删除尚无 Run/Schedule 引用门禁，可能破坏首次准备；\u003ca href=\"#docs/design/document-lifecycle.md::\">引用保护与清理\u003c/a>需补齐。缓存保留不由恢复流程任意删除。\u003c/p>\n\u003ch3 id=\"创建重放与调度\">创建重放与调度\u003c/h3>\n\u003cp>“全集”是稳定请求意图，首次成员是执行事实；重放查询原身份，沿用原快照，不把动态展开结果混入请求 hash。Schedule 保存选择规则，每个 occurrence 独立冻结；同 occurrence 返回原 Run。失效选择按\u003ca href=\"#docs/design/task-scheduling.md::%E4%BF%9D%E5%AD%98%E5%92%8C%E6%89%A7%E8%A1%8C%E8%BE%B9%E7%95%8C\">调度规则\u003c/a>拒绝，不换来源。\u003c/p>\n\u003ch2 id=\"仓库授权与内容版本\">仓库授权与内容版本\u003c/h2>\n\u003cp>scope.paths 是硬边界，scope.revisions 是允许范围；HEAD/分支可以移动，空 allowlist 不表示只许读首次版本。\u003ca href=\"../PJM/backend/src/projectmind/agent/repository_source.py\">repository_source\u003c/a>负责解析与检查。\u003c/p>\n\u003cp>首次物化 manifest 记录具体 commit/SVN revision；复现优先读副本。额外 live 读取仍满足冻结授权，并标实际 revision；跨版本证据不能混为同一事实。若要求创建瞬间内容，须显式固定可达 revision 或先实现创建时解析持久化，分支名不满足要求。\u003c/p>\n\u003ch2 id=\"产物与访问\">产物与访问\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">input/（只读）\n├── documents/               文档或转换文本\n│   └── .projectmind/        manifest.json、files.txt\n└── \u0026lt;repository requirement\u0026gt;/\n    └── .projectmind/        manifest.json、files.txt、history.txt\nworkspace/                   可写临时工作\noutput/                      可写报告/补丁\n\u003c/code>\u003c/pre>\n\u003cp>这是 Tool 逻辑路径。实际 input_dir 是 Run 根下 .projectmind-inputs/\u0026lt;snapshot_id\u0026gt;/，由平台映射，不开放世代目录或用 symlink 切换；旧 input/ 不搬迁补签。PreparedInput 的新 workspace/resources 必须由 Brief、read/search、Evidence 全部消费。\u003c/p>\n\u003cp>只经 workspace.write 写 workspace/output；input 与 Project 文档库不自由覆盖。xlsx/xlsm/docx 经\u003ca href=\"../PJM/backend/src/projectmind/agent/binary_text.py\">统一转换器\u003c/a>生成文本，保留源 hash/位置；PDF 未支持。凭据不进入文件、manifest、Evidence 或上下文。\u003c/p>\n\u003ch2 id=\"输入准备与可信缓存\">输入准备与可信缓存\u003c/h2>\n\u003cp>一个 Run 使用一份覆盖全部资源根的数据库回执；各根 manifest 不能证明自己未被连同文件改写。威胁模型允许 workspace 被篡改，但信任数据库与受控 Worker，不替代路径隔离/授权。\u003c/p>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/runs/input_snapshot.py\">DTO\u003c/a>、\u003ca href=\"../PJM/backend/src/projectmind/runs/repository_inputs.py\">store\u003c/a>与 \u003ca href=\"../PJM/backend/migrations/versions/0029_run_input_snapshots.py\">0029\u003c/a>已有 Run 唯一的 PREPARING/READY 记录，固定世代、Run/Project/Attempt、来源摘要、全部文件 path/size/hash、总量与完成时间。这不是 Run 状态或新公开 API；合法 READY 空集与缺回执不同。\u003c/p>\n\u003ch3 id=\"一次准备的提交边界\">一次准备的提交边界\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">有效 Attempt + heartbeat/取消监督\n  → TX A：校验来源/执行权，保存 PREPARING\n  → 锁外：独占世代，全部根读取/转换/计量，同步并封闭候选\n  → TX B：重验准备身份/lease/取消，提交 READY\n  → 确认同世代回执 → PreparedInput\n  → 冻结 Brief / 最终启动校验 → Agent\n\u003c/code>\u003c/pre>\n\u003cp>锁顺序 Run → Segment → Attempt，获锁后判定当前 lease/取消。候选落盘不叫发布；来源摘要来自冻结数据，不能从未知旧目录重新采样补信任。首次完成核对回执与候选，复用另验完整树/字节/总量/manifest；重复完成只能返回同一事实。\u003c/p>\n\u003cp>后续 Segment/Attempt 只复用原 READY 世代。慢 I/O 在取消后返回也不能提交或启动；独立准备 timeout 可能发生在提交中，不证明回滚，不许可删世代。监督责任见\u003ca href=\"#docs/design/agent-runtime.md::%E4%BB%8E%E9%A2%86%E5%8F%96%E5%88%B0%E6%A8%A1%E5%9E%8B%E5%90%AF%E5%8A%A8%E7%9A%84%E8%BE%B9%E7%95%8C\">Runtime\u003c/a>。\u003c/p>\n\u003ch3 id=\"准备中断与再次使用\">准备中断与再次使用\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>状态\u003c/th>\n\u003cth>放行条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>无回执且无旧输入/命名空间\u003c/td>\n\u003ctd>有效 Attempt 可首次准备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无回执但存在命名空间/旧输入\u003c/td>\n\u003ctd>保留并拒绝；空目录、另一 UUID、文件/symlink 都不能换名绕过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PREPARING，无论文件看似完整与否\u003c/td>\n\u003ctd>仅原有效准备继续；接管不替别人补签，暂无自动修复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>READY 且所有来源/树/字节/总量匹配\u003c/td>\n\u003ctd>当前授权下复用；额外文件/目录、缺失或 hash 不符则失败保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完成响应未知\u003c/td>\n\u003ctd>只确认原 Run 的同世代 READY；不再次 begin/complete 或新建输入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lease 失效/取消成立\u003c/td>\n\u003ctd>禁止完成与模型启动，由合法恢复处理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/agent/materialization_storage.py\">安全 I/O\u003c/a>先独占 .projectmind-inputs 命名空间，再建指定 UUID；只独占 UUID 不足以发现丢回执现场。创建中断保留痕迹，READY 复用不再首次创建。\u003c/p>\n\u003cp>当前 store 仅在 complete 已返回、事务退出发生 DBAPIError/TimeoutError/ConnectionError 时，另开 session 一次确认原准备者/世代/来源/文件及当前 lease/取消。complete 返回前错误与 CancelledError 不走确认；未知仍失败，不假设自动恢复。\u003c/p>\n\u003cp>恢复核对同一数据库、世代文件与 transcript \u003ca href=\"#docs/operations/backup-recovery.md::\">恢复点\u003c/a>，不能用较晚文件给较早数据库补签。\u003c/p>\n\u003ch3 id=\"读取时的完整性边界\">读取时的完整性边界\u003c/h3>\n\u003cp>read/search 返回与 Evidence 引用必须来自对照回执验证的同一份字节，不先 hash 再重新打开。使用锚定 Run 根、不跟随任何 symlink 的描述符、有界读取、普通单链接文件检查。\u003c/p>\n\u003cp>input search 先验证完整树，再按可信清单搜索；未知文件、hardlink/FIFO、缺失或篡改不伪装 binary skipped。正常结果/扫描截断显式 truncated；零匹配只覆盖实际搜索范围。可变 workspace 不需要伪造回执，但仍受路径和读取上限约束。\u003c/p>\n\u003ch3 id=\"跨根总量\">跨根总量\u003c/h3>\n\u003cp>当前已接入逐根及 max_total_files / max_total_bytes，最终存量按实际字节计，包含转换物、manifest、索引/history；保留原文另计，未落盘 skipped 不计原文字节。共享文档只计一次，不同仓库根的副本分别计。\u003c/p>\n\u003cp>单文件、逐根 max_files/max_bytes、全部输入总量是三层限制。必需 manifest/索引超限须失败，最后一根或总量失败时不能交付前几根。复用不重复消耗存量，但仍按有效限制验证。临时峰值磁盘、workspace/output、搜索响应和\u003ca href=\"#docs/design/run-budgets.md::\">模型预算\u003c/a>各自控制，不从最终存量推导磁盘不会耗尽。\u003c/p>\n\u003ch2 id=\"已知差距与后续设计\">已知差距与后续设计\u003c/h2>\n\u003cp>公开选择/清单、回执/物化/ContextBuilder/Tool/Worker 接线、跨根限额与准备监督已有代码。接续核对 \u003ca href=\"../PJM/backend/src/projectmind/agent/workspace_materializer.py\">workspace_materializer\u003c/a>和\u003ca href=\"../PJM/backend/tests/agent/test_input_preparation_protocol.py\">协议回归\u003c/a>，不把必需 store 改为可选。\u003c/p>\n\u003cp>剩余验收是完整消费者联调、真实 DB 并发/提交不明/迁移恢复、旧非终态与混合版本隔离、真实仓库凭据/故障及进程停止。当前无 PREPARING/孤立目录自动修复器；部署和完整恢复不由局部文件测试替代。\u003c/p>\n\u003ch2 id=\"验收条件\">验收条件\u003c/h2>\n\u003cp>验收选择并集、全集新增/同路径重传、跨 Project/伪造 hash、原键并发胜者；再验全树双重篡改、额外文件、校验后替换、慢准备/接管/取消/未知提交，以及多根最后超限时模型未启动。仓库 live 与副本 revision、转换来源和 skipped 必须可追溯；旧记录不补造。\u003c/p>\n", "sections": [{"title": "资源快照与 Run 工作区", "level": "h1", "anchor": "资源快照与-run-工作区", "text": "# 资源快照与 Run 工作区\n\n本页定义 Run 的读取范围、内容冻结和输入副本。上传/下载/删除属于[文档生命周期](document-lifecycle.md)，请求重放属于[创建协议](run-creation.md)，实施状态见[计划 R01](../planning/roadmap.md#r01-资源冻结)。"}, {"title": "先区分三种“冻结”", "level": "h2", "anchor": "先区分三种冻结", "text": "## 先区分三种“冻结”\n\n| 层次 | 固定事实与边界 |\n| --- | --- |\n| 授权快照 | Project、资源、capability、scope、Integration 版本；分支名不等于 commit，读取权不保证可达 |\n| 内容快照 | 文档 ID/hash/成员，或仓库读取时解析出的 revision；checksum 不是授权，也不是备份 |\n| 物化副本 | 实际文件、转换、索引与 skipped；首次准备不等于创建瞬间已取得内容 |\n\n三个时点分别记录。当前 document 使用创建清单，repository 首次打开才解析具体版本，issue 按 binding 逐条 live 读取并形成 Evidence，不物化文件树。"}, {"title": "文档选择与冻结设计", "level": "h2", "anchor": "文档选择与冻结设计", "text": "## 文档选择与冻结设计"}, {"title": "用户选择的是范围，不是 Provider 名称", "level": "h3", "anchor": "用户选择的是范围不是-provider-名称", "text": "### 用户选择的是范围，不是 Provider 名称\n\n| 选择 | 冻结与限制 |\n| --- | --- |\n| 单份/集合 | 同 Project 的原 ID/hash；集合去重校验后排序，不替换同路径重传的新 ID |\n| 显式全集 | 固定创建事务当时的成员，后续上传不加入 |\n| 可选不选 | 不授予该槽位读取权，不回退全集 |\n| 必需未选 | 创建失败，不在后续对话中补授权 |\n\n多槽位文档形成 Run 级去重并集，共用 input/documents/，不是槽位间隔离。Manifest 保留各 requirement 成员关系，重复 ID 的元数据必须一致。"}, {"title": "公开选择与读取投影的实施契约", "level": "h3", "anchor": "公开选择与读取投影的实施契约", "text": "### 公开选择与读取投影的实施契约\n\n沿用 sources 字符串，由客户端编码、服务端独立校验；用户界面显示名称与范围。\n\n| 模式 | 编码与数量 |\n| --- | --- |\n| 单份 | document:\u0026lt;UUID\u0026gt;，恰好一个 |\n| 集合 | documents:\u0026lt;UUID\u0026gt;,\u0026lt;UUID\u0026gt;…，同槽位 2–5000 个不同候选 |\n| 全集 | project-documents:all，创建时 1–5000 个成员；空/超量拒绝，不截断 |\n| 不使用 | 省略可选槽位；空串不是合法选择 |\n\n不自动选择首份文档；即时执行和 Schedule 共用输入组件。候选变化后保留可解释草稿并要求修正，不偷偷改全集、替换 ID 或把单成员集合当有效集合。原请求确认使用已发送内容，不受新草稿影响。\n\n服务端创建时保存 Project/requirement、模式、ID、路径、MIME、size、hash 与快照 checksum 于 selected_sources_json；客户端 checksum 不提供信任。Worker 按原 ID 校验实际字节，后续 Segment/Attempt 不重新枚举。"}, {"title": "用一个例子理解冻结边界", "level": "h3", "anchor": "用一个例子理解冻结边界", "text": "### 用一个例子理解冻结边界\n\n全集创建 Run 1 时只有 A、B，随后新增 C：Run 1 的排队、重试和原请求确认仍只有 A、B；明确新建 Run 2 或下一次 Schedule occurrence 才可能固定 A、B、C。A 同路径重传为 A′不替代原 ID；缺失原内容明确失败。"}, {"title": "读取清单和资源摘要", "level": "h3", "anchor": "读取清单和资源摘要", "text": "### 读取清单和资源摘要\n\nRun detail 的 document_snapshots 按 requirement_key 提供服务端验证后的清单：\n\n| status | snapshot 与含义 |\n| --- | --- |\n| FROZEN | 合法 v1 清单；不是当前目录、blob 可达性或准备完成证明 |\n| LEGACY_UNAVAILABLE | null；旧记录没有可信清单，不猜测历史范围 |\n| INVALID | null；校验失败，不公开未验证成员，其他合法历史仍可读 |\n\n合法空数组表示未识别到文档来源，不等于旧响应缺字段。Web 对缺少必需 document_snapshots 的旧 API 报契约错误；新 API 读取旧 Run 用明确历史状态。\n\ndetail/history 的 selected_sources 只公开 provider / capability / resource_kind / access 摘要，兼容已知旧字符串；不暴露内部 JSON、scope、Secret locator 或未来字段。大成员清单只在 detail，不成为 Provider 授权输入。\n\n[服务端投影](../../PJM/backend/src/projectmind/runs/resource_projection.py)重算 checksum；[Web validator](../../PJM/web/src/api/runResources.ts)校验形状、Project/slot 与关联，不复制服务端身份算法。公开变化同步 response、Schema/example/OpenAPI、Web 与三语，不改冻结快照。"}, {"title": "失败、缓存与历史", "level": "h3", "anchor": "失败缓存与历史", "text": "### 失败、缓存与历史\n\n| 情况 | 处理 |\n| --- | --- |\n| 原 ID/blob 缺失，元数据或实际 hash 不符 | 准备失败；不按路径替换、不伪装普通 skipped |\n| 内容合法但不支持/单文件过大 | manifest 记录 skipped，结果说明未覆盖范围 |\n| 完整副本合法 | 校验来源、Run/Project、完整文件树后复用，不重新读取全集 |\n| 副本缺失、改写或混入文件 | 保留现场并失败，不删除重建或降级 live |\n| live Tool 无法取原 ID | 返回不可用；已存副本与 live 可达性分别判断 |\n| 旧 Run 无清单/回执 | 终态只读且标未知；非终态不自动授权全集，需新输入则新建 Run |\n\n当前文档删除尚无 Run/Schedule 引用门禁，可能破坏首次准备；[引用保护与清理](document-lifecycle.md)需补齐。缓存保留不由恢复流程任意删除。"}, {"title": "创建重放与调度", "level": "h3", "anchor": "创建重放与调度", "text": "### 创建重放与调度\n\n“全集”是稳定请求意图，首次成员是执行事实；重放查询原身份，沿用原快照，不把动态展开结果混入请求 hash。Schedule 保存选择规则，每个 occurrence 独立冻结；同 occurrence 返回原 Run。失效选择按[调度规则](task-scheduling.md#保存和执行边界)拒绝，不换来源。"}, {"title": "仓库授权与内容版本", "level": "h2", "anchor": "仓库授权与内容版本", "text": "## 仓库授权与内容版本\n\nscope.paths 是硬边界，scope.revisions 是允许范围；HEAD/分支可以移动，空 allowlist 不表示只许读首次版本。[repository_source](../../PJM/backend/src/projectmind/agent/repository_source.py)负责解析与检查。\n\n首次物化 manifest 记录具体 commit/SVN revision；复现优先读副本。额外 live 读取仍满足冻结授权，并标实际 revision；跨版本证据不能混为同一事实。若要求创建瞬间内容，须显式固定可达 revision 或先实现创建时解析持久化，分支名不满足要求。"}, {"title": "产物与访问", "level": "h2", "anchor": "产物与访问", "text": "## 产物与访问\n\n```text\ninput/（只读）\n├── documents/               文档或转换文本\n│   └── .projectmind/        manifest.json、files.txt\n└── \u003crepository requirement>/\n    └── .projectmind/        manifest.json、files.txt、history.txt\nworkspace/                   可写临时工作\noutput/                      可写报告/补丁\n```\n\n这是 Tool 逻辑路径。实际 input_dir 是 Run 根下 .projectmind-inputs/\u0026lt;snapshot_id\u0026gt;/，由平台映射，不开放世代目录或用 symlink 切换；旧 input/ 不搬迁补签。PreparedInput 的新 workspace/resources 必须由 Brief、read/search、Evidence 全部消费。\n\n只经 workspace.write 写 workspace/output；input 与 Project 文档库不自由覆盖。xlsx/xlsm/docx 经[统一转换器](../../PJM/backend/src/projectmind/agent/binary_text.py)生成文本，保留源 hash/位置；PDF 未支持。凭据不进入文件、manifest、Evidence 或上下文。"}, {"title": "输入准备与可信缓存", "level": "h2", "anchor": "输入准备与可信缓存", "text": "## 输入准备与可信缓存\n\n一个 Run 使用一份覆盖全部资源根的数据库回执；各根 manifest 不能证明自己未被连同文件改写。威胁模型允许 workspace 被篡改，但信任数据库与受控 Worker，不替代路径隔离/授权。\n\n[DTO](../../PJM/backend/src/projectmind/runs/input_snapshot.py)、[store](../../PJM/backend/src/projectmind/runs/repository_inputs.py)与 [0029](../../PJM/backend/migrations/versions/0029_run_input_snapshots.py)已有 Run 唯一的 PREPARING/READY 记录，固定世代、Run/Project/Attempt、来源摘要、全部文件 path/size/hash、总量与完成时间。这不是 Run 状态或新公开 API；合法 READY 空集与缺回执不同。"}, {"title": "一次准备的提交边界", "level": "h3", "anchor": "一次准备的提交边界", "text": "### 一次准备的提交边界\n\n```text\n有效 Attempt + heartbeat/取消监督\n  → TX A：校验来源/执行权，保存 PREPARING\n  → 锁外：独占世代，全部根读取/转换/计量，同步并封闭候选\n  → TX B：重验准备身份/lease/取消，提交 READY\n  → 确认同世代回执 → PreparedInput\n  → 冻结 Brief / 最终启动校验 → Agent\n```\n\n锁顺序 Run → Segment → Attempt，获锁后判定当前 lease/取消。候选落盘不叫发布；来源摘要来自冻结数据，不能从未知旧目录重新采样补信任。首次完成核对回执与候选，复用另验完整树/字节/总量/manifest；重复完成只能返回同一事实。\n\n后续 Segment/Attempt 只复用原 READY 世代。慢 I/O 在取消后返回也不能提交或启动；独立准备 timeout 可能发生在提交中，不证明回滚，不许可删世代。监督责任见[Runtime](agent-runtime.md#从领取到模型启动的边界)。"}, {"title": "准备中断与再次使用", "level": "h3", "anchor": "准备中断与再次使用", "text": "### 准备中断与再次使用\n\n| 状态 | 放行条件 |\n| --- | --- |\n| 无回执且无旧输入/命名空间 | 有效 Attempt 可首次准备 |\n| 无回执但存在命名空间/旧输入 | 保留并拒绝；空目录、另一 UUID、文件/symlink 都不能换名绕过 |\n| PREPARING，无论文件看似完整与否 | 仅原有效准备继续；接管不替别人补签，暂无自动修复 |\n| READY 且所有来源/树/字节/总量匹配 | 当前授权下复用；额外文件/目录、缺失或 hash 不符则失败保留 |\n| 完成响应未知 | 只确认原 Run 的同世代 READY；不再次 begin/complete 或新建输入 |\n| lease 失效/取消成立 | 禁止完成与模型启动，由合法恢复处理 |\n\n[安全 I/O](../../PJM/backend/src/projectmind/agent/materialization_storage.py)先独占 .projectmind-inputs 命名空间，再建指定 UUID；只独占 UUID 不足以发现丢回执现场。创建中断保留痕迹，READY 复用不再首次创建。\n\n当前 store 仅在 complete 已返回、事务退出发生 DBAPIError/TimeoutError/ConnectionError 时，另开 session 一次确认原准备者/世代/来源/文件及当前 lease/取消。complete 返回前错误与 CancelledError 不走确认；未知仍失败，不假设自动恢复。\n\n恢复核对同一数据库、世代文件与 transcript [恢复点](../operations/backup-recovery.md)，不能用较晚文件给较早数据库补签。"}, {"title": "读取时的完整性边界", "level": "h3", "anchor": "读取时的完整性边界", "text": "### 读取时的完整性边界\n\nread/search 返回与 Evidence 引用必须来自对照回执验证的同一份字节，不先 hash 再重新打开。使用锚定 Run 根、不跟随任何 symlink 的描述符、有界读取、普通单链接文件检查。\n\ninput search 先验证完整树，再按可信清单搜索；未知文件、hardlink/FIFO、缺失或篡改不伪装 binary skipped。正常结果/扫描截断显式 truncated；零匹配只覆盖实际搜索范围。可变 workspace 不需要伪造回执，但仍受路径和读取上限约束。"}, {"title": "跨根总量", "level": "h3", "anchor": "跨根总量", "text": "### 跨根总量\n\n当前已接入逐根及 max_total_files / max_total_bytes，最终存量按实际字节计，包含转换物、manifest、索引/history；保留原文另计，未落盘 skipped 不计原文字节。共享文档只计一次，不同仓库根的副本分别计。\n\n单文件、逐根 max_files/max_bytes、全部输入总量是三层限制。必需 manifest/索引超限须失败，最后一根或总量失败时不能交付前几根。复用不重复消耗存量，但仍按有效限制验证。临时峰值磁盘、workspace/output、搜索响应和[模型预算](run-budgets.md)各自控制，不从最终存量推导磁盘不会耗尽。"}, {"title": "已知差距与后续设计", "level": "h2", "anchor": "已知差距与后续设计", "text": "## 已知差距与后续设计\n\n公开选择/清单、回执/物化/ContextBuilder/Tool/Worker 接线、跨根限额与准备监督已有代码。接续核对 [workspace_materializer](../../PJM/backend/src/projectmind/agent/workspace_materializer.py)和[协议回归](../../PJM/backend/tests/agent/test_input_preparation_protocol.py)，不把必需 store 改为可选。\n\n剩余验收是完整消费者联调、真实 DB 并发/提交不明/迁移恢复、旧非终态与混合版本隔离、真实仓库凭据/故障及进程停止。当前无 PREPARING/孤立目录自动修复器；部署和完整恢复不由局部文件测试替代。"}, {"title": "验收条件", "level": "h2", "anchor": "验收条件", "text": "## 验收条件\n\n验收选择并集、全集新增/同路径重传、跨 Project/伪造 hash、原键并发胜者；再验全树双重篡改、额外文件、校验后替换、慢准备/接管/取消/未知提交，以及多根最后超限时模型未启动。仓库 live 与副本 revision、转换来源和 skipped 必须可追溯；旧记录不补造。"}], "toc": [{"title": "先区分三种“冻结”", "anchor": "先区分三种冻结", "level": "h2"}, {"title": "文档选择与冻结设计", "anchor": "文档选择与冻结设计", "level": "h2"}, {"title": "用户选择的是范围，不是 Provider 名称", "anchor": "用户选择的是范围不是-provider-名称", "level": "h3"}, {"title": "公开选择与读取投影的实施契约", "anchor": "公开选择与读取投影的实施契约", "level": "h3"}, {"title": "用一个例子理解冻结边界", "anchor": "用一个例子理解冻结边界", "level": "h3"}, {"title": "读取清单和资源摘要", "anchor": "读取清单和资源摘要", "level": "h3"}, {"title": "失败、缓存与历史", "anchor": "失败缓存与历史", "level": "h3"}, {"title": "创建重放与调度", "anchor": "创建重放与调度", "level": "h3"}, {"title": "仓库授权与内容版本", "anchor": "仓库授权与内容版本", "level": "h2"}, {"title": "产物与访问", "anchor": "产物与访问", "level": "h2"}, {"title": "输入准备与可信缓存", "anchor": "输入准备与可信缓存", "level": "h2"}, {"title": "一次准备的提交边界", "anchor": "一次准备的提交边界", "level": "h3"}, {"title": "准备中断与再次使用", "anchor": "准备中断与再次使用", "level": "h3"}, {"title": "读取时的完整性边界", "anchor": "读取时的完整性边界", "level": "h3"}, {"title": "跨根总量", "anchor": "跨根总量", "level": "h3"}, {"title": "已知差距与后续设计", "anchor": "已知差距与后续设计", "level": "h2"}, {"title": "验收条件", "anchor": "验收条件", "level": "h2"}], "source": "design/resource-snapshots.md", "checksum": "22c2fec953befb10f6839cc6ae3acf74c3fee17459b387e54e224d92a582305d"}, {"id": "docs/design/agent-runtime.md", "title": "Agent Runtime 与持续执行", "group": "design", "html": "\u003ch1 id=\"agent-runtime-与持续执行\">Agent Runtime 与持续执行\u003c/h1>\n\u003cp>本页负责已有 Run 的执行、会话与事件协议。创建身份见\u003ca href=\"#docs/design/run-creation.md::\">Run 创建\u003c/a>，输入一致性见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>，状态与剩余工作见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划\u003c/a>。\u003c/p>\n\u003ch2 id=\"设计结论\">设计结论\u003c/h2>\n\u003cp>Run 是持续的业务线程，不等于一次 SDK query、Session 或进程。默认引擎为 Claude Agent SDK，业务层只依赖 AgentEngine。Agent 可以自主规划只读分析，但资源、权限、交互、外部效果与终态由平台控制；PostgreSQL 是审计正本。\u003c/p>\n\u003ch2 id=\"责任边界\">责任边界\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>责任方\u003c/th>\n\u003cth>负责什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ProjectMind\u003c/td>\n\u003ctd>从发布版本的 Blueprint 生成任务/Brief，冻结资源与权限；管理 lease、恢复、预算、交互、效果、证据、结果与事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AgentEngine\u003c/td>\n\u003ctd>在 Brief 内规划、选择允许的 Tool、维持会话，产生公开文本、用量、交互和结果候选\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent 无权决定\u003c/td>\n\u003ctd>扩大 Project/scope、取得 Secret、增加 Tool、自批提案、绕过限额/校验或直接调用未注册 Provider\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Skill、Ticket、代码或模型建议都是输入，不是授权。业务规则不放进 route、queue job 或 SDK adapter。\u003c/p>\n\u003ch2 id=\"agentengine-抽象\">AgentEngine 抽象\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/backend/src/projectmind/agent/domain.py\">agent/domain.py\u003c/a>定义 execute / resume / fork / interrupt / health；前三者直接返回异步事件迭代器。Adapter 把 SDK message 映射为平台 AgentEvent，不向业务服务泄漏 SDK 类型。\u003c/p>\n\u003cp>一个 Run 同时只有一个活动 PRIMARY Session。子 Session 使用 SUBAGENT / BRANCH，共用父 RunAttempt；数据库唯一约束只针对 PRIMARY。子活动汇总为主 Session 的 ToolCall/Evidence，不另写 RunEvent sequence。权限、输出与预算规则见\u003ca href=\"#docs/design/subagents.md::\">子分析\u003c/a>。\u003c/p>\n\u003ch2 id=\"agenttaskbrief\">AgentTaskBrief\u003c/h2>\n\u003cp>每个 Segment 启动前冻结一份 \u003ca href=\"../PJM/contracts/agent-task-brief/v1.schema.json\">AgentTaskBrief\u003c/a>：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>必须说明什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>身份与目标\u003c/td>\n\u003ctd>Run、Segment、Task、精确 SkillVersion/checksum，目标和成功条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>指导与资源\u003c/td>\n\u003ctd>Skill 必需规则、建议步骤、质量要求与禁止事项；合法 binding、来源与路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>策略\u003c/td>\n\u003ctd>capability/参数/scope、限额、交互和效果批准边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输出与续行\u003c/td>\n\u003ctd>交付要求、可选 Schema、checkpoint、已确认事实及 Evidence/Proposal 引用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>完整指导不能退化为短 prompt。Checkpoint 可压缩上下文，但保留原 transcript/source trace，不改用户事实或批准范围。Brief 不含明文凭据、内部配置或其他 Project 数据。\u003c/p>\n\u003ch2 id=\"自主执行等级\">自主执行等级\u003c/h2>\n\u003cp>ExecutionProfile 是策略合成模型，不表示全部选项已有独立 Web 控件。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Profile\u003c/th>\n\u003cth>范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>GUIDED\u003c/td>\n\u003ctd>优先显式步骤，关键歧义询问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUPERVISED\u003c/td>\n\u003ctd>默认；自主选择读取、验证和报告方式，业务取舍或外部效果前询问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DELEGATED\u003c/td>\n\u003ctd>在明确预授权的资源/低风险效果内扩大自主循环，仍受硬拒绝限制\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Skill 可推荐等级；system ADMIN 设置项目上限，发起人只能选更保守的等级。不存在独立 Project ADMIN 角色。\u003c/p>\n\u003cp>Agent 可调整分析顺序、交叉验证、组织证据并在 workspace/output 生成产物。缺少关键事实、业务选择、有效批准，或规则相互冲突时应暂停。\u003c/p>\n\u003cp>原 scope 内补充对象 ID/偏好可以续行；新增 Integration、改 Project、扩文档集合、权限或预算须新建 Run。必需资源缺失在创建时拒绝，可选资源未选也不能在对话中隐式启用。\u003c/p>\n\u003ch2 id=\"tool-与工作区边界\">Tool 与工作区边界\u003c/h2>\n\u003ch3 id=\"tool-分类\">Tool 分类\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>等级\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>observe\u003c/td>\n\u003ctd>参数校验后读取已绑定资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>workspace\u003c/td>\n\u003ctd>仅在隔离 workspace/output 写临时文件、报告或补丁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>propose\u003c/td>\n\u003ctd>保存外部变更候选，不提交远端\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>apply\u003c/td>\n\u003ctd>独立 Effect Worker 执行；默认人工批准，仅允许明确低风险预授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>当前注册 issue/repository/document 读取、workspace read/search/write、interaction.request、change.propose、subagent.dispatch；Effect Provider 为 issue.update/repository.write。所有能力使用版本 ID 与平台注册 handler，凭据仅由 Provider 经 SecretReference 取得。\u003ca href=\"../PJM/contracts/tools\">Tool 契约\u003c/a>不等于任意同名能力已开放。\u003c/p>\n\u003ch3 id=\"文件shell-和-web\">文件、Shell 和 Web\u003c/h3>\n\u003cul>\n\u003cli>SDK 内置 Read/Glob/Grep/Bash/Write/Edit/Web 仍 hard deny；平台 capability 提供受控等价功能。\u003c/li>\n\u003cli>input/ 是冻结只读证据；workspace.write 仅写 workspace/、output/，不覆盖 Project 文档库或外部目标，不存在自由 document.write。\u003c/li>\n\u003cli>cwd 不是隔离边界；依赖 mount、路径检查、sandbox、Gateway 与 scope，拒绝 path/symlink 逃逸。\u003c/li>\n\u003cli>任意 Shell、sandbox command、通用网络尚未开放。后续须有独立威胁模型、允许命令/镜像/资源上限及注册 fetch/search Provider；不暴露 Docker socket、Secret 或无限制网络。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"pretooluse-判定\">PreToolUse 判定\u003c/h3>\n\u003cp>检查由 hook、Gateway、binding/Provider 和 Effect Worker 分担，不是一个 hook 已覆盖全部：\u003c/p>\n\u003col>\n\u003cli>注册 capability，且满足 Skill requirement、Project policy 与 Run 权限快照。\u003c/li>\n\u003cli>binding、Integration、路径、对象/revision 和网络范围匹配。\u003c/li>\n\u003cli>参数通过 Tool contract，拒绝 credential-like 字段。\u003c/li>\n\u003cli>执行路径的局部限额满足；Run 累计强制仍待\u003ca href=\"#docs/design/run-budgets.md::\">共享预算\u003c/a>接入。\u003c/li>\n\u003cli>apply 有有效批准或精确预授权。\u003c/li>\n\u003c/ol>\n\u003cp>请求侧检查在 Provider 前执行；响应 Schema、敏感信息与大小检查在返回后执行，失败内容不交给 Agent。错误仅存脱敏审计，禁止全局 bypassPermissions。\u003c/p>\n\u003ch3 id=\"资源快照的物化\">资源快照的物化\u003c/h3>\n\u003cp>repository 按冻结授权物化至 input/\u0026lt;requirement_key\u0026gt;/，具体 revision 在打开资源时解析；document 使用创建时冻结的 ID/hash/成员，映射至 input/documents/。分支名不等于固定 commit，公开清单不是 Provider 的授权输入。\u003c/p>\n\u003cp>全部资源根通过\u003ca href=\"#docs/design/resource-snapshots.md::%E8%BE%93%E5%85%A5%E5%87%86%E5%A4%87%E4%B8%8E%E5%8F%AF%E4%BF%A1%E7%BC%93%E5%AD%98\">输入准备回执\u003c/a>后，Brief 才取得可用逻辑路径；后续 Attempt 只复用同一可信世代，不静默重建。Tool 读取仍校验同一份实际字节。\u003c/p>\n\u003ch2 id=\"持续-run-与多会话\">持续 Run 与多会话\u003c/h2>\n\u003ch3 id=\"生命周期\">生命周期\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">Run + Segment 1 + dispatch Outbox\n  → Worker 准备输入 / 冻结 Brief → Session 执行\n  → 持久化 checkpoint 与等待 → 普通答复或效果处理\n  → Segment 2 + dispatch Outbox → 准备新的 Brief\n  → resume / fork / replace → Result 与终态 RUN_SNAPSHOT\n\u003c/code>\u003c/pre>\n\u003cp>等待不是终态；精确状态及 Attempt 的 DEFERRED 见\u003ca href=\"#docs/design/domain-model.md::run-%E7%8A%B6%E6%80%81%E9%80%9F%E6%9F%A5\">状态速查\u003c/a>。答复事务先保存 Segment/Outbox，Brief 由后续 Worker 冻结，不在回答时提前宣称准备完成。\u003c/p>\n\u003ch3 id=\"segmentattempt-与-session-的区别\">Segment、Attempt 与 Session 的区别\u003c/h3>\n\u003cp>Segment 表示新的业务阶段；Attempt 表示同段技术重试；Session 表示模型对话上下文。故障不制造新决策，用户答复不伪装技术重试。三者均不改变 Run 的 Skill、资源与权限上限。\u003c/p>\n\u003ch3 id=\"会话延续策略\">会话延续策略\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>resume\u003c/td>\n\u003ctd>引擎/模型兼容、目标未分叉，transcript/workspace 完整\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fork\u003c/td>\n\u003ctd>明确比较方案或保留分析分支\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>replace\u003c/td>\n\u003ctd>上下文损坏、不兼容或需重压缩；新 Session 接收可审计 checkpoint\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>记录 continuation mode、parent、模型与 checkpoint checksum；transcript 用于恢复，平台事件/ToolCall/Evidence/Interaction 才是审计事实。不完整时不无声从头执行。\u003c/p>\n\u003ch3 id=\"从领取到模型启动的边界\">从领取到模型启动的边界\u003c/h3>\n\u003cp>当前 \u003ca href=\"../PJM/backend/src/projectmind/worker/executor.py\">Executor\u003c/a>按以下顺序执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">有效 claim → heartbeat / 取消监督\n  → Run RUNNING → ContextBuilder（独立准备 timeout）\n  → 验证 context 身份/sequence\n  → 短事务冻结 Brief（重验 lease/取消）\n  → 短事务启动校验（再验状态/lease/取消）\n  → 事务外 execute / resume / fork\n\u003c/code>\u003c/pre>\n\u003cp>context 匹配 claim 的 Run/Attempt/Project/actor，sequence 由 repository 分配。锁顺序 Run → Segment → Attempt；获锁后使用当前时间和数据库 lease，不使用 claim 或等锁前的旧到期判断。网络、转换和模型调用不在锁内等待。\u003c/p>\n\u003cp>RUNNING 只说明执行状态推进，READY 只说明输入回执已提交，Brief 冻结只说明该段指导已固定，Session 活动才说明记录了模型活动；任何一项都不代表 Run 已成功。\u003c/p>\n\u003ch3 id=\"取消超时与失去执行权\">取消、超时与失去执行权\u003c/h3>\n\u003cp>取消意图、业务终态、进程退出与用量结清分别处理。已有准备期/首事件前取消、锁内终态复查及等待/普通事件取消检查；等待拒绝和取消终态仍是两个事务，后者重新 fencing。详细阶段、故障与验收见\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a>。\u003c/p>\n\u003ch2 id=\"用户交互协议\">用户交互协议\u003c/h2>\n\u003cp>普通答复只在冻结范围内补充事实，成功答复追加 Segment。REVIEW 不等于 Evaluation，推荐不是默认回答，required=false 不自动跳过；410 也可能伴随已提交的过期续行。\u003c/p>\n\u003cp>普通 interaction.request 只接受 CLARIFICATION/CHOICE/REVIEW；无 Proposal 的历史批准等待保持只读，不经普通答复或过期恢复解锁。原作者重放、期限竞争与页面原请求确认统一见\u003ca href=\"#docs/design/user-interactions.md::\">普通交互\u003c/a>，不与外部批准混用。\u003c/p>\n\u003ch2 id=\"外部效果协议\">外部效果协议\u003c/h2>\n\u003cp>observe → Evidence → propose → 精确批准/允许的预授权 → 独立 Effect Worker apply → read-back。Agent 不直接写外部系统，也不批准自己的提案。\u003c/p>\n\u003cp>提案必须冻结目标、patch/操作、Evidence、前置 revision、风险/可逆性、幂等身份和来源 Session。批准者限发起人或 system ADMIN；审批时复验 actor、Project、version/checksum、Integration 与 scope。repository.write 永远人工批准且不 force。\u003c/p>\n\u003cp>陈旧目标不覆盖，原身份重试，不重复副作用；写入后验证失败需明确核对，不静默成功。Provider 已存在，但精确 CAS、远端身份、阶段回执及独立 Effect 监督仍有缺口，唯一正本见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。\u003c/p>\n\u003ch2 id=\"结果与输出验证\">结果与输出验证\u003c/h2>\n\u003cp>候选先经平台 validator，再交终态事务锁后检查 lease/取消；失败和取消可以没有 Result。结构通过不证明业务正确、附件可读或模型效果摘要已核验。Outcome、引用与人工修订统一见\u003ca href=\"#docs/design/results-evaluation.md::\">结果与评价\u003c/a>；子任务有独立的\u003ca href=\"#docs/design/subagents.md::%E5%AD%90%E4%BB%BB%E5%8A%A1%E6%8C%87%E4%BB%A4%E4%B8%8E%E7%BB%93%E6%9E%9C%E7%9A%84%E8%BE%B9%E7%95%8C\">输出派生责任\u003c/a>。\u003c/p>\n\u003ch2 id=\"事件状态与可靠性\">事件、状态与可靠性\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../PJM/contracts/events/run-event/v1.schema.json\">RunEvent 契约\u003c/a>覆盖 Segment、Session、Interaction、checkpoint 与 Effect；Run 内 sequence 严格递增。\u003c/li>\n\u003cli>状态变更与 Outbox 同事务。Queue 重投由数据库领取抑制，Tool 重放与 Effect 幂等各用自身协议，不承诺模型/远端全局精确一次。\u003c/li>\n\u003cli>只有有效 lease 可提交；失效由 Recovery 接管，同段重试受 PROJECTMIND_RUN_MAX_ATTEMPTS 限制。\u003c/li>\n\u003cli>终态 RUN_SNAPSHOT 是最后持久事件，SSE 据此结束。终态不可恢复，新目标创建新 Run。\u003c/li>\n\u003cli>模型 wall timeout 不含准备、排队、人工等待或全部 Attempt 累计；各计时器见\u003ca href=\"#docs/design/run-budgets.md::%E7%8E%B0%E6%9C%89%E8%AE%A1%E6%97%B6%E5%99%A8%E7%9A%84%E8%A6%86%E7%9B%96%E8%8C%83%E5%9B%B4\">预算说明\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003cp>停写须覆盖所有 job/cron/实例，dispatch 开关不等于全局停止；见\u003ca href=\"#docs/operations/deployment.md::\">发布边界\u003c/a>。\u003c/p>\n\u003ch2 id=\"claude-agent-sdk-实现要求\">Claude Agent SDK 实现要求\u003c/h2>\n\u003cp>锁定 SDK/CLI 版本并记录模型/options checksum，SessionStore 镜像 transcript。Hook 执行平台策略，SDK allowed tools 与 structured output 不替代参数和结果校验。人工等待须收束收费进程，不长期占 Worker。\u003c/p>\n\u003cp>升级或新增引擎先验消息映射、resume/fork/interrupt、旧 Session 恢复、Tool 拒绝/MCP、等待与错误分类；使用同一 conformance suite。\u003c/p>\n\u003ch2 id=\"安全测试矩阵\">安全测试矩阵\u003c/h2>\n\u003cp>验收覆盖：指导完整且不可扩权；缺资源拒绝创建；答复新增 Segment、故障只新增 Attempt；顺序 Session 不漂移；未批准/stale/scope 外效果拒绝；路径逃逸拒绝；同 Run 引用与 Secret 边界；终态不可续行。\u003c/p>\n\u003cp>监督专项还需慢准备、锁等待过期、Brief/首事件前取消、提交不明与真实进程清理；分别观察 Run/Session/Result/Outbox，而非只测异常映射。\u003c/p>\n\u003ch2 id=\"当前实现边界\">当前实现边界\u003c/h2>\n\u003cp>已有 Brief、持续 Run、顺序主会话、只读子分析、workspace 与受控效果入口，以及输入回执和准备监督接线。剩余是完整资源/历史续行、真实事务和停止证明；共享预算只有内部账本，未接创建及主子执行。精确接续范围见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>，不重复维护测试数字。\u003c/p>\n", "sections": [{"title": "Agent Runtime 与持续执行", "level": "h1", "anchor": "agent-runtime-与持续执行", "text": "# Agent Runtime 与持续执行\n\n本页负责已有 Run 的执行、会话与事件协议。创建身份见[Run 创建](run-creation.md)，输入一致性见[资源快照](resource-snapshots.md)，状态与剩余工作见[计划](../planning/roadmap.md#r07-run-与审计)。"}, {"title": "设计结论", "level": "h2", "anchor": "设计结论", "text": "## 设计结论\n\nRun 是持续的业务线程，不等于一次 SDK query、Session 或进程。默认引擎为 Claude Agent SDK，业务层只依赖 AgentEngine。Agent 可以自主规划只读分析，但资源、权限、交互、外部效果与终态由平台控制；PostgreSQL 是审计正本。"}, {"title": "责任边界", "level": "h2", "anchor": "责任边界", "text": "## 责任边界\n\n| 责任方 | 负责什么 |\n| --- | --- |\n| ProjectMind | 从发布版本的 Blueprint 生成任务/Brief，冻结资源与权限；管理 lease、恢复、预算、交互、效果、证据、结果与事件 |\n| AgentEngine | 在 Brief 内规划、选择允许的 Tool、维持会话，产生公开文本、用量、交互和结果候选 |\n| Agent 无权决定 | 扩大 Project/scope、取得 Secret、增加 Tool、自批提案、绕过限额/校验或直接调用未注册 Provider |\n\nSkill、Ticket、代码或模型建议都是输入，不是授权。业务规则不放进 route、queue job 或 SDK adapter。"}, {"title": "AgentEngine 抽象", "level": "h2", "anchor": "agentengine-抽象", "text": "## AgentEngine 抽象\n\n[agent/domain.py](../../PJM/backend/src/projectmind/agent/domain.py)定义 execute / resume / fork / interrupt / health；前三者直接返回异步事件迭代器。Adapter 把 SDK message 映射为平台 AgentEvent，不向业务服务泄漏 SDK 类型。\n\n一个 Run 同时只有一个活动 PRIMARY Session。子 Session 使用 SUBAGENT / BRANCH，共用父 RunAttempt；数据库唯一约束只针对 PRIMARY。子活动汇总为主 Session 的 ToolCall/Evidence，不另写 RunEvent sequence。权限、输出与预算规则见[子分析](subagents.md)。"}, {"title": "AgentTaskBrief", "level": "h2", "anchor": "agenttaskbrief", "text": "## AgentTaskBrief\n\n每个 Segment 启动前冻结一份 [AgentTaskBrief](../../PJM/contracts/agent-task-brief/v1.schema.json)：\n\n| 内容 | 必须说明什么 |\n| --- | --- |\n| 身份与目标 | Run、Segment、Task、精确 SkillVersion/checksum，目标和成功条件 |\n| 指导与资源 | Skill 必需规则、建议步骤、质量要求与禁止事项；合法 binding、来源与路径 |\n| 策略 | capability/参数/scope、限额、交互和效果批准边界 |\n| 输出与续行 | 交付要求、可选 Schema、checkpoint、已确认事实及 Evidence/Proposal 引用 |\n\n完整指导不能退化为短 prompt。Checkpoint 可压缩上下文，但保留原 transcript/source trace，不改用户事实或批准范围。Brief 不含明文凭据、内部配置或其他 Project 数据。"}, {"title": "自主执行等级", "level": "h2", "anchor": "自主执行等级", "text": "## 自主执行等级\n\nExecutionProfile 是策略合成模型，不表示全部选项已有独立 Web 控件。\n\n| Profile | 范围 |\n| --- | --- |\n| GUIDED | 优先显式步骤，关键歧义询问 |\n| SUPERVISED | 默认；自主选择读取、验证和报告方式，业务取舍或外部效果前询问 |\n| DELEGATED | 在明确预授权的资源/低风险效果内扩大自主循环，仍受硬拒绝限制 |\n\nSkill 可推荐等级；system ADMIN 设置项目上限，发起人只能选更保守的等级。不存在独立 Project ADMIN 角色。\n\nAgent 可调整分析顺序、交叉验证、组织证据并在 workspace/output 生成产物。缺少关键事实、业务选择、有效批准，或规则相互冲突时应暂停。\n\n原 scope 内补充对象 ID/偏好可以续行；新增 Integration、改 Project、扩文档集合、权限或预算须新建 Run。必需资源缺失在创建时拒绝，可选资源未选也不能在对话中隐式启用。"}, {"title": "Tool 与工作区边界", "level": "h2", "anchor": "tool-与工作区边界", "text": "## Tool 与工作区边界"}, {"title": "Tool 分类", "level": "h3", "anchor": "tool-分类", "text": "### Tool 分类\n\n| 等级 | 边界 |\n| --- | --- |\n| observe | 参数校验后读取已绑定资源 |\n| workspace | 仅在隔离 workspace/output 写临时文件、报告或补丁 |\n| propose | 保存外部变更候选，不提交远端 |\n| apply | 独立 Effect Worker 执行；默认人工批准，仅允许明确低风险预授权 |\n\n当前注册 issue/repository/document 读取、workspace read/search/write、interaction.request、change.propose、subagent.dispatch；Effect Provider 为 issue.update/repository.write。所有能力使用版本 ID 与平台注册 handler，凭据仅由 Provider 经 SecretReference 取得。[Tool 契约](../../PJM/contracts/tools/)不等于任意同名能力已开放。"}, {"title": "文件、Shell 和 Web", "level": "h3", "anchor": "文件shell-和-web", "text": "### 文件、Shell 和 Web\n\n- SDK 内置 Read/Glob/Grep/Bash/Write/Edit/Web 仍 hard deny；平台 capability 提供受控等价功能。\n- input/ 是冻结只读证据；workspace.write 仅写 workspace/、output/，不覆盖 Project 文档库或外部目标，不存在自由 document.write。\n- cwd 不是隔离边界；依赖 mount、路径检查、sandbox、Gateway 与 scope，拒绝 path/symlink 逃逸。\n- 任意 Shell、sandbox command、通用网络尚未开放。后续须有独立威胁模型、允许命令/镜像/资源上限及注册 fetch/search Provider；不暴露 Docker socket、Secret 或无限制网络。"}, {"title": "PreToolUse 判定", "level": "h3", "anchor": "pretooluse-判定", "text": "### PreToolUse 判定\n\n检查由 hook、Gateway、binding/Provider 和 Effect Worker 分担，不是一个 hook 已覆盖全部：\n\n1. 注册 capability，且满足 Skill requirement、Project policy 与 Run 权限快照。\n2. binding、Integration、路径、对象/revision 和网络范围匹配。\n3. 参数通过 Tool contract，拒绝 credential-like 字段。\n4. 执行路径的局部限额满足；Run 累计强制仍待[共享预算](run-budgets.md)接入。\n5. apply 有有效批准或精确预授权。\n\n请求侧检查在 Provider 前执行；响应 Schema、敏感信息与大小检查在返回后执行，失败内容不交给 Agent。错误仅存脱敏审计，禁止全局 bypassPermissions。"}, {"title": "资源快照的物化", "level": "h3", "anchor": "资源快照的物化", "text": "### 资源快照的物化\n\nrepository 按冻结授权物化至 input/\u0026lt;requirement_key\u0026gt;/，具体 revision 在打开资源时解析；document 使用创建时冻结的 ID/hash/成员，映射至 input/documents/。分支名不等于固定 commit，公开清单不是 Provider 的授权输入。\n\n全部资源根通过[输入准备回执](resource-snapshots.md#输入准备与可信缓存)后，Brief 才取得可用逻辑路径；后续 Attempt 只复用同一可信世代，不静默重建。Tool 读取仍校验同一份实际字节。"}, {"title": "持续 Run 与多会话", "level": "h2", "anchor": "持续-run-与多会话", "text": "## 持续 Run 与多会话"}, {"title": "生命周期", "level": "h3", "anchor": "生命周期", "text": "### 生命周期\n\n```text\nRun + Segment 1 + dispatch Outbox\n  → Worker 准备输入 / 冻结 Brief → Session 执行\n  → 持久化 checkpoint 与等待 → 普通答复或效果处理\n  → Segment 2 + dispatch Outbox → 准备新的 Brief\n  → resume / fork / replace → Result 与终态 RUN_SNAPSHOT\n```\n\n等待不是终态；精确状态及 Attempt 的 DEFERRED 见[状态速查](domain-model.md#run-状态速查)。答复事务先保存 Segment/Outbox，Brief 由后续 Worker 冻结，不在回答时提前宣称准备完成。"}, {"title": "Segment、Attempt 与 Session 的区别", "level": "h3", "anchor": "segmentattempt-与-session-的区别", "text": "### Segment、Attempt 与 Session 的区别\n\nSegment 表示新的业务阶段；Attempt 表示同段技术重试；Session 表示模型对话上下文。故障不制造新决策，用户答复不伪装技术重试。三者均不改变 Run 的 Skill、资源与权限上限。"}, {"title": "会话延续策略", "level": "h3", "anchor": "会话延续策略", "text": "### 会话延续策略\n\n| 模式 | 条件 |\n| --- | --- |\n| resume | 引擎/模型兼容、目标未分叉，transcript/workspace 完整 |\n| fork | 明确比较方案或保留分析分支 |\n| replace | 上下文损坏、不兼容或需重压缩；新 Session 接收可审计 checkpoint |\n\n记录 continuation mode、parent、模型与 checkpoint checksum；transcript 用于恢复，平台事件/ToolCall/Evidence/Interaction 才是审计事实。不完整时不无声从头执行。"}, {"title": "从领取到模型启动的边界", "level": "h3", "anchor": "从领取到模型启动的边界", "text": "### 从领取到模型启动的边界\n\n当前 [Executor](../../PJM/backend/src/projectmind/worker/executor.py)按以下顺序执行：\n\n```text\n有效 claim → heartbeat / 取消监督\n  → Run RUNNING → ContextBuilder（独立准备 timeout）\n  → 验证 context 身份/sequence\n  → 短事务冻结 Brief（重验 lease/取消）\n  → 短事务启动校验（再验状态/lease/取消）\n  → 事务外 execute / resume / fork\n```\n\ncontext 匹配 claim 的 Run/Attempt/Project/actor，sequence 由 repository 分配。锁顺序 Run → Segment → Attempt；获锁后使用当前时间和数据库 lease，不使用 claim 或等锁前的旧到期判断。网络、转换和模型调用不在锁内等待。\n\nRUNNING 只说明执行状态推进，READY 只说明输入回执已提交，Brief 冻结只说明该段指导已固定，Session 活动才说明记录了模型活动；任何一项都不代表 Run 已成功。"}, {"title": "取消、超时与失去执行权", "level": "h3", "anchor": "取消超时与失去执行权", "text": "### 取消、超时与失去执行权\n\n取消意图、业务终态、进程退出与用量结清分别处理。已有准备期/首事件前取消、锁内终态复查及等待/普通事件取消检查；等待拒绝和取消终态仍是两个事务，后者重新 fencing。详细阶段、故障与验收见[执行监督](run-supervision.md)。"}, {"title": "用户交互协议", "level": "h2", "anchor": "用户交互协议", "text": "## 用户交互协议\n\n普通答复只在冻结范围内补充事实，成功答复追加 Segment。REVIEW 不等于 Evaluation，推荐不是默认回答，required=false 不自动跳过；410 也可能伴随已提交的过期续行。\n\n普通 interaction.request 只接受 CLARIFICATION/CHOICE/REVIEW；无 Proposal 的历史批准等待保持只读，不经普通答复或过期恢复解锁。原作者重放、期限竞争与页面原请求确认统一见[普通交互](user-interactions.md)，不与外部批准混用。"}, {"title": "外部效果协议", "level": "h2", "anchor": "外部效果协议", "text": "## 外部效果协议\n\nobserve → Evidence → propose → 精确批准/允许的预授权 → 独立 Effect Worker apply → read-back。Agent 不直接写外部系统，也不批准自己的提案。\n\n提案必须冻结目标、patch/操作、Evidence、前置 revision、风险/可逆性、幂等身份和来源 Session。批准者限发起人或 system ADMIN；审批时复验 actor、Project、version/checksum、Integration 与 scope。repository.write 永远人工批准且不 force。\n\n陈旧目标不覆盖，原身份重试，不重复副作用；写入后验证失败需明确核对，不静默成功。Provider 已存在，但精确 CAS、远端身份、阶段回执及独立 Effect 监督仍有缺口，唯一正本见[受控写入](repository-effects.md)。"}, {"title": "结果与输出验证", "level": "h2", "anchor": "结果与输出验证", "text": "## 结果与输出验证\n\n候选先经平台 validator，再交终态事务锁后检查 lease/取消；失败和取消可以没有 Result。结构通过不证明业务正确、附件可读或模型效果摘要已核验。Outcome、引用与人工修订统一见[结果与评价](results-evaluation.md)；子任务有独立的[输出派生责任](subagents.md#子任务指令与结果的边界)。"}, {"title": "事件、状态与可靠性", "level": "h2", "anchor": "事件状态与可靠性", "text": "## 事件、状态与可靠性\n\n- [RunEvent 契约](../../PJM/contracts/events/run-event/v1.schema.json)覆盖 Segment、Session、Interaction、checkpoint 与 Effect；Run 内 sequence 严格递增。\n- 状态变更与 Outbox 同事务。Queue 重投由数据库领取抑制，Tool 重放与 Effect 幂等各用自身协议，不承诺模型/远端全局精确一次。\n- 只有有效 lease 可提交；失效由 Recovery 接管，同段重试受 PROJECTMIND_RUN_MAX_ATTEMPTS 限制。\n- 终态 RUN_SNAPSHOT 是最后持久事件，SSE 据此结束。终态不可恢复，新目标创建新 Run。\n- 模型 wall timeout 不含准备、排队、人工等待或全部 Attempt 累计；各计时器见[预算说明](run-budgets.md#现有计时器的覆盖范围)。\n\n停写须覆盖所有 job/cron/实例，dispatch 开关不等于全局停止；见[发布边界](../operations/deployment.md)。"}, {"title": "Claude Agent SDK 实现要求", "level": "h2", "anchor": "claude-agent-sdk-实现要求", "text": "## Claude Agent SDK 实现要求\n\n锁定 SDK/CLI 版本并记录模型/options checksum，SessionStore 镜像 transcript。Hook 执行平台策略，SDK allowed tools 与 structured output 不替代参数和结果校验。人工等待须收束收费进程，不长期占 Worker。\n\n升级或新增引擎先验消息映射、resume/fork/interrupt、旧 Session 恢复、Tool 拒绝/MCP、等待与错误分类；使用同一 conformance suite。"}, {"title": "安全测试矩阵", "level": "h2", "anchor": "安全测试矩阵", "text": "## 安全测试矩阵\n\n验收覆盖：指导完整且不可扩权；缺资源拒绝创建；答复新增 Segment、故障只新增 Attempt；顺序 Session 不漂移；未批准/stale/scope 外效果拒绝；路径逃逸拒绝；同 Run 引用与 Secret 边界；终态不可续行。\n\n监督专项还需慢准备、锁等待过期、Brief/首事件前取消、提交不明与真实进程清理；分别观察 Run/Session/Result/Outbox，而非只测异常映射。"}, {"title": "当前实现边界", "level": "h2", "anchor": "当前实现边界", "text": "## 当前实现边界\n\n已有 Brief、持续 Run、顺序主会话、只读子分析、workspace 与受控效果入口，以及输入回执和准备监督接线。剩余是完整资源/历史续行、真实事务和停止证明；共享预算只有内部账本，未接创建及主子执行。精确接续范围见[计划](../planning/roadmap.md)，不重复维护测试数字。"}], "toc": [{"title": "设计结论", "anchor": "设计结论", "level": "h2"}, {"title": "责任边界", "anchor": "责任边界", "level": "h2"}, {"title": "AgentEngine 抽象", "anchor": "agentengine-抽象", "level": "h2"}, {"title": "AgentTaskBrief", "anchor": "agenttaskbrief", "level": "h2"}, {"title": "自主执行等级", "anchor": "自主执行等级", "level": "h2"}, {"title": "Tool 与工作
