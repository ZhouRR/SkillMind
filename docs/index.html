un 创建\u003c/a>，输入一致性见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>，状态与剩余工作见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划\u003c/a>。\u003c/p>\n\u003ch2 id=\"设计结论\">设计结论\u003c/h2>\n\u003cp>Run 是持续业务线程，不是一次 SDK query、Session 或进程。默认引擎为 Claude Agent SDK，业务层只依赖 AgentEngine；平台控制资源、权限、交互、效果与终态，PostgreSQL 保存审计正本。\u003c/p>\n\u003ch2 id=\"责任边界\">责任边界\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>责任方\u003c/th>\n\u003cth>负责什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Skillmind\u003c/td>\n\u003ctd>从发布版本的 Blueprint 生成任务/Brief，冻结资源与权限；管理 lease、恢复、预算、交互、效果、证据、结果与事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AgentEngine\u003c/td>\n\u003ctd>在 Brief 内规划、选择允许的 Tool、维持会话，产生公开文本、用量、交互和结果候选\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent 无权决定\u003c/td>\n\u003ctd>扩大 Project/scope、取得 Secret、增加 Tool、自批提案、绕过限额/校验或直接调用未注册 Provider\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Skill、Ticket、代码或模型建议都是输入，不是授权。业务规则不放进 route、queue job 或 SDK adapter。\u003c/p>\n\u003ch2 id=\"agentengine-抽象\">AgentEngine 抽象\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/agent/domain.py\">AgentEngine\u003c/a>提供 execute / resume / fork / interrupt / health；前三者返回异步事件迭代器，Adapter 将 SDK message 映射为 AgentEvent，不泄漏 SDK 类型。\u003c/p>\n\u003cp>每 Run 只允许一个活动 PRIMARY；SUBAGENT/BRANCH 共用父 RunAttempt，汇总到主 Session 的 ToolCall/Evidence，不另分 RunEvent sequence。详见\u003ca href=\"#docs/design/subagents.md::\">子分析\u003c/a>。\u003c/p>\n\u003ch2 id=\"agenttaskbrief\">AgentTaskBrief\u003c/h2>\n\u003cp>每个 Segment 启动前冻结一份 \u003ca href=\"../SKM/contracts/agent-task-brief/v1.schema.json\">AgentTaskBrief\u003c/a>：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>必须说明什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>身份与目标\u003c/td>\n\u003ctd>Run、Segment、Task、精确 SkillVersion/checksum，目标和成功条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>指导与资源\u003c/td>\n\u003ctd>Skill 必需规则、建议步骤、质量要求与禁止事项；合法 binding、来源与路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>策略\u003c/td>\n\u003ctd>capability/参数/scope、限额、交互和效果批准边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输出与续行\u003c/td>\n\u003ctd>交付要求、可选 Schema、checkpoint、已确认事实及 Evidence/Proposal 引用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Brief 保留必需指导，不含凭据、内部配置或跨 Project 数据。Checkpoint 可压缩上下文，但须保留原 transcript/source trace，不改用户事实或批准范围。\u003c/p>\n\u003ch2 id=\"自主执行等级\">自主执行等级\u003c/h2>\n\u003cp>ExecutionProfile 合成策略，不表示各选项已有 Web 控件。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Profile\u003c/th>\n\u003cth>范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>GUIDED\u003c/td>\n\u003ctd>优先显式步骤，关键歧义询问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUPERVISED\u003c/td>\n\u003ctd>默认；自主选择读取、验证和报告方式，业务取舍或外部效果前询问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DELEGATED\u003c/td>\n\u003ctd>在明确预授权的资源/低风险效果内扩大自主循环，仍受硬拒绝限制\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Skill 可推荐等级，system ADMIN 设置项目上限，发起人只能收窄；不存在 Project ADMIN。Agent 可调整分析顺序、交叉验证和生成产物；关键事实、业务选择或批准缺失、规则冲突时暂停。\u003c/p>\n\u003cp>原 scope 内补对象 ID/偏好可续行；改 Project、增加 Integration/文档/权限/预算须新建 Run。必需资源缺失拒绝创建，可选未选不在对话中隐式启用。\u003c/p>\n\u003ch2 id=\"tool-与工作区边界\">Tool 与工作区边界\u003c/h2>\n\u003ch3 id=\"tool-分类\">Tool 分类\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>等级\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>observe\u003c/td>\n\u003ctd>参数校验后读取已绑定资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>workspace\u003c/td>\n\u003ctd>仅在隔离 workspace/output 写临时文件、报告或补丁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>propose\u003c/td>\n\u003ctd>保存外部变更候选，不提交远端\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>apply\u003c/td>\n\u003ctd>独立 Effect Worker 执行；默认人工批准，仅允许明确低风险预授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>能力必须匹配版本 ID 与注册 handler，凭据仅由 Provider 经 SecretReference 取得。读取、workspace、交互、提案、子分析与 Effect 的可用范围以 registry 和 \u003ca href=\"../SKM/contracts/tools\">Tool 契约\u003c/a>共同判定，不按同名放行。\u003c/p>\n\u003ch3 id=\"文件shell-和-web\">文件、Shell 和 Web\u003c/h3>\n\u003cul>\n\u003cli>SDK 内置 Read/Glob/Grep/Bash/Write/Edit/Web hard deny，受控能力由平台提供。\u003c/li>\n\u003cli>input/ 冻结只读；workspace.write 只写 workspace/、output/，不覆盖文档库或外部目标。\u003c/li>\n\u003cli>cwd 不是隔离；mount、路径、sandbox、Gateway/scope 共同拒绝 path/symlink 逃逸。\u003c/li>\n\u003cli>Shell、sandbox command、通用网络未开放；须先定义威胁模型、允许命令/镜像/限额及注册网络 Provider，禁止暴露 Docker socket、Secret 和无限制网络。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"pretooluse-判定\">PreToolUse 判定\u003c/h3>\n\u003cp>hook、Gateway、binding/Provider 和 Effect Worker 分担检查：注册 capability 与 Skill/Project/Run 权限、binding/scope/revision、参数与敏感字段、局部限额、apply 的批准。Run 累计限额仍待\u003ca href=\"#docs/design/run-budgets.md::\">共享预算\u003c/a>。\u003c/p>\n\u003cp>Provider 前校验请求，返回后校验 Schema/敏感信息/大小；失败内容不交 Agent，只留脱敏审计，禁止 bypassPermissions。另按\u003ca href=\"#docs/design/run-supervision.md::tool-%E8%B0%83%E7%94%A8%E7%9A%84%E6%8F%90%E4%BA%A4%E4%B8%8E%E9%87%8D%E6%94%BE\">调用提交与重放\u003c/a>验证原 Worker 权限：首次许可一次消费，未决/失败不重跑，成功只读重放。\u003c/p>\n\u003ch3 id=\"资源快照的物化\">资源快照的物化\u003c/h3>\n\u003cp>repository 按冻结授权物化至 input/\u0026lt;requirement_key\u0026gt;/，打开时解析 revision；document 按创建清单映射至 input/documents/。全部根取得\u003ca href=\"#docs/design/resource-snapshots.md::%E8%BE%93%E5%85%A5%E5%87%86%E5%A4%87%E4%B8%8E%E5%8F%AF%E4%BF%A1%E7%BC%93%E5%AD%98\">可信准备回执\u003c/a>后才交 Brief；后续只复用原世代，Tool 校验实际读取字节。分支名、公开清单都不能替代固定内容或授权。\u003c/p>\n\u003ch2 id=\"持续-run-与多会话\">持续 Run 与多会话\u003c/h2>\n\u003ch3 id=\"生命周期\">生命周期\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">Run + Segment 1 + dispatch Outbox\n  → Worker 准备输入 / 冻结 Brief → Session 执行\n  → 持久化 checkpoint 与等待 → 普通答复或效果处理\n  → Segment 2 + dispatch Outbox → 准备新的 Brief\n  → resume / fork / replace → Result 与终态 RUN_SNAPSHOT\n\u003c/code>\u003c/pre>\n\u003cp>等待非终态，状态及 DEFERRED 见\u003ca href=\"#docs/design/domain-model.md::run-%E7%8A%B6%E6%80%81%E9%80%9F%E6%9F%A5\">速查\u003c/a>。答复先存 Segment/Outbox，后续 Worker 才准备并冻结 Brief。\u003c/p>\n\u003ch3 id=\"segmentattempt-与-session-的区别\">Segment、Attempt 与 Session 的区别\u003c/h3>\n\u003cp>Segment 是新业务阶段，Attempt 是同段技术重试，Session 是模型上下文。故障不制造新决策，答复不算技术重试；均不得改变 Run 的 Skill、资源与权限上限。\u003c/p>\n\u003ch3 id=\"会话延续策略\">会话延续策略\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>resume\u003c/td>\n\u003ctd>引擎/模型兼容、目标未分叉，transcript/workspace 完整\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fork\u003c/td>\n\u003ctd>明确比较方案或保留分析分支\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>replace\u003c/td>\n\u003ctd>上下文损坏、不兼容或需重压缩；新 Session 接收可审计 checkpoint\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>保存 mode、parent、模型、checkpoint checksum；transcript 用于恢复，平台事件/ToolCall/Evidence/Interaction 用于审计。资料不完整时不得静默重跑。\u003c/p>\n\u003ch3 id=\"从领取到模型启动的边界\">从领取到模型启动的边界\u003c/h3>\n\u003cp>当前 \u003ca href=\"../SKM/backend/src/skillmind/worker/executor.py\">Executor\u003c/a>按以下顺序执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">有效 claim → heartbeat / 取消监督\n  → Run RUNNING → ContextBuilder（独立准备 timeout）\n  → 验证 context 身份/sequence\n  → 短事务冻结 Brief（重验 lease/取消）\n  → 短事务启动校验（再验状态/lease/取消）\n  → 事务外 execute / resume / fork\n\u003c/code>\u003c/pre>\n\u003cp>context 必须匹配 claim 的 Run/Attempt/Project/actor，sequence 由 repository 分配。按 Run → Segment → Attempt 取锁后，用当前时间和 DB lease 判定；网络、转换、模型调用在锁外。\u003c/p>\n\u003cp>RUNNING、输入 READY、Brief 冻结与 Session 活动分别证明状态推进、输入提交、指导固定和模型活动，均不证明成功。\u003c/p>\n\u003ch3 id=\"取消超时与失去执行权\">取消、超时与失去执行权\u003c/h3>\n\u003cp>取消意图、业务终态、进程退出与用量结清分别处理。等待拒绝和取消终态是两个事务，后者重新 fencing；阶段与恢复规则见\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a>。\u003c/p>\n\u003ch2 id=\"用户交互协议\">用户交互协议\u003c/h2>\n\u003cp>interaction.request 只接受 CLARIFICATION/CHOICE/REVIEW，答复在冻结范围内追加 Segment，不代替 Evaluation 或效果批准。期限、推荐、原作者确认及历史悬空批准统一按\u003ca href=\"#docs/design/user-interactions.md::\">普通交互\u003c/a>处理。\u003c/p>\n\u003ch2 id=\"外部效果协议\">外部效果协议\u003c/h2>\n\u003cp>observe → Evidence → propose → 精确批准/允许的预授权 → 独立 Effect Worker apply → read-back。Agent 不自批或直接写；repository.write 始终人工批准、不 force。冻结、审批身份、陈旧目标和部分成功恢复统一见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>，其可靠性缺口不由 Runtime lease 覆盖。\u003c/p>\n\u003ch2 id=\"结果与输出验证\">结果与输出验证\u003c/h2>\n\u003cp>候选经 validator 后，终态事务再验 lease/取消；失败、取消可无 Result。结构、引用、业务正确性分别判断，见\u003ca href=\"#docs/design/results-evaluation.md::\">结果与评价\u003c/a>及\u003ca href=\"#docs/design/subagents.md::%E5%AD%90%E4%BB%BB%E5%8A%A1%E6%8C%87%E4%BB%A4%E4%B8%8E%E7%BB%93%E6%9E%9C%E7%9A%84%E8%BE%B9%E7%95%8C\">子输出责任\u003c/a>。\u003c/p>\n\u003ch2 id=\"事件状态与可靠性\">事件、状态与可靠性\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../SKM/contracts/events/run-event/v1.schema.json\">RunEvent 契约\u003c/a>覆盖 Segment、Session、Interaction、checkpoint 与 Effect；Run 内 sequence 严格递增。\u003c/li>\n\u003cli>状态变更与 Outbox 同事务。Queue 重投由数据库领取抑制，Tool 重放与 Effect 幂等各用自身协议，不承诺模型/远端全局精确一次。\u003c/li>\n\u003cli>只有有效 lease 可提交；失效由 Recovery 接管，同段重试受 SKILLMIND_RUN_MAX_ATTEMPTS 限制。\u003c/li>\n\u003cli>终态 RUN_SNAPSHOT 是最后持久事件，SSE 据此结束。终态不可恢复，新目标创建新 Run。\u003c/li>\n\u003cli>模型 wall timeout 不含准备、排队、人工等待或全部 Attempt 累计；各计时器见\u003ca href=\"#docs/design/run-budgets.md::%E7%8E%B0%E6%9C%89%E8%AE%A1%E6%97%B6%E5%99%A8%E7%9A%84%E8%A6%86%E7%9B%96%E8%8C%83%E5%9B%B4\">预算说明\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003cp>停写须覆盖所有 job/cron/实例，dispatch 开关不等于全局停止；见\u003ca href=\"#docs/operations/deployment.md::\">发布边界\u003c/a>。\u003c/p>\n\u003ch2 id=\"claude-agent-sdk-实现要求\">Claude Agent SDK 实现要求\u003c/h2>\n\u003cp>锁定 SDK/CLI 版本并记录模型/options checksum，SessionStore 镜像 transcript。Hook 执行平台策略，SDK allowed tools 与 structured output 不替代参数和结果校验。人工等待须收束收费进程，不长期占 Worker。\u003c/p>\n\u003cp>升级或新增引擎先验消息映射、resume/fork/interrupt、旧 Session 恢复、Tool 拒绝/MCP、等待与错误分类；使用同一 conformance suite。\u003c/p>\n\u003ch2 id=\"安全测试矩阵\">安全测试矩阵\u003c/h2>\n\u003cp>覆盖指导/权限不漂移、缺资源拒绝、Segment/Attempt 分路、Session 续行、Tool/效果/路径与同 Run 引用边界、终态不可续行。监督按阶段观察 Run/Session/Result/Outbox；专项条件见各规则正本。\u003c/p>\n\u003ch2 id=\"当前实现边界\">当前实现边界\u003c/h2>\n\u003cp>执行入口已有接线，但完整资源/历史续行、持久停止证明与共享预算尚未闭合；逐项状态和验收登记在\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>。\u003c/p>\n", "sections": [{"title": "Agent Runtime 与持续执行", "level": "h1", "anchor": "agent-runtime-与持续执行", "text": "# Agent Runtime 与持续执行\n\n本页负责已有 Run 的执行、会话与事件协议。创建身份见[Run 创建](run-creation.md)，输入一致性见[资源快照](resource-snapshots.md)，状态与剩余工作见[计划](../planning/roadmap.md#r07-run-与审计)。"}, {"title": "设计结论", "level": "h2", "anchor": "设计结论", "text": "## 设计结论\n\nRun 是持续业务线程，不是一次 SDK query、Session 或进程。默认引擎为 Claude Agent SDK，业务层只依赖 AgentEngine；平台控制资源、权限、交互、效果与终态，PostgreSQL 保存审计正本。"}, {"title": "责任边界", "level": "h2", "anchor": "责任边界", "text": "## 责任边界\n\n| 责任方 | 负责什么 |\n| --- | --- |\n| Skillmind | 从发布版本的 Blueprint 生成任务/Brief，冻结资源与权限；管理 lease、恢复、预算、交互、效果、证据、结果与事件 |\n| AgentEngine | 在 Brief 内规划、选择允许的 Tool、维持会话，产生公开文本、用量、交互和结果候选 |\n| Agent 无权决定 | 扩大 Project/scope、取得 Secret、增加 Tool、自批提案、绕过限额/校验或直接调用未注册 Provider |\n\nSkill、Ticket、代码或模型建议都是输入，不是授权。业务规则不放进 route、queue job 或 SDK adapter。"}, {"title": "AgentEngine 抽象", "level": "h2", "anchor": "agentengine-抽象", "text": "## AgentEngine 抽象\n\n[AgentEngine](../../SKM/backend/src/skillmind/agent/domain.py)提供 execute / resume / fork / interrupt / health；前三者返回异步事件迭代器，Adapter 将 SDK message 映射为 AgentEvent，不泄漏 SDK 类型。\n\n每 Run 只允许一个活动 PRIMARY；SUBAGENT/BRANCH 共用父 RunAttempt，汇总到主 Session 的 ToolCall/Evidence，不另分 RunEvent sequence。详见[子分析](subagents.md)。"}, {"title": "AgentTaskBrief", "level": "h2", "anchor": "agenttaskbrief", "text": "## AgentTaskBrief\n\n每个 Segment 启动前冻结一份 [AgentTaskBrief](../../SKM/contracts/agent-task-brief/v1.schema.json)：\n\n| 内容 | 必须说明什么 |\n| --- | --- |\n| 身份与目标 | Run、Segment、Task、精确 SkillVersion/checksum，目标和成功条件 |\n| 指导与资源 | Skill 必需规则、建议步骤、质量要求与禁止事项；合法 binding、来源与路径 |\n| 策略 | capability/参数/scope、限额、交互和效果批准边界 |\n| 输出与续行 | 交付要求、可选 Schema、checkpoint、已确认事实及 Evidence/Proposal 引用 |\n\nBrief 保留必需指导，不含凭据、内部配置或跨 Project 数据。Checkpoint 可压缩上下文，但须保留原 transcript/source trace，不改用户事实或批准范围。"}, {"title": "自主执行等级", "level": "h2", "anchor": "自主执行等级", "text": "## 自主执行等级\n\nExecutionProfile 合成策略，不表示各选项已有 Web 控件。\n\n| Profile | 范围 |\n| --- | --- |\n| GUIDED | 优先显式步骤，关键歧义询问 |\n| SUPERVISED | 默认；自主选择读取、验证和报告方式，业务取舍或外部效果前询问 |\n| DELEGATED | 在明确预授权的资源/低风险效果内扩大自主循环，仍受硬拒绝限制 |\n\nSkill 可推荐等级，system ADMIN 设置项目上限，发起人只能收窄；不存在 Project ADMIN。Agent 可调整分析顺序、交叉验证和生成产物；关键事实、业务选择或批准缺失、规则冲突时暂停。\n\n原 scope 内补对象 ID/偏好可续行；改 Project、增加 Integration/文档/权限/预算须新建 Run。必需资源缺失拒绝创建，可选未选不在对话中隐式启用。"}, {"title": "Tool 与工作区边界", "level": "h2", "anchor": "tool-与工作区边界", "text": "## Tool 与工作区边界"}, {"title": "Tool 分类", "level": "h3", "anchor": "tool-分类", "text": "### Tool 分类\n\n| 等级 | 边界 |\n| --- | --- |\n| observe | 参数校验后读取已绑定资源 |\n| workspace | 仅在隔离 workspace/output 写临时文件、报告或补丁 |\n| propose | 保存外部变更候选，不提交远端 |\n| apply | 独立 Effect Worker 执行；默认人工批准，仅允许明确低风险预授权 |\n\n能力必须匹配版本 ID 与注册 handler，凭据仅由 Provider 经 SecretReference 取得。读取、workspace、交互、提案、子分析与 Effect 的可用范围以 registry 和 [Tool 契约](../../SKM/contracts/tools/)共同判定，不按同名放行。"}, {"title": "文件、Shell 和 Web", "level": "h3", "anchor": "文件shell-和-web", "text": "### 文件、Shell 和 Web\n\n- SDK 内置 Read/Glob/Grep/Bash/Write/Edit/Web hard deny，受控能力由平台提供。\n- input/ 冻结只读；workspace.write 只写 workspace/、output/，不覆盖文档库或外部目标。\n- cwd 不是隔离；mount、路径、sandbox、Gateway/scope 共同拒绝 path/symlink 逃逸。\n- Shell、sandbox command、通用网络未开放；须先定义威胁模型、允许命令/镜像/限额及注册网络 Provider，禁止暴露 Docker socket、Secret 和无限制网络。"}, {"title": "PreToolUse 判定", "level": "h3", "anchor": "pretooluse-判定", "text": "### PreToolUse 判定\n\nhook、Gateway、binding/Provider 和 Effect Worker 分担检查：注册 capability 与 Skill/Project/Run 权限、binding/scope/revision、参数与敏感字段、局部限额、apply 的批准。Run 累计限额仍待[共享预算](run-budgets.md)。\n\nProvider 前校验请求，返回后校验 Schema/敏感信息/大小；失败内容不交 Agent，只留脱敏审计，禁止 bypassPermissions。另按[调用提交与重放](run-supervision.md#tool-调用的提交与重放)验证原 Worker 权限：首次许可一次消费，未决/失败不重跑，成功只读重放。"}, {"title": "资源快照的物化", "level": "h3", "anchor": "资源快照的物化", "text": "### 资源快照的物化\n\nrepository 按冻结授权物化至 input/\u0026lt;requirement_key\u0026gt;/，打开时解析 revision；document 按创建清单映射至 input/documents/。全部根取得[可信准备回执](resource-snapshots.md#输入准备与可信缓存)后才交 Brief；后续只复用原世代，Tool 校验实际读取字节。分支名、公开清单都不能替代固定内容或授权。"}, {"title": "持续 Run 与多会话", "level": "h2", "anchor": "持续-run-与多会话", "text": "## 持续 Run 与多会话"}, {"title": "生命周期", "level": "h3", "anchor": "生命周期", "text": "### 生命周期\n\n```text\nRun + Segment 1 + dispatch Outbox\n  → Worker 准备输入 / 冻结 Brief → Session 执行\n  → 持久化 checkpoint 与等待 → 普通答复或效果处理\n  → Segment 2 + dispatch Outbox → 准备新的 Brief\n  → resume / fork / replace → Result 与终态 RUN_SNAPSHOT\n```\n\n等待非终态，状态及 DEFERRED 见[速查](domain-model.md#run-状态速查)。答复先存 Segment/Outbox，后续 Worker 才准备并冻结 Brief。"}, {"title": "Segment、Attempt 与 Session 的区别", "level": "h3", "anchor": "segmentattempt-与-session-的区别", "text": "### Segment、Attempt 与 Session 的区别\n\nSegment 是新业务阶段，Attempt 是同段技术重试，Session 是模型上下文。故障不制造新决策，答复不算技术重试；均不得改变 Run 的 Skill、资源与权限上限。"}, {"title": "会话延续策略", "level": "h3", "anchor": "会话延续策略", "text": "### 会话延续策略\n\n| 模式 | 条件 |\n| --- | --- |\n| resume | 引擎/模型兼容、目标未分叉，transcript/workspace 完整 |\n| fork | 明确比较方案或保留分析分支 |\n| replace | 上下文损坏、不兼容或需重压缩；新 Session 接收可审计 checkpoint |\n\n保存 mode、parent、模型、checkpoint checksum；transcript 用于恢复，平台事件/ToolCall/Evidence/Interaction 用于审计。资料不完整时不得静默重跑。"}, {"title": "从领取到模型启动的边界", "level": "h3", "anchor": "从领取到模型启动的边界", "text": "### 从领取到模型启动的边界\n\n当前 [Executor](../../SKM/backend/src/skillmind/worker/executor.py)按以下顺序执行：\n\n```text\n有效 claim → heartbeat / 取消监督\n  → Run RUNNING → ContextBuilder（独立准备 timeout）\n  → 验证 context 身份/sequence\n  → 短事务冻结 Brief（重验 lease/取消）\n  → 短事务启动校验（再验状态/lease/取消）\n  → 事务外 execute / resume / fork\n```\n\ncontext 必须匹配 claim 的 Run/Attempt/Project/actor，sequence 由 repository 分配。按 Run → Segment → Attempt 取锁后，用当前时间和 DB lease 判定；网络、转换、模型调用在锁外。\n\nRUNNING、输入 READY、Brief 冻结与 Session 活动分别证明状态推进、输入提交、指导固定和模型活动，均不证明成功。"}, {"title": "取消、超时与失去执行权", "level": "h3", "anchor": "取消超时与失去执行权", "text": "### 取消、超时与失去执行权\n\n取消意图、业务终态、进程退出与用量结清分别处理。等待拒绝和取消终态是两个事务，后者重新 fencing；阶段与恢复规则见[执行监督](run-supervision.md)。"}, {"title": "用户交互协议", "level": "h2", "anchor": "用户交互协议", "text": "## 用户交互协议\n\ninteraction.request 只接受 CLARIFICATION/CHOICE/REVIEW，答复在冻结范围内追加 Segment，不代替 Evaluation 或效果批准。期限、推荐、原作者确认及历史悬空批准统一按[普通交互](user-interactions.md)处理。"}, {"title": "外部效果协议", "level": "h2", "anchor": "外部效果协议", "text": "## 外部效果协议\n\nobserve → Evidence → propose → 精确批准/允许的预授权 → 独立 Effect Worker apply → read-back。Agent 不自批或直接写；repository.write 始终人工批准、不 force。冻结、审批身份、陈旧目标和部分成功恢复统一见[受控写入](repository-effects.md)，其可靠性缺口不由 Runtime lease 覆盖。"}, {"title": "结果与输出验证", "level": "h2", "anchor": "结果与输出验证", "text": "## 结果与输出验证\n\n候选经 validator 后，终态事务再验 lease/取消；失败、取消可无 Result。结构、引用、业务正确性分别判断，见[结果与评价](results-evaluation.md)及[子输出责任](subagents.md#子任务指令与结果的边界)。"}, {"title": "事件、状态与可靠性", "level": "h2", "anchor": "事件状态与可靠性", "text": "## 事件、状态与可靠性\n\n- [RunEvent 契约](../../SKM/contracts/events/run-event/v1.schema.json)覆盖 Segment、Session、Interaction、checkpoint 与 Effect；Run 内 sequence 严格递增。\n- 状态变更与 Outbox 同事务。Queue 重投由数据库领取抑制，Tool 重放与 Effect 幂等各用自身协议，不承诺模型/远端全局精确一次。\n- 只有有效 lease 可提交；失效由 Recovery 接管，同段重试受 SKILLMIND_RUN_MAX_ATTEMPTS 限制。\n- 终态 RUN_SNAPSHOT 是最后持久事件，SSE 据此结束。终态不可恢复，新目标创建新 Run。\n- 模型 wall timeout 不含准备、排队、人工等待或全部 Attempt 累计；各计时器见[预算说明](run-budgets.md#现有计时器的覆盖范围)。\n\n停写须覆盖所有 job/cron/实例，dispatch 开关不等于全局停止；见[发布边界](../operations/deployment.md)。"}, {"title": "Claude Agent SDK 实现要求", "level": "h2", "anchor": "claude-agent-sdk-实现要求", "text": "## Claude Agent SDK 实现要求\n\n锁定 SDK/CLI 版本并记录模型/options checksum，SessionStore 镜像 transcript。Hook 执行平台策略，SDK allowed tools 与 structured output 不替代参数和结果校验。人工等待须收束收费进程，不长期占 Worker。\n\n升级或新增引擎先验消息映射、resume/fork/interrupt、旧 Session 恢复、Tool 拒绝/MCP、等待与错误分类；使用同一 conformance suite。"}, {"title": "安全测试矩阵", "level": "h2", "anchor": "安全测试矩阵", "text": "## 安全测试矩阵\n\n覆盖指导/权限不漂移、缺资源拒绝、Segment/Attempt 分路、Session 续行、Tool/效果/路径与同 Run 引用边界、终态不可续行。监督按阶段观察 Run/Session/Result/Outbox；专项条件见各规则正本。"}, {"title": "当前实现边界", "level": "h2", "anchor": "当前实现边界", "text": "## 当前实现边界\n\n执行入口已有接线，但完整资源/历史续行、持久停止证明与共享预算尚未闭合；逐项状态和验收登记在[计划](../planning/roadmap.md)。"}], "toc": [{"title": "设计结论", "anchor": "设计结论", "level": "h2"}, {"title": "责任边界", "anchor": "责任边界", "level": "h2"}, {"title": "AgentEngine 抽象", "anchor": "agentengine-抽象", "level": "h2"}, {"title": "AgentTaskBrief", "anchor": "agenttaskbrief", "level": "h2"}, {"title": "自主执行等级", "anchor": "自主执行等级", "level": "h2"}, {"title": "Tool 与工作区边界", "anchor": "tool-与工作区边界", "level": "h2"}, {"title": "Tool 分类", "anchor": "tool-分类", "level": "h3"}, {"title": "文件、Shell 和 Web", "anchor": "文件shell-和-web", "level": "h3"}, {"title": "PreToolUse 判定", "anchor": "pretooluse-判定", "level": "h3"}, {"title": "资源快照的物化", "anchor": "资源快照的物化", "level": "h3"}, {"title": "持续 Run 与多会话", "anchor": "持续-run-与多会话", "level": "h2"}, {"title": "生命周期", "anchor": "生命周期", "level": "h3"}, {"title": "Segment、Attempt 与 Session 的区别", "anchor": "segmentattempt-与-session-的区别", "level": "h3"}, {"title": "会话延续策略", "anchor": "会话延续策略", "level": "h3"}, {"title": "从领取到模型启动的边界", "anchor": "从领取到模型启动的边界", "level": "h3"}, {"title": "取消、超时与失去执行权", "anchor": "取消超时与失去执行权", "level": "h3"}, {"title": "用户交互协议", "anchor": "用户交互协议", "level": "h2"}, {"title": "外部效果协议", "anchor": "外部效果协议", "level": "h2"}, {"title": "结果与输出验证", "anchor": "结果与输出验证", "level": "h2"}, {"title": "事件、状态与可靠性", "anchor": "事件状态与可靠性", "level": "h2"}, {"title": "Claude Agent SDK 实现要求", "anchor": "claude-agent-sdk-实现要求", "level": "h2"}, {"title": "安全测试矩阵", "anchor": "安全测试矩阵", "level": "h2"}, {"title": "当前实现边界", "anchor": "当前实现边界", "level": "h2"}], "source": "design/agent-runtime.md", "checksum": "2e5162535531c3d99d840be04c3adaf4769efbce1235caa4595e9c12c047ea88"}, {"id": "docs/design/user-interactions.md", "title": "用户答复、等待与续行", "group": "design", "html": "\u003ch1 id=\"用户答复等待与续行\">用户答复、等待与续行\u003c/h1>\n\u003cp>本页定义普通交互的提出、答复、过期和原请求确认。外部批准见\u003ca href=\"#docs/design/repository-effects.md::\">受控效果\u003c/a>，结果评价见\u003ca href=\"#docs/design/results-evaluation.md::\">结果设计\u003c/a>；实施状态见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划 R07\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清三种人工参与\">先分清三种人工参与\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>改变什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>普通答复\u003c/td>\n\u003ctd>CLARIFICATION/CHOICE/REVIEW 追加 Response 与新 Segment，不改目标/资源/权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部批准\u003c/td>\n\u003ctd>独立 decision API 决定精确 Proposal version/checksum，APPROVED 不等于已写入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evaluation\u003c/td>\n\u003ctd>对保存的 Result 追加判断，不改原值、不恢复终态\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>REVIEW 不等于 Evaluation。普通答复需当前 ProjectWriteActor，批准另外限发起人或 system ADMIN。\u003c/p>\n\u003ch2 id=\"一个例子回答超时不等于什么都没发生\">一个例子：回答超时不等于什么都没发生\u003c/h2>\n\u003cp>推荐 A、可选 B，提交 B 后丢响应：可能原答案/续行已提交，也可能服务端先提交过期续行再返回 410；另一成员抢先回答则 409，保留对方决定。\u003c/p>\n\u003cp>推荐非默认答案，required=false 不自动跳过/允许空答；当前无 skip。超时只记未答，不伪造选择。\u003c/p>\n\u003ch2 id=\"提问与答复的实际形状\">提问与答复的实际形状\u003c/h2>\n\u003cp>精确字段见\u003ca href=\"../SKM/contracts/tools/interaction.request/v1/request.schema.json\">提问 Tool\u003c/a>和\u003ca href=\"../SKM/contracts/runs/interaction-response/v1/request.schema.json\">答复契约\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>prompt/rationale/impact\u003c/td>\n\u003ctd>公开说明，不含 hidden reasoning、系统 prompt 或 Secret\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>options\u003c/td>\n\u003ctd>必须存在，可空；新问题的 key 唯一，CHOICE 至少两项；按 allow_multiple 限制，recommended 仅提示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回答\u003c/td>\n\u003ctd>CLARIFICATION/REVIEW 非空 text；CHOICE 选已知 key，可附 text，不经文本换绑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>required/期限\u003c/td>\n\u003ctd>所有普通交互暂停；过期可无信息续行。expires_at 从事件 occurred_at 解析，不按打开页面重算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>checkpoint/continuation\u003c/td>\n\u003ctd>冻结问题依据，回答追加到新段，Session 续行另守 Runtime 兼容\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>每 Run 最多一个 OPEN；保存时验 checkpoint 引用归属，期限以服务端为准。旧重复选项 key 保持只读，不收新答案；已有答复可按原身份确认，不改历史 payload/hash。\u003c/p>\n\u003ch3 id=\"普通提问不能代替外部批准\">普通提问不能代替外部批准\u003c/h3>\n\u003cp>Tool Schema/parser/持久化入口均只接受 CLARIFICATION/CHOICE/REVIEW，进入 WAITING_FOR_INPUT。效果必须 change.propose → 关联批准 → decision/Effect。\u003c/p>\n\u003cp>合法 Proposal 和旧 detail/event enum 保持可读；无 Proposal 的旧 EFFECT_APPROVAL 只读，普通答复/过期都不解锁，不补造批准或改历史。\u003c/p>\n\u003ch2 id=\"三个提交边界\">三个提交边界\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">提问事务：问题/checkpoint/事件 + Segment WAITING\n          Attempt DEFERRED / 主 Session IDLE / 释放 lease\n  ↓\n答复或过期事务：关闭旧交互/Segment\n               新 Segment + 事件/Outbox，Run QUEUED\n  ↓\n新 Attempt：准备输入 / 冻结 Brief / 启动校验 → Session\n\u003c/code>\u003c/pre>\n\u003cp>提问按 Run → Segment → Attempt 取锁，验 lease/RUNNING/取消；不持锁等 I/O。等待提交/释放 lease 不证明退出或结清，另走\u003ca href=\"#docs/design/run-supervision.md::%E7%AD%89%E5%BE%85%E6%8F%90%E4%BA%A4%E4%BB%8D%E6%98%AF%E7%8B%AC%E7%AB%8B%E8%BE%B9%E7%95%8C\">监督\u003c/a>。\u003c/p>\n\u003ch3 id=\"首次答复与原答复重放\">首次答复与原答复重放\u003c/h3>\n\u003cp>答复 POST 携带 Session/Origin/CSRF、Idempotency-Key、interaction_version/response，路径与字段见\u003ca href=\"../SKM/contracts/runs/interaction-response/v1/request.schema.json\">答复契约\u003c/a>。事务复用\u003ca href=\"#docs/design/authentication.md::%E8%AE%A4%E8%AF%81%E4%B8%8E%E4%B8%9A%E5%8A%A1%E6%8F%90%E4%BA%A4%E4%B8%8D%E6%98%AF%E5%90%8C%E4%B8%80%E4%B8%AA%E4%BA%8B%E5%8A%A1\">原会话校验\u003c/a>，不能只收 actor_id：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Organization → User → 原 AuthSession → Project/USER 成员 SHARE\n  → Run → Segment → Interaction\n  → 原会话/CSRF/资格复核 → 原 Response / 首次答复\n  → flush → 最终期限复核 → commit\n\u003c/code>\u003c/pre>\n\u003cp>Project/成员 SHARE 阻止状态修改且兼容 Worker 外键 KEY SHARE，避免双方反向等待；ADMIN 不免组织/归档检查。首次另验题型、OPEN、原版本、期限及原 Run/Segment 等待状态，同事务存答复、关旧段、增新段/事件/Outbox。\u003c/p>\n\u003cp>首次 201/Idempotent-Replay: false，重放 200/true，header 与 body 必须一致。详情/答复 no-store，Web 验状态/header/白名单及原 Project/Run/Interaction。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>身份项\u003c/th>\n\u003cth>准确边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>interaction_version\u003c/td>\n\u003ctd>问题原版本，不是 Run.row_version，不刷新版本自动重发旧答案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>key/hash\u003c/td>\n\u003ctd>按 interaction 唯一答复比较原 key 与 ID/版本/payload hash；对象键规范化，选择数组顺序不变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重放响应\u003c/td>\n\u003ctd>response_id/run_segment_id 是原答复，status/row_version 是当前 Run，不强制退回 QUEUED\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>actor\u003c/td>\n\u003ctd>首次保存回答者；重放独立核对原 actor_id，仍须当前 Project 授权，不要求与 Run 发起人相同\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>原 actor 独立比较，不重算旧 hash；他人可授权读历史，不能用同键/答案确认原请求。首次/重放同门禁：答复先持锁可先完成，撤权/归档先完成则拒绝；不代表 SSE/模型立即停权。\u003c/p>\n\u003ch3 id=\"过期与拒绝响应\">过期与拒绝响应\u003c/h3>\n\u003cp>首次答复锁后到期或 Recovery 扫描到期：等待 Run 保存 EXPIRED/INTERACTION_EXPIRED、INTERACTION_TIMEOUT 新段/dispatch，不造 Response；已终态/续行只关闭旧交互，不重开或追加末次事件。\u003c/p>\n\u003cp>service 捕获 InteractionExpiredError，最终授权有效且过期提交后返回 410；认证失败整笔回滚，commit 失败仍可能未知。410 非回滚证明，QUEUED 非 Worker 已恢复证明。\u003c/p>\n\u003ch2 id=\"答复界面与结果未知\">答复界面与结果未知\u003c/h2>\n\u003cp>草稿与原请求分开；单一页面 owner 按 actor/会话/Project/Run/Interaction 保留版本/payload/key，不因切标签、重载详情或移入历史而丢失。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>界面规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>编辑/发送\u003c/td>\n\u003ctd>显示原问题/期限/推荐；同步防重，共用 30 秒请求期限，发送后草稿不改原请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>确认成功\u003c/td>\n\u003ctd>回执确定原 response_id/续行；不以较旧 row_version 回退 Run，再读取当前详情\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 / 410\u003c/td>\n\u003ctd>读取原 Project/Run 详情中的原问题、已有答复与续行；不覆盖别人，不声称没有发生变更\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422 / 身份权限失败\u003c/td>\n\u003ctd>用稳定 Problem 分类和三语提示，不直接显示服务端原始正文；登录后不自动重发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网络/超时/abort/无效响应\u003c/td>\n\u003ctd>保留原请求，读取当前事实；不自动重试、换键或宣称 rollback\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>详情刷新失败\u003c/td>\n\u003ctd>保留待确认意图，不将旧详情当作当前可写资格；自动刷新与人工 GET 的明确权限拒绝均关闭确认门禁，普通读失败不证明提交失败\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>GET 只读当前事实；相同正文/作者或已续行不证明原 POST。“确认原答复”是用户明确的原 key/版本/payload POST，可能首次落库，必须说明此副作用，不能称纯查询。\u003c/p>\n\u003cp>每次 await/callback 验身份/世代，离开再回同 ID 也不收旧结果。Abort 不撤销服务端；换账号/会话/Project/Run 或离页使旧响应失效。原请求只存内存，不进 URL/Web storage/日志，刷新不承诺恢复；重新进入先读历史，无本地 key 不证明未提交。\u003c/p>\n\u003ch2 id=\"兼容与开发接续\">兼容与开发接续\u003c/h2>\n\u003cp>API/Worker/Web 配套发布并停旧写入者，不再产生普通 EFFECT_APPROVAL；旧 enum/hash 不变，不迁移“修复”悬空等待。\u003c/p>\n\u003cp>原版本为正整数，可选字段可省略但不接受 null/空选择/额外字段；已发送正文和选择顺序不重新整形，Web 拒绝无法无损表示的整数。批准/Evaluation 不复用本确认协议。\u003c/p>\n\u003ch2 id=\"验收条件\">验收条件\u003c/h2>\n\u003cp>覆盖禁止普通 EFFECT_APPROVAL 但保留合法/旧记录；CHOICE/REVIEW/非必答无隐式选择；原请求同 Response/Segment/dispatch；同键改内容/版本/actor 冲突；双人/expiry 竞争只一续行；410 已提交过期而未保存答案；丢响应/同 tick/切换不乱写；终态不重开。\u003c/p>\n\u003cp>真实 DB 锁/回滚、浏览器时序、模型暂停退出分别验证。代码入口见\u003ca href=\"#SKM/README.md::\">代码根 README\u003c/a>。\u003c/p>\n", "sections": [{"title": "用户答复、等待与续行", "level": "h1", "anchor": "用户答复等待与续行", "text": "# 用户答复、等待与续行\n\n本页定义普通交互的提出、答复、过期和原请求确认。外部批准见[受控效果](repository-effects.md)，结果评价见[结果设计](results-evaluation.md)；实施状态见[计划 R07](../planning/roadmap.md#r07-run-与审计)。"}, {"title": "先分清三种人工参与", "level": "h2", "anchor": "先分清三种人工参与", "text": "## 先分清三种人工参与\n\n| 操作 | 改变什么 |\n| --- | --- |\n| 普通答复 | CLARIFICATION/CHOICE/REVIEW 追加 Response 与新 Segment，不改目标/资源/权限 |\n| 外部批准 | 独立 decision API 决定精确 Proposal version/checksum，APPROVED 不等于已写入 |\n| Evaluation | 对保存的 Result 追加判断，不改原值、不恢复终态 |\n\nREVIEW 不等于 Evaluation。普通答复需当前 ProjectWriteActor，批准另外限发起人或 system ADMIN。"}, {"title": "一个例子：回答超时不等于什么都没发生", "level": "h2", "anchor": "一个例子回答超时不等于什么都没发生", "text": "## 一个例子：回答超时不等于什么都没发生\n\n推荐 A、可选 B，提交 B 后丢响应：可能原答案/续行已提交，也可能服务端先提交过期续行再返回 410；另一成员抢先回答则 409，保留对方决定。\n\n推荐非默认答案，required=false 不自动跳过/允许空答；当前无 skip。超时只记未答，不伪造选择。"}, {"title": "提问与答复的实际形状", "level": "h2", "anchor": "提问与答复的实际形状", "text": "## 提问与答复的实际形状\n\n精确字段见[提问 Tool](../../SKM/contracts/tools/interaction.request/v1/request.schema.json)和[答复契约](../../SKM/contracts/runs/interaction-response/v1/request.schema.json)。\n\n| 内容 | 规则 |\n| --- | --- |\n| prompt/rationale/impact | 公开说明，不含 hidden reasoning、系统 prompt 或 Secret |\n| options | 必须存在，可空；新问题的 key 唯一，CHOICE 至少两项；按 allow_multiple 限制，recommended 仅提示 |\n| 回答 | CLARIFICATION/REVIEW 非空 text；CHOICE 选已知 key，可附 text，不经文本换绑 |\n| required/期限 | 所有普通交互暂停；过期可无信息续行。expires_at 从事件 occurred_at 解析，不按打开页面重算 |\n| checkpoint/continuation | 冻结问题依据，回答追加到新段，Session 续行另守 Runtime 兼容 |\n\n每 Run 最多一个 OPEN；保存时验 checkpoint 引用归属，期限以服务端为准。旧重复选项 key 保持只读，不收新答案；已有答复可按原身份确认，不改历史 payload/hash。"}, {"title": "普通提问不能代替外部批准", "level": "h3", "anchor": "普通提问不能代替外部批准", "text": "### 普通提问不能代替外部批准\n\nTool Schema/parser/持久化入口均只接受 CLARIFICATION/CHOICE/REVIEW，进入 WAITING_FOR_INPUT。效果必须 change.propose → 关联批准 → decision/Effect。\n\n合法 Proposal 和旧 detail/event enum 保持可读；无 Proposal 的旧 EFFECT_APPROVAL 只读，普通答复/过期都不解锁，不补造批准或改历史。"}, {"title": "三个提交边界", "level": "h2", "anchor": "三个提交边界", "text": "## 三个提交边界\n\n```text\n提问事务：问题/checkpoint/事件 + Segment WAITING\n          Attempt DEFERRED / 主 Session IDLE / 释放 lease\n  ↓\n答复或过期事务：关闭旧交互/Segment\n               新 Segment + 事件/Outbox，Run QUEUED\n  ↓\n新 Attempt：准备输入 / 冻结 Brief / 启动校验 → Session\n```\n\n提问按 Run → Segment → Attempt 取锁，验 lease/RUNNING/取消；不持锁等 I/O。等待提交/释放 lease 不证明退出或结清，另走[监督](run-supervision.md#等待提交仍是独立边界)。"}, {"title": "首次答复与原答复重放", "level": "h3", "anchor": "首次答复与原答复重放", "text": "### 首次答复与原答复重放\n\n答复 POST 携带 Session/Origin/CSRF、Idempotency-Key、interaction_version/response，路径与字段见[答复契约](../../SKM/contracts/runs/interaction-response/v1/request.schema.json)。事务复用[原会话校验](authentication.md#认证与业务提交不是同一个事务)，不能只收 actor_id：\n\n```text\nOrganization → User → 原 AuthSession → Project/USER 成员 SHARE\n  → Run → Segment → Interaction\n  → 原会话/CSRF/资格复核 → 原 Response / 首次答复\n  → flush → 最终期限复核 → commit\n```\n\nProject/成员 SHARE 阻止状态修改且兼容 Worker 外键 KEY SHARE，避免双方反向等待；ADMIN 不免组织/归档检查。首次另验题型、OPEN、原版本、期限及原 Run/Segment 等待状态，同事务存答复、关旧段、增新段/事件/Outbox。\n\n首次 201/Idempotent-Replay: false，重放 200/true，header 与 body 必须一致。详情/答复 no-store，Web 验状态/header/白名单及原 Project/Run/Interaction。\n\n| 身份项 | 准确边界 |\n| --- | --- |\n| interaction_version | 问题原版本，不是 Run.row_version，不刷新版本自动重发旧答案 |\n| key/hash | 按 interaction 唯一答复比较原 key 与 ID/版本/payload hash；对象键规范化，选择数组顺序不变 |\n| 重放响应 | response_id/run_segment_id 是原答复，status/row_version 是当前 Run，不强制退回 QUEUED |\n| actor | 首次保存回答者；重放独立核对原 actor_id，仍须当前 Project 授权，不要求与 Run 发起人相同 |\n\n原 actor 独立比较，不重算旧 hash；他人可授权读历史，不能用同键/答案确认原请求。首次/重放同门禁：答复先持锁可先完成，撤权/归档先完成则拒绝；不代表 SSE/模型立即停权。"}, {"title": "过期与拒绝响应", "level": "h3", "anchor": "过期与拒绝响应", "text": "### 过期与拒绝响应\n\n首次答复锁后到期或 Recovery 扫描到期：等待 Run 保存 EXPIRED/INTERACTION_EXPIRED、INTERACTION_TIMEOUT 新段/dispatch，不造 Response；已终态/续行只关闭旧交互，不重开或追加末次事件。\n\nservice 捕获 InteractionExpiredError，最终授权有效且过期提交后返回 410；认证失败整笔回滚，commit 失败仍可能未知。410 非回滚证明，QUEUED 非 Worker 已恢复证明。"}, {"title": "答复界面与结果未知", "level": "h2", "anchor": "答复界面与结果未知", "text": "## 答复界面与结果未知\n\n草稿与原请求分开；单一页面 owner 按 actor/会话/Project/Run/Interaction 保留版本/payload/key，不因切标签、重载详情或移入历史而丢失。\n\n| 情况 | 界面规则 |\n| --- | --- |\n| 编辑/发送 | 显示原问题/期限/推荐；同步防重，共用 30 秒请求期限，发送后草稿不改原请求 |\n| 确认成功 | 回执确定原 response_id/续行；不以较旧 row_version 回退 Run，再读取当前详情 |\n| 409 / 410 | 读取原 Project/Run 详情中的原问题、已有答复与续行；不覆盖别人，不声称没有发生变更 |\n| 422 / 身份权限失败 | 用稳定 Problem 分类和三语提示，不直接显示服务端原始正文；登录后不自动重发 |\n| 网络/超时/abort/无效响应 | 保留原请求，读取当前事实；不自动重试、换键或宣称 rollback |\n| 详情刷新失败 | 保留待确认意图，不将旧详情当作当前可写资格；自动刷新与人工 GET 的明确权限拒绝均关闭确认门禁，普通读失败不证明提交失败 |\n\nGET 只读当前事实；相同正文/作者或已续行不证明原 POST。“确认原答复”是用户明确的原 key/版本/payload POST，可能首次落库，必须说明此副作用，不能称纯查询。\n\n每次 await/callback 验身份/世代，离开再回同 ID 也不收旧结果。Abort 不撤销服务端；换账号/会话/Project/Run 或离页使旧响应失效。原请求只存内存，不进 URL/Web storage/日志，刷新不承诺恢复；重新进入先读历史，无本地 key 不证明未提交。"}, {"title": "兼容与开发接续", "level": "h2", "anchor": "兼容与开发接续", "text": "## 兼容与开发接续\n\nAPI/Worker/Web 配套发布并停旧写入者，不再产生普通 EFFECT_APPROVAL；旧 enum/hash 不变，不迁移“修复”悬空等待。\n\n原版本为正整数，可选字段可省略但不接受 null/空选择/额外字段；已发送正文和选择顺序不重新整形，Web 拒绝无法无损表示的整数。批准/Evaluation 不复用本确认协议。"}, {"title": "验收条件", "level": "h2", "anchor": "验收条件", "text": "## 验收条件\n\n覆盖禁止普通 EFFECT_APPROVAL 但保留合法/旧记录；CHOICE/REVIEW/非必答无隐式选择；原请求同 Response/Segment/dispatch；同键改内容/版本/actor 冲突；双人/expiry 竞争只一续行；410 已提交过期而未保存答案；丢响应/同 tick/切换不乱写；终态不重开。\n\n真实 DB 锁/回滚、浏览器时序、模型暂停退出分别验证。代码入口见[代码根 README](../../SKM/README.md)。"}], "toc": [{"title": "先分清三种人工参与", "anchor": "先分清三种人工参与", "level": "h2"}, {"title": "一个例子：回答超时不等于什么都没发生", "anchor": "一个例子回答超时不等于什么都没发生", "level": "h2"}, {"title": "提问与答复的实际形状", "anchor": "提问与答复的实际形状", "level": "h2"}, {"title": "普通提问不能代替外部批准", "anchor": "普通提问不能代替外部批准", "level": "h3"}, {"title": "三个提交边界", "anchor": "三个提交边界", "level": "h2"}, {"title": "首次答复与原答复重放", "anchor": "首次答复与原答复重放", "level": "h3"}, {"title": "过期与拒绝响应", "anchor": "过期与拒绝响应", "level": "h3"}, {"title": "答复界面与结果未知", "anchor": "答复界面与结果未知", "level": "h2"}, {"title": "兼容与开发接续", "anchor": "兼容与开发接续", "level": "h2"}, {"title": "验收条件", "anchor": "验收条件", "level": "h2"}], "source": "design/user-interactions.md", "checksum": "431811a120f794832af1fdb662db117aacc526455704de6b5075acccff382bf8"}, {"id": "docs/design/results-evaluation.md", "title": "结果、证据与人工评价", "group": "design", "html": "\u003ch1 id=\"结果证据与人工评价\">结果、证据与人工评价\u003c/h1>\n\u003cp>本页定义模型交付、引用与追加评价。执行终态见 \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>，运行中回答见\u003ca href=\"#docs/design/user-interactions.md::\">普通交互\u003c/a>，远端事实见\u003ca href=\"#docs/design/repository-effects.md::\">受控效果\u003c/a>；当前缺口见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划 R07\u003c/a>。\u003c/p>\n\u003ch2 id=\"先分清四种事实\">先分清四种事实\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>含义与边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Run 终态\u003c/td>\n\u003ctd>执行如何结束；SUCCEEDED 不等于业务全对、进程已停或费用结清\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Result / Outcome\u003c/td>\n\u003ctd>原模型交付；COMPLETED/PARTIAL/BLOCKED 是完整度，不是 Run 状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence / Artifact\u003c/td>\n\u003ctd>依据与产物；引用合法不证明存在、归属、内容或现在可读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evaluation\u003c/td>\n\u003ctd>用户评分/判断/修订建议，追加保存，不改原值、不批准效果、不恢复 Run\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"一个例子执行结束结论仍需修订\">一个例子：执行结束，结论仍需修订\u003c/h3>\n\u003cp>Run SUCCEEDED、Outcome PARTIAL、confidence 0.8、人工 2/5/partially_accurate 可同时成立；confidence 非校准正确率，单次 rating 非整体质量。多份评价均指原 Result，不合并。needs_review 不自动提问/续行；采用修订、重开、自动父子 Run 尚无协议。\u003c/p>\n\u003ch2 id=\"结果的形状与读取来源\">结果的形状与读取来源\u003c/h2>\n\u003cp>每 Run 最多一份 run_results，Evaluation 关联 result_id。detail.result.data 是原值根；外层 summary/validation/usage 是投影。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/contracts/outcomes/envelope/v1.schema.json\">OutcomeEnvelope\u003c/a>包含交付物、发现、证据、限制、待确认和效果。无业务 Schema 也需包络；structured_data 仅在冻结任务声明 Schema 时允许，并使用原 Schema。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/contracts/runs/detail/v1.schema.json\">detail\u003c/a>读保存事实，不从当前资源重拼。Artifact 依成功 Tool Evidence 扩展保存/授权读取，模型 URL/工作区路径不是下载身份；子输出见\u003ca href=\"#docs/design/subagents.md::%E5%AD%90%E4%BB%BB%E5%8A%A1%E6%8C%87%E4%BB%A4%E4%B8%8E%E7%BB%93%E6%9E%9C%E7%9A%84%E8%BE%B9%E7%95%8C\">子分析\u003c/a>。\u003c/p>\n\u003ch2 id=\"结果校验的实际保证\">结果校验的实际保证\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/agent/result_validation.py\">ResultValidator\u003c/a>由主/子共用，首次查询前复制完整候选：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>检查\u003c/th>\n\u003cth>实际保证与缺口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>结构\u003c/td>\n\u003ctd>包络及冻结业务 Schema 合法，不验证推理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>敏感信息\u003c/td>\n\u003ctd>递归可疑字段名，不证明普通文本无秘密\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence\u003c/td>\n\u003ctd>source_ref/evidence_refs，以及 effects 的 before_ref/after_ref 均查同 Run；不证明支持结论或当前 blob 可读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Proposal\u003c/td>\n\u003ctd>顶层与 effects.proposal_ref 合并核验同 Run，拒绝仍在批准/执行中的提案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>效果声明\u003c/td>\n\u003ctd>单条 SELECT 核对 Proposal、精确 Approval、EffectExecution、ToolCall 及 before/after Evidence；不是重新访问远端\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Artifact\u003c/td>\n\u003ctd>收集顶层与 deliverables.artifact_ref，查同 Run/原成功 Tool 的不可变字节、大小与 hash；缺失、错归属或损坏拒绝，不接受模型自造 art_ ID\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>effects/artifact_ref 只解释包络明确位置，不把业务同名字段/URL 当身份；source_ref/evidence_refs 原约定不变。顶层与嵌套均收集、去重计数，省略顶层不能绕过核验。\u003c/p>\n\u003ch3 id=\"效果摘要核对到哪一步\">效果摘要核对到哪一步\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>声明\u003c/th>\n\u003cth>必须匹配的保存事实\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>PROPOSED / REJECTED\u003c/td>\n\u003ctd>分别为无批准/执行的 DRAFT，或原 version/checksum 的拒绝批准且无执行；不得附加虚构 before/after\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>STALE / FAILED\u003c/td>\n\u003ctd>匹配原提案和执行的终局；批准前失效可以没有执行，VERIFICATION_FAILED 只映射 FAILED，不表示远端未变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>APPLIED\u003c/td>\n\u003ctd>原批准、Provider/version、请求身份、成功 ToolCall、精确 before/after、Evidence snapshot 的实际 hash，以及 READ_BACK 的完整匹配路径一致\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>模型 before/after 必须精确匹配原执行，省略也须核对 APPLIED 两份证据；Tool 摘要与执行一致。lookup 缺失、跨 Run/Project、坏关联或事实矛盾均为 effect_summary_invalid，不保存成功，也不泄露原引用/正文。\u003c/p>\n\u003cp>这只证明保存的平台记录一致，不证明远端原执行、当前值、语义正确或停止/回滚。仅接受已注册 Provider 版本，升级须保留旧版只读核验，不改历史或用当前 Integration 重授权限。\u003c/p>\n\u003ch3 id=\"引用可信性的修正要求\">引用可信性的修正要求\u003c/h3>\n\u003cp>主/子共享完整位置与同 Run 校验；art_ 必须由原字节/归属/hash/成功回执一起发布，不用当前文件补历史。平台记录一致与\u003ca href=\"#docs/design/repository-effects.md::%E5%8F%AF%E9%9D%A0%E6%80%A7%E4%BF%AE%E6%AD%A3%E8%A6%81%E6%B1%82\">远端可靠性\u003c/a>分开验收；错误只留脱敏审计，旧结果不补造通过。\u003c/p>\n\u003cp>扩大校验须一起审查主/子、保存/Web、冻结 Schema、混合 Worker 与 validation 兼容。\u003c/p>\n\u003ch3 id=\"保存的验证范围\">保存的验证范围\u003c/h3>\n\u003cp>validation.reference_checks 使用 skillmind.result-reference-checks/v2：Evidence 同 Run、Proposal 归属/状态、包络效果与平台记录匹配；STRUCTURED_OUTPUT 效果为 NOT_APPLICABLE。Artifact 为 RUN_OWNERSHIP_AND_CONTENT 且 artifact_refs_valid=true，只证明保存时归属/字节，不承诺未来下载、安全或远端正确。\u003c/p>\n\u003cp>旧 v1 Artifact 仍为 NOT_VERIFIED，不混用 true、不升级覆盖；v2 无附件表示已检空集。API 保留原省略项，Web 显示保存时范围，历史缺字段标未记录。\u003c/p>\n\u003cp>缺项、未知版本、额外项、格式/结果类型/标志矛盾拒绝读取，不裁剪通过。升级配套 API/Web 并替换旧 Worker，不回写 result.data/validation。\u003c/p>\n\u003ch2 id=\"可信附件的发布与读取\">可信附件的发布与读取\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/contracts/tools/workspace.write/v2/response.schema.json\">workspace.write/v2\u003c/a>仅受控 UTF-8：workspace/ 是中间文件、artifact_refs 为空；output/ 每次产生新附件。v1 仅存 Evidence，不自动升级；Interpreter 可生成 v2 声明，旧 SkillVersion/Run 权限/hash 不改。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">原调用获准、保留原字节\n  → 受控写入\n  → 网关核参数、发号\n  → 重验原执行权\n  → 字节与成功回执一同保存\n  → 提交确认后交付引用\n  → 结果与检查点核验\n\u003c/code>\u003c/pre>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/artifacts/repository.py\">Artifact repository\u003c/a>复用 Evidence 的 Run/Tool/hash/时间，另存私有字节/发布元数据。同 Run 锁限制单份 1 MiB、100 份/10 MiB，跨 Segment/Attempt 累计，与模型预算分开。覆盖路径只发新引用，旧字节不变；无按路径更新/删除接口。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>边界\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>执行权失效、取消或候选校验失败\u003c/td>\n\u003ctd>不发布附件；已经改变的工作区文件不因此回滚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保存失败或 commit 响应未知\u003c/td>\n\u003ctd>不交付候选引用、不补写失败或重跑；原成功可在合法重放时读取原引用，未决保持未决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同 Project 的另一个 Run、缺失原 Tool/Attempt、非成功 Tool\u003c/td>\n\u003ctd>引用拒绝；原成功不能被改归当前 Attempt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧 Evidence/工作区文件\u003c/td>\n\u003ctd>不补造附件身份或原字节，不重新采样签发历史回执\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/api/routes/artifacts.py\">读取接口\u003c/a>为 Run 下 GET /artifacts 和 /artifacts/{artifact_ref}/content，验当前 ProjectReadActor/精确 Run。列表至多 100 项元数据，detail 不加载私有字节；下载/引用核验从同次有界 SELECT 验原 size/hash/UTF-8，不读当前 workspace 或模型 URL。\u003c/p>\n\u003cp>越权/不存在沿 Project/Run 404，未知引用 artifact_not_found；损坏 409 artifact_content_invalid，存储故障静态 503 artifact_storage_unavailable。下载为 text/plain 附件，no-store/nosniff/安全文件名，不是 HTML 预览或二进制协议。\u003c/p>\n\u003cp>页面按授权索引区分结果采用/未采用；只有模型引用则只显示文字。客户端再验字节限额/原大小/hash/UTF-8；取消、30 秒期限、身份/Project/Run 切换使旧响应失效，及时回收对象 URL。下载不证明外部打开安全。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/backend/migrations/versions/0040_evidence_artifacts.py\">0040\u003c/a>不回填；任一新绑定阻止丢列降级。原字节随 DB 备份，不以工作区恢复替代，见\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E4%B8%8E%E5%9B%9E%E9%80%80%E5%AE%A1%E6%9F%A5\">迁移审查\u003c/a>。\u003c/p>\n\u003ch2 id=\"保存与显示不是同一个提交\">保存与显示不是同一个提交\u003c/h2>\n\u003cp>候选只读校验 → 终态事务重验 lease/取消并保存允许的 Result、末次事件与 Outbox → 提交后 detail/SSE 各自读取 → 另一个 Evaluation 事务。\u003c/p>\n\u003cp>校验与终态不原子，锁后取消可覆盖候选；失败/取消可无 Result，不造空成功。Tool Evidence、评价不属终态事务，SSE 末次快照不含完整 Result，须授权读 detail。见\u003ca href=\"#docs/design/run-supervision.md::%E6%8F%90%E4%BA%A4%E6%97%B6%E8%B0%81%E5%86%B3%E5%AE%9A%E6%9C%80%E7%BB%88%E7%8A%B6%E6%80%81\">终态判定\u003c/a>。\u003c/p>\n\u003ch2 id=\"评价请求与历史\">评价请求与历史\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/contracts/evaluations/v1/create-request.schema.json\">请求 Schema\u003c/a>规定 rating 1–5、四种 verdict，可选 comment/revisions，至多 100 条修订。多用户/多次评价并存，最后一条不自动成为正式结论。以下路径位于 /api/v1/projects/{project_id}/runs/{run_id}：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>入口\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>POST /evaluation-submissions\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/contracts/evaluations/v1/submission-request.schema.json\">原请求\u003c/a>的 submission_key、精确 result_id 和评价内容一起提交；首次 201，同一原请求重放 200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET /evaluation-submissions/{submission_key}?result_id=…\u003c/td>\n\u003ctd>当前同一用户只读确认原记录；不创建评价，未见原记录为 404 evaluation_submission_not_found\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET /evaluations/page?limit=20\u0026amp;after=…\u003c/td>\n\u003ctd>同一 Result 的完整游标分页入口；不在前端筛选旧接口第一页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧 GET/POST /evaluations\u003c/td>\n\u003ctd>保留旧响应形状和追加语义；旧 POST 没有原请求保证，旧记录不补造 submission_key\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>新提交必带非空 UUID submission_key/result_id；先复制请求，以共享 canonical JSON/hash 绑定键、用户、Project/Run/Result 及全部评价内容。省略 comment/revisions 规范为 \u0026quot;\u0026quot;/[]；对象键顺序不影响身份，修订顺序/JSON 值影响，不接受非 JSON 数值或非法 UTF-8。\u003c/p>\n\u003cp>每 Result/用户/key 唯一；异内容为 409 evaluation_submission_conflict，错 Result 为 409 evaluation_result_mismatch，无 Result 为 409 result_not_available，不凭 SUCCEEDED 授权。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/contracts/evaluations/v1/submission.schema.json\">回执\u003c/a>仅含 project_id/run_id/key 和原 Evaluation 白名单。客户端验原用户/Result/key/全部内容，服务端另验保存内容/hash、修订原值/Result；相似历史不算成功。commit 确认前不交付，未知不补失败或重发。\u003ca href=\"../SKM/backend/migrations/versions/0041_evaluation_submissions.py\">0041\u003c/a>两列成组，旧行不补，任一新绑定阻止丢列降级。\u003c/p>\n\u003ch3 id=\"评价的授权事务\">评价的授权事务\u003c/h3>\n\u003cp>POST 用 ProjectWriteActor/Origin/CSRF，user_id 取 actor。新旧写入、确认、新分页共用 UserAccess：Organization → User → 原 AuthSession → Project/成员 → 原 Run/Result；只读 actor 锁兼容外键，不复制凭据算法。\u003c/p>\n\u003cp>等锁、领域读取、flush 后以新时间验原会话/账户/成员；首次、重放、未命中、拒绝均经最终检查。写入限 ACTIVE，归档可授权读历史/回执；同一用户可用新有效会话人工查询，但不搬旧凭据。最终持锁检查不保证物理 commit 瞬间期限或全系统停权。\u003c/p>\n\u003ch3 id=\"历史分页\">历史分页\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/contracts/evaluations/v1/page.schema.json\">分页响应\u003c/a>含 project_id/run_id/result_id/items/next_cursor。limit 1–100、默认 20；created_at/evaluation_id 升序，尾项 ID 续页，读取 limit+1 判断下一页，无则 null。\u003c/p>\n\u003cp>游标格式错、空 UUID、缺失或跨 Result 为 400 invalid_evaluation_cursor。空页不代表无 Result；稳定排序非跨页快照，并发追加可重读，不伪造总数或忽略未加载页。\u003c/p>\n\u003ch2 id=\"修订指向哪份原值\">修订指向哪份原值\u003c/h2>\n\u003cp>pointer 相对 detail.result.data，服务端读取 original_value；客户端只提交建议和理由。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目标\u003c/th>\n\u003cth>指针\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>原包络摘要\u003c/td>\n\u003ctd>/summary，不是外层截短投影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>包络业务字段\u003c/td>\n\u003ctd>/structured_data 下已存在的位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧结构化输出\u003c/td>\n\u003ctd>原业务对象根，不擅加 structured_data\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/data\u003c/td>\n\u003ctd>仅原内容真有 data 时有效，不代表 API 包装层\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>例如原包络存在 summary 时：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \u0026quot;rating\u0026quot;: 2,\n  \u0026quot;verdict\u0026quot;: \u0026quot;partially_accurate\u0026quot;,\n  \u0026quot;revisions\u0026quot;: [{\n    \u0026quot;pointer\u0026quot;: \u0026quot;/summary\u0026quot;,\n    \u0026quot;suggested_value\u0026quot;: \u0026quot;材料不足，结论有限。\u0026quot;,\n    \u0026quot;reason\u0026quot;: \u0026quot;原结果已列出限制。\u0026quot;\n  }]\n}\n\u003c/code>\u003c/pre>\n\u003cp>pointer 以 / 指向既有目标，支持 ~0/~1；空值、缺字段、非法数组位置、穿标量、同次重复均拒绝。null 非缺失，不能新增/删除/追加目标。suggested_value 为任意 JSON，不再套业务 Schema 或合并 Result；采用须另定授权/版本/审计。\u003c/p>\n\u003ch2 id=\"提交未知与界面责任\">提交未知与界面责任\u003c/h2>\n\u003cp>草稿、原请求、历史分开，可多修订、不自动采用。共用同步防重/30 秒期限，owner 含 actor/会话/Project/Run/Result。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>修正要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>核对原回执与全部原内容，按 Evaluation ID 合并一次；晚到列表不覆盖刚确认的记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>拒绝\u003c/td>\n\u003ctd>分开输入错误、结果不可用、身份/权限错误，不统一自动重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未知\u003c/td>\n\u003ctd>断网/超时/abort/无效成功响应可能已提交；冻结原键与内容，禁止自动 POST 或换键重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只读确认\u003c/td>\n\u003ctd>人工 GET 原回执；匹配才确认。404 只表示这次未见，不证明原 POST 未到达或回滚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>显式重发\u003c/td>\n\u003ctd>仍未确认时，用户可沿原键/原内容 POST，可能完成此前未落库的首次提交；不得混入新草稿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>刷新/切换\u003c/td>\n\u003ctd>同上下文切页签/重读详情保留未决；换 actor/会话/Project/Run/Result 后，旧成功、错误和 401 均不更新新页\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>历史刷新/相似评价不解除未决；已知输入拒绝才允许改草稿新提交，同键冲突不提供换键捷径。正文只存内存，不进 URL/持久层/日志，离页/刷新不承诺恢复。\u003c/p>\n\u003cp>有键可人工 GET，无正文不能据回执重造 POST。仅手输键的 GET 可结束/换查询键并保留未发草稿，旧响应随即失效；不撤销评价，也不解除已发 POST 的未决。Abort 不是撤销。\u003c/p>\n\u003ch2 id=\"兼容与开发接续\">兼容与开发接续\u003c/h2>\n\u003cp>新评价提交/确认/分页为独立契约，不改旧响应或将旧无键记录当可重放。新包络与旧 STRUCTURED_OUTPUT 分别可读，损坏不作空成功。唯一 Result 不等于禁止 UPDATE；追加式服务、真实迁移/竞争和运维保护仍须分层验收，状态见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划 R07\u003c/a>。\u003c/p>\n\u003ch2 id=\"验收条件\">验收条件\u003c/h2>\n\u003cp>覆盖 PARTIAL/技术终态/人工判断分离、冻结 Schema、所有跨 Run/缺失引用、模型假称 APPLIED、两次评价原值不变、非法 pointer 整条回滚、合法 null/转义、提交丢响应与上下文切换。真实 commit/rollback 和浏览器时序分别验证；入口见\u003ca href=\"#SKM/README.md::\">代码根 README\u003c/a>。\u003c/p>\n", "sections": [{"title": "结果、证据与人工评价", "level": "h1", "anchor": "结果证据与人工评价", "text": "# 结果、证据与人工评价\n\n本页定义模型交付、引用与追加评价。执行终态见 [Runtime](agent-runtime.md)，运行中回答见[普通交互](user-interactions.md)，远端事实见[受控效果](repository-effects.md)；当前缺口见[计划 R07](../planning/roadmap.md#r07-run-与审计)。"}, {"title": "先分清四种事实", "level": "h2", "anchor": "先分清四种事实", "text": "## 先分清四种事实\n\n| 对象 | 含义与边界 |\n| --- | --- |\n| Run 终态 | 执行如何结束；SUCCEEDED 不等于业务全对、进程已停或费用结清 |\n| Result / Outcome | 原模型交付；COMPLETED/PARTIAL/BLOCKED 是完整度，不是 Run 状态 |\n| Evidence / Artifact | 依据与产物；引用合法不证明存在、归属、内容或现在可读 |\n| Evaluation | 用户评分/判断/修订建议，追加保存，不改原值、不批准效果、不恢复 Run |"}, {"title": "一个例子：执行结束，结论仍需修订", "level": "h3", "anchor": "一个例子执行结束结论仍需修订", "text": "### 一个例子：执行结束，结论仍需修订\n\nRun SUCCEEDED、Outcome PARTIAL、confidence 0.8、人工 2/5/partially_accurate 可同时成立；confidence 非校准正确率，单次 rating 非整体质量。多份评价均指原 Result，不合并。needs_review 不自动提问/续行；采用修订、重开、自动父子 Run 尚无协议。"}, {"title": "结果的形状与读取来源", "level": "h2", "anchor": "结果的形状与读取来源", "text": "## 结果的形状与读取来源\n\n每 Run 最多一份 run_results，Evaluation 关联 result_id。detail.result.data 是原值根；外层 summary/validation/usage 是投影。\n\n[OutcomeEnvelope](../../SKM/contracts/outcomes/envelope/v1.schema.json)包含交付物、发现、证据、限制、待确认和效果。无业务 Schema 也需包络；structured_data 仅在冻结任务声明 Schema 时允许，并使用原 Schema。\n\n[detail](../../SKM/contracts/runs/detail/v1.schema.json)读保存事实，不从当前资源重拼。Artifact 依成功 Tool Evidence 扩展保存/授权读取，模型 URL/工作区路径不是下载身份；子输出见[子分析](subagents.md#子任务指令与结果的边界)。"}, {"title": "结果校验的实际保证", "level": "h2", "anchor": "结果校验的实际保证", "text": "## 结果校验的实际保证\n\n[ResultValidator](../../SKM/backend/src/skillmind/agent/result_validation.py)由主/子共用，首次查询前复制完整候选：\n\n| 检查 | 实际保证与缺口 |\n| --- | --- |\n| 结构 | 包络及冻结业务 Schema 合法，不验证推理 |\n| 敏感信息 | 递归可疑字段名，不证明普通文本无秘密 |\n| Evidence | source_ref/evidence_refs，以及 effects 的 before_ref/after_ref 均查同 Run；不证明支持结论或当前 blob 可读 |\n| Proposal | 顶层与 effects.proposal_ref 合并核验同 Run，拒绝仍在批准/执行中的提案 |\n| 效果声明 | 单条 SELECT 核对 Proposal、精确 Approval、EffectExecution、ToolCall 及 before/after Evidence；不是重新访问远端 |\n| Artifact | 收集顶层与 deliverables.artifact_ref，查同 Run/原成功 Tool 的不可变字节、大小与 hash；缺失、错归属或损坏拒绝，不接受模型自造 art_ ID |\n\neffects/artifact_ref 只解释包络明确位置，不把业务同名字段/URL 当身份；source_ref/evidence_refs 原约定不变。顶层与嵌套均收集、去重计数，省略顶层不能绕过核验。"}, {"title": "效果摘要核对到哪一步", "level": "h3", "anchor": "效果摘要核对到哪一步", "text": "### 效果摘要核对到哪一步\n\n| 声明 | 必须匹配的保存事实 |\n| --- | --- |\n| PROPOSED / REJECTED | 分别为无批准/执行的 DRAFT，或原 version/checksum 的拒绝批准且无执行；不得附加虚构 before/after |\n| STALE / FAILED | 匹配原提案和执行的终局；批准前失效可以没有执行，VERIFICATION_FAILED 只映射 FAILED，不表示远端未变 |\n| APPLIED | 原批准、Provider/version、请求身份、成功 ToolCall、精确 before/after、Evidence snapshot 的实际 hash，以及 READ_BACK 的完整匹配路径一致 |\n\n模型 before/after 必须精确匹配原执行，省略也须核对 APPLIED 两份证据；Tool 摘要与执行一致。lookup 缺失、跨 Run/Project、坏关联或事实矛盾均为 effect_summary_invalid，不保存成功，也不泄露原引用/正文。\n\n这只证明保存的平台记录一致，不证明远端原执行、当前值、语义正确或停止/回滚。仅接受已注册 Provider 版本，升级须保留旧版只读核验，不改历史或用当前 Integration 重授权限。"}, {"title": "引用可信性的修正要求", "level": "h3", "anchor": "引用可信性的修正要求", "text": "### 引用可信性的修正要求\n\n主/子共享完整位置与同 Run 校验；art_ 必须由原字节/归属/hash/成功回执一起发布，不用当前文件补历史。平台记录一致与[远端可靠性](repository-effects.md#可靠性修正要求)分开验收；错误只留脱敏审计，旧结果不补造通过。\n\n扩大校验须一起审查主/子、保存/Web、冻结 Schema、混合 Worker 与 validation 兼容。"}, {"title": "保存的验证范围", "level": "h3", "anchor": "保存的验证范围", "text": "### 保存的验证范围\n\nvalidation.reference_checks 使用 skillmind.result-reference-checks/v2：Evidence 同 Run、Proposal 归属/状态、包络效果与平台记录匹配；STRUCTURED_OUTPUT 效果为 NOT_APPLICABLE。Artifact 为 RUN_OWNERSHIP_AND_CONTENT 且 artifact_refs_valid=true，只证明保存时归属/字节，不承诺未来下载、安全或远端正确。\n\n旧 v1 Artifact 仍为 NOT_VERIFIED，不混用 true、不升级覆盖；v2 无附件表示已检空集。API 保留原省略项，Web 显示保存时范围，历史缺字段标未记录。\n\n缺项、未知版本、额外项、格式/结果类型/标志矛盾拒绝读取，不裁剪通过。升级配套 API/Web 并替换旧 Worker，不回写 result.data/validation。"}, {"title": "可信附件的发布与读取", "level": "h2", "anchor": "可信附件的发布与读取", "text": "## 可信附件的发布与读取\n\n[workspace.write/v2](../../SKM/contracts/tools/workspace.write/v2/response.schema.json)仅受控 UTF-8：workspace/ 是中间文件、artifact_refs 为空；output/ 每次产生新附件。v1 仅存 Evidence，不自动升级；Interpreter 可生成 v2 声明，旧 SkillVersion/Run 权限/hash 不改。\n\n```text\n原调用获准、保留原字节\n  → 受控写入\n  → 网关核参数、发号\n  → 重验原执行权\n  → 字节与成功回执一同保存\n  → 提交确认后交付引用\n  → 结果与检查点核验\n```\n\n[Artifact repository](../../SKM/backend/src/skillmind/artifacts/repository.py)复用 Evidence 的 Run/Tool/hash/时间，另存私有字节/发布元数据。同 Run 锁限制单份 1 MiB、100 份/10 MiB，跨 Segment/Attempt 累计，与模型预算分开。覆盖路径只发新引用，旧字节不变；无按路径更新/删除接口。\n\n| 边界 | 处理 |\n| --- | --- |\n| 执行权失效、取消或候选校验失败 | 不发布附件；已经改变的工作区文件不因此回滚 |\n| 保存失败或 commit 响应未知 | 不交付候选引用、不补写失败或重跑；原成功可在合法重放时读取原引用，未决保持未决 |\n| 同 Project 的另一个 Run、缺失原 Tool/Attempt、非成功 Tool | 引用拒绝；原成功不能被改归当前 Attempt |\n| 旧 Evidence/工作区文件 | 不补造附件身份或原字节，不重新采样签发历史回执 |\n\n[读取接口](../../SKM/backend/src/skillmind/api/routes/artifacts.py)为 Run 下 GET /artifacts 和 /artifacts/{artifact_ref}/content，验当前 ProjectReadActor/精确 Run。列表至多 100 项元数据，detail 不加载私有字节；下载/引用核验从同次有界 SELECT 验原 size/hash/UTF-8，不读当前 workspace 或模型 URL。\n\n越权/不存在沿 Project/Run 404，未知引用 artifact_not_found；损坏 409 artifact_content_invalid，存储故障静态 503 artifact_storage_unavailable。下载为 text/plain 附件，no-store/nosniff/安全文件名，不是 HTML 预览或二进制协议。\n\n页面按授权索引区分结果采用/未采用；只有模型引用则只显示文字。客户端再验字节限额/原大小/hash/UTF-8；取消、30 秒期限、身份/Project/Run 切换使旧响应失效，及时回收对象 URL。下载不证明外部打开安全。\n\n[0040](../../SKM/backend/migrations/versions/0040_evidence_artifacts.py)不回填；任一新绑定阻止丢列降级。原字节随 DB 备份，不以工作区恢复替代，见[迁移审查](../operations/deployment.md#迁移与回退审查)。"}, {"title": "保存与显示不是同一个提交", "level": "h2", "anchor": "保存与显示不是同一个提交", "text": "## 保存与显示不是同一个提交\n\n候选只读校验 → 终态事务重验 lease/取消并保存允许的 Result、末次事件与 Outbox → 提交后 detail/SSE 各自读取 → 另一个 Evaluation 事务。\n\n校验与终态不原子，锁后取消可覆盖候选；失败/取消可无 Result，不造空成功。Tool Evidence、评价不属终态事务，SSE 末次快照不含完整 Result，须授权读 detail。见[终态判定](run-supervision.md#提交时谁决定最终状态)。"}, {"title": "评价请求与历史", "level": "h2", "anchor": "评价请求与历史", "text": "## 评价请求与历史\n\n[请求 Schema](../../SKM/contracts/evaluations/v1/create-request.schema.json)规定 rating 1–5、四种 verdict，可选 comment/revisions，至多 100 条修订。多用户/多次评价并存，最后一条不自动成为正式结论。以下路径位于 /api/v1/projects/{project_id}/runs/{run_id}：\n\n| 入口 | 责任 |\n| --- | --- |\n| POST /evaluation-submissions | [原请求](../../SKM/contracts/evaluations/v1/submission-request.schema.json)的 submission_key、精确 result_id 和评价内容一起提交；首次 201，同一原请求重放 200 |\n| GET /evaluation-submissions/{submission_key}?result_id=… | 当前同一用户只读确认原记录；不创建评价，未见原记录为 404 evaluation_submission_not_found |\n| GET /evaluations/page?limit=20\u0026after=… | 同一 Result 的完整游标分页入口；不在前端筛选旧接口第一页 |\n| 旧 GET/POST /evaluations | 保留旧响应形状和追加语义；旧 POST 没有原请求保证，旧记录不补造 submission_key |\n\n新提交必带非空 UUID submission_key/result_id；先复制请求，以共享 canonical JSON/hash 绑定键、用户、Project/Run/Result 及全部评价内容。省略 comment/revisions 规范为 \"\"/[]；对象键顺序不影响身份，修订顺序/JSON 值影响，不接受非 JSON 数值或非法 UTF-8。\n\n每 Result/用户/key 唯一；异内容为 409 evaluation_submission_conflict，错 Result 为 409 evaluation_result_mismatch，无 Result 为 409 result_not_available，不凭 SUCCEEDED 授权。\n\n[回执](../../SKM/contracts/evaluations/v1/submission.schema.json)仅含 project_id/run_id/key 和原 Evaluation 白名单。客户端验原用户/Result/key/全部内容，服务端另验保存内容/hash、修订原值/Result；相似历史不算成功。commit 确认前不交付，未知不补失败或重发。[0041](../../SKM/backend/migrations/versions/0041_evaluation_submissions.py)两列成组，旧行不补，任一新绑定阻止丢列降级。"}, {"title": "评价的授权事务", "level": "h3", "anchor": "评价的授权事务", "text": "### 评价的授权事务\n\nPOST 用 ProjectWriteActor/Origin/CSRF，user_id 取 actor。新旧写入、确认、新分页共用 UserAccess：Organization → User → 原 AuthSession → Project/成员 → 原 Run/Result；只读 actor 锁兼容外键，不复制凭据算法。\n\n等锁、领域读取、flush 后以新时间验原会话/账户/成员；首次、重放、未命中、拒绝均经最终检查。写入限 ACTIVE，归档可授权读历史/回执；同一用户可用新有效会话人工查询，但不搬旧凭据。最终持锁检查不保证物理 commit 瞬间期限或全系统停权。"}, {"title": "历史分页", "level": "h3", "anchor": "历史分页", "text": "### 历史分页\n\n[分页响应](../../SKM/contracts/evaluations/v1/page.schema.json)含 project_id/run_id/result_id/items/next_cursor。limit 1–100、默认 20；created_at/evaluation_id 升序，尾项 ID 续页，读取 limit+1 判断下一页，无则 null。\n\n游标格式错、空 UUID、缺失或跨 Result 为 400 invalid_evaluation_cursor。空页不代表无 Result；稳定排序非跨页快照，并发追加可重读，不伪造总数或忽略未加载页。"}, {"title": "修订指向哪份原值", "level": "h2", "anchor": "修订指向哪份原值", "text": "## 修订指向哪份原值\n\npointer 相对 detail.result.data，服务端读取 original_value；客户端只提交建议和理由。\n\n| 目标 | 指针 |\n| --- | --- |\n| 原包络摘要 | /summary，不是外层截短投影 |\n| 包络业务字段 | /structured_data 下已存在的位置 |\n| 旧结构化输出 | 原业务对象根，不擅加 structured_data |\n| /data | 仅原内容真有 data 时有效，不代表 API 包装层 |\n\n例如原包络存在 summary 时：\n\n```json\n{\n  \"rating\": 2,\n  \"verdict\": \"partially_accurate\",\n  \"revisions\": [{\n    \"pointer\": \"/summary\",\n    \"suggested_value\": \"材料不足，结论有限。\",\n    \"reason\": \"原结果已列出限制。\"\n  }]\n}\n```\n\npointer 以 / 指向既有目标，支持 ~0/~1；空值、缺字段、非法数组位置、穿标量、同次重复均拒绝。null 非缺失，不能新增/删除/追加目标。suggested_value 为任意 JSON，不再套业务 Schema 或合并 Result；采用须另定授权/版本/审计。"}, {"title": "提交未知与界面责任", "level": "h2", "anchor": "提交未知与界面责任", "text": "## 提交未知与界面责任\n\n草稿、原请求、历史分开，可多修订、不自动采用。共用同步防重/30 秒期限，owner 含 actor/会话/Project/Run/Result。\n\n| 情况 | 修正要求 |\n| --- | --- |\n| 成功 | 核对原回执与全部原内容，按 Evaluation ID 合并一次；晚到列表不覆盖刚确认的记录 |\n| 拒绝 | 分开输入错误、结果不可用、身份/权限错误，不统一自动重试 |\n| 未知 | 断网/超时/abort/无效成功响应可能已提交；冻结原键与内容，禁止自动 POST 或换键重试 |\n| 只读确认 | 人工 GET 原回执；匹配才确认。404 只表示这次未见，不证明原 POST 未到达或回滚 |\n| 显式重发 | 仍未确认时，用户可沿原键/原内容 POST，可能完成此前未落库的首次提交；不得混入新草稿 |\n| 刷新/切换 | 同上下文切页签/重读详情保留未决；换 actor/会话/Project/Run/Result 后，旧成功、错误和 401 均不更新新页 |\n\n历史刷新/相似评价不解除未决；已知输入拒绝才允许改草稿新提交，同键冲突不提供换键捷径。正文只存内存，不进 URL/持久层/日志，离页/刷新不承诺恢复。\n\n有键可人工 GET，无正文不能据回执重造 POST。仅手输键的 GET 可结束/换查询键并保留未发草稿，旧响应随即失效；不撤销评价，也不解除已发 POST 的未决。Abort 不是撤销。"}, {"title": "兼容与开发接续", "level": "h2", "anchor": "兼容与开发接续", "text": "## 兼容与开发接续\n\n新评价提交/确认/分页为独立契约，不改旧响应或将旧无键记录当可重放。新包络与旧 STRUCTURED_OUTPUT 分别可读，损坏不作空成功。唯一 Result 不等于禁止 UPDATE；追加式服务、真实迁移/竞争和运维保护仍须分层验收，状态见[计划 R07](../planning/roadmap.md#r07-run-与审计)。"}, {"title": "验收条件", "level": "h2", "anchor": "验收条件", "text": "## 验收条件\n\n覆盖 PARTIAL/技术终态/人工判断分离、冻结 Schema、所有跨 Run/缺失引用、模型假称 APPLIED、两次评价原值不变、非法 pointer 整条回滚、合法 null/转义、提交丢响应与上下文切换。真实 commit/rollback 和浏览器时序分别验证；入口见[代码根 README](../../SKM/README.md)。"}], "toc": [{"title": "先分清四种事实", "anchor": "先分清四种事实", "level": "h2"}, {"title": "一个例子：执行结束，结论仍需修订", "anchor": "一个例子执行结束结论仍需修订", "level": "h3"}, {"title": "结果的形状与读取来源", "anchor": "结果的形状与读取来源", "level": "h2"}, {"title": "结果校验的实际保证", "anchor": "结果校验的实际保证", "level": "h2"}, {"title": "效果摘要核对到哪一步", "anchor": "效果摘要核对到哪一步", "level": "h3"}, {"title": "引用可信性的修正要求", "anchor": "引用可信性的修正要求", "level": "h3"}, {"title": "保存的验证范围", "anchor": "保存的验证范围", "level": "h3"}, {"title": "可信附件的发布与读取", "anchor": "可信附件的发布与读取", "level": "h2"}, {"title": "保存与显示不是同一个提交", "anchor": "保存与显示不是同一个提交", "level": "h2"}, {"title": "评价请求与历史", "anchor": "评价请求与历史", "level": "h2"}, {"title": "评价的授权事务", "anchor": "评价的授权事务", "level": "h3"}, {"title": "历史分页", "anchor": "历史分页", "level": "h3"}, {"title": "修订指向哪份原值", "anchor": "修订指向哪份原值", "level": "h2"}, {"title": "提交未知与界面责任", "anchor": "提交未知与界面责任", "level": "h2"}, {"title": "兼容与开发接续", "anchor": "兼容与开发接续", "level": "h2"}, {"title": "验收条件", "anchor": "验收条件", "level": "h2"}], "source": "design/results-evaluation.md", "checksum": "4fd4587990f6756873df8f176d1a5291bb1948bed12459ae9efdd176b0d10901"}, {"id": "docs/design/run-supervision.md", "title": "执行监督与停止", "group": "design", "html": "\u003ch1 id=\"执行监督与停止\">执行监督与停止\u003c/h1>\n\u003cp>本页负责已有 Run 的取消、超时、失去 lease 与清理，不新增状态机。启动见 \u003ca href=\"#docs/design/agent-runtime.md::%E4%BB%8E%E9%A2%86%E5%8F%96%E5%88%B0%E6%A8%A1%E5%9E%8B%E5%90%AF%E5%8A%A8%E7%9A%84%E8%BE%B9%E7%95%8C\">Runtime\u003c/a>，外部 Effect 有\u003ca href=\"#docs/design/repository-effects.md::%E6%89%A7%E8%A1%8C%E6%9D%83%E4%B8%8E%E5%8F%96%E6%B6%88\">独立边界\u003c/a>，实施状态见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划 R07\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子点击取消之后\">一个例子：点击取消之后\u003c/h2>\n\u003cp>首事件前取消：API 保存意图，Worker 取消自己拥有的 await、等待 client 清理，再以有效 lease 提交 CANCELLED。须区分：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事实\u003c/th>\n\u003cth>只证明什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>请求已接受\u003c/td>\n\u003ctd>收到取消意图，不是退出回执\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run CANCELLED\u003c/td>\n\u003ctd>业务终态不可重开，不保证进程已停\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>client 清理返回\u003c/td>\n\u003ctd>清理调用结束，adapter 仍须证明外部停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用量已确认\u003c/td>\n\u003ctd>对应执行范围已核对，不把其他未知调用归零\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>已有首事件时终态/清理顺序不同；Web 无公开证明不得显示“进程全停/额度退还”。\u003c/p>\n\u003ch2 id=\"谁负责停止\">谁负责停止\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>责任方\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>API / RunService\u003c/td>\n\u003ctd>授权并保存意图，不等待所有外部进程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/worker/executor.py\">Executor\u003c/a>\u003c/td>\n\u003ctd>监督准备、heartbeat、取消、事件等待；有效 lease 下提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/agent/engine.py\">AgentEngine\u003c/a>\u003c/td>\n\u003ctd>向其拥有的 client 传递取消/关闭，清理并提供核对依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子 Provider\u003c/td>\n\u003ctd>TaskGroup 持有全组 task，等待各支清理，不遗留后台工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Repository / Recovery\u003c/td>\n\u003ctd>按持久状态与 fencing 决定提交/接管\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/run-budgets.md::%E7%BB%93%E6%9D%9F%E5%8F%96%E6%B6%88%E4%B8%8E%E6%95%85%E9%9A%9C%E6%81%A2%E5%A4%8D\">预算协议\u003c/a>\u003c/td>\n\u003ctd>确认消费、保留未知占用，lease 过期不退款\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>取消 Run 不撤销已发生的远端写入，也不证明 Effect Provider 已停。\u003c/p>\n\u003ch2 id=\"不同阶段如何收束\">不同阶段如何收束\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>当前停止路径\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ContextBuilder 准备\u003c/td>\n\u003ctd>取消 builder task，等待退出，不再冻结 Brief/启动模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最终 gate 后、首事件前\u003c/td>\n\u003ctd>_first_engine_event 同时等首次事件与取消；由拥有 await 的 task 取消 connect/receive，不依赖 Session ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有首事件\u003c/td>\n\u003ctd>以 session_ref interrupt，消费侧继续处理终端/等待/deadline；interrupt 失败不是停止证明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子执行中\u003c/td>\n\u003ctd>TaskGroup 取消并等待全组，某支完成不再次打断兄弟清理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>以上依赖协作取消/清理，deadline 不承诺硬杀，见\u003ca href=\"#docs/design/run-budgets.md::%E7%8E%B0%E6%9C%89%E8%AE%A1%E6%97%B6%E5%99%A8%E7%9A%84%E8%A6%86%E7%9B%96%E8%8C%83%E5%9B%B4\">计时器\u003c/a>。线程 I/O 可晚返回，但不得再提交 READY/Brief 或启动；\u003ca href=\"#docs/design/resource-snapshots.md::%E5%87%86%E5%A4%87%E4%B8%AD%E6%96%AD%E4%B8%8E%E5%86%8D%E6%AC%A1%E4%BD%BF%E7%94%A8\">输入现场\u003c/a>保留。启动 gate 与模型调用不原子，仍需运行监督和 DB fencing。\u003c/p>\n\u003ch2 id=\"原因与执行权如何分类\">原因与执行权如何分类\u003c/h2>\n\u003cp>先判提交权，再判原因：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条件\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>lease 失效\u003c/td>\n\u003ctd>旧 Worker 退出，不补 FAILED/CANCELLED，合法恢复接管\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持久用户取消且 lease 有效\u003c/td>\n\u003ctd>取消收尾；无已观察 Session identity 不伪造事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>准备 deadline / Provider TimeoutError\u003c/td>\n\u003ctd>分别 preparation_timeout / context_build_failed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型下一事件 deadline\u003c/td>\n\u003ctd>wall_timeout；另查已成立的持久取消\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>job 关停/裸取消\u003c/td>\n\u003ctd>传播执行取消，不创造用户意图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SDK interrupted 但无持久取消\u003c/td>\n\u003ctd>主执行 FAILED / agent_session_interrupted；payload 自称 user 也不授权取消\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>子收集器将 interrupted 作为分支失败，不直接决定 Run 终态；旧原因缺来源保持未记录，不改历史 CANCELLED。\u003c/p>\n\u003ch2 id=\"提交时谁决定最终状态\">提交时谁决定最终状态\u003c/h2>\n\u003cp>先验事件身份/终态参数，再按 Run → Segment → Attempt 锁后事实和当前 lease 判定，不按浏览器/SDK 时间戳。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>提交顺序\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>取消意图先提交\u003c/td>\n\u003ctd>保存 CANCELLED，不保存成功 Result，不覆盖取消占用的 sequence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUCCEEDED/FAILED 先提交\u003c/td>\n\u003ctd>保持原终态；后续取消返回 409 run_not_cancellable\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已 CANCELLED 再取消\u003c/td>\n\u003ctd>返回已有状态，不重复终态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧 lease 失效\u003c/td>\n\u003ctd>不能因存在取消意图恢复提交权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/runs/repository.py\">finalize_execution\u003c/a>锁内复查取消，拒绝无意图 CANCELLED，service 在 commit 确认后返回实际状态；未知只查原事实，不换身份重跑。\u003c/p>\n\u003cp>主终态只处理同 Run/Attempt 的 PRIMARY；取消覆盖保留已观察用量、丢弃成功正文，\u003ca href=\"#docs/design/run-budgets.md::%E7%94%A8%E9%87%8F%E7%8E%B0%E5%9C%A8%E6%B5%81%E5%90%91%E5%93%AA%E9%87%8C\">Session 用量\u003c/a>与账本另算。\u003c/p>\n\u003ch3 id=\"等待提交仍是独立边界\">等待提交仍是独立边界\u003c/h3>\n\u003cp>普通事件及 interaction/proposal 等待共用检查：锁后验 lease/状态/事件身份、持久取消，再分配 sequence/新增记录。取消不恢复旧 lease、不合法化外来事件；TEXT_DELTA 不持久化。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">TX A：合法身份/lease → 发现取消 → 回滚等待/事件\n  ↓ 释放锁；Worker 收到 RunCancellationRequestedError\nTX B：重新取锁/验证 lease 与持久意图\n  ├─ 有效：保存 CANCELLED\n  └─ 失效：旧 Worker 退出\n\u003c/code>\u003c/pre>\n\u003cp>A 不留待办/checkpoint/Session/事件/Outbox/预授权 Effect，也不证明 B 完成。两事务间崩溃或失权由合法恢复接手，不持锁 interrupt；等待先提交则按已存状态取消，不撤销独立 Effect。\u003c/p>\n\u003ch3 id=\"tool-调用的提交与重放\">Tool 调用的提交与重放\u003c/h3>\n\u003cp>ToolAuditLease 是调用回执，不是 Worker lease。Executor 在主 stream 消费/关闭范围绑定私有原 claim，MCP 捕获、子调用继承同 Run/Attempt；token 不进 RunContext、Provider 参数或 SDK options。退出撤销本地许可，不证明进程停止。\u003c/p>\n\u003cp>注册、调用前确认、结果保存均按 Run → Segment → Attempt → ToolCall 取锁，验完整原身份、状态、lease、取消；等锁、取消查询、flush 后取新时间。Provider I/O 在锁外，最终检查不保证物理 commit 时刻的 lease。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原调用事实\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>首次注册提交已确认\u003c/td>\n\u003ctd>仅该 runtime 的首次许可可执行一次；调用前再检查执行权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RUNNING / FAILED / DENIED\u003c/td>\n\u003ctd>不发放新许可，不重跑 Provider，也不覆盖原失败/拒绝\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUCCEEDED\u003c/td>\n\u003ctd>当前执行权有效且原 SDK Session/Tool/参数身份完整匹配时，只读重放原结果；仍校验响应契约与上限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已存成功属于旧 Attempt\u003c/td>\n\u003ctd>仅同 SDK Session 的合法 RESUME 可读；不把原 Tool/Evidence 改归当前 Attempt，fork/replace 不借用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>注册或成功提交响应未知\u003c/td>\n\u003ctd>不当作回滚，不补写失败或换键重跑；后续原调用查询区分成功与未决\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>首次 await 前复制参数、响应及 Evidence 的嵌套内容，frozen dataclass 不冻结 mapping。失权/取消后的晚到结果不发布成功 Evidence，已改 workspace 不回滚。\u003ca href=\"#docs/design/results-evaluation.md::%E5%8F%AF%E4%BF%A1%E9%99%84%E4%BB%B6%E7%9A%84%E5%8F%91%E5%B8%83%E4%B8%8E%E8%AF%BB%E5%8F%96\">v2 附件\u003c/a>同门禁保存原字节/回执，重放再验内容；独立 Effect、子 Session recorder 和进程停止不由此保证。\u003c/p>\n\u003ch2 id=\"收尾终态与晚到信息\">收尾、终态与晚到信息\u003c/h2>\n\u003cp>当前主执行先存 Result/终态再关 stream，子执行先关流/验结果再存 Session/Tool；首事件前取消/超时先收束 await。主 _close_stream 吞普通关闭异常，disconnect 失败也移除 active 注册，不能据“无活动 Session”证明退出。\u003c/p>\n\u003cp>待完善的停止协议必须满足：\u003c/p>\n\u003col>\n\u003cli>准备/等待/清理/提交各有唯一所有者；不重复取消兄弟清理，真实进程有界停止并核对，wait_for 不是硬杀。\u003c/li>\n\u003cli>锁外清理、锁后 fencing；done 会影响 heartbeat，不假定 finally 持续续租，也不无限占权。\u003c/li>\n\u003cli>独立追加停止核对，不重开终态、不在末次 RUN_SNAPSHOT 后补事件；完整持久回执/查询尚缺。\u003c/li>\n\u003cli>可信核对方按原身份处理晚到用量，旧 Worker 不复权、未知占用不退款；子 v1 必需审计不降级。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"兼容与开发接续\">兼容与开发接续\u003c/h2>\n\u003cp>保持既有监督/Tool/Artifact/TaskGroup 门禁，停止核对与\u003ca href=\"#docs/design/run-budgets.md::\">共享预算\u003c/a>接续范围见\u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">计划 R07\u003c/a>。endpoint/RunStatus/SSE 不变，旧 Brief/Result/事件不回写、缺回执不补造；新增公开信息须版本化同步，不临时增加 STOPPING。\u003c/p>\n\u003ch2 id=\"验收矩阵\">验收矩阵\u003c/h2>\n\u003cp>覆盖准备取消/超时、connect/receive 无首事件、清理暂停、兄弟清理交错、无原因 interrupted、取消与终态两种提交顺序、等待拒绝后失去 lease、等待先提交后取消、多子 Session 下只终态化 PRIMARY、disconnect 失败和终态后晚到用量。\u003c/p>\n\u003cp>入口：\u003ca href=\"../SKM/backend/tests/worker/test_execution_outcomes.py\">执行结果\u003c/a>、\u003ca href=\"../SKM/backend/tests/runs/test_cancelled_execution_writes.py\">取消写入\u003c/a>。真实事务、进程停止与 Web 展示分别验收。\u003c/p>\n", "sections": [{"title": "执行监督与停止", "level": "h1", "anchor": "执行监督与停止", "text": "# 执行监督与停止\n\n本页负责已有 Run 的取消、超时、失去 lease 与清理，不新增状态机。启动见 [Runtime](agent-runtime.md#从领取到模型启动的边界)，外部 Effect 有[独立边界](repository-effects.md#执行权与取消)，实施状态见[计划 R07](../planning/roadmap.md#r07-run-与审计)。"}, {"title": "一个例子：点击取消之后", "level": "h2", "anchor": "一个例子点击取消之后", "text": "## 一个例子：点击取消之后\n\n首事件前取消：API 保存意图，Worker 取消自己拥有的 await、等待 client 清理，再以有效 lease 提交 CANCELLED。须区分：\n\n| 事实 | 只证明什么 |\n| --- | --- |\n| 请求已接受 | 收到取消意图，不是退出回执 |\n| Run CANCELLED | 业务终态不可重开，不保证进程已停 |\n| client 清理返回 | 清理调用结束，adapter 仍须证明外部停止 |\n| 用量已确认 | 对应执行范围已核对，不把其他未知调用归零 |\n\n已有首事件时终态/清理顺序不同；Web 无公开证明不得显示“进程全停/额度退还”。"}, {"title": "谁负责停止", "level": "h2", "anchor": "谁负责停止", "text": "## 谁负责停止\n\n| 责任方 | 责任 |\n| --- | --- |\n| API / RunService | 授权并保存意图，不等待所有外部进程 |\n| [Executor](../../SKM/backend/src/skillmind/worker/executor.py) | 监督准备、heartbeat、取消、事件等待；有效 lease 下提交 |\n| [AgentEngine](../../SKM/backend/src/skillmind/agent/engine.py) | 向其拥有的 client 传递取消/关闭，清理并提供核对依据 |\n| 子 Provider | TaskGroup 持有全组 task，等待各支清理，不遗留后台工作 |\n| Repository / Recovery | 按持久状态与 fencing 决定提交/接管 |\n| [预算协议](run-budgets.md#结束取消与故障恢复) | 确认消费、保留未知占用，lease 过期不退款 |\n\n取消 Run 不撤销已发生的远端写入，也不证明 Effect Provider 已停。"}, {"title": "不同阶段如何收束", "level": "h2", "anchor": "不同阶段如何收束", "text": "## 不同阶段如何收束\n\n| 阶段 | 当前停止路径 |\n| --- | --- |\n| ContextBuilder 准备 | 取消 builder task，等待退出，不再冻结 Brief/启动模型 |\n| 最终 gate 后、首事件前 | _first_engine_event 同时等首次事件与取消；由拥有 await 的 task 取消 connect/receive，不依赖 Session ID |\n| 已有首事件 | 以 session_ref interrupt，消费侧继续处理终端/等待/deadline；interrupt 失败不是停止证明 |\n| 子执行中 | TaskGroup 取消并等待全组，某支完成不再次打断兄弟清理 |\n\n以上依赖协作取消/清理，deadline 不承诺硬杀，见[计时器](run-budgets.md#现有计时器的覆盖范围)。线程 I/O 可晚返回，但不得再提交 READY/Brief 或启动；[输入现场](resource-snapshots.md#准备中断与再次使用)保留。启动 gate 与模型调用不原子，仍需运行监督和 DB fencing。"}, {"title": "原因与执行权如何分类", "level": "h2", "anchor": "原因与执行权如何分类", "text": "## 原因与执行权如何分类\n\n先判提交权，再判原因：\n\n| 条件 | 处理 |\n| --- | --- |\n| lease 失效 | 旧 Worker 退出，不补 FAILED/CANCELLED，合法恢复接管 |\n| 持久用户取消且 lease 有效 | 取消收尾；无已观察 Session identity 不伪造事件 |\n| 准备 deadline / Provider TimeoutError | 分别 preparation_timeout / context_build_failed |\n| 模型下一事件 deadline | wall_timeout；另查已成立的持久取消 |\n| job 关停/裸取消 | 传播执行取消，不创造用户意图 |\n| SDK interrupted 但无持久取消 | 主执行 FAILED / agent_session_interrupted；payload 自称 user 也不授权取消 |\n\n子收集器将 interrupted 作为分支失败，不直接决定 Run 终态；旧原因缺来源保持未记录，不改历史 CANCELLED。"}, {"title": "提交时谁决定最终状态", "level": "h2", "anchor": "提交时谁决定最终状态", "text": "## 提交时谁决定最终状态\n\n先验事件身份/终态参数，再按 Run → Segment → Attempt 锁后事实和当前 lease 判定，不按浏览器/SDK 时间戳。\n\n| 提交顺序 | 结果 |\n| --- | --- |\n| 取消意图先提交 | 保存 CANCELLED，不保存成功 Result，不覆盖取消占用的 sequence |\n| SUCCEEDED/FAILED 先提交 | 保持原终态；后续取消返回 409 run_not_cancellable |\n| 已 CANCELLED 再取消 | 返回已有状态，不重复终态 |\n| 旧 lease 失效 | 不能因存在取消意图恢复提交权 |\n\n[finalize_execution](../../SKM/backend/src/skillmind/runs/repository.py)锁内复查取消，拒绝无意图 CANCELLED，service 在 commit 确认后返回实际状态；未知只查原事实，不换身份重跑。\n\n主终态只处理同 Run/Attempt 的 PRIMARY；取消覆盖保留已观察用量、丢弃成功正文，[Session 用量](run-budgets.md#用量现在流向哪里)与账本另算。"}, {"title": "等待提交仍是独立边界", "level": "h3", "anchor": "等待提交仍是独立边界", "text": "### 等待提交仍是独立边界\n\n普通事件及 interaction/proposal 等待共用检查：锁后验 lease/状态/事件身份、持久取消，再分配 sequence/新增记录。取消不恢复旧 lease、不合法化外来事件；TEXT_DELTA 不持久化。\n\n```text\nTX A：合法身份/lease → 发现取消 → 回滚等待/事件\n  ↓ 释放锁；Worker 收到 RunCancellationRequestedError\nTX B：重新取锁/验证 lease 与持久意图\n  ├─ 有效：保存 CANCELLED\n  └─ 失效：旧 Worker 退出\n```\n\nA 不留待办/checkpoint/Session/事件/Outbox/预授权 Effect，也不证明 B 完成。两事务间崩溃或失权由合法恢复接手，不持锁 interrupt；等待先提交则按已存状态取消，不撤销独立 Effect。"}, {"title": "Tool 调用的提交与重放", "level": "h3", "anchor": "tool-调用的提交与重放", "text": "### Tool 调用的提交与重放\n\nToolAuditLease 是调用回执，不是 Worker lease。Executor 在主 stream 消费/关闭范围绑定私有原 claim，MCP 捕获、子调用继承同 Run/Attempt；token 不进 RunContext、Provider 参数或 SDK options。退出撤销本地许可，不证明进程停止。\n\n注册、调用前确认、结果保存均按 Run → Segment → Attempt → ToolCall 取锁，验完整原身份、状态、lease、取消；等锁、取消查询、flush 后取新时间。Provider I/O 在锁外，最终检查不保证物理 commit 时刻的 lease。\n\n| 原调用事实 | 处理 |\n| --- | --- |\n| 首次注册提交已确认 | 仅该 runtime 的首次许可可执行一次；调用前再检查执行权 |\n| RUNNING / FAILED / DENIED | 不发放新许可，不重跑 Provider，也不覆盖原失败/拒绝 |\n| SUCCEEDED | 当前执行权有效且原 SDK Session/Tool/参数身份完整匹配时，只读重放原结果；仍校验响应契约与上限 |\n| 已存成功属于旧 Attempt | 仅同 SDK Session 的合法 RESUME 可读；不把原 Tool/Evidence 改归当前 Attempt，fork/replace 不借用 |\n| 注册或成功提交响应未知 | 不当作回滚，不补写失败或换键重跑；后续原调用查询区分成功与未决 |\n\n首次 await 前复制参数、响应及 Evidence 的嵌套内容，frozen dataclass 不冻结 mapping。失权/取消后的晚到结果不发布成功 Evidence，已改 workspace 不回滚。[v2 附件](results-evaluation.md#可信附件的发布与读取)同门禁保存原字节/回执，重放再验内容；独立 Effect、子 Session recorder 和进程停止不由此保证。"}, {"title": "收尾、终态与晚到信息", "level": "h2", "anchor": "收尾终态与晚到信息", "text": "## 收尾、终态与晚到信息\n\n当前主执行先存 Result/终态再关 stream，子执行先关流/验结果再存 Session/Tool；首事件前取消/超时先收束 await。主 _close_stream 吞普通关闭异常，disconnect 失败也移除 active 注册，不能据“无活动 Session”证明退出。\n\n待完善的停止协议必须满足：\n\n1. 准备/等待/清理/提交各有唯一所有者；不重复取消兄弟清理，真实进程有界停止并核对，wait_for 不是硬杀。\n2. 锁外清理、锁后 fencing；done 会影响 heartbeat，不假定 finally 持续续租，也不无限占权。\n3. 独立追加停止核对，不重开终态、不在末次 RUN_SNAPSHOT 后补事件；完整持久回执/查询尚缺。\n4. 可信核对方按原身份处理晚到用量，旧 Worker 不复权、未知占用不退款；子 v1 必需审计不降级。"}, {"title": "兼容与开发接续", "level": "h2", "anchor": "兼容与开发接续", "text": "## 兼容与开发接续\n\n保持既有监督/Tool/Artifact/TaskGroup 门禁，停止核对与[共享预算](run-budgets.md)接续范围见[计划 R07](../planning/roadmap.md#r07-run-与审计)。endpoint/RunStatus/SSE 不变，旧 Brief/Result/事件不回写、缺回执不补造；新增公开信息须版本化同步，不临时增加 STOPPING。"}, {"title": "验收矩阵", "level": "h2", "anchor": "验收矩阵", "text": "## 验收矩阵\n\n覆盖准备取消/超时、connect/receive 无首事件、清理暂停、兄弟清理交错、无原因 interrupted、取消与终态两种提交顺序、等待拒绝后失去 lease、等待先提交后取消、多子 Session 下只终态化 PRIMARY、disconnect 失败和终态后晚到用量。\n\n入口：[执行结果](../../SKM/backend/tests/worker/test_execution_outcomes.py)、[取消写入](../../SKM/backend/tests/runs/test_cancelled_execution_writes.py)。真实事务、进程停止与 Web 展示分别验收。"}], "toc": [{"title": "一个例子：点击取消之后", "anchor": "一个例子点击取消之后", "level": "h2"}, {"title": "谁负责停止", "anchor": "谁负责停止", "level": "h2"}, {"title": "不同阶段如何收束", "anchor": "不同阶段如何收束", "level": "h2"}, {"title": "原因与执行权如何分类", "anchor": "原因与执行权如何分类", "level": "h2"}, {"title": "提交时谁决定最终状态", "anchor": "提交时谁决定最终状态", "level": "h2"}, {"title": "等待提交仍是独立边界", "anchor": "等待提交仍是独立边界", "level": "h3"}, {"title": "Tool 调用的提交与重放", "anchor": "tool-调用的提交与重放", "level": "h3"}, {"title": "收尾、终态与晚到信息", "anchor": "收尾终态与晚到信息", "level": "h2"}, {"title": "兼容与开发接续", "anchor": "兼容与开发接续", "level": "h2"}, {"title": "验收矩阵", "anchor": "验收矩阵", "level": "h2"}], "source": "design/run-supervision.md", "checksum": "685d5788fde9b3758f76e0ba0f0c6bd36d7cccfd2e147a995f9447c2157a15a1"}, {"id": "docs/design/run-budgets.md", "title": "Run 预算与执行限额", "group": "design", "html": "\u003ch1 id=\"run-预算与执行限额\">Run 预算与执行限额\u003c/h1>\n\u003cp>主/子执行、Segment 续行、Attempt 重试须共用 Run 账户。本文区分局部限制与未接入执行的账本，不是预算 API；状态见\u003ca href=\"#docs/planning/roadmap.md::r02-run-%E7%BB%9F%E4%B8%80%E9%A2%84%E7%AE%97\">计划 R02\u003c/a>。\u003c/p>\n\u003ch2 id=\"先区分上限分配与消耗\">先区分上限、分配与消耗\u003c/h2>\n\u003cp>上限是冻结授权，预留是承诺额度，消耗是确认用量；分配、Session 数、摘要长度都不是消费。\u003c/p>\n\u003ch3 id=\"当前实现的实际口径\">当前实现的实际口径\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>限制\u003c/th>\n\u003cth>当前边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>max_turns\u003c/td>\n\u003ctd>SDK 每次执行上限，不累计所有主子 Session/重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>max_budget_usd\u003c/td>\n\u003ctd>可选 SDK 局部限制；普通创建快照未设置，子 context 原值继承、不按支拆分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>max_output_bytes\u003c/td>\n\u003ctd>Gateway 单个序列化 Tool response 的 UTF-8 字节上限，不是累计输出/磁盘配额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子分析 budget\u003c/td>\n\u003ctd>每次 dispatch 重拆父冻结 turns/output 上限；连续调用未扣共享余额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RUN_MAX_ATTEMPTS\u003c/td>\n\u003ctd>当前 Segment 的技术重试次数，不限制全部业务续行或 Run 成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输入文件数量/字节\u003c/td>\n\u003ctd>逐根及跨根最终存量，规则见\u003ca href=\"#docs/design/resource-snapshots.md::%E8%B7%A8%E6%A0%B9%E6%80%BB%E9%87%8F\">资源总量\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>父 20 turns 连续两次 dispatch 两支，每次仍各分 10，并非全 Run 20。创建、主 Executor、子 Provider、startup 尚未调用账本。\u003c/p>\n\u003ch3 id=\"用量现在流向哪里\">用量现在流向哪里\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>来源\u003c/th>\n\u003cth>当前保存方式与缺口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>SDK mapper\u003c/td>\n\u003ctd>usage 与 rate-limit 通知都可为 USAGE_UPDATED，Result 终端/等待另带 turns/cost；不能逐事件相加\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主 Executor / Session\u003c/td>\n\u003ctd>Result 按 key 更新，Session usage 最新替换、cost 保存最近总值；无统一来源/去重账本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取消覆盖事件\u003c/td>\n\u003ctd>保留该事件已观察 usage/cost，丢弃成功/提问正文；SESSION_INTERRUPTED 不更新 Session usage，不能从事件反推相同投影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子收集器 / Session\u003c/td>\n\u003ctd>校验终端和结果，但不归集用量；子 usage 仅 branch_key、cost 空，失败也不等于零消耗\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>入账前须确认历史/重试/子调用范围，Session、Result、最终报告不可重复计量。\u003c/p>\n\u003ch3 id=\"原始用量观察入口\">原始用量观察入口\u003c/h3>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/agent/engine.py\">Engine\u003c/a>的可选 \u003ccode>usage_observer\u003c/code> 在原 SDK Result 展示前同步处理；普通 usage/rate-limit 不进入。失败阻止成功/等待输出，取消传播，不后台补写。\u003c/p>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind/agent/metering.py\">观察\u003c/a>固定 invocation、Project/Run/Attempt/actor、SDK Session、续行模式、SDK/CLI 构建版本与实际 prompt checksum。options 仅记录实际模型、局部限额、Session/续行/输出格式摘要，不含凭据/结果，不冒充完整 options 审计。同 invocation 固定观察键，异内容不得换键；再次 resume 是新 invocation。\u003c/p>\n\u003cp>整数、缺失、无效分开；有限非负 float 成本只存 binary64 hex，不转换为精确金额。观察不是 BudgetUsageReport，不声明累计范围/final/stopped；无 Result、流关闭、提交未知均不补零退款。\u003c/p>\n\u003cp>接入前，可信协调方须验证计量 profile、实际构建和局部强制再归一化。离线 probe 只验版本标记/接口；SDK 可回退系统 CLI，故不证明实际二进制、resume 范围或硬上界。预算身份须经\u003ca href=\"#docs/design/run-budgets.md::%E5%8E%9F%E8%B0%83%E7%94%A8%E7%BB%91%E5%AE%9A%E4%B8%8E%E5%90%AF%E5%8A%A8\">绑定\u003c/a>，不从 trace/Session/invocation ID 补造。\u003c/p>\n\u003ch3 id=\"现有计时器的覆盖范围\">现有计时器的覆盖范围\u003c/h3>\n\u003cp>默认值来自 \u003ca href=\"../SKM/backend/src/skillmind/core/settings.py\">Settings\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/runs/service.py\">创建快照\u003c/a>、\u003ca href=\"../SKM/backend/src/skillmind/worker/settings.py\">Worker\u003c/a>，部署以注入值为准。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>计时器\u003c/th>\n\u003cth>默认值与覆盖\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Attempt lease\u003c/td>\n\u003ctd>60 秒，可配 30–300；约每 1/3 续期，仅代表执行权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>准备 timeout\u003c/td>\n\u003ctd>300 秒，可配 1–3600；包住 ContextBuilder 及其输入提交，不含 Brief/启动/终态事务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仓库单命令\u003c/td>\n\u003ctd>120 秒，可配 5–600，不是所有根准备总时长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型事件流\u003c/td>\n\u003ctd>普通创建冻结 900 秒，准备后起算；只对下一事件 await 施加 deadline，不打断事件持久化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子分支\u003c/td>\n\u003ctd>300 秒，可配 30–600，不赠送 Run 额度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ARQ execute_run\u003c/td>\n\u003ctd>1200 + 准备秒数，默认 1500；整个 job 最终防线，其他 job/cron 独立\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人工等待\u003c/td>\n\u003ctd>持久 expires_at；释放主 lease，不刷新 Run 总额度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>准备 240 秒加模型 850 秒不违反各自限制，但不是 Run 共计 900 秒。续 lease 不延长 deadline；timeout 为协作取消，I/O/清理/DB 可晚返回，job 关停可打断终态提交。Effect 有\u003ca href=\"#docs/design/repository-effects.md::%E6%89%A7%E8%A1%8C%E6%9D%83%E4%B8%8E%E5%8F%96%E6%B6%88\">独立监督缺口\u003c/a>。\u003c/p>\n\u003ch2 id=\"目标与非目标\">目标与非目标\u003c/h2>\n\u003cp>重试/续行不重领额度，扩大上限新建 Run。不引入钱包/组织计费；Skill 解释、独立评估、模块构建另设限制。\u003c/p>\n\u003ch3 id=\"分开定义计量维度\">分开定义计量维度\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>必须冻结的口径\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>turns\u003c/td>\n\u003ctd>Adapter 定义新增 turn；不按 ToolCall/事件数代替，resume 历史不重复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成本\u003c/td>\n\u003ctd>币种/精度/累计或增量/延迟规则；固定精度，不用 float 比余额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>累计输出（后续）\u003c/td>\n\u003ctd>明确文本/结构化/Tool response 范围，DELTA 与 COMPLETED 不重复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>活动时长（后续）\u003c/td>\n\u003ctd>累计墙钟区间，子并行重叠不相加，排队/人工等待不计，准备仍独立 timeout\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>
