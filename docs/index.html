killmind 文書ガイド\n\n[ブラウザで読む](index.html) · [コードの入口](../SKM/README.md) · [現在の計画](planning/roadmap.md#当前执行状态)"}, {"title": "目的から探す", "level": "h2", "anchor": "目的から探す", "text": "## 目的から探す\n\n| 目的 | 入口 |\n| --- | --- |\n| 製品を理解する | [概要](overview/product.md) → [構成](overview/architecture.md) → [用語](overview/glossary.md) |\n| 機能を開発する | [設計索引](design/README.md) → [変更ガイド](development/change-guide.md) |\n| 環境・API | [ローカル開発](development/local-development.md) / [API 利用](development/api-usage.md) / [契約変更](development/contract-workflow.md) |\n| 起動・運用 | [Quickstart](operations/quickstart.md) / [配備](operations/deployment.md) / [復元](operations/backup-recovery.md) / [Runbook](operations/runbook.md) |\n| 文書を更新する | [文書維持](development/documentation.md) |"}, {"title": "配置と責任", "level": "h2", "anchor": "配置と責任", "text": "## 配置と責任\n\n`overview/` は全体像、`design/` は規則、`planning/` は現在の不足、`development/` は開発手順、`operations/` は運用手順。\n[業務構造図](overview/business-structure.html)と[技術構造図](overview/technical-architecture.html)は全体像の補助資料である。\n\n設計は要求、契約は形状、コードと検証は到達点を示す。設計済み・実装済み・実環境で受入済みを区別する。"}, {"title": "旧番号の対応", "level": "h2", "anchor": "旧番号の対応", "text": "## 旧番号の対応\n\nコード注釈に残る旧番号の案内のみ。歴史文書や現行仕様の別版ではなく、注釈を一括 path 置換しない。\n\n| ID | 現在の正本 |\n| --- | --- |\n| 01 | [計画](planning/roadmap.md) |\n| 02 / 03 | [業務構造](overview/business-structure.html) / [技術構造](overview/technical-architecture.html) |\n| 04 / 05 | [領域モデル](design/domain-model.md) / [Skill 契約](design/skill-contract.md) |\n| 06 / 07 | [Runtime](design/agent-runtime.md) / [Workspace](design/workspace.md) |\n| 09 / 10 | [認証](design/authentication.md) / [運用](operations/runbook.md) |\n| 11 | [解釈・公開](design/skill-interpretation.md) |"}], "toc": [{"title": "目的から探す", "anchor": "目的から探す", "level": "h2"}, {"title": "配置と責任", "anchor": "配置と責任", "level": "h2"}, {"title": "旧番号の対応", "anchor": "旧番号の対応", "level": "h2"}], "source": "README.md", "checksum": "874b3e4d044ce02dbef89493e354008cc229bb829e939462197959c79c6dfc53"}, {"id": "docs/overview/product.md", "title": "产品概览", "group": "overview", "html": "\u003ch1 id=\"产品概览\">产品概览\u003c/h1>\n\u003cp>Skillmind 把目录式 Skill 中的工作方法转成可选择、配置、执行的项目任务，统一提供资源访问、持续执行、人工参与、证据和审计。\n\u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">当前状态\u003c/a>记录实际完成度，本页只说明产品范围。\u003c/p>\n\u003ch2 id=\"一次使用过程\">一次使用过程\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">导入 Skill → 解释与预览 → 发布精确版本 → 项目启用与资源配置\n                                              ↓\n                                      任务中心选择任务\n                                              ↓\n                                      工作空间观察 Run\n                                              ↓\n                              分析 ↔ 回答问题 / 审查变更\n                                              ↓\n                                  结果 + 证据 + 人工评价\n\u003c/code>\u003c/pre>\n\u003cp>发布表示版本通过平台校验，项目启用决定可发现版本，资源就绪判断能否执行；三者不是一个“可用”开关。\n需要修改外部系统时，平台展示具体 Proposal，获得批准后执行并回读验证。\u003c/p>\n\u003ch2 id=\"用户与页面\">用户与页面\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>使用者\u003c/th>\n\u003cth>主要工作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ADMIN\u003c/td>\n\u003ctd>管理组织 Skill、精确版本、项目和资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目成员 USER\u003c/td>\n\u003ctd>选择任务、提供输入、查看过程和反馈结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 发起人或 ADMIN\u003c/td>\n\u003ctd>审查具体外部变更；权限由平台重新校验\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>任务中心选择“运行什么”，工作空间观察“一次 Run”。页面与未接入的管理入口见 \u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a>。\nProject 隔离资源与执行，不是系统角色；归档、撤权、取消和删除分别处理，见\u003ca href=\"#docs/design/project-lifecycle.md::\">项目生命周期\u003c/a>。\u003c/p>\n\u003ch2 id=\"产品边界\">产品边界\u003c/h2>\n\u003cul>\n\u003cli>业务规则来自 Skill，平台只固定通用协议；业务输入/输出 Schema 可选。\u003c/li>\n\u003cli>Integration 与 ResourceBinding 限定资源，Agent 不接触凭据；输入与权限按运行协议冻结。\u003c/li>\n\u003cli>一个 Run 可包含多个 Segment/Session，技术恢复记为 Attempt。Result 不可改，人工修订追加 Evaluation。\u003c/li>\n\u003cli>外部写入采用 observe → propose → apply；repository 始终需要人工批准。\u003c/li>\n\u003cli>调度复用普通 Run 创建，子分析只读有界；共享预算、Task Flow、生成界面仍有未完成链路，不能把设计当作可用功能。\u003c/li>\n\u003c/ul>\n\u003cp>开放市场、条件监控、任意宿主 Shell/网络、自动升级 SkillVersion、自动合并 PR、多仓库原子变更及完整多租户计费不在当前范围。\n继续阅读\u003ca href=\"#docs/overview/architecture.md::\">系统结构\u003c/a>、\u003ca href=\"#docs/overview/glossary.md::\">术语\u003c/a>或\u003ca href=\"#docs/development/change-guide.md::\">开发入口\u003c/a>。\u003c/p>\n", "sections": [{"title": "产品概览", "level": "h1", "anchor": "产品概览", "text": "# 产品概览\n\nSkillmind 把目录式 Skill 中的工作方法转成可选择、配置、执行的项目任务，统一提供资源访问、持续执行、人工参与、证据和审计。\n[当前状态](../planning/roadmap.md#当前执行状态)记录实际完成度，本页只说明产品范围。"}, {"title": "一次使用过程", "level": "h2", "anchor": "一次使用过程", "text": "## 一次使用过程\n\n```text\n导入 Skill → 解释与预览 → 发布精确版本 → 项目启用与资源配置\n                                              ↓\n                                      任务中心选择任务\n                                              ↓\n                                      工作空间观察 Run\n                                              ↓\n                              分析 ↔ 回答问题 / 审查变更\n                                              ↓\n                                  结果 + 证据 + 人工评价\n```\n\n发布表示版本通过平台校验，项目启用决定可发现版本，资源就绪判断能否执行；三者不是一个“可用”开关。\n需要修改外部系统时，平台展示具体 Proposal，获得批准后执行并回读验证。"}, {"title": "用户与页面", "level": "h2", "anchor": "用户与页面", "text": "## 用户与页面\n\n| 使用者 | 主要工作 |\n| --- | --- |\n| ADMIN | 管理组织 Skill、精确版本、项目和资源 |\n| 项目成员 USER | 选择任务、提供输入、查看过程和反馈结果 |\n| Run 发起人或 ADMIN | 审查具体外部变更；权限由平台重新校验 |\n\n任务中心选择“运行什么”，工作空间观察“一次 Run”。页面与未接入的管理入口见 [Workspace](../design/workspace.md)。\nProject 隔离资源与执行，不是系统角色；归档、撤权、取消和删除分别处理，见[项目生命周期](../design/project-lifecycle.md)。"}, {"title": "产品边界", "level": "h2", "anchor": "产品边界", "text": "## 产品边界\n\n- 业务规则来自 Skill，平台只固定通用协议；业务输入/输出 Schema 可选。\n- Integration 与 ResourceBinding 限定资源，Agent 不接触凭据；输入与权限按运行协议冻结。\n- 一个 Run 可包含多个 Segment/Session，技术恢复记为 Attempt。Result 不可改，人工修订追加 Evaluation。\n- 外部写入采用 observe → propose → apply；repository 始终需要人工批准。\n- 调度复用普通 Run 创建，子分析只读有界；共享预算、Task Flow、生成界面仍有未完成链路，不能把设计当作可用功能。\n\n开放市场、条件监控、任意宿主 Shell/网络、自动升级 SkillVersion、自动合并 PR、多仓库原子变更及完整多租户计费不在当前范围。\n继续阅读[系统结构](architecture.md)、[术语](glossary.md)或[开发入口](../development/change-guide.md)。"}], "toc": [{"title": "一次使用过程", "anchor": "一次使用过程", "level": "h2"}, {"title": "用户与页面", "anchor": "用户与页面", "level": "h2"}, {"title": "产品边界", "anchor": "产品边界", "level": "h2"}], "source": "overview/product.md", "checksum": "8629487f38a36454adf4ab639fabed40f07473cc9277b0c480f7a31fd88d15e5"}, {"id": "docs/overview/architecture.md", "title": "系统结构与执行链路", "group": "overview", "html": "\u003ch1 id=\"系统结构与执行链路\">系统结构与执行链路\u003c/h1>\n\u003cp>Backend 是模块化单体，API 与 Worker 共享 \u003ccode>skillmind\u003c/code> package、分进程运行；业务层依赖 AgentEngine 抽象。\u003c/p>\n\u003ch2 id=\"组件和数据所有权\">组件和数据所有权\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">浏览器 Web → 共享 Traefik → FastAPI → 领域服务 → PostgreSQL\n                  └── Web 静态资源        │         └── 业务与审计正本\n                                      Outbox\n                                         ↓\n                                   Redis → ARQ Worker\n                                              ↓\n                                    AgentEngine → 模型\n                                              ↓\n                                       Tool Gateway\n                                              ↓\n                                    Provider → 已绑定资源\n                                              ↓\n                                      Evidence / Artifact\n\u003c/code>\u003c/pre>\n\u003cp>PostgreSQL 保存 Skill、Run/Segment/Attempt、Session、Event/Outbox、Result 和批准。\nRedis 承担队列、短期锁、通知与登录防护；blob 在 object storage，执行文件在 Run workspace。\n这些存储不属于同一事务；恢复需一起核对数据库引用、blob、workspace 和密钥。\u003c/p>\n\u003ch2 id=\"三条关键链路\">三条关键链路\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>链路\u003c/th>\n\u003cth>关键步骤\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Skill 成为任务\u003c/td>\n\u003ctd>Source → Interpreter → Blueprint → 审查/发布 → Project 启用 → TaskCatalog\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一次 Run\u003c/td>\n\u003ctd>冻结输入/授权 → Outbox → claim → 受监督准备 → Brief/启动校验 → 执行 → 等待或终态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部变更\u003c/td>\n\u003ctd>Proposal → 精确批准 → EffectExecution → CAS → 写入 → read-back\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>模型提出调用，平台校验 capability、绑定、参数、预算与批准后才执行。\n创建冻结授权与选择；Run 输入回执、Segment Brief、Attempt lease 分别证明不同事实，不能互相替代。\n登录防护的 Redis 配额也不等于数据库 Session 的撤销状态。\u003c/p>\n\u003ch2 id=\"变更应放在哪一层\">变更应放在哪一层\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层\u003c/th>\n\u003cth>实现与责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>API\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/api/routes\">routes\u003c/a> / \u003ca href=\"../SKM/backend/src/skillmind/api/auth_dependencies.py\">actor dependency\u003c/a>：认证、授权、入出参\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>领域与持久化\u003c/td>\n\u003ctd>service/domain 决定规则；repository / \u003ca href=\"../SKM/backend/src/skillmind/db\">db\u003c/a>负责事务、锁与快照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行\u003c/td>\n\u003ctd>\u003ca href=\"../SKM/backend/src/skillmind/agent\">agent\u003c/a> / \u003ca href=\"../SKM/backend/src/skillmind/worker\">worker\u003c/a>：SDK、Tool、监督与恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web / 契约\u003c/td>\n\u003ctd>\u003ca href=\"#SKM/README.md::web\">代码入口\u003c/a>负责校验和交互；\u003ca href=\"#SKM/README.md::contracts\">contracts\u003c/a>固定公开形状\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>规则归属见\u003ca href=\"#docs/design/README.md::%E3%81%A9%E3%81%AE%E8%A8%AD%E8%A8%88%E3%82%92%E5%A4%89%E6%9B%B4%E3%81%99%E3%82%8B%E3%81%8B\">设计索引\u003c/a>，同步步骤见\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>。\u003c/p>\n\u003ch2 id=\"部署边界\">部署边界\u003c/h2>\n\u003cp>复用共享 Traefik，仅 web/api 进入 edge network，不发布宿主端口。外部 context path 被 Traefik 去除；\nAPI 内部保持 \u003ccode>/api\u003c/code>、Web 保持 \u003ccode>/\u003c/code>，Web build path 与 API root_path 须匹配。\n\u003ca href=\"../SKM/compose.yaml\">Compose\u003c/a>包含应用、存储与一次性迁移/初始化服务，module-builder 尚未接入。\n\u003ca href=\"overview/technical-architecture.html\">技术结构图\u003c/a>用于整体展示，发布步骤见\u003ca href=\"#docs/operations/deployment.md::\">部署指南\u003c/a>。\u003c/p>\n", "sections": [{"title": "系统结构与执行链路", "level": "h1", "anchor": "系统结构与执行链路", "text": "# 系统结构与执行链路\n\nBackend 是模块化单体，API 与 Worker 共享 `skillmind` package、分进程运行；业务层依赖 AgentEngine 抽象。"}, {"title": "组件和数据所有权", "level": "h2", "anchor": "组件和数据所有权", "text": "## 组件和数据所有权\n\n```text\n浏览器 Web → 共享 Traefik → FastAPI → 领域服务 → PostgreSQL\n                  └── Web 静态资源        │         └── 业务与审计正本\n                                      Outbox\n                                         ↓\n                                   Redis → ARQ Worker\n                                              ↓\n                                    AgentEngine → 模型\n                                              ↓\n                                       Tool Gateway\n                                              ↓\n                                    Provider → 已绑定资源\n                                              ↓\n                                      Evidence / Artifact\n```\n\nPostgreSQL 保存 Skill、Run/Segment/Attempt、Session、Event/Outbox、Result 和批准。\nRedis 承担队列、短期锁、通知与登录防护；blob 在 object storage，执行文件在 Run workspace。\n这些存储不属于同一事务；恢复需一起核对数据库引用、blob、workspace 和密钥。"}, {"title": "三条关键链路", "level": "h2", "anchor": "三条关键链路", "text": "## 三条关键链路\n\n| 链路 | 关键步骤 |\n| --- | --- |\n| Skill 成为任务 | Source → Interpreter → Blueprint → 审查/发布 → Project 启用 → TaskCatalog |\n| 一次 Run | 冻结输入/授权 → Outbox → claim → 受监督准备 → Brief/启动校验 → 执行 → 等待或终态 |\n| 外部变更 | Proposal → 精确批准 → EffectExecution → CAS → 写入 → read-back |\n\n模型提出调用，平台校验 capability、绑定、参数、预算与批准后才执行。\n创建冻结授权与选择；Run 输入回执、Segment Brief、Attempt lease 分别证明不同事实，不能互相替代。\n登录防护的 Redis 配额也不等于数据库 Session 的撤销状态。"}, {"title": "变更应放在哪一层", "level": "h2", "anchor": "变更应放在哪一层", "text": "## 变更应放在哪一层\n\n| 层 | 实现与责任 |\n| --- | --- |\n| API | [routes](../../SKM/backend/src/skillmind/api/routes/) / [actor dependency](../../SKM/backend/src/skillmind/api/auth_dependencies.py)：认证、授权、入出参 |\n| 领域与持久化 | service/domain 决定规则；repository / [db](../../SKM/backend/src/skillmind/db/)负责事务、锁与快照 |\n| 执行 | [agent](../../SKM/backend/src/skillmind/agent/) / [worker](../../SKM/backend/src/skillmind/worker/)：SDK、Tool、监督与恢复 |\n| Web / 契约 | [代码入口](../../SKM/README.md#web)负责校验和交互；[contracts](../../SKM/README.md#contracts)固定公开形状 |\n\n规则归属见[设计索引](../design/README.md#どの設計を変更するか)，同步步骤见[变更指南](../development/change-guide.md)。"}, {"title": "部署边界", "level": "h2", "anchor": "部署边界", "text": "## 部署边界\n\n复用共享 Traefik，仅 web/api 进入 edge network，不发布宿主端口。外部 context path 被 Traefik 去除；\nAPI 内部保持 `/api`、Web 保持 `/`，Web build path 与 API root_path 须匹配。\n[Compose](../../SKM/compose.yaml)包含应用、存储与一次性迁移/初始化服务，module-builder 尚未接入。\n[技术结构图](technical-architecture.html)用于整体展示，发布步骤见[部署指南](../operations/deployment.md)。"}], "toc": [{"title": "组件和数据所有权", "anchor": "组件和数据所有权", "level": "h2"}, {"title": "三条关键链路", "anchor": "三条关键链路", "level": "h2"}, {"title": "变更应放在哪一层", "anchor": "变更应放在哪一层", "level": "h2"}, {"title": "部署边界", "anchor": "部署边界", "level": "h2"}], "source": "overview/architecture.md", "checksum": "808b47c894116088fb90aa65eacac84f0cb46407603098e11c9ec301a5f25544"}, {"id": "docs/overview/glossary.md", "title": "核心术语", "group": "overview", "html": "\u003ch1 id=\"核心术语\">核心术语\u003c/h1>\n\u003cp>这里只解释词义与易混淆的边界；完整规则见\u003ca href=\"#docs/design/README.md::\">设计索引\u003c/a>。\u003c/p>\n\u003ch2 id=\"从工作方法到执行\">从工作方法到执行\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>SkillSource / SkillInterpretation\u003c/td>\n\u003ctd>导入来源 / 一次解释记录；导入不执行来源脚本，重解释不覆盖旧记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CapabilityBlueprint\u003c/td>\n\u003ctd>目标、规则、资源和完成条件的语义来源，不授予 Tool 权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RuntimeManifest\u003c/td>\n\u003ctd>精确版本的运行投影与约束，不用来反推新蓝图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillVersion / ProjectSkillVersion\u003c/td>\n\u003ctd>内容不可变的发布版 / 项目显式启用关系；发布、启用与 readiness 分开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Task / ExecutableTask\u003c/td>\n\u003ctd>从版本投影的可启动工作，不必对应独立数据库表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillComposition\u003c/td>\n\u003ctd>多 SkillVersion 的展示组合；虚拟角色不是权限角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FrontendModuleVersion / ViewSpec\u003c/td>\n\u003ctd>生成界面版本 / 平台声明式展示；与业务 module API、文档预览分开\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"资源与权限\">资源与权限\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Domain / Tool capability\u003c/td>\n\u003ctd>业务能力名称 / 注册的版本化 Tool 协议，前者不能直接调用后者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ResourceRequirement / Integration\u003c/td>\n\u003ctd>抽象资源需求 / 实际 Provider、实例和范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ResourceBinding\u003c/td>\n\u003ctd>requirement 到资源的选择；配置与 Run 冻结记录不是同一层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容快照 / 物化副本\u003c/td>\n\u003ctd>ID/hash/revision / 实际文件；授权固定不等于全部内容已取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RunInputSnapshot\u003c/td>\n\u003ctd>Run 级准备回执；READY 绑定完整文件集合，PREPARING 不可使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>逻辑 input / 物理世代\u003c/td>\n\u003ctd>Agent 所见路径 / 平台隔离存储位置，由平台映射\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User / ProjectMember\u003c/td>\n\u003ctd>账户 / 项目成员关系；账户创建和项目偏好不授予 membership\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AuthSession / CSRF\u003c/td>\n\u003ctd>浏览器会话 / 会话绑定的写请求校验值，不是模型 AgentSession\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账户版本 / 安全事件\u003c/td>\n\u003ctd>管理并发版本 / 接受的安全操作；不是在线人数或完整登录日志\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录配额 / 退避\u003c/td>\n\u003ctd>短期计数 / 有限等待，不等于停用账户或撤销会话\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SecretReference\u003c/td>\n\u003ctd>外部凭据引用，公开响应不含原值、locator 或密文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>key_version / kek_version\u003c/td>\n\u003ctd>引用 metadata 版本 / 部署加密密钥版本，均不代表外部凭据已更新\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Readiness\u003c/td>\n\u003ctd>由 Provider 和配置计算的就绪状态，执行时仍须重新校验权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"一次-run-内部\">一次 Run 内部\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Run（固定目标、权限与输入）\n└── Segment（连续工作；业务答复后追加）\n    └── Attempt（一次技术执行；重试后追加）\n        ├── PRIMARY Session（同一时刻一个活动主会话）\n        └── SUBAGENT Session（有界只读分支）\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>AgentTaskBrief\u003c/td>\n\u003ctd>该 Segment 的目标、指导、资源与策略快照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lease / fencing\u003c/td>\n\u003ctd>限时执行权 / 提交时拒绝失效持有者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>准备 / wall / job timeout\u003c/td>\n\u003ctd>分别约束准备、模型等待和 Worker job，不是 Run 累计预算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>限额 / 预留 / 消耗\u003c/td>\n\u003ctd>上限 / 未确认结清的占用 / 已确认用量；usage、cost 和成功状态分别判断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UserInteraction / ChangeProposal\u003c/td>\n\u003ctd>普通问题或批准交互 / 具体变更提案；回答、批准与评价不是同一种提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EffectExecution\u003c/td>\n\u003ctd>已批准变更的执行和回读记录，批准不保证远端已经完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence / Artifact\u003c/td>\n\u003ctd>可定位、带版本的事实引用 / 报告或补丁文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Result / OutcomeEnvelope\u003c/td>\n\u003ctd>不可变原结果 / 通用输出包络，执行成功不等于业务判断全对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evaluation\u003c/td>\n\u003ctd>追加式评分和修订，原值来自 Result，不覆盖原结果或续行 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Task Flow / Run Flow\u003c/td>\n\u003ctd>版本化计划 / 实际活动投影，不是第二个执行控制器\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"创建与调度恢复\">创建与调度恢复\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Idempotency-Key / 请求身份\u003c/td>\n\u003ctd>定位一次提交 / 判断其内容相同；持有键不授予访问权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>创建重放\u003c/td>\n\u003ctd>确认首次创建的 Run，不重新冻结资源或追加执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>occurrence\u003c/td>\n\u003ctd>计划触发时刻，不等于 Worker 开始时间或 Run 终态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>missed / overlap\u003c/td>\n\u003ctd>错过发火 / 重叠跳过；当前重叠判断限于本 Schedule 摘要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schedule 摘要 / 触发账本\u003c/td>\n\u003ctd>可覆盖的 last_*、run_count / 待完整实现的逐次持久记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>在途恢复 / 补跑\u003c/td>\n\u003ctd>完成已经认领的一次 / 为过去未处理时刻新造执行，前者不授权后者\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n", "sections": [{"title": "核心术语", "level": "h1", "anchor": "核心术语", "text": "# 核心术语\n\n这里只解释词义与易混淆的边界；完整规则见[设计索引](../design/README.md)。"}, {"title": "从工作方法到执行", "level": "h2", "anchor": "从工作方法到执行", "text": "## 从工作方法到执行\n\n| 术语 | 含义 |\n| --- | --- |\n| SkillSource / SkillInterpretation | 导入来源 / 一次解释记录；导入不执行来源脚本，重解释不覆盖旧记录 |\n| CapabilityBlueprint | 目标、规则、资源和完成条件的语义来源，不授予 Tool 权限 |\n| RuntimeManifest | 精确版本的运行投影与约束，不用来反推新蓝图 |\n| SkillVersion / ProjectSkillVersion | 内容不可变的发布版 / 项目显式启用关系；发布、启用与 readiness 分开 |\n| Task / ExecutableTask | 从版本投影的可启动工作，不必对应独立数据库表 |\n| SkillComposition | 多 SkillVersion 的展示组合；虚拟角色不是权限角色 |\n| FrontendModuleVersion / ViewSpec | 生成界面版本 / 平台声明式展示；与业务 module API、文档预览分开 |"}, {"title": "资源与权限", "level": "h2", "anchor": "资源与权限", "text": "## 资源与权限\n\n| 术语 | 含义 |\n| --- | --- |\n| Domain / Tool capability | 业务能力名称 / 注册的版本化 Tool 协议，前者不能直接调用后者 |\n| ResourceRequirement / Integration | 抽象资源需求 / 实际 Provider、实例和范围 |\n| ResourceBinding | requirement 到资源的选择；配置与 Run 冻结记录不是同一层 |\n| 内容快照 / 物化副本 | ID/hash/revision / 实际文件；授权固定不等于全部内容已取得 |\n| RunInputSnapshot | Run 级准备回执；READY 绑定完整文件集合，PREPARING 不可使用 |\n| 逻辑 input / 物理世代 | Agent 所见路径 / 平台隔离存储位置，由平台映射 |\n| User / ProjectMember | 账户 / 项目成员关系；账户创建和项目偏好不授予 membership |\n| AuthSession / CSRF | 浏览器会话 / 会话绑定的写请求校验值，不是模型 AgentSession |\n| 账户版本 / 安全事件 | 管理并发版本 / 接受的安全操作；不是在线人数或完整登录日志 |\n| 登录配额 / 退避 | 短期计数 / 有限等待，不等于停用账户或撤销会话 |\n| SecretReference | 外部凭据引用，公开响应不含原值、locator 或密文 |\n| key_version / kek_version | 引用 metadata 版本 / 部署加密密钥版本，均不代表外部凭据已更新 |\n| Readiness | 由 Provider 和配置计算的就绪状态，执行时仍须重新校验权限 |"}, {"title": "一次 Run 内部", "level": "h2", "anchor": "一次-run-内部", "text": "## 一次 Run 内部\n\n```text\nRun（固定目标、权限与输入）\n└── Segment（连续工作；业务答复后追加）\n    └── Attempt（一次技术执行；重试后追加）\n        ├── PRIMARY Session（同一时刻一个活动主会话）\n        └── SUBAGENT Session（有界只读分支）\n```\n\n| 术语 | 含义 |\n| --- | --- |\n| AgentTaskBrief | 该 Segment 的目标、指导、资源与策略快照 |\n| lease / fencing | 限时执行权 / 提交时拒绝失效持有者 |\n| 准备 / wall / job timeout | 分别约束准备、模型等待和 Worker job，不是 Run 累计预算 |\n| 限额 / 预留 / 消耗 | 上限 / 未确认结清的占用 / 已确认用量；usage、cost 和成功状态分别判断 |\n| UserInteraction / ChangeProposal | 普通问题或批准交互 / 具体变更提案；回答、批准与评价不是同一种提交 |\n| EffectExecution | 已批准变更的执行和回读记录，批准不保证远端已经完成 |\n| Evidence / Artifact | 可定位、带版本的事实引用 / 报告或补丁文件 |\n| Result / OutcomeEnvelope | 不可变原结果 / 通用输出包络，执行成功不等于业务判断全对 |\n| Evaluation | 追加式评分和修订，原值来自 Result，不覆盖原结果或续行 Run |\n| Task Flow / Run Flow | 版本化计划 / 实际活动投影，不是第二个执行控制器 |"}, {"title": "创建与调度恢复", "level": "h2", "anchor": "创建与调度恢复", "text": "## 创建与调度恢复\n\n| 术语 | 含义 |\n| --- | --- |\n| Idempotency-Key / 请求身份 | 定位一次提交 / 判断其内容相同；持有键不授予访问权 |\n| 创建重放 | 确认首次创建的 Run，不重新冻结资源或追加执行 |\n| occurrence | 计划触发时刻，不等于 Worker 开始时间或 Run 终态 |\n| missed / overlap | 错过发火 / 重叠跳过；当前重叠判断限于本 Schedule 摘要 |\n| Schedule 摘要 / 触发账本 | 可覆盖的 last_*、run_count / 待完整实现的逐次持久记录 |\n| 在途恢复 / 补跑 | 完成已经认领的一次 / 为过去未处理时刻新造执行，前者不授权后者 |"}], "toc": [{"title": "从工作方法到执行", "anchor": "从工作方法到执行", "level": "h2"}, {"title": "资源与权限", "anchor": "资源与权限", "level": "h2"}, {"title": "一次 Run 内部", "anchor": "一次-run-内部", "level": "h2"}, {"title": "创建与调度恢复", "anchor": "创建与调度恢复", "level": "h2"}], "source": "overview/glossary.md", "checksum": "efbc73b37d55776ccaf2b1b872b31b638dc2ef01dfce72ea55ec3f50008bbf99"}, {"id": "docs/planning/roadmap.md", "title": "Skillmind 实施计划", "group": "planning", "html": "\u003ch1 id=\"skillmind-实施计划\">Skillmind 实施计划\u003c/h1>\n\u003cp>本页维护当前基础、缺口和顺序；规则见\u003ca href=\"#docs/design/README.md::\">设计索引\u003c/a>，代码入口见\u003ca href=\"#docs/development/change-guide.md::\">变更指南\u003c/a>。不记录历次整理或迁移流水。\u003c/p>\n\u003ch2 id=\"当前执行状态\">当前执行状态\u003c/h2>\n\u003cp>核心 Skill/Run/资源/身份/外部效果链已有代码；共享预算、完整管理页面、Task Flow、生成界面及真实环境验收未完成。R01–R13 是稳定任务 ID。\u003c/p>\n\u003ch3 id=\"完成状态的判定\">完成状态的判定\u003c/h3>\n\u003cp>实现须接齐代码、契约、消费者和回归；部署须确认目标镜像、配置、迁移、健康检查与放行。设计可评审不等于功能可用。\u003c/p>\n\u003ch3 id=\"当前证据怎么用\">当前证据怎么用\u003c/h3>\n\u003cp>验收须记录场景、环境、结果及未覆盖范围。mock/fake、真实 DB、浏览器、模型、部署分别举证；skip、旧通过次数和文档构建不关闭功能缺口。\u003c/p>\n\u003ch3 id=\"下一步与当前决策\">下一步与当前决策\u003c/h3>\n\u003col>\n\u003cli>先收口身份/资源边界、Run 停止、共享预算和调度可靠性，再扩大自主执行。\u003c/li>\n\u003cli>完善管理页面的未知结果与上下文隔离，保持账户、答复和评价回归。\u003c/li>\n\u003cli>Task Flow 从只读投影接版本、冻结与事件；生成界面先满足威胁模型和隔离门禁。\u003c/li>\n\u003cli>获准隔离环境后补真实 DB/资源/模型/外部写入/恢复验收，不临时放宽权限。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"开发任务\">开发任务\u003c/h3>\n\u003cp>覆盖 Backend、Web、contracts、Skill 执行资产、工程配置和测试；接续已有组件，不将非目标列为缺失功能。\u003c/p>\n\u003cp>运行基础：\u003ca href=\"#docs/planning/roadmap.md::r01-%E8%B5%84%E6%BA%90%E5%86%BB%E7%BB%93\">R01\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r02-run-%E7%BB%9F%E4%B8%80%E9%A2%84%E7%AE%97\">R02\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">R05\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r07-run-%E4%B8%8E%E5%AE%A1%E8%AE%A1\">R07\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r08-%E5%A4%96%E9%83%A8%E6%95%88%E6%9E%9C\">R08\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r09-%E8%B0%83%E5%BA%A6\">R09\u003c/a>\n产品能力：\u003ca href=\"#docs/planning/roadmap.md::r03-task-flow-%E5%AE%8C%E6%95%B4%E9%93%BE%E8%B7%AF\">R03\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r04-%E7%94%9F%E6%88%90%E6%A8%A1%E5%9D%97\">R04\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r06-skill-%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9F\">R06\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r10-%E5%85%A8%E9%83%A8-web-%E9%A1%B5%E9%9D%A2\">R10\u003c/a>\n交付验收：\u003ca href=\"#docs/planning/roadmap.md::r11-%E8%BF%90%E7%BB%B4%E4%B8%8E%E5%B7%A5%E7%A8%8B%E5%B7%A5%E5%85%B7\">R11\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r12-%E4%B8%9A%E5%8A%A1%E8%B4%A8%E9%87%8F%E9%AA%8C%E6%94%B6\">R12\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::r13-%E5%85%A8%E9%87%8F%E5%A5%91%E7%BA%A6%E4%B8%8E%E6%9C%80%E7%BB%88%E5%AE%A1%E8%AE%A1\">R13\u003c/a>\u003c/p>\n\u003ch4 id=\"r01-资源冻结\">R01 资源冻结\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/resource-snapshots.md::\">资源冻结\u003c/a>、输入回执/世代独占与跨根限额已接；\u003ca href=\"#docs/design/document-lifecycle.md::\">文档\u003c/a>具备有界接收、原授权、存储归属、PUT 前意图/占用、原回执查询及显式停止发布。新旧删除保留清理记录，不双计费；相关记录阻止整项目清空。\u003c/li>\n\u003cli>缺口：精确清理/结算、旧资产迁移、服务端 namespace 身份及真实事务/恢复。\u003c/li>\n\u003cli>门禁：先落实\u003ca href=\"#docs/design/document-lifecycle.md::%E6%8C%81%E4%B9%85%E6%B8%85%E7%90%86%E4%BB%8D%E5%BE%85%E8%A1%A5%E9%BD%90\">存储端封闭前提\u003c/a>；现有 MinIO 策略、客户端 header、DB lease 或停止发布均不证明远端停止。验关闭/发布、未知/取消、同键/同名、占用守恒、授权/引用/配额竞争和存储故障，关联 R05。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r02-run-统一预算\">R02 Run 统一预算\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/run-budgets.md::\">预算\u003c/a>账本、原调用绑定/观察与 Engine 桥接已有代码；首次绑定保存启动所有权，冲突观察先持久化，旧绑定不补造 owner。\u003c/li>\n\u003cli>缺口：已验证 profile、受信停止/未知核对、创建、主子执行与 Worker startup 接线及真实事务/迁移。\u003c/li>\n\u003cli>门禁：新协调器不得凭 RESERVED 重启未知调用；float/终端事件不证明精确计量或停止。验共同预约/结算、并发/未知、跨 Segment/Attempt、旧 Run/混合 Worker/回退和公开投影。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r03-task-flow-完整链路\">R03 Task Flow 完整链路\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/task-flow.md::\">只读 Task 预览\u003c/a>已接精确版本、原来源核验、声明/readiness 分区及数值无损读取/校验/展示；缺失与损坏分开。\u003c/li>\n\u003cli>缺口：Skill 默认预览、版本化 Flow/DRAFT/diff/发布、Run 冻结及事件/待办/证据联动；响应总量/并发内存协议。\u003c/li>\n\u003cli>门禁：不增执行器或缩窄旧数值范围；保持原协议/hash，验大整数/浮点/嵌套 serializer 与浏览器。复用 R06 身份/来源门禁，验三语、历史无 Flow 回退及不可变 Run。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r04-生成模块\">R04 生成模块\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/generated-modules.md::\">生成界面\u003c/a>版本模型和静态前置已有代码，与 SkillComposition 管理分开。\u003c/li>\n\u003cli>缺口：完整构建身份、builder、CSP/安全投放、Host、发布和展示回退。\u003c/li>\n\u003cli>门禁：Preview 也须通过首次执行审查；验依赖/隔离、产物/报告、未知恢复、旧消息拒绝与独立展示回退。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r05-领域与身份安全\">R05 领域与身份安全\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>/\u003ca href=\"#docs/design/login-protection.md::\">登录防护\u003c/a>、\u003ca href=\"#docs/design/user-lifecycle.md::\">账户\u003c/a>与\u003ca href=\"#docs/design/project-lifecycle.md::\">项目\u003c/a>页面已接。成员、项目 CRUD 和普通 Run 创建/确认复核原会话与当前权限；项目有版本冲突/未知核对，新建固定精确启用版本，重放不刷新快照。\u003c/li>\n\u003cli>缺口：独立项目审计、完整删除/blob 清理与真实事务、迁移、Redis/HTTPS 验收；\u003ca href=\"#docs/design/secret-storage.md::\">Secret\u003c/a>恢复边界一并核验。\u003c/li>\n\u003cli>门禁：验最后 ADMIN、改密/撤销/成员/禁用、归档/创建竞争及真实回滚；成员审计、Schedule、文档/上传记录等引用不能用“无 Run”替代。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r06-skill-生命周期\">R06 Skill 生命周期\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/skill-contract.md::\">导入、版本及组合写入\u003c/a>已接原会话/ADMIN 复核；上传有界接收、PUT 前后短事务复核，旧来源不重写。DRAFT/首次发布/预览共用身份、全部 Task/来源门禁，新建/调度/组合共用可用性检查，删除检查全部引用。\u003c/li>\n\u003cli>缺口：\u003ca href=\"#docs/design/skill-interpretation.md::\">异步解释\u003c/a>原请求/Worker/SSE 授权、候选绑定、导入持久回执/存储归属、共享组合管理、同版重新启用审计、跨 Skill 规则组合及真实事务/回滚。\u003c/li>\n\u003cli>门禁：优先接持久原请求、一次模型启动、未知确认及 SSE 组织门禁，内容 key/终态唯一键不替代授权。保持接收/身份/契约/锁等待/引用回归，补撤销、双 ADMIN、启停/废弃竞争及导入/组合恢复；模型质量另验。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r07-run-与审计\">R07 Run 与审计\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>/\u003ca href=\"#docs/design/run-supervision.md::\">监督\u003c/a>已接主子结果、停止分类、取消检查与 Gateway 原 Worker 一次许可；\u003ca href=\"#docs/design/user-interactions.md::\">答复\u003c/a>有原请求确认，\u003ca href=\"#docs/design/results-evaluation.md::\">结果\u003c/a>有不可变 Artifact v2、授权/引用核验及评价原键/资格复核/分页。\u003c/li>\n\u003cli>缺口：持久停止、Session 审计、撤权竞争、真实锁/回滚/接管及迁移/备份恢复。\u003c/li>\n\u003cli>门禁：未决 Tool 不重跑，v1/历史不回填；验答复/批准分路、原 actor/Tool 重放、Artifact 原字节/跨 Run、评价同键/未知、进程退出与 SSE。平台匹配不代替 R08 远端验收。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r08-外部效果\">R08 外部效果\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>已接 Git/SVN、Proposal 与 read-back。\u003c/li>\n\u003cli>缺口：SVN 固定基线、阶段回执、贯穿监督、批准重发及旧 Schema。\u003c/li>\n\u003cli>门禁：内容相同不证明原执行；验精确批准/预授权、CAS、原身份/lease、阶段回执、部分失败与真实外部恢复。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r09-调度\">R09 调度\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/task-scheduling.md::\">调度\u003c/a>已接 ONCE/CRON、持久 occurrence/原键恢复、创建事务内关联/结算、配置版本、独立管理与在途投影；管理复核原会话，ACTIVE 配置与新 Run 固定当前启用版本。\u003c/li>\n\u003cli>缺口：真实撤权/多 Worker 事务、历史迁移、人工处理及迟到策略。\u003c/li>\n\u003cli>门禁：暂停/归档和原 Run 确认不要求任务重新可用；验时间/DST、同 Schedule 重叠、原子配置、在途权、幂等计数、失效来源与兼容，不承诺全局精确一次或停机补跑。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r10-全部-web-页面\">R10 全部 Web 页面\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a>已有精确项目边界及账户/成员/项目/答复共享请求隔离；\u003ca href=\"#docs/design/document-lifecycle.md::\">文档\u003c/a>支持原上传/删除核对与静态预览。结果区分保存时 v1/v2 与模型/平台事实，附件校验字节，评价支持多修订/原回执/分页。\u003c/li>\n\u003cli>缺口：module、批准的完整 mutation/未知隔离，全站服务端筛选/分页、真实会话/存储及跨刷新上传批次恢复。\u003c/li>\n\u003cli>门禁：验防重、期限、切换/晚到、原请求核对、历史排序及三语/键盘/窄屏；真实授权和存储竞争不由 mock 替代。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r11-运维与工程工具\">R11 运维与工程工具\u003c/h4>\n\u003cul>\n\u003cli>基础：\u003ca href=\"#docs/operations/deployment.md::\">发布\u003c/a>统一配置入口与分阶段 load/migrate/api/worker，核对 daemon/project/image/有效配置；迁移拒绝有损审计回退，脚本/fake 回归已接。\u003c/li>\n\u003cli>缺口：统一全实例停写/清理，实际 Docker/Make/PowerShell 与\u003ca href=\"#docs/operations/backup-recovery.md::\">真实恢复\u003c/a>。\u003c/li>\n\u003cli>门禁：验锁定依赖、迁移/回退、完整恢复点/KEK、引用清理与\u003ca href=\"#docs/operations/runbook.md::%E9%80%9A%E5%B8%B8-smoke\">smoke\u003c/a>；操作前核清全部实例、旧队列、cron/recovery/解释写入者，dispatch=false 不是停写证明。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r12-业务质量验收\">R12 业务质量验收\u003c/h4>\n\u003cul>\n\u003cli>缺口：Skill 解释、通用运行链及\u003ca href=\"#docs/design/results-evaluation.md::\">结果评价\u003c/a>的真实质量验收。\u003c/li>\n\u003cli>门禁：获准隔离场景验证规则保真、证据、输出及人工判定；输入与评价答案隔离，fixture 不证明模型质量。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"r13-全量契约与最终审计\">R13 全量契约与最终审计\u003c/h4>\n\u003cul>\n\u003cli>缺口：全项目最终审计；局部通过不关闭其他任务。\u003c/li>\n\u003cli>门禁：逐需求对应代码/\u003ca href=\"#SKM/README.md::contracts\">契约\u003c/a>/消费者/测试，按\u003ca href=\"#SKM/AGENTS.md::\">AGENTS\u003c/a>同步 Schema/example/OpenAPI；真实 DB、浏览器、模型、外部与部署分别举证。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "Skillmind 实施计划", "level": "h1", "anchor": "skillmind-实施计划", "text": "# Skillmind 实施计划\n\n本页维护当前基础、缺口和顺序；规则见[设计索引](../design/README.md)，代码入口见[变更指南](../development/change-guide.md)。不记录历次整理或迁移流水。"}, {"title": "当前执行状态", "level": "h2", "anchor": "当前执行状态", "text": "## 当前执行状态\n\n核心 Skill/Run/资源/身份/外部效果链已有代码；共享预算、完整管理页面、Task Flow、生成界面及真实环境验收未完成。R01–R13 是稳定任务 ID。"}, {"title": "完成状态的判定", "level": "h3", "anchor": "完成状态的判定", "text": "### 完成状态的判定\n\n实现须接齐代码、契约、消费者和回归；部署须确认目标镜像、配置、迁移、健康检查与放行。设计可评审不等于功能可用。"}, {"title": "当前证据怎么用", "level": "h3", "anchor": "当前证据怎么用", "text": "### 当前证据怎么用\n\n验收须记录场景、环境、结果及未覆盖范围。mock/fake、真实 DB、浏览器、模型、部署分别举证；skip、旧通过次数和文档构建不关闭功能缺口。"}, {"title": "下一步与当前决策", "level": "h3", "anchor": "下一步与当前决策", "text": "### 下一步与当前决策\n\n1. 先收口身份/资源边界、Run 停止、共享预算和调度可靠性，再扩大自主执行。\n2. 完善管理页面的未知结果与上下文隔离，保持账户、答复和评价回归。\n3. Task Flow 从只读投影接版本、冻结与事件；生成界面先满足威胁模型和隔离门禁。\n4. 获准隔离环境后补真实 DB/资源/模型/外部写入/恢复验收，不临时放宽权限。"}, {"title": "开发任务", "level": "h3", "anchor": "开发任务", "text": "### 开发任务\n\n覆盖 Backend、Web、contracts、Skill 执行资产、工程配置和测试；接续已有组件，不将非目标列为缺失功能。\n\n运行基础：[R01](#r01-资源冻结) · [R02](#r02-run-统一预算) · [R05](#r05-领域与身份安全) · [R07](#r07-run-与审计) · [R08](#r08-外部效果) · [R09](#r09-调度)\n产品能力：[R03](#r03-task-flow-完整链路) · [R04](#r04-生成模块) · [R06](#r06-skill-生命周期) · [R10](#r10-全部-web-页面)\n交付验收：[R11](#r11-运维与工程工具) · [R12](#r12-业务质量验收) · [R13](#r13-全量契约与最终审计)"}, {"title": "R01 资源冻结", "level": "h4", "anchor": "r01-资源冻结", "text": "#### R01 资源冻结\n\n- 基础：[资源冻结](../design/resource-snapshots.md)、输入回执/世代独占与跨根限额已接；[文档](../design/document-lifecycle.md)具备有界接收、原授权、存储归属、PUT 前意图/占用、原回执查询及显式停止发布。新旧删除保留清理记录，不双计费；相关记录阻止整项目清空。\n- 缺口：精确清理/结算、旧资产迁移、服务端 namespace 身份及真实事务/恢复。\n- 门禁：先落实[存储端封闭前提](../design/document-lifecycle.md#持久清理仍待补齐)；现有 MinIO 策略、客户端 header、DB lease 或停止发布均不证明远端停止。验关闭/发布、未知/取消、同键/同名、占用守恒、授权/引用/配额竞争和存储故障，关联 R05。"}, {"title": "R02 Run 统一预算", "level": "h4", "anchor": "r02-run-统一预算", "text": "#### R02 Run 统一预算\n\n- 基础：[预算](../design/run-budgets.md)账本、原调用绑定/观察与 Engine 桥接已有代码；首次绑定保存启动所有权，冲突观察先持久化，旧绑定不补造 owner。\n- 缺口：已验证 profile、受信停止/未知核对、创建、主子执行与 Worker startup 接线及真实事务/迁移。\n- 门禁：新协调器不得凭 RESERVED 重启未知调用；float/终端事件不证明精确计量或停止。验共同预约/结算、并发/未知、跨 Segment/Attempt、旧 Run/混合 Worker/回退和公开投影。"}, {"title": "R03 Task Flow 完整链路", "level": "h4", "anchor": "r03-task-flow-完整链路", "text": "#### R03 Task Flow 完整链路\n\n- 基础：[只读 Task 预览](../design/task-flow.md)已接精确版本、原来源核验、声明/readiness 分区及数值无损读取/校验/展示；缺失与损坏分开。\n- 缺口：Skill 默认预览、版本化 Flow/DRAFT/diff/发布、Run 冻结及事件/待办/证据联动；响应总量/并发内存协议。\n- 门禁：不增执行器或缩窄旧数值范围；保持原协议/hash，验大整数/浮点/嵌套 serializer 与浏览器。复用 R06 身份/来源门禁，验三语、历史无 Flow 回退及不可变 Run。"}, {"title": "R04 生成模块", "level": "h4", "anchor": "r04-生成模块", "text": "#### R04 生成模块\n\n- 基础：[生成界面](../design/generated-modules.md)版本模型和静态前置已有代码，与 SkillComposition 管理分开。\n- 缺口：完整构建身份、builder、CSP/安全投放、Host、发布和展示回退。\n- 门禁：Preview 也须通过首次执行审查；验依赖/隔离、产物/报告、未知恢复、旧消息拒绝与独立展示回退。"}, {"title": "R05 领域与身份安全", "level": "h4", "anchor": "r05-领域与身份安全", "text": "#### R05 领域与身份安全\n\n- 基础：[认证](../design/authentication.md)/[登录防护](../design/login-protection.md)、[账户](../design/user-lifecycle.md)与[项目](../design/project-lifecycle.md)页面已接。成员、项目 CRUD 和普通 Run 创建/确认复核原会话与当前权限；项目有版本冲突/未知核对，新建固定精确启用版本，重放不刷新快照。\n- 缺口：独立项目审计、完整删除/blob 清理与真实事务、迁移、Redis/HTTPS 验收；[Secret](../design/secret-storage.md)恢复边界一并核验。\n- 门禁：验最后 ADMIN、改密/撤销/成员/禁用、归档/创建竞争及真实回滚；成员审计、Schedule、文档/上传记录等引用不能用“无 Run”替代。"}, {"title": "R06 Skill 生命周期", "level": "h4", "anchor": "r06-skill-生命周期", "text": "#### R06 Skill 生命周期\n\n- 基础：[导入、版本及组合写入](../design/skill-contract.md)已接原会话/ADMIN 复核；上传有界接收、PUT 前后短事务复核，旧来源不重写。DRAFT/首次发布/预览共用身份、全部 Task/来源门禁，新建/调度/组合共用可用性检查，删除检查全部引用。\n- 缺口：[异步解释](../design/skill-interpretation.md)原请求/Worker/SSE 授权、候选绑定、导入持久回执/存储归属、共享组合管理、同版重新启用审计、跨 Skill 规则组合及真实事务/回滚。\n- 门禁：优先接持久原请求、一次模型启动、未知确认及 SSE 组织门禁，内容 key/终态唯一键不替代授权。保持接收/身份/契约/锁等待/引用回归，补撤销、双 ADMIN、启停/废弃竞争及导入/组合恢复；模型质量另验。"}, {"title": "R07 Run 与审计", "level": "h4", "anchor": "r07-run-与审计", "text": "#### R07 Run 与审计\n\n- 基础：[Runtime](../design/agent-runtime.md)/[监督](../design/run-supervision.md)已接主子结果、停止分类、取消检查与 Gateway 原 Worker 一次许可；[答复](../design/user-interactions.md)有原请求确认，[结果](../design/results-evaluation.md)有不可变 Artifact v2、授权/引用核验及评价原键/资格复核/分页。\n- 缺口：持久停止、Session 审计、撤权竞争、真实锁/回滚/接管及迁移/备份恢复。\n- 门禁：未决 Tool 不重跑，v1/历史不回填；验答复/批准分路、原 actor/Tool 重放、Artifact 原字节/跨 Run、评价同键/未知、进程退出与 SSE。平台匹配不代替 R08 远端验收。"}, {"title": "R08 外部效果", "level": "h4", "anchor": "r08-外部效果", "text": "#### R08 外部效果\n\n- 基础：[受控写入](../design/repository-effects.md)已接 Git/SVN、Proposal 与 read-back。\n- 缺口：SVN 固定基线、阶段回执、贯穿监督、批准重发及旧 Schema。\n- 门禁：内容相同不证明原执行；验精确批准/预授权、CAS、原身份/lease、阶段回执、部分失败与真实外部恢复。"}, {"title": "R09 调度", "level": "h4", "anchor": "r09-调度", "text": "#### R09 调度\n\n- 基础：[调度](../design/task-scheduling.md)已接 ONCE/CRON、持久 occurrence/原键恢复、创建事务内关联/结算、配置版本、独立管理与在途投影；管理复核原会话，ACTIVE 配置与新 Run 固定当前启用版本。\n- 缺口：真实撤权/多 Worker 事务、历史迁移、人工处理及迟到策略。\n- 门禁：暂停/归档和原 Run 确认不要求任务重新可用；验时间/DST、同 Schedule 重叠、原子配置、在途权、幂等计数、失效来源与兼容，不承诺全局精确一次或停机补跑。"}, {"title": "R10 全部 Web 页面", "level": "h4", "anchor": "r10-全部-web-页面", "text": "#### R10 全部 Web 页面\n\n- 基础：[Workspace](../design/workspace.md)已有精确项目边界及账户/成员/项目/答复共享请求隔离；[文档](../design/document-lifecycle.md)支持原上传/删除核对与静态预览。结果区分保存时 v1/v2 与模型/平台事实，附件校验字节，评价支持多修订/原回执/分页。\n- 缺口：module、批准的完整 mutation/未知隔离，全站服务端筛选/分页、真实会话/存储及跨刷新上传批次恢复。\n- 门禁：验防重、期限、切换/晚到、原请求核对、历史排序及三语/键盘/窄屏；真实授权和存储竞争不由 mock 替代。"}, {"title": "R11 运维与工程工具", "level": "h4", "anchor": "r11-运维与工程工具", "text": "#### R11 运维与工程工具\n\n- 基础：[发布](../operations/deployment.md)统一配置入口与分阶段 load/migrate/api/worker，核对 daemon/project/image/有效配置；迁移拒绝有损审计回退，脚本/fake 回归已接。\n- 缺口：统一全实例停写/清理，实际 Docker/Make/PowerShell 与[真实恢复](../operations/backup-recovery.md)。\n- 门禁：验锁定依赖、迁移/回退、完整恢复点/KEK、引用清理与[smoke](../operations/runbook.md#通常-smoke)；操作前核清全部实例、旧队列、cron/recovery/解释写入者，dispatch=false 不是停写证明。"}, {"title": "R12 业务质量验收", "level": "h4", "anchor": "r12-业务质量验收", "text": "#### R12 业务质量验收\n\n- 缺口：Skill 解释、通用运行链及[结果评价](../design/results-evaluation.md)的真实质量验收。\n- 门禁：获准隔离场景验证规则保真、证据、输出及人工判定；输入与评价答案隔离，fixture 不证明模型质量。"}, {"title": "R13 全量契约与最终审计", "level": "h4", "anchor": "r13-全量契约与最终审计", "text": "#### R13 全量契约与最终审计\n\n- 缺口：全项目最终审计；局部通过不关闭其他任务。\n- 门禁：逐需求对应代码/[契约](../../SKM/README.md#contracts)/消费者/测试，按[AGENTS](../../SKM/AGENTS.md)同步 Schema/example/OpenAPI；真实 DB、浏览器、模型、外部与部署分别举证。"}], "toc": [{"title": "当前执行状态", "anchor": "当前执行状态", "level": "h2"}, {"title": "完成状态的判定", "anchor": "完成状态的判定", "level": "h3"}, {"title": "当前证据怎么用", "anchor": "当前证据怎么用", "level": "h3"}, {"title": "下一步与当前决策", "anchor": "下一步与当前决策", "level": "h3"}, {"title": "开发任务", "anchor": "开发任务", "level": "h3"}], "source": "planning/roadmap.md", "checksum": "7c154d67be61a24c7951dbcb2b480c041156fcc9c058e3c18780ee0a4767df85"}, {"id": "docs/design/README.md", "title": "設計の読み順と責任分担", "group": "design", "html": "\u003ch1 id=\"設計の読み順と責任分担\">設計の読み順と責任分担\u003c/h1>\n\u003cp>\u003ca href=\"#docs/README.md::\">文書ガイド\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">現在の計画\u003c/a> · \u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>\u003c/p>\n\u003cp>設計は保証すべき規則、\u003ca href=\"#SKM/README.md::contracts\">contracts\u003c/a> は正確な field/type、計画は実装範囲と不足を記す。\u003c/p>\n\u003ch2 id=\"初めて読むとき\">初めて読むとき\u003c/h2>\n\u003cp>全体は\u003ca href=\"#docs/overview/product.md::\">製品\u003c/a> → \u003ca href=\"#docs/overview/architecture.md::\">構成\u003c/a> → \u003ca href=\"#docs/design/domain-model.md::\">領域モデル\u003c/a>。\n一回の実行は\u003ca href=\"#docs/design/run-creation.md::\">作成\u003c/a> → \u003ca href=\"#docs/design/resource-snapshots.md::\">資源\u003c/a> → \u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a> → \u003ca href=\"#docs/design/results-evaluation.md::\">結果\u003c/a>。\u003c/p>\n\u003ch2 id=\"どの設計を変更するか\">どの設計を変更するか\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>正本\u003c/th>\n\u003cth>担当\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/domain-model.md::\">領域モデル\u003c/a>\u003c/td>\n\u003ctd>所有者、主要オブジェクト、永続化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/project-lifecycle.md::\">Project\u003c/a> / \u003ca href=\"#docs/design/document-lifecycle.md::\">文書\u003c/a>\u003c/td>\n\u003ctd>成員・アーカイブ・参照 / upload・配額・清理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/authentication.md::\">認証\u003c/a> / \u003ca href=\"#docs/design/login-protection.md::\">ログイン防護\u003c/a>\u003c/td>\n\u003ctd>Session・CSRF・授権 / 配額・退避\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/user-lifecycle.md::\">ユーザー\u003c/a> / \u003ca href=\"#docs/design/secret-storage.md::\">Secret\u003c/a>\u003c/td>\n\u003ctd>管理・撤銷・監査 / 暗号化・鍵更新\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/skill-contract.md::\">Skill\u003c/a> / \u003ca href=\"#docs/design/skill-interpretation.md::\">解釈\u003c/a>\u003c/td>\n\u003ctd>契約・精確版・有効化 / source・候補・公開\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/run-creation.md::\">Run 作成\u003c/a> / \u003ca href=\"#docs/design/resource-snapshots.md::\">資源快照\u003c/a>\u003c/td>\n\u003ctd>原要求・再送 / 選択・凍結・実 byte\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a> / \u003ca href=\"#docs/design/run-supervision.md::\">監督\u003c/a>\u003c/td>\n\u003ctd>Segment・Attempt・Session・event / 停止・timeout\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/user-interactions.md::\">回答\u003c/a> / \u003ca href=\"#docs/design/results-evaluation.md::\">結果と評価\u003c/a>\u003c/td>\n\u003ctd>答復・期限 / 引用・原値・修訂\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/run-budgets.md::\">予算\u003c/a> / \u003ca href=\"#docs/design/subagents.md::\">子分析\u003c/a>\u003c/td>\n\u003ctd>計量・予約・結算 / 子能力・Session 監査\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a> / \u003ca href=\"#docs/design/task-scheduling.md::\">調度\u003c/a>\u003c/td>\n\u003ctd>Proposal・承認・CAS・read-back / 発火・在途復旧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/workspace.md::\">Workspace\u003c/a> / \u003ca href=\"#docs/design/task-flow.md::\">Task Flow\u003c/a>\u003c/td>\n\u003ctd>画面・入力 / 計画と活動の投影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/design/generated-modules.md::\">生成モジュール\u003c/a>\u003c/td>\n\u003ctd>構築 identity・隔離・Host・表示回退\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"境界をまたぐ変更の読み方\">境界をまたぐ変更の読み方\u003c/h2>\n\u003cp>一つの規則は一つの正本に置き、関連設計はリンクで参照する。\n権限・契約・永続化・消費側にまたがる変更は\u003ca href=\"#docs/development/contract-workflow.md::\">同期と版互換\u003c/a>を確認する。\u003c/p>\n", "sections": [{"title": "設計の読み順と責任分担", "level": "h1", "anchor": "設計の読み順と責任分担", "text": "# 設計の読み順と責任分担\n\n[文書ガイド](../README.md) · [現在の計画](../planning/roadmap.md#当前执行状态) · [変更ガイド](../development/change-guide.md)\n\n設計は保証すべき規則、[contracts](../../SKM/README.md#contracts) は正確な field/type、計画は実装範囲と不足を記す。"}, {"title": "初めて読むとき", "level": "h2", "anchor": "初めて読むとき", "text": "## 初めて読むとき\n\n全体は[製品](../overview/product.md) → [構成](../overview/architecture.md) → [領域モデル](domain-model.md)。\n一回の実行は[作成](run-creation.md) → [資源](resource-snapshots.md) → [Runtime](agent-runtime.md) → [結果](results-evaluation.md)。"}, {"title": "どの設計を変更するか", "level": "h2", "anchor": "どの設計を変更するか", "text": "## どの設計を変更するか\n\n| 正本 | 担当 |\n| --- | --- |\n| [領域モデル](domain-model.md) | 所有者、主要オブジェクト、永続化 |\n| [Project](project-lifecycle.md) / [文書](document-lifecycle.md) | 成員・アーカイブ・参照 / upload・配額・清理 |\n| [認証](authentication.md) / [ログイン防護](login-protection.md) | Session・CSRF・授権 / 配額・退避 |\n| [ユーザー](user-lifecycle.md) / [Secret](secret-storage.md) | 管理・撤銷・監査 / 暗号化・鍵更新 |\n| [Skill](skill-contract.md) / [解釈](skill-interpretation.md) | 契約・精確版・有効化 / source・候補・公開 |\n| [Run 作成](run-creation.md) / [資源快照](resource-snapshots.md) | 原要求・再送 / 選択・凍結・実 byte |\n| [Runtime](agent-runtime.md) / [監督](run-supervision.md) | Segment・Attempt・Session・event / 停止・timeout |\n| [回答](user-interactions.md) / [結果と評価](results-evaluation.md) | 答復・期限 / 引用・原値・修訂 |\n| [予算](run-budgets.md) / [子分析](subagents.md) | 計量・予約・結算 / 子能力・Session 監査 |\n| [受控写入](repository-effects.md) / [調度](task-scheduling.md) | Proposal・承認・CAS・read-back / 発火・在途復旧 |\n| [Workspace](workspace.md) / [Task Flow](task-flow.md) | 画面・入力 / 計画と活動の投影 |\n| [生成モジュール](generated-modules.md) | 構築 identity・隔離・Host・表示回退 |"}, {"title": "境界をまたぐ変更の読み方", "level": "h2", "anchor": "境界をまたぐ変更の読み方", "text": "## 境界をまたぐ変更の読み方\n\n一つの規則は一つの正本に置き、関連設計はリンクで参照する。\n権限・契約・永続化・消費側にまたがる変更は[同期と版互換](../development/contract-workflow.md)を確認する。"}], "toc": [{"title": "初めて読むとき", "anchor": "初めて読むとき", "level": "h2"}, {"title": "どの設計を変更するか", "anchor": "どの設計を変更するか", "level": "h2"}, {"title": "境界をまたぐ変更の読み方", "anchor": "境界をまたぐ変更の読み方", "level": "h2"}], "source": "design/README.md", "checksum": "95af66bb269fd8f3019e0f7886aa216d1f9b68d249a707153da2b512f51b924d"}, {"id": "docs/design/domain-model.md", "title": "领域模型与权限", "group": "design", "html": "\u003ch1 id=\"领域模型与权限\">领域模型与权限\u003c/h1>\n\u003cp>本页是实体与边界地图，术语见\u003ca href=\"#docs/overview/glossary.md::\">词汇表\u003c/a>，状态见\u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">计划\u003c/a>。详细协议由各专题维护，不把特定业务字段固化为通用模型。\u003c/p>\n\u003ch2 id=\"建模原则\">建模原则\u003c/h2>\n\u003cul>\n\u003cli>Skill 定义目标/资源/规则/产物，不授权；平台固定跨 Skill 控制协议，不预定义全部业务 Schema。\u003c/li>\n\u003cli>Organization 保存可复用资产，Project 显式启用精确版本并绑定资源。\u003c/li>\n\u003cli>Run 固定目标/权限；业务续行追加 Segment，技术恢复追加 Attempt，模型 Session 仅是执行载体。\u003c/li>\n\u003cli>发布内容、Run snapshot、Result 不变；答复、评价、批准和审计独立追加。\u003c/li>\n\u003cli>外部写入经 propose → 批准/适用预授权 → 执行 → 回读，模型建议不成为权限。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"组织项目与资源\">组织、项目与资源\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Organization\u003c/td>\n\u003ctd>组织隔离；当前单组织，不代表多租户登录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User / AuthSession\u003c/td>\n\u003ctd>ADMIN/USER、ACTIVE/DISABLED；会话保存 hash、期限、撤销、凭据版/登录角色，不是 AgentSession\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UserSecurityEvent\u003c/td>\n\u003ctd>账户安全审计，不是登录尝试或 RunEvent\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Project / ProjectMember\u003c/td>\n\u003ctd>项目边界及 ACTIVE/REMOVED 关系，无 Project ADMIN 角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectMemberEvent\u003c/td>\n\u003ctd>关系变更与原 actor/request 同事务审计，不补造历史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integration\u003c/td>\n\u003ctd>项目版本化 Provider 资源/scope；内置文档无需 Integration 行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SecretReference\u003c/td>\n\u003ctd>凭据定位，MANAGED 材料独立加密，原值不进 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectDocument\u003c/td>\n\u003ctd>元数据/blob，是 ProjectKnowledge 的实际载体，非自动同步或独立知识索引\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"#docs/design/project-lifecycle.md::\">项目\u003c/a>负责成员/偏好/归档/删除；归档不停止 Run，移除成员不撤销全部会话，本组织 ADMIN 不依赖 membership。\u003ca href=\"#docs/design/user-lifecycle.md::\">用户管理\u003c/a>和\u003ca href=\"#docs/design/authentication.md::%E4%BC%9A%E8%AF%9D%E5%87%AD%E6%8D%AE-v2-%E4%B8%8E%E5%88%87%E6%8D%A2%E8%A6%81%E6%B1%82\">会话 v2\u003c/a>负责账户/凭据。\u003c/p>\n\u003cp>SkillSource/Interpretation/Version/Manifest 归组织；同版跨 Project 复用须分别显式启用精确 PUBLISHED，发布不自动启用/升级，readiness 独立计算且不增加权限。\u003c/p>\n\u003ch2 id=\"skill-导入解释与发布\">Skill 导入、解释与发布\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>SkillSource\u003c/td>\n\u003ctd>不可变目录/附件/metadata/hash/文件索引\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillInterpretation\u003c/td>\n\u003ctd>追加解释与 parent lineage\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CapabilityBlueprint\u003c/td>\n\u003ctd>能力/目标/资源/规则/交付/交互/效果及来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ResourceRequirement / OutcomeDefinition\u003c/td>\n\u003ctd>抽象资源与交付/证据要求，不绑 Secret\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill / SkillVersion\u003c/td>\n\u003ctd>稳定身份 / 冻结版本；状态与内容分开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RuntimeManifest\u003c/td>\n\u003ctd>冻结蓝图/Tool/Task 与可选业务 Schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkillComposition / ProjectComposition\u003c/td>\n\u003ctd>精确版本展示组合/项目关联，不是角色或编排器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectSkillVersion\u003c/td>\n\u003ctd>精确 PUBLISHED 启停记录，当前停用关系不可重新启用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>新领域 capability 不要求注册，真实 Tool 调用才须注册 versioned capability。缺资源/GUIDANCE_ONLY 不豁免蓝图和发布门禁。发布、启用、readiness、具体批准分别判断，见\u003ca href=\"#docs/design/skill-contract.md::%E5%8F%91%E5%B8%83%E4%B8%8E%E5%B0%B1%E7%BB%AA%E7%9A%84%E5%88%A4%E6%96%AD%E9%A1%BA%E5%BA%8F\">Skill 契约\u003c/a>、\u003ca href=\"#docs/design/skill-interpretation.md::\">解释实现\u003c/a>。\u003c/p>\n\u003ch2 id=\"任务run-与会话\">任务、Run 与会话\u003c/h2>\n\u003ch3 id=\"任务定义\">任务定义\u003c/h3>\n\u003cp>ExecutableTask 从精确发布蓝图投影，task_id 服务端生成，无独立 task 表。ResourceBinding 绑定 Integration/文档/用户输入，在创建时冻结；AgentTaskBriefSnapshot 按 Segment 保存原 Skill、目标、规则、资源/权限和交付。\u003c/p>\n\u003cp>TaskSchedule 固定版本/输入/选择规则，ONCE/CRON 每次经普通创建服务生成 Run，必带 IANA timezone，见\u003ca href=\"#docs/design/task-scheduling.md::\">调度\u003c/a>。\u003c/p>\n\u003ch3 id=\"执行对象\">执行对象\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">Run：目标、版本、权限与资源\n├── Segment 1：初始工作\n│   ├── Attempt 1：领取\n│   └── Attempt 2：同段技术恢复\n├── Segment 2：答复/效果后的业务续行\n├── RunInputSnapshot：整个 Run 的准备回执\n├── 主 AgentSession：顺序 resume/fork/replace\n│   └── SUBAGENT / BRANCH：受限只读并行\n└── Result / Evidence / Artifact / Interaction / Proposal / 审计\n\u003c/code>\u003c/pre>\n\u003cp>Brief、Run 输入回执、Attempt lease 不是同一 checksum 对象。输入完整恢复见\u003ca href=\"#docs/design/resource-snapshots.md::\">资源快照\u003c/a>，主/子/续行共享计量见\u003ca href=\"#docs/design/run-budgets.md::\">预算\u003c/a>；内部实体存在不代表消费者已接齐。\u003c/p>\n\u003cp>RunStep 只是 STEP_* 事件投影，无独立表。RunEvent 是追加审计/SSE 来源；TEXT_DELTA 可用 sequence 而不持久化，欠号不自动表示事件丢失。\u003c/p>\n\u003ch3 id=\"用户交互与外部效果\">用户交互与外部效果\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>不可混淆的事实\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>UserInteraction / InteractionResponse\u003c/td>\n\u003ctd>问题/期限/版本及原答复；\u003ca href=\"#docs/design/user-interactions.md::\">普通答复\u003c/a>与必须关联 Proposal 的 EFFECT_APPROVAL 分路\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ChangeProposal / Approval / EffectExecution\u003c/td>\n\u003ctd>精确变更、决定、真实执行/回读；APPROVED 不证明 APPLIED 或已续行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Result\u003c/td>\n\u003ctd>最多一个终态原始结果；失败/取消可无 Result，SUCCEEDED 不证明业务完整\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence / Artifact\u003c/td>\n\u003ctd>引用格式、对象可访问、实际内容须分别验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evaluation\u003c/td>\n\u003ctd>多条修订均相对原 Result，不顺次覆盖，见\u003ca href=\"#docs/design/results-evaluation.md::\">结果\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"核心字段与实际载体\">核心字段与实际载体\u003c/h2>\n\u003cp>完整字段以 \u003ca href=\"../SKM/backend/src/skillmind/db/models.py\">models\u003c/a>、\u003ca href=\"../SKM/contracts\">Schema\u003c/a>、route/\u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a>为准；概念不必有同名表。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>领域\u003c/th>\n\u003cth>持久入口 / 说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>账户\u003c/td>\n\u003ctd>users、auth_sessions、user_security_events；row_version 不覆盖偏好/登录时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目/资源\u003c/td>\n\u003ctd>projects、project_members/events、integrations、resource_bindings、project_documents；项目版本只覆盖 metadata/归档，DB/blob 分别提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill\u003c/td>\n\u003ctd>skill_sources/interpretations、skills/versions、runtime_manifests；Blueprint 内嵌解释/Manifest\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>凭据\u003c/td>\n\u003ctd>secret_references、managed_secret_material；key_version 与 kek_version 不同层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务配置\u003c/td>\n\u003ctd>project_skill_versions、组合表、task_schedules；单行启停不是历次审计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行\u003c/td>\n\u003ctd>runs、run_skill_snapshots、run_segments/attempts、agent_task_brief_snapshots\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session\u003c/td>\n\u003ctd>agent_sessions/transcripts/entries；transcript 镜像不代替业务事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输入/预算\u003c/td>\n\u003ctd>run_input_snapshots、run_budget_accounts/reservations/receipts；接入状态见所属专题/计划\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交互/效果\u003c/td>\n\u003ctd>user_interactions/responses、change_proposals/approvals、effect_executions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结果/事件\u003c/td>\n\u003ctd>run_results、evaluations、evidence、run_events、outbox_messages；Artifact 不假设独立表\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>frontend_module_versions 属\u003ca href=\"#docs/design/generated-modules.md::\">生成展示\u003c/a>，不是 SkillComposition，构建/投放/Host 尚未接通。Run 创建意图位于 task_snapshot_json.creation_request，与运行快照身份不同；按\u003ca href=\"#docs/design/run-creation.md::\">创建协议\u003c/a>兼容，不回填请求。\u003c/p>\n\u003ch2 id=\"权限模型\">权限模型\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>ADMIN\u003c/th>\n\u003cth>USER\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>管理用户/成员/Integration/Secret\u003c/td>\n\u003ctd>本组织\u003c/td>\n\u003ctd>禁止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本人账户/安全历史/改密/撤销\u003c/td>\n\u003ctd>本人\u003c/td>\n\u003ctd>本人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>导入/解释/发布/废弃 Skill、版本启停\u003c/td>\n\u003ctd>本组织\u003c/td>\n\u003ctd>禁止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务、Run/结果、评价\u003c/td>\n\u003ctd>仍受项目及业务硬约束\u003c/td>\n\u003ctd>活动成员及业务条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>普通答复\u003c/td>\n\u003ctd>Project 写权限、交互版本/期限\u003c/td>\n\u003ctd>同左\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部批准\u003c/td>\n\u003ctd>system ADMIN\u003c/td>\n\u003ctd>有 Project 写权限的 Run 发起人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>低风险预授权\u003c/td>\n\u003ctd>精确 scope，排除 repository.write\u003c/td>\n\u003ctd>禁止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除审计\u003c/td>\n\u003ctd>禁止，独立保留策略清理除外\u003c/td>\n\u003ctd>禁止\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>判定依次为平台硬拒绝 → 当前身份/成员 → Project 策略/Integration scope → Skill/Task 要求 → Run 冻结上限 → Tool 参数 → 精确批准/适用预授权。后层不覆盖前层拒绝，用户文本/模型建议不扩权。\u003c/p>\n\u003ch2 id=\"状态与不变量\">状态与不变量\u003c/h2>\n\u003ch3 id=\"状态流转\">状态流转\u003c/h3>\n\u003cp>SkillInterpretation：ANALYZING → PREVIEW_READY → SUPERSEDED，失败 FAILED；SkillVersion：DRAFT → PUBLISHED → DEPRECATED，废弃不复活。readiness 的 GUIDANCE_ONLY/CONFIGURATION_REQUIRED/RUNNABLE/ACTIONABLE 不替代发布状态。\u003c/p>\n\u003cp>Proposal 的 DRAFT/PENDING_APPROVAL、APPROVED/APPLYING/APPLIED 与 REJECTED/STALE/FAILED，和 EffectExecution 的 REQUESTED/LEASED/APPLYING/APPLIED、失败/重试分别记录，见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。\u003c/p>\n\u003ch3 id=\"run-状态速查\">Run 状态速查\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>事件\u003c/th>\n\u003cth>Run / 执行变化\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>首次启动\u003c/td>\n\u003ctd>QUEUED → PREPARING → RUNNING；初始 Segment，claim 创建 LEASED Attempt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等待用户/批准\u003c/td>\n\u003ctd>WAITING_FOR_INPUT/WAITING_FOR_APPROVAL；Segment WAITING、Attempt DEFERRED、释放 lease\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有效答复/独立期限处理\u003c/td>\n\u003ctd>追加 Segment、重新 QUEUED，不覆盖答复/批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可恢复 lease 失效\u003c/td>\n\u003ctd>RETRY_PENDING → PREPARING；原 Attempt LEASE_EXPIRED，同段追加 Attempt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结束\u003c/td>\n\u003ctd>SUCCEEDED/FAILED/CANCELLED；terminal RUN_SNAPSHOT，终态不重开\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>enum/转换以 \u003ca href=\"../SKM/backend/src/skillmind/runs/domain.py\">runs/domain.py\u003c/a>为准，WAITING_PERMISSION 仅旧协议兼容。RUNNING 可先于物化，不证明输入 READY/Session 启动；取消受理、终态、进程退出和结清分别确认。\u003c/p>\n\u003ch3 id=\"执行不变量\">执行不变量\u003c/h3>\n\u003cul>\n\u003cli>等待释放 lease、不计 engine wall timeout；普通过期以 INTERACTION_TIMEOUT 新段携带缺失事实，不代答；批准过期不调用 Provider。\u003c/li>\n\u003cli>业务续行加 Segment、可恢复失 lease 加 Attempt；engine wall timeout 为 FAILED，不泛化重试。\u003c/li>\n\u003cli>aggregate 锁 Run → Segment → Attempt 或 Proposal/Interaction/Effect，不先锁子对象。\u003c/li>\n\u003cli>PostgreSQL 为正本，状态/Outbox 同事务、消费幂等，terminal RUN_SNAPSHOT 为最后持久事件。\u003c/li>\n\u003cli>改目标/项目/精确版/权限上限/已用资源须新 Run；Session 变化不扩冻结边界。\u003c/li>\n\u003cli>主/子/续行预算共享、Provider 参数/批准/并发幂等与 read-back 仍须按\u003ca href=\"#docs/design/run-budgets.md::\">预算\u003c/a>及\u003ca href=\"#docs/design/repository-effects.md::\">效果\u003c/a>协议验证，局部限制不代替完整保证。\u003c/li>\n\u003cli>Result 不变，Evaluation 只追加。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"实施兼容说明\">实施兼容说明\u003c/h2>\n\u003cp>新 Run 显式 Segment 1/immutable binding；旧 Run 仅隐式段只读投影，不造历史。旧版本/Run/结果保留审计，不把业务专用 Schema/seed/renderer 恢复为平台规则。\u003c/p>\n\u003cp>模型、migration、repository、契约与 Web 成套核对；真实锁/回滚、历史重放、删除引用与跨 Project 拒绝分别举证。\u003c/p>\n", "sections": [{"title": "领域模型与权限", "level": "h1", "anchor": "领域模型与权限", "text": "# 领域模型与权限\n\n本页是实体与边界地图，术语见[词汇表](../overview/glossary.md)，状态见[计划](../planning/roadmap.md#当前执行状态)。详细协议由各专题维护，不把特定业务字段固化为通用模型。"}, {"title": "建模原则", "level": "h2", "anchor": "建模原则", "text": "## 建模原则\n\n- Skill 定义目标/资源/规则/产物，不授权；平台固定跨 Skill 控制协议，不预定义全部业务 Schema。\n- Organization 保存可复用资产，Project 显式启用精确版本并绑定资源。\n- Run 固定目标/权限；业务续行追加 Segment，技术恢复追加 Attempt，模型 Session 仅是执行载体。\n- 发布内容、Run snapshot、Result 不变；答复、评价、批准和审计独立追加。\n- 外部写入经 propose → 批准/适用预授权 → 执行 → 回读，模型建议不成为权限。"}, {"title": "组织、项目与资源", "level": "h2", "anchor": "组织项目与资源", "text": "## 组织、项目与资源\n\n| 对象 | 责任 |\n| --- | --- |\n| Organization | 组织隔离；当前单组织，不代表多租户登录 |\n| User / AuthSession | ADMIN/USER、ACTIVE/DISABLED；会话保存 hash、期限、撤销、凭据版/登录角色，不是 AgentSession |\n| UserSecurityEvent | 账户安全审计，不是登录尝试或 RunEvent |\n| Project / ProjectMember | 项目边界及 ACTIVE/REMOVED 关系，无 Project ADMIN 角色 |\n| ProjectMemberEvent | 关系变更与原 actor/request 同事务审计，不补造历史 |\n| Integration | 项目版本化 Provider 资源/scope；内置文档无需 Integration 行 |\n| SecretReference | 凭据定位，MANAGED 材料独立加密，原值不进 Run |\n| ProjectDocument | 元数据/blob，是 ProjectKnowledge 的实际载体，非自动同步或独立知识索引 |\n\n[项目](project-lifecycle.md)负责成员/偏好/归档/删除；归档不停止 Run，移除成员不撤销全部会话，本组织 ADMIN 不依赖 membership。[用户管理](user-lifecycle.md)和[会话 v2](authentication.md#会话凭据-v2-与切换要求)负责账户/凭据。\n\nSkillSource/Interpretation/Version/Manifest 归组织；同版跨 Project 复用须分别显式启用精确 PUBLISHED，发布不自动启用/升级，readiness 独立计算且不增加权限。"}, {"title": "Skill 导入、解释与发布", "level": "h2", "anchor": "skill-导入解释与发布", "text": "## Skill 导入、解释与发布\n\n| 对象 | 责任 |\n| --- | --- |\n| SkillSource | 不可变目录/附件/metadata/hash/文件索引 |\n| SkillInterpretation | 追加解释与 parent lineage |\n| CapabilityBlueprint | 能力/目标/资源/规则/交付/交互/效果及来源 |\n| ResourceRequirement / OutcomeDefinition | 抽象资源与交付/证据要求，不绑 Secret |\n| Skill / SkillVersion | 稳定身份 / 冻结版本；状态与内容分开 |\n| RuntimeManifest | 冻结蓝图/Tool/Task 与可选业务 Schema |\n| SkillComposition / ProjectComposition | 精确版本展示组合/项目关联，不是角色或编排器 |\n| ProjectSkillVersion | 精确 PUBLISHED 启停记录，当前停用关系不可重新启用 |\n\n新领域 capability 不要求注册，真实 Tool 调用才须注册 versioned capability。缺资源/GUIDANCE_ONLY 不豁免蓝图和发布门禁。发布、启用、readiness、具体批准分别判断，见[Skill 契约](skill-contract.md#发布与就绪的判断顺序)、[解释实现](skill-interpretation.md)。"}, {"title": "任务、Run 与会话", "level": "h2", "anchor": "任务run-与会话", "text": "## 任务、Run 与会话"}, {"title": "任务定义", "level": "h3", "anchor": "任务定义", "text": "### 任务定义\n\nExecutableTask 从精确发布蓝图投影，task_id 服务端生成，无独立 task 表。ResourceBinding 绑定 Integration/文档/用户输入，在创建时冻结；AgentTaskBriefSnapshot 按 Segment 保存原 Skill、目标、规则、资源/权限和交付。\n\nTaskSchedule 固定版本/输入/选择规则，ONCE/CRON 每次经普通创建服务生成 Run，必带 IANA timezone，见[调度](task-scheduling.md)。"}, {"title": "执行对象", "level": "h3", "anchor": "执行对象", "text": "### 执行对象\n\n```text\nRun：目标、版本、权限与资源\n├── Segment 1：初始工作\n│   ├── Attempt 1：领取\n│   └── Attempt 2：同段技术恢复\n├── Segment 2：答复/效果后的业务续行\n├── RunInputSnapshot：整个 Run 的准备回执\n├── 主 AgentSession：顺序 resume/fork/replace\n│   └── SUBAGENT / BRANCH：受限只读并行\n└── Result / Evidence / Artifact / Interaction / Proposal / 审计\n```\n\nBrief、Run 输入回执、Attempt lease 不是同一 checksum 对象。输入完整恢复见[资源快照](resource-snapshots.md)，主/子/续行共享计量见[预算](run-budgets.md)；内部实体存在不代表消费者已接齐。\n\nRunStep 只是 STEP_* 事件投影，无独立表。RunEvent 是追加审计/SSE 来源；TEXT_DELTA 可用 sequence 而不持久化，欠号不自动表示事件丢失。"}, {"title": "用户交互与外部效果", "level": "h3", "anchor": "用户交互与外部效果", "text": "### 用户交互与外部效果\n\n| 对象 | 不可混淆的事实 |\n| --- | --- |\n| UserInteraction / InteractionResponse | 问题/期限/版本及原答复；[普通答复](user-interactions.md)与必须关联 Proposal 的 EFFECT_APPROVAL 分路 |\n| ChangeProposal / Approval / EffectExecution | 精确变更、决定、真实执行/回读；APPROVED 不证明 APPLIED 或已续行 |\n| Result | 最多一个终态原始结果；失败/取消可无 Result，SUCCEEDED 不证明业务完整 |\n| Evidence / Artifact | 引用格式、对象可访问、实际内容须分别验证 |\n| Evaluation | 多条修订均相对原 Result，不顺次覆盖，见[结果](results-evaluation.md) |"}, {"title": "核心字段与实际载体", "level": "h2", "anchor": "核心字段与实际载体", "text": "## 核心字段与实际载体\n\n完整字段以 [models](../../SKM/backend/src/skillmind/db/models.py)、[Schema](../../SKM/contracts/)、route/[OpenAPI](../../SKM/contracts/openapi/skillmind-api.v1.json)为准；概念不必有同名表。\n\n| 领域 | 持久入口 / 说明 |\n| --- | --- |\n| 账户 | users、auth_sessions、user_security_events；row_version 不覆盖偏好/登录时间 |\n| 项目/资源 | projects、project_members/events、integrations、resource_bindings、project_documents；项目版本只覆盖 metadata/归档，DB/blob 分别提交 |\n| Skill | skill_sources/interpretations、skills/versions、runtime_manifests；Blueprint 内嵌解释/Manifest |\n| 凭据 | secret_references、managed_secret_material；key_version 与 kek_version 不同层 |\n| 任务配置 | project_skill_versions、组合表、task_schedules；单行启停不是历次审计 |\n| 执行 | runs、run_skill_snapshots、run_segments/attempts、agent_task_brief_snapshots |\n| Session | agent_sessions/transcripts/entries；transcript 镜像不代替业务事实 |\n| 输入/预算 | run_input_snapshots、run_budget_accounts/reservations/receipts；接入状态见所属专题/计划 |\n| 交互/效果 | user_interactions/responses、change_proposals/approvals、effect_executions |\n| 结果/事件 | run_results、evaluations、evidence、run_events、outbox_messages；Artifact 不假设独立表 |\n\nfrontend_module_versions 属[生成展示](generated-modules.md)，不是 SkillComposition，构建/投放/Host 尚未接通。Run 创建意图位于 task_snapshot_json.creation_request，与运行快照身份不同；按[创建协议](run-creation.md)兼容，不回填请求。"}, {"title": "权限模型", "level": "h2", "anchor": "权限模型", "text": "## 权限模型\n\n| 操作 | ADMIN | USER |\n| --- | --- | --- |\n| 管理用户/成员/Integration/Secret | 本组织 | 禁止 |\n| 本人账户/安全历史/改密/撤销 | 本人 | 本人 |\n| 导入/解释/发布/废弃 Skill、版本启停 | 本组织 | 禁止 |\n| 任务、Run/结果、评价 | 仍受项目及业务硬约束 | 活动成员及业务条件 |\n| 普通答复 | Project 写权限、交互版本/期限 | 同左 |\n| 外部批准 | system ADMIN | 有 Project 写权限的 Run 发起人 |\n| 低风险预授权 | 精确 scope，排除 repository.write | 禁止 |\n| 删除审计 | 禁止，独立保留策略清理除外 | 禁止 |\n\n判定依次为平台硬拒绝 → 当前身份/成员 → Project 策略/Integration scope → Skill/Task 要求 → Run 冻结上限 → Tool 参数 → 精确批准/适用预授权。后层不覆盖前层拒绝，用户文本/模型建议不扩权。"}, {"title": "状态与不变量", "level": "h2", "anchor": "状态与不变量", "text": "## 状态与不变量"}, {"title": "状态流转", "level": "h3", "anchor": "状态流转", "text": "### 状态流转\n\nSkillInterpretation：ANALYZING → PREVIEW_READY → SUPERSEDED，失败 FAILED；SkillVersion：DRAFT → PUBLISHED → DEPRECATED，废弃不复活。readiness 的 GUIDANCE_ONLY/CONFIGURATION_REQUIRED/RUNNABLE/ACTIONABLE 不替代发布状态。\n\nProposal 的 DRAFT/PENDING_APPROVAL、APPROVED/APPLYING/APPLIED 与 REJECTED/STALE/FAILED，和 EffectExecution 的 REQUESTED/LEASED/APPLYING/APPLIED、失败/重试分别记录，见[受控写入](repository-effects.md)。"}, {"title": "Run 状态速查", "level": "h3", "anchor": "run-状态速查", "text": "### Run 状态速查\n\n| 事件 | Run / 执行变化 |\n| --- | --- |\n| 首次启动 | QUEUED → PREPARING → RUNNING；初始 Segment，claim 创建 LEASED Attempt |\n| 等待用户/批准 | WAITING_FOR_INPUT/WAITING_FOR_APPROVAL；Segment WAITING、Attempt DEFERRED、释放 lease |\n| 有效答复/独立期限处理 | 追加 Segment、重新 QUEUED，不覆盖答复/批准 |\n| 可恢复 lease 失效 | RETRY_PENDING → PREPARING；原 Attempt LEASE_EXPIRED，同段追加 Attempt |\n| 结束 | SUCCEEDED/FAILED/CANCELLED；terminal RUN_SNAPSHOT，终态不重开 |\n\nenum/转换以 [runs/domain.py](../../SKM/backend/src/skillmind/runs/domain.py)为准，WAITING_PERMISSION 仅旧协议兼容。RUNNING 可先于物化，不证明输入 READY/Session 启动；取消受理、终态、进程退出和结清分别确认。"}, {"title": "执行不变量", "level": "h3", "anchor": "执行不变量", "text": "### 执行不变量\n\n- 等待释放 lease、不计 engine wall timeout；普通过期以 INTERACTION_TIMEOUT 新段携带缺失事实，不代答；批准过期不调用 Provider。\n- 业务续行加 Segment、可恢复失 lease 加 Attempt；engine wall timeout 为 FAILED，不泛化重试。\n- aggregate 锁 Run → Segment → Attempt 或 Proposal/Interaction/Effect，不先锁子对象。\n- PostgreSQL 为正本，状态/Outbox 同事务、消费幂等，terminal RUN_SNAPSHOT 为最后持久事件。\n- 改目标/项目/精确版/权限上限/已用资源须新 Run；Session 变化不扩冻结边界。\n- 主/子/续行预算共享、Provider 参数/批准/并发幂等与 read-back 仍须按[预算](run-budgets.md)及[效果](repository-effects.md)协议验证，局部限制不代替完整保证。\n- Result 不变，Evaluation 只追加。"}, {"title": "实施兼容说明", "level": "h2", "anchor": "实施兼容说明", "text": "## 实施兼容说明\n\n新 Run 显式 Segment 1/immutable binding；旧 Run 仅隐式段只读投影，不造历史。旧版本/Run/结果保留审计，不把业务专用 Schema/seed/renderer 恢复为平台规则。\n\n模型、migration、repository、契约与 Web 成套核对；真实锁/回滚、历史重放、删除引用与跨 Project 拒绝分别举证。"}], "toc": [{"title": "建模原则", "anchor": "建模原则", "level": "h2"}, {"title": "组织、项目与资源", "anchor": "组织项目与资源", "level": "h2"}, {"title": "Skill 导入、解释与发布", "anchor": "skill-导入解释与发布", "level": "h2"}, {"title": "任务、Run 与会话", "anchor": "任务run-与会话", "level": "h2"}, {"title": "任务定义", "anchor": "任务定义", "level": "h3"}, {"title": "执行对象", "anchor": "执行对象", "level": "h3"}, {"title": "用户交互与外部效果", "anchor": "用户交互与外部效果", "level": "h3"}, {"title": "核心字段与实际载体", "anchor": "核心字段与实际载体", "level": "h2"}, {"title": "权限模型", "anchor": "权限模型", "level": "h2"}, {"title": "状态与不变量", "anchor": "状态与不变量", "level": "h2"}, {"title": "状态流转", "anchor": "状态流转", "level": "h3"}, {"title": "Run 状态速查", "anchor": "run-状态速查", "level": "h3"}, {"title": "执行不变量", "anchor": "执行不变量", "level": "h3"}, {"title": "实施兼容说明", "anchor": "实施兼容说明", "level": "h2"}], "source": "design/domain-model.md", "checksum": "33bc379869261cd37c2d0c0898432793c88c78a71a904cb27e2dc495f9e82d68"}, {"id": "docs/design/project-lifecycle.md", "title": "项目、成员与归档边界", "group": "design", "html": "\u003ch1 id=\"项目成员与归档边界\">项目、成员与归档边界\u003c/h1>\n\u003cp>本页定义项目身份、成员、选择、归档与删除。账户、执行停止、资产清理分别见\u003ca href=\"#docs/design/authentication.md::\">认证\u003c/a>、\u003ca href=\"#docs/design/run-supervision.md::\">执行监督\u003c/a>、\u003ca href=\"#docs/design/document-lifecycle.md::\">文档资产\u003c/a>；缺口集中在\u003ca href=\"#docs/planning/roadmap.md::r05-%E9%A2%86%E5%9F%9F%E4%B8%8E%E8%BA%AB%E4%BB%BD%E5%AE%89%E5%85%A8\">计划 R05\u003c/a>。\u003c/p>\n\u003ch2 id=\"一个例子归档不是停止或删除\">一个例子：归档不是停止或删除\u003c/h2>\n\u003cp>归档 P 后，默认活动列表不再展示，新建 Run/回答/批准被拒绝；授权历史仍可读，Run、成员、Schedule、附件不会一并停止或删除。恢复保留原 ID/key/配置，不恢复已移除成员或 ERROR Schedule，不补跑错过触发。停止、移除成员、归档与物理删除是独立操作。\u003c/p>\n\u003ch2 id=\"项目身份与成员资格\">项目身份与成员资格\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Project\u003c/td>\n\u003ctd>organization_id 隔离；project_id 是身份，组织内 key 唯一，归档仍占 key\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectMember\u003c/td>\n\u003ctd>ACTIVE/REMOVED 关系，无 Project ADMIN/OWNER 角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User\u003c/td>\n\u003ctd>ACTIVE/DISABLED、ADMIN/USER；建账户不自动入项目\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectSkillVersion\u003c/td>\n\u003ctd>启用精确版本，不授予成员或系统权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>本组织 ADMIN 不依赖 membership，移除其关系不撤销 ADMIN 权限；跨组织仍拒绝。USER 后续请求重验账户/会话与 ACTIVE 关系，不改旧 Run 身份/权限/结果，也不保证已有 SSE 立即结束。\u003c/p>\n\u003ch3 id=\"成员管理的现状与目标\">成员管理的现状与目标\u003c/h3>\n\u003cp>ADMIN 可列出、添加同组织 ACTIVE 用户、移除成员。列表含 ACTIVE/REMOVED，无分页和独立账户状态；membership ACTIVE 不能显示为账户已启用，响应仅公开白名单并 no-store。\u003c/p>\n\u003cp>重新添加 REMOVED 复用行、刷新 joined_at；重复添加 ACTIVE 返回原行且不追加事件，重复移除为 404。允许移除已停用用户关系，不改变账户。\u003c/p>\n\u003cp>写入锁序为 Organization → User（actor/target 去重排序）→ 原 AuthSession → Project → ProjectMember。锁后及 flush 后取新时间复核原会话、ADMIN/CSRF，持锁检查目标 ACTIVE，锁保持到提交；凭据校验复用\u003ca href=\"#docs/design/user-lifecycle.md::%E4%BA%8B%E5%8A%A1%E4%B8%8E%E5%B9%B6%E5%8F%91\">用户事务\u003c/a>。偏好写入、项目删除也先取同一组织 gate，避免 User/Project 反向锁环。\u003c/p>\n\u003cp>关系变更与 project_member_events 原子提交：组织/项目/关系/目标/actor、ADDED/REMOVED、前后 status/joined_at、服务器 request UUID/时间；不存密码或任意正文。0033 不回填历史，任意事件阻止降级丢表。request UUID 不是幂等键；尚无成员审计查询 API，当前关系不证明原操作结果。\u003c/p>\n\u003ch3 id=\"成员管理页面\">成员管理页面\u003c/h3>\n\u003cp>仅 ADMIN 的成员页签管理精确授权项目；归档可读/移除，不可添加。候选复用组织账户服务端搜索/分页并显示角色/状态，不过滤首页冒充全量；成员另显关系状态及 ADMIN 例外。\u003c/p>\n\u003cp>每次写入确认原项目/用户并同步防重。超时、断连、abort、损坏成功响应均为未知，不重放、不以当前关系符合目标推断成功。用户重读原成员列表和精确账户均成功后，才可人工解除新写门禁，解除不执行原动作。\u003c/p>\n\u003cp>页签切换或同项目资格刷新保留未知；资格重验暂停交互并把在途写中断视为未知。换 actor/项目或离页隔离旧请求，不承诺跨刷新恢复。\u003c/p>\n\u003ch2 id=\"项目选择与失效链接\">项目选择与失效链接\u003c/h2>\n\u003cp>preference 仅记录上次选择，不是授权。服务端返回当前可访问的 ACTIVE preference，否则 null；旧引用可保留，删项目才显式清理。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>进入方式\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>URL 无项目\u003c/td>\n\u003ctd>首次选有效 preference/活动首项；空项目保留平台入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>URL 明确无效/无权项目\u003c/td>\n\u003ctd>保留原目标、统一不可访问，不静默换项目\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主动切换/资格失效\u003c/td>\n\u003ctd>隔离草稿、阻止新提交、丢弃旧响应，不迁移未知写入\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"../SKM/web/src/App.tsx\">App\u003c/a>经 \u003ca href=\"../SKM/web/src/hooks/useProjectContext.ts\">useProjectContext\u003c/a>独立读列表、偏好、精确详情。空值/重复参数/非法 UUID 不算“未指定”；目标一旦确定，列表变化、归档或重读不换目标。\u003c/p>\n\u003cp>每次进入页面/切换/重读均有独立请求身份和等待上限，详情确认前不挂载业务页；返回曾访问 ID 不复用旧授权。主动切换清旧 Run/Task 参数，只有确认 ACTIVE 才存偏好。\u003c/p>\n\u003cp>列表、偏好与详情失败独立呈现：详情成功不隐藏列表失败，偏好失败不丢列表，授权归档仍可读。前端检查不替代逐请求服务端授权，也不承诺实时推送撤权。\u003c/p>\n\u003ch2 id=\"归档的实际边界\">归档的实际边界\u003c/h2>\n\u003cp>归档/恢复保留配置；同版同状态不增版/时间，不调用 Run/Schedule/Integration/Session 停止服务。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>入口\u003c/th>\n\u003cth>边界与专题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>列表/preference、历史\u003c/td>\n\u003ctd>默认 ACTIVE；include_archived 及精确详情可读授权归档，活动选择器不是完整审计入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ProjectWriteActor\u003c/td>\n\u003ctd>409 project_archived：创建、回答、评价、批准、Schedule 修改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 创建/确认\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/run-creation.md::%E5%88%9B%E5%BB%BA%E4%B8%8E%E7%A1%AE%E8%AE%A4%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">业务事务\u003c/a>重验原会话、当前 Project/成员，已有同键也不绕过归档\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 取消\u003c/td>\n\u003ctd>WriteActor + Run 项目访问，不要求 ACTIVE；受理不证明停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMIN 维护\u003c/td>\n\u003ctd>编辑、归档/恢复、删除、移除成员独立用例；新增成员要求 ACTIVE，否则 404\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schedule\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/task-scheduling.md::%E7%AE%A1%E7%90%86%E5%86%99%E5%85%A5%E7%9A%84%E6%8E%88%E6%9D%83%E4%BA%8B%E5%8A%A1\">保存\u003c/a>及发火/原 Run 关联均在各自事务复核当前资格；归档不立即改成 PAUSED\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组合\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/skill-contract.md::%E5%85%B1%E4%BA%AB%E6%9B%B4%E6%96%B0%E4%B8%8E%E5%88%A0%E9%99%A4%E7%9A%84%E5%8C%BA%E5%88%AB\">保存/解绑\u003c/a>要求原 ADMIN/ACTIVE；不等于全局删除或替其他项目启用版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/document-lifecycle.md::\">上传/删除\u003c/a>有原资格、占用和清理协议；原上传查询允许授权归档读取，清理/结算未完成\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"并发修改不能只看有无行锁\">并发修改不能只看有无行锁\u003c/h3>\n\u003cp>项目 CRUD 的 DB/API/Web 使用同一版本协议：\u003c/p>\n\u003cul>\n\u003cli>row_version 为 1–2147483647，仅覆盖 metadata/归档，不覆盖成员、偏好、资源/Run，也不是审计。\u003c/li>\n\u003cli>PATCH 必带原 expected_row_version 和至少一个非 null 可修改字段；归档/恢复 POST 正文、DELETE query 均必带版本。缺失/非法为 422，不补当前值。\u003c/li>\n\u003cli>创建/修改/归档/恢复/删除按 Organization → User → 原 AuthSession → Project，锁后及 flush 后取新时间复核原 ADMIN/CSRF，持锁至提交。\u003c/li>\n\u003cli>先验版本再判 no-op/删除前置。旧版同值也返回 409 project_version_conflict；同版无变化不增版/时间，有变化只增一次。上限后有变化为 409 project_version_exhausted，不回绕。\u003c/li>\n\u003cli>列表/详情必带版本并 no-store；key 冲突不是创建幂等，删除 204、越权/不存在 404。版本通过不免除归档、引用或审计门禁。\u003c/li>\n\u003c/ul>\n\u003cp>页面固定原 ID/key/版本与非敏感草稿，同步防重。冲突后精确重读，展示原值/草稿/当前值；人工采用新版本后须另行提交，不能自动改版重放。\u003c/p>\n\u003cp>未知先核对原目标：既有项目读精确 ID，创建读含归档的完整列表并比较原 key。404/无匹配只说明当前未发现，目标值相符也不证明原请求成功。成功读取或精确 project_not_found 404 后，用户可人工解除新写门禁；解除不重发，删除未知不按同 key 重建。\u003c/p>\n\u003cp>页签/列表刷新不消除未知，换 actor/项目或离页不迁移原动作，不承诺跨刷新恢复。首次无参数默认选择不算人工切换，不清创建草稿/确认/未知。独立 metadata/归档审计载体尚未完整定义，不伪造历史或削弱现有审计保护。\u003c/p>\n\u003cp>0034 给旧项目版本 1，不代表旧修改次数。新旧 API/Web 不混跑；降级前全实例停写并停止旧页面/在途请求，任意版本 \u0026gt; 1 拒绝丢列。\u003c/p>\n\u003ch2 id=\"删除与数据保留\">删除与数据保留\u003c/h2>\n\u003cp>仅当前 ADMIN 按上述事务先验原版本，再检查全部前置；拒绝必须先于任何关系删除。通过后清 preference 和列举配置，删除项目返回 204。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阻止条件\u003c/th>\n\u003cth>Problem code\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>未归档\u003c/td>\n\u003ctd>project_delete_requires_archive\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任意 Run\u003c/td>\n\u003ctd>project_delete_blocked_by_runs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任意状态/发火/认领阶段 Schedule\u003c/td>\n\u003ctd>project_delete_blocked_by_schedules\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成员变更审计\u003c/td>\n\u003ctd>project_delete_blocked_by_member_audit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文档、上传意图或清理记录，含元数据已删\u003c/td>\n\u003ctd>project_delete_blocked_by_document_uploads\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>默认保留归档项目；这不是回收站，retention_days 只是配置，不自动授权清理。已有检查仍需补全冻结/在途引用与并发验证；持久清理尚无可靠结算，不能删要求/占用换取项目可删。\u003c/p>\n\u003ch3 id=\"删除门禁的修正要求\">删除门禁的修正要求\u003c/h3>\n\u003col>\n\u003cli>物理删除须证明无执行、审计、冻结输入和在途引用；暂停/归档/未触发 Schedule 也保护，不删审计释放 key。\u003c/li>\n\u003cli>新增引用、旧 Worker/恢复共用锁或条件提交，防检查后新增；关系删除同事务回滚，不拆 RESTRICT 或扩大 CASCADE。\u003c/li>\n\u003cli>新旧文档均走\u003ca href=\"#docs/design/document-lifecycle.md::%E5%88%A0%E9%99%A4%E4%B8%8E%E5%8E%86%E5%8F%B2%E5%BC%95%E7%94%A8\">单文件资产协议\u003c/a>，精确字节清理/回执/恢复独立于 DB；整项目不清空占用。\u003c/li>\n\u003cli>冲突同步 Problem/OpenAPI/client/三语，不把任意 DB 异常归为“有 Run”；未知不自动重删或重建。\u003c/li>\n\u003c/ol>\n\u003cp>归档恢复与\u003ca href=\"#docs/operations/backup-recovery.md::\">备份恢复\u003c/a>不同。\u003c/p>\n\u003ch2 id=\"开发接续与验收\">开发接续与验收\u003c/h2>\n\u003cp>入口：\u003ca href=\"../SKM/backend/src/skillmind/projects\">项目实现\u003c/a>、\u003ca href=\"../SKM/web/src/pages/ProjectsPage.tsx\">ProjectsPage\u003c/a>、\u003ca href=\"#SKM/README.md::contracts\">契约\u003c/a>。验证成员/账户与 ADMIN 例外、跨组织、版本/未知、精确链接/切换/防重，以及归档/创建/调度/删除竞争和审计回滚。\u003c/p>\n\u003cp>实组件覆盖三语/键盘/窄屏；真实事务、完整引用与字节清理另验，module 配置不由 CRUD 回归证明。删除探针只用于获准专用目标。\u003c/p>\n", "sections": [{"title": "项目、成员与归档边界", "level": "h1", "anchor": "项目成员与归档边界", "text": "# 项目、成员与归档边界\n\n本页定义项目身份、成员、选择、归档与删除。账户、执行停止、资产清理分别见[认证](authentication.md)、[执行监督](run-supervision.md)、[文档资产](document-lifecycle.md)；缺口集中在[计划 R05](../planning/roadmap.md#r05-领域与身份安全)。"}, {"title": "一个例子：归档不是停止或删除", "level": "h2", "anchor": "一个例子归档不是停止或删除", "text": "## 一个例子：归档不是停止或删除\n\n归档 P 后，默认活动列表不再展示，新建 Run/回答/批准被拒绝；授权历史仍可读，Run、成员、Schedule、附件不会一并停止或删除。恢复保留原 ID/key/配置，不恢复已移除成员或 ERROR Schedule，不补跑错过触发。停止、移除成员、归档与物理删除是独立操作。"}, {"title": "项目身份与成员资格", "level": "h2", "anchor": "项目身份与成员资格", "text": "## 项目身份与成员资格\n\n| 对象 | 边界 |\n| --- | --- |\n| Project | organization_id 隔离；project_id 是身份，组织内 key 唯一，归档仍占 key |\n| ProjectMember | ACTIVE/REMOVED 关系，无 Project ADMIN/OWNER 角色 |\n| User | ACTIVE/DISABLED、ADMIN/USER；建账户不自动入项目 |\n| ProjectSkillVersion | 启用精确版本，不授予成员或系统权限 |\n\n本组织 ADMIN 不依赖 membership，移除其关系不撤销 ADMIN 权限；跨组织仍拒绝。USER 后续请求重验账户/会话与 ACTIVE 关系，不改旧 Run 身份/权限/结果，也不保证已有 SSE 立即结束。"}, {"title": "成员管理的现状与目标", "level": "h3", "anchor": "成员管理的现状与目标", "text": "### 成员管理的现状与目标\n\nADMIN 可列出、添加同组织 ACTIVE 用户、移除成员。列表含 ACTIVE/REMOVED，无分页和独立账户状态；membership ACTIVE 不能显示为账户已启用，响应仅公开白名单并 no-store。\n\n重新添加 REMOVED 复用行、刷新 joined_at；重复添加 ACTIVE 返回原行且不追加事件，重复移除为 404。允许移除已停用用户关系，不改变账户。\n\n写入锁序为 Organization → User（actor/target 去重排序）→ 原 AuthSession → Project → ProjectMember。锁后及 flush 后取新时间复核原会话、ADMIN/CSRF，持锁检查目标 ACTIVE，锁保持到提交；凭据校验复用[用户事务](user-lifecycle.md#事务与并发)。偏好写入、项目删除也先取同一组织 gate，避免 User/Project 反向锁环。\n\n关系变更与 project_member_events 原子提交：组织/项目/关系/目标/actor、ADDED/REMOVED、前后 status/joined_at、服务器 request UUID/时间；不存密码或任意正文。0033 不回填历史，任意事件阻止降级丢表。request UUID 不是幂等键；尚无成员审计查询 API，当前关系不证明原操作结果。"}, {"title": "成员管理页面", "level": "h3", "anchor": "成员管理页面", "text": "### 成员管理页面\n\n仅 ADMIN 的成员页签管理精确授权项目；归档可读/移除，不可添加。候选复用组织账户服务端搜索/分页并显示角色/状态，不过滤首页冒充全量；成员另显关系状态及 ADMIN 例外。\n\n每次写入确认原项目/用户并同步防重。超时、断连、abort、损坏成功响应均为未知，不重放、不以当前关系符合目标推断成功。用户重读原成员列表和精确账户均成功后，才可人工解除新写门禁，解除不执行原动作。\n\n页签切换或同项目资格刷新保留未知；资格重验暂停交互并把在途写中断视为未知。换 actor/项目或离页隔离旧请求，不承诺跨刷新恢复。"}, {"title": "项目选择与失效链接", "level": "h2", "anchor": "项目选择与失效链接", "text": "## 项目选择与失效链接\n\npreference 仅记录上次选择，不是授权。服务端返回当前可访问的 ACTIVE preference，否则 null；旧引用可保留，删项目才显式清理。\n\n| 进入方式 | 要求 |\n| --- | --- |\n| URL 无项目 | 首次选有效 preference/活动首项；空项目保留平台入口 |\n| URL 明确无效/无权项目 | 保留原目标、统一不可访问，不静默换项目 |\n| 主动切换/资格失效 | 隔离草稿、阻止新提交、丢弃旧响应，不迁移未知写入 |\n\n[App](../../SKM/web/src/App.tsx)经 [useProjectContext](../../SKM/web/src/hooks/useProjectContext.ts)独立读列表、偏好、精确详情。空值/重复参数/非法 UUID 不算“未指定”；目标一旦确定，列表变化、归档或重读不换目标。\n\n每次进入页面/切换/重读均有独立请求身份和等待上限，详情确认前不挂载业务页；返回曾访问 ID 不复用旧授权。主动切换清旧 Run/Task 参数，只有确认 ACTIVE 才存偏好。\n\n列表、偏好与详情失败独立呈现：详情成功不隐藏列表失败，偏好失败不丢列表，授权归档仍可读。前端检查不替代逐请求服务端授权，也不承诺实时推送撤权。"}, {"title": "归档的实际边界", "level": "h2", "anchor": "归档的实际边界", "text": "## 归档的实际边界\n\n归档/恢复保留配置；同版同状态不增版/时间，不调用 Run/Schedule/Integration/Session 停止服务。\n\n| 入口 | 边界与专题 |\n| --- | --- |\n| 列表/preference、历史 | 默认 ACTIVE；include_archived 及精确详情可读授权归档，活动选择器不是完整审计入口 |\n| ProjectWriteActor | 409 project_archived：创建、回答、评价、批准、Schedule 修改 |\n| Run 创建/确认 | [业务事务](run-creation.md#创建与确认的授权事务)重验原会话、当前 Project/成员，已有同键也不绕过归档 |\n| Run 取消 | WriteActor + Run 项目访问，不要求 ACTIVE；受理不证明停止 |\n| ADMIN 维护 | 编辑、归档/恢复、删除、移除成员独立用例；新增成员要求 ACTIVE，否则 404 |\n| Schedule | [保存](task-scheduling.md#管理写入的授权事务)及发火/原 Run 关联均在各自事务复核当前资格；归档不立即改成 PAUSED |\n| 组合 | [保存/解绑](skill-contract.md#共享更新与删除的区别)要求原 ADMIN/ACTIVE；不等于全局删除或替其他项目启用版本 |\n| 文档 | [上传/删除](document-lifecycle.md)有原资格、占用和清理协议；原上传查询允许授权归档读取，清理/结算未完成 |"}, {"title": "并发修改不能只看有无行锁", "level": "h3", "anchor": "并发修改不能只看有无行锁", "text": "### 并发修改不能只看有无行锁\n\n项目 CRUD 的 DB/API/Web 使用同一版本协议：\n\n- row_version 为 1–2147483647，仅覆盖 metadata/归档，不覆盖成员、偏好、资源/Run，也不是审计。\n- PATCH 必带原 expected_row_version 和至少一个非 null 可修改字段；归档/恢复 POST 正文、DELETE query 均必带版本。缺失/非法为 422，不补当前值。\n- 创建/修改/归档/恢复/删除按 Organization → User → 原 AuthSession → Project，锁后及 flush 后取新时间复核原 ADMIN/CSRF，持锁至提交。\n- 先验版本再判 no-op/删除前置。旧版同值也返回 409 project_version_conflict；同版无变化不增版/时间，有变化只增一次。上限后有变化为 409 project_version_exhausted，不回绕。\n- 列表/详情必带版本并 no-store；key 冲突不是创建幂等，删除 204、越权/不存在 404。版本通过不免除归档、引用或审计门禁。\n\n页面固定原 ID/key/版本与非敏感草稿，同步防重。冲突后精确重读，展示原值/草稿/当前值；人工采用新版本后须另行提交，不能自动改版重放。\n\n未知先核对原目标：既有项目读精确 ID，创建读含归档的完整列表并比较原 key。404/无匹配只说明当前未发现，目标值相符也不证明原请求成功。成功读取或精确 project_not_found 404 后，用户可人工解除新写门禁；解除不重发，删除未知不按同 key 重建。\n\n页签/列表刷新不消除未知，换 actor/项目或离页不迁移原动作，不承诺跨刷新恢复。首次无参数默认选择不算人工切换，不清创建草稿/确认/未知。独立 metadata/归档审计载体尚未完整定义，不伪造历史或削弱现有审计保护。\n\n0034 给旧项目版本 1，不代表旧修改次数。新旧 API/Web 不混跑；降级前全实例停写并停止旧页面/在途请求，任意版本 > 1 拒绝丢列。"}, {"title": "删除与数据保留", "level": "h2", "anchor": "删除与数据保留", "text": "## 删除与数据保留\n\n仅当前 ADMIN 按上述事务先验原版本，再检查全部前置；拒绝必须先于任何关系删除。通过后清 preference 和列举配置，删除项目返回 204。\n\n| 阻止条件 | Problem code |\n| --- | --- |\n| 未归档 | project_delete_requires_archive |\n| 任意 Run | project_delete_blocked_by_runs |\n| 任意状态/发火/认领阶段 Schedule | project_delete_blocked_by_schedules |\n| 成员变更审计 | project_delete_blocked_by_member_audit |\n| 文档、上传意图或清理记录，含元数据已删 | project_delete_blocked_by_document_uploads |\n\n默认保留归档项目；这不是回收站，retention_days 只是配置，不自动授权清理。已有检查仍需补全冻结/在途引用与并发验证；持久清理尚无可靠结算，不能删要求/占用换取项目可删。"}, {"title": "删除门禁的修正要求", "level": "h3", "anchor": "删除门禁的修正要求", "text": "### 删除门禁的修正要求\n\n1. 物理删除须证明无执行、审计、冻结输入和在途引用；暂停/归档/未触发 Schedule 也保护，不删审计释放 key。\n2. 新增引用、旧 Worker/恢复共用锁或条件提交，防检查后新增；关系删除同事务回滚，不拆 RESTRICT 或扩大 CASCADE。\n3. 新旧文档均走[单文件资产协议](document-lifecycle.md#删除与历史引用)，精确字节清理/回执/恢复独立于 DB；整项目不清空占用。\n4. 冲突同步 Problem/OpenAPI/client/三语，不把任意 DB 异常归为“有 Run”；未知不自动重删或重建。\n\n归档恢复与[备份恢复](../operations/backup-recovery.md)不同。"}, {"title": "开发接续与验收", "level": "h2", "anchor": "开发接续与验收", "text": "## 开发接续与验收\n\n入口：[项目实现](../../SKM/backend/src/skillmind/projects/)、[ProjectsPage](../../SKM/web/src/pages/ProjectsPage.tsx)、[契约](../../SKM/README.md#contracts)。验证成员/账户与 ADMIN 例外、跨组织、版本/未知、精确链接/切换/防重，以及归档/创建/调度/删除竞争和审计回滚。\n\n实组件覆盖三语/键盘/窄屏；真实事务、完整引用与字节清理另验，module 配置不由 CRUD 回归证明。删除探针只用于获准专用目标。"}], "toc": [{"title": "一个例子：归档不是停止或删除", "anchor": "一个例子归档不是停止或删除", "level": "h2"}, {"title": "项目身份与成员资格", "anchor": "项目身份与成员资格", "level": "h2"}, {"title": "成员管理的现状与目标", "anchor": "成员管理的现状与目标", "level": "h3"}, {"title": "成员管理页面", "anchor": "成员管理页面", "level": "h3"}, {"title": "项目选择与失效链接", "anchor": "项目选择与失效链接", "level": "h2"}, {"title": "归档的实际边界", "anchor": "归档的实际边界", "level": "h2"}, {"title": "并发修改不能只看有无行锁", "anchor": "并发修改不能只看有无行锁", "level": "h3"}, {"title": "删除与数据保留", "anchor": "删除与数据保留", "level": "h2"}, {"title": "删除门禁的修正要求", "anchor": "删除门禁的修正要求", "level": "h3"}, {"title": "开发接续与验收", "anchor": "开发接续与验收", "level": "h2"}], "source": "design/project-lifecycle.md", "checksum": "477e909c7d969b41601ea40729aae8c692
