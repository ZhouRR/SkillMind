uation を確認する。"}, {"title": "Image 移送と更新", "level": "h2", "anchor": "image-移送と更新", "text": "## Image 移送と更新\n\nWindows PowerShell の `PJM/` で `./scripts/export-images.ps1` を実行する。Python 3.12 が必要で、必要なら -PythonCommand に executable を指定する。既定出力は `images/projectmind-images.tar`。script は既存 image を保存するだけで build/pull せず、存在しない第三者 image を除外することがある。archive と実 image ID/checksum を受控清単に記録する。context path を変える場合は Web も再 build する。\n\n転送後は[公開・移行](deployment.md#迁移前置与执行)へ進む。make deploy は help のみで、load/migrate/api/worker を個別に進める。旧 image は削除せず、各段階の失敗時に自動復旧・後続起動をしない。"}, {"title": "操作の区別", "level": "h2", "anchor": "操作の区別", "text": "## 操作の区別\n\n`make` は状態表示、`make stop` は container を保持して停止、`make down` は container/network を削除して永続 volume を保持する。起動・更新・全初期化は上記の異なる操作であり、相互の代用にしない。"}], "toc": [{"title": "Compose の前提", "anchor": "compose-の前提", "level": "h2"}, {"title": "最初の ADMIN を作成する", "anchor": "最初の-admin-を作成する", "level": "h2"}, {"title": "最初の業務実行", "anchor": "最初の業務実行", "level": "h2"}, {"title": "Image 移送と更新", "anchor": "image-移送と更新", "level": "h2"}, {"title": "操作の区別", "anchor": "操作の区別", "level": "h2"}], "source": "operations/quickstart.md", "checksum": "70ca0ec227e359bdd9c49daa14263e5bf2476e4e519cd62f072646cfad63598d"}, {"id": "docs/operations/deployment.md", "title": "发布、迁移与分阶段放行", "group": "operations", "html": "\u003ch1 id=\"发布迁移与分阶段放行\">发布、迁移与分阶段放行\u003c/h1>\n\u003cp>已有环境的发布手册。首次准备见\u003ca href=\"#docs/operations/quickstart.md::\">启动\u003c/a>，恢复资产与数据库替换见\u003ca href=\"#docs/operations/backup-recovery.md::\">备份恢复\u003c/a>。命令在目标部署目录 \u003ccode>PJM/\u003c/code> 执行；先确认环境、维护窗口、版本与负责人，未知目标不试运行。\u003c/p>\n\u003ch2 id=\"先分清四种操作\">先分清四种操作\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>config / preflight\u003c/td>\n\u003ctd>配置解析 / DB migration 与 Redis PING，不证明业务就绪\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>build / export / load\u003c/td>\n\u003ctd>构建镜像 / 打包本地镜像 / 导入 archive，不是备份或应用验收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>migration\u003c/td>\n\u003ctd>改变 DB；失败后查实际 revision，不用 stamp 掩盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>启动 / 放行\u003c/td>\n\u003ctd>进程启动可能消费旧工作；后台恢复和普通业务开放分别批准\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"一个例子关闭-dispatch-后仍有工作\">一个例子：关闭 dispatch 后仍有工作\u003c/h2>\n\u003cp>已入 Redis 的 Effect 和即将到期的 Schedule，不会因 \u003ccode>PROJECTMIND_WORKER_DISPATCH_ENABLED=false\u003c/code> 自动停止：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>入口\u003c/th>\n\u003cth>false 时的实际行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Outbox relay\u003c/td>\n\u003ctd>不选择新的 Run/Effect dispatch topic，lifecycle 通知仍可配送\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已入队 Run/Effect job\u003c/td>\n\u003ctd>仍可进入 claim/executor；不检查该开关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schedule / recovery cron\u003c/td>\n\u003ctd>仍可创建 Run、处理期限和恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill 解释/调整 job\u003c/td>\n\u003ctd>独立入口，仍可能调用模型\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>入口见 \u003ca href=\"../PJM/backend/src/projectmind/worker/settings.py\">WorkerSettings\u003c/a>。开关不是维护模式，不终止远端请求；修改环境文件也不使现有进程即时重载。停写需阻止全部业务入口/触发、处理在途工作并确认所有实例的 API/Worker 写入者停止。远端结果未知时隔离并按\u003ca href=\"#docs/operations/runbook.md::incident-%E4%B8%8E-recovery\">原 Effect 身份对账\u003c/a>，不换键重做。\u003c/p>\n\u003ch2 id=\"环境文件与配置边界\">环境文件与配置边界\u003c/h2>\n\u003cp>\u003ca href=\"../PJM/Makefile\">Makefile\u003c/a> 和镜像导出统一调用 \u003ca href=\"../PJM/scripts/compose.py\">compose.py\u003c/a>。宿主需要 Python 3.12 标准库，无需 Backend 依赖；Windows 导出可指定 Python executable。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选择\u003c/th>\n\u003cth>唯一来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>环境文件\u003c/td>\n\u003ctd>显式 \u003ccode>--env-file\u003c/code> → shell \u003ccode>ENV_FILE\u003c/code> → \u003ccode>PJM/.env\u003c/code>，解析为同一绝对文件路径，供插值和 API/Worker/migrate 的 env_file 使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compose project\u003c/td>\n\u003ctd>显式 \u003ccode>--project-name\u003c/code> → shell \u003ccode>COMPOSE_PROJECT_NAME\u003c/code> → projectmind；\u003cstrong>文件内同名变量不选择目标\u003c/strong>，旧的非默认部署须显式指定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compose 文件 / 目录\u003c/td>\n\u003ctd>固定本套代码的 compose.yaml / PJM；拒绝旁路 file、project、profile 选择器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>应用镜像\u003c/td>\n\u003ctd>普通入口固定默认 tag；发布入口显式 pin Backend/Web 的完整 sha256 image ID，三 Backend service 共用同一 ID\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>例如 \u003ccode>python3 scripts/compose.py --env-file /controlled/config/app.env --project-name approved-project -- config --quiet\u003c/code>。相对文件路径按 \u003ccode>PJM/\u003c/code> 解析，不受调用目录漂移影响；缺失/空路径拒绝，不回退另一文件。不要手设内部 \u003ccode>PJM_COMPOSE_ENV_FILE\u003c/code> 或绕过入口直接调用 Compose；compose.yaml 在缺少该来源时拒绝解析。\u003c/p>\n\u003cp>普通 shell 变量仍优先于文件的插值，service.environment 优先于 env_file；不解析或 source dotenv 来改变 Docker 语义。切换 ENV_FILE 不会自动改写数据库 URL、容器、已运行进程或外部资源，仍须逐项核对目标。详见 \u003ca href=\"https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/\">Compose 插值规则\u003c/a>和 \u003ca href=\"https://docs.docker.com/reference/compose-file/services/#env_file\">env_file\u003c/a>。\u003c/p>\n\u003cp>日常校验用 \u003ccode>make config\u003c/code>（quiet），不是业务就绪证明。完整 config、config --environment、容器 env/inspect 可能泄露 Secret，不贴共享报告。发布工具内部比较有效环境，但不输出值或保存配置副本。\u003c/p>\n\u003ch2 id=\"迁移前置与执行\">迁移前置与执行\u003c/h2>\n\u003cp>先完成独立环境验收，取得\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E6%81%A2%E5%A4%8D%E7%82%B9%E5%8C%85%E5%90%AB%E4%BB%80%E4%B9%88\">一致恢复点\u003c/a>，保留前后 image ID/archive；API/Worker/migrate/Web 使用经过验证的兼容组合。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">恢复点 → 全实例停写/在途对账 → 加载镜像 → 查 revision/head\n  → 单独迁移 → API/Web 核对 → 批准恢复后台 → 验收 → 普通入口放行\n\u003c/code>\u003c/pre>\n\u003cp>发布分为四个独立命令，不把前一阶段成功文件当作放行凭证。先从受控发布清单取得并确认以下变量；不要将示例身份照抄到真实环境：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变量\u003c/th>\n\u003cth>确认内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ENV_FILE / COMPOSE_PROJECT_NAME\u003c/td>\n\u003ctd>已批准的配置文件和目标项目，后续各命令保持一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DAEMON_ID\u003c/td>\n\u003ctd>目标 \u003ccode>docker info --format '{{.ID}}'\u003c/code>，同名项目不能跨 daemon 复用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BACKEND_IMAGE_ID / WEB_IMAGE_ID\u003c/td>\n\u003ctd>经验证的完整 \u003ccode>sha256:…\u003c/code> image ID，不是 tag、短 hash 或 registry manifest digest\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IMAGE_ARCHIVE / ARCHIVE_SHA256\u003c/td>\n\u003ctd>可信 Docker save tar 与已核实的完整文件 checksum；只读受控保存，不允许并发改写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MAINTENANCE_CONFIRMED=1\u003c/td>\n\u003ctd>恢复点、全部实例停写/在途对账、普通入口关闭、独占维护责任均已人工确认\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ccode>make deploy\u003c/code> 只显示帮助，无状态变化。确认后逐个执行，不拼成自动继续的命令链：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make deploy-load\nmake deploy-migrate\n\u003c/code>\u003c/pre>\n\u003cp>也可直接用 \u003ccode>python3 scripts/deploy.py \u0026lt;phase\u0026gt; --help\u003c/code> 查看等价参数。Make 使用 shell 中已明确导出的上述变量，缺少确认/身份会拒绝。load 不删除容器或旧镜像；先验证 tar checksum、两个必需 tag 的唯一 config digest，再从同一已打开文件导入并按 ID 检查，不能靠本地旧 tag 补 archive 缺项。不接受缺 manifest、含糊的多平台 application 映射；应先产出目标平台的可验证 archive。\u003c/p>\n\u003cp>migrate 前需 PostgreSQL/Redis 健康、storage 运行且本配置 bucket 初始化成功；这些基础服务不由发布命令隐式启动。工具枚举同 daemon/project 的全部容器，包括 orphan 和 one-off，拒绝活动业务写入者。迁移前用目标镜像的 \u003ccode>preflight --migration-plan\u003c/code> 读取全部 revision、检查单 head 和合法前进路径；只有随后单独 upgrade 与 DB head/Redis 检查都成功，本阶段才完成。\u003c/p>\n\u003cp>人工排查仍可执行只读 \u003ccode>alembic current\u003c/code> / \u003ccode>alembic heads\u003c/code>，但必须使用本次已核实的目标镜像和相同配置。下列普通入口使用默认 tag，只有 tag 的实际 ID 已与发布清单核实时才执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- run --rm -T --no-deps --pull never migrate alembic current\npython3 scripts/compose.py -- run --rm -T --no-deps --pull never migrate alembic heads\n\u003c/code>\u003c/pre>\n\u003cp>revision 不在目标链、多 head 或检查失败时停止。失败后核对实际已提交 revision，记录脱敏错误；不要手改 alembic_version。此前 revision、非事务操作和外部数据不随后一项失败全部回滚，先决定 forward fix 或完整恢复。\u003c/p>\n\u003ch2 id=\"迁移与回退审查\">迁移与回退审查\u003c/h2>\n\u003cp>每次发布审查\u003ca href=\"../PJM/backend/migrations/versions\">实际 upgrade/downgrade\u003c/a>和消费者，不从下表推导可任意降级：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>revision\u003c/th>\n\u003cth>回退限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>0018–0021\u003c/td>\n\u003ctd>组织共享不能还原成单 Project；新结果包络、Segment/Interaction/Effect 不由旧 Worker 自动兼容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0022–0024\u003c/td>\n\u003ctd>降级可能丢用户偏好/密文材料；退役来源不可逆导入，已有引用与旧 KEK 必须保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0025–0028\u003c/td>\n\u003ctd>调度/生成版本/索引与审计可能丢失。0027 在任何 DDL 前锁表，任何子 Session、无 SDK ID、BRANCH 或旧唯一约束冲突都拒绝降级，不再删除审计行；仅可无损表示为旧 PRIMARY 约束的数据可继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0029 输入回执\u003c/td>\n\u003ctd>任何回执行存在时拒绝降级，不仅 READY；不能删回执绕过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0030 预算账本\u003c/td>\n\u003ctd>三表任一有数据即拒绝降级，包括已结算记录；不为旧 Run 补造账户，无通用核对/退款 CLI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0031 会话 v2\u003c/td>\n\u003ctd>旧会话需重登，任何 v2 行（含撤销）阻止丢列；新旧 API 不混跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0032 用户生命周期\u003c/td>\n\u003ctd>旧用户初始化版本但不伪造事件；任何安全事件阻止降级，API/页面和实 DB 验收仍须单独确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0033 成员审计\u003c/td>\n\u003ctd>不回填旧加入/移除事件；任何成员事件阻止降级与整项目删除。成员、账户、偏好和项目删除须使用同一组织锁协议，旧写入方不可混跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0034 项目版本\u003c/td>\n\u003ctd>旧项目初始化版本 1，不代表历史修改次数；任一项目版本超过 1 拒绝丢列。项目 API/Web 成套切换，旧客户端缺原版本返回 422，不自动补版；全实例停写和在途请求核对后才可考虑回退\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>新表存在不是功能接入或生产升级许可。旧页面可读也不证明非终态 Run 可续行；预算另满足\u003ca href=\"#docs/design/run-budgets.md::%E4%B8%8A%E7%BA%BF%E9%97%A8%E7%A6%81%E4%B8%8E%E6%8E%A5%E7%BA%BF%E9%A1%BA%E5%BA%8F\">计量与混合 Worker 门禁\u003c/a>。兼容不明时保持停写，走\u003ca href=\"#docs/operations/backup-recovery.md::%E5%BA%94%E7%94%A8%E7%89%88%E6%9C%AC%E5%9B%9E%E9%80%80\">版本回退\u003c/a>，不清审计、快照或未决占用来凑条件。\u003c/p>\n\u003ch2 id=\"会话协议切换检查\">会话协议切换检查\u003c/h2>\n\u003col>\n\u003cli>确認所有 API 实例和流量入口，通知重登并保全未确认业务动作的 ID/key；排空并停止旧实例。\u003c/li>\n\u003cli>在授权隔离环境验证旧行升级、新登录、失效与降级拒绝；迁移 head 正确后才启动新 API。\u003c/li>\n\u003cli>新实例使用同一 v2 参数，通过真实 HTTPS 验证多页面/多实例稳定 CSRF、失效拒绝与 no-store；不采集 Cookie/CSRF 原值或使用真实用户密码探测。\u003c/li>\n\u003cli>失败保持入口关闭，选择 forward fix 或完整恢复；不以回旧镜像、改默认 version、删会话替代兼容方案。\u003c/li>\n\u003c/ol>\n\u003cp>恢复旧备份还须防止已撤销会话重新有效。Web 字段仍是字符串不证明旧 Web 已兼容；后台工作放行与浏览器重登分别审核。协议正本见\u003ca href=\"#docs/design/authentication.md::%E4%BC%9A%E8%AF%9D%E5%87%AD%E6%8D%AE-v2-%E4%B8%8E%E5%88%87%E6%8D%A2%E8%A6%81%E6%B1%82\">认证\u003c/a>。\u003c/p>\n\u003ch2 id=\"启动与放行\">启动与放行\u003c/h2>\n\u003cp>保持 Worker 停止、普通入口关闭。迁移阶段成功后，使用同一清单与已确认的维护变量，只启动 API/Web：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make deploy-api\nmake\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>make run\u003c/code> 现为 deploy-api 别名，不再整体启动 Worker。工具固定 --no-build/--no-deps/--pull never，等待 API/Web health，复验实际 image ID、有效环境和 preflight。必需服务或初始化容器缺失、配置与现有容器不同、检查失败时停止，不删参数绕过。preflight 不验 blob、KEK、认证、模型或恢复；health 也不证明业务验收。此阶段核对权限、Run/Result/Evidence、blob 与缺失输入；授权 GET 仍可能更新 session idle，不等于备份所需完全停写。\u003c/p>\n\u003cp>后台放行前，核对旧队列、在途 Run/Effect/Schedule，并获准恢复该环境所有后台工作；这不是 MAINTENANCE_CONFIRMED 的隐含授权。随后执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">make deploy-worker BACKGROUND_APPROVED=1\n\u003c/code>\u003c/pre>\n\u003cp>工具重新检查目标、API/Web 配置/镜像/health 和 preflight，再仅启动 Worker。Worker 没有独立业务 healthcheck，运行状态不证明旧工作已经核清。入口只开放给已批准的\u003ca href=\"#docs/operations/runbook.md::%E9%80%9A%E5%B8%B8-smoke\">smoke\u003c/a>；验证通过再人工开放普通业务，失败重新隔离并保留已产生事实。\u003c/p>\n\u003cp>smoke 需要运行中的 Worker，会写入/计费。优先在 DB、Redis/队列、存储、Worker 和凭据均隔离的验收环境完成；单独建 Project 不足以隔离旧 job/cron。当前无“只消费测试 Project”的模式，不能为跑 smoke 跳过后台恢复许可。\u003c/p>\n\u003cp>任一阶段超时、失败或中断都不自动续行、回滚或重发。load 可能已导入部分镜像，migration 可能已提交，up 可能已启动部分服务；先核对原事实。重新调用 API/Worker 阶段不会把仍运行的业务容器当成“上次成功”自动跳过，需要先明确检查与处理。\u003c/p>\n\u003ch2 id=\"后续开发约束与验收\">后续开发约束与验收\u003c/h2>\n\u003cp>发布脚本的本机状态检查不是跨实例锁或权限系统，不控制共享 Traefik 的入口、其他 daemon、外部进程或远端效果。独占维护期间不得并发修改配置、镜像、Docker context 或启动其他写入者；确认标志只是操作者声明，不是全局停写证明。\u003c/p>\n\u003cp>\u003ca href=\"#docs/planning/roadmap.md::r11-%E8%BF%90%E7%BB%B4%E4%B8%8E%E5%B7%A5%E7%A8%8B%E5%B7%A5%E5%85%B7\">计划 R11\u003c/a>继续负责统一全实例停写、清理及真实恢复验收。脚本回归证明参数、身份拒绝与失败不续行；Docker Compose 的实际注入、PowerShell 导出、迁移锁/事务、镜像 health、HTTPS 和业务放行须在获准环境分别验证。\u003c/p>\n", "sections": [{"title": "发布、迁移与分阶段放行", "level": "h1", "anchor": "发布迁移与分阶段放行", "text": "# 发布、迁移与分阶段放行\n\n已有环境的发布手册。首次准备见[启动](quickstart.md)，恢复资产与数据库替换见[备份恢复](backup-recovery.md)。命令在目标部署目录 `PJM/` 执行；先确认环境、维护窗口、版本与负责人，未知目标不试运行。"}, {"title": "先分清四种操作", "level": "h2", "anchor": "先分清四种操作", "text": "## 先分清四种操作\n\n| 操作 | 范围 |\n| --- | --- |\n| config / preflight | 配置解析 / DB migration 与 Redis PING，不证明业务就绪 |\n| build / export / load | 构建镜像 / 打包本地镜像 / 导入 archive，不是备份或应用验收 |\n| migration | 改变 DB；失败后查实际 revision，不用 stamp 掩盖 |\n| 启动 / 放行 | 进程启动可能消费旧工作；后台恢复和普通业务开放分别批准 |"}, {"title": "一个例子：关闭 dispatch 后仍有工作", "level": "h2", "anchor": "一个例子关闭-dispatch-后仍有工作", "text": "## 一个例子：关闭 dispatch 后仍有工作\n\n已入 Redis 的 Effect 和即将到期的 Schedule，不会因 `PROJECTMIND_WORKER_DISPATCH_ENABLED=false` 自动停止：\n\n| 入口 | false 时的实际行为 |\n| --- | --- |\n| Outbox relay | 不选择新的 Run/Effect dispatch topic，lifecycle 通知仍可配送 |\n| 已入队 Run/Effect job | 仍可进入 claim/executor；不检查该开关 |\n| Schedule / recovery cron | 仍可创建 Run、处理期限和恢复 |\n| Skill 解释/调整 job | 独立入口，仍可能调用模型 |\n\n入口见 [WorkerSettings](../../PJM/backend/src/projectmind/worker/settings.py)。开关不是维护模式，不终止远端请求；修改环境文件也不使现有进程即时重载。停写需阻止全部业务入口/触发、处理在途工作并确认所有实例的 API/Worker 写入者停止。远端结果未知时隔离并按[原 Effect 身份对账](runbook.md#incident-与-recovery)，不换键重做。"}, {"title": "环境文件与配置边界", "level": "h2", "anchor": "环境文件与配置边界", "text": "## 环境文件与配置边界\n\n[Makefile](../../PJM/Makefile) 和镜像导出统一调用 [compose.py](../../PJM/scripts/compose.py)。宿主需要 Python 3.12 标准库，无需 Backend 依赖；Windows 导出可指定 Python executable。\n\n| 选择 | 唯一来源 |\n| --- | --- |\n| 环境文件 | 显式 `--env-file` → shell `ENV_FILE` → `PJM/.env`，解析为同一绝对文件路径，供插值和 API/Worker/migrate 的 env_file 使用 |\n| Compose project | 显式 `--project-name` → shell `COMPOSE_PROJECT_NAME` → projectmind；**文件内同名变量不选择目标**，旧的非默认部署须显式指定 |\n| Compose 文件 / 目录 | 固定本套代码的 compose.yaml / PJM；拒绝旁路 file、project、profile 选择器 |\n| 应用镜像 | 普通入口固定默认 tag；发布入口显式 pin Backend/Web 的完整 sha256 image ID，三 Backend service 共用同一 ID |\n\n例如 `python3 scripts/compose.py --env-file /controlled/config/app.env --project-name approved-project -- config --quiet`。相对文件路径按 `PJM/` 解析，不受调用目录漂移影响；缺失/空路径拒绝，不回退另一文件。不要手设内部 `PJM_COMPOSE_ENV_FILE` 或绕过入口直接调用 Compose；compose.yaml 在缺少该来源时拒绝解析。\n\n普通 shell 变量仍优先于文件的插值，service.environment 优先于 env_file；不解析或 source dotenv 来改变 Docker 语义。切换 ENV_FILE 不会自动改写数据库 URL、容器、已运行进程或外部资源，仍须逐项核对目标。详见 [Compose 插值规则](https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/)和 [env_file](https://docs.docker.com/reference/compose-file/services/#env_file)。\n\n日常校验用 `make config`（quiet），不是业务就绪证明。完整 config、config --environment、容器 env/inspect 可能泄露 Secret，不贴共享报告。发布工具内部比较有效环境，但不输出值或保存配置副本。"}, {"title": "迁移前置与执行", "level": "h2", "anchor": "迁移前置与执行", "text": "## 迁移前置与执行\n\n先完成独立环境验收，取得[一致恢复点](backup-recovery.md#一致恢复点包含什么)，保留前后 image ID/archive；API/Worker/migrate/Web 使用经过验证的兼容组合。\n\n```text\n恢复点 → 全实例停写/在途对账 → 加载镜像 → 查 revision/head\n  → 单独迁移 → API/Web 核对 → 批准恢复后台 → 验收 → 普通入口放行\n```\n\n发布分为四个独立命令，不把前一阶段成功文件当作放行凭证。先从受控发布清单取得并确认以下变量；不要将示例身份照抄到真实环境：\n\n| 变量 | 确认内容 |\n| --- | --- |\n| ENV_FILE / COMPOSE_PROJECT_NAME | 已批准的配置文件和目标项目，后续各命令保持一致 |\n| DAEMON_ID | 目标 `docker info --format '{{.ID}}'`，同名项目不能跨 daemon 复用 |\n| BACKEND_IMAGE_ID / WEB_IMAGE_ID | 经验证的完整 `sha256:…` image ID，不是 tag、短 hash 或 registry manifest digest |\n| IMAGE_ARCHIVE / ARCHIVE_SHA256 | 可信 Docker save tar 与已核实的完整文件 checksum；只读受控保存，不允许并发改写 |\n| MAINTENANCE_CONFIRMED=1 | 恢复点、全部实例停写/在途对账、普通入口关闭、独占维护责任均已人工确认 |\n\n`make deploy` 只显示帮助，无状态变化。确认后逐个执行，不拼成自动继续的命令链：\n\n```bash\nmake deploy-load\nmake deploy-migrate\n```\n\n也可直接用 `python3 scripts/deploy.py \u003cphase> --help` 查看等价参数。Make 使用 shell 中已明确导出的上述变量，缺少确认/身份会拒绝。load 不删除容器或旧镜像；先验证 tar checksum、两个必需 tag 的唯一 config digest，再从同一已打开文件导入并按 ID 检查，不能靠本地旧 tag 补 archive 缺项。不接受缺 manifest、含糊的多平台 application 映射；应先产出目标平台的可验证 archive。\n\nmigrate 前需 PostgreSQL/Redis 健康、storage 运行且本配置 bucket 初始化成功；这些基础服务不由发布命令隐式启动。工具枚举同 daemon/project 的全部容器，包括 orphan 和 one-off，拒绝活动业务写入者。迁移前用目标镜像的 `preflight --migration-plan` 读取全部 revision、检查单 head 和合法前进路径；只有随后单独 upgrade 与 DB head/Redis 检查都成功，本阶段才完成。\n\n人工排查仍可执行只读 `alembic current` / `alembic heads`，但必须使用本次已核实的目标镜像和相同配置。下列普通入口使用默认 tag，只有 tag 的实际 ID 已与发布清单核实时才执行：\n\n```bash\npython3 scripts/compose.py -- run --rm -T --no-deps --pull never migrate alembic current\npython3 scripts/compose.py -- run --rm -T --no-deps --pull never migrate alembic heads\n```\n\nrevision 不在目标链、多 head 或检查失败时停止。失败后核对实际已提交 revision，记录脱敏错误；不要手改 alembic_version。此前 revision、非事务操作和外部数据不随后一项失败全部回滚，先决定 forward fix 或完整恢复。"}, {"title": "迁移与回退审查", "level": "h2", "anchor": "迁移与回退审查", "text": "## 迁移与回退审查\n\n每次发布审查[实际 upgrade/downgrade](../../PJM/backend/migrations/versions/)和消费者，不从下表推导可任意降级：\n\n| revision | 回退限制 |\n| --- | --- |\n| 0018–0021 | 组织共享不能还原成单 Project；新结果包络、Segment/Interaction/Effect 不由旧 Worker 自动兼容 |\n| 0022–0024 | 降级可能丢用户偏好/密文材料；退役来源不可逆导入，已有引用与旧 KEK 必须保留 |\n| 0025–0028 | 调度/生成版本/索引与审计可能丢失。0027 在任何 DDL 前锁表，任何子 Session、无 SDK ID、BRANCH 或旧唯一约束冲突都拒绝降级，不再删除审计行；仅可无损表示为旧 PRIMARY 约束的数据可继续 |\n| 0029 输入回执 | 任何回执行存在时拒绝降级，不仅 READY；不能删回执绕过 |\n| 0030 预算账本 | 三表任一有数据即拒绝降级，包括已结算记录；不为旧 Run 补造账户，无通用核对/退款 CLI |\n| 0031 会话 v2 | 旧会话需重登，任何 v2 行（含撤销）阻止丢列；新旧 API 不混跑 |\n| 0032 用户生命周期 | 旧用户初始化版本但不伪造事件；任何安全事件阻止降级，API/页面和实 DB 验收仍须单独确认 |\n| 0033 成员审计 | 不回填旧加入/移除事件；任何成员事件阻止降级与整项目删除。成员、账户、偏好和项目删除须使用同一组织锁协议，旧写入方不可混跑 |\n| 0034 项目版本 | 旧项目初始化版本 1，不代表历史修改次数；任一项目版本超过 1 拒绝丢列。项目 API/Web 成套切换，旧客户端缺原版本返回 422，不自动补版；全实例停写和在途请求核对后才可考虑回退 |\n\n新表存在不是功能接入或生产升级许可。旧页面可读也不证明非终态 Run 可续行；预算另满足[计量与混合 Worker 门禁](../design/run-budgets.md#上线门禁与接线顺序)。兼容不明时保持停写，走[版本回退](backup-recovery.md#应用版本回退)，不清审计、快照或未决占用来凑条件。"}, {"title": "会话协议切换检查", "level": "h2", "anchor": "会话协议切换检查", "text": "## 会话协议切换检查\n\n1. 确認所有 API 实例和流量入口，通知重登并保全未确认业务动作的 ID/key；排空并停止旧实例。\n2. 在授权隔离环境验证旧行升级、新登录、失效与降级拒绝；迁移 head 正确后才启动新 API。\n3. 新实例使用同一 v2 参数，通过真实 HTTPS 验证多页面/多实例稳定 CSRF、失效拒绝与 no-store；不采集 Cookie/CSRF 原值或使用真实用户密码探测。\n4. 失败保持入口关闭，选择 forward fix 或完整恢复；不以回旧镜像、改默认 version、删会话替代兼容方案。\n\n恢复旧备份还须防止已撤销会话重新有效。Web 字段仍是字符串不证明旧 Web 已兼容；后台工作放行与浏览器重登分别审核。协议正本见[认证](../design/authentication.md#会话凭据-v2-与切换要求)。"}, {"title": "启动与放行", "level": "h2", "anchor": "启动与放行", "text": "## 启动与放行\n\n保持 Worker 停止、普通入口关闭。迁移阶段成功后，使用同一清单与已确认的维护变量，只启动 API/Web：\n\n```bash\nmake deploy-api\nmake\n```\n\n`make run` 现为 deploy-api 别名，不再整体启动 Worker。工具固定 --no-build/--no-deps/--pull never，等待 API/Web health，复验实际 image ID、有效环境和 preflight。必需服务或初始化容器缺失、配置与现有容器不同、检查失败时停止，不删参数绕过。preflight 不验 blob、KEK、认证、模型或恢复；health 也不证明业务验收。此阶段核对权限、Run/Result/Evidence、blob 与缺失输入；授权 GET 仍可能更新 session idle，不等于备份所需完全停写。\n\n后台放行前，核对旧队列、在途 Run/Effect/Schedule，并获准恢复该环境所有后台工作；这不是 MAINTENANCE_CONFIRMED 的隐含授权。随后执行：\n\n```bash\nmake deploy-worker BACKGROUND_APPROVED=1\n```\n\n工具重新检查目标、API/Web 配置/镜像/health 和 preflight，再仅启动 Worker。Worker 没有独立业务 healthcheck，运行状态不证明旧工作已经核清。入口只开放给已批准的[smoke](runbook.md#通常-smoke)；验证通过再人工开放普通业务，失败重新隔离并保留已产生事实。\n\nsmoke 需要运行中的 Worker，会写入/计费。优先在 DB、Redis/队列、存储、Worker 和凭据均隔离的验收环境完成；单独建 Project 不足以隔离旧 job/cron。当前无“只消费测试 Project”的模式，不能为跑 smoke 跳过后台恢复许可。\n\n任一阶段超时、失败或中断都不自动续行、回滚或重发。load 可能已导入部分镜像，migration 可能已提交，up 可能已启动部分服务；先核对原事实。重新调用 API/Worker 阶段不会把仍运行的业务容器当成“上次成功”自动跳过，需要先明确检查与处理。"}, {"title": "后续开发约束与验收", "level": "h2", "anchor": "后续开发约束与验收", "text": "## 后续开发约束与验收\n\n发布脚本的本机状态检查不是跨实例锁或权限系统，不控制共享 Traefik 的入口、其他 daemon、外部进程或远端效果。独占维护期间不得并发修改配置、镜像、Docker context 或启动其他写入者；确认标志只是操作者声明，不是全局停写证明。\n\n[计划 R11](../planning/roadmap.md#r11-运维与工程工具)继续负责统一全实例停写、清理及真实恢复验收。脚本回归证明参数、身份拒绝与失败不续行；Docker Compose 的实际注入、PowerShell 导出、迁移锁/事务、镜像 health、HTTPS 和业务放行须在获准环境分别验证。"}], "toc": [{"title": "先分清四种操作", "anchor": "先分清四种操作", "level": "h2"}, {"title": "一个例子：关闭 dispatch 后仍有工作", "anchor": "一个例子关闭-dispatch-后仍有工作", "level": "h2"}, {"title": "环境文件与配置边界", "anchor": "环境文件与配置边界", "level": "h2"}, {"title": "迁移前置与执行", "anchor": "迁移前置与执行", "level": "h2"}, {"title": "迁移与回退审查", "anchor": "迁移与回退审查", "level": "h2"}, {"title": "会话协议切换检查", "anchor": "会话协议切换检查", "level": "h2"}, {"title": "启动与放行", "anchor": "启动与放行", "level": "h2"}, {"title": "后续开发约束与验收", "anchor": "后续开发约束与验收", "level": "h2"}], "source": "operations/deployment.md", "checksum": "b2c83b3b75955061a78c0b7c34555aeed25fb667d127b0b7272c45ca2c5e0671"}, {"id": "docs/operations/backup-recovery.md", "title": "备份、恢复与版本回退", "group": "operations", "html": "\u003ch1 id=\"备份恢复与版本回退\">备份、恢复与版本回退\u003c/h1>\n\u003cp>命令在目标部署目录 \u003ccode>PJM/\u003c/code> 执行，需确认环境、受控资产位置与获批维护窗口。首次起动见\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>，发布顺序见\u003ca href=\"#docs/operations/deployment.md::\">迁移手册\u003c/a>。目标或材料不明时停止。\u003c/p>\n\u003ch2 id=\"配备前备份\">配备前备份\u003c/h2>\n\u003cp>先阻止新业务/触发、结算在途 Effect；结果未知按\u003ca href=\"#docs/operations/runbook.md::incident-%E4%B8%8E-recovery\">原执行身份对账\u003c/a>。确认所有 API/Worker 写入者停止后，在同一停写窗口取得恢复点。dispatch=false、仅停止一个实例或相同文件时间戳都不足以证明一致。\u003c/p>\n\u003ch3 id=\"一致恢复点包含什么\">一致恢复点包含什么\u003c/h3>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>资产\u003c/th>\n\u003cth>必须保留的关联\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>DB dump\u003c/td>\n\u003ctd>数据库身份、migration revision、Run/快照/Outbox/批准/安全审计与停写时点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>blob snapshot\u003c/td>\n\u003ctd>SkillSource、文档等原对象 key、字节/hash及 DB 引用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 文件\u003c/td>\n\u003ctd>必要 workspace/transcript、输入副本、Session 恢复材料；缺文件不能标为可续行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>镜像与配置\u003c/td>\n\u003ctd>Backend/Web 与依赖 image ID、context path、配置版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>KEK\u003c/td>\n\u003ctd>所需旧版本的独立受控保管引用，不与 dump 放一起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部对账事实\u003c/td>\n\u003ctd>原 Proposal/Effect、目标 revision、apply/read-back 及恢复点后的变化\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>dump、blob 和 workspace 可含密码 hash、密文或业务正文，须访问控制，不进入公开附件。清单只记录恢复点 ID、UTC 窗口、资产引用/校验值、操作者、结果和缺项，不记录 Secret。RPO/RTO 与保留期由负责人确认，当前没有自动跨存储备份或恢复时效保证。\u003c/p>\n\u003cp>Redis 不代替 DB；旧队列、Outbox 重投与调度在途需要专用恢复方案，不对未知 Redis 全库清空。文档元数据总量也不等于 bucket 实际占用，不从列表推导可清除的对象；见\u003ca href=\"#docs/design/document-lifecycle.md::\">文档生命周期\u003c/a>。\u003c/p>\n\u003ch3 id=\"取得并检查数据库备份\">取得并检查数据库备份\u003c/h3>\n\u003cp>以下只备份 DB，不替代 blob/workspace snapshot。两块在同一 shell 执行，mktemp 创建失败或 pg_dump 非零即停；新终端必须重新明确本次目录，不猜测变量。密码不写命令行。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">umask 077\nPJM_BACKUP_DIR=\u0026quot;$(mktemp -d ./projectmind-backup-XXXXXXXX)\u0026quot; \u0026amp;\u0026amp;\npython3 scripts/compose.py -- exec -T postgres sh -ceu \\\n  'pg_dump --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; --format=custom' \\\n  \u0026gt; \u0026quot;${PJM_BACKUP_DIR:?Backup directory is required}/database.dump\u0026quot;\n\u003c/code>\u003c/pre>\n\u003cp>成功后检查非空、archive 目录及字节校验值。失败文件保留为现场，不标作有效备份。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${PJM_BACKUP_DIR:?Specify the directory created for this backup}\u0026quot;\n  test -s \u0026quot;$PJM_BACKUP_DIR/database.dump\u0026quot;\n  python3 scripts/compose.py -- exec -T postgres pg_restore --list \\\n    \u0026lt; \u0026quot;$PJM_BACKUP_DIR/database.dump\u0026quot; \u0026gt; \u0026quot;$PJM_BACKUP_DIR/database.toc\u0026quot;\n  docker image inspect projectmind/backend:0.1.0 projectmind/web:0.1.0 \\\n    --format '{{.RepoTags}} {{.Id}}' \u0026gt; \u0026quot;$PJM_BACKUP_DIR/images.txt\u0026quot;\n  cd \u0026quot;$PJM_BACKUP_DIR\u0026quot;\n  sha256sum database.dump \u0026gt; database.dump.sha256\n  sha256sum --check database.dump.sha256\n)\n\u003c/code>\u003c/pre>\n\u003cp>子 shell 遇错即停。TOC 可能含业务对象名，仅受控保存。将全部资产纳入同一清单并转存；checksum 检查不是来源真实性或实际恢复演练。完整恢复点就绪前不删除旧镜像、不迁移，更不运行删除全 volume 的 \u003ccode>make bootstrap-admin\u003c/code>。\u003c/p>\n\u003ch2 id=\"数据库恢复\">数据库恢复\u003c/h2>\n\u003cp>\u003cstrong>以下会删除并替换数据库，丢失恢复点后的本地数据。\u003c/strong> 经负责人确认并保全当前现场后，先在隔离环境演练。\u003c/p>\n\u003cp>恢复旧 DB 不撤销 Git/SVN/Redmine 等远端变更，还可能恢复已撤销 session/权限。例如 10:00 备份、10:05 撤权、10:07 外部 commit，恢复 10:00 后两项后续事实都须独立核对。未核清前保持隔离；没有通用权限修复/Effect 补账 CLI，不靠 SQL、bootstrap 或新幂等键补造结果。\u003c/p>\n\u003ch3 id=\"恢复前的停止条件\">恢复前的停止条件\u003c/h3>\n\u003cp>以下全部满足才继续：环境/Compose project/DB 名与角色/目标镜像/revision 已明确；可信 dump 的 checksum/archive 和关联 blob/workspace/config/KEK 齐全；当前现场另有备份；所有写入者已停；恢复点后的安全/外部变更有原身份对账方案。\u003c/p>\n\u003cp>将选定完整备份目录明确设为 \u003ccode>PJM_RESTORE_DIR\u003c/code>，保留原文件名及相对路径。以下只校验材料：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${PJM_RESTORE_DIR:?Specify the verified backup directory}\u0026quot;\n  test -s \u0026quot;$PJM_RESTORE_DIR/database.dump\u0026quot;\n  python3 scripts/compose.py -- exec -T postgres pg_restore --list \\\n    \u0026lt; \u0026quot;$PJM_RESTORE_DIR/database.dump\u0026quot; \u0026gt; /dev/null\n  cd \u0026quot;$PJM_RESTORE_DIR\u0026quot;\n  sha256sum --check database.dump.sha256\n)\n\u003c/code>\u003c/pre>\n\u003cp>成功后在已全局停写的窗口停止本目录服务，并在受控终端核对实际 DB/角色：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- stop api worker migrate\npython3 scripts/compose.py -- exec -T postgres sh -ceu '\n  psql --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; --no-psqlrc \\\n    --set=ON_ERROR_STOP=1 --command=\u0026quot;SELECT current_database(), current_user\u0026quot;\n'\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"替换数据库\">替换数据库\u003c/h3>\n\u003cp>仅在上述结果与已批准目标完全相符时执行。例子以原应用角色恢复；多 owner/自定义权限环境须另有验证过的方案。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">(\n  set -eu\n  : \u0026quot;${PJM_RESTORE_DIR:?Specify the verified backup directory}\u0026quot;\n  test -s \u0026quot;$PJM_RESTORE_DIR/database.dump\u0026quot;\n  python3 scripts/compose.py -- exec -T postgres sh -ceu '\n    dropdb --force --username=\u0026quot;$POSTGRES_USER\u0026quot; \u0026quot;$POSTGRES_DB\u0026quot;\n    createdb --username=\u0026quot;$POSTGRES_USER\u0026quot; --owner=\u0026quot;$POSTGRES_USER\u0026quot; \u0026quot;$POSTGRES_DB\u0026quot;\n  '\n  python3 scripts/compose.py -- exec -T postgres sh -ceu '\n    pg_restore --username=\u0026quot;$POSTGRES_USER\u0026quot; --dbname=\u0026quot;$POSTGRES_DB\u0026quot; \\\n      --no-owner --single-transaction --exit-on-error\n  ' \u0026lt; \u0026quot;$PJM_RESTORE_DIR/database.dump\u0026quot;\n)\n\u003c/code>\u003c/pre>\n\u003cp>单事务/遇错退出只保护 pg_restore 导入，不撤销 dropdb/createdb、blob 或外部效果；失败可能留下空库，须保持业务关闭。大型 DB 若需其他策略应先演练，不临场删保护参数。参考 \u003ca href=\"https://www.postgresql.org/docs/17/app-pgrestore.html\">pg_restore\u003c/a>。\u003c/p>\n\u003ch3 id=\"恢复后验证\">恢复后验证\u003c/h3>\n\u003cp>恢复对应 blob/workspace、兼容镜像/配置及旧 KEK。核对 revision 后按\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E4%B8%8E%E5%9B%9E%E9%80%80%E5%AE%A1%E6%9F%A5\">迁移审查\u003c/a>决定是否 forward migration，Worker 继续隔离，不用普通 Compose up 绕过分阶段检查。\u003c/p>\n\u003cp>放行前分别确认：用户/成员/Session 没有重新开放旧权限；Skill/文档/Artifact 字节与 Run/Result/Evidence 引用一致；终态可读与非终态续行分别成立；缺回执/输入/transcript 时拒绝而非补签；旧队列、lease、Schedule 与远端 Effect 已对账。记录实际耗时、数据损失、验收范围、残余问题和放行人。\u003c/p>\n\u003cp>任一未知保持隔离，preflight 不替代这些证据。后台与普通入口按\u003ca href=\"#docs/operations/deployment.md::%E5%90%AF%E5%8A%A8%E4%B8%8E%E6%94%BE%E8%A1%8C\">分阶段放行\u003c/a>恢复。\u003c/p>\n\u003ch2 id=\"应用版本回退\">应用版本回退\u003c/h2>\n\u003cp>旧 API/Web/Worker 能理解当前 schema、数据、队列和非终态快照时，才可保持数据切换兼容旧镜像。兼容不明时不启动旧 Worker，评估完整恢复点和外部对账；无可信恢复点则保全现场、选 forward fix，不试跑破坏性 downgrade。\u003c/p>\n\u003cp>回退仍按\u003ca href=\"#docs/operations/deployment.md::%E8%BF%81%E7%A7%BB%E5%89%8D%E7%BD%AE%E4%B8%8E%E6%89%A7%E8%A1%8C\">发布阶段\u003c/a>重新核对清单：旧 archive/checksum 与旧 Backend/Web image ID、当前 schema、配置和 daemon/project 都须明确。deploy-load 保留本地旧镜像，但这不保证完整旧 archive、第三方镜像或数据恢复点可用；同名 tag 不算回退方案。旧镜像的 migration-plan/head 检查不能理解当前 DB 时保持隔离，选择已评审的 forward fix 或完整恢复，不跳过门禁、stamp 或试删审计。API/Web、后台和普通业务分别放行，命令不会自动回滚。\u003c/p>\n", "sections": [{"title": "备份、恢复与版本回退", "level": "h1", "anchor": "备份恢复与版本回退", "text": "# 备份、恢复与版本回退\n\n命令在目标部署目录 `PJM/` 执行，需确认环境、受控资产位置与获批维护窗口。首次起动见[Quickstart](quickstart.md)，发布顺序见[迁移手册](deployment.md)。目标或材料不明时停止。"}, {"title": "配备前备份", "level": "h2", "anchor": "配备前备份", "text": "## 配备前备份\n\n先阻止新业务/触发、结算在途 Effect；结果未知按[原执行身份对账](runbook.md#incident-与-recovery)。确认所有 API/Worker 写入者停止后，在同一停写窗口取得恢复点。dispatch=false、仅停止一个实例或相同文件时间戳都不足以证明一致。"}, {"title": "一致恢复点包含什么", "level": "h3", "anchor": "一致恢复点包含什么", "text": "### 一致恢复点包含什么\n\n| 资产 | 必须保留的关联 |\n| --- | --- |\n| DB dump | 数据库身份、migration revision、Run/快照/Outbox/批准/安全审计与停写时点 |\n| blob snapshot | SkillSource、文档等原对象 key、字节/hash及 DB 引用 |\n| Run 文件 | 必要 workspace/transcript、输入副本、Session 恢复材料；缺文件不能标为可续行 |\n| 镜像与配置 | Backend/Web 与依赖 image ID、context path、配置版本 |\n| KEK | 所需旧版本的独立受控保管引用，不与 dump 放一起 |\n| 外部对账事实 | 原 Proposal/Effect、目标 revision、apply/read-back 及恢复点后的变化 |\n\ndump、blob 和 workspace 可含密码 hash、密文或业务正文，须访问控制，不进入公开附件。清单只记录恢复点 ID、UTC 窗口、资产引用/校验值、操作者、结果和缺项，不记录 Secret。RPO/RTO 与保留期由负责人确认，当前没有自动跨存储备份或恢复时效保证。\n\nRedis 不代替 DB；旧队列、Outbox 重投与调度在途需要专用恢复方案，不对未知 Redis 全库清空。文档元数据总量也不等于 bucket 实际占用，不从列表推导可清除的对象；见[文档生命周期](../design/document-lifecycle.md)。"}, {"title": "取得并检查数据库备份", "level": "h3", "anchor": "取得并检查数据库备份", "text": "### 取得并检查数据库备份\n\n以下只备份 DB，不替代 blob/workspace snapshot。两块在同一 shell 执行，mktemp 创建失败或 pg_dump 非零即停；新终端必须重新明确本次目录，不猜测变量。密码不写命令行。\n\n```bash\numask 077\nPJM_BACKUP_DIR=\"$(mktemp -d ./projectmind-backup-XXXXXXXX)\" \u0026\u0026\npython3 scripts/compose.py -- exec -T postgres sh -ceu \\\n  'pg_dump --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" --format=custom' \\\n  > \"${PJM_BACKUP_DIR:?Backup directory is required}/database.dump\"\n```\n\n成功后检查非空、archive 目录及字节校验值。失败文件保留为现场，不标作有效备份。\n\n```bash\n(\n  set -eu\n  : \"${PJM_BACKUP_DIR:?Specify the directory created for this backup}\"\n  test -s \"$PJM_BACKUP_DIR/database.dump\"\n  python3 scripts/compose.py -- exec -T postgres pg_restore --list \\\n    \u003c \"$PJM_BACKUP_DIR/database.dump\" > \"$PJM_BACKUP_DIR/database.toc\"\n  docker image inspect projectmind/backend:0.1.0 projectmind/web:0.1.0 \\\n    --format '{{.RepoTags}} {{.Id}}' > \"$PJM_BACKUP_DIR/images.txt\"\n  cd \"$PJM_BACKUP_DIR\"\n  sha256sum database.dump > database.dump.sha256\n  sha256sum --check database.dump.sha256\n)\n```\n\n子 shell 遇错即停。TOC 可能含业务对象名，仅受控保存。将全部资产纳入同一清单并转存；checksum 检查不是来源真实性或实际恢复演练。完整恢复点就绪前不删除旧镜像、不迁移，更不运行删除全 volume 的 `make bootstrap-admin`。"}, {"title": "数据库恢复", "level": "h2", "anchor": "数据库恢复", "text": "## 数据库恢复\n\n**以下会删除并替换数据库，丢失恢复点后的本地数据。** 经负责人确认并保全当前现场后，先在隔离环境演练。\n\n恢复旧 DB 不撤销 Git/SVN/Redmine 等远端变更，还可能恢复已撤销 session/权限。例如 10:00 备份、10:05 撤权、10:07 外部 commit，恢复 10:00 后两项后续事实都须独立核对。未核清前保持隔离；没有通用权限修复/Effect 补账 CLI，不靠 SQL、bootstrap 或新幂等键补造结果。"}, {"title": "恢复前的停止条件", "level": "h3", "anchor": "恢复前的停止条件", "text": "### 恢复前的停止条件\n\n以下全部满足才继续：环境/Compose project/DB 名与角色/目标镜像/revision 已明确；可信 dump 的 checksum/archive 和关联 blob/workspace/config/KEK 齐全；当前现场另有备份；所有写入者已停；恢复点后的安全/外部变更有原身份对账方案。\n\n将选定完整备份目录明确设为 `PJM_RESTORE_DIR`，保留原文件名及相对路径。以下只校验材料：\n\n```bash\n(\n  set -eu\n  : \"${PJM_RESTORE_DIR:?Specify the verified backup directory}\"\n  test -s \"$PJM_RESTORE_DIR/database.dump\"\n  python3 scripts/compose.py -- exec -T postgres pg_restore --list \\\n    \u003c \"$PJM_RESTORE_DIR/database.dump\" > /dev/null\n  cd \"$PJM_RESTORE_DIR\"\n  sha256sum --check database.dump.sha256\n)\n```\n\n成功后在已全局停写的窗口停止本目录服务，并在受控终端核对实际 DB/角色：\n\n```bash\npython3 scripts/compose.py -- stop api worker migrate\npython3 scripts/compose.py -- exec -T postgres sh -ceu '\n  psql --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" --no-psqlrc \\\n    --set=ON_ERROR_STOP=1 --command=\"SELECT current_database(), current_user\"\n'\n```"}, {"title": "替换数据库", "level": "h3", "anchor": "替换数据库", "text": "### 替换数据库\n\n仅在上述结果与已批准目标完全相符时执行。例子以原应用角色恢复；多 owner/自定义权限环境须另有验证过的方案。\n\n```bash\n(\n  set -eu\n  : \"${PJM_RESTORE_DIR:?Specify the verified backup directory}\"\n  test -s \"$PJM_RESTORE_DIR/database.dump\"\n  python3 scripts/compose.py -- exec -T postgres sh -ceu '\n    dropdb --force --username=\"$POSTGRES_USER\" \"$POSTGRES_DB\"\n    createdb --username=\"$POSTGRES_USER\" --owner=\"$POSTGRES_USER\" \"$POSTGRES_DB\"\n  '\n  python3 scripts/compose.py -- exec -T postgres sh -ceu '\n    pg_restore --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\" \\\n      --no-owner --single-transaction --exit-on-error\n  ' \u003c \"$PJM_RESTORE_DIR/database.dump\"\n)\n```\n\n单事务/遇错退出只保护 pg_restore 导入，不撤销 dropdb/createdb、blob 或外部效果；失败可能留下空库，须保持业务关闭。大型 DB 若需其他策略应先演练，不临场删保护参数。参考 [pg_restore](https://www.postgresql.org/docs/17/app-pgrestore.html)。"}, {"title": "恢复后验证", "level": "h3", "anchor": "恢复后验证", "text": "### 恢复后验证\n\n恢复对应 blob/workspace、兼容镜像/配置及旧 KEK。核对 revision 后按[迁移审查](deployment.md#迁移与回退审查)决定是否 forward migration，Worker 继续隔离，不用普通 Compose up 绕过分阶段检查。\n\n放行前分别确认：用户/成员/Session 没有重新开放旧权限；Skill/文档/Artifact 字节与 Run/Result/Evidence 引用一致；终态可读与非终态续行分别成立；缺回执/输入/transcript 时拒绝而非补签；旧队列、lease、Schedule 与远端 Effect 已对账。记录实际耗时、数据损失、验收范围、残余问题和放行人。\n\n任一未知保持隔离，preflight 不替代这些证据。后台与普通入口按[分阶段放行](deployment.md#启动与放行)恢复。"}, {"title": "应用版本回退", "level": "h2", "anchor": "应用版本回退", "text": "## 应用版本回退\n\n旧 API/Web/Worker 能理解当前 schema、数据、队列和非终态快照时，才可保持数据切换兼容旧镜像。兼容不明时不启动旧 Worker，评估完整恢复点和外部对账；无可信恢复点则保全现场、选 forward fix，不试跑破坏性 downgrade。\n\n回退仍按[发布阶段](deployment.md#迁移前置与执行)重新核对清单：旧 archive/checksum 与旧 Backend/Web image ID、当前 schema、配置和 daemon/project 都须明确。deploy-load 保留本地旧镜像，但这不保证完整旧 archive、第三方镜像或数据恢复点可用；同名 tag 不算回退方案。旧镜像的 migration-plan/head 检查不能理解当前 DB 时保持隔离，选择已评审的 forward fix 或完整恢复，不跳过门禁、stamp 或试删审计。API/Web、后台和普通业务分别放行，命令不会自动回滚。"}], "toc": [{"title": "配备前备份", "anchor": "配备前备份", "level": "h2"}, {"title": "一致恢复点包含什么", "anchor": "一致恢复点包含什么", "level": "h3"}, {"title": "取得并检查数据库备份", "anchor": "取得并检查数据库备份", "level": "h3"}, {"title": "数据库恢复", "anchor": "数据库恢复", "level": "h2"}, {"title": "恢复前的停止条件", "anchor": "恢复前的停止条件", "level": "h3"}, {"title": "替换数据库", "anchor": "替换数据库", "level": "h3"}, {"title": "恢复后验证", "anchor": "恢复后验证", "level": "h3"}, {"title": "应用版本回退", "anchor": "应用版本回退", "level": "h2"}], "source": "operations/backup-recovery.md", "checksum": "17f12cf13a9252555704c84a1c8ba680a5166afe49fc10a8ca3e8b998fa8ab85"}, {"id": "docs/operations/runbook.md", "title": "ProjectMind 运维与故障排查", "group": "operations", "html": "\u003ch1 id=\"projectmind-运维与故障排查\">ProjectMind 运维与故障排查\u003c/h1>\n\u003cp>本页按症状分诊；首次起动、发布、数据恢复分别见\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a>、\u003ca href=\"#docs/operations/deployment.md::\">发布手册\u003c/a>、\u003ca href=\"#docs/operations/backup-recovery.md::\">恢复手册\u003c/a>。现有实现与待补范围见\u003ca href=\"#docs/planning/roadmap.md::\">计划\u003c/a>，设计目标不代表已有修复 CLI。\u003c/p>\n\u003ch2 id=\"按问题找入口\">按问题找入口\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>登录、CSRF、权限异常\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E8%AE%A4%E8%AF%81%E6%95%85%E9%9A%9C%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">认证\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::%E7%99%BB%E5%BD%95%E9%98%B2%E6%8A%A4%E7%9A%84%E6%8E%92%E6%9F%A5%E4%B8%8E%E6%81%A2%E5%A4%8D\">登录防护\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目消失、归档或删除异常\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E9%A1%B9%E7%9B%AE%E4%B8%8E%E5%BD%92%E6%A1%A3%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">项目\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上传部分成功、列表与附件不一致\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E6%96%87%E6%A1%A3%E4%BF%9D%E5%AD%98%E4%B8%8E%E5%88%A0%E9%99%A4%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">文档保存与删除\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run 无会话、准备超时、不断接管\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E5%87%86%E5%A4%87%E6%95%85%E9%9A%9C%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">准备\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::%E8%B5%84%E6%BA%90%E5%BF%AB%E7%85%A7%E6%8E%92%E9%9A%9C\">冻结输入\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等待回答/批准、结果或评价可疑\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::waiting-%E7%8A%B6%E6%80%81\">WAITING\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%AF%84%E4%BB%B7%E7%9A%84%E5%8F%AA%E8%AF%BB%E5%88%86%E8%AF%8A\">结果\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>调度漏跑或计数不符\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::schedule-%E4%B8%8E-recovery-%E7%9A%84%E7%9B%91%E8%A7%86\">Schedule\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部写入未知、PR 失败\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::incident-%E4%B8%8E-recovery\">Effect 对账\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>凭据无法解封或准备轮换\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::managed-secret-%E3%81%AE-kek-%E9%81%8B%E7%94%A8\">KEK\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验收或 Worker 故障注入\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/runbook.md::%E9%80%9A%E5%B8%B8-smoke\">smoke\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::worker-%E5%96%AA%E5%A4%B1%E3%81%A8%E6%8E%A5%E7%AE%A1\">接管\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"运用原则\">运用原则\u003c/h2>\n\u003cp>先使用已有响应、脱敏日志及获准的只读查询。PostgreSQL 是业务/审计正本；不改 Run 状态、stamp migration、删审计或换幂等键消除错误。启动、停机、模型、外部写入与恢复须重新确认目标、副作用和授权。命令在目标环境的 \u003ccode>PJM/\u003c/code> 执行，通过\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">统一配置入口\u003c/a>使用已确认的 ENV_FILE 和 COMPOSE_PROJECT_NAME；不要直接切默认 Docker context 操作另一目标。\u003c/p>\n\u003cp>对外交接只保留 UTC 时点、image/revision、必要对象 ID、公开错误码和检查范围，不附 \u003ccode>.env\u003c/code>、Cookie/CSRF、密码、KEK、内部地址、业务正文或完整 workspace。结果未知先保全原请求身份，不自动重放。\u003c/p>\n\u003ch2 id=\"认证故障的只读分诊\">认证故障的只读分诊\u003c/h2>\n\u003cp>记录已有响应的 path（无业务参数）、status/code/request_id 与版本。只查 header 是否存在、cookie 属性及刷新顺序，不导出完整 HAR 或凭据表单。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原响应\u003c/th>\n\u003cth>核对与停止条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>401 invalid_credentials\u003c/td>\n\u003ctd>确认环境，不探测账号存在性或重跑 bootstrap\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>400 current_password_rejected\u003c/td>\n\u003ctd>改密操作拒绝，不是登录失效；保留仍有效 session\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>401 authentication_required\u003c/td>\n\u003ctd>查 cookie、期限、用户/角色/失效及 API 协议；不公开内部原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 csrf_rejected\u003c/td>\n\u003ctd>查 Origin scheme/host/port、header 类型和是否换会话；不关闭 CSRF 或放宽 cookie\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 administrator_required / 404\u003c/td>\n\u003ctd>系统 ADMIN 与 ProjectMember 不同；404 也可能隐藏越权，不枚举或换账号探测\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>409 project_archived / 用户冲突\u003c/td>\n\u003ctd>按\u003ca href=\"#docs/design/project-lifecycle.md::\">项目\u003c/a>或\u003ca href=\"#docs/design/user-lifecycle.md::\">账户\u003c/a>规则核对，不擅自恢复项目、换版重发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>429 / 503\u003c/td>\n\u003ctd>转\u003ca href=\"#docs/operations/runbook.md::%E7%99%BB%E5%BD%95%E9%98%B2%E6%8A%A4%E7%9A%84%E6%8E%92%E6%9F%A5%E4%B8%8E%E6%81%A2%E5%A4%8D\">登录防护\u003c/a>，不当作密码错误\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422\u003c/td>\n\u003ctd>按契约修正缺失 header/结构/输入，不显示含密码的原值\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>v2 同 session 的 GET 不轮换 CSRF，但可能更新 idle；login-context 占配额并建 challenge，均非纯只读探针。混合旧 API 按\u003ca href=\"#docs/operations/deployment.md::%E4%BC%9A%E8%AF%9D%E5%8D%8F%E8%AE%AE%E5%88%87%E6%8D%A2%E6%A3%80%E6%9F%A5\">会话切换\u003c/a>处理。需重登先保全未确认动作的 ID/key；403 不证明此前请求未提交，也不授权自动重发。账户管理没有通用排障 CLI，不用 SQL 或 bootstrap 代替。\u003c/p>\n\u003ch2 id=\"登录防护的排查与恢复\">登录防护的排查与恢复\u003c/h2>\n\u003cp>不连续请求登录接口制造样本。429 记录 Retry-After 后停止快速重试，查共享出口、重复 challenge 与可信代理；一次正常登录通常消耗两次来源请求。等待不保证下次成功，不轮询、换来源或删除配额“解锁”。\u003c/p>\n\u003cp>503 先区分应用 \u003ccode>login_protection_unavailable\u003c/code> 与代理错误，再查指定 Redis 的可用性、命令权限、容量/驱逐、TTL/状态损坏与超时。PING 不证明 EVAL/SET/GETDEL 可用；前端通用文案也不直接说明根因。\u003c/p>\n\u003cp>修配置、重启、切 Redis 或主动登录验证已超出只读分诊，需批准的环境、专用账号及影响评审；不提供 FLUSHDB/删 key 命令。修复后分别验来源不可伪造、正常登录、429 等待和 503 不放行验证。登录防护恢复不代表旧会话、Worker 或外部效果恢复。\u003c/p>\n\u003cp>当前 Web 的 1–300 秒合法值只作静态提示，并非倒计时或强制按钮锁定；通信失败/离页按\u003ca href=\"#docs/design/login-protection.md::%E6%8F%90%E4%BA%A4%E7%A6%BB%E9%A1%B5%E4%B8%8E%E7%BB%93%E6%9E%9C%E6%9C%AA%E7%9F%A5\">提交未知\u003c/a>处理，不从未跳页断言没有登录成功。\u003c/p>\n\u003ch2 id=\"项目与归档的只读分诊\">项目与归档的只读分诊\u003c/h2>\n\u003cp>先核对原 project_id、调用者和服务端状态；失效深链接保持原目标，页面须经精确详情授权，导航选中项不能代替该检查。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>核对与停止条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>移出成员后仍可访问\u003c/td>\n\u003ctd>系统 ADMIN 不依赖 membership，成员移除不是账户降权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>归档后仍有 Run/Effect\u003c/td>\n\u003ctd>归档不是取消或全局停写，按原对象停止协议处理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无 Run 但 DELETE 失败\u003c/td>\n\u003ctd>TaskSchedule 或成员审计仍会阻止删除；原版本冲突须核对，不拆外键、删历史或循环 DELETE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>204 后仍有附件/备份\u003c/td>\n\u003ctd>只证明所列元数据删除，不证明字节清理；不递归删目录\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>写入修复先确认权限、目标和可恢复性；正本见\u003ca href=\"#docs/design/project-lifecycle.md::\">项目生命周期\u003c/a>。\u003c/p>\n\u003ch2 id=\"文档保存与删除的只读分诊\">文档保存与删除的只读分诊\u003c/h2>\n\u003cp>保留原 Project/document ID、时点、status/code 与版本；未返回 ID 的上传保留受控本地路径，不把正文/内部 key 放入报告。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>核对与停止条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>同名 409 且占用增加\u003c/td>\n\u003ctd>blob 先于 metadata 约束写入，可能有孤立对象；不重复上传验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目录仅部分完成\u003c/td>\n\u003ctd>逐文件分清确认与未知；done 不是成功数，不重传整批\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DELETE 报错后 ID 消失\u003c/td>\n\u003ctd>metadata 可能已提交；404 不恢复清理，不循环删或改删同路径新 ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>204 后对象仍在\u003c/td>\n\u003ctd>S3 适配器可能吞权限等错误，授权存储负责人核对原对象，不清 Project 前缀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下载失败/内容不符\u003c/td>\n\u003ctd>查非 Latin-1 文件名 header、元数据/实际字节及存储，不改 checksum 掩盖损坏\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>没有通用孤立对象清理/配额修复 CLI；\u003ca href=\"#docs/design/document-lifecycle.md::\">文档生命周期\u003c/a>定义修正边界。冻结输入不能靠同名重传修复。\u003c/p>\n\u003ch2 id=\"准备故障的只读分诊\">准备故障的只读分诊\u003c/h2>\n\u003cp>查已有 Run/Attempt、日志和输入回执，不启动模型或重做物化。内部回执没有公开管理 API。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观察\u003c/th>\n\u003cth>核对与停止条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>RUNNING 但无 Session\u003c/td>\n\u003ctd>运行态与 prepared event 可在 ContextBuilder 前产生，先查准备错误/回执/Brief\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>preparation_timeout\u003c/td>\n\u003ctd>查准备配置、资源耗时和回执提交；模型 wall timeout 不是替代\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>context_build_failed\u003c/td>\n\u003ctd>查脱敏异常、冻结来源、binding 和消费者，不一律归因网络\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>首次世代创建被拒绝\u003c/td>\n\u003ctd>旧 .projectmind-inputs、其他 UUID 或 symlink 都可阻止；保留现场，不删除或补 READY\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行权异常、不断接管\u003c/td>\n\u003ctd>查 lease/token 与 Attempt 时间线，旧 Worker 不得强写终态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已接受取消但未结束\u003c/td>\n\u003ctd>查取消意图/lease/Session；按钮或 CANCELLED 不证明进程退出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>READY 但 Run 失败\u003c/td>\n\u003ctd>输入就绪不保证 Brief/模型成功，不删完成回执解锁\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>计时器见\u003ca href=\"#docs/design/run-budgets.md::%E7%8E%B0%E6%9C%89%E8%AE%A1%E6%97%B6%E5%99%A8%E7%9A%84%E8%A6%86%E7%9B%96%E8%8C%83%E5%9B%B4\">执行限额\u003c/a>。提交未知时保持输入不可用、保留原世代，不填 READY 或用新世代覆盖。实际停机测试另见\u003ca href=\"#docs/operations/runbook.md::worker-%E5%96%AA%E5%A4%B1%E3%81%A8%E6%8E%A5%E7%AE%A1\">接管\u003c/a>。\u003c/p>\n\u003ch2 id=\"资源快照排障\">资源快照排障\u003c/h2>\n\u003cp>核对部署版本、Run sources、冻结 manifest、回执所指世代和实际 revision，不以今日文档列表、HEAD 或同名物理目录代替。缺 ID、hash 不符或混入文件时保留现场，不重传同名文件、删缓存或改 snapshot；可信输入必须改变时创建新 Run，旧事实保留。\u003c/p>\n\u003cp>响应丢失先按\u003ca href=\"#docs/design/run-creation.md::\">原创建请求\u003c/a>确认，已有 Run 的 PREPARING/READY/缺回执则按\u003ca href=\"#docs/design/resource-snapshots.md::%E5%87%86%E5%A4%87%E4%B8%AD%E6%96%AD%E4%B8%8E%E5%86%8D%E6%AC%A1%E4%BD%BF%E7%94%A8\">输入中断规则\u003c/a>处理。hash、目录完整和 migration 成功均不是放行证据；无补签/修复 CLI。\u003c/p>\n\u003ch2 id=\"waiting-状态\">WAITING 状态\u003c/h2>\n\u003cp>WAITING_FOR_INPUT/APPROVAL 不是终态或 Worker 卡死。查 Interaction、Proposal、Brief/checkpoint、Session 与事件：人工等待释放主执行 lease，但已批准 Effect 可持有独立 lease；不要重复批准。正常答案追加 Segment，技术重试才在原 Segment 追加 Attempt。\u003c/p>\n\u003cp>普通超期以 INTERACTION_TIMEOUT Segment 续行，不代选答案；批准超期则失效且不写外部。410 可能发生在过期续行提交后，先读保存状态，不换 key 补答案。只有 EFFECT_APPROVAL Interaction 而无 Proposal 时保留现场，不能用普通答复或手写审批修复。\u003c/p>\n\u003cp>Session resume 要求 transcript/workspace 与 engine/model 兼容；fork 保留 parent/checkpoint；replace 从可信 checkpoint 建新会话。它们不是任意切换 CLI，均不得改变冻结版本、权限、资源或预算。PRIMARY 最多一个 ACTIVE，不以含子会话的 ACTIVE 总数判重。详见\u003ca href=\"#docs/design/user-interactions.md::\">普通交互\u003c/a>与\u003ca href=\"#docs/design/agent-runtime.md::\">Runtime\u003c/a>。\u003c/p>\n\u003ch2 id=\"结果与评价的只读分诊\">结果与评价的只读分诊\u003c/h2>\n\u003cp>查授权 detail/评价历史，保留 Run/Result/Evaluation ID 与原响应，不复制正文。SUCCEEDED 可与业务 PARTIAL/BLOCKED 并存；模型说 APPLIED 不替代平台 Effect/read-back，引用/Artifact 计数不证明内容可读。\u003c/p>\n\u003cp>评价 pointer 相对 detail.result.data；400 查原值根，409 查 Result 存在性，401/403 回认证分诊。无评价不等于无 Result。响应丢失不能靠同文/时间确认原提交，也不自动 POST、删除重复项或改原值。见\u003ca href=\"#docs/design/results-evaluation.md::\">结果与评价\u003c/a>。\u003c/p>\n\u003ch2 id=\"schedule-与-recovery-的监视\">Schedule 与 Recovery 的监视\u003c/h2>\n\u003cp>tick 的 created/skipped/failed、Schedule 的 last_*、计数与业务结果分开。FAILED_PRECONDITION 回写后进入 ERROR，但基础设施异常未必留下状态；不补造触发或改 DB 计数。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>异常\u003c/th>\n\u003cth>实际边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>迟到/漏跑\u003c/td>\n\u003ctd>当前可能执行最早迟到 occurrence，再跳过后续过期时刻；missed_count 单次最多 1000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>last_* 不一致\u003c/td>\n\u003ctd>跳过/失败可保留旧 Run ID，不能拼成同一次执行事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>next_run_at 已进但无 Run\u003c/td>\n\u003ctd>认领后创建前有崩溃窗口，尚无持久在途账本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编辑/停止同时触发\u003c/td>\n\u003ctd>旧回写可能影响新配置；查 occurrence、操作时点和关联 Run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同 Task 多 Run\u003c/td>\n\u003ctd>仅检查本 Schedule 的 last_run_id，不覆盖手动或其他 Schedule\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面找不到 Schedule\u003c/td>\n\u003ctd>查授权分页 API；前 100 条/当前 catalog 可漏显，不因此重建。编辑目前无页面入口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>保留 Schedule ID、带 offset 的 occurrence、原键与日志；时间同时核对规则和浏览器时区。摘要不足就保持未知，不伪造结算。Run/Effect lease、Interaction/Proposal 超期的 recovery 计数分别观察；Effect 技术重试保持原身份，未知远端仍先对账。正本见\u003ca href=\"#docs/design/task-scheduling.md::\">调度\u003c/a>。\u003c/p>\n\u003ch2 id=\"repository-与-cas-接入\">Repository 与 CAS 接入\u003c/h2>\n\u003cp>读取先查 \u003ca href=\"../PJM/backend/src/projectmind/agent/repository_source.py\">repository source\u003c/a>：Git 支持 http/https/file，SVN 另支持 svn，不接受 SSH 或 URI 密码。Secret 格式 username:secret（首冒号切分），无冒号用 x-access-token 用户名；Git 认证经环境、SVN 密码经 stdin，不进 argv。image 需 git/subversion，超时由 PROJECTMIND_REPOSITORY_COMMAND_TIMEOUT_SECONDS 控制。\u003c/p>\n\u003cp>paths 是硬范围，冻结选择后记录实际 commit/SVN revision。普通不可读文件可 skipped，冻结来源/hash 不符必须失败；原始 stderr 不进入 Agent/Evidence。\u003c/p>\n\u003cp>Redmine 写入必须经声明 issue.update/v1、atomic_precondition=revision、idempotency=key 的 CAS adapter，先检 well-known Provider 协议，再 pre-read/apply/read-back；不回退普通更新接口。Integration 配置与 SecretReference 变化不得改写原 Run binding。\u003c/p>\n\u003cp>repository.write/v1 始终人工批准：direct 是缺省，Git fast-forward、不 force，default_revision 必须是具体 branch；branch 使用 projectmind/ 命名空间。同名同内容不证明本次执行。SVN 当前未固定批准基线，不能保证排除已变化的 revision。\u003c/p>\n\u003cp>自动 PR/MR 仅 Git branch + 完整 forge_kind/forge_api_base_url/forge_project；未配置只保留 branch/commit，部分配置拒绝。PR 失败不撤销 commit，也不替代执行前批准。target_stale 重新观察/提案，见\u003ca href=\"#docs/design/repository-effects.md::\">受控写入\u003c/a>。\u003c/p>\n\u003ch2 id=\"incident-与-recovery\">Incident 与 recovery\u003c/h2>\n\u003cp>保留关联 ID、Provider/capability 版、Proposal checksum、请求指纹、幂等键 hash、批准与 apply/read-back 状态。分别查批准保存、远端写入、回读、PR 与本地 finalize，不能合成一个 FAILED。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原执行的外部事实\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>已应用且回读一致\u003c/td>\n\u003ctd>沿原身份确认既有结果，不再写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>明确未应用\u003c/td>\n\u003ctd>仍复查批准/scope/期限/revision，只走原受控恢复路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未知或部分成功\u003c/td>\n\u003ctd>保持隔离对账，不换键、强推、改 SQL 或盲目重试\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>当前重试可能重新运行整个 Provider，无“只补 PR”或通用补账 CLI。Effect lease 过期不证明旧请求停止；恢复 DB 不证明远端未执行。不要仅重启 Worker 促使自动恢复。人工外部修正需受控 incident 记录及适用 Evaluation，不覆盖原 Effect/Result。\u003c/p>\n\u003ch2 id=\"managed-secret-の-kek-運用\">MANAGED Secret の KEK 運用\u003c/h2>\n\u003cp>MANAGED 直接用部署主密钥 AES-256-GCM，不是 DEK/KEK 两层信封。keyring 为逗号分隔 version:base64key，每个 key 为 32 字节；首项新加密，其余解旧密文。通过环境 Secret 管理注入，不展示 key。丢失 KEK 无法由 DB 备份补救。\u003c/p>\n\u003cp>按\u003ca href=\"#docs/design/secret-storage.md::%E5%88%87%E6%8D%A2%E4%B8%8E%E6%81%A2%E5%A4%8D%E7%9A%84%E9%A1%BA%E5%BA%8F\">切换与恢复顺序\u003c/a>确认备份、维护窗口、全部读写进程和旧备份解密条件。API/Worker 启动加载 cipher，仅改 CLI 环境不更新现有实例；新标签必须配新 key，不能同标签换 bytes。\u003c/p>\n\u003cp>获批窗口在已配置目标环境执行 \u003ccode>python -m projectmind.ops.rotate_secrets\u003c/code>。它锁定并改写材料，不是只读操作，也不改 Run/binding 身份。检查退出/数量与所需解封；active 行 skipped 不验证解密，全部 skipped 不证明成功。没有全量只读解密 CLI，不输出明文替代验证。\u003c/p>\n\u003cp>旧备份仍需旧 KEK 时继续独立保管。版本不明、密钥缺失或认证失败一律拒绝，不降明文。MANAGED 不防护同时掌控 host/process 与 DB 的攻击者，外部 KMS/HSM 尚未实现。\u003c/p>\n\u003ch2 id=\"验收与故障注入\">验收与故障注入\u003c/h2>\n\u003ch3 id=\"通常-smoke\">通常 smoke\u003c/h3>\n\u003cp>smoke 会调用模型、创建 Run/Evaluation 并测试取消，有费用和持久写入。使用获准专用环境、Project 与 published task；先满足\u003ca href=\"#docs/operations/deployment.md::%E5%90%AF%E5%8A%A8%E4%B8%8E%E6%94%BE%E8%A1%8C\">Worker 放行\u003c/a>、dispatch 和模型凭据前置。单独 Project 不隔离旧 job/cron。\u003c/p>\n\u003cp>明确设置测试 UUID 为 SMOKE_PROJECT_ID 后执行，未指定会拒绝：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- exec \\\n  -e PROJECTMIND_SMOKE_PROJECT_ID=\u0026quot;$SMOKE_PROJECT_ID\u0026quot; \\\n  api python -m projectmind.ops.smoke\n\u003c/code>\u003c/pre>\n\u003cp>密码经 TTY。可用 PROJECTMIND_SMOKE_SKILL_VERSION_ID / TASK_KEY 固定任务、TASK_INPUT_JSON / TASK_SOURCES_JSON 提供合法输入（后面三项同样带 PROJECTMIND_SMOKE_ 前缀）。不把真实正文/凭据放共享 shell history。通过覆盖认证、创建重放、结果/证据、追加评价、SSE 与取消，不代表全部 Provider、页面或业务质量。\u003c/p>\n\u003ch3 id=\"worker-喪失と接管\">Worker 喪失と接管\u003c/h3>\n\u003cp>仅在可停机专用环境注入。分别选择准备中、模型执行中的测试 Run，保留 Run/Segment/Attempt、快照和 lease；RUNNING 不证明模型已启动。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">LEASE_SECONDS=\u0026quot;$(python3 scripts/compose.py -- exec -T api python -c \\\n  'from projectmind.core.settings import get_settings; print(get_settings().run_lease_seconds)')\u0026quot;\npython3 scripts/compose.py -- stop worker\n\u003c/code>\u003c/pre>\n\u003cp>确认 LEASE_SECONDS 是有效秒数，等待该时长加 recovery cron 观察窗口后才启动 Worker。20 秒只是余量，不保证完成恢复：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">sleep \u0026quot;$((LEASE_SECONDS + 20))\u0026quot;\npython3 scripts/compose.py -- start worker\npython3 scripts/compose.py -- logs --no-log-prefix --tail=200 worker\n\u003c/code>\u003c/pre>\n\u003cp>观察实际 recovery tick：旧 Attempt 为 LEASE_EXPIRED，Run 经 RETRY_PENDING 在原 Segment 追加 Attempt，快照不变；超限以 retry_exhausted 失败。准备中断不允许新 Attempt 补签旧 PREPARING 为 READY。部署版本和真实持久恢复分别验，不用 mock test 或仅模型阶段成功代替。\u003c/p>\n\u003ch2 id=\"log-確認と-incident-記録\">Log 確認と incident 記録\u003c/h2>\n\u003cp>在受控终端按服务器响应的 request/trace ID 或 Run/Attempt ID 缩小 JSON 日志，再关联 Session/Effect；客户端自带 X-Request-ID 不是当前服务器审计值，request ID 也不是重放键。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python3 scripts/compose.py -- logs --no-log-prefix api worker \\\n  | jq -c 'select(.run_id == \u0026quot;\u0026lt;RUN_ID\u0026gt;\u0026quot; or .trace_id == \u0026quot;\u0026lt;TRACE_ID\u0026gt;\u0026quot;)'\n\u003c/code>\u003c/pre>\n\u003cp>原日志可能包含敏感上下文，对外只转录\u003ca href=\"#docs/operations/runbook.md::%E8%BF%90%E7%94%A8%E5%8E%9F%E5%88%99\">运用原则\u003c/a>所列脱敏事实，不附 Tool 参数/结果、Evidence 或全量配置。\u003c/p>\n", "sections": [{"title": "ProjectMind 运维与故障排查", "level": "h1", "anchor": "projectmind-运维与故障排查", "text": "# ProjectMind 运维与故障排查\n\n本页按症状分诊；首次起动、发布、数据恢复分别见[Quickstart](quickstart.md)、[发布手册](deployment.md)、[恢复手册](backup-recovery.md)。现有实现与待补范围见[计划](../planning/roadmap.md)，设计目标不代表已有修复 CLI。"}, {"title": "按问题找入口", "level": "h2", "anchor": "按问题找入口", "text": "## 按问题找入口\n\n| 症状 | 入口 |\n| --- | --- |\n| 登录、CSRF、权限异常 | [认证](#认证故障的只读分诊) / [登录防护](#登录防护的排查与恢复) |\n| 项目消失、归档或删除异常 | [项目](#项目与归档的只读分诊) |\n| 上传部分成功、列表与附件不一致 | [文档保存与删除](#文档保存与删除的只读分诊) |\n| Run 无会话、准备超时、不断接管 | [准备](#准备故障的只读分诊) / [冻结输入](#资源快照排障) |\n| 等待回答/批准、结果或评价可疑 | [WAITING](#waiting-状态) / [结果](#结果与评价的只读分诊) |\n| 调度漏跑或计数不符 | [Schedule](#schedule-与-recovery-的监视) |\n| 外部写入未知、PR 失败 | [Effect 对账](#incident-与-recovery) |\n| 凭据无法解封或准备轮换 | [KEK](#managed-secret-の-kek-運用) |\n| 验收或 Worker 故障注入 | [smoke](#通常-smoke) / [接管](#worker-喪失と接管) |"}, {"title": "运用原则", "level": "h2", "anchor": "运用原则", "text": "## 运用原则\n\n先使用已有响应、脱敏日志及获准的只读查询。PostgreSQL 是业务/审计正本；不改 Run 状态、stamp migration、删审计或换幂等键消除错误。启动、停机、模型、外部写入与恢复须重新确认目标、副作用和授权。命令在目标环境的 `PJM/` 执行，通过[统一配置入口](deployment.md#环境文件与配置边界)使用已确认的 ENV_FILE 和 COMPOSE_PROJECT_NAME；不要直接切默认 Docker context 操作另一目标。\n\n对外交接只保留 UTC 时点、image/revision、必要对象 ID、公开错误码和检查范围，不附 `.env`、Cookie/CSRF、密码、KEK、内部地址、业务正文或完整 workspace。结果未知先保全原请求身份，不自动重放。"}, {"title": "认证故障的只读分诊", "level": "h2", "anchor": "认证故障的只读分诊", "text": "## 认证故障的只读分诊\n\n记录已有响应的 path（无业务参数）、status/code/request_id 与版本。只查 header 是否存在、cookie 属性及刷新顺序，不导出完整 HAR 或凭据表单。\n\n| 原响应 | 核对与停止条件 |\n| --- | --- |\n| 401 invalid_credentials | 确认环境，不探测账号存在性或重跑 bootstrap |\n| 400 current_password_rejected | 改密操作拒绝，不是登录失效；保留仍有效 session |\n| 401 authentication_required | 查 cookie、期限、用户/角色/失效及 API 协议；不公开内部原因 |\n| 403 csrf_rejected | 查 Origin scheme/host/port、header 类型和是否换会话；不关闭 CSRF 或放宽 cookie |\n| 403 administrator_required / 404 | 系统 ADMIN 与 ProjectMember 不同；404 也可能隐藏越权，不枚举或换账号探测 |\n| 409 project_archived / 用户冲突 | 按[项目](../design/project-lifecycle.md)或[账户](../design/user-lifecycle.md)规则核对，不擅自恢复项目、换版重发 |\n| 429 / 503 | 转[登录防护](#登录防护的排查与恢复)，不当作密码错误 |\n| 422 | 按契约修正缺失 header/结构/输入，不显示含密码的原值 |\n\nv2 同 session 的 GET 不轮换 CSRF，但可能更新 idle；login-context 占配额并建 challenge，均非纯只读探针。混合旧 API 按[会话切换](deployment.md#会话协议切换检查)处理。需重登先保全未确认动作的 ID/key；403 不证明此前请求未提交，也不授权自动重发。账户管理没有通用排障 CLI，不用 SQL 或 bootstrap 代替。"}, {"title": "登录防护的排查与恢复", "level": "h2", "anchor": "登录防护的排查与恢复", "text": "## 登录防护的排查与恢复\n\n不连续请求登录接口制造样本。429 记录 Retry-After 后停止快速重试，查共享出口、重复 challenge 与可信代理；一次正常登录通常消耗两次来源请求。等待不保证下次成功，不轮询、换来源或删除配额“解锁”。\n\n503 先区分应用 `login_protection_unavailable` 与代理错误，再查指定 Redis 的可用性、命令权限、容量/驱逐、TTL/状态损坏与超时。PING 不证明 EVAL/SET/GETDEL 可用；前端通用文案也不直接说明根因。\n\n修配置、重启、切 Redis 或主动登录验证已超出只读分诊，需批准的环境、专用账号及影响评审；不提供 FLUSHDB/删 key 命令。修复后分别验来源不可伪造、正常登录、429 等待和 503 不放行验证。登录防护恢复不代表旧会话、Worker 或外部效果恢复。\n\n当前 Web 的 1–300 秒合法值只作静态提示，并非倒计时或强制按钮锁定；通信失败/离页按[提交未知](../design/login-protection.md#提交离页与结果未知)处理，不从未跳页断言没有登录成功。"}, {"title": "项目与归档的只读分诊", "level": "h2", "anchor": "项目与归档的只读分诊", "text": "## 项目与归档的只读分诊\n\n先核对原 project_id、调用者和服务端状态；失效深链接保持原目标，页面须经精确详情授权，导航选中项不能代替该检查。\n\n| 症状 | 核对与停止条件 |\n| --- | --- |\n| 移出成员后仍可访问 | 系统 ADMIN 不依赖 membership，成员移除不是账户降权 |\n| 归档后仍有 Run/Effect | 归档不是取消或全局停写，按原对象停止协议处理 |\n| 无 Run 但 DELETE 失败 | TaskSchedule 或成员审计仍会阻止删除；原版本冲突须核对，不拆外键、删历史或循环 DELETE |\n| 204 后仍有附件/备份 | 只证明所列元数据删除，不证明字节清理；不递归删目录 |\n\n写入修复先确认权限、目标和可恢复性；正本见[项目生命周期](../design/project-lifecycle.md)。"}, {"title": "文档保存与删除的只读分诊", "level": "h2", "anchor": "文档保存与删除的只读分诊", "text": "## 文档保存与删除的只读分诊\n\n保留原 Project/document ID、时点、status/code 与版本；未返回 ID 的上传保留受控本地路径，不把正文/内部 key 放入报告。\n\n| 症状 | 核对与停止条件 |\n| --- | --- |\n| 同名 409 且占用增加 | blob 先于 metadata 约束写入，可能有孤立对象；不重复上传验证 |\n| 目录仅部分完成 | 逐文件分清确认与未知；done 不是成功数，不重传整批 |\n| DELETE 报错后 ID 消失 | metadata 可能已提交；404 不恢复清理，不循环删或改删同路径新 ID |\n| 204 后对象仍在 | S3 适配器可能吞权限等错误，授权存储负责人核对原对象，不清 Project 前缀 |\n| 下载失败/内容不符 | 查非 Latin-1 文件名 header、元数据/实际字节及存储，不改 checksum 掩盖损坏 |\n\n没有通用孤立对象清理/配额修复 CLI；[文档生命周期](../design/document-lifecycle.md)定义修正边界。冻结输入不能靠同名重传修复。"}, {"title": "准备故障的只读分诊", "level": "h2", "anchor": "准备故障的只读分诊", "text": "## 准备故障的只读分诊\n\n查已有 Run/Attempt、日志和输入回执，不启动模型或重做物化。内部回执没有公开管理 API。\n\n| 观察 | 核对与停止条件 |\n| --- | --- |\n| RUNNING 但无 Session | 运行态与 prepared event 可在 ContextBuilder 前产生，先查准备错误/回执/Brief |\n| preparation_timeout | 查准备配置、资源耗时和回执提交；模型 wall timeout 不是替代 |\n| context_build_failed | 查脱敏异常、冻结来源、binding 和消费者，不一律归因网络 |\n| 首次世代创建被拒绝 | 旧 .projectmind-inputs、其他 UUID 或 symlink 都可阻止；保留现场，不删除或补 READY |\n| 执行权异常、不断接管 | 查 lease/token 与 Attempt 时间线，旧 Worker 不得强写终态 |\n| 已接受取消但未结束 | 查取消意图/lease/Session；按钮或 CANCELLED 不证明进程退出 |\n| READY 但 Run 失败 | 输入就绪不保证 Brief/模型成功，不删完成回执解锁 |\n\n计时器见[执行限额](../design/run-budgets.md#现有计时器的覆盖范围)。提交未知时保持输入不可用、保留原世代，不填 READY 或用新世代覆盖。实际停机测试另见[接管](#worker-喪失と接管)。"}, {"title": "资源快照排障", "level": "h2", "anchor": "资源快照排障", "text": "## 资源快照排障\n\n核对部署版本、Run sources、冻结 manifest、回执所指世代和实际 revision，不以今日文档列表、HEAD 或同名物理目录代替。缺 ID、hash 不符或混入文件时保留现场，不重传同名文件、删缓存或改 snapshot；可信输入必须改变时创建新 Run，旧事实保留。\n\n响应丢失先按[原创建请求](../design/run-creation.md)确认，已有 Run 的 PREPARING/READY/缺回执则按[输入中断规则](../design/resource-snapshots.md#准备中断与再次使用)处理。hash、目录完整和 migration 成功均不是放行证据；无补签/修复 CLI。"}, {"title": "WAITING 状态", "level": "h2", "anchor": "waiting-状态", "text": "## WAITING 状态\n\nWAITING_FOR_INPUT/APPROVAL 不是终态或 Worker 卡死。查 Interaction、Proposal、Brief/checkpoint、Session 与事件：人工等待释放主执行 lease，但已批准 Effect 可持有独立 lease；不要重复批准。正常答案追加 Segment，技术重试才在原 Segment 追加 Attempt。\n\n普通超期以 INTERACTION_TIMEOUT Segment 续行，不代选答案；批准超期则失效且不写外部。410 可能发生在过期续行提交后，先读保存状态，不换 key 补答案。只有 EFFECT_APPROVAL Interaction 而无 Proposal 时保留现场，不能用普通答复或手写审批修复。\n\nSession resume 要求 transcript/workspace 与 engine/model 兼容；fork 保留 parent/checkpoint；replace 从可信 checkpoint 建新会话。它们不是任意切换 CLI，均不得改变冻结版本、权限、资源或预算。PRIMARY 最多一个 ACTIVE，不以含子会话的 ACTIVE 总数判重。详见[普通交互](../design/user-interactions.md)与[Runtime](../design/agent-runtime.md)。"}, {"title": "结果与评价的只读分诊", "level": "h2", "anchor": "结果与评价的只读分诊", "text": "## 结果与评价的只读分诊\n\n查授权 detail/评价历史，保留 Run/Result/Evaluation ID 与原响应，不复制正文。SUCCEEDED 可与业务 PARTIAL/BLOCKED 并存；模型说 APPLIED 不替代平台 Effect/read-back，引用/Artifact 计数不证明内容可读。\n\n评价 pointer 相对 detail.result.data；400 查原值根，409 查 Result 存在性，401/403 回认证分诊。无评价不等于无 Result。响应丢失不能靠同文/时间确认原提交，也不自动 POST、删除重复项或改原值。见[结果与评价](../design/results-evaluation.md)。"}, {"title": "Schedule 与 Recovery 的监视", "level": "h2", "anchor": "schedule-与-recovery-的监视", "text": "## Schedule 与 Recovery 的监视\n\ntick 的 created/skipped/failed、Schedule 的 last_*、计数与业务结果分开。FAILED_PRECONDITION 回写后进入 ERROR，但基础设施异常未必留下状态；不补造触发或改 DB 计数。\n\n| 异常 | 实际边界 |\n| --- | --- |\n| 迟到/漏跑 | 当前可能执行最早迟到 occurrence，再跳过后续过期时刻；missed_count 单次最多 1000 |\n| last_* 不一致 | 跳过/失败可保留旧 Run ID，不能拼成同一次执行事实 |\n| next_run_at 已进但无 Run | 认领后创建前有崩溃窗口，尚无持久在途账本 |\n| 编辑/停止同时触发 | 旧回写可能影响新配置；查 occurrence、操作时点和关联 Run |\n| 同 Task 多 Run | 仅检查本 Schedule 的 last_run_id，不覆盖手动或其他 Schedule |\n| 页面找不到 Schedule | 查授权分页 API；前 100 条/当前 catalog 可漏显，不因此重建。编辑目前无页面入口 |\n\n保留 Schedule ID、带 offset 的 occurrence、原键与日志；时间同时核对规则和浏览器时区。摘要不足就保持未知，不伪造结算。Run/Effect lease、Interaction/Proposal 超期的 recovery 计数分别观察；Effect 技术重试保持原身份，未知远端仍先对账。正本见[调度](../design/task-scheduling.md)。"}, {"title": "Repository 与 CAS 接入", "level": "h2", "anchor": "repository-与-cas-接入", "text": "## Repository 与 CAS 接入\n\n读取先查 [repository source](../../PJM/backend/src/projectmind/agent/repository_source.py)：Git 支持 http/https/file，SVN 另支持 svn，不接受 SSH 或 URI 密码。Secret 格式 username:secret（首冒号切分），无冒号用 x-access-token 用户名；Git 认证经环境、SVN 密码经 stdin，不进 argv。image 需 git/subversion，超时由 PROJECTMIND_REPOSITORY_COMMAND_TIMEOUT_SECONDS 控制。\n\npaths 是硬范围，冻结选择后记录实际 commit/SVN revision。普通不可读文件可 skipped，冻结来源/hash 不符必须失败；原始 stderr 不进入 Agent/Evidence。\n\nRedmine 写入必须经声明 issue.update/v1、atomic_precondition=revision、idempotency=key 的 CAS adapter，先检 well-known Provider 协议，再 pre-read/apply/read-back；不回退普通更新接口。Integration 配置与 SecretReference 变化不得改写原 Run binding。\n\nrepository.write/v1 始终人工批准：direct 是缺省，Git fast-forward、不 force，default_revision 必须是具体 branch；branch 使用 projectmind/ 命名空间。同名同内容不证明本次执行。SVN 当前未固定批准基线，不能保证排除已变化的 revision。\n\n自动 PR/MR 仅 Git branch + 完整 forge_kind/forge_api_base_url/forge_project；未配置只保留 branch/commit，部分配置拒绝。PR 失败不撤销 commit，也不替代执行前批准。target_stale 重新观察/提案，见[受控写入](../design/repository-effects.md)。"}, {"title": "Incident 与 recovery", "level": "h2", "anchor": "incident-与-recovery", "text": "## Incident 与 recovery\n\n保留关联 ID、Provider/capability 版、Proposal checksum、请求指纹、幂等键 hash、批准与 apply/read-back 状态。分别查批准保存、远端写入、回读、PR 与本地 finalize，不能合成一个 FAILED。\n\n| 原执行的外部事实 | 处理 |\n| --- | --- |\n| 已应用且回读一致 | 沿原身份确认既有结果，不再写 |\n| 明确未应用 | 仍复查批准/scope/期限/revision，只走原受控恢复路径 |\n| 未知或部分成功 | 保持隔离对账，不换键、强推、改 SQL 或盲目重试 |\n\n当前重试可能重新运行整个 Provider，无“只补 PR”或通用补账 CLI。Effect lease 过期不证明旧请求停止；恢复 DB 不证明远端未执行。不要仅重启 Worker 促使自动恢复。人工外部修正需受控 incident 记录及适用 Evaluation，不覆盖原 Effect/Result。"}, {"title": "MANAGED Secret の KEK 運用", "level": "h2", "anchor": "managed-secret-の-kek-運用", "text": "## MANAGED Secret の KEK 運用\n\nMANAGED 直接用部署主密钥 AES-256-GCM，不是 DEK/KEK 两层信封。keyring 为逗号分隔 version:base64key，每个 key 为 32 字节；首项新加密，其余解旧密文。通过环境 Secret 管理注入，不展示 key。丢失 KEK 无法由 DB 备份补救。\n\n按[切换与恢复顺序](../design/secret-storage.md#切换与恢复的顺序)确认备份、维护窗口、全部读写进程和旧备份解密条件。API/Worker 启动加载 cipher，仅改 CLI 环境不更新现有实例；新标签必须配新 key，不能同标签换 bytes。\n\n获批窗口在已配置目标环境执行 `python -m projectmind.ops.rotate_secrets`。它锁定并改写材料，不是只读操作，也不改 Run/binding 身份。检查退出/数量与所需解封；active 行 skipped 不验证解密，全部 skipped 不证明成功。没有全量只读解密 CLI，不输出明文替代验证。\n\n旧备份仍需旧 KEK 时继续独立保管。版本不明、密钥缺失或认证失败一律拒绝，不降明文。MANAGED 不防护同时掌控 host/process 与 DB 的攻击者，外部 KMS/HSM 尚未实现。"}, {"title": "验收与故障注入", "level": "h2", "anchor": "验收与故障注入", "text": "## 验收与故障注入"}, {"title": "通常 smoke", "level": "h3", "anchor": "通常-smoke", "text": "### 通常 smoke\n\nsmoke 会调用模型、创建 Run/Evaluation 并测试取消，有费用和持久写入。使用获准专用环境、Project 与 published task；先满足[Worker 放行](deployment.md#启动与放行)、dispatch 和模型凭据前置。单独 Project 不隔离旧 job/cron。\n\n明确设置测试 UUID 为 SMOKE_PROJECT_ID 后执行，未指定会拒绝：\n\n```bash\npython3 scripts/compose.py -- exec \\\n  -e PROJECTMIND_SMOKE_PROJECT_ID=\"$SMOKE_PROJECT_ID\" \\\n  api python -m projectmind.ops.smoke\n```\n\n密码经 TTY。可用 PROJECTMIND_SMOKE_SKILL_VERSION_ID / TASK_KEY 固定任务、TASK_INPUT_JSON / TASK_SOURCES_JSON 提供合法输入（后面三项同样带 PROJECTMIND_SMOKE_ 前缀）。不把真实正文/凭据放共享 shell history。通过覆盖认证、创建重放、结果/证据、追加评价、SSE 与取消，不代表全部 Provider、页面或业务质量。"}, {"title": "Worker 喪失と接管", "level": "h3", "anchor": "worker-喪失と接管", "text": "### Worker 喪失と接管\n\n仅在可停机专用环境注入。分别选择准备中、模型执行中的测试 Run，保留 Run/Segment/Attempt、快照和 lease；RUNNING 不证明模型已启动。\n\n```bash\nLEASE_SECONDS=\"$(python3 scripts/compose.py -- exec -T api python -c \\\n  'from projectmind.core.settings import get_settings; print(get_settings().run_lease_seconds)')\"\npython3 scripts/compose.py -- stop worker\n```\n\n确认 LEASE_SECONDS 是有效秒数，等待该时长加 recovery cron 观察窗口后才启动 Worker。20 秒只是余量，不保证完成恢复：\n\n```bash\nsleep \"$((LEASE_SECONDS + 20))\"\npython3 scripts/compose.py -- start worker\npython3 scripts/compose.py -- logs --no-log-prefix --tail=200 worker\n```\n\n观察实际 recovery tick：旧 Attempt 为 LEASE_EXPIRED，Run 经 RETRY_PENDING 在原 Segment 追加 Attempt，快照不变；超限以 retry_exhausted 失败。准备中断不允许新 Attempt 补签旧 PREPARING 为 READY。部署版本和真实持久恢复分别验，不用 mock test 或仅模型阶段成功代替。"}, {"title": "Log 確認と incident 記録", "level": "h2", "anchor": "log-確認と-incident-記録", "text": "## Log 確認と incident 記録\n\n在受控终端按服务器响应的 request/trace ID 或 Run/Attempt ID 缩小 JSON 日志，再关联 Session/Effect；客户端自带 X-Request-ID 不是当前服务器审计值，request ID 也不是重放键。\n\n```bash\npython3 scripts/compose.py -- logs --no-log-prefix api worker \\\n  | jq -c 'select(.run_id == \"\u003cRUN_ID>\" or .trace_id == \"\u003cTRACE_ID>\")'\n```\n\n原日志可能包含敏感上下文，对外只转录[运用原则](#运用原则)所列脱敏事实，不附 Tool 参数/结果、Evidence 或全量配置。"}], "toc": [{"title": "按问题找入口", "anchor": "按问题找入口", "level": "h2"}, {"title": "运用原则", "anchor": "运用原则", "level": "h2"}, {"title": "认证故障的只读分诊", "anchor": "认证故障的只读分诊", "level": "h2"}, {"title": "登录防护的排查与恢复", "anchor": "登录防护的排查与恢复", "level": "h2"}, {"title": "项目与归档的只读分诊", "anchor": "项目与归档的只读分诊", "level": "h2"}, {"title": "文档保存与删除的只读分诊", "anchor": "文档保存与删除的只读分诊", "level": "h2"}, {"title": "准备故障的只读分诊", "anchor": "准备故障的只读分诊", "level": "h2"}, {"title": "资源快照排障", "anchor": "资源快照排障", "level": "h2"}, {"title": "WAITING 状态", "anchor": "waiting-状态", "level": "h2"}, {"title": "结果与评价的只读分诊", "anchor": "结果与评价的只读分诊", "level": "h2"}, {"title": "Schedule 与 Recovery 的监视", "anchor": "schedule-与-recovery-的监视", "level": "h2"}, {"title": "Repository 与 CAS 接入", "anchor": "repository-与-cas-接入", "level": "h2"}, {"title": "Incident 与 recovery", "anchor": "incident-与-recovery", "level": "h2"}, {"title": "MANAGED Secret の KEK 運用", "anchor": "managed-secret-の-kek-運用", "level": "h2"}, {"title": "验收与故障注入", "anchor": "验收与故障注入", "level": "h2"}, {"title": "通常 smoke", "anchor": "通常-smoke", "level": "h3"}, {"title": "Worker 喪失と接管", "anchor": "worker-喪失と接管", "level": "h3"}, {"title": "Log 確認と incident 記録", "anchor": "log-確認と-incident-記録", "level": "h2"}], "source": "operations/runbook.md", "checksum": "9f01005b057b438de68a2d089137eeb7ce4287d55ec55dfd50bc39bc04478e96"}, {"id": "PJM/AGENTS.md", "title": "ProjectMind エージェント開発規約", "group": "code", "html": "\u003ch1 id=\"projectmind-エージェント開発規約\">ProjectMind エージェント開発規約\u003c/h1>\n\u003cp>本規約は ProjectMind 全体に適用する。起動・コード配置は \u003ca href=\"#PJM/README.md::\">README\u003c/a>、詳細設計は \u003ca href=\"#docs/README.md::\">docs\u003c/a> に置き、ここへ重複させない。\u003c/p>\n\u003ch2 id=\"作業前に読むもの\">作業前に読むもの\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">計画の現在状態\u003c/a>で現在の実装・差距・作業範囲を確認する。規約の存在を実装済みの証拠にしない。\u003c/li>\n\u003cli>\u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>から対象設計を選ぶ。仕様とコードが矛盾する場合は影響を明示して整合させ、推測で片方を書き換えない。\u003c/li>\n\u003cli>変更に該当する以下の細則を読み、遵守する。文書だけの変更では実装細則を一律に読み直す必要はない。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>変更対象\u003c/th>\n\u003cth>必読の細則\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Backend・共通処理\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/coding-rules.md::backend\">Backend と単一実装\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run・Worker・Session・調度\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/coding-rules.md::run-lifecycle\">Run lifecycle\u003c/a>と対象の設計\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/coding-rules.md::web\">Web の責任分担\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>設定・契約・DB・Tool・system Skill\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">変更の同期点\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compose・Ingress\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/coding-rules.md::ingress\">配備境界\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文書・閲覧版\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/documentation.md::\">文書維持と検証\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ccode>docs/01\u003c/code>・\u003ccode>docs/06\u003c/code> 等のコード注釈は旧文書番号であり、\u003ca href=\"#docs/README.md::%E6%97%A7%E7%95%AA%E5%8F%B7%E3%81%AE%E5%AF%BE%E5%BF%9C\">対応表\u003c/a>から辿る。注釈を一括 path 置換しない。\u003c/p>\n\u003ch2 id=\"変更してはいけない境界\">変更してはいけない境界\u003c/h2>\n\u003cul>\n\u003cli>Backend は API/Worker が同じ package を共有するモジュラーモノリス。Business 層は \u003ccode>AgentEngine\u003c/code> 抽象へ依存し、SDK 型へ直接依存しない。route/ARQ job に業務規則を埋め込まない。\u003c/li>\n\u003cli>業務 API の認証・授権は \u003ccode>api/auth_dependencies.py\u003c/code> の actor dependency に集約する。越権と不存在は同じ 404、unsafe request は Origin/CSRF を検証する。\u003c/li>\n\u003cli>Run snapshot・権限上限・Result は不変。人工修正は Evaluation、回答/承認による継続は新 Segment、同 Segment の復旧は新 Attempt とする。\u003c/li>\n\u003cli>PostgreSQL は Run/監査の正本。Redis は Queue・短期 Lock・通知に限定する。凍結 snapshot や歴史記録を「整合」のために書き換えない。\u003c/li>\n\u003cli>Skill は Organization 資産 + Project 明示有効化。Blueprint は Interpreter のみが生成し、Manifest からの逆算や blueprint 無しの発行を復活させない。\u003c/li>\n\u003cli>guidance・source script・model の提案は権限ではない。未知の業務 capability と実行可能な登録済み versioned Tool capability を区別し、公開 checksum に一致しない Script を実行しない。\u003c/li>\n\u003cli>SDK 組み込み Tool は \u003ccode>DENIED_BUILTIN_TOOLS\u003c/code> で fail closed。\u003ccode>cwd\u003c/code> は隔離境界ではない。Run workspace の write は \u003ccode>workspace/\u003c/code>・\u003ccode>output/\u003c/code> のみ、凍結 \u003ccode>input/\u003c/code> は読取専用とする。\u003c/li>\n\u003cli>外部 write は observe → propose → apply。ChangeProposal、承認/明示的低 risk 事前許可、登録 Provider、固定 scope、競合制御、idempotency、read-back を必須とする。\u003ccode>repository.write/v1\u003c/code> は事前許可不可・force 不使用。\u003c/li>\n\u003cli>生成 FrontendModule、並行子 Agent、Shell/network の拡張は、計画を先に更新し、脅威モデル・対象設計の門禁を満たすまで追加しない。実装済みの局部を全面開放の許可にしない。\u003c/li>\n\u003cli>生成 bundle は \u003ccode>Content-Security-Policy: sandbox allow-scripts\u003c/code> を必須とし、iframe に \u003ccode>allow-same-origin\u003c/code> を付けない。子 Agent の能力は \u003ccode>resolve_subagent_capabilities\u003c/code> で拒否規則を強制し、Run 共通予算を迂回しない。\u003c/li>\n\u003cli>業務固有 Schema・active seed・専用 renderer を generic service/API/通常 Workspace の rule source に戻さない。参照済み SkillVersion/Run は read-only audit asset として保持する。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"共通実装の利用規約\">共通実装の利用規約\u003c/h2>\n\u003cp>同じ意味の処理を複製しない。\u003ca href=\"#docs/development/coding-rules.md::backend\">細則の単一実装表\u003c/a>で hash、redaction、lease、event/outbox、認可、binding、repository、effect、binary 変換の入口を確認する。\u003c/p>\n\u003ch2 id=\"言語とコード\">言語とコード\u003c/h2>\n\u003cul>\n\u003cli>会話は中国語。AGENTS/README と code の docstring/JSDoc/コメントは日本語、識別子・公開 field・Schema key は既存表記を維持する。\u003c/li>\n\u003cli>Class・関数・method・Component・型・fixture・migration entry point に責務の説明を付ける。複雑な分岐・安全境界・transaction・復旧には「なぜ必要か」を書き、変更時に古いコメントも直す。単純な代入や return に逐語的コメントを付けない。\u003c/li>\n\u003cli>Python は \u003ccode>from __future__ import annotations\u003c/code> を維持する。広い \u003ccode>Exception\u003c/code> 捕捉は理由のある境界層に限定する。\u003c/li>\n\u003cli>TypeScript strict を維持し、\u003ccode>any\u003c/code> で契約を回避しない。Effect は cleanup、非同期結果は unmount/対象切替後に反映しない。三語文案は共有 catalog に置く。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"よくある変更の同期点\">よくある変更の同期点\u003c/h2>\n\u003cp>契約・Schema/example・OpenAPI・Backend/Web consumer と回帰を同時に確認する。\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%AD%A5%E7%82%B9\">同期表\u003c/a>を適用し、公開契約の変更は \u003ca href=\"#docs/development/contract-workflow.md::\">契約 workflow\u003c/a>に従う。\u003c/p>\n\u003ch2 id=\"検証と変更規律\">検証と変更規律\u003c/h2>\n\u003cul>\n\u003cli>動作変更と同時に \u003ccode>tests/\u003c/code> の対応回帰を追加/更新し、test 名は検証する振る舞いを表す。\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">変更別検証\u003c/a>を実行し、mock・実 DB・配備・モデルの証拠を区別する。未実行・skip・失敗と残る risk を報告する。\u003c/li>\n\u003cli>文書のみなら build/check・文書工具回帰・関連例・変更した閲覧経路を検証する。生成 HTML を直接編集せず、Skill の SKILL.md/references を文書整理に巻き込まない。\u003c/li>\n\u003cli>既存の変更を保全し、生成 lockfile を手編集しない。Credential・内部 URL・Ticket 本文・Gold・Secret を fixture/ログへ入れない。\u003c/li>\n\u003cli>Git の初期化・commit・push・履歴変更、破壊的操作はユーザーの明示依頼なしに行わない。実 DB・モデル・外部 write の検証は対象と副作用を確認してから行う。\u003c/li>\n\u003cli>完了時は設計との整合、必要な同期、実際の検証結果を報告する。現在の状態が変わる場合だけ計画を更新し、文書整理の履歴ページは新設しない。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "ProjectMind エージェント開発規約", "level": "h1", "anchor": "projectmind-エージェント開発規約", "text": "# ProjectMind エージェント開発規約\n\n本規約は ProjectMind 全体に適用する。起動・コード配置は [README](README.md)、詳細設計は [docs](../docs/README.md) に置き、ここへ重複させない。"}, {"title": "作業前に読むもの", "level": "h2", "anchor": "作業前に読むもの", "text": "## 作業前に読むもの\n\n1. [計画の現在状態](../docs/planning/roadmap.md#当前执行状态)で現在の実装・差距・作業範囲を確認する。規約の存在を実装済みの証拠にしない。\n2. [変更ガイド](../docs/development/change-guide.md)から対象設計を選ぶ。仕様とコードが矛盾する場合は影響を明示して整合させ、推測で片方を書き換えない。\n3. 変更に該当する以下の細則を読み、遵守する。文書だけの変更では実装細則を一律に読み直す必要はない。\n\n| 変更対象 | 必読の細則 |\n| --- | --- |\n| Backend・共通処理 | [Backend と単一実装](../docs/development/coding-rules.md#backend) |\n| Run・Worker・Session・調度 | [Run lifecycle](../docs/development/coding-rules.md#run-lifecycle)と対象の設計 |\n| Web | [Web の責任分担](../docs/development/coding-rules.md#web) |\n| 設定・契約・DB・Tool・system Skill | [変更の同期点](../docs/development/coding-rules.md#同步点) |\n| Compose・Ingress | [配備境界](../docs/development/coding-rules.md#ingress) |\n| 文書・閲覧版 | [文書維持と検証](../docs/development/documentation.md) |\n\n`docs/01`・`docs/06` 等のコード注釈は旧文書番号であり、[対応表](../docs/README.md#旧番号の対応)から辿る。注釈を一括 path 置換しない。"}, {"title": "変更してはいけない境界", "level": "h2", "anchor": "変更してはいけない境界", "text": "## 変更してはいけない境界\n\n- Backend は API/Worker が同じ package を共有するモジュラーモノリス。Business 層は `AgentEngine` 抽象へ依存し、SDK 型へ直接依存しない。route/ARQ job に業務規則を埋め込まない。\n- 業務 API の認証・授権は `api/auth_dependencies.py` の actor dependency に集約する。越権と不存在は同じ 404、unsafe request は Origin/CSRF を検証する。\n- Run snapshot・権限上限・Result は不変。人工修正は Evaluation、回答/承認による継続は新 Segment、同 Segment の復旧は新 Attempt とする。\n- PostgreSQL は Run/監査の正本。Redis は Queue・短期 Lock・通知に限定する。凍結 snapshot や歴史記録を「整合」のために書き換えない。\n- Skill は Organization 資産 + Project 明示有効化。Blueprint は Interpreter のみが生成し、Manifest からの逆算や blueprint 無しの発行を復活させない。\n- guidance・source script・model の提案は権限ではない。未知の業務 capability と実行可能な登録済み versioned Tool capability を区別し、公開 checksum に一致しない Script を実行しない。\n- SDK 組み込み Tool は `DENIED_BUILTIN_TOOLS` で fail closed。`cwd` は隔離境界ではない。Run workspace の write は `workspace/`・`output/` のみ、凍結 `input/` は読取専用とする。\n- 外部 write は observe → propose → apply。ChangeProposal、承認/明示的低 risk 事前許可、登録 Provider、固定 scope、競合制御、idempotency、read-back を必須とする。`repository.write/v1` は事前許可不可・force 不使用。\n- 生成 FrontendModule、並行子 Agent、Shell/network の拡張は、計画を先に更新し、脅威モデル・対象設計の門禁を満たすまで追加しない。実装済みの局部を全面開放の許可にしない。\n- 生成 bundle は `Content-Security-Policy: sandbox allow-scripts` を必須とし、iframe に `allow-same-origin` を付けない。子 Agent の能力は `resolve_subagent_capabilities` で拒否規則を強制し、Run 共通予算を迂回しない。\n- 業務固有 Schema・active seed・専用 renderer を generic service/API/通常 Workspace の rule source に戻さない。参照済み SkillVersion/Run は read-only audit asset として保持する。"}, {"title": "共通実装の利用規約", "level": "h2", "anchor": "共通実装の利用規約", "text": "## 共通実装の利用規約\n\n同じ意味の処理を複製しない。[細則の単一実装表](../docs/development/coding-rules.md#backend)で hash、redaction、lease、event/outbox、認可、binding、repository、effect、binary 変換の入口を確認する。"}, {"title": "言語とコード", "level": "h2", "anchor": "言語とコード", "text": "## 言語とコード\n\n- 会話は中国語。AGENTS/README と code の docstring/JSDoc/コメントは日本語、識別子・公開 field・Schema key は既存表記を維持する。\n- Class・関数・method・Component・型・fixture・migration entry point に責務の説明を付ける。複雑な分岐・安全境界・transaction・復旧には「なぜ必要か」を書き、変更時に古いコメントも直す。単純な代入や return に逐語的コメントを付けない。\n- Python は `from __future__ import annotations` を維持する。広い `Exception` 捕捉は理由のある境界層に限定する。\n- TypeScript strict を維持し、`any` で契約を回避しない。Effect は cleanup、非同期結果は unmount/対象切替後に反映しない。三語文案は共有 catalog に置く。"}, {"title": "よくある変更の同期点", "level": "h2", "anchor": "よくある変更の同期点", "text": "## よくある変更の同期点\n\n契約・Schema/example・OpenAPI・Backend/Web consumer と回帰を同時に確認する。[同期表](../docs/development/coding-rules.md#同步点)を適用し、公開契約の変更は [契約 workflow](../docs/development/contract-workflow.md)に従う。"}, {"title": "検証と変更規律", "level": "h2", "anchor": "検証と変更規律", "text": "## 検証と変更規律\n\n- 動作変更と同時に `tests/` の対応回帰を追加/更新し、test 名は検証する振る舞いを表す。[変更別検証](../docs/development/local-development.md#変更に応じた検証)を実行し、mock・実 DB・配備・モデルの証拠を区別する。未実行・skip・失敗と残る risk を報告する。\n- 文書のみなら build/check・文書工具回帰・関連例・変更した閲覧経路を検証する。生成 HTML を直接編集せず、Skill の SKILL.md/references を文書整理に巻き込まない。\n- 既存の変更を保全し、生成 lockfile を手編集しない。Credential・内部 URL・Ticket 本文・Gold・Secret を fixture/ログへ入れない。\n- Git の初期化・commit・push・履歴変更、破壊的操作はユーザーの明示依頼なしに行わない。実 DB・モデル・外部 write の検証は対象と副作用を確認してから行う。\n- 完了時は設計との整合、必要な同期、実際の検証結果を報告する。現在の状態が変わる場合だけ計画を更新し、文書整理の履歴ページは新設しない。"}], "toc": [{"title": "作業前に読むもの", "anchor": "作業前に読むもの", "level": "h2"}, {"title": "変更してはいけない境界", "anchor": "変更してはいけない境界", "level": "h2"}, {"title": "共通実装の利用規約", "anchor": "共通実装の利用規約", "level": "h2"}, {"title": "言語とコード", "anchor": "言語とコード", "level": "h2"}, {"title": "よくある変更の同期点", "anchor": "よくある変更の同期点", "level": "h2"}, {"title": "検証と変更規律", "anchor": "検証と変更規律", "level": "h2"}], "source": "../PJM/AGENTS.md", "checksum": "b3bf1d4955fbf0fd7f8e268051ae5badd1c3eddef87d843326820e88eee0bdd0"}, {"id": "PJM/README.md", "title": "ProjectMind", "group": "code", "html": "\u003ch1 id=\"projectmind\">ProjectMind\u003c/h1>\n\u003cp>Skill を Project のタスクとして実行し、根拠・結果・人工評価・外部変更の承認を記録する AI Agent プラットフォーム。\nこの README はコードと操作の入口。設計本文は \u003ccode>../docs/\u003c/code>、変更規約は \u003ca href=\"#PJM/AGENTS.md::\">AGENTS.md\u003c/a> に集約する。\u003c/p>\n\u003cp>\u003ca href=\"index.html\">文書ブラウザ\u003c/a> · \u003ca href=\"#docs/README.md::\">文書ガイド\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::%E5%BD%93%E5%89%8D%E6%89%A7%E8%A1%8C%E7%8A%B6%E6%80%81\">現在の計画\u003c/a>\u003c/p>\n\u003ch2 id=\"はじめに\">はじめに\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目的\u003c/th>\n\u003cth>読む場所\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>全体を理解する\u003c/td>\n\u003ctd>\u003ca href=\"#docs/overview/product.md::\">製品概要\u003c/a> / \u003ca href=\"#docs/overview/architecture.md::\">システム構成\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>開発を始める\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/local-development.md::\">環境構築・検証\u003c/a> / \u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>起動・更新・復旧する\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/quickstart.md::\">初回起動\u003c/a> / \u003ca href=\"#docs/operations/deployment.md::\">公開・移行\u003c/a> / \u003ca href=\"#docs/operations/backup-recovery.md::\">復元\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API を扱う\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/api-usage.md::\">利用ガイド\u003c/a> / \u003ca href=\"#docs/development/contract-workflow.md::\">契約変更\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>設計・障害を調べる\u003c/td>\n\u003ctd>\u003ca href=\"#docs/design/README.md::\">設計の責任分担\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::%E6%8C%89%E9%97%AE%E9%A2%98%E6%89%BE%E5%85%A5%E5%8F%A3\">Runbook\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>コードは \u003ca href=\"#PJM/README.md::backend\">Backend\u003c/a>・\u003ca href=\"#PJM/README.md::web\">Web\u003c/a>・\u003ca href=\"#PJM/README.md::contracts\">Contracts\u003c/a>・\u003ca href=\"#PJM/README.md::scripts\">Scripts\u003c/a>・\u003ca href=\"#PJM/README.md::skills\">Skills\u003c/a>・\u003ca href=\"#PJM/README.md::images\">Images\u003c/a> に分ける。\n実装の不足と検証範囲は上記の計画を正本とする。\u003c/p>\n\u003ch2 id=\"実行前の注意\">実行前の注意\u003c/h2>\n\u003cul>\n\u003cli>Python 3.12、Node.js 26 / pnpm 11.7.0 を使う。DB・Redis・object storage と接続設定は別途必要。\u003c/li>\n\u003cli>Compose は既存の共有 Traefik を使い、host port を公開しない。\u003ccode>make run\u003c/code> は配備検査後に API/Web だけを起動する。\u003c/li>\n\u003cli>dispatch=false は既存 job・cron を止めない。\u003ca href=\"#docs/operations/deployment.md::%E4%B8%80%E4%B8%AA%E4%BE%8B%E5%AD%90%E5%85%B3%E9%97%AD-dispatch-%E5%90%8E%E4%BB%8D%E6%9C%89%E5%B7%A5%E4%BD%9C\">保守時の停止範囲\u003c/a>を確認する。\u003c/li>\n\u003cli>通常の初期 ADMIN 作成は \u003ccode>python -m projectmind.ops.bootstrap_admin\u003c/code>。\u003ccode>make bootstrap-admin\u003c/code> は全 volume を消す。\u003c/li>\n\u003cli>\u003ca href=\"#docs/operations/deployment.md::%E7%8E%AF%E5%A2%83%E6%96%87%E4%BB%B6%E4%B8%8E%E9%85%8D%E7%BD%AE%E8%BE%B9%E7%95%8C\">共通設定入口\u003c/a>で ENV_FILE と Compose project を明示する。配備は load/migrate/api/worker の独立段階で、宿主にも Python 3.12 が必要。\u003c/li>\n\u003c/ul>\n\u003ch2 id
