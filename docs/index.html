ことのみを示し、\u003ccode>NOT_OBSERVED\u003c/code>/\u003ccode>CONFLICT\u003c/code> は自動再送を認可しない。結果不明や部分成功は原記録を保持し、キー変更・強制 push・Worker 再起動による復旧促進を行わない。外部 Git・DB・文書・MCP の変更はローカル収束より先に完了し得るため、DB 復元では外部変更を取り消せない。\u003c/p>\n\u003ch2 id=\"managed-secret-の-kek-運用\">MANAGED Secret の KEK 運用\u003c/h2>\n\u003cp>\u003ccode>SKILLMIND_MANAGED_SECRET_KEK\u003c/code> は \u003ccode>version:base64key\u003c/code> のカンマ区切り keyring（各 32 バイト、先頭が新規暗号化用、以降は復号用）を使う。ローテーション時は旧鍵を保全し、鍵を扱う全プロセスに「新 active + 旧鍵」を読み込ませてから以下を実行する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec api python -m skillmind.ops.rotate_secrets\n\u003c/code>\u003c/pre>\n\u003cp>DB 内の暗号文が再ラップされる（終了コードと \u003ccode>rotated\u003c/code>/\u003ccode>skipped\u003c/code> を確認）。旧バックアップに必要な鍵は独立して保管する（DB バックアップから紛失した KEK は復元できない）。\u003c/p>\n\u003ch2 id=\"通常-smoke\">通常 smoke\u003c/h2>\n\u003cp>承認された検証環境でのみ実行する（モデル呼出・Run/Evaluation 作成・取消検証を行う）。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">docker compose --env-file \u0026quot;${ENV_FILE:-.env}\u0026quot; exec \\\n  -e SKILLMIND_SMOKE_PROJECT_ID=\u0026quot;${SMOKE_PROJECT_ID:?Specify the test project UUID}\u0026quot; \\\n  api python -m skillmind.ops.smoke\n\u003c/code>\u003c/pre>\n\u003cp>パスワードは TTY から入力する。\u003ccode>SKILLMIND_SMOKE_SKILL_VERSION_ID\u003c/code>・\u003ccode>TASK_KEY\u003c/code>・\u003ccode>TASK_INPUT_JSON\u003c/code>・\u003ccode>TASK_SOURCES_JSON\u003c/code> で対象タスクを指定できる。\u003c/p>\n", "sections": [{"title": "Skillmind 運用・障害対応", "level": "h1", "anchor": "skillmind-運用障害対応", "text": "# Skillmind 運用・障害対応\n\n症状から対象サービスと原要求を特定して対処を決める。起動は [Quickstart](quickstart.md)、更新は[配備](deployment.md)、データ復元は[復元](backup-recovery.md)、実行境界は[実行・データ保守ガイド](../development/runtime-guide.md)を参照。"}, {"title": "運用原則", "level": "h2", "anchor": "運用原則", "text": "## 運用原則\n\n原応答・Run/Attempt/Effect ID・マスク済みログを優先確認する。PostgreSQL が正本であり、エラー解消のために状態書換・監査削除・キュー消去・キー変更を行わない。共有するのは UTC・版・オブジェクト ID・公開エラーコード・影響範囲のみとし、`.env`・資格情報・業務本文は出さない。調査コマンドは `ENV_FILE`/project を確認した配備ディレクトリで実行する。"}, {"title": "サービスとキュー", "level": "h2", "anchor": "サービスとキュー", "text": "## サービスとキュー\n\n```bash\nmake status\nmake runtime-check\ndocker compose --env-file \"${ENV_FILE:-.env}\" logs --no-log-prefix --tail=200 api worker maintenance\n```\n\n| 症状 | 確認事項 |\n| --- | --- |\n| API 不健全または版不一致 | 配備段階・migration head・DB/Redis・`runtime-check`。[配備](deployment.md#linux-検証と配備)に従い元エラーを特定 |\n| 新規タスク未実行・承認後に継続しない | dispatch スイッチ・`worker` と `maintenance` の健全性・原 Outbox/job。両キューの稼働が必要であり、Run の再作成で実行を促さない |\n| 実行や画面更新が遅い | [性能観測](run-performance.md)に従い準備・モデル/ツール待機・収束・表示を切り分ける |\n| モデル認証や通信の失敗 | Worker のデバイスログイン状態・プロキシ・認証/モデルサービスへの疎通 |"}, {"title": "認証障害の読取トリアージ", "level": "h2", "anchor": "認証障害の読取トリアージ", "text": "## 認証障害の読取トリアージ\n\npath（クエリなし）・status/code/request_id を記録し、ヘッダ有無・cookie 属性・Origin のみを確認する（機密値は記録しない）。\n\n| 応答 | 対処 |\n| --- | --- |\n| 401 `invalid_credentials` / `authentication_required` | 環境・セッション期限・権限を確認。`bootstrap-admin` は最初の ADMIN 作成専用でありアカウント初期化には使えない |\n| 403 `csrf_rejected` | Origin・CSRF header・現セッションを確認。未確認要求を保全し、そのまま再送しない |\n| 403 `administrator_required` / 404 | システム ADMIN と ProjectMember を区別する（404 は越権の秘匿でも返る） |\n| 409 `project_archived` / 版競合 | 対象オブジェクトの最新状態を読み、原要求を保全する（アーカイブは処理中 Run/Effect を取消さない） |\n| 422 | 公開契約に従い入力を修正し、パスワードを含む原値は共有しない |\n\n`login-context` は challenge を発行しクォータを消費するため、ヘルスチェック用途で反復呼出しない。"}, {"title": "ログイン防護の調査と復旧", "level": "h2", "anchor": "ログイン防護の調査と復旧", "text": "## ログイン防護の調査と復旧\n\n429 は `Retry-After` に従い再試行を止め、共有出口 IP や信頼プロキシを確認する。503 `login_protection_unavailable` は Redis の権限・容量・TTL・タイムアウトを確認し、制限回避のための `FLUSHDB`・クォータ削除・送信元ローテーションは行わない。"}, {"title": "文書保存と削除の読取トリアージ", "level": "h2", "anchor": "文書保存と削除の読取トリアージ", "text": "## 文書保存と削除の読取トリアージ\n\nProject/document ID・原 upload key・応答を保全する。改名・移動・復元は同一文書 ID を維持するため、ID と内容ハッシュで照合する。\n\n過去実行から参照されている知識ベース等のファイルは行メニュー「ファイルを更新」を使うか、ファイル/フォルダの一括投入で同ディレクトリ同名ファイルを上書き更新できる（旧ファイルの事前削除は不要）。新規タスクは新版を選択し、過去実行は旧版を維持する。更新競合時は一覧を再読込してから再操作する。\n\n| 症状 | 対処 |\n| --- | --- |\n| アップロード結果不明・`PENDING`・原 key 不在 | 原 key のまま回執を確認し、キーを変えて再送しない |\n| `PUBLISHED` だが一覧にない | 原 document ID で後続の移動/削除を確認し、同名で新規作成しない |\n| 削除 409 | Run・スケジュール・履歴参照を確認し、参照解消を確認できない間は保持する |\n| 削除 503 または応答中断 | まず原文書の現在状態を読み、原アップロード記録とストレージを照合する（ID を変えてやり直さない） |\n| ダウンロード欠落/hash 不一致・ストレージ切替後の読取不可 | 原 ID/key/hash と復元点で照合し、hash 書換や namespace 流用を行わない |\n| 削除後もオブジェクトやクォータが残る | メタデータ削除はストレージ清掃やクォータ精算の完了を意味しない。ストレージ接頭辞を手動再帰削除しない |\n\nごみ箱からは復元可能だが、完全削除は復元できない（原入力・共有参照・結果不明操作の保護対象）。Project の実行一覧が空でも削除監査等の参照が残る場合はアーカイブを維持する。"}, {"title": "準備障害の読取トリアージ", "level": "h2", "anchor": "準備障害の読取トリアージ", "text": "## 準備障害の読取トリアージ\n\n`RUNNING` で Session がない場合は Context 準備・入力回執・Brief を確認する。`preparation_timeout` は準備タイムアウト設定と資源応答時間を、`context_build_failed` は凍結ソースと束縛を確認する。引継ぎが繰り返される場合は lease・Attempt 時系列・エラーを確認する（lease 期限切れや取消受理は旧リモートプロセスの終了を意味しない）。"}, {"title": "WAITING 状態", "level": "h2", "anchor": "waiting-状態", "text": "## WAITING 状態\n\n`WAITING_FOR_INPUT/APPROVAL` は非終端状態であり、原 Interaction/Proposal と期限を確認して回答・承認する。要求タイムアウト・410・通信断時はまず原状態を読み、自動承認範囲は原 Run 開始時の同意に従う。"}, {"title": "結果と評価の読取トリアージ", "level": "h2", "anchor": "結果と評価の読取トリアージ", "text": "## 結果と評価の読取トリアージ\n\n結果の `PARTIAL`/`BLOCKED`・証拠・プラットフォーム書込回執を併せて確認する（モデル自身の保存完了申告は read-back の代替にならない）。評価は原 Result（pointer は `detail.result.data` 相対）に対して行い、送信原キーを保持して結果不明時は重複 POST しない。"}, {"title": "Schedule と Recovery の監視", "level": "h2", "anchor": "schedule-と-recovery-の監視", "text": "## Schedule と Recovery の監視\n\n`SCHEDULING_ENABLED`・dispatch・保守 Worker・ルールタイムゾーン・原 occurrence を確認する。`next_run_at` が進んで Run がない場合は「処理中照合」を確認し、カウンタ消去やスケジュール再作成で補填実行しない。"}, {"title": "Incident と recovery", "level": "h2", "anchor": "incident-と-recovery", "text": "## Incident と recovery\n\n原 Proposal/Effect・要求キー・承認・リモート回執に沿って事実を照合する。読取照合の `CONFIRMED` は原操作が観測されたことのみを示し、`NOT_OBSERVED`/`CONFLICT` は自動再送を認可しない。結果不明や部分成功は原記録を保持し、キー変更・強制 push・Worker 再起動による復旧促進を行わない。外部 Git・DB・文書・MCP の変更はローカル収束より先に完了し得るため、DB 復元では外部変更を取り消せない。"}, {"title": "MANAGED Secret の KEK 運用", "level": "h2", "anchor": "managed-secret-の-kek-運用", "text": "## MANAGED Secret の KEK 運用\n\n`SKILLMIND_MANAGED_SECRET_KEK` は `version:base64key` のカンマ区切り keyring（各 32 バイト、先頭が新規暗号化用、以降は復号用）を使う。ローテーション時は旧鍵を保全し、鍵を扱う全プロセスに「新 active + 旧鍵」を読み込ませてから以下を実行する。\n\n```bash\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec api python -m skillmind.ops.rotate_secrets\n```\n\nDB 内の暗号文が再ラップされる（終了コードと `rotated`/`skipped` を確認）。旧バックアップに必要な鍵は独立して保管する（DB バックアップから紛失した KEK は復元できない）。"}, {"title": "通常 smoke", "level": "h2", "anchor": "通常-smoke", "text": "## 通常 smoke\n\n承認された検証環境でのみ実行する（モデル呼出・Run/Evaluation 作成・取消検証を行う）。\n\n```bash\ndocker compose --env-file \"${ENV_FILE:-.env}\" exec \\\n  -e SKILLMIND_SMOKE_PROJECT_ID=\"${SMOKE_PROJECT_ID:?Specify the test project UUID}\" \\\n  api python -m skillmind.ops.smoke\n```\n\nパスワードは TTY から入力する。`SKILLMIND_SMOKE_SKILL_VERSION_ID`・`TASK_KEY`・`TASK_INPUT_JSON`・`TASK_SOURCES_JSON` で対象タスクを指定できる。"}], "toc": [{"title": "運用原則", "anchor": "運用原則", "level": "h2"}, {"title": "サービスとキュー", "anchor": "サービスとキュー", "level": "h2"}, {"title": "認証障害の読取トリアージ", "anchor": "認証障害の読取トリアージ", "level": "h2"}, {"title": "ログイン防護の調査と復旧", "anchor": "ログイン防護の調査と復旧", "level": "h2"}, {"title": "文書保存と削除の読取トリアージ", "anchor": "文書保存と削除の読取トリアージ", "level": "h2"}, {"title": "準備障害の読取トリアージ", "anchor": "準備障害の読取トリアージ", "level": "h2"}, {"title": "WAITING 状態", "anchor": "waiting-状態", "level": "h2"}, {"title": "結果と評価の読取トリアージ", "anchor": "結果と評価の読取トリアージ", "level": "h2"}, {"title": "Schedule と Recovery の監視", "anchor": "schedule-と-recovery-の監視", "level": "h2"}, {"title": "Incident と recovery", "anchor": "incident-と-recovery", "level": "h2"}, {"title": "MANAGED Secret の KEK 運用", "anchor": "managed-secret-の-kek-運用", "level": "h2"}, {"title": "通常 smoke", "anchor": "通常-smoke", "level": "h2"}], "source": "operations/runbook.md", "checksum": "848feedd1708fe2ce0dddf4bdaaab1b08277bb608d02c7896cf2d1ac122492fa"}, {"id": "docs/operations/run-performance.md", "title": "Run 性能観測と最適化", "group": "operations", "html": "\u003ch1 id=\"run-性能観測と最適化\">Run 性能観測と最適化\u003c/h1>\n\u003cp>同一タスク・入力・モデル設定・並行条件で所要時間と業務結果を比較してから最適化範囲を決める。\u003ccode>run_id\u003c/code> / \u003ccode>run_attempt_id\u003c/code> を紐付け、初回実行・承認/回答待機・継続を分けて記録する（単発の最速値を全体の効果とみなさない）。\u003c/p>\n\u003ch2 id=\"固定ログイベント\">固定ログイベント\u003c/h2>\n\u003cp>INFO JSON ログは \u003ccode>run.performance.\u003c/code> 接頭辞を使う。実装入口は\u003ca href=\"../SKM/backend/src/skillmind/core/timing.py\">タイマー\u003c/a>・\u003ca href=\"../SKM/backend/src/skillmind/worker/executor.py\">実行器\u003c/a>・\u003ca href=\"../SKM/backend/src/skillmind/agent/result_validation.py\">結果検証\u003c/a>・\u003ca href=\"../SKM/backend/src/skillmind/runs/repository.py\">クエリ\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>イベント接尾辞\u003c/th>\n\u003cth>観測範囲\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>history_query\u003c/code> / \u003ccode>detail_query\u003c/code>\u003c/td>\n\u003ctd>履歴/詳細の読取と DTO 投影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>prepare\u003c/code>\u003c/td>\n\u003ctd>Context 準備と Brief 凍結\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>catalog_prepare\u003c/code>\u003c/td>\n\u003ctd>Codex client 新規作成前の設定/catalog 準備（プロセス内キャッシュ検証または discovery を含み、SDK 起動は含まない）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sdk_start\u003c/code> / \u003ccode>sdk_thread\u003c/code> / \u003ccode>sdk_turn_start\u003c/code> / \u003ccode>sdk_reuse\u003c/code>\u003c/td>\n\u003ctd>SDK 起動・スレッド/turn 開始時間、およびプロセス再利用状態（\u003ccode>new\u003c/code> / \u003ccode>reused\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>engine_total\u003c/code> / \u003ccode>engine_wait\u003c/code>\u003c/td>\n\u003ctd>エンジン総処理時間 / エンジンイベント待機の累計時間（SDK・モデル・ツール待機を含む）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>event_persist\u003c/code> / \u003ccode>realtime_publish\u003c/code>\u003c/td>\n\u003ctd>永続イベント保存 / ストリーミング文字通知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>result_finalize\u003c/code> / \u003ccode>result_validation\u003c/code> / \u003ccode>result_schema\u003c/code> / \u003ccode>result_references\u003c/code>\u003c/td>\n\u003ctd>結果収束・完全検証・Schema 検証・参照照合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>terminal_save\u003c/code> / \u003ccode>final_output\u003c/code>\u003c/td>\n\u003ctd>終端状態の永続化時間 / 最終データ \u003ccode>output_bytes\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>receipt_delivery\u003c/code> / \u003ccode>json_selection\u003c/code>\u003c/td>\n\u003ctd>原回執または JSON ファイルの \u003ccode>source_bytes\u003c/code> とモデル投影 \u003ccode>output_bytes\u003c/code>（\u003ccode>FILE\u003c/code>/\u003ccode>INLINE\u003c/code> を区別）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>時間単位は \u003ccode>duration_ms\u003c/code> であり、\u003ccode>sample_count\u003c/code> はモデル要求数ではなく累計 \u003ccode>await\u003c/code> 区間数である。各区間には包含・並行関係があるため単純合算しない。\u003c/p>\n\u003ch2 id=\"ボトルネック別の対処\">ボトルネック別の対処\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>準備が遅い\u003c/strong>：資源読取・凍結入力サイズ・外部接続を確認し、現在の資源で原スナップショットを置き換えない。\u003c/li>\n\u003cli>\u003cstrong>実行が遅い\u003c/strong>：ツール呼出・承認/継続回数・出力サイズを比較し、モデル推論とリモートツール待機を切り分ける。\u003c/li>\n\u003cli>\u003cstrong>収束が遅い\u003c/strong>：Schema・参照照合・終端保存を比較し、\u003ccode>audit.export/v1\u003c/code>（\u003ccode>include_index: true\u003c/code> で小索引を返し完全 Artifact を参照）を活用してモデルによる全文転記を避ける。\u003c/li>\n\u003cli>\u003cstrong>画面が遅い\u003c/strong>：API 応答と描画を分けて観測する。技術詳細は展開時にマウントされるため、ページ内検索の前に該当セクションを展開する。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"連続処理の観測要点\">連続処理の観測要点\u003c/h2>\n\u003cp>権限と復旧境界は\u003ca href=\"#docs/development/runtime-guide.md::%E9%99%90%E5%AE%9A%E3%83%84%E3%83%BC%E3%83%AB%E5%88%97%E3%81%A8%E3%82%A6%E3%82%A9%E3%83%BC%E3%83%A0%E7%B6%99%E7%B6%9A\">実行・データ保守ガイド\u003c/a>、検証方法は\u003ca href=\"#docs/development/local-development.md::\">ローカル開発\u003c/a>を参照。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>読取専用短列（\u003ccode>tool.sequence/v1\u003c/code>）\u003c/strong>：サブ呼出の統合による往復ターン数の削減を観測する（各サブ呼出は個別に監査・計量される）。\u003c/li>\n\u003cli>\u003cstrong>Codex ウォーム継続\u003c/strong>：同一 Worker job 内で自動承認継続を最大 5 セグメント連続再利用し、\u003ccode>sdk_start\u003c/code> 回数の減少と \u003ccode>sdk_reuse: reused\u003c/code> を観測する。新規 client 作成時は成功した派生 bundled catalog バイト列をプロセス内に最大 32 件（各 ≤1 MiB）キャッシュする（\u003ccode>catalog_prepare\u003c/code> に計上）。\u003c/li>\n\u003cli>\u003cstrong>自動承認の直接回執\u003c/strong>：試験運用時は同一業務での \u003ccode>SESSION_STARTED\u003c/code>/\u003ccode>Segment\u003c/code> 数・モデル呼出間隔・\u003ccode>EFFECT_APPLIED\u003c/code> の \u003ccode>delivery: INLINE\u003c/code> を比較し、Proposal/Approval/Effect/Evidence が欠落なく保持されていることを確認する。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "Run 性能観測と最適化", "level": "h1", "anchor": "run-性能観測と最適化", "text": "# Run 性能観測と最適化\n\n同一タスク・入力・モデル設定・並行条件で所要時間と業務結果を比較してから最適化範囲を決める。`run_id` / `run_attempt_id` を紐付け、初回実行・承認/回答待機・継続を分けて記録する（単発の最速値を全体の効果とみなさない）。"}, {"title": "固定ログイベント", "level": "h2", "anchor": "固定ログイベント", "text": "## 固定ログイベント\n\nINFO JSON ログは `run.performance.` 接頭辞を使う。実装入口は[タイマー](../../SKM/backend/src/skillmind/core/timing.py)・[実行器](../../SKM/backend/src/skillmind/worker/executor.py)・[結果検証](../../SKM/backend/src/skillmind/agent/result_validation.py)・[クエリ](../../SKM/backend/src/skillmind/runs/repository.py)。\n\n| イベント接尾辞 | 観測範囲 |\n| --- | --- |\n| `history_query` / `detail_query` | 履歴/詳細の読取と DTO 投影 |\n| `prepare` | Context 準備と Brief 凍結 |\n| `catalog_prepare` | Codex client 新規作成前の設定/catalog 準備（プロセス内キャッシュ検証または discovery を含み、SDK 起動は含まない） |\n| `sdk_start` / `sdk_thread` / `sdk_turn_start` / `sdk_reuse` | SDK 起動・スレッド/turn 開始時間、およびプロセス再利用状態（`new` / `reused`） |\n| `engine_total` / `engine_wait` | エンジン総処理時間 / エンジンイベント待機の累計時間（SDK・モデル・ツール待機を含む） |\n| `event_persist` / `realtime_publish` | 永続イベント保存 / ストリーミング文字通知 |\n| `result_finalize` / `result_validation` / `result_schema` / `result_references` | 結果収束・完全検証・Schema 検証・参照照合 |\n| `terminal_save` / `final_output` | 終端状態の永続化時間 / 最終データ `output_bytes` |\n| `receipt_delivery` / `json_selection` | 原回執または JSON ファイルの `source_bytes` とモデル投影 `output_bytes`（`FILE`/`INLINE` を区別） |\n\n時間単位は `duration_ms` であり、`sample_count` はモデル要求数ではなく累計 `await` 区間数である。各区間には包含・並行関係があるため単純合算しない。"}, {"title": "ボトルネック別の対処", "level": "h2", "anchor": "ボトルネック別の対処", "text": "## ボトルネック別の対処\n\n- **準備が遅い**：資源読取・凍結入力サイズ・外部接続を確認し、現在の資源で原スナップショットを置き換えない。\n- **実行が遅い**：ツール呼出・承認/継続回数・出力サイズを比較し、モデル推論とリモートツール待機を切り分ける。\n- **収束が遅い**：Schema・参照照合・終端保存を比較し、`audit.export/v1`（`include_index: true` で小索引を返し完全 Artifact を参照）を活用してモデルによる全文転記を避ける。\n- **画面が遅い**：API 応答と描画を分けて観測する。技術詳細は展開時にマウントされるため、ページ内検索の前に該当セクションを展開する。"}, {"title": "連続処理の観測要点", "level": "h2", "anchor": "連続処理の観測要点", "text": "## 連続処理の観測要点\n\n権限と復旧境界は[実行・データ保守ガイド](../development/runtime-guide.md#限定ツール列とウォーム継続)、検証方法は[ローカル開発](../development/local-development.md)を参照。\n\n- **読取専用短列（`tool.sequence/v1`）**：サブ呼出の統合による往復ターン数の削減を観測する（各サブ呼出は個別に監査・計量される）。\n- **Codex ウォーム継続**：同一 Worker job 内で自動承認継続を最大 5 セグメント連続再利用し、`sdk_start` 回数の減少と `sdk_reuse: reused` を観測する。新規 client 作成時は成功した派生 bundled catalog バイト列をプロセス内に最大 32 件（各 ≤1 MiB）キャッシュする（`catalog_prepare` に計上）。\n- **自動承認の直接回執**：試験運用時は同一業務での `SESSION_STARTED`/`Segment` 数・モデル呼出間隔・`EFFECT_APPLIED` の `delivery: INLINE` を比較し、Proposal/Approval/Effect/Evidence が欠落なく保持されていることを確認する。"}], "toc": [{"title": "固定ログイベント", "anchor": "固定ログイベント", "level": "h2"}, {"title": "ボトルネック別の対処", "anchor": "ボトルネック別の対処", "level": "h2"}, {"title": "連続処理の観測要点", "anchor": "連続処理の観測要点", "level": "h2"}], "source": "operations/run-performance.md", "checksum": "b55651d8c092f0a2bbcfe858882b8fa6c8dc7c34465d4fd56b4d97c3613fa717"}, {"id": "AGENTS.md", "title": "Skillmind エージェント開発規約", "group": "code", "html": "\u003ch1 id=\"skillmind-エージェント開発規約\">Skillmind エージェント開発規約\u003c/h1>\n\u003cp>本規約は Skillmind 全体に適用する。コード・起動は \u003ca href=\"#SKM/README.md::\">README\u003c/a>、利用・保守は \u003ca href=\"#docs/README.md::\">docs\u003c/a>、詳細な形状と処理は契約・実装・テストを参照し、ここに複製しない。\u003c/p>\n\u003ch2 id=\"作業前に読むもの\">作業前に読むもの\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::%E7%8F%BE%E5%9C%A8%E3%81%AE%E5%AE%9F%E8%A1%8C%E7%8A%B6%E6%85%8B\">現在の計画\u003c/a>で実装範囲と不足を確認する。規約や test の存在を実装済みの証拠にしない。\u003c/li>\n\u003cli>\u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>から対象コードと保守境界を読む。ガイドと実装の矛盾は影響を確認して整合させる。\u003c/li>\n\u003cli>\u003ca href=\"#docs/development/coding-rules.md::\">実装細則\u003c/a>の該当章を遵守する。文書のみなら\u003ca href=\"#docs/development/documentation.md::\">文書維持\u003c/a>を読み、実装細則の一律再読は不要。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"変更してはいけない境界\">変更してはいけない境界\u003c/h2>\n\u003cul>\n\u003cli>API/Worker は共有 package のモジュラーモノリス。Business は AgentEngine 抽象に依存し、SDK 型や route/job に業務規則を漏らさない。\u003c/li>\n\u003cli>認証は共有 actor dependency、cookie の unsafe request は Origin/CSRF。明示 API key header は原 key を検証し、cookie へ fallback しない。越権と不存在は同じ 404。hash・認可・event/outbox 等は\u003ca href=\"#docs/development/coding-rules.md::backend\">単一実装\u003c/a>を使う。\u003c/li>\n\u003cli>PostgreSQL は正本、Redis は Queue・短期 Lock・通知。Run snapshot/権限上限/Result は不変。人工修正は Evaluation、人工答復/批准は新 Segment、同 Segment 復旧は新 Attempt。原 Run の自動同意による短操作は、直接交付の所有権を保存した場合のみ同 Attempt に原回執を返せる。\u003c/li>\n\u003cli>Skill は Organization 資産 + Project 明示有効化。新規 Skill は入力/資源の最小宣言と凍結原文で実行する。業務知識（純粋な対象業務規則のみ）・汎用 Skill（自然言語の工程記述＋参照 JSON Schema 契約、特定プロジェクト/内部 Tool ID/特定 MCP と非結合）・外部 MCP/Runner（自身の Schema と設定で能力を公開）・プラットフォーム（汎用資源と安全境界）の\u003ca href=\"#docs/development/runtime-guide.md::skill-%E3%81%A8%E5%87%8D%E7%B5%90%E5%8E%9F%E6%96%87\">四層分離\u003c/a>を守る（旧 Blueprint は原値互換のみ維持）。\u003c/li>\n\u003cli>guidance・script・model 提案は権限ではない。未知の業務能力と登録済み versioned Tool を区別し、実行 Script は公開 checksum に一致させる。SDK builtin は \u003ccode>DENIED_BUILTIN_TOOLS\u003c/code> で fail closed、cwd は隔離ではない。凍結 \u003ccode>input/\u003c/code> は読取専用、write は \u003ccode>workspace/\u003c/code>・\u003ccode>output/\u003c/code> のみ。\u003c/li>\n\u003cli>外部 write は observe → propose → apply。\u003ca href=\"#docs/development/runtime-guide.md::%E5%A4%96%E9%83%A8%E5%8A%B9%E6%9E%9C\">受控書込\u003c/a>の承認、Provider、scope、競合・idempotency・検証を省略しない。HTTP は登録根へ一回送信し原 response を検証根拠とする（前後 GET 不要）。原生 SQL は承認済み DML の commit 応答を記録し、業務観測は Agent が選ぶ（外部回執表不要、結果不明は再送しない）。\u003ccode>repository.write/v1\u003c/code> は Project 事前許可不可・force 禁止。Git/MCP は原 Run 開始時の同意による自動承認を許可する。定期実行は既定の自動同意を元 occurrence に固定し、現在の作成者・資源権限を再検証する。\u003c/li>\n\u003cli>生成 UI・並行子 Agent・Shell/network の拡張は\u003ca href=\"#docs/development/runtime-guide.md::%E5%BE%8C%E7%BD%AE%E8%83%BD%E5%8A%9B\">後置範囲\u003c/a>を確認し、権限・隔離・予算を実装と回帰で検証する。生成 bundle は CSP \u003ccode>sandbox allow-scripts\u003c/code>、iframe に \u003ccode>allow-same-origin\u003c/code> を付けない。子能力は \u003ccode>resolve_subagent_capabilities\u003c/code> と Run 共通予算を通す。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"言語とコード\">言語とコード\u003c/h2>\n\u003cp>会話は中国語、AGENTS/README/docs・docstring/JSDoc/コメントは日本語。識別子と公開契約は既存表記を維持する。\n関数・型・Component・fixture・migration には責務、複雑な分岐・安全/transaction/復旧には理由を記し、古いコメントも同期する。単純処理の逐語説明は不要。\nPython の \u003ccode>future annotations\u003c/code>、TypeScript \u003ccode>strict\u003c/code> を維持し、\u003ccode>any\u003c/code> で契約を回避しない。広い例外捕捉は理由のある境界層に限定する。Effect は cleanup し、遅延応答は unmount/対象切替後に反映しない。三語は共有 catalog を使う。\u003c/p>\n\u003ch2 id=\"検証と変更規律\">検証と変更規律\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/development/coding-rules.md::%E5%90%8C%E6%9C%9F%E7%82%B9\">同期点\u003c/a>と\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">変更別検証\u003c/a>を適用する。動作変更には対応回帰を追加し、未実行・skip・失敗と残る risk を報告する。\u003c/li>\n\u003cli>課題は四層の責務で切り分け、該当層のみを最小修正する。規則・Skill の更新は現在の正引き仕様で直接置き換え、廃止方式への防御的禁止文や単発障害の個別パッチを積み重ねない。文書は進捗ログを増やさず、生成 HTML は直接編集せず、\u003ccode>SKILL.md\u003c/code>/references は整理対象外。\u003c/li>\n\u003cli>既存変更・成果物を保全する。lockfile を手編集せず、Credential・内部 URL・Ticket 本文・Gold・Secret を fixture/log に置かない。\u003c/li>\n\u003cli>Git 書込・履歴変更・破壊的操作は明示依頼が必要。実 DB・モデル・外部 write の検証は対象と副作用を事前確認する。\u003c/li>\n\u003cli>完了時はガイド/契約との整合と検証結果を報告し、mock と実環境の証拠を区別する。計画は機能状態が変わった時だけ更新する。\u003c/li>\n\u003c/ul>\n", "sections": [{"title": "Skillmind エージェント開発規約", "level": "h1", "anchor": "skillmind-エージェント開発規約", "text": "# Skillmind エージェント開発規約\n\n本規約は Skillmind 全体に適用する。コード・起動は [README](SKM/README.md)、利用・保守は [docs](docs/README.md)、詳細な形状と処理は契約・実装・テストを参照し、ここに複製しない。"}, {"title": "作業前に読むもの", "level": "h2", "anchor": "作業前に読むもの", "text": "## 作業前に読むもの\n\n1. [現在の計画](docs/planning/roadmap.md#現在の実行状態)で実装範囲と不足を確認する。規約や test の存在を実装済みの証拠にしない。\n2. [変更ガイド](docs/development/change-guide.md)から対象コードと保守境界を読む。ガイドと実装の矛盾は影響を確認して整合させる。\n3. [実装細則](docs/development/coding-rules.md)の該当章を遵守する。文書のみなら[文書維持](docs/development/documentation.md)を読み、実装細則の一律再読は不要。"}, {"title": "変更してはいけない境界", "level": "h2", "anchor": "変更してはいけない境界", "text": "## 変更してはいけない境界\n\n- API/Worker は共有 package のモジュラーモノリス。Business は AgentEngine 抽象に依存し、SDK 型や route/job に業務規則を漏らさない。\n- 認証は共有 actor dependency、cookie の unsafe request は Origin/CSRF。明示 API key header は原 key を検証し、cookie へ fallback しない。越権と不存在は同じ 404。hash・認可・event/outbox 等は[単一実装](docs/development/coding-rules.md#backend)を使う。\n- PostgreSQL は正本、Redis は Queue・短期 Lock・通知。Run snapshot/権限上限/Result は不変。人工修正は Evaluation、人工答復/批准は新 Segment、同 Segment 復旧は新 Attempt。原 Run の自動同意による短操作は、直接交付の所有権を保存した場合のみ同 Attempt に原回執を返せる。\n- Skill は Organization 資産 + Project 明示有効化。新規 Skill は入力/資源の最小宣言と凍結原文で実行する。業務知識（純粋な対象業務規則のみ）・汎用 Skill（自然言語の工程記述＋参照 JSON Schema 契約、特定プロジェクト/内部 Tool ID/特定 MCP と非結合）・外部 MCP/Runner（自身の Schema と設定で能力を公開）・プラットフォーム（汎用資源と安全境界）の[四層分離](docs/development/runtime-guide.md#skill-と凍結原文)を守る（旧 Blueprint は原値互換のみ維持）。\n- guidance・script・model 提案は権限ではない。未知の業務能力と登録済み versioned Tool を区別し、実行 Script は公開 checksum に一致させる。SDK builtin は `DENIED_BUILTIN_TOOLS` で fail closed、cwd は隔離ではない。凍結 `input/` は読取専用、write は `workspace/`・`output/` のみ。\n- 外部 write は observe → propose → apply。[受控書込](docs/development/runtime-guide.md#外部効果)の承認、Provider、scope、競合・idempotency・検証を省略しない。HTTP は登録根へ一回送信し原 response を検証根拠とする（前後 GET 不要）。原生 SQL は承認済み DML の commit 応答を記録し、業務観測は Agent が選ぶ（外部回執表不要、結果不明は再送しない）。`repository.write/v1` は Project 事前許可不可・force 禁止。Git/MCP は原 Run 開始時の同意による自動承認を許可する。定期実行は既定の自動同意を元 occurrence に固定し、現在の作成者・資源権限を再検証する。\n- 生成 UI・並行子 Agent・Shell/network の拡張は[後置範囲](docs/development/runtime-guide.md#後置能力)を確認し、権限・隔離・予算を実装と回帰で検証する。生成 bundle は CSP `sandbox allow-scripts`、iframe に `allow-same-origin` を付けない。子能力は `resolve_subagent_capabilities` と Run 共通予算を通す。"}, {"title": "言語とコード", "level": "h2", "anchor": "言語とコード", "text": "## 言語とコード\n\n会話は中国語、AGENTS/README/docs・docstring/JSDoc/コメントは日本語。識別子と公開契約は既存表記を維持する。\n関数・型・Component・fixture・migration には責務、複雑な分岐・安全/transaction/復旧には理由を記し、古いコメントも同期する。単純処理の逐語説明は不要。\nPython の `future annotations`、TypeScript `strict` を維持し、`any` で契約を回避しない。広い例外捕捉は理由のある境界層に限定する。Effect は cleanup し、遅延応答は unmount/対象切替後に反映しない。三語は共有 catalog を使う。"}, {"title": "検証と変更規律", "level": "h2", "anchor": "検証と変更規律", "text": "## 検証と変更規律\n\n- [同期点](docs/development/coding-rules.md#同期点)と[変更別検証](docs/development/local-development.md#変更に応じた検証)を適用する。動作変更には対応回帰を追加し、未実行・skip・失敗と残る risk を報告する。\n- 課題は四層の責務で切り分け、該当層のみを最小修正する。規則・Skill の更新は現在の正引き仕様で直接置き換え、廃止方式への防御的禁止文や単発障害の個別パッチを積み重ねない。文書は進捗ログを増やさず、生成 HTML は直接編集せず、`SKILL.md`/references は整理対象外。\n- 既存変更・成果物を保全する。lockfile を手編集せず、Credential・内部 URL・Ticket 本文・Gold・Secret を fixture/log に置かない。\n- Git 書込・履歴変更・破壊的操作は明示依頼が必要。実 DB・モデル・外部 write の検証は対象と副作用を事前確認する。\n- 完了時はガイド/契約との整合と検証結果を報告し、mock と実環境の証拠を区別する。計画は機能状態が変わった時だけ更新する。"}], "toc": [{"title": "作業前に読むもの", "anchor": "作業前に読むもの", "level": "h2"}, {"title": "変更してはいけない境界", "anchor": "変更してはいけない境界", "level": "h2"}, {"title": "言語とコード", "anchor": "言語とコード", "level": "h2"}, {"title": "検証と変更規律", "anchor": "検証と変更規律", "level": "h2"}], "source": "../AGENTS.md", "checksum": "24623db90693ad92b72cfee40b64c719e7b16d1921e43de1be9019e43fcc0d6f"}, {"id": "README.md", "title": "Skillmind ワークスペース", "group": "code", "html": "\u003ch1 id=\"skillmind-ワークスペース\">Skillmind ワークスペース\u003c/h1>\n\u003cp>Skill 原文をプロジェクトのタスクとして実行し、結果・根拠・外部変更を記録する AI Agent プラットフォーム。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"index.html\">文書ブラウザ\u003c/a>：オフライン閲覧・検索。\u003c/li>\n\u003cli>\u003ca href=\"#docs/README.md::\">利用・保守ガイド\u003c/a>：使用、開発、配備と障害対応。\u003c/li>\n\u003cli>\u003ca href=\"#SKM/README.md::\">開発案内\u003c/a>：コード入口、環境構築と検証。\u003c/li>\n\u003cli>\u003ca href=\"#docs/planning/roadmap.md::\">現在の進捗\u003c/a>：実装・検証状況と実利用に基づく改善方針。\u003c/li>\n\u003c/ul>\n\u003cp>正式コードは \u003ccode>SKM/\u003c/code>、ガイドは \u003ccode>docs/\u003c/code> に置く。詳細な契約・処理はコードとテストを参照する。\u003c/p>\n\u003ch2 id=\"ライセンス\">ライセンス\u003c/h2>\n\u003cp>本プロジェクトは \u003ca href=\"../LICENSE\">Apache License 2.0\u003c/a> の下で提供されます。\n第三者のコード・フォントなど、個別のライセンスが記載されたものには、そのライセンスが適用されます。\u003c/p>\n", "sections": [{"title": "Skillmind ワークスペース", "level": "h1", "anchor": "skillmind-ワークスペース", "text": "# Skillmind ワークスペース\n\nSkill 原文をプロジェクトのタスクとして実行し、結果・根拠・外部変更を記録する AI Agent プラットフォーム。\n\n- [文書ブラウザ](docs/index.html)：オフライン閲覧・検索。\n- [利用・保守ガイド](docs/README.md)：使用、開発、配備と障害対応。\n- [開発案内](SKM/README.md)：コード入口、環境構築と検証。\n- [現在の進捗](docs/planning/roadmap.md)：実装・検証状況と実利用に基づく改善方針。\n\n正式コードは `SKM/`、ガイドは `docs/` に置く。詳細な契約・処理はコードとテストを参照する。"}, {"title": "ライセンス", "level": "h2", "anchor": "ライセンス", "text": "## ライセンス\n\n本プロジェクトは [Apache License 2.0](LICENSE) の下で提供されます。\n第三者のコード・フォントなど、個別のライセンスが記載されたものには、そのライセンスが適用されます。"}], "toc": [{"title": "ライセンス", "anchor": "ライセンス", "level": "h2"}], "source": "../README.md", "checksum": "860cedf05f7665d24de3a81a014562aafbd65f406719aa6629d2351df75b0d70"}, {"id": "SKM/README.md", "title": "Skillmind", "group": "code", "html": "\u003ch1 id=\"skillmind\">Skillmind\u003c/h1>\n\u003cp>Skill 原文をタスクとして実行し、入力・資源・結果・根拠・人工評価と外部変更を管理する AI Agent プラットフォーム。\u003c/p>\n\u003cp>\u003ca href=\"#docs/README.md::\">文書ガイド\u003c/a> · \u003ca href=\"#docs/planning/roadmap.md::%E7%8F%BE%E5%9C%A8%E3%81%AE%E5%AE%9F%E8%A1%8C%E7%8A%B6%E6%85%8B\">現在の進捗\u003c/a> · \u003ca href=\"#AGENTS.md::\">開発規約\u003c/a>\u003c/p>\n\u003ch2 id=\"はじめに\">はじめに\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目的\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>開発と検証\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/local-development.md::\">ローカル開発\u003c/a> / \u003ca href=\"#docs/development/change-guide.md::\">変更ガイド\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>起動と更新\u003c/td>\n\u003ctd>\u003ca href=\"#docs/operations/quickstart.md::\">Quickstart\u003c/a> / \u003ca href=\"#docs/operations/deployment.md::\">配備手順\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API と運用\u003c/td>\n\u003ctd>\u003ca href=\"#docs/development/api-usage.md::\">API 利用\u003c/a> / \u003ca href=\"#docs/operations/runbook.md::\">Runbook\u003c/a> / \u003ca href=\"#docs/operations/backup-recovery.md::\">復元\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>開発は Python 3.12、Node.js 26 / pnpm 11.7.0。配備先は \u003ccode>images.tar\u003c/code>・\u003ccode>compose.yml\u003c/code>・\u003ccode>.env\u003c/code>・\u003ccode>Makefile\u003c/code> を使い、Docker Compose + make で起動する（宿主の Python/Node は不要）。\u003c/p>\n\u003ch2 id=\"backend\">Backend\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/backend/src/skillmind\">backend/src/skillmind\u003c/a> は API と Worker の共有 package。route は認証と入出力、service は業務処理、repository は永続化、AgentEngine/Provider は実行境界を担当する。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>auth/\u003c/code>、\u003ccode>projects/\u003c/code>、\u003ccode>documents/\u003c/code>、\u003ccode>skills/\u003c/code>：アカウント、資源・文書管理、Skill 取込と公開。\u003c/li>\n\u003cli>\u003ccode>runs/\u003c/code>、\u003ccode>agent/\u003c/code>、\u003ccode>worker/\u003c/code>、\u003ccode>schedules/\u003c/code>：実行、続行、監督、定期実行。\u003c/li>\n\u003cli>\u003ccode>effects/\u003c/code>、\u003ccode>evaluations/\u003c/code>、\u003ccode>integrations/\u003c/code>、\u003ccode>storage/\u003c/code>：受控変更、評価、接続と保存。\u003c/li>\n\u003cli>\u003ca href=\"../SKM/backend/src/skillmind/db\">db\u003c/a> と \u003ca href=\"../SKM/backend/migrations\">migrations\u003c/a>：永続形式と移行。\u003c/li>\n\u003c/ul>\n\u003cp>変更時は\u003ca href=\"#docs/development/runtime-guide.md::\">実行境界\u003c/a>を確認し、\u003ca href=\"#docs/development/local-development.md::backend\">Backend 手順\u003c/a>と\u003ca href=\"#docs/development/local-development.md::%E5%AE%9F-postgresql-%E3%81%AE%E5%89%8D%E6%8F%90\">実 DB の前提\u003c/a>で検証する。\u003c/p>\n\u003ch2 id=\"web\">Web\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/web/src\">web/src\u003c/a> は React + TypeScript。pages/components は画面、api は共有 HTTP client、lib/hooks は純粋処理と非同期制御。タスク一覧で起動・定期実行を管理し、Workspace で待機・進行・最新レポートを確認し、詳細は実行履歴へ遷移する。\u003ca href=\"#docs/design/workspace.md::%E8%A6%96%E8%A6%9A%E8%A6%8F%E7%B4%84\">UI ガイド\u003c/a>と\u003ca href=\"#docs/development/local-development.md::%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E5%9B%9E%E5%B8%B0\">ブラウザ回帰\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"contracts\">Contracts\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/contracts\">contracts\u003c/a> に versioned JSON Schema、example、Tool capability、\u003ca href=\"../SKM/contracts/openapi/skillmind-api.v1.json\">OpenAPI\u003c/a>、\u003ca href=\"../SKM/contracts/users/v1\">アカウント契約\u003c/a>を置く。\u003ca href=\"#docs/development/contract-workflow.md::\">契約変更手順\u003c/a>に従い同期する（OpenAPI は生成物であり手編集しない）。\u003c/p>\n\u003ch2 id=\"scripts\">Scripts\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/scripts\">scripts\u003c/a> は契約・Compose 検査、文書/OpenAPI 生成、image export と隔離 probe の入口。\u003ca href=\"#docs/development/local-development.md::%E5%A4%89%E6%9B%B4%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%9F%E6%A4%9C%E8%A8%BC\">検証の選び方\u003c/a>と\u003ca href=\"#docs/development/documentation.md::\">文書管理\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"skills\">Skills\u003c/h2>\n\u003cp>\u003ca href=\"../SKM/skills\">skills\u003c/a> は system Interpreter と開発 workflow。業務 Skill は\u003ca href=\"#docs/development/runtime-guide.md::skill-%E3%81%A8%E5%87%8D%E7%B5%90%E5%8E%9F%E6%96%87\">原文の凍結と公開\u003c/a>に従う。Skill package 内の \u003ccode>SKILL.md\u003c/code>・Schema・script は実行入力であり、文書整理の対象外。\u003c/p>\n\u003ch2 id=\"images\">Images\u003c/h2>\n\u003cp>\u003ccode>images/images.tar\u003c/code> は image 移送用であり、データや暗号鍵の backup ではない。更新は\u003ca href=\"#docs/operations/quickstart.md::image-%E7%A7%BB%E9%80%81%E3%81%A8%E6%9B%B4%E6%96%B0\">image 移送と更新\u003c/a>、復元は\u003ca href=\"#docs/operations/backup-recovery.md::%E4%B8%80%E8%87%B4%E5%BE%A9%E5%85%83%E7%82%B9%E3%81%AE%E5%86%85%E5%AE%B9\">一致復元点\u003c/a>を参照する。\u003c/p>\n", "sections": [{"title": "Skillmind", "level": "h1", "anchor": "skillmind", "text": "# Skillmind\n\nSkill 原文をタスクとして実行し、入力・資源・結果・根拠・人工評価と外部変更を管理する AI Agent プラットフォーム。\n\n[文書ガイド](../docs/README.md) · [現在の進捗](../docs/planning/roadmap.md#現在の実行状態) · [開発規約](../AGENTS.md)"}, {"title": "はじめに", "level": "h2", "anchor": "はじめに", "text": "## はじめに\n\n| 目的 | 入口 |\n| --- | --- |\n| 開発と検証 | [ローカル開発](../docs/development/local-development.md) / [変更ガイド](../docs/development/change-guide.md) |\n| 起動と更新 | [Quickstart](../docs/operations/quickstart.md) / [配備手順](../docs/operations/deployment.md) |\n| API と運用 | [API 利用](../docs/development/api-usage.md) / [Runbook](../docs/operations/runbook.md) / [復元](../docs/operations/backup-recovery.md) |\n\n開発は Python 3.12、Node.js 26 / pnpm 11.7.0。配備先は `images.tar`・`compose.yml`・`.env`・`Makefile` を使い、Docker Compose + make で起動する（宿主の Python/Node は不要）。"}, {"title": "Backend", "level": "h2", "anchor": "backend", "text": "## Backend\n\n[backend/src/skillmind](backend/src/skillmind/) は API と Worker の共有 package。route は認証と入出力、service は業務処理、repository は永続化、AgentEngine/Provider は実行境界を担当する。\n\n- `auth/`、`projects/`、`documents/`、`skills/`：アカウント、資源・文書管理、Skill 取込と公開。\n- `runs/`、`agent/`、`worker/`、`schedules/`：実行、続行、監督、定期実行。\n- `effects/`、`evaluations/`、`integrations/`、`storage/`：受控変更、評価、接続と保存。\n- [db](backend/src/skillmind/db/) と [migrations](backend/migrations/)：永続形式と移行。\n\n変更時は[実行境界](../docs/development/runtime-guide.md)を確認し、[Backend 手順](../docs/development/local-development.md#backend)と[実 DB の前提](../docs/development/local-development.md#実-postgresql-の前提)で検証する。"}, {"title": "Web", "level": "h2", "anchor": "web", "text": "## Web\n\n[web/src](web/src/) は React + TypeScript。pages/components は画面、api は共有 HTTP client、lib/hooks は純粋処理と非同期制御。タスク一覧で起動・定期実行を管理し、Workspace で待機・進行・最新レポートを確認し、詳細は実行履歴へ遷移する。[UI ガイド](../docs/design/workspace.md#視覚規約)と[ブラウザ回帰](../docs/development/local-development.md#ブラウザ回帰)を参照する。"}, {"title": "Contracts", "level": "h2", "anchor": "contracts", "text": "## Contracts\n\n[contracts](contracts/) に versioned JSON Schema、example、Tool capability、[OpenAPI](contracts/openapi/skillmind-api.v1.json)、[アカウント契約](contracts/users/v1/)を置く。[契約変更手順](../docs/development/contract-workflow.md)に従い同期する（OpenAPI は生成物であり手編集しない）。"}, {"title": "Scripts", "level": "h2", "anchor": "scripts", "text": "## Scripts\n\n[scripts](scripts/) は契約・Compose 検査、文書/OpenAPI 生成、image export と隔離 probe の入口。[検証の選び方](../docs/development/local-development.md#変更に応じた検証)と[文書管理](../docs/development/documentation.md)を参照する。"}, {"title": "Skills", "level": "h2", "anchor": "skills", "text": "## Skills\n\n[skills](skills/) は system Interpreter と開発 workflow。業務 Skill は[原文の凍結と公開](../docs/development/runtime-guide.md#skill-と凍結原文)に従う。Skill package 内の `SKILL.md`・Schema・script は実行入力であり、文書整理の対象外。"}, {"title": "Images", "level": "h2", "anchor": "images", "text": "## Images\n\n`images/images.tar` は image 移送用であり、データや暗号鍵の backup ではない。更新は[image 移送と更新](../docs/operations/quickstart.md#image-移送と更新)、復元は[一致復元点](../docs/operations/backup-recovery.md#一致復元点の内容)を参照する。"}], "toc": [{"title": "はじめに", "anchor": "はじめに", "level": "h2"}, {"title": "Backend", "anchor": "backend", "level": "h2"}, {"title": "Web", "anchor": "web", "level": "h2"}, {"title": "Contracts", "anchor": "contracts", "level": "h2"}, {"title": "Scripts", "anchor": "scripts", "level": "h2"}, {"title": "Skills", "anchor": "skills", "level": "h2"}, {"title": "Images", "anchor": "images", "level": "h2"}], "source": "../SKM/README.md", "checksum": "e4b8a78762be5b63862b1394c1a46fedcb03f9fdafccb987d640b7c04fcaf297"}], "aliases": {"SKM/backend/README.md": {"page": "SKM/README.md", "anchor": "backend"}, "SKM/web/README.md": {"page": "SKM/README.md", "anchor": "web"}, "SKM/contracts/README.md": {"page": "SKM/README.md", "anchor": "contracts"}, "SKM/scripts/README.md": {"page": "SKM/README.md", "anchor": "scripts"}, "SKM/skills/README.md": {"page": "SKM/README.md", "anchor": "skills"}, "SKM/images/README.md": {"page": "SKM/README.md", "anchor": "images"}}}</script>
  <script>
    'use strict';
    const data = JSON.parse(document.getElementById('docs-data').textContent);
    const pages = new Map(data.pages.map(page => [page.id, page]));
    const main = document.getElementById('main');
    const search = document.getElementById('search');
    const menuButton = document.getElementById('menu-button');
    const topbar = document.querySelector('.topbar');
    let currentId = '';

    /** 文書と章を browser history に保存する。 */
    function pageHref(page, anchor = '') {
      return '#' + encodeURI(page.id) + '::' + encodeURIComponent(anchor);
    }

    /** 信頼していない検索語を HTML として挿入しない。 */
    function linkFor(page, title = page.title, anchor = '') {
      const link = document.createElement('a');
      link.href = pageHref(page, anchor);
      link.textContent = title;
      if (page.id === currentId && !anchor) link.setAttribute('aria-current', 'page');
      return link;
    }

    /** 検索語を escape 済み HTML に再解釈せず、text node と mark だけで強調する。 */
    function searchExcerpt(section, query) {
      const excerpt = document.createElement('small');
      const position = section.text.toLocaleLowerCase().indexOf(query);
      const start = Math.max(0, position - 32);
      const end = Math.min(section.text.length, Math.max(0, position) + query.length + 80);
      const snippet = section.text.slice(start, end).replace(/\s+/g, ' ');
      const match = snippet.toLocaleLowerCase().indexOf(query);
      if (start) excerpt.append('…');
      if (match < 0) {
        excerpt.append(snippet);
      } else {
        const mark = document.createElement('mark');
        mark.textContent = snippet.slice(match, match + query.length);
        excerpt.append(snippet.slice(0, match), mark, snippet.slice(match + query.length));
      }
      if (end < section.text.length) excerpt.append('…');
      return excerpt;
    }

    /** 通常時は分類ナビ、検索時は本文を含む候補を表示する。 */
    function renderNavigation() {
      const navigation = document.getElementById('navigation');
      navigation.replaceChildren();
      const query = search.value.trim().toLocaleLowerCase();
      if (query) {
        const found = data.pages.flatMap(page => {
          const sections = page.sections.filter(section => section.text.toLocaleLowerCase().includes(query));
          const id = page.id.toLocaleLowerCase();
          const title = page.title.toLocaleLowerCase();
          // file 名を探すとき、他文書の相互参照より対象文書を先に案内する。
          const rank = id === query || id.split('/').at(-1) === query ? 0
            : title.includes(query) ? 1 : id.includes(query) ? 2 : 3;
          return rank < 3 || sections.length ? [{page, sections, rank}] : [];
        }).sort((left, right) => left.rank - right.rank);
        document.getElementById('search-status').textContent = found.length + ' 件の一致文書';
        for (const {page, sections} of found) {
          const row = document.createElement('div');
          row.className = 'search-hit';
          row.append(linkFor(page, page.title, sections[0]?.anchor || ''));
          const location = document.createElement('small');
          location.textContent = data.groups[page.group] + ' · ' + page.id;
          row.append(location);
          for (const section of sections.slice(0, 3)) {
            const result = document.createElement('div');
            result.className = 'search-section';
            result.append(linkFor(page, section.title, section.anchor), searchExcerpt(section, query));
            row.append(result);
          }
          if (sections.length > 3) {
            const more = document.createElement('small');
            more.textContent = 'このページには他に ' + (sections.length - 3) + ' 件の一致章があります。ブラウザのページ内検索も利用できます。';
            row.append(more);
          }
          navigation.append(row);
        }
        return;
      }
      document.getElementById('search-status').textContent = '';
      for (const [group, title] of Object.entries(data.groups)) {
        const children = data.pages.filter(page => page.group === group);
        if (!children.length) continue;
        const section = document.createElement('details');
        section.open = true;
        const heading = document.createElement('summary');
        heading.textContent = title;
        section.append(heading);
        for (const page of children) section.append(linkFor(page));
        navigation.append(section);
      }
    }

    /** 表が本当に溢れた場合だけ keyboard 操作とスクロール案内を表示する。 */
    function updateScrollableTables() {
      for (const [index, region] of [...main.querySelectorAll('.table-scroll')].entries()) {
        const table = region.querySelector('table');
        const overflow = table.getBoundingClientRect().width > region.clientWidth + 1;
        const hint = region.previousElementSibling;
        hint.hidden = !overflow;
        region.tabIndex = overflow ? 0 : -1;
        if (overflow) {
          region.setAttribute('role', 'region');
          region.setAttribute('aria-label', '表 ' + (index + 1) + '（横スクロール可）');
          region.setAttribute('aria-describedby', hint.id);
        } else {
          region.removeAttribute('role');
          region.removeAttribute('aria-label');
          region.removeAttribute('aria-describedby');
        }
      }
    }

    /** 改行や文字拡大後も固定 header が章の見出しと menu を覆わないようにする。 */
    function updateScrollOffset() {
      const sticky = getComputedStyle(topbar).position === 'sticky';
      const height = sticky ? Math.ceil(topbar.getBoundingClientRect().height) : 0;
      document.documentElement.style.setProperty('--docs-header-height', height + 'px');
      document.documentElement.style.setProperty('--docs-scroll-offset', (sticky ? height + 16 : 32) + 'px');
    }

    /** 直接リンク・戻る・進むを同じ経路で扱う。 */
    function showPage() {
      if (location.hash === '#main') { main.focus(); return; }
      let id, anchor;
      try { [id, anchor = ''] = location.hash.slice(1).split('::').map(decodeURIComponent); }
      catch { id = ''; anchor = ''; }
      id ||= 'docs/README.md';
      // 統合前の module README の bookmark は、本文を残さず対応する中心章へ案内する。
      if (Object.hasOwn(data.aliases, id)) {
        ({page: id, anchor} = data.aliases[id]);
        history.replaceState(null, '', pageHref(pages.get(id), anchor));
      }
      const page = pages.get(id);
      currentId = id;
      const toc = document.getElementById('toc-links');
      toc.replaceChildren();
      if (!page) {
        main.replaceChildren();
        const title = document.createElement('h1');
        title.textContent = '文書が見つかりません';
        main.append(title, linkFor(pages.get('docs/README.md'), '文書ガイドへ戻る'));
        document.getElementById('category').textContent = 'SKILLMIND / 未検出';
        document.getElementById('source-link').hidden = true;
        document.title = '文書が見つかりません · Skillmind';
        document.body.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        renderNavigation();
        main.focus();
        return;
      }
      document.title = page.title + ' · Skillmind';
      document.getElementById('category').textContent = 'SKILLMIND / ' + data.groups[page.group];
      const source = document.getElementById('source-link');
      source.hidden = false;
      source.href = page.source;
      // 本文は build 時に raw HTML 無効の parser で生成済み。検索語や URL は混ぜない。
      main.innerHTML = page.html;
      const inlineToc = document.createElement('details');
      inlineToc.className = 'inline-toc';
      const inlineSummary = document.createElement('summary');
      inlineSummary.textContent = 'このページの内容';
      const inlineLinks = document.createElement('nav');
      inlineLinks.setAttribute('aria-label', 'ページ内の章');
      inlineToc.append(inlineSummary, inlineLinks);
      for (const heading of page.toc) {
        const link = linkFor(page, heading.title, heading.anchor);
        if (heading.level === 'h3') link.className = 'sub';
        inlineLinks.append(link.cloneNode(true));
        toc.append(link);
      }
      if (page.toc.length) main.querySelector('h1').after(inlineToc);
      for (const [index, region] of [...main.querySelectorAll('.table-scroll')].entries()) {
        const hint = document.createElement('p');
        hint.className = 'scroll-hint';
        hint.id = 'docs-table-hint-' + index;
        hint.hidden = true;
        hint.textContent = '表は横スクロールできます（フォーカス後に矢印キーでも移動可）。';
        region.before(hint);
      }
      const footer = document.createElement('footer');
      footer.className = 'page-footer';
      footer.textContent = page.id + ' · Markdown から生成（原文変更後は再ビルドしてください）。';
      main.append(footer);
      document.body.classList.remove('menu-open');
      menuButton.setAttribute('aria-expanded', 'false');
      renderNavigation();
      requestAnimationFrame(() => {
        updateScrollOffset();
        updateScrollableTables();
        const target = anchor ? main.querySelector('#' + CSS.escape(anchor)) : null;
        if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
        const focusTarget = target || main;
        focusTarget.setAttribute('tabindex', '-1');
        focusTarget.focus({preventScroll:true});
      });
    }

    search.addEventListener('input', renderNavigation);
    window.addEventListener('hashchange', showPage);
    document.addEventListener('click', event => {
      // 同じ章への再クリックでは hashchange が発生しない。検索や目次から再び焦点を戻す。
      const link = event.target instanceof Element ? event.target.closest('a') : null;
      if (link?.getAttribute('href') === location.hash && location.hash.includes('::') &&
          event.button === 0 && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey) {
        event.preventDefault();
        showPage();
      }
    });
    window.addEventListener('resize', () => requestAnimationFrame(() => {
      updateScrollOffset();
      updateScrollableTables();
    }));
    new ResizeObserver(updateScrollOffset).observe(topbar);
    document.getElementById('print-button').addEventListener('click', () => window.print());
    menuButton.addEventListener('click', () => {
      const open = document.body.classList.toggle('menu-open');
      menuButton.setAttribute('aria-expanded', String(open));
      if (open) search.focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && document.body.classList.contains('menu-open')) {
        document.body.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.focus();
      }
    });
    showPage();
  </script>
</body>
</html>
