[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmind"
version = "0.1.0"
description = "Skillmind M0 API and Worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "arq==0.28.0",
  "asyncpg==0.31.0",
  "claude-agent-sdk==0.2.110",
  "cryptography==49.0.0",
  "fastapi==0.138.2",
  "jsonschema==4.26.0",
  "minio==7.2.20",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pyyaml==6.0.3",
  "redis==5.2.1",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.5.0",
  "mypy==2.1.0",
  "pyyaml==6.0.3",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.20",
]

[project.scripts]
skillmind-api = "skillmind.api.__main__:main"
skillmind-skill-parse = "skillmind.skills.cli:main"
skillmind-skill-interpret-fixture = "skillmind.skills.interpreter_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["skillmind"]
