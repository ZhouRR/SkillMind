<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sidebar の brandMark と同じ aurora gradient(紫→青緑)+白文字で tab を識別させる。 -->
  <defs>
    <linearGradient id="sm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="8%" stop-color="#7c6cf5"/>
      <stop offset="100%" stop-color="#55d6f0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#sm)"/>
  <text x="16" y="21.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="800" letter-spacing=".5" fill="#ffffff">SM</text>
</svg>
